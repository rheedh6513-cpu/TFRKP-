 # 이인제 정부: 정치 명예혁명 세 편. threekims_build.py가 만든다.
 tfrkphn.521.t:0 "문민의 길, 김영삼"
 tfrkphn.521.d:0 "정치 명예혁명을 말하기에 앞서 대통령은 세 사람의 이름을 꺼냈는데, 그 첫 번째가 김영삼입니다.\n\n김영삼은 1927년 12월 20일 거제에서 태어나 1954년에 만 25세로 국회의원이 되었고, 이것은 최연소 당선이었습니다. 1979년에는 국회에서 제명되었으며 1983년에는 민주화를 요구하며 23일 동안 밥을 굶었습니다. 1990년에 3당 합당으로 여당에 들어간 그는 1993년에 대통령이 되어 군 안의 사조직 하나회를 걷어 냈고, 2015년 11월 22일에 세상을 떠났습니다.\n\n이인제는 1987년에 김영삼의 통일민주당에서 정치를 시작해 1993년에는 그의 정부에서 노동부 장관을 맡았습니다. 그러나 1997년에는 그의 당을 떠나 따로 대선에 나갔습니다.\n\n대통령이 김영삼에게서 물려받기로 한 것은 군이 정치에 손대지 못하게 한 일 하나입니다. 전쟁을 치르는 동안 군의 예산과 목소리가 함께 커졌기 때문에, 대통령은 장성 인사와 국방 예산을 국회의 심사 아래 두겠다고 밝혔습니다. 전쟁에서 이긴 군대일수록 문민의 손이 닿아야 한다는 이유에서였습니다."
 tfrkphn.521.a:0 "군은 국민의 통제 아래 둔다"
 tfrkphn.522.t:0 "인동초, 김대중"
 tfrkphn.522.d:0 "두 번째 이름은 김대중입니다.\n\n김대중은 목포 앞바다 하의도에서 소작농의 아들로 태어났습니다. 1971년 대선에서 박정희에게 95만 표 차이로 졌고, 1973년에는 도쿄에서 중앙정보부 요원들에게 납치되었으며, 1980년에는 내란음모 혐의로 사형을 선고받았습니다. 대선에 네 번 나간 끝에 1997년에 당선되면서 정권이 야당으로 넘어갔습니다. 그의 정부는 외환위기를 빠르게 넘겼고 2000년 6월에는 남북 정상회담을 열었습니다. 그는 2009년 8월 18일에 세상을 떠났습니다.\n\n이인제는 1997년 대선에서 김대중과 맞섰지만, 이듬해에는 그의 당인 새정치국민회의에 들어갔습니다.\n\n대통령이 김대중에게서 물려받기로 한 것은 마주 앉는 일입니다. 김대중은 총을 겨눈 상대와 한 방에 앉았던 사람이기 때문입니다. 대통령은 북쪽 정권에는 물러서지 않겠다고 하면서도, 통일은 결국 그 사람들과 함께 사는 일이니 북쪽 주민에게 건넬 말은 따로 준비하겠다고 밝혔습니다."
 tfrkphn.522.a:0 "정권과 주민을 나누어 본다"
 tfrkphn.523.t:0 "영원한 2인자, 김종필"
 tfrkphn.523.d:0 "세 번째 이름은 김종필입니다.\n\n김종필은 1926년 1월 7일 충남 부여에서 태어났습니다. 1961년 5.16에 앞장섰고 그해 6월에는 중앙정보부를 만들어 첫 부장이 되었습니다. 국무총리를 두 번 지냈는데, 1971년부터 1975년까지는 박정희 아래에서였고 1998년부터는 김대중 아래에서였습니다. 1990년에는 3당 합당에 들어갔고 1995년에는 자유민주연합을 만들었으며, 1997년 11월 3일에는 김대중과 후보 단일화에 합의했습니다. 2004년 총선에서 당이 무너지자 정계를 떠난 그는 2018년 6월 23일에 92세로 세상을 떠났습니다.\n\n이인제는 2002년에 김종필의 자유민주연합에 들어갔고, 그의 고향 논산은 부여 바로 옆입니다. 이로써 그는 세 사람의 당을 모두 거친 정치인이 되었습니다.\n\n대통령이 김종필에게서 물려받기로 한 것은 2인자에게 일을 맡기는 정치이고, 장관들과 임기를 함께하겠다는 약속도 그 연장에 있습니다. 버리기로 한 것은 한 사람이 한 지역을 쥐고 표를 흥정하던 방식입니다. 대통령은 충청의 표로 당선되었다는 말을 다시는 듣지 않겠다고 했습니다.\n\n세 사람의 시대를 끝내자는 것은 30년 전 이인제가 내건 구호였는데, 이제 그는 세 사람에게서 받을 것과 버릴 것을 갈랐습니다."
 tfrkphn.523.a:0 "받을 것은 받고 버릴 것은 버린다"
