l_korean:
 # 2022년 대선 선거 운동 이벤트의 새 글. elec22_build.py가 만든다.
 TFRKPHN_e22_122_t:0 "청년의 꿈"
 TFRKPHN_e22_122_d:0 "경선이 끝나고 이틀 뒤, 홍준표 후보와 이준석 대표가 마주 앉았습니다.\n\n두 사람은 사이가 나쁘지 않습니다. 당 대표를 뽑을 때도, 대표와 다른 주자가 부딪쳤을 때도 홍 후보는 이 대표 편에 섰습니다. 그 덕을 본 것은 홍 후보였습니다. 2021년 9월 초 한 여론조사에서 그는 20대에서 26.3을 얻어 여야 주자 가운데 가장 높았고, 젊은 지지자들은 무조건 야권 후보는 홍준표라는 말을 줄여 무야홍이라고 불렀습니다.\n\n이날 두 사람은 선거대책위원회를 작게 꾸리고 젊은 사람을 앞에 세우기로 했습니다. 후보의 유세차에 이십 대가 오르게 됐습니다."
 TFRKPHN_e22_122_a:0 "젊은 표가 승부처다"
 TFRKPHN_e22_123_t:0 "말이 먼저 나갔다"
 TFRKPHN_e22_123_d:0 "홍준표 후보의 입은 그를 여기까지 데려온 무기였습니다. 듣는 사람이 시원하다고 느끼는 말을 그는 골라서 할 줄 압니다.\n\n그런데 본선은 경선과 달랐습니다. 지방 유세에서 [TFRKP_HN_dpk_name] 후보를 두고 한 거친 표현이 그날 저녁 뉴스의 첫머리에 올랐습니다. 캠프는 앞뒤 맥락을 봐 달라고 했지만 화면에는 그 한 문장만 되풀이해 나왔습니다.\n\n경선 때 다른 주자가 그를 두고 토론은 주도하는데 내용은 없다고 했던 말이 다시 돌았습니다. 지지자들은 속이 시원하다고 했고, 아직 마음을 정하지 못한 사람들은 고개를 저었습니다."
 TFRKPHN_e22_123_a:0 "입이 또 말썽이다"
 TFRKPHN_e22_124_t:0 "핵에는 핵으로"
 TFRKPHN_e22_124_d:0 "텔레비전 토론의 주제는 북핵이었습니다.\n\n홍준표 후보는 미국과 나토 방식으로 핵을 공유해야 한다고 했습니다. 다섯 해 전부터 해 온 주장입니다. 미국이 거절하면 어떻게 하겠느냐는 물음에는, 서독의 슈미트 총리가 핵 개발 뜻을 내비친 뒤에야 미국이 전술핵을 다시 들여놓았다는 이야기를 꺼냈습니다.\n\n[TFRKP_HN_dpk_name] 후보는 그 길이 비확산 체제를 벗어나는 길이고 우리를 고립시킬 것이라고 받아쳤습니다. 경선 때 같은 당 주자에게서 들었던 반박과 거의 같았습니다.\n\n토론이 끝난 뒤 지지층은 환호했습니다. 핵무장이라는 낱말에 놀란 중도층의 반응은 달랐습니다."
 TFRKPHN_e22_124_a:0 "듣기에는 시원한 말"
 TFRKPHN_e22_116_t:0 "상대 후보의 유세"
 TFRKPHN_e22_116_d:0 "[TFRKP_HN_dpk_name] 후보가 전국을 돌고 있습니다. 가는 곳마다 민생과 경제 회복을 약속했고, 나라 살림을 맡아 본 경험이 있다는 점을 내세웠습니다.\n\n[TFRKP_HN_ppp_name] 후보를 겨냥한 말도 빠지지 않았습니다. 위기에는 해 본 사람이 필요하다는 것이었습니다. 유세장의 분위기는 뜨거웠고, 지지자들이 모이면서 여론이 움직이고 있습니다."
 TFRKPHN_e22_116_a:0 "알겠습니다."
 TFRKPHN_e22_281_t:0 "빈농의 맏아들"
 TFRKPHN_e22_281_d:0 "신문들이 이낙연 후보의 지난날을 잇달아 싣고 있습니다.\n\n그는 전남 영광의 가난한 농가에서 일곱 남매의 맏이로 태어났습니다. 광주제일고와 서울대 법대를 나와 1979년 동아일보에 들어갔고, 도쿄 특파원과 논설위원, 국제부장을 거치며 스물한 해 동안 기자로 일했습니다. 2000년 총선에서 함평과 영광에 나가 당선되며 정치를 시작했고, 2002년에는 노무현 당선인의 대변인이었습니다.\n\n2014년에 전남지사가 됐고 2017년에는 문재인 정부의 첫 국무총리가 됐습니다. 역대 총리 가운데 가장 오래 그 자리에 있었습니다. 2020년 4월 종로에서 당선됐고 그해 8월 당 대표가 됐습니다.\n\n우리는 이만큼 여러 자리를 거친 후보를 본 적이 드뭅니다."
 TFRKPHN_e22_281_a:0 "준비된 후보"
 TFRKPHN_e22_282_t:0 "조심스러운 유세"
 TFRKPHN_e22_282_d:0 "이낙연 후보의 수도권 유세가 열렸습니다. 사회자가 이름을 외치고 지지자들이 따라 외쳤습니다.\n\n후보의 연설은 길고 정확했습니다. 숫자는 틀리지 않았고 문장은 끝까지 맺었습니다. 기자였던 사람답게 틀린 말을 하지 않으려 했습니다.\n\n다만 박수가 터질 대목이 좀처럼 나오지 않았습니다. 연설이 끝난 뒤 한 지지자는 맞는 말씀인데 가슴이 뛰지는 않는다고 말했습니다. 그날 밤에는 [TFRKP_HN_ppp_name] 후보 쪽 유세 영상이 더 많이 돌았습니다."
 TFRKPHN_e22_282_a:0 "틀린 말은 없었는데"
 TFRKPHN_e22_283_t:0 "사면론의 그림자"
 TFRKPHN_e22_283_d:0 "선거 막바지에 한 해 전의 일이 다시 불려 나왔습니다.\n\n2021년 1월 1일, 당 대표이던 이낙연 후보는 두 전직 대통령의 사면을 대통령에게 건의하겠다고 했습니다. 국민 통합이 명분이었습니다. 당 지지층은 거세게 반발했습니다. 그는 그해 3월 대표에서 물러나며, 국민의 마음을 더 세밀하게 헤아려야 한다는 아픈 공부가 됐다고 말했습니다.\n\n상대 진영은 이 일을 다시 꺼내 양쪽에서 두드리고 있습니다. 보수 쪽에서는 말만 꺼내고 물러선 사람으로, 진보 쪽에서는 그때 사면을 말한 사람으로 봅니다. 후보는 이미 설명한 일이라고만 답했습니다."
 TFRKPHN_e22_283_a:0 "지난 일이 발목을 잡는다"
 TFRKPHN_e22_284_t:0 "내 삶을 지켜주는 나라"
 TFRKPHN_e22_284_d:0 "이낙연 후보가 대표 공약을 다시 내놓았습니다. 신복지와 중산층 경제입니다.\n\n신복지는 소득과 돌봄, 건강, 주거, 고용, 교육, 문화, 환경, 안전의 아홉 영역에서 나라가 보장할 최저 기준을 정하겠다는 구상입니다. 중산층 경제는 지금 57인 중산층 비율을 70까지 끌어올리겠다는 약속입니다. 한 번에 눈길을 끄는 공약은 아닙니다.\n\n경선 때는 옛 복지와 무엇이 다르냐는 물음을 받았습니다. 그래도 얼마를 주겠다는 말보다 어디까지 책임지겠다는 말을 믿는 사람들이 있었고, 중도층의 반응은 나쁘지 않았습니다."
 TFRKPHN_e22_284_a:0 "내 삶을 지켜주는 나라"
 TFRKPHN_e22_285_t:0 "심상정 후보의 사퇴"
 TFRKPHN_e22_285_d:0 "정의당 심상정 후보가 대선을 며칠 앞두고 후보에서 물러나 [TFRKP_HN_dpk_name] 후보를 지지하겠다고 밝혔습니다.\n\n심 후보는 정의당의 대통령 선거는 여기서 멈추지만 진보 정치의 길은 멈추지 않겠다고 말했습니다. [TFRKP_HN_dpk_name] 후보는 어려운 결단에 감사한다고 답했고, 두 당은 정치 개혁을 함께 추진하겠다는 선언문에 이름을 올렸습니다.\n\n정의당 안에서는 반발이 나왔습니다. 완주를 약속하고 모은 표를 어디에 쓰느냐는 것입니다. 그래도 근소한 차이로 갈릴 선거에서 이 표가 어디로 가느냐는 작은 일이 아닙니다."
 TFRKPHN_e22_285_a:0 "표가 모인다"
 TFRKPHN_e22_286_t:0 "경험이라는 무기"
 TFRKPHN_e22_286_d:0 "유세가 뜨거워지는 가운데 이낙연 후보가 경제를 앞세웠습니다.\n\n그는 도지사와 총리로 일하며 살림을 맡아 본 사람이라는 점을 내세웠습니다. 코로나로 가게 문을 닫은 자영업자와 일자리를 찾는 청년에게 필요한 것은 해 본 사람의 손이라고 말했습니다.\n\n[TFRKP_HN_ppp_name] 후보 쪽은 바로 그 경험을 겨눕니다. 집값이 오르던 때에 총리가 누구였느냐는 것입니다. 가장 오래 재임한 총리라는 이력은 이 선거에서 그의 자랑이고, 동시에 그가 지고 가야 할 짐입니다.\n\n경제를 누가 더 잘 아느냐는 싸움은 선거 날까지 이어질 것으로 보입니다."
 TFRKPHN_e22_286_a:0 "해 본 사람"
 TFRKPHN_e22_287_t:0 "마지막 유세"
 TFRKPHN_e22_287_d:0 "선거 전날 밤, 이낙연 후보의 마지막 유세가 서울 도심에서 열렸습니다.\n\n후보는 목이 쉬어 있었습니다. 그는 스물한 해 동안 남의 말을 받아 적는 일을 했고, 그 뒤 스무 해는 자기 말에 책임지는 일을 했다고 말했습니다. 화려한 약속은 하지 않겠다고도 했습니다. 지킬 수 있는 것만 말하겠다는 것이었습니다.\n\n연설이 끝나자 그는 연단에서 내려와 허리를 깊이 숙였습니다. 지지자들은 한참 동안 자리를 뜨지 않았습니다. 누가 이기든 선거는 내일 끝나고, 우리는 그 결과를 받아들일 준비를 합니다."
 TFRKPHN_e22_287_a:0 "허리를 숙였다"
 TFRKPHN_e22_288_t:0 "총리의 책임"
 TFRKPHN_e22_288_d:0 "텔레비전 토론에서 [TFRKP_HN_ppp_name] 후보가 이낙연 후보에게 물었습니다. 문재인 정부에서 가장 오래 총리를 한 사람으로서 그 정부의 실패에 얼마나 책임이 있느냐는 질문이었습니다.\n\n이 후보는 잘한 일과 못한 일을 나눠 답하려 했습니다. 답이 길어졌고 사회자가 시간을 알렸습니다. 다 계승하겠다고 하면 정권 교체를 바라는 표를 잃고, 다르게 하겠다고 하면 당의 지지층이 서운해합니다. 그는 그 사이에서 말을 골랐습니다.\n\n토론 다음 날 신문들은 그의 답보다 그 질문을 제목에 올렸습니다."
 TFRKPHN_e22_288_a:0 "답이 길었다"
 TFRKPHN_e22_289_t:0 "사백 평"
 TFRKPHN_e22_289_d:0 "부동산 토론에서 이낙연 후보는 자신이 낸 토지독점규제 3법을 설명했습니다. 2021년 7월 15일에 발의한 법안으로, 서울과 수도권에서 한 사람이 가질 수 있는 택지를 1,320제곱미터, 사백 평쯤으로 묶는 내용입니다.\n\n[TFRKP_HN_ppp_name] 후보는 법안을 제쳐 두고 후보의 땅을 물었습니다. 이 후보가 서울 평창동과 전남 영광에 천 평이 넘는 땅을 갖고 있다는 보도가 경선 때 나왔기 때문입니다. 이 후보 쪽은 영광 땅은 물려받은 것이고 모두 적법하게 얻었다고 설명해 왔습니다.\n\n설명은 틀리지 않았습니다. 그래도 상한을 말하는 후보가 자기 땅을 해명하는 장면이 화면에 남았습니다."
 TFRKPHN_e22_289_a:0 "땅 이야기는 어렵다"
 TFRKPHN_e22_290_t:0 "탈원전"
 TFRKPHN_e22_290_d:0 "에너지 토론에서 [TFRKP_HN_ppp_name] 후보가 물었습니다. 문재인 정부의 탈원전 정책을 그대로 이어 갈 것이냐는 질문이었습니다.\n\n이낙연 후보는 그 정부의 총리였습니다. 그는 원전을 수십 년에 걸쳐 천천히 줄여 가자는 정책이라고 답했습니다. 상대는 짓다가 멈춘 원전은 어떻게 할 것이냐고 다시 물었고, 이 후보는 공론을 거쳐 정하겠다고 답했습니다.\n\n신중한 답이었습니다. 그러나 전기 요금 고지서를 받아 든 시청자들은 분명한 답을 기다리고 있었고, 두 번 모두 미루는 말로 들었습니다."
 TFRKPHN_e22_290_a:0 "공론에 부치겠다"
