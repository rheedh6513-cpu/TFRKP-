 TFRKPHN_bj_id_f:0 "전술항공기지 열여섯 곳에서 전투기가 뜹니다. 표지에 커서를 올리면 기지 이름이\n나옵니다."
 TFRKPHN_bj_op_sortie:0 "출격 훈련"
 TFRKPHN_bj_op_sortie_tt:0 "§Y출격 횟수를 늘린다§!\n고른 기지의 하루 출격 횟수를 끌어올립니다.\n\n비용: £pol_power §Y8§!\n고른 부대의 태세 §G+25§!\n§g같은 부대에는 20일 동안 다시 할 수 없습니다. 다른 부대에는 바로 할 수 있습니다.§!"
 TFRKPHN_bj_op_strike:0 "합동 타격 훈련"
 TFRKPHN_bj_op_strike_tt:0 "§Y합동 타격 훈련을 한다§!\n고른 기지의 전투기가 육군과 같은 표적을 치는 훈련을 합니다.\n\n비용: £pol_power §Y10§!\n고른 부대의 태세 §G+35§!\n§g같은 부대에는 20일 동안 다시 할 수 없습니다. 다른 부대에는 바로 할 수 있습니다.§!"
 TFRKPHN_bj_op_runway:0 "활주로 복구"
 TFRKPHN_bj_op_runway_tt:0 "§Y활주로 복구를 익힌다§!\n고른 기지가 맞아도 몇 시간 안에 다시 띄우는 훈련을 합니다.\n\n비용: £pol_power §Y5§!\n고른 부대의 태세 §G+20§!\n§g같은 부대에는 20일 동안 다시 할 수 없습니다. 다른 부대에는 바로 할 수 있습니다.§!"
 TFRKPHN_bj_hint:0 "§g오른쪽 단추로 군을 고르고, 지도의 표지를 눌러 부대를 고른 뒤 아래 단추로 훈련을 합니다.§!"
 TFRKPHN_bj_stage1_tt:0 "§Y북진 작전계획§!: 국민정신 §Y북진 태세§!에 더해집니다.\n계획 속도 §G+15%§!\n최대 계획 보너스 §G+10%§!"
 TFRKPHN_bj_stage2_tt:0 "§Y동원 완료§!: 국민정신 §Y북진 태세§!에 더해집니다.\n훈련 시간 §G-10%§!\n보급 소모 §G-10%§!"
 TFRKPHN_bj_stage3_tt:0 "§Y북진 준비 완료§!: 국민정신 §Y북진 태세§!에 더해집니다.\n사단 공격 §G+10%§!\n사단 속도 §G+10%§!\n전쟁 지지도 §G+10%§!"
 TFRKPHN_bj_lv1:0 "북진통일 고토회복 1단계"
 TFRKPHN_bj_lv1_desc:0 "육군, 해군, 공군이 북쪽을 보고 준비합니다. 전비 태세가 오를수록 북한군과 중국군을 상대로 더 잘 싸웁니다."
 TFRKPHN_bj_lv2:0 "북진통일 고토회복 2단계"
 TFRKPHN_bj_lv2_desc:0 "육군, 해군, 공군이 북쪽을 보고 준비합니다. 전비 태세가 오를수록 북한군과 중국군을 상대로 더 잘 싸웁니다."
 TFRKPHN_bj_lv3:0 "북진통일 고토회복 3단계"
 TFRKPHN_bj_lv3_desc:0 "육군, 해군, 공군이 북쪽을 보고 준비합니다. 전비 태세가 오를수록 북한군과 중국군을 상대로 더 잘 싸웁니다."
 TFRKPHN_bj_lv4:0 "북진통일 고토회복 4단계"
 TFRKPHN_bj_lv4_desc:0 "육군, 해군, 공군이 북쪽을 보고 준비합니다. 전비 태세가 오를수록 북한군과 중국군을 상대로 더 잘 싸웁니다."
 TFRKPHN_bj_lv5:0 "북진통일 고토회복 5단계"
 TFRKPHN_bj_lv5_desc:0 "육군, 해군, 공군이 북쪽을 보고 준비합니다. 전비 태세가 오를수록 북한군과 중국군을 상대로 더 잘 싸웁니다."
 TFRKPHN_bj_plan:0 "북진 작전계획"
 TFRKPHN_bj_plan_desc:0 "합참이 북으로 올라가는 작전계획을 세웠습니다. 부대마다 갈 길과 할 일이 정해졌습니다."
 TFRKPHN_bj_mobil:0 "동원 완료"
 TFRKPHN_bj_mobil_desc:0 "예비군이 부대를 채우고, 탄약과 연료가 전방 창고에 찼습니다."
 TFRKPHN_bj_ready:0 "북진 준비 완료"
 TFRKPHN_bj_ready_desc:0 "군은 명령을 기다립니다. 포병은 표적을 정해 두었고 기동군단은 강가에 섰습니다."
 tfrkphn.460.t:0 "작전계획이 책상에 올랐다"
 tfrkphn.460.d:0 "합참의장이 두꺼운 서류철을 들고 집무실에 들어왔습니다.\n\n북으로 올라가는 작전계획이었습니다. 지도에는 길이 둘 그려져 있었습니다. 하나는 개성을 지나 평양으로 갑니다. 다른 하나는 동해안에 병력을 올려 원산을 칩니다. 합참의장은 어느 쪽에 무게를 둘지 물었습니다."
 tfrkphn.460.a:0 "서부 축선에 무게를 둔다"
 tfrkphn.460.a_tt:0 "육군 모든 부대의 전비 태세가 §G+10§! 됩니다."
 tfrkphn.460.b:0 "동해안 상륙에 무게를 둔다"
 tfrkphn.460.b_tt:0 "해군 모든 부대의 전비 태세가 §G+10§! 됩니다."
 tfrkphn.461.t:0 "동원 태세가 갖춰졌다"
 tfrkphn.461.d:0 "예비군 동원 훈련이 끝났습니다.\n\n동원사단마다 사람이 찼습니다. 전방 창고에는 탄약과 연료가 들어갔습니다. 국방부 장관은 명령이 내려오면 사흘 안에 병력을 전방에 세울 수 있다고 보고했습니다."
 tfrkphn.461.a:0 "사흘이면 된다"
 tfrkphn.462.t:0 "북진 준비 완료"
 tfrkphn.462.d:0 "대통령이 전방 군단을 돌아보았습니다.\n\n군단장들은 같은 말을 했습니다. 명령만 내리면 된다고 했습니다. 포병은 표적을 정해 두었고, 기동군단은 도하 장비를 강가에 가져다 놓았습니다. 대통령은 북쪽을 한참 보다가 차에 올랐습니다."
 tfrkphn.462.a:0 "명령만 남았다"
 tfrkphn.463.t:0 "북쪽으로 뜬 편대"
 tfrkphn.463.d:0 "오산과 군산의 활주로에서 전투기가 줄지어 떴습니다.\n\n옛 미군 소속이던 공군이었습니다. 동해 건너에서는 일본 공군의 편대가 같은 시각에 이륙했습니다. 두 편대는 휴전선 남쪽 하늘에서 만나 북한을 향해 날아가기 시작했습니다. 평양의 방공 레이더가 한꺼번에 켜졌습니다."
 tfrkphn.463.a:0 "하늘이 먼저 열린다"
 tfrkphn.463.tt:0 "공군 모든 기지의 전비 태세가 §G+10§! 됩니다.\n북한의 전쟁 지지도가 §G-5%§! 됩니다."
 tfrkphn.464.t:0 "상륙을 기다리는 함대"
 tfrkphn.464.d:0 "사세보와 부산의 부두에 함정이 모였습니다.\n\n과거 미군 소속이었던 7함대의 수병들과 제3해병원정군의 장병들이 배에 올랐습니다. 그들이 탄 배는 해상자위대와 대한민국 해군의 함정입니다. 갑판에서는 상륙 장갑차를 묶는 작업이 밤새 이어졌습니다. 함대는 북한 해안으로 갈 명령을 기다립니다."
 tfrkphn.464.a:0 "닻을 올릴 준비를 한다"
 tfrkphn.464.tt:0 "해군 모든 부대의 전비 태세가 §G+10§! 됩니다.\n북한의 전쟁 지지도가 §G-5%§! 됩니다."
 tfrkphn.462.tt:0 "§Y참수 준비§!가 §G+50§! 됩니다."
 TFRKPHN_lee_bukjin_category:0 "북진통일 고토회복"
 TFRKPHN_lee_bukjin_category_desc:0 "육군, 해군, 공군의 전비 태세를 끌어올립니다. 세 군의 평균 태세가 오를수록 북한군과 중국군을 상대로 더 잘 싸웁니다.\n\n단계마다 북한군 상대 공격과 방어 §G+5%§!(최대 §G+25%§!), 중국군 상대 §G+3%§!(최대 §G+15%§!)."
 TFRKPHN_bj_force:0 "북진 태세"
 TFRKPHN_bj_force_desc:0 "육군, 해군, 공군이 훈련한 만큼 강해집니다. 군종마다의 전비 태세에 비례합니다. 작전계획, 동원, 준비 완료 단계의 효과와, 북한 민심이 돌아선 만큼 얻는 안정도, 전쟁 지지도, 정치력도 여기에 모입니다."
 TFRKPHN_bj_open_tt:0 "결정 창에 §Y북진통일 고토회복§! 탭이 다음 날 열립니다. 북한 쪽과 남한 쪽을 모두 쓸 수 있습니다."
