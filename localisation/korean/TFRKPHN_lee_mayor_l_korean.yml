l_korean:
 tfrkphn.6770.t:0 "스물다섯 구청장과 한 테이블"
 tfrkphn.6770.d:0 "조은희 서울시장이 취임 뒤 처음으로 구청장 스물다섯 명을 시청으로 불렀다. 당이 다른 구청장도 모두 자리에 나왔다.\n\n서초구청장 시절 주변 구청장 대부분이 다른 당이던 때를 지나 온 그는 첫 회의에서 구마다 숙원 사업을 하나씩 들고 오라고 했다. 회의가 끝난 뒤 몇몇 야당 구청장은 이야기를 끝까지 들어 준 자리였다고 했다.\n\n서울시는 그 사업들에 들어갈 돈의 절반을 정부가 대 달라고 요청했다."
 tfrkphn.6770.a:0 "정부가 절반을 댄다."
 tfrkphn.6770.b:0 "서울시 예산으로 하라고 한다."
 tfrkphn.6771.t:0 "구석구석"
 tfrkphn.6771.d:0 "구청장 협의회에서 나온 숙원 사업들이 하나둘 끝나고 있다. 골목 주차장, 구립 어린이집, 오래된 하수관 같은 작은 공사들이다.\n\n조은희 시장은 준공식마다 그 구의 구청장을 앞에 세웠다. 당이 다른 구청장도 마찬가지였다. 시청 안에서는 생색은 구청장이 내고 일은 시가 한다는 농담이 돌았다.\n\n여론조사에서 서울의 정부 지지도가 조금 올랐다."
 tfrkphn.6771.a:0 "작은 일이 쌓인다."
 tfrkphn.6772.t:0 "시청과 대통령 사이"
 tfrkphn.6772.d:0 "정몽준 서울시장이 정부의 수도권 정책을 두고 다른 목소리를 냈다. 일곱 번 국회의원을 지내고 2002년에는 대선에도 나섰던 그는 서울시 몫을 분명히 하겠다며 물러서지 않았다.\n\n같은 당 시장과 대통령이 공개적으로 엇갈리자 여당 안에서는 부담스럽다는 말이 나온다. 야당은 여당이 서울시장 하나도 다루지 못한다고 꼬집었다.\n\n대통령은 시장을 따로 만나 풀지, 시장의 말로 두고 넘길지 정해야 한다."
 tfrkphn.6772.a:0 "시장을 따로 만나 직접 푼다."
 tfrkphn.6772.b:0 "시장의 말은 시장의 말이다."
 tfrkphn.6773.t:0 "서울시장의 반년"
 tfrkphn.6773.d:0 "대통령과 정몽준 서울시장이 따로 만난 지 반년이 지났다. 두 사람은 그 뒤로 수도권 정책을 두고 공개적으로 다투지 않았다.\n\n시청 사람들은 시장이 국무회의 뒤 대통령과 짧게 따로 이야기하는 일이 잦아졌다고 전한다. 서울시가 바라던 사업 몇 개는 정부 계획에 들어갔고, 정부는 서울시의 협조를 얻어 수도권 법안을 국회로 넘겼다."
 tfrkphn.6773.d2:0 "정몽준 서울시장과 정부의 엇갈림이 반년째 이어지고 있다. 시장은 시정 설명회 때마다 정부 정책과 다른 서울시 안을 따로 내놓았다.\n\n여당 안에서는 다음 지방선거 공천을 두고 벌써 말이 갈린다. 야당은 같은 당끼리 싸우는 사이 서울 일이 멈췄다고 공세를 편다. 여당 지지율이 조금 내려갔다."
 tfrkphn.6773.a:0 "앞으로를 본다."
 tfrkphn.6774.t:0 "야당 시장의 첫 예산"
 tfrkphn.6774.d:0 "정원오 서울시장이 취임 뒤 첫 추가경정예산안을 내놓았다. 열두 해 동안 성동구청장을 지낸 그는 구에서 해 온 생활 행정을 서울 전체로 넓히겠다고 했다.\n\n남은 문제는 정부가 대야 할 몫이다. 야당 시장의 공약 사업에 국비를 얼마나 줄지를 두고 여당 안에서도 생각이 엇갈린다. 서울을 내준 마당에 시장 공을 키워 줄 이유가 없다는 쪽과, 국비를 끊으면 피해는 시민이 본다는 쪽이다."
 tfrkphn.6774.a:0 "국비를 그대로 준다."
 tfrkphn.6774.b:0 "국비를 줄인다."
 tfrkphn.6775.t:0 "서울시장의 반년"
 tfrkphn.6775.d:0 "정원오 서울시장이 취임한 지 반년이 지났다. 정부가 국비를 깎지 않으면서 서울시 사업들은 예정대로 돌아가고 있다.\n\n시장은 시정 설명회에서 정부와 생각이 다른 대목은 분명히 말하면서도, 도와준 몫은 도와줬다고 말했다. 야당 안에서는 그를 다음 대선 후보로 보는 사람이 늘고 있다."
 tfrkphn.6775.d2:0 "정원오 서울시장이 취임한 지 반년이 지났다. 국비가 줄면서 서울시 사업 몇 개가 멈췄다.\n\n시장은 시정 설명회마다 멈춘 공사 현장 사진을 띄웠다. 야당은 정부가 서울시민을 볼모로 잡았다고 공세를 폈고, 서울에서 여당 지지율이 내려갔다."
 tfrkphn.6775.a:0 "앞으로를 본다."
