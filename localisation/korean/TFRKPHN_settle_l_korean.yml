 # 이인제 정부: 탈북민 정착 지원. settle_build.py가 만든다.
 tfrkphn.536.t:0 "탈북민 정착 지원"
 tfrkphn.536.story:0 "\"아, 예. 여기다가 이름 적으시면 됩니다.\"\n\n\"함경도 출신 맞으신가요?\"\n\n\"예, 맞습네다.\"\n\n\"직업은 공장 노동자 맞으시고요.\"\n\n\"예, 맞습니다.\"\n\n\"몇 가지만 더 조사하고 여기서 나가시게 해 드리겠습니다.\"\n\n신기했다. 조사를 받는 동안 이렇게 친절한 사람은 처음 보았다. 남조선의 심리 공작이려니 했는데, 저 사람들은 자기들끼리 말할 때도 똑같이 말했다. 몇 시간이 지나도록 한 대도 맞지 않았다는 것은 더 신기한 일이었다.\n\n지금 먹는 밥만 해도 이북에서는 먹을 수 없는 것이었다. 그래도 그의 마음은 고기에 가 있었다. 이 고기를 마음껏 먹어 보는 것이 그의 소원이었다.\n\n그는 오랜만에 용기를 냈다.\n\n\"저, 고기 좀 더 주실 수 있겠습네까.\"\n\n그는 맞을 각오를 했다."
 tfrkphn.536.a:0 "예, 얼마든지요. 당연합니다."
