l_korean:
 TFRKPHN_allyfac_category:0 "여당 단체장과 공장 유치"
 TFRKPHN_allyfac_category_desc:0 "시장이나 도지사가 지금 정부와 같은 당인 지역에는 중앙정부 사업이 빨리 들어갑니다. 지도에서 §Y여당 단체장§! 표시가 붙은 지역을 골라 공장을 들일 수 있습니다. 정치력과 함께 공사 기간 동안 민수공장 1개가 묶입니다. 한 번에 한 곳만 진행되고, 같은 지역은 1년 뒤에 다시 할 수 있습니다."
 TFRKPHN_allyfac_civ:0 "민수공장 유치"
 TFRKPHN_allyfac_civ_desc:0 "고른 지역에 §Y민수공장§! 1개를 짓습니다. 빈 자리가 없으면 건물 칸을 1개 늘린 뒤 짓습니다."
 TFRKPHN_allyfac_office:0 "오피스 파크 유치"
 TFRKPHN_allyfac_office_desc:0 "고른 지역에 §Y오피스 파크§! 1개를 짓습니다. 빈 자리가 없으면 건물 칸을 1개 늘린 뒤 짓습니다."
 TFRKPHN_allyfac_wait_tt:0 "60일 뒤 공사가 끝납니다. 그동안 §Y민수공장 1개§!가 이 공사에 묶이고, 다른 지역에서는 유치를 진행할 수 없습니다."
 tfrkphn.6768.t:0 "산업단지 준공"
 tfrkphn.6768.d:0 "[TFRKPHN_allyfac_st.GetName]에 새 공장이 문을 열었습니다. 시장과 도지사가 정부와 손발을 맞춘 덕에 부지 확보와 인허가가 예상보다 빨리 끝났다고 합니다. 준공식에는 지역 주민과 협력 업체 사람들이 함께했고, 단체장은 일자리가 늘어날 것이라고 했습니다."
 tfrkphn.6768.a:0 "지역 경제가 한 걸음 나아갑니다."
 tfrkphn.6769.t:0 "업무지구 준공"
 tfrkphn.6769.d:0 "[TFRKPHN_allyfac_st.GetName]에 새 업무지구가 들어섰습니다. 시장과 도지사가 정부와 함께 기업 본사와 연구소를 불러 모았고, 첫 입주 업체들이 벌써 사무실을 꾸리고 있다고 합니다. 단체장은 젊은 사람들이 서울로 떠나지 않아도 되는 일자리라고 했습니다."
 tfrkphn.6769.a:0 "사람이 모이는 곳이 됩니다."
