l_korean:
 # [안내] 2027 다른 후임 세 사람의 늘린 중점. alt27_tree_build.py가 만든다.
 TFRKPHN_cho_won_jin_c1:0 "태극기를 든 정부"
 TFRKPHN_cho_won_jin_c1_desc:0 "2017년 그는 광장의 태극기 집회 세력과 함께 새 정당을 만들었습니다. 그 광장이 이제 정부의 지지 기반이 됩니다. 광장 밖의 사람들은 불안한 눈으로 지켜봅니다."
 TFRKPHN_cho_won_jin_c2:0 "패전 책임 조사위원회"
 TFRKPHN_cho_won_jin_c2_desc:0 "전쟁에서 진 책임을 누가 져야 하는지 묻는 위원회를 세웁니다. 조사의 칼끝이 어디까지 갈지는 위원회도 모릅니다."
 TFRKPHN_cho_won_jin_c3:0 "다시 무장하는 나라"
 TFRKPHN_cho_won_jin_c3_desc:0 "패전으로 흩어진 부대를 다시 모으고 예비군을 상설 부대로 돌립니다. 다시는 지지 않겠다는 것이 이 정부의 첫 구호입니다."
 TFRKPHN_cho_won_jin_c4:0 "비상 경제 명령"
 TFRKPHN_cho_won_jin_c4_desc:0 "물가와 배급을 정부가 직접 쥡니다. 시장은 불평하지만 가게 앞의 줄은 짧아집니다."
 TFRKPHN_cho_won_jin_c5:0 "질서 회복"
 TFRKPHN_cho_won_jin_c5_desc:0 "비상 통치를 거두지는 않습니다. 다만 거리의 혼란은 끝났다고 정부는 선언합니다. 그 질서를 누가 어떤 값으로 치렀는지는 다음 정부가 따질 일입니다."
 TFRKPHN_hwang_kyo_ahn_h1:0 "공안 검사의 눈"
 TFRKPHN_hwang_kyo_ahn_h1_desc:0 "대통령은 공안 검사로 일했던 사람입니다. 정보기관과 검찰의 대공 수사 조직을 다시 키웁니다."
 TFRKPHN_hwang_kyo_ahn_h2:0 "정당 해산의 기억"
 TFRKPHN_hwang_kyo_ahn_h2_desc:0 "2013년 법무부 장관이던 그는 통합진보당 해산 심판을 청구했고, 헌법재판소는 2014년 12월 19일 해산을 결정했습니다. 이번 정부는 같은 잣대를 다시 꺼내 듭니다. 야당은 그 잣대가 어디를 향할지 묻습니다."
 TFRKPHN_hwang_kyo_ahn_h3:0 "안보 국가"
 TFRKPHN_hwang_kyo_ahn_h3_desc:0 "전쟁 뒤의 불안을 안보 예산으로 메웁니다. 휴전선과 해안에 감시 장비를 늘리고 예비군 훈련을 다시 엽니다."
 TFRKPHN_hwang_kyo_ahn_h4:0 "권한대행의 경험"
 TFRKPHN_hwang_kyo_ahn_h4_desc:0 "그는 2016년 겨울부터 2017년 봄까지 대통령 권한대행으로 나라를 맡은 적이 있습니다. 그때처럼 국무회의를 매주 빠짐없이 열고 행정부를 단단히 쥡니다."
 TFRKPHN_hwang_kyo_ahn_h5:0 "질서 있는 나라"
 TFRKPHN_hwang_kyo_ahn_h5_desc:0 "반공과 질서를 다섯 해 국정의 첫째로 두었습니다. 거리는 조용해졌지만, 그 조용함을 두고 평가는 끝까지 갈립니다."
