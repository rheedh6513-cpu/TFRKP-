l_korean:
 # 개헌 논의 도중의 이벤트. amend_ev_build.py가 만든다.
 TFRKPHN_amend_ev_m4:0 "찬성 의원 §R4명§!이 반대로 돌아섭니다."
 TFRKPHN_amend_ev_m2:0 "찬성 의원 §R2명§!이 반대로 돌아섭니다."
 TFRKPHN_amend_ev_p5:0 "반대 의원 §G5명§!이 찬성으로 돌아섭니다."
 TFRKPHN_amend_ev_p2:0 "반대 의원 §G2명§!이 찬성으로 돌아섭니다."
 tfrkphn.592.t:0 "당론 반대"
 tfrkphn.592.d:0 "개헌 논의가 시작된 지 한 달 만에 더불어민주당이 의원총회를 열어 개헌안 반대를 당론으로 정했습니다. 이재명 대표는 전쟁에서 이긴 정부가 그 기세로 헌법까지 고치려 든다고 말했습니다.\n\n그는 조문을 하나하나 따지지 않았습니다. 지금 헌법을 고치면 고친 사람의 헌법이 된다는 말만 되풀이했고, 찬성 쪽으로 기울던 의원 몇을 대표실로 불렀습니다. 그 의원들은 방에서 나온 뒤로 입을 닫았습니다.\n\n우리가 세던 찬성표는 그날 저녁에 몇 줄었습니다."
 tfrkphn.592.a:0 "다시 한 사람씩 만난다"
 tfrkphn.592.b:0 "대표와 직접 마주 앉는다"
 tfrkphn.593.t:0 "찬성 토론"
 tfrkphn.593.d:0 "정청래 의원이 본회의 자유 발언을 신청했습니다. 당론은 반대인데 그는 찬성 쪽에 이름을 올렸습니다.\n\n그는 1987년 헌법이 거리에서 싸운 사람들이 얻어 낸 것이라는 말로 시작했습니다. 그렇게 얻은 헌법이라 사십 해 가까이 아무도 손대지 못했는데, 손대지 못하는 것과 지키는 것은 다르다는 말이었습니다. 정부안의 조문에 다 찬성하는 것은 아니고 논의의 문을 여는 표결에만 찬성한다는 말도 덧붙였습니다.\n\n발언이 끝나자 야당 의석에서 야유가 나왔습니다. 그날 저녁 야당 의원 몇이 그의 방을 찾아갔습니다.\n\n대통령은 중계를 보고 저 사람 말이 여당 누구의 말보다 낫다고 했습니다."
 tfrkphn.593.a:0 "그 손을 잡는다"
 tfrkphn.593.b:0 "야당 표에 기대지 않는다"
 tfrkphn.594.t:0 "호헌 세력"
 tfrkphn.594.d:0 "표가 좀처럼 늘지 않자 여당 안에서 목소리가 거칠어졌습니다. 원내 지도부의 한 의원은 방송에 나와 개헌에 반대하는 사람들을 낡은 헌법 뒤에 숨은 세력이라고 불렀습니다. 반대하는 의원의 지역구마다 현수막을 걸자는 말도 나왔습니다.\n\n대통령은 2011년 당 대표가 되던 날 자기에게는 계파가 없다고 말한 사람이고, 여당이 한목소리로 야당을 몰아세우는 일에는 익숙하지 않습니다. 다만 그 공격 덕에 흔들리던 여당 의원 몇이 자리를 잡은 것도 사실입니다.\n\n야당은 이것이 헌법을 함께 고치자는 사람들의 태도냐고 되물었습니다."
 tfrkphn.594.a:0 "말리고 사과하게 한다"
 tfrkphn.594.b:0 "모른 척한다"
