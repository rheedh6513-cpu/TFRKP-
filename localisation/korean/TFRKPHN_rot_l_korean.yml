l_korean:
 # [안내] 세 김씨의 총리 순번. skx_build.py(rot_part.py)가 만든다.
 tfrkphn.7190.t:0 "순번"
 tfrkphn.7190.d:0 "첫 총선이 끝난 뒤 국회에는 과반을 가진 당이 없었다. 연정 협약서의 총리 칸은 사흘째 비어 있었다. 신민당은 김부겸과 김동연 가운데 한 사람을 고르지 못했고, 헌정회복연대는 내각제를 만든 김무성이 첫 총리를 맡아야 한다고 했다.\n\n세 사람은 사랑재 뒷방에서 만났다. 김무성이 먼저 종이를 꺼내 임기 사 년을 셋으로 나누는 줄을 그었다. 한 사람이 열여섯 달씩 총리를 맡고 나머지 두 사람은 그동안 부총리와 당 대표를 맡는다는 안이었다. 김부겸은 약속을 어긴 사람을 어떻게 할지부터 적자고 했다.\n\n종이에는 세 줄이 적혔다. 차례가 끝난 사람은 그날로 사표를 낸다. 차례를 어긴 사람의 당은 연정에서 나간다. 의석이 없는 김무성의 차례에는 국회가 따로 동의안을 표결한다. 세 사람은 그 밑에 차례로 서명했다.\n\n정치부 기자들은 이 합의를 나눠 먹기라고 썼다. 한 원로 기자는 지난 대통령 선거 때 다섯 주 동안 단일화 협상을 하고도 갈라섰던 사람들이 이번에는 한 시간 만에 종이 한 장을 채웠다고 칼럼에 적었다."
 tfrkphn.7190.a:0 "첫 차례가 시작된다."
 tfrkphn.7191.t:0 "공관 열쇠"
 tfrkphn.7191.d:0 "약속한 열여섯 달이 찼다. [TFRKPHN_rot_out] 총리는 아침에 마지막 국무회의를 열어 안건 네 건을 처리했고, 회의가 끝나자 장관들과 한 사람씩 악수했다. 사표는 전날 밤에 써 두었다.\n\n국회는 오후에 [TFRKPHN_rot_in]의 총리 인준안을 표결했다. 세 사람이 순번을 정할 때 서명한 종이의 사본이 의원들 책상에 놓여 있었다. 반대표를 던진 의원들도 표결이 끝나자 일어나 박수를 쳤다. 정치부 기자들은 약속이 깨졌다는 기사를 미리 써 두었다가 지웠다.\n\n총리 공관의 인수인계는 삼십 분이 걸렸다. 떠나는 사람은 서랍 열쇠와 진행 중인 일을 적은 종이 두 장을 건넸다. 종이 맨 위에는 연정 안에서 아직 합의하지 못한 법안의 이름이 적혀 있었다. 받는 사람은 종이를 읽고 두 군데에 줄을 그었다. 공관 직원들은 그사이 침실의 이불을 바꿨다.\n\n두 사람은 공관 마당의 감나무 밑에서 차를 한 잔씩 마셨다. 이번 인수인계와 상관없는 나머지 한 사람이 조금 늦게 와서 세 번째 잔을 받았다. 세 사람은 사진 기자들이 돌아간 뒤에도 한 시간을 더 앉아 있었다."
 tfrkphn.7191.a:0 "다음 차례는 열여섯 달 뒤다."
 tfrkphn.7154.e:0 "세 김씨가 돌아가며 맡는다."
 TFRKPHN_rot_tt:0 "§Y김부겸§!, §Y김동연§!, §Y김무성§!이 §Y열여섯 달§!씩 돌아가며 총리를 맡습니다. 신민당이 이끄는 정부는 김부겸부터, 헌정회복연대가 이끄는 정부는 김무성부터 시작합니다."
 TFRKPHN_rot_name_1:0 "김부겸"
 TFRKPHN_rot_name_2:0 "김동연"
 TFRKPHN_rot_name_3:0 "김무성"
