l_korean:
 TFRKPHN_local_ally:0 "여당 단체장"
 TFRKPHN_local_ally_desc:0 "이 지역의 시장이나 도지사가 지금 정부와 같은 당입니다. 중앙정부와 손발이 맞아 사업이 빨리 돕니다. 여당 단체장 한 명마다 건설 속도가 §G3%§! 빨라집니다."
 TFRKPHN_ally_tt:0 "지금 정부와 같은 당 시장, 도지사가 있는 지역은 §Y여당 단체장§! 보너스를 받습니다(한 명마다 건설 속도 §G+3%§!)."
 TFRKPHN_ruling_up_tt:0 "§Y여당§! 지지율 §G+3%§!"
 TFRKPHN_ruling_down_tt:0 "§Y여당§! 지지율 §R-3%§!"
