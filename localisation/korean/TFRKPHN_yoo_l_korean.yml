l_korean:
 # 이인제 정부: 유승민 이야기. yoo_build.py가 만든다.
 tfrkphn.508.t:0 "자리는 받지 않겠다"
 tfrkphn.508.d:0 "첫 재벌개혁 법안이 국회를 통과한 주에 대통령이 유승민을 다시 불렀습니다.\n\n대통령은 법을 만든 사람이 법을 집행하는 것이 맞다면서 공정거래위원장 자리를 제안했고, 유승민은 한참을 듣고 난 뒤에 사양했습니다.\n\n자신이 그 자리에 앉으면 이 법은 유승민의 법이 되고, 그러면 반대하는 쪽은 법 대신 사람을 공격할 것이라는 이유였습니다. 자신은 밖에서 조문을 봐 주는 것으로 충분하다고 했습니다.\n\n집무실을 나서기 전에 그는 한 가지를 부탁했습니다. 위원장에는 정치인 말고 숫자를 읽을 줄 아는 사람을 앉혀 달라는 것이었습니다."
 tfrkphn.508.a:0 "뜻을 받아들인다"
 tfrkphn.508.b:0 "부탁대로 실무자를 위원장에 앉힌다"
 tfrkphn.508.b_tt:0 "재계의 저항 §G-5§!"
 tfrkphn.509.t:0 "유승민의 메모"
 tfrkphn.509.d:0 "재계와 타협한 안이 국회를 통과한 다음 날 아침, 대통령의 책상에 유승민이 보낸 메모 한 장이 올라와 있었습니다.\n\n메모는 세 줄이었습니다. 첫 줄은 예외 조항이 붙은 자리를 조문 번호로 짚었고, 둘째 줄은 그 예외로 빠져나가는 그룹이 몇 곳인지를 적었습니다. 셋째 줄에는 한 번 연 문은 다음 법안에서도 열어 달라고 할 것이라는 말이 있었습니다.\n\n끝에 붙은 말은 없었습니다. 그만두겠다는 말도 화가 났다는 말도 없었는데, 비서실장은 오히려 그 점이 더 무겁다고 말했습니다."
 tfrkphn.509.a:0 "직접 전화해 까닭을 설명한다"
 tfrkphn.509.b:0 "통과되는 법이 먼저다"
 tfrkphn.509.b_tt:0 "노동계의 신뢰 §R-3§!"
 tfrkphn.510.t:0 "공개 토론"
 tfrkphn.510.d:0 "경제 단체들이 성명을 낸 이틀 뒤 유승민이 방송 토론에 나갔고, 맞은편에는 경제 단체의 상근부회장이 앉았습니다.\n\n부회장은 기업을 죄인 취급하는 법이 이어지면 투자가 나라 밖으로 나간다고 말했습니다. 유승민이 꺼낸 것은 종이 한 장이었는데, 지난 십 년 동안 총수 일가의 개인회사가 내부거래로 올린 매출과 같은 기간 그 그룹의 국내 투자액을 나란히 적은 표였습니다.\n\n한국개발연구원 연구원 출신인 그는 목소리를 높이지 않고 표의 숫자를 한 줄씩 읽어 내려갔습니다. 부회장이 그 숫자의 출처를 묻자, 그 단체가 해마다 내는 보고서라는 답이 돌아왔습니다.\n\n다음 날 경제 단체들은 두 번째 성명을 미뤘습니다."
 tfrkphn.510.a:0 "숫자가 이겼다"
 tfrkphn.510.a_tt:0 "재계의 저항 §G-10§!"
 tfrkphn.511.t:0 "보복이냐는 질문"
 tfrkphn.511.d:0 "검찰이 그룹 본사를 압수수색한 날 기자들이 유승민을 둘러쌌습니다. 재벌개혁이 결국 재벌 손보기 아니냐는 질문이 쏟아졌습니다.\n\n유승민은 수사는 지난 일을 묻는 것이고 법은 앞으로의 일을 정하는 것이어서, 둘을 섞으면 둘 다 망가진다고 답했습니다. 죄가 있으면 벌을 받아야 하지만 법안 표결을 압수수색 날짜에 맞추는 일은 없어야 한다는 말도 했습니다.\n\n그날 저녁 그는 같은 말을 대통령에게 따로 전하면서, 수사가 끝날 때까지 다음 법안의 상정을 미루자고 제안했습니다."
 tfrkphn.511.a:0 "수사와 법안의 일정을 떼어 놓는다"
 tfrkphn.511.b:0 "지금이 밀어붙일 때다"
 tfrkphn.511.b_tt:0 "재계의 저항 §G-5§!"
 tfrkphn.512.t:0 "세금 이야기"
 tfrkphn.512.d_full:0 "통일세가 발표된 주말에 유승민이 신문에 글을 실었습니다.\n\n그는 2015년 4월 원내대표 연설에서 증세 없는 복지는 허구라고 말했던 사람입니다. 이번 글의 첫 문장도 세금 없는 통일은 없다는 것이어서 그때와 꼴이 같았고, 그 뒤로는 북쪽의 도로와 병원과 학교에 드는 돈이 항목마다 적혀 있었습니다.\n\n유승민은 정부가 욕을 먹으면서도 원안대로 걷기로 한 것을 옳다고 쓰면서, 걷은 돈을 어디에 쓰는지는 해마다 국회에 보고하라고 했습니다. 여당 안에서 통일세를 편든 사람은 그가 처음이었습니다."
 tfrkphn.512.d_half:0 "통일세가 발표된 주말에 유승민이 신문에 글을 실었습니다.\n\n그는 2015년 4월 원내대표 연설에서 증세 없는 복지는 허구라고 말했던 사람입니다. 이번 글의 첫 문장도 세금 없는 통일은 없다는 것이어서 그때와 꼴이 같았고, 그 뒤로는 북쪽의 도로와 병원과 학교에 드는 돈이 항목마다 적혀 있었습니다.\n\n유승민은 세율을 절반으로 낮춘 것이 아쉽다고 썼습니다. 모자라는 절반은 결국 다음 정부가 걷게 된다는 이유였는데, 그래도 세금이라는 말을 피하지 않은 것만은 평가한다고 덧붙였습니다."
 tfrkphn.512.d_none:0 "통일세 논란이 지나간 주말에 유승민이 신문에 글을 실었습니다.\n\n그는 2015년 4월 원내대표 연설에서 증세 없는 복지는 허구라고 말했던 사람입니다. 이번 글의 첫 문장도 세금 없는 통일은 없다는 것이어서 그때와 꼴이 같았고, 그 뒤로는 북쪽의 도로와 병원과 학교에 드는 돈이 항목마다 적혀 있었습니다.\n\n유승민은 정부가 세금 대신 국채를 고른 것을 비판하면서, 국채는 이름을 바꾼 세금이고 갚는 사람은 지금 투표권이 없는 아이들이라고 썼습니다. 신문들은 재벌개혁을 같이 하는 사이에도 할 말은 한다는 뜻으로 그 글을 풀이했습니다."
 tfrkphn.512.a:0 "사용처를 해마다 국회에 보고한다"
 tfrkphn.512.b:0 "비판은 받아들인다"
