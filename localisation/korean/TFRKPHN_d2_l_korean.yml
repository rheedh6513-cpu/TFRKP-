 # 이인제 정부: 하르츠식 대타협. d2_build.py가 만든다.
 tfrkphn.538.t:0 "하르츠 개혁"
 tfrkphn.538.story:0 "2002년 독일은 실업률이 11퍼센트에 가까웠고 노동시장은 굳을 대로 굳어 있었다. 슈뢰더 총리는 폭스바겐의 인사 담당 이사 페터 하르츠에게 이 일을 맡겼는데, 노조와 협상해 본 경험을 높이 샀기 때문이다. 하르츠는 노동계와 경영계, 정부와 학계 사람 열다섯 명으로 위원회를 꾸려 그해에 개선안 열세 가지를 내놓았다.\n\n법은 네 차례에 걸쳐 나왔다. 2003년의 첫 두 법은 실직 넉 달째부터 취업이나 직업훈련에 나설 의무를 지웠고, 월 400유로 이하의 미니잡을 넓히면서 생계형 1인 창업을 지원했다. 세 번째 법은 연방고용청을 뜯어고치고 실업급여를 받는 기간을 최장 32개월에서 18개월로 줄였다. 2005년 1월에 시행된 네 번째 법은 기한 없이 주던 실업부조를 사회부조와 합쳐 월 345유로 안팎의 실업급여 2로 바꾸었으며, 알선받은 일자리를 거절하면 급여가 깎이게 했다.\n\n2005년 486만 명, 실업률 11.2퍼센트까지 올랐던 실업은 그 뒤로 줄어들었다. 15세에서 64세 사이의 고용률도 2003년 64.6퍼센트에서 2011년에는 72.6퍼센트로 올랐다. 그 대신 저임금 일자리와 불안정한 일자리가 늘었다는 비판이 지금껏 따라다니고, 실업이 줄어든 것이 이 개혁 덕인지를 두고도 논란이 남아 있다. 슈뢰더의 연립정부는 네 번째 법이 시행된 그해 11월에 막을 내렸다.\n\n이인제는 이 개혁을 오래 지켜보았다. 2015년 새누리당 노동시장선진화특위 위원장이던 그는 한국이 추구할 모델이 하르츠 개혁과 비슷하다고 말했고, 그 개혁이 독일 경제를 젊고 강력하게 했다는 평가를 받는다고 덧붙였다.\n\n그가 독일에서 먼저 가져오려는 것은 열다섯 명이 한자리에 앉았던 그 방식이다. 전쟁을 함께 버틴 노동계와 경영계가 노사정위원회에 다시 앉는 날, 정부는 독일이 얻은 것과 치른 값을 나란히 적은 자료부터 돌리기로 했다."
 tfrkphn.538.a:0 "노사정위원회를 다시 연다"
