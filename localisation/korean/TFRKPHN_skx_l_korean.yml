 TFRKPHN_mx_amend_tt:0 "개헌 논의 기구를 엽니다. 헌정회복연대와의 §Y약속을 지킵니다§!."
 TFRKPHN_mx_kms_vote_tt:0 "개헌 찬성이 §Y200석§!을 넘으면 국민투표로 갑니다. 지금 §Y[?TFRKPHN_kms_votes|0]석§!"
 TFRKPHN_debt_category:0 "나라 빚 장부"
 TFRKPHN_debt_category_desc:0 "패전 뒤 나라가 진 빚입니다. 갚지 않으면 매주 이자가 붙고, 빚을 갚는 중점을 찍거나 아래 디시전을 쓰면 줄어듭니다. 0이 되면 빚 없는 아침이 옵니다."
 TFRKPHN_debt_t1:0 "§Y나라 빚§! [?TFRKPHN_kdy_debt|0] / 100"
 TFRKPHN_debt_t2:0 "지난 24달 (오른쪽이 이번 달)"
 TFRKPHN_end_7115_mech_0:0 "\n\n그가 수사를 한 번 멈춘 일을 두고 비겁했다는 평가와 그래서 임기를 마칠 수 있었다는 평가가 함께 나왔다."
 TFRKPHN_end_7115_mech_1:0 "\n\n수사를 받은 사람들 가운데 몇은 그가 떠나는 날에도 대문 밖에서 항의했다."
 TFRKPHN_end_7115_mech_2:0 "\n\n한때 그를 비난하던 사람 몇이 그날 조용히 꽃을 보냈다."
 TFRKPHN_end_7115_prom_0:0 "\n\n그는 연대와 한 개헌 논의 약속을 임기 안에 지키지 못했다."
 TFRKPHN_end_7115_prom_1:0 "\n\n그가 연 개헌 논의 기구는 다음 정부에서도 계속 운영됐다."
 TFRKPHN_end_7115_prom_2:0 ""
 TFRKPHN_end_7115_hong_0:0 "\n\n대구의 홍준표는 그날 끝까지 수사를 밀고 간 사람이 떠난다는 글을 한 줄 올렸다."
 TFRKPHN_end_7115_hong_1:0 "\n\n홍준표는 그날 아무 말도 하지 않았다."
 TFRKPHN_end_7115_hong_2:0 ""
 TFRKPHN_end_7116_mech_0:0 "\n\n장부의 마지막 장에는 남은 빚이 없었다. 그는 그 장을 손바닥으로 한 번 쓸고 장부를 덮었다."
 TFRKPHN_end_7116_mech_1:0 "\n\n장부에는 갚지 못한 빚이 몇 줄 남았고, 그는 그 줄들을 인수인계서 맨 앞에 옮겨 적었다."
 TFRKPHN_end_7116_prom_0:0 "\n\n그는 연대와 한 개헌 논의 약속을 임기 안에 지키지 못했다."
 TFRKPHN_end_7116_prom_1:0 "\n\n그가 연 개헌 논의 기구는 다음 정부에서도 계속 운영됐다."
 TFRKPHN_end_7116_prom_2:0 ""
 TFRKPHN_end_7116_hong_0:0 "\n\n그가 홍준표의 글에서 틀린 숫자를 바로잡은 뒤로 두 사람은 끝내 화해하지 않았다."
 TFRKPHN_end_7116_hong_1:0 "\n\n홍준표는 그 뒤로 나라 빚에 대한 글을 다시 쓰지 않았다."
 TFRKPHN_end_7116_hong_2:0 ""
 TFRKPHN_end_7118_mech_0:0 "\n\n새 헌법에 따른 첫 총선은 그가 물러난 뒤에 치러진다."
 TFRKPHN_end_7118_mech_1:0 "\n\n개헌은 그의 임기 안에 이루어지지 않았고, 그는 퇴임사에서 이 일을 다음 정부에 부탁했다."
 TFRKPHN_end_7118_hong_0:0 "\n\n그는 개헌 표결 때 홍준표에게 받은 도움을 갚을 기회를 얻지 못했다."
 TFRKPHN_end_7118_hong_1:0 ""
 TFRKPHN_spirit_kbg:0 "개혁의 칼"
 TFRKPHN_spirit_kbg_desc:0 "대통령은 사정의 칼을 빼 들었습니다. 개혁 중점을 찍을수록 정치력이 붙고, 개혁 저항이 높을수록 안정도가 깎입니다. 중점을 찍을수록 부패가 줄어 소비재 부담이 가벼워지고, 지방 도로와 공장 생산이 늘어납니다."
 TFRKPHN_spirit_kdy:0 "빚을 갚는 나라"
 TFRKPHN_spirit_kdy_desc:0 "패전의 빚이 나라 살림을 누릅니다. 빚이 많을수록 소비재 부담과 정치력 손실이 커지고, 중점을 찍을수록 건설이 빨라집니다. 빚을 다 갚으면 안정도가 오릅니다. 중점을 찍을수록 공장 생산과 산업 단지 건설, 연구 속도가 오릅니다."
 TFRKPHN_spirit_kms:0 "내각제의 꿈"
 TFRKPHN_spirit_kms_desc:0 "대통령은 권력을 나누는 헌법을 꿈꿉니다. 개헌 찬성 의석이 많을수록 정치력이 붙고, 중점을 찍을수록 안정도가 오르고, 성장 계획에 따라 건설과 도로가 빨라지며, 국방 개혁으로 군의 조직력이 높아집니다."
 TFRKPHN_sp_kbg_civil_army:0 "문민의 군대"
 TFRKPHN_sp_kbg_civil_army_desc:0 "군의 사조직을 걷어 내고 군을 헌법 아래 둡니다. 장교단은 잠시 흔들리지만 지휘 체계는 단단해집니다."
 TFRKPHN_sp_kbg_real_name:0 "금융 실명제"
 TFRKPHN_sp_kbg_real_name_desc:0 "모든 금융 거래를 실명으로 합니다. 숨은 돈이 드러나고 세금이 제대로 걷힙니다."
 TFRKPHN_sp_kbg_local_era:0 "지방 시대"
 TFRKPHN_sp_kbg_local_era_desc:0 "시장과 도지사, 군수를 주민이 직접 뽑습니다. 지방이 스스로 길을 닦습니다."
 TFRKPHN_sp_kbg_globalize:0 "세계화"
 TFRKPHN_sp_kbg_globalize_desc:0 "패전국의 문을 세계로 엽니다. 기술과 자본이 들어오고 공장은 더 빨리 배웁니다."
 TFRKPHN_sp_kdy_grand_bargain:0 "노사정 대타협"
 TFRKPHN_sp_kdy_grand_bargain_desc:0 "노동계와 재계, 정부가 한 테이블에서 고통을 나누기로 합의합니다."
 TFRKPHN_sp_kdy_venture:0 "벤처 붐"
 TFRKPHN_sp_kdy_venture_desc:0 "작은 회사들이 쏟아져 나옵니다. 차고와 지하 사무실에서 새 산업이 자랍니다."
 TFRKPHN_sp_kdy_broadband:0 "초고속 통신망"
 TFRKPHN_sp_kdy_broadband_desc:0 "전국에 광케이블이 깔립니다. 정보가 가장 빨리 흐르는 나라가 됩니다."
 TFRKPHN_sp_kdy_safety_net:0 "사회 안전망"
 TFRKPHN_sp_kdy_safety_net_desc:0 "일할 수 없는 사람에게도 최소한의 생활을 나라가 보장합니다."
 TFRKPHN_sp_kms_grand_coalition:0 "보수 대연합"
 TFRKPHN_sp_kms_grand_coalition_desc:0 "흩어진 보수 세력이 하나의 연합으로 묶였습니다. 원로와 소장파가 한 지붕 아래 있습니다."
 TFRKPHN_sp_kms_security_first:0 "안보 우선"
 TFRKPHN_sp_kms_security_first_desc:0 "패전의 교훈을 잊지 않습니다. 국경과 해안의 방비가 먼저입니다."
 TFRKPHN_sp_kms_deregulate:0 "규제 완화"
 TFRKPHN_sp_kms_deregulate_desc:0 "공장과 항만을 막던 규제를 걷어 냅니다. 대신 노동계의 반발이 따릅니다."
 TFRKPHN_sp_kms_coalition_council:0 "연정 협의회"
 TFRKPHN_sp_kms_coalition_council_desc:0 "큰 결정은 모두 연정 대표들이 한 테이블에서 정합니다. 느리지만 흔들리지 않습니다."
