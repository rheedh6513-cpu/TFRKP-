l_korean:
 # [안내] 삼김 고유 장치, 관계, 내각제 국회. skx_build.py가 만든다.
 tfrkphn.7144.t:0 "칼날이 돌아온다"
 tfrkphn.7144.d:0 "사정이 길어지자 조사를 받은 장성들의 동기 모임이 성명을 냈고 재계는 투자 계획을 미뤘다. 보수 신문들은 사설마다 표적 사정이라는 말을 썼고, 여당 안에서도 속도를 늦추자는 의원이 늘었다. 검찰청 앞에서는 수사 중단을 요구하는 집회가 열렸다.\n\n비서실장은 그날 아침 보고서 두 장을 들고 집무실에 들어갔다. 한 장에는 개혁 지지율이, 다른 한 장에는 반발하는 단체와 사람의 명단이 적혀 있었는데 두 숫자는 지난달보다 똑같이 올라 있었다. 비서실장은 보고서를 내려놓고도 바로 나가지 않았다.\n\n대통령은 보고서를 끝까지 읽고 만년필 뚜껑을 닫았다. 여기서 수사를 멈추면 지금까지 조사받은 사람들이 모두 되돌아오고, 그대로 밀고 가면 여당 의원들까지 등을 돌린다는 것을 그는 알고 있었다.\n\n그날 오후 국무회의는 평소보다 한 시간 길어졌고 회의를 마친 장관들은 기자들을 피해 청사를 나갔다. 대통령은 다음 날 아침 담화로 결정을 밝히기로 했다. 대변인은 저녁 내내 기자들의 전화를 받지 않았고, 비서관들은 밤사이 담화문 초안을 세 번 고쳤다."
 tfrkphn.7144.a:0 "칼을 거두지 않는다."
 tfrkphn.7144.b:0 "한 발 물러선다."
 tfrkphn.7145.t:0 "빚 없는 아침"
 tfrkphn.7145.d:0 "기획재정부 국고국의 한 직원이 새벽에 마지막 상환 전표를 출력했다. 전표의 결재란 세 칸에 국장과 차관, 장관이 차례로 도장을 찍었고, 마지막 도장이 찍히자 누군가 사무실 창문을 열었다. 결재는 십 분도 걸리지 않았다.\n\n대통령은 아침 아홉 시에 한 장짜리 원고를 들고 춘추관에 서서 패전 뒤 나라가 진 빚을 마지막 한 푼까지 갚았다고 발표했다. 그는 평소처럼 건조한 목소리로 숫자를 읽었는데, 기자들은 원고를 접는 그의 손끝이 조금 떨렸다고 기사에 적었다. 발표는 삼 분 만에 끝났다.\n\n금 모으기 줄에 섰던 사람들과 문 닫은 공장으로 돌아가지 못한 사람들, 야간 강의실의 학생들이 그 발표를 들었다. 박수를 친 사람도 있었고 말없이 텔레비전을 끈 사람도 있었다. 시장 골목의 한 국밥집 주인은 그날 하루 국밥 값을 받지 않았다.\n\n국고국 직원은 퇴근길에 전표 사본 한 장을 접어 지갑에 넣었다. 그는 몇 해 뒤 그 전표를 아이에게 보여 주며 그날 아침 일을 설명했다. 그 지갑에는 금 모으기 때 받은 확인증도 함께 들어 있었다."
 tfrkphn.7145.a:0 "장부를 덮는다."
 tfrkphn.7146.t:0 "부총리의 사표"
 tfrkphn.7146.d:0 "부총리 김동연은 밤사이 흰 봉투 하나를 비서실에 맡기고 갔다. 아침에 대통령이 열어 본 봉투에는 사정의 속도가 시장을 얼어붙게 하고 있다는 사직 이유 세 줄을 적은 종이 한 장이 들어 있었다. 봉투에는 날짜가 어제로 적혀 있었다.\n\n부총리는 낮에 은행에서 일하고 밤에 야간대학에 다니던 시절부터 숫자가 틀리면 잠을 못 자는 사람이었다. 그는 그동안 사정에 공개적으로 반대하지 않았지만, 국무회의에서 해외 투자 철회 건수와 신규 채용 감소율, 회사채 금리를 보고할 때마다 목소리가 낮아졌다. 그는 그 숫자들을 대통령 탓이라고 말한 적이 없다.\n\n대통령은 그날 저녁 부총리를 관저로 불러 반찬 네 가지를 놓고 마주 앉았다. 두 사람은 식사하는 동안 거의 말을 하지 않았다. 비서관들은 식탁에서 멀리 떨어져 서 있었다.\n\n식사가 끝날 무렵 대통령이 봉투를 탁자 위로 밀었다. 부총리는 봉투를 집지 않고 숟가락을 내려놓은 채 대통령의 다음 말을 기다렸다. 관저 밖에서는 부총리의 차가 시동을 건 채 기다리고 있었다."
 tfrkphn.7146.a:0 "봉투를 돌려주고 속도를 늦춘다."
 tfrkphn.7146.b:0 "봉투를 돌려주고 그대로 간다."
 tfrkphn.7147.t:0 "연정의 청구서"
 tfrkphn.7147.d:0 "헌정회복연대의 김무성이 오래된 한정식집 안쪽 방으로 대통령을 초대했다. 연정의 한 축을 이끄는 사람이 대통령을 따로 부르는 일은 드물어서 비서실은 초대에 응할지를 한나절 의논했다. 김무성은 예전에 개헌 이야기를 꺼냈다가 하루 만에 거둬들인 적이 있다. 방에는 두 사람만 들어갔다.\n\n그는 술을 한 잔 따른 뒤, 연대가 지금까지 개혁 법안마다 표를 보탰으니 이제 권력 구조를 논의하자고 말했다. 대통령 한 사람에게 권한이 몰린 헌법을 그대로 두면 다음 정부도 같은 일을 겪는다는 주장이었다.\n\n대통령은 잔을 비우지 않고, 개혁이 끝나기 전에 개헌 논의를 시작하면 개혁이 묻힌다고 답했다. 김무성은 웃으며 고개를 끄덕이면서도 같은 요구를 한 번 더 했다. 연정이 깨지면 개혁 법안도 통과되지 않는다는 사정을 두 사람 모두 알고 있었다.\n\n두 사람은 문 앞에서 두 손으로 악수하고 헤어졌다. 다음 날 연대의 원내대표는 법사위 일정을 하루 미뤘다. 대통령실은 그날 저녁 식사를 일정표에 올리지 않았고, 연대도 따로 설명하지 않았다."
 tfrkphn.7147.a:0 "개헌 논의를 약속한다."
 tfrkphn.7147.b:0 "지금은 아니라고 답한다."
 tfrkphn.7148.t:0 "총리의 반대"
 tfrkphn.7148.d:0 "공기업 매각안이 국무회의에 올라온 날 국무총리 김부겸이 처음으로 반대 발언을 했다. 매각 대상에 대구 공단의 오래된 기계 회사가 들어 있었는데, 김부겸은 대구에서 거듭 낙선하던 시절에도 그 회사의 노조 위원장을 해마다 찾아갔고 그 집 아이들의 이름까지 기억했다.\n\n총리는 매각안의 숫자를 반박하는 대신 그 공장 정문 앞에서 매일 아침 담배를 피우는 노동자 몇 사람의 이름을 불렀다. 장관들은 서로 눈을 피했고 경제부처 차관 한 명은 손을 들었다가 내렸다. 회의실에서는 한동안 서류 넘기는 소리만 났다.\n\n대통령은 끝까지 듣고 회의를 중단했다. 매각을 미루면 나라 빚이 다시 늘어나고, 그대로 진행하면 그 공장 노동자들이 일자리를 잃는다. 회의는 이미 예정 시간을 한참 넘기고 있었다. 장관들은 휴대전화로 다음 일정을 미뤘다.\n\n대통령은 자정 무렵 총리에게 전화를 걸어 내일 아침 국무회의에서 결정하겠다고 짧게 알렸다. 그는 전화를 끊고 장부를 다시 펴서 매각 대상 명단의 맨 아래 줄을 손가락으로 짚은 채 한참 앉아 있었다."
 tfrkphn.7148.a:0 "총리의 말을 듣는다."
 tfrkphn.7148.b:0 "장부대로 간다."
 tfrkphn.7149.t:0 "김무성의 계산서"
 tfrkphn.7149.d:0 "헌정회복연대의 김무성이 서류 봉투 하나를 들고 청와대를 찾아왔다. 봉투에는 지난 이 년 동안 연대가 정부 법안에 보탠 표를 날짜별로 적고 맨 아래에 합계를 굵게 쓴 표가 들어 있었고, 김무성은 그 표를 연정의 계산서라고 불렀다.\n\n대통령은 계산서를 꼼꼼히 읽었다. 김무성은 이 빚을 갚는 방법으로 권력 구조를 바꾸는 개헌 논의를 이번 임기 안에 시작하자고 요구했다. 그는 계산서의 어느 표결에서 연대가 반대 당론을 꺾고 찬성했는지도 짚어 가며 설명했다.\n\n대통령은 계산서를 덮고 한참 말이 없었다. 나라 빚을 갚는 일에는 자신이 있었지만 연정에 진 빚은 예산으로 갚을 수 없었고, 그는 자기 계산이 틀릴 수도 있다고 처음으로 생각했다. 그는 그날 밤늦게까지 계산기 앞에 앉아 있었다. 비서관이 두 번 들어와 퇴근 시간을 알렸지만 그는 손을 저어 내보냈다.\n\n김무성은 대답을 재촉하지 않고 차를 한 잔 더 청해 천천히 마신 뒤 돌아갔다. 그가 두고 간 봉투는 탁자 위에 그대로 있었고, 비서관은 봉투에 손대지 못하고 찻잔만 거두어 나갔다."
 tfrkphn.7149.a:0 "개헌 논의를 약속한다."
 tfrkphn.7149.b:0 "정치의 빚은 다음으로 미룬다."
 tfrkphn.7150.t:0 "국회 표결"
 tfrkphn.7150.d:0 "개헌안이 국회 본회의에 올라왔다. 국민투표에 부치려면 재적 의원 3분의 2인 이백 명이 찬성해야 했고, 대통령은 그 이백 석을 채우려고 지난 몇 달 동안 원로를 찾아가고 야당 의원들과 밥을 먹고 선거구를 양보했다.\n\n표결 날 본회의장에는 빈자리가 없었고 방청석에는 기자들과 원로들이 섞여 앉았다. 국회의장이 결과를 읽기 직전 전광판에 찬성과 반대의 숫자가 함께 떴다. 의원들은 누가 어느 쪽을 눌렀는지 서로 확인하지 않았다. 신민당 의원석에서는 김부겸과 김동연이 서로 떨어져 앉아 있었다.\n\n청와대 상황실의 비서관들은 지난밤 마지막으로 돌린 전화의 결과로 표를 미리 계산해 두었지만 그 숫자를 입 밖에 내지 않았다. 한 비서관은 계산기 화면을 손으로 가린 채 전광판이 켜지기를 기다렸다.\n\n대통령은 중계를 보지 않고 집무실 창가에 서서 국회 쪽을 바라보고 있었다. 비서관이 결과를 적은 쪽지를 들고 복도를 걸어오는 동안 그는 넥타이를 고쳐 맸다. 집무실 텔레비전은 꺼져 있었고 책상 위에는 담화문 초안 두 가지가 나란히 놓여 있었다."
 tfrkphn.7150.a:0 "쪽지를 펼친다."
 tfrkphn.7151.t:0 "국회의 벽"
 tfrkphn.7151.d:0 "개헌안은 국회에서 부결됐다. 찬성이 과반을 넘었지만 3분의 2에는 몇 석이 모자랐고, 신문들은 모자란 의석수를 기사 첫 줄에 적었다. 국민투표는 열리지 않았다. 의장은 부결을 선포하고 곧바로 산회를 알렸고 의원들은 말없이 본회의장을 나갔다.\n\n반대표를 던진 의원들은 기자회견을 열지 않았다. 마지막 순간에 마음을 바꾼 의원도 있었고 처음부터 찬성을 약속하지 않은 의원도 있었다. 청와대 비서관들은 명단에서 그 이름들을 하나씩 지우다가 명단을 덮었다.\n\n대통령은 그날 저녁 원로들을 불러 밥을 샀다. 그는 웃으며 술을 따랐고 개헌 이야기를 꺼내지 않았으며 원로들도 묻지 않았다. 식사는 일찍 끝났다. 한 원로가 돌아가는 길에 비서관에게 대통령을 잘 모시라고 당부했다.\n\n대통령은 관저로 돌아가는 차 안에서 라디오를 끄게 했다. 평생 다른 사람의 표를 세어 준 그가 자기 개헌안의 표는 채우지 못했다. 차가 관저 앞에 섰는데도 그는 한동안 내리지 않았고 운전기사는 시동을 켠 채 기다렸다. 관저 서재의 불은 새벽 두 시가 넘어서야 꺼졌다."
 tfrkphn.7151.a:0 "벽 앞에 선다."
 tfrkphn.7152.t:0 "공약집"
 tfrkphn.7152.d:0 "총선을 앞두고 각 당이 공약집을 찍어 냈다. 공약집들은 첫 장에서 똑같이 패전 뒤의 나라를 어떻게 다시 세울지를 물었지만 둘째 장부터는 숫자와 약속이 당마다 달랐다. 인쇄소 주인들은 이번 선거가 어느 때보다 바쁘다고 했다.\n\n집권 연정의 선거대책위원회는 마지막 회의에서 칠판에 개혁, 안정, 경계라는 세 단어를 적었다. 연정에 참여한 당들은 저마다 다른 단어에 동그라미를 쳤고, 어느 단어를 앞세우느냐에 따라 총선 뒤의 의석 분포가 달라질 터였다. 회의는 세 시간을 넘겼지만 세 단어 가운데 하나를 고르지 못했다.\n\n광장에서는 이미 선거전이 시작돼, 한쪽 끝의 당들은 패전의 책임을 물었고 반대쪽 끝의 당들은 배신의 책임을 물었다. 여론조사 기관들은 중도 정당을 고르는 유권자가 줄고 있다고 발표했지만 투표하겠다는 사람은 여전히 중도층에 가장 많았다.\n\n총리는 회의가 끝날 무렵 칠판 앞으로 걸어가 분필로 한 단어 아래에 줄을 그었다. 회의실에 있던 사람들은 말을 멈췄고, 대변인은 그 단어를 받아 적어 선거 구호 시안을 만들러 나갔다."
 tfrkphn.7152.a:0 "개혁을 앞세운다."
 tfrkphn.7152.b:0 "안정을 앞세운다."
 tfrkphn.7152.c:0 "극단을 경계한다."
 tfrkphn.7153.t:0 "연정의 금"
 tfrkphn.7153.d:0 "연정에 참여한 당의 대표가 총리실을 찾아와 문을 닫고 한 시간 넘게 총리와 언성을 높였다. 복도의 비서관들은 목소리를 들었지만 내용을 기록하지 않았고, 문이 열렸을 때 두 사람의 얼굴은 붉어져 있었다.\n\n그 당은 자기 당 공약 하나를 이번 회기 안에 처리해 달라고 요구했고, 들어주지 않으면 다음 예산안 표결에서 자유 투표를 하겠다고 통보했다. 연정의 표가 흩어지면 과반이 위태로워서 총리실은 그날 오후 내내 표 계산을 했다.\n\n정부 안에서는 연정이 깨지면 모든 것을 잃으니 들어주자는 의견과 한 번 물러서면 다음 요구가 또 온다는 의견이 맞섰다. 회의는 결론 없이 끝났고 장관들은 각자 차에 오르면서 전화를 걸었다. 한 장관은 차 문을 닫기도 전에 그 당의 원내대표와 통화를 시작했다.\n\n총리는 퇴근 직전 그 당의 대표에게 내일 아침 다시 만나자는 문자를 보냈지만 답장을 받지 못했다. 그는 휴대전화를 책상에 엎어 두고 새벽까지 잠들지 못했다. 총리실 직원들은 다음 날 아침 총리 일정을 모두 비워 두었다."
 tfrkphn.7153.a:0 "요구를 들어준다."
 tfrkphn.7153.b:0 "버틴다."
 tfrkphn.7154.t:0 "총리 지명"
 tfrkphn.7154.d:0 "연정 협약서 서명이 끝나고 총리의 이름을 적는 칸 하나가 남았다. 새 헌법에서 총리는 국회의 신임을 받아 취임하고 불신임을 받으면 물러나기 때문에, 누가 총리가 되느냐에 따라 연정이 얼마나 오래갈지가 달라진다. 연정의 당들은 저마다 다른 사람을 총리로 생각하고 있었다.\n\n제1당 안에서는 당을 오래 이끌며 협상을 마무리한 사람과 연정 상대 당들과 더 가까운 사람이 후보로 거론됐다. 당원들은 앞사람을, 연정 상대 당들은 뒷사람을 원했다.\n\n의원총회는 밤늦게까지 이어졌지만 표결은 하지 않기로 했다. 표결에서 진 쪽이 연정이 흔들릴 때 먼저 등을 돌린다는 우려 때문이었고, 원로 몇 사람은 일찍 자리를 떴다. 회의장 밖 복도에서는 두 사람을 지지하는 의원들이 따로 모여 있었다.\n\n결정은 당 대표에게 넘어갔다. 다음 날 아침 국회의장실로 보낼 공문에는 이름 칸이 비어 있었고 비서관은 펜을 들고 기다렸다. 당 대표는 두 사람을 차례로 불러 짧게 이야기했는데 두 사람 모두 자기를 지명해 달라고 말하지 않았다."
 tfrkphn.7154.a:0 "권영세를 지명한다."
 tfrkphn.7154.b:0 "주호영을 지명한다."
 tfrkphn.7154.c:0 "김동연을 지명한다."
 tfrkphn.7154.d:0 "김부겸을 지명한다."
 tfrkphn.7155.t:0 "야당 대표 둘"
 tfrkphn.7155.d:0 "신민당의 김부겸과 김동연이 함께 청와대를 찾아왔다. 야당 대표 두 사람이 나란히 대통령을 만난 것은 이 정부 들어 처음이어서 기자들은 두 사람이 차에서 내리기 전에 무언가 의논하는 모습까지 사진에 담았다.\n\n두 사람은 개헌안에 넣을 조건 세 가지를 손으로 적은 종이 한 장을 내놓았다. 총리 불신임에 건설적 불신임 방식을 쓰고, 지방에 권한을 나누고, 비례대표를 늘리라는 조건이었다. 두 사람은 이 조건을 받아들이면 신민당 안에서 찬성표를 모아 보겠다고 했다. 종이에는 두 사람의 서명이 나란히 있었다.\n\n대통령은 조건을 하나씩 소리 내어 읽고는 세 가지 모두 자기가 오래전부터 생각해 온 것이라고 웃으며 말했다. 그 말이 조건을 받아들인다는 뜻인지 알 수 없어서 두 야당 대표는 웃지 않았고, 배석한 비서관들도 대통령의 뜻을 짐작하지 못했다.\n\n면담은 사십 분 만에 끝났고 세 사람은 사진을 찍지 않았다. 다음 날 신문들은 세 사람의 이름을 설명에 적은 빈 회의실 사진을 실었다. 대통령실은 면담 내용을 한 줄로만 발표했다."
 tfrkphn.7155.a:0 "조건을 받아들인다."
 tfrkphn.7155.b:0 "조건을 돌려보낸다."
 tfrkphn.7156.t:0 "여의도의 계산"
 tfrkphn.7156.d:0 "개헌 표결을 앞두고 신민당이 둘로 갈렸다. 김동연은 의원총회에서 권력을 나누는 헌법이라면 반대할 이유가 없다고 말했고, 김부겸은 대통령이 임기 끝에 헌법을 바꾸려는 의도를 믿을 수 없다고 말했다. 의원들은 가운데 통로를 사이에 두고 두 사람 쪽으로 나뉘어 앉았다.\n\n청와대 정무수석은 그날 밤 신민당 의원 명단을 펴 놓고 찬성할 의원에게 파란 동그라미를, 반대할 의원에게 빨간 동그라미를 쳤다. 표시하지 못한 이름이 스무 개 남짓 남았는데, 개헌안이 이백 석을 넘길지는 이 스무 명에게 달려 있었다.\n\n김동연 쪽 의원 몇 사람이 조용히 연락해 와서 크지 않은 조건을 내걸었다. 그 조건을 들어주면 김부겸과는 관계를 되돌릴 수 없게 된다. 정무수석은 연락받은 시각과 의원의 이름을 수첩에 적고 그 쪽을 접어 두었다.\n\n대통령은 명단을 한참 보다가 정무수석에게 펜을 돌려주며 내일 아침까지 기다리라고 지시했다. 정무수석은 명단을 접어 가방에 넣고 사무실 불을 껐다. 대통령은 그날 밤 김부겸에게도 김동연에게도 전화를 걸지 않았다."
 tfrkphn.7156.a:0 "김동연 쪽에 손을 내민다."
 tfrkphn.7156.b:0 "두 사람이 스스로 정하게 둔다."
 tfrkphn.7157.t:0 "대구의 전직 대통령"
 tfrkphn.7157.d:0 "대통령은 대구에 내려간 길에 홍준표의 집을 찾았다. 탄핵으로 물러난 홍준표는 고향 가까운 이 도시에서 손님을 거의 받지 않고 지냈고, 날마다 신문 세 개를 끝까지 읽었다. 대문 앞에는 경호원 두 명이 서 있었고 수행원들은 차 안에서 기다렸다.\n\n두 사람은 같은 도시에서 정치를 했지만 같은 당에 있었던 적이 없다. 김부겸은 이 도시에서 여러 번 낙선했고 홍준표는 이 도시에서 출마해 당선됐다.\n\n사정은 이미 홍준표 정부의 장관 몇 사람에게까지 닿아 있었고, 홍준표가 그 이야기를 먼저 꺼냈다. 검사 시절 권력형 비리 수사로 이름을 얻은 그는 돌려 말하지 않고, 수사를 시작한 사람은 그 수사가 어디까지 가는지 끝까지 책임져야 한다고 말했다. 자기도 그런 수사를 해 봤다는 말도 했다.\n\n대통령은 그 말에 대답하지 않고, 패전 뒤 홍준표가 혼자 졌던 책임을 이제 나라가 나누어 지고 있다고 말했다. 홍준표는 찻잔을 내려놓았다. 두 사람은 대문 앞에서 짧게 인사하고 헤어졌다. 대통령은 차에 오르기 전에 대문 쪽을 한 번 돌아봤다."
 tfrkphn.7157.a:0 "예우는 지킨다."
 tfrkphn.7157.b:0 "칼에는 예외가 없다."
 tfrkphn.7158.t:0 "패전의 장부"
 tfrkphn.7158.d:0 "나라 빚 장부의 첫 장에는 바다 건너로 보낸 군대와 돌아오지 못한 배, 그 뒤에 날아온 청구서들이 적혀 있다. 이 빚은 홍준표 정부 때 생겼고 김동연 정부가 갚고 있었다. 장부는 임기 첫날부터 대통령 책상에 놓여 있었다.\n\n그 무렵 홍준표가 오랜만에 긴 글을 올려 긴축만으로는 나라를 지킬 수 없다고 주장했다. 전쟁을 결정한 사람이 할 말은 아니라는 비판이 먼저 쏟아졌지만 그 글은 하루 만에 수십만 번 읽혔다.\n\n비서실은 대응하지 말자고 건의했다. 대통령은 그 글을 출력해 끝까지 읽다가 전쟁 첫해의 국채 이자를 잘못 적은 숫자 하나를 찾아내 연필로 동그라미를 쳤다. 그는 틀린 숫자 옆에 맞는 숫자를 적어 넣고 종이를 서랍에 넣었다.\n\n대통령은 다음 날 국무회의에서 전 정부 이야기를 꺼내지 않고 장부의 첫 장을 펴서 장관들에게 돌렸다. 장관들은 그 장을 빨리 넘겼고, 회의가 끝난 뒤 비서관이 그 장을 장부 맨 앞에 다시 끼웠다. 경제부총리는 그날 오후 국채 이자 지급 내역을 연도별로 정리해 공개했다."
 tfrkphn.7158.a:0 "답하지 않는다."
 tfrkphn.7158.b:0 "숫자를 바로잡아 발표한다."
 tfrkphn.7159.t:0 "옛 대표들"
 tfrkphn.7159.d:0 "대통령은 개헌 표결을 앞두고 전직 대통령 홍준표를 만나러 대구로 내려갔다. 두 사람은 같은 보수 정당의 대표를 차례로 지냈고, 서로 비난한 적도 많았지만 같은 선거를 함께 치른 적도 있다. 두 사람이 따로 만난 것은 탄핵 뒤로 처음이다.\n\n탄핵 뒤 홍준표를 따르던 의원들은 헌정회복연대와 작은 당들로 흩어졌다. 개헌안이 이백 석을 넘기려면 그 의원들의 표가 필요해서, 정무수석은 그 명단을 가방에 넣고 대통령과 함께 기차에 올랐다. 명단에는 열두 명의 이름이 적혀 있었다.\n\n홍준표는 대통령의 이야기를 끝까지 듣고, 권력을 나누는 헌법이 왜 필요한지는 권력을 가져 본 사람이 안다고 말했다. 자기는 그 권력의 무게를 견디지 못하고 물러났다는 말도 했다. 그는 돕겠다는 약속도 거절도 하지 않았다.\n\n대통령은 돌아오는 기차에서 도시락을 반쯤 남겼다. 다음 주에 의원 몇 사람이 조용히 찬성 명단에 이름을 올렸는데, 누가 그들에게 전화를 걸었는지 밝힌 사람은 없다. 홍준표는 그 뒤로도 개헌에 대해 공개적으로 말하지 않았다."
 tfrkphn.7159.a:0 "빚을 하나 진다."
 tfrkphn.7159.b:0 "혼자 간다."
 tfrkphn.7160.t:0 "지키지 않은 약속"
 tfrkphn.7160.d:0 "헌정회복연대의 원내대표가 기자회견을 열어 종이 한 장을 들어 보였다. 몇 해 전 대통령과 연대 대표가 만나 나눈 약속을 정리한 메모였고, 대통령이 개헌 논의를 시작하겠다고 해서 연대가 표를 보탰다는 내용이 두 사람의 서명과 함께 적혀 있었다.\n\n청와대 대변인은 개혁 일정이 먼저였다고 해명했지만 연대 의원들은 그 해명을 받아들이지 않았다. 저녁 뉴스는 메모의 손글씨를 화면 가득 내보냈다. 청와대는 메모가 진짜인지에 대해서는 말하지 않았다.\n\n다음 날 연대 소속 장관 두 명이 사표를 냈고 본회의에 올라 있던 법안 세 건의 표결이 미뤄졌다. 연정이 깨지지는 않았지만 정무수석이 연대 의원들에게 돌린 전화는 대부분 연결되지 않았다. 사표를 낸 장관들은 이임식도 하지 않고 청사를 떠났다.\n\n김무성은 그날 기자들 앞에 나서지 않고 저녁에 대통령에게 짧은 문자를 보냈다. 두 사람은 그 문자의 내용을 공개하지 않았다. 신민당은 그날부터 다음 대선에서 연대의 지원을 받기 어렵다고 보고 선거 전략을 다시 짜기 시작했다."
 tfrkphn.7160.a:0 "금을 메운다."
 tfrkphn.7160.b:0 "버틴다."
 TFRKPHN_mx_kbg_amend:0 "개헌 논의 기구를 연다"
 TFRKPHN_mx_kbg_amend_desc:0 "헌정회복연대와 한 약속대로 권력 구조를 다룰 논의 기구를 엽니다. 늦으면 연대의 인내가 다합니다."
 TFRKPHN_mx_kdy_amend:0 "개헌 논의 기구를 연다"
 TFRKPHN_mx_kdy_amend_desc:0 "헌정회복연대와 한 약속대로 권력 구조를 다룰 논의 기구를 엽니다. 늦으면 연대의 인내가 다합니다."
 TFRKPHN_mx_kbg_appeal:0 "여론에 호소한다"
 TFRKPHN_mx_kbg_appeal_desc:0 "대통령이 직접 방송에 나와 개혁의 이유를 설명합니다.\n\n§Y개혁 저항§!: [?TFRKPHN_kbg_resist|0] / 100. §R80§!이 되면 역풍이 붑니다."
 TFRKPHN_mx_kbg_compromise:0 "반발 세력과 타협한다"
 TFRKPHN_mx_kbg_compromise_desc:0 "속도를 늦추는 대신 반발을 누그러뜨립니다. 개혁을 기다리던 사람들은 실망합니다.\n\n§Y개혁 저항§!: [?TFRKPHN_kbg_resist|0] / 100"
 TFRKPHN_mx_kdy_repay:0 "국채를 앞당겨 갚는다"
 TFRKPHN_mx_kdy_repay_desc:0 "남는 세수를 모아 빚부터 갚습니다.\n\n§Y나라 빚§!: [?TFRKPHN_kdy_debt|0] / 100. 갚지 않으면 이자가 붙습니다."
 TFRKPHN_mx_kdy_sell:0 "공기업을 판다"
 TFRKPHN_mx_kdy_sell_desc:0 "덩치 큰 공기업을 팔아 빚을 갚습니다. 일자리를 잃는 사람이 생깁니다.\n\n§Y나라 빚§!: [?TFRKPHN_kdy_debt|0] / 100"
 TFRKPHN_mx_kdy_gold:0 "금 모으기 운동"
 TFRKPHN_mx_kdy_gold_desc:0 "장롱 속의 금반지와 돌반지가 은행 창구로 모입니다. 한 번뿐입니다.\n\n§Y나라 빚§!: [?TFRKPHN_kdy_debt|0] / 100"
 TFRKPHN_mx_kms_snd:0 "신민당 의원을 설득한다"
 TFRKPHN_mx_kms_snd_desc:0 "야당 의원들을 한 사람씩 만나 개헌안의 조문을 함께 고칩니다.\n\n§Y개헌 찬성§!: [?TFRKPHN_kms_votes|0]석 / §Y200석§! 필요"
 TFRKPHN_mx_kms_ind:0 "무소속을 끌어온다"
 TFRKPHN_mx_kms_ind_desc:0 "무소속 의원들의 지역 사업을 챙겨 주고 표를 얻습니다.\n\n§Y개헌 찬성§!: [?TFRKPHN_kms_votes|0]석 / §Y200석§! 필요"
 TFRKPHN_mx_kms_district:0 "선거구를 내준다"
 TFRKPHN_mx_kms_district_desc:0 "중대선거구제를 받아들여 작은 당들의 표를 얻습니다. 연대 안에서 불만이 나옵니다. 한 번뿐입니다.\n\n§Y개헌 찬성§!: [?TFRKPHN_kms_votes|0]석 / §Y200석§! 필요"
 TFRKPHN_mx_kms_elders:0 "원로 정치"
 TFRKPHN_mx_kms_elders_desc:0 "총리 자리를 나눈 원로들이 자기 계파의 표를 몰아줍니다. 한 번뿐입니다.\n\n§Y개헌 찬성§!: [?TFRKPHN_kms_votes|0]석 / §Y200석§! 필요"
