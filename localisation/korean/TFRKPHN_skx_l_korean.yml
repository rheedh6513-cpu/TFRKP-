l_korean:
 # [안내] 삼김 고유 장치, 관계, 내각제 국회. skx_build.py가 만든다.
 tfrkphn.7144.t:0 "칼날이 돌아온다"
 tfrkphn.7144.d:0 "사정의 칼이 지나간 자리마다 원망이 쌓였다. 조사를 받은 장성들의 동기 모임이 성명을 냈고, 재계는 투자 계획을 하나둘 미뤘다. 보수 신문들은 사설마다 같은 단어를 썼다. 표적 사정. 여당 안에서도 속도를 늦추자는 목소리가 커졌다.\n\n비서실장은 그날 아침 보고서 두 장을 들고 집무실에 들어갔다. 한 장에는 개혁 지지율이, 다른 한 장에는 반발 세력의 명단이 적혀 있었다. 두 숫자는 같은 속도로 오르고 있었다. 비서실장은 보고서를 내려놓고도 한동안 그 자리를 떠나지 않았다.\n\n대통령은 보고서를 끝까지 읽고 만년필 뚜껑을 닫았다. 그는 칼을 빼 든 사람이 칼을 내려놓는 순간 무슨 일이 생기는지 알고 있었다. 칼을 계속 휘두르는 사람에게 무슨 일이 생기는지도 알고 있었다.\n\n그날 오후 국무회의는 평소보다 길어졌다. 회의가 끝났을 때 장관들은 아무도 기자들 앞에 서지 않았다. 대통령의 결정은 다음 날 아침 담화로 나올 것이었다. 청와대 대변인은 저녁 내내 기자들의 전화를 받지 않았다. 다음 날 아침 담화문 초안은 세 번 고쳐졌다."
 tfrkphn.7144.a:0 "칼을 거두지 않는다."
 tfrkphn.7144.b:0 "한 발 물러선다."
 tfrkphn.7145.t:0 "빚 없는 아침"
 tfrkphn.7145.d:0 "기획재정부 국고국의 직원 하나가 새벽에 마지막 상환 전표를 출력했다. 전표에는 숫자 몇 개와 결재란 세 칸이 있었다. 국장과 차관, 장관이 차례로 도장을 찍었다. 그 도장들이 찍히는 동안 사무실에는 인주 냄새만 났다. 마지막 도장이 찍히자 누군가 창문을 열었다.\n\n아침 아홉 시, 대통령은 춘추관에 섰다. 원고는 한 장뿐이었다. 그는 패전 뒤 나라가 진 빚을 마지막 한 푼까지 갚았다고 말했다. 숫자를 읽는 목소리는 평소처럼 건조했다. 그러나 원고를 접는 손끝이 조금 떨렸다고 기자들은 적었다.\n\n금 모으기 줄에 섰던 사람들, 잘린 공장으로 돌아가지 못한 사람들, 야간 강의실의 늦은 학생들이 그 담화를 들었다. 누군가는 박수를 쳤고, 누군가는 아무 말 없이 텔레비전을 껐다. 시장 골목의 국밥집 주인은 그날 하루 국밥 값을 받지 않았다고 했다.\n\n퇴근길에 국고국 직원은 출력해 두었던 전표 한 장을 접어 지갑에 넣었다. 그는 그것을 버리지 않았다. 몇 년 뒤 그는 그 전표를 아이에게 보여 주며 이것이 무엇인지 설명했다."
 tfrkphn.7145.a:0 "장부를 덮는다."
 tfrkphn.7146.t:0 "부총리의 사표"
 tfrkphn.7146.d:0 "그날 아침 대통령의 책상 위에 흰 봉투 하나가 놓여 있었다. 부총리 김동연이 밤사이 비서실에 맡기고 간 것이었다. 봉투 안의 종이는 한 장이었고, 이유는 세 줄이었다. 사정의 속도가 시장을 얼어붙게 하고 있다는 것이었다.\n\n비서실장은 봉투를 보고 얼굴이 굳었다. 낮에는 은행에서 일하고 밤에는 야간대학에 다니던 시절부터, 부총리는 숫자가 틀리면 잠을 이루지 못하는 사람이었다. 그는 공개적으로 반대한 적이 없었다. 다만 국무회의에서 숫자를 읽을 때마다 목소리가 조금씩 낮아졌을 뿐이었다. 해외 투자 철회 건수, 신규 채용 감소율, 회사채 금리. 그 숫자들은 이제 대통령의 개혁과 같은 줄에 적혀 있었다. 그러나 부총리는 그 숫자들을 대통령 탓으로 돌리지 않았다.\n\n대통령은 그날 저녁 부총리를 관저로 불렀다. 두 사람은 반찬 네 가지를 놓고 마주 앉았다. 오랫동안 말이 없었다.\n\n식사가 끝날 무렵 대통령이 봉투를 탁자 위로 밀었다. 부총리는 그 봉투를 바로 집지 않았다. 그는 대신 숟가락을 내려놓고 대통령의 다음 말을 기다렸다."
 tfrkphn.7146.a:0 "봉투를 돌려주고 속도를 늦춘다."
 tfrkphn.7146.b:0 "봉투를 돌려주고 그대로 간다."
 tfrkphn.7147.t:0 "연정의 청구서"
 tfrkphn.7147.d:0 "헌정회복연대의 김무성이 대통령을 저녁 자리에 불렀다. 장소는 오래된 한정식집의 안쪽 방이었다. 연정의 다른 한쪽을 이끄는 사람이 대통령을 부르는 일은 흔하지 않았다. 김무성은 오래전 개헌 이야기를 꺼냈다가 하루 만에 거둬들인 적이 있는 사람이었다. 비서실은 그 초대장을 두고 한나절을 의논했다.\n\n그는 술을 한 잔 따른 뒤 본론을 꺼냈다. 연대는 지금까지 개혁 법안마다 표를 보태 왔다. 이제는 권력 구조를 이야기할 때가 되었다고 했다. 대통령 한 사람에게 모든 것이 몰리는 헌법으로는 다음 정부도 같은 길을 걷게 될 것이라는 말이었다.\n\n대통령은 술잔을 비우지 않았다. 그는 개혁이 끝나기 전에 헌법을 열면 개혁이 그 안에 묻힌다고 답했다. 김무성은 웃으며 고개를 끄덕였지만 물러서지 않았다. 그는 연정이 없으면 개혁도 없다는 것을 누구보다 잘 알고 있었다. 그리고 그것을 김무성도 알고 있었다.\n\n자리가 끝났을 때 두 사람은 문 앞에서 두 손으로 악수를 했다. 다음 날 연대의 원내대표는 법사위 일정을 하루 미뤘다."
 tfrkphn.7147.a:0 "개헌 논의를 약속한다."
 tfrkphn.7147.b:0 "지금은 아니라고 답한다."
 tfrkphn.7148.t:0 "총리의 반대"
 tfrkphn.7148.d:0 "공기업 매각안이 국무회의에 올라온 날, 총리 김부겸이 처음으로 반대 발언을 했다. 매각 대상에는 대구 공단의 오래된 기계 회사가 들어 있었다. 그 회사의 노조 위원장은 그가 대구에서 거듭 낙선하던 시절에도 해마다 찾아가던 사람이었다. 그는 그 사람의 아이들 이름까지 기억하고 있었다.\n\n총리는 숫자를 반박하지 않았다. 대신 그 공장 정문 앞에서 매일 아침 담배를 피우는 사람들의 이름을 몇 개 불렀다. 장관들은 서로 눈을 피했다. 경제부처 차관 하나가 손을 들었다가 다시 내렸다.\n\n대통령은 끝까지 듣고 회의를 멈췄다. 그는 장부의 숫자가 사람의 얼굴을 지우는 순간을 경계해 왔다. 그러나 장부를 덮으면 나라가 다시 빚더미에 앉는다는 것도 알았다. 회의실의 시계는 예정된 시간을 이미 한참 넘기고 있었다.\n\n자정 무렵 대통령은 총리에게 전화를 걸었다. 통화는 짧았다. 결론은 다음 날 아침 국무회의에서 나올 것이었다. 대통령은 전화를 끊은 뒤 장부를 다시 펼쳤다. 그리고 매각 대상 명단의 맨 아래 줄을 손가락으로 짚은 채 움직이지 않았다."
 tfrkphn.7148.a:0 "총리의 말을 듣는다."
 tfrkphn.7148.b:0 "장부대로 간다."
 tfrkphn.7149.t:0 "김무성의 계산서"
 tfrkphn.7149.d:0 "헌정회복연대의 김무성이 청와대를 찾아왔다. 그는 서류 봉투 하나를 들고 있었다. 봉투 안에는 지난 이 년 동안 연대가 정부 법안에 보탠 표가 날짜별로 적혀 있었다. 맨 아래 칸에는 합계가 굵게 적혀 있었다. 김무성은 그것을 연정의 계산서라고 불렀다.\n\n대통령은 그 계산서를 꼼꼼히 읽었다. 숫자를 다루는 사람에게 숫자로 말을 거는 방식이었다. 김무성은 그 빚을 갚을 방법도 함께 적어 왔다고 했다. 권력 구조를 바꾸는 개헌 논의를 이번 임기 안에 시작하자는 것이었다. 그다운 방식이었다.\n\n대통령은 계산서를 덮고 한참 말이 없었다. 그는 빚을 갚는 일에는 자신이 있었다. 그러나 이 계산서의 빚은 나라의 장부가 아니라 정치의 장부에 적혀 있었다. 대통령은 처음으로 자기 계산이 틀릴 수도 있다는 생각을 했다. 그 생각은 밤새 계산기 옆을 떠나지 않았다.\n\n김무성은 대답을 재촉하지 않았다. 그는 차를 한 잔 더 청해 천천히 마시고 돌아갔다. 봉투는 탁자 위에 그대로 남았다. 비서관은 그것을 치우지 못하고 찻잔만 거두어 나갔다."
 tfrkphn.7149.a:0 "개헌 논의를 약속한다."
 tfrkphn.7149.b:0 "정치의 빚은 다음으로 미룬다."
 tfrkphn.7150.t:0 "국회 표결"
 tfrkphn.7150.d:0 "개헌안이 국회 본회의에 올라왔다. 국민투표에 부치려면 먼저 재적 의원 3분의 2가 찬성해야 했다. 이백 석. 대통령은 지난 몇 달 동안 그 숫자 하나를 위해 사람들을 만나 왔다. 원로를 찾아갔고, 야당 의원들과 밥을 먹었고, 선거구를 내주었다.\n\n표결 당일 본회의장은 빈자리 없이 찼다. 방청석에는 기자들과 원로들이 섞여 앉았다. 국회의장이 개표 결과를 읽기 전, 회의장은 기침 소리 하나 없이 조용했다. 전광판에 찬성과 반대의 숫자가 동시에 떠올랐다. 의원들은 누가 무엇을 눌렀는지 서로 확인하지 않았다.\n\n청와대 상황실에서는 비서관 몇이 계산기를 두드렸다. 그들은 이미 숫자를 알고 있었다. 지난밤 마지막으로 돌린 전화의 결과가 그 계산기 안에 들어 있었다. 그러나 그 숫자를 소리 내어 말하는 사람은 없었다.\n\n대통령은 중계를 보지 않았다. 그는 집무실 창가에 서서 국회 쪽 하늘을 바라보았다. 결과를 적은 쪽지가 복도를 따라 천천히 다가오고 있었다. 그는 그 쪽지를 받기 전에 마지막으로 넥타이를 고쳐 맸다."
 tfrkphn.7150.a:0 "쪽지를 펼친다."
 tfrkphn.7151.t:0 "국회의 벽"
 tfrkphn.7151.d:0 "개헌안은 국회에서 멈췄다. 찬성은 과반을 넘었지만 3분의 2에는 닿지 못했다. 몇 석이 모자랐는지는 신문마다 첫 줄에 적혔다. 국민투표는 열리지 않았다. 헌법은 국민에게 묻기 전에 국회에서 먼저 길을 막아 두었다.\n\n반대표를 던진 의원들은 기자회견을 열지 않았다. 몇몇은 마지막 순간에 마음을 바꾸었고, 몇몇은 처음부터 약속한 적이 없었다. 청와대 비서관들은 그 이름들을 하나씩 지워 나가다가 결국 명단을 덮었다. 그 명단을 다시 펼치는 사람은 그 뒤로 아무도 없었다.\n\n대통령은 그날 저녁 원로들을 불러 밥을 샀다. 그는 웃으며 술을 따랐고, 개헌 이야기는 한 번도 꺼내지 않았다. 원로들도 묻지 않았다. 식사는 일찍 끝났다.\n\n관저로 돌아오는 차 안에서 그는 라디오를 끄라고 했다. 평생 남의 표를 세어 온 사람이 이번에는 자기 표를 세는 데 실패했다. 그는 그것을 남에게 말하지 않았다. 차가 관저 앞에 멈췄을 때 그는 잠시 내리지 않았다. 운전기사는 시동을 끄지 않고 기다렸다. 관저의 서재 불은 새벽 두 시가 넘어서야 꺼졌다."
 tfrkphn.7151.a:0 "벽 앞에 선다."
 tfrkphn.7152.t:0 "공약집"
 tfrkphn.7152.d:0 "총선을 앞두고 각 당의 공약집이 인쇄소를 떠났다. 표지는 저마다 달랐지만 첫 장은 비슷했다. 패전 뒤의 나라를 어떻게 다시 세울 것인가. 그러나 그 다음 장부터 숫자와 약속은 서로 다른 방향으로 흩어졌다. 인쇄소 주인들은 이번 선거가 어느 때보다 바쁘다고 했다.\n\n집권 연정의 선거대책위원회는 마지막 회의를 열었다. 회의실 칠판에는 세 개의 단어가 적혀 있었다. 개혁, 안정, 그리고 경계. 연정 안의 당들은 저마다 다른 단어에 동그라미를 쳤다. 어느 단어를 앞세우느냐에 따라 다음 반원의 모양이 바뀔 것이었다.\n\n광장의 양 끝은 이미 선거를 시작했다. 한쪽은 패전의 책임을, 다른 쪽은 배신의 책임을 외쳤다. 가운데의 당들은 그 사이에서 목소리를 낮출지 높일지를 정해야 했다. 여론조사 기관들은 가운데를 고른 유권자가 줄고 있다고 적었다. 그러나 투표소에 가는 사람은 여전히 가운데에 가장 많았다.\n\n총리는 회의가 끝날 무렵 칠판 앞으로 걸어갔다. 그리고 분필을 들어 한 단어 아래에 줄을 그었다. 분필 가루가 칠판 아래로 떨어졌다."
 tfrkphn.7152.a:0 "개혁을 앞세운다."
 tfrkphn.7152.b:0 "안정을 앞세운다."
 tfrkphn.7152.c:0 "극단을 경계한다."
 tfrkphn.7153.t:0 "연정의 금"
 tfrkphn.7153.d:0 "연정 안에서 처음으로 큰 소리가 났다. 연정에 함께한 당의 대표가 총리실을 찾아와 문을 닫고 한 시간 넘게 머물렀다. 비서관들은 복도에서 그 목소리를 들었지만, 무슨 말이 오갔는지 기록하지 않았다. 문이 열렸을 때 두 사람의 얼굴은 모두 붉어져 있었다.\n\n요구는 분명했다. 그 당이 내건 공약 하나를 이번 회기 안에 처리해 달라는 것이었다. 그렇지 않으면 다음 예산안 표결에서 자유 투표를 하겠다고 했다. 연정의 표가 흩어지면 과반은 얇아진다. 총리실의 계산기는 그날 오후 내내 쉬지 않았다.\n\n정부 안에서도 의견이 갈렸다. 들어주자는 쪽은 연정이 깨지면 모든 것을 잃는다고 했고, 버티자는 쪽은 한 번 물러서면 다음 요구가 또 온다고 했다. 회의는 결론 없이 끝났다. 장관들은 각자의 차로 흩어지면서 휴대전화를 귀에 댔다.\n\n총리는 퇴근 직전 그 당의 대표에게 짧은 문자를 보냈다. 내일 아침 다시 만나자는 내용이었다. 답장은 오지 않았다. 총리는 그 휴대전화를 책상 위에 엎어 두고 새벽까지 잠들지 못했다."
 tfrkphn.7153.a:0 "요구를 들어준다."
 tfrkphn.7153.b:0 "버틴다."
 tfrkphn.7154.t:0 "총리 지명"
 tfrkphn.7154.d:0 "연정 협약서에 서명이 끝나자 마지막 빈칸 하나가 남았다. 총리의 이름이었다. 새 헌법 아래에서 총리는 국회의 신임으로 서고, 국회의 불신임으로 물러난다. 누가 그 자리에 앉느냐에 따라 연정의 수명이 달라질 것이었다. 연정의 각 당은 그 칸을 두고 저마다 다른 이름을 마음에 두고 있었다.\n\n제1당 안에서는 두 이름이 오르내렸다. 한 사람은 당을 오래 이끌며 협상을 마무리한 사람이었고, 다른 한 사람은 연정의 상대 당들과 더 가까운 사람이었다. 당원들은 앞사람을, 연정의 파트너들은 뒷사람을 원했다.\n\n의원총회는 밤늦게까지 이어졌다. 표결은 하지 않기로 했다. 표결을 하면 지는 쪽이 생기고, 지는 쪽은 연정이 흔들릴 때 가장 먼저 등을 돌릴 것이었다. 원로 몇은 일찍 자리를 떴다.\n\n결국 결정은 당 대표의 몫으로 남았다. 다음 날 아침 국회의장실로 보낼 공문에는 이름 칸 하나가 비어 있었다. 비서관은 펜을 들고 기다렸다. 당 대표는 두 사람을 차례로 불러 짧게 이야기를 나눴다. 두 사람 모두 자신을 고르라고 말하지 않았다."
 tfrkphn.7154.a:0 "권영세를 지명한다."
 tfrkphn.7154.b:0 "주호영을 지명한다."
 tfrkphn.7154.c:0 "김동연을 지명한다."
 tfrkphn.7154.d:0 "김부겸을 지명한다."
 tfrkphn.7155.t:0 "야당 대표 둘"
 tfrkphn.7155.d:0 "신민당의 김부겸과 김동연이 함께 청와대를 찾아왔다. 야당 대표 둘이 나란히 대통령을 만나는 것은 정부가 들어선 뒤 처음이었다. 두 사람은 차에서 내리기 전에 잠시 무언가를 의논했고, 기자들은 그 장면을 놓치지 않았다.\n\n그들이 들고 온 것은 개헌안에 넣을 조건 세 가지였다. 총리 불신임에 건설적 불신임 방식을 쓸 것, 지방에 권한을 나눌 것, 비례대표를 늘릴 것. 셋을 받아들이면 신민당 안에서 찬성표를 모아 보겠다고 했다. 조건은 손으로 쓴 종이 한 장에 적혀 있었다.\n\n대통령은 조건을 하나씩 소리 내어 읽었다. 그리고 셋 다 오래전부터 자기가 생각해 온 것이라고 웃으며 말했다. 두 야당 대표는 웃지 않았다. 그 말이 받아들이겠다는 뜻인지 아닌지 알 수 없었기 때문이다. 대통령은 그런 순간을 즐기는 사람이었다. 비서관들은 그 웃음이 무엇을 뜻하는지 짐작하지 못했다.\n\n면담은 사십 분 만에 끝났다. 세 사람은 사진을 찍지 않았다. 다음 날 신문들은 빈 회의실 사진을 실었다. 사진 설명에는 세 사람의 이름이 적혀 있었다."
 tfrkphn.7155.a:0 "조건을 받아들인다."
 tfrkphn.7155.b:0 "조건을 돌려보낸다."
 tfrkphn.7156.t:0 "여의도의 계산"
 tfrkphn.7156.d:0 "개헌 표결을 앞두고 신민당이 흔들렸다. 김동연은 의원총회에서 권력을 나누는 헌법이라면 반대할 이유가 없다고 말했다. 김부겸은 대통령이 자기 임기 끝에 헌법을 바꾸는 것을 믿을 수 없다고 했다. 의원들은 두 사람 사이에서 자리를 골라 앉았다. 회의장 가운데 통로가 유난히 넓어 보였다.\n\n청와대 정무수석은 그 밤늦게 신민당 의원 명단을 펼쳐 놓고 색연필로 동그라미를 쳤다. 파란 동그라미는 찬성, 빨간 동그라미는 반대, 아무 표시가 없는 이름이 스무 개 남짓이었다. 그 스무 개가 이백 석을 가를 것이었다.\n\n김동연 쪽 의원 몇이 조용히 연락을 해 왔다. 조건은 크지 않았다. 다만 그 조건을 들어주면 김부겸과의 사이는 돌이킬 수 없을 것이었다. 정무수석은 그 연락을 받은 시각과 사람의 이름을 수첩에 적었다. 그리고 그 페이지에 접은 자국을 남겼다.\n\n대통령은 명단을 한참 보다가 정무수석에게 펜을 돌려주었다. 그리고 내일 아침까지 기다리라고만 했다. 정무수석은 명단을 접어 가방에 넣고 사무실 불을 껐다."
 tfrkphn.7156.a:0 "김동연 쪽에 손을 내민다."
 tfrkphn.7156.b:0 "두 사람이 스스로 정하게 둔다."
 tfrkphn.7157.t:0 "대구의 전직 대통령"
 tfrkphn.7157.d:0 "대통령은 대구에 내려간 길에 전직 대통령의 집을 찾았다. 탄핵으로 물러난 뒤 홍준표는 고향 가까운 이 도시에 머물며 손님을 거의 받지 않았다. 대문 앞에는 경호원 둘과 오래된 화분 몇 개뿐이었다. 수행원들은 차 안에서 기다렸다. 그는 이 집에서 신문 세 개를 매일 끝까지 읽는다고 했다.\n\n두 사람은 같은 도시에서 정치를 배웠지만 같은 편에 선 적은 없었다. 한 사람은 그 도시에서 거듭 떨어졌고, 한 사람은 그 도시에서 거듭 이겼다. 거실의 차는 금방 식었다.\n\n사정의 칼은 이미 전 정부의 장관들 몇 사람을 스쳐 지나갔다. 홍준표는 그 이야기를 먼저 꺼냈다. 모래시계 검사로 이름을 얻은 사람답게 그는 돌려 말하지 않았다. 칼을 든 사람은 칼끝이 어디로 가는지 끝까지 봐야 한다고 했다. 자기도 한때 그 칼을 들었었다고 덧붙였다.\n\n대통령은 대답하지 않았다. 대신 패전 뒤 그가 혼자 짊어졌던 무게를 이제 나라가 나눠 지고 있다고만 말했다. 홍준표는 그 말에 찻잔을 내려놓았다. 배웅은 대문 앞에서 짧게 끝났다."
 tfrkphn.7157.a:0 "예우는 지킨다."
 tfrkphn.7157.b:0 "칼에는 예외가 없다."
 tfrkphn.7158.t:0 "패전의 장부"
 tfrkphn.7158.d:0 "나라 빚 장부의 맨 앞 장에는 전쟁의 이름이 적혀 있었다. 바다를 건너 보낸 군대와 돌아오지 못한 배, 그리고 그 뒤에 날아온 청구서들이었다. 그 장부를 연 사람은 홍준표 정부였고, 그것을 덮는 일은 김동연 정부에 남았다.\n\n그 무렵 홍준표는 오랜만에 긴 글을 하나 올렸다. 물러난 뒤 그는 거의 말을 하지 않았지만, 한 번 입을 열면 짧고 날카로웠다. 그는 긴축이 나라를 지키는 법은 아니라고 썼다. 전쟁을 결정한 사람으로서 할 말은 아니라는 반응이 먼저 쏟아졌다. 그래도 그의 글은 하루 만에 수십만 번 읽혔다.\n\n비서실은 대응하지 말자고 했다. 대통령은 그 글을 출력해서 끝까지 읽었다. 숫자 하나가 틀려 있었다. 그는 그 숫자에 연필로 동그라미를 쳤다. 틀린 숫자는 전쟁 첫해의 국채 이자였다.\n\n다음 날 아침 국무회의에서 대통령은 전 정부 이야기를 하지 않았다. 대신 장부의 맨 앞 장을 펼쳐 장관들에게 돌렸다. 그 장을 넘기는 손들이 하나같이 빨랐다. 회의가 끝난 뒤 그 장은 다시 장부 맨 앞에 끼워졌다."
 tfrkphn.7158.a:0 "답하지 않는다."
 tfrkphn.7158.b:0 "숫자를 바로잡아 발표한다."
 tfrkphn.7159.t:0 "옛 대표들"
 tfrkphn.7159.d:0 "대통령은 개헌 표결을 앞두고 대구로 내려갔다. 전직 대통령 홍준표를 만나기 위해서였다. 두 사람은 오래전 같은 보수 정당의 대표를 차례로 지낸 사이였다. 서로를 깎아내린 날도 많았고, 같은 선거에서 함께 웃은 날도 있었다.\n\n탄핵 뒤 홍준표를 따르던 의원들은 흩어졌지만 아주 사라지지는 않았다. 헌정회복연대 안에도, 바깥의 작은 당들에도 그의 사람들이 남아 있었다. 개헌안이 이백 석을 넘기려면 그 이름들이 필요했다. 정무수석은 그 명단을 가방에 넣고 대통령을 따라 기차에 올랐다.\n\n홍준표는 대통령의 이야기를 끝까지 들었다. 그리고 권력을 나누는 헌법은 권력을 가져 본 사람만이 그 무게를 안다고 했다. 자기는 그 무게에 눌려 물러났다고 덧붙였다. 그는 돕겠다고도, 돕지 않겠다고도 하지 않았다.\n\n돌아오는 기차에서 대통령은 도시락을 반쯤 남겼다. 다음 주 의원 몇이 조용히 찬성 쪽에 이름을 올렸다. 누가 전화를 걸었는지는 아무도 말하지 않았다. 홍준표는 그 뒤로도 개헌에 대해 공개적으로는 한마디도 하지 않았다."
 tfrkphn.7159.a:0 "빚을 하나 진다."
 tfrkphn.7159.b:0 "혼자 간다."
 tfrkphn.7160.t:0 "지키지 않은 약속"
 tfrkphn.7160.d:0 "헌정회복연대의 원내대표가 기자회견을 열었다. 그는 종이 한 장을 높이 들어 보였다. 몇 해 전 대통령과 연대 대표가 마주 앉아 나눈 약속을 정리한 메모였다. 대통령은 개헌 논의를 시작하겠다고 했고, 연대는 그 말을 믿고 표를 보탰다는 것이었다.\n\n기자들은 청와대의 답을 기다렸다. 대변인은 개혁의 일정이 먼저였다고만 했다. 틀린 말은 아니었지만, 연대 쪽에서 그 말을 변명 이상으로 듣는 사람은 없었다. 저녁 뉴스는 그 메모의 손글씨를 화면 가득 비췄다. 메모 끝에는 두 사람의 서명이 있었다.\n\n다음 날 연대 소속 장관 둘이 사표를 냈다. 본회의에 올라 있던 법안 세 건의 표결이 미뤄졌다. 연정은 깨지지 않았지만, 금이 간 자리는 누구 눈에나 보였다. 청와대 정무수석이 연대 의원들에게 전화를 돌렸지만 받는 사람은 적었다.\n\n김무성은 그날 기자들 앞에 서지 않았다. 그는 저녁에 대통령에게 짧은 문자를 보냈다고 전해졌다. 그 문자에 무엇이 적혀 있었는지는 끝내 알려지지 않았다. 다음 대선을 앞둔 신민당의 셈이 그날부터 달라졌다."
 tfrkphn.7160.a:0 "금을 메운다."
 tfrkphn.7160.b:0 "버틴다."
 TFRKPHN_mx_kbg_amend:0 "개헌 논의 기구를 연다"
 TFRKPHN_mx_kbg_amend_desc:0 "헌정회복연대와 한 약속대로 권력 구조를 다룰 논의 기구를 엽니다. 늦으면 연대의 인내가 다합니다."
 TFRKPHN_mx_kdy_amend:0 "개헌 논의 기구를 연다"
 TFRKPHN_mx_kdy_amend_desc:0 "헌정회복연대와 한 약속대로 권력 구조를 다룰 논의 기구를 엽니다. 늦으면 연대의 인내가 다합니다."
 TFRKPHN_mx_kbg_appeal:0 "여론에 호소한다"
 TFRKPHN_mx_kbg_appeal_desc:0 "대통령이 직접 방송에 나와 개혁의 이유를 설명합니다.\n\n§Y개혁 저항§!: [?TFRKPHN_kbg_resist|0] / 100. §R80§!이 되면 역풍이 붑니다."
 TFRKPHN_mx_kbg_compromise:0 "반발 세력과 타협한다"
 TFRKPHN_mx_kbg_compromise_desc:0 "속도를 늦추는 대신 반발을 누그러뜨립니다. 개혁을 기다리던 사람들은 실망합니다.\n\n§Y개혁 저항§!: [?TFRKPHN_kbg_resist|0] / 100"
 TFRKPHN_mx_kdy_repay:0 "국채를 앞당겨 갚는다"
 TFRKPHN_mx_kdy_repay_desc:0 "남는 세수를 모아 빚부터 갚습니다.\n\n§Y나라 빚§!: [?TFRKPHN_kdy_debt|0] / 100. 갚지 않으면 이자가 붙습니다."
 TFRKPHN_mx_kdy_sell:0 "공기업을 판다"
 TFRKPHN_mx_kdy_sell_desc:0 "덩치 큰 공기업을 팔아 빚을 갚습니다. 일자리를 잃는 사람이 생깁니다.\n\n§Y나라 빚§!: [?TFRKPHN_kdy_debt|0] / 100"
 TFRKPHN_mx_kdy_gold:0 "금 모으기 운동"
 TFRKPHN_mx_kdy_gold_desc:0 "장롱 속의 금반지와 돌반지가 은행 창구로 모입니다. 한 번뿐입니다.\n\n§Y나라 빚§!: [?TFRKPHN_kdy_debt|0] / 100"
 TFRKPHN_mx_kms_snd:0 "신민당 의원을 설득한다"
 TFRKPHN_mx_kms_snd_desc:0 "야당 의원들을 한 사람씩 만나 개헌안의 조문을 함께 고칩니다.\n\n§Y개헌 찬성§!: [?TFRKPHN_kms_votes|0]석 / §Y200석§! 필요"
 TFRKPHN_mx_kms_ind:0 "무소속을 끌어온다"
 TFRKPHN_mx_kms_ind_desc:0 "무소속 의원들의 지역 사업을 챙겨 주고 표를 얻습니다.\n\n§Y개헌 찬성§!: [?TFRKPHN_kms_votes|0]석 / §Y200석§! 필요"
 TFRKPHN_mx_kms_district:0 "선거구를 내준다"
 TFRKPHN_mx_kms_district_desc:0 "중대선거구제를 받아들여 작은 당들의 표를 얻습니다. 연대 안에서 불만이 나옵니다. 한 번뿐입니다.\n\n§Y개헌 찬성§!: [?TFRKPHN_kms_votes|0]석 / §Y200석§! 필요"
 TFRKPHN_mx_kms_elders:0 "원로 정치"
 TFRKPHN_mx_kms_elders_desc:0 "총리 자리를 나눈 원로들이 자기 계파의 표를 몰아줍니다. 한 번뿐입니다.\n\n§Y개헌 찬성§!: [?TFRKPHN_kms_votes|0]석 / §Y200석§! 필요"
