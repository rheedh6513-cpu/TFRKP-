l_korean:
 # [안내] 포격 뒤 줄기의 삼김 사건. cho_build.py(cho4_part.py)가 만든다.
 tfrkphn.7183.t:0 "차 유리"
 tfrkphn.7183.d:0 "김무성 의원은 국회 본회의에서 사십 분 동안 연설했다. 대통령이 불출마를 뒤집은 일과 동원된 집회를 하나씩 짚었고, 통장이 돌린 밀가루 포대를 단상에 올려놓았다. 여당 의석에서 고함이 나왔고 방송은 중계를 끊었다. 그는 젊은 날 야당 총재 밑에서 정치를 배운 사람이었다.\n\n엿새 뒤 아침 그의 차가 집 앞 골목을 빠져나올 때 청년 셋이 길을 막았다. 한 명이 뒷좌석 문을 열려고 했고, 문이 잠겨 있자 다른 한 명이 병을 던졌다. 병은 창틀에 맞아 깨졌다. 차 유리와 문짝의 칠이 연기를 내며 녹아내렸다.\n\n병에 든 것은 질산이었다. 운전기사는 차를 멈추지 않고 국회까지 몰았다. 김무성은 녹은 차를 본청 앞에 세워 두고 기자들을 불렀다. 그는 이 병이 어디서 나왔는지 온 국민이 안다고 말했다.\n\n경찰은 수사본부를 차렸지만 청년 셋을 찾지 못했다. 내무부는 야당의 자작극일 가능성도 살핀다고 발표했다. 차는 한 달 동안 본청 앞에 서 있었고, 의원들은 출근길에 그 옆을 지나갔다. 지나가던 시민들이 차 사진을 찍어 갔다."
 tfrkphn.7183.a:0 "수사는 계속된다고 발표한다."
 tfrkphn.7184.t:0 "닷새"
 tfrkphn.7184.d:0 "팔월의 어느 낮 한 시쯤, 김부겸은 도쿄의 한 호텔 이십이 층에서 점심을 마치고 복도로 나왔다. 건장한 남자 대여섯이 그를 옆방으로 끌고 들어갔다. 방에는 마취약 냄새가 남았고 배낭 두 개와 긴 밧줄이 발견됐다.\n\n그는 차에 실려 이튿날 항구에서 화물선으로 옮겨졌다. 배 위에서 손발이 묶이고 눈이 가려졌다. 발목에는 무거운 추가 달렸다. 그는 나중에, 갑판으로 끌려 나갔을 때 머리 위에서 비행기 소리가 났고 그 뒤 남자들이 추를 풀었다고 말했다.\n\n일본 경찰은 그날 오후부터 항구와 공항을 막았고, PDTO 사무국은 서울에 그의 안전을 묻는 전문을 보냈다. 닷새 뒤 밤 그는 서울 자기 집 대문 앞에서 발견됐다. 눈에는 붕대가 감겨 있었고 입술이 터져 있었다.\n\n정부는 사건과 관계가 없다고 발표했다. 호텔 방에서 나온 지문 하나가 대사관 일등 서기관의 것이라는 일본 경찰의 발표는 국내 신문에 실리지 않았다. 일본 정부는 주권을 침해당했다고 항의했고 국무총리가 도쿄에 가서 유감을 전했다. 그날부터 그의 집 앞에 경찰 버스가 섰다."
 tfrkphn.7184.a:0 "관계없는 일이라고 발표한다."
 tfrkphn.7185.t:0 "스물사흘"
 tfrkphn.7185.d:0 "김무성은 의원직에서 제명됐다. 외국 신문과 만나 이 정권을 더는 돕지 말라고 말한 것이 이유였다. 표결은 여당 의원들만 모인 별실에서 십 분 만에 끝났다. 그는 집으로 돌아갔고 대문 밖으로 나갈 수 없게 됐다.\n\n봄에 그는 다섯 가지를 요구하며 밥을 끊었다. 갇힌 사람들을 풀고, 정치 활동 금지를 없애고, 대통령을 국민이 직접 뽑게 하라는 요구였다. 여드레째에 정부는 그를 대학 병원으로 옮겼다. 그는 병실에서도 링거를 거부했다. 몸무게는 열나흘 만에 십사 킬로그램이 빠졌다.\n\n신문과 방송은 이 일을 한 줄도 쓰지 못했다. 한 신문이 열하루째에 정치 현안이라는 네 글자로 돌려 적었고, 사람들은 그 뜻을 물어물어 알았다. 여당 사무총장이 병실을 찾아 외국에 나가 쉬라고 권하자, 그는 자신을 시체로 만들어 부치면 된다고 답했다. 병원 앞에는 날마다 꽃을 든 사람이 늘었다.\n\n스물사흘째 되는 날 그는 단식을 풀며 앉아서 죽기보다 서서 싸우겠다고 말했다. 석 달 뒤 외국에 있던 김부겸이 그와 함께 이름을 올린 성명이 복사지로 돌았다."
 tfrkphn.7185.a:0 "기사는 한 줄도 나가지 않는다."
 tfrkphn.7186.t:0 "자의 반"
 tfrkphn.7186.d:0 "수출 진흥 회의에서 숫자를 읽는 사람은 김동연 경제부총리였다. 그는 상업고등학교를 나와 은행에 다니며 야간 대학을 마치고 고시에 붙은 관료였다. 대통령은 정당에 몸담은 적이 없는 그를 불러 경제를 맡겼다. 장관들은 그를 회의에서 가장 먼저 오고 가장 늦게 가는 사람으로 기억했다.\n\n성장률이 오를수록 그의 이름이 신문에 자주 났다. 지방 공단 준공식에서는 대통령보다 그에게 사람이 더 몰렸다. 여론조사 기관 한 곳이 다음 지도자를 묻는 조사에 그의 이름을 넣었다가 사흘 뒤 세무 조사를 받았다.\n\n그는 치안 예산을 줄여 해고된 노동자를 돕자는 보고서를 올렸다. 보고서는 대통령 책상까지 가지 못했다. 다음 주 그는 사표를 냈고, 공항에서 기자들에게 자의 반 타의 반으로 떠난다고 말했다. 대통령은 사표를 그날로 받았다.\n\n그는 외국 대학의 연구실에서 두 해를 보냈다. 돌아온 뒤에는 공직을 맡지 않고 지방을 돌며 강연을 했다. 강연장 뒤쪽에는 늘 같은 남자 둘이 앉아 받아 적었다. 김부겸과 김무성이 그에게 편지를 보냈다는 소문이 돌았다."
 tfrkphn.7186.a:0 "후임 부총리를 임명한다."
 tfrkphn.7187.t:0 "세 사람"
 tfrkphn.7187.d:0 "과도 정부는 대통령 선거를 넉 달 뒤로 잡았다. 김부겸은 집 앞의 경찰 버스가 떠난 날 대문을 열고 나와 기자들 앞에 섰다. 김무성은 유리가 녹았던 그 차를 고쳐 타고 제명됐던 국회로 돌아왔고, 김동연은 시위 중에 귀국해 서울에 사무실을 냈다.\n\n세 사람은 광장에서 같은 편이었다. 시위 엿새 동안 김무성은 맨 앞줄에서 최루탄을 맞았고, 김부겸은 갇힌 집 담 너머로 성명을 읽었으며, 김동연은 넥타이를 맨 회사원들의 줄에 섞여 걸었다.\n\n후보 등록을 석 달 앞두고 세 사람은 한 음식점에서 만났다. 김부겸은 납치와 연금을 겪은 사람이 먼저 나서야 한다고 했고, 김무성은 단식으로 길을 연 사람이 누구냐고 물었다. 김동연은 나라 살림을 아는 사람이 필요하다고 말했다. 식사는 네 시간 이어졌고 발표문은 나오지 않았다.\n\n옛 여당은 그사이 이름을 바꾸고 후보를 냈다. 여론조사에서 그 후보의 지지율은 30퍼센트였고 세 사람의 지지율을 합치면 65퍼센트였다. 음식점 주인은 세 사람이 다음 주에 같은 방을 다시 잡았다고 기자들에게 말했다."
 tfrkphn.7187.a:0 "다음 주 목요일 저녁 일곱 시."
 tfrkphn.7203.t:0 "빈 결재란"
 tfrkphn.7203.d:0 "과도 정부는 첫 달에 사건 기록 세 건을 다시 열었다. 김무성의 차에 던진 질산 병, 김부겸이 끌려간 호텔, 단식 때 신문사에 내려간 지침이었다. 기록은 경찰청 지하 문서고의 철제 선반에 사건 번호 없이 꽂혀 있었다.\n\n질산 병 사건의 기록은 열두 쪽이었다. 수사본부는 석 달 동안 목격자 넷을 불렀고 골목의 방범 카메라 영상은 확보하지 않았다. 병 조각의 감정서에는 공업용 질산이라는 한 줄만 있었다. 본청 앞에 한 달 서 있던 차는 경찰 창고에서 찾아냈다.\n\n납치 사건의 기록에는 화물선의 출항 신고서가 붙어 있었다. 배의 주인은 주소지에 사무실이 없는 회사였다. 현지 경찰이 보낸 지문 감정서는 봉투도 뜯기지 않은 채였다. 김부겸은 조사관에게 추를 달았던 발목의 흉터를 보여 주었다.\n\n신문사에 내려간 지침은 원본이 남아 있지 않았다. 한 편집국장이 그때 받아 적은 수첩을 들고 나왔다. 세 기록 어디에도 지시한 사람의 이름은 없었다. 조사관들은 결재란이 비어 있는 서류를 복사해 국회에 보냈고, 국회는 특별 조사 위원회를 꾸렸다."
 tfrkphn.7203.a:0 "빈 결재란을 그대로 공개한다."
 tfrkphn.7204.t:0 "지팡이"
 tfrkphn.7204.d:0 "김부겸은 조기 대선에서 진 뒤에도 유세를 다녔다. 지방선거 지원 유세를 가던 밤 국도에서 화물 트럭이 그의 차를 들이받았다. 그는 골반을 다쳤고 그 뒤로 지팡이를 짚었다. 경찰은 운전 부주의로 결론을 냈다.\n\n가을에 그는 다리를 치료하러 도쿄로 갔다. 그가 병원에 있는 동안 정부는 지방선거를 무기한 미루고 정당의 옥외 집회를 금지했다. 측근들은 전화로 지금 돌아오면 공항에서 바로 끌려간다고 전했다.\n\n그는 호텔 방에서 성명을 냈다. 돌아가지 않고 밖에서 싸우겠다는 내용이었다. 일본 정부는 체류를 허가했다. 그는 도쿄와 오사카를 오가며 교민들 앞에서 연설했고, PDTO 회원국의 의원들을 찾아다니며 이 정권에 대한 지원을 다시 따져 보라고 말했다. 연설이 끝나면 그는 지팡이를 짚고 맨 뒷줄까지 걸어가 악수했다.\n\n정부는 그의 여권을 무효로 했다. 대사관은 강연장마다 직원을 보내 참석자의 이름을 적었다. 그해 여름 그는 교민 단체의 결성 대회를 닷새 앞두고 있었다. 대회장으로 빌린 강당에는 의자 팔백 개가 놓였다."
 tfrkphn.7204.a:0 "여권을 무효로 한다."
 tfrkphn.7206.t:0 "엽서"
 tfrkphn.7206.d:0 "봄에 김부겸은 재야 인사들과 함께 성당 미사에서 선언문을 읽었다. 집회 금지를 풀고 갇힌 사람들을 내보내라는 내용이었다. 그는 연금된 집에서 끌려 나와 감옥으로 갔다. 함께 기소된 사람은 열여덟 명이었다.\n\n이듬해 남쪽 도시에서 큰 시위가 일어나자 군 검찰은 그가 뒤에서 내란을 꾸몄다고 기소했다. 군사 재판은 사형을 선고했다. 그는 최후 진술에서 자신이 죽더라도 정치 보복은 다시 없어야 한다고 말했다.\n\nPDTO 회원국 정부들이 차례로 성명을 냈고, 일본 총리는 형이 집행되면 협력을 이어 가기 어렵다고 전했다. 대통령은 형을 무기 징역으로, 다시 이십 년으로 줄였다. 그는 감옥에서 엽서 한 장에 깨알 같은 글씨로 가족에게 편지를 썼다. 엽서는 한 달에 한 장만 허락됐다.\n\n두 해 뒤 겨울 정부는 병을 치료한다는 조건으로 그를 풀어 비행기에 태웠다. 그는 공항에서 기자를 만나지 못했다. 비행기 문이 닫힐 때까지 요원 둘이 양옆에 앉아 있었다. 그가 내린 곳은 PDTO 회원국의 수도였고, 그는 그곳 대학에서 연구원 자리를 얻었다."
 tfrkphn.7206.a:0 "치료를 조건으로 내보낸다."
 tfrkphn.7205.t:0 "공항"
 tfrkphn.7205.d:0 "김부겸은 망명 두 해 만에 돌아가겠다고 발표했다. 정부는 돌아오면 남은 형기를 살게 하겠다고 경고했다. 측근들은 공항에서 무슨 일이 날지 모른다고 말렸다. 그는 예정한 날짜를 바꾸지 않았다.\n\n비행기에는 PDTO 회원국의 의원 둘과 전직 대사, 인권 단체 사람들과 기자까지 서른일곱 명이 함께 탔다. 그들은 그의 앞뒤 좌석을 채웠고, 내리면 그를 둘러싸고 걷기로 했다. PDTO 사무국의 외교관 한 명이 수첩을 들고 맨 앞에 섰다.\n\n문이 열리자 사복 차림의 남자 오십여 명이 통로로 밀고 들어왔다. 그들은 동행한 사람들을 밀쳐 내고 김부겸 부부를 승강기에 태웠다. 의원 한 명이 바닥에 쓰러졌고 외교관의 수첩은 발에 밟혔다. 그는 승합차에 실려 집으로 갔고 대문에는 다시 경찰이 섰다.\n\n공항 밖에는 수만 명이 나와 있었지만 그를 보지 못했다. PDTO 회원국들은 대사를 불러 항의했다. 신문은 그의 귀국을 일 단짜리 기사로 실었다. 나흘 뒤 치러진 총선에서 김무성을 따르는 사람들이 급히 만든 신당은 창당 스물닷새 만에 제1야당이 됐다."
 tfrkphn.7205.a:0 "동행한 사람들에게 유감을 전한다."
 tfrkphn.7207.t:0 "사 층 강당"
 tfrkphn.7207.d:0 "문을 닫은 봉제 공장의 여공 백팔십칠 명이 야당 당사 사 층 강당에 들어와 앉았다. 사장은 밀린 월급을 두고 외국으로 떠난 뒤였다. 노동청도 은행도 그들을 만나 주지 않았다. 김무성은 강당에 올라가 여기까지 온 사람들을 내보내지 않겠다고 말했다.\n\n사흘째 새벽 두 시 경찰 천여 명이 당사를 에워쌌다. 그들은 현관 셔터를 뜯고 계단으로 올라왔다. 여공들은 서로 팔을 끼고 노래를 불렀다. 강당이 비는 데는 이십삼 분이 걸렸다.\n\n의원들과 기자들이 복도에서 맞았다. 당 대변인은 코뼈가 부러졌다. 김무성은 양팔이 잡힌 채 끌려 나와 승용차에 실려 집으로 보내졌다. 스물한 살 여공 한 명이 건물 뒤편 바닥에서 숨진 채 발견됐다. 경찰은 스스로 뛰어내렸다고 발표했다.\n\n김무성은 그날 아침 당사로 돌아와 깨진 유리 위에서 기자들을 만났다. 한 달 뒤 법원은 그의 당 대표 직무를 정지시켰다. 그는 외국 신문 기자를 집으로 불러 이 정권을 더는 돕지 말라고 말했다. 여당은 그 발언을 문제 삼아 징계안을 냈다."
 tfrkphn.7207.a:0 "징계안을 본회의에 올린다."
 tfrkphn.7208.t:0 "각서"
 tfrkphn.7208.d:0 "김동연은 외국에서 돌아와 지방을 돌며 강연하고 있었다. 봄의 어느 새벽 수사관들이 그의 집에 와서 그를 차에 태웠다. 그는 수사 기관의 지하 조사실에서 사십육 일을 보냈다. 가족은 그가 어디 있는지 듣지 못했다. 조사실에는 창이 없었고 전등은 밤에도 꺼지지 않았다.\n\n정부는 공직에 있으면서 재산을 부당하게 불린 사람들의 명단을 발표했다. 그의 이름이 맨 위에 있었다. 근거가 된 서류는 공개되지 않았다. 신문은 발표문을 한 글자도 고치지 않고 실었다. 방송은 그의 집 대문을 사흘 동안 비췄다.\n\n그는 조사실에서 각서 두 장에 서명했다. 한 장은 집과 땅과 예금을 나라에 내놓는다는 내용이었고, 다른 한 장은 공직에서 물러나 정치를 하지 않겠다는 내용이었다. 각서의 날짜 칸은 비어 있었다. 그는 서명한 날 저녁에 풀려났다.\n\n가을에 정부는 정치 활동을 금지하는 사람 오백육십칠 명의 이름을 관보에 실었다. 김무성과 김부겸의 이름도 거기에 있었다. 김동연은 짐을 싸서 다시 외국으로 떠났다. 공항에는 예전 부하 직원 셋이 나와 있었다."
 tfrkphn.7208.a:0 "명단을 관보에 싣는다."
 tfrkphn.7188.t:0 "직통 전화"
 tfrkphn.7188.d:0 "한 해에 한 번 대통령은 생방송으로 국민의 전화를 받았다. 방송은 정오에 시작해 네 시간 넘게 이어졌고, 그동안 다른 채널도 같은 화면을 내보냈다. 접수된 질문은 이백만 건이었다. 질문을 고르는 일은 청와대 홍보실이 석 달 전부터 준비했다.\n\n강원도 어느 마을의 할머니가 마을에 수도가 아직 안 들어왔다고 말했다. 대통령은 군수의 이름을 물었다. 그날 저녁 뉴스에는 굴착기가 마을 길을 파는 장면이 나왔고 군수는 다음 날 사표를 냈다. 전국의 군수들은 방송 날이 다가오면 묵은 민원 서류를 다시 뒤졌다.\n\n밀린 월급을 받게 해 달라는 공장 노동자, 딸의 수술비를 호소하는 어머니, 강아지를 갖고 싶다는 아홉 살 아이가 차례로 연결됐다. 대통령은 원고를 보지 않고 숫자를 외워서 답했다. 야당이나 선거를 묻는 전화는 연결되지 않았다.\n\n방송이 끝나면 여론조사 기관들은 지지율이 사 점쯤 올랐다고 발표했다. 한 지방 신문 기자가 일 년 뒤 그 마을을 다시 찾았다. 수도는 할머니 집까지만 들어와 있었다. 후임 군수는 그 마을에 가지 않았다."
 tfrkphn.7188.a:0 "다음 전화를 받는다."
 tfrkphn.7189.t:0 "스물네 글자"
 tfrkphn.7189.d:0 "새 법은 외국에서 돈을 받는 단체와 언론을 외국 대리인이라고 불렀다. 그들은 법무부에 등록하고 석 달마다 회계 장부를 내야 했다. 내놓는 글과 영상에는 맨 위에 스물네 글자짜리 문구를 큰 글씨로 달아야 했다. 문구는 이 글은 외국 대리인이 만들었다는 내용이었다.\n\n처음 등록된 곳은 선거 감시 단체였다. 지난 선거 때 개표소 사진을 모아 지도에 올린 단체였고, 외국 재단에서 받은 돈은 사무실 석 달 치 월세였다. 다음 해에는 여론조사 기관과 인권 변호사 모임, 실종 군인 가족 모임이 명단에 올랐다.\n\n명단에 오른 단체에는 광고가 끊겼고 건물 주인은 계약을 연장하지 않았다. 학교는 그 단체 사람을 강사로 부르지 못했다. 한 인터넷 신문은 기사마다 문구를 달다가 독자가 줄어 일 년 만에 문을 닫았다. 기자들은 마지막 기사에도 그 문구를 달았다.\n\n명단은 삼 년 만에 사백 곳을 넘었고 개인도 오를 수 있게 법이 고쳐졌다. 한 대학생은 외국에 사는 이모에게 생일 용돈을 받았다가 명단에 올랐다. 그는 그 뒤 쓰는 글마다 그 문구를 달았다."
 tfrkphn.7189.a:0 "명단을 관보에 싣는다."
