l_korean:
 # [안내] 김부겸 좋은 결말 [사람이 씀: 본문]. kbg_end_build.py가 만든다.
 tfrkphn.7163.t:0 "마이크는 하나만"
 tfrkphn.7163.d:0 "\"마지막까지 꽤 싱겁게 끝나네요.\" 김부겸이 빈 종이컵을 구기며 말했다. 지난번에는 문을 걸어 잠그고 다섯 주를 끌었던 협상이었다. 오늘은 커피가 채 식기도 전에 도장이 찍혔다. 맞은편에 앉은 김동연은 숫자 몇 줄이 적힌 수첩을 덮어 안주머니에 넣었다.\n\n대변인이 서류철 두 개를 안은 채 방으로 들어섰다. 원래대로라면 아래층에서 읽혔어야 할 원고들이었다. \"기자실에 발 디딜 틈이 없습니다. 저쪽에서도 회의를 멈추고 중계 켜 놨답니다.\" 당연한 일이었다. 어제까지만 해도 여의도에서는 오늘 이 건물이 정확히 두 동강 날 거라는 데 판돈이 몰려 있었다. 따로 나갔다가 남 좋은 일 시킨 꼴을 몇 년 전에 똑똑히 보고도 그랬다.\n\n\"마이크는 하나만.\" 김동연이 서류철 두 개 중 하나만 골라 대변인 앞으로 도로 밀었다. \"회견도 한 번만 합시다.\" 대변인이 멈칫하더니 곧장 고개를 숙였다. 돌아서는 등 뒤로 김부겸이 손짓하며 한마디를 얹었다. \"유세차도 한 대로 합쳐서 다시 짜라고 해요. 기름값 아끼게.\"\n\n대변인이 나가고 얼마 지나지 않아 계단 아래쪽이 소란스러워졌다. 두 번째 연단이 밖으로 끌려 나오는 모양이었다. 분당 시그널로 알아들은 모양인지 선반 위 모니터에서는 '분당 초읽기' 라는 속보 자막이 올라오고 있었다. 화면 속 기자들이 전화기를 붙잡고 복도로 뛰어나가는 풍경이 퍽 볼만했다. \"다음번에도 오늘처럼 조용히 넘어가면 좋겠습니다만.\" 양복 단추를 잠그며 일어선 김동연의 말에 김부겸이 헛웃음을 쳤다. \"꿈도 야무지십니다. 그때 가선 또 멱살 잡겠지.\"\n\n회견 직전, 갑자기 김동연이 탁자 위에 남은 나머지 서류철을 집더니 잠시 머뭇거렸다. 뒤따라 일어난 김부겸이 고개를 갸웃하며 물었다. \"미련이라도 남으셨습니까?\" 주머니에서 라이터 하나를 꺼낸 김동연이 안경을 추켜올리며 답했다.\n\n후련해서."
 tfrkphn.7163.a:0 "회견장으로 내려간다."
 TFRKPHN_kbg_good_tt:0 "신민당이 §Y김동연§!을 단일 후보로 세웁니다. 다음 대선을 한 후보로 치릅니다."
 TFRKPHN_kbg_bad_tt:0 "신민당이 다음 대선 후보를 하나로 정하지 못합니다."
