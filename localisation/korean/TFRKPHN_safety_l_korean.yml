l_korean:
 TFRKPHN_sf_category:0 "오세이돈"
 TFRKPHN_sf_category_desc:0 "2010년과 2011년 여름 서울이 물에 잠기자 사람들은 그를 바다의 신에 빗대 오세이돈이라고 불렀다. 2011년 7월 우면산 산사태 뒤에는 폭우를 내다보고 대비하지 못했다며 직접 사과했다. 이제 그 별명을 대비로 지운다.\n\n재난은 미리 갖춘 만큼 덜 아프다. 결정으로 대비 점수를 쌓아 두면 장마와 태풍 때 피해가 줄어든다.\n\n지금 대비 점수: §Y[?TFRKPHN_sf|0]§! / 100 (§Y60§!을 넘으면 재난을 잘 막아 냅니다)\n점수마다 §G안정도 0.05퍼센트§!가 오른다."
 TFRKPHN_sf_tunnel:0 "대심도 빗물터널"
 TFRKPHN_sf_tunnel_desc:0 "2022년 8월 서울시가 내놓은 계획처럼, 상습 침수 지역 땅 밑 깊은 곳에 큰 빗물 터널을 뚫는다. 180일 동안 §Y민수공장 1개§!가 묶인다."
 TFRKPHN_sf_tunnel_tt:0 "180일 뒤 대비 점수 §G+25§!"
 TFRKPHN_sf_banjiha:0 "반지하 정리"
 TFRKPHN_sf_banjiha_desc:0 "물이 차면 빠져나오기 어려운 지하와 반지하 집에 사는 사람들을 지상의 집으로 옮긴다."
 TFRKPHN_sf_banjiha_tt:0 "120일 뒤 대비 점수 §G+15§!"
 TFRKPHN_sf_crowd:0 "인파 관리 매뉴얼"
 TFRKPHN_sf_crowd_desc:0 "큰 행사와 축제 때 사람이 몰리는 곳을 미리 정하고, 경찰과 지자체가 할 일을 순서대로 적어 둔다."
 TFRKPHN_sf_crowd_tt:0 "60일 뒤 대비 점수 §G+10§!"
 TFRKPHN_sf_seismic:0 "지하철 내진 보강"
 TFRKPHN_sf_seismic_desc:0 "오래된 지하철 구간과 다리를 지진에 버티게 보강한다. 120일 동안 §Y민수공장 1개§!가 묶인다."
 TFRKPHN_sf_seismic_tt:0 "120일 뒤 대비 점수 §G+15§!"
 TFRKPHN_sf_alert:0 "재난 문자 체계 정비"
 TFRKPHN_sf_alert_desc:0 "재난 문자가 늦거나 틀리지 않게 보내는 순서를 다시 짠다."
 TFRKPHN_sf_alert_tt:0 "60일 뒤 대비 점수 §G+10§!"
 TFRKPHN_sf_drill:0 "재난 훈련"
 TFRKPHN_sf_drill_desc:0 "학교와 회사, 지하철에서 대피 훈련을 연다. 되풀이할 수 있다."
 TFRKPHN_sf_drill_tt:0 "60일 뒤 대비 점수 §G+5§!"
 TFRKPHN_sf_learn_tt:0 "이번 일을 매뉴얼에 적어 대비 점수 §G+5§!"
 TFRKPHN_safety:0 "오세이돈은 옛말"
 TFRKPHN_safety_desc:0 "미리 갖춘 대비가 민심을 안정시킨다."
 tfrkphn.6976.t:0 "장마"
 tfrkphn.6976.d:0 "장마 전선이 수도권에 걸려 하루에 한 달 치 비가 쏟아졌다. 강남역 일대 땅 밑의 빗물터널이 처음으로 제 몫을 했다. 도로 몇 곳이 잠깐 잠겼지만 물은 몇 시간 만에 빠졌고, 반지하에서 옮겨 간 사람들의 집은 젖지 않았다.\n\n재난 문자는 비가 쏟아지기 한 시간 전에 나갔다. 다음 날 아침 출근길은 평소와 다르지 않았다."
 tfrkphn.6976.d2:0 "장마 전선이 수도권에 걸려 하루에 한 달 치 비가 쏟아졌다. 저지대 도로가 잠기고 차들이 물에 떠다녔다. 반지하 집에는 물이 허리까지 찼고, 몇몇 집에서는 사람들이 창문으로 겨우 빠져나왔다.\n\n재난 문자는 물이 이미 들어찬 뒤에야 나갔다. 야당은 매뉴얼은 어디 있었느냐고 따졌다."
 tfrkphn.6976.a:0 "오세이돈은 옛말이다."
 tfrkphn.6976.b:0 "다음에는 미리 막는다."
 tfrkphn.6977.t:0 "태풍"
 tfrkphn.6977.d:0 "큰 태풍이 남해안에 올라왔다. 사흘 전부터 어선이 항구로 돌아왔고, 해안가 주민들은 미리 대피소로 옮겼다. 바람에 간판 몇 개가 떨어지고 정전이 잠깐 이어졌지만 크게 다친 사람은 없었다.\n\n지자체들은 매뉴얼에 적힌 순서대로 움직였고, 복구는 이틀 만에 끝났다."
 tfrkphn.6977.d2:0 "큰 태풍이 남해안에 올라왔다. 대피 명령이 늦게 나가는 바람에 해안가 마을 몇 곳이 고립됐다. 지하 주차장에 물이 차서 차를 빼러 내려간 주민들이 위험에 빠졌다가 가까스로 구조됐다.\n\n어느 기관이 무엇을 해야 하는지를 두고 책임 공방이 이어졌다."
 tfrkphn.6977.a:0 "대비가 통했다."
 tfrkphn.6977.b:0 "다음에는 미리 막는다."
