l_korean:
 # 신남방정책 탭. nsp_build.py가 만든다.
 TFRKPHN_nsp_category:0 "신남방정책"
 TFRKPHN_nsp_category_desc:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n동남아시아는 중국이 이끄는 진영과 태평양 방위 조약기구가 서로 끌어당기는 곳이다. 일본이 벌이는 영향력 경쟁에 우리도 힘을 보탠다. 어느 진영에도 들지 않은 나라에 협력 사업을 벌이면 그 나라에서 우리 진영의 영향력이 오른다. 영향력이 충분히 쌓인 나라는 일본이 조약기구로 부를 수 있다."
 TFRKPHN_nsp_influence:0 "[FROM.GetNameDef]: 신남방 협력 사업"
 TFRKPHN_nsp_influence_desc:0 "[FROM.GetNameDef]에 공장과 도로를 짓고 유학생과 연수생을 받는다. 2017년 11월 문재인 대통령이 자카르타에서 내놓은 신남방정책이 하던 일이고, 이번에는 일본과 발을 맞춘다."
 TFRKPHN_nsp_need_tt:0 "일본이 우리와 같은 진영에 있고 동남아시아에서 영향력 경쟁을 벌이고 있음"
 TFRKPHN_nsp_wait_tt:0 "§Y40일§! 동안 사업이 이어진다."
 TFRKPHN_nsp_fx_tt:0 "[FROM.GetNameDef]에서 §Y태평양 방위 조약기구§! 쪽 영향력 §G+10§! (일본이 한 번에 올리는 양은 15)\n[FROM.GetNameDef]의 우리에 대한 관계 §G+15§!"
