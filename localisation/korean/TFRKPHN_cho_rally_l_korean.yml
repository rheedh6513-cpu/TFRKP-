l_korean:
 # [안내] 조원진 정부 결정 탭 토요일 광장. cho_build.py(cho_rally_part.py)가 만든다.
 TFRKPHN_cr_category:0 "토요일 광장"
 TFRKPHN_cr_category_desc:0 "이 정부는 국회에 기댈 곳이 없습니다. 기댈 곳은 토요일 오후 두 시의 광화문입니다. 아래 사진을 누르면 광장에 사람이 모입니다. 광장이 뜨거울수록 정치력과 전쟁 지지도가 따라오고, 식으면 함께 내려갑니다. 광장은 달마다 조금씩 식습니다."
 TFRKPHN_cr_top:0 "광장 §Y[?TFRKPHN_cr|0]§! / 100"
 TFRKPHN_cr_banner_tt:0 "광장 §Y[?TFRKPHN_cr|0]§!\n50을 넘는 1마다 정치력 획득 §G+0.3%§!, 전쟁 지지도 §G+0.05%§!\n50을 밑돌면 그만큼 내려갑니다.\n달마다 §R4§!씩 식습니다."
 TFRKPHN_cr_modifier:0 "토요일 광장"
 TFRKPHN_cr_gain_tt:0 "광장이 달라집니다."
 TFRKPHN_cr_b1_tt:0 "§Y연단에 오른다§!\n대통령이 토요일 집회의 연단에 직접 오릅니다.\n\n정치력 §R-20§!  광장 §G+10§!\n다시 누르려면 §Y30일§!을 기다려야 합니다."
 TFRKPHN_cr_b2_tt:0 "§Y밀가루를 돌린다§!\n통장과 반장을 통해 밀가루와 비누를 돌리고 버스를 댑니다.\n\n유동성 §R-20§!  광장 §G+15§!  안정도 §R-1%§!\n다시 누르려면 §Y45일§!을 기다려야 합니다."
 TFRKPHN_cr_b3_tt:0 "§Y질서 유지대§!\n완장을 찬 청년들이 집회장 둘레에 섭니다.\n\n정치력 §R-15§!  광장 §G+8§!  전쟁 지지도 §G+1%§!  안정도 §R-1%§!\n다시 누르려면 §Y60일§!을 기다려야 합니다."
 TFRKPHN_cr_b4_tt:0 "§Y광화문 국민대회§!\n연단에는 한국사 강사 출신 전한길이 섭니다. 국민대회가 박수로 받은 안건을 월요일 국무회의에 그대로 올립니다.\n\n광장 §R-20§!  정치력 §G+50§!\n광장이 §Y60§! 이상일 때 누를 수 있습니다.\n다시 누르려면 §Y60일§!을 기다려야 합니다."
