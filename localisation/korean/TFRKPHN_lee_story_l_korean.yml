 # 이인제 정부 이야기 이벤트. leestory_build.py가 만든다.
 tfrkphn.482.t:0 "생산 계획표"
 tfrkphn.482.story:0 "이정훈이 새 공장에 처음 출근한 날이었다.\n\n정문에서 받은 사원증에는 생산기술부장 이정훈이라고 적혀 있었고, 그는 그것을 목에 걸고 한참 내려다보았다.\n\n자리에는 생산 계획표가 놓여 있었다. 쑤저우에서 세탁기 모터를 만들던 라인인데도 계획표의 품목은 절반이 무인기 모터였고, 납품처 칸에는 방위사업청과 폴란드 회사의 이름이 적혀 있었다.\n\n기계에는 중국어 안내문이 그대로 붙어 있었고, 쑤저우의 반장이 매직으로 적어 둔 숫자도 남아 있었다. 조임 값, 급유 주기, 고장 난 날짜.\n\n부장님, 이거 번역해서 다시 붙일까요.\n숫자는 그대로 둬. 십오 년 돌린 사람이 적은 거야.\n\n점심시간에 식당 텔레비전에서 뉴스가 나왔다. 유럽 나라들이 징병제를 되살리고 일본은 국방비를 두 배로 올린다는 소식에 이어, 동남아 나라들이 한국 공장에 탄약을 주문하러 줄을 섰다는 소식이 나왔다. 아나운서는 평화의 시대가 끝났다고 말했다.\n\n식당에서 고개를 든 사람은 없었다. 다들 그 주문으로 월급을 받는 사람들이었기 때문이다.\n\n오후에 정훈은 탕비실에서 믹스커피를 한 잔 탔는데, 이번에는 뭐라고 하는 사람이 없었다. 다섯 해 만에 얻은 일자리였고, 그 일자리가 어디서 왔는지를 그는 계획표를 보고 알았다."
 tfrkphn.482.a:0 "서진아, 아빠 오늘 회사 갔다 왔다"
 tfrkphn.482.tt:0 "§g오늘 공단 통근버스는\n중년의 남성들로 만원이었다.§!"
 tfrkphn.476.t:0 "넉 달"
 tfrkphn.476.story:0 "창원, 어느 기계 공장의 노조 사무실.\n\n점심시간이 끝나 가는데 벽의 텔레비전에서는 대통령이 고용 창출 전략회의를 주재하고 있었다. 젊은 조합원 하나가 채널을 돌리려 하자 지회장 최씨가 그냥 두라고 했다.\n\n\"지회장님, 저 사람 찍으셨다면서요.\"\n\n사무실이 조용해졌다. 최씨는 민주노총 조끼를 삼십 년 입었고, 선거 때마다 진보정당을 찍었다고 스스로 말해 온 사람이었다.\n\n\"찍었다.\"\n\n\"홍준표가 세운 사람인데요.\"\n\n최씨는 대답 대신 믹스커피를 저었다. 1998년 2월에 그는 스물아홉이었고, 딸이 백일을 갓 넘긴 때에 다니던 공장이 부도났다. 실업급여라는 말을 처음 들은 것은 노동사무소 창구에서였다. 넉 달 동안 나온 돈은 많지 않았어도 분유와 월세는 됐고, 그 넉 달 사이에 그는 지금 공장에 들어왔다.\n\n그 제도를 누가 들여왔는지는 나중에야 알았다. 파업한 사람한테도 생계비는 줘야 한다고 했다가 재계에 두들겨 맞은 1993년의 노동부 장관이었다.\n\n\"그 사람이 당을 몇 번 옮겼는지는 나도 안다. 나하고 생각이 다른 것도 안다.\"\n\n\"그런데요?\"\n\n\"빚이 있어서. 한 번은 갚아야지.\"\n\n최씨가 종이컵을 구기고 일어섰을 때, 텔레비전 속 대통령은 일자리 숫자를 읽고 있었다.\n\n\"대신 저 숫자 못 채우면 내가 제일 먼저 머리띠 맨다.\""
 tfrkphn.476.a:0 "숫자는 지켜보겠다"
 tfrkphn.477.t:0 "실업과의 전쟁"
 tfrkphn.477.story:0 "실업과 싸우는 법을 나는 한 번 만들어 본 적이 있다.\n\n1993년 12월 27일에 고용보험법이 만들어졌다. 내가 노동부 장관에서 물러난 그달이었다. 법은 세 가지 일을 한다. 일자리를 잃은 사람에게 실업급여를 준다. 사람을 내보내지 않는 기업에 고용안정 지원금을 준다. 실업자와 재직자에게 직업훈련을 시킨다. 처음 보험료는 임금의 0.6퍼센트였다. 사업주와 노동자가 절반씩 냈다. 급여는 30일에서 210일까지 나왔다.\n\n나는 그때부터 이 법의 한계를 알고 있었다. 실업급여는 다음 일터를 찾을 때까지 버티게 하는 돈이다. 다음 일터가 없으면 끝나는 날짜만 정해진 돈이 된다.\n\n지금 구직 창구 앞에는 군복을 벗은 수십만 명이 서 있다. 급여 창구를 늘려서는 저 줄이 줄지 않는다.\n\n늙은 노인이 전쟁을 하나 더 하겠다고 발표했다. 이번 상대는 실업이다."
 tfrkphn.477.a:0 "실업에 전쟁을 선포한다"
 tfrkphn.478.t:0 "좋은 일자리 100만 개"
 tfrkphn.478.story:0 "좋은 일자리. 과연 그것이 가능한 것인가.\n\n역대 정부들은 항상 일자리를 늘리겠다고 발표해 왔다. 나는 기억한다. 유신 반대를 하던 때의 박정희, 변호사 일을 하던 때의 전두환, 나를 정계로 끌어들인 김영삼, 그리고 끝내 승리한 김대중, 나와 싸운 노무현, 이명박, 박근혜, 그리고 문재인까지. 그들은 항상 좋은 일자리를 약속해 왔다.\n\n하지만 그들 가운데 진짜 좋은 일자리를 만든 사람은 없었다. 약속을 지키지 못했거나 수만 늘렸다. 나라고 다를 것 같지는 않다.\n\n하지만 이것은 내가 예전부터 약속한 것이다. 약속을 한 이상 실행은 해 봐야 한다. 그들과 나는 어깨를 나란히 하겠지만, 나는 시도라는 것을 해 본다.\n\n군수 공장을 민수로 돌린다. 전역 장병에게 직업훈련을 시키고 고용정보망을 넓힌다. 5년 안에 100만 개다.\n\n늙은 노인이 갑자기 회의를 연다고 발표했다."
 tfrkphn.478.a:0 "시도는 해 본다"
 tfrkphn.479.t:0 "고용보험 2.0"
 tfrkphn.479.story:0 "일자리 하나로 누구를 먹여 살리는가? 일자리 하나면 가정 하나를 먹일 수 있다. 그것이 고용보험이 만들어진 이유이다.\n\n하지만 지금 고용보험에는 실업급여만 타 먹는 사람들도 있고, 그 혜택을 누리지 못하는 자들도 있다. 임시직과 일용직, 프리랜서가 그렇다. 내가 설계한 것은 이런 것이 아니었다. 굶어 죽는 사람을 구하려고 만든 법이 돼지를 먹이기 시작했고, 굶주린 자는 계속 굶네.\n\n노인은 오랜만에 책을 읽고 글을 쓴다.\n\n§Y고용보험법 개정법§!"
 tfrkphn.479.a:0 "법을 다시 쓴다"
 tfrkphn.480.t:0 "기업하기 좋은 나라"
 tfrkphn.480.story:0 "기업하기 좋은 나라란 없다.\n\n미국이 붕괴했을 때 동쪽의 수출길이 막혔다. 중국이 침공을 시작하자 서쪽의 수출길이 막혔다. 지금 시기에 기업하기 좋은 나라란 없다.\n\n하지만 기업은 있어야 한다. 살기 힘들면 그만큼 돈을 벌어야 한다. 돈을 버는 법은 기업뿐이다.\n\n기업하기 좋은 나라가 없다면 직접 만들어야 한다. 규제는 교통신호등처럼 단순하고 분명하게 한다. 전시 통제 경제를 걷어 낸다. 정부보다 민간을, 대기업보다 중소기업을 앞에 둔다.\n\n늙은 노인이 규제 목록을 가져오라고 했다."
 tfrkphn.480.a:0 "직접 만든다"
 tfrkphn.481.t:0 "벤처 대국"
 tfrkphn.481.story:0 "코스닥은 1996년 7월에 문을 열었다. 미국의 나스닥을 본뜬 시장이었다. 공장도 담보도 없는 회사가 기술 하나로 돈을 구하는 곳이었다.\n\n2000년 3월 10일에 지수는 2,834까지 올랐다. 나는 그때 사람들이 회사 이름에 닷컴만 붙으면 돈을 넣는 것을 보았다. 2001년 말에 지수는 722였다. 2008년 10월에는 261까지 내려갔다. 돈을 잃은 사람들은 벤처라는 말만 들어도 고개를 돌렸다.\n\n거품은 꺼졌다. 하지만 그 거품 속에서 회사가 태어났다. 지금 우리가 쓰는 검색과 게임을 만든 회사들이 그 시장에서 돈을 구했다.\n\n전쟁은 무인기와 인공지능 기술을 앞당겼다. 그 기술이 지금 군 창고에 쌓여 있다. 창고의 기술을 민간으로 풀려면 돈이 모이는 곳이 다시 있어야 한다. 관광과 의료와 문화도 같은 돈을 기다린다.\n\n거품이 무섭다고 시장을 닫을 수는 없다. 이번에는 장부부터 본다.\n\n늙은 노인이 내일 거래소에 가겠다고 발표했다."
 tfrkphn.481.a:0 "개장 종을 다시 울린다"
 TFRKPHN_lee_story_476_tt:0 "이야기 이벤트 §Y넉 달§!이 일어납니다."
