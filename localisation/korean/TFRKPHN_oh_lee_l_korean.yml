l_korean:
 # 이인제 루트: 오세훈 이야기. oh_lee_build.py가 만든다.
 tfrkphn.576.t:0 "승복"
 tfrkphn.576.d:0 "1997년 7월 21일 신한국당 전당대회 결선에서 이인제는 이회창에게 졌다. 그는 그 자리에서 경선 결과에 승복한다고 말했고, 도정에만 전념하겠다고도 했다. 그해 9월 13일 그는 당을 떠나 민심의 바다에 뛰어들겠다며 출마를 선언했다. 그 뒤로 경선 불복이라는 말은 삼십 년 동안 그의 이름 앞에 붙어 다녔다.\n\n2027년 킨텍스에서 진 사람은 오세훈이다. 그는 결과가 나온 자리에서 연단에 올라 승복한다고 말했고, 선거가 끝날 때까지 유세차에 함께 올랐다. 시장직은 이미 내려놓은 뒤라 그에게 돌아갈 자리는 없었다.\n\n취임 뒤 대통령은 오세훈을 따로 불러 점심을 함께했다. 그 자리에서 대통령은 자기는 그때 그렇게 하지 못했다고 말했다. 오세훈이 무엇이라고 답했는지는 전해지지 않는다."
 tfrkphn.576.a:0 "빚을 졌다"
 tfrkphn.576.b:0 "진 사람에게도 일을 맡긴다"
 tfrkphn.577.t:0 "팻말과 넛지"
 tfrkphn.577.d:0 "2017년 3월 19일의 경선 토론에서 대통령은 독자 핵무장에 반대 팻말을 들었다. 두 해 뒤인 2019년 2월 17일 오세훈은 당 대표 후보 토론에서 우리도 핵을 개발한다고 하는 넛지 전략을 써야 한다고 말했다. 두 사람은 같은 당 안에서 가장 멀리 떨어진 자리에 서 있었다.\n\n정부가 핵 문제의 방향을 내놓자 오세훈이 신문에 글을 실었다. 북쪽의 핵이 사라진 것이 확인될 때까지는 물려받은 억지력에 손대지 말아야 하고, 내려놓는 순서는 상대가 먼저여야 한다는 내용이었다.\n\n대통령은 그 글을 오려서 보고서 맨 뒤에 붙여 두라고 했다. 생각은 다르지만 협상장에 들고 갈 반대 의견으로는 쓸 만하다는 것이었다."
 tfrkphn.577.a:0 "반대 의견도 협상의 재료다"
 tfrkphn.577.b:0 "정부의 길은 정해졌다"
 tfrkphn.578.t:0 "안심소득, 다시"
 tfrkphn.578.d:0 "오세훈은 서울시장 때 안심소득 시범사업을 시작했다. 중위소득 85퍼센트에 못 미치는 가구에 모자라는 소득의 절반을 현금으로 채워 주는 사업으로, 2021년 11월 11일에 정부 승인을 받았다.\n\n시장직에서 물러난 그는 그 사업의 결과 보고서를 들고 대통령을 찾아왔다. 대통령의 복지는 일자리가 먼저이고 고용보험과 복지카드가 그 뒤를 받친다. 일할 수 없거나 일해도 벌이가 모자라는 사람들이 그 사이로 빠진다는 것이 오세훈의 말이었다.\n\n대통령은 보고서를 끝까지 읽고 보건복지부에 넘겼다. 전쟁 빚을 갚는 동안에는 새 현금 사업을 벌이기 어렵다는 것이 재정 당국의 의견이다."
 tfrkphn.578.a:0 "빚을 갚은 뒤에 다시 본다"
 tfrkphn.578.b:0 "작은 규모로 먼저 해 본다"
 tfrkphn.579.t:0 "서울에서 배운 것"
 tfrkphn.579.d:0 "오세훈이 시장이던 2007년에 서울은 2010년 세계디자인수도로 뽑혔다. 한강 둔치를 고치고 동대문운동장 자리에 새 건물을 올리는 일도 그의 임기에 시작되었다. 돈을 너무 썼다는 비판과 도시가 달라졌다는 평가가 지금도 함께 따라다닌다.\n\n대통령은 그에게 북쪽 도시를 다시 짓는 일을 준비하는 위원회를 맡아 달라고 했다. 통일이 오면 평양과 신의주, 원산에는 상하수도와 전기, 집이 한꺼번에 필요하다. 시장직을 내려놓으며 서울에서 배운 것을 나라로 가져가겠다고 한 사람이니 그 말을 북쪽에서 써 보라는 것이었다.\n\n오세훈은 사흘 뒤에 맡겠다고 답했다. 조건은 위원회의 회의록을 모두 공개한다는 것 하나였다."
 tfrkphn.579.a:0 "회의록은 공개한다"
 tfrkphn.579.b:0 "실무는 국토교통부가 맡는다"
