 TFRKPHN_kv_lab_m3:0 "노동자 지지 §R-3§!"
 TFRKPHN_kv_lab_p10:0 "노동자 지지 §G+10§!"
 TFRKPHN_kv_lab_p2:0 "노동자 지지 §G+2§!"
 TFRKPHN_kv_lab_p4:0 "노동자 지지 §G+4§!"
 TFRKPHN_kv_lab_p5:0 "노동자 지지 §G+5§!"
 TFRKPHN_kv_lab_p6:0 "노동자 지지 §G+6§!"
 TFRKPHN_kv_lab_p8:0 "노동자 지지 §G+8§!"
 TFRKPHN_kv_vote_p3:0 "예상 득표율 §G+3§! (노동자 지지 50 기준. 지지가 높으면 더 오릅니다)"
 TFRKPHN_kv_vote_p4:0 "예상 득표율 §G+4§! (노동자 지지 50 기준. 지지가 높으면 더 오릅니다)"
