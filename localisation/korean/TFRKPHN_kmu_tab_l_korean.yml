l_korean:
 # [안내] 김문수 정부 결정 탭 두 개의 글. kmu_tab.py가 만든다.
 TFRKPHN_kv_category:0 "투표함"
 TFRKPHN_kv_category_desc:0 "김문수 정부는 선거에서 이기는 것으로 버팁니다. 표는 공단에서 나옵니다.\n\n노동자 지지 §Y[?TFRKPHN_kv_labor|0]§!퍼센트\n예상 득표율 §Y[?TFRKPHN_kv_vote|1]§!퍼센트\n\n현장을 찾으면 노동자 지지가 오릅니다. 선거 결정은 득표율을 올리고, 노동자 지지가 높을수록 더 많이 올립니다. 노동자 지지는 달마다 §R1§!씩 내려가고, 50보다 낮으면 득표율도 달마다 따라 내려갑니다.\n국민투표 날 예상 득표율이 §Y50퍼센트§!를 넘어야 정권이 버팁니다."
 TFRKPHN_kb_category:0 "다리와 공항"
 TFRKPHN_kb_category_desc:0 "김문수 정부는 큰 공사를 한꺼번에 벌입니다. 돈은 국채를 찍어 댑니다.\n\n나랏빚 §Y[?TFRKPHN_kb_debt|0]§!\n\n공사가 끝날 때마다 건물이 서고 나랏빚이 쌓입니다. 나랏빚이 쌓인 만큼 소비재 공장이 더 들어갑니다. 나랏빚이 §R60§!을 넘으면 환율이 흔들립니다."
 TFRKPHN_kv_modifier:0 "투표함"
 TFRKPHN_kb_modifier:0 "나랏빚"
 TFRKPHN_kv_stake_tt:0 "예상 득표율이 §Y50퍼센트§!를 넘으면 정권이 버티는 엔딩 가지가, 넘지 못하면 무너지는 엔딩 가지가 열립니다.\n지금 예상 득표율은 §Y[?TFRKPHN_kv_vote|1]§!퍼센트입니다."
 TFRKPHN_kb_pay_tt:0 "나랏빚 §G-8§!"
 TFRKPHN_kb_crash_tt:0 "노동자 지지 §R-5§!"
 TFRKPHN_kv_1:0 "공단 새벽 방문"
 TFRKPHN_kv_1_desc:0 "대통령이 새벽 여섯 시에 공단 정문에 서서 출근하는 사람들과 악수합니다."
 TFRKPHN_kv_2:0 "하청 노동자 면담"
 TFRKPHN_kv_2_desc:0 "조선소 하청 업체의 용접공들을 청와대로 부릅니다. 대통령은 자기가 미싱을 돌리던 시절 이야기를 합니다."
 TFRKPHN_kv_3:0 "물류센터 야간조 방문"
 TFRKPHN_kv_3_desc:0 "밤 열두 시에 물류센터를 찾아 야간조와 컵라면을 먹습니다. 사진은 다음 날 아침 신문 일 면에 실립니다."
 TFRKPHN_kv_4:0 "노사정 협약"
 TFRKPHN_kv_4_desc:0 "정부와 노총과 경영자 단체가 한 탁자에 앉아 임금 인상 폭에 서명합니다."
 TFRKPHN_kv_5:0 "파업 중재"
 TFRKPHN_kv_5_desc:0 "대통령이 파업 중인 공장을 직접 찾아 노조 위원장과 사장을 같은 방에 앉힙니다."
 TFRKPHN_kv_6:0 "선거구 다시 긋기"
 TFRKPHN_kv_6_desc:0 "선거구 획정 위원회가 지도 위의 선을 다시 긋습니다. 야당 지지자가 많은 동네는 한 선거구로 묶입니다."
 TFRKPHN_kv_7:0 "친정부 신문 지원"
 TFRKPHN_kv_7_desc:0 "정부 광고를 우호적인 신문과 방송으로 몰아줍니다."
 TFRKPHN_kv_8:0 "지방 예산 나누기"
 TFRKPHN_kv_8_desc:0 "여당 시장이 있는 도시에 교부금을 먼저 내려보냅니다. 야당 시장의 도시는 순서를 기다립니다."
 TFRKPHN_kv_9:0 "야당 집회 허가 제한"
 TFRKPHN_kv_9_desc:0 "경찰이 교통 혼잡을 이유로 야당의 광장 집회 신고를 돌려보냅니다."
 TFRKPHN_kv_10:0 "투표일 공단 버스"
 TFRKPHN_kv_10_desc:0 "투표일 아침 공단에서 투표소까지 버스를 돌립니다. 노총 지부가 배차를 맡습니다."
 TFRKPHN_kb_1:0 "가로림만 해상교량"
 TFRKPHN_kb_1_desc:0 "태안 만대항과 서산 독곶리 사이의 가로림만에 다리를 놓습니다. 차로 두 시간 가까이 돌아가던 길이 몇 분으로 줄어듭니다."
 TFRKPHN_kb_2:0 "가덕도신공항"
 TFRKPHN_kb_2_desc:0 "부산 가덕도 앞바다를 메워 공항을 짓습니다. 바다 밑의 무른 땅을 다지는 데만 여러 해가 걸리는 공사입니다."
 TFRKPHN_kb_3:0 "수도권광역급행철도"
 TFRKPHN_kb_3_desc:0 "수도권 땅속 깊이 급행철도 세 노선을 한꺼번에 팝니다. 대통령이 경기도지사 시절인 2009년에 내놓은 계획입니다."
 TFRKPHN_kb_4:0 "영월 삼척 고속도로"
 TFRKPHN_kb_4_desc:0 "영월에서 삼척까지 태백산맥을 뚫는 고속도로를 놓습니다."
 TFRKPHN_kb_5:0 "진해신항"
 TFRKPHN_kb_5_desc:0 "창원 진해 앞바다에 부두 스물한 선석짜리 새 항만을 짓습니다."
 TFRKPHN_kb_pay:0 "국채 상환"
 TFRKPHN_kb_pay_desc:0 "예산을 줄여 만기가 온 국채를 갚습니다."
 TFRKPHN_kb_debt_p10:0 "나랏빚 §R+10§!"
 TFRKPHN_kb_debt_p12:0 "나랏빚 §R+12§!"
