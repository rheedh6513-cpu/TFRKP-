l_korean:
 # 메가시티 만들기 탭의 철도 결정. rail_build.py가 만든다.
 TFRKPHN_rail_d1:0 "철도: 경부고속선"
 TFRKPHN_rail_d1_desc:0 "경부선은 1905년에 열렸습니다. 고속철도는 1992년 6월 천안아산역 자리에서 첫 삽을 떴고, 열두 해 가까이 지난 2004년 4월 1일에 개통했습니다. 2010년 11월에는 대구에서 부산까지 가는 2단계 구간도 고속선으로 이어졌습니다. 서울에서 대전과 대구를 지나 부산에 닿는 이 선로를 한 번 더 보강하고 대전에 물류 거점을 세웁니다."
 TFRKPHN_rail_d1_tt:0 "§Y경부고속선§! 구간의 철도가 §G최고 등급§!이 되고, §Y대전§!에 §G보급 허브§!가 생깁니다."
 TFRKPHN_rail_d2:0 "철도: 호남고속선"
 TFRKPHN_rail_d2_desc:0 "호남고속철도는 2015년 4월 2일에 개통했습니다. 충북 오송에서 경부고속선과 갈라져 광주송정까지 내려가는 길입니다. 대전에서 목포 방면까지 선로를 고속선 수준으로 올리고 광주에 물류 거점을 세웁니다."
 TFRKPHN_rail_d2_tt:0 "§Y호남고속선§! 구간의 철도가 §G최고 등급§!이 되고, §Y광주§!에 §G보급 허브§!가 생깁니다."
 TFRKPHN_rail_d3:0 "철도: 전라선"
 TFRKPHN_rail_d3_desc:0 "전라선은 익산에서 전주와 순천을 지나 여수까지 갑니다. 2001년에 시작한 복선 전철화 공사가 2011년에 마지막 단선 구간인 여수와 덕양 사이까지 끝나면서 전 구간이 복선이 됐습니다. 그래도 굽은 구간이 많아 고속열차가 제 속도를 내지 못합니다. 선로를 곧게 펴고 광주의 물류 거점과 잇습니다."
 TFRKPHN_rail_d3_tt:0 "§Y전라선§! 구간의 철도가 §G최고 등급§!이 되고, §Y광주§!에 §G보급 허브§!가 생깁니다."
 TFRKPHN_rail_d4:0 "철도: 동해선"
 TFRKPHN_rail_d4_desc:0 "부산진에서 동해안을 따라 함경도 안변까지 잇겠다는 계획은 1920년대 말에 처음 나왔습니다. 부산에서 울산을 지나 포항까지 가는 남쪽 구간은 2021년에 새 선로로 열렸습니다. 2009년에 공사를 시작한 포항과 삼척 사이 166킬로미터는 2025년 1월 1일에 개통했고, 처음 계획이 나온 지 백 년 가까이 지나서야 부산과 강릉이 한 선로로 이어졌습니다. 이 선로를 보강하고 포항에 물류 거점을 세웁니다."
 TFRKPHN_rail_d4_tt:0 "§Y동해선§! 구간의 철도가 §G최고 등급§!이 되고, §Y포항§!에 §G보급 허브§!가 생깁니다."
 TFRKPHN_rail_d5:0 "철도: 강릉선"
 TFRKPHN_rail_d5_desc:0 "원주에서 강릉까지 120킬로미터 남짓한 이 선로는 2017년 12월 22일에 개통했습니다. 평창 동계올림픽 수송을 맡을 노선이어서 2017년 말이라는 기한이 정해져 있었습니다. 서울에서 강원으로 넘어가는 구간의 선로를 올리고 강원 쪽 들머리에 물류 거점을 세웁니다."
 TFRKPHN_rail_d5_tt:0 "§Y강릉선§! 구간의 철도가 §G최고 등급§!이 되고, §Y춘천§!에 §G보급 허브§!가 생깁니다."
 TFRKPHN_rail_d6:0 "철도: 경의선"
 TFRKPHN_rail_d6_desc:0 "경의선은 1906년 4월에 용산에서 신의주까지 전 구간이 이어졌습니다. 1950년 6월 25일에 문산과 개성 사이 운행이 멈췄고 그 뒤로 반세기 넘게 끊겨 있었습니다. 2007년 5월 17일에 문산에서 개성까지 시험 열차가 한 번 달렸고, 이후 문산과 봉동 사이를 화물열차가 제한적으로 오갔습니다. 이제 서울에서 개성과 사리원을 지나 평양까지 선로를 다시 놓고 개성에 물류 거점을 세웁니다."
 TFRKPHN_rail_d6_tt:0 "§Y경의선§! 구간의 철도가 §G최고 등급§!이 되고, §Y개성§!에 §G보급 허브§!가 생깁니다."
 TFRKPHN_rail_d7:0 "철도: 경원선"
 TFRKPHN_rail_d7_desc:0 "경원선은 1914년 8월에 용산에서 원산까지 이어졌습니다. 1945년 8월 24일 삼팔선에서 연결 운행이 끊겼고, 전쟁 뒤 남쪽 열차는 신탄리에서 멈췄습니다. 2012년 11월에 백마고지역까지 한 정거장이 늘어난 것이 그 뒤의 전부입니다. 서울에서 원산까지 선로를 다시 잇습니다."
 TFRKPHN_rail_d7_tt:0 "§Y경원선§! 구간의 철도가 §G최고 등급§!이 됩니다."
 TFRKPHN_rail_d8:0 "철도: 동해북부선"
 TFRKPHN_rail_d8_desc:0 "동해북부선은 1937년에 열렸다가 분단으로 끊겼습니다. 2002년 9월에 다시 잇는 공사를 시작했고, 2007년 5월 17일 금강산에서 제진까지 시험 열차가 한 번 달린 뒤로는 진전이 없었습니다. 강원 동해안에서 원산과 함흥, 청진을 지나 북쪽 끝까지 선로를 놓습니다."
 TFRKPHN_rail_d8_tt:0 "§Y동해북부선§! 구간의 철도가 §G최고 등급§!이 됩니다."
 TFRKPHN_rail_d9:0 "철도: 평의선"
 TFRKPHN_rail_d9_desc:0 "경의선 가운데 평양에서 신의주까지를 북한에서는 평의선이라고 불렀습니다. 압록강을 건너면 바로 중국 단둥입니다. 평양에서 신의주까지 선로를 남쪽과 같은 수준으로 올려, 서울에서 떠난 열차가 국경까지 가게 합니다."
 TFRKPHN_rail_d9_tt:0 "§Y평의선§! 구간의 철도가 §G최고 등급§!이 됩니다."
 TFRKPHN_rail_wait_n_tt:0 "§Y90일§! 동안 공사가 이어지고, 그동안 §Y민간 공장 1개§!가 이 공사에 묶입니다."
 TFRKPHN_rail_wait_tt:0 "§Y60일§! 동안 공사가 이어지고, 그동안 §Y민간 공장 1개§!가 이 공사에 묶입니다."
 tfrkphn.671.t:0 "경부고속선 보강 개통"
 tfrkphn.671.d:0 "경부고속선 보강 공사가 끝났다. 2004년 4월 1일에 첫 고속열차가 달린 선로가 서울에서 부산까지 전 구간 최고 등급이 됐다.\n\n대전에는 물류 거점이 들어섰다. 경부선과 호남선이 갈라지는 도시여서, 남쪽으로 내려가는 물자가 여기서 영남과 호남으로 나뉜다. 서울과 부산을 잇는 축이 한결 넉넉해졌다."
 tfrkphn.672.t:0 "호남고속선 개통"
 tfrkphn.672.d:0 "호남고속선 공사가 끝났다. 2015년 4월 2일 광주송정까지 열린 고속선이 이제 목포 방면까지 같은 수준으로 이어진다.\n\n광주에는 물류 거점이 들어섰다. 본선에서 광주로 들어가는 지선도 함께 놓였다. 호남으로 내려가는 물자는 광주에 모였다가 목포와 순천 쪽으로 흩어지게 된다."
 tfrkphn.673.t:0 "전라선 개통"
 tfrkphn.673.d:0 "전라선 공사가 끝났다. 2011년에 전 구간이 복선이 된 뒤에도 굽은 구간이 많아 고속열차가 제 속도를 내지 못하던 선로다. 오늘부터 익산에서 여수까지 열차가 전보다 빠르게 달린다.\n\n순천과 여수에서 나오는 화물은 광주의 물류 거점과 한 줄로 이어졌다."
 tfrkphn.674.t:0 "동해선 보강 개통"
 tfrkphn.674.d:0 "동해선 보강 공사가 끝났다. 부산에서 울산과 포항을 지나 강릉까지 동해안을 따라 올라가는 선로다. 1920년대 말에 처음 계획이 나왔고 2025년 1월 1일에야 한 선로로 이어진 길이기도 한다.\n\n포항에는 물류 거점이 들어섰다. 동해안의 항구와 공단에서 나오는 화물이 철길을 타고 남북으로 오가게 된다."
 tfrkphn.675.t:0 "강릉선 보강 개통"
 tfrkphn.675.d:0 "강릉선 보강 공사가 끝났다. 2017년 12월 22일 평창 동계올림픽을 앞두고 열린 선로이고, 이번 공사로 서울에서 강원으로 넘어가는 구간이 최고 등급이 됐다.\n\n춘천에는 물류 거점이 들어섰고 본선에서 춘천으로 들어가는 지선도 함께 놓였다. 강원으로 가는 물자는 이제 춘천을 거친다."
 tfrkphn.676.t:0 "경의선, 평양까지"
 tfrkphn.676.d:0 "서울에서 평양까지 선로가 다시 이어졌다.\n\n1906년 4월에 용산에서 신의주까지 열렸던 경의선은 1950년 6월 25일 문산과 개성 사이에서 끊겼다. 2007년의 시험 열차와 그 뒤 얼마 동안 오간 화물열차를 빼면, 일흔 해 넘게 정기 열차가 다니지 못한 구간이다.\n\n오늘 서울역을 떠난 첫 열차는 개성과 사리원을 지나 평양역에 닿았다. 개성에는 물류 거점이 들어섰다."
 tfrkphn.677.t:0 "경원선, 원산까지"
 tfrkphn.677.d:0 "서울에서 원산까지 선로가 다시 이어졌다.\n\n1914년 8월에 열린 경원선은 1945년 8월 24일 삼팔선에서 연결 운행이 끊겼다. 남쪽 열차는 2012년부터 백마고지역에서 멈췄고, 그 너머는 여든 해 넘게 비어 있었다.\n\n오늘 그 구간에 열차가 들어갔다. 서울에서 떠난 열차는 이제 동해 바다가 보이는 원산에 닿는다."
 tfrkphn.678.t:0 "동해북부선 개통"
 tfrkphn.678.d:0 "동해안을 따라 북쪽 끝까지 가는 선로가 놓였다. 1937년에 열렸다가 분단으로 끊긴 동해북부선이 그 첫 구간이다. 2007년 5월 17일 금강산에서 제진까지 시험 열차가 한 번 달린 뒤로는 멈춰 있던 길이었다.\n\n이제 열차는 강원 동해안에서 원산과 함흥, 청진을 차례로 지난다. 남쪽 동해선과 맞닿아 있어서 부산에서 함경도까지 한 줄로 이어진다."
 tfrkphn.679.t:0 "평의선 개통"
 tfrkphn.679.d:0 "평양에서 신의주까지 선로 공사가 끝났다. 경의선의 북쪽 절반이고, 북한에서는 평의선이라고 부르던 구간이다.\n\n신의주에서 압록강을 건너면 바로 중국 단둥이다. 평양에서 국경까지 최고 등급의 선로가 놓였고, 우리 열차는 이제 한반도의 서북쪽 끝에 닿는다."
 TFRKPHN_rail_ev_ok:0 "첫 열차가 떠난다."
