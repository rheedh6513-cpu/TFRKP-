 KOR_lee_in_je_char_desc:0 "이인제는 대한민국의 제21대 대통령입니다.\n\n1948년 충청남도 논산에서 소작농의 아들로 태어났습니다. 서울대학교 법과대학을 나와 판사와 노동 변호사로 일했습니다. 1988년 김영삼의 통일민주당 소속으로 국회에 들어갔습니다. 1993년 김영삼 정부의 첫 노동부 장관이 되어 고용보험 도입을 이끌었고, 1995년 첫 민선 경기도지사에 당선되었습니다.\n\n1997년 신한국당 경선에서 이회창에게 지자 탈당해 대선에 나섰고 19.2%로 3위를 했습니다. '경선 불복'이라는 꼬리표가 그때 붙었습니다. 2002년 민주당 경선에서는 노무현에게 밀렸고, 2007년 대선에서는 0.68%에 그쳤습니다. 그 사이 6선 의원이 되었습니다.\n\n당적은 이렇게 옮겼습니다. 1987년 통일민주당, 1990년 민주자유당, 이어서 신한국당, 1997년 국민신당, 1998년 새정치국민회의, 2000년 새천년민주당, 2002년 자유민주연합, 2006년 국민중심당, 2007년 민주당, 2008년 통합민주당을 나와 무소속, 2011년 자유선진당, 2012년 선진통일당과 새누리당, 그 뒤 자유한국당, 미래통합당, 국민의힘. 무소속까지 합쳐 열일곱 개입니다.\n\n2016년 총선, 2017년 자유한국당 경선, 2018년 충남지사 선거에서 내리 졌습니다. 그는 쓰러질 때마다 다시 일어섰습니다. 사람들은 그를 불사조에 빗대어 '피닉제'라고 불렀습니다.\n\n불사조는 또 한 번 돌아왔습니다. 경선에서 자신을 꺾었던 홍준표의 정부에서 국무총리를 지냈고, 2027년 대선에서 이겼습니다. 처음 대권에 도전한 지 30년 만입니다. 남은 과업은 일자리와 국민 통합, 그리고 한라에서 백두까지입니다."
 tfrkphn.260.t:0 "출발선에 다시 서서"
 tfrkphn.260.story:0 "임기 첫날, 0시. 전화벨이 울렸다.\n\n합동참모의장이었다. 이 시각부로 국군 통수권이 넘어왔다고 했다. 이인제는 짧게 답하고 수화기를 내려놓았다. 대통령으로서 받은 첫 보고였다.\n\n잠은 오지 않았다. 30년을 기다린 전화였다.\n\n논산의 소작농 집에서 태어났다. 월사금이 없어 초등학교를 한 해 늦게 들어갔다. 판사가 되었고, 3년 만에 법복을 벗었다. 다치고 쫓겨난 노동자들의 변호사가 되었다.\n\n1987년, 김영삼의 당에 들어갔다. 마흔넷에 장관이 됐다. 내각에서 가장 젊었다. 이태 뒤에는 첫 민선 경기도지사가 됐다. 그 무렵 신문은 그를 차세대 지도자라고 썼다.\n\n1997년, 경선에서 졌다. 승복하지 않았다. 당을 나와 새 당을 만들었다. 492만 표를 얻고 3위를 했다. 그날부터 그의 이름 앞에는 경선 불복이라는 네 글자가 붙어 다녔다.\n\n2002년에는 노무현의 바람에 밀렸다. 2007년에는 일자리 만드는 대통령이 되겠다고 했다. 0.68%를 얻었다.\n\n당은 열 번이 넘게 바뀌었다. 통일민주당, 민주자유당, 국민신당, 새천년민주당. 자유민주연합, 무소속, 자유선진당, 새누리당. 사람들은 세다가 그만두었다.\n\n그래도 유권자들은 그를 국회로 보냈다. 안양에서 두 번, 논산에서 네 번이었다. 2016년, 일곱 번째는 1,038표가 모자랐다.\n\n2017년 경선에서는 북한 체제를 바꾸겠다고 했다. 홍준표에게 졌다. 2018년에는 충남지사 선거에서 졌다.\n\n사람들은 그를 피닉제라고 불렀다. 놀리는 말이었다. 오래 듣다 보니 싫지 않았다.\n\n아침, 청와대 본관 집무실.\n\n책상 위에 결재판 두 개가 놓여 있었다. 왼쪽은 고용 창출 전략회의 설치안이었다. 오른쪽에는 붉은 띠가 둘려 있었다. 합동참모본부의 대북 정세 보고였다.\n\n비서실장이 물었다.\n\n\"어느 것부터 보시겠습니까?\"\n\n이인제는 만년필을 들었다. 왼쪽 결재판을 끌어당겨 이름 석 자를 적었다. 대통령으로서 한 첫 서명이었다.\n\n\"20년 전에 한 약속이네. 이것부터 지켜야지.\"\n\n그는 오른쪽 결재판 위에 손을 얹었다. 열지는 않았다.\n\n\"이건 천천히 보겠네. 끝까지.\"\n\n비서실장이 나갔다. 그는 오른쪽 결재판을 서랍에 넣지 않았다. 눈에 보이는 자리에 그대로 두었다."
 tfrkphn.260.story_a:0 "30년 늦은 첫 출근이었다."
 tfrkphn.261.t:0 "충청대망론"
 tfrkphn.261.story:0 "취임 첫 주말, 논산의 재래시장.\n\n대통령의 첫 지방 일정이었다. 일정표에는 도시 세 곳이 적혀 있었다. 논산, 광주, 대구. 순서는 대통령이 직접 정했다.\n\n시장 입구부터 사람들이 길을 메웠다. 생선 가게 주인이 장갑을 벗고 손을 내밀었다. 떡집 할머니는 그의 팔을 붙잡고 놓지 않았다.\n\n충청은 오래 대통령을 꿈꿨다. 김종필, 이회창, 반기문, 안희정이 차례로 기대를 모았다. 아무도 끝까지 가지 못했다. 이인제도 그 명단에 있었다. 2001년 충청의 여론조사에서 그는 1위였다. 이듬해 경선에서 졌다.\n\n영남과 호남이 맞서는 동안 충청은 승부를 가르는 표였다. 충청에서 이기면 본선에서 이긴다고들 했다. 정작 이긴 사람은 번번이 다른 지역 출신이었다.\n\n국밥집 앞에서 한 노인이 그를 불러 세웠다.\n\n\"평생을 기다렸어. 이제 우리 차례여.\"\n\n둘러선 사람들이 웃으며 손뼉을 쳤다. 이인제도 웃었다. 그는 노인의 손을 두 손으로 잡았다.\n\n\"어르신, 고맙습니다. 그런데 우리 차례라는 말은 오늘로 끝내야겠습니다.\"\n\n박수가 잦아들었다.\n\n\"영남 차례, 호남 차례 하다가 나라가 둘로 갈라졌습니다. 충청 차례까지 생기면 셋으로 갈라집니다. 저는 그 차례를 없애려고 대통령이 됐습니다.\"\n\n노인은 잠시 말이 없었다. 그러다 그의 손등을 툭툭 두드렸다.\n\n\"그려. 그 말 하려고 여기부터 온 거구먼.\"\n\n차에 오르자 비서실장이 일정표를 내밀었다. 이인제는 두 번째 줄을 손가락으로 짚었다.\n\n\"다음은 광주네. 같은 말을 하러 가세.\""
 tfrkphn.261.story_a:0 "대통령은 그날 저녁 광주로 떠났다."
 tfrkphn.262.t:0 "일자리 만드는 대통령"
 tfrkphn.262.story:0 "고용 창출 전략회의, 첫 회의 날 아침.\n\n자료 맨 위에 숫자 하나가 적혀 있었다. 전역하고도 일터를 찾지 못한 장병의 수였다. 이인제는 그 숫자를 오래 보았다.\n\n34년 전에도 그는 숫자 앞에 앉아 있었다.\n\n1993년 2월, 그는 김영삼 정부의 첫 노동부 장관이 되었다. 마흔넷이었다. 내각에서 가장 젊었다. 얼마 전까지 그는 해고된 노동자들의 변호사였다.\n\n그해 여름, 현대 계열사의 노사분규가 번졌다. 장관은 파업한 노동자에게도 생계비는 줘야 한다고 했다. 식비와 가족수당 같은 돈이었다. 근거는 대법원 판례였다. 사람들은 그것을 무노동 부분임금이라고 불렀다.\n\n재계가 들고일어났다. 경제기획원과 상공자원부가 철회를 요구했다. 여당은 무노동 무임금을 지키겠다고 했다.\n\n6월 21일, 세 부처가 함께 기자회견을 열었다. 기자들은 장관이 물러설 것이라고 예상했다. 그는 입장이 달라지지 않았다고 말했다. 노동법의 해석은 노동부의 일이라고 했다.\n\n같은 해, 그는 고용보험 도입을 이끌었다. 일터를 잃은 사람이 다음 일터를 찾을 때까지 버티게 하는 제도였다.\n\n장관 자리에는 열 달을 있었다. 떠날 때 남은 생각은 단순했다. 임금이든 보험이든 일자리가 있어야 따질 수 있었다.\n\n비서실장이 문을 두드렸다.\n\n\"위원들이 다 모였습니다.\"\n\n이인제는 자료를 덮고 일어섰다. 회의실 문 앞에서 그는 걸음을 멈췄다.\n\n\"오늘은 길게 말 안 하겠네.\"\n\n\"준비하신 원고는 어떻게 할까요?\"\n\n\"두게. 일자리부터 만들자는 말만 하면 되네. 34년 전에도 그 말을 하고 싶었네.\""
 tfrkphn.262.story_a:0 "일자리가 최고의 복지다."
 tfrkphn.263.t:0 "책임총리제"
 tfrkphn.263.story:0 "§Y책임총리제란§!\n대통령과 국무총리가 일을 나누는 방식이다. 대통령은 외교, 안보, 국방, 통일을 맡는다. 총리는 경제, 복지, 교육 같은 내치를 맡는다.\n\n§Y왜 필요한가§!\n총리에게는 장관을 제청할 권한이 있다. 그러나 그 권한은 오래 종이 위에만 있었다. 장관은 대통령이 골랐고 총리는 서명만 했다. 사람들은 그런 총리를 대독 총리라고 불렀다.\n\n이인제는 1997년 대선에서 책임총리제를 공약했다. 2017년 출마 선언에서도 같은 말을 했다. 대통령은 밖을 맡고, 내치는 실질적인 제청권을 가진 총리에게 맡긴다는 구상이다. 20년 동안 그의 구상은 바뀌지 않았다.\n\n그는 총리 자리를 겪어 본 사람이기도 하다. 홍준표 정부에서 그는 국무총리였다.\n\n§Y어떻게 운영하는가§!\n첫째, 총리가 장관 후보를 고른다. 대통령은 그 명단을 받아들인다.\n둘째, 내치 안건은 총리가 조정하고 결정한다.\n셋째, 내치의 결과는 총리가 국회에 나가 책임진다.\n\n§Y무엇이 걱정인가§!\n전쟁이 끝난 지 오래되지 않았다. 지휘가 둘로 갈리면 결정이 늦어진다. 대통령과 총리가 부딪치면 누가 물러서는지도 정해야 한다.\n\n§Y정부의 답§!\n대통령은 북쪽의 일에 시간을 쓴다. 일자리와 물가는 총리가 매일 챙긴다. 두 사람은 매주 한 번 마주 앉아 서로의 일을 맞춘다."
 tfrkphn.263.story_a:0 "장관 인선은 총리실에서 시작한다."
 tfrkphn.264.t:0 "강력한 리더십"
 tfrkphn.264.story:0 "밤 열한 시, 청와대 집무실.\n\n책상 위에 원고 한 부가 놓여 있었다. 제목은 책임총리제 시행에 관한 대국민 담화였다. 발표는 내일 아침이었다. 이인제는 마지막 문단을 고치고 있었다.\n\n1997년부터 해 온 말이었다. 대통령은 밖을 맡고 총리는 안을 맡는다. 30년 만에 그 말을 지킬 차례였다.\n\n문이 열렸다. 국가안보실장이 서류 봉투를 들고 들어왔다.\n\n\"늦은 시간에 죄송합니다. 오늘 들어온 사진입니다.\"\n\n그는 사진 석 장을 원고 옆에 놓았다. 첫 장은 중국의 조선소였다. 선대마다 선체가 올라가 있었다. 둘째 장은 군수 공장이었다. 굴뚝마다 연기가 났다. 셋째 장은 항구였다. 새 함정이 줄지어 있었다.\n\n\"졌다고 멈춘 게 아닙니다. 잃은 함대를 다시 짓고 있습니다.\"\n\n\"언제쯤 다 짓나?\"\n\n\"이 속도면 몇 해 걸리지 않습니다.\"\n\n안보실장은 표 한 장을 더 꺼냈다. 각국의 국방 예산이었다. 줄어든 나라는 없었다. 미국이 사라진 뒤로 숫자는 해마다 늘었다.\n\n\"전쟁이 끝난 줄 알았더니, 다들 다음 전쟁을 준비하고 있구먼.\"\n\n안보실장은 대답하지 않았다. 그의 눈이 책상 위의 원고로 갔다.\n\n\"내일 담화는 예정대로 하십니까?\"\n\n이인제는 원고를 집어 들었다. 한참 보았다. 그러고는 서랍을 열어 그 안에 넣었다.\n\n\"버리는 게 아니네. 넣어 두는 걸세.\"\n\n그는 서랍을 닫았다.\n\n\"지금은 나눌 때가 아니야. 내일 아침 안보 회의와 경제 회의를 내가 다 주재하겠네. 장관들한테 직접 보고하라고 전하게.\"\n\n안보실장이 나간 뒤에도 사진 석 장은 책상 위에 남아 있었다."
 tfrkphn.264.story_a:0 "지금이야말로 강한 정부가 필요하다."
 tfrkphn.265.t:0 "빈칸 하나"
 tfrkphn.265.story:0 "새벽 한 시, 청와대 집무실.\n\n책상 위에 내각 명단이 놓여 있었다. 칸마다 이름이 적혀 있었다. 한 칸만 비어 있었다. 노동부 장관 자리였다.\n\n빈칸 옆에는 이력서 두 장이 있었다.\n\n왼쪽은 20년을 함께한 사람이었다. 당을 옮길 때마다 따라왔다. 선거에서 질 때마다 곁에 남았다. 이번 선거도 그가 맨 앞에서 뛰었다.\n\n오른쪽은 처음 보는 사람이었다. 노동 현장에서 30년을 일했다. 노동계도 경영계도 그의 말은 들었다. 선거 때는 상대 후보 쪽에 있었다.\n\n다른 대통령이라면 고민할 일이 아니었다. 먼저 동지를 앉힌다. 안 되면 1년 뒤에 바꾼다. 장관은 그렇게 쓰는 자리였다.\n\n이인제는 그럴 수 없었다. 장관은 대통령과 임기를 함께한다. 1997년에 한 약속이었다. 한번 적은 이름은 임기가 끝나는 날까지 지울 수 없다.\n\n그는 1993년을 떠올렸다. 그도 노동부 장관이었다. 열 달 만에 자리에서 물러났다. 벌여 놓은 일은 책상 위에 그대로 남았다. 그 책상에는 다음 장관이 앉았다.\n\n열 달로는 아무것도 끝낼 수 없었다. 그는 그것을 겪어서 알았다.\n\n이인제는 왼쪽 이력서를 오래 보았다. 고마운 얼굴이었다. 미안한 얼굴이기도 했다.\n\n그는 만년필을 들었다. 빈칸에 오른쪽 이력서의 이름을 적었다.\n\n임기 끝까지 같이 갈 사람이었다. 편한 사람보다 일할 사람을 골라야 했다.\n\n그는 왼쪽 이력서를 접어 안주머니에 넣었다. 날이 밝으면 직접 전화를 걸 생각이었다."
 tfrkphn.265.story_a:0 "한번 적은 이름은 지울 수 없다."
 tfrkphn.266.t:0 "임명식"
 tfrkphn.266.story:0 "오전 열 시, 청와대 본관.\n\n새 장관들이 한 줄로 서 있었다. 가족들은 뒤편에 앉아 있었다. 이인제가 들어서자 모두 자세를 고쳤다.\n\n임명장은 대통령이 직접 건넸다. 한 사람씩 이름을 불렀다. 한 사람씩 임명장을 건네고 손을 잡았다.\n\n여느 임명식과 다른 점이 하나 있었다. 임명장 끝에 한 줄이 더 적혀 있었다. 임기는 대통령의 임기와 같다는 문장이었다.\n\n노동부 장관의 차례가 왔다. 선거 때 상대 후보 쪽에 있던 사람이었다. 그는 임명장을 받고도 손을 놓지 못했다.\n\n\"저를 왜 부르셨는지 아직도 모르겠습니다.\"\n\n\"나도 그 자리에 앉아 봤소. 열 달 있었지.\"\n\n이인제는 그의 손을 한 번 더 쥐었다.\n\n\"열 달로는 아무것도 못 끝냅니다. 장관은 끝까지 있으시오. 내가 나가는 날 같이 나갑시다.\"\n\n마지막 임명장을 건넨 뒤 이인제는 줄 앞에 섰다.\n\n\"한 가지만 말하겠습니다. 여러분의 사표는 받지 않습니다.\"\n\n장관들이 서로를 보았다.\n\n\"지지율이 떨어져도 받지 않습니다. 야당이 물러나라고 해도 받지 않습니다. 일이 틀어지면 고쳐서 다시 하십시오. 사표는 제일 쉬운 길입니다. 그 길은 막아 두겠습니다.\"\n\n그는 잠깐 말을 멈췄다.\n\n\"대신 나도 여러분을 바꾸지 않습니다. 약속입니다.\"\n\n뒤편에서 누군가 먼저 손뼉을 쳤다. 장관의 어린 손자였다. 웃음이 번졌고 박수가 이어졌다.\n\n기념사진을 찍었다. 대통령은 가운데에 섰다. 임기가 끝나는 날, 같은 자리에서 같은 사람들과 한 장을 더 찍기로 했다."
 tfrkphn.266.story_a:0 "내가 나가는 날 같이 나갑시다."
 # ===== 이인제 정부 장관 =====
 TFRKPHN_chung_jin_suk_HM:0 "정진석"
 TFRKPHN_chung_jin_suk_HM_desc:0 "출생: 1960년 대한민국 충청남도 공주\n\n이력: 대한민국의 국무총리\n정진석은 한국일보 기자로 15년을 일했습니다. 정치부에서 국회를 출입했고 워싱턴 특파원과 논설위원을 지냈습니다. 1999년 김종필의 특보로 정계에 들어왔습니다. 이듬해 자유민주연합 후보로 제16대 국회의원에 당선되었습니다. 지금까지 모두 다섯 번 당선되었습니다. 청와대 정무수석과 국회 사무총장, 새누리당 원내대표, 국회부의장을 지냈습니다. 2024년에는 대통령 비서실장에 임명되었습니다.\n\n이인제 대통령도 자유민주연합을 거쳤습니다. 두 사람은 충청 정치가 어떻게 움직이는지 압니다. 대통령은 국회를 상대할 총리로 정진석을 골랐습니다. 그는 원내대표와 국회부의장을 모두 지냈습니다."
 TFRKPHN_cho_hyun_dong_FM:0 "조현동"
 TFRKPHN_cho_hyun_dong_FM_desc:0 "출생: 1960년 대한민국 서울특별시\n\n이력: 대한민국의 외교부 장관\n조현동은 직업 외교관입니다. 2022년 5월 외교부 제1차관에 올랐습니다. 2023년 4월부터 2025년 7월까지 주미국 대사를 지냈습니다.\n\n그는 미국을 잘 압니다. 그런데 그 미국이 무너졌습니다. 이인제 대통령은 그래도 그를 불렀습니다. 무너진 나라의 빈자리를 누가 채우려 드는지 읽으려면 그 나라를 알아야 하기 때문입니다."
 TFRKPHN_bang_ki_sun_EM:0 "방기선"
 TFRKPHN_bang_ki_sun_EM_desc:0 "출생: 1965년 대한민국\n\n이력: 대한민국의 기획재정부 장관\n방기선은 1990년 제34회 행정고시에 합격했습니다. 경제기획원에서 공직을 시작해 기획예산처와 기획재정부 예산실을 거쳤습니다. 2017년 정책조정국장, 2019년 차관보를 맡았습니다. 2021년에는 아시아개발은행 상임이사로 나갔습니다. 2022년 기획재정부 제1차관이 되었고, 이듬해 국무조정실장에 올랐습니다.\n\n이인제 대통령은 전쟁 빚을 2년 안에 갚겠다고 약속했습니다. 그 약속을 숫자로 바꾸는 일이 방기선의 몫입니다. 그는 예산을 짜 본 사람이고 부처 사이를 조정해 본 사람입니다."
 TFRKPHN_lee_myoung_su_IM:0 "이명수"
 TFRKPHN_lee_myoung_su_IM_desc:0 "출생: 1955년 대한민국\n\n이력: 대한민국의 행정안전부 장관\n이명수는 1978년 제22회 행정고시에 합격했습니다. 1993년 충청남도 금산군수를 지냈고, 2001년부터 2004년까지 충청남도 행정부지사로 일했습니다. 2008년 자유선진당 후보로 충남 아산에서 처음 당선되었습니다. 제21대까지 네 번을 내리 이겼습니다. 국회 보건복지위원장을 지냈습니다.\n\n이인제와는 선진통일당에서 같은 당 의원이었습니다. 2012년 8월 이명수는 당을 떠나 새누리당으로 갔습니다. 당 대표이던 이인제가 전날 만나 말렸지만 소용없었습니다. 대통령이 된 이인제는 그 일을 따지지 않았습니다. 지방 행정을 군수부터 해 본 사람이 필요했습니다."
 TFRKPHN_kim_hong_kyun_IntelM:0 "김홍균"
 TFRKPHN_kim_hong_kyun_IntelM_desc:0 "출생: 1961년 대한민국 부산광역시\n\n이력: 대한민국의 국가정보원장\n김홍균은 1984년 제18회 외무고시에 합격했습니다. 2009년 평화외교기획단장을 맡았습니다. 2014년에는 국가안보실 정책조정비서관으로 국가안전보장회의 사무차장을 겸했습니다. 2016년 한반도평화교섭본부장이 되어 북핵 문제를 맡았습니다. 2022년 주독일 대사, 2024년 외교부 제1차관을 지냈습니다.\n\n정보기관 출신은 아닙니다. 이인제 대통령은 정보를 모으는 사람보다 정보를 받아 쓰던 사람을 원장에 앉혔습니다. 김홍균은 북한 문제를 협상장과 안보실 양쪽에서 다뤘습니다."
 TFRKPHN_shin_beom_chul_TM:0 "신범철"
 TFRKPHN_shin_beom_chul_TM_desc:0 "출생: 1970년 대한민국 대전광역시\n\n이력: 대한민국의 국방부 장관\n신범철은 대전에서 태어나 천안에서 자랐습니다. 1995년 한국국방연구원에 들어가 북한군사연구실장을 지냈습니다. 2009년 국방부 장관 정책보좌관, 2013년 외교부 정책기획관을 맡았습니다. 국립외교원 교수와 아산정책연구원 안보통일센터장을 거쳤습니다. 제21대 총선에서는 천안갑에 출마해 1,328표 차이로 졌습니다. 2022년 5월 국방부 차관에 임명되어 이듬해 10월까지 일했습니다.\n\n직업 군인 출신이 아닌 국방부 장관입니다. 이인제 대통령은 통일 이후의 군을 설계할 사람을 찾았습니다. 신범철은 연구원에서 북한군을 들여다보던 사람입니다."
 TFRKPHN_trait_chungcheong_broker:0 "충청의 조정자"
