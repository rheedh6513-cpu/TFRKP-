 TFRKPHN_cab_tt_yoon_suk_yeol:0 "§Y윤석열§!\n법무부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 안정도 §G+6%§!, 정치력 획득 §G+6%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_yoon_suk_yeol:0 "출생: 1960년 대한민국 서울특별시\n\n이력: 대한민국의 법무부 장관\n윤석열은 1991년 제33회 사법시험에 합격했습니다. 2013년 국가정보원 여론 조작 사건 특별수사팀장을 맡았습니다. 2016년에는 특검 수사팀장으로 일했습니다. 2017년 서울중앙지검장, 2019년 7월 검찰총장에 올랐습니다. 2021년 3월 총장직에서 물러났고, 그해 7월 국민의힘에 입당했습니다.\n\n2021년 경선에서 홍준표에게 패했습니다. 정치를 시작한 지 넉 달 된 신인이었습니다. 모두에게 잊혀진 뒤에는 찾는 사람이 없었고, 그는 잊힌 채 지냈습니다. 법무부 장관 자리가 끝내 비자 그의 이름이 다시 나왔습니다. 문재인 정부에서 검찰총장을 지낸 이력 때문이었습니다.\n\n§Y어록§!\n\"저는 사람에 충성하지 않기 때문에 제가 오늘도 이런 말씀을 드리는 겁니다.\"\n§g국회 국정감사§!"
 tfrkphn.275.t:0 "서명란"
 tfrkphn.275.story:0 "법무부에서 올라온 서류마다 장관 서명란이 비어 있었다. 차관이 대신 도장을 찍었다. 사면 심사도 검찰 인사도 그렇게 미뤄졌다.\n\n비서실장이 조심스럽게 말을 꺼냈다. 온정주의 없는 법 집행을 약속하셨는데 법을 집행할 사람이 없다고 했다.\n\n이인제는 웃지 않았다."
 tfrkphn.275.o1:0 "심우정을 임명한다."
