 tfrkphn.413.t:0 "이영수 공군참모총장 임명"
 tfrkphn.413.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 공군대장 이영수가 공군참모총장에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"조종사 한 명 키우는 데 십 년이 걸립니다. 떠나는 조종사부터 붙잡으세요.\"\n\n이영수 대장은 경례로 답했다."
 tfrkphn.413.a:0 "충성!"
