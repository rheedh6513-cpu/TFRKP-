 TFRKPHN_cab_eff_lee_ki_kweon:0 "§Y이기권§!이 고용노동부 장관에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 공장 산출량 §G+6%§!"
 TFRKPHN_cab_cf_lee_ki_kweon:0 "§L\"특히 노동시장 구조개선은 반드시 금년 중 확실한 토대를 갖춰야 한다\"§!\n§g이기권, 정부세종청사 기자 간담§!\n\n정말 §Y이기권§!을 고용노동부 장관에 임명하시겠습니까?\n임명하면: 공장 산출량 §G+6%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_lee_ki_kweon:0 "\n§Y어록§!\n\"특히 노동시장 구조개선은 반드시 금년 중 확실한 토대를 갖춰야 한다\"\n§g정부세종청사 기자 간담§!"
 TFRKPHN_cab_tt_lee_ki_kweon:0 "§Y이기권§!\n고용노동부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 공장 산출량 §G+6%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_lee_ki_kweon:0 "출생: 1957년 대한민국 전라남도 함평\n\n이력: 대한민국의 고용노동부 장관\n이기권은 1981년 제25회 행정고시에 합격했습니다. 2011년 고용노동부 차관을 지냈고, 2012년 한국기술교육대학교 총장이 되었습니다. 2014년 7월부터 2017년 7월까지 고용노동부 장관으로 일했습니다.\n\n장관을 3년 한 사람입니다. 이인제 대통령은 그 경험을 노동개혁에 다시 쓰려 했습니다.\n\n§Y어록§!\n\"특히 노동시장 구조개선은 반드시 금년 중 확실한 토대를 갖춰야 한다\"\n§g정부세종청사 기자 간담§!"
