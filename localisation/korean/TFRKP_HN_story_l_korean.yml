 tfrkphn.53.story:0 "나라를 하나로 묶으려면 먼저 썩은 곳을 도려내야 했다. 칼을 들기 전, 그는 자신이 그 칼끝에 섰던 날을 떠올렸다.\n\n\"2011년 5월, 6월경 호텔에서 성완종 회장을 만난 일이 있습니까?\"\n\"없습니다.\"\n\n2015년 4월 10일. 공직 생활 처음으로 비리 의혹이 내 이름에 붙었다. 성완종 회장이 세상을 떠나며 남긴 메모 한 장 때문이었다. 1억 원. 친박 인사 여섯 명 사이에 내 이름이 적혀 있었다.\n\n출근길마다 기자들이 몰려들었다. 어느 방송은 내가 출국금지를 당했다고 거짓 보도를 했다. 5월 초, 검찰에 출두하며 기자 500여 명 앞에서 말했다. \"간단히 소명하러 왔습니다.\"\n\n조사는 이상하게 흘러갔다. 네 시간 동안 120쪽을 채웠다. 그런데 범죄 사실은 묻지 않았다. 딱 한 줄을 빼고.\n\n\"2011년 5월, 6월경 호텔에서 성완종 회장을 만난 일이 있습니까?\"\n\"없습니다.\"\n\n이튿날 검찰은 내가 12시간 동안 강도 높은 조사를 받았다고 발표했다.\n\n1심은 더했다. 재판부는 우리 주장을 듣지 않았다. 검사는 변호인을 협박했다. 징역 2년 구형에 징역 1년 6개월 선고. 그날 나는 노상강도를 당한 기분이라고 말했다.\n\n항소심에서 운이 따랐다. 폐쇄된 문으로 들어왔다는 윤 모 씨의 말이 거짓으로 드러났다. 나와 성 회장은 서로 잘 모르는 사이였다. 그런데 잘 아는 사이처럼 꾸민 정황도 나왔다.\n\n내가 검사이던 시절에는 경찰이 고문으로 사건을 만들었다. 이제는 검사가 그 일을 하고 있었다. 검찰이 이렇게 무너졌는데 나라의 기강이 설 리 있겠는가.\n\n그는 그 일을 겪고 나서야 알았다. 칼을 쥘 사람부터 깨끗해야 했다."
 tfrkphn.55.story:0 "담화 원고 마지막 장에 그는 직접 펜으로 한 줄을 덧붙였다. '말로 끝나면, 나도 끝이다.'\n\n변두리 국밥집. 점심때가 조금 지난 시간이었다.\n\n\"야 이씨, 이번에 대통령이 특별담화 한다는 거 들었냐?\"\n\"형님요, 그런 거 들어 봐야 뭐 합니까. 뻔하지예. '나라가 어려우니 잘하겠습니다.' 아무 일도 안 일어납니다.\"\n\n몇십 분 뒤, 식당 TV에 대통령의 대국민 담화가 나왔다.\n\n\"첫째, 저는 우리 공동체를 파괴하는 범죄와 폭력에 전쟁을 선포합니다. 헌법이 부여한 대통령의 모든 권한을 동원해 소탕하겠습니다. 둘째, 민주 사회의 기틀을 위협하는 불법과 무질서를 몰아내겠습니다. 셋째, 과소비와 투기, 퇴폐와 향락을 바로잡아 일하는 사회, 건강한 사회를 만들겠습니다.\"\n\n\"저 새끼 뭐라는 거냐? 우리 같은 놈들 잡아 처넣겠다는 거냐?\"\n\"걱정 마쇼, 형님. 우리가 짭새들한테 갖다 바친 게 얼맙니까? 절대 못 잡습니다. 잡는다 캐도 이래, 휙 하면 게임 끝입니다. 지 꼴에 검사 출신이라고 뭐 해 보는 갑지예.\"\n\"그래, 네 말이 맞다. 한두 번 겪은 일도 아니고.\"\n\n형님은 국밥에 숟가락을 얹었다. 화면 아래로 붉은 자막이 흘렀다. '조직폭력 및 민생침해사범 전면 소탕.'\n\n숟가락이 멈췄다.\n\n\"근데 이번엔 기류가 좀 이상하다. 검사 출신들이 직접 지휘 라인을 잡고 내려온다는 소문이 있어. 우리가 관리하던 경찰서 선에서 끝날 일이 아닐 수도 있다.\"\n\"에이, 형님도 참. 법 위에 돈 있고, 돈 위에 의리 있는 거 모릅니까. 식기 전에 드이소.\"\n\n동생은 헛웃음을 치며 소주잔을 비웠다. 구석의 다른 손님들은 TV에서 눈을 떼지 않았다. 주인의 얼굴도 싸늘하게 굳어 있었다.\n\n시대의 공기가 바뀌고 있었다. 그 식당에서 그걸 모르는 사람은 둘뿐이었다."
 tfrkphn.56.story:0 "정부의 군살을 빼자, 다음 차례가 어디인지 모두가 알았다. 노동계는 대통령이 도지사 시절 무엇을 했는지 잊지 않았다. 대통령도 잊지 않았다.\n\n이 나라 노동자 가운데 3퍼센트도 안 되는 사람들이 노동시장을 쥐고 흔든다. 노조는 원래 부당한 이익에 맞서는 사람들이다. 그런데 강성 노조는 스스로 부당한 이익을 챙기는 쪽이 되었다.\n\n진주의료원을 닫을 때 나는 그 민낯을 보았다. 파업의 기본은 '무노동 무임금'이다. 그들은 '무노동 유임금'으로 버텼다.\n\n환자를 옮기던 중 수혈이 필요했던 한 분이 끝내 돌아가신 일이 있었다. 가족이 수혈을 반대했기 때문이다. 그런데 민노총은 나를 살인자로 몰아 형사 고소까지 했다. 다행히 외과의사가 가족에게 받아 둔 수혈 거부 동의서가 있었다. 그들의 공세는 거짓으로 드러났다.\n\n전교조는 무상급식 감사를 막았다. 경남은 해마다 교육청에 무상급식비로 700억 원 넘게 보냈다. 그런데 감사는 한 번도 없었다. 백만 원을 지원해도 예산 감사는 받는 법이다. 나는 감사를 받지 않으면 지원을 끊겠다고 했다. 전교조는 내가 아이들 밥그릇을 빼앗는다고 선전했다.\n\n1년 넘는 싸움 끝에 감사가 이루어졌다. 88개 학교에서 2,306건의 불법이 나왔다. 질 낮은 식재료, 입찰 담합, 위장 업체. 아낀 돈으로 우리는 전국 최초로 서민 자녀 교육 지원 사업을 시작했다. 그들은 그 이야기는 쏙 빼고, 내가 그 돈으로 도의 빚을 갚았다고 퍼뜨렸다.\n\n강성 귀족 노조는 그들만의 세상에 산다. 일자리를 자식에게 대물림하고, 경영에 간섭하고, 불법 파업을 연례행사로 치른다. 생산성은 낮은데 임금은 높다. 현대차의 임금은 도요타와 폭스바겐보다 높다. 그런데 노동생산성은 미국보다 낮다.\n\n기업이 살아야 일자리가 생긴다. 이것을 바로잡지 못하면 기업은 해외로 떠나고, 청년들은 갈 곳을 잃는다. 지난 정권은 그들과 손을 잡았다. 이번에는 다르다.\n\n나는 노조를 부정하지 않는다. 노조의 부당한 행동을 바로잡으려 한다. 지금 바로잡지 못하면 디트로이트의 몰락은 이 땅에서 되풀이된다."
 tfrkphn.57.story:0 "칼을 휘두를수록 적은 늘었다. 신문은 매일 아침 '독선'이라 썼다. 방송은 '불통'이라 했다. 그는 마이크를 직접 잡기로 했다. 대통령이 되고 처음으로, 그 오래된 채널의 녹화 버튼이 다시 켜졌다.\n\n\"홍카콜라 시청자 여러분, 오랜만입니다. 제가 대통령이 된 지 벌써 이만큼 지났습니다.\n\n대만 전쟁 때 저는 대만을 도와야 한다고 호소했습니다. 국회의 결정이 어떻게 났든, 대한민국은 끝까지 자유민주주의 편에 섰습니다. 미국이 내전으로 무너졌을 때, 솔직히 저는 다 끝났다고 생각했습니다. 그런데 민주주의는 제 생각보다 강했습니다. 그 승리는 대한민국 국민 여러분의 것입니다.\n\nTV홍카콜라는 2018년 12월에 문을 열었습니다. 정치판도 언론도 기울어진 운동장이었습니다. 저는 속 시원한 진실을 국민께 직접 전하고 싶었습니다.\n\n언론이 할 일은 사실을 전하는 것입니다. 그래야 국민이 바르게 판단합니다. 그런데 박근혜 탄핵 무렵부터 언론은 사실보다 자기들이 바라는 방향을 먼저 보도했습니다. 좌파 언론에서 시작된 버릇이 다른 언론으로 번졌습니다.\n\n한때 40%에 이르던 공영방송 시청률은 이제 10% 아래로 떨어졌습니다. 신문 구독 부수도 날로 줄고 있습니다.\n\n저는 홍카콜라를 공정한 언론으로 키우겠습니다. 가짜 뉴스는 이 홍준표가 척결하겠습니다.\""
 tfrkphn.201.story:0 "정부가 문을 연 청년 제안 창구 '청년의 꿈'. 첫 달이 지나자 대통령 앞으로 상자 하나가 올라왔다. 들어온 글을 뽑아 출력한 것이었다. 비서관이 조심스럽게 말했다.\n\n\"좋은 말은 별로 없습니다. 거의 다... 화가 나 있습니다.\"\n\n대통령은 맨 위의 한 장을 집어 들었다.\n\n'집은 평생 못 살 것 같고, 결혼은 사치고, 아이는 꿈도 안 꿉니다. 그런데 어른들은 왜 노력을 안 하냐고 묻습니다.'\n\n다음 장은 남자가 썼다. 군대에서 보낸 이 년이 아무것도 아닌 시간이 되었다고 했다. 그다음 장은 여자가 썼다. 같은 회사에 들어와도 출발선이 다르다고 했다.\n\n두 사람은 서로를 탓하고 있었다. 그런데 나란히 놓고 보니 같은 말이었다. 우리는 손해 보고 있다. 아무도 우리 편이 아니다.\n\n대통령은 두 장을 한참 내려놓지 못했다. 언젠가 창유리 앞에서 혼자 중얼거렸던 말이 떠올랐다. 더는 남과 여를 따질 때가 아니라고. 말은 쉬웠다. 이 두 장 앞에서는 아니었다.\n\n그날 밤, 그는 예고 없이 서울의 한 대학가 분식집에 들렀다. 경호원들이 당황했다. 아르바이트생은 국자를 떨어뜨렸다. 구석 자리의 청년 몇이 휴대폰을 들어 올렸다.\n\n\"대통령님, 진짜 우리 얘기 읽긴 하세요?\"\n\n\"읽었습니다. 다는 못 읽었고, 오늘 오백 장쯤 읽었습니다.\"\n\n테이블 위로 웃음인지 한숨인지 모를 소리가 흘렀다.\n\n\"나는 여러분 나이 때 남의 땅 부쳐 먹던 집 아들이었습니다. 그때는 가난해도 열심히 하면 올라갈 사다리가 있었어요. 지금 여러분한테는 그 사다리가 없습니다. 그게 여러분 잘못이 아니라는 거, 압니다.\"\n\n그는 떡볶이 접시를 가운데로 밀었다.\n\n\"그 사다리, 다시 놓겠습니다. 대신 하나만 부탁합시다. 서로 싸우지 말고 나한테 따지세요. 남자든 여자든, 서울이든 지방이든. 화는 나한테 내고, 답은 같이 찾읍시다.\"\n\n다음 날 아침, '청년의 꿈'에는 처음으로 제안보다 질문이 더 많이 올라왔다. 대통령이 정말 답을 하느냐고. 그날부터 비서실은 매주 금요일, 대통령이 직접 쓴 답장을 올리기 시작했다."
 tfrkphn.201.story_a:0 "화는 나한테 내라."
 tfrkphn.202.story:0 "종전 기념식이 열린 광장. 영남과 호남의 시장이 나란히 섰다. 그 사이에 청년 대표 둘이 섰다. 한 사람은 예비역 병장, 한 사람은 사회 초년생이었다. 얼마 전까지 '청년의 꿈' 게시판에서 서로에게 날을 세우던 두 사람이었다.\n\n기념식이 끝나고, 대통령은 짧게 말했다.\n\n\"이 나라는 이름 없이 제자리를 지킨 여러분이 지켰습니다.\"\n\n그날 밤, 대통령은 다시 집무실 창가에 섰다.\n\n주머니 속 담뱃갑을 만지작거렸다. 그리고 그대로 서랍에 넣었다.\n\n창유리에는 여전히 그의 얼굴이 비쳤다. 오래 걸어온, 조금 지친 노인의 얼굴이었다.\n\n다할 진. 남은 힘을 다 쏟겠다고 다짐한 그 밤에서 많은 시간이 흘렀다. 나라는 아직 다 낫지 않았다. 그래도 오늘, 이 나라 사람들은 같은 자리에 함께 서 있었다.\n\n창문 틈으로 멀리서 노랫소리가 실려 왔다. 광장에 남은 사람들이 누가 먼저랄 것 없이 부르기 시작한 노래였다."
 tfrkphn.202.story_a:0 "힘을 다했다."
 tfrkphn.323.t:0 "화개장터"
 tfrkphn.323.desc:0 "기념식이 끝난 광장에는 아직 사람들이 남아 있었다. 확성기에서 행사 음악이 끊긴 자리에, 누군가의 휴대폰에서 낡은 가요 한 곡이 흘러나왔다. '화개장터'였다.\n\n처음에는 몇몇이 웃으며 흥얼거렸다. 대구에서 올라온 버스 기사가 박자를 맞췄고, 광주에서 온 시장 상인이 후렴을 받았다. 경상도 억양과 전라도 억양이 한 소절씩 엇갈리며 섞였다. 박자도 음정도 맞지 않았지만, 아무도 그걸 탓하지 않았다.\n\n예비역 병장과 사회 초년생이 있었다. 게시판에서 서로를 향해 날을 세우던 두 청년이었다. 둘은 어느새 같은 쪽을 보고 서 있었다. 누가 먼저 어깨를 들썩였는지는 아무도 기억하지 못했다.\n\n섬진강 하나를 사이에 두고 닷새마다 장이 서는 곳. 오래전부터 두 고장 사람들이 한데 모여 흥정하고 다투고 웃던 곳. 노래가 그리던 장터는, 그날 밤 서울 한복판에 잠시 다시 섰다."
 tfrkphn.323.a:0 "오시면 모두 이웃사촌"
 TFRKPHN_kj_nuke_category:0 "한일 공동 핵무장"
 TFRKPHN_kj_nuke_category_desc:0 "북한의 핵과 중국의 위협이 눈앞에 있습니다. 대한민국과 일본은 오랜 앙금을 접고 공동 핵억지력을 갖추기로 했습니다.\n\n두 나라가 모두 협정에 서명하면 공동 사업이 시작됩니다. 이후 단계는 두 나라 중 어느 쪽이든 맡아 끝내면 양국 모두 다음 단계로 넘어갑니다.\n\n§Y천연우라늄 -> 옐로 케이크§!에서 길은 둘로 나뉩니다.\n§Y플루토늄의 길§!: 핵연료봉 -> 원자로 -> 폐연료봉 -> 재처리 공장 -> 플루토늄 -> 핵탄두\n§Y우라늄의 길§!: 원심분리기 -> 고농축 우라늄 -> 핵탄두\n\n어느 길이든 핵탄두가 완성되면 양국 모두 핵폭탄을 받습니다."
 TFRKPHN_kj_nuke_unlock_tt:0 "§Y한일 공동 핵무장§! 결정이 §G대한민국§!과 §G일본§! 양쪽에 열립니다."
 TFRKPHN_kj_partner_exists_tt:0 "상대국(대한민국 또는 일본)이 존재해야 합니다."
 TFRKPHN_kj_nuke_threat:0 "한일 공동 핵무장"
 TFRKPHN_kj_nuke_hostile:0 "한일 공동 핵무장"
 tfrkphn.324.t:0 "서울에서 온 제안"
 tfrkphn.324.desc:0 "대한민국 정부가 PDTO 핵억지 협의를 마치고 도쿄에 비공개 친서를 보내왔습니다. 북한과 중국의 핵 위협에 맞서 두 나라가 함께 핵억지력을 갖추자는 제안입니다.\n\n\"과거는 과거대로 기억하되, 내일은 함께 지킵시다.\"\n\n총리 관저에서는 긴 침묵이 흘렀습니다. 피폭의 기억을 가진 나라에게 핵은 쉽게 꺼낼 수 있는 단어가 아니었습니다. 그러나 동중국해 너머의 현실 역시 외면할 수 없었습니다."
 tfrkphn.324.a:0 "검토해 보지."
 tfrkphn.325.t:0 "한일 공동 핵무장 협정 발효"
 tfrkphn.325.desc:0 "서울과 도쿄가 마침내 같은 문서에 서명했습니다. 두 나라는 연구를 나누어 맡고, 완성된 억지력은 함께 지키기로 했습니다.\n\n반세기 넘게 서로를 경계해 온 두 이웃이, 이번에는 같은 방향을 바라보게 되었습니다."
 tfrkphn.325.a:0 "이제 시작이다."
 tfrkphn.326.t:0 "한국과 일본, 핵보유국 대열에"
 tfrkphn.326.desc:0 "방금 들어온 소식입니다. 대한민국과 일본이 공동 개발한 핵탄두의 실전 배치를 공식 발표했습니다. 동아시아의 힘의 균형이 하루아침에 바뀌었습니다.\n\n평양과 베이징은 즉각 강하게 반발했습니다. 세계 각국은 동아시아에 새로운 핵 시대가 열렸다며 우려하고 있습니다."
 tfrkphn.326.a:0 "동아시아의 판이 바뀌었다."
