 tfrkphn.412.t:0 "최성혁 해군작전사령관 임명"
 tfrkphn.412.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 해군중장 최성혁이 해군작전사령관에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"동해, 서해, 남해를 한 사람이 봅니다. 잠수함 잡는 훈련을 늘려 주세요.\"\n\n최성혁 중장은 경례로 답했다."
 tfrkphn.412.a:0 "충성!"
