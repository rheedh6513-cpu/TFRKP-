 tfrkphn.421.t:0 "신규 육군참모총장 임명"
 tfrkphn.421.desc:0 "육군참모총장 자리를 맡길 사람을 정해야 한다.\n\n임명식은 청와대에서 열리며, 대통령이 신임 총장의 삼정검에 직접 수치를 달아 준다. 삼정검은 장군으로 진급할 때 받는 칼이다. 호국, 통일, 번영의 뜻을 담고 있다. 수치에는 직책과 계급, 이름, 그리고 대통령의 이름이 새겨진다.\n\n대통령은 빈틈없는 대비 태세와 함께 초급 간부의 처우를 챙겨 달라고 당부할 생각이다.\n\n§Y누구를 육군참모총장으로 임명하시겠습니까?§!"
