 tfrkphn.53.story:0 "나라를 하나로 묶으려면 먼저 썩은 곳을 도려내야 했다. 그러나 칼을 들기 전에, 그는 자신이 한때 그 칼끝에 서 있었던 날을 떠올렸다.\n\n$tfrkphn.53.desc$\n\n억울함은 그를 무너뜨리지 못했다. 오히려 그날 이후 그는 더 분명히 알게 되었다. 칼은 휘두르는 사람이 깨끗해야 칼이라는 것을."
 tfrkphn.55.story:0 "담화 원고의 마지막 장에는 그가 직접 펜으로 한 줄을 덧붙여 두었다. '말로 끝나면, 나도 끝이다.'\n\n$tfrkphn.55.desc$"
 tfrkphn.56.story:0 "정부의 군살을 빼자, 다음 차례가 어디인지는 모두가 알고 있었다. 노동계는 대통령이 도지사 시절 무엇을 했는지 잊지 않았고, 대통령 역시 잊지 않았다.\n\n$tfrkphn.56.desc$"
 tfrkphn.57.story:0 "칼을 휘두를수록 적은 늘었다. 신문은 매일 아침 '독선'이라 썼고, 방송은 '불통'이라 했다. 그는 마이크를 직접 잡기로 했다. 대통령이 되고 나서 처음으로, 그 오래된 채널의 녹화 버튼이 다시 켜졌다.\n\n$tfrkphn.57.desc$"
 tfrkphn.201.story:0 "정부가 문을 연 청년 제안 창구 '청년의 꿈'. 첫 달이 지나자 대통령 앞으로 상자 하나가 올라왔다. 들어온 글을 뽑아 출력한 것이었다. 비서관은 조심스럽게 말했다.\n\n\"좋은 말은 별로 없습니다. 거의 다... 화가 나 있습니다.\"\n\n대통령은 맨 위의 한 장을 집어 들었다.\n\n'집은 평생 못 살 것 같고, 결혼은 사치고, 아이는 꿈도 안 꿉니다. 그런데 어른들은 우리한테 왜 노력을 안 하냐고 묻습니다.'\n\n다음 장은 남자가 썼다. 군대에서 보낸 이 년이 아무것도 아닌 시간이 되었다고 했다. 그다음 장은 여자가 썼다. 같은 회사에 들어와도 출발선이 다르다고 했다. 두 사람은 서로를 탓하고 있었지만, 두 장을 나란히 놓고 보니 같은 말을 하고 있었다. 우리는 손해 보고 있다고. 아무도 우리 편이 아니라고.\n\n대통령은 그 두 장을 한참 동안 내려놓지 못했다. 언젠가 창유리 앞에서 혼자 중얼거렸던 말이 떠올랐다. 더는 남과 여를 따질 때가 아니라고. 말은 쉬웠다. 이 두 장의 종이 앞에서는 아니었다.\n\n그날 밤, 그는 예고 없이 서울의 한 대학가 분식집에 들렀다. 경호원들이 당황했고, 아르바이트생은 국자를 떨어뜨렸다. 구석 자리에 앉아 있던 청년 몇이 휴대폰을 들어 올렸다.\n\n\"대통령님, 진짜 우리 얘기 읽긴 하세요?\"\n\n\"읽었습니다. 다 읽지는 못했고, 오늘 오백 장쯤 읽었습니다.\"\n\n웃음인지 한숨인지 모를 소리가 테이블 위로 흘렀다.\n\n\"나는 여러분 나이 때 남의 땅에서 농사짓던 집 아들이었습니다. 그때는 가난해도 열심히 하면 올라갈 사다리가 있었어요. 지금 여러분한테는 그 사다리가 없다는 거, 그게 여러분 잘못이 아니라는 거, 알고 있습니다.\"\n\n그는 떡볶이 접시를 가운데로 밀었다.\n\n\"그 사다리 다시 놓겠습니다. 대신 하나만 부탁합시다. 서로 싸우지 말고, 나한테 따지세요. 남자든 여자든, 서울이든 지방이든. 화는 나한테 내고, 답은 같이 찾읍시다.\"\n\n다음 날 아침, '청년의 꿈' 창구에는 처음으로 제안보다 질문이 더 많이 올라왔다. 대통령이 정말 답을 하느냐고. 비서실은 그날부터 매주 금요일, 대통령이 직접 쓴 답장을 올리기 시작했다."
 tfrkphn.201.story_a:0 "화는 나한테 내라."
 tfrkphn.202.story:0 "승전 기념식이 열린 광장. 영남과 호남의 시장들이 나란히 섰고, 청년 대표 둘이 그 사이에 섰다. 한 사람은 예비역 병장이었고, 한 사람은 사회 초년생이었다. 얼마 전까지만 해도 '청년의 꿈' 게시판에서 서로에게 날을 세우던 두 사람이었다.\n\n열병식이 끝나고, 대통령은 짧게 말했다.\n\n\"이 나라를 지킨 것은 장군도, 대통령도 아니었습니다. 이름 없이 총을 들었던 여러분의 아들딸이었습니다.\"\n\n그날 밤, 대통령은 다시 집무실 창가에 섰다.\n\n주머니 속 담뱃갑을 만지작거리다, 그대로 서랍 안에 넣었다. 창유리에는 여전히 그의 얼굴이 비쳤다. 두려움에 떨던 사내도, 애써 단단한 척하던 사내도 아니었다. 그저 오래 걸어온, 조금 지친 노인의 얼굴이었다.\n\n다할 진. 남은 힘을 다 쏟겠다고 했던 그 밤으로부터 많은 시간이 흘렀다. 나라는 아직 다 낫지 않았다. 그러나 적어도 오늘, 이 나라 사람들은 같은 자리에 함께 서 있었다.\n\n창문 틈으로 멀리서 노랫소리가 실려 왔다. 광장에 남은 사람들이 누가 먼저랄 것 없이 부르기 시작한 노래였다."
 tfrkphn.202.story_a:0 "힘을 다했다."
 tfrkphn.323.t:0 "화개장터"
 tfrkphn.323.desc:0 "기념식이 끝난 광장에는 아직 사람들이 남아 있었다. 확성기에서 행사 음악이 끊긴 자리에, 누군가의 휴대폰에서 낡은 가요 한 곡이 흘러나왔다. 「화개장터」였다.\n\n처음에는 몇몇이 웃으며 흥얼거렸다. 대구에서 올라온 버스 기사가 박자를 맞췄고, 광주에서 온 시장 상인이 후렴을 받았다. 경상도 억양과 전라도 억양이 한 소절씩 엇갈리며 섞였다. 박자도 음정도 맞지 않았지만, 아무도 그걸 탓하지 않았다.\n\n예비역 병장과 사회 초년생, 게시판에서 서로를 향해 날을 세우던 두 청년도 어느새 같은 쪽을 보고 서 있었다. 누가 먼저 어깨를 들썩였는지는 아무도 기억하지 못했다.\n\n섬진강 하나를 사이에 두고 닷새마다 장이 서는 곳. 오래전부터 두 고장 사람들이 한데 모여 흥정하고 다투고 웃던 곳. 노래가 그리던 장터는, 그날 밤 서울 한복판에 잠시 다시 섰다."
 tfrkphn.323.a:0 "오시면 모두 이웃사촌"
 TFRKPHN_kj_nuke_category:0 "한일 공동 핵무장"
 TFRKPHN_kj_nuke_category_desc:0 "북한의 핵과 중국의 위협 앞에서, 대한민국과 일본은 오랜 앙금을 접고 공동 핵억지력을 갖추기로 했습니다.\n\n두 나라가 모두 협정에 서명하면 공동 사업이 시작됩니다. 이후 단계는 두 나라 중 어느 쪽이든 맡아 끝내면 양국 모두 다음 단계로 넘어갑니다.\n\n§Y천연우라늄 -> 옐로 케이크§!에서 길은 둘로 나뉩니다.\n§Y플루토늄의 길§!: 핵연료봉 -> 원자로 -> 폐연료봉 -> 재처리 공장 -> 플루토늄 -> 핵탄두\n§Y우라늄의 길§!: 원심분리기 -> 고농축 우라늄 -> 핵탄두\n\n어느 길이든 핵탄두가 완성되면 양국 모두 핵폭탄을 받습니다."
 TFRKPHN_kj_nuke_unlock_tt:0 "§Y한일 공동 핵무장§! 결정이 §G대한민국§!과 §G일본§! 양쪽에 열립니다."
 TFRKPHN_kj_partner_exists_tt:0 "상대국(대한민국 또는 일본)이 존재해야 합니다."
 TFRKPHN_kj_nuke_threat:0 "한일 공동 핵무장"
 TFRKPHN_kj_nuke_hostile:0 "한일 공동 핵무장"
 tfrkphn.324.t:0 "서울에서 온 제안"
 tfrkphn.324.desc:0 "대한민국 정부가 PDTO 핵억지 협의를 마치고 도쿄에 비공개 친서를 보내왔습니다. 북한과 중국의 핵 위협에 맞서 두 나라가 함께 핵억지력을 갖추자는 제안입니다.\n\n\"과거는 과거대로 기억하되, 내일은 함께 지킵시다.\"\n\n총리 관저에서는 긴 침묵이 흘렀습니다. 피폭의 기억을 가진 나라에게 핵은 쉽게 꺼낼 수 있는 단어가 아니었습니다. 그러나 동중국해 너머의 현실 역시 외면할 수 없었습니다."
 tfrkphn.324.a:0 "검토해 보지."
 tfrkphn.325.t:0 "한일 공동 핵무장 협정 발효"
 tfrkphn.325.desc:0 "서울과 도쿄가 마침내 같은 문서에 서명했습니다. 두 나라는 연구를 나누어 맡고, 완성된 억지력은 함께 지키기로 했습니다.\n\n반세기 넘게 서로를 경계해 온 두 이웃이, 이번에는 같은 방향을 바라보게 되었습니다."
 tfrkphn.325.a:0 "이제 시작이다."
 tfrkphn.326.t:0 "한국과 일본, 핵보유국 대열에"
 tfrkphn.326.desc:0 "방금 들어온 소식에 따르면, 대한민국과 일본이 공동 개발한 핵탄두의 실전 배치를 공식 발표했습니다. 동아시아의 힘의 균형이 하루아침에 바뀌었습니다.\n\n평양과 베이징은 즉각 강하게 반발했고, 세계 각국은 동아시아에 새로운 핵 시대가 열렸다며 우려와 경계를 함께 드러내고 있습니다."
 tfrkphn.326.a:0 "동아시아의 판이 바뀌었다."
 TFRKPHN_kj_title:0 "한일 공동 핵무장"
 TFRKPHN_kj_sign_btn:0 "협정 서명"
 TFRKPHN_kj_sign_btn_tt:0 "§Y공동 핵무장 협정 서명§!\n정치력 §R-50§!\n상대국도 서명하면 협정이 발효되고 그림 위의 시설을 가동할 수 있습니다."
