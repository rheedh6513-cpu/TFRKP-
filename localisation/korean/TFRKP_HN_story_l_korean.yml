 tfrkphn.414.t:0 "손석락 공군참모차장 임명"
 tfrkphn.414.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 공군중장 손석락이 공군참모차장에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"정비가 안 되면 비행기는 못 뜹니다. 격납고를 자주 돌아보세요.\"\n\n손석락 중장은 경례로 답했다."
 tfrkphn.414.a:0 "충성!"
