 # 임명식 이벤트 (events/TFRKP_HN_mnd_events.txt)
 TFRKPHN_cost_cp10:0 "£command_power §Y10§!"
 TFRKPHN_appoint_park_an_su:0 "박안수 육군참모총장"
 tfrkphn.401.t:0 "박안수 육군참모총장 임명"
 tfrkphn.401.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 육군대장 박안수가 육군참모총장에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"초급 간부 처우부터 챙기세요. 사람이 남아야 군대가 삽니다.\"\n\n박안수 대장은 경례로 답했다."
 tfrkphn.401.a:0 "충성!"
 TFRKPHN_appoint_kang_sin_chul:0 "강신철 PDTO연합군 부사령관"
 tfrkphn.402.t:0 "강신철 PDTO연합군 부사령관 임명"
 tfrkphn.402.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 육군대장 강신철이 PDTO연합군 부사령관에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"동맹군 사이에서 우리 목소리를 내는 자리입니다. 할 말은 하세요.\"\n\n강신철 대장은 경례로 답했다."
 tfrkphn.402.a:0 "충성!"
 TFRKPHN_appoint_son_sik:0 "손식 지상작전사령관"
 tfrkphn.403.t:0 "손식 지상작전사령관 임명"
 tfrkphn.403.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 육군대장 손식이 지상작전사령관에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"전방은 사령관이 책임집니다. 보고는 짧게 하고 조치는 먼저 하세요.\"\n\n손식 대장은 경례로 답했다."
 tfrkphn.403.a:0 "충성!"
 TFRKPHN_appoint_ko_chang_jun:0 "고창준 육군 제2작전사령관"
 tfrkphn.404.t:0 "고창준 육군 제2작전사령관 임명"
 tfrkphn.404.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 육군대장 고창준이 육군 제2작전사령관에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"후방이 뚫리면 전방도 못 버팁니다. 항만과 공단을 잘 지켜 주세요.\"\n\n고창준 대장은 경례로 답했다."
 tfrkphn.404.a:0 "충성!"
 TFRKPHN_appoint_hwang_you_sung:0 "황유성 합동참모차장"
 tfrkphn.405.t:0 "황유성 합동참모차장 임명"
 tfrkphn.405.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 육군중장 황유성이 합동참모차장에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"의장이 밖을 볼 때 안을 챙기는 자리입니다. 빈틈을 찾아서 메워 주세요.\"\n\n황유성 중장은 경례로 답했다."
 tfrkphn.405.a:0 "충성!"
 TFRKPHN_appoint_yeo_in_hyeong:0 "여인형 국군방첩사령관"
 tfrkphn.406.t:0 "여인형 국군방첩사령관 임명"
 tfrkphn.406.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 육군중장 여인형이 국군방첩사령관에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"군의 기밀이 새지 않게 하세요. 정치 쪽은 쳐다보지도 마세요.\"\n\n여인형 중장은 경례로 답했다."
 tfrkphn.406.a:0 "충성!"
 TFRKPHN_appoint_lee_jin_woo:0 "이진우 수도방위사령관"
 tfrkphn.407.t:0 "이진우 수도방위사령관 임명"
 tfrkphn.407.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 육군중장 이진우가 수도방위사령관에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"서울 하늘과 한강 다리를 맡깁니다. 밤에도 깨어 있어야 하는 자리입니다.\"\n\n이진우 중장은 경례로 답했다."
 tfrkphn.407.a:0 "충성!"
 TFRKPHN_appoint_kwak_jong_keun:0 "곽종근 특수전사령관"
 tfrkphn.408.t:0 "곽종근 특수전사령관 임명"
 tfrkphn.408.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 육군중장 곽종근이 특수전사령관에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"가장 먼저 들어가고 가장 늦게 나오는 부대입니다. 훈련을 실전처럼 하세요.\"\n\n곽종근 중장은 경례로 답했다."
 tfrkphn.408.a:0 "충성!"
 TFRKPHN_appoint_kim_myung_soo:0 "김명수 합동참모의장"
 tfrkphn.409.t:0 "김명수 합동참모의장 임명"
 tfrkphn.409.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 해군대장 김명수가 합동참모의장에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"육해공이 따로 싸우면 집니다. 군끼리 다투는 일은 의장 선에서 끝내세요.\"\n\n김명수 대장은 경례로 답했다."
 tfrkphn.409.a:0 "충성!"
 TFRKPHN_appoint_yang_yong_mo:0 "양용모 해군참모총장"
 tfrkphn.410.t:0 "양용모 해군참모총장 임명"
 tfrkphn.410.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 해군대장 양용모가 해군참모총장에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"배는 짓는 데 십 년이 걸립니다. 십 년 뒤에 쓸 함대를 지금 준비하세요.\"\n\n양용모 대장은 경례로 답했다."
 tfrkphn.410.a:0 "충성!"
 TFRKPHN_appoint_kang_dong_gil:0 "강동길 해군참모차장"
 tfrkphn.411.t:0 "강동길 해군참모차장 임명"
 tfrkphn.411.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 해군중장 강동길이 해군참모차장에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"총장이 바다를 볼 때 살림을 맡는 자리입니다. 수병들 밥과 잠자리부터 보세요.\"\n\n강동길 중장은 경례로 답했다."
 tfrkphn.411.a:0 "충성!"
