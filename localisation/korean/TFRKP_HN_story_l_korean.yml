 # 한일 공동 핵무장: 동해상 핵실험
 tfrkphn.327.t:0 "동해상 의문의 폭발"
 tfrkphn.327.desc:0 "대한민국 정부와 일본 정부가 지난주부터 동해상에서의 어업 및 선박 운항 전면 금지를 선언한 가운데, 오늘 아침 7시경 대한민국 동해상에서 미상의 폭발이 감지되었습니다.\n\n최근 양국이 공동 원자력 협정을 체결한 이후, 전문가들은 꾸준히 한국의 '핵무장' 가능성을 제기해 왔습니다.\n\n홍준표 대통령이 북핵과 중국의 핵무기에 대한 강경 대응과 핵균형을 줄곧 주장해 온 만큼, 한국의 핵개발설은 상당한 신빙성을 얻고 있습니다.\n\n민주노동당과 일본 공산당은 공동 성명을 내고 핵개발 반대 입장을 밝혔으며, 각종 평화주의 시민단체들은 가두행진을 조직하고 있습니다.\n\n아직 한국 정부는 공식 입장을 내놓지 않았지만, 한국이 인류 역사상 가장 강력한 무기 중 하나를 손에 넣었다는 사실은 자명해 보입니다."
 tfrkphn.327.a:0 "이젠 동북아가 불타오른다..."
 # 사우디 내전 후: 종량제 봉투 사재기
 tfrkphn.328.t:0 "\"1인당 1장만 살 수 있대\"... 전쟁발 '쓰봉' 사재기 조짐"
 tfrkphn.328.desc:0 "§Y조선일보§!\n\n사우디아라비아 내전으로 비닐의 핵심 원료인 나프타(납사) 수급에 비상이 걸리자, 일부 시민들이 종량제 봉투 사재기에 나서는 등 불안이 확산하고 있다.\n\n24일 업계 등에 따르면 최근 소비자들의 종량제 봉투 구매 수요가 급증하고 있다. 종량제 봉투를 판매하는 '종량제닷컴'은 홈페이지에 \"최근 국제 정세의 영향으로 종량제 봉투 제작부터 수급 및 입고 일정이 원활하지 못합니다\"라고 공지를 내걸었다.\n\n이날 편의점 커뮤니티에도 \"출근했더니 10L, 20L 종량제는 이미 품절이었는데 종량제 찾는 손님이 계속 찾아온다\"는 글이 올라왔다. 나프타 수급 불안으로 비닐 대란이 올 것을 걱정한 시민들이 생활에 필요한 종량제 봉투를 미리 구매하고 나선 것이다.\n\n사재기 우려에 일부 편의점과 마트에선 종량제 봉투 구매 개수를 제한하고 있다. 지역 커뮤니티에는 \"종량제 봉투 사러 갔다가 일인당 2개라고 해서 깜짝 놀랐다\", \"마트 갔더니 사재기로 쓰레기봉투 1인당 1장만 판다고 하더라\", \"이제 종량제 봉투 10개짜리 묶음은 안 팔고 한 장씩 판대요\" 등의 글이 올라왔다.\n\n정부는 나프타 수출을 제한하는 방안을 검토하고 나섰다."
 tfrkphn.328.a:0 "월급만 빼고 다 오르네"
 # 2022.2.20 이낙연 유세 말실수
 tfrkphn.140.t:0 "경제가 망하는 걸 보려면"
 tfrkphn.140.desc:0 "\"경제가 망하는 걸 보려면, 민주주의가 후퇴하는 것을 보려면 누구를 선택합니까?\"\n\n\"이낙연! 이낙연!\"\n\n...."
 tfrkphn.140.a:0 "이.. 이낙연 아니고요"
