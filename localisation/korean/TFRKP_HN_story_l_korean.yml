 tfrkphn.52.story:0 "자정이 넘은 대통령 집무실. 한 사내가 홀로 앉아 있다.\n\n그는 국민 앞에서 선진대국의 길을 약속했다. 박수와 환호는 이미 지나갔고, 이제 그 약속을 현실로 만들어야 하는 무거운 의무만이 책상 위에 남아 있었다.\n\n사내는 오랜만에 주머니를 뒤져 담배 한 개비를 꺼냈다. 끊은 지 오래였지만, 오늘 밤만큼은 손이 먼저 움직였다.\n\n불을 붙이고 고개를 들자 어두운 창유리에 자신의 얼굴이 비쳤다. 그 안에는 대통령이 아니라, 두려움에 떨고 있는 한 남자가 있었다. 지지율 그래프, 갈라진 여론, 서로를 향해 날을 세운 사람들. 그 모든 것이 창밖의 어둠처럼 그를 둘러싸고 있었다.\n\n그는 연기를 길게 내뿜으며 나지막이 중얼거렸다.\n\n\"국민의 결집.... 이 나라가 살아남으려면, 더는 좌와 우를, 남과 여를 따질 때가 아니다. 모두가 하나의 길로 모여야 한다.\"\n\n담배를 비벼 끈 사내는 다시 창유리를 바라보았다.\n\n이번에는 다른 얼굴이 있었다. 흔들림 없이 앞을 응시하는, 누구보다 진지하고 단단한 사내의 얼굴이었다.\n\n국민이 하나로 뭉치고, 정치가 제자리를 찾고, 지역과 지역이 손을 맞잡을 때. 그때 비로소 이 나라는 진정한 선진대국으로 도약할 수 있으리라."
 tfrkphn.322.t:0 "검사의 길"
 tfrkphn.322.desc:0 "경상남도 창녕의 작은 시골. 남의 땅을 부쳐 먹던 집에서 소년은 자랐다. 아버지는 일당 몇백 원을 받는 경비원이었고, 어머니는 장터에 좌판을 펴고 가발을 팔았다.\n\n그 장터에서 소년은 평생 잊지 못할 장면을 보았다. 고리 사채 몇 푼 때문에, 사채업자가 어머니의 머리채를 움켜쥐고 길바닥으로 끌고 가는 모습이었다. 사람들은 고개를 돌렸고, 누구도 나서지 않았다. 소년은 주먹만 쥔 채 그 자리에 서 있었다.\n\n가난에서 벗어나는 길은 공부뿐이었다. 소년은 이를 악물었고, 마침내 사관학교 합격 통지서를 손에 쥐었다. 군복을 입으면 적어도 누구에게도 무시당하지 않으리라 믿었다.\n\n그런데 그해, 아버지가 하지도 않은 일로 누명을 썼다. 경찰에 불려 다니며 시달리는 아버지를 지켜보던 어느 날, 동네 어른들이 혀를 차며 말했다.\n\n\"야, 군인보다 센 직업이 뭔지 아나?\"\n\"니 그것도 모르나. 군인도 검사 앞에선 꼼짝 못 한다.\"\n\n그 말이 소년의 인생을 바꿨다. 그는 사관학교 대신 다시 책상 앞에 앉았다. 힘없는 사람이 억울하게 끌려가지 않는 세상. 그것을 만들 수 있는 사람이 되겠다고.\n\n몇 년 뒤, 그는 정말 검사가 되었다.\n\n남쪽 도시의 강력부에서 그는 조직폭력배들을 하나씩 잡아들였다. 그리고 서울로 올라와, 도박 업계 뒤에 숨은 권력의 그림자와 마주했다. 수사가 깊어질수록 이름만 들어도 알 만한 실세들, 그리고 같은 검찰의 선배들 얼굴까지 드러났다.\n\n\"홍 검사, 당신 지금 실수하는 거요.\"\n\n수화기 너머의 목소리는 낮고 차가웠다. 그는 수화기를 내려놓고 다음 서류를 펼쳤다. 그해 그는 권력의 실세들에게 수갑을 채웠고, 세상은 그를 '모래시계 검사'라 불렀다.\n\n그러나 조직은 길들지 않는 검사를 반기지 않았다. 그는 한직을 전전했고, 결국 검사복을 벗었다.\n\n그를 기다린 것은 평온이 아니었다. 그가 감옥에 보냈던 깡패들이 하나둘 출소해, 검사가 아닌 그와 그의 가족 주변을 서성이기 시작했다. 한밤중의 전화, 집 앞을 맴도는 낯선 그림자.\n\n그때 집권당에서 손을 내밀었다. 함께 정치를 해 보자고.\n\n그는 훗날 솔직하게 털어놓았다. 거창한 나라와 민족 때문이 아니었다고. 가족을 지키려고 정치판에 들어왔다고.\n\n장터에서 주먹을 쥐고 서 있던 소년은, 그렇게 정치라는 더 큰 싸움터로 걸어 들어갔다."
 tfrkphn.322.a:0 "칼날은 다시 선다."
 tfrkphn.58.story:0 "사람들은 그를 '서민대통령'이라 불렀다.\n그를 설명하는 데 그보다 짧고 정확한 말은 없었다.\n남쪽 끝 작은 마을, 남의 땅을 부쳐 먹던 소작농의 집에서 태어난 아이.\n그 아이가 마침내 이 나라의 가장 높은 자리에 섰다.\n\n취임 전날 밤, 그는 조용히 눈을 감았다.\n지나온 날들이 물살처럼 눈꺼풀 안으로 흘러들었다.\n\n어머니가 힘 있는 자에게 맞고도 아무 말 못 하던 날.\n흙 묻은 손으로 얼굴을 가리던 어머니를 보며, 열다섯 살 소년은 처음으로 법이라는 단어를 마음에 새겼다. 약한 사람이 기댈 곳이 없다면, 내가 그 기둥이 되겠다고.\n\n검사가 되어 권력의 썩은 뿌리와 처음 마주한 날.\n서류 한 장을 넘길 때마다 위에서 전화가 걸려 왔다. 그는 수화기를 내려놓고 다음 장을 넘겼다.\n\n목숨을 노리는 위협을 피해 정치의 문을 두드린 날.\n칼끝을 피해 들어선 곳이 또 다른 싸움터라는 걸 그는 알고 있었다. 그래도 거기서라면 더 많은 사람을 지킬 수 있으리라 믿었다.\n\n그리고 생의 마지막이라 다짐하고 대통령 선거에 나섰던 날.\n더는 물러설 곳도, 다음도 없다는 마음으로 그는 마지막 연설대에 올랐다.\n\n서민으로 태어나 서민의 눈물로 자란 사람.\n그는 자신이 지나온 모든 기억을, 이제 그들에게 돌려주기로 마음먹었다.\n\n눈을 뜬 그는 연설문의 첫 장을 펼쳤다."
 tfrkphn.200.story_t:0 "달빛 아래, 화합으로 나아가는 길"
 tfrkphn.200.story:0 "대구와 광주의 시장이 나란히 선 연단. 대통령은 준비한 원고를 내려다보다, 그대로 접어 안주머니에 넣었다.\n\n\"서로를 증오해서 우리가 얻는 것은 무엇입니까.\n미움에 사로잡히면 우리는 상대의 옆모습만 봅니다. 누가 앞섰는지 곁눈질하는 동안, 그 사람이 어떤 길을 바라보며 걷는지는 끝내 보지 못합니다.\n미움이 지역과 지역 사이로 번지면, 우리 앞에는 높은 방벽만 남습니다.\n그러나 차별이라는 마음을 한 장씩 걷어 낸다면, 벽이 있던 자리에 그 땅에서만 피어나는 꽃들이 보일 것입니다.\n저 달빛은 이 고장과 저 고장을 가리지 않고 같은 밤을 비춥니다.\n하나가 된다는 것은 모두가 같아지는 것이 아니라, 서로 다른 채로 같은 빛을 받아들이는 일일지도 모릅니다.\n이제 고개를 돌려 서로의 얼굴을 정면으로 마주합시다.\n화해는 거기서 시작되고, 우리는 그 위에서만 함께 앞으로 나아갈 수 있습니다.\""
 tfrkphn.120.story_t:0 "선진대국의 길"
 tfrkphn.120.story:0 "진정한 선진국은 통계표 위의 숫자만으로 완성되지 않는다. 국내총생산이 아무리 거대해도 그 부가 소수의 손에만 머문다면, 그 나라는 큰 나라일 수는 있어도 앞선 나라라고 부르기는 어렵다.\n\n진정한 선진국이란 경제의 힘, 사회의 신뢰, 시민의 의식, 도덕의 무게가 어긋나지 않고 함께 자라난 나라다. 어느 한 기둥만 높아서는 지붕이 서지 않는다.\n\n§Y첫째, 강한 경제가 모두의 삶으로 이어지는 나라§!\n1인당 국민소득이 4만 달러를 바라본다 해도, 중산층이 무너지고 서민의 하루가 버거워지는 나라라면 선진대국이 아니다. 성장의 열매가 고르게 나뉘고, 출발선이 공정하며, 국민이 내일을 두려워하지 않을 때 비로소 경제는 국력이 된다.\n\n§Y둘째, 서로를 믿을 수 있는 나라§!\n법과 제도가 제자리를 지키고, 부정과 부패가 설 자리를 잃은 나라. 국제 비교에서 우리 사회의 신뢰 수준은 여전히 선진국 평균에 크게 못 미친다. 국민이 정부를 믿고, 기업을 믿고, 무엇보다 서로를 믿을 수 있을 때 사회는 비용 대신 힘을 얻는다.\n\n§Y셋째, 시민의 품격이 살아 있는 나라§!\n아무도 보지 않는 신호등 앞에서도 멈춰 서고, 공공장소에서 낯선 이를 배려하는 일이 특별한 미덕이 아니라 당연한 습관인 사회. 가진 사람이 나눔을 부담이 아닌 책임으로 여기는 사회. 이런 작은 의식들이 쌓여 나라의 품격이 된다.\n\n§Y넷째, 윗물이 맑은 나라§!\n나라의 얼굴은 결국 그 나라 사람들이고, 그 얼굴의 맨 앞에는 지도층이 선다. 지도자가 먼저 모범을 보이고 정치가 깨끗해야 한다. 학연과 지연과 혈연이 아니라 실력과 공정함이 사람을 재는 기준이 될 때, 그 사회는 비로소 앞으로 나아간다.\n\n§Y맺으며§!\n진정한 선진대국이란 무엇일까. 국민이 잘사는 나라인가, 깨끗한 나라인가, 경제가 강한 나라인가. 하나만 고르면 틀린 답이고, 모두를 함께 말할 때에야 맞는 답이 된다.\n\n그리고 그 모든 것의 출발점은 가장 높은 자리에 앉은 사람의 청렴이다. 지금 이 나라에서 성공으로 가는 길은 여전히 인맥이라는 좁은 문을 지나는 경우가 많다. 그 문은 몇 사람에게는 지름길이 되지만, 나라 전체를 조금씩 갉아먹는다.\n\n모두에게 공정한 길, 모두가 행복할 수 있는 길, 누구나 들여다볼 수 있는 투명한 길. 그 길 위에서만 진정한 선진대국의 시대가 열릴 것이다."
 tfrkphn.54.story:0 "국무회의실의 긴 탁자 위에 두꺼운 보고서 한 묶음이 놓였다. 표지에는 '정부 조직 진단 결과'라는 건조한 글씨가 적혀 있었다.\n\n장관들은 서로 눈치를 보며 첫 장을 넘겼다. 위원회만 수백 개, 이름만 남고 회의는 한 번도 열리지 않은 곳이 수두룩했다. 비슷한 일을 하는 부서가 서너 곳씩 겹쳐 있었고, 서류 한 장이 결재를 받기까지 도장 일곱 개를 거쳐야 했다.\n\n\"전쟁은 끝났습니다. 그런데 정부는 아직도 전시 체제의 몸집 그대로입니다.\"\n\n대통령은 보고서를 덮고 천천히 말을 이었다.\n\n\"도지사 시절에 배운 게 하나 있습니다. 빚은 숫자가 아니라 버릇이라는 겁니다. 쓰던 대로 쓰고, 늘리던 대로 늘리면, 그 청구서는 결국 우리 아이들 앞으로 날아갑니다.\"\n\n누군가 조심스럽게 손을 들었다. 공무원 노조의 반발, 지역구 의원들의 민원, 일자리가 줄어든다는 비판. 대통령도 모르는 바가 아니었다.\n\n\"사람을 내보내자는 게 아닙니다. 새로 뽑을 자리를 묶고, 겹치는 일을 합치고, 안 쓰는 위원회부터 문을 닫자는 겁니다. 국민 세금으로 돌아가는 조직이라면, 국민이 한 번에 알아볼 수 있을 만큼 단순해야 합니다.\"\n\n그날 오후, 정부는 공무원 정원 동결과 함께 위원회 정비, 중복 부처 통폐합 계획을 발표했다. 일부 언론은 '칼바람'이라 썼고, 또 다른 언론은 '늦었지만 필요한 다이어트'라 썼다.\n\n집무실로 돌아온 대통령은 책상 위 결재판을 내려다보았다. 도장 칸이 일곱 개에서 세 개로 줄어든 새 양식이었다. 그는 짧게 웃으며 첫 서명을 했다."
 tfrkphn.54.story_a:0 "군살부터 뺀다."
 TFRKPHN_sp_jin:0 "다할 진의 정신"
 TFRKPHN_sp_jin_desc:0 "다할 진. 남은 모든 힘을 나라에 쏟아붓겠다는 홍준표의 다짐입니다. 진 줄기의 중점을 하나씩 마칠 때마다 이 정신에 새로운 힘이 더해집니다."
