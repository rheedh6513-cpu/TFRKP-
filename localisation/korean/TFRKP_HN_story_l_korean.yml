 TFRKPHN_mnd_title_insa:0 "인사 명단 / 2023년 10~11월 장성 인사"
 TFRKPHN_mnd_insa_tt:0 "2023년 10~11월 장성 인사 명단을 엽니다.\n누가 임명됐고 누구를 임명할 수 있는지 한눈에 보입니다."
