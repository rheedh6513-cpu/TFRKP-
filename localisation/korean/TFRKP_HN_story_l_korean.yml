 # 군 인물 설명 (Korea Plus 설명문 형식) / 임명 뒤 고문(지휘부) 칸
 KOR_TFRKPHN_kim_myung_soo_desc:0 "§Y임관:§! §L해군사관학교 43기§!\n\n§L김명수는 해군 작전 분야에서 주로 근무했습니다. 해군작전사령관으로 3개 함대와 잠수함, 항공 전력을 지휘했습니다. 2023년 10월 합동참모의장에 발탁되었습니다. 해군 출신 합참의장은 최윤희 대장에 이어 두 번째입니다.§!"
 KOR_TFRKPHN_lee_young_soo_desc:0 "§Y임관:§! §L공군사관학교 38기§!\n\n§L마산고등학교를 졸업하고 1990년 공군사관학교 38기로 임관했습니다. 2005년 공군이 F-15K를 처음 도입할 때 첫 조종사 가운데 한 명으로 뽑혔습니다. 괌에서 한반도까지 기체를 직접 몰고 왔습니다. 이후 전투비행 부대와 공군 작전 부서를 거쳤습니다. 합동참모본부 전략기획본부장으로 군사전략과 전력 기획을 총괄했습니다. 2023년 10월 F-15K 조종사 출신으로는 처음 공군참모총장에 올랐습니다.§!"
 KOR_TFRKPHN_kang_sin_chul_desc:0 "§Y임관:§! §L육군사관학교 46기§!\n\n§L강신철은 작전과 국방개혁 업무를 모두 맡아 본 육군 장성입니다. 문재인 정부에서 국가안보실 국방개혁비서관으로 군 구조와 제도 개혁을 담당했습니다. 정부가 바뀐 뒤에는 합동참모본부 작전본부장에 기용되었습니다. 2023년 10월 대장으로 진급해 PDTO연합군 부사령관이 되었습니다.§!"
 KOR_TFRKPHN_ko_chang_jun_desc:0 "§Y임관:§! §L육군3사관학교 26기§!\n\n§L고창준은 육군3사관학교 출신입니다. 제37보병사단장으로 후방 지역 방위를 지휘했습니다. 이후 모교인 육군3사관학교의 교장을 맡았습니다. 수도군단장을 거쳐 2023년 10월 대장으로 진급했습니다. 지금은 육군 제2작전사령관입니다. 육사를 나오지 않고 4성 장군에 올랐습니다.§!"
 KOR_TFRKPHN_hwang_you_sung_desc:0 "§Y임관:§! §L육군사관학교 46기§!\n\n§L황유성은 정보와 방첩 분야에서 근무한 육군 장성입니다. 국군방첩사령관으로 군의 보안과 대간첩 업무를 지휘했습니다. 2023년 11월 합동참모차장에 발탁되었습니다.§!"
 KOR_TFRKPHN_kwak_jong_keun_desc:0 "§Y임관:§! §L육군사관학교 47기§!\n\n§L곽종근은 합동참모본부에서 전시작전통제권 전환추진단장을 지냈습니다. 한미 연합방위 체계의 전환 준비를 맡는 자리였습니다. 2023년 11월 중장으로 진급해 특수전사령관에 취임했습니다.§!"
 KOR_TFRKPHN_kim_hyoung_soo_desc:0 "§Y임관:§! §L공군사관학교 39기§!\n\n§L김형수는 공군본부 작전참모부장을 지냈습니다. 공군 전력의 작전 운용과 대비태세를 맡는 자리입니다. 2023년 11월 중장으로 진급해 공군작전사령관에 취임했습니다.§!"
