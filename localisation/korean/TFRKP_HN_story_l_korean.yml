 TFRKPHN_cab_ttd_yoo_sang_bum:0 "출생: 1966년 대한민국 강원도 영월\n\n이력: 대한민국의 법무부 장관\n유상범은 1989년 제31회 사법시험에 합격했습니다. 1992년 검사로 임용되었습니다. 2015년 창원지방검찰청 검사장이 되었고, 2017년 광주고등검찰청 차장검사를 끝으로 검찰을 떠났습니다. 2020년 제21대 국회의원에 당선되었고 2024년 재선했습니다.\n\n검사장을 지낸 재선 의원입니다. 대통령은 검찰과 국회 양쪽에 말이 통하는 사람을 찾았습니다.\n\n§Y어록§!\n\"장관이 청와대 대변인이냐\"\n§g국회 법제사법위원회§!"
