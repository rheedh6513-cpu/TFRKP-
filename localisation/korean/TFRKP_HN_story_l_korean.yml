 TFRKPHN_kuk_p_donghae:0 "[강원도] 동해북부선 철도"
 TFRKPHN_kuk_p_donghae_desc:0 "강릉에서 고성 제진까지 끊겼던 동해안 철길을 다시 잇습니다. 언젠가 북쪽으로 이어질 길이기도 합니다."
 TFRKPHN_kuk_p_donghae_tt:0 "§Y기반시설 +1§!\n강원 지지도 §G+5%§!"
 TFRKPHN_kuk_p_chunsok:0 "[강원도] 춘천~속초 동서고속화철도"
