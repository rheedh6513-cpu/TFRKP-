 # 「국 - 나라 국」 6각형 패널
 TFRKPHN_hong_kuk_category:0 "국 - 대한민국 6도"
 TFRKPHN_hong_kuk_category_desc:0 "6도의 지역 기업과 손잡고 나라 곳곳을 고르게 키웁니다. 명판을 누르면 그 회사의 결정이 아래에 나타납니다."
 TFRKPHN_kuk_title:0 "§Y국 - 나라 국§! / 대한민국 6도"
 TFRKPHN_kuk_center:0 ""
 TFRKPHN_kuk_after_60_tt:0 "§Y60일 뒤§! 효과가 나타납니다."
 TFRKPHN_kuk_after_30_tt:0 "§Y30일 뒤§! 효과가 나타납니다."
 TFRKPHN_kuk_seohee:0 "[경기도] 서희건설"
 TFRKPHN_kuk_seohee_desc:0 "경기에 본사를 둔 서희건설과 손잡고 수도권 외곽의 산업단지와 기반시설을 넓힙니다."
 TFRKPHN_kuk_eff_seohee_tt:0 "경기도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n경기 지지도 §G+3%§!"
 TFRKPHN_kuk_tt_seohee:0 "§Y서희건설§! (경기도 건설사)\n§g설립 1982년 / 경기 하남§!\n수도권을 중심으로 아파트와 지역주택조합 사업을 펼쳐 온 건설사입니다.\n\n경기도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n경기 지지도 §G+3%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_ottogi:0 "[경기도] 오뚜기"
 TFRKPHN_kuk_ottogi_desc:0 "안양에서 시작한 오뚜기와 함께 경기 지역의 일자리와 먹거리 산업을 키웁니다."
 TFRKPHN_kuk_eff_ottogi_tt:0 "경기도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n경기 지지도 §G+5%§!"
 TFRKPHN_kuk_tt_ottogi:0 "§Y오뚜기§! (경기도 향토기업)\n§g설립 1969년 / 경기 안양§!\n카레와 라면으로 이름난 식품 회사입니다. 안양 공장에서 출발했습니다.\n\n경기도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n경기 지지도 §G+5%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_kyeryong:0 "[충청도] 계룡건설산업"
 TFRKPHN_kuk_kyeryong_desc:0 "대전의 계룡건설산업과 함께 충청권의 산업단지와 도로망을 다집니다."
 TFRKPHN_kuk_eff_kyeryong_tt:0 "충청도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n충청 지지도 §G+3%§!"
 TFRKPHN_kuk_tt_kyeryong:0 "§Y계룡건설산업§! (충청도 건설사)\n§g설립 1970년 / 대전§!\n대전, 충청을 대표하는 건설사로, 아파트 브랜드 '엘리프'로 알려져 있습니다.\n\n충청도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n충청 지지도 §G+3%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_mackis:0 "[충청도] 맥키스컴퍼니"
 TFRKPHN_kuk_mackis_desc:0 "대전, 충남의 향토 주류 회사 맥키스컴퍼니와 함께 충청 지역 상권을 살립니다."
 TFRKPHN_kuk_eff_mackis_tt:0 "충청도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n충청 지지도 §G+5%§!"
 TFRKPHN_kuk_tt_mackis:0 "§Y맥키스컴퍼니§! (충청도 향토기업)\n§g설립 1973년 / 대전§!\n옛 선양주조. 대전, 충남의 향토 소주와 계족산 황톳길로 알려진 회사입니다.\n\n충청도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n충청 지지도 §G+5%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_woomi:0 "[전라도] 우미건설"
 TFRKPHN_kuk_woomi_desc:0 "광주에서 출발한 우미건설과 함께 호남의 산업 기반을 넓힙니다."
 TFRKPHN_kuk_eff_woomi_tt:0 "전라도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n전북, 전남 지지도 §G+3%§!"
 TFRKPHN_kuk_tt_woomi:0 "§Y우미건설§! (전라도 건설사)\n§g설립 1991년 / 광주§!\n광주에서 출발한 주택 건설사로, 아파트 브랜드 '린(Lynn)'을 내세웁니다.\n\n전라도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n전북, 전남 지지도 §G+3%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_bohae:0 "[전라도] 보해양조"
 TFRKPHN_kuk_bohae_desc:0 "목포의 보해양조와 함께 전라 지역 농수산 가공업과 상권을 살립니다."
 TFRKPHN_kuk_eff_bohae_tt:0 "전라도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n전북, 전남 지지도 §G+5%§!"
 TFRKPHN_kuk_tt_bohae:0 "§Y보해양조§! (전라도 향토기업)\n§g설립 1950년 / 전남 목포§!\n목포에서 시작한 호남 대표 주류 회사로, 소주 '잎새주'를 만듭니다.\n\n전라도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n전북, 전남 지지도 §G+5%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_daemyung:0 "[강원도] 대명건설"
 TFRKPHN_kuk_daemyung_desc:0 "강원의 대명건설과 함께 강원 지역의 공장과 교통망을 확충합니다."
 TFRKPHN_kuk_eff_daemyung_tt:0 "강원도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n강원 지지도 §G+3%§!"
 TFRKPHN_kuk_tt_daemyung:0 "§Y대명건설§! (강원도 건설사)\n§g설립 2023년 / 강원 동해§!\n동해시에 본사를 둔 강원 지역 1위 종합건설사입니다.\n\n강원도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n강원 지지도 §G+3%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_douzone:0 "[강원도] 더존비즈온"
 TFRKPHN_kuk_douzone_desc:0 "춘천에 본사를 둔 더존비즈온과 함께 강원에 IT 일자리를 늘립니다."
 TFRKPHN_kuk_eff_douzone_tt:0 "강원도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n강원 지지도 §G+5%§!"
 TFRKPHN_kuk_tt_douzone:0 "§Y더존비즈온§! (강원도 향토기업)\n§g설립 1991년 / 강원 춘천§!\n회계, 전사적자원관리(ERP) 소프트웨어 회사로, 본사를 춘천 강촌으로 옮겼습니다.\n\n강원도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n강원 지지도 §G+5%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_hshwasung:0 "[경상도] HS화성"
 TFRKPHN_kuk_hshwasung_desc:0 "대구의 HS화성과 함께 영남권의 산업단지와 기반시설을 넓힙니다."
 TFRKPHN_kuk_eff_hshwasung_tt:0 "경상도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n경북, 경남 지지도 §G+3%§!"
 TFRKPHN_kuk_tt_hshwasung:0 "§YHS화성§! (경상도 건설사)\n§g설립 1958년 / 대구§!\n옛 화성산업. 대구, 경북을 대표하는 건설사로, 아파트 브랜드 '파크드림'으로 알려져 있습니다.\n\n경상도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n경북, 경남 지지도 §G+3%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_muhak:0 "[경상도] 무학"
 TFRKPHN_kuk_muhak_desc:0 "창원의 무학과 함께 경남 지역 상권과 일자리를 살립니다."
 TFRKPHN_kuk_eff_muhak_tt:0 "경상도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n경북, 경남 지지도 §G+5%§!"
 TFRKPHN_kuk_tt_muhak:0 "§Y무학§! (경상도 향토기업)\n§g설립 1929년 / 경남 창원§!\n마산에서 시작한 경남 대표 주류 회사로, 소주 '좋은데이'를 만듭니다.\n\n경상도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n경북, 경남 지지도 §G+5%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
