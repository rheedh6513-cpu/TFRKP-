 # ===== 개성 수복 =====
 tfrkphn.256.t:0 "국군, 개성 입성"
 tfrkphn.256.desc:0 "자유조선군이 이북5도위원회로 거듭나 대한민국 정부와 손을 잡았습니다. 그다음 날, 자유조선군이 지켜 온 개성에 국군이 들어섰습니다. 개성은 고려의 옛 수도입니다. 6.25 전까지는 대한민국 땅이었습니다. 국군 장병들은 1950년 겨울의 후퇴 이후 70여 년 만에 그 땅을 다시 밟았습니다.\n\n장병들은 개성공단의 빈 공장 앞에서 태극기를 흔들었습니다. 그 모습이 전국에 생중계되자 실향민들은 TV 앞에서 눈물을 쏟았습니다. 국방부는 개성을 대한민국의 영토로 선포했습니다. 이 지역에 대한 행정 절차에도 들어갔다고 밝혔습니다.\n\n국군은 개성 북쪽에 다음 진지를 파고 있습니다."
 tfrkphn.256.a:0 "목표는 북진 통일이다!"
 tfrkphn.256.a.tt:0 "§Y개성§!이 이북5도위원회에서 §Y대한민국§!으로 넘어왔고, §Y핵심주§!가 되었습니다."
 CPK:0 "조선인민군 군사위원회"
 CPK_DEF:0 "조선인민군 군사위원회"
 CPK_ADJ:0 "군사위원회"
 TFRKPHN_hwang_jeong_yeop_char:0 "박현준"
 TFRKPHN_hwang_jeong_yeop_char_desc:0 "박현준, 그를 정의하는 것은 무엇일까요? 남한의 간첩? 북한의 구원자? 불법 월북자? 자유의 수호자? 극단적 반공주의자?\n\n박현준, 그는 2002년 대한민국 평창의 다소 유복한 집안에서 태어났습니다. 그는 평범한 삶을 살 운명이었습니다.\n\"2010년, 연평도에서의 일이 있기 전까지는요.\"\n\n연평도 포격전 당시 연평도를 여행 중이던 어린 그는 북한의 잔혹함을 눈으로 보았습니다. 그의 삶은 뒤틀리기 시작하였습니다.\n\n그의 학창 시절은 좋지 못했습니다. 친구들과 어울리지 못했고, 더 나아가 따돌림을 받으며 살아왔습니다. 그의 정신은 점차 피폐해져 갔고, 그 피폐는 2020년, 미국 내전과 코로나19로 가정이 파탄 나며 절정을 찍었습니다.\n\n벼랑 끝까지 몰린 그는 어릴 적 기억과 오랫동안 담아 온 공산주의에 대한 증오를 떠올렸습니다. 그는 자살을 원하였고, 자살을 하더라도 그것이 헛되지는 않았으면 했습니다.\n\n그는 결국 월북을 했습니다. 북한에서 민주화 투쟁을 하다 죽겠다고. 그러나 막상 북한에 도착했을 때의 풍경은 그의 상상보다 더욱 참혹했습니다.\n\n그는 마음을 고쳐먹었습니다. 공산주의에 대한 증오를 더욱 불태우기로, 더 나아가 아시아에서 공산주의를 축출한다는 원대한 꿈을 가지기 시작했습니다.\n\n여러 고난이 찾아왔지만 그는 이겨냈고, 소망은 이루어졌습니다. 북한은 마침내 내전에 돌입했습니다. 그에게 봉기의 시간이 찾아왔습니다. 공산주의에 대한 증오를 표출할 시간 말입니다.\n\n§Y\"북녘 동포여 일어나라! 멸공의 횃불 아래 목숨을 걸자!\"§!"
 PPK:0 "평양 인민봉기위원회"
 PPK_DEF:0 "평양 인민봉기위원회"
 PPK_ADJ:0 "평양 봉기군"
 tfrkphn.258.t:0 "평양의 자유투사, 귀순하다"
 tfrkphn.258.desc:0 "평양 인민봉기위원회가 이북5도위원회에 합쳐졌습니다. 봉기를 이끌던 박현준은 휴전선을 넘어 대한민국으로 귀순했습니다. 그는 오래전 스스로 북녘으로 건너갔습니다. 이제 평양 봉기를 이끈 자유투사가 되어 고향 땅으로 돌아왔습니다.\n\n통일부는 그의 귀순 사실을 확인하고 관계기관 합동신문 절차에 들어갔다고 밝혔습니다. 평양에서 멸공의 횃불을 들었던 그가 남녘에서 무엇을 할지는 아직 알려지지 않았습니다."
 tfrkphn.258.a:0 "돌아온 것을 환영한다."
 tfrkphn.152.t:0 "칩거"
 tfrkphn.152.desc:0 "심상정.\n대한민국 국민이라면 누구나 한 번쯤 들어 본 이름.\n노회찬 이후 유일무이한 대중 진보정치인이자, 서울대생의 타이틀을 포기하고 광야의 길이었던 노동운동과 진보정치의 길에 뛰어든 사람.\n\n이번 20대 대선에도 세 번째 출사표를 낸 그녀였지만, 대한민국의 대선 후보라면 가장 열심히 선거운동에 매진해야 할 지금, 그녀는 자신의 자택 안에서 쏟아지는 수많은 연락들을 애써 무시하며 스마트폰 전원을 꺼 놓고 있었다.\n\n안철수가 박스권 지지율을 뚫고 10%대 지지율에 안착하고, 허경영에게마저 지지율이 역전당할 동안 심상정 그녀의 지지율은 3~4%대를 벗어나지 못했다.\n\n홍준표가 강경한 발언을 이어 갈수록 여권 진보 시민들은 현실적인 대항마로 이낙연을 택했고, 정치에 질려 버린 사람들은 안철수나 허경영을 택했다.\n심상정 그녀에게는 어떠한 돌파구도, 기회도 남아 있지 않은 듯 보였다.\n\n그녀가 칩거에 들어간 지 2일째,\n심상정은 조용히 눈을 감고 자신의 과거를 되돌아보기 시작했다.\n\n남성 중심 문화가 강하던 대학 시절,\n운동권 최초로 여성 운동 연합회를 만들었고, 열악한 노동환경을 개선하기 위해 수십 년을 노동운동에 바쳤다.\n\n정계에 입문한 뒤에는\n우리 사회에서 소외받는 성소수자, 여성, 장애인, 노동자들의 곁에서 이들의 목소리를 대변했다.\n\n그랬던 그녀였지만, 가장 표를 많이 받은 한 사람만 당선되는 한국 대선에서 제3지대 심상정과 정의당이 설 자리는 없었다.\n후보 사퇴나 이낙연과의 단일화도 생각하지 않았던 건 아니었다.\n\n그리고 그녀는 오랜 침묵 끝에 나지막이 읊조렸다.\n\n§Y나마저 포기하면 우리 사회의 약자들은 누구를 보고 대선을 맞아야 하나.§!"
 tfrkphn.152.a:0 "그녀는 스마트폰의 전원 버튼을 눌렀다."
 tfrkphn.152.a.tt:0 "§g이 선택은 대한민국의 운명을 바꿀 것입니다.§!"
 PRK_pak_jong_chon_desc:0 "박정천은 조선인민군 포병 출신의 군인입니다. 2012년 포병사령관으로 김정은의 서해 최전방 방어대 시찰에 동행하며 이름을 알렸습니다. 2019년 9월에는 조선인민군 총참모장에 올랐습니다. 포병 출신으로는 이례적인 일이었습니다. 2020년에는 차수를 거쳐 원수 칭호까지 받았습니다. 김정은 정권의 대표적인 군부 실세로 떠올랐습니다.\n\n그의 길이 순탄하기만 했던 것은 아닙니다. 2021년 방역 실패의 책임을 지고 원수에서 차수로 강등되었습니다. 그러나 곧바로 당 정치국 상무위원으로 복귀했습니다. 2023년 초에는 당 중앙군사위원회 부위원장에서 갑작스럽게 물러났습니다. 그해 말 다시 그 자리로 돌아왔습니다. 떨어지고 다시 올라서기를 반복하면서도, 그는 끝내 군부의 정점을 놓지 않았습니다.\n\n김정은의 죽음 이후 가장 먼저 움직인 인물도 박정천이었습니다. 그는 김정은이 쓰러지자마자 군권을 앞세워 김여정과 최룡해 등을 숙청하려 했습니다. 그러나 평양으로의 무리한 병력 이동은 군 내부의 반발을 불렀습니다. 수도를 메운 장갑차와 포성은 주민들을 걷잡을 수 없이 동요시켰습니다.\n\n쿠데타는 실패했고 그의 생사는 확인되지 않습니다. 그의 쿠데타는 백두혈통도, 당도, 군도 하나로 묶지 못했습니다. 오히려 평양 한복판에서 시민과 군의 반란을 불러왔습니다. 혼란을 틈탄 대한민국의 개입까지 불러들였습니다. 북조선은 네 갈래로 찢어졌습니다. 그는 북조선 전체를 내전으로 몰아넣은 자로 역사에 남게 되었습니다."
 TFRKPHN_cho_ryong_hae_char_desc:0 "최룡해는 1950년에 태어난 북조선 권력층의 대표적인 원로입니다. 그의 아버지 최현은 김일성과 함께 항일 빨치산 활동을 했습니다. 인민무력부장까지 지냈습니다. 그는 태어날 때부터 혁명 1세대 가문의 자식이었습니다.\n\n그는 김일성사회주의청년동맹을 이끌며 당 관료로 이름을 쌓았습니다. 그러나 권력의 바람에 따라 몇 번이나 쫓겨났다가 다시 돌아왔습니다. 김정은 시대에는 군복을 입고 조선인민군 총정치국장과 차수에 올랐습니다. 군을 당의 손아귀에 묶어 두는 역할이었습니다. 혁명화 교육을 받으며 밀려났다가도 끝내 다시 일어섰습니다. 2019년에는 최고인민회의 상임위원장과 국무위원회 제1부위원장이 되었습니다. 명목상 국가수반의 자리입니다.\n\n김정은이 쓰러지고 박정천의 쿠데타가 평양을 뒤흔들었습니다. 최룡해는 총정치국장 시절 쌓아 둔 군부 인맥을 움직였습니다. 자강도와 량강도, 함경도의 부대들이 그의 편에 섰습니다. 그는 조선인민군 군사위원회를 세워 백두혈통과 결별했습니다.\n\n그는 수십 년 동안 권력의 정점과 밑바닥을 오가며 살아남았습니다. 이 노정객에게 이번 내전은 생애 마지막이자 가장 큰 도박입니다."
