 # 충성의 3축 5군 이벤트 (국기에 대한 맹세)
 tfrkphn.205.t:0 "충성의 3축 5군"
 tfrkphn.205.desc:0 "계룡대 연병장에 장병들이 줄지어 섰다. 육군, 해군, 공군, 해병특수작전군, 그리고 새로 창설된 우주사령부였다. 3축 5군 체제의 출범을 알리는 자리였다.\n\n대형 화면에는 현무-5의 공개 영상이 흘렀다. 연병장 한편에는 L-SAM 발사대가 위장막을 벗은 채 서 있었다. 대통령이 단상에 오르자 군악대의 연주가 멎었다.\n\n\"국기에 대하여 경례.\"\n\n수천 명의 손이 한꺼번에 올라갔다. 바람에 펄럭이는 태극기 아래, 사회자의 목소리가 연병장에 울렸다.\n\n§Y\"나는 자랑스러운 태극기 앞에 자유롭고 정의로운 대한민국의 무궁한 영광을 위하여 충성을 다할 것을 굳게 다짐합니다.\"§!\n\n\"바로.\"\n\n구령이 떨어진 뒤에도 대통령은 한동안 깃발에서 눈을 떼지 않았다.\n\n행사가 끝난 뒤, 대통령은 사열대를 내려와 장병들 사이를 걸었다. 육군 대열 끝에 앳된 얼굴의 일병 하나가 서 있었다. 명찰에는 '김지원'.\n\n\"힘들지 않나?\"\n\"똑같이 받으려고 왔습니다.\"\n\n대통령은 웃으며 그녀의 어깨를 두드렸다.\n\n돌아오는 차 안에서 비서실장이 사진 한 장을 건넸다. 대전 국방과학연구소에서 막 올라온 것이었다. 전시실 마지막 칸 옆에 오래 비어 있던 액자가 있었다. 거기에 오늘 아침 공개된 현무-5의 사진이 걸려 있었다.\n\n대통령은 창밖을 내다보았다. 당정협의 탁자 위에서 지워졌다가 다시 동그라미가 쳐졌던 예산. 도쿄로 건너간 친서. 판문점에 울린 경고사격. 그 일들이 오늘 연병장의 대열로 이어졌다.\n\n당에 충성하던 서른 해가 끝났다. 나라에 충성하겠다고 말한 그날 이후의 시간이 차창 위로 겹쳐 지나갔다."
 tfrkphn.205.a:0 "충성!"
