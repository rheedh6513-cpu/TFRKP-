 TFRKPHN_kj_sign_both:0 "§G협정 발효§! - 시설을 눌러 가동하세요"
 TFRKPHN_kj_footer:0 "§g한 나라가 한 길을 잡으면 상대국은 다른 길만 맡습니다. 시설은 한 번에 하나씩.§!"
