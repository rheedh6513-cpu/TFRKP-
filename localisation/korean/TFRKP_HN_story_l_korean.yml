 TFRKPHN_mnd_k2:0 "K2 흑표 추가 양산"
 TFRKPHN_mnd_k2_desc:0 "노후 전차를 K2 흑표로 바꿉니다. 90일 뒤 K2 흑표 전차 150대가 배치됩니다."
 TFRKPHN_mnd_k9:0 "K9 자주포 추가 생산"
 TFRKPHN_mnd_k9_desc:0 "포병 화력의 중심인 K9 자주포를 추가로 생산합니다. 90일 뒤 K9 자주포 200문이 배치됩니다."
