 TFRKPHN_cab_ttd_kim_yung_ho:0 "출생: 1959년 대한민국 경상남도 진주\n\n이력: 대한민국의 통일부 장관\n김영호는 정치학자입니다. 1999년부터 성신여자대학교 정치외교학과 교수로 일했습니다. 2011년 대통령실 통일비서관을 지냈습니다. 2023년 7월 통일부 장관에 임명되었습니다.\n\n대통령실에서 통일 정책을 다뤄 본 학자입니다. 이인제 대통령은 북한 체제의 근본 변화를 약속했고, 그 일을 맡길 장관이 필요했습니다.\n\n§Y어록§!\n\"그렇기 때문에 인권과 안보 문제는 분리될 수 없다\"\n§g데일리안 인터뷰§!"
