 TFRKPHN_cab_ttd_shim_woo_jung:0 "출생: 1971년 대한민국 충청남도 공주\n\n이력: 대한민국의 법무부 장관\n심우정은 1994년 사법시험에 합격했습니다. 2021년 서울동부지검장, 2022년 인천지검장을 지냈습니다. 2023년 대검찰청 차장검사, 2024년 법무부 차관을 거쳐 그해 9월 검찰총장이 되었습니다. 심대평 전 충남지사의 아들로 알려져 있습니다.\n\n공주 사람이고 검찰의 꼭대기까지 올라간 검사입니다. 대통령은 충청 출신 법조인을 눈여겨봤습니다.\n\n§Y어록§!\n\"우리 검찰은 민생범죄로부터 국민을 지키는데 온 힘을 다해야 할 것\"\n§g검찰총장 취임사§!"
