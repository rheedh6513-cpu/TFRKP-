 # ===== 자유조선: 영원한 수령 설명 교체 =====
 TFRKPHN_EL_KIS_TT1_FJ:0 "§B김일성의 침략야욕§!"
 TFRKPHN_EL_KIS_TT_FJ:0 "§W민족의 배신자:§! 김일성\n\n\n\n\n\n\n\n\n\n\n   £GFX_PRK_eternal_leader_kim_il_sung\n\n\n\n\n\n\n\n\n\n\n-------------------------------------\n§L김일성(본명 김성주)은 1912년 4월 15일 평안남도 대동군 만경대에서 태여났다. 평양당국은 그의 집안을 \"애국적인 혁명가문\"으로 꾸며내였으나, 그 력사의 대부분은 우상화를 위해 날조되거나 부풀려진것이다.\n\n그는 1930년대 만주에서 중국공산당이 이끈 동북항일련군의 한 지휘관으로 활동하다가 일본군의 토벌에 쫓겨 1940년 쏘련 땅으로 달아났다. 평양당국이 떠벌이는 \"조선인민혁명군\"과 \"20성상의 항일혁명투쟁\"은 그를 신격화하기 위해 만들어낸 거짓말이다.\n\n조선을 일제로부터 해방한것은 김일성이 아니라 련합국과 대한민국 림시정부였다. 그는 1945년 9월 쏘련군 대위의 군복을 입고 원산항으로 들어와 쏘련군정의 비호밑에 권력을 잡았으며, 조선로동당과 정권을 세워 북녘땅에 공산독재의 뿌리를 내리였다.\n\n1950년 6월 25일 \"미제의 침공\"이라는 그의 주장은 새빨간 거짓이다. 김일성은 스딸린의 승인과 모택동의 지원을 받아 38선 전역에서 남침을 감행하였으며 3년간의 전쟁으로 수백만 동포가 목숨을 잃고 수많은 리산가족이 생겨났다. 전쟁뒤에도 그는 정적들을 모조리 숙청하고 1.21 청와대습격과 판문점도끼만행을 저지르며 남녘을 끊임없이 위협하였다.§!\n\n§H\"개인의 자유가 없는 사회주의는 감옥에 불과하다.\"\n\"북한 정권은 인민을 위한 정권이 아니라, 오직 김씨 일가의 개인 왕조를 유지하기 위한 집단이다.\"\n- 황장엽§!"
 TFRKPHN_EL_KJI_TT1_FJ:0 "§B민족의 배신자 김정일의 사치§!"
 TFRKPHN_EL_KJI_TT_FJ:0 "§W민족의 배신자:§! 김정일\n\n\n\n\n\n\n\n\n\n\n   £GFX_PRK_eternal_leader_kim_jong_il\n\n\n\n\n\n\n\n\n\n-------------------------------------\n§L김정일은 1942년 2월 16일 쏘련 하바롭스크 린근의 군사야영지에서 태여났으며 어린시절 이름은 \"유라\"였다. 평양당국이 내세우는 \"백두산밀영 출생\"과 상서로운 징조들은 그의 세습을 정당화하기 위해 지어낸 신화에 지나지 않는다.\n\n1994년 권력을 물려받은 그는 \"선군정치\"를 내세워 나라의 모든 자원을 군대와 핵무기 개발에 쏟아부었다. 그 대가로 1990년대 중후반 \"고난의 행군\" 대기근때 수십만에서 수백만으로 추산되는 인민들이 굶어죽었으나, 그는 외국산 고급꼬냐크와 사치품으로 호화로운 생활을 이어간것으로 알려져있다.\n\n그는 \"온 사회의 김일성주의화\"를 내걸고 아버지를 신으로 떠받드는 우상숭배를 온 사회에 강요하였으며, 이를 거스르는 사람들은 일가족까지 정치범수용소로 끌려갔다. 2014년 유엔 북조선인권조사위원회는 이 수용소의 참상을 반인도범죄로 규정하였다.\n\n평양당국은 그가 6.15공동선언과 10.4선언으로 \"자주통일의 새시대\"를 열었다고 선전하지만, 그는 1983년 아웅산폭탄테로와 1987년 대한항공 858편 폭파의 배후로 지목되였고 일본사람과 남녘사람들을 랍치하였으며 2006년과 2009년 핵시험을 강행하였다.§!\n\n§H\"정치범수용소는 북한이라는 거대한 감옥 축소판이다. 그곳에서 인간의 존엄성은 배고픔과 폭력 앞에 철저히 부서진다.\"\n\"북한 정권을 옹호하는 것은 그 정권 아래서 신음하는 2천만 주민들의 고통 외면하는 방관 행위이다.\"\n- 강철환§!"
 # ===== 자유조선: 정부수반 박충권 =====
 TFRKPHN_PREMIER_TT1_FJ:0 "§B자유조선 정부수반§!"
 TFRKPHN_PREMIER_TT_FJ:0 "§W자유조선 정부의 대표§!\n\n\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_premier_park_choong_kwon\n\n\n\n\n\n\n\n            박충권\n\n\n§L1986년 함경남도에서 태어난 박충권은 평양 국방종합대학을 졸업한 공학도 출신입니다. 2009년 탈북해 대한민국에 들어왔습니다. 서울대학교에서 재료공학 박사학위를 받았습니다. 서울대 재료공학연구소와 현대제철 연구개발본부에서 연구원으로 일했습니다.\n\n2024년 제22대 총선에서 비례대표로 국회에 들어갔습니다. 조명철, 태영호, 지성호에 이은 네 번째 탈북민 출신 국회의원입니다. 북녘의 무기 개발 교육을 직접 받은 과학자가 이제 자유조선의 정부를 이끕니다.§!"
 # ===== 중국의 선택 =====
 tfrkphn.255.t:0 "조선 내전: 누구의 손을 잡을 것인가"
 tfrkphn.255.desc:0 "김정은의 죽음 이후 조선은 세 갈래로 찢어졌습니다. 평양에서는 김여정이 백두혈통의 이름으로 당과 정부를 붙잡고 있습니다. 최룡해는 조선인민군 군사위원회를 앞세워 군부를 장악했습니다. 그리고 남조선의 지원을 받는 이북5도위원회가 북쪽으로 진격하고 있습니다.\n\n압록강 너머의 혼란은 더 이상 남의 일이 아닙니다. 조선이 남조선과 일본의 손에 넘어간다면 우리의 완충지대는 사라집니다. 중앙은 결단을 내려야 합니다. 백두혈통의 정통성을 지킬 것인가, 아니면 총을 쥔 군부와 손을 잡을 것인가?"
 tfrkphn.255.a:0 "백두혈통의 정통성을 지킨다. 김여정을 지지한다."
 tfrkphn.255.a.tt:0 "§Y조선민주주의인민공화국(김여정)§!이 우리의 §Y괴뢰국§!이 됩니다."
 tfrkphn.255.b:0 "총을 쥔 자가 조선을 지킨다. 최룡해를 지지한다."
 tfrkphn.255.b.tt:0 "§Y조선인민군 군사위원회(최룡해)§!가 우리의 §Y괴뢰국§!이 됩니다."
