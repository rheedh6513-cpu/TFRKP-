 # 국방부 패널 추가 결정
 TFRKPHN_mnd_marineon:0 "상륙기동헬기 마린온 도입"
 TFRKPHN_mnd_marineon_desc:0 "해병대 전용 상륙기동헬기 마린온을 들여옵니다. 함정에서 곧바로 해안 너머로 병력을 실어 나를 수 있게 됩니다.\n\n§Y해병특수작전군 창설§!을 먼저 해야 합니다."
 TFRKPHN_mnd_nwi_command:0 "서북도서방위사령부 강화"
 TFRKPHN_mnd_nwi_command_desc:0 "연평도와 백령도를 지키는 서북도서방위사령부를 키웁니다. 해안 요새와 방공포대가 바로 들어섭니다.\n\n§Y해병특수작전군 창설§!을 먼저 해야 합니다."
 TFRKPHN_mnd_kc330:0 "공중급유기 추가 도입"
 TFRKPHN_mnd_kc330_desc:0 "KC-330 시그너스 공중급유기를 더 들여옵니다. 전투기가 멀리, 오래 날 수 있게 됩니다."
 TFRKPHN_mnd_global_hawk:0 "고고도 정찰기 도입"
 TFRKPHN_mnd_global_hawk_desc:0 "고고도 무인정찰기를 들여와 한반도 전역을 상시 감시합니다."
 TFRKPHN_mnd_sat425:0 "군 정찰위성 425 사업"
 TFRKPHN_mnd_sat425_desc:0 "독자 군 정찰위성을 궤도에 올립니다. 우주군이 운용하며, 북한 전역을 우리 눈으로 내려다보게 됩니다.\n\n§Y우주군 창설§!을 먼저 해야 합니다."
 TFRKPHN_mnd_drone_command:0 "드론작전사령부 창설"
 TFRKPHN_mnd_drone_command_desc:0 "정찰, 공격 드론을 한데 모은 드론작전사령부를 만듭니다. 전선 위를 늘 드론이 날게 됩니다."
 TFRKPHN_mnd_army_tiger:0 "아미타이거 4.0"
 TFRKPHN_mnd_army_tiger_desc:0 "보병까지 모두 차량과 네트워크로 묶는 미래 지상군 체계를 갖춥니다.\n\n§Y육군 정예화§!를 먼저 해야 합니다."
