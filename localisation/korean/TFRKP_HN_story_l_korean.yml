 tfrkphn.52.story:0 "자정이 넘은 대통령 집무실. 사내가 홀로 앉아 있었다.\n\n그는 국민 앞에서 선진대국을 약속했다. 박수는 이미 지나갔다. 책상 위에는 그 약속을 지켜야 할 의무만 남아 있었다.\n\n사내는 주머니를 뒤져 담배 한 개비를 꺼냈다. 끊은 지 오래였다. 오늘 밤만은 손이 먼저 움직였다.\n\n불을 붙이고 고개를 들었다. 어두운 창유리에 제 얼굴이 비쳤다. 낮에 연단에 섰던 얼굴보다 한참 늙어 보였다.\n\n책상 한쪽에는 오늘 자 여론조사가 엎어져 있었다. 찬성과 반대가 거의 반반이었다.\n\n그는 연기를 길게 내뿜으며 중얼거렸다.\n\n\"국민의 결집.... 좌와 우를, 남과 여를 따질 때가 아니다. 모두가 한 길로 모여야 한다.\"\n\n담배를 비벼 끄고 다시 창유리를 보았다.\n\n얼굴은 그대로였다. 그는 엎어 둔 여론조사를 바로 놓고 첫 장부터 다시 읽었다.\n\n내일 아침 첫 일정은 야당 대표와의 면담이었다."
 tfrkphn.59.story:0 "여당 지도부와의 당정협의가 세 시간째 이어지고 있었다.\n\n탁자 위에는 내년도 예산안이 펼쳐져 있었다. 당이 원하는 것은 분명했다. 선거가 다가오고 있었다. 지역구마다 다리와 도로, 체육관이 필요했다. 그 돈을 마련할 가장 손쉬운 곳은 국방 예산이었다.\n\n\"전쟁은 끝났습니다, 대통령님. 국민들은 이제 총보다 밥을 원합니다.\"\n\"전력증강 사업 몇 개만 몇 년 늦추면 됩니다. 아무도 모릅니다.\"\n\n대통령은 말없이 예산안을 넘겼다. 3축 체계 예산 옆에 연필로 그은 줄이 보였다. 누군가 미리 지워 둔 자리였다.\n\n그는 연필을 내려놓았다.\n\n\"여러분 말이 맞을 수도 있습니다. 선거는 이겨야 하지요. 당도 살아야 하고.\"\n\n몇몇 의원의 얼굴이 풀렸다. 대통령은 천천히 자리에서 일어섰다.\n\n\"지난 30년간 나는 당에 충성하는 정치를 해왔다\n이제부터 나는 국익에 충성하는 정치를 해오겠다\"\n\n회의실이 조용해졌다. 대통령은 지워진 줄 위에 다시 동그라미를 쳤다.\n\n\"국방은 정쟁의 대상이 아닙니다. 여당의 것도, 야당의 것도 아닙니다. 다음 전쟁은 우리가 준비한 만큼만 이길 수 있습니다.\"\n\n그날 밤, 당 지도부에서는 대통령이 당을 버렸다는 말이 돌았다. 다음 날 아침, 국방부 장관의 책상에 한 장짜리 지시가 올라왔다.\n\n'전력증강 사업, 한 건도 미루지 말 것.'"
 tfrkphn.59.story_a:0 "국익에 충성한다."
 tfrkphn.60.story:0 "새벽 두 시. 청와대 관저의 불은 아직 꺼지지 않았다.\n\n대통령은 오래된 습관대로 휴대폰을 들었다. 보좌진이 다듬어 준 담화문이 아니었다. 그가 직접 한 글자씩 눌러 쓰는 글이었다.\n\n19세기 말부터 20세기 중반까지, 60여 년 동안 한반도를 중심으로 국제전쟁이 다섯 번 일어났다. 청일전쟁, 러일전쟁, 중일전쟁, 태평양전쟁, 그리고 6.25전쟁. 그중 넷은 일본이 일으켰고, 하나는 북한이 일으켰다.\n\n전쟁은 힘의 균형이 무너질 때 일어난다. 균형이 유지되면 전쟁은 일어나지 않는다.\n\n사람들은 발칸반도를 유럽의 화약고라 부른다. 그러나 역사를 보면 한반도야말로 세계의 화약고였던 시대가 있었다.\n\n그 화약고가 6.25 이후 70년 넘게 평화를 지킨 것은 휴전선을 사이에 두고 두 진영이 팽팽하게 맞섰기 때문이다. 한쪽에는 북한과 중국, 러시아가 있었다. 다른 쪽에는 한국과 미국, 일본이 있었다.\n\n때로는 낭만적 민족주의와 거짓 평화를 내세워 그 동맹을 흔드는 이들도 있었다.\n\n그리고 이제 미국은 없다.\n\n대통령은 거기서 손가락을 멈췄다. 한참 뒤 다음 줄을 썼다.\n\n평화는 거저 주어지지 않는다.\n\n힘에 의한 무장평화만이 진정한 자유와 평화를 가져다준다.\n\n한때 서로 죽고 죽이던 미국과 일본이 손을 잡았다. 한국과 베트남이 화해하고 함께 미래로 가고 있다. 어제의 적이 오늘의 동맹이 되는 것, 그것이 국제정치다.\n\n미국이 떠난 자리를 누가 대신 채워 주지 않는다. 북한이 핵을 가졌다면 우리도 그에 맞설 힘을 가져야 한다. PDTO의 이웃들과 손을 잡되, 마지막 한 걸음은 우리 힘으로 버텨야 한다.\n\n남북 핵균형. 그것이 앞으로 이 나라 국방의 원칙이다.\n\n게시 버튼을 누르고 나서야 그는 휴대폰을 내려놓았다. 아침이 되자 신문들은 일제히 대통령의 새벽 글을 1면에 올렸다. 어떤 신문은 '무장평화론'이라 이름 붙였고, 어떤 신문은 '핵 도미노의 시작'이라 썼다."
 tfrkphn.60.story_a:0 "평화는 거저 주어지지 않는다."
 tfrkphn.61.story:0 "국방부 대강당. 대통령은 단상에 서자마자 원고를 덮었다.\n\n\"군 개혁을 해야 합니다.\n\n현대전은 사병의 수가 아니라 사병의 질이 국방력을 좌우합니다. 아이는 줄어드는데, 우리는 아직도 머릿수로 군대를 채우려 합니다. 그 방식은 이제 끝났습니다.\n\n모병제를 대폭 확대하겠습니다. 첨단 장비를 다룰 줄 아는 남녀 전문병사를 크게 늘리겠습니다. 그만큼 징병제의 부담은 줄어듭니다.\n\n오늘부터 여성도 일반병으로 지원할 수 있습니다. 장교와 부사관만이 아닙니다. 소총을 들고 전방 철책을 지키는 병사의 자리도 이제 남녀 모두에게 열립니다.\n\n지금까지의 군 현대화는 사병 복지에 초점을 맞췄습니다. 이제는 장비를 현대화해야 합니다. 오래 복무할 기간병의 대우를 높여야 합니다. 실제로 싸워 이기는 전투력을 키우는 데 집중해야 합니다.\n\n결국 우리도 모병제를 근간으로 갈 수밖에 없습니다. 오늘이 그 첫걸음입니다.\"\n\n질문이 쏟아졌다. 예산은 어디서 나오느냐. 지원자가 모자라면 어떻게 하느냐. 대통령은 짧게 답했다.\n\n\"좋은 대우를 해 주면 사람은 옵니다. 안 오면 대우가 모자란 겁니다.\"\n\n한 달 뒤, 대전의 한 병무청 민원실.\n\n스물한 살 김지원은 지원서를 앞에 두고 한참 펜을 쥐고 있었다. 지원 분야 칸에는 '일반병(육군 보병)'이라고 적혀 있었다.\n\n\"정말 괜찮겠어요? 훈련소부터 남자들이랑 똑같이 받는 건데.\"\n\n담당 주무관이 조심스럽게 물었다. 그녀는 고개를 끄덕였다.\n\n\"똑같이 받으려고 온 거예요.\"\n\n도장이 찍혔다. 그날 하루 동안 전국 병무청에 들어온 여성 일반병 지원서는 천 장을 넘었다."
 tfrkphn.61.story_a:0 "숫자가 아니라 질이다."
 tfrkphn.62.story:0 "충남 태안 안흥. 국방과학연구소 종합시험장에 바닷바람이 거세게 불었다.\n\n관측소 유리창 너머로 이동식 발사대가 천천히 몸을 일으켰다. 대통령 옆에 선 합참 작전본부장이 낮은 목소리로 설명을 시작했다.\n\n\"지금부터 보실 것은 하나의 체계입니다. 따로따로가 아닙니다.\"\n\n첫째는 킬체인이었다. 북한의 핵미사일이 발사대에 올라가는 순간을 위성과 정찰기가 잡아낸다. 그 정보는 몇 분 안에 타격 부대로 넘어간다. 미사일이 하늘로 오르기 전에 발사대를 먼저 부순다.\n\n둘째는 한국형 미사일 방어였다. 그래도 날아오는 미사일은 하늘에서 떨어뜨린다. 전국의 레이더가 궤적을 그리고, 요격미사일이 그 길목을 막는다.\n\n셋째는 대량응징보복이었다. 그래도 한 발이 떨어진다면, 그 대가는 평양의 지휘부가 치르게 된다. 핵을 쓰는 순간 정권이 끝난다는 것을 저쪽이 알아야 했다.\n\n\"하나라도 빠지면 나머지 둘이 의미가 없습니다.\"\n\n대통령은 고개를 끄덕였다. 몇 달 전, 당정협의 탁자 위에서 누군가 연필로 지워 두었던 바로 그 예산이었다.\n\n카운트다운이 끝났다. 굉음과 함께 현무 미사일이 흰 연기를 끌며 서해 위로 솟구쳤다. 관측소의 유리창이 낮게 떨렸다.\n\n\"양산은 언제부터 됩니까.\"\n\n\"예산만 그대로 가면 올해 안에 시작합니다.\"\n\n\"그대로 갑니다. 한 푼도 안 깎습니다.\"\n\n대통령은 멀어지는 연기를 끝까지 바라보았다.\n\n\"평화는 힘의 균형 위에서만 지켜집니다. 우리가 먼저 쏘려고 만드는 게 아닙니다. 저쪽이 절대 먼저 쏘지 못하게 만드는 겁니다.\"\n\n그해 겨울, 전국의 산꼭대기에 새 레이더 기지가 들어섰다. 그리고 현무의 생산 라인은 밤에도 멈추지 않았다."
 tfrkphn.62.story_a:0 "먼저 쏘지 못하게 만든다."
 tfrkphn.63.story:0 "도쿄, 주일 대한민국 대사관.\n\n책상 위 조간신문 1면에는 며칠 전 대통령이 새벽에 올린 페이스북 글이 실려 있었다. 남북 핵균형. 김상주는 그 기사를 대충 넘겼다. 그때는 그게 자기 일이 될 줄 몰랐다.\n\n2등서기관 김상주에게 오늘도 별거 없는 하루였다. '였다'라는 말에서 알 수 있듯, 이제는 별거 있는 하루가 되었다.\n\n퇴근을 한 시간 앞둔 오후 다섯 시. 본국에서 3급 비밀 전문이 내려왔다. 암호를 풀어 출력한 종이를 들고, 김상주는 한참 동안 자리에서 일어나지 못했다. 세 번을 다시 읽었다. 내용은 바뀌지 않았다.\n\n그는 서류를 봉투에 넣고 대사실 문을 두드렸다.\n\n\"대사님, 긴급하게 보고드릴 서류가 있습니다.\"\n\n대사는 안경을 고쳐 쓰며 웃었다.\n\n\"뭔데, 뭐 핵이라도 만든다는 거냐?\"\n\n\"죄송하지만, 그게 맞습니다.\"\n\n순간 대사의 얼굴이 공포와 경악으로 일그러지기 시작했다.\n\n겉으로 보면 평범한 문서였다. 제목은 'PDTO 회원국 간 원자력 협력 강화 방안'. 한일 두 나라가 원자력 분야의 협력을 넓힌다는 외교 문서의 말투였다.\n\n그러나 첨부 문서를 넘길수록 단어가 달라졌다. 고농축 우라늄의 보관 위치와 수량. 미국이 무너지며 주인을 잃은 옛 주한, 주일미군 전술핵의 행방. 두 나라 기술진이 함께 쓸 시설의 후보지. 마지막 장에는 지시 한 줄이 적혀 있었다. \"일본 정부 최고위층에 대통령 친서를 비공개로 전달할 것.\"\n\n대사는 서류를 덮었다. 그리고 한참 뒤에 입을 열었다.\n\n\"우리 좆된 거 맞냐?\"\n\n김상주는 대답하지 못했다.\n\n그날 대사관의 전깃불은 꺼지지 않았다."
 tfrkphn.63.story_a:0 "친서를 준비하라."
 tfrkphn.64.story:0 "오후 3시 11분, 판문점 공동경비구역.\n\n북쪽 도로를 달려온 군용 지프 한 대가 배수로에 바퀴가 빠져 멈춰 섰다. 운전석에서 뛰어내린 북한군 병사가 남쪽을 향해 내달렸다. 몇 초 뒤, 판문각에서 쏟아져 나온 추격조가 총을 쏘기 시작했다.\n\n마흔 발이 넘는 총탄이 군사분계선을 넘어 날아들었다. 추격병 하나는 귀순자를 쫓아 분계선 남쪽까지 몇 걸음을 내려왔다가 황급히 돌아섰다.\n\n이번에는 침묵하지 않았다.\n\nJSA 경비대대의 확성기가 울렸다. \"북한군은 즉시 사격을 중지하라. 정전협정 위반이다.\" 경고 방송이 끝나기도 전이었다. 우리 군의 경고사격이 분계선 너머 빈 땅에 꽂혔다. 그 사이 부사관 둘이 포복으로 다가가 쓰러진 귀순자를 끌어냈다.\n\n그날 저녁, 국방부 브리핑룸.\n\n\"오늘 아침 판문점에서 귀순자가 왔습니다.\n\n북한군은 귀순자를 잡으려고 정전협정을 위반했습니다. 우리 측 영토에 총을 쏘았습니다. 우리 군은 귀순자의 안전을 가장 먼저 확보했습니다. 그리고 북측에 경고 방송과 경고사격을 했습니다.\n\n귀순자는 이국종 박사의 지휘 아래 수술을 받았습니다. 지금은 건강을 회복하며 보호 조치를 받고 있습니다.\"\n\n기자들의 질문이 이어졌다. 보복 사격을 해야 했던 것 아니냐. 반대로, 경고사격은 지나친 것 아니었냐.\n\n같은 시각, 청와대 지하 벙커. 대통령은 합참의 보고를 끝까지 듣고 짧게 정리했다.\n\n\"북한 체제에 간섭하지 않습니다. 저쪽이 어떻게 살든, 누구를 지도자로 모시든 그건 저쪽 일입니다. 그러나 우리 땅에 넘어온 사람은 우리가 지킵니다. 그리고 우리 땅으로 날아온 총알에는 반드시 답합니다. 거기까지입니다. 한 발도 더 나가지 않습니다. 안흥에서 현무를 쏘아 올린 것도 쏘지 않기 위해서였습니다.\"\n\n\"그 원칙을 북측에 그대로 전하십시오. 간섭하지도, 간섭받지도 않는다. 힘의 균형 위에서 각자 살자고.\"\n\n그날 밤, 판문점 연락채널로 짧은 통지문이 넘어갔다. 북쪽에서는 답이 오지 않았다. 대신 다음 날부터 분계선 북쪽의 추격조 초소가 뒤로 물러났다.\n\n수원의 한 대학병원 중환자실. 두 차례의 대수술 동안 귀순자의 몸에는 남쪽 사람들의 피가 1만 2천cc 넘게 들어갔다. 일주일 뒤, 스스로 숨을 쉬기 시작한 그가 처음 한 말은 짧았다.\n\n\"여기가... 남쪽입니까?\""
 tfrkphn.64.story_a:0 "간섭하지도, 간섭받지도 않는다."
 tfrkphn.65.story:0 "외교부 청사 9층, 동북아국 중국과.\n\n박영환 국장은 책상 서랍을 정리하다가 오래된 사진 한 장을 꺼냈다. 1992년 8월 24일, 베이징 댜오위타이. 한중 수교 서명식 뒤편에 앳된 얼굴의 신입 외교관이 서 있었다. 서른 해 전의 자신이었다.\n\n그 시절에는 모두가 북방을 말했다. 노태우 정부는 모스크바와 수교했고, 2년 뒤에는 베이징과 손을 잡았다. 공산권이든 아니든 상관없었다. 문을 열면 길이 생긴다고 믿었다. 이념보다 국익이 먼저였다. 사람들은 그것을 북방정책이라고 불렀다.\n\n오늘 아침 장관실에서 내려온 지시는 한 장이었다.\n\n'EADI 회원국과의 고위급 교류 전면 재검토. 대중국 신규 협력사업 동결. 동남아 PDTO 우호국과의 안보협력 최우선 추진.'\n\n\"국장님, 이거 사실상... 단교 준비 아닙니까?\"\n\n젊은 사무관이 조심스럽게 물었다. 박 국장은 대답 대신 창밖을 봤다. 광화문 거리에는 오성홍기를 불태우는 시위대와 그걸 막아선 경찰이 뒤엉켜 있었다.\n\n\"단교는 아니야. 아직은.\"\n\n전쟁이 모든 걸 바꿔 놓았다. 도쿄 대사관에서는 밤새 불이 꺼지지 않는다는 소문이 돌았다. 판문점에서는 경고사격이 울렸다. 중국은 대만을 쳤고, EADI라는 이름으로 이웃들을 줄 세웠다. 이제 서울에서 중국은 교역 상대로 불리지 않았다. 신문은 위협이라고 썼다.\n\n그날 오후 국무회의에서 대통령은 신남방정책을 다시 꺼내 들었다. 베트남, 필리핀, 인도네시아. 중국의 남쪽 바다를 둘러싼 나라들과 손을 잡겠다고 했다. 명분은 억지력이었다.\n\n신문들은 저마다 이름을 붙였다. 어떤 신문은 '가치 외교'라 했다. 어떤 신문은 더 오래된 이름을 꺼냈다.\n\n'70년 만에 돌아온 이승만식 반공 외교.'\n\n공산 국가와는 어떤 거래도 하지 않던 시절. 친구와 적을 이념으로 가르던 시절. 북방정책이 그 시절을 끝냈다고 믿었는데, 서른 해 만에 시계가 거꾸로 돌고 있었다.\n\n퇴근길, 박 국장은 수교 사진을 다시 서랍 깊숙이 넣었다. 버리지는 않았다.\n\n\"언젠가 다시 꺼낼 날이 오겠지.\"\n\n혼잣말처럼 중얼거렸지만, 그 말을 믿는 사람은 청사 안에 그리 많지 않았다."
 tfrkphn.65.story_a:0 "사진은 서랍에 남았다."
 tfrkphn.121.story:0 "새벽 여섯 시, 청와대 본관 집무실.\n\n책상 위에 기획재정부와 산업통상자원부의 보고서가 나란히 놓여 있었다. 대통령은 안경을 고쳐 쓰고 첫 장을 넘겼다.\n\n대중국 수출, 전년 대비 큰 폭 감소.\n\n다음 장도 마찬가지였다. 반도체, 석유화학, 화장품, 자동차 부품. 한때 이 나라를 먹여 살리던 품목들이 줄줄이 붉은 화살표를 달고 있었다. 전쟁은 끝났지만, 바다 건너 가장 큰 시장의 문은 다시 열리지 않았다. 중국은 EADI 회원국과 손을 잡았고, 대한민국 상품에는 보이지 않는 벽이 둘러쳐졌다.\n\n마지막 장은 성장률 전망이었다. 숫자는 한 줄이었다.\n\n대통령은 보고서를 덮고 의자에 등을 기댔다.\n\n\"전쟁에서 이기고, 장사에서 지는구나.\"\n\n창밖이 서서히 밝아 왔다. 그는 오래전 경남도청 집무실을 떠올렸다. 빚더미에 앉은 도 살림을 넘겨받던 날, 도청 공무원들은 고개를 저었다. 갚을 수 없다고 했다. 그러나 그는 하나씩 줄였고, 하나씩 갚았다. 결국 빚은 0이 되었다.\n\n나라는 도보다 크다. 그래도 그는 그때 하던 대로 하기로 했다. 새는 곳부터 막는다.\n\n그날 오전 9시, 비서실장에게 짧은 지시가 내려갔다.\n\n\"오늘부터 비상경제위원회를 매주 엽니다. 위원장은 내가 맡습니다. 장관들은 보고서 말고 대안을 들고 오라고 하세요.\"\n\n첫 회의는 그날 오후에 열렸다. 대통령은 자리에 앉자마자 말했다.\n\n\"중국 하나에 목을 매던 시절은 끝났습니다. 동남아로, 인도로, 중동으로, 유럽으로. 팔 곳을 새로 찾겠습니다. 그리고 안에서도 돈이 돌게 하겠습니다. 규제는 풀고, 기업은 붙잡고, 나랏빚은 줄이겠습니다.\"\n\n회의실 벽에 걸린 시계가 오후 두 시를 가리켰다. 그날 회의는 밤 열한 시가 넘어서야 끝났다."
 tfrkphn.121.story_a:0 "보고서 말고 대안을 가져오라."
 tfrkphn.123.story:0 "여의도, 증권가 뒷골목의 순댓국집.\n\n점심시간을 조금 넘긴 시각, 벽에 걸린 TV에서 속보 자막이 흘렀다.\n\n'정부, 법인세 최고세율 인하 발표.'\n\n화면이 바뀌었다. 광화문 앞에 붉은 머리띠를 두른 노동조합원들이 서 있었다. \"재벌 감세 철회하라!\" 확성기 소리가 순댓국집 안까지 울렸다. 다음 화면에서는 기자 하나가 마이크를 들고 열을 올렸다.\n\n\"결국 세금 부담은 노동자와 서민에게 돌아간다는 비판이 나오고 있습니다. 대기업만 배를 불리는 낙수효과는 이미 실패한 정책이라는...\"\n\n다시 화면이 바뀌었다. 대통령이 단상에서 말했다.\n\n\"기업이 떠나면 일자리도 떠납니다. 세금을 깎아 주는 게 아니라, 기업이 이 땅에 남을 이유를 만들어 주는 겁니다.\"\n\n구석 자리의 박 씨는 국밥에 깍두기를 얹으며 화면을 힐끗 보았다. 쉰둘, 동네 철물점 사장. 오늘은 거래처 수금 때문에 여의도까지 나왔다.\n\n옆 테이블의 넥타이 두 사람이 목소리를 높였다.\n\n\"이건 진짜 잘한 거야. 법인세 내리면 투자 들어오고, 주가 오르고.\"\n\"웃기지 마. 그 돈 다 사내유보로 쌓아 두고 끝이야. 우리 월급은 그대로고.\"\n\n박 씨는 아무 말도 하지 않았다. 대통령 말도, 노조 말도, 기자 말도 그럴듯했다. 다 맞는 말 같기도 했고, 다 틀린 말 같기도 했다.\n\n그는 휴대폰을 꺼내 증권 앱을 열었다. 화면이 빨갛게 물들어 있었다. 아침에 산 건설주가 3퍼센트 올라 있었다.\n\n\"뭐, 누가 맞든.\"\n\n국밥 국물을 한 숟갈 떴다.\n\n\"돈만 좀 돌면 되지.\"\n\n계산을 하고 나서며 그는 생각했다. 거래처 사장이 오늘은 웬일로 수금을 미루지 않았다. 그게 법인세 덕인지 아닌지는 몰라도, 일단은 나쁘지 않은 하루였다."
 tfrkphn.123.story_a:0 "누가 맞든, 돈만 돌면 된다."
 tfrkphn.122.story:0 "경기도 시흥, 시화공단 끝자락의 금형 공장.\n\n오후 세 시. 사장 김씨는 사무실 소파에 앉아 휴대폰으로 뉴스를 틀었다. 화면 속 대통령이 말하고 있었다. 매주 열린다는 비상경제위원회가 끝난 뒤의 브리핑이었다.\n\n\"앞으로 법에서 하지 말라고 한 것만 빼고, 나머지는 다 해도 됩니다. 되는 걸 찾아오라고 하지 않겠습니다. 안 되는 걸 저희가 증명하겠습니다.\"\n\n규제 네거티브 전환. 자막이 지나갔다.\n\n김씨는 책상 서랍을 열었다. 누렇게 바랜 서류 봉투가 있었다. 3년 전 새 설비를 들이려다 접은 서류였다. 인허가 담당자는 매번 같은 말을 했다. 전례가 없어서요. 근거 조항이 없어서요. 세 번 고치고 네 번 다시 냈다. 그 사이 거래처 둘이 베트남으로 공장을 옮겼다.\n\n\"정말이면 좋겠네.\"\n\n혼잣말이었다. 믿기엔 속은 적이 많았다. 정권이 바뀔 때마다 규제 혁파라는 말은 나왔다. 현장에 내려오는 건 늘 서류 한 장이 더 붙은 양식이었다.\n\n그래도 이번엔 말투가 달랐다. 해도 된다, 가 아니라 하지 말라는 것만 정한다, 였다.\n\n창밖으로 프레스 소리가 났다. 작업복을 입은 직원 열한 명. 그중 셋은 이십 년을 같이 버틴 사람들이었다. 코로나 때 월급을 두 달 미뤘을 때도 아무도 나가지 않았다. 그 뒤로 회식은 한 번도 못 했다. 돈도 없었고 웃을 일도 없었다.\n\n김씨는 서류 봉투를 다시 꺼내 책상 위에 올려놓았다. 그리고 공장 문을 열었다.\n\n\"박 반장! 오늘 기계 여섯 시에 끄라고 해.\"\n\n\"무슨 일 있습니까, 사장님?\"\n\n\"일은 무슨. 회식하자고. 삼겹살로.\"\n\n박 반장이 장갑을 벗다 말고 김씨를 봤다. 오 년 만이었다.\n\n\"이제 좀 살맛 나려나 봐.\""
 tfrkphn.122.story_a:0 "오랜만에 고기 굽는 냄새가 난다."
 tfrkphn.124.story:0 "청와대 세종실. 국무회의 탁자 위에 두꺼운 보고서가 한 권씩 놓여 있었다. 표지에는 '7대 미래산업 육성 전략'이라고 적혀 있었다.\n\n산업부 장관이 화면을 넘겼다. AI. 바이오. 메모리 반도체. 모빌리티. 우주. 수소와 원전. 콘텐츠. 일곱 개의 단어가 차례로 떠올랐다.\n\n\"5년간 연구개발에만 최소 50조 원을 넣습니다. 소형모듈원전은 상용화를 3년 앞당기고, 2030년까지 달에 우리 착륙선을 내리겠습니다.\"\n\n누군가 펜을 내려놓았다. 기재부 쪽이었다. 숫자가 크다는 뜻이었다.\n\n홍준표는 보고서를 덮었다. 그리고 양복 안주머니에서 접힌 종이 한 장을 꺼냈다.\n\n\"어제 청와대 홈페이지에 글이 하나 올라왔어요. 시흥에서 금형공장 하는 사장님이. 3년 묵힌 설비 인허가가 한 달 만에 났대요. 그래서 직원들이랑 5년 만에 삼겹살 회식을 했답니다. 규제는 풀었어요. 풀었으면 이제 뭘 키울지 정해야지.\"\n\n그는 종이를 다시 접었다.\n\n\"대구 시장 할 때 얘기 하나 할게요. 대구는 30년을 섬유로 먹고살았어요. 섬유가 무너지고 나서도 30년을 섬유 생각만 했어요. 다시 살아날 거라고. 안 살아났지.\"\n\n그는 잠시 말을 끊었다.\n\n\"그래서 버렸어요. 섬유 대신 로봇, 반도체, 도심항공, 헬스케어, AI. 다섯 개를 잡았어요. 처음엔 다들 미쳤다 그랬지. 2년 지나니까 서른 살 먹은 애들이 대구로 돌아오더라고요. 23년 만에.\"\n\n\"나라도 똑같아요. 반도체 하나로 30년 먹었어요. 그게 언제까지 갈 거라고 생각합니까. 중국이 따라오고, 공장은 인건비 싼 데 찾아서 다 빠져나가요. 우리 기업들이 베트남, 인도네시아 가서 공장 짓는 거, 그거 박수 칠 일 아닙니다. 여기서 짓게 만들어야지.\"\n\n\"정부가 다 하겠다는 거 아니에요. 정부는 길만 깔아요. 규제는 아까 다 걷었고. 돈은 민간이 대고, 위험한 기초연구는 국가가 받아요. 그게 민관 경제부흥 5개년 계획입니다.\"\n\n기재부 장관이 조심스럽게 입을 열었다.\n\n\"재원이 문제입니다, 대통령님.\"\n\n\"알아요. 그래서 다음 안건이 펀드잖아요.\"\n\n회의실에 짧은 웃음이 돌았다. 홍준표는 웃지 않았다. 그는 일곱 개의 단어가 떠 있는 화면을 한참 바라보았다.\n\n\"우리 아버지 세대는 가발 팔고, 합판 팔고, 신발 팔아서 이 나라 만들었어요. 그 사람들은 다음 산업이 뭔지 몰랐어. 그래도 했어요. 우리는 알잖아요. 알면서 안 하면, 그건 죄입니다.\""
 tfrkphn.124.story_a:0 "다음 30년을 먹고살 일곱 개의 씨앗."
 tfrkphn.125.story:0 "서울 노원구, 한 시중은행 지점.\n\n예순두 살 최씨는 번호표를 쥐고 대기석에 앉아 있었다. 정기예금 만기가 오늘이었다. 공무원 퇴직금에 30년 동안 모은 돈을 더하면 2억 조금 넘었다. 그 돈은 지난 10년 동안 예금에서 예금으로만 옮겨 다녔다.\n\n주식은 무서웠다. 2000년에 친구 따라 샀다가 반 토막이 났다. 집을 한 채 더 사자니 세금이 무서웠다. 코인은 아들이 말렸다. 그래서 예금이었다. 이자는 물가를 못 따라갔지만, 적어도 줄어들지는 않았다.\n\n대기석 위 TV에서 대통령이 말하고 있었다.\n\n\"지금 우리나라에 갈 데 없이 떠도는 돈이 3,500조 원입니다. 역대 최대예요. 그 돈이 다 은행에 잠자거나 아파트값 올리는 데 들어가요. 그 돈을 일하게 만들겠습니다.\"\n\n화면 아래 자막이 흘렀다. 선진대한민국 미래펀드, 100조 원 규모. 민관 공동 조성. 7대 미래산업 집중 투자.\n\n\"정부가 혼자 다 대겠다는 거 아닙니다. 정부가 먼저 넣고, 손실 나면 정부가 먼저 맞습니다. 그래야 국민들이 믿고 들어오지.\"\n\n옆자리 남자가 혀를 찼다. 동네에서 철물점을 하는 박씨였다. 최씨가 못 하나 사러 가면 늘 덤으로 하나 더 얹어 주던 사람.\n\n\"또 펀드야. 뉴딜펀드는 어디 갔대.\"\n\n그러더니 박씨는 슬쩍 덧붙였다.\n\n\"뭐, 법인세 깎는다고 할 때도 다들 욕했는데, 그때 건설주 사 둔 건 재미 좀 봤지.\"\n\n최씨는 대꾸하지 않았다. 그 말도 맞았다. 정권마다 펀드는 있었고, 이름만 바뀌었다.\n\n번호가 불렸다. 창구 직원이 만기 서류를 내밀었다.\n\n\"재예치하시겠어요, 고객님? 금리는 지난번보다 조금 내려갔습니다.\"\n\n최씨는 펜을 든 채 잠시 멈췄다. 손녀가 다니는 대학 이름이 떠올랐다. 반도체공학과. 졸업하면 일할 데가 있어야 할 텐데.\n\n\"그 미래펀드인가 하는 거, 여기서도 들 수 있어요?\"\n\n\"아직 출시 전인데요, 안내 나오면 바로 연락드릴까요?\"\n\n\"그래요. 반만. 반은 그냥 예금으로 두고.\"\n\n은행을 나서며 최씨는 생각했다. 내 돈이 공장 하나 짓는 데 벽돌 한 장쯤은 되겠지. 손해 보면 그만이고. 적어도 이번엔 어디 쓰이는지는 알고 넣는 거니까."
 tfrkphn.125.story_a:0 "잠자던 돈이 깨어난다."
 tfrkphn.209.story:0 "청와대 춘추관. 부동산 대책 발표 자리였다.\n\n\"이 나라는 대한민국이 아니라 서울공화국입니다.\"\n\n첫 문장부터 원고에 없던 말이었다. 국토부 장관이 옆에서 서류를 고쳐 잡았다.\n\n\"국토의 12퍼센트에 인구 절반이 몰려 삽니다. 돈도, 회사도, 대학도, 병원도 다 서울로 갑니다. 지방 애들은 서울 가려고 공부하고, 서울 가서는 집 못 사서 결혼을 안 해요. 서울은 집값 때문에 숨이 막히고, 지방은 사람이 없어서 숨이 끊어집니다. 이게 정상입니까.\"\n\n\"그래서 토지임대부 주택을 하겠습니다. 땅은 국가가 갖고, 집은 국민이 갖습니다. 땅값을 빼면 집값은 반으로 떨어집니다. 이걸 서울에만 짓지 않겠습니다. 지방 거점도시마다, 일자리가 생기는 곳마다 짓겠습니다. 청년이 서울 안 가도 집 사고 결혼할 수 있게.\"\n\n\"빚 갚으면서 무슨 집을 짓느냐고들 하십니다. 경남에서도 빚 갚으면서 산단 세 개를 유치했습니다. 줄일 건 줄이고, 지을 건 짓습니다.\"\n\n기자들의 노트북 자판 소리가 빨라졌다.\n\n반나절 뒤, 서울시청 브리핑룸.\n\n오세훈 서울시장이 연단에 섰다. 표정은 차분했지만 첫마디는 날이 서 있었다.\n\n\"토지임대부 주택, 좋은 정책입니다. 잘 압니다. 서울이 먼저 했으니까요. 고덕강일 3단지, 사전청약 경쟁률이 40대 1이었습니다. 서울시민이 이미 검증한 정책을 이제 와서 새 정책처럼 발표하시는 건 좀 의아합니다.\"\n\n그는 잠시 숨을 골랐다.\n\n\"그런데 서울공화국이라는 말은 받아들이기 어렵습니다. 서울은 천만 시민이 사는 도시고, 대한민국이 세계와 경쟁하는 최전선입니다. 서울이 벌어서 지방교부세로 나라 전체를 먹여 살리고 있습니다. 서울을 깎아내린다고 지방이 살아나지 않습니다. 하향평준화일 뿐입니다.\"\n\n\"지방이 살려면 지방에 기업이 가야 합니다. 서울 집값을 탓하기 전에, 왜 청년들이 서울로 오는지부터 보셔야 합니다.\"\n\n그날 밤, 관저. 비서실장이 오 시장의 브리핑 영상을 틀었다. 홍준표는 끝까지 보고 나서 리모컨을 내려놓았다.\n\n\"맞는 말이네. 지방에 기업이 가야지.\"\n\n비서실장이 의외라는 얼굴로 그를 봤다.\n\n\"그러니까 하는 거야. 기업 내려보내고, 집 지어주고. 서울시장은 서울 걱정하면 되고, 대통령은 나라 걱정하면 되고. 둘 다 자기 일 하는 거지.\"\n\n그는 잠깐 웃었다.\n\n\"근데 서울이 먼저 했다는 건 맞아. 그건 인정해줘. 잘한 건 잘한 거니까.\""
 tfrkphn.209.story_a:0 "땅은 국가가, 집은 국민이. 서울에도, 지방에도."
 tfrkphn.210.story:0 "부산 기장군 장안읍, 고리원자력본부.\n\n바닷바람이 거셌다. 대통령 일행은 방파제 위에 서서 회색 돔 네 개를 바라보고 있었다. 맨 왼쪽, 가장 낡은 건물 앞에는 철거용 가설 울타리가 둘러쳐져 있었다.\n\n안내를 맡은 사람은 일흔이 넘은 퇴직 운전원이었다. 한수원이 특별히 모셔 온 사람이었다.\n\n\"저게 고리 1호기입니다. 이 나라 첫 원전이지요.\"\n\n그는 천천히 말했다.\n\n\"1971년에 첫 삽을 떴습니다. 그때 우리나라 1인당 국민소득이 300달러도 안 됐어요. 원전 하나 짓는 돈이 그해 나라 예산의 4분의 1이었다고 합니다. 다들 미쳤다고 했지요. 설계도 외국 거, 기계도 외국 거, 운전도 외국 기술자들이 했습니다. 우리는 옆에서 받아 적었어요.\"\n\n\"1978년 4월에 상업운전을 시작했습니다. 그날 제가 제어실에 있었습니다. 스물셋이었어요. 계기판 바늘이 올라가는데 손이 떨려서 펜을 못 잡았습니다.\"\n\n\"그 뒤로 2호기, 3호기, 4호기가 들어섰습니다. 80년대엔 우리 손으로 반쯤 지었고, 90년대엔 다 우리 손으로 지었습니다. 받아 적던 나라가 수출하는 나라가 됐어요. 저 1호기가 학교였던 셈입니다.\"\n\n\"2017년 6월에 1호기가 멈췄습니다. 마흔 살이었지요. 그날 텔레비전에서는 탈원전을 선언했습니다. 저는 집에서 그걸 봤습니다. 이상하게 눈물이 나더군요. 늙어서 은퇴하는 건 괜찮은데, 다시는 안 짓겠다는 말이 서러웠습니다.\"\n\n홍준표는 한동안 말이 없었다. 바람에 넥타이가 날렸다.\n\n\"2호기도 마흔 넘었지요?\"\n\n\"예. 겨우 계속운전 허가를 받았습니다. 2033년까지입니다. 그다음엔 저것도 1호기처럼 멈춥니다.\"\n\n\"멈추면 그 자리는요?\"\n\n\"지금까지는 그냥 비워두는 거였습니다.\"\n\n홍준표가 산업부 장관을 돌아봤다. 장관이 먼저 입을 열었다.\n\n\"용인이랑 평택에 올라가는 반도체 공장들, AI 데이터센터들이 다 전기 먹는 하마입니다. 7대 미래산업 계획대로 가면 10년 안에 지금 전력으로는 모자랍니다.\"\n\n홍준표가 고개를 끄덕였다.\n\n\"이제 그렇게 안 합니다. 하나가 은퇴하면, 그 자리에 새 거 하나 짓습니다. 송전탑도 있고, 바닷물도 있고, 주민들도 원전 옆에서 50년을 살았어요. 여기만큼 원전 지을 준비가 된 땅이 어디 있습니까. 1호기 해체 끝나면 그 자리에 소형모듈원전 들어갑니다. 2호기 멈추면 그 자리에도. 늙은 원전은 은퇴시키고, 젊은 원전으로 바꾸는 겁니다. 그게 원전 강국이에요.\"\n\n노인이 대통령을 오래 바라봤다. 그리고 1호기 쪽으로 고개를 돌렸다.\n\n\"그럼 저 녀석도 자식을 보는 거네요.\""
 tfrkphn.210.story_a:0 "늙은 원전은 은퇴하고, 젊은 원전이 그 자리를 잇는다."
 tfrkphn.211.story:0 "청와대 영빈관. 정상회의 초청장 한 장이 대통령 책상 위에 놓여 있었다. 발신처는 주요 선진국 정상회의 의장국. 회원국 자격으로의 정식 초청이었다.\n\n홍준표는 초청장을 한참 들여다보았다.\n\n몇 년 전, 그는 여의도 작은 사무실에서 출마를 선언했다. 잘못된 길로 가는 이 나라를 바로잡아 정상 국가로 만들고, G7 선진국 시대를 열겠다고. 그때 기자들은 웃었다. 대선 후보들이 늘 하는 말이라고.\n\n그 뒤에 세상이 무너졌다.\n\n미국이 내전에 빠졌다. 세계의 경찰을 자처하던 나라가 제 몸 하나 가누지 못하고 산산조각 났다. 70년 동안 이 나라를 받쳐 주던 기둥이 하루아침에 사라졌다. 핵우산이 흔들렸고, 통화스와프를 맺어 줄 상대가 없어졌고, 수출길이 막혔다. 환율이 치솟던 밤, 경제부총리는 대통령 앞에서 말을 잇지 못했다. 사람들은 IMF 때보다 나쁘다고 했다. 그 말이 틀리지 않았다.\n\n그래도 버텼다.\n\n규제를 걷어 냈고, 세금을 낮췄고, 잠자던 돈을 깨워 공장으로 보냈다. 늙은 원전 자리에 새 원전을 세웠고, 반도체 다음에 먹고살 씨앗 일곱 개를 심었다. 땅은 국가가 갖고 집은 국민이 갖게 했다. 미국이 지켜 주지 않는 나라를 스스로 지킬 수 있게 군을 다시 세웠다.\n\n쉬운 길은 하나도 없었다. 노조는 거리로 나왔고, 야당은 매일 퇴진을 외쳤고, 서울시장과는 방송으로 말싸움을 했다. 통계청 보고서가 올라온 날이었다. 중산층 비율이 65퍼센트를 넘었다고 했다. 그는 아무 말 없이 보고서를 두 번 읽었다.\n\n비서실장이 조심스럽게 물었다.\n\n\"수락 회신 보내겠습니다.\"\n\n\"그래요.\"\n\n홍준표는 초청장을 내려놓고 창밖을 봤다.\n\n\"미국이 있을 때 우리는 미국 덕에 컸다는 소리를 들었어요. 이제 미국이 없는데도 컸어요. 그러니까 이제는 아무도 그 소리 못 합니다.\"\n\n\"세상이 무너지는 동안 우리는 안 무너졌어요. 그래서 부른 겁니다. 여기서 멈추면 안 돼요. 미국이 비운 자리는 우리가 채웁니다.\"\n\n같은 날 오후.\n\n경기도 시흥의 금형공장에서는 김 사장이 새로 뽑은 직원 아홉 명의 이름표를 붙이고 있었다. 박 반장은 이제 공장장이었다.\n\n서울 노원구의 은행 창구에서는 최씨가 미래펀드 수익률이 적힌 안내문을 받아 들고 있었다. 손녀는 졸업 전에 반도체 회사에 붙었다. 대구 공장이었다.\n\n여의도 순댓국집 TV에서 정상회의 초청 속보가 흘러나왔다. 철물점 박씨는 깍두기를 얹으며 화면을 힐끗 보았다.\n\n\"뭐, 누가 잘해서든.\"\n\n국물을 한 숟갈 떴다.\n\n\"나라가 잘되면 됐지.\""
 tfrkphn.211.story_a:0 "초청을 수락한다."
 tfrkphn.66.story:0 "춘추시대, 진나라에 위무자라는 장수가 있었다. 그에게는 아끼는 첩이 하나 있었는데, 둘 사이에는 자식이 없었다.\n\n위무자가 병들어 눕자 아들 위과를 불렀다.\n\n\"내가 죽거든 저 사람을 좋은 곳에 개가시켜라.\"\n\n그러나 병이 깊어지자 말이 바뀌었다.\n\n\"내가 죽거든 저 사람을 나와 함께 묻어라.\"\n\n그 시절에는 주인이 죽으면 아끼던 사람을 함께 묻는 순장의 풍습이 있었다. 아버지가 세상을 떠나자 위과는 두 유언 사이에서 오래 고민했다. 그리고 첫 번째 말을 따랐다.\n\n\"사람은 병이 깊으면 정신이 흐려진다. 나는 아버지가 맑은 정신일 때 하신 말씀을 따르겠다.\"\n\n위과는 그 여인을 살려 좋은 집안에 시집보냈다.\n\n몇 해 뒤, 서쪽의 진나라가 쳐들어왔다. 위과는 보씨 땅에서 적을 맞았다. 적장은 두회라는 이름난 장사였다. 그가 휘두르는 창 앞에서 진나라 병사들이 줄줄이 쓰러졌다.\n\n그때 이상한 일이 일어났다. 두회가 말을 몰아 달려드는데, 들판의 풀이 그의 발목을 휘감았다. 누군가 풀을 엮어 매듭을 지어 놓은 것이었다. 천하장사가 풀매듭에 걸려 넘어졌고, 위과는 그를 사로잡았다.\n\n그날 밤, 위과의 꿈에 한 노인이 나타났다.\n\n\"나는 그대가 시집보낸 여인의 아비요. 그대가 아버지의 맑은 말씀을 따라 내 딸을 살렸기에, 오늘 풀을 묶어 그 은혜를 갚았소.\"\n\n풀을 맺어 은혜를 갚는다. 결초보은이다.\n\n죽은 사람도 은혜를 잊지 않는다. 하물며 산 나라가 잊어서야 되겠는가.\n\n나라 사이에도 은혜와 빚이 있다. 이번 전쟁에서 배를 보내 준 나라가 있었고, 항구를 닫은 나라가 있었다.\n\n갚을 보에는 두 가지 뜻이 있다. 받은 은혜를 갚는 것, 그리고 저지른 잘못에 값을 치르게 하는 것. 대한민국은 둘 다 하기로 했다.\n\n외교부는 전쟁 때 각국이 한 일을 정리한 명단부터 만들었다."
 tfrkphn.66.story_a:0 "풀을 맺어서라도 은혜는 갚는다."
 tfrkphn.67.story:0 "중화민국 금문현, 소금문 서쪽 해안 초소.\n\n새벽 다섯 시. 상등병 린웨이는 망원경을 눈에서 떼고 손등으로 눈을 비볐다. 바다 건너편이 밝아 오고 있었다.\n\n샤먼. 직선거리로 몇 킬로미터. 맑은 날이면 맨눈으로도 고층 빌딩의 창문 개수를 셀 수 있었다. 빌딩 숲 아래로 해안도로를 달리는 차들의 불빛이 보였다. 저쪽 사람들도 지금쯤 출근 준비를 한다.\n\n그 사이 바다 한가운데에 작은 바위섬이 하나 떠 있었다. 섬 전체가 콘크리트 벙커였다. 할아버지 세대가 포탄을 맞아 가며 지킨 섬이었다. 1958년, 44일 동안 47만 발의 포탄이 이 섬들 위로 떨어졌다고, 학교에서 배웠다.\n\n그리고 얼마 전, 다시 포성이 울렸다.\n\n린웨이는 그날을 잊지 못했다. 섬 전체가 흔들렸고, 통신이 끊겼고, 모두가 이번엔 끝이라고 생각했다. 미국은 오지 않았다. 미국은 제 나라 안의 전쟁으로 바빴다.\n\n대신 다른 배들이 왔다. 일본의 호위함이, 필리핀의 초계정이, 그리고 태극기를 단 구축함이 해협으로 들어왔다. 초소의 무전기에서 처음 듣는 언어가 흘러나왔다. 린웨이는 그게 한국어라는 걸 한참 뒤에야 알았다.\n\n초소 안 라디오에서 아침 뉴스가 흘러나왔다.\n\n\"대한민국 정부는 오늘 PDTO에 정식 가입한다고 발표했습니다. 이로써 대한민국은 일본, 중화민국 등 회원국과 집단방위 의무를 공유하게 됩니다....\"\n\n선임병 천 하사가 담배를 물고 초소 안으로 들어왔다.\n\n\"들었어? 한국이 들어왔대.\"\n\n\"들었습니다.\"\n\n\"우리 아버지 때는 한국이 우리를 버렸다고들 했지. 하룻밤 사이에 대사관 문을 닫았다고. 그런데 이번엔 와서 같이 싸웠어. 이제는 아예 한 편이 됐고.\"\n\n린웨이는 다시 망원경을 들었다. 바다 건너 빌딩들 위로 해가 떠오르고 있었다. 오성홍기가 걸린 건물 옥상이 붉게 빛났다.\n\n바다도 거리도 그대로였다. 달라진 것은 초소 뒤 부두에 정박한 배들의 깃발이었다.\n\n\"하사님.\"\n\n\"응.\"\n\n\"이제 이 섬, 우리만 지키는 거 아니죠.\"\n\n천 하사는 대답 대신 담배 연기를 길게 내뿜었다. 그리고 고개를 끄덕였다."
 tfrkphn.67.story_a:0 "이 섬은 이제 혼자 지키지 않는다."
 tfrkphn.68.story:0 "서울 종로구, 광화문 네거리의 한 오피스 빌딩.\n\n오전 열 시. 빌딩 입구 옆에 붙어 있던 현판이 내려졌다. '주한국 타이베이대표부'. 30년 넘게 대사관이라는 이름을 쓰지 못한 채 그 자리를 지킨 이름이었다.\n\n새 현판이 올라갔다. '주대한민국 중화민국 대사관'.\n\n현판을 덮은 천이 걷히는 순간, 건물 앞에 모인 사람들 사이에서 박수가 터졌다. 태극기와 청천백일만지홍기가 나란히 게양대에 올랐다. 바람이 불자 두 깃발이 같은 방향으로 펄럭였다. 애국가에 이어 중화민국 국가가 연주되었다.\n\n맨 앞줄에 백발의 노인 하나가 서 있었다. 서울에서 나고 자란 화교였다. 그는 손수건으로 눈가를 눌렀다.\n\n\"1992년 8월이었지요. 명동 대사관에서 청천백일기가 내려가는 걸 봤습니다. 교민들이 울면서 국가를 불렀어요. 하룻밤 사이에 우리는 친구 나라에서 없는 나라가 됐습니다. 대사관 건물도 그날로 남의 것이 됐고요.\"\n\n\"그런데 이번 전쟁 때 한국이 약속을 지켰어요. 끝까지 같이 가겠다고 했고, 정말로 끝까지 왔어요.\"\n\n신임 중화민국 대사가 단상에 올랐다. 그는 준비한 원고 대신 서툰 한국어로 짧게 말했다.\n\n\"30여 년 전 우리는 명동에서 문을 닫고 떠났습니다. 오늘 광화문에서 그 문을 다시 엽니다. 이번에는 닫지 않겠습니다.\"\n\n같은 시각, 걸어서 20분 거리의 명동.\n\n중국대사관 앞 골목이 붉은 깃발로 가득했다. 수백 명의 중국인 유학생들이었다. 그들은 대사관 정문을 향해 오성홍기를 흔들며 의용군행진곡을 불렀다. 항일전쟁 때 만들어진 노래였다. 침략자에 맞서 일어서라는 노래가, 이제는 한국을 향해 울려 퍼지고 있었다.\n\n경찰 기동대가 골목 양쪽을 막아섰다. 지나가던 시민들이 걸음을 멈추고 휴대폰을 들었다. 누군가 중얼거렸다.\n\n\"저 건물이 원래 대만 대사관이었다는 건 알까.\"\n\n노랫소리는 점점 커졌다. 앞줄의 학생 하나가 목이 터져라 소리쳤다. 그 얼굴에는 분노와 함께, 어딘가 억울함 같은 것이 섞여 있었다. 그들에게 이것은 배신이었다. 한국은 하나의 중국을 약속했고, 그 약속을 깼다.\n\n광화문의 연주가 끝난 뒤에도 명동의 노래는 한 시간 넘게 이어졌다. 경찰은 해가 질 때까지 골목을 지켰다."
 tfrkphn.68.story_a:0 "이번에는 문을 닫지 않는다."
 tfrkphn.69.story:0 "인과응보.\n\n인할 인, 열매 과, 응할 응, 갚을 보.\n\n원인이 있으면 결과가 있고, 행한 일에는 반드시 그에 맞는 갚음이 돌아온다는 말이다.\n\n본래 불교의 가르침에서 나왔다. 씨앗을 심으면 열매가 맺힌다. 콩을 심은 자리에서 콩이 나고, 팥을 심은 자리에서 팥이 난다. 착한 씨앗은 좋은 열매를 맺고, 악한 씨앗은 나쁜 열매를 맺는다. 선인선과, 악인악과. 열매가 언제 맺힐지는 알 수 없으나, 맺히지 않는 씨앗은 없다.\n\n서양에도 같은 말이 있다. 뿌린 대로 거둔다. 돌아간 것은 돌아온다.\n\n앞서 갚을 보에는 두 가지 뜻이 있다고 했다. 은혜를 갚는 것, 그리고 잘못에 값을 치르게 하는 것. 결초보은이 앞의 것이다. 인과응보는 뒤의 것이다.\n\n전쟁은 저절로 일어나지 않는다. 누군가 먼저 바다를 건넜고, 누군가 먼저 포를 쏘았다. 그 포탄에 대만의 섬들이 불탔고, 대한민국의 젊은이들이 바다에 묻혔다. 전쟁이 끝났다고 그 씨앗이 사라지지는 않는다.\n\n대가를 묻지 않으면 같은 씨앗은 다시 뿌려진다. 다음 전쟁을 막으려면 이번 전쟁의 값을 받아야 한다.\n\n그러므로 대한민국은 묻는다. 전쟁을 일으킨 자에게 그 열매를 거두게 한다.\n\n정부는 배상 청구 목록을 만들기 시작했다."
 tfrkphn.69.story_a:0 "뿌린 대로 거둔다."
 tfrkphn.70.story:0 "군대에는 오래된 격언이 있다. 아마추어는 전술을 말하고, 전문가는 보급을 말한다.\n\n총이 있어도 탄이 없으면 막대기다. 탄이 있어도 밥이 없으면 병사는 쓰러진다. 그리고 탄과 밥이 다 있어도, 기름이 없으면 아무것도 움직이지 않는다. 전차도, 군함도, 전투기도, 탄과 밥을 실어 나를 트럭조차도.\n\n1941년, 미국이 석유 수출을 끊자 일본은 남쪽의 유전을 차지하려고 진주만을 쳤다. 기름 때문에 시작한 전쟁이었고, 기름이 바닥나 진 전쟁이었다. 전쟁 말기, 일본의 전함들은 연료가 없어 항구에 묶여 있었다.\n\n1944년 겨울, 아르덴 숲. 독일군 전차들은 연합군의 연료 창고를 노리고 진격했다. 그러나 창고에 닿기 전에 기름이 떨어졌다. 승무원들은 멀쩡한 전차를 버리고 걸어서 돌아갔다.\n\n그리고 이번 전쟁.\n\n대만해협에 들어간 대한민국 함대가 가장 먼저 부딪힌 적은 중국 해군이 아니었다. 연료였다. 대한민국은 기름 한 방울 나지 않는 나라다. 쓰는 석유의 거의 전부를 바다 건너에서 들여온다. 그 바닷길을 지켜 주던 미국 해군은 사라졌다. 전쟁이 시작되자 중동에서 오던 유조선들이 말라카 해협 앞에서 멈칫거렸다. 보험료는 하루가 다르게 치솟았다.\n\n구축함 함장들은 작전 해역보다 남은 연료 눈금을 더 자주 들여다봤다. 기름이 떨어지면 돌아가야 했고, 돌아가면 그 자리는 비었다.\n\n이제 그 교훈을 제도로 만든다.\n\nPDTO 회원국들은 태평양의 네 항구를 에너지 거점으로 묶기로 했다.\n\n§Y부산§! 한반도와 동해의 관문. 대한민국 해군과 산업의 심장에 기름을 댄다.\n\n§Y요코하마§! 도쿄만의 입구. 일본 열도의 정유와 비축을 맡는다.\n\n§Y가오슝§! 대만 남부의 군항. 해협 최전선에 기름을 댄다.\n\n§Y시드니§! 남태평양의 후방 기지. 전선이 아무리 흔들려도 무너지지 않을 마지막 창고.\n\n네 항구에는 공동 비축 기지가 들어서고, 한 곳의 탱크가 마르면 나머지 세 곳이 채운다. 어느 한 나라의 바닷길이 막혀도, 연합 전체의 기름은 마르지 않는다.\n\n다음 전쟁에서 대한민국의 군함은 기름 눈금이 아니라 적을 본다."
 tfrkphn.70.story_a:0 "전쟁은 기름으로 한다."
 tfrkphn.71.story:0 "1994년 11월, 호주 시드니.\n\n아시아태평양경제협력체(APEC) 정상회의를 마친 김영삼 대통령이 기자들 앞에 섰다. 그는 그 자리에서 새로운 국정 목표를 내놓았다.\n\n세계화.\n\n좁은 한반도를 벗어나 세계로 나가자는 말이었다. 우물 안에서 남북끼리, 동서끼리 싸울 것이 아니라 바깥 세계와 경쟁해서 이기자는 말이었다. 정부에는 세계화추진위원회가 생겼다. 2년 뒤 대한민국은 선진국 클럽이라 불리던 OECD에 가입했다.\n\n그 무렵, 서울지검의 한 검사가 정치에 뛰어들었다. 모래시계 검사로 이름을 알린 홍준표였다. 1996년 총선을 앞두고 그를 정치판으로 불러낸 사람이 김영삼이었다.\n\n그리고 이듬해, IMF가 왔다.\n\n세계화는 실패한 말이 되었다. 문을 서둘러 열었고, 준비 없이 바다로 나갔다고들 했다. 기업들은 쓰러졌고, 거리에는 실업자가 넘쳤다. 사람들은 세계화라는 말을 들으면 금 모으기 운동과 눈물부터 떠올렸다.\n\n방향은 맞았다. 순서가 틀렸다. 바깥으로 나가기 전에 안을 다졌어야 했다. 남의 기준을 따라가기 전에 내 이익을 먼저 셈했어야 했다.\n\n30여 년이 지났다. 미국은 무너졌고, 세계는 다시 쪼개졌다. 이념의 줄을 서면 안전하던 시대는 끝났다. 이제 누구와 손을 잡을지는 국익이 정한다.\n\n그래서 대한민국은 서쪽을 본다. 인도.\n\n14억의 시장. 세계에서 가장 젊은 노동력. 어느 진영에도 몸을 맡기지 않고 제 이익을 지켜 온 나라. 인도는 이념보다 국익을 먼저 셈하는 법을 누구보다 잘 아는 나라다.\n\n인도 동부 오디샤 주에는 이 나라 크롬의 거의 전부가 묻혀 있다. 크롬이 없으면 스테인리스강도, 전차의 장갑도, 제트엔진의 합금도 만들 수 없다. 대한민국은 그 크롬을 가져오고, 인도에는 공장과 기술과 일자리를 가져간다.\n\n30여 년 전, 시드니에서 시작된 세계화는 실패로 끝났다. 이번에는 안부터 다지고 나간다."
 tfrkphn.71.story_a:0 "국익이 먼저고, 세계는 그다음이다."
 tfrkphn.72.story:0 "11월 11일 오전 11시, 부산 남구 유엔기념공원.\n\n사이렌이 울렸다. 묘역에 선 사람들이 일제히 고개를 숙였다. 같은 시각, 바다 건너에서도 사람들이 부산 쪽을 향해 섰다. 마닐라와 방콕, 캔버라와 런던, 오타와였다. 그들도 1분 동안 묵념했다. 턴 투워드 부산. 6.25전쟁에 목숨을 바친 유엔군 용사들을 기리는 국제 추모식이었다.\n\n이곳은 세계에서 하나뿐인 유엔군 묘지다. 이름도 잘 모르던 나라를 지키러 와서 돌아가지 못한 2천여 명이 잠들어 있다.\n\n묵념이 끝나자 대통령이 헌화대 앞으로 걸어 나왔다. 그 뒤로 참전국 대사들이 줄지어 섰다. 맨 앞줄에는 필리핀과 태국의 대사가 있었다. 1950년, 아시아에서 가장 먼저 군대를 보낸 나라들이었다. 그때 필리핀은 대한민국보다 잘사는 나라였다. 원조를 주던 나라였다.\n\n헌화를 마친 대통령이 연단에 섰다.\n\n\"70여 년 전, 여러분의 할아버지들은 지도에서 찾기도 힘든 나라에 왔습니다. 그분들이 흘린 피 위에 오늘의 대한민국이 서 있습니다. 우리는 그 빚을 잊은 적이 없습니다. 이번 전쟁에서 우리는 대만 곁에 섰습니다. 오늘은 아시아의 친구들과 손을 잡습니다. 모두 그 빚을 갚는 일입니다.\"\n\n\"오늘부터 대한민국은 참전국 후손들에게 장학금을 줍니다. 참전국과의 교역과 방산 협력도 넓히겠습니다. 은혜를 아는 나라는 친구를 잃지 않습니다.\"\n\n객석의 한 노인이 지팡이를 짚고 일어나 경례했다. 필리핀에서 온 참전용사의 아들이었다."
 tfrkphn.72.story_a:0 "그 빚을 잊은 적은 없다."
 tfrkphn.86.t:0 "버르장머리"
 tfrkphn.86.story:0 "§Y[자료화면] 1995년 11월 14일, 저녁 9시 뉴스§!\n\n\"김영삼 대통령과 중국 장쩌민 국가주석이 오늘 청와대에서 정상회담을 가졌습니다. 두 정상은 최근 일본 각료의 과거사 망언에 대해 강한 유감을 표시했습니다.\"\n\n\"앞서 에토 다카미 일본 총무청 장관의 발언이 파문을 일으켰습니다. 일본이 식민지 시절 한국에 좋은 일도 했다는 발언입니다.\"\n\n\"김 대통령은 공동 기자회견에서 강한 어조로 일본 정부를 비판했습니다. 이번에야말로 일본의 버르장머리를 고쳐놓겠다고 했습니다. 정부는 에토 장관의 해임을 거듭 촉구하고 있습니다. 한일 관계는 당분간 냉각될 전망입니다.\"\n\n그 말에 국민들은 박수를 쳤다. 시원하다고 했다. 2년 뒤 외환위기가 닥쳤다. 가장 먼저 돈을 빼 간 것은 일본계 자금이었다고들 했다.\n\n외교는 감정으로 하는 것이 아니다. 갚을 것은 갚고, 따질 것은 따진다. 그 둘을 섞지 않는다.\n\n30여 년이 지난 지금, 그 일본은 PDTO의 동맹국이 되어 대만해협에서 함께 싸웠다. 과거의 잘못은 잊지 않는다. 그러나 오늘의 은혜도 잊지 않는다.\n\n외교부 청사 1층에는 그날의 뉴스 화면과 대만해협의 연합 함대 사진이 나란히 걸렸다."
 tfrkphn.86.story_a:0 "갚을 것은 갚고, 따질 것은 따진다."
 tfrkphn.206.story:0 "폴란드 북부, 그디니아 항구.\n\n잿빛 발트해 위로 거대한 화물선 한 척이 들어왔다. 갑판 위에는 위장막을 씌운 전차들이 줄지어 실려 있었다. 대한민국에서 온 K2 전차였다. 크레인이 첫 번째 전차를 부두에 내려놓자, 기다리던 폴란드 군인들 사이에서 박수가 터졌다.\n\n부두 끝에서 그 광경을 지켜보던 노인이 있었다. 얀 코발스키. 일흔을 훌쩍 넘긴 전직 조선소 용접공이었다. 그는 낡은 모자를 벗어 손에 쥐었다.\n\n이 항구에서 차로 20분 거리에 그단스크 조선소가 있다. 1980년 8월, 얀은 그곳에 있었다.\n\n공산 정권이 고기값을 올리고 동료 노동자를 해고하자, 조선소 노동자들이 일손을 놓았다. 그때 해고당했던 전기공 하나가 조선소 담장을 넘어 들어왔다. 콧수염을 기른 키 작은 사내, 레흐 바웬사였다. 그는 상자 위에 올라서서 파업을 이끌었다.\n\n그렇게 자유노조 연대, 솔리다르노시치가 태어났다. 공산권에서 처음으로 정권의 허락 없이 생겨난 노동조합이었다. 한때 조합원이 천만 명에 가까웠다. 정권은 계엄령을 선포하고 지도자들을 잡아들였다. 그래도 조합원들은 지하로 내려가 버텼다.\n\n1989년 6월, 폴란드에서 반쯤 자유로운 선거가 열렸고 연대가 압승했다. 그해 가을, 그 바람은 국경을 넘었다. 헝가리가 국경 철조망을 걷었다. 베를린 장벽이 무너졌다. 프라하의 광장에 열쇠 꾸러미 흔드는 소리가 가득했다. 1년도 안 되어 동유럽 전체가 자유를 되찾았다. 조선소 담장 하나를 넘은 사내에게서 시작된 일이었다.\n\n얀은 그 시절 신문에서 한국이라는 나라를 처음 읽었다. 1987년, 그 먼 나라에서도 학생과 노동자들이 거리로 나와 독재를 끝냈다는 기사였다. 그때 그는 생각했다. 세상 반대편에도 우리 같은 사람들이 있구나.\n\n그리고 더 오래전, 유럽은 그 나라에 이미 피를 흘린 적이 있었다.\n\n1950년, 영국은 5만 명이 넘는 군인을 한반도에 보냈다. 1951년 봄 임진강, 글로스터 대대는 몇 배나 되는 중공군에 포위된 채 사흘을 버텼다. 그들이 시간을 버는 동안 서울은 다시 떨어지지 않았다.\n\n프랑스의 몽클라르 장군은 한국에 가겠다며 중장 계급장을 떼고 스스로 중령이 되었다. 그가 이끈 프랑스 대대는 지평리에서 미군과 함께 중공군의 파상공세를 막아 냈다. 전쟁의 흐름이 거기서 바뀌었다.\n\n네덜란드, 벨기에, 룩셈부르크, 그리스, 튀르키예가 군대를 보냈다. 스웨덴, 덴마크, 노르웨이, 이탈리아가 병원과 의료진을 보냈다.\n\n70여 년이 흘렀다. 미국이 무너지고 대한민국이 대만해협에서 싸울 때, 유럽은 다시 대한민국 편에 섰다. 런던과 파리는 규탄 성명을 냈고, 바르샤바는 탄약을 실어 보냈다.\n\n대한민국은 전차와 자주포, 전투기를 파는 데서 그치지 않기로 했다. 기술을 넘기고 폴란드 땅에 공장을 함께 짓는다.\n\n크레인이 두 번째 전차를 내려놓았다. 얀은 모자를 다시 썼다. 그리고 옆에 선 젊은 한국인 기술자에게 서툰 영어로 말했다.\n\n\"1987년에 신문에서 당신네 나라를 읽었소. 그때는 이런 걸 받게 될 줄 몰랐지.\""
 tfrkphn.206.story_a:0 "두 번째 전차가 부두에 내렸다."
 tfrkphn.207.story:0 "경기도 어느 소도시의 보훈회관. 6월 25일 아침.\n\n회관 강당에 접이식 의자 서른 개가 놓였다. 해마다 의자 수가 줄었다. 올해는 스물두 개가 찼다.\n\n맨 앞줄에 김복동 할아버지가 앉아 있었다. 아흔다섯. 열여덟 살에 학도병으로 낙동강 전선에 나갔다. 같이 나간 반 친구 열한 명 중에 돌아온 사람은 셋이었다. 이제 그 셋 중에 남은 사람은 그 혼자였다.\n\n그 옆자리에는 박정수 할아버지가 앉았다. 여든둘. 1960년대 말 맹호부대원으로 베트남 정글에 갔다. 스물두 살이었다. 우기에는 군화가 마를 날이 없었다. 밤이면 어둠 속의 작은 소리에도 총을 움켜쥐었다. 돌아와서 몇 해 동안은 비 오는 밤에 잠을 이루지 못했다.\n\n두 사람은 이 회관에서 만난 지 20년이 넘었다. 박 할아버지는 김 할아버지를 늘 형님이라고 불렀다.\n\n\"형님, 올해도 오셨네요.\"\n\n\"내가 안 오면 의자 하나 또 빠질 거 아이가.\"\n\n식순에 따라 국민의례가 시작되었다. 애국가가 울리자 스물두 명이 의자를 짚고 하나둘 일어섰다. 김 할아버지는 지팡이를 짚고도 한참이 걸렸다. 박 할아버지가 팔꿈치를 받쳤다.\n\n모두가 오른손을 들어 경례했다. 손끝이 떨렸지만, 손바닥의 각도는 젊은 날 훈련소에서 배운 그대로였다.\n\n행사가 끝나고 보훈부 직원이 새 명패를 들고 왔다. '국가유공자의 집'. 거기에 오늘부터 달라지는 것들이 적힌 안내문이 함께 있었다. 참전명예수당 인상. 보훈병원 진료비 전액 지원. 거동이 불편한 참전용사를 위한 방문 간호. 그리고 국립묘지 안장을 기다리는 유가족을 위한 전담 창구.\n\n박 할아버지가 안내문을 천천히 읽었다. 김 할아버지는 돋보기를 놓고 와서 명패만 쓰다듬었다.\n\n\"이제야 알아주는 갑다.\"\n\n\"늦었어도 고맙지요, 형님.\"\n\n김 할아버지는 대답 대신 명패를 가슴에 안았다. 그리고 한참 뒤에 말했다.\n\n\"우리 반 아이들 이름은 아무도 몰라. 낙동강에서 죽은 아이들. 그 아이들 몫까지 받는 기라, 이건.\"\n\n회관 밖으로 나오자 6월의 햇살이 따가웠다. 손자뻘 되는 젊은 군인 하나가 지나가다 두 노인을 보고 걸음을 멈췄다. 그리고 군모를 고쳐 쓰고 경례했다.\n\n두 노인도 천천히 손을 들어 경례를 받았다."
 tfrkphn.207.story_a:0 "두 노인은 경례를 받았다."
 tfrkphn.208.story:0 "결초보은. 풀을 맺어 은혜를 갚는다.\n\n2,600년 전, 진나라의 위과는 한 여인을 살렸다. 아버지가 맑은 정신일 때 남긴 말을 따랐다. 몇 해 뒤 전장에서, 그 여인의 죽은 아비가 들판의 풀을 엮어 적장의 발을 걸었다. 산 사람이 베푼 은혜를 죽은 사람이 갚았다.\n\n이 이야기에서 풀을 묶은 것은 노인이었다. 그러나 그 풀은 위과가 먼저 심은 것이었다. 위과가 먼저 베풀지 않았다면 풀을 묶을 사람도 없었다.\n\n대한민국이 걸어온 길도 그러했다.\n\n1950년, 이름도 모르던 나라를 지키러 스물두 나라가 왔다. 임진강의 영국군이 사흘을 버텼다. 몽클라르는 별을 떼고 중령이 되어 지평리를 지켰다. 필리핀과 태국의 젊은이들은 아시아에서 가장 먼저 배에 올랐다. 그들 중 2천여 명은 지금도 부산의 묘역에 잠들어 있다. 그들이 풀을 묶었다.\n\n그 풀 위에서 대한민국은 일어섰다. 낙동강의 학도병이 살아남아 아흔이 넘도록 의자 하나를 지켰다. 베트남의 정글에서 돌아온 청년이 그 옆자리를 지켰다. 그들도 풀을 묶었다.\n\n그리고 적룡이 바다를 건넜다.\n\n금문의 바위섬에 다시 포탄이 떨어졌을 때, 대만은 혼자일 줄 알았다. 30여 년 전 명동에서 하룻밤 사이에 문을 닫고 떠났던 나라였다. 그러나 이번에 대한민국은 떠나지 않았다. 태극기를 단 구축함이 해협으로 들어갔고, 광화문에는 청천백일기가 다시 올랐다. 70년 전 받은 은혜를, 대한민국은 다른 나라를 지키는 것으로 갚았다.\n\n그 뒤로 친구가 늘었다. 도쿄와 타이베이와 캔버라가 한 편이 되었다. 부산과 요코하마, 가오슝과 시드니의 탱크에 같은 기름이 채워졌다. 오디샤의 크롬이 서쪽에서 왔고, 그디니아 부두에는 K2가 내렸다. 그단스크의 담장을 넘었던 사람들이, 서울의 광장에 섰던 사람들에게 손을 내밀었다.\n\n갚을 보에는 뜻이 하나 더 있다.\n\n적룡은 씨앗을 뿌렸다. 바다를 건너 포를 쏘았고, 섬들을 불태웠고, 젊은이들을 바다에 묻었다. 뿌린 것은 거두게 된다. 인과응보다.\n\n위과의 이야기에서 눈여겨볼 대목은 풀매듭보다 그 앞이다. 그는 아버지의 맑은 말을 따랐다. 순장의 풍습을 따랐다 해도 탓할 사람은 없었다. 그 선택이 몇 해 뒤 그를 살렸다.\n\n나라도 다르지 않다. 받은 것을 기억하고 약속한 것을 지키면, 위기에 빠졌을 때 풀을 묶어 줄 나라가 생긴다.\n\n이번 전쟁에서 대한민국은 그것을 직접 겪었다."
 tfrkphn.208.story_a:0 "받은 은혜는 풀을 맺어서라도 갚는다."
 tfrkphn.73.story_t:0 "걸어온 길"
 tfrkphn.73.story:0 "자정이 넘은 대통령 집무실. 사내가 홀로 앉아 있었다.\n\n3년 전에도 그는 이 자리에 이렇게 앉아 있었다. 승전의 폭죽 소리가 겨우 잦아들던 무렵이었다. 그날 밤 그는 끊었던 담배를 꺼내 물었고, 어두운 창유리에 비친 제 얼굴을 보았다. 낮보다 한참 늙어 보이던 얼굴이었다.\n\n그때 책상 위에는 약속만 있었다. 선진대국을 만들겠다는 약속. 국민 앞에서 한 그 말이 얼마나 무거운지, 그는 그 밤에야 알았다.\n\n오늘 밤 그는 담배 대신 만년필을 들었다.\n\n그는 백지 위에 네 글자를 천천히 적었다.\n\n진. 충. 보. 국.\n\n진충보국. 정성을 다해 충성하고, 나라의 은혜에 보답한다. 대통령이 되겠다고 나서던 날, 그가 마지막 도전이라며 국민 앞에 내건 말이었다. 그는 그 네 글자를 순서로 읽었다. 무엇을 먼저 하고 무엇을 나중에 할지.\n\n그는 첫 글자 위에 펜 끝을 올렸다.\n\n§Y진, 다할 진.§!\n\n정치는 사람을 무디게 만든다. 30년을 하다 보면 칼은 녹슬고 날은 무뎌진다. 사람들은 그 칼을 정치인의 장식품쯤으로 여긴다. 그는 대통령이 되자마자 그 칼을 다시 갈았다. 모래시계 검사 시절의 칼이었다.\n\n범죄와의 전쟁을 선포했다. 조직폭력배와 마약 조직과 아이들을 노리는 자들에게 국가의 칼끝을 겨눴다. 정부의 군살을 뺐다. 부처를 합치고, 위원회를 없애고, 공무원들에게 보고서가 아니라 결과를 가져오라고 했다.\n\n귀족이 된 노조와 부딪쳤다. 그들은 거리로 나왔고, 그는 물러서지 않았다. 일하는 사람을 지키는 것과 일하지 않는 특권을 지키는 것은 다르다고 했다. 욕을 많이 먹었다. 그래도 공장은 다시 돌았다.\n\n기자회견장 대신 카메라 앞에 혼자 앉아 국민에게 직접 말했다. 사람들은 그 방송을 홍카콜라라고 불렀다. 톡 쏘는 맛이 있다고. 서민의 대통령이 되겠다고 했고, 시장 바닥의 국밥집에서 밥을 먹었다. 동과 서가 서로를 미워하지 않도록 달빛동맹의 다리를 놓았다. 꿈을 잃은 청년들에게는 사다리를 놓으려 했다.\n\n다 이루었다고는 못 한다. 힘이 닿는 데까지는 했다.\n\n그는 두 번째 글자로 펜을 옮겼다.\n\n§Y충, 충성 충.§!\n\n지난 30년 동안 그는 당에 충성하는 정치를 했다. 공천을 받으려고, 당권을 잡으려고, 계파와 계파 사이에서 줄을 섰다. 대통령이 된 날, 그는 이제부터 국익에만 충성하겠다고 했다. 그 말은 생각보다 훨씬 무거웠다. 국익에 충성한다는 것은, 때로 자기 편에게 등을 돌려야 한다는 뜻이었다.\n\n미국이 무너지고 핵우산이 흔들렸을 때, 그는 힘이 있어야 평화도 지킨다고 했다. 무장평화. 모병제를 넓혀 직업군인의 나라를 만들었고, 여성도 일반병으로 총을 들 수 있게 했다. 킬체인과 미사일방어와 대량응징보복, 3축 체계를 완성했다. 핵 앞에서 물러서지 않겠다고 PDTO의 동맹들과 마주 앉았다.\n\n북한에는 간섭하지도, 간섭받지도 않겠다고 했다. 판문점을 넘어온 병사를 돌려보내지 않았고, 평양의 협박에도 고개를 숙이지 않았다. 적룡의 동맹들이 동쪽으로 손을 뻗을 때, 이념이 아니라 국익으로 맞섰다.\n\n국방과학연구소 복도의 빈 액자를 채웠다. 가난하던 시절 맨손으로 미사일을 만들던 사람들의 이름이었다. 군복을 입고 청춘을 바친 젊은이들의 시간을 나라가 갚게 했다. 그리고 3축 5군. 육해공에 해병과 우주를 더한 군대가 대한민국을 지키게 되었다.\n\n당에 하던 충성을 나라에 했다. 이제는 그 말을 부끄럽지 않게 할 수 있었다."
 tfrkphn.73.story_a:0 "다음 글자로."
 tfrkphn.87.t:0 "걸어온 길"
 tfrkphn.87.story:0 "사내는 잠시 펜을 내려놓고 식은 차를 한 모금 마셨다. 창밖으로 북악산의 윤곽이 어둠 속에 검게 누워 있었다. 그는 다시 펜을 들었다.\n\n§Y보, 갚을 보.§!\n\n갚을 보에는 두 가지 뜻이 있다. 받은 은혜를 갚는 것, 그리고 저지른 잘못에 값을 치르게 하는 것.\n\n대만해협에 불이 붙었을 때, 국회는 대만지원법을 놓고 둘로 갈라졌다. 그는 끝까지 함께하겠다고 약속했고, 그 약속을 지켰다. 태극기를 단 구축함이 해협으로 들어갔다. 30여 년 전 명동에서 하룻밤 사이에 대사관의 문을 닫았다. 이번에는 광화문에서 그 문을 다시 열었다. 같은 시각 명동에서는 붉은 깃발과 노랫소리가 골목을 메웠다. 그는 광화문 쪽을 골랐다.\n\n대한민국은 PDTO의 정식 회원국이 되었다. 대만의 병사들은 금문의 바위섬에서 바다 건너 적룡의 빌딩 숲을 바라보았다. 그들은 이제 그 섬을 혼자 지키지 않았다. 부산과 요코하마와 가오슝과 시드니의 탱크에는 같은 기름이 채워졌다.\n\n김영삼이 시드니에서 외쳤던 세계화를, 그는 다시 꺼냈다. 이번에는 순서를 지켰다. 국익이 먼저였고 세계는 그다음이었다. 인도와 손을 잡았고, 오디샤의 크롬이 바다를 건너왔다.\n\n부산의 유엔기념공원에 헌화하던 날이었다. 그는 70여 년 전 이 나라를 지키러 온 스물두 나라의 이름을 하나하나 불렀다. 폴란드의 그디니아 부두에는 K2가 내렸다. 그단스크의 담장을 넘었던 사람들이 그 전차를 맞았다. 보훈회관의 의자는 해마다 줄었지만, 남은 의자마다 국가유공자의 명패가 걸렸다.\n\n그리고 적룡에게는 그 대가를 물었다. 뿌린 것은 거두게 했다. 인과응보였다.\n\n풀을 맺어 은혜를 갚는다. 결초보은.\n\n마지막 글자 앞에서 사내의 펜이 오래 멈췄다.\n\n§Y국, 나라 국.§!\n\n전쟁에서 이기고 장사에서 지던 나라였다. 승전 보고서 옆에는 수출이 반 토막 난 통계표가 놓여 있었다. 중국이라는 가장 큰 시장의 문이 닫혔고, 성장률 전망은 한 줄이었다.\n\n그는 비상경제위원회를 만들고 위원장을 직접 맡았다. 매주 밤 열한 시까지 회의를 했다. 장관들에게 보고서 말고 대안을 가져오라고 했다.\n\n규제를 거꾸로 뒤집었다. 하지 말라는 것만 빼고 다 해도 되는 나라. 시흥의 금형공장 사장은 3년 묵힌 서류 봉투를 꺼냈다. 5년 만에 직원들과 삼겹살을 구웠다. 법인세를 낮췄다. 노조와 기자들은 비판했다. 여의도 순댓국집의 철물점 박씨는 누가 맞든 돈만 돌면 된다고 했다.\n\n반도체 다음에 먹고살 씨앗 일곱 개를 심었다. AI, 바이오, 메모리 반도체, 모빌리티, 우주, 수소와 원전, 콘텐츠. 3,500조 원의 잠자던 돈을 깨워 100조 원의 미래펀드로 보냈다. 노원의 퇴직 공무원은 예금의 절반을 그 펀드에 넣었다. 벽돌 한 장쯤은 되겠지 하면서.\n\n경남에서 했던 것처럼 나라의 빚을 갚았다. 줄일 것은 줄이고 지을 것은 지었다. 땅은 국가가, 집은 국민이 갖는 집을 지방 곳곳에 지었다. 서울시장과는 방송으로 말싸움을 했지만, 잘한 건 잘했다고 인정했다. 고리의 늙은 원전이 은퇴한 자리에는 젊은 원전이 들어섰다.\n\n전국 여섯 도의 건설사와 향토기업들이 제 고장에 공장을 짓고 길을 냈다. 경기의 반도체 단지에서 제주의 바다까지, 육각형의 여섯 꼭짓점이 하나씩 채워졌다.\n\n그리고 대한민국은 무너진 세계 위에서 선진국들의 탁자에 앉았다. 미국이 있을 때는 미국 덕에 컸다는 소리를 들었다. 미국이 없는데도 컸다. 이제는 아무도 그 소리를 하지 못했다.\n\n네 글자를 다 짚고 나서, 사내는 펜을 내려놓았다. 진충보국. 백지 위의 네 글자가 스탠드 불빛 아래서 조용히 마르고 있었다."
 tfrkphn.87.story_a:0 "네 글자가 마르기를 기다린다."
 tfrkphn.88.t:0 "걸어가는 길"
 tfrkphn.88.story:0 "사내는 의자 등받이에 몸을 기댔다. 눈을 감자, 오래된 기억들이 차례로 떠올랐다.\n\n경남 창녕의 가난한 집 아들이었다. 일곱 살 무렵 가세가 기울어, 손수레에 세간을 싣고 이틀을 걸어 대구로 갔다. 월세가 싼 곳을 찾아 초등학교를 다섯 번 옮겼다. 도시락을 싸 가지 못해 수돗물로 배를 채운 날이 많았다. 아버지는 학교 문턱을 밟아 보지 못했고, 어머니는 글을 몰랐다. 아버지는 울산의 조선소에서 하룻밤 800원을 받는 야간 경비원으로 일했다.\n\n중학생 때는 직물공장에 다니던 누나의 월세방에 얹혀 살았다. 주인집이 불을 끄라고 하면 이불을 뒤집어쓰고 공부했다. 의사가 되고 싶었지만 학비가 없어 육군사관학교에 붙었다. 그러던 어느 날, 아버지가 억울한 누명을 쓰는 것을 보았다. 그는 진로를 바꿨다. 힘없는 사람이 억울한 일을 당하지 않게 하는 사람, 검사가 되기로 했다. 빚을 내 마련한 등록금을 들고 서울로 올라갔다.\n\n1982년, 사법시험에 붙었다. 아버지는 그 소식을 듣지 못했다. 그 전에 암으로 세상을 떠났다.\n\n1993년, 슬롯머신 사건을 맡았다. 6공화국의 황태자라 불리던 실세 의원과 고검장과 경찰청장이 줄줄이 구속되었다. 그 사건이 드라마 모래시계가 되었고, 사람들은 그를 모래시계 검사라고 불렀다. 그러나 검찰 안에서 그는 이단아였다. 버티지 못하고 옷을 벗었다.\n\n1996년, 김영삼의 부름을 받아 정치에 들어왔다. 서울에서 내리 네 번 국회의원이 되었고, 당 대표가 되었다가 다섯 달 만에 물러났다. 경남도지사가 되어 도의 빚을 갚았고, 대구시장이 되었다. 대선에서 떨어졌고, 공천에서 잘렸고, 무소속으로 다시 일어섰다. 어느 계파에도 속하지 않았다.\n\n수없이 넘어졌다. 그때마다 다시 일어났다. 사람들은 그를 독하다고 했고, 거칠다고 했고, 말이 험하다고 했다. 다 맞는 말이었다. 그래도 나랏일을 대충 한 적은 없었다.\n\n그는 눈을 뜨고 새 종이를 한 장 꺼냈다. 맨 위에 이렇게 적었다.\n\n'다음에 이 길을 걸을 사람에게.'\n\n그 사람이 누구일지 그는 몰랐다. 같은 당일지 아닐지도 몰랐다. 남자일지 여자일지, 서울 사람일지 지방 사람일지도 몰랐다. 다만 언젠가 그 사람도 오늘 밤의 그처럼 된다. 자정이 넘은 이 방에 홀로 앉아 창유리에 비친 제 얼굴을 보게 된다.\n\n한참을 쓰고, 지우고, 다시 썼다. 종이가 세 장 구겨져 휴지통으로 들어갔다. 마지막에 남은 것은 몇 줄뿐이었다.\n\n§Y국민을 두려워하십시오.§! 박수 칠 때보다 조용할 때를 살피십시오. 국민이 조용해지면 이미 늦은 겁니다.\n\n§Y약속은 적게 하고, 한 약속은 반드시 지키십시오.§! 나라와 나라 사이에서도, 대통령과 국민 사이에서도 마찬가지입니다. 대한민국이 대만과의 약속을 지켰기에 오늘 친구들이 곁에 있습니다.\n\n§Y적룡은 돌아옵니다.§! 우리가 이긴 것은 시간을 번 것일 뿐입니다. 저들이 개혁을 하든 복수를 하든, 그 눈은 언제나 아시아를 향해 있을 것입니다. 이 방에 앉은 첫날부터 그날을 준비하십시오.\n\n§Y그리고 청년을 믿으십시오.§! 낙동강에서 총을 든 것은 젊은 사람들이었습니다. 공장에서 밤을 새운 것도, 광장에서 독재를 끝낸 것도 그랬습니다. 이 나라를 여기까지 끌고 온 것은 늘 그들이었습니다.\n\n마지막 줄 아래에 그는 짧게 덧붙였다.\n\n이 자리는 외롭습니다. 그래도 이 책상에 먼저 앉았던 사람이 여럿 있습니다. 저도 그 가운데 하나입니다.\n\n그는 편지를 접어 봉투에 넣었다. 봉투에는 아무 이름도 쓰지 않았다. 책상 맨 아래 서랍을 열고, 그 안쪽 깊숙이 넣었다. 다음 사람이 이 책상에 앉는 첫날 밤에 찾게 될 자리였다.\n\n인터폰을 눌렀다. 퇴근하지 않고 버티던 비서실장이 들어왔다.\n\n\"아직 안 갔어?\"\n\n\"대통령님이 안 주무시는데 어떻게 갑니까.\"\n\n사내가 피식 웃었다.\n\n\"다음 주부터 일정 좀 바꿔. 젊은 사무관들, 젊은 장교들, 지방에서 기업 하는 젊은 사장들, 대학에서 공부하는 애들. 한 달에 한 번씩 밥 먹는 자리 만들어. 보고 받는 자리 말고, 내가 듣는 자리로.\"\n\n\"무슨 일 있으십니까?\"\n\n\"일은 무슨. 이 길이 나로 끝나면 안 되잖아. 걸을 사람을 키워 놔야지. 내가 30년 걸려서 배운 거, 그 사람들은 3년 만에 배우게 해 줘야 돼.\"\n\n비서실장이 고개를 숙이고 나갔다. 문이 닫히고, 방은 다시 조용해졌다.\n\n사내는 다시 창유리를 보았다.\n\n3년 전보다 머리는 더 희었고 주름은 더 깊었다. 그는 그 얼굴이 싫지 않았다.\n\n그는 스탠드 불을 껐다. 어둠 속에서 책상 위의 네 글자만 희미하게 남아 있었다."
 tfrkphn.88.story_a:0 "서랍에는 이름 없는 봉투가 있다."
 tfrkphn.74.story:0 "2026년 가을. 대통령 선거를 다섯 달 앞둔 여의도.\n\n대통령은 출마할 수 없었다. 5년 단임. 헌법이 정한 일이었다. 사람들의 눈은 이제 다음 사람에게로 향했다. 여당 안에서 두 사람의 이름이 오르내렸다.\n\n§Y이인제.§!\n\n충남 논산 출신. 판사를 거쳐 정치에 들어왔고, 김영삼 정부에서 노동부 장관을 지냈다. 경기도지사를 지냈고, 대통령 선거에 나섰고, 여섯 번 국회의원이 되었다. 홍준표보다 먼저 김영삼의 사람이 된 사람이었다.\n\n둘은 같은 시대를 걸었다. 같은 사람에게 발탁되었고, 같은 당에서 부딪치고 화해하기를 되풀이했다. 이제 둘 다 백발이었다.\n\n이인제는 기자들 앞에서 짧게 말했다.\n\n\"홍 대통령이 걸어온 길, 제가 이어서 걷겠습니다. 전쟁을 이긴 정부입니다. 그 정부가 시작한 일을 끝내는 것이 제 일입니다. 새 길을 찾는 건 그다음입니다.\"\n\n그의 곁에는 국방과 외교를 함께 꾸려 온 사람들이 섰다. 3축 5군, PDTO, 대만과의 약속, 진충보국의 네 글자. 그는 그 모든 것을 그대로 잇겠다고 했다. 사람들은 그를 연속성의 후보라고 불렀다.\n\n§Y오세훈.§!\n\n서울 출신. 변호사로 이름을 알렸고, 마흔다섯에 서울시장이 되었다. 시장직을 걸었다가 내려놓았고, 10년 만에 다시 돌아와 서울시청에 앉았다. 서울시장을 네 번 지낸 사람이었다.\n\n그는 대통령과 자주 부딪쳤다. 서울공화국이라는 말에 맞섰고, 방송에서 날 선 말을 주고받았다. 그러면서도 토지임대부 주택은 서울이 먼저 했다며 웃었다.\n\n오세훈은 시청 브리핑룸에서 말했다.\n\n\"홍 대통령은 전쟁을 이겼습니다. 그건 누구도 부정할 수 없습니다. 그러나 전쟁을 이긴 정부와 전쟁 뒤를 사는 정부는 달라야 합니다. 국민은 지쳤습니다. 이제는 총이 아니라 삶을 이야기할 때입니다. 저는 전임자와는 다른 길을 찾겠습니다.\"\n\n그의 곁에는 젊은 의원들과 수도권의 단체장들이 섰다. 재건, 민생, 실용. 사람들은 그를 변화의 후보라고 불렀다.\n\n청와대 집무실. 대통령은 두 사람의 출마 회견을 차례로 보았다. 비서실장이 물었다.\n\n\"어느 쪽을 미십니까?\"\n\n대통령은 텔레비전을 껐다.\n\n\"그건 내가 정할 일이 아니야. 당원하고 국민이 정하는 거지. 대통령이 후계자를 고르는 나라는 선진국이 아니야.\""
 tfrkphn.74.story_a:0 "다음 길은 당원과 국민이 정한다."
 tfrkphn.89.t:0 "국민의힘 전당대회"
 tfrkphn.89.story:0 "경기도 고양시, 킨텍스 전시장.\n\n국민의힘 제21대 대통령 후보 선출 전당대회. 1만 석의 객석이 당원들로 가득 찼다. 한쪽 객석은 파란 풍선 대신 이인제의 이름이 적힌 피켓으로 물결쳤다. 반대쪽 객석에서는 오세훈의 이름이 물결쳤다.\n\n한 달 전, 오세훈은 서울시장직에서 물러났다. 현직 시장은 대통령 선거에 나설 수 없었다. 사퇴 기자회견에서 그는 말했다. 서울에서 배운 것을 나라로 가져가겠다고. 시청 직원들이 청사 앞에 줄지어 서서 그를 배웅했다.\n\n연설은 이인제가 먼저 했다.\n\n\"우리는 전쟁에서 이겼습니다. 적룡은 물러갔지만 돌아올 것입니다. 지금 키를 바꾸면 배가 흔들립니다. 홍준표 정부 5년의 길, 제가 끝까지 지키겠습니다.\"\n\n객석의 절반이 일어나 박수를 쳤다.\n\n이어서 오세훈이 연단에 올랐다.\n\n\"우리는 전쟁에서 이겼습니다. 그런데 국민들은 왜 웃지 않습니까? 장바구니는 무겁고, 아들은 아직 군에서 돌아오지 않았고, 집값은 여전히 높습니다. 승리를 지키는 것은 중요합니다. 그러나 승리 뒤의 삶을 바꾸는 것이 더 중요합니다.\"\n\n객석의 나머지 절반이 일어나 박수를 쳤다.\n\n당원 투표와 국민 여론조사가 합산되었다. 개표 화면의 숫자가 엎치락뒤치락했다. 결국 승부를 가른 것은 국민 여론조사였다.\n\n대회장의 조명이 꺼졌다. 사회자가 봉투를 열었다.\n\n\"국민의힘 제21대 대통령 후보는...\""
 tfrkphn.89.story_a:0 "봉투가 열린다."
 tfrkphn.90.t:0 "대통령 후보 이인제"
 tfrkphn.90.story:0 "\"...기호 1번, 이인제 후보입니다!\"\n\n객석의 절반이 폭발하듯 일어섰다. 이인제는 연단으로 걸어 나와 오세훈의 손을 잡아 들어 올렸다. 오세훈은 웃으며 패배를 인정했다.\n\n국민들은 홍준표 정부의 5년에 점수를 주었다. 정부 지지율은 절반을 넘었다. 키를 바꾸지 말라는 뜻이었다.\n\n수락 연설에서 이인제는 말했다.\n\n\"오늘 저를 뽑아 주신 건 지난 5년을 보고 하신 일입니다. 그 5년을 이어 가겠습니다. 진충보국. 그 네 글자는 이제 제 것이기도 합니다.\"\n\n청와대에서 그 장면을 보던 대통령은 아무 말도 하지 않았다. 다만 책상 맨 아래 서랍을 한 번 열어 보고, 다시 닫았다.\n\n이변이 없는 한, 그가 다음 대통령이 된다."
 tfrkphn.90.story_a:0 "걸어온 길을 이어 걷는다."
 tfrkphn.91.t:0 "대통령 후보 오세훈"
 tfrkphn.91.story:0 "\"...기호 2번, 오세훈 후보입니다!\"\n\n객석의 절반이 폭발하듯 일어섰다. 오세훈은 연단으로 걸어 나와 이인제의 손을 잡아 들어 올렸다. 이인제는 담담하게 고개를 끄덕였다.\n\n국민들은 전쟁에 지쳐 있었다. 정부 지지율은 절반에 미치지 못했다. 승리는 고마웠지만, 이제는 다른 길을 걷고 싶다는 뜻이었다.\n\n수락 연설에서 오세훈은 말했다.\n\n\"전쟁을 이긴 홍준표 대통령께 감사드립니다. 그 승리는 지키겠습니다. 그러나 국정은 바꾸겠습니다. 이제 대한민국은 전쟁 뒤의 길을 걸어야 합니다.\"\n\n청와대에서 그 장면을 보던 대통령은 피식 웃었다.\n\n\"말싸움은 질리게 했는데. 그래도 잘하겠지. 서울이 먼저 했다는 사람이니까.\"\n\n그리고 책상 맨 아래 서랍을 한 번 열어 보고, 다시 닫았다. 이름 없는 봉투는 누가 앉든 그 자리에 있을 것이었다.\n\n이변이 없는 한, 그가 다음 대통령이 된다."
 tfrkphn.91.story_a:0 "새로운 길을 찾아 걷는다."
 tfrkphn.220.seoul:0 "서울 강남구, 새벽 4시 50분.\n\n테헤란로 뒷골목의 한 오피스텔 앞에 승합차 여섯 대가 소리 없이 멈췄다. 방탄조끼를 입은 형사들이 계단을 뛰어올랐다. 문이 부서지는 소리와 함께 불이 켜졌다.\n\n방 안에는 저울과 비닐 봉투, 그리고 휴대폰 서른 대가 쌓여 있었다. 강남 유흥가에 마약을 대던 조직의 물류 창고였다. 같은 시각 압구정과 청담과 이태원의 일곱 곳에서 동시에 문이 열렸다.\n\n두목은 한강이 내려다보이는 펜트하우스에서 잡혔다. 그는 수갑을 차면서도 웃었다.\n\n\"변호사 불러. 내일이면 나간다.\"\n\n수사팀장이 영장을 한 장 더 꺼내 보였다. 범죄수익 몰수 영장이었다. 펜트하우스도, 외제차도, 차명 계좌도 전부였다.\n\n\"이번엔 안 나가. 나가도 돌아갈 데가 없을 거고.\"\n\n해가 뜰 무렵, 상황판의 서울 위에 붉은 도장이 찍혔다. 소탕 완료."
 tfrkphn.220.busan:0 "부산 사하구, 감천항.\n\n새벽 안개 속에서 세관 직원이 컨테이너 하나의 봉인을 끊었다. 서류에는 냉동 수산물이라고 적혀 있었다. 냉동 상자를 뜯자 얼음 사이로 은박 포장된 덩어리들이 나왔다. 필로폰이었다.\n\n그 컨테이너를 받기로 한 사람들은 부두 밖 횟집 2층에서 기다리고 있었다. 수십 년 동안 항구의 밤을 쥐고 있던 조직이었다. 부두 하역, 유흥가, 불법 오락실, 그리고 바다 건너 들어오는 물건까지.\n\n해경과 경찰이 동시에 들이닥쳤다. 행동대장은 횟집 수족관 뒤의 비밀 문으로 달아났다. 부두 끝에서 바다에 뛰어들었다가 해경 고무보트에 건져 올려졌다.\n\n압수한 장부에는 지난 10년의 거래가 날짜별로 적혀 있었다. 그 장부 한 권으로 영도와 서면과 해운대의 조직원 마흔두 명이 줄줄이 엮였다.\n\n상황판의 부산 위에 붉은 도장이 찍혔다. 소탕 완료."
 tfrkphn.220.daegu:0 "대구 중구, 동성로.\n\n불 꺼진 상가 건물 지하. 간판 없는 철문 너머에서 화투짝 넘기는 소리와 담배 연기가 새어 나왔다. 하룻밤 판돈이 억 단위로 오가는 불법 도박장이었다. 같은 조직이 인터넷 도박 사이트 서버를 해외에 두고 운영하고 있었다.\n\n잠복 3주째, 형사들은 판이 가장 커지는 금요일 밤을 골랐다. 철문을 절단기로 끊고 들어가자 테이블 위의 현금이 바닥으로 쏟아졌다. 도박꾼들이 비상구로 몰렸지만 그 문 밖에도 형사들이 서 있었다.\n\n조직의 돈줄을 쫓던 수사팀은 사이버수사대와 함께 해외 서버의 계좌까지 따라갔다. 세탁된 돈은 수성구의 상가 건물 세 채가 되어 있었다. 그 건물들도 전부 몰수되었다.\n\n동성로 상인회장이 지구대에 떡 한 상자를 보내왔다. 상자 위에 쪽지가 붙어 있었다. 이제 밤에 가게 문 열어도 되겠습니다.\n\n상황판의 대구 위에 붉은 도장이 찍혔다. 소탕 완료."
 tfrkphn.220.gwangju:0 "광주 서구, 한 원룸 건물.\n\n보이스피싱 피해자 한 명이 경찰서를 찾아온 것이 시작이었다. 일흔셋 할머니였다. 아들이 사고를 쳤다는 전화를 받고 평생 모은 돈 3천만 원을 건넸다고 했다. 할머니는 진술서를 쓰다가 몇 번이나 펜을 놓았다.\n\n돈을 받아 간 수거책을 쫓자 원룸 하나가 나왔다. 그 원룸에서 대포통장 수백 개와 대포폰이 쏟아졌다. 그 뒤에 지역 폭력조직이 있었다. 조직은 해외 콜센터와 손잡고 국내 수거와 자금 세탁을 맡고 있었다.\n\n경찰은 국제 공조로 동남아의 콜센터를 덮쳤고, 총책을 국내로 송환했다. 공항 입국장에서 고개를 숙인 총책의 얼굴 위로 카메라 플래시가 터졌다. 광주의 조직원들은 그보다 하루 먼저 체포되었다.\n\n몰수한 범죄수익에서 할머니의 3천만 원이 돌아갔다. 할머니는 경찰서 민원실에서 한참을 울었다.\n\n상황판의 광주 위에 붉은 도장이 찍혔다. 소탕 완료."
 tfrkphn.220.daejeon:0 "대전 유성구, 한 부동산 사무실.\n\n전세 계약서 수백 장이 압수 상자에 담겨 나왔다. 집주인은 모두 같은 사람들이었다. 이름만 빌려준 바지 집주인들이었다. 그 뒤에는 무등록 대부업과 전세사기를 함께 굴리던 조직이 있었다.\n\n피해자는 대부분 사회 초년생과 신혼부부였다. 대학을 갓 졸업하고 연구단지에 취직한 청년, 첫아이를 기다리던 부부. 그들이 전 재산을 넣은 보증금은 조직의 계좌를 거쳐 사라졌다. 돈을 갚지 못한 사람들에게는 밤마다 협박 문자가 왔다.\n\n수사팀은 계좌 추적에만 넉 달을 썼다. 그리고 하루 만에 쉰여섯 명을 한꺼번에 잡아들였다. 공인중개사와 바지 집주인, 추심 행동대원까지였다.\n\n피해자 대책위원회 대표는 스물아홉 살 연구원이었다. 그는 기자들 앞에서 짧게 말했다.\n\n\"돈이 다 돌아오진 않겠죠. 그래도 이제 다음 사람은 안 당하잖아요.\"\n\n상황판의 대전 위에 붉은 도장이 찍혔다. 소탕 완료."
 tfrkphn.220.ulsan:0 "울산 남구, 석유화학단지 옆 건설 현장.\n\n현장 소장은 매달 봉투를 건넸다. 레미콘 차량이 들어오려면 통행료를 내야 했다. 자재를 내리려면 하역비를, 공사를 계속하려면 보호비를 내야 했다. 안 내면 다음 날 현장 입구에 덤프트럭이 가로로 서 있었다. 이 일대 건설 현장을 쥐고 흔드는 조직이었다.\n\n소장이 녹음기를 들고 경찰서를 찾아왔다. 처음이었다. 다른 현장 소장들도 하나둘 따라왔다. 정부가 끝까지 간다는 것을 다른 도시들에서 보았기 때문이었다.\n\n경찰은 녹음 파일과 장부를 들고 조직 사무실을 덮쳤다. 사무실 금고에는 현금과 함께 현장 소장들의 이름과 매달 받은 액수가 적힌 공책이 있었다. 두목은 체포되면서 소리쳤다.\n\n\"우리 없으면 현장이 돌아갈 것 같아?\"\n\n다음 날 아침, 그 현장에는 덤프트럭 대신 레미콘 차량이 줄지어 들어왔다. 공사는 멈추지 않았다.\n\n상황판의 울산 위에 붉은 도장이 찍혔다. 소탕 완료."
 tfrkphn.220.story_a:0 "다음은 어디냐."
 tfrkphn.221.story:0 "정부서울청사 브리핑룸.\n\n대통령이 직접 연단에 섰다. 뒤쪽 화면에 여섯 도시의 범죄율 그래프가 떠 있었다. 서울, 부산, 대구, 광주, 대전, 울산. 여섯 개의 선이 모두 바닥에 닿아 있었다.\n\n\"범죄와의 전쟁을 선포했습니다. 오늘 여섯 도시의 조직폭력배를 모두 소탕했다는 보고를 받았습니다. 체포된 조직원은 2천 명이 넘습니다. 몰수한 범죄수익은 피해자들에게 돌려드리겠습니다.\"\n\n같은 시각, 서울중앙지법 앞.\n\n호송 버스에서 수갑을 찬 사내들이 줄지어 내렸다. 몇몇은 고개를 숙였고, 몇몇은 카메라를 노려보았다. 그 모습을 지켜보던 노인 하나가 혼잣말을 했다.\n\n\"60년도 더 됐네.\"\n\n1961년 5월, 서울 거리에 깡패들의 행진이 있었다. 동대문 일대를 주름잡던 이정재와 그 수하들이 줄지어 끌려 나왔다. 그들의 목에는 팻말이 걸려 있었다.\n\n'나는 깡패입니다. 국민의 심판을 받겠습니다.'\n\n그 행진은 새로 들어선 군사정권이 보여 주기 위해 연 것이었다. 깡패를 잡겠다던 정권이 법보다 먼저 팻말을 걸었다. 그리고 그 뒤로도 깡패는 사라지지 않았다. 정치와 손잡거나 이름만 바꾼 깡패들이 그 자리를 이어받았다.\n\n이번에는 팻말도 행진도 없었다. 영장과 장부와 증거가 있었다. 깡패들은 호송 버스에서 내려 곧장 법정으로 들어갔다.\n\n브리핑이 끝나고 한 기자가 물었다.\n\n\"대통령님, 모래시계 검사 시절이 생각나십니까?\"\n\n대통령은 잠시 말을 멈췄다.\n\n\"그때도 지금도 같습니다. 끝까지 가는 겁니다. 팻말을 거는 건 쉽습니다. 다시는 그런 자들이 거리에 못 나오게 하는 게 어려운 겁니다.\"\n\n그날 저녁, 여섯 도시의 상황판이 모두 붉은 도장으로 덮였다. 범죄와의 전쟁은 끝났다."
 tfrkphn.221.story_a:0 "이번에는 팻말 대신 판결문이다."
