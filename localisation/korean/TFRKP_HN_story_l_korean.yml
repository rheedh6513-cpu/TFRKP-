 tfrkphn.320.t:0 "가끔 아빠도 회사에 가기 싫겠지"
 tfrkphn.320.desc:0 "이정훈은 올해로 마흔일곱 살의 회사원이었다.\n어려서부터 수학을 잘했고, 장점을 살려 공대에 진학해 기술을 배워 좋은 직장에 취직했다.\n\n그는 이름만 들으면 누구나 아는 대기업의 최연소 부장이었고, 사랑하는 아내와 딸, 가족관계도 원만한, 동창들 모두가 부러워하는 그런 사람이었다.\n\n그러나 이 행복한 일상이 깨진 건 그날부터였다.\n\n이 부장? 잠시만 따라와 봐.\n요즘 업무 성과도 떨어지고... 의욕도 잘 안 생기는 거 같고... 아무래도 우리 회사랑 잘 안 맞는 거 같아.\n새로운 일을 알아보는 건 어때?\n\n네? 그게 무슨...\n\n정훈은 자존심을 다 내려놓고 본인의 성과부터 가족과 딸까지, 자신이 할 수 있는 최대한의 언변으로 해고를 거부하려 했다.\n\n그럴 때마다 회사는 능글맞게 명예퇴직을 권유하는 것이지 해고가 아니라고 몇 번이나 되풀이했다. 하지만 회사의 악랄함은 그의 상상 이상이었다.\n\n'직무 교육'이라는 명목으로 정훈을 지방의 교육원으로 보내 '이력서 쓰는 법', '잡초 뽑기', 심지어는 '명상 교육'까지 시켰고, 정훈은 그 모든 일을 가족을 생각하며 버텨냈다.\n\n지옥 같은 한 달이 지나고 회사에 복귀하자, 정훈의 자리는 책상만 남겨둔 채 전부 치워져 있었다.\n\n아, 이 부장. 일은 없으니까 자리에 앉아 있게.\n\n한 시간, 두 시간. 열심히 일하는 동료들 사이에서 아무것도 하지 않고 허공을 응시하고 있기란 '명상 교육'과는 차원이 다른 것이었다.\n그리고 잠시 탕비실에서 믹스커피 하나를 집어 든 순간, 선임과 눈이 딱 마주쳤다.\n\n어, 이 부장. 내가 자리에 가만히 앉아 있으라고 했을 텐데? 이건 내가 따로 책임을 묻겠네.\n\n결국 정훈은 며칠 지나지 않아 회사에 사표를 제출할 수밖에 없었다.\n\n늘 '자유시간'을 꿈꿔 온 그였으나, 이런 식의 자유시간은 전혀 바라지 않던 바였다.\n\n정신을 차려 보니 정훈은 공원 벤치에 앉아 있었다.\n\n하... 가족들한테는 뭐라고 해야 하나.\n당장 다음 달 학원비부터...\n\n아빠?\n\n이서진...? 네가 왜 여기...\n\n아니, 아빠야말로 회사에 있을 시간 아니야?"
 tfrkphn.320.a:0 "서진아 미안해 아빠가 미안해 아빠가 미안해..."
 tfrkphn.320.tt:0 "§g오늘 공원은\n중년의 남성들로 만원이었다.§!"
 TFRKPHN_amend_d_coop:0 "야당과 타협"
 TFRKPHN_amend_d_coop_desc:0 "개헌안은 통과됐지만 조문 하나하나를 채우는 일은 이제부터입니다. 야당과 타협하지 않고 밀어붙이면 조문 하나마다 정치력 180이 들고, 타협하면 다음 조문은 공짜로 통과되지만 그만큼 개헌의 칼날도 무뎌질 것입니다."
 TFRKPHN_amend_cost_180:0 "£pol_power §Y180§! (§G타협했다면 0§!)"
 TFRKPHN_amend_cost_180_blocked:0 "£pol_power §R180§! (§G타협했다면 0§!)"
 TFRKPHN_amend_coop_token_tt:0 "다음 개헌 결정 하나는 §G정치력 없이§! 진행할 수 있습니다."
 TFRKPHN_amend_token_held_tt:0 "이미 타협한 결과를 아직 쓰지 않았습니다. 개헌 결정을 먼저 진행하세요."
 tfrkphn.321.t:0 "돌아온 친정"
 tfrkphn.321.desc:0 "'막말 홍준표 복당 결사반대'\n\n꼬박 1년 3개월의 방황을 끝마치고 어렵사리 돌아온 나에게 되돌아온 반응이었다. 나는 브리핑을 마친 수석 비서에게 짧은 눈인사로 자리를 비워 달라 이른 뒤, 홀로 남은 집무실 소파에 깊숙이 몸을 묻으며 피로하게 미간을 짓눌렀다.\n\n2016년 박근혜 전 대통령의 탄핵 이후 지금까지, 당 안팎으로 쉴 틈 없이 휘몰아치던 격랑 속에서 난파선의 키를 잡았던 게 대체 누구였던가. 나 개인의 영달보다도 당을 살리는 길로 몸을 던져 왔다는 자부심 하나가 나를 버티게 한 기둥이었다. 그러나 한때 뜻을 함께하던 동지들이 이제 누구보다 앞장서 나의 복귀를 가로막았다는 사실이 가슴 한켠을 미어지게 만들었다. 정치 신인 시절의 대쪽 같던 '모래시계 검사'는, 어느새 존재 자체만으로 당을 나락으로 빠뜨리는 '막말준표'로 바뀌어 있었다.\n\n어느덧 정치 인생의 황혼기에 접어든 나이. 머지않아 치러질 대선은 이변이 없는 한 내가 도전할 수 있는 마지막 무대가 될 터였다. 당원과 시민들이 다시 내 손을 잡아 줄지는 미지수다. 하지만 최근 유튜브와 인스타그램 등지에서 재조명되는 2017년 대선 당시의 발언들, 그리고 이에 호응하며 새롭게 모여드는 2030 세대의 지지층을 온전히 끌어안는다면, 이번에야말로 승산이 없는 싸움은 아닐 것이라 믿었다."
 tfrkphn.321.a:0 "그렇게 상념에 잠긴 순간에도, 모래시계의 모래는 소리 없이 떨어지고 있었다."
 tfrkphn.312.news:0 "§Y[뉴스] 정부, 경찰조직 개편안 발표... '무너진 공권력 바로 세운다'§!\n\n오늘 홍준표 정부가 경찰조직 전면 개편안을 발표했습니다. 개편안은 여러 갈래로 흩어져 있던 경찰의 지휘체계를 하나로 묶고, 약해진 공권력과 치안 기능을 다시 세우는 것을 핵심 목표로 내세웠습니다.\n\n야당은 즉각 반발했습니다. 야당 지도부는 이번 개편안을 \"경찰 독재, 사법 독재의 서막\"이라고 규정했습니다. 과거 공권력의 오판으로 무고한 시민이 억울하게 목숨을 잃었던 사건들을 거론하며, 권한이 한곳에 몰린 경찰이 또 다른 피해자를 만들 수 있다고 경고했습니다.\n\n이에 대해 정부는 \"법 앞에 예외는 없다\"는 짧은 입장만 내놓은 채 물러서지 않겠다는 뜻을 분명히 했습니다. 개편안을 둘러싼 여야의 충돌은 당분간 이어질 전망입니다."
 tfrkphn.315.news:0 "§Y[뉴스] 취임 석 달, 대통령의 '입'이 정부를 흔든다§!\n\n홍준표 대통령은 거침없고 시원한 화법으로 '홍카콜라'라는 별명을 얻었습니다. 그러나 대통령이 된 뒤에도 그 말투가 바뀌지 않으면서, 이제는 정부 전체의 부담으로 떠오르고 있습니다.\n\n어제 생중계된 기자간담회에서 민감한 질문이 이어지자 대통령의 목소리는 눈에 띄게 거칠어졌습니다. 질문한 기자에게 면박을 주는 장면은 편집 없이 그대로 전파를 탔고, 해당 영상은 반나절 만에 조회수 수백만 회를 넘겼습니다. 야당은 \"국민을 대하는 태도가 바로 저것\"이라며 공세에 나섰습니다.\n\n논란은 하루 만에 다시 번졌습니다. 오늘 새벽 대통령 개인 SNS에 야당 대표를 겨냥한 날 선 표현이 담긴 글 한 줄이 올라온 것입니다. 참모진이 급히 글을 내렸지만, 캡처 화면은 이미 온라인 곳곳으로 퍼진 뒤였습니다.\n\n여당 안에서도 우려가 터져 나왔습니다. 국민의힘 한 중진 의원은 \"지금 이 정부의 가장 큰 리스크는 대통령의 입\"이라고 말했습니다.\n\n반응은 극명하게 갈립니다. 지지층은 \"속이 다 시원하다\"고 환호하는 반면, 중도층은 대통령의 품격을 묻기 시작했습니다. 취임 당시 높았던 지지율은 기세를 잃고 내리막을 타고 있습니다.\n\n시원함과 품격 사이, 대통령은 이제 어떤 말로 국민 앞에 설지 선택해야 할 때입니다."
 tfrkphn.313.news:0 "§Y'취임 석 달째 대통령, 이래도 되는 건가'... 국민의힘 아닌 '욕설의 힘'?§!\n\n대통령의 기자간담회 생중계 도중 기자의 민감한 질문이 이어지자 대통령의 말투가 거칠어졌습니다. 또한 질문한 기자를 향해 면박을 주는 장면이 방송을 통해 그대로 전파를 탔습니다.\n\n해당 영상은 반나절 만에 조회수 수백만 회를 기록했고, 야당은 \"국민을 대하는 태도가 저렇다\"라며 거센 공세에 나섰습니다."
 tfrkphn.314.news:0 "새벽에 대통령의 개인 SNS에 글 한 줄이 올라왔습니다. 내용은 야당 대표를 향한 날 선 표현들이 담겨 있었습니다. 참모진이 급히 글을 내렸지만, 이미 캡처본이 인터넷으로 일파만파 퍼진 뒤였습니다.\n\n지지층에서는 \"속이 시원하다\"라는 반응이 나온 반면, 중도층에서는 \"대통령으로서의 품격이 의심된다\"라며 문제를 제기하기 시작했습니다."
