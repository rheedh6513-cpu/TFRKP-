 TFRKPHN_cab_st_note:0 "§g임명한 장관들이 §Y이인제 정부의 국정§!에 보탠 수치입니다.\n후보 그림을 누르면 임명할지 다시 묻습니다.\n기한 안에 임명하지 않은 자리는 대통령이 직접 골라야 합니다.§!"
