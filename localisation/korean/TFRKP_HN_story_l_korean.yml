 TFRKPHN_cab_cf_lee_dong_phil:0 "§L\"예산은 아쉽지만 알뜰하게 쓰겠다.\"§!\n§g이동필, 이투데이 인터뷰§!\n\n정말 §Y이동필§!을 농림축산식품부 장관에 임명하시겠습니까?\n임명하면: 안정도 §G+6%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
