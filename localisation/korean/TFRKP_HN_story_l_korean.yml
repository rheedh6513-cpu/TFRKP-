 TFRKPHN_cab_who_jang_ho_jin:0 "§G장호진§!"
 TFRKPHN_cab_eff_jang_ho_jin:0 "§Y장호진§!이 국가안보실장에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 정치력 획득 §G+5%§!, 전쟁 지지도 §G+3%§!"
