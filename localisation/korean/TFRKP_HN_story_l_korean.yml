 TFRKPHN_amend_d_coop:0 "야당과 타협"
 TFRKPHN_amend_d_coop_desc:0 "개헌안은 통과됐지만 조문 하나하나를 채우는 일은 이제부터입니다. 야당과 타협하지 않으면 조문 하나마다 정치력 90이 듭니다. 타협하면 다음 조문은 공짜로 통과됩니다. 대신 개헌의 칼날도 그만큼 무뎌집니다."
 TFRKPHN_amend_cost_180:0 "£pol_power §Y90§! (§G타협했다면 0§!)"
