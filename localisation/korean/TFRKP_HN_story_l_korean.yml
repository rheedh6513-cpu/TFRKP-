 TFRKPHN_mnd_barracks_desc:0 "병사 월급과 생활관 환경을 개선합니다. 군 복무가 손해가 아니라는 인식을 만드는 것이 목표입니다."
 TFRKPHN_mnd_export:0 "K-방산 수출 협상"
 TFRKPHN_mnd_export_desc:0 "늘어난 방산 생산 능력을 해외 시장에 엽니다. 수출 물량이 늘면서 공장의 숙련도도 함께 오릅니다."
