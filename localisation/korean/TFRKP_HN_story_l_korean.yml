 TFRKPHN_india_trade:0 "한-인도 실용 협력"
 tfrkphn.203.story:0 "대전 유성, 국방과학연구소.\n\n정문을 지나 본관 1층에 들어서면 낡은 전시실이 하나 있다. 대통령은 연구원들의 안내를 받으며 그 안을 천천히 걸었다.\n\n벽에 걸린 첫 사진은 흑백이었다. 맨발의 아이들이 미군 트럭 뒤를 따라 달리고 있었다. 지난 80년, 이 나라는 그렇게 시작했다. 총도, 공장도, 쌀도 남의 손을 빌려야 하는 찢어지게 가난한 나라였다.\n\n다음 사진은 울산의 텅 빈 모래사장이었다.\n\n\"조선소도 없이 배부터 팔러 다닌 사람이 있었지요.\"\n\n대통령이 혼잣말처럼 말했다. 정주영은 거북선이 그려진 오백 원짜리 지폐 한 장을 들고 영국 은행을 찾아갔다. 우리는 400년 전에 이미 철갑선을 만든 민족이라고. 돈을 빌렸고, 모래사장 위에 조선소를 짓는 동시에 그 조선소에서 배를 만들었다.\n\n그 옆에는 포항 영일만의 사진이 있었다. 박태준은 일본에서 받은 청구권 자금으로 제철소를 지으며 직원들에게 말했다. 조상의 피 값으로 짓는 것이니, 실패하면 모두 우향우해서 영일만 바다에 빠져 죽자고. 1973년 6월, 첫 쇳물이 흘러나왔다.\n\n그리고 1997년. 나라가 부도났다. 사람들은 장롱 깊숙이 넣어 둔 돌반지와 결혼반지를 들고 은행 앞에 줄을 섰다. 아무도 시키지 않았다. 그해 겨울, 이 나라는 흔들렸지만 무너지지 않았다.\n\n전시실의 마지막 칸에는 1978년의 사진이 있었다. 충남 안흥의 바닷가였다. 얼마 전 대통령이 현무 발사를 지켜본 바로 그 시험장이었다. 백곰 미사일이 하늘로 솟아오르고 있었다. 1970년에 문을 연 이 연구소가 8년 만에 만들어 낸, 이 나라 최초의 탄도미사일이었다.\n\n대통령은 그 사진 앞에서 오래 서 있었다. 그리고 연구원들을 돌아보았다.\n\n\"가난한 나라가 배를 만들고, 쇠를 녹이고, 미사일을 쏘아 올렸습니다. 누가 기술을 줘서 한 게 아닙니다. 해 보자고 덤빈 사람들이 있었기 때문입니다.\n\n이제는 여러분 차례입니다. 무기를 사 오는 나라에서 만들어 파는 나라로. 사람이 들어가지 않아도 싸우는 무인 체계, 적보다 먼저 보고 먼저 판단하는 인공지능. 지금 이 방에 있는 여러분이 다음 사진을 만들게 될 겁니다.\"\n\n한 젊은 연구원이 손을 들었다.\n\n\"예산은... 정말 그대로 나옵니까?\"\n\n대통령은 웃었다.\n\n\"정주영 회장은 지폐 한 장으로 조선소를 지었습니다. 여러분은 그보다는 많이 드리겠습니다.\"\n\n그날 이후 전시실 마지막 칸 옆에는 빈 액자 하나가 걸렸다. 아래에는 짧은 글귀가 붙어 있었다.\n\n'다음 사진은 여기에.'"
 tfrkphn.203.story_a:0 "다음 사진은 우리가 만든다."
 tfrkphn.204.story:0 "1999년 12월, 헌법재판소.\n\n\"제대군인 가산점 제도는 헌법상 근거가 없다.\"\n\n그날 이후 공무원 시험에서 제대군인에게 주던 가산점이 사라졌다. 2년 넘게 군복을 입은 사람에게 만점의 5% 안쪽을 더 얹어 주던 제도였다. 누군가는 차별이 끝났다고 했고, 누군가는 국가가 약속을 저버렸다고 했다.\n\n그리고 오랜 세월이 흘렀다.\n\n서울 노량진의 한 독서실. 전역한 지 넉 달 된 이준호는 9급 공무원 기출문제집을 덮고 휴대폰을 켰다. 대통령의 담화가 생중계되고 있었다.\n\n\"현대전은 사병의 수가 아니라 사병의 질이 국방력을 좌우합니다. 좋은 사람이 군에 오게 하려면, 군에 다녀온 사람이 손해 보지 않게 해야 합니다.\n\n군 가산점제를 부활시키겠습니다.\n\n다만 1999년의 그 제도를 그대로 되살리지는 않겠습니다. 성별을 떠나 군 복무를 마친 사람이라면 누구나 혜택을 받습니다. 가산점의 규모도 합리적으로 조정하겠습니다. 다른 수험생의 기회를 빼앗지 않는 선에서 도입하겠습니다. 헌법재판소가 지적한 근거는 법률로 분명히 마련하겠습니다.\"\n\n독서실 옆자리에서 휴가 나온 일병 하나가 고개를 들었다. 군복 가슴의 명찰에는 '김지원'이라고 적혀 있었다. 그녀도 화면을 보고 있었다.\n\n\"성별 상관없다는데요.\"\n\n\"그러네요.\"\n\n\"저 지금 일반병으로 복무 중이거든요. 그럼 저도 받는 거네요.\"\n\n이준호는 잠깐 말을 잃었다가 웃었다.\n\n반응은 갈렸다. 여성단체들은 군 복무를 마칠 기회 자체가 고르지 않다며 반대 성명을 냈다. 장애인 단체도 군에 갈 수 없는 사람에게는 또 다른 벽이라고 했다. 제대군인 단체들은 늦었지만 환영한다고 했다.\n\n국회 국방위원회의 한 의원은 이렇게 말했다.\n\n\"그동안 우리는 군대 간 사람과 안 간 사람을 서로 싸우게 만들었습니다. 이번에는 다를 수 있을지, 법안을 만드는 우리 손에 달렸습니다.\"\n\n그날 밤, 노량진 독서실의 불은 평소보다 조금 늦게 꺼졌다."
 tfrkphn.204.story_a:0 "다녀온 사람이 손해 보지 않게."
 tfrkphn.322.t:0 "검사의 길"
 tfrkphn.322.desc:0 "경상남도 창녕의 작은 시골. 소년은 남의 땅을 부쳐 먹던 집에서 자랐다. 아버지는 하루 몇백 원을 받는 경비원이었다. 어머니는 장터에 좌판을 펴고 가발을 팔았다.\n\n그 장터에서 소년은 평생 잊지 못할 장면을 보았다. 고리 사채 몇 푼 때문에, 사채업자가 어머니의 머리채를 잡고 길바닥으로 끌고 갔다. 사람들은 고개를 돌렸다. 아무도 나서지 않았다. 소년은 주먹만 쥔 채 서 있었다.\n\n가난을 벗어날 길은 공부뿐이었다. 소년은 이를 악물었고, 마침내 사관학교 합격 통지서를 받았다. 군복을 입으면 아무도 자신을 무시하지 못하리라 믿었다.\n\n그해, 아버지가 누명을 썼다. 하지도 않은 일로 경찰에 불려 다녔다. 그 모습을 지켜보던 어느 날, 동네 어른들이 혀를 찼다.\n\n\"야, 군인보다 센 직업이 뭔지 아나?\"\n\"니 그것도 모르나. 군인도 검사 앞에선 꼼짝 못 한다.\"\n\n그 말이 소년의 길을 바꿨다. 그는 사관학교 대신 다시 책상 앞에 앉았다. 힘없는 사람이 억울하게 끌려가지 않는 세상. 그걸 만들 수 있는 사람이 되겠다고.\n\n몇 년 뒤, 그는 정말 검사가 되었다.\n\n남쪽 도시의 강력부에서 그는 조직폭력배를 하나씩 잡아들였다. 서울로 올라와서는 도박 업계 뒤에 숨은 권력과 마주했다. 수사가 깊어질수록 얼굴들이 드러났다. 이름만 대면 알 만한 실세들. 같은 검찰의 선배들.\n\n\"홍 검사, 당신 지금 실수하는 거요.\"\n\n수화기 너머 목소리는 낮고 차가웠다. 그는 수화기를 내려놓고 다음 서류를 펼쳤다. 그해 그는 실세들에게 수갑을 채웠다. 세상은 그를 '모래시계 검사'라 불렀다.\n\n조직은 길들지 않는 검사를 반기지 않았다. 그는 한직을 돌다가 결국 검사복을 벗었다.\n\n평온은 오지 않았다. 그가 감옥에 보낸 깡패들이 하나둘 출소했다. 이제 그들은 그와 그의 가족 곁을 서성였다. 한밤중의 전화. 집 앞을 맴도는 낯선 그림자.\n\n그때 집권당이 손을 내밀었다. 함께 정치를 해 보자고.\n\n그는 훗날 솔직하게 털어놓았다. 거창한 나라와 민족 때문이 아니었다고. 가족을 지키려고 정치에 들어왔다고.\n\n장터에서 주먹을 쥐고 서 있던 소년은, 그렇게 더 큰 싸움터로 걸어 들어갔다."
 tfrkphn.322.a:0 "칼날은 다시 선다."
 tfrkphn.58.story:0 "신용사면 발표를 하루 앞둔 밤이었다.\n\n책상 위에는 숫자가 빼곡한 보고서가 놓여 있었다. 신용불량자 수십만 명. 문을 닫은 가게 수만 곳. 전쟁이 끝나고도 이 숫자는 줄지 않았다.\n\n대통령은 보고서를 덮고 눈을 감았다.\n\n장터 한구석에 좌판을 펴던 어머니가 떠올랐다. 사채 몇 푼에 머리채를 잡혀 끌려가던 어머니. 그때 어머니에게 필요했던 것은 대단한 게 아니었다. 다시 좌판을 펼 수 있는 하루였다.\n\n사람들은 그를 '서민대통령'이라 불렀다. 그를 설명하는 데 그보다 짧은 말은 없었다.\n\n그러나 그는 알고 있었다. 서민으로 태어났다고 서민을 위해 일하게 되지는 않는다.\n\n눈을 뜬 그는 연설문 첫 장을 펼쳤다. 맨 위에 직접 한 줄을 적었다.\n\n'빚 때문에 머리채를 잡히는 사람이 없는 나라.'\n\n그리고 그 아래에 첫 문장을 썼다.\n\n\"오늘부터 다시 문을 여십시오. 정부가 함께 열겠습니다.\""
 tfrkphn.200.story_t:0 "달빛 아래, 화합으로 나아가는 길"
 tfrkphn.200.story:0 "대구와 광주의 시장이 나란히 선 연단. 대통령은 준비한 원고를 내려다보다가, 그대로 접어 안주머니에 넣었다.\n\n\"서로를 미워해서 우리가 얻은 것이 무엇입니까.\n\n미움에 사로잡히면 상대의 옆모습만 보입니다. 누가 앞섰는지 곁눈질하느라, 그 사람이 어떤 길을 바라보며 걷는지는 끝내 보지 못합니다.\n\n미움이 지역과 지역 사이로 번지면 높은 벽만 남습니다.\n\n그 벽을 한 장씩 걷어 내면, 벽이 있던 자리에 그 땅에서만 피는 꽃들이 보일 겁니다.\n\n저 달빛은 이 고장과 저 고장을 가리지 않습니다. 같은 밤을 똑같이 비춥니다.\n\n하나가 되자고 모두 같아질 필요는 없습니다. 다른 채로 같은 달빛을 받으면 됩니다.\n\n이제 고개를 돌려, 서로의 얼굴을 정면으로 마주합시다.\n\n화해는 거기서부터입니다.\""
 tfrkphn.120.story_t:0 "선진대국의 길"
 tfrkphn.120.story:0 "진정한 선진국은 통계표 위의 숫자만으로 완성되지 않는다. 국내총생산이 아무리 커도 그 부가 소수의 손에만 머무는 나라가 있다. 그 나라는 큰 나라일 수는 있어도 앞선 나라는 아니다.\n\n진정한 선진국은 네 가지가 함께 자란 나라다. 경제의 힘, 사회의 신뢰, 시민의 의식, 도덕의 무게다. 어느 한 기둥만 높아서는 지붕이 서지 않는다.\n\n§Y첫째, 강한 경제가 모두의 삶으로 이어지는 나라§!\n1인당 국민소득이 4만 달러를 바라본다 해도 마찬가지다. 중산층이 무너지고 서민의 하루가 버거운 나라는 선진대국이 아니다. 성장의 열매가 고르게 나뉘어야 한다. 출발선이 공정해야 한다. 국민이 내일을 두려워하지 않을 때 경제는 비로소 국력이 된다.\n\n§Y둘째, 서로를 믿을 수 있는 나라§!\n법과 제도가 제자리를 지키고, 부정과 부패가 설 자리를 잃은 나라. 국제 비교에서 우리 사회의 신뢰 수준은 여전히 선진국 평균에 크게 못 미친다. 국민이 정부를 믿고 기업을 믿어야 한다. 무엇보다 서로를 믿어야 한다. 그때 사회는 비용 대신 힘을 얻는다.\n\n§Y셋째, 시민의 품격이 살아 있는 나라§!\n아무도 보지 않는 신호등 앞에서도 멈춰 서는 사회. 낯선 이를 배려하는 일이 미덕이 아니라 습관인 사회. 가진 사람이 나눔을 부담이 아닌 책임으로 여기는 사회. 이런 작은 의식들이 쌓여 나라의 품격이 된다.\n\n§Y넷째, 윗물이 맑은 나라§!\n나라의 얼굴은 결국 그 나라 사람들이고, 그 얼굴의 맨 앞에는 지도층이 선다. 지도자가 먼저 모범을 보이고 정치가 깨끗해야 한다. 사람을 재는 기준은 학연과 지연과 혈연이 아니다. 실력과 공정함이다. 그때 사회는 비로소 앞으로 나아간다.\n\n§Y맺으며§!\n진정한 선진대국이란 무엇일까. 국민이 잘사는 나라인가, 깨끗한 나라인가, 경제가 강한 나라인가. 셋 가운데 하나만 고를 수는 없다.\n\n그리고 그 모든 것의 출발점은 가장 높은 자리에 앉은 사람의 청렴이다. 지금 이 나라에서 성공으로 가는 길은 여전히 인맥이라는 좁은 문을 지나는 경우가 많다. 그 문은 몇 사람에게는 지름길이 되지만, 나라 전체를 조금씩 갉아먹는다.\n\n공정하고 투명한 길 위에서만 선진대국의 시대가 열린다.\n\n다만 첫걸음은 장부에서 시작해야 했다. 전쟁이 끝난 나라의 곳간은 비어 있었고, 수출 통계는 매달 붉게 물들고 있었다."
 tfrkphn.54.story:0 "국무회의실 긴 탁자 위에 두꺼운 보고서가 놓였다. 표지에는 건조한 글씨로 '정부 조직 진단 결과'.\n\n장관들은 서로 눈치를 보며 첫 장을 넘겼다. 위원회만 수백 개였다. 이름만 있고 회의를 한 번도 열지 않은 곳이 수두룩했다. 같은 일을 하는 부서가 서너 곳씩 겹쳤다. 서류 한 장이 결재를 받으려면 도장 일곱 개를 거쳐야 했다.\n\n\"전쟁은 끝났습니다. 그런데 정부는 아직도 전시 몸집 그대로입니다.\"\n\n대통령이 보고서를 덮었다.\n\n\"도지사 시절에 배운 게 하나 있습니다. 빚은 버릇입니다. 쓰던 대로 쓰고 늘리던 대로 늘리면, 그 청구서는 우리 아이들한테 날아갑니다.\"\n\n누군가 조심스럽게 손을 들었다. 공무원 노조의 반발. 지역구 의원들의 민원. 일자리를 줄인다는 비판. 대통령도 모르지 않았다.\n\n\"사람을 내보내자는 게 아닙니다. 새로 뽑을 자리를 묶고, 겹치는 일은 합치고, 안 쓰는 위원회부터 닫자는 겁니다. 국민 세금으로 돌아가는 조직이라면, 국민이 한눈에 알아볼 만큼 단순해야 합니다.\"\n\n그날 오후 정부는 공무원 정원 동결, 위원회 정비, 중복 부처 통폐합을 발표했다. 어떤 신문은 '칼바람'이라 썼다. 어떤 신문은 '늦었지만 필요한 다이어트'라 썼다.\n\n집무실로 돌아온 대통령은 결재판을 내려다보았다. 도장 칸이 일곱 개에서 세 개로 줄어든 새 양식이었다. 그는 짧게 웃고 첫 서명을 했다."
 tfrkphn.54.story_a:0 "군살부터 뺀다."
 TFRKPHN_sp_jin:0 "다할 진의 정신"
 TFRKPHN_sp_jin_desc:0 "다할 진. 남은 모든 힘을 나라에 쏟아붓겠다는 홍준표의 다짐입니다. 진 줄기의 중점을 하나씩 마칠 때마다 이 정신에 새로운 힘이 더해집니다."
