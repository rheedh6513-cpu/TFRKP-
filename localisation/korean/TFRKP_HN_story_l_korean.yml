 TFRKPHN_cab_name_kim_tae_heum:0 "김태흠"
 TFRKPHN_cab_who_kim_tae_heum:0 "§G김태흠§!"
 TFRKPHN_cab_eff_kim_tae_heum:0 "§Y김태흠§!이 농림축산식품부 장관에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 안정도 §G+5%§!, 소비재 공장 §G-2%§!"
 TFRKPHN_cab_cf_kim_tae_heum:0 "§L\"그에 맞서기 위해서는 투쟁력 있고 결기 있는 원내대표가 필요하다\"§!\n§g김태흠, 원내대표 출마 선언§!\n\n정말 §Y김태흠§!을 농림축산식품부 장관에 임명하시겠습니까?\n임명하면: 안정도 §G+5%§!, 소비재 공장 §G-2%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_kim_tae_heum:0 "\n§Y어록§!\n\"그에 맞서기 위해서는 투쟁력 있고 결기 있는 원내대표가 필요하다\"\n§g원내대표 출마 선언§!"
 TFRKPHN_cab_tt_kim_tae_heum:0 "§Y김태흠§!\n농림축산식품부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 안정도 §G+5%§!, 소비재 공장 §G-2%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_kim_tae_heum:0 "출생: 1962년 대한민국 충청남도 보령\n\n이력: 대한민국의 농림축산식품부 장관\n김태흠은 국회의원 보좌관으로 정치를 시작했습니다. 김종필 국무총리 시절 총리실에서 정책담당관과 공보과장으로 일했습니다. 이완구 충남지사 아래에서는 정무부지사를 맡아 2006년 금산세계인삼엑스포를 치렀습니다. 제19대 총선부터 충남 보령 서천에서 내리 세 번 당선되었습니다. 당 최고위원과 국회 농림축산식품해양수산위원장을 지냈습니다. 2021년 원내대표 경선에서는 김기현에게 네 표 차이로 뒤져 2위를 했습니다.\n\n이인제 대통령은 농촌을 지역구로 둔 사람에게 농정을 맡겼습니다. 김태흠은 국회에서 농림축산식품해양수산위원회를 이끌었습니다. 전쟁을 치르며 흔들린 먹거리 수급이 그의 손에 넘어왔습니다.\n\n§Y어록§!\n\"그에 맞서기 위해서는 투쟁력 있고 결기 있는 원내대표가 필요하다\"\n§g원내대표 출마 선언§!"
 TFRKPHN_cab_name_chung_hwang_keun:0 "정황근"
 TFRKPHN_cab_who_chung_hwang_keun:0 "§G정황근§!"
 TFRKPHN_cab_eff_chung_hwang_keun:0 "§Y정황근§!이 농림축산식품부 장관에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 소비재 공장 §G-3%§!, 안정도 §G+3%§!"
 TFRKPHN_cab_cf_chung_hwang_keun:0 "§L\"전북은 전통적인 농도입니다.\"§!\n§g정황근, 전북일보 인터뷰§!\n\n정말 §Y정황근§!을 농림축산식품부 장관에 임명하시겠습니까?\n임명하면: 소비재 공장 §G-3%§!, 안정도 §G+3%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_chung_hwang_keun:0 "\n§Y어록§!\n\"전북은 전통적인 농도입니다.\"\n§g전북일보 인터뷰§!"
 TFRKPHN_cab_tt_chung_hwang_keun:0 "§Y정황근§!\n농림축산식품부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 소비재 공장 §G-3%§!, 안정도 §G+3%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_chung_hwang_keun:0 "출생: 1960년 대한민국 충청남도 천안\n\n이력: 대한민국의 농림축산식품부 장관\n정황근은 농정 관료입니다. 2013년 대통령비서실 농축산식품비서관을 지냈습니다. 2016년 농촌진흥청장이 되었고, 2022년 5월 농림축산식품부 장관에 올랐습니다.\n\n농촌진흥청과 농식품부를 모두 이끌어 본 사람입니다. 대통령은 전쟁 뒤의 농정을 처음부터 가르칠 시간이 없었습니다. 천안 출신이라는 점도 대통령의 눈에 들었습니다.\n\n§Y어록§!\n\"전북은 전통적인 농도입니다.\"\n§g전북일보 인터뷰§!"
 TFRKPHN_cab_name_song_mi_ryung:0 "송미령"
 TFRKPHN_cab_who_song_mi_ryung:0 "§G송미령§!"
 TFRKPHN_cab_eff_song_mi_ryung:0 "§Y송미령§!이 농림축산식품부 장관에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 연구 속도 §G+3%§!, 안정도 §G+5%§!"
 TFRKPHN_cab_cf_song_mi_ryung:0 "§L\"정부가 청년들이 농촌에 정착할 수 있는 인프라를 마련해줘야 한다\"§!\n§g송미령, 더나은미래 기사§!\n\n정말 §Y송미령§!을 농림축산식품부 장관에 임명하시겠습니까?\n임명하면: 연구 속도 §G+3%§!, 안정도 §G+5%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_song_mi_ryung:0 "\n§Y어록§!\n\"정부가 청년들이 농촌에 정착할 수 있는 인프라를 마련해줘야 한다\"\n§g더나은미래 기사§!"
 TFRKPHN_cab_tt_song_mi_ryung:0 "§Y송미령§!\n농림축산식품부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 연구 속도 §G+3%§!, 안정도 §G+5%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_song_mi_ryung:0 "출생: 1967년 대한민국 충청남도 논산\n\n이력: 대한민국의 농림축산식품부 장관\n송미령은 1997년부터 한국농촌경제연구원에서 일했습니다. 농촌정책연구부장과 기획조정실장, 부원장을 거쳤습니다. 2023년 12월 농림축산식품부 장관에 임명되었습니다.\n\n대통령과 같은 논산 사람입니다. 농촌을 숫자로 들여다본 연구자이기도 합니다. 이인제 대통령은 농촌에 사람이 줄어드는 문제를 그에게 물었습니다.\n\n§Y어록§!\n\"정부가 청년들이 농촌에 정착할 수 있는 인프라를 마련해줘야 한다\"\n§g더나은미래 기사§!"
