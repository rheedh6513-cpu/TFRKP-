 TFRKPHN_cab_q_ahn_duk_geun:0 "\n§Y어록§!\n\"한국은 보호무역을 통한 시장 확보가 어려운 만큼 글로벌 통상연대를 강화해 나갈 예정\"\n§g최종현학술원 컨퍼런스§!"
 TFRKPHN_cab_tt_ahn_duk_geun:0 "§Y안덕근§!\n산업통상자원부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 공장 산출량 §G+5%§!, 정치력 획득 §G+2%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_ahn_duk_geun:0 "출생: 1968년 대한민국 대구광역시\n\n이력: 대한민국의 산업통상자원부 장관\n안덕근은 통상을 연구한 학자입니다. KDI 국제정책대학원을 거쳐 2005년 서울대학교 국제대학원 교수가 되었습니다. 2022년 5월 통상교섭본부장에 임명되었습니다. 2024년 1월 산업통상자원부 장관이 되었습니다.\n\n통상 협상을 직접 이끈 사람입니다. 미국이 무너진 뒤 무역의 규칙은 새로 써야 했습니다.\n\n§Y어록§!\n\"한국은 보호무역을 통한 시장 확보가 어려운 만큼 글로벌 통상연대를 강화해 나갈 예정\"\n§g최종현학술원 컨퍼런스§!"
 TFRKPHN_cab_name_yoon_sang_jick:0 "윤상직"
 TFRKPHN_cab_who_yoon_sang_jick:0 "§G윤상직§!"
 TFRKPHN_cab_eff_yoon_sang_jick:0 "§Y윤상직§!이 산업통상자원부 장관에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 건설 속도 §G+6%§!"
 TFRKPHN_cab_cf_yoon_sang_jick:0 "§L\"기업이 없으면 노조도 없다\"§!\n§g윤상직, 수출 부진업종 긴급 점검회의§!\n\n정말 §Y윤상직§!을 산업통상자원부 장관에 임명하시겠습니까?\n임명하면: 건설 속도 §G+6%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_yoon_sang_jick:0 "\n§Y어록§!\n\"기업이 없으면 노조도 없다\"\n§g수출 부진업종 긴급 점검회의§!"
 TFRKPHN_cab_tt_yoon_sang_jick:0 "§Y윤상직§!\n산업통상자원부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 건설 속도 §G+6%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_yoon_sang_jick:0 "출생: 1956년 대한민국 경상북도 경산\n\n이력: 대한민국의 산업통상자원부 장관\n윤상직은 1982년 제25회 행정고시에 합격했습니다. 2011년 지식경제부 제1차관이 되었습니다. 2013년부터 2016년까지 산업통상자원부 장관을 지냈습니다. 2016년 부산 기장에서 제20대 국회의원에 당선되었습니다.\n\n장관을 3년 하고 국회의원도 한 사람입니다. 대통령은 공장을 다시 짓는 일을 그에게 맡기려 했습니다.\n\n§Y어록§!\n\"기업이 없으면 노조도 없다\"\n§g수출 부진업종 긴급 점검회의§!"
 TFRKPHN_cab_name_joo_hyung_hwan:0 "주형환"
 TFRKPHN_cab_who_joo_hyung_hwan:0 "§G주형환§!"
 TFRKPHN_cab_eff_joo_hyung_hwan:0 "§Y주형환§!이 산업통상자원부 장관에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 공장 산출량 §G+3%§!, 생산 효율 증가 속도 §G+5%§!"
 TFRKPHN_cab_cf_joo_hyung_hwan:0 "§L\"지금 추세라면 12월 수출도 플러스를 유지할 것으로 보인다\"§!\n§g주형환, 세종시 기자 간담회§!\n\n정말 §Y주형환§!을 산업통상자원부 장관에 임명하시겠습니까?\n임명하면: 공장 산출량 §G+3%§!, 생산 효율 증가 속도 §G+5%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_joo_hyung_hwan:0 "\n§Y어록§!\n\"지금 추세라면 12월 수출도 플러스를 유지할 것으로 보인다\"\n§g세종시 기자 간담회§!"
 TFRKPHN_cab_tt_joo_hyung_hwan:0 "§Y주형환§!\n산업통상자원부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 공장 산출량 §G+3%§!, 생산 효율 증가 속도 §G+5%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_joo_hyung_hwan:0 "출생: 1961년 대한민국 서울특별시\n\n이력: 대한민국의 산업통상자원부 장관\n주형환은 1982년 제26회 행정고시에 합격했습니다. 2014년 기획재정부 제1차관을 지냈습니다. 2016년 산업통상자원부 장관에 임명되어 2017년 7월까지 일했습니다. 2024년에는 대통령 직속 저출산고령사회위원회 부위원장이 되었습니다.\n\n경제 부처와 산업 부처를 모두 겪은 관료입니다. 이인제 대통령은 기업하기 좋은 나라를 약속했습니다.\n\n§Y어록§!\n\"지금 추세라면 12월 수출도 플러스를 유지할 것으로 보인다\"\n§g세종시 기자 간담회§!"
 tfrkphn.276.t:0 "수출 통계"
 tfrkphn.276.story:0 "이달 수출 통계가 나왔다. 숫자는 나쁘지 않았다. 그 숫자를 들고 국회에 나갈 장관이 없었다.\n\n기업인 간담회도 두 번 미뤄졌다. 돌아오는 기업을 맞겠다던 정부였다.\n\n이인제는 달력을 넘겨 보았다. 더 미룰 날짜가 없었다."
 tfrkphn.276.o1:0 "이창양을 임명한다."
 tfrkphn.276.o2:0 "방문규를 임명한다."
