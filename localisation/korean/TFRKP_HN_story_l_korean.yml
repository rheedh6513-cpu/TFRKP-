 TFRKPHN_kuk_p_tkairport:0 "[경상도] 대구경북 통합신공항"
 TFRKPHN_kuk_p_tkairport_desc:0 "군위, 의성에 군 공항과 민간 공항을 함께 옮겨 대구경북의 하늘길을 엽니다."
