 # 각 군 개혁 결정 (예전 마크 버튼 효과)
 TFRKPHN_mnd_army_reform:0 "육군 정예화"
 TFRKPHN_mnd_army_reform_desc:0 "병력 감축 시대에 맞춰 육군을 소수 정예로 바꿉니다. 육군 경험치 +25, 영구적으로 육군 공격력과 방어력이 오릅니다. K2, K9 추가 배치 결정이 열립니다."
 TFRKPHN_mnd_navy_reform:0 "기동함대 창설"
 TFRKPHN_mnd_navy_reform_desc:0 "연안 방어를 넘어 먼바다로 나가는 기동함대를 만듭니다. 해군 경험치 +25, 영구적으로 함대 피해와 속도가 오릅니다. KDDX 관련 결정이 열립니다."
 TFRKPHN_mnd_fa50_buy:0 "FA-50 추가 도입"
 TFRKPHN_mnd_fa50_buy_desc:0 "국산 경공격기 FA-50을 추가로 들여옵니다. 즉시 40대가 배치되고, 공군 경험치 +25와 영구 공군 보정을 얻습니다."
 TFRKPHN_mnd_f4_retire:0 "팬텀 퇴역"
 TFRKPHN_mnd_f4_retire_desc:0 "반세기를 날아온 F-4 팬텀을 퇴역시킵니다. 공군 경험치 +25, 영구적으로 항공기 사고율이 줄고 방어력이 오릅니다.\n\n§YFA-50 추가 도입§!을 먼저 해야 합니다."
 TFRKPHN_mnd_marine_create:0 "해병특수작전군 창설"
 TFRKPHN_mnd_marine_create_desc:0 "해병대 특수작전 전력을 하나로 묶은 해병특수작전군을 만듭니다. 육군 경험치 +25, 영구적으로 특수부대 한도와 전투력이 오릅니다."
 TFRKPHN_mnd_industry:0 "방위산업 육성"
 TFRKPHN_mnd_industry_desc:0 "국내 방산 업체에 생산 물량을 몰아 줍니다. 군수공장 2개가 바로 지어집니다. K-방산 수출 협상 결정이 열립니다."
 TFRKPHN_mnd_space_create:0 "우주군 창설"
 TFRKPHN_mnd_space_create_desc:0 "육군, 해군, 공군, 해병대 개혁을 모두 마쳤습니다. 이제 다섯 번째 군, 우주군을 창설합니다. 영구적으로 각 군 정보 능력과 연구 속도가 오릅니다."
 TFRKPHN_mnd_space_req_tt:0 "§Y육군 정예화§!, §Y기동함대 창설§!, §YFA-50 추가 도입§!, §Y팬텀 퇴역§!, §Y해병특수작전군 창설§!을 모두 마쳤다"
