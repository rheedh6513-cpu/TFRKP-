 TFRKPHN_cab_post_tt:0 "누르면 이 자리의 후보가 아래에 나옵니다."
 TFRKPHN_cab_hint:0 "§g위에서 직책을 누르면 후보가 여기에 나옵니다.§!"
 TFRKPHN_cab_jang_ho_jin_desc:0 "출생: 1961년 대한민국 서울특별시\n\n이력: 대한민국의 국가안보실장\n장호진은 직업 외교관입니다. 2008년 외교통상부 북미국장, 2010년 주캄보디아 대사를 지냈습니다. 2012년에는 대통령비서실 외교비서관으로 일했습니다. 2022년 주러시아 대사, 2023년 외교부 제1차관을 거쳐 2024년 1월 국가안보실장에 올랐습니다.\n\n이 자리를 이미 해 본 사람입니다. 이인제 대통령은 인수인계가 필요 없는 실장을 원했습니다."
 TFRKPHN_cab_chun_young_woo_desc:0 "출생: 1952년 대한민국 경상남도 밀양\n\n이력: 대한민국의 국가안보실장\n천영우는 2006년부터 북핵 6자회담 수석대표와 한반도평화교섭본부장을 맡았습니다. 이후 주영국 대사와 외교통상부 제2차관을 지냈습니다. 2010년부터 2013년까지 대통령실 외교안보수석비서관으로 일했습니다.\n\n북한과 직접 마주 앉아 본 협상가입니다. 이인제 대통령은 북한 체제를 바꾸겠다고 약속했고, 그 상대를 아는 사람이 필요했습니다."
 TFRKPHN_cab_lee_do_hoon_desc:0 "출생: 1962년 대한민국 부산광역시\n\n이력: 대한민국의 국가안보실장\n이도훈은 1985년 외무고시 19회로 외교관이 되었습니다. 2012년부터 2년간 외교부 북핵외교기획단장을 맡았습니다. 2016년 청와대 외교비서관, 2022년 외교부 제2차관을 지냈습니다. 2023년 7월 주러시아 대사로 나갔습니다.\n\n북핵과 러시아를 함께 다뤄 본 외교관입니다. 미국이 무너진 뒤 북쪽 국경 너머를 읽는 일이 더 중요해졌습니다."
 TFRKPHN_cab_park_cheol_hee_desc:0 "출생: 1963년 대한민국 충청북도 충주\n\n이력: 대한민국의 국가안보실장\n박철희는 일본 정치를 연구한 학자입니다. 서울대학교 국제대학원 교수로 일하며 일본연구소장과 국제대학원장을 맡았습니다. 대통령직 인수위원회 외교안보분과 전문위원과 국립외교원장을 지냈습니다. 2024년 주일본 대사에 임명되었습니다.\n\n충주 사람입니다. 이인제 대통령은 PDTO의 동맹국 일본을 연구해 온 학자를 곁에 두려 했습니다."
 TFRKPHN_cab_chung_hwang_keun_desc:0 "출생: 1960년 대한민국 충청남도 천안\n\n이력: 대한민국의 농림축산식품부 장관\n정황근은 농정 관료입니다. 2013년 대통령비서실 농축산식품비서관을 지냈습니다. 2016년 농촌진흥청장이 되었고, 2022년 5월 농림축산식품부 장관에 올랐습니다.\n\n농촌진흥청과 농식품부를 모두 이끌어 본 사람입니다. 대통령은 전쟁 뒤의 농정을 처음부터 가르칠 시간이 없었습니다. 천안 출신이라는 점도 대통령의 눈에 들었습니다."
 TFRKPHN_cab_song_mi_ryung_desc:0 "출생: 1967년 대한민국 충청남도 논산\n\n이력: 대한민국의 농림축산식품부 장관\n송미령은 1997년부터 한국농촌경제연구원에서 일했습니다. 농촌정책연구부장과 기획조정실장, 부원장을 거쳤습니다. 2023년 12월 농림축산식품부 장관에 임명되었습니다.\n\n대통령과 같은 논산 사람입니다. 농촌을 숫자로 들여다본 연구자이기도 합니다. 이인제 대통령은 농촌에 사람이 줄어드는 문제를 그에게 물었습니다."
 TFRKPHN_cab_lee_dong_phil_desc:0 "출생: 1955년 대한민국 경상북도 의성\n\n이력: 대한민국의 농림축산식품부 장관\n이동필은 1980년 한국농촌경제연구원에 들어가 2011년 원장이 되었습니다. 2013년부터 2016년까지 농림축산식품부 장관을 지냈습니다. 2018년부터는 경상북도지사의 농촌살리기 정책자문관으로 일했습니다.\n\n농촌을 연구했고 장관도 해 본 사람입니다. 대통령은 농민 단체와 말이 통할 장관을 원했습니다."
 TFRKPHN_cab_lee_yang_soo_desc:0 "출생: 1967년 대한민국 강원도 속초\n\n이력: 대한민국의 농림축산식품부 장관\n이양수는 2016년 강원 속초 고성 양양에서 제20대 국회의원에 당선되어 내리 세 번 당선되었습니다. 국회 농림축산식품해양수산위원회에서 간사를 맡았습니다. 국민의힘 원내수석부대표를 지냈고, 2024년 12월 사무총장이 되었습니다.\n\n국회 농해수위에서 오래 일한 의원입니다. 대통령은 농정 예산을 국회에서 따낼 사람을 골랐습니다."
 TFRKPHN_cab_lim_i_ja_desc:0 "출생: 1964년 대한민국 경상북도 예천\n\n이력: 대한민국의 고용노동부 장관\n임이자는 노동운동가 출신 정치인입니다. 한국노동조합총연맹 경기본부 상임부의장을 지냈고, 2014년 한국노총 부위원장이 되었습니다. 중앙노동위원회 근로자위원으로도 일했습니다. 2016년 제20대 국회에 비례대표로 들어왔고, 이후 경북 상주 문경에서 두 번 더 당선되었습니다.\n\n노동계 출신이면서 보수 정당의 3선 의원입니다. 이인제 대통령은 노동개혁 법안을 국회에서 통과시킬 장관을 찾았습니다."
 TFRKPHN_cab_kwon_ki_seop_desc:0 "출생: 1969년 대한민국 경상북도 예천\n\n이력: 대한민국의 고용노동부 장관\n권기섭은 1992년 제36회 행정고시에 합격해 이듬해 노동부에서 공직을 시작했습니다. 2021년 노동정책실장과 산업안전보건본부장을 맡았습니다. 2022년 고용노동부 차관이 되었고, 2024년 경제사회노동위원회 위원장에 올랐습니다.\n\n노동부에서 30년을 일한 관료입니다. 대통령이 장관이던 시절에 그는 갓 들어온 사무관이었습니다."
 TFRKPHN_cab_lee_ki_kweon_desc:0 "출생: 1957년 대한민국 전라남도 함평\n\n이력: 대한민국의 고용노동부 장관\n이기권은 1981년 제25회 행정고시에 합격했습니다. 2011년 고용노동부 차관을 지냈고, 2012년 한국기술교육대학교 총장이 되었습니다. 2014년 7월부터 2017년 7월까지 고용노동부 장관으로 일했습니다.\n\n장관을 3년 한 사람입니다. 이인제 대통령은 그 경험을 노동개혁에 다시 쓰려 했습니다."
 TFRKPHN_cab_bang_ha_nam_desc:0 "출생: 1957년 대한민국 전라남도 완도\n\n이력: 대한민국의 고용노동부 장관\n방하남은 한국노동연구원에서 일한 연구자입니다. 2012년 한국연금학회 회장을 지냈습니다. 2013년 3월부터 2014년 7월까지 고용노동부 장관으로 일했습니다. 2015년에는 한국노동연구원 원장이 되었습니다.\n\n일자리와 연금을 연구한 학자입니다. 대통령은 고용보험을 다시 설계할 사람으로 그를 떠올렸습니다."
 TFRKPHN_cab_kim_yung_ho_desc:0 "출생: 1959년 대한민국 경상남도 진주\n\n이력: 대한민국의 통일부 장관\n김영호는 정치학자입니다. 1999년부터 성신여자대학교 정치외교학과 교수로 일했습니다. 2011년 대통령실 통일비서관을 지냈습니다. 2023년 7월 통일부 장관에 임명되었습니다.\n\n대통령실에서 통일 정책을 다뤄 본 학자입니다. 이인제 대통령은 북한 체제의 근본 변화를 약속했고, 그 일을 맡길 장관이 필요했습니다."
 TFRKPHN_cab_hong_yong_pyo_desc:0 "출생: 1964년 대한민국 서울특별시\n\n이력: 대한민국의 통일부 장관\n홍용표는 통일연구원 연구위원을 거쳐 2001년 한양대학교 교수가 되었습니다. 2013년 대통령비서실 통일비서관으로 들어갔습니다. 2015년 3월부터 2017년 7월까지 통일부 장관을 지냈습니다.\n\n청와대와 통일부를 모두 겪은 사람입니다. 이인제 대통령은 통일 정책을 부처 사이에서 조율할 장관을 원했습니다."
 TFRKPHN_cab_ryoo_kihl_jae_desc:0 "출생: 1959년 대한민국 서울특별시\n\n이력: 대한민국의 통일부 장관\n류길재는 1987년 경남대학교 극동문제연구소에서 연구를 시작했습니다. 1998년 북한대학원 교수가 되었습니다. 2013년 3월 통일부 장관에 임명되었습니다.\n\n북한을 오래 연구한 학자입니다. 대통령은 통일 뒤 북한 주민의 삶을 설계할 사람으로 그를 골랐습니다."
 TFRKPHN_cab_kim_gi_woong_desc:0 "출생: 1961년 대한민국 인천광역시\n\n이력: 대한민국의 통일부 장관\n김기웅은 1990년 국토통일원에 특채로 들어왔습니다. 통일부에서 남북회담 업무를 오래 맡았고 남북회담본부장을 지냈습니다. 2022년 대통령비서실 통일비서관을 거쳐 통일부 차관이 되었습니다. 2024년 대구 중구 남구에서 제22대 국회의원에 당선되었습니다.\n\n남북회담 실무를 오래 맡은 관료입니다. 대통령은 회담의 기술을 아는 장관을 원했습니다."
 TFRKPHN_cab_jo_gun_shik_desc:0 "출생: 1952년 대한민국 서울특별시\n\n이력: 대한민국의 통일부 장관\n조건식은 통일원에서 교류협력국장을 지냈습니다. 1997년 대통령비서실 통일비서관으로 일했습니다. 2003년부터 이듬해까지 통일부 차관을 맡았습니다. 2008년 현대아산 대표이사가 되었습니다.\n\n관료였고 대북 사업을 하는 기업의 대표였습니다. 이인제 대통령은 통일은 경제라고 말해 왔습니다."
 TFRKPHN_cab_shim_woo_jung_desc:0 "출생: 1971년 대한민국 충청남도 공주\n\n이력: 대한민국의 법무부 장관\n심우정은 1994년 사법시험에 합격했습니다. 2021년 서울동부지검장, 2022년 인천지검장을 지냈습니다. 2023년 대검찰청 차장검사, 2024년 법무부 차관을 거쳐 그해 9월 검찰총장이 되었습니다. 심대평 전 충남지사의 아들로 알려져 있습니다.\n\n공주 사람이고 검찰의 꼭대기까지 올라간 검사입니다. 대통령은 충청 출신 법조인을 눈여겨봤습니다."
 TFRKPHN_cab_lee_noh_kong_desc:0 "출생: 1969년 대한민국 인천광역시\n\n이력: 대한민국의 법무부 장관\n이노공은 1994년 제36회 사법시험에 합격했습니다. 2018년 7월 서울중앙지방검찰청 제4차장검사가 되었습니다. 여성으로는 처음이었습니다. 2019년 수원지방검찰청 성남지청장을 지냈습니다. 2022년 5월 법무부 차관에 임명되어 2024년 1월까지 일했습니다.\n\n법무부 살림을 차관으로 2년 가까이 맡아 본 사람입니다. 이인제 대통령은 부처를 조용히 굴릴 장관을 원했습니다."
 TFRKPHN_cab_kim_do_eup_desc:0 "출생: 1964년 대한민국 부산광역시\n\n이력: 대한민국의 법무부 장관\n김도읍은 1996년부터 2011년까지 검사로 일했습니다. 부산지검 공판부장과 외사부장을 지냈습니다. 2012년 부산에서 제19대 국회의원에 당선된 뒤 네 번 당선되었습니다. 2022년 7월부터 2024년 5월까지 국회 법제사법위원장을 맡았습니다.\n\n법사위원장을 지낸 4선 의원입니다. 대통령이 내놓을 법안은 모두 법사위를 지나야 합니다."
 TFRKPHN_cab_jeong_jeom_sig_desc:0 "출생: 1965년 대한민국 경상남도 진주\n\n이력: 대한민국의 법무부 장관\n정점식은 1988년 제30회 사법시험에 합격해 검사가 되었습니다. 대검찰청 공안부장을 지내고 2017년 검찰을 떠났습니다. 2019년 경남 통영 고성에서 국회의원에 당선되어 3선을 했습니다.\n\n공안 검사 출신입니다. 북한 체제를 흔들겠다는 정부에서 공안은 다시 무거운 말이 되었습니다."
 TFRKPHN_cab_yoo_sang_bum_desc:0 "출생: 1966년 대한민국 강원도 영월\n\n이력: 대한민국의 법무부 장관\n유상범은 1989년 제31회 사법시험에 합격했습니다. 1992년 검사로 임용되었습니다. 2015년 창원지방검찰청 검사장이 되었고, 2017년 광주고등검찰청 차장검사를 끝으로 검찰을 떠났습니다. 2020년 제21대 국회의원에 당선되었고 2024년 재선했습니다.\n\n검사장을 지낸 재선 의원입니다. 대통령은 검찰과 국회 양쪽에 말이 통하는 사람을 찾았습니다."
 TFRKPHN_cab_yoon_suk_yeol_desc:0 "출생: 1960년 대한민국 서울특별시\n\n이력: 대한민국의 법무부 장관\n윤석열은 1991년 제33회 사법시험에 합격했습니다. 2013년 국가정보원 여론 조작 사건 특별수사팀장을 맡았습니다. 2016년에는 특검 수사팀장으로 일했습니다. 2017년 서울중앙지검장, 2019년 7월 검찰총장에 올랐습니다. 2021년 3월 총장직에서 물러났고, 그해 7월 국민의힘에 입당했습니다.\n\n2021년 경선에서 홍준표에게 패했습니다. 정치를 시작한 지 넉 달 된 신인이었습니다. 모두에게 잊혀진 뒤에는 찾는 사람이 없었고, 그는 잊힌 채 지냈습니다. 법무부 장관 자리가 끝내 비자 그의 이름이 다시 나왔습니다. 문재인 정부에서 검찰총장을 지낸 이력 때문이었습니다."
 TFRKPHN_cab_lee_chang_yang_desc:0 "출생: 1962년 대한민국 경상남도 고성\n\n이력: 대한민국의 산업통상자원부 장관\n이창양은 1985년 제29회 행정고시에 합격해 상공부에서 일했습니다. 2000년 KAIST 경영대학 교수가 되었습니다. 2022년 5월부터 2023년 9월까지 산업통상자원부 장관을 지냈습니다.\n\n관료로 시작해 기술 경영을 가르친 교수입니다. 이인제 대통령은 벤처 대국을 말해 왔습니다."
 TFRKPHN_cab_bang_moon_kyu_desc:0 "출생: 1962년 대한민국 경기도 수원\n\n이력: 대한민국의 산업통상자원부 장관\n방문규는 1984년 행정고시에 합격했습니다. 기획재정부 예산실장과 제2차관, 보건복지부 차관을 지냈습니다. 2019년 한국수출입은행장이 되었습니다. 이후 국무조정실장을 거쳐 2023년 산업통상자원부 장관에 임명되었습니다.\n\n예산과 수출 금융을 모두 다뤄 본 관료입니다. 대통령은 전쟁 빚을 갚으면서 수출도 늘려야 했습니다."
 TFRKPHN_cab_ahn_duk_geun_desc:0 "출생: 1968년 대한민국 대구광역시\n\n이력: 대한민국의 산업통상자원부 장관\n안덕근은 통상을 연구한 학자입니다. KDI 국제정책대학원을 거쳐 2005년 서울대학교 국제대학원 교수가 되었습니다. 2022년 5월 통상교섭본부장에 임명되었습니다. 2024년 1월 산업통상자원부 장관이 되었습니다.\n\n통상 협상을 직접 이끈 사람입니다. 미국이 무너진 뒤 무역의 규칙은 새로 써야 했습니다."
 TFRKPHN_cab_yoon_sang_jick_desc:0 "출생: 1956년 대한민국 경상북도 경산\n\n이력: 대한민국의 산업통상자원부 장관\n윤상직은 1982년 제25회 행정고시에 합격했습니다. 2011년 지식경제부 제1차관이 되었습니다. 2013년부터 2016년까지 산업통상자원부 장관을 지냈습니다. 2016년 부산 기장에서 제20대 국회의원에 당선되었습니다.\n\n장관을 3년 하고 국회의원도 한 사람입니다. 대통령은 공장을 다시 짓는 일을 그에게 맡기려 했습니다."
 TFRKPHN_cab_joo_hyung_hwan_desc:0 "출생: 1961년 대한민국 서울특별시\n\n이력: 대한민국의 산업통상자원부 장관\n주형환은 1982년 제26회 행정고시에 합격했습니다. 2014년 기획재정부 제1차관을 지냈습니다. 2016년 산업통상자원부 장관에 임명되어 2017년 7월까지 일했습니다. 2024년에는 대통령 직속 저출산고령사회위원회 부위원장이 되었습니다.\n\n경제 부처와 산업 부처를 모두 겪은 관료입니다. 이인제 대통령은 기업하기 좋은 나라를 약속했습니다."
 TFRKPHN_cab_empty:0 "§g후보 없음§!"
 TFRKPHN_cab_timeout:0 "기타 장관 임명까지 남은 기한"
 TFRKPHN_cab_timeout_desc:0 "기한이 지나도록 비어 있는 자리는 대통령이 후보 가운데 한 사람을 골라 임명한다."
 TFRKPHN_cab_timeout_tt:0 "§L비어 있는 자리마다 후보 가운데 한 사람을 골라 임명하게 됩니다.§!"
 # ===== 이인제 트리 =====
 TFRKPHN_lee_tt_ind3:0 "이인제 정부의 국정: 공장 산출량 §G+3%§!"
 TFRKPHN_lee_in_je_b01_01:0 "출발선에 다시 서서"
 TFRKPHN_lee_in_je_b01_01_desc:0 "대만해협의 전쟁은 승리로 끝났다. 미국이 무너진 세계에서 대한민국은 승전국이 되었다. 1997년 처음 대선에 나선 지 30년이다. 이인제가 일자리와 통합과 통일이라는 오래된 약속을 들고 다시 출발선에 섰다."
 TFRKPHN_lee_in_je_a1:0 "국민 대통합"
 TFRKPHN_lee_in_je_a1_desc:0 "충청은 오래 대통령을 꿈꿨다. 김종필, 이회창, 반기문, 안희정, 그리고 이인제 자신. 모두 문턱에서 멈췄다. 영남과 호남이 맞서는 동안 충청은 승부를 가르는 표였다. 주인공은 아니었다. 이제 논산 사람이 청와대에 앉았다. 영남도 호남도 아닌 대통령이 지역과 계층의 갈등을 푼다. 1997년부터 맨 앞에 둔 과제다."
 TFRKPHN_lee_in_je_a2:0 "책임총리제"
 TFRKPHN_lee_in_je_a2_desc:0 "대통령은 외교와 안보, 통일을 맡고 내치는 실질적 제청권을 가진 총리에게 맡긴다. 1997년부터 2017년까지 한결같이 내놓은 구상이다. 전시에 한곳으로 몰렸던 권한을 다시 나눈다."
 TFRKPHN_lee_in_je_a2b:0 "강력한 리더십"
 TFRKPHN_lee_in_je_a2b_desc:0 "중국은 졌지만 다시 무장하고 있다. 전쟁의 기운이 퍼지고 각국의 군비는 나날이 늘어난다. 지금은 권한을 나눌 때가 아니다. 지금이야말로 강한 정부가 필요하다. 1997년의 구호 그대로, 강력한 리더십이다."
 TFRKPHN_lee_in_je_a3:0 "임기를 함께하는 내각"
 TFRKPHN_lee_in_je_a3_desc:0 "장관은 대통령과 임기를 함께한다. 전후 복구와 통일 준비는 몇 달마다 바뀌는 장관으로는 끝까지 밀 수 없다."
 TFRKPHN_lee_in_je_a4:0 "정치 명예혁명"
 TFRKPHN_lee_in_je_a4_desc:0 "세대교체는 사람을 바꾸는 일이 아니라 새로운 정치문화를 만드는 일이다. 3김 시대를 끝내자던 구호는 이제 전쟁 전의 진영 정치로 돌아가지 말자는 말이 되었다."
 TFRKPHN_lee_in_je_a4b:0 "온정주의 없는 법 집행"
 TFRKPHN_lee_in_je_a4b_desc:0 "판결이 지나치게 온정적이라는 것이 그의 오랜 지적이다. 전시의 혼란을 틈탄 범죄와 군납 비리에도 같은 잣대를 댄다."
 TFRKPHN_lee_in_je_a5:0 "정경유착의 뿌리 뽑기"
 TFRKPHN_lee_in_je_a5_desc:0 "1997년에는 자금세탁방지법 제정을 약속했다. 전쟁은 군수 계약과 복구 사업이라는 큰돈을 만들었다. 그 돈이 정치로 흘러드는 길목을 막는다."
 TFRKPHN_lee_in_je_a6:0 "전쟁 빚은 2년 안에"
 TFRKPHN_lee_in_je_a6_desc:0 "1997년에는 구제금융을 집권 2년 안에 갚겠다고 했다. 이번에는 승전의 값으로 진 전쟁 국채다. 2년 안에 갚고 물가는 3% 선에서 붙든다."
 TFRKPHN_lee_in_je_b1:0 "일자리 만드는 대통령"
 TFRKPHN_lee_in_je_b1_desc:0 "1993년, 마흔넷의 노동부 장관은 파업 노동자의 생계비를 두고 재계와 맞섰다. 같은 해 고용보험 도입을 이끌었다. 열 달의 장관 생활이 남긴 결론은 하나였다. 일자리가 최고의 복지다. 그 뒤로 그는 일자리 만드는 대통령을 자처했다. 이제 그 말을 지킬 자리에 앉았다."
 TFRKPHN_lee_in_je_b2:0 "실업과의 전쟁"
 TFRKPHN_lee_in_je_b2_desc:0 "대통령이 직접 고용 창출 전략회의를 주재한다. 군복을 벗고 돌아온 수십만 장병에게 일터부터 찾아 준다."
 TFRKPHN_lee_in_je_b3:0 "기업하기 좋은 나라"
 TFRKPHN_lee_in_je_b3_desc:0 "규제는 교통신호등처럼 단순하고 분명해야 한다. 전시 통제 경제를 걷어 내고 정부보다 민간, 대기업보다 중소기업을 앞에 둔다."
 TFRKPHN_lee_in_je_b5:0 "좋은 일자리 100만 개"
 TFRKPHN_lee_in_je_b5_desc:0 "5년 안에 좋은 일자리 100만 개. 군수 공장을 민수로 돌리고, 전역 장병의 직업훈련과 고용정보망을 넓힌다."
 TFRKPHN_lee_in_je_b6:0 "벤처 대국"
 TFRKPHN_lee_in_je_b6_desc:0 "벤처 생태계를 키우고 관광, 의료, 문화를 엮은 서비스산업을 새 먹거리로 삼는다. 전쟁이 앞당긴 무인기와 인공지능 기술을 민간으로 풀어 준다."
 TFRKPHN_lee_in_je_b7:0 "고용보험 2.0"
 TFRKPHN_lee_in_je_b7_desc:0 "1993년 노동부 장관으로서 고용보험 도입을 이끌었다. 이제 그 울타리를 전역 장병과 플랫폼 노동자, 프리랜서까지 넓힌다."
 TFRKPHN_lee_in_je_b4:0 "돌아오는 기업"
 TFRKPHN_lee_in_je_b4_desc:0 "해외로 나간 공장이 돌아올 환경을 만든다. 패전한 중국에서 빠져나오는 공장들이 갈 곳을 찾고 있다. 땅과 전기, 세금 조건을 먼저 내놓는다."
 TFRKPHN_lee_in_je_c1:0 "북한 체제의 근본 변화"
 TFRKPHN_lee_in_je_c1_desc:0 "2~3년 안에 북한 체제를 근본적으로 바꾸고 핵을 들어낸다. 2017년 경선 토론에서 한 약속이다. 뒤를 봐주던 중국이 전쟁에서 졌다. 북한을 받쳐 줄 나라가 없는 지금 움직인다."
 TFRKPHN_lee_in_je_c2:0 "보복 없는 통일"
 TFRKPHN_lee_in_je_c2_desc:0 "통일 뒤에 차별도 보복도 없다고 미리 약속한다. 중국이라는 뒷배를 잃은 북한의 엘리트에게 살길을 보여 준다."
 TFRKPHN_lee_in_je_c3:0 "주민에게 진실을"
 TFRKPHN_lee_in_je_c3_desc:0 "중국이 졌다는 사실조차 북한 주민은 제대로 듣지 못했다. 라디오와 전단, 장마당의 입소문으로 바깥 소식을 넣는다."
 TFRKPHN_lee_in_je_c5:0 "탈북민 정착 지원"
 TFRKPHN_lee_in_je_c5_desc:0 "전쟁 뒤 느슨해진 국경을 넘어 탈북민이 늘고 있다. 이들이 남쪽에서 자리 잡고 사는 모습은 북쪽에도 전해진다."
 TFRKPHN_lee_in_je_c6:0 "북한인권재단 출범"
 TFRKPHN_lee_in_je_c6_desc:0 "2016년 북한인권법이 정하고도 출범하지 못한 북한인권재단을 마침내 세운다."
 TFRKPHN_lee_in_je_c7:0 "통일을 받아들이는 주변국"
 TFRKPHN_lee_in_je_c7_desc:0 "1997년의 그는 주변 강대국이 통일을 받아들이는 분위기부터 만들어야 한다고 했다. 미국은 무너졌고 중국은 졌다. 설득할 상대는 PDTO의 동맹국들이다. 중국이 다시 일어서기 전에 끝내야 한다."
 TFRKPHN_lee_in_je_c8:0 "통일의 물적 기반"
 TFRKPHN_lee_in_je_c8_desc:0 "1997년의 그는 다음 정권이 할 일은 통일의 물적 기반을 쌓는 것이라고 했다. 30년이 지난 지금, 승전으로 얻은 여력을 통일 기금에 넣는다."
 TFRKPHN_lee_in_je_c4:0 "통일은 경제다"
 TFRKPHN_lee_in_je_c4_desc:0 "통일은 대성장이다. 통일 뒤 30~40년이면 독일과 일본을 넘는다. 1인당 소득은 9만 달러에 이른다. 그의 계산이다. 대한민국이 이끄는 자주적 통일, 헌법의 가치 위에서 민주적 절차로."
 TFRKPHN_lee_in_je_d1:0 "누군가는 해야 할 일"
 TFRKPHN_lee_in_je_d1_desc:0 "전 노동부 장관이자 2015년 노동시장선진화특위 위원장. 전시 동원으로 멈춰 있던 노동개혁을 다시 꺼낸다."
 TFRKPHN_lee_in_je_d2:0 "하르츠식 대타협"
 TFRKPHN_lee_in_je_d2_desc:0 "대처나 레이건이 아니라 독일의 하르츠 개혁이 모델이다. 전쟁을 함께 버틴 노동계와 경영계를 노사정위원회에 다시 앉힌다. 사회적 합의를 맨 앞에 둔다."
 TFRKPHN_lee_in_je_d2b:0 "국회 입법으로 돌파"
 TFRKPHN_lee_in_je_d2b_desc:0 "합의만 기다리다가는 개혁이 표류한다. 승전의 지지율이 남아 있을 때 근로기준법, 기간제법, 파견법을 국회에서 한꺼번에 처리한다."
 TFRKPHN_lee_in_je_d3:0 "정년 연장과 임금체계 개편"
 TFRKPHN_lee_in_je_d3_desc:0 "전쟁으로 일손이 모자라 정년은 늘려야 한다. 그러나 임금체계가 함께 바뀌어야 돌아온 청년을 뽑을 여력이 생긴다. 2015년 임금피크제의 논리 그대로다."
 TFRKPHN_lee_in_je_d4:0 "생산성만큼의 임금"
 TFRKPHN_lee_in_je_d4_desc:0 "임금은 생산성의 범위 안에서 오른다. 1997년 대선 후보 이인제의 입장이다. 전시 특별수당으로 부푼 임금을 제자리로 돌린다."
 TFRKPHN_lee_in_je_d4b:0 "무노동 부분임금"
 TFRKPHN_lee_in_je_d4b_desc:0 "파업 중에도 식비와 가족수당 같은 생활보장적 임금은 준다. 1993년 노동부 장관 이인제가 재계의 반발 속에 내놓은 개혁이다. 전시 내내 파업을 참은 노동자들이 먼저 요구해 온 것이기도 하다."
 TFRKPHN_lee_in_je_e1:0 "수레의 양바퀴"
 TFRKPHN_lee_in_je_e1_desc:0 "노동개혁과 재벌개혁은 수레의 양바퀴다. 전쟁 특수로 몸집을 불린 재벌을 바로잡는다. 세습경영, 부당 내부거래, 중소기업 기술과 인력 약탈이 대상이다. 소유권은 존중하되 횡포는 끝낸다."
 TFRKPHN_lee_in_je_e2:0 "지분적립형 주택"
 TFRKPHN_lee_in_je_e2_desc:0 "입주자가 가진 돈만큼 지분을 갖고 나머지는 임대로 살다가 지분을 늘려 간다. 2007년에 약속한 지분소유형 임대주택이다. 전역 장병과 신혼부부에게 먼저 돌아간다."
 TFRKPHN_lee_in_je_e3:0 "일하는 어머니"
 TFRKPHN_lee_in_je_e3_desc:0 "국공립 보육시설을 절반 더 늘리고 여성 고용 비율을 30%까지 올린다. 남자들이 전선에 있는 동안 공장을 돌린 것은 여성이었다. 그들이 일터에 남으려면 아이 맡길 곳이 있어야 한다."
 TFRKPHN_lee_in_je_e4:0 "어르신 통합 복지카드"
 TFRKPHN_lee_in_je_e4_desc:0 "의료비, 교통비, 이미용비, 목욕비를 카드 한 장으로. 2018년 충남지사 선거의 공약을 전국으로 넓힌다. 자식을 전쟁터에 보냈던 세대부터 받는다."
 TFRKPHN_lee_in_je_h1:0 "안보는 대통령의 몫"
 TFRKPHN_lee_in_je_h1_desc:0 "외교, 안보, 국방, 통일은 대통령이 직접 책임진다. 이긴 전쟁의 군대를 그대로 북쪽으로 돌려 세운다."
 TFRKPHN_lee_in_je_h2:0 "핵 없는 한반도"
 TFRKPHN_lee_in_je_h2_desc:0 "2017년 그는 독자 핵무장에 반대했다. 독일은 핵 없이도 유럽 최강국이라는 것이 그의 논리였다. 통일이 되는 날 한반도의 핵을 모두 내려놓겠다고 미리 선언한다."
 TFRKPHN_lee_in_je_h2b:0 "물려받은 핵억지"
 TFRKPHN_lee_in_je_h2b_desc:0 "소신은 핵 없는 한반도다. 그러나 미국의 핵우산이 사라진 세계에서 전임 정부가 일본과 쌓은 억지력을 허물 수는 없다. 북핵이 사라지는 날까지 그대로 둔다."
 TFRKPHN_lee_in_je_h3:0 "최소한의 대응조치"
 TFRKPHN_lee_in_je_h3_desc:0 "미사일 방어는 북핵에 맞선 최소한의 대응조치라는 것이 그의 말이었다. 패전한 중국은 다시 군비를 늘리고 있다. 방어망을 북쪽과 서쪽으로 촘촘히 넓힌다."
 TFRKPHN_lee_in_je_h4:0 "국방개혁 2단계"
 TFRKPHN_lee_in_je_h4_desc:0 "승전의 교훈으로 군을 다시 짠다. 바다와 하늘에서 이긴 군대를 산과 도시에서 싸울 군대로 바꾼다."
 TFRKPHN_lee_in_je_h5:0 "통일 대비 군 개편"
 TFRKPHN_lee_in_je_h5_desc:0 "통일 이후의 한반도를 지킬 군 구조를 미리 짠다. 북한 지역의 안정화와 압록강, 두만강 국경 방어가 새 임무다."
 TFRKPHN_lee_in_je_h6:0 "양안전쟁 참전용사 예우"
 TFRKPHN_lee_in_je_h6_desc:0 "대만해협에서 싸우고 이긴 장병들에게 나라가 답한다."
 TFRKPHN_lee_in_je_fin:0 "한라에서"
 TFRKPHN_lee_in_je_fin_desc:0 "한라에서 백두까지. 남쪽 바다의 전쟁은 이겼다. 몇 번이고 다시 일어선 불사조가 마지막 과업을 준비한다. 북한 체제의 정점을 겨눌 때다."
 TFRKPHN_lee_in_je_fin2:0 "백두를 보네"
 TFRKPHN_lee_in_je_fin2_desc:0 "준비는 끝났다. 특수임무부대가 북쪽으로 향한다."
 TFRKPHN_lee_tt_stab3:0 "이인제 정부의 국정: 안정도 §G+3%§!"
 TFRKPHN_lee_tt_pp5:0 "이인제 정부의 국정: 정치력 획득 §G+5%§!"
 TFRKPHN_lee_tt_pp10:0 "이인제 정부의 국정: 정치력 획득 §G+10%§!"
 TFRKPHN_lee_tt_build5:0 "이인제 정부의 국정: 건물 건설 속도 §G+5%§!"
 TFRKPHN_lee_tt_birth10:0 "저출산 대응 단계가 §G10단계§! 상승합니다.\n§g10단계마다 고령화 국민정신이 한 칸 나아집니다. 최대 50단계입니다.§!"
