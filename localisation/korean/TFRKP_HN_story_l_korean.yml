 TFRKPHN_cab_ttd_lee_noh_kong:0 "출생: 1969년 대한민국 인천광역시\n\n이력: 대한민국의 법무부 장관\n이노공은 1994년 제36회 사법시험에 합격했습니다. 2018년 7월 서울중앙지방검찰청 제4차장검사가 되었습니다. 여성으로는 처음이었습니다. 2019년 수원지방검찰청 성남지청장을 지냈습니다. 2022년 5월 법무부 차관에 임명되어 2024년 1월까지 일했습니다.\n\n법무부 살림을 차관으로 2년 가까이 맡아 본 사람입니다. 이인제 대통령은 부처를 조용히 굴릴 장관을 원했습니다.\n\n§Y어록§!\n\"공정과 상식에 기반한 법무행정을 위해 노력을 다하겠다\"\n§g법무부 차관 취임사§!"
