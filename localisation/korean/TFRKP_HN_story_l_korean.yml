 TFRKPHN_cab_ttd_jo_gun_shik:0 "출생: 1952년 대한민국 서울특별시\n\n이력: 대한민국의 통일부 장관\n조건식은 통일원에서 교류협력국장을 지냈습니다. 1997년 대통령비서실 통일비서관으로 일했습니다. 2003년부터 이듬해까지 통일부 차관을 맡았습니다. 2008년 현대아산 대표이사가 되었습니다.\n\n관료였고 대북 사업을 하는 기업의 대표였습니다. 이인제 대통령은 통일은 경제라고 말해 왔습니다.\n\n§Y어록§!\n\"중요한 것은 현대아산이라는 배를 먼저 살려야 하는 것\"\n§g현대아산 기자 간담회§!"
 tfrkphn.274.t:0 "공석"
 tfrkphn.274.story:0 "통일부 장관실 문에는 석 달째 종이 한 장이 붙어 있었다. 공석이라고 적혀 있었다.\n\n북한 체제를 바꾸겠다고 약속한 정부였다. 기자들은 그 종이를 찍어 갔다. 다음 날 신문 1면에 사진이 실렸다.\n\n이인제는 신문을 접어 책상 한쪽으로 밀었다. 그리고 후보 명단을 다시 펼쳤다."
 tfrkphn.274.o1:0 "김영호를 임명한다."
