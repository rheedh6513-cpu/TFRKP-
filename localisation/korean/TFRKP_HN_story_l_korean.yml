 TFRKPHN_kuk_p_swsemi_tt:0 "§Y민간 공장 +2§!, §Y오피스 단지 +1§!, §Y건물 칸 +3§!\n전남, 전북 지지도 §G+5%§!"
 TFRKPHN_kuk_p_gadeok:0 "[경상도] 가덕도 신공항"
