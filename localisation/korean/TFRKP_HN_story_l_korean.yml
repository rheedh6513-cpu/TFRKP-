 TFRKPHN_cab_name_shim_woo_jung:0 "심우정"
 TFRKPHN_cab_who_shim_woo_jung:0 "§G심우정§!"
 TFRKPHN_cab_eff_shim_woo_jung:0 "§Y심우정§!이 법무부 장관에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 안정도 §G+5%§!, 정치력 획득 §G+3%§!"
 TFRKPHN_cab_cf_shim_woo_jung:0 "§L\"우리 검찰은 민생범죄로부터 국민을 지키는데 온 힘을 다해야 할 것\"§!\n§g심우정, 검찰총장 취임사§!\n\n정말 §Y심우정§!을 법무부 장관에 임명하시겠습니까?\n임명하면: 안정도 §G+5%§!, 정치력 획득 §G+3%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
