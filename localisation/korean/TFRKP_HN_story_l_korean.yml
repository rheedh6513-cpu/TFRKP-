 TFRKPHN_cab_tt_lee_jung_sik:0 "§Y이정식§!\n고용노동부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 공장 산출량 §G+5%§!, 안정도 §G+3%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_lee_jung_sik:0 "출생: 1961년 대한민국 충청북도 제천\n\n이력: 대한민국의 고용노동부 장관\n이정식은 서울대학교 경제학과를 나왔습니다. 1986년 한국노동조합총연맹에 들어가 30년 넘게 일했습니다. 조사부장, 기획조정국장, 정책본부장을 거쳐 사무처장에 올랐습니다. 2004년부터 2년간 건설교통부 장관 정책보좌관을 지냈습니다. 2012년에는 최저임금위원회 근로자위원을 맡았습니다. 2017년에는 노동계 출신으로는 처음으로 노사발전재단 사무총장이 되었습니다.\n\n노동부 장관을 지낸 대통령이 노동계에서 30년을 보낸 사람을 불렀습니다. 이정식은 노동계의 말과 경영계의 말을 모두 알아듣습니다. 대통령이 그에게 바라는 것은 노사가 한 탁자에 다시 앉는 일입니다.\n\n§Y어록§!\n\"노사관계는 국가의 미래다.\"\n§g뉴스토마토 인터뷰§!"
 TFRKPHN_cab_name_lim_i_ja:0 "임이자"
 TFRKPHN_cab_who_lim_i_ja:0 "§G임이자§!"
 TFRKPHN_cab_eff_lim_i_ja:0 "§Y임이자§!가 고용노동부 장관에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 정치력 획득 §G+5%§!, 안정도 §G+3%§!"
 TFRKPHN_cab_cf_lim_i_ja:0 "§L\"민주노총은 현 체제를 인정하지 않고 있어요.\"§!\n§g임이자, 한경비즈니스 인터뷰§!\n\n정말 §Y임이자§!를 고용노동부 장관에 임명하시겠습니까?\n임명하면: 정치력 획득 §G+5%§!, 안정도 §G+3%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_lim_i_ja:0 "\n§Y어록§!\n\"민주노총은 현 체제를 인정하지 않고 있어요.\"\n§g한경비즈니스 인터뷰§!"
 TFRKPHN_cab_tt_lim_i_ja:0 "§Y임이자§!\n고용노동부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 정치력 획득 §G+5%§!, 안정도 §G+3%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_lim_i_ja:0 "출생: 1964년 대한민국 경상북도 예천\n\n이력: 대한민국의 고용노동부 장관\n임이자는 노동운동가 출신 정치인입니다. 한국노동조합총연맹 경기본부 상임부의장을 지냈고, 2014년 한국노총 부위원장이 되었습니다. 중앙노동위원회 근로자위원으로도 일했습니다. 2016년 제20대 국회에 비례대표로 들어왔고, 이후 경북 상주 문경에서 두 번 더 당선되었습니다.\n\n노동계 출신이면서 보수 정당의 3선 의원입니다. 이인제 대통령은 노동개혁 법안을 국회에서 통과시킬 장관을 찾았습니다.\n\n§Y어록§!\n\"민주노총은 현 체제를 인정하지 않고 있어요.\"\n§g한경비즈니스 인터뷰§!"
 TFRKPHN_cab_name_kwon_ki_seop:0 "권기섭"
 TFRKPHN_cab_who_kwon_ki_seop:0 "§G권기섭§!"
 TFRKPHN_cab_eff_kwon_ki_seop:0 "§Y권기섭§!이 고용노동부 장관에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 생산 효율 증가 속도 §G+5%§!, 공장 산출량 §G+3%§!"
 TFRKPHN_cab_cf_kwon_ki_seop:0 "§L\"하루빨리 현장의 위험요인을 살펴 선제적으로 안전보건관리체계를 개선해야 한다\"§!\n§g권기섭, 고용노동부 발표§!\n\n정말 §Y권기섭§!을 고용노동부 장관에 임명하시겠습니까?\n임명하면: 생산 효율 증가 속도 §G+5%§!, 공장 산출량 §G+3%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_kwon_ki_seop:0 "\n§Y어록§!\n\"하루빨리 현장의 위험요인을 살펴 선제적으로 안전보건관리체계를 개선해야 한다\"\n§g고용노동부 발표§!"
 TFRKPHN_cab_tt_kwon_ki_seop:0 "§Y권기섭§!\n고용노동부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 생산 효율 증가 속도 §G+5%§!, 공장 산출량 §G+3%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_kwon_ki_seop:0 "출생: 1969년 대한민국 경상북도 예천\n\n이력: 대한민국의 고용노동부 장관\n권기섭은 1992년 제36회 행정고시에 합격해 이듬해 노동부에서 공직을 시작했습니다. 2021년 노동정책실장과 산업안전보건본부장을 맡았습니다. 2022년 고용노동부 차관이 되었고, 2024년 경제사회노동위원회 위원장에 올랐습니다.\n\n노동부에서 30년을 일한 관료입니다. 대통령이 장관이던 시절에 그는 갓 들어온 사무관이었습니다.\n\n§Y어록§!\n\"하루빨리 현장의 위험요인을 살펴 선제적으로 안전보건관리체계를 개선해야 한다\"\n§g고용노동부 발표§!"
 TFRKPHN_cab_name_lee_ki_kweon:0 "이기권"
