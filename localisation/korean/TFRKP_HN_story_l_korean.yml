 TFRKPHN_mnd_armpeace_arms:0 "[육군] 무장평화론: 방산 공장 건설"
 TFRKPHN_mnd_armpeace_arms_desc:0 "평화는 힘으로 지킨다는 원칙에 따라 본토에 방산 공장을 늘립니다. 90일 뒤 §G군수공장 3개§!가 완공됩니다. 빈 건설 칸이 없으면 수도에 칸을 늘려 짓습니다."
 TFRKPHN_mnd_armpeace_dock:0 "[해군] 무장평화론: 조선소 건설"
 TFRKPHN_mnd_armpeace_dock_desc:0 "해군력의 바탕인 조선 능력을 키웁니다. 90일 뒤 해안 주에 §G조선소 2개§!가 완공됩니다. 빈 건설 칸이 없으면 해안 주 한 곳에 칸을 늘려 짓습니다."
 tfrkphn.204.t:0 "군 가산점 부활"
 tfrkphn.204.desc:0 "1999년 헌법재판소 결정으로 사라졌던 군 가산점 제도가 다시 시행됩니다. 성별과 관계없이 군 복무를 마친 모든 이에게 가산점을 줍니다. (이벤트 내용 작성 예정)"
 TFRKPHN_pdto_cambodia_commando:0 "캄보디아에 특공대 파견"
 TFRKPHN_pdto_cambodia_commando_desc:0 "PDTO의 일원으로서 캄보디아에 특수부대를 보냅니다. 범죄 조직 소탕과 현지 군 훈련을 돕습니다. 30일 뒤 장병들은 실전 경험을 안고 귀국합니다. 동남아에서 대한민국의 존재감이 커지면 PDTO 안의 목소리도 커집니다."
