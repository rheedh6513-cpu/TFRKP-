 TFRKPHN_kuk_tt_jpdc:0 "§Y제주개발공사§! (제주도 향토기업)\n§g설립 1995년 / 제주§!\n제주특별자치도가 세운 공기업으로, 생수 '제주삼다수'를 만듭니다.\n\n제주도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n제주 지지도 §G+5%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
