 TFRKPHN_cab_tt_jang_ho_jin:0 "§Y장호진§!\n국가안보실장\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 정치력 획득 §G+5%§!, 전쟁 지지도 §G+3%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_jang_ho_jin:0 "출생: 1961년 대한민국 서울특별시\n\n이력: 대한민국의 국가안보실장\n장호진은 직업 외교관입니다. 2008년 외교통상부 북미국장, 2010년 주캄보디아 대사를 지냈습니다. 2012년에는 대통령비서실 외교비서관으로 일했습니다. 2022년 주러시아 대사, 2023년 외교부 제1차관을 거쳐 2024년 1월 국가안보실장에 올랐습니다.\n\n이 자리를 이미 해 본 사람입니다. 이인제 대통령은 인수인계가 필요 없는 실장을 원했습니다.\n\n§Y어록§!\n\"러시아 측이 하기 나름이라는 것을 강조하고 싶다\"\n§gKBS 일요진단§!"
 TFRKPHN_cab_name_chun_young_woo:0 "천영우"
 TFRKPHN_cab_who_chun_young_woo:0 "§G천영우§!"
 TFRKPHN_cab_eff_chun_young_woo:0 "§Y천영우§!가 국가안보실장에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 전쟁 지지도 §G+6%§!, 사단 조직력 §G+3%§!"
 TFRKPHN_cab_cf_chun_young_woo:0 "§L\"북한은 정권이 무너지기 전에 핵을 포기할 것이다.\"§!\n§g천영우, 세계일보 인터뷰§!\n\n정말 §Y천영우§!를 국가안보실장에 임명하시겠습니까?\n임명하면: 전쟁 지지도 §G+6%§!, 사단 조직력 §G+3%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_chun_young_woo:0 "\n§Y어록§!\n\"북한은 정권이 무너지기 전에 핵을 포기할 것이다.\"\n§g세계일보 인터뷰§!"
 TFRKPHN_cab_tt_chun_young_woo:0 "§Y천영우§!\n국가안보실장\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 전쟁 지지도 §G+6%§!, 사단 조직력 §G+3%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_chun_young_woo:0 "출생: 1952년 대한민국 경상남도 밀양\n\n이력: 대한민국의 국가안보실장\n천영우는 2006년부터 북핵 6자회담 수석대표와 한반도평화교섭본부장을 맡았습니다. 이후 주영국 대사와 외교통상부 제2차관을 지냈습니다. 2010년부터 2013년까지 대통령실 외교안보수석비서관으로 일했습니다.\n\n북한과 직접 마주 앉아 본 협상가입니다. 이인제 대통령은 북한 체제를 바꾸겠다고 약속했고, 그 상대를 아는 사람이 필요했습니다.\n\n§Y어록§!\n\"북한은 정권이 무너지기 전에 핵을 포기할 것이다.\"\n§g세계일보 인터뷰§!"
 TFRKPHN_cab_name_lee_do_hoon:0 "이도훈"
 TFRKPHN_cab_who_lee_do_hoon:0 "§G이도훈§!"
 TFRKPHN_cab_eff_lee_do_hoon:0 "§Y이도훈§!이 국가안보실장에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 정치력 획득 §G+3%§!, 안정도 §G+3%§!"
 TFRKPHN_cab_cf_lee_do_hoon:0 "§L\"비핵화 협상의 기본적인 해결책은 제재가 아니다\"§!\n§g이도훈, 연세대 김대중도서관 세미나§!\n\n정말 §Y이도훈§!을 국가안보실장에 임명하시겠습니까?\n임명하면: 정치력 획득 §G+3%§!, 안정도 §G+3%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_lee_do_hoon:0 "\n§Y어록§!\n\"비핵화 협상의 기본적인 해결책은 제재가 아니다\"\n§g연세대 김대중도서관 세미나§!"
 TFRKPHN_cab_tt_lee_do_hoon:0 "§Y이도훈§!\n국가안보실장\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 정치력 획득 §G+3%§!, 안정도 §G+3%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_lee_do_hoon:0 "출생: 1962년 대한민국 부산광역시\n\n이력: 대한민국의 국가안보실장\n이도훈은 1985년 외무고시 19회로 외교관이 되었습니다. 2012년부터 2년간 외교부 북핵외교기획단장을 맡았습니다. 2016년 청와대 외교비서관, 2022년 외교부 제2차관을 지냈습니다. 2023년 7월 주러시아 대사로 나갔습니다.\n\n북핵과 러시아를 함께 다뤄 본 외교관입니다. 미국이 무너진 뒤 북쪽 국경 너머를 읽는 일이 더 중요해졌습니다.\n\n§Y어록§!\n\"비핵화 협상의 기본적인 해결책은 제재가 아니다\"\n§g연세대 김대중도서관 세미나§!"
 TFRKPHN_cab_name_park_cheol_hee:0 "박철희"
 TFRKPHN_cab_who_park_cheol_hee:0 "§G박철희§!"
 TFRKPHN_cab_eff_park_cheol_hee:0 "§Y박철희§!가 국가안보실장에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 연구 속도 §G+5%§!, 정치력 획득 §G+3%§!"
 TFRKPHN_cab_cf_park_cheol_hee:0 "§L\"한일 관계는 지뢰밭 같다.\"§!\n§g박철희, 서울신문 칼럼§!\n\n정말 §Y박철희§!를 국가안보실장에 임명하시겠습니까?\n임명하면: 연구 속도 §G+5%§!, 정치력 획득 §G+3%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_park_cheol_hee:0 "\n§Y어록§!\n\"한일 관계는 지뢰밭 같다.\"\n§g서울신문 칼럼§!"
 TFRKPHN_cab_tt_park_cheol_hee:0 "§Y박철희§!\n국가안보실장\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 연구 속도 §G+5%§!, 정치력 획득 §G+3%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_park_cheol_hee:0 "출생: 1963년 대한민국 충청북도 충주\n\n이력: 대한민국의 국가안보실장\n박철희는 일본 정치를 연구한 학자입니다. 서울대학교 국제대학원 교수로 일하며 일본연구소장과 국제대학원장을 맡았습니다. 대통령직 인수위원회 외교안보분과 전문위원과 국립외교원장을 지냈습니다. 2024년 주일본 대사에 임명되었습니다.\n\n충주 사람입니다. 이인제 대통령은 PDTO의 동맹국 일본을 연구해 온 학자를 곁에 두려 했습니다.\n\n§Y어록§!\n\"한일 관계는 지뢰밭 같다.\"\n§g서울신문 칼럼§!"
 tfrkphn.271.t:0 "주인 없는 방"
 tfrkphn.271.story:0 "청와대에는 석 달째 주인 없는 방이 있었다. 국가안보실장실이었다.\n\n아침 보고는 차장이 대신 올렸다. 차장은 보고를 마칠 때마다 같은 말을 덧붙였다. 실장이 와야 결정할 수 있는 일이 쌓이고 있다고 했다.\n\n이인제는 그날 저녁 인사 서류를 가져오게 했다."
