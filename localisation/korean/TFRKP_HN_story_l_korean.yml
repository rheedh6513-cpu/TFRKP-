 TFRKPHN_cab_tt_bang_moon_kyu:0 "§Y방문규§!\n산업통상자원부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 소비재 공장 §G-3%§!, 공장 산출량 §G+3%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_bang_moon_kyu:0 "출생: 1962년 대한민국 경기도 수원\n\n이력: 대한민국의 산업통상자원부 장관\n방문규는 1984년 행정고시에 합격했습니다. 기획재정부 예산실장과 제2차관, 보건복지부 차관을 지냈습니다. 2019년 한국수출입은행장이 되었습니다. 이후 국무조정실장을 거쳐 2023년 산업통상자원부 장관에 임명되었습니다.\n\n예산과 수출 금융을 모두 다뤄 본 관료입니다. 대통령은 전쟁 빚을 갚으면서 수출도 늘려야 했습니다.\n\n§Y어록§!\n\"우리 경제의 혁신성장을 선도해 나가겠다\"\n§g수출입은행장 취임식§!"
