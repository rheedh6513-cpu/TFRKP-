 NK3_TFRKPHN_ibuk5do_DEF:0 "이북5도위원회"
 NK3_TFRKPHN_ibuk5do_ADJ:0 "이북5도"
 TFRKPHN_free_joseon_party:0 "자유조선"
 TFRKPHN_free_joseon_party_long:0 "자유조선"
 TFRKPHN_ibuk5do_party:0 "대한민국 정부"
 TFRKPHN_ibuk5do_party_long:0 "대한민국 정부"
 TFRKP_TFRKPHN_SE_NK_CIVIL_WAR:0 "The Reunion Marching Song"
 TFRKPHN_super_events:0 "홍낙 슈퍼이벤트"
 TFRKPHN_SE_NK_CIVIL_WAR:0 "북한 내전"
 TFRKPHN_SE_NK_CIVIL_WAR_D:0 "\"뭉치면 살고 흩어지면 죽습니다! 북한 동포를 구출하고 국토를 완수하는 길은 북진뿐입니다.\"\n-이승만"
 TFRKPHN_SE_NK_CIVIL_WAR_A:0 "한반도가 불탄다"
 TFRKPHN_tae_yeongho_char_desc:0 "태영호는 북한 외교관 출신 정치인입니다. 주영국 북한대사관 공사로 일하다 2016년 가족과 함께 대한민국으로 망명했습니다. 망명 뒤에는 북한 체제의 실상을 알리는 데 앞장섰습니다. 2020년 서울 강남구 갑에서 국회의원에 당선되었습니다. 탈북민 출신 첫 지역구 국회의원입니다.\n\n그는 평양의 권력층을 누구보다 가까이에서 지켜보았습니다. 이제 이북5도위원회의 깃발 아래 고향 땅으로 돌아갑니다. 평양을 떠날 때 그는 돌아올 날을 기약하지 못했습니다."
 TFRKPHN_adrian_hong_chang_char:0 "홍으뜸"
 TFRKPHN_adrian_hong_chang_char_desc:0 "홍으뜸은 자유조선(천리마민방위)의 중요 인물 중 하나입니다. 그는 본래 에이드리언 홍 창이라는 이름으로 알려졌습니다. 해방된 조선을 위해 싸우기로 하면서 한국식 이름인 홍으뜸으로 바꾸었습니다. 미국에서 대학을 다니던 시절 북한 인권 문제에 관심을 가졌습니다. 재학 중 북한 인권단체 링크(LiNK)를 함께 세웠습니다.\n\n오랫동안 그는 북한 바깥에서 북녘 동포들의 자유를 외쳐 왔습니다. 김정은이 죽자 그는 서북부로 들어가 자유조선군의 깃발을 올렸습니다."
 TFRKPHN_peoples_liberation_war:0 "진실된 조국해방전쟁"
 TFRKPHN_peoples_liberation_war_desc:0 "북한은 70년 넘게 6.25 전쟁을 \"조국해방전쟁\"이라 불러 왔습니다. 그러나 그 전쟁은 해방을 남기지 않았습니다. 남은 것은 김씨 일가의 세습 독재와 굶주림, 그리고 수용소였습니다. 김정은이 죽자 사람들이 자유조선의 깃발 아래 모여들었습니다. 이들은 이 싸움이야말로 진실된 조국해방전쟁이라 외칩니다.\n\n공장 노동자와 협동농장의 농민이 총을 들었습니다. 탈영한 인민군 병사들도 전선으로 향하고 있습니다. 해방된 마을마다 김씨 일가의 초상화가 내려집니다. 사람들은 처음으로 자유선거와 시장, 남녘과의 통일을 입에 올립니다."
 TFRKPHN_pdto_bombing:0 "PDTO 연합국 폭격"
 TFRKPHN_pdto_bombing_desc:0 "김정은이 쓰러진 그날 밤부터 폭격이 시작되었습니다. PDTO 연합국은 공식적으로 어떠한 작전도 인정하지 않습니다. 그러나 평양과 원산, 함흥의 군수공장과 지휘시설은 매일 밤 폭격에 불타고 있습니다. 낡은 방공망은 하늘을 지키지 못했습니다. 공장의 기계는 멈춰 섰습니다. 전선의 부대들은 보급과 명령이 끊긴 채 흔들리고 있습니다.\n\n평양의 권력자들은 서로 싸우느라 하늘을 막을 여력이 없습니다. 폭격이 길어질수록 내전의 승자가 물려받을 공장은 줄어듭니다."
 TFRKPHN_rok_army_support:0 "대한민국 국군의 지원"
 TFRKPHN_rok_army_support_desc:0 "남녘의 대한민국 정부가 군대를 보냈습니다. 국군은 자유로운 조선반도를 위해 이북5도위원회와 함께 싸우고 있습니다. 휴전선을 넘어온 국군 장병들은 북녘 동포들과 같은 참호를 지킵니다. 자유조선을 위해 무기와 보급, 정보를 나눕니다.\n\n실향민들은 70년 넘게 북녘 땅을 잃어버린 고향이라 불렀습니다. 그 실향민의 아들과 손자들이 지금 국군 군복을 입고 북으로 올라갑니다."
 tfrkphn.252.t:0 "이북5도위원회"
 tfrkphn.252.desc:0 "북한 내전이 시작된 지 사흘. 평양에 맞선 자유조선군이 스스로를 이북5도위원회의 이름 아래 두겠다고 선언했다.\n\n이북5도위원회는 대한민국의 정부 기구다. 헌법이 대한민국 영토로 정한 황해, 평안남북, 함경남북 다섯 도를 맡아 왔다. 70년 넘게 이름뿐이던 그 도지사들의 자리가 마침내 실제 땅을 얻게 되었다. 위원회의 수장으로는 북한 외교관 출신의 태영호가 추대되었다.\n\n같은 날, 중국은 평양 정권을 사실상 보호국으로 삼았다."
 tfrkphn.252.a:0 "북녘 땅에 태극기가 오른다."
 TFRKPHN_ibuk5do_tt:0 "§Y자유조선군§!이 §Y이북5도위원회§!가 되어 §Y대한민국의 괴뢰국§!이 됩니다.\n지도자: §Y태영호§! (집권: §Y권위주의 민주§!)\n국민정신 §Y대한민국 국군의 지원§!: 사단 공격 §G+20%§!, 방어 §G+20%§!, 조직력 §G+10%§!\n§R북한§!은 §R중국의 괴뢰국§!이 됩니다."
 tfrkphn.253.t:0 "대아대전 발발"
 tfrkphn.253.desc:0 "한반도의 내전이 마침내 대한민국과 중화인민공화국의 정면충돌로 번졌다.\n\n북한의 두 정권 뒤에 선 서울과 베이징이 서로에게 총구를 겨누었다. 일본과 태평양방위조약기구 회원국들이 전쟁에 뛰어들고 있다. 중국이 이끄는 동아시아방위구상 회원국들도 뒤를 따른다."
 tfrkphn.253.a:0 "아시아가 불탄다."
 tfrkphn.254.t:0 "북한 내전"
 tfrkphn.254.desc:0 "경애하는 지도자가 쓰러진 지 이레. 평양은 끝내 하나로 뭉치지 못했다.\n\n당 조직을 쥔 김여정이 평양에서 정통 정부를 선포했다. 군부를 장악한 최룡해는 동북부의 부대를 이끌고 평양의 명령을 거부했다. 서북부에서는 체제에 등을 돌린 장교와 주민들이 자유조선군의 깃발을 올렸다. 평양 한복판에서는 시민과 일부 군인이 인민봉기위원회를 세웠다.\n\n조선은 넷으로 갈라졌다. 누구도 먼저 물러설 뜻을 보이지 않는다."
 tfrkphn.254.a:0 "무력 충돌만이 유일한 해법이다."
