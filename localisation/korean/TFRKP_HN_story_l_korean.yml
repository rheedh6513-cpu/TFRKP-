 TFRKPHN_cab_q_hong_yong_pyo:0 "\n§Y어록§!\n\"이제 광복 70년을 맞아 한강의 기적을 넘어 한반도의 기적을 만들어야 할 때\"\n§g통일박람회 개막사§!"
 TFRKPHN_cab_tt_hong_yong_pyo:0 "§Y홍용표§!\n통일부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 정치력 획득 §G+5%§!, 안정도 §G+3%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_hong_yong_pyo:0 "출생: 1964년 대한민국 서울특별시\n\n이력: 대한민국의 통일부 장관\n홍용표는 통일연구원 연구위원을 거쳐 2001년 한양대학교 교수가 되었습니다. 2013년 대통령비서실 통일비서관으로 들어갔습니다. 2015년 3월부터 2017년 7월까지 통일부 장관을 지냈습니다.\n\n청와대와 통일부를 모두 겪은 사람입니다. 이인제 대통령은 통일 정책을 부처 사이에서 조율할 장관을 원했습니다.\n\n§Y어록§!\n\"이제 광복 70년을 맞아 한강의 기적을 넘어 한반도의 기적을 만들어야 할 때\"\n§g통일박람회 개막사§!"
 TFRKPHN_cab_name_ryoo_kihl_jae:0 "류길재"
 TFRKPHN_cab_who_ryoo_kihl_jae:0 "§G류길재§!"
 TFRKPHN_cab_eff_ryoo_kihl_jae:0 "§Y류길재§!가 통일부 장관에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 안정도 §G+6%§!"
 TFRKPHN_cab_cf_ryoo_kihl_jae:0 "§L\"작년부터 북한이 하는 걸 보면 이 사람들하고 신뢰가 쌓일 수 있을까하는 생각이 든다\"§!\n§g류길재, 기자 간담회§!\n\n정말 §Y류길재§!를 통일부 장관에 임명하시겠습니까?\n임명하면: 안정도 §G+6%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_ryoo_kihl_jae:0 "\n§Y어록§!\n\"작년부터 북한이 하는 걸 보면 이 사람들하고 신뢰가 쌓일 수 있을까하는 생각이 든다\"\n§g기자 간담회§!"
 TFRKPHN_cab_tt_ryoo_kihl_jae:0 "§Y류길재§!\n통일부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 안정도 §G+6%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_ryoo_kihl_jae:0 "출생: 1959년 대한민국 서울특별시\n\n이력: 대한민국의 통일부 장관\n류길재는 1987년 경남대학교 극동문제연구소에서 연구를 시작했습니다. 1998년 북한대학원 교수가 되었습니다. 2013년 3월 통일부 장관에 임명되었습니다.\n\n북한을 오래 연구한 학자입니다. 대통령은 통일 뒤 북한 주민의 삶을 설계할 사람으로 그를 골랐습니다.\n\n§Y어록§!\n\"작년부터 북한이 하는 걸 보면 이 사람들하고 신뢰가 쌓일 수 있을까하는 생각이 든다\"\n§g기자 간담회§!"
