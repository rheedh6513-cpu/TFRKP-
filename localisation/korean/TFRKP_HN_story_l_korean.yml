 TFRKPHN_cab_tt_lee_dong_phil:0 "§Y이동필§!\n농림축산식품부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 안정도 §G+6%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_lee_dong_phil:0 "출생: 1955년 대한민국 경상북도 의성\n\n이력: 대한민국의 농림축산식품부 장관\n이동필은 1980년 한국농촌경제연구원에 들어가 2011년 원장이 되었습니다. 2013년부터 2016년까지 농림축산식품부 장관을 지냈습니다. 2018년부터는 경상북도지사의 농촌살리기 정책자문관으로 일했습니다.\n\n농촌을 연구했고 장관도 해 본 사람입니다. 대통령은 농민 단체와 말이 통할 장관을 원했습니다.\n\n§Y어록§!\n\"예산은 아쉽지만 알뜰하게 쓰겠다.\"\n§g이투데이 인터뷰§!"
 TFRKPHN_cab_name_lee_yang_soo:0 "이양수"
 TFRKPHN_cab_who_lee_yang_soo:0 "§G이양수§!"
 TFRKPHN_cab_eff_lee_yang_soo:0 "§Y이양수§!가 농림축산식품부 장관에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 정치력 획득 §G+6%§!"
 TFRKPHN_cab_cf_lee_yang_soo:0 "§L\"여당이 타작물 재배 예산을 획기적으로 확대하는 등의 대안을 제시했다\"§!\n§g이양수, 국회 기자회견§!\n\n정말 §Y이양수§!를 농림축산식품부 장관에 임명하시겠습니까?\n임명하면: 정치력 획득 §G+6%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_lee_yang_soo:0 "\n§Y어록§!\n\"여당이 타작물 재배 예산을 획기적으로 확대하는 등의 대안을 제시했다\"\n§g국회 기자회견§!"
 TFRKPHN_cab_tt_lee_yang_soo:0 "§Y이양수§!\n농림축산식품부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 정치력 획득 §G+6%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_lee_yang_soo:0 "출생: 1967년 대한민국 강원도 속초\n\n이력: 대한민국의 농림축산식품부 장관\n이양수는 2016년 강원 속초 고성 양양에서 제20대 국회의원에 당선되어 내리 세 번 당선되었습니다. 국회 농림축산식품해양수산위원회에서 간사를 맡았습니다. 국민의힘 원내수석부대표를 지냈고, 2024년 12월 사무총장이 되었습니다.\n\n국회 농해수위에서 오래 일한 의원입니다. 대통령은 농정 예산을 국회에서 따낼 사람을 골랐습니다.\n\n§Y어록§!\n\"여당이 타작물 재배 예산을 획기적으로 확대하는 등의 대안을 제시했다\"\n§g국회 기자회견§!"
 tfrkphn.272.t:0 "쌀값"
 tfrkphn.272.story:0 "농민 단체가 광화문에 볏가마를 쌓았다. 전쟁이 끝났는데 쌀값은 왜 그대로냐고 물었다.\n\n답할 사람이 없었다. 농림축산식품부 장관 자리가 비어 있었다. 차관이 나가 마이크를 잡았지만 야유만 돌아왔다.\n\n이인제는 창밖을 한참 보다가 비서실장을 불렀다."
