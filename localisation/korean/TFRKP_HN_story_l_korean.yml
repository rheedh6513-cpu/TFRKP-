 TFRKPHN_cab_ttd_kim_gi_woong:0 "출생: 1961년 대한민국 인천광역시\n\n이력: 대한민국의 통일부 장관\n김기웅은 1990년 국토통일원에 특채로 들어왔습니다. 통일부에서 남북회담 업무를 오래 맡았고 남북회담본부장을 지냈습니다. 2022년 대통령비서실 통일비서관을 거쳐 통일부 차관이 되었습니다. 2024년 대구 중구 남구에서 제22대 국회의원에 당선되었습니다.\n\n남북회담 실무를 오래 맡은 관료입니다. 대통령은 회담의 기술을 아는 장관을 원했습니다.\n\n§Y어록§!\n\"같은 합의를 50년째 되풀이하고 있어요.\"\n§g국회 외교통일위원회§!"
