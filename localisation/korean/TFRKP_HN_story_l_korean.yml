 TFRKPHN_kuk_p_jeju2nd_tt:0 "§Y비행장 +2§!\n제주 지지도 §G+3%§!"
 TFRKPHN_kuk_p_jejuport:0 "[제주도] 제주 신항만"
 TFRKPHN_kuk_p_jejuport_desc:0 "크루즈와 화물선이 함께 드나드는 제주 신항만을 건설합니다."
 TFRKPHN_kuk_p_jejuport_tt:0 "§Y해군 기지 +1§!, §Y기반시설 +1§!\n제주 지지도 §G+4%§!"
