 TFRKPHN_kuk_regtt_gyeonggi:0 "§Y경기도§! 건설사업\n\n,  GTX 광역급행철도\n,  3기 신도시\n,  용인 반도체 클러스터\n\n누르면 아래에 이 도의 건설사업이 보입니다."
 TFRKPHN_kuk_regtt_chungcheong:0 "§Y충청도§! 건설사업\n\n,  대전 도시철도 2호선 트램\n,  충청권 광역급행철도(CTX)\n,  세종 행정수도 완성\n\n누르면 아래에 이 도의 건설사업이 보입니다."
 TFRKPHN_kuk_regtt_jeolla:0 "§Y전라도§! 건설사업\n\n,  새만금 개발\n,  광주 도시철도 2호선\n,  서남권 반도체 제2클러스터\n\n누르면 아래에 이 도의 건설사업이 보입니다."
 TFRKPHN_kuk_regtt_gangwon:0 "§Y강원도§! 건설사업\n\n,  동해북부선 철도\n,  춘천~속초 동서고속화철도\n,  원주 의료기기 클러스터\n\n누르면 아래에 이 도의 건설사업이 보입니다."
 TFRKPHN_kuk_regtt_gyeongsang:0 "§Y경상도§! 건설사업\n\n,  가덕도 신공항\n,  대구경북 통합신공항\n,  부울경 광역철도\n\n누르면 아래에 이 도의 건설사업이 보입니다."
 TFRKPHN_kuk_regtt_jeju:0 "§Y제주도§! 건설사업\n\n,  제주 제2공항\n,  제주 신항만\n,  제주 그린수소 단지\n\n누르면 아래에 이 도의 건설사업이 보입니다."
 TFRKPHN_kuk_idea:0 "대한민국 6도 균형발전"
 TFRKPHN_kuk_idea_desc:0 "서울만이 아니라 경기와 강원, 충청과 전라, 경상과 제주가 함께 자랐습니다. 나라 국 자의 네 귀퉁이가 고르게 채워졌습니다."
 TFRKPHN_kuk_idea_tt:0 "국민정신 §Y대한민국 6도 균형발전§! 획득"
 TFRKPHN_kuk_center_tt:0 "§Y국 - 나라 국§!\n\n여섯 도의 삼각형을 모두 채우면 누를 수 있습니다.\n누르면 국민정신 §Y대한민국 6도 균형발전§!을 얻습니다.\n\n,  건물 건설 속도 §G+15%§!\n,  기반시설 건설 속도 §G+20%§!\n,  개인 가치 변동치 §G+10%§!\n,  사업 가치 변동치 §G+10%§!\n,  기타 비용 §G-15%§!"
 TFRKPHN_corp_tax_cut:0 "법인세 인하"
 TFRKPHN_corp_tax_cut_desc:0 "법인세 최고세율을 낮춰 기업이 이 땅에 남을 이유를 만듭니다."
 tfrkphn.230.t:0 "여론조사 공표 재개"
 tfrkphn.230.desc:0 "대만해협의 포성이 멎은 지 며칠 뒤였다. 중앙선거여론조사심의위원회가 전시 여론조사 공표 금지를 해제했다.\n\n여론조사 회사들은 기다렸다는 듯 전화를 돌리기 시작했다. 전쟁 동안 묻어 두었던 물가, 일자리, 집값 이야기가 다시 숫자로 쏟아져 나온다.\n\n전쟁에서는 이겼지만, 이제부터는 매주 발표되는 숫자와 싸워야 한다."
 tfrkphn.230.a:0 "이제 다시 숫자와 싸울 시간이다."
 TFRKPHN_poll_ban_lift_tt:0 "§Y여론조사 공표 금지§!가 풀린다.\n2주마다 오는 §R지역 지지도 하락§!과 '전국 지지도 하락' 미션이 다시 시작된다."
 TFRKPHN_term4_tt:0 "§Y개정 헌법 제70조 적용§!: 새 대통령의 임기는 §Y4년§!이며, 다음 대선에 §Y한 번 더§! 출마할 수 있습니다.\n(헌법 제128조 제2항에 따라 개헌을 제안한 홍준표 정부에는 효력이 없고, 이번 정권부터 적용됩니다)"
 TFRKPHN_term5_tt:0 "§Y헌법 제70조§!: 새 대통령의 임기는 §Y5년 단임§!이며, 다음 대선에는 출마할 수 없습니다."
 TFRKPHN_term2_tt:0 "현직 대통령이 §Y두 번째 4년 임기§!를 시작합니다. 개정 헌법 제70조에 따라 다음 대선에는 출마할 수 없습니다."
 tfrkphn.241.t:0 "대통령 선거: 현직 재선"
 tfrkphn.241.desc:0 "개정 헌법 제70조에 따라 치러진 첫 중임 대선이 끝났다.\n\n4년 전과 달랐다. 이번 선거에는 현직 대통령 [Root.GetLeader]의 이름이 다시 투표용지에 올랐다. 선거는 사실상 지난 4년에 대한 국민의 평가였다. 그리고 국민은 한 번 더 기회를 주기로 했다.\n\n개표가 끝난 새벽, 당선 확정 소식이 전해졌다. 이제 남은 임기는 마지막 4년이다. 다음 대선에는 다시 나설 수 없다."
 tfrkphn.241.a:0 "4년 더. 그리고 그것이 마지막이다."
 tfrkphn.245.t:0 "대통령 선거: 이인제 당선"
 tfrkphn.245.desc:0 "현직 대통령 [Root.GetLeader]는 헌법에 따라 이번 대선에 나설 수 없었다.\n\n보수 진영의 깃발은 이인제가 이어받았다. 홍준표가 걸어온 길을 같이 걸어가겠다던 그가 다시 전면에 섰다. 선거 내내 그는 지난 정부의 성과를 지키고 이어가겠다고 말했다.\n\n개표가 끝난 새벽, 이인제의 당선이 확정되었다. 보수 정권은 이어지고, 대통령은 바뀐다."
 tfrkphn.245.a:0 "같은 길을, 다시 걷는다."
 tfrkphn.246.t:0 "대통령 선거: 오세훈 당선"
 tfrkphn.246.desc:0 "현직 대통령 [Root.GetLeader]는 헌법에 따라 이번 대선에 나설 수 없었다.\n\n보수 진영의 깃발은 오세훈이 이어받았다. 전임자들과는 다른 새로운 길을 찾겠다던 그가 다시 전면에 섰다. 선거 내내 그는 변화와 쇄신을 말했다.\n\n개표가 끝난 새벽, 오세훈의 당선이 확정되었다. 보수 정권은 이어지고, 대통령은 바뀐다."
 tfrkphn.246.a:0 "새로운 길을 찾아 나선다."
