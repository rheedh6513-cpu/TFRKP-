 tfrkphn.415.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 공군중장 김형수가 공군작전사령관에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"적기가 뜨면 몇 분 안에 결정해야 하는 자리입니다. 평소에 판단 기준을 세워 두세요.\"\n\n김형수 중장은 경례로 답했다."
