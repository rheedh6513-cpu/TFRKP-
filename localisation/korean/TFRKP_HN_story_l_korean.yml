 TFRKPHN_kuk_tt_raon:0 "§Y라온건설§! (제주도 건설사)\n§g설립 1986년 / 제주 한경면§!\n제주를 기반으로 한 건설사로, 아파트 브랜드 '라온프라이빗'을 짓습니다.\n\n제주도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n제주 지지도 §G+3%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_jpdc:0 "[제주도] 제주개발공사"
