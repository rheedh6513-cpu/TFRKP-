 TFRKPHN_cab_cf_bang_ha_nam:0 "§L\"새 정부가 국민행복, 희망의 새 시대를 열기 위해 고용률 70% 달성, 중산층 70% 복원을 약속했다\"§!\n§g방하남, 고용노동부 장관 취임식§!\n\n정말 §Y방하남§!을 고용노동부 장관에 임명하시겠습니까?\n임명하면: 연구 속도 §G+3%§!, 안정도 §G+5%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_bang_ha_nam:0 "\n§Y어록§!\n\"새 정부가 국민행복, 희망의 새 시대를 열기 위해 고용률 70% 달성, 중산층 70% 복원을 약속했다\"\n§g고용노동부 장관 취임식§!"
 TFRKPHN_cab_tt_bang_ha_nam:0 "§Y방하남§!\n고용노동부 장관\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 연구 속도 §G+3%§!, 안정도 §G+5%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_bang_ha_nam:0 "출생: 1957년 대한민국 전라남도 완도\n\n이력: 대한민국의 고용노동부 장관\n방하남은 한국노동연구원에서 일한 연구자입니다. 2012년 한국연금학회 회장을 지냈습니다. 2013년 3월부터 2014년 7월까지 고용노동부 장관으로 일했습니다. 2015년에는 한국노동연구원 원장이 되었습니다.\n\n일자리와 연금을 연구한 학자입니다. 대통령은 고용보험을 다시 설계할 사람으로 그를 떠올렸습니다.\n\n§Y어록§!\n\"새 정부가 국민행복, 희망의 새 시대를 열기 위해 고용률 70% 달성, 중산층 70% 복원을 약속했다\"\n§g고용노동부 장관 취임식§!"
 tfrkphn.273.t:0 "빈 의자"
 tfrkphn.273.story:0 "노사정 회의가 열렸다. 노동계 대표가 왔고 경영계 대표가 왔다. 정부 자리만 비어 있었다.\n\n회의는 20분 만에 끝났다. 노동계 대표는 나가면서 기자들에게 한마디 했다. 장관도 없는 정부와 무슨 대타협이냐고 했다.\n\n그 말이 저녁 뉴스에 나갔다. 노동부 장관을 지낸 대통령에게는 아픈 말이었다."
