 TFRKPHN_lee_north_category:0 "대북 특수작전"
 TFRKPHN_lee_north_category_desc:0 "북한 체제의 변화는 대한민국이 이끈다. 그 첫걸음은 체제의 정점을 무너뜨리는 일이다.\n\n김정은 참수 준비: §Y[?TFRKPHN_kju_prep|0]%§!\n준비가 §Y100%§!가 되면 중점 '백두를 보네'를 찍을 수 있습니다."
 TFRKPHN_kju_op_done_tt:0 "§R김정은이 제거됩니다.§!\n북한에 권력 공백이 생기고, 곧 §R내전§!이 일어납니다."
 tfrkphn.250.t:0 "경애하는 지도자 피격!"
 tfrkphn.250.desc:0 "참으로 암흑의 날이다! 경애하는 지도자께서 현지지도 도중 괴한의 습격을 받고 끝내 서거하셨다. 호위사령부는 범인의 정체조차 밝혀내지 못했다. 열흘간의 애도 기간이 선포되었지만, 평양의 권력자들은 벌써 서로를 노려보고 있다."
 tfrkphn.250.a:0 "누가 권력을 잡을 것인가?"
 tfrkphn.251.t:0 "김정은 암살"
 tfrkphn.251.desc:0 "오늘 새벽 조선중앙통신이 특별 방송을 내보냈습니다. 북한 최고지도자 김정은 국무위원장이 \"원쑤들의 비렬한 습격으로 서거하였다\"는 발표였습니다. 조선중앙통신은 사건의 장소와 시각, 습격의 주체를 밝히지 않았습니다. 조선중앙텔레비전은 부고 방송을 하루 종일 되풀이했습니다. 검은 상복을 입은 아나운서는 울먹이며 부고를 읽었습니다.\n\n부고가 나간 지 몇 시간 만에 평양 시내 곳곳에서 총성이 들렸다는 증언이 잇따랐습니다. 정보 당국은 쿠데타 시도의 정황을 포착했다고 밝혔습니다. 박정천 당 중앙군사위원회 부위원장이 이끄는 일부 군부의 움직임입니다. 이들은 김여정 부부장과 최룡해 상임위원장 등을 제거하려 했습니다. 쿠데타는 실패로 끝난 것으로 보이며, 박정천의 생사는 확인되지 않고 있습니다.\n\n혼란은 지방으로 번졌습니다. 자강도와 함경도에서는 지역 부대가 평양의 명령을 거부했다는 소식이 들어왔습니다. 황해도와 강원도에서는 주민들이 무기고를 습격해 무장했다는 보도가 이어집니다. 평양 한복판에서도 시민들과 일부 수도방위 부대가 거리로 나섰다는 미확인 보도가 나옵니다. 북한 전역이 무장 반란에 빠져들고 있다는 관측이 커지고 있습니다.\n\n경계가 무너진 비무장지대를 넘어 탈북민이 하루에도 수백 명씩 내려오고 있습니다. 군 당국은 접경 지역에 임시 수용시설을 긴급히 설치하고 있습니다. 강을 건너 중국으로 향하는 행렬도 끊이지 않습니다. 단둥과 연길 일대의 국경 검문소는 사실상 마비되었습니다.\n\n이인제 대통령은 국가안전보장회의를 마친 뒤 직접 기자회견장에 나섰습니다. 대통령은 \"김영삼 정부 때부터 고대해 온 북한 정권 붕괴의 시작\"이라고 발표했습니다. 사건에 정부가 관여했느냐는 질문에는 끝내 답하지 않았습니다. 같은 시각 휴전선 일대의 국군이 북진을 시작했다는 보도가 일각에서 나왔습니다. 국방부는 \"확인해 줄 수 없다\"는 입장만 되풀이하고 있습니다.\n\n평양과 원산 일대에서는 정체불명의 폭발음이 잇따랐다는 목격담이 나옵니다. PDTO 연합국 공군이 군수공장과 지휘시설을 폭격하기 시작했다는 소문도 퍼지고 있습니다. PDTO 측은 이에 대해 어떠한 공식 입장도 내놓지 않았습니다.\n\n중국 외교부는 \"조선의 안정과 주권을 지지한다\"는 짧은 성명을 냈습니다. 국경 경비도 대폭 강화했습니다. 김씨 일가의 통치는 70여 년 만에 끊겼습니다. 후계자가 누구인지는 아직 아무도 발표하지 않았습니다."
 tfrkphn.251.a:0 "통일의 날이 머지않았다."
 tfrkphn.251.b:0 "한반도에 폭풍이 다가온다."
 tfrkphn.251.c:0 "남조선 괴뢰들의 소행이다!"
 TFRKPHN_kju_prep_1:0 "김정은 참수 준비: 지도부 동선 파악"
 TFRKPHN_kju_prep_1_desc:0 "북한 최고지도자의 동선과 경호 체계를 낱낱이 파악한다."
 TFRKPHN_kju_prep_2:0 "김정은 참수 준비: 침투 경로 확보"
 TFRKPHN_kju_prep_2_desc:0 "휴전선 너머로 들어갈 길을 연다. 바다로, 하늘로, 땅으로."
 TFRKPHN_kju_prep_3:0 "김정은 참수 준비: 특수임무부대 훈련"
 TFRKPHN_kju_prep_3_desc:0 "단 한 번의 기회를 위해 같은 훈련을 수백 번 되풀이한다."
 TFRKPHN_kju_prep_4:0 "김정은 참수 준비: 작전 최종 승인"
 TFRKPHN_kju_prep_4_desc:0 "모든 준비가 끝났다. 남은 것은 대통령의 결단뿐이다."
 TFRKPHN_kju_prep_add_tt:0 "김정은 참수 준비 §G+25%§!"
 TFRKPHN_kju_prep_req_tt:0 "결정 탭 §Y대북 특수작전§!의 김정은 참수 준비가 §Y100%§!"
