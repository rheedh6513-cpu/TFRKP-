 TFRKPHN_trait_former_judge:0 "법관 출신"
 TFRKPHN_trait_police_intelligence:0 "경찰 정보통"
 TFRKPHN_trait_field_and_staff:0 "야전과 참모를 거친 군인"
 TFRKPHN_lee_cabinet_category:0 "기타 장관 임명"
 TFRKPHN_lee_cabinet_category_desc:0 "내각에는 총리와 다섯 장관 말고도 자리가 많다. 이인제 대통령은 그 자리의 주인도 직접 고른다."
 TFRKPHN_cab_cho_tae_yong_desc:0 "출생: 1956년 대한민국 서울특별시\n\n이력: 대한민국의 국가안보실장\n조태용은 정통 외교관입니다. 외교부 제1차관과 국가안보실 제1차장을 지냈습니다. 대미 관계와 대북 안보 문제에 밝다는 평가를 받습니다. 외교와 안보의 요직을 두루 거친 전략가로 꼽힙니다.\n\n미국이 무너진 뒤 대한민국 외교는 기댈 곳을 잃었습니다. 이인제 대통령은 외교와 안보를 함께 다뤄 본 사람을 곁에 두기로 했습니다. 조태용은 먼저 PDTO 동맹국과의 공조부터 다져야 합니다. 그다음이 더 어렵습니다. 주변국이 한반도 통일을 받아들이게 만들어야 합니다."
 TFRKPHN_cab_kim_tae_heum_desc:0 "출생: 1962년 대한민국 충청남도 보령\n\n이력: 대한민국의 농림축산식품부 장관\n김태흠은 국회의원 보좌관으로 정치를 시작했습니다. 김종필 국무총리 시절 총리실에서 정책담당관과 공보과장으로 일했습니다. 이완구 충남지사 아래에서는 정무부지사를 맡아 2006년 금산세계인삼엑스포를 치렀습니다. 제19대 총선부터 충남 보령 서천에서 내리 세 번 당선되었습니다. 당 최고위원과 국회 농림축산식품해양수산위원장을 지냈습니다. 2021년 원내대표 경선에서는 김기현에게 네 표 차이로 뒤져 2위를 했습니다.\n\n이인제 대통령은 농촌을 지역구로 둔 사람에게 농정을 맡겼습니다. 김태흠은 국회에서 농림축산식품해양수산위원회를 이끌었습니다. 전쟁을 치르며 흔들린 먹거리 수급이 그의 손에 넘어왔습니다."
 TFRKPHN_cab_lee_jung_sik_desc:0 "출생: 1961년 대한민국 충청북도 제천\n\n이력: 대한민국의 고용노동부 장관\n이정식은 서울대학교 경제학과를 나왔습니다. 1986년 한국노동조합총연맹에 들어가 30년 넘게 일했습니다. 조사부장, 기획조정국장, 정책본부장을 거쳐 사무처장에 올랐습니다. 2004년부터 2년간 건설교통부 장관 정책보좌관을 지냈습니다. 2012년에는 최저임금위원회 근로자위원을 맡았습니다. 2017년에는 노동계 출신으로는 처음으로 노사발전재단 사무총장이 되었습니다.\n\n노동부 장관을 지낸 대통령이 노동계에서 30년을 보낸 사람을 불렀습니다. 이정식은 노동계의 말과 경영계의 말을 모두 알아듣습니다. 대통령이 그에게 바라는 것은 노사가 한 탁자에 다시 앉는 일입니다."
 TFRKPHN_cab_post_nso:0 "국가안보실장"
 TFRKPHN_cab_head_nso:0 "§Y국가안보실장§! 후보"
 TFRKPHN_cab_name_cho_tae_yong:0 "조태용"
 TFRKPHN_cab_who_cho_tae_yong:0 "§G조태용§!"
 TFRKPHN_cab_eff_cho_tae_yong:0 "§Y조태용§!이 국가안보실장에 임명됩니다.\n§Y이인제 정부의 국정§!에 더해짐: 전쟁 지지도 §G+5%§!, 정치력 획득 §G+3%§!"
 TFRKPHN_cab_cf_cho_tae_yong:0 "§L\"문제를 삼는다면 북한만 문제 삼겠죠.\"§!\n§g조태용, 머니투데이 전화 인터뷰§!\n\n정말 §Y조태용§!을 국가안보실장에 임명하시겠습니까?\n임명하면: 전쟁 지지도 §G+5%§!, 정치력 획득 §G+3%§!\n§R한번 임명하면 임기가 끝날 때까지 바꿀 수 없습니다.§!"
 TFRKPHN_cab_q_cho_tae_yong:0 "\n§Y어록§!\n\"문제를 삼는다면 북한만 문제 삼겠죠.\"\n§g머니투데이 전화 인터뷰§!"
 TFRKPHN_cab_tt_cho_tae_yong:0 "§Y조태용§!\n국가안보실장\n\n임명 비용: £pol_power §Y25§!\n§Y이인제 정부의 국정§!에 더해짐: 전쟁 지지도 §G+5%§!, 정치력 획득 §G+3%§!\n\n§g한 자리에는 한 사람만 임명할 수 있습니다. 임명한 장관은 바꿀 수 없습니다.§!"
 TFRKPHN_cab_ttd_cho_tae_yong:0 "출생: 1956년 대한민국 서울특별시\n\n이력: 대한민국의 국가안보실장\n조태용은 정통 외교관입니다. 외교부 제1차관과 국가안보실 제1차장을 지냈습니다. 대미 관계와 대북 안보 문제에 밝다는 평가를 받습니다. 외교와 안보의 요직을 두루 거친 전략가로 꼽힙니다.\n\n미국이 무너진 뒤 대한민국 외교는 기댈 곳을 잃었습니다. 이인제 대통령은 외교와 안보를 함께 다뤄 본 사람을 곁에 두기로 했습니다. 조태용은 먼저 PDTO 동맹국과의 공조부터 다져야 합니다. 그다음이 더 어렵습니다. 주변국이 한반도 통일을 받아들이게 만들어야 합니다.\n\n§Y어록§!\n\"문제를 삼는다면 북한만 문제 삼겠죠.\"\n§g머니투데이 전화 인터뷰§!"
