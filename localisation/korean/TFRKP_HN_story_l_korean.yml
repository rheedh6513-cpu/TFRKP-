 # KDDX 사업 (국방부 결정 + 이벤트 tfrkphn.431)
 TFRKPHN_mnd_kddx:0 "KDDX 사업 최종선정"
 TFRKPHN_mnd_kddx_desc:0 "순양함급 차기 전투함 KDDX의 설계안을 확정하고 건조에 들어갑니다. 개선된 순양함 선체 연구가 끝나고, 함선 무장 연구가 빨라집니다. 180일 뒤 KDDX 4척이 절반쯤 지어진 상태로 도크에 올라갑니다.\n\n§YK-VLS, CIWS-II, 함대공 유도탄-II 개발을 모두 마쳐야§! 사업을 확정할 수 있습니다."
 TFRKPHN_mnd_kddx_ships_tt:0 "§Y개선된 순양함§! 연구 완료\n함선 무장 연구 §G+100%§! (3회), 어뢰 연구 §G+50%§! (1회)\n§YKDDX 4척§! 건조"
 TFRKPHN_mnd_after_180_tt:0 "§Y180일 뒤§! 효과가 나타납니다."
 tfrkphn.431.t:0 "KDDX 사업 최종선정"
 tfrkphn.431.desc:0 "진해 해군기지에서 순양함급 차기 전투함 KDDX 사업의 최종 설계안이 확정됐다. 선체부터 전투체계까지 국내 기술로 채운 첫 대형 수상전투함이다.\n\n통합마스트 안에 다기능 위상배열 레이더를 넣어 상부 구조물을 줄였다. 갑판 아래에는 K-VLS가 들어갔다. 거기서 함대공 유도탄-II가 올라가고, 마지막 방어선은 CIWS-II가 맡는다. 5인치 함포와 어뢰, 예인 소나도 함께 실렸다. 레이더 반사 면적을 줄인 선형 덕분에 멀리서는 작은 배처럼 잡힌다.\n\n해군참모총장이 설계도를 가리키며 말했다.\n\n§Y\"발사대도, 미사일도, 근접방어도 우리 것입니다. 이제 4척을 올립니다.\"§!\n\n도크에 강재 절단이 시작됐다."
 tfrkphn.431.a:0 "강재 절단"
 # KDDX 선행 개발 3종
 TFRKPHN_mnd_kvls:0 "K-VLS 개발"
 TFRKPHN_mnd_kvls_desc:0 "한국형 수직발사대를 개발합니다. 함정 갑판 아래에 발사관을 묶어 넣습니다. 함대공 미사일과 순항미사일을 한 발사대에서 쏠 수 있게 됩니다. KDDX의 밑바탕입니다."
 TFRKPHN_mnd_ciws2:0 "CIWS-II 개발"
 TFRKPHN_mnd_ciws2_desc:0 "국산 근접방어무기체계를 개발합니다. 골키퍼와 팰렁스를 대신해, 함정에 달라붙는 대함미사일을 마지막 순간에 걷어냅니다."
 TFRKPHN_mnd_saam2:0 "함대공 유도탄-II 개발"
 TFRKPHN_mnd_saam2_desc:0 "함대공 유도탄-II를 개발합니다. 사거리를 늘리고 요격 고도를 높여, 함대 방공을 수입 미사일에 기대지 않게 됩니다.\n\n§YK-VLS 개발§!을 먼저 마쳐야 합니다."
 TFRKPHN_mnd_after_120_tt:0 "§Y120일 뒤§! 효과가 나타납니다."
 TFRKPHN_mnd_kddx_req_tt:0 "§YK-VLS§!, §YCIWS-II§!, §Y함대공 유도탄-II§! 개발을 모두 마쳤다"
 # 국방부 패널 탭 (마크 = 탭 버튼)
