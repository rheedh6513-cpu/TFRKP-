 TFRKPHN_amend_coop_token_tt:0 "다음 개헌 결정 하나는 §G정치력 없이§! 진행할 수 있습니다."
 TFRKPHN_amend_token_held_tt:0 "이미 타협한 결과를 아직 쓰지 않았습니다. 개헌 결정을 먼저 진행하세요."
 tfrkphn.321.t:0 "돌아온 친정"
 tfrkphn.321.desc:0 "'막말 홍준표 복당 결사반대'\n\n꼬박 1년 3개월의 방황을 끝마치고 어렵사리 돌아온 나에게 되돌아온 반응이었다. 나는 브리핑을 마친 수석 비서에게 짧은 눈인사로 자리를 비워 달라 이른 뒤, 홀로 남은 집무실 소파에 깊숙이 몸을 묻으며 피로하게 미간을 짓눌렀다.\n\n2016년 박근혜 전 대통령의 탄핵 이후 지금까지, 당 안팎으로 쉴 틈 없이 휘몰아치던 격랑 속에서 난파선의 키를 잡았던 게 대체 누구였던가. 나 개인의 영달보다도 당을 살리는 길로 몸을 던져 왔다는 자부심 하나가 나를 버티게 한 기둥이었다. 그러나 한때 뜻을 함께하던 동지들이 이제 누구보다 앞장서 나의 복귀를 가로막았다는 사실이 가슴 한켠을 미어지게 만들었다. 정치 신인 시절의 대쪽 같던 '모래시계 검사'는, 어느새 존재 자체만으로 당을 나락으로 빠뜨리는 '막말준표'로 바뀌어 있었다.\n\n어느덧 정치 인생의 황혼기에 접어든 나이. 머지않아 치러질 대선은 이변이 없는 한 내가 도전할 수 있는 마지막 무대가 될 터였다. 당원과 시민들이 다시 내 손을 잡아 줄지는 미지수다. 하지만 최근 유튜브와 인스타그램 등지에서 재조명되는 2017년 대선 당시의 발언들, 그리고 이에 호응하며 새롭게 모여드는 2030 세대의 지지층을 온전히 끌어안는다면, 이번에야말로 승산이 없는 싸움은 아닐 것이라 믿었다."
 tfrkphn.321.a:0 "그렇게 상념에 잠긴 순간에도, 모래시계의 모래는 소리 없이 떨어지고 있었다."
 tfrkphn.312.news:0 "§Y[뉴스] 정부, 경찰조직 개편안 발표... '무너진 공권력 바로 세운다'§!\n\n오늘 홍준표 정부가 경찰조직 전면 개편안을 발표했습니다. 개편안의 핵심 목표는 두 가지입니다. 흩어진 경찰 지휘체계를 하나로 묶는 것입니다. 그리고 약해진 공권력과 치안 기능을 다시 세우는 것입니다.\n\n야당은 즉각 반발했습니다. 야당 지도부는 이번 개편안을 \"경찰 독재, 사법 독재의 서막\"이라고 규정했습니다. 이들은 공권력의 오판으로 시민이 목숨을 잃은 과거 사건들을 거론했습니다. 권한이 한곳에 몰린 경찰은 또 다른 피해자를 만든다고 경고했습니다.\n\n정부는 \"법 앞에 예외는 없다\"는 짧은 입장만 내놓았습니다. 물러서지 않겠다는 뜻입니다. 개편안을 둘러싼 여야의 충돌은 당분간 이어질 전망입니다."
 tfrkphn.315.news:0 "§Y[뉴스] 취임 석 달, 대통령의 '입'이 정부를 흔든다§!\n\n홍준표 대통령은 거침없고 시원한 화법으로 '홍카콜라'라는 별명을 얻었습니다. 그러나 대통령이 된 뒤에도 그 말투는 바뀌지 않았습니다. 이제는 정부 전체의 부담이 되고 있습니다.\n\n어제 기자간담회는 생중계되었습니다. 민감한 질문이 이어지자 대통령의 목소리가 눈에 띄게 거칠어졌습니다. 기자에게 면박을 주는 장면이 편집 없이 전파를 탔습니다. 영상은 반나절 만에 조회수 수백만 회를 넘겼습니다. 야당은 \"국민을 대하는 태도가 바로 저것\"이라며 공세에 나섰습니다.\n\n논란은 하루 만에 다시 번졌습니다. 오늘 새벽 대통령 개인 SNS에 글 한 줄이 올라왔습니다. 야당 대표를 겨냥한 날 선 표현이었습니다. 참모진이 급히 글을 내렸지만, 캡처 화면은 이미 온라인 곳곳으로 퍼진 뒤였습니다.\n\n여당 안에서도 우려가 터져 나왔습니다. \"지금 이 정부의 가장 큰 리스크는 대통령의 입.\" 국민의힘 한 중진 의원의 말입니다.\n\n반응은 극명하게 갈립니다. 지지층은 \"속이 다 시원하다\"고 환호했습니다. 반면 중도층은 대통령의 품격을 묻기 시작했습니다. 취임 당시 높았던 지지율은 기세를 잃고 내리막을 타고 있습니다.\n\n청와대는 오늘 대통령의 공개 일정을 모두 비웠습니다."
 tfrkphn.313.news:0 "§Y'취임 석 달째 대통령, 이래도 되는 건가'... 국민의힘 아닌 '욕설의 힘'?§!\n\n대통령의 기자간담회가 생중계되던 중이었습니다. 기자의 민감한 질문이 이어지자 대통령의 말투가 거칠어졌습니다. 또한 질문한 기자를 향해 면박을 주는 장면이 방송을 통해 그대로 전파를 탔습니다.\n\n영상은 반나절 만에 조회수 수백만 회를 기록했습니다. 야당은 \"국민을 대하는 태도가 저렇다\"라며 거센 공세에 나섰습니다."
 tfrkphn.314.news:0 "새벽에 대통령의 개인 SNS에 글 한 줄이 올라왔습니다. 글에는 야당 대표를 향한 날 선 표현들이 담겨 있었습니다. 참모진이 급히 글을 내렸지만, 이미 캡처본이 인터넷으로 일파만파 퍼진 뒤였습니다.\n\n지지층에서는 \"속이 시원하다\"라는 반응이 나왔습니다. 중도층에서는 \"대통령으로서의 품격이 의심된다\"라는 말이 나오기 시작했습니다."
 tfrkphn.292.veteran:0 "대한민국은 정치 베테랑을 선택했습니다"
