 TFRKPHN_cab_ttd_kim_do_eup:0 "출생: 1964년 대한민국 부산광역시\n\n이력: 대한민국의 법무부 장관\n김도읍은 1996년부터 2011년까지 검사로 일했습니다. 부산지검 공판부장과 외사부장을 지냈습니다. 2012년 부산에서 제19대 국회의원에 당선된 뒤 네 번 당선되었습니다. 2022년 7월부터 2024년 5월까지 국회 법제사법위원장을 맡았습니다.\n\n법사위원장을 지낸 4선 의원입니다. 대통령이 내놓을 법안은 모두 법사위를 지나야 합니다.\n\n§Y어록§!\n\"이제 대답도 안하십니까\"\n§g국회 법제사법위원회§!"
