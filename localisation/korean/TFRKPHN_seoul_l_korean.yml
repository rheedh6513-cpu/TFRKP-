 TFRKPHN_sd_dev_se:0 "동남권 개발"
 TFRKPHN_sd_dev_se_desc:0 "서초와 강남, 송파, 강동에 업무 지구를 더 올린다. 땅값이 비싼 만큼 들어오려는 기업도 많아서 공사가 빨리 끝난다. 강북에서는 또 강남이냐는 말이 나온다."
 TFRKPHN_sd_dev_se_wait_tt:0 "§Y45일§! 동안 공사가 이어지고, 그동안 §Y민간 공장 1개§!가 묶인다."
 TFRKPHN_sd_dev_se_tt:0 "서울에 §Y업무 지구§! §G1개§!와 건물 칸 §G1§!\n동남권 4개 구의 여당 지지도 §G+3§!\n강북권 14개 구의 여당 지지도 §R-1§!\n강남과 강북의 격차 §R+1§!"
 TFRKPHN_sd_dev_north:0 "강북권 개발"
 TFRKPHN_sd_dev_north_desc:0 "한강 북쪽 열네 개 구의 낡은 도로와 철길, 주거지를 고친다. 돈은 더 들고 눈에 띄는 건물은 덜 올라간다. 그래도 서울의 절반이 넘는 사람이 이쪽에 산다."
 TFRKPHN_sd_dev_north_wait_tt:0 "§Y45일§! 동안 공사가 이어지고, 그동안 §Y민간 공장 2개§!가 묶인다."
 TFRKPHN_sd_dev_north_tt:0 "서울에 §Y기반 시설§! §G1§!\n강북권 14개 구의 여당 지지도 §G+2§!\n강남과 강북의 격차 §G-1§!"
 TFRKPHN_sd_dev_sw:0 "서남권 개발"
 TFRKPHN_sd_dev_sw_desc:0 "강서와 양천, 구로, 금천, 영등포, 동작, 관악의 오래된 공단과 준공업 지역을 새 산업 단지로 바꾼다. 서울에서 공장이 남아 있는 곳은 이쪽뿐이다."
 TFRKPHN_sd_dev_sw_wait_tt:0 "§Y45일§! 동안 공사가 이어지고, 그동안 §Y민간 공장 1개§!가 묶인다."
 TFRKPHN_sd_dev_sw_tt:0 "서울에 §Y산업 단지§! §G1개§!와 건물 칸 §G1§!\n서남권 7개 구의 여당 지지도 §G+3§!"
 TFRKPHN_sd_p1:0 "도봉구: 창동 문화산업단지"
 TFRKPHN_sd_p1_desc:0 "창동역 둘레에 공연장과 문화 산업 시설을 모은다."
 TFRKPHN_sd_p1_tt:0 "§Y사업 가치§! §G+0.5§! (백분율)\n도봉구의 여당 지지도 §G+4§!\n강남과 강북의 격차 §G-1§!"
 TFRKPHN_sd_p2:0 "강북구: 북한산 자락 주거지 정비"
 TFRKPHN_sd_p2_desc:0 "높이 제한에 묶여 손대지 못하던 산자락 주거지를 고친다."
 TFRKPHN_sd_p2_tt:0 "§Y빈곤 개선§! 월 §G+0.001§!\n강북구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p3:0 "노원구: 창동차량기지 바이오 단지"
 TFRKPHN_sd_p3_desc:0 "전동차 기지가 떠난 넓은 터에 의료와 바이오 기업을 들인다."
 TFRKPHN_sd_p3_tt:0 "§Y학술 발전§! 월 §G+0.001§!, §Y연구 속도§! §G+1§! (백분율)\n노원구의 여당 지지도 §G+4§!\n강남과 강북의 격차 §G-1§!"
 TFRKPHN_sd_p4:0 "은평구: 수색역세권 개발"
 TFRKPHN_sd_p4_desc:0 "철길로 갈라진 수색과 상암을 잇고 역 둘레에 업무와 상업 시설을 놓는다."
 TFRKPHN_sd_p4_tt:0 "§Y소득 성장§! §G+0.5§! (백분율)\n은평구의 여당 지지도 §G+4§!\n강남과 강북의 격차 §G-1§!"
 TFRKPHN_sd_p5:0 "성북구: 노후 주거지 재정비"
 TFRKPHN_sd_p5_desc:0 "언덕을 따라 들어선 낡은 주택가를 묶어 다시 짓는다."
 TFRKPHN_sd_p5_tt:0 "§Y빈곤 개선§! 월 §G+0.001§!\n성북구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p6:0 "중랑구: 중랑천 수변 개발"
 TFRKPHN_sd_p6_desc:0 "중랑천을 따라 난 도로를 정리하고 물가에 공원과 주거지를 놓는다."
 TFRKPHN_sd_p6_tt:0 "§Y빈곤 개선§! 월 §G+0.001§!\n중랑구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p7:0 "서대문구: 신촌 대학가 재생"
 TFRKPHN_sd_p7_desc:0 "대학가의 낡은 상권과 주거지를 손본다."
 TFRKPHN_sd_p7_tt:0 "§Y개인 가치§! §G+0.5§! (백분율)\n서대문구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p8:0 "종로구: 세운지구 재정비"
 TFRKPHN_sd_p8_desc:0 "종묘 앞에서 남산 쪽으로 길게 늘어선 낡은 상가 지대를 헐고 업무 지구와 녹지를 놓는다."
 TFRKPHN_sd_p8_tt:0 "§Y오프맵 공장§! §G1개§! (지도 밖 산업 단지)\n종로구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p9:0 "동대문구: 청량리역 복합환승센터"
 TFRKPHN_sd_p9_desc:0 "여러 광역 철도가 만나는 청량리역에 갈아타는 시설과 상업 시설을 한데 짓는다."
 TFRKPHN_sd_p9_tt:0 "§Y사업 가치§! §G+0.5§! (백분율)\n동대문구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p10:0 "강서구: 마곡지구"
 TFRKPHN_sd_p10_desc:0 "논밭이던 마곡에 조성한 연구 단지에 회의장과 업무 시설을 더한다."
 TFRKPHN_sd_p10_tt:0 "§Y오프맵 공장§! §G1개§! (지도 밖 산업 단지)\n강서구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p11:0 "마포구: 상암 디지털미디어시티"
 TFRKPHN_sd_p11_desc:0 "방송과 정보 기술 기업이 모인 상암에 남은 터를 마저 채운다."
 TFRKPHN_sd_p11_tt:0 "§Y오프맵 공장§! §G1개§! (지도 밖 산업 단지)\n마포구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p12:0 "중구구: 서울역 일대 개발"
 TFRKPHN_sd_p12_desc:0 "서울역 북쪽의 빈 철도 터에 회의장과 업무 시설을 올린다."
 TFRKPHN_sd_p12_tt:0 "§Y오프맵 공장§! §G1개§! (지도 밖 산업 단지)\n중구구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p13:0 "성동구: 성수 삼표 부지 개발"
 TFRKPHN_sd_p13_desc:0 "레미콘 공장이 떠난 서울숲 옆 땅에 업무 단지를 올린다."
 TFRKPHN_sd_p13_tt:0 "§Y오프맵 공장§! §G1개§! (지도 밖 산업 단지)\n성동구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p14:0 "광진구: 동서울터미널 현대화"
 TFRKPHN_sd_p14_desc:0 "낡은 버스 터미널을 땅 밑으로 내리고 그 위에 상업 시설을 올린다."
 TFRKPHN_sd_p14_tt:0 "§Y사업 가치§! §G+0.5§! (백분율)\n광진구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p15:0 "강동구: 고덕 업무 단지"
 TFRKPHN_sd_p15_desc:0 "동쪽 끝 고덕에 기업이 들어올 업무 단지를 만든다."
 TFRKPHN_sd_p15_tt:0 "§Y사업 가치§! §G+0.5§! (백분율)\n강동구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p16:0 "용산구: 용산정비창 개발"
 TFRKPHN_sd_p16_desc:0 "한강을 낀 옛 철도 정비창 터에 국제 업무 지구를 세운다."
 TFRKPHN_sd_p16_tt:0 "§Y오프맵 공장§! §G1개§! (지도 밖 산업 단지)\n용산구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p17:0 "양천구: 목동 아파트 재건축"
 TFRKPHN_sd_p17_desc:0 "지은 지 오래된 큰 아파트 단지들을 차례로 다시 짓는다."
 TFRKPHN_sd_p17_tt:0 "§Y개인 가치§! §G+0.5§! (백분율)\n양천구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p18:0 "영등포구: 여의도 금융특구"
 TFRKPHN_sd_p18_desc:0 "여의도를 금융 기업이 모이는 특구로 키운다."
 TFRKPHN_sd_p18_tt:0 "§Y오프맵 공장§! §G1개§! (지도 밖 산업 단지)\n영등포구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p19:0 "송파구: 잠실 마이스 단지"
 TFRKPHN_sd_p19_desc:0 "잠실 운동장 일대에 전시장과 회의장, 경기장을 새로 짓는다."
 TFRKPHN_sd_p19_tt:0 "§Y오프맵 공장§! §G1개§! (지도 밖 산업 단지)\n송파구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p20:0 "동작구: 노량진 일대 개발"
 TFRKPHN_sd_p20_desc:0 "한강을 낀 노량진의 낡은 시설 터와 주거지를 정비한다."
 TFRKPHN_sd_p20_tt:0 "§Y개인 가치§! §G+0.5§! (백분율)\n동작구의 여당 지지도 §G+4§!"
 TFRKPHN_sd_p21:0 "구로구: 구로 준공업지역 재편"
 TFRKPHN_sd_p21_desc:0 "오래된 공장 지대를 일터와 집과 쉴 곳이 함께 있는 곳으로 바꾼다."
