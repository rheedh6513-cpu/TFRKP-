l_korean:
 # 오세훈 정부 서울 지도. seoul_build.py가 만든다.
 TFRKPHN_oh_seoul_category:0 "서울 지도"
 TFRKPHN_oh_seoul_category_desc:0 "서울은 스물다섯 개 구로 나뉘어 있고 구마다 사정이 다르다. 지도의 색은 그 구에서 여당이 얼마나 지지를 받는지를 보여 준다. 붉을수록 여당이, 푸를수록 야당이 앞선다.\n\n한강 남쪽 동남권에만 돈을 쓰면 건물은 빨리 올라가지만 강북과의 격차가 벌어진다. 격차가 커지면 나라 전체의 안정도가 내려가고, 좁히면 올라간다."
 TFRKPHN_sd_t_top:0 "서울 지도"
 TFRKPHN_sd_t_count:0 "여당 우세 §R[?TFRKPHN_sd_gov|0]§!구   경합 §Y[?TFRKPHN_sd_toss|0]§!구   야당 우세 §B[?TFRKPHN_sd_opp|0]§!구"
 TFRKPHN_sd_t_gap:0 "강남과 강북의 격차 §Y[?TFRKPHN_sd_gap|0]§! / 10"
 TFRKPHN_sd_balance:0 "강남과 강북의 격차"
 TFRKPHN_sd_balance_desc:0 "격차가 5보다 크면 안정도가 내려가고, 5보다 작으면 올라간다. 한 칸에 1이다. 구별 개발 사업으로 얻은 사업 가치, 개인 가치, 소득 성장, 학술 발전, 연구 속도, 빈곤 개선도 여기에 쌓인다."
