 TFRKPHN_sd_dev_se:0 "동남권 개발"
 TFRKPHN_sd_dev_se_desc:0 "서초와 강남, 송파, 강동에 업무 지구를 더 올립니다. 땅값이 비싼 만큼 들어오려는 기업도 많아서 공사가 빨리 끝납니다. 강북에서는 또 강남이냐는 말이 나옵니다."
 TFRKPHN_sd_dev_se_wait_tt:0 "§Y45일§! 동안 공사가 이어지고, 그동안 §Y민간 공장 1개§!가 묶입니다."
 TFRKPHN_sd_dev_se_tt:0 "서울에 §Y업무 지구§! §G1개§!와 건물 칸 §G1§!\n동남권 4개 구의 여당 지지도 §G+3§!\n강북권 14개 구의 여당 지지도 §R-1§!\n강남과 강북의 격차 §R+1§!"
 TFRKPHN_sd_dev_north:0 "강북권 개발"
 TFRKPHN_sd_dev_north_desc:0 "한강 북쪽 열네 개 구의 낡은 도로와 철길, 주거지를 고칩니다. 돈은 더 들고 눈에 띄는 건물은 덜 올라갑니다. 그래도 서울의 절반이 넘는 사람이 이쪽에 삽니다."
 TFRKPHN_sd_dev_north_wait_tt:0 "§Y45일§! 동안 공사가 이어지고, 그동안 §Y민간 공장 2개§!가 묶입니다."
 TFRKPHN_sd_dev_north_tt:0 "서울에 §Y기반 시설§! §G1§!\n강북권 14개 구의 여당 지지도 §G+2§!\n강남과 강북의 격차 §G-1§!"
 TFRKPHN_sd_dev_sw:0 "서남권 개발"
 TFRKPHN_sd_dev_sw_desc:0 "강서와 양천, 구로, 금천, 영등포, 동작, 관악의 오래된 공단과 준공업 지역을 새 산업 단지로 바꿉니다. 서울에서 공장이 남아 있는 곳은 이쪽뿐입니다."
 TFRKPHN_sd_dev_sw_wait_tt:0 "§Y45일§! 동안 공사가 이어지고, 그동안 §Y민간 공장 1개§!가 묶입니다."
 TFRKPHN_sd_dev_sw_tt:0 "서울에 §Y산업 단지§! §G1개§!와 건물 칸 §G1§!\n서남권 7개 구의 여당 지지도 §G+3§!"
