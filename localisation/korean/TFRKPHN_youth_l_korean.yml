l_korean:
 # [안내] 사건 7283 낯선 얼굴들. youth_fix.py가 만든다.
 tfrkphn.7283.t:0 "낯선 얼굴들"
 tfrkphn.7283.d:0 "취임 뒤 첫 토요일 집회에서 조원진은 연단에 올라 광장을 내려다보았다. 그는 이 광장에서 몇 해 동안 천막을 지켰다. 그때 태극기를 든 사람들은 대개 그의 부모뻘이었다. 그날 연단 앞 첫 줄에는 스무 살 남짓한 청년들이 앉아 있었다.\n\n변화는 탄핵 뒤에 시작됐다. 전쟁에서 돌아온 전역병들과 군 복무를 앞둔 대학생들이 먼저 왔다. 그들은 전쟁을 이끈 대통령을 끌어내린 국회를 보며 정치에 처음 화를 냈다. 인터넷 방송에서 광장의 연설을 퍼 나른 것도 그들이었다.\n\n당원 명부를 정리하던 사무처 직원은 새로 들어온 당원 셋 가운데 둘이 서른 살 아래라고 보고했다. 조원진은 그 보고서를 두 번 읽었다. 그는 노인들의 당이라는 말을 오랫동안 들어 왔다.\n\n연설이 끝나자 청년 하나가 연단 아래로 다가와 휴대전화를 내밀었다. 함께 사진을 찍자는 것이었다. 조원진은 잠시 머뭇거리다 화면을 보며 웃었다. 그는 그날 밤 참모들에게 청년들이 무엇을 바라는지 알아 오라고 했다. 참모들 가운데 서른 살 아래는 한 명도 없었다."
 tfrkphn.7283.a:0 "청년들에게 묻는다."
