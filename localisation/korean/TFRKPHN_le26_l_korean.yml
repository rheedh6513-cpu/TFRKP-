 tfrkphn.6751.d2:0 "더불어민주당 정청래 대표가 6월 3일 지방선거를 두 달 앞두고 후보들에게 몸을 낮추라고 주문했습니다. 3월 27일 세종시당 현장 최고위원회의에서 그는 '쉬운 선거는 없다. 모든 선거는 다 어렵다'고 말했고, '절실한 마음으로 선거에 임해야 한다'고 당부했습니다. 당 안에 선거를 쉽게 보는 분위기가 돌자 미리 단속에 나선 것입니다.\n\n민주당은 지난해 8월 조승래 사무총장을 단장으로 지방선거기획단을 꾸려 공천 기준을 일찌감치 다듬어 왔습니다. 정 대표는 이번 선거를 임기 마지막 해 정부의 성적표이자 다음 대선의 출발선으로 봅니다.\n\n시장과 도지사 [?TFRKPHN_l6_total|0]자리가 한꺼번에 걸렸습니다. 광주와 전남은 7월 1일 통합특별시로 합쳐지고, 서울에서는 오세훈 시장이 다섯 번째 당선에 도전합니다. 상황실 지도에서 자리를 골라 여당 후보를 도울 수 있습니다."
