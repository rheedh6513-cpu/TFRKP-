 TFRKPHN_brd_kdy_t_sub:0 "백(우리)이 먼저 둡니다"
 TFRKPHN_brd_kdy_t_n:0 "§g지금까지 둔 수: [?TFRKPHN_brd_kdy_n|0]번§!"
 TFRKPHN_brd_kdy_t_pick:0 "말을 눌러 다음 수를 고르십시오."
 TFRKPHN_brd_kdy_t_wait:0 "§g숨을 고르는 중입니다. 다음 수는 조금 뒤에 둘 수 있습니다.§!"
 TFRKPHN_brd_kdy_t_cho:0 "§Y갈림길§! 고른 수에 따라 대국이 갈립니다."
 TFRKPHN_brd_kdy_t_end17:0 "대국이 끝났습니다: §G승리§!"
 TFRKPHN_brd_kdy_t_src17:0 "§g실제 대국: 1938년 AVRO 대회§!"
 TFRKPHN_brd_kdy_t_end25:0 "대국이 끝났습니다: §R패배§!"
 TFRKPHN_brd_kdy_t_src25:0 "§g실제 대국: 1962년 바르나 올림피아드§!"
 TFRKPHN_brd_kdy_t_end34:0 "대국이 끝났습니다: §Y무승부§!"
 TFRKPHN_brd_kdy_t_src34:0 "§g실제 대국: 1941년 뉴욕 대회§!"
 TFRKPHN_brd_kdy_t_end42:0 "대국이 끝났습니다: §G승리§!"
 TFRKPHN_brd_kdy_t_src42:0 "§g실제 대국: 1998년 칸 대회§!"
 TFRKPHN_brd_kdy_t_end50:0 "대국이 끝났습니다: §G승리§!"
 TFRKPHN_brd_kdy_t_src50:0 "§g실제 대국: 1946년 흐로닝언 대회§!"
 TFRKPHN_brd_kdy_t_end58:0 "대국이 끝났습니다: §Y무승부§!"
 TFRKPHN_brd_kdy_t_src58:0 "§g실제 대국: 1976년 스코페 대회§!"
 TFRKPHN_brd_kdy_t_end67:0 "대국이 끝났습니다: §G승리§!"
 TFRKPHN_brd_kdy_t_src67:0 "§g실제 대국: 1948년 세계선수권§!"
 TFRKPHN_brd_kdy_bA_tt:0 "§Y나라 빚 갚기§!\n정해진 계산대로 한 수를 둡니다.\n\n정치력 §R-40§!\n안정도 §G+2%§!\n\n§g한 수를 두면 60일 동안 다음 수를 둘 수 없습니다.§!"
 TFRKPHN_brd_kdy_bB_tt:0 "§Y금 모으기 운동§!\n국민의 손을 빌려 한 수를 둡니다. 한 번만 쓸 수 있습니다.\n\n안정도 §G+4%§!\n전쟁 지지 §G+2%§!\n\n§g한 수를 두면 60일 동안 다음 수를 둘 수 없습니다.§!"
 TFRKPHN_brd_kdy_bB2_tt:0 "§Y노사정 테이블§!\n노동자, 기업과 한 테이블에서 한 수를 둡니다.\n\n정치력 §R-20§!\n안정도 §G+1%§!\n\n§g한 수를 두면 60일 동안 다음 수를 둘 수 없습니다.§!"
 TFRKPHN_brd_kdy_c1_tt:0 "§Y1번 수: 계산한 대로§!\n판 위에 1번으로 표시된 수를 둡니다. 실제로 두어진 수이며, 어느 대국으로 이어질지는 두어 봐야 압니다.\n\n비용: £pol_power §Y25§!\n\n§g한 수를 두면 60일 동안 다음 수를 둘 수 없습니다.§!"
 TFRKPHN_brd_kdy_c2_tt:0 "§Y2번 수: 다른 셈법§!\n판 위에 2번으로 표시된 수를 둡니다. 실제로 두어진 수이며, 어느 대국으로 이어질지는 두어 봐야 압니다.\n\n비용: £pol_power §Y25§!\n\n§g한 수를 두면 60일 동안 다음 수를 둘 수 없습니다.§!"
 TFRKPHN_brd_kdy_category:0 "계산서 (체스판)"
 TFRKPHN_brd_kdy_category_desc:0 "실제 대국의 기보를 따라 한 수씩 둡니다. 갈림길에서 어떤 수를 고르느냐에 따라 이기거나 질 수 있으며, 대국의 끝이 이 정부의 끝을 비춥니다."
