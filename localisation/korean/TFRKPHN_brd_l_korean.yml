 TFRKPHN_brd_kbg_t_name:0 "§Y개혁의 칼 (장기판)§!"
 TFRKPHN_brd_kbg_t_sub:0 "초(우리)가 먼저 둡니다"
 TFRKPHN_brd_kbg_t_n:0 "§g지금까지 둔 수: [?TFRKPHN_brd_kbg_n|0]번§!"
 TFRKPHN_brd_kbg_t_pick:0 "말을 눌러 다음 수를 고르십시오."
 TFRKPHN_brd_kbg_t_wait:0 "§g숨을 고르는 중입니다. 다음 수는 조금 뒤에 둘 수 있습니다.§!"
 TFRKPHN_brd_kbg_t_cho:0 "§Y갈림길§! 고른 수에 따라 대국이 갈립니다."
 TFRKPHN_brd_kbg_t_end16:0 "대국이 끝났습니다: §G승리§!"
 TFRKPHN_brd_kbg_t_src16:0 "§g실제 대국: 2019년 K-장기 챔피언십§!"
 TFRKPHN_brd_kbg_t_end24:0 "대국이 끝났습니다: §R패배§!"
 TFRKPHN_brd_kbg_t_src24:0 "§g실제 대국: 1997년 국수전§!"
 TFRKPHN_brd_kbg_t_end32:0 "대국이 끝났습니다: §G승리§!"
 TFRKPHN_brd_kbg_t_src32:0 "§g실제 대국: 2022년 K-장기 챔피언십§!"
 TFRKPHN_brd_kbg_t_end40:0 "대국이 끝났습니다: §R패배§!"
