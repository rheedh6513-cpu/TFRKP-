 TFRKPHN_brd_kbg_t_end49:0 "대국이 끝났습니다: §R패배§!"
 TFRKPHN_brd_kbg_t_src49:0 "§g실제 대국: 2019년 총재배 오픈장기최강전§!"
 TFRKPHN_brd_kbg_t_end57:0 "대국이 끝났습니다: §R패배§!"
 TFRKPHN_brd_kbg_t_src57:0 "§g실제 대국: 2023년 K-장기 챔피언십§!"
 TFRKPHN_brd_kbg_t_end66:0 "대국이 끝났습니다: §G승리§!"
 TFRKPHN_brd_kbg_t_src66:0 "§g실제 대국: 2021년 오픈장기최강전§!"
 TFRKPHN_brd_kbg_bA_tt:0 "§Y밀어붙인다§!\n칼을 거두지 않고 다음 수를 둡니다.\n\n정치력 §G+40§!\n안정도 §R-2%§!\n\n§g한 수를 두면 60일 동안 다음 수를 둘 수 없습니다.§!"
 TFRKPHN_brd_kbg_bB_tt:0 "§Y다독인다§!\n반대편을 달래며 한 수를 둡니다.\n\n정치력 §R-30§!\n안정도 §G+2%§!\n\n§g한 수를 두면 60일 동안 다음 수를 둘 수 없습니다.§!"
 TFRKPHN_brd_kbg_c1_tt:0 "§Y1번 수: 정면 돌파§!\n판 위에 1번으로 표시된 수를 둡니다. 실제로 두어진 수이며, 어느 대국으로 이어질지는 두어 봐야 압니다.\n\n비용: £pol_power §Y25§!\n\n§g한 수를 두면 60일 동안 다음 수를 둘 수 없습니다.§!"
 TFRKPHN_brd_kbg_c2_tt:0 "§Y2번 수: 옆길로 돈다§!\n판 위에 2번으로 표시된 수를 둡니다. 실제로 두어진 수이며, 어느 대국으로 이어질지는 두어 봐야 압니다.\n\n비용: £pol_power §Y25§!\n\n§g한 수를 두면 60일 동안 다음 수를 둘 수 없습니다.§!"
 TFRKPHN_brd_kbg_c3_tt:0 "§Y3번 수: 한 수 물러선다§!\n판 위에 3번으로 표시된 수를 둡니다. 실제로 두어진 수이며, 어느 대국으로 이어질지는 두어 봐야 압니다.\n\n비용: £pol_power §Y25§!\n\n§g한 수를 두면 60일 동안 다음 수를 둘 수 없습니다.§!"
 TFRKPHN_brd_kbg_category:0 "개혁의 칼 (장기판)"
 TFRKPHN_brd_kbg_category_desc:0 "실제 대국의 기보를 따라 한 수씩 둡니다. 갈림길에서 어떤 수를 고르느냐에 따라 이기거나 질 수 있으며, 대국의 끝이 이 정부의 끝을 비춥니다."
