 # 이인제 정부: 생산성만큼의 임금. d4_build.py가 만든다.
 tfrkphn.541.t:0 "일하지 않는 자"
 tfrkphn.541.story:0 "일하지 않는 자는 먹지도 말라는 말은 신약성서 데살로니가후서 3장에서 나왔다. 바울이 일하기 싫어하는 사람을 꾸짖느라 쓴 말인데, 천구백 년쯤 뒤 소련은 같은 문장을 1936년 헌법 12조에 옮겨 적었다. 서로 원수였던 교회와 공산당이 이 문장만은 함께 쓴 셈이다.\n\n전쟁 동안 임금은 일과 따로 움직였다. 공장이 멈춘 날에도 전시 특별수당은 나갔고, 물가를 따라잡느라 붙인 수당이 해마다 기본급 위에 쌓였다. 전쟁이 끝나고 생산은 아직 제자리를 찾지 못했는데 임금표는 전시 그대로 남아 있다.\n\n이인제는 경제장관회의에서 그 오래된 문장을 꺼냈다고 한다. 일한 만큼 받고 만든 만큼 올린다는 원칙을 다시 세우자는 것이었고, 임금 인상은 생산성이 오른 범위 안에서만 한다는 지침이 그날 정해졌다.\n\n전시 특별수당은 세 해에 걸쳐 없애기로 했다. 수당이 빠지는 만큼 월급봉투는 얇아질 것이고, 노동계는 전쟁을 버틴 값을 이제 와서 깎느냐고 묻고 있다."
 tfrkphn.541.a:0 "일한 만큼 받는다"
