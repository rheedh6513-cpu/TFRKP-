l_korean:
 # [안내] 이인제 과로 게이트. lij_build.py가 만든다.
 tfrkphn.7077.t:0 "연단 위의 현기증"
 tfrkphn.7077.d:0 "지방 순방 셋째 날이었다. 대통령은 새벽에 서울을 떠나 산업단지 두 곳과 시장 한 곳을 돌았고, 오후에는 지역 상공인들 앞에서 연설을 하기로 되어 있었다. 점심은 차 안에서 김밥으로 때웠다. 전날 밤에도 그는 두 시가 넘어서야 관저의 불을 껐다.\n\n연설을 시작한 지 오 분쯤 지났을 때 대통령의 말이 끊겼다. 그는 두 손으로 연단을 붙잡고 한참을 서 있었다. 맨 앞줄의 사람들이 먼저 알아챘다. 경호원이 다가갔지만 그는 손을 들어 괜찮다고 했다. 객석에는 낮은 웅성거림이 번졌다.\n\n연설은 짧게 끝났다. 남은 일정은 모두 취소됐고, 대통령은 곧바로 서울로 돌아왔다. 주치의는 큰 병은 아니라고 했다. 잠이 모자라고 끼니가 불규칙한 데서 온 피로라고 했다. 며칠은 쉬어야 한다는 말도 덧붙였다.\n\n다음 날 아침 대통령은 평소처럼 일곱 시에 집무실에 나왔다. 비서실장이 오늘 일정을 줄이자고 하자 그는 결재판부터 가져오라고 했다. 대통령실은 지방 일정이 날씨 때문에 바뀌었다고만 발표했다. 그 발표를 믿는 기자는 많지 않았다."
 tfrkphn.7077.a:0 "결재판부터 가져와라."
 tfrkphn.7078.t:0 "닫힌 병실"
 tfrkphn.7078.d:0 "밤 열한 시가 넘은 시각이었다. 집무실에서 보고서를 읽던 대통령이 의자에서 일어나다 그대로 주저앉았다. 당직 비서관이 의무실을 불렀고, 대통령은 그날 밤 군 병원으로 옮겨졌다. 언론에는 아무것도 알리지 않았다. 관저 앞 초소에도 평소와 다른 지시는 내려가지 않았다.\n\n이틀 뒤 대통령실은 대통령이 심한 몸살로 며칠 입원해 쉬고 있다고 발표했다. 국무회의는 국무총리 정진석이 대신 주재했다. 기자들은 병원 앞에 진을 쳤고, 병실 층의 창문은 하루 종일 가려져 있었다. 증권가에는 온갖 소문이 돌았다.\n\n주치의는 이번에는 분명하게 말했다. 몇 달은 일을 줄여야 하고, 그러지 않으면 다음은 장담할 수 없다고 했다. 대통령은 고개를 끄덕였다. 그리고 그날 오후 병실로 결재 서류를 가져오게 했다. 침대 옆 탁자는 금세 서류로 덮였다.\n\n평생 넘어질 때마다 다시 일어나 불사조라 불린 사람이었다. 선거에서 지고도, 당이 무너지고도 그는 다시 돌아왔다. 그러나 병실 밖 복도에서 비서관들은 처음으로 그 별명을 입에 올리지 않았다."
 tfrkphn.7078.a:0 "퇴원 날짜를 앞당겨라."
 tfrkphn.7079.t:0 "새벽의 비보"
 tfrkphn.7079.d:0 "새벽 네 시 대통령 관저의 불이 다시 켜졌다. 당직 경호관이 의료진을 불렀고, 구급차가 관저 정문을 빠져나갔다. 국무총리 정진석은 다섯 시가 조금 넘어 전화를 받았다. 그는 아무 말 없이 한참 동안 수화기를 들고 있었다. 창밖은 아직 어두웠다.\n\n오전 일곱 시 대통령실 대변인이 단상에 섰다. 대통령이 과로로 쓰러져 끝내 세상을 떠났다고 발표했다. 발표문은 세 문장이었다. 대변인은 질문을 받지 않았고, 기자실에는 한동안 아무도 움직이지 않았다. 누군가 먼저 자판을 두드리기 시작한 것은 일 분쯤 지나서였다.\n\n집무실 책상 위에는 그가 전날 밤 읽던 보고서가 펼쳐져 있었다. 여백에는 그의 글씨로 몇 줄이 적혀 있었다. 다음 주 국무회의 안건이었다. 비서관들은 그 보고서를 덮지 못하고 그대로 두었다. 의자는 책상에서 조금 비껴 놓여 있었다.\n\n헌법에 따라 국무총리가 대통령의 권한을 대행한다. 정진석은 그날 오전 국무회의를 열고 국정의 공백은 없을 것이라고 밝혔다. 그는 대통령이 앉던 자리에 앉지 않았다. 국무회의는 묵념으로 시작됐다."
 tfrkphn.7079.a:0 "나라는 멈추지 않는다."
 tfrkphn.7080.t:0 "국가장"
 tfrkphn.7080.d:0 "세상을 떠난 대통령의 장례가 국가장으로 치러졌습니다. 영결식은 국회 앞마당에서 열렸고, 권한대행을 맡은 국무총리 정진석이 장례위원장을 맡았습니다. 각 정당 대표들과 전직 국회의장들도 자리를 함께했습니다. 각국 대사관도 조문 사절을 보냈습니다.\n\n고인은 여섯 번 국회의원에 당선됐고, 경기도지사와 노동부 장관을 지냈습니다. 여러 차례 대통령 선거에 도전했다가 끝내 대통령이 됐습니다. 정치권에서는 쓰러져도 다시 일어나는 사람이라는 뜻으로 그를 불사조라 불렀습니다.\n\n영결식이 끝난 뒤 운구 행렬은 광화문을 지나 국립묘지로 향했습니다. 길가에는 이른 아침부터 시민들이 나와 국화를 들고 섰습니다. 행렬이 지나는 동안 곳곳에서 묵념이 이어졌습니다. 고인의 고향인 충남 논산에도 분향소가 차려졌습니다.\n\n정부는 닷새 동안 조기를 걸었습니다. 권한대행 체제는 헌법에 따라 계속됩니다. 정진석 권한대행은 고인이 남긴 국정 과제를 그대로 이어 가겠다고 밝혔습니다. 정치권은 당분간 정쟁을 멈추기로 했습니다. 국회는 본회의를 하루 미뤘습니다."
 tfrkphn.7080.a:0 "고인의 명복을 빈다."
 TFRKPHN_lij_category:0 "대통령의 건강"
 TFRKPHN_lij_category_desc:0 "\n\n\n\n\n\n\n\n\n\n\n\n대통령은 쉬지 않습니다. 디시전을 하나 쓸 때마다 §R과로§!가 §Y4§!, 중점을 하나 끝낼 때마다 §Y6§! 오릅니다. 일주일마다 §G1§!씩 내려가고, 2주 동안 디시전도 중점도 끝내지 않으면 일주일마다 §G4§!씩 내려갑니다.\n\n과로: §Y[?TFRKPHN_lij_fatigue|0]§! / 100\n쓰러진 횟수: §R[?TFRKPHN_lij_collapse|0]§! / 3\n\n과로가 100이 되면 대통령이 쓰러집니다. §R세 번째로 쓰러지면 대통령은 일어나지 못합니다.§!"
 TFRKPHN_lij_rest:0 "일정 비우기"
 TFRKPHN_lij_rest_desc:0 "주말 일정을 모두 비우고 관저에서 쉬게 합니다."
 TFRKPHN_lij_rest_tt:0 "§R과로§!가 §G35§! 내려갑니다."
 TFRKPHN_lij_doctor:0 "주치의의 경고"
 TFRKPHN_lij_doctor_desc:0 "주치의의 말대로 몇 주 동안 공식 일정을 크게 줄입니다. 국정은 그만큼 느려집니다."
 TFRKPHN_lij_doctor_tt:0 "§R과로§!가 §G60§! 내려갑니다."
 TFRKPHN_lij_dizzy:0 "대통령의 현기증"
 TFRKPHN_lij_dizzy_desc:0 "대통령이 연설 도중 쓰러질 뻔했습니다. 대통령실은 일정을 줄이고 있습니다."
 TFRKPHN_lij_hospital:0 "대통령 입원"
 TFRKPHN_lij_hospital_desc:0 "대통령이 병원에 입원해 있습니다. 국무회의는 국무총리가 대신 주재합니다."
 TFRKPHN_lij_c1_tt:0 "§R과로§!가 §Y40§!으로 내려갑니다. 대통령이 §R한 번§! 쓰러졌습니다."
 TFRKPHN_lij_c2_tt:0 "§R과로§!가 §Y30§!으로 내려갑니다. 대통령이 §R두 번§! 쓰러졌습니다. §R한 번 더 쓰러지면 대통령은 일어나지 못합니다.§!"
 TFRKPHN_lij_dead_tt:0 "§R이인제 대통령이 세상을 떠납니다.§! 국무총리 §Y정진석§!이 대통령 권한대행을 맡습니다."
 TFRKPHN_chung_acting_desc:0 "정진석은 충남 공주 출신으로 다섯 번 국회의원을 지냈고, 21대 국회에서 국회부의장을 맡았다. 이인제 정부의 국무총리였던 그는 대통령이 과로로 세상을 떠나자 헌법에 따라 대통령의 권한을 대행하게 됐다.\n\n그는 대통령이 앉던 자리에 앉지 않는다. 남은 국정 과제를 마무리하고, 흔들리는 정부를 붙잡는 것이 권한대행의 일이다."
 TFRKPHN_chung_acting_01:0 "국가장"
 TFRKPHN_chung_acting_01_desc:0 "세상을 떠난 대통령을 국가장으로 보냅니다. 권한대행 체제는 그 뒤에 시작됩니다."
