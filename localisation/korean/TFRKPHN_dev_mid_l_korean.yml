l_korean:
 TFRKPHN_dev_rush:0 "개발 가속"
 TFRKPHN_dev_rush_desc:0 "인허가를 한꺼번에 풀고 공사를 서두릅니다. 건물은 빨리 올라가지만 민심은 들썩입니다."
 TFRKPHN_dev_bk_up_tt:0 "개발 반발이 누그러집니다(§Y2028 총선§! 여당 의석에 §G유리§!)."
 TFRKPHN_dev_bk_dn_tt:0 "개발 반발이 커집니다(§Y2028 총선§! 여당 의석에 §R불리§!)."
 tfrkphn.6776.t:0 "개발만이 살 길이다"
 tfrkphn.6776.d:0 "오세훈 대통령이 취임 뒤 처음 연 경제 장관 회의에서 개발을 정부의 첫째 과제로 못 박았습니다. 전쟁 특수가 끝나 가는 경제를 계속 돌리려면 공사 현장부터 열어야 한다는 것입니다.\n\n그는 서울시장 선거를 치르던 2026년 5월 11일 토론회에서 '공급, 닥치고 공급이 가장 근본적인 해법'이라고 말했습니다. 같은 달 주택 공약을 내놓으면서는 '31만 호를 압도적인 속도로 공급해 시민들의 주거 불안을 근본부터 해소하겠다'고 했습니다. 이제 그 말을 나라 전체에 옮기려 합니다.\n\n장관들 사이에서는 인허가를 한꺼번에 풀자는 쪽과 단계를 밟자는 쪽이 갈렸습니다."
 tfrkphn.6776.a:0 "인허가를 한꺼번에 푼다."
 tfrkphn.6776.b:0 "단계를 밟는다."
 tfrkphn.6777.t:0 "크레인이 다시 선다"
 tfrkphn.6777.d:0 "전국의 착공 물량이 한 해 사이 눈에 띄게 늘었습니다. 서울 재개발 구역마다 타워크레인이 올라가고, 멈춰 있던 재건축 단지들도 철거를 시작했습니다.\n\n남은 걱정은 집값입니다. 개발 소식이 도는 동네마다 호가가 먼저 뛰었습니다. 금융 당국은 대출을 조여 열기를 식히자고 하고, 대통령실 참모들은 공급을 더 밀어 값을 누르자고 합니다. 대통령은 시장 시절부터 공급이 답이라고 말해 왔지만, 총선을 앞둔 여당은 집값 기사 하나에도 예민합니다."
 tfrkphn.6777.a:0 "대출을 조인다."
 tfrkphn.6777.b:0 "공급으로 누른다."
 tfrkphn.6778.t:0 "개발과 동행 사이"
 tfrkphn.6778.d:0 "재개발 구역에서 밀려나는 세입자 문제가 커지고 있습니다. 철거 일정에 맞춰 옮길 곳을 찾지 못한 사람들이 구청 앞에 모였습니다.\n\n오 대통령은 2022년 7월 1일 서울시장 취임사에서 약자와의 동행을 두고 '제가 서울시장으로서 존재하는 이유이자, 제 평생의 과업'이라고 말했습니다. 야당은 그 말을 그대로 되돌려주며 공세를 폅니다.\n\n여당 안에서는 동행 예산을 늘리자는 쪽과 속도를 늦추면 다 놓친다는 쪽이 맞섭니다."
 tfrkphn.6778.a:0 "동행 예산을 늘린다."
 tfrkphn.6778.b:0 "속도가 먼저다."
 tfrkphn.6779.t:0 "두 번째 삽"
 tfrkphn.6779.d:0 "총선이 끝났습니다. 대통령실은 남은 임기 동안 개발을 어디까지 밀지 다시 정해야 합니다.\n\n첫 삽을 뜬 현장들은 대부분 아직 공사 중입니다. 건설업계는 지금 멈추면 반쯤 지은 단지만 남는다고 했고, 경제 부처는 금리와 공사비가 부담이라고 맞섰습니다. 2030년 지방선거까지는 두 해가 남았습니다."
 tfrkphn.6779.a:0 "더 민다."
 tfrkphn.6779.b:0 "숨을 고른다."
 tfrkphn.6780.t:0 "서울 밖에서 본 개발"
 tfrkphn.6780.d:0 "지방 재개발 조합원들이 버스를 나눠 타고 서울로 올라왔습니다. 여의도에 모인 이들은 재개발 지원 대책을 마련하라는 손팻말을 들고 구호를 외쳤습니다. 같은 날 지방 시도지사들도 공동 성명을 냈습니다. 정부의 개발 예산과 인허가가 수도권에 몰린다는 내용입니다.\n\n성명에는 크레인은 서울에 서고 지방에는 빈집만 는다는 대목이 들어갔습니다. 여당 소속 단체장도 여럿 이름을 올렸습니다. 대통령실 안에서는 서울이 먼저 살아야 지방에도 돈이 돈다는 쪽과, 이대로 가면 총선에서 지방 의석을 잃는다는 쪽이 맞섭니다."
 tfrkphn.6780.a:0 "지방 권역부터 먼저 챙긴다."
 tfrkphn.6780.b:0 "서울이 살아야 지방도 산다."
 tfrkphn.6781.t:0 "총선 앞의 개발 성적표"
 tfrkphn.6781.d:0 "총선을 두 달 앞두고 언론이 정부의 개발 성적표를 매기기 시작했다.\n\n착공 숫자는 분명히 늘었다. 여당은 공사 현장과 새 일자리를 앞세워 선거를 치르겠다고 했다. 야당은 집값과 세입자 문제를 파고들고 있지만, 아직 판세를 뒤집을 만한 바람은 불지 않는다."
 tfrkphn.6781.d2:0 "총선을 두 달 앞두고 언론이 정부의 개발 성적표를 매기기 시작했다.\n\n착공 숫자는 늘었지만 재개발 구역의 반발과 오른 집값이 더 크게 보도된다. 야당은 개발 심판을 구호로 내걸었고, 여당 후보들 가운데에는 유세에서 대통령 이름을 덜 꺼내는 사람도 생겼다."
 tfrkphn.6781.a:0 "성적표를 들고 선거에 나간다."
