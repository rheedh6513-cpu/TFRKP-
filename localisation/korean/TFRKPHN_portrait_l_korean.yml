 # 사용자가 준 초상화의 인물 이름과 소개. portrait_add.py가 만든다.
 TFRKPHN_kim_han_sol_char:0 "김한솔"
 TFRKPHN_kim_han_sol_char_desc:0 "김한솔은 김정은의 이복형 김정남의 아들입니다.\n\n어릴 때 북한을 떠나 마카오 등지에서 자랐고, 2011년 보스니아 헤르체고비나의 유나이티드월드칼리지 모스타르에 입학했습니다. 2012년 핀란드 방송과의 인터뷰에서는 북한 주민의 생활이 나아지도록 돕고 싶다고 말했습니다.\n\n2017년 2월 아버지가 쿠알라룸푸르 공항에서 숨진 뒤, 3월 8일 천리마민방위가 올린 영상에 나와 무사히 피신했다고 밝혔습니다. 천리마민방위는 뒤에 자유조선으로 이름을 바꾸었습니다. 그 뒤 그의 행방은 확인되지 않았습니다."
 TFRKPHN_KHS_TT1_FJ:0 "§B자유조선이 지킨 사람§!"
 TFRKPHN_KHS_TT_FJ:0 "§W자유조선이 지킨 사람§!\n\n\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_kim_han_sol_big\n\n\n\n\n\n\n\n            김한솔\n\n\n§L김한솔은 김정은의 이복형 김정남의 아들입니다. 어릴 때 북한을 떠나 마카오 등지에서 자랐고, 2011년 보스니아 헤르체고비나의 유나이티드월드칼리지 모스타르에 입학했습니다. 2012년 핀란드 방송과의 인터뷰에서는 북한 주민의 생활이 나아지도록 돕고 싶다고 말했습니다.\n\n2017년 2월 아버지 김정남이 쿠알라룸푸르 공항에서 숨진 뒤, 3월 8일 천리마민방위가 올린 영상에 나와 무사히 피신했다고 밝혔습니다. 천리마민방위는 뒤에 자유조선으로 이름을 바꾸었습니다.\n\n그 뒤로 알려지지 않았던 그의 행방은 자유조선이 평양으로 향하면서 드러났습니다. 그는 자리를 맡지 않은 채 자유조선 정부 곁에 머물고 있습니다.§!"
