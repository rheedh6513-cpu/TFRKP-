l_korean:
 # [안내] 서울 랜드마크 이름과 설명. lm_build.py가 만든다.
 landmark_tfrkphn_namsan_tower:0 "남산서울타워"
 landmark_tfrkphn_namsan_tower_plural:0 "남산서울타워"
 landmark_tfrkphn_namsan_tower_desc:0 "서울 한가운데 남산 꼭대기에 선 전파탑입니다. 1975년에 세워졌고, 서울 어디서나 보입니다."
 landmark_tfrkphn_gyeongbokgung:0 "경복궁 근정전"
 landmark_tfrkphn_gyeongbokgung_plural:0 "경복궁 근정전"
 landmark_tfrkphn_gyeongbokgung_desc:0 "조선의 법궁 경복궁의 으뜸 전각입니다. 왕이 신하들의 조회를 받고 나라의 큰 의식을 치르던 곳입니다."
 landmark_tfrkphn_busan_tower:0 "부산타워"
 landmark_tfrkphn_busan_tower_plural:0 "부산타워"
 landmark_tfrkphn_busan_tower_desc:0 "부산 용두산 꼭대기에 선 높이 120미터의 탑입니다. 1973년에 세워졌고, 부산항이 한눈에 내려다보입니다."
 landmark_tfrkphn_gwangan_bridge:0 "광안대교"
 landmark_tfrkphn_gwangan_bridge_plural:0 "광안대교"
 landmark_tfrkphn_gwangan_bridge_desc:0 "부산 수영만을 가로지르는 2층 현수교입니다. 2003년에 개통했고, 밤이면 다리 전체에 불이 들어옵니다."
 landmark_tfrkphn_ryugyong:0 "류경호텔"
 landmark_tfrkphn_ryugyong_plural:0 "류경호텔"
 landmark_tfrkphn_ryugyong_desc:0 "평양 보통강 구역에 선 105층 피라미드 모양의 호텔입니다. 1987년에 짓기 시작했고 높이는 330미터입니다. 대한민국이 평양을 차지하면 안정도가 3퍼센트 오릅니다."
 landmark_tfrkphn_daegu83:0 "대구 83타워"
 landmark_tfrkphn_daegu83_plural:0 "대구 83타워"
 landmark_tfrkphn_daegu83_desc:0 "대구 두류산에 선 높이 202미터의 전망탑입니다. 1992년에 완공됐고, 팔각 전망대에서 대구 시내가 한눈에 내려다보입니다."
 landmark_tfrkphn_gwangju518:0 "5.18 민주항쟁 추모탑"
 landmark_tfrkphn_gwangju518_plural:0 "5.18 민주항쟁 추모탑"
 landmark_tfrkphn_gwangju518_desc:0 "광주 국립5.18민주묘지 한가운데 선 높이 40미터의 돌탑입니다. 두 기둥이 알 모양 조형물을 감싸 쥐고 있습니다. 1997년에 세워졌습니다."
 landmark_tfrkphn_hanbit:0 "엑스포 한빛탑"
 landmark_tfrkphn_hanbit_plural:0 "엑스포 한빛탑"
 landmark_tfrkphn_hanbit_desc:0 "1993년 대전 세계박람회를 기념해 세운 높이 93미터의 탑입니다. 화강암 몸통 위에 고리 모양 전망대와 은빛 첨탑이 얹혀 있습니다."
