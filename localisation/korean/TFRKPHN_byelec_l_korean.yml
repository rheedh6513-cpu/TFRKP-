 TFRKPHN_by_t_head:0 "[GetTFRKPHNByHead]"
 TFRKPHN_by_t_gain:0 "§Y[GetTFRKPHNByLast]§! §G+[?TFRKPHN_by_last|0]§!"
 TFRKPHN_by_t_gov:0 "§R여당§! §Y[GetTFRKPHNSdCand]§! §G[?TFRKPHN_sd_avg|1]§!"
 TFRKPHN_by_t_opp:0 "§B야당§! §Y정원오§! §R[?TFRKPHN_by_opp|1]§!"
 TFRKPHN_by_t_from:0 "홍준표 정부에서 이어받은 값: [?TFRKPHN_by_start|+0]   가운데 흰 줄이 50"
 TFRKPHN_by_b1_n:0 "유세"
 TFRKPHN_by_b1_c:0 "§Y정치력 10§!  구마다 §G+1§!"
 TFRKPHN_by_b1_tt:0 "§Y유세§!\n후보가 이 생활권의 시장과 역 앞을 돕니다.\n\n정치력 §R-10§!\n고른 생활권의 구마다 여당 지지도 §G+1§!\n\n먼저 지도에서 생활권을 골라야 합니다. 몇 번이든 누를 수 있습니다."
 TFRKPHN_by_b2_n:0 "구청장과의 만남"
 TFRKPHN_by_b2_c:0 "§Y정치력 15§!  구마다 §G+2§!"
 TFRKPHN_by_b2_tt:0 "§Y구청장과의 만남§!\n후보가 이 생활권의 구청들을 찾아 구청장과 마주 앉습니다. 여당 구청장이면 구청이 함께 움직여 줍니다.\n\n정치력 §R-15§!\n고른 생활권의 구마다 여당 지지도 §G+2§!\n여당 구청장이 있는 구는 §G+3§!\n\n먼저 지도에서 생활권을 골라야 합니다. 몇 번이든 누를 수 있습니다."
 TFRKPHN_by_b3_n:0 "지역 사업 약속"
 TFRKPHN_by_b3_c:0 "§Y정치력 25§!  §G+2§!, 이웃 §G+1§!"
 TFRKPHN_by_b3_tt:0 "§Y지역 사업 약속§!\n이 생활권이 바라던 사업을 시장이 되면 하겠다고 약속합니다. 맞닿은 생활권에도 소문이 납니다.\n\n정치력 §R-25§!\n고른 생활권의 구마다 여당 지지도 §G+2§!\n맞닿은 생활권의 구마다 §G+1§!\n\n먼저 지도에서 생활권을 골라야 합니다. 몇 번이든 누를 수 있습니다."
 TFRKPHN_by_b4_n:0 "재개발 약속"
 TFRKPHN_by_b4_c:0 "§Y정치력 30§!  구마다 §G+3§!"
 TFRKPHN_by_b4_tt:0 "§Y재개발 약속§!\n묶여 있던 재개발과 재건축을 풀겠다고 약속합니다. 이기면 그 약속을 지켜야 합니다.\n\n정치력 §R-30§!\n고른 생활권의 구마다 여당 지지도 §G+3§!\n선거에서 이기면 우리가 가진 모든 지역의 건물 칸이 한 번 §G+1§! 늘어납니다 (약속을 몇 번 해도 한 번).\n\n먼저 지도에서 생활권을 골라야 합니다. 몇 번이든 누를 수 있습니다."
 tfrkphn.658.t:0 "약속한 재개발"
 tfrkphn.658.d:0 "보궐선거에서 이긴 새 시장이 첫 결재로 재개발과 재건축 구역 지정안에 서명했습니다. 선거 때 구마다 돌며 한 약속입니다.\n\n서울시가 길을 열자 다른 시도도 같은 기준을 받아들였습니다. 묶여 있던 구역들이 한꺼번에 풀리면서 우리가 지을 수 있는 자리가 전국에서 늘었습니다."
 tfrkphn.658.a:0 "약속은 지켜야 합니다."
 TFRKPHN_by_657_tt:0 "우리가 가진 §Y모든 지역§!의 건물 칸 §G+1§! (이미 반영됨)"
 tfrkphn.6651.t:0 "방송 토론"
 tfrkphn.6651.d:0 "선거를 열흘 앞두고 두 후보가 방송 토론에서 마주 앉습니다. 토론은 한 번뿐이고 시간은 아흔 분입니다.\n\n우리 후보 [GetTFRKPHNSdCand]의 참모들은 무엇을 앞세울지를 두고 밤새 다퉜습니다. 낡은 주거지가 많은 동북쪽은 재개발 이야기를, 서울 바깥쪽 생활권은 교통 이야기를, 일터가 몰린 곳은 일자리 이야기를 듣고 싶어 합니다. 셋을 다 말하면 아무것도 남지 않는다는 것이 참모들의 한결같은 말입니다."
 tfrkphn.6651.a:0 "재개발과 주거를 앞세웁니다."
 tfrkphn.6651.a_tt:0 "동북1, 동북2, 서남3 생활권의 구마다 여당 지지도 §G+2§!"
 tfrkphn.6651.b:0 "교통을 앞세웁니다."
 tfrkphn.6651.b_tt:0 "서북, 서남1, 동남2 생활권의 구마다 여당 지지도 §G+2§!"
 tfrkphn.6651.c:0 "일자리와 경제를 앞세웁니다."
 tfrkphn.6651.c_tt:0 "도심, 서남2, 동남1 생활권의 구마다 여당 지지도 §G+2§!"
 tfrkphn.6652.t:0 "상대의 큰 공약"
 tfrkphn.6652.d:0 "정원오 후보가 [GetTFRKPHNByOppAt]에서 큰 공약을 내놓았습니다. 이 생활권을 지나는 철길을 땅 밑으로 넣고 그 위를 공원과 주택으로 채우겠다는 것입니다.\n\n그는 구청장을 지낸 경험을 내세우며, 구청에서 해 본 일을 시청에서 하겠다고 말했다고 합니다. 현장에는 평소 유세보다 훨씬 많은 사람이 모였습니다. 우리 후보 캠프는 그날 저녁 대책 회의를 열었습니다."
 tfrkphn.6652.a:0 "같은 곳에서 맞불 공약을 냅니다."
 tfrkphn.6652.a_tt:0 "[GetTFRKPHNByOppAt]의 구마다 여당 지지도 §G+1§!"
 tfrkphn.6652.b:0 "대응하지 않습니다."
 tfrkphn.6652.b_tt:0 "[GetTFRKPHNByOppAt]의 구마다 여당 지지도 §R-4§!"
 tfrkphn.6653.t:0 "개표가 시작됐습니다"
 tfrkphn.6653.d:0 "저녁 여덟 시에 투표가 끝났습니다. 투표함이 구마다 체육관으로 옮겨졌고 개표가 시작됐습니다.\n\n한강 북쪽의 표가 먼저 열렸습니다. 앞의 숫자가 우리 후보, 뒤의 숫자가 상대 후보입니다.\n\n도심  §R[?TFRKPHN_by_z1|1]§! 대 §B[?TFRKPHN_by_zo1|1]§!\n서북  §R[?TFRKPHN_by_z2|1]§! 대 §B[?TFRKPHN_by_zo2|1]§!\n동북1  §R[?TFRKPHN_by_z3|1]§! 대 §B[?TFRKPHN_by_zo3|1]§!\n동북2  §R[?TFRKPHN_by_z4|1]§! 대 §B[?TFRKPHN_by_zo4|1]§!"
 tfrkphn.6653.a:0 "다음 투표함을 엽니다."
 tfrkphn.6654.t:0 "자정 무렵"
 tfrkphn.6654.d:0 "자정이 가까워졌습니다. 개표소의 탁자마다 표 묶음이 쌓이고, 참관인들이 한 장씩 넘어가는 표를 지켜봅니다.\n\n한강 남쪽 서편의 표가 열렸습니다.\n\n서남1  §R[?TFRKPHN_by_z5|1]§! 대 §B[?TFRKPHN_by_zo5|1]§!\n서남2  §R[?TFRKPHN_by_z6|1]§! 대 §B[?TFRKPHN_by_zo6|1]§!\n서남3  §R[?TFRKPHN_by_z7|1]§! 대 §B[?TFRKPHN_by_zo7|1]§!"
 tfrkphn.6654.a:0 "마지막 투표함을 엽니다."
 tfrkphn.6655.t:0 "마지막 투표함"
