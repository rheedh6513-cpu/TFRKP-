l_korean:
 # 서울시장 보궐선거 탭. byelec_tab_build.py가 만든다.
 TFRKPHN_oh_byelec_category:0 "서울시장 보궐선거"
 TFRKPHN_oh_byelec_category_desc:0 "대통령이 떠난 서울시장 자리를 두고 2027년 4월 7일에 보궐선거가 열립니다. 스물다섯 구의 여당 지지도 평균이 50을 넘으면 여당 후보가 이깁니다. 서울의 스물다섯 구를 아홉 생활권으로 묶었습니다. 지도에서 생활권의 이름을 누르면 후보가 그곳으로 가고, 투표함 양옆의 단추로 그 생활권의 표를 모읍니다. 단추와 결정은 정치력이 있는 한 몇 번이든 쓸 수 있습니다. 상대 후보도 사흘마다 한 곳을 돌며 표를 가져갑니다."
 TFRKPHN_by_debate:0 "방송 토론 준비"
 TFRKPHN_by_debate_desc:0 "후보가 일정을 비우고 방송 토론을 준비합니다. 상대의 구청장 시절 기록을 숫자까지 외웁니다."
 TFRKPHN_by_debate_tt:0 "서울 스물다섯 구 모두의 여당 지지도 §G+1§!"
 TFRKPHN_by_visit:0 "대통령의 민생 현장 방문"
 TFRKPHN_by_visit_desc:0 "대통령이 서울의 시장과 공사 현장을 찾습니다. 대통령은 선거 운동을 할 수 없어서 후보와 나란히 서지는 않습니다. 야당은 그래도 선거 개입이라고 비판할 것입니다."
 TFRKPHN_by_visit_tt:0 "서울 스물다섯 구 모두의 여당 지지도 §G+2§!"
