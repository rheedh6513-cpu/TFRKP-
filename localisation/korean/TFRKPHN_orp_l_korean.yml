 tfrkphn.7001.t:0 "초록 깃발의 아홉 석"
 tfrkphn.7001.d:0 "총선 개표가 끝나자 우리공화당은 아홉 석을 얻은 것으로 집계되었습니다. 지역구 다섯 곳과 비례대표 네 석입니다. 지난번 탈당한 의원 열네 명 가운데 다시 국회로 돌아온 사람은 절반이 되지 않았습니다.\n\n그래도 당선자 명단에서 가장 눈길을 끈 이름은 따로 있었습니다. 조원진 대표가 대구에서 지역구를 되찾았고, 비례대표 1번에는 황교안 전 국무총리가 이름을 올렸습니다. 지난 대선에서 오세훈에게 밀려난 두 사람이 나란히 국회로 돌아온 것입니다.\n\n당사 앞 개표 상황실에서는 초록색 깃발이 밤늦게까지 흔들렸습니다. 보수 진영의 표가 둘로 갈린 지역에서는 민주당 후보가 어부지리로 이긴 곳도 여럿 나왔습니다.\n\n정치권에서는 보수가 다시 두 개의 원내 정당으로 나뉘었다는 말이 나왔습니다. 여당 지도부는 개표 결과에 대한 논평을 다음 날로 미뤘습니다."
 tfrkphn.7001.a:0 "국회의 셈법이 바뀝니다."
