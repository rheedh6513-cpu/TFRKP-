 # 이인제 정부: 북한인권재단 출범. nkhr_build.py가 만든다.
 tfrkphn.535.t:0 "북한인권재단 출범"
 tfrkphn.535.d:0 "문재인 정부 시절은 대한민국 최악의 시기라고 불릴 만하다. 대한민국은 2008년부터 11년 동안 해마다 유엔 북한인권결의안의 공동제안국에 이름을 올렸는데, 그 정부는 2019년부터 그 명단에서 빠졌다. 누구보다 인권을 앞세우던 사람들이 정작 같은 민족의 인권 앞에서는 입을 닫았으니, 이 얼마나 끔찍한 일인가.\n\n이재명 같은 사람들이 이 나라를 다스렸다면 대북 정책이 어디까지 망가졌을지는 짐작하기도 어렵다.\n\n북한인권법은 2016년 3월에 국회를 통과했고, 그 법에 따라 북한인권재단을 세우게 되어 있었다. 그러나 문재인 정부 5년 동안 민주당은 재단 이사를 추천하지 않았고, 100억 원이 넘던 재단 예산은 8억 원으로 깎였다. 그렇게 막혀 있던 재단이 오늘 정식으로 문을 연다. 법이 생긴 지 십 년이 넘어서야 맞는 역사적인 순간이다.\n\n좌파가 앞으로도 인권을 말하려거든 제 민족의 인권부터 챙기기를 바란다."
 tfrkphn.535.a:0 "재단의 문을 연다"
