l_korean:
 # [안내] 홍준표 중점 이름(키 = 중점 id)과 설명(키 끝 _desc). UTF-8 BOM으로 저장하세요.
 # 홍준표 중점 이름과 설명
 TFRKPHN_hong_b01_03:0 "$TFRKPHN_hong_b04_04$"
 TFRKPHN_hong_b01_03_desc:0 "$TFRKPHN_hong_b04_04_desc$"
 TFRKPHN_hong_b01_04:0 "$TFRKPHN_hong_b04_08$"
 TFRKPHN_hong_b01_04_desc:0 "$TFRKPHN_hong_b04_08_desc$"
 TFRKPHN_hong_b01_05:0 "$TFRKPHN_hong_b04_06$"
 TFRKPHN_hong_b01_05_desc:0 "$TFRKPHN_hong_b04_06_desc$"
 TFRKPHN_hong_b01_06:0 "$TFRKPHN_hong_b04_05$"
 TFRKPHN_hong_b01_06_desc:0 "$TFRKPHN_hong_b04_05_desc$"
 TFRKPHN_hong_b01_07:0 "전통경찰국 설립"
 TFRKPHN_hong_b01_07_desc:0 "흔들리는 공권력으로는 국민을 지킬 수 없습니다. 경찰 조직을 정비하고 지휘 체계를 바로 세워, 법과 질서가 살아 있는 나라를 만듭니다."
 TFRKPHN_hong_b01_08:0 "$TFRKPHN_hong_b04_09$"
 TFRKPHN_hong_b01_08_desc:0 "$TFRKPHN_hong_b04_09_desc$"
 TFRKPHN_hong_b01_09:0 "$TFRKPHN_hong_b04_07$"
 TFRKPHN_hong_b01_09_desc:0 "$TFRKPHN_hong_b04_07_desc$"
 TFRKPHN_hong_b01_10:0 "민생도 보수"
 TFRKPHN_hong_b01_10_desc:0 "보수는 부자만을 위한 정치가 아닙니다. 서민의 밥상과 일자리를 지키는 것, 그것이 진짜 보수가 해야 할 일입니다."
 TFRKPHN_hong_b01_11:0 "안보도 보수"
 TFRKPHN_hong_b01_11_desc:0 "안보는 정권이 바뀌어도 흔들려서는 안 됩니다. 군사력만큼 정보력도 중요합니다. 약해진 대북 정보 역량을 다시 갖춥니다."
 TFRKPHN_hong_b01_13:0 "타오르는 불길"
 TFRKPHN_hong_b01_13_desc:0 "동북아의 긴장이 높아지고 있습니다."
 TFRKPHN_hong_b01_01:0 "홍준표 정부 출범"
 TFRKPHN_hong_b01_01_desc:0 "제20대 대통령 홍준표가 취임합니다."
 TFRKPHN_hong_b01_02:0 "폭풍이 지나간 이후"
 TFRKPHN_hong_b01_02_desc:0 "한때 우리를 위협했던 코로나는 끝났습니다. 정부는 사회적 거리두기 완화와 새로운 미래를 기대하고 있습니다."
 TFRKPHN_hong_b02_01:0 "대만지원법 발의"
 TFRKPHN_hong_b02_01_desc:0 "대만해협에서 전쟁이 벌어졌습니다. 대만이 무너지면 한반도도 안전하지 않습니다. 정부는 대만 지원 법안을 국회에 발의합니다."
 TFRKPHN_hong_b02_02:0 "대한민국의 양안전쟁 참전"
 TFRKPHN_hong_b02_02_desc:0 "대만지원법이 국회를 통과했습니다. 대한민국은 여전히 중립국입니다. 적어도 서류 위에서는 말입니다."
 TFRKPHN_hong_b02_04:0 "탄약 지원"
 TFRKPHN_hong_b02_04_desc:0 "현대전에서 가장 중요한 것은 보급입니다. 대한민국은 지난 70년간의 정전으로 수많은 탄약과 포탄을 보유하고 있습니다. 이를 우리는 대만과 일본에 \"대여\"해 줄 것입니다."
 TFRKPHN_hong_b02_08:0 "후방의 싸움"
 TFRKPHN_hong_b02_08_desc:0 "일제강점기 당시 한국인은 봉오동 전투와 광복군 등으로 연합국을 지원했습니다. 민주주의가 다시 위협받는 지금, 대한민국은 이번에도 민주주의 진영의 편에 섭니다."
 TFRKPHN_hong_b02_05:0 "국민 안심시키기"
 TFRKPHN_hong_b02_05_desc:0 "바다 건너에서 전쟁이 벌어지자 국민들의 불안이 커지고 있습니다. 정부는 국민의 일상을 지키고, 원치 않는 전쟁에 휘말리지 않겠다고 약속합니다."
 TFRKPHN_hong_b02_09:0 "강경한 대북관"
 TFRKPHN_hong_b02_09_desc:0 "중국이 대만에 발이 묶인 지금, 북한이 오판할 가능성이 커졌습니다. 어떤 도발에도 즉각 대응한다는 원칙을 분명히 해 평양의 오판을 막습니다."
 TFRKPHN_hong_b02_12:0 "병력 파견"
 TFRKPHN_hong_b02_12_desc:0 "간접 지원만으로는 한계가 있습니다. 결국 누군가는 직접 전장에 나서야 합니다."
 TFRKPHN_hong_b02_03:0 "부결"
 TFRKPHN_hong_b02_03_desc:0 "대만지원법이 야당의 반대로 국회에서 부결되었습니다. 대한민국은 이 전쟁에서 중립을 지킵니다. 그러나 중립을 지키는 데에도 힘이 필요합니다."
 TFRKPHN_hong_b02_06:0 "해상보급 지원"
 TFRKPHN_hong_b02_06_desc:0 "요즘 대한민국 조선소에 이름도 처음 듣는 해외 해운사들의 주문이 쏟아지고 있습니다. 이상하게도 그 배들은 하나같이 대만과 일본 근해에서 발견됩니다. 물론 대한민국은 중립국이며, 민간 기업의 수출에는 관여하지 않습니다."
 TFRKPHN_hong_b02_10:0 "그래도 할 건 해야지"
 TFRKPHN_hong_b02_10_desc:0 "국회는 대만지원법을 막았고, 대한민국은 공식적으로 중립국입니다. 그러나 공식적으로 할 수 없다고 해서 아무것도 하지 않을 수는 없습니다. 보이지 않는 곳에서, 할 건 해야 합니다."
 TFRKPHN_hong_b02_07:0 "국제사회에 중국 규탄"
 TFRKPHN_hong_b02_07_desc:0 "총을 들 수 없다면 목소리라도 높여야 합니다. 대한민국은 아시아의 민주주의 국가들과 함께 국제무대에서 중국의 침략을 규탄할 것입니다."
 TFRKPHN_hong_b02_11:0 "유럽으로 가는 K-방산"
 TFRKPHN_hong_b02_11_desc:0 "미국이 무너진 뒤 유럽의 무기고는 텅 비었습니다. 대만에 총을 보낼 수 없다면, 우리를 믿어 주는 유럽에 팔면 됩니다. 중립국 대한민국의 공장은 멈추지 않습니다."
 TFRKPHN_hong_b02_13:0 "비밀스러운 지원"
 TFRKPHN_hong_b02_13_desc:0 "국회는 대만지원법을 막았습니다. 그러나 장부에서 탄약 몇 상자가 사라지는 일까지 국회가 막을 수는 없습니다."
 TFRKPHN_hong_b03_01:0 "승리의 날"
 TFRKPHN_hong_b03_01_desc:0 "양안전쟁이 끝났습니다. 대만은 살아남았고, 중국의 침공은 실패로 돌아갔습니다. 대한민국은 이 전쟁의 승전국입니다."
 TFRKPHN_hong_b03_02:0 "떠나간 이를 기리며"
 TFRKPHN_hong_b03_02_desc:0 "전쟁에 참여한 모든 이들을 기억해야 합니다. 의용군과 장병, 그리고 후방에서 싸운 이름 없는 사람들까지."
 TFRKPHN_hong_b03_03:0 "진 - 다할 진"
 TFRKPHN_hong_b03_03_desc:0 "다할 진. 대통령은 남은 임기를 국정에 전념하겠다고 다짐합니다. 정치의 갈래가 열립니다."
 TFRKPHN_hong_b03_04:0 "모래시계의 칼"
 TFRKPHN_hong_b03_04_desc:0 "모래시계 검사 시절 그대로, 성역 없는 부패 척결에 나섭니다."
 TFRKPHN_hong_b03_05:0 "작은 정부"
 TFRKPHN_hong_b03_05_desc:0 "비대해진 정부 조직을 줄이고 공무원 정원을 묶어 군살을 뺍니다."
 TFRKPHN_hong_b03_06:0 "범죄와의 전쟁"
 TFRKPHN_hong_b03_06_desc:0 "검사 홍준표의 이름을 알린 그 전쟁을 대통령 홍준표가 다시 시작합니다."
 TFRKPHN_hong_b03_07:0 "강성 귀족노조 개혁"
 TFRKPHN_hong_b03_07_desc:0 "기득권이 된 강성 노조의 불법 파업에 법과 원칙으로 대응합니다."
 TFRKPHN_hong_b03_08:0 "홍카콜라 국정 소통"
 TFRKPHN_hong_b03_08_desc:0 "제도권 언론의 편향을 넘어, 대통령이 국민에게 직접 말합니다. 트럼프는 트위터 하나로 반트럼프 언론 전체를 상대했습니다. 이제 우리에게도 그런 시대가 왔습니다."
 TFRKPHN_hong_b03_09:0 "서민 대통령"
 TFRKPHN_hong_b03_09_desc:0 "신용사면과 영업재개 자금으로 벼랑 끝의 서민과 자영업자를 붙잡습니다."
 TFRKPHN_hong_b03_10:0 "충 - 충성 충"
 TFRKPHN_hong_b03_10_desc:0 "충성 충. 국방은 정쟁의 대상이 아닙니다. 군사의 갈래가 열립니다."
 TFRKPHN_hong_b03_11:0 "무장평화론"
 TFRKPHN_hong_b03_11_desc:0 "평화는 구걸이 아니라 힘으로 지킵니다. 남북 핵균형을 국방의 원칙으로 삼습니다."
 TFRKPHN_hong_b03_12:0 "모병제 확대"
 TFRKPHN_hong_b03_12_desc:0 "고급 기술을 갖춘 직업군인 중심의 정예군으로 바꿉니다."
 TFRKPHN_hong_b03_13:0 "3축 체계 완성"
 TFRKPHN_hong_b03_13_desc:0 "킬체인, 한국형 미사일 방어, 대량응징보복의 3축을 완성합니다. 전국에 레이더와 방공망을 깔고, 현무 계열 탄도미사일을 양산해 대량응징보복 능력을 갖춥니다."
 TFRKPHN_hong_b03_14:0 "PDTO 핵억지 협의"
 TFRKPHN_hong_b03_14_desc:0 "PDTO 회원국과 함께 북핵에 맞설 공동 핵억지 체계를 논의합니다."
 TFRKPHN_hong_b03_15:0 "남북 불간섭 원칙"
 TFRKPHN_hong_b03_15_desc:0 "북한 체제에 간섭하지도, 간섭받지도 않는다. 힘의 균형 위의 공존입니다."
 TFRKPHN_hong_b03_16:0 "EADI 대응"
 TFRKPHN_hong_b03_16_desc:0 "중국이 이끄는 EADI의 위협에 맞서 억지력을 갖추고, 동남아 국가들과 손잡는 신남방정책을 다시 꺼내 듭니다."
 TFRKPHN_hong_b03_17:0 "보 - 갚을 보"
 TFRKPHN_hong_b03_17_desc:0 "갚을 보. 받은 은혜는 갚고, 저지른 잘못에는 책임을 묻습니다. 외교의 갈래가 열립니다."
 TFRKPHN_hong_b03_18:0 "PDTO 협력 강화"
 TFRKPHN_hong_b03_18_desc:0 "미군이 떠난 자리를 메운 PDTO와의 협력을 한층 강화합니다."
 TFRKPHN_hong_b03_19:0 "대만과의 약속을 지키다"
 TFRKPHN_hong_b03_19_desc:0 "끝까지 함께하겠다던 약속을 지켜 대만과 상호방위 관계를 맺습니다."
 TFRKPHN_hong_b03_20:0 "응보"
 TFRKPHN_hong_b03_20_desc:0 "전쟁을 일으킨 중국 공산당에게 그 대가를 분명히 묻습니다."
 TFRKPHN_hong_b03_21:0 "PDTO 에너지 공급망"
 TFRKPHN_hong_b03_21_desc:0 "PDTO 회원국과 에너지 공급망을 묶어 경제 안보를 지킵니다."
 TFRKPHN_hong_b03_22:0 "국익우선 실용외교"
 TFRKPHN_hong_b03_22_desc:0 "이념보다 국익. 동남아 시장을 향해 실리 외교를 펼칩니다."
 TFRKPHN_hong_b03_23:0 "보은의 외교"
 TFRKPHN_hong_b03_23_desc:0 "은혜를 아는 나라라는 이름 아래 아시아 민주주의 국가들이 손을 잡습니다."
 TFRKPHN_hong_b03_24:0 "홍준표의 대한민국"
 TFRKPHN_hong_b03_24_desc:0 "경제와 국방, 외교의 기틀이 잡혔습니다. 이제 대한민국은 스스로의 힘으로 다음 길을 고를 수 있습니다."
 TFRKPHN_hong_b03_25:0 "걸어온 길, 걸어가는 길"
 TFRKPHN_hong_b03_25_desc:0 "대통령 홍준표가 걸어온 4년. 그리고 대한민국이 앞으로 걸어갈 길."
 TFRKPHN_hong_b03_26:0 "국 - 나라 국"
 TFRKPHN_hong_b03_26_desc:0 "나라 국. 부강한 나라는 튼튼한 산업 위에 섭니다. 산업의 갈래가 열립니다."
 TFRKPHN_hong_b03_27:0 "비상경제위원회"
 TFRKPHN_hong_b03_27_desc:0 "대통령이 직접 위원장을 맡아 경제 회복을 지휘합니다."
 TFRKPHN_hong_b03_28:0 "규제 네거티브 전환"
 TFRKPHN_hong_b03_28_desc:0 "금지한 것 말고는 모두 허용한다. 기업을 묶던 규제를 걷어 냅니다."
 TFRKPHN_hong_b03_29:0 "법인세 인하"
 TFRKPHN_hong_b03_29_desc:0 "OECD 평균보다 높은 법인세를 낮춰 기업이 돌아오게 합니다."
 TFRKPHN_hong_b03_30:0 "7대 미래산업"
 TFRKPHN_hong_b03_30_desc:0 "AI, 바이오, 메모리 반도체, 모빌리티, 우주, 수소와 원전, 콘텐츠를 집중 육성합니다."
 TFRKPHN_hong_b03_31:0 "선진대한민국 미래펀드"
 TFRKPHN_hong_b03_31_desc:0 "민관이 함께 100조 원 규모의 미래펀드를 조성합니다."
 TFRKPHN_hong_b03_32:0 "채무 제로"
 TFRKPHN_hong_b03_32_desc:0 "경남도를 빚 없는 광역단체로 만들었던 그 방식으로 나라 살림을 바로 세웁니다."
 TFRKPHN_hong_b04_01:0 "개헌 논의"
 TFRKPHN_hong_b04_01_desc:0 "1987년 헌법은 민주화를 뿌리내리게 했지만, 40년 가까이 지나며 낡은 조항들이 국정의 발목을 잡고 있습니다. 역대 정부는 개헌을 약속하고도 집권하면 미뤄 왔습니다. 전쟁에서 이긴 지금이 '87년 체제'를 넘어설 마지막 기회입니다. 개헌안을 국회에 올리고, 300일 안에 찬성 200석을 모아야 합니다."
 TFRKPHN_hong_b04_02:0 "4년 중임제 개헌"
 TFRKPHN_hong_b04_02_desc:0 "5년 단임의 한계를 넘어, 평가받고 책임지는 제도를 만듭니다."
 TFRKPHN_hong_b04_03:0 "양원제 도입"
 TFRKPHN_hong_b04_03_desc:0 "국회를 상원과 하원으로 나누어 입법의 속도와 신중함을 함께 확보합니다."
 TFRKPHN_hong_b04_04:0 "사법시험 부활"
 TFRKPHN_hong_b04_04_desc:0 "출신 배경이 아니라 실력으로 법조인이 되는 길을 다시 엽니다."
 TFRKPHN_hong_b04_05:0 "정시 확대"
 TFRKPHN_hong_b04_05_desc:0 "대입의 공정성은 입시 방식이 아니라 신뢰에서 나옵니다. 수능의 비중을 키웁니다."
 TFRKPHN_hong_b04_06:0 "단계적 모병제"
 TFRKPHN_hong_b04_06_desc:0 "병력의 숫자보다 병사의 숙련도를 먼저 따지는 군으로 나아갑니다."
 TFRKPHN_hong_b04_07:0 "핵공유 협의체"
 TFRKPHN_hong_b04_07_desc:0 "핵우산이 흔들린 시대, 스스로 지킬 수단을 협의의 테이블 위에 올립니다."
 TFRKPHN_hong_b04_08:0 "노동 유연성 확대"
 TFRKPHN_hong_b04_08_desc:0 "일자리를 지키는 방법과 일자리를 만드는 방법은 같지 않습니다."
 TFRKPHN_hong_b04_09:0 "공영방송 민영화"
 TFRKPHN_hong_b04_09_desc:0 "누구의 방송이어야 하는가. 정부의 손을 떠난 방송의 길을 엽니다."
 TFRKPHN_hong_b04_10:0 "연말 국정 점검"
 TFRKPHN_hong_b04_10_desc:0 "한 해 동안 꺼내 든 개혁의 성적표를 받아 듭니다."
 TFRKPHN_hong_b04_11:0 "정, 부통령제 도입"
 TFRKPHN_hong_b04_11_desc:0 "대통령 유고 시의 공백을 없애고 국정의 연속성을 지키기 위해, 대통령과 부통령을 함께 뽑는 정, 부통령제를 헌법에 담습니다."
 TFRKPHN_hong_b04_12:0 "헌법재판소 폐지"
 TFRKPHN_hong_b04_12_desc:0 "정치적 사법기관으로 전락한 헌법재판소를 없애고, 대법원 안에 헌법재판부를 두어 중립적인 법관들이 헌법재판을 맡게 합니다."
 TFRKPHN_hong_b04_13:0 "공수처 폐지"
 TFRKPHN_hong_b04_13_desc:0 "옥상옥이라는 비판을 받아온 공수처를 폐지하고, 모든 범죄 수사는 국가수사국이 전담하게 하며 특별감찰관 제도를 도입합니다."
 TFRKPHN_hong_b04_14:0 "중대선거구제 도입"
 TFRKPHN_hong_b04_14_desc:0 "한 지역구에서 한 명만 뽑는 소선거구제는 승자독식과 지역주의를 키웠습니다. 한 선거구에서 여러 명을 뽑는 중대선거구제로 바꿉니다."
 TFRKPHN_hong_b04_15:0 "선관위 개편"
 TFRKPHN_hong_b04_15_desc:0 "부실 관리와 채용 비리로 신뢰를 잃은 선거관리위원회를 대대적으로 개편하고, 누구도 의심하지 않는 공정선거 시스템을 새로 만듭니다."
 TFRKPHN_hong_b04_16:0 "국가수사국 설치"
 TFRKPHN_hong_b04_16_desc:0 "공수처가 사라진 자리에 한국판 FBI, 국가수사국을 세웁니다. 모든 범죄 수사는 이곳이 전담합니다."
 TFRKPHN_hong_b04_17:0 "개헌위원회 설립"
 TFRKPHN_hong_b04_17_desc:0 "정부와 국회에 함께 개헌위원회를 세워 여야가 합동으로 조율합니다. 날치기 개헌이라는 말은 나오지 않게 해야 합니다."
 TFRKPHN_hong_b03_33:0 "동서 화합"
 TFRKPHN_hong_b03_33_desc:0 "영남과 호남, 오래된 지역 갈등의 벽을 허뭅니다."
 TFRKPHN_hong_b03_34:0 "청년의 꿈 플랫폼"
 TFRKPHN_hong_b03_34_desc:0 "청년의 목소리를 국정에 직접 반영하는 창구를 만듭니다."
 TFRKPHN_hong_b03_35:0 "진력"
 TFRKPHN_hong_b03_35_desc:0 "갈등이 모두 사라지지는 않았지만, 대화의 자리는 다시 마련되었습니다."
 TFRKPHN_hong_b03_36:0 "국방과학연구소 강화"
 TFRKPHN_hong_b03_36_desc:0 "무기를 사 오는 나라에서 만드는 나라로, AI 기반 스마트 국방을 준비합니다."
 TFRKPHN_hong_b03_37:0 "군 가산점 부활"
 TFRKPHN_hong_b03_37_desc:0 "1999년 헌법재판소 결정으로 폐지된 군 가산점 제도를 되살립니다. 성별과 관계없이 군 복무를 마친 모든 이에게 가산점을 줍니다."
 TFRKPHN_hong_b03_38:0 "충성의 3축 5군"
 TFRKPHN_hong_b03_38_desc:0 "육, 해, 공군에 해병특수군과 우주사령부를 더한 3축 5군 체제가 완성됩니다. 초대형 탄도미사일 현무-5를 공개하고, 차세대 현무-6 개발에 들어가며, 장거리 지대공 미사일 L-SAM으로 한국형 미사일방어를 두텁게 합니다."
 TFRKPHN_hong_b03_39:0 "유럽 우방에 보답하다"
 TFRKPHN_hong_b03_39_desc:0 "전쟁 중 지지를 보내 준 유럽 우방과 방산 협력으로 관계를 갚습니다."
 TFRKPHN_hong_b03_40:0 "보훈"
 TFRKPHN_hong_b03_40_desc:0 "나라를 위해 싸운 이들의 희생에 국가가 끝까지 보답합니다."
 TFRKPHN_hong_b03_41:0 "결초보은"
 TFRKPHN_hong_b03_41_desc:0 "결초보은. 대한민국은 약속을 지키는 나라라는 평판을 얻습니다."
 TFRKPHN_hong_b03_42:0 "토지임대부 주택"
 TFRKPHN_hong_b03_42_desc:0 "땅은 국가가, 집은 국민이. 청년과 신혼부부에게 내 집 마련의 길을 엽니다."
 TFRKPHN_hong_b03_43:0 "원전 강국"
 TFRKPHN_hong_b03_43_desc:0 "원전 생태계를 되살려 값싸고 안정적인 에너지를 확보합니다."
 TFRKPHN_hong_b03_44:0 "G7 선진국"
 TFRKPHN_hong_b03_44_desc:0 "중산층 65%를 목표로 한 성장 정책이 성과를 냅니다. 대한민국은 G7 수준의 선진국 대열에 다가섭니다."
