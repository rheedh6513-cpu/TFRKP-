 TFRKPHN_job_tt_lab:0 "§Y노동계§!\n50 이상이면 합의에 응합니다.\n35 아래: 안정도 §R-3%§!, 일자리 배수 §R-0.2§!\n20 아래: 안정도 §R-6%§!, 그리고 §R총파업§!\n\n§g고용노동부 장관이 노동계 출신이면 높게 시작합니다.§!"
 TFRKPHN_job_tt_gov:0 "§Y정부§!\n노선을 고르기 전: 결정 비용 §Y40§!, 일자리 x1.0\n하르츠식 대타협: 결정 비용 §Y50§!, 일자리 §Gx1.2§!\n국회 입법으로 돌파: 결정 비용 §Y30§!, 일자리 §Rx0.8§!\n\n노사정 합의문에 서명하면 여기에 다시 §Gx1.5§!를 곱합니다.\n\n§g[TFRKPHN_mof] 신임이 70 이상이면 배수 +0.1, 30 이하면 -0.1§!"
 TFRKPHN_job_tt_biz:0 "§Y경영계§!\n50 이상이면 합의에 응합니다.\n35 아래: 민간 공장 건설 속도 §R-5%§!, 일자리 배수 §R-0.2§!\n20 아래: 민간 공장 건설 속도 §R-10%§!, 그리고 §R투자 철수§!\n\n§g산업통상자원부 장관에 따라 높게 시작합니다.§!"
 TFRKPHN_job_tt_logo_lab:0 "§Y한국노동조합총연맹 (한국노총)§!\n민주노총과 함께 양대 노총으로 불리는 노동조합 총연합\n단체입니다.\n\n§Y역사§!\n1946년 3월 10일 대한독립촉성노동총연맹으로 출발했습니다.\n1961년 8월 한국노동조합총연맹으로 다시 결성됐습니다.\n2015년 9월 노사정 대타협 합의문에 노동계 대표로\n서명했습니다."
 TFRKPHN_job_tt_logo_biz:0 "§Y경제 5단체§!\n경영계를 대표하는 다섯 단체를 묶어 부르는 말입니다.\n\n§Y대한상공회의소§!\n1884년 한성상업회의소를 뿌리로 삼습니다. 1952년\n상공회의소법으로 법정 단체가 됐습니다.\n\n§Y한국경제인협회§!\n1961년 같은 이름으로 출발했습니다. 1968년\n전국경제인연합회가 됐다가 2023년 옛 이름으로 돌아왔습니다.\n대기업이 중심입니다.\n\n§Y한국무역협회§!\n수출입 기업의 단체입니다.\n\n§Y중소기업중앙회§!\n1962년 중소기업협동조합중앙회로 출발했습니다. 2006년\n지금 이름이 됐습니다.\n\n§Y한국경영자총협회§!\n1970년에 생겼습니다. 노사 문제에서 경영계를 대표하고,\n2015년 노사정 대타협 합의문에도 서명했습니다."
