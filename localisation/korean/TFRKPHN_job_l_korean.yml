 tfrkphn.282.tt:0 "일자리 §R-5만 개§!\n경영계 게이지가 §Y30§!으로 돌아옵니다.\n노동계 §R-5§!"
 tfrkphn.283.t:0 "일자리 100만 개"
 tfrkphn.283.d:0 "청와대 집무실, 밤 아홉 시.\n\n통계청 보고서가 책상에 놓여 있었다. 첫 장에 숫자가 하나 있었다. 취임 뒤 새로 생긴 일자리가 100만 개를 넘었다는 숫자였다. 이인제는 안경을 벗고 그 숫자를 다시 읽었다.\n\n그는 1993년 6월의 울산을 떠올렸다. 김영삼 정부의 노동부 장관이었고 마흔넷이었다. 내각에서 가장 젊었다. 현대 계열사의 분규가 번지자 그는 직접 내려갔다. 밤에는 현대정공 노조 사무실에 앉아 간부들의 말을 들었다. 이튿날 아침에는 현대자동차 노조를 찾았다. 오전에는 사장단과 임원 스물여섯 명과 마주 앉았다. 장관이 분규 현장에 내려온 것은 정부가 생긴 뒤 처음이라고 신문이 썼다.\n\n그 이틀 동안 그는 양쪽에서 같은 것을 보았다. 노조는 임금을 말했고 사장들은 수주를 말했다. 둘 다 공장이 돌아가야 할 수 있는 말이었다.\n\n그해 12월에 고용보험법이 만들어졌다. 그는 그달에 장관에서 물러났다. 법은 1995년 7월에 시행됐다. 그는 그것을 장관실 밖에서 보았다.\n\n대통령이 되던 날 그는 일자리부터 만들겠다고 말했다. 전쟁에서 돌아온 장병들이 구직 창구 앞에 줄을 서 있던 때였다. 그 줄이 지난달에 없어졌다고 보고서 둘째 장에 적혀 있었다.\n\n그는 보고서를 덮고 비서실장을 불렀다.\n\n\"내일 일정에 울산을 넣게.\"\n\n\"잡혀 있는 행사가 없습니다.\"\n\n\"행사는 필요 없네. 공장 식당에서 점심이나 먹고 오세.\""
 tfrkphn.283.a:0 "약속을 지켰다"
