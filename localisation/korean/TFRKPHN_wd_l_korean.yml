l_korean:
 # 이인제 정부 전쟁 국채 상환. debt_build.py가 만든다.
 TFRKPHN_wd_left:0 "남은 국채 §Y[?TFRKPHN_wd_left|0]§! / 100"
 TFRKPHN_wd_days:0 "남은 기한 §Y[?TFRKPHN_wd_days|0]§!일"
 TFRKPHN_wd_b_budget:0 "예산에서 갚는다"
 TFRKPHN_wd_b_budget_tt:0 "§Y예산에서 갚는다§!\n올해 예산의 남는 돈을 국채 상환에 돌립니다.\n\n비용: £pol_power §Y20§!\n전쟁 국채 §G-10§!\n\n§g한 번 쓰면 30일 동안 다시 쓸 수 없습니다.§!"
 TFRKPHN_wd_b_surplus:0 "군수 재고 매각"
 TFRKPHN_wd_b_surplus_tt:0 "§Y남은 군수 재고를 판다§!\n전쟁이 끝나고 남은 탄약과 장비를 우방에 팝니다. 군은 반기지 않습니다.\n\n비용: £pol_power §Y10§!\n전쟁 국채 §G-20§!\n전쟁 지지도 §R-2%§!\n\n§g한 번 쓰면 90일 동안 다시 쓸 수 없습니다.§!\n§g2번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_b_cut:0 "복구 사업 연기"
 TFRKPHN_wd_b_cut_tt:0 "§Y복구 사업을 미룬다§!\n급하지 않은 복구 사업을 뒤로 미루고 그 돈으로 빚을 갚습니다.\n\n비용: £pol_power §Y10§!\n전쟁 국채 §G-15§!\n안정도 §R-1%§!\n\n§g한 번 쓰면 60일 동안 다시 쓸 수 없습니다.§!\n§g2번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_b_bond:0 "승전 채권 발행"
 TFRKPHN_wd_b_bond_tt:0 "§Y승전 채권을 발행한다§!\n국민에게 채권을 팔아 외국에 진 빚부터 갚습니다. 기한이 120일 늘어납니다.\n\n비용: £pol_power §Y15§!\n전쟁 국채 §G-15§!\n안정도 §R-2%§!\n기한 §G+120일§!\n\n§g1번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_hint:0 "§g기한 안에 전쟁 국채를 다 갚으면 탭이 닫히고 보상을 받습니다. 통일세를 걷기로 했다면 갚을 빚이 줄어듭니다.§!"
 TFRKPHN_lee_debt_category:0 "전쟁 국채 상환"
 TFRKPHN_lee_debt_category_desc:0 "승전의 값으로 진 전쟁 국채를 730일 안에 갚습니다."
 TFRKPHN_wd_start_tt:0 "결정 탭에 §Y전쟁 국채 상환§!이 열립니다. §Y730일§! 안에 전쟁 국채 §Y100§!을 갚아야 합니다."
 tfrkphn.526.t:0 "마지막 국채"
 tfrkphn.526.d:0 "기획재정부가 전쟁 국채의 마지막 회차를 갚았다고 발표했는데, 약속한 기한을 넘기지 않은 상환이었습니다.\n\n대한민국은 전에도 큰 빚을 일찍 갚은 적이 있습니다. 1997년 11월 21일에 정부는 국제통화기금에 돈을 빌려 달라고 했고, 2001년 8월 23일에 마지막 돈을 갚았습니다. 빌린 돈은 195억 달러였으며 갚은 날은 약속한 날보다 3년쯤 빨랐습니다.\n\n1997년 12월, 대선에 나선 이인제는 300일 경제위기 극복대책을 내놓았습니다. 석 달 안에 위기에서 벗어나고 여섯 달 안에 안정을 찾아 열두 달 안에 제자리로 돌아간다는 계획이었지만, 그가 선거에서 지는 바람에 써 보지도 못했습니다.\n\n30년 뒤에 그는 다른 빚을 갚았습니다. 기자들 앞에 선 대통령은 길게 말하지 않고, 빚을 갚은 것은 정부가 아니고 세금을 낸 국민이라고만 했습니다."
 tfrkphn.526.a:0 "빚 없는 승전국"
 tfrkphn.527.t:0 "넘긴 기한"
 tfrkphn.527.d:0 "약속한 기한이 지났는데도 전쟁 국채는 [?TFRKPHN_wd_left|0]이 남았습니다.\n\n기획재정부가 상환 일정을 다시 짜겠다고 발표하자 야당은 대통령이 스스로 건 약속을 스스로 어겼다고 했고, 채권 시장에서는 국채 금리가 올랐습니다.\n\n홍준표 전 대통령도 글을 올렸습니다. 자신은 경남도의 빚을 다 갚고 나왔다면서, 빚은 약속한 날에 갚는 것이지 형편이 될 때 갚는 것이 아니라고 썼습니다.\n\n대통령은 변명하지 않고, 남은 빚은 다음 예산에 먼저 넣겠다고만 했습니다."
 tfrkphn.527.a:0 "남은 빚은 예산으로 넘긴다"
