l_korean:
 # 이인제 정부 전쟁 국채 상환. debt_build.py가 만든다.
 TFRKPHN_wd_left:0 "남은 국채 §Y[?TFRKPHN_wd_left|0]§! / 150"
 TFRKPHN_wd_days:0 "남은 기한 §Y[?TFRKPHN_wd_days|0]§!일"
 TFRKPHN_wd_b_budget:0 "예산에서 갚는다"
 TFRKPHN_wd_b_budget_tt:0 "§Y예산에서 갚는다§!\n올해 예산의 남는 돈을 국채 상환에 돌립니다.\n\n비용: £pol_power §Y20§!\n전쟁 국채 §G-10§!\n국가 부채 §G-10십억§!\n\n§g한 번 쓰면 30일 동안 다시 쓸 수 없습니다.§!"
 TFRKPHN_wd_b_surplus:0 "군수 재고 매각"
 TFRKPHN_wd_b_surplus_tt:0 "§Y남은 군수 재고를 판다§!\n전쟁이 끝나고 남은 탄약과 장비를 우방에 팝니다. 군은 반기지 않습니다.\n\n비용: £pol_power §Y10§!\n전쟁 국채 §G-20§!\n국가 부채 §G-20십억§!\n전쟁 지지도 §R-2%§!\n\n§g한 번 쓰면 90일 동안 다시 쓸 수 없습니다.§!\n§g2번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_b_cut:0 "복구 사업 연기"
 TFRKPHN_wd_b_cut_tt:0 "§Y복구 사업을 미룬다§!\n급하지 않은 복구 사업을 뒤로 미루고 그 돈으로 빚을 갚습니다.\n\n비용: £pol_power §Y10§!\n전쟁 국채 §G-15§!\n국가 부채 §G-15십억§!\n안정도 §R-1%§!\n\n§g한 번 쓰면 60일 동안 다시 쓸 수 없습니다.§!\n§g2번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_b_bond:0 "승전 채권 발행"
 TFRKPHN_wd_b_bond_tt:0 "§Y승전 채권을 발행한다§!\n국민에게 채권을 팔아 외국에 진 빚부터 갚습니다. 기한이 120일 늘어납니다.\n\n비용: £pol_power §Y15§!\n전쟁 국채 §G-15§!\n§g국가 부채는 줄지 않습니다.§!\n안정도 §R-2%§!\n기한 §G+120일§!\n\n§g1번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_b_export:0 "방산 수출 대금"
 TFRKPHN_wd_b_export_tt:0 "§Y방산 수출 대금으로 갚는다§!\n전쟁에서 성능을 보인 무기를 사겠다는 나라가 줄을 섰습니다. 그 대금을 국채 상환에 돌립니다.\n\n비용: £pol_power §Y10§!\n전쟁 국채 §G-15§!\n국가 부채 §G-15십억§!\n\n§g한 번 쓰면 120일 동안 다시 쓸 수 없습니다.§!\n§g2번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_b_ally:0 "동맹국 분담 요청"
 TFRKPHN_wd_b_ally_tt:0 "§Y동맹국에 전쟁 비용 분담을 요청한다§!\n함께 싸운 PDTO 회원국들에 전쟁 비용의 일부를 나눠 지자고 요청합니다. 한 번만 꺼낼 수 있는 말입니다.\n\n비용: £pol_power §Y30§!\n전쟁 국채 §G-25§!\n국가 부채 §G-25십억§!\n\n§g1번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_b_biz:0 "재계의 국채 인수"
 TFRKPHN_wd_b_biz_tt:0 "§Y재계가 국채를 사 준다§!\n주요 그룹이 국채를 사들입니다. 빚의 주인이 바뀔 뿐이고, 재계는 그만큼 할 말이 많아집니다.\n\n비용: £pol_power §Y15§!\n전쟁 국채 §G-20§!\n§g국가 부채는 줄지 않습니다.§!\n재계의 저항 §R+10§!\n\n§g1번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_b_seize:0 "추징금 환수"
 TFRKPHN_wd_b_seize_tt:0 "§Y정경유착 추징금을 국고에 넣는다§!\n정경유착 수사로 기소된 사람들에게서 거둔 추징금을 국채 상환에 씁니다.\n\n비용: 없음\n전쟁 국채 §G-15§!\n국가 부채 §G-15십억§!\n\n§g1번까지 쓸 수 있습니다.§!\n§R재벌 개혁 탭의 정경유착 수사를 기소까지 끝내야 합니다.§!"
 TFRKPHN_wd_hint:0 "§g갚은 만큼 국가 부채도 줄어듭니다. 90일마다 이자로 전쟁 국채가 5 늘어납니다. 기한 안에 다 갚으면 탭이 닫히고 보상을 받습니다.§!"
 TFRKPHN_lee_debt_category:0 "전쟁 국채 상환"
 TFRKPHN_lee_debt_category_desc:0 "승전의 값으로 진 전쟁 국채를 730일 안에 갚습니다."
 TFRKPHN_wd_start_tt:0 "결정 탭에 §Y전쟁 국채 상환§!이 열립니다. §Y730일§! 안에 전쟁 국채 §Y150§!을 갚아야 합니다. 갚은 만큼 §Y국가 부채§!도 줄어듭니다.\n§g국가 부채가 이미 없다면 탭 대신 이벤트가 뜹니다.§!"
 tfrkphn.526.t:0 "마지막 국채"
 tfrkphn.526.d:0 "기획재정부가 전쟁 국채의 마지막 회차를 갚았다고 발표했는데, 약속한 기한을 넘기지 않은 상환이었습니다.\n\n대한민국은 전에도 큰 빚을 일찍 갚은 적이 있습니다. 1997년 11월 21일에 정부는 국제통화기금에 돈을 빌려 달라고 했고, 2001년 8월 23일에 마지막 돈을 갚았습니다. 빌린 돈은 195억 달러였으며 갚은 날은 약속한 날보다 3년쯤 빨랐습니다.\n\n1997년 12월, 대선에 나선 이인제는 300일 경제위기 극복대책을 내놓았습니다. 석 달 안에 위기에서 벗어나고 여섯 달 안에 안정을 찾아 열두 달 안에 제자리로 돌아간다는 계획이었지만, 그가 선거에서 지는 바람에 써 보지도 못했습니다.\n\n30년 뒤에 그는 다른 빚을 갚았습니다. 기자들 앞에 선 대통령은 길게 말하지 않고, 이 빚은 세금을 낸 국민이 갚았다고만 했습니다."
 tfrkphn.526.a:0 "빚 없는 승전국"
 tfrkphn.529.t:0 "갚을 빚이 없다"
 tfrkphn.529.d:0 "기획재정부 장관이 보고서를 들고 왔는데, 표지를 넘기기도 전에 결론부터 말했습니다. 갚을 전쟁 국채가 남아 있지 않다는 것이었습니다.\n\n전쟁을 치른 나라가 빚 없이 전후를 맞는 일은 드뭅니다. 대한민국은 1997년 11월 21일에 국제통화기금에 손을 벌렸다가 2001년 8월 23일에야 마지막 돈을 갚았고, 그 195억 달러를 약속보다 3년쯤 일찍 갚은 일을 오래도록 자랑으로 삼아 온 나라입니다.\n\n대통령은 2년 안에 갚겠다고 써 둔 연설문을 서랍에 넣었습니다. 빚 갚을 돈이 따로 필요 없다면 그만큼을 세금에서 덜어 내라는 것이 그 자리에서 내린 지시였습니다."
 tfrkphn.529.a:0 "빚 없는 승전국"
 tfrkphn.530.t:0 "빈 선반"
 tfrkphn.530.story:0 "경기도 북부, 어느 탄약창.\n\n트럭 열두 대가 새벽부터 창고 앞에 줄을 섰다. 전쟁이 끝나고 남은 포탄을 우방에 판다는 공문이 내려온 것이 지난주였고, 오늘은 그 첫 물량이 나가는 날이었다.\n\n하사 계급장을 단 지 얼마 안 된 김지원이 인수증을 들고 상자 수를 셌다. 상자 옆면에는 생산 연월이 찍혀 있었는데, 전쟁이 한창이던 달에 공장들이 밤을 새워 찍어 낸 것들이었다.\n\n\"분대장님, 이거 다 나가면 우리는 뭘로 훈련합니까.\"\n\n\"교탄은 따로 남긴단다. 서류에는 그렇게 돼 있어.\"\n\n\"서류에는요.\"\n\n지원은 대답하지 않고 인수증에 서명했다. 마지막 트럭이 정문을 빠져나간 뒤 창고에 들어가 보니 선반 세 줄이 통째로 비어 있었고, 바닥에는 상자가 놓였던 자리만 먼지 없이 네모나게 남아 있었다."
 tfrkphn.530.a:0 "교탄 수량부터 다시 센다"
 tfrkphn.531.t:0 "만기일"
 tfrkphn.531.story:0 "서울 노원구, 한 시중은행 지점.\n\n최씨는 몇 해 전과 같은 대기석에 앉아 번호표를 쥐고 있었다. 이제 일흔을 바라보는 나이였고 오늘도 정기예금 만기였다. 그때 반만 떼어 넣었던 미래펀드는 전쟁 통에 반 토막이 났다가 지난해에야 제자리를 찾았는데, 그사이 손녀는 대학을 졸업하고 반도체 회사에 들어갔다.\n\n대기석 위 TV에서는 승전 채권 광고가 나오고 있었다. 전쟁에서 진 빚을 국민이 먼저 사 주면 외국에 줄 이자가 준다는 내용이었다.\n\n옆자리에서 혀 차는 소리가 났다. 돌아보지 않아도 철물점 박씨였다.\n\n\"이번엔 채권이래. 펀드 다음엔 채권, 채권 다음엔 또 뭐가 나오려나.\"\n\n\"자네는 안 사나.\"\n\n\"샀지. 어제. 아들놈이 거기 갔다 왔는데 안 살 수가 있나.\"\n\n박씨는 그 말만 하고 번호표를 들여다보았다. 그 집 아들이 대만에 갔다 왔다는 것을 최씨는 그날 처음 알았다.\n\n번호가 불렸다. 창구 직원은 그때 그 직원이 아니었지만 내미는 서류는 같았다.\n\n\"재예치하시겠어요, 고객님? 승전 채권도 오늘부터 받고 있습니다.\"\n\n\"이자는 예금보다 못하다면서요.\"\n\n\"네, 조금 낮습니다.\"\n\n최씨는 펜을 든 채 잠깐 창밖을 보았다. 길 건너 철물점 셔터에는 휴가 나온 군인이 붙이고 간 부대 스티커가 아직 붙어 있었다.\n\n\"반만 해 주시오. 반은 그냥 예금으로 두고.\"\n\n직원이 웃으면서 지난번에도 그렇게 하셨다고 기록에 나온다고 했다. 최씨는 그러냐고만 하고 서명했다."
 tfrkphn.531.a:0 "반은 예금, 반은 채권"
 tfrkphn.532.t:0 "분담금"
 tfrkphn.532.d:0 "PDTO 재무장관 회의에서 대한민국이 전쟁 비용을 나눠 지자고 요청했고, 회의는 예정보다 세 시간이나 길어졌습니다.\n\n일본은 함께 싸운 전쟁이니 나눠 지는 것이 맞다면서도 금액은 본국 의회와 상의해야 한다고 했습니다. 가장 먼저 분담에 동의한 것은 자기 땅에서 치른 전쟁이라고 말한 중화민국이었고, 호주는 참전 규모에 견주어 몫을 정하자는 안을 냈습니다.\n\n공동 발표문에는 구체적인 숫자 대신 형평에 맞는 분담이라는 말만 들어갔습니다. 다만 회의장을 나온 기획재정부 장관은 기자들에게 첫 송금이 다음 달에 들어온다고 귀띔했습니다."
 tfrkphn.532.a:0 "첫 송금을 기다린다"
 tfrkphn.533.t:0 "채무 제로"
 tfrkphn.533.d:0 "채무 제로는 홍준표가 가장 큰 업적으로 꼽는 일이고, 경남도지사 시절을 말할 때마다 빼놓지 않는 자랑거리다. 그러나 대통령이 된 뒤로는 그것을 업적이라고 부르기 어려워졌다. 채무 제로를 약속하고 취임했지만 미국은 혼란에 빠지고 중국은 침공에 나섰고, 세계화와 정반대로 가는 다극화 시대의 대통령에게 빚을 줄일 여유는 주어지지 않았다.\n\n자신의 임기에는 지키지 못한 그 약속이 후임 정부에서 이루어졌다. 전임 정권을 잇겠다고 한 정부가 약속을 지켜 냈다는 데에 홍준표는 기뻐했지만, 정작 그 성과에 다른 사람의 이름이 붙는다는 것은 못내 아쉬워했다. 그날 그의 페이스북에 글이 하나 올라왔다.\n\n§Y제가 공약하고도 실현하지 못한 것을 이인제 정부가 실현했습니다. 이인제 대통령의 결단과 유능함 덕분입니다.§!"
 tfrkphn.533.a:0 "글을 읽고 한참 화면을 끄지 않는다"
 tfrkphn.534.t:0 "지키지 못한 채무 제로"
 tfrkphn.534.d:0 "채무 제로는 홍준표가 가장 큰 업적으로 꼽는 일이고, 경남도지사 시절을 말할 때마다 빼놓지 않는 자랑거리다. 그런데 자신의 뜻을 잇겠다던 정부가 그 약속을 지키지 못했으니, 그로서는 부끄럽기 그지없는 일이었다. 기한이 지난 그날 홍준표의 SNS에 글이 하나 올라왔다.\n\n§Y이인제 대통령은 똑똑히 들어라. 내 이름 팔아 가며 정치할 생각이면 당장 사퇴하라. 나는 경남에서 대한민국 최악의 빚쟁이 도를 정상으로 돌려놓았는데 당신은 한 게 무엇인가. 당신이 잘하는 철새 노릇으로 차라리 민주당으로 당적을 옮겨라.§!\n\n그날 청와대 회의에는 전임 대통령의 글에 어떻게 대응할 것인지가 안건으로 올라왔다. 이인제는 이 일은 자신의 책임이 맞다면서, 어떤 대응도 발표도 하지 말라고 지시했다."
 tfrkphn.534.a:0 "아무 발표도 하지 않는다"
 tfrkphn.527.t:0 "넘긴 기한"
 tfrkphn.527.d:0 "약속한 기한이 지났는데도 전쟁 국채는 [?TFRKPHN_wd_left|0]이 남았습니다.\n\n기획재정부가 상환 일정을 다시 짜겠다고 발표하자 야당은 대통령이 스스로 건 약속을 스스로 어겼다고 했고, 채권 시장에서는 국채 금리가 올랐습니다.\n\n대통령은 변명하지 않고, 남은 빚은 다음 예산에 먼저 넣겠다고만 했습니다."
 tfrkphn.527.a:0 "남은 빚은 예산으로 넘긴다"
