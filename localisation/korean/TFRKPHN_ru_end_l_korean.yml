l_korean:
 # [안내] 러시아식 엔딩의 글. ru_end.py가 만든다.
 tfrkphn.7255.t:0 "흰 종이"
 tfrkphn.7255.d:0 "광장이 비워진 지 한 달 뒤 국회는 법 두 개를 하루에 통과시켰다. 첫째 법은 집회를 신고제에서 허가제로 바꿨다. 허가 없이 세 번 모이면 징역형이었다. 둘째 법은 군과 경찰에 대한 거짓 정보를 퍼뜨린 사람을 처벌했고, 무엇이 거짓인지는 검찰이 정했다.\n\n외국 대리인 명단은 그해 겨울에 세 배로 늘었다. 이제는 외국 돈을 받지 않아도 외국의 영향 아래 있다고 법무부가 판단하면 명단에 올랐다. 광장에서 다친 사람을 치료한 의사 모임이 올랐고, 잡혀간 사람의 이름을 모으던 변호사들도 올랐다.\n\n신문사 두 곳은 광고가 끊겨 문을 닫았다. 기자들 가운데 여럿이 도쿄로 건너가 그곳에서 방송을 시작했다. 방송은 밤마다 서울의 전화기로 들어왔다. 집에 갇혀 있던 김부겸은 치료를 조건으로 다시 출국을 허락받았다.\n\n거리는 조용해졌다. 일인 시위는 허가가 필요 없었으므로 사람들은 한 사람씩 떨어져 서서 흰 종이를 들었다. 경찰은 흰 종이를 든 사람도 연행했고, 조서의 혐의 칸에는 미신고 집회라고 적었다. 빈손을 들고 서 있던 사람도 잡혀갔다."
 tfrkphn.7255.a:0 "조서에 도장을 찍는다."
 tfrkphn.7256.t:0 "귀국편"
 tfrkphn.7256.d:0 "외국에 머물던 야당 지도자가 귀국하겠다고 밝혔다. 그는 변호사 출신으로, 고위 관리들의 별장과 재산을 찾아내 영상으로 올리던 사람이었다. 검찰은 그가 나가 있는 동안 횡령 혐의로 영장을 받아 두었다.\n\n측근들은 돌아가면 잡힌다고 말렸다. 그는 밖에서 하는 말은 안에서 들리지 않는다고 답했다. 그가 탄 비행기에는 기자 서른 명이 함께 탔다. 인천 공항에는 지지자 이천 명이 나왔고, 경찰은 버스로 도착장을 막았다.\n\n비행기는 착륙 십 분 전에 김포로 방향을 바꿨다. 그는 입국 심사대에서 아내와 인사를 나눈 뒤 경찰에게 넘겨졌다. 재판은 이튿날 경찰서 안에 차린 임시 법정에서 열렸고 삼십 분이 걸렸다. 변호인은 재판이 열린다는 통지를 한 시간 전에 받았다.\n\n그는 징역 삼 년 반을 받았다. 이듬해 형량은 구 년이 됐고 그다음 해에는 십구 년이 됐다. 교도소는 그를 서울에서 가장 먼 곳으로 옮겼다. 그가 법정에서 한 마지막 진술은 방송에 나가지 않았다. 지지자들은 그 진술을 손으로 받아 적어 서로에게 돌렸다."
 tfrkphn.7256.a:0 "교도소의 문이 닫힌다."
 tfrkphn.7257.t:0 "하루짜리 행군"
 tfrkphn.7257.d:0 "정부는 몇 해 전부터 경비 회사 한 곳에 험한 일을 맡겼다. 회사의 주인은 관공서에 급식을 대던 업자였고, 청년 애국단에 도시락을 실어 나르던 사람이었다. 그의 회사는 교도소에서 사람을 뽑아 무장시켰고, 정부는 그 회사가 무엇을 하는지 모른다고 말해 왔다.\n\n회사의 주인은 국방부 장관과 사이가 나빴다. 국방부가 그의 부대를 군 아래로 넣으려 하자 그는 부대를 이끌고 서울로 향했다.\n\n무장한 차량 행렬은 하루 만에 고속도로를 이백 킬로미터 올라왔다. 지방 도시 한 곳의 군 사령부가 총 한 발 없이 넘어갔다. 길가의 주민들은 그들에게 물과 빵을 건넸다. 대통령은 아침 방송에서 반란을 용서하지 않겠다고 말했다.\n\n행렬은 서울을 백 킬로미터 앞두고 멈췄다. 누가 무엇을 약속했는지는 발표되지 않았다. 부대는 왔던 길로 돌아갔고 회사의 주인은 외국으로 나갔다. 두 달 뒤 그가 탄 비행기가 떨어졌다. 이듬해 대통령 선거에서 대통령은 팔십칠 퍼센트를 얻었다. 개표 방송에 나온 숫자의 합은 이번에는 정확히 백이었다."
 tfrkphn.7257.a:0 "조사 결과는 발표되지 않는다."
 tfrkphn.7258.t:0 "도쿄의 연단"
 tfrkphn.7258.d:0 "광장이 비워진 뒤 세 사람은 차례로 나라를 떠났다. 김부겸은 치료를 이유로 나갔고, 김무성은 의원직을 잃은 뒤에 나갔다. 김동연은 그보다 먼저 나가 있었다. 세 사람이 도쿄에서 한자리에 선 것은 그해 가을이었다.\n\n일본 국회는 세 사람을 본회의장에 불렀다. 태평양방위조약기구 회원국의 대사들이 방청석에 앉았다. 김부겸이 먼저 말했고 김동연이 숫자를 댔고 김무성이 마지막에 섰다.\n\n세 사람의 요구는 같았다. 한국 정부가 선거 결과를 공개하고 갇힌 사람들을 풀 때까지, 회원국들이 한국 정부를 조약의 동반자로 대하지 말아 달라는 것이었다. 연설은 한국에서 방송되지 않았다. 사람들은 막힌 주소를 돌아 전화기로 그것을 보았다.\n\n서울의 대답은 사흘 뒤에 나왔다. 대통령은 외국 의회가 한국의 내정에 끼어들었다며 태평양방위조약기구에서 탈퇴한다고 발표했다. 외교부는 세 사람의 여권을 무효로 했다. 연합 사령부에 나가 있던 한국군 장교들은 그 주에 짐을 쌌다. 그날 저녁 아홉 시 뉴스의 첫 소식은 수출 실적이었다."
 tfrkphn.7258.a:0 "장교들이 귀국한다."
 TFRKPHN_ru_pdto_out_tt:0 "§R태평양방위조약기구에서 탈퇴합니다.§!\n대아대전이 일어나도 대한민국은 회원국으로 참전하지 않습니다."
 tfrkphn.7276.t:0 "조용한 나라"
 tfrkphn.7276.d:0 "도쿄의 연설이 있은 뒤에도 서울의 아침은 달라지지 않았습니다. 출근 버스는 제시간에 왔고, 월급은 날짜에 맞춰 들어왔습니다. 고시원에서 원서를 쓰던 청년들은 공단의 기숙사로 옮겨 갔습니다. 물가는 더 오르지 않았습니다.\n\n광장은 비어 있었습니다. 집회에는 허가가 필요했고, 허가는 나오지 않았습니다. 신문은 두 곳이 줄었고, 남은 신문들은 수출 실적을 일 면에 실었습니다. 도쿄에서 들어오는 방송을 찾아 듣는 사람은 해마다 줄었습니다.\n\n사람들은 알고 있었습니다. 먼 교도소에 있는 야당 지도자의 이름도, 지워진 개표 화면의 숫자도 모두가 기억했습니다. 그러나 그들은 패전과 멈춘 국회와 밀린 월급의 시절도 기억했습니다. 그 시절에 나라는 지는 나라였고, 지금은 다시 이기는 나라처럼 보였습니다. 그들은 그때로 돌아가기를 바라지 않았습니다.\n\n다음 선거의 투표율은 낮았고, 결과는 아무도 놀라게 하지 않았습니다. 국회의사당 돔의 그을음 위로 담쟁이가 자랐습니다. 사람들은 시끄러운 자유보다 조용한 안정을 택했습니다."
 tfrkphn.7276.a:0 "아침이 온다."
 TFRKPHN_ru_hold_tt:0 "§Y숫자판에 나오지 않는 민심§!이 아직 정권을 받치고 있습니다. 내무부 장관은 지시를 따릅니다."
 TFRKPHN_ru_fall_tt:0 "§R숫자판에 나오지 않는 민심§!이 바닥났습니다. 지시를 내려도 따를 사람이 없습니다."
 TFRKPHN_ru_stake_tt:0 "§Y이 선거 뒤에 정권이 버틸지는 숫자판에 나오지 않는 민심이 정합니다.§!\n민심이 §Y35§! 이상이면 버팁니다. §Y28§! 이상이고 광장의 열기가 §Y60§! 이상이어도 버팁니다."
