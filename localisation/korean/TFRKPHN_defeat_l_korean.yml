l_korean:
 # 개입 패전 갈래. defeat_build.py가 만든다. 설명문과 효과는 임시.
 TFRKPHN_hong_b05_01:0 "나락"
 TFRKPHN_hong_b05_01_desc:0 "대만이 무너졌습니다. 우리는 그 전쟁에 군대를 보냈고, 보낸 군대는 진 편에 서 있었습니다. 승전을 약속했던 정부가 이제 패전을 설명해야 합니다. 지지율은 바닥이 어디인지 모르게 내려가고 있습니다."
 TFRKPHN_hong_b05_02:0 "후폭풍"
 TFRKPHN_hong_b05_02_desc:0 "패전의 값은 전선보다 장바구니에 먼저 닿았습니다. 중국은 우리 상품에 문을 닫았고 환율과 물가가 함께 뛰고 있습니다. 거리에는 전사자 유족과 실직자가 나란히 서 있습니다."
 TFRKPHN_hong_b05_03:0 "종북을 막아라"
 TFRKPHN_hong_b05_03_desc:0 "패전의 책임을 묻는 목소리가 커지자 우리는 화살을 밖으로 돌리기로 했습니다. 전쟁을 반대했던 세력이 적을 이롭게 했다는 주장을 앞세우는 것입니다. 지지층은 다시 모이겠지만 나라는 더 갈라질 것입니다."
 TFRKPHN_hong_b05_04:0 "대연정 시도"
 TFRKPHN_hong_b05_04_desc:0 "대통령은 야당에 손을 내밀기로 했습니다. 내각의 절반을 내주더라도 패전 수습만은 함께 하자는 제안입니다. 야당이 가라앉는 배에 오를 까닭이 있는지는 우리도 장담하지 못합니다."
 TFRKPHN_hong_b05_05:0 "철수의 공세"
 TFRKPHN_hong_b05_05_desc:0 "당 안에서 먼저 칼이 나왔습니다. 안철수 의원을 비롯한 비주류가 대통령의 책임을 공개적으로 묻기 시작했습니다. 우리는 그 요구를 받아들여 사람을 바꾸는 쪽을 골랐습니다."
 TFRKPHN_hong_b05_06:0 "최악의 결과"
 TFRKPHN_hong_b05_06_desc:0 "무엇을 골랐든 결과는 같았습니다. 여론조사 숫자는 한 자리까지 내려갔고 여당 의원들은 대통령과 사진 찍기를 피하고 있습니다. 우리가 걱정하던 일은 모두 일어났습니다."
 TFRKPHN_hong_b05_07:0 "책임회피"
 TFRKPHN_hong_b05_07_desc:0 "우리는 패전의 책임을 한곳에 모으지 않기로 했습니다. 작전을 짠 군 지휘부, 정보를 놓친 기관, 지원을 늦춘 국회가 각자의 몫을 지게 됩니다. 당장의 화살은 흩어지겠지만, 아무도 책임지지 않았다는 말은 오래 남을 것입니다."
 TFRKPHN_hong_b05_08:0 "역공시도"
 TFRKPHN_hong_b05_08_desc:0 "물러서면 끝이라는 것이 우리가 내린 결론입니다. 참전을 막으려 했던 쪽이 그동안 중국에 어떤 신호를 보냈는지 국정조사로 따지자고 역제안합니다. 지지층은 다시 결집하겠지만, 패전의 책임을 묻는 목소리도 그만큼 커질 것입니다."
 TFRKPHN_hong_b05_09:0 "22대 총선"
 TFRKPHN_hong_b05_09_desc:0 "2024년 4월, 패전 뒤 첫 전국 선거가 치러집니다. 국민은 이 전쟁의 값을 먼저 국회의 의석으로 매길 것입니다. 우리가 고른 수습의 방식이 표로 돌아오는지, 투표함이 열리는 날 알게 됩니다."
 TFRKPHN_hong_b05_10:0 "제21대 대통령 선거"
 TFRKPHN_hong_b05_10_desc:0 "패전과 탄핵을 거치며 이 나라 정치를 수십 년 동안 나눠 가졌던 두 거대 정당이 함께 무너지고 있습니다. 빈자리를 두고 안철수와 심상정이 제3지대 연합을 저울질하고, 오른쪽 끝에서는 조원진의 우리공화당이 거리의 분노를 모아 몸집을 키우고 있습니다. 제3지대가 하나로 나서면 연합이, 갈라지면 우리공화당이 이길 것입니다."
 TFRKPHN_imp_elec_auto_tt:0 "탄핵소추안 가결 §Y70일§! 뒤 자동으로 완료됩니다."
 TFRKPHN_defeat_sup_m8_tt:0 "전국 지지도: §R-8§!"
 TFRKPHN_defeat_sup_m5_tt:0 "전국 지지도: §R-5§!"
 TFRKPHN_defeat_sup_p2_tt:0 "전국 지지도: §G+2§!"
