 tfrkphn.7219.t:0 "교과서의 한 줄"
 tfrkphn.7219.d:0 "교육부가 새 역사 교과서의 집필 기준을 대통령실에 올렸다. 양안전쟁을 다루는 단원에서 집필진이 한 문장을 두고 갈라졌다. 정부가 국회에 알리지 않고 대만을 도운 일을 어떻게 적느냐는 문제였다.\n\n한쪽 초안은 그 일을 나라를 지킨 결단이라고 썼다. 다른 초안은 국회의 동의 없이 군을 움직인 일이라고 썼다. 여당은 앞의 문장을 밀었고 야당은 뒤의 문장을 밀었다. 유족회는 어느 쪽이든 숨진 사람들의 이름이 빠지지 않게 해 달라고 요구했다. 교사 단체는 시험에 나올 문장부터 정해 달라고 했다.\n\n오세훈은 두 초안을 나란히 놓고 읽었다. 그는 그 다섯 해 동안 서울시장이었고 그 결정에 참여하지 않았다. 그래도 그 전쟁이 끝난 나라를 물려받은 사람은 그였다. 그 전쟁에서 숨진 사람들의 명단을 공개한 것도 그의 정부였다.\n\n두 문장을 모두 실으면 교과서는 길어지고 양쪽이 다 불만을 품는다. 한 문장만 고르면 다음 정부가 그 문장을 다시 고친다. 집필 기준의 확정 시한은 이번 주 금요일이고, 교육부 장관은 어느 쪽이든 따르겠다고 했다."
 tfrkphn.7219.a:0 "두 문장을 모두 싣는다."
 tfrkphn.7219.b:0 "결단이라고 쓴다."
 tfrkphn.7220.t:0 "없던 배의 선원들"
 tfrkphn.7220.d:0 "부산의 한 해운 회사 앞에서 늙은 선원 서른 명이 농성을 시작했다. 그들은 양안전쟁 때 정부가 빌려 쓴 화물선을 타고 대만 해협을 오갔다. 배는 서류에 다른 이름으로 적혔고 선원들은 계약서 없이 탔다. 운임은 현금으로 받았고 영수증은 없었다.\n\n군인과 정비사는 법이 바뀌어 참전용사가 되었다. 민간 선원은 그 법에 들어 있지 않았다. 기뢰에 배를 잃은 선주들은 보상을 받지 못했고, 다친 선원들은 산재 신청을 거절당했다. 근로복지공단은 그 항해가 기록에 없다고 답했다. 선원들의 평균 나이는 예순여덟이다.\n\n해양수산부는 선원 명단을 다 밝히면 그 배들이 실어 나른 물건의 목록도 함께 드러난다고 보고했다. 중국 정부는 그 목록을 오래 기다려 왔다. 외교부는 공개 시기를 늦춰 달라는 의견서를 따로 냈다.\n\n명단을 밝혀 선원들을 참전용사로 올릴 수 있다. 명단은 묶어 둔 채 이름 없는 위로금만 줄 수도 있다. 농성장의 천막에는 배 이름 열두 개가 적혀 있었고, 그 가운데 넷은 돌아오지 못한 배였다. 농성은 오늘로 스무 날째다."
 tfrkphn.7220.a:0 "명단을 밝히고 참전용사로 올린다."
 tfrkphn.7220.b:0 "위로금으로 마무리한다."
 tfrkphn.7221.t:0 "훈장을 단 후보들"
 tfrkphn.7221.d:0 "총선을 앞두고 예비역 장교 열일곱 명이 출마를 선언했다. 모두 양안전쟁의 비밀 작전에 나섰던 사람들이었다. 그들은 기자회견장에 훈장을 달고 나왔고, 그 훈장은 지난해에야 공개로 수여된 것이었다. 작전 이름은 아직도 비밀이어서 그들은 자기 공적을 말하지 못했다.\n\n여당과 야당은 그들을 서로 데려가려 했다. 전쟁을 치른 사람이 국방 예산을 다뤄야 한다는 말이 방송마다 나왔다. 현역 장성 몇은 사석에서 후배들의 출마를 반겼고, 그 말이 신문에 실렸다. 국방부는 현역의 정치 발언을 조사하겠다고 했지만 징계는 없었다.\n\n오세훈은 국방 예산을 줄여 주택과 복지로 돌리려던 참이었다. 훈장을 단 의원 스무 명이 국방위원회에 앉으면 그 계획은 통과하기 어렵다. 그들의 출마를 막을 법은 없고, 막아서도 안 되는 일이었다.\n\n여당 지도부는 대통령의 뜻을 물었다. 그들을 여당 후보로 받아들이면 선거에는 도움이 된다. 거리를 두면 그들은 무소속이나 다른 당의 이름으로 나온다. 그들의 지지율은 현역 의원보다 높았다. 공천 심사는 다음 주에 시작된다."
 tfrkphn.7221.a:0 "여당 후보로 받아들인다."
 tfrkphn.7221.b:0 "거리를 둔다."
 tfrkphn.7222.t:0 "베이징의 서류철"
 tfrkphn.7222.d:0 "주중 대사가 긴급 전문을 보냈다. 중국 외교부의 국장이 대사를 불러 서류철 하나를 탁자에 올려놓았다는 내용이었다. 서류철에는 양안전쟁 때 한국 배가 대만 항구에 내린 화물의 사진과 날짜가 들어 있었다. 사진 몇 장에는 선원의 얼굴까지 찍혀 있었다.\n\n중국 쪽의 요구는 두 가지였다. 한국이 태평양방위조약기구의 합동 훈련에서 한 해 동안 빠지고, 중국 기업에 대한 통관 제한을 푼다는 것이었다. 받아들이면 서류철은 금고에 남는다고 국장은 말했다. 그는 서류철을 다시 가방에 넣으며 사본이 여러 벌 있다고 덧붙였다.\n\n외교부는 서류가 공개되면 한국이 중립을 어겼다는 증거로 쓰일 수 있다고 보고했다. 국방부는 훈련에서 빠지면 동맹국들이 먼저 의심한다고 맞섰다. 산업부 장관은 통관이 석 달째 늦어져 수출 기업들이 버티지 못한다고 했다.\n\n오세훈은 전문을 두 번 읽었다. 정부가 스스로 먼저 밝히면 서류철은 값을 잃지만, 그 뒤의 일은 누구도 장담하지 못한다. 비서실장은 동맹국 정상들과 먼저 통화하자고 권했다. 답신의 시한은 열흘이었다."
 tfrkphn.7222.a:0 "우리가 먼저 밝힌다."
 tfrkphn.7222.b:0 "요구를 일부 받아들인다."
