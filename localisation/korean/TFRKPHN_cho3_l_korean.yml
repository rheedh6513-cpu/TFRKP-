l_korean:
 # [안내] 조원진: 국회 포격 뒤 2막과 3막. cho_build.py(cho3_part.py)가 만든다.
 tfrkphn.7174.t:0 "법대로"
 tfrkphn.7174.d:0 "김진태는 조기 대선에서 53퍼센트를 얻었고 취임식을 이십 분 만에 끝냈다. 연단에는 꽃도 축가도 없었다. 그는 취임사에서 법 앞에서는 재벌도 장관도 대통령도 같다고 말했고, 박수가 나오기 전에 연단을 내려왔다.\n\n첫 국무회의는 아침 일곱 시에 열렸다. 장관들은 보고서를 한 장으로 줄여 오라는 지시를 받았다. 대통령은 보고를 끝까지 듣고 날짜와 담당자를 물었다. 답을 못 한 차관 두 명이 그 주에 바뀌었다. 회의는 매번 사십 분 안에 끝났다.\n\n둘째 주에 그는 재벌 회장 스물한 명을 청와대로 불렀다. 지난 정부에서 불하받은 공장과 방송은 그대로 가져도 좋다고 했다. 대신 세금을 내고 방송과 선거에서 손을 떼라고 했다. 대통령 옆자리에는 검찰총장이 앉아 있었고, 회장들은 아무도 질문하지 않았다.\n\n밀린 월급이 석 달 만에 모두 나갔다. 저녁 뉴스는 새벽에 한강을 뛰는 대통령과 시장에서 국밥을 먹는 대통령을 번갈아 내보냈다. 지지율은 70퍼센트를 넘었다. 그달 방송사 한 곳의 사주가 탈세 혐의로 조사를 받았다."
 tfrkphn.7174.a:0 "다들 알아들었다."
 tfrkphn.7175.t:0 "아홉 시 뉴스"
 tfrkphn.7175.d:0 "방송사를 가진 재벌 두 곳은 약속을 지키지 않았다. 한 곳은 잠수함 사고 때 휴가지에 있던 대통령의 사진을 저녁 뉴스 첫머리에 내보냈고, 다른 한 곳은 인형극으로 대통령을 놀렸다. 대통령은 두 방송을 직접 챙겨 봤다.\n\n국세청과 검찰이 같은 주에 두 그룹의 본사에 들어갔다. 한 회장은 사흘 동안 구치소에 있다가 방송사 지분을 가스 공사에 넘긴다는 서류에 서명하고 풀려났다. 다른 회장은 출장을 떠나 돌아오지 않았다. 인형극은 그 주에 편성표에서 빠졌다.\n\n이듬해 정부는 언론의 난립을 바로잡는다며 통폐합 계획을 발표했다. 신문과 방송, 통신사 예순네 곳이 열여덟 곳으로 줄었다. 사주들은 계엄 때 쓰던 청사 지하실에 불려 가 포기 각서를 썼고, 기자 천이백 명이 직장을 잃었다. 통폐합은 일주일 만에 끝났다.\n\n그 뒤로 아홉 시 뉴스는 시보가 울리면 대통령의 하루 일정부터 전했다. 문화부는 날마다 편집국에 기사 제목과 사진 크기를 적은 종이를 보냈다. 시청자들은 그 순서를 외웠고, 아이들은 시보 소리를 듣고 대통령 흉내를 냈다."
 tfrkphn.7175.a:0 "시보가 울린다."
 tfrkphn.7176.t:0 "도지사의 사표"
 tfrkphn.7176.d:0 "새 헌법 부칙은 나라가 안정될 때까지 지방선거를 미룬다고 적어 두었습니다. 김진태는 그 조항을 근거로 시도지사를 대통령이 임명하는 법안을 냈습니다. 학교 한 곳이 무장 괴한에게 점거된 사건 열흘 뒤의 일입니다.\n\n정부는 국민이 아직 스스로 다스릴 준비가 덜 됐고, 그때까지는 나라가 가르쳐야 한다고 설명했습니다. 관보는 이 시기를 헌정 준비 기간이라고 부릅니다. 기간이 언제 끝나는지는 법에 적혀 있지 않습니다.\n\n선거로 뽑힌 시도지사 열일곱 명 가운데 열넷이 한 달 안에 사표를 내고 대통령의 임명장을 다시 받았습니다. 사표를 내지 않은 세 명의 도청에는 감사원 직원들이 내려갔습니다. 석 달 뒤 세 명은 모두 건강을 이유로 물러났습니다.\n\n국회에서는 정당 등록 요건이 올라갔습니다. 다음 총선에서 여당은 의석의 4분의 3을 얻었고, 나머지는 여당 출신이 만든 야당 두 곳이 나눠 가졌습니다. 본회의 표결은 한 건에 평균 사십 초가 걸립니다. 두 야당 대표는 방송 토론에서 누가 대통령을 더 잘 돕는지를 두고 다퉜습니다."
 tfrkphn.7176.a:0 "임명장에 서명한다."
 tfrkphn.7177.t:0 "벽에 걸린 숫자"
 tfrkphn.7177.d:0 "청와대 회의실 벽에는 수출 목표를 적은 판이 걸렸다. 대통령은 매달 수출 진흥 회의를 직접 열고 회사별 실적을 불러 가며 물었다. 그는 장관들에게 어느 이념의 정책인지는 묻지 않을 테니 숫자를 가져오라고 말했다.\n\n적자를 내던 공기업 사백 곳이 문을 닫거나 합쳐졌고 노동자 육십만 명이 일자리를 잃었다. 정부는 바닷가 도시 네 곳을 특구로 정해 세금을 깎아 줬다. 일부가 먼저 부자가 돼도 좋다는 말이 관보에 실렸고, 기업인들은 줄을 서서 여당에 입당했다.\n\n수출은 다섯 해 만에 세 배가 됐고 성장률은 해마다 9퍼센트를 넘었다. 서울의 아파트값은 그사이 네 배가 됐다. 고속철도가 해마다 한 노선씩 개통됐고, 몇 해 전 설탕을 사려고 줄을 섰던 사람들이 자동차를 샀다. 백화점 주차장은 주말마다 모자랐다.\n\n농촌과 공장 지대에서 시위가 한 해 팔만 건 일어났다. 정부는 조화로운 사회를 새 구호로 내걸었다. 그해 치안 예산이 처음으로 국방 예산을 넘었다. 대통령 고향의 고등학교를 나온 사람들이 그 예산을 쓰는 자리 여덟 곳에 앉았다."
 tfrkphn.7177.a:0 "다음 달 목표를 적는다."
 tfrkphn.7178.t:0 "자전거 한 대"
 tfrkphn.7178.d:0 "두 번째 임기가 끝나 가자 기자들은 헌법의 연임 제한 조항을 물었다. 김진태는 헌법을 고치지 않겠다고 답했다. 그는 그 말을 지켰고, 여당 전당대회에서 다음 대통령 후보로 윤상현 전 총리를 추천했다.\n\n선거는 국민이 직접 뽑는 방식 그대로 치러졌다. 방송 토론은 열리지 않았고 윤상현은 71퍼센트를 얻었다. 그는 취임한 날 저녁 김진태를 국무총리로 지명했고 국회는 이튿날 인준했다.\n\n청와대 집무실에는 새 대통령이 앉았지만 장관들은 보고서를 들고 총리 공관으로 갔다. 외국 대사들도 신임장을 낸 뒤 총리를 따로 찾았다. 총리 공관 앞 골목에는 검은 차가 아침마다 줄을 섰다. 사람들은 두 사람이 자전거 한 대에 같이 탔다고 농담했다.\n\n사 년 뒤 여당 전당대회에서 윤상현은 연단에 올라 다음 후보로 김진태를 추천했다. 그는 두 사람이 이 일을 여러 해 전에 정해 두었다고 말했다. 그날 밤 서울 도심에 대학생 수천 명이 모여 표를 돌려 달라고 외쳤다. 그사이 대통령 임기는 다섯 해에서 여섯 해로 늘어 있었다."
 tfrkphn.7178.a:0 "집무실 열쇠를 돌려받는다."
 tfrkphn.7196.t:0 "영에서 다시"
 tfrkphn.7196.d:0 "김진태가 청와대로 돌아온 뒤 두 번째 임기의 넷째 해였다. 헌법은 대통령이 한 번만 연임할 수 있다고 적고 있었고, 그는 기자회견에서 헌법을 지키겠다고 여러 번 말했다.\n\n그해 봄 정부는 헌법을 이백여섯 군데 고치기로 했다. 최저임금을 생계비보다 높게 정한다는 조항과 청년에게 공공 주택을 보장한다는 조항, 영토를 넘겨주지 못한다는 조항이 들어갔다. 국회 심의 마지막 날 여당의 여든세 살 의원이 손을 들었다. 올림픽 금메달을 땄던 사람이었다.\n\n그는 새 헌법이 시행되면 지금 대통령의 지난 임기는 세지 말자고 제안했다. 본회의장은 잠시 조용했다. 한 시간 반 뒤 김진태가 예고 없이 국회에 나와 연단에 섰다. 그는 헌법재판소가 괜찮다고 하면 받아들이겠다고 말했다. 헌법재판소는 엿새 만에 괜찮다고 결정했다.\n\n국민투표는 일주일 동안 치러졌다. 투표소는 공원 벤치와 버스 정류장, 자동차 짐칸에도 차려졌고, 투표한 사람은 아파트 추첨에 응모할 수 있었다. 투표용지에는 이백여섯 군데를 한꺼번에 묻는 칸 하나만 있었다. 찬성은 78퍼센트였다."
 tfrkphn.7196.a:0 "임기는 영에서 다시 센다."
 tfrkphn.7180.t:0 "백사십 퍼센트"
 tfrkphn.7180.d:0 "임기를 영에서 다시 세기로 한 뒤 첫 대통령 선거가 치러졌다. 정부는 자신이 있었다. 야당 후보 두 명은 서류 미비로 등록이 취소됐고, 남은 후보의 유세장은 번번이 수도 공사로 막혔다.\n\n투표 날 저녁 국영 방송은 지역별 개표 상황을 막대그래프로 내보냈다. 한 지역의 화면에서 김진태는 59퍼센트, 2위는 33퍼센트, 3위는 24퍼센트를 얻었고, 나머지 후보들까지 더하면 합은 140퍼센트였다. 화면은 십이 초 동안 나갔다. 진행자는 숫자를 그대로 읽었다.\n\n방송사는 자막 사고라고 해명했다. 그 십이 초를 찍은 사진은 밤사이 전화기에서 전화기로 건너갔다. 새벽에 선거관리위원회는 김진태가 80퍼센트를 얻어 당선됐다고 발표했다. 사진 밑에는 수학을 다시 배우라는 글이 붙었다.\n\n아침이 되자 대학생들이 먼저 교문을 나섰다. 그들은 140이라고 적은 종이를 들었다. 점심때는 넥타이를 맨 회사원들이 사무실에서 내려와 줄에 섰고, 저녁에는 광화문에서 시청까지 차도가 사람으로 찼다. 내무부 장관이 대통령에게 전화를 걸어 지시를 물었다."
 tfrkphn.7180.a:0 "인터넷부터 끊는다."
 tfrkphn.7180.b:0 "발포 명령을 내리지 않는다."
 tfrkphn.7181.t:0 "겨울"
 tfrkphn.7181.d:0 "정부는 그날 밤 인터넷을 끊었다. 사흘 동안 전화기는 통화만 됐고, 사람들은 아파트 창문에 종이를 붙여 모일 곳을 알렸다. 기동대는 광화문에 나온 사람들을 버스에 실었다. 나흘 동안 칠천 명이 잡혀갔고, 풀려난 사람들은 등과 다리의 멍을 사진으로 찍어 올렸다.\n\n주말마다 흰옷을 입은 여성들이 꽃을 들고 줄지어 걸었다. 자동차 공장과 조선소의 노동자들이 일손을 놓았고, 공장을 찾아간 대통령은 물러가라는 고함을 들었다. 그 주 일요일 김진태는 헬기를 타고 광장 위를 돌았다. 방송은 방탄조끼를 입고 헬기에서 내리는 그를 내보냈다.\n\n야당 지도자들은 외국으로 나가거나 갇혔다. 김진태는 두 달 뒤 예고 없이 취임 선서를 했고, 정부는 식이 끝난 뒤에 그 사실을 발표했다. 식장에 온 외국 정상은 없었다.\n\n그해 겨울 서울의 한 고등학교 교실 칠판 귀퉁이에 누가 분필로 140이라고 썼다. 교사는 그것을 지우고 수업을 했다. 다음 날 아침 같은 자리에 같은 숫자가 다시 적혀 있었다. 교사는 지우개를 들었다가 내려놓고 출석을 불렀다."
 tfrkphn.7181.a:0 "내일도 적혀 있을 것이다."
 tfrkphn.7182.t:0 "걸어서"
 tfrkphn.7182.d:0 "담화가 나간 날 오후 김진태는 청와대를 나왔다. 경호실은 차를 준비했지만 그는 걸어서 사저까지 가겠다고 했다. 사저까지는 사십 분이 걸렸다. 경호원 넷이 몇 걸음 뒤에서 따라왔다. 그는 외투 주머니에 메모지 한 장을 넣고 있었다.\n\n길가에 선 사람들은 소리를 지르지 않았다. 몇은 고개를 돌렸고, 몇은 고개를 숙여 인사했다. 애국단 완장을 뗀 청년 하나가 그에게 다가와 손을 잡았다. 청년은 아무 말도 하지 않았고, 그도 아무 말도 하지 않았다. 둘은 잠시 그렇게 서 있었고, 청년이 먼저 손을 놓았다.\n\n과도 정부는 포격 때 체포됐다가 풀려난 우원식 전 국회의장이 맡았다. 첫 국무회의는 대통령을 국민이 직접 뽑는 개헌안과 지방선거 날짜를 의결했다. 회의록은 그날 밤 공개됐다. 체포됐던 의원들과 보좌진은 그 주에 모두 풀려났다.\n\n국회의사당 돔의 그을음은 그해 가을에 닦아 냈다. 비계를 걷어 내던 날 국회 앞에는 사람들이 모였다. 그들은 박수를 치지 않았다. 마지막 방수포가 내려올 때까지 돔을 올려다보았다."
 tfrkphn.7182.a:0 "방수포가 내려온다."
 TFRKPHN_kjt_hold_tt:0 "§R광장을 힘으로 비웁니다.§! 정권은 버팁니다."
 TFRKPHN_kjt_fall_tt:0 "§Y군은 움직이지 않습니다.§! 정권은 무너집니다."
 TFRKPHN_kjt_fallen_tt:0 "§Y우원식§! 전 국회의장이 과도 정부를 맡습니다."
