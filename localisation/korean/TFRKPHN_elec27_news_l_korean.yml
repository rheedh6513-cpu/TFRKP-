l_korean:
 tfrkphn.6995.t:0 "대한민국 이인제 후보 당선"
 tfrkphn.6995.d:0 "방금 서울에서 들어온 소식에 따르면, 2027년 대한민국 제21대 대통령 선거에서 여당인 국민의힘의 이인제 후보가 당선되었다. 홍준표 정부를 이어 보수 정권이 다섯 해 더 이어지게 되었다.\n\n이인제 당선인은 1997년 대선에 처음 나선 뒤 여러 번 고배를 마셨던 정치인이다. 서른 해 만에 마침내 대통령 자리에 오른 셈이다. 선거 내내 그는 홍준표 정부의 노선을 지키고 더 밀고 나가겠다고 말했다.\n\n개표 결과가 나온 새벽, 그의 선거 사무소 앞에는 지지자들이 모여 오래 기다린 승리를 축하했다. 불사조처럼 끈질기게 다시 일어선다고 해서 붙은 피닉제라는 별명이 이날 하루 종일 기사 제목에 오르내렸다.\n\n외신들은 그의 당선을 홍준표 노선의 연장으로 읽었다. 양안전쟁 때의 비밀 지원 논란을 겪고도 보수 정권이 다시 신임을 얻었다는 점에 주목한 보도가 많았다. 도쿄는 두 나라의 안보 협력이 그대로 이어질 것으로 보았고, 베이징은 한국의 대중 정책이 더 단단해질 것을 경계했다."
 tfrkphn.6995.kor:0 "같은 길을 더 멀리!"
 tfrkphn.6995.jap:0 "협력은 그대로 간다."
 tfrkphn.6995.prc:0 "더 단단한 벽이 섰다."
 tfrkphn.6995.etc:0 "한국 보수가 다시 이겼다."
 tfrkphn.6996.t:0 "대한민국 오세훈 후보 당선"
 tfrkphn.6996.d:0 "방금 서울에서 들어온 소식에 따르면, 2027년 대한민국 제21대 대통령 선거에서 여당인 국민의힘의 오세훈 후보가 당선되었다. 오랫동안 서울시장을 지낸 그가 이번에는 나라 전체를 맡게 되었다.\n\n같은 당의 후보였지만 그가 내건 말은 전임 정부와 결이 달랐다. 약자와의 동행과 따뜻한 보수를 앞세운 그는 강경 노선에 지친 중도층의 표를 크게 끌어왔다. 출구조사에서는 스스로 중도라고 답한 유권자의 절반 넘게 그를 찍었다.\n\n개표가 끝난 새벽, 서울시청 앞 광장에는 시청 직원 몇몇이 나와 떠나는 시장을 배웅했다. 그는 시청 건물을 한 번 돌아본 뒤 차에 올랐다.\n\n외신들은 그의 당선을 같은 당 안의 방향 전환으로 평가했다. 양안전쟁을 치른 정당에 다시 표를 주면서도, 국민이 한결 부드러운 얼굴을 골랐다는 분석이 이어졌다. 도쿄와 베이징은 새 정부의 대외 정책이 어디로 갈지 지켜보겠다는 반응을 내놓았다."
 tfrkphn.6996.kor:0 "같은 당, 다른 길!"
 tfrkphn.6996.jap:0 "대화의 문이 넓어질까."
 tfrkphn.6996.prc:0 "얼굴이 부드러워졌다."
 tfrkphn.6996.etc:0 "한국 보수가 얼굴을 바꿨다."
