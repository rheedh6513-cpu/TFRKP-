l_korean:
 TFRKPHN_uni_category:0 "유니콘 쉰 개"
 TFRKPHN_uni_category_desc:0 "\n\n\n\n\n\n\n\n\n\n\n\n서울은 2021년 서울비전 2030에서 유니콘 기업 40개를, 2023년 성수동 창업허브 계획에서 50개를 목표로 내걸었다. 이제 그 목표를 나라 전체에서 채운다.\n\n지금 유니콘 기업: §Y[?TFRKPHN_uni|0]§! / 50\n유니콘 하나마다 §G연구 속도 0.2퍼센트§!, §G민수공장 건설 속도 0.2퍼센트§!씩 빨라진다. 지금 §G[?TFRKPHN_uni_pct|1]퍼센트§!"
 TFRKPHN_uni_invest:0 "스타트업 투자"
 TFRKPHN_uni_invest_desc:0 "모태펀드와 정책 금융으로 될성부른 스타트업에 돈을 댄다. 60일 동안 §Y민수공장 1개§!가 묶인다."
 TFRKPHN_uni_hub:0 "성수 창업허브"
 TFRKPHN_uni_hub_desc:0 "성수동에 세계 최대 창업허브를 세운다. 180일 동안 §Y민수공장 1개§!가 묶인다. 한 번만 할 수 있다."
 TFRKPHN_uni_fdi:0 "해외 투자 유치"
 TFRKPHN_uni_fdi_desc:0 "해외 벤처캐피털을 불러 우리 스타트업에 투자하게 한다. 정치력은 들지 않지만 해외 자본에 문을 연다는 반발이 조금 있다."
 TFRKPHN_uni_invest_tt:0 "60일 뒤 유니콘 기업이 §G3개§! 늘어난다."
 TFRKPHN_uni_hub_tt:0 "180일 뒤 유니콘 기업이 §G8개§! 늘어난다."
 TFRKPHN_uni_fdi_tt:0 "90일 뒤 유니콘 기업이 §G4개§! 늘어난다."
 TFRKPHN_uni_mega:0 "메가시티 창업 특구"
 TFRKPHN_uni_mega_desc:0 "메가시티 권역마다 창업 특구를 두어 스타트업을 서울 밖에서 키운다. §Y3단계§!를 넘은 메가시티 권역이 하나라도 있어야 할 수 있다. 120일 동안 §Y민수공장 1개§!가 묶인다."
 TFRKPHN_uni_mega_tt:0 "120일 뒤 유니콘 기업이 §G2개§!에 3단계를 넘은 메가시티 권역 수만큼 더 늘어납니다 (최대 §G7개§!)."
 TFRKPHN_uni_guar:0 "예비유니콘 특별보증"
 TFRKPHN_uni_guar_desc:0 "아기 유니콘을 넘어 예비 유니콘 단계에 오른 기업들에 정책 보증을 크게 늘려 준다. 유니콘 기업이 §Y10개§! 넘어야 할 수 있다."
 TFRKPHN_uni_guar_tt:0 "90일 뒤 유니콘 기업이 §G4개§! 늘어난다."
 TFRKPHN_unicorn:0 "유니콘 기업"
 TFRKPHN_unicorn_desc:0 "기업가치 1조 원이 넘는 비상장 스타트업이 늘어날수록 연구와 건설이 빨라진다."
 tfrkphn.6793.t:0 "유니콘 쉰 개"
 tfrkphn.6793.d:0 "기업가치가 1조 원을 넘은 비상장 스타트업이 쉰 곳을 채웠다. 서울시가 2023년 성수동 창업허브 계획을 내놓으며 내건 숫자를 나라 전체가 먼저 넘었다.\n\n쉰 번째 회사는 지방 메가시티 권역에서 나왔다. 대통령은 축하 자리에서 창업자들에게 다음 쉰 개는 서울 밖에서 나오게 해 달라고 말했다. 성수동 창업허브의 밤은 여전히 밝았고, 그 옆 골목의 작은 사무실들에서는 다음 유니콘을 꿈꾸는 사람들이 밤을 새우고 있었다."
 tfrkphn.6793.a:0 "다음 쉰 개를 기다린다."
