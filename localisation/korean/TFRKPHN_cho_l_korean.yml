l_korean:
 # [안내] 조원진 초기 중점. cho_build.py가 만든다.
 TFRKPHN_cho_01:0 "광화문의 대통령"
 TFRKPHN_cho_01_desc:0 "태극기를 든 사람들이 만든 대통령입니다. 국회에 기댈 곳은 없고, 기댈 곳은 광장뿐입니다. 새 정부는 첫날부터 거리와 함께 시작합니다."
 TFRKPHN_cho_02:0 "패전 책임자 명단"
 TFRKPHN_cho_02_desc:0 "패전에 책임이 있는 사람들의 명단을 대통령실이 직접 만듭니다. 명단에는 장군과 관료, 그리고 국회의원들의 이름이 함께 오릅니다."
 TFRKPHN_cho_03:0 "기득권 청산 위원회"
 TFRKPHN_cho_03_desc:0 "대통령 직속 위원회가 패전 책임자 명단을 넘겨받습니다. 위원회의 권한이 어디까지인지는 법에 적혀 있지 않습니다."
 TFRKPHN_cho_04:0 "태극기 국민대회"
 TFRKPHN_cho_04_desc:0 "매주 토요일 광화문에서 대통령을 지지하는 국민대회가 열립니다. 대통령실은 무대와 음향을 지원합니다."
 TFRKPHN_cho_05:0 "청년 애국단"
 TFRKPHN_cho_05_desc:0 "광장에 나온 청년들을 모아 애국단을 꾸립니다. 그들은 집회의 질서를 맡고, 언젠가 그보다 많은 일을 맡게 될 것입니다."
 TFRKPHN_cho_06:0 "거부권 정치"
 TFRKPHN_cho_06_desc:0 "국회가 넘긴 법안을 대통령이 하나씩 돌려보냅니다. 국회는 다시 의결하지만, 그 사이 나라의 일은 멈춰 섭니다."
 TFRKPHN_cho_07:0 "대통령령 통치"
 TFRKPHN_cho_07_desc:0 "법이 없으면 대통령령으로 다스립니다. 예산 없이 집행하고, 법 없이 명령합니다. 헌법학자들은 위헌이라고 하고, 대통령실은 비상 시기라고 합니다."
 TFRKPHN_cho_08:0 "군 지휘부 교체"
 TFRKPHN_cho_08_desc:0 "대통령의 말을 따를 지휘관들로 군의 요직을 바꿉니다. 수도권의 전차 부대와 특수전 부대가 먼저입니다. 교체된 장군들 가운데 몇은 조용히 옷을 벗고, 몇은 그렇지 않습니다."
 TFRKPHN_cho_09:0 "국회 해산 명령"
 TFRKPHN_cho_09_desc:0 "국회를 해산하고 새 헌법을 국민투표에 부치는 긴급명령을 준비합니다. 헌법에는 그런 권한이 없습니다. 명령에 서명하는 순간 돌아갈 길은 사라집니다."
 TFRKPHN_cho_10:0 "여의도 진입"
 TFRKPHN_cho_10_desc:0 "봉쇄된 국회에 전차를 들여보냅니다. 열하루째 국회는 문을 열지 않았습니다. 명령이 내려지면 첫 포탄이 어디에 떨어질지는 모두가 알고 있습니다."
 TFRKPHN_cho_dissolve_tt:0 "§R국회 해산 긴급명령§!이 발표됩니다."
 TFRKPHN_cho_shell_tt:0 "§R전차가 국회로 들어갑니다.§!"
 TFRKPHN_cho_tree_tt:0 "§Y조원진 중점 트리§!로 바뀝니다."
 TFRKPHN_cho_block_open_tt:0 "§Y여의도 진입§! 중점이 열립니다. 찍지 않아도 §Y30일§! 뒤에는 전차가 들어갑니다."
 tfrkphn.7069.t:0 "광장의 취임식"
 tfrkphn.7069.d:0 "취임식은 국회 앞마당이 아니라 광화문에서 열렸다. 대통령실은 국회가 아니라 국민 앞에서 선서하겠다고 했고, 무대는 매주 집회가 열리던 바로 그 자리에 세워졌다. 광장은 아침부터 태극기로 가득 찼다. 새벽 첫차를 타고 지방에서 올라온 버스들이 종로까지 줄지어 섰다.\n\n귀빈석에는 국회의원들의 이름표가 나란히 놓여 있었다. 자리에 앉은 사람은 손으로 꼽을 만큼이었다. 방송 카메라는 몇 번이나 빈 의자들을 비췄고, 광장의 사람들은 그 화면을 보며 야유를 보냈다. 몇몇 의원은 참석 여부를 끝내 밝히지 않았다.\n\n선서가 끝나자 함성이 광장을 덮었다. 군악대가 행진곡을 연주했고, 하늘에는 공군 편대가 지나갔다. 몇 달 전 패전 소식이 들려오던 바로 그 하늘이었다. 사람들은 고개를 들고 오래 박수를 쳤다.\n\n같은 시각 여의도의 본회의장은 문이 닫혀 있었다. 국회 사무처는 취임식 중계를 켜 두지 않았다. 새 대통령과 국회가 처음으로 마주한 날, 둘은 서로 다른 곳을 보고 있었다. 본회의장 앞 복도에는 기자 몇 명만이 서성였다."
 tfrkphn.7069.a:0 "광장에서 시작한다."
 tfrkphn.7070.t:0 "새어 나간 명단"
 tfrkphn.7070.d:0 "대통령실이 작성한 패전 책임자 명단이 언론에 유출됐습니다. 한 일간지가 입수해 보도한 명단에는 전직 장성과 고위 관료, 그리고 현직 국회의원 수십 명의 이름이 함께 올라 있습니다.\n\n명단에 오른 의원들은 대부분 개전 당시 국방과 외교 관련 상임위원회에 있던 사람들입니다. 여당과 야당을 가리지 않았습니다. 이름이 오른 한 의원은 기자회견을 열어 명단 작성의 법적 근거를 밝히라고 요구했습니다. 다른 의원들은 대부분 연락을 받지 않았습니다.\n\n대통령실은 명단의 진위를 확인해 주지 않았습니다. 대변인은 패전의 책임을 묻는 일은 국민의 요구라고만 답했습니다. 광화문 집회 현장에서는 명단을 인쇄한 전단이 뿌려졌습니다. 전단에는 의원들의 지역구 사무실 주소까지 함께 적혀 있었습니다.\n\n국회는 긴급 운영위원회를 소집했습니다. 정치권에서는 이번 유출이 실수인지 의도된 것인지를 두고 해석이 엇갈리고 있습니다. 명단에 오른 사람들의 출국 금지를 요구하는 청원도 잇따르고 있습니다. 국회 사무처는 의원회관의 출입 통제를 강화했습니다."
 tfrkphn.7070.a:0 "명단을 모두 공개한다."
 tfrkphn.7070.b:0 "유출을 부인한다."
 tfrkphn.7071.t:0 "첫 번째 소환장"
 tfrkphn.7071.d:0 "기득권 청산 위원회의 첫 소환장은 퇴역한 육군 대장에게 갔다. 개전 당시 지상작전을 맡았던 사람이었다. 위원회는 출석일을 일주일 뒤로 정했고, 그 날짜는 방송으로 미리 알려졌다. 위원회 사무실에는 축하 화환이 늘어섰다.\n\n출석일 아침 위원회 청사 앞에는 취재진과 태극기를 든 사람들이 몰렸다. 오전 열 시가 지나고 정오가 지났다. 퇴역 대장은 나타나지 않았다. 그의 변호인이 보낸 한 장짜리 서면만 도착했다. 기다리던 사람들은 해가 질 무렵까지 자리를 뜨지 않았다.\n\n서면에는 위원회가 법률이 아니라 대통령령으로 만들어졌으니 누구를 부를 권한도 없다고 적혀 있었다. 법학자 여럿이 같은 의견을 냈다. 위원장은 다음 날 강제 구인을 검토하겠다고 밝혔다. 언론은 그 말을 머리기사로 실었다.\n\n경찰은 영장 없이 움직일 수 없다고 했다. 법원은 영장 청구를 받아 주지 않았다. 위원회가 처음 던진 돌은 벽에 맞고 떨어졌고, 광장은 그 벽에 하나씩 이름을 붙이기 시작했다. 다음 소환 대상자 명단은 이미 위원회 책상 위에 올라 있었다."
 tfrkphn.7071.a:0 "다음 소환장을 준비하라."
 tfrkphn.7072.t:0 "두 개의 광장"
 tfrkphn.7072.d:0 "토요일 오후 광화문은 다시 태극기로 덮였다. 대통령실이 마련한 무대와 음향 장비 덕분에 연설은 세종대로 끝까지 울렸다. 주최 측은 백만 명이 모였다고 했고, 경찰은 숫자를 내놓지 않았다. 무대 뒤편에는 대통령의 대형 사진이 걸렸다.\n\n같은 시각 여의도 국회 앞에는 다른 사람들이 모였다. 촛불과 손팻말을 든 사람들이었다. 그들은 국회를 지키자고 외쳤다. 그 가운데에는 낡은 군복을 입은 상이군인들도 섞여 있었다. 두 집회 사이의 거리는 지하철로 이십 분이었다.\n\n경찰은 마포대교와 서강대교 앞에 버스를 세워 벽을 쳤다. 다리를 건너려던 양쪽 행렬이 버스 앞에서 멈췄고, 해가 질 때까지 고성이 오갔다. 몇 명이 다쳤고, 몇 명이 연행됐다. 버스 지붕 위에는 양쪽에서 던진 물병이 쌓였다.\n\n저녁 뉴스는 화면을 둘로 나눠 두 광장을 함께 보여 줬다. 왼쪽과 오른쪽의 함성은 거의 같은 크기였다. 그날부터 사람들은 토요일마다 어느 쪽 다리를 건널지 정해야 했다. 가족끼리도 식탁에서는 그 이야기를 꺼내지 않게 됐다."
 tfrkphn.7072.a:0 "광화문이 더 크다."
 tfrkphn.7073.t:0 "완장"
 tfrkphn.7073.d:0 "청년 애국단은 처음엔 집회의 질서를 맡았다. 노란 완장을 차고 행렬을 정리했고, 방송은 그들을 성실한 청년들이라고 소개했다. 모집 공고에는 수천 명이 몰렸다. 대통령실은 그들에게 숙소와 밥을 내주었다.\n\n두 달쯤 지나자 완장을 찬 청년들이 광장 밖으로 나갔다. 그들은 몽둥이를 들고 노조 사무실과 시민단체 사무실을 찾아갔다. 문을 부수고 들어가 서류를 바닥에 쏟아 놓았고, 나오면서 벽에 멸공이라는 두 글자를 크게 써 놓았다.\n\n그들이 누구를 좌익이라고 부르면 그 사람은 좌익이 됐다. 지방으로 내려간 단원들은 경찰서 한쪽에 사무실을 얻었고, 경찰은 그들을 말리지 않았다. 가게 주인들은 애국 성금이라는 이름으로 돈을 내야 했다. 내지 않은 가게의 유리창은 다음 날 아침 깨져 있었다.\n\n신문 한 곳이 그들의 행패를 보도했다. 그 주 토요일 신문사 앞에 노란 완장 수백 개가 모였고, 다음 호에는 사과문이 실렸다. 사람들은 이제 노란 천 조각이 보이면 길을 건넜다. 그 완장이 어디까지 들어갈 수 있는지 아는 사람은 없었다."
 tfrkphn.7073.a:0 "질서는 지켜져야 한다."
 tfrkphn.7074.t:0 "돌아온 법안"
 tfrkphn.7074.d:0 "국회가 의결한 법안이 다시 대통령실에서 돌아왔다. 이번이 열한 번째 거부권이었다. 국회는 재의결에 나섰지만 정족수를 채우지 못했고, 법안은 그대로 폐기됐다. 예산안도 석 달째 묶여 있었다. 의원회관 복도에는 반송된 법안 사본이 쌓였다.\n\n그날 저녁 국회의장 우원식이 대국민 담화를 냈다. 그는 본회의장 단상이 아니라 국회 정문 앞에 섰다. 그는 대통령의 거부권도 헌법이 준 권한이지만, 국회를 멈추는 데 쓰여서는 안 된다고 말했다. 그의 뒤로는 국회 경위 몇 명만이 서 있었다.\n\n그는 여야를 가리지 않고 의원들에게 본회의장으로 돌아오라고 했다. 거리에 나간 국민들에게는 다리를 건너지 말고 투표함으로 오라고 했다. 담화는 칠 분이었고, 그는 한 번도 대통령의 이름을 부르지 않았다.\n\n대통령실은 논평하지 않았다. 광화문 무대에서는 국회의장을 향한 야유가 나왔다. 그러나 그날 밤 국회 앞에 모인 사람들은 처음으로 광화문보다 많았고, 국회 사무처의 불은 새벽까지 꺼지지 않았다. 다음 날 의원 몇 명이 조용히 본회의장으로 돌아왔다."
 tfrkphn.7074.a:0 "국회는 아직 문을 열지 못했다."
 tfrkphn.7075.t:0 "서명하지 않는 사람들"
 tfrkphn.7075.d:0 "예산안 없이 나랏돈을 집행하라는 대통령령이 내려왔다. 집행 명령서에는 각 부처 차관의 서명이 필요했다. 첫날 서명을 마친 부처는 절반이 되지 않았고, 나머지 결재판은 차관실 책상 위에 그대로 놓여 있었다. 국무회의는 그 결재판들을 두고 두 시간 동안 말이 없었다.\n\n사흘째 되는 날 경제 부처의 차관 한 명이 사표를 냈다. 다음 날 두 명이 더 냈다. 그들은 기자들 앞에 서지 않았고, 사표에는 개인 사정이라고만 적혀 있었다. 대통령실은 사표를 바로 수리했다.\n\n빈자리는 대통령실 비서관들이 채웠다. 새 차관들은 첫날 명령서에 서명했다. 그러나 과장과 국장들이 결재 서류를 올리지 않았다. 아무도 거부하지 않았고, 아무도 일을 하지 않았다. 세종시의 사무실들에는 키보드 소리만 낮게 이어졌다.\n\n공무원 노조는 성명을 내지 않았다. 대신 점심시간마다 청사 앞 벤치에 앉은 사람들이 늘어났다. 연금 지급일이 다가오고 있었다. 명령은 위에서 내려왔지만, 나랏돈은 아래에서 움직이는 것이었다. 은행들은 정부 계좌의 지급을 하루씩 미루기 시작했다."
 tfrkphn.7075.a:0 "서명할 사람을 찾아라."
 tfrkphn.7076.t:0 "옷을 벗는 장군들"
 tfrkphn.7076.d:0 "국방부가 수도권 지휘관 인사를 발표했다. 수도방위사령관과 특수전사령관, 그리고 수도권의 기갑여단장 여럿이 한꺼번에 바뀌었다. 새 지휘관들은 대부분 광화문 무대에 자주 서던 예비역들과 가까운 사람들이었다. 발표는 금요일 밤 늦게 나왔다.\n\n교체된 장군들 가운데 몇은 그날 바로 전역 신청서를 냈다. 이임식도 열지 않았다. 몇은 새 보직을 받아들이고 조용히 짐을 쌌다. 국방부는 정상적인 인사라고 했고, 그 이상의 설명은 없었다. 군 관사 앞에는 이삿짐 트럭이 줄지어 섰다.\n\n한 기갑여단장은 달랐다. 그는 명령서를 받았지만 부대를 떠나지 않았다. 후임자가 부대 정문에 도착했을 때, 위병소는 출입 명단에 그 이름이 없다고 했다. 후임자는 차를 돌려 돌아갔다. 그 장면은 누군가의 휴대전화에 찍혀 다음 날 아침 퍼졌다.\n\n다음 날 여단장은 명령서의 절차를 확인하고 있다는 짧은 보고를 올렸다. 국방부는 그를 징계하지 않았다. 할 수 없었던 것인지, 하지 않은 것인지는 알 수 없었다. 그 부대는 여의도에서 가장 가까운 기갑부대였다."
 tfrkphn.7076.a:0 "명령은 명령이다."
