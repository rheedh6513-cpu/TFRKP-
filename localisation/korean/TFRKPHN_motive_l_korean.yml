l_korean:
 # [안내] 우리공화당 정권의 까닭을 보여 주는 사건 넷. motive_build.py가 만든다.
 tfrkphn.7268.t:0 "멈춘 나라"
 tfrkphn.7268.d:0 "조원진 정부의 첫해가 끝나 갈 무렵 국회는 장관 열두 명에 대한 탄핵소추안을 차례로 통과시켰다. 소추된 장관은 헌법재판소의 결정이 나올 때까지 직무가 멈췄다. 국방부와 법무부, 기획재정부의 장관 자리가 한꺼번에 비었다.\n\n국회는 대통령령마다 효력을 멈춰 달라는 소송을 냈고, 정부가 낸 추가 예산을 세 번 연달아 부결했다. 대통령이 거부한 법안은 다시 의결해 돌려보냈다. 정부 쪽 안건이 본회의에 오를 때마다 야당은 무제한 토론으로 날을 넘겼다. 한 의원은 열여섯 시간 동안 연단을 지켰다.\n\n국회 쪽에도 까닭은 있었다. 대통령은 법 대신 명령으로 다스렸고, 청산 위원회는 의원들을 불러 조사했다. 의원들은 국회가 손을 놓으면 남는 것은 대통령의 명령뿐이라고 말했다. 그 말을 믿는 사람과 믿지 않는 사람이 반씩이었다.\n\n그 사이 공무원들은 어느 쪽의 지시를 따라야 할지 몰랐다. 지방 공항 공사는 예산이 묶여 멈췄고, 병사들의 봄 휴가 날짜는 두 번 바뀌었다. 광장의 연단에서는 국회를 해산하라는 구호가 처음으로 나왔다."
 tfrkphn.7268.a:0 "구호가 커진다."
 tfrkphn.7264.t:0 "부결된 날"
 tfrkphn.7264.d:0 "조원진은 군 지휘관 교체 명단에 서명한 밤 집무실에서 오래된 신문 한 부를 꺼냈다. 양안전쟁 때 대만 지원 예산이 국회에서 석 달 동안 묶였던 날의 신문이었다. 그때 그는 의석 하나 없는 원외 정당의 대표였다. 신문은 누렇게 바래 있었다.\n\n그는 그 석 달을 광화문 천막에서 보냈다. 해협에서 돌아오지 못한 병사들의 부모가 천막을 찾아왔다. 그들은 국회가 다투는 동안 아들들이 탄약을 아껴 쏘았다고 말했다. 전쟁에 진 뒤 국회는 그 전쟁을 이끈 대통령을 탄핵했다. 예산을 묶었던 의원들 가운데 책임을 진 사람은 없었다.\n\n대통령이 된 뒤에도 같은 일이 되풀이됐다. 국회는 그의 첫 예산을 절반 가까이 깎았고, 그가 낸 법안은 하나도 본회의에 오르지 못했다. 그를 뽑은 사람들은 왜 아무것도 바뀌지 않느냐고 물었다.\n\n그는 국회가 나라를 지키지 못했다고 믿었다. 그 믿음은 천막에서 만난 부모들의 얼굴로 이루어져 있었다. 책상 위에는 비서관이 놓고 간 긴급명령의 초안이 있었다. 그는 그날 밤 초안을 읽기만 하고 서명하지 않았다."
 tfrkphn.7264.a:0 "초안을 서랍에 넣는다."
 tfrkphn.7265.t:0 "전역증"
 tfrkphn.7265.d:0 "토요일마다 광화문 연단 앞 셋째 줄에는 같은 청년이 앉았다. 그는 스물여섯 살이었고, 해군 군복 상의를 입고 나왔다. 그는 대만 해협에서 탄약을 나르던 보급함의 갑판병이었다. 같은 침실을 쓰던 동기 넷은 돌아오지 못했다.\n\n배는 휴전 협상이 시작되기 사흘 전에 기뢰에 맞았다. 그는 갑판에서 바다로 뛰어내려 살았다. 국회 청문회에서 한 의원은 그 전쟁이 애초에 하지 말았어야 할 전쟁이라고 말했다. 그는 그 장면을 재활 병원 휴게실의 텔레비전으로 보았다.\n\n하지 말았어야 할 전쟁이라면 동기들은 헛되이 죽은 것이 된다. 그는 그 말을 받아들일 수 없었다. 광장의 사람들만이 그 전쟁을 끝까지 했어야 했다고 말했다. 그 말 속에서 동기들은 나라를 지키다 죽은 사람으로 남았다.\n\n기자가 다가와 대통령을 지지하는 이유를 물었다. 그는 지갑에서 전역증과 동기들의 사진을 꺼내 보였을 뿐 대답하지 않았다. 집회가 끝나면 그는 천막 옆에서 다른 전역병들과 컵라면을 먹었다. 대학 친구들은 그가 광장에 나가는 것을 알지 못했다."
 tfrkphn.7265.a:0 "전역증을 지갑에 넣는다."
 tfrkphn.7266.t:0 "홍콩의 송금"
 tfrkphn.7266.d:0 "국가정보원장이 김진태에게 보고서 한 장을 올렸다. 대만이 넘어간 뒤 홍콩의 회사 열네 곳을 거쳐 국내 단체들로 들어온 돈의 흐름을 정리한 표였다. 받은 단체 가운데에는 시민 단체와 인터넷 언론, 대학 연구소가 섞여 있었다. 대외비 도장이 찍혀 있었다.\n\n액수는 크지 않았다. 표에 오른 단체 이백여 곳 가운데 돈을 보낸 쪽이 중국 정부와 이어진다고 확인된 곳은 열한 곳이었다. 나머지는 확인되지 않았다. 보고서 맨 아래에는 대만의 선거 때 같은 방식의 송금이 있었다는 첨부 자료가 붙어 있었다.\n\n김진태는 검사로 이십 년을 일했다. 그는 증거가 다 모이기를 기다리다 놓친 사건들을 기억하고 있었다. 대만은 증거가 다 모였을 때 이미 없는 나라였다. 그는 법으로 먼저 문을 닫아야 한다고 생각했다.\n\n법무부 장관은 열한 곳만 처벌하는 법을 만들자고 했다. 대통령은 표에 오른 이백여 곳을 모두 등록하게 하라고 지시했다. 어느 곳이 열한 곳에 들지 가려낼 시간이 없다는 이유였다. 장관은 지시를 받아 적었고, 그날 밤 사표를 썼다가 찢었다."
 tfrkphn.7266.a:0 "이백여 곳을 모두 올린다."
 tfrkphn.7267.t:0 "물러날 수 없는 이유"
 tfrkphn.7267.d:0 "광장이 비워진 날 밤 김진태는 비서실장과 마주 앉았다. 비서실장은 서류철 두 개를 가져왔다. 하나는 시위대를 이끈 사람들의 명단이었고, 다른 하나는 정권이 무너졌다면 법정에 섰을 사람들의 명단이었다. 둘 다 같은 부서에서 만들었다.\n\n둘째 명단은 길었다. 장관과 장군들, 애국단의 청년 수천 명, 광장에 무대를 세운 업자와 버스를 댄 운수 회사 사장들이 있었다. 공단에 새로 들어간 청년들의 이름은 명단에 없었지만, 그들의 일자리는 다음 정부가 가장 먼저 손댈 사업이었다.\n\n대통령은 그 명단을 끝까지 읽었다. 그는 물러난 대통령들이 어떤 대접을 받는지 보아 왔다. 그들은 퇴임 뒤에 법정에 섰고, 그들을 따르던 사람들은 광장에 남겨졌다. 그는 자기를 믿은 사람들을 그 자리에 두고 갈 수 없다고 생각했다.\n\n첫째 명단을 덮으면서 그는 비서실장에게 한 가지를 물었다. 저 사람들도 우리가 지면 이 명단을 만들겠느냐는 물음이었다. 비서실장은 그럴 것이라고 답했다. 대통령은 두 서류철을 모두 금고에 넣으라고 했다. 금고의 열쇠는 하나였다."
 tfrkphn.7267.a:0 "금고를 닫는다."
 tfrkphn.7269.t:0 "포수"
 tfrkphn.7269.d:0 "첫 포탄을 쏜 사람은 전차 부대의 스물아홉 살 중사였다. 그는 그날 새벽 무전으로 사격 명령을 받았다. 중대장은 국회 안에 무기를 든 반국가 세력이 있다고 말했고, 그는 그 말을 의심하지 않았다. 지난 석 달 동안 부대 안의 텔레비전은 같은 말을 했다.\n\n그의 아버지는 토요일마다 광화문에 나갔다. 형은 대만 해협에서 돌아오지 못했다. 그는 국회가 형의 탄약을 묶었다는 말을 집에서 수없이 들었다. 조준경 속의 돔은 그에게 형을 버린 건물이었다.\n\n포탄이 떨어지고 한 시간 뒤 본회의장에서 사람들이 손을 들고 걸어 나왔다. 무기를 든 사람은 없었다. 보좌진과 국회 직원, 촛불을 들고 있던 대학생 몇이 있었다. 포탄에 무너진 계단 옆에는 신발 한 짝이 놓여 있었다. 그는 조준경에서 눈을 떼지 못했다.\n\n한 달 뒤 그는 훈장을 받았다. 수여식은 방송으로 나갔고 아버지는 그 장면을 녹화해 두었다. 그는 그 뒤로 밤에 잠을 자지 못했다. 군의관은 그의 기록에 불면이라고만 적었다. 그는 다음 해 봄에 전역 신청서를 냈다."
 tfrkphn.7269.a:0 "훈장을 서랍에 넣는다."
 tfrkphn.7270.t:0 "반지하"
 tfrkphn.7270.d:0 "스물다섯 살의 청년은 다섯 해 동안 신림동의 반지하 방에서 살았다. 비가 많이 오는 날이면 창문 높이까지 물이 찼고, 그는 그때마다 노트북을 들고 피시방으로 갔다. 전역한 뒤 그는 택배 상하차와 편의점 야간 일을 함께 했다. 월세는 그 둘 가운데 하나의 월급을 통째로 가져갔다.\n\n공공 임대 주택 추첨 결과는 문자로 왔다. 그는 처음에 스팸인 줄 알고 지울 뻔했다. 방은 열네 평이었고 창문이 땅 위에 있었다. 이삿짐은 친구의 승용차 한 대에 다 실렸다. 친구는 이삿날 짜장면을 샀다.\n\n신문들은 그 주택이 노인 일자리 예산을 깎아 지은 것이라고 썼다. 그는 그 기사를 읽고 시골의 할머니에게 전화를 걸었다. 할머니는 손자가 볕 드는 방에 산다는 말에 오래 웃었다. 할머니는 경로당 난방비 이야기는 꺼내지 않았다.\n\n그는 편의점 야간 일을 그만두었다. 토요일이면 같은 단지의 청년들과 지하철을 타고 광화문에 갔다. 그는 연단의 연설을 다 믿지는 않았지만 박수는 쳤다. 그날 밤 그는 처음으로 창문 밖이 환한 방에서 잠이 들었다."
 tfrkphn.7270.a:0 "창문을 연다."
 tfrkphn.7271.t:0 "돔 아래에서"
 tfrkphn.7271.d:0 "새 헌법이 통과된 날 밤 조원진은 경호원 둘만 데리고 여의도에 갔다. 국회의사당의 돔에는 비계가 둘러져 있었다. 포탄이 뚫은 자리는 방수포로 덮여 있었고, 바람이 불 때마다 방수포가 소리를 냈다. 계단에는 깨진 대리석이 쌓여 있었다.\n\n그는 계단에 서서 오래 돔을 올려다보았다. 그는 이 건물이 석 달 동안 나라를 멈춰 세웠다고 믿었다. 장관 자리는 비어 있었고 예산은 묶여 있었으며, 그를 뽑은 사람들은 아무것도 바뀌지 않는다고 했다. 누군가는 그 매듭을 끊어야 했다.\n\n돌아오는 차에서 그는 경호실장에게 그날의 사망자 수를 물었다. 정부가 발표한 숫자는 열한 명이었다. 경호실장은 잠시 머뭇거리다 병원에서 집계한 숫자는 그보다 많다고 답했다. 대통령은 그 숫자를 더 묻지 않았다.\n\n이튿날 그는 돔의 그을음을 닦지 말고 그대로 두라고 지시했다. 국회가 나라를 멈춘 대가를 사람들이 보아야 한다는 이유였다. 비서실장은 그 지시를 받아 적었다. 그을음은 그 뒤로 여러 해 동안 남았다. 관광버스들은 국회 앞을 지날 때 속도를 늦췄다."
 tfrkphn.7271.a:0 "그을음을 그대로 둔다."
 tfrkphn.7272.t:0 "서랍의 사건"
 tfrkphn.7272.d:0 "권한대행이 된 첫 주 김진태는 총리실 서랍을 정리하다 낡은 수사 기록 한 권을 찾았다. 검사 시절 그가 끝내 기소하지 못한 사건이었다. 증인이 진술을 바꿨고 그는 그 사건을 놓쳤다. 피의자는 그 뒤 국회의원이 되었고, 그는 그 이름을 신문에서 여러 번 보았다.\n\n그는 그 일 뒤로 법은 먼저 손에 쥔 쪽의 것이라고 믿게 됐다. 조원진이 물러나자 여당 안에서는 벌써 다음 자리를 두고 다툼이 시작됐다. 청산 위원회에 불려 갔던 사람들은 보복을 말했다. 공단의 청년들은 일자리가 다시 사라질까 걱정했다. 애국단의 청년들은 다음 명령을 기다렸다.\n\n그는 누군가 질서를 쥐지 않으면 이 모든 것이 한꺼번에 무너진다고 보았다. 그 질서를 쥐는 방법을 그는 하나밖에 알지 못했다. 수사 기관과 법원, 그리고 그 둘 사이를 오가는 서류였다.\n\n그는 수사 기록을 다시 서랍에 넣었다. 첫 국무회의의 안건은 치안이었다. 그는 회의를 시작하며 장관들에게 앞으로의 모든 일은 법대로 하겠다고 말했다. 법을 누가 고칠지는 말하지 않았다."
 tfrkphn.7272.a:0 "서랍을 닫는다."
 tfrkphn.7273.t:0 "간첩"
 tfrkphn.7273.d:0 "국가정보원은 외국 대리인 법이 시행된 지 두 달 만에 일곱 명을 체포했다. 무역 회사 직원과 대학 강사, 해군 기지 근처에서 식당을 하던 부부가 있었다. 그들은 기지를 드나드는 배의 이름과 시각을 적어 홍콩의 회사로 보냈다.\n\n수사 기록은 법정에서 공개됐다. 암호를 적은 수첩과 외장 하드, 다섯 해 동안 받은 돈의 영수증이 증거로 나왔다. 그 돈의 출발점은 김진태가 받았던 보고서 속 열한 곳 가운데 하나였다. 체포된 강사의 연구실에서는 같은 암호표가 두 벌 더 나왔다. 한 벌은 다른 사람의 필체였다.\n\n야당은 처음에 조작을 의심했다. 재판이 석 달째에 이르자 야당 의원 몇은 증거가 진짜라는 것을 인정했다. 한 의원은 법의 범위는 여전히 넓다고 말하면서도, 간첩이 있었다는 것만은 부정할 수 없다고 했다.\n\n여론 조사에서 외국 대리인 법을 지지한다는 응답이 처음으로 절반을 넘었다. 식당 부부의 가게 자리에는 그해 가을 편의점이 들어섰다. 기지의 해병들은 그 편의점에서 컵라면을 샀다. 남은 한 벌의 주인은 끝내 잡히지 않았다."
 tfrkphn.7273.a:0 "재판 기록을 공개한다."
 tfrkphn.7274.t:0 "장바구니"
 tfrkphn.7274.d:0 "패전 뒤 네 해 동안 대구의 한 주부는 가계부에 빨간 줄을 그었다. 쌀값과 기름값이 오를 때마다였다. 그해 가을 그녀는 석 달 만에 처음으로 빨간 줄을 긋지 않았다. 물가 상승률은 한 해 전의 절반으로 내려와 있었다. 그녀는 가계부를 덮고 빨간 볼펜을 서랍에 넣었다.\n\n남편이 다니던 자동차 부품 공장은 전쟁 뒤에 주문이 끊겨 주 사흘만 돌았다. 정부가 수출 목표를 공장 벽에 걸게 한 다음 해부터 주문이 돌아왔다. 남편은 다시 주 닷새를 일했고 잔업 수당이 붙었다. 그는 퇴근길에 통닭을 사 오기 시작했다.\n\n그녀는 정치에 관심이 없었다. 텔레비전에서 대통령이 나오면 채널을 돌렸다. 신문이 언론 탄압을 말하는 날에도 그녀는 장바구니의 무게를 먼저 보았다. 무게는 조금씩 늘고 있었다. 정육점에서 소고기를 산 것은 네 해 만이었다.\n\n딸은 대통령이 나라를 망친다고 말했다. 그녀는 딸과 다투지 않았다. 그녀는 딸의 등록금 고지서를 냉장고에 붙이고, 남편의 월급날 그 위에 납부 도장을 찍었다. 그해에는 할부 없이 한 번에 냈다."
 tfrkphn.7274.a:0 "납부 도장을 찍는다."
 tfrkphn.7275.t:0 "출근길"
 tfrkphn.7275.d:0 "스물일곱 살의 청년은 세 해 동안 원서를 백 장 넘게 냈다. 패전 뒤 청년 실업률은 열여덟 퍼센트까지 올랐고, 그의 대학 동기 절반이 같은 처지였다. 그해 봄 그는 창원의 방산 부품 회사에 합격했다. 합격 문자를 받은 날 그는 고시원 방을 정리했다.\n\n그 회사는 정부의 수출 계획에 따라 공장을 두 배로 늘린 곳이었다. 그해 청년 실업률은 아홉 퍼센트로 내려왔다. 신문은 그 숫자를 일 면에 실었고, 야당은 새 일자리의 절반이 비정규직이라고 반박했다. 두 말이 모두 맞았다.\n\n그는 대학에서 진보 동아리에 있었다. 그때 그는 이 정부가 나라를 망칠 것이라고 믿었다. 첫 월급을 받은 날 그는 그 믿음이 흔들리는 것을 느꼈다. 동기들 가운데 여럿이 같은 이야기를 했다. 동아리 단체 대화방은 그해 여름 조용해졌다.\n\n그해 여론 조사에서 이십 대의 여당 지지율은 처음으로 사십 퍼센트를 넘었다. 그는 그 조사에 응답하지 않았다. 출근 버스에서 그는 이어폰을 꽂고 창밖의 공단을 보았다. 굴뚝 세 개 가운데 두 개에서 연기가 나고 있었다."
 tfrkphn.7275.a:0 "버스가 공단에 닿는다."
 TFRKPHN_mot_kp_p3_tt:0 "§Y숫자판에 나오지 않는 민심§! §G+3§!"
