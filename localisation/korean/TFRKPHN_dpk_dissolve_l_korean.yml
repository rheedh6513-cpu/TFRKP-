 # [안내] 민주당 해산 뒤 정당 이름과 설명. taiwan_fix.py가 만든다.
 TFRKPHN_dpk_dissolved_party:0 "더불어민주당 §g(해산됨)§!"
 TFRKPHN_dpk_dissolved_party_long:0 "더불어민주당 §g(해산됨)§!\n헌법재판소의 정당 해산 결정으로 해산되었습니다. 소속 의원들은 의원직을 잃었고, 같은 이름이나 같은 강령으로 당을 다시 만들 수 없습니다. 지지자들은 흩어져 무소속 후보와 다른 당을 찾고 있습니다."
 TFRKPHN_dpk_dissolved_tt:0 "정당 목록의 더불어민주당에 §g(해산됨)§!이 붙고, 정당 설명이 해산 결정 내용으로 바뀝니다."
