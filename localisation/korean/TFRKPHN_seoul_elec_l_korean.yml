l_korean:
 # 오세훈 정부 2030년 지방선거. seoul_elec_build.py가 만든다.
 tfrkphn.641.t:0 "서울시장 경선"
 tfrkphn.641.d:0 "지방선거가 석 달 앞으로 다가왔습니다. 대통령이 시장 자리를 비우고 나온 뒤로 서울시는 권한대행이 맡아 왔고, 우리 당은 이제 그 자리에 세울 사람을 정해야 합니다.\n\n정몽준은 당이 불러낸 원로입니다. 1988년에 국회에 들어와 일곱 번 당선됐고 당 대표를 지냈습니다. 2014년 6월 4일 서울시장 선거에 나가 43.02를 얻고 졌는데, 그 뒤로 열여섯 해가 지났습니다. 이름을 모르는 유권자가 없다는 것이 그를 미는 사람들의 말입니다. 시청에 들어간 뒤에 대통령의 말을 들을 사람은 아닙니다.\n\n김병민은 대통령의 사람입니다. 스물여덟 살에 서초구의원이 됐고, 대통령이 시장이던 때 정무부시장으로 곁에 있었으며 이 정부에서는 대변인으로 대통령의 말을 전했습니다. 2020년 총선에서는 광진갑에 나갔다가 졌습니다. 이름값은 정몽준에 한참 못 미칩니다. 그래도 그가 시장이 되면 시청과 대통령실이 한 몸처럼 움직입니다.\n\n대통령은 경선에 끼어들지 않겠다고 했습니다. 그래도 누구를 마음에 두고 있는지는 당이 다 압니다."
 tfrkphn.641.a:0 "원로를 불러낸다, 정몽준"
 tfrkphn.641.a_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_portrait_chung_mong_joon\n\n\n\n\n\n\n\n\n-------------------------------------\n§Y정몽준§!이 여당 서울시장 후보가 됩니다.\n스물다섯 구 모두의 여당 지지도 §G+3§!\n선거를 앞두고 나이와 공백이 입길에 오를 수 있습니다.\n당선되어도 시청은 대통령과 거리를 둡니다."
 tfrkphn.641.b:0 "우리 사람을 세운다, 김병민"
 tfrkphn.641.b_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_portrait_kim_byung_min\n\n\n\n\n\n\n\n\n-------------------------------------\n§Y김병민§!이 여당 서울시장 후보가 됩니다.\n동남권 4개 구의 여당 지지도 §G+3§!\n강북권 14개 구의 여당 지지도 §G+1§!\n당선되면 서울의 건물 칸 §G+2§!, 강남과 강북의 격차 §G-1§!"
 tfrkphn.642.t:0 "야당 후보 정원오"
 tfrkphn.642.d:0 "야당이 서울시장 후보로 정원오를 세웠습니다.\n\n그는 성동구청장을 세 번 했습니다. 2022년 지방선거에서 우리 당이 한강을 낀 구를 거의 다 이겼을 때도 성동만은 그가 57.60으로 지켰습니다. 같은 날 같은 성동에서 오세훈 시장이 60.90을 얻었으니, 시장은 오세훈을 찍고 구청장은 정원오를 찍은 사람이 그만큼 많았다는 뜻입니다.\n\n당이 달라도 표를 받는 사람이 상대로 나왔습니다. 우리는 그가 대통령의 옛 지지자들을 얼마나 데려갈지를 걱정해야 합니다."
 tfrkphn.642.a:0 "만만한 상대가 아니다"
 tfrkphn.642.a_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_portrait_KOR_chong_won_oh_gamerule\n\n\n\n\n\n\n\n\n-------------------------------------\n§Y정원오§!가 야당 서울시장 후보가 됩니다.\n성동구의 여당 지지도 §R-3§!\n강북권 14개 구의 여당 지지도 §R-1§!"
 tfrkphn.645.t:0 "열여섯 해의 공백"
 tfrkphn.645.d:0 "선거가 세 주 앞입니다. 토론회에서 야당 후보가 정몽준 후보에게 물었습니다. 마지막으로 선거를 치른 것이 2014년인데 그 사이 서울이 어떻게 달라졌는지 아느냐는 질문이었습니다.\n\n후보는 막힘 없이 답했습니다. 그런데 다음 날 기사 제목에는 답 대신 질문만 실렸습니다. 강북의 젊은 유권자들 사이에서는 우리 당이 새 사람을 내지 못했다는 말이 돕니다.\n\n이름값으로 얻은 표가 강북에서 조금씩 빠지고 있습니다."
 tfrkphn.645.a:0 "경험으로 답한다"
 tfrkphn.645.a_tt:0 "강북권 14개 구의 여당 지지도 §R-2§!"
 tfrkphn.643.t:0 "서울을 지켰다"
 tfrkphn.643.d:0 "개표가 끝났습니다. 우리 당의 [GetTFRKPHNSdCand] 후보가 서울시장에 당선됐습니다. 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었습니다.\n\n구청장은 스물다섯 곳 가운데 우리가 §R[?TFRKPHN_sd_won|0]§!곳, 야당이 §B[?TFRKPHN_sd_lost|0]§!곳을 가져갔습니다.\n\n성동구: [GetTFRKPHNSdK13]\n서초구: [GetTFRKPHNSdK23]\n용산구: [GetTFRKPHNSdK16]\n중구구: [GetTFRKPHNSdK12]\n강북구: [GetTFRKPHNSdK2]\n성북구: [GetTFRKPHNSdK5]\n\n대통령이 떠난 시청에 다시 우리 사람이 들어갑니다."
 tfrkphn.643.a:0 "서울은 우리 편이다"
 tfrkphn.643.a_tt:0 "시청이 대통령실과 발을 맞춥니다: 서울의 건물 칸 §G+2§!, 강남과 강북의 격차 §G-1§!"
 tfrkphn.643.a_tt2:0 "새 시장은 자기 길을 갑니다. 시청에서 따로 얻는 것은 없습니다."
 tfrkphn.644.t:0 "서울을 내줬다"
 tfrkphn.644.d:0 "개표가 끝났습니다. 서울시장은 야당의 정원오 후보에게 돌아갔습니다. 우리 당 [GetTFRKPHNSdCand] 후보는 졌고, 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었습니다.\n\n구청장은 스물다섯 곳 가운데 우리가 §R[?TFRKPHN_sd_won|0]§!곳, 야당이 §B[?TFRKPHN_sd_lost|0]§!곳을 가져갔습니다.\n\n성동구: [GetTFRKPHNSdK13]\n서초구: [GetTFRKPHNSdK23]\n용산구: [GetTFRKPHNSdK16]\n중구구: [GetTFRKPHNSdK12]\n강북구: [GetTFRKPHNSdK2]\n성북구: [GetTFRKPHNSdK5]\n\n대통령이 열 해 넘게 일한 시청이 야당에 넘어갔습니다. 남은 임기 동안 서울의 일은 야당 시장과 마주 앉아 풀어야 합니다."
 tfrkphn.644.a:0 "결과를 받아들인다"
 TFRKPHN_sd_dist_tt:0 "여당 구청장이 §Y13곳§! 이상이면 건설 속도 §G+5§!, 아니면 §R-3§! (백분율)"
