l_korean:
 tfrkphn.6993.t:0 "김정은 생포"
 tfrkphn.6993.d:0 "강계의 지휘부가 무너지기 사흘 전, 평양의 고위 간부 몇 명이 판문점을 거쳐 우리 측에 사람을 보냈다. 그들이 내민 조건은 하나였다. 자신들과 가족의 안전을 보장하면 김정은의 신병을 넘기겠다는 것이었다.\n\n정부는 밤새 회의를 이어 갔고, 다음 날 새벽 조건을 받아들였다. 그날 오후 강계 북쪽 산악 지대의 지휘 벙커에서 김정은이 국군 특수부대에 넘겨졌다. 곁을 지키던 경호원들은 이미 자리를 떠난 뒤였고, 저항은 없었다.\n\n합동참모본부는 저녁 브리핑에서 생포 사실을 확인했다. 그는 군 병원에서 검사를 받고 있고, 건강에는 큰 문제가 없었다. 전쟁 막바지에 돌던 신변 이상 소문은 사실이 아니었다.\n\n오세훈 대통령은 대국민 담화에서 보복 대신 법으로 처리하겠다고 말했다. 그를 어느 법정에 세울지는 국회와 동맹국 사이에서 의견이 갈렸다. 국제형사재판소에 넘기자는 쪽이 있었고, 피해자가 우리 국민이니 우리 법정에서 재판해야 한다는 쪽도 있었다."
 tfrkphn.6993.a:0 "국제 재판에 넘긴다."
 tfrkphn.6993.b:0 "우리 법정에 세운다."
 tfrkphn.6994.t:0 "한국군, 김정은 신병 확보"
 tfrkphn.6994.d:0 "대한민국 합동참모본부가 김정은 국무위원장의 신병을 확보했다고 발표했습니다. 강계 북쪽 산악 지대의 지휘 벙커에서 붙잡힌 그는 지금 한국군 병원에 있습니다. 평양의 고위 간부들이 자신들의 안전을 보장받는 대가로 그의 위치를 넘겼다는 보도가 잇따랐습니다.\n\n전쟁 막바지에 돌던 그의 신변 이상설은 이것으로 끝났습니다. 김일성에서 시작된 세습 통치도 3대 만에 막을 내리게 되었습니다.\n\n소식이 전해진 서울 광화문 앞에는 저녁 무렵부터 사람들이 모여들었습니다. 고향이 북쪽인 노인들은 태극기 대신 고향 마을 이름을 적은 종이를 들고 나왔고, 젊은 사람들은 휴대폰으로 속보 화면을 서로 돌려 보았습니다. 환호보다 조용히 우는 사람이 더 많았습니다.\n\n각국 정부도 잇달아 입장을 냈습니다. 브뤼셀의 유럽연합은 한반도의 오랜 전쟁이 끝났다며 한국 정부에 축하를 전했고, 도쿄는 납북자 문제의 진상부터 밝혀야 한다고 했습니다. 베이징 외교부는 하루 내내 논평을 내지 않았습니다. 유엔 안전보장이사회는 내일 긴급회의를 열어 그를 어느 법정에 세울지 논의합니다."
 tfrkphn.6994.kor:0 "끝까지 법으로 처리합니다."
 tfrkphn.6994.prc:0 "베이징은 오래 침묵했습니다."
 tfrkphn.6994.jap:0 "도쿄는 납북자 문제부터 꺼냈습니다."
 tfrkphn.6994.etc:0 "세습 독재가 끝났습니다."
