 tfrkphn.7002.t:0 "태양이라는 이름의 별"
 tfrkphn.7002.d:0 "도착 5분 전.\n\n오늘따라 로터가 거세게 떨린다. 한때 우리가 도시라고 부르던 곳은 폐허가 되었고, 흰 눈과 잿빛 얼음이 금 간 땅을 뒤덮었다. 아래로 지나가는 검은 길은 군데군데 끊겨 있다. 우리의 생명선도 저렇게 끊겨 있는지 모른다.\n\n도착 4분 전.\n\n목표 지점이 눈에 들어온다. 나는 예와 아니오라는 말도, 내 이름과 계급도 잊은 채 태양이라는 별에 데어 떨어질 준비를 한다. 이곳은 고향과 다르다. 반듯하게 늘어선 건물 대신 죽음으로 쌓은 산맥이 있고, 웅장함이 있어야 할 자리에 영혼 없는 건물들이 서 있다. 여기 사람들은 태양이라는 별 아래에서 살아왔다.\n\n도착 3분 전.\n\n출격 전에 들은 목표는 누구보다 유명한 사람이었다. 그런데 지금은 그 이름이 떠오르지 않는다. 땅이 가까워질수록 죽음도 가까워진다. 진동이 바닥에서 올라와 온몸을 덮치고, 장구류가 흔들리기 시작한다. 나는 조종간을 쥐고 죽음과 싸우기 시작했다."
 tfrkphn.7003.d:0 "도착 2분 전.\n\n쏠 때마다 사람이 터져 나간다. 늘 해 오던 일인데 오늘은 이상하게 속이 뒤집힌다. 돌아볼수록 오늘의 내가 역겹다. 지상에서는 무전이 끊이지 않는다. 아파치, 저놈들 당장 처리해! 버튼을 누르자 로켓이 불꼬리를 끌며 날아간다.\n\n도착 1분 전.\n\n수송 헬기가 바퀴를 땅에 대기도 전에 생포조가 뛰어내린다. 조준경 안에서 그들은 하얀 점이 되어 흩어졌다가, 반쯤 무너진 저택 정문 앞에서 다시 한 줄로 붙는다. 섬광이 한 번 번쩍이고 점들이 건물 안으로 빨려 들어간다. 무전이 끊겼다. 나는 숨을 참은 채 출입구만 겨눈다.\n\n얼마나 지났을까. 점들이 다시 쏟아져 나온다. 그 사이에 하나가 더 섞여 있다. 머리에 자루를 쓰고 양팔을 붙들린 채 끌려 나오는 점이다. 저것이 태양이었나.\n\n무전이 다시 살아난다. 그놈 확보했어? 확보했다. 이 지옥에서 빨리 빠져나가자.\n\n잠시 뒤, 헬기 소리가 멀어져 간다."
 tfrkphn.7003.a:0 "거짓된 왕국의 종말이 다가왔다."
 tfrkphn.6993.t:0 "김정은 생포"
 tfrkphn.6993.d:0 "밤 아홉 시, 모든 방송이 정규 편성을 끊고 대통령실 브리핑실을 비췄다. 연단에 선 오세훈 대통령은 원고를 내려다보지 않았다. 그는 오늘로 이 전쟁이 막바지에 다다랐다고 말한 뒤 잠깐 숨을 골랐다. 그리고 한마디를 덧붙였다. 국민 여러분, 생포했습니다.\n\n생포. 그 한 단어로 충분했다. 전황이 남쪽으로 기울었다는 것을 모두가 알아들었다. 브리핑실 뒤쪽에 서 있던 기자 몇이 먼저 손뼉을 쳤다.\n\n잠시 뒤 대통령 뒤의 화면에 영상이 켜졌다. 열상 조준경 속에서 공격헬기의 로켓이 지붕 위의 하얀 점들을 지웠고, 수송 헬기에서 뛰어내린 생포조가 건물 안으로 사라졌다. 몇 분 뒤 그들은 머리에 자루를 쓴 사람 하나를 양쪽에서 붙들고 나왔다. 영상이 멈춘 곳에서 자루가 벗겨졌다.\n\n대통령은 보복 대신 법으로 처리하겠다고 했다. 그를 어느 법정에 세울지를 두고 국회와 동맹국의 의견은 갈렸다."
 tfrkphn.6993.a:0 "국제 재판에 넘긴다."
 tfrkphn.6993.b:0 "우리 법정에 세운다."
 tfrkphn.7004.t:0 "헤이그의 피고인석"
 tfrkphn.7004.d:0 "헤이그 국제형사재판소의 첫 공판은 오전 아홉 시 반에 열렸다. 한국 정부가 로마 규정 당사국으로서 사태를 회부한 지 다섯 달 만이었다. 법정 경위들이 방탄유리 문을 닫자 장내가 조용해졌다.\n\n검사석에 선 사람은 서아프리카 출신의 수석 검사였다. 그는 낮고 고른 목소리로 공소장을 한 시간 넘게 읽었고, 한 번도 원고에서 눈을 떼지 않았다. 정치범 수용소, 민간인 거주지에 쏟아진 포격, 항복한 포로의 처형. 죄목이 하나 넘어갈 때마다 방청석의 탈북민 증인들이 고개를 숙였다.\n\n발언 기회를 얻은 피고인은 이 법정에 자신을 재판할 권한이 없다고 했다. 재판장은 그 주장을 기록에 남기겠다고만 답했다. 재판소가 지정한 변호인 셋은 관할 문제를 서면으로 다시 내겠다고 했다.\n\n서울에서는 저녁 다섯 시 반, 모든 방송이 공판을 생중계했다. 국회 몇몇 의원은 그래도 우리 법정에 세웠어야 했다고 다시 말했다. 판결까지는 몇 해가 걸릴 것이다. 사형은 없다. 국제 재판의 가장 무거운 형은 종신형이다."
 tfrkphn.7004.a:0 "세계가 지켜보는 앞에서 기록은 남는다."
 tfrkphn.7005.t:0 "417호 대법정"
 tfrkphn.7005.d:0 "서울중앙지방법원 417호 대법정. 이 나라의 전직 대통령들이 섰던 그 자리에 오늘은 평양의 마지막 세습자가 섰다. 방청권 추첨에는 일만 명 넘게 몰렸다.\n\n공소장의 죄목은 셋이었다. 전쟁 도발, 민간인 학살, 포로 처형. 피고인은 대한민국 법원을 인정하지 않는다는 말만 남겼다. 사건을 맡겠다는 변호사가 끝내 나서지 않아 법원이 국선변호인을 지정했다. 열다섯 해 경력의 그는 첫 공판 내내 담담하게 절차만 짚었다.\n\n맨 앞줄에는 유가족이 앉았다. 개전 첫날 포격에 아들을 잃은 노인이 증인석에 섰다가 끝내 말을 잇지 못하고 내려왔다. 재판장은 한참 증인석 쪽을 바라보다가 십 분간 휴정을 알렸다.\n\n법원 밖에서는 사형을 구하라는 쪽과 사형만은 안 된다는 쪽이 길 하나를 사이에 두고 맞섰다. 이 나라는 1997년 겨울 이후 사형을 집행한 적이 없다. 브뤼셀은 사형 구형을 우려한다는 서한을 보내왔다. 검찰은 구형을 앞두고 대통령실의 뜻을 물었다."
 tfrkphn.7005.a:0 "사형을 구하라. 법이 정한 가장 무거운 형이다."
 tfrkphn.7005.b:0 "종신형을 구하라. 살아서 평생 기억하게 하라."
 tfrkphn.7006.t:0 "김여정의 권력 승계"
 tfrkphn.7006.d:0 "김정은이 생포된 지 이레. 강계로 물러난 북한의 남은 정권에서 새 소식이 들어왔다. 그의 동생 김여정이 당과 군의 직책을 모두 넘겨받고 최고 영도자의 자리에 올랐다는 첩보다.\n\n조선중앙방송은 오빠의 생포를 끝내 인정하지 않았다. 방송은 그를 원쑤들에게 납치된 수령이라 부르며, 그가 돌아올 때까지 동생이 대신 나라를 지킨다고 했다.\n\n정보기관의 판단은 달랐다. 수도는 이미 무너졌고 남은 부대는 산골짜기에 흩어져 있다. 지도자를 산 채로 내준 정권에서 백두혈통의 마지막 이름이 무엇을 붙잡을 수 있을지는 오래지 않아 드러날 것이다."
 tfrkphn.7006.a:0 "여름이 끝나간다."
 tfrkphn.7007.d:0 "아시아의 전황을 뒤흔든 생포 소식에 이어 또 하나의 소식이 전해졌습니다. 한국군에 생포된 김정은 국무위원장의 동생 김여정 부부장이 북한에 남은 모든 권력을 넘겨받았다는 사실이 확인되었습니다.\n\n김여정은 조선중앙방송으로 낸 첫 성명에서 오빠가 적에게 납치되었을 뿐이라고 주장하고, 전 인민에게 마지막 한 사람까지 싸우라고 명령했습니다.\n\n하지만 군사 전문가들은 이 선언이 공허한 외침에 불과하다고 봅니다. 평양은 이미 함락되었고 북한군의 지휘 체계는 사실상 무너졌습니다. 전선 곳곳에서 식량과 보급이 끊긴 부대의 투항이 잇따르고 있습니다.\n\n지도자를 산 채로 적에게 내준 정권이 다시 일어설 수 있을지 의심하는 목소리가 많으며, EADI 또한 무너지는 독재 정권을 도울 힘이 없어 보입니다."
 tfrkphn.7015.t:0 "헤이그의 판결"
 tfrkphn.7015.d:0 "헤이그 국제형사재판소가 판결을 내렸다. 첫 공판에서 한 해 남짓, 재판부는 공소장의 죄목 거의 전부를 유죄로 인정했다. 정치범 수용소의 운영, 민간인 거주지 포격, 포로 처형. 선고는 종신형이었다.\n\n재판장은 예순을 넘긴 남미 출신 판사였다. 그는 주문을 읽다가 증언 한 대목에서 잠시 안경을 벗었고, 다시 쓰고 나서야 끝까지 읽었다. 방청석의 탈북민 증인 몇은 서로의 손을 잡았다. 판결문은 수천 쪽에 이르렀고, 그 대부분은 증언을 옮겨 적은 것이었다.\n\n서울의 반응은 갈렸다. 정부는 세계가 함께 내린 판결이라고 했다. 사형이 없는 법정에 그를 넘긴 것이 옳았느냐는 물음도 다시 나왔다. 유가족 단체는 짧은 성명을 냈다. 이제 누구도 그날을 지울 수 없다고."
 tfrkphn.7015.a:0 "판결문이 역사가 된다."
 tfrkphn.7016.t:0 "417호의 선고"
 tfrkphn.7016.d:0 "서울중앙지방법원 417호 대법정. 첫 공판에서 일곱 달, 재판장이 주문을 읽었다. 전쟁 도발, 민간인 학살, 포로 처형. 세 죄목 모두 유죄, 형은 검찰의 구형대로 사형이었다.\n\n재판장은 선고문을 읽는 한 시간 동안 물 한 모금 마시지 않았다. 검사석의 젊은 검사는 서류철 위에 깍지 낀 손을 풀지 못했고, 국선변호인은 마지막 주문이 끝나자 천천히 펜을 내려놓았다. 방청석 맨 앞줄의 유가족 가운데 몇은 울었고, 몇은 끝까지 아무 표정도 짓지 않았다.\n\n법원 밖에서는 환호와 침묵이 길 하나를 사이에 두고 갈렸다. 이 나라는 1997년 겨울 이후 사형을 집행한 적이 없다. 선고는 내려졌지만 집행 명령은 법무부 장관의 몫이다. 브뤼셀은 집행만은 안 된다는 서한을 다시 보내왔다."
 tfrkphn.7016.d2:0 "서울중앙지방법원 417호 대법정. 첫 공판에서 일곱 달, 재판장이 주문을 읽었다. 전쟁 도발, 민간인 학살, 포로 처형. 세 죄목 모두 유죄, 형은 검찰의 구형대로 무기징역이었다.\n\n재판장은 선고문을 읽는 한 시간 동안 물 한 모금 마시지 않았다. 검사석의 젊은 검사는 서류철 위에 깍지 낀 손을 풀지 못했고, 국선변호인은 마지막 주문이 끝나자 천천히 펜을 내려놓았다. 방청석 맨 앞줄의 유가족 가운데 몇은 울었고, 몇은 끝까지 아무 표정도 짓지 않았다.\n\n법원 밖에서는 사형을 외치던 사람들이 한동안 자리를 뜨지 않았다. 길 건너편에서는 이 나라가 법으로 이겼다는 피켓이 올라갔다. 그는 남쪽의 교도소에서 남은 생을 보낸다. 브뤼셀은 판결을 환영한다는 짧은 논평을 냈다."
 tfrkphn.7016.a:0 "선고는 끝났다. 집행은 서두르지 않는다."
 tfrkphn.7016.b:0 "남은 생을 갇혀서 보낸다."
 tfrkphn.6994.t:0 "한국군, 김정은 신병 확보"
 tfrkphn.6994.d:0 "오세훈 대통령이 밤 아홉 시 긴급 담화에서 김정은 국무위원장을 생포했다고 발표하고 작전 영상을 공개했습니다. 평양 외곽의 반쯤 무너진 저택에서 붙잡힌 그는 지금 한국군 병원에 있습니다. 평양의 고위 간부들이 자신들의 안전을 보장받는 대가로 그의 위치를 넘겼다는 보도가 잇따랐습니다.\n\n전쟁 막바지에 돌던 그의 신변 이상설은 이것으로 끝났습니다. 김일성에서 시작된 세습도 3대 만에 끝났습니다.\n\n담화가 끝나자 서울 광화문 앞에 사람들이 모여들었습니다. 고향이 북쪽인 노인들은 태극기 대신 고향 마을 이름을 적은 종이를 들고 나왔고, 젊은 사람들은 휴대폰 속보 화면을 서로 돌려 보았습니다. 환호보다 조용히 우는 사람이 더 많았습니다.\n\n각국 정부도 잇달아 입장을 냈습니다. 브뤼셀의 유럽연합은 한반도의 오랜 전쟁이 끝났다며 한국 정부에 축하를 전했고, 도쿄는 납북자 문제의 진상부터 밝혀야 한다고 했습니다. 베이징 외교부는 하루 내내 논평을 내지 않았습니다. 유엔 안전보장이사회는 내일 긴급회의를 열어 그를 어느 법정에 세울지 논의합니다."
 tfrkphn.6994.kor:0 "끝까지 법으로 처리합니다."
 tfrkphn.6994.prc:0 "베이징은 오래 침묵했습니다."
 tfrkphn.6994.jap:0 "도쿄는 납북자 문제부터 꺼냈습니다."
 tfrkphn.6994.etc:0 "세습 독재가 끝났습니다."
