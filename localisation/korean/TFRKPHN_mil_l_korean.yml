l_korean:
 # 이인제 정부 전후 군 재편. mil_build.py가 만든다.
 TFRKPHN_mil_v_troop:0 "§Y[?TFRKPHN_mil_troop|0]§!"
 TFRKPHN_mil_v_det:0 "§Y[?TFRKPHN_mil_det|0]§!"
 TFRKPHN_mil_v_press:0 "§Y[?TFRKPHN_mil_press|0]§!"
 TFRKPHN_mil_b_demob_tt:0 "§Y동원을 해제한다§!\n전시에 불러 모은 병력을 집과 일터로 돌려보냅니다.\n\n비용: £pol_power §Y15§!\n병력 §Y-10§!\n억지력 §R-6§!\n공장 생산량 §G+2%§!\n사단 조직력 §R-2%§!\n\n§g한 번 쓰면 60일 동안 다시 쓸 수 없습니다.§!\n§g병력이 40까지 내려가면 더 줄일 수 없습니다.§!"
 TFRKPHN_mil_b_recall_tt:0 "§Y전방 병력을 늘린다§!\n돌려보낸 병력을 다시 불러 북쪽을 겨눈 부대를 채웁니다.\n\n비용: £pol_power §Y20§!\n병력 §Y+10§!\n억지력 §G+6§!\n공장 생산량 §R-2%§!\n사단 조직력 §G+2%§!\n\n§g한 번 쓰면 60일 동안 다시 쓸 수 없습니다.§!\n§g병력이 100이면 더 늘릴 수 없습니다.§!"
 TFRKPHN_mil_b_reserve_tt:0 "§Y예비군을 다시 짠다§!\n돌아간 사람들을 지역 예비군으로 묶어, 줄어든 병력의 빈자리를 메웁니다.\n\n비용: £pol_power §Y20§!\n억지력 §G+5§!\n\n§g한 번 쓰면 90일 동안 다시 쓸 수 없습니다.§!\n§g3번까지 쓸 수 있습니다.§!"
 TFRKPHN_mil_b_md_tt:0 "§Y미사일 방어망을 넓힌다§!\n방어망을 북쪽과 서쪽으로 넓힙니다. 핵억지를 물려받은 경우에는 주변국이 더 반발합니다.\n\n비용: £pol_power §Y25§!\n억지력 §G+8§!\n§g물려받은 핵억지를 골랐다면§! 주변국 압력 §R+5§!\n\n§g한 번 쓰면 120일 동안 다시 쓸 수 없습니다.§!\n§g3번까지 쓸 수 있습니다.§!\n§R중점 §Y최소한의 대응조치§!§R를 끝내야 합니다.§!"
 TFRKPHN_mil_b_merge_tt:0 "§Y부대를 합치고 줄인다§!\n승전의 교훈대로 겹치는 부대를 합칩니다. 사람은 줄어도 싸우는 힘은 덜 깎입니다.\n\n비용: £pol_power §Y25§!\n병력 §Y-10§!\n억지력 §R-2§!\n공장 생산량 §G+2%§!\n육군 경험치 §G+15§!\n\n§g한 번 쓰면 90일 동안 다시 쓸 수 없습니다.§!\n§g2번까지 쓸 수 있습니다.§!\n§R중점 §Y국방개혁 2단계§!§R를 끝내야 합니다.§!"
 TFRKPHN_mil_b_border_tt:0 "§Y통일 대비 부대를 만든다§!\n북한 지역의 안정화와 압록강, 두만강 국경 방어를 맡을 부대를 미리 짜 둡니다.\n\n비용: £pol_power §Y30§!\n억지력 §G+10§!\n\n§g1번까지 쓸 수 있습니다.§!\n§R중점 §Y통일 대비 군 개편§!§R을 끝내야 합니다.§!"
 TFRKPHN_mil_b_joint_tt:0 "§Y일본과 공동 관리를 협의한다§!\n핵억지를 함께 쌓은 일본과 관리 절차를 공개해, 주변국의 의심을 덜어 냅니다.\n\n비용: £pol_power §Y20§!\n주변국 압력 §G-15§!\n\n§g한 번 쓰면 90일 동안 다시 쓸 수 없습니다.§!"
 TFRKPHN_mil_b_explain_tt:0 "§Y주변국에 설명한다§!\n특사를 보내 이 억지력이 북핵이 사라지는 날까지만 유지된다고 설명합니다.\n\n비용: £pol_power §Y15§!\n주변국 압력 §G-8§!\n\n§g한 번 쓰면 60일 동안 다시 쓸 수 없습니다.§!"
 TFRKPHN_mil_b_conv_tt:0 "§Y재래식 전력을 보강한다§!\n핵을 내려놓을 날에 대비해 정밀 타격 전력과 방공 전력을 늘립니다.\n\n비용: £pol_power §Y20§!\n억지력 §G+6§!\n공장 생산량 §R-1%§!\n\n§g한 번 쓰면 90일 동안 다시 쓸 수 없습니다.§!\n§g3번까지 쓸 수 있습니다.§!"
 TFRKPHN_mil_b_declare_tt:0 "§Y비핵 선언을 알린다§!\n통일의 날 핵을 내려놓겠다는 선언을 들고 주변국을 돕니다.\n\n비용: £pol_power §Y15§!\n안정도 §G+1%§!\n정치력 §G+25§!\n\n§g한 번 쓰면 120일 동안 다시 쓸 수 없습니다.§!\n§g2번까지 쓸 수 있습니다.§!"
 TFRKPHN_lee_mil_category:0 "전후 군 재편"
 TFRKPHN_lee_mil_category_desc:0 "전쟁이 끝난 군대를 얼마나 남기고 어디에 세울지 정합니다."
 TFRKPHN_mil_start_tt:0 "결정 탭에 §Y전후 군 재편§!이 열립니다. 병력을 돌려보내면 §Y공장 생산량§!이 오르고 §Y억지력§!이 떨어집니다."
 TFRKPHN_mil_h2b_tt:0 "§Y전후 군 재편§! 탭: 억지력 §G+15§!, 그 대신 §Y주변국 압력§!이 30일마다 §R5§!씩 쌓입니다."
 TFRKPHN_mil_h2_tt:0 "§Y전후 군 재편§! 탭: 억지력 §R-5§!, 주변국 압력은 생기지 않습니다. 재래식 전력을 보강하는 단추가 열립니다."
 TFRKPHN_mil_small:0 "작지만 단단한 군"
 TFRKPHN_mil_small_desc:0 "전시 편제로 부풀었던 군을 줄이고, 남은 부대를 새 임무에 맞추어 다시 짰습니다."
 TFRKPHN_mil_north:0 "북쪽을 겨눈 군"
 TFRKPHN_mil_north_desc:0 "이긴 전쟁의 군대를 흩지 않고 그대로 북쪽으로 돌려 세웠습니다."
 TFRKPHN_mil_tt_recall:0 "§Y전후 군 재편§!: 병력 §Y+10§!, 억지력 §G+6§!, 공장 생산량 §R-2%§!, 사단 조직력 §G+2%§!"
 TFRKPHN_mil_tt_det5:0 "§Y전후 군 재편§!: 억지력 §G+5§!"
 TFRKPHN_mil_tt_press25:0 "§Y전후 군 재편§!: 주변국 압력 §G-25§!"
 TFRKPHN_mil_tt_press10:0 "§Y전후 군 재편§!: 주변국 압력 §G-10§!"
 TFRKPHN_mil_tt_close:0 "§Y전후 군 재편§! 탭이 닫힙니다."
 tfrkphn.543.t:0 "빈자리"
 tfrkphn.543.story:0 "새벽에 합동참모본부의 보고가 올라왔다. 북한군 포병이 군사분계선 가까이로 자리를 옮겼고, 서해에서는 중국 해경선이 우리 어선을 한나절이나 따라붙었다는 내용이었다.\n\n국방부는 병력을 돌려보낸 뒤로 전방의 빈자리가 눈에 띄게 늘었다고 보았다. 상대가 그 빈자리를 재 보고 있다는 것이 정보 당국의 판단이었고, 이대로 두면 다음에는 더 가까이 올 것이라는 말도 보고서 끝에 붙어 있었다.\n\n이인제는 보고서를 덮고 안보실장을 불렀다."
 tfrkphn.543.a:0 "항의 성명으로 그친다"
 tfrkphn.543.b:0 "돌려보낸 병력을 다시 부른다"
 tfrkphn.543.c:0 "방어망을 가동해 보인다"
 tfrkphn.544.t:0 "쌓이는 항의"
 tfrkphn.544.d:0 "한일 공동 핵억지를 그대로 두겠다는 결정이 알려진 뒤로 주변국의 항의가 쌓였습니다. 중국 외교부는 연일 성명을 냈고, 몇몇 나라는 원자력 협력과 수출 허가를 다시 살펴보겠다고 통보해 왔습니다.\n\n외교부는 이 억지력이 북핵이 사라지는 날까지만 유지된다는 점을 대통령이 직접 설명해야 한다고 건의했습니다. 청와대 안에서는 대꾸할수록 일이 커진다는 의견도 적지 않습니다."
 tfrkphn.544.a:0 "대통령이 직접 설명한다"
 tfrkphn.544.b:0 "대꾸하지 않는다"
 tfrkphn.545.t:0 "재편을 마치다"
 tfrkphn.545.d:0 "국방부가 전후 군 재편을 마쳤다고 보고했습니다. 전시 편제로 부풀었던 군은 눈에 띄게 줄었고, 군복을 벗은 사람들은 공장과 건설 현장의 빈자리로 돌아갔습니다.\n\n남은 부대는 북쪽 국경과 통일 뒤의 임무에 맞추어 다시 짜였습니다. 대통령은 보고서 끝에 서명하면서, 수를 줄인 만큼 남은 장병의 처우를 먼저 챙기라고 덧붙였습니다."
 tfrkphn.545.a:0 "작지만 단단한 군"
 tfrkphn.546.t:0 "북쪽을 겨눈 군"
 tfrkphn.546.d:0 "국방부가 전후 군 재편을 마쳤다고 보고했습니다. 대만해협에서 이기고 돌아온 군대는 흩어지지 않았고, 편제를 거의 그대로 지킨 채 북쪽으로 돌아섰습니다.\n\n일손이 모자란다는 재계의 불만은 여전합니다. 대통령은 통일이 되는 날까지는 이 군대가 필요하다고 답했고, 그날이 오면 가장 먼저 군복을 벗길 사람들의 명단부터 만들어 두라고 지시했습니다."
 tfrkphn.546.a:0 "그날까지는 이대로 둔다"
