l_korean:
 # 이인제 정부 돌아오는 기업. uturn_build.py가 만든다.
 tfrkphn.483.t:0 "가끔 아빠도 회사에 가고 싶겠지"
 tfrkphn.483.d:0 "이정훈은 올해로 쉰둘이 되었다.\n\n공원 벤치에서 딸과 마주친 날로부터 다섯 해가 지났고, 그 사이 그는 대리운전을 하고 물류센터에서 상자를 나르다가 전쟁 중에는 탄약 공장에서 야간 검수를 했다. 그동안 명함에 부장이라고 적힌 적은 한 번도 없었다.\n\n면접은 인천항 부두에서 봤다. 쑤저우에서 십오 년 동안 세탁기 모터를 만들다가 전쟁이 나자 설비를 뜯어 돌아온 회사였는데, 야적장에는 컨테이너 마흔 개가 쌓여 있었다. 공장장이 그 가운데 하나를 열어 보이자 중국어 안내문이 그대로 붙은 기계가 나왔다.\n\n이정훈 씨, 공대 나오셨죠. 이 라인을 돌려 보신 분이 국내에 몇 없습니다.\n공장은 어디에 세웁니까.\n아직 모릅니다. 정부가 터를 정해 주기로 했습니다. 정해지면 바로 나오실 수 있습니까.\n어디든 나갑니다.\n\n부두를 나온 정훈은 주차장에 한참 서 있다가, 이제 대학생이 된 딸 서진에게 먼저 전화를 걸었다.\n\n아빠 취직했다.\n진짜? 어디?\n중국에서 돌아온 회사. 아빠가 옛날에 하던 일이야."
 tfrkphn.484.t:0 "두 달"
 tfrkphn.484.d:0 "경기도 시흥, 시화공단 끝자락의 금형 공장.\n\n공장 문 앞에 낯선 사람 셋이 서 있었다. 톈진의 전기차 배터리 공장에서 일하던 기술자들로, 마지막 여객선을 타고 나왔다고 했다. 그 가운데 한 사람이 가방에서 배터리 셀을 담는 케이스의 도면을 꺼냈다.\n\n\"설비는 다 두고 왔습니다. 도면하고 사람만 왔습니다. 금형부터 다시 파야 합니다.\"\n\n사장 김씨가 작업대에 펴 놓은 도면을 보니 공차가 머리카락 굵기의 십분의 일이었다. 옆에서 들여다보던 박 반장이 혀를 찼다.\n\n\"사장님, 이거 우리 기계로 됩니까?\"\n\n\"되게 해야지. 이 사람들은 공장 터도 아직 없대.\"\n\n기술자 하나가 톈진에서는 이 금형을 석 달 만에 받았다고 하자, 김씨는 벽에 걸린 달력을 한 번 쳐다보았다.\n\n\"두 달에 해 주겠소. 대신 시험 사출 때 와서 같이 보시오.\"\n\n기술자들이 돌아간 뒤 박 반장이 장갑을 벗었다.\n\n\"두 달이면 밤일입니다.\"\n\n\"삼겹살은 내가 사.\""
 tfrkphn.485.t:0 "칭다오발 전문"
 tfrkphn.485.d:0 "외교부 청사 9층, 동북아국 중국과. 박영환 국장의 책상에 전문 한 장이 올라왔다.\n\n§Y발신: 주칭다오 총영사관§!\n§Y제목: 관내 우리 기업 철수 동향§!\n\n1. 관내 조선 기자재 업체 한 곳이 오늘 재고와 인력을 싣고 출항함. 선박용 밸브와 펌프를 만드는 회사임.\n2. 이 회사의 거래처였던 조선소는 지난달부터 중국 해군 함정을 짓고 있음.\n3. 회사 대표는 이십 년 거래한 조선소 사장과 어제 마지막으로 통화했다고 함. 상대는 미안하다고 했다고 함.\n4. 국방부가 이 회사에 함정용 밸브와 펌프를 맡기려 한다는 말이 있음.\n5. 관내에 남은 우리 기업은 열한 곳임.\n\n박 국장은 전문을 덮었다. 서랍에는 1992년 수교 서명식 사진이 그대로 들어 있었지만 그는 꺼내 보지 않았고, 결재란에 서명한 다음 귀국 기업의 터를 산업부와 협의하라는 한 줄을 적어 넣었다.\n\n\"국장님, 남은 열한 곳은 어떻게 됩니까.\"\n\n\"돌아올 배편부터 알아봐.\""
 tfrkphn.486.t:0 "보훈회관 맞은편 빈 공장"
 tfrkphn.486.d:0 "§Y[지역신문]§! 광저우에서 돌아온 변속기 회사가 공장 터를 찾고 있다.\n\n광저우에서 자동차 변속기를 만들던 이 회사는 현지 합작사가 공장을 넘기라고 요구하자 금형만 빼내 홍콩을 거쳐 실어 왔고, 현지에서 뽑은 직원 가운데 서른 명이 회사를 따라왔다. 국방부가 이 회사에 장갑차 변속기를 맡길 계획이어서, 정부는 수도권과 지방 공단을 놓고 터를 고르는 중이다.\n\n후보지 가운데 한 곳이 경기도 어느 소도시의 보훈회관 맞은편에 칠 년째 비어 있는 공장이다. 회관에서 만난 박정수 할아버지는 맹호부대 출신이다.\n\n\"우리 때는 장갑차가 미제였지. 변속기가 나가면 부품이 배로 한 달 걸려 왔어. 여기서 만들면 좋지.\"\n\n6.25 학도병 출신인 김복동 할아버지는 창밖의 빈 공장을 한참 바라보다가 입을 열었다.\n\n\"공장 소리 나면 좋지. 와 다시 나는지는 생각하면 안 좋고.\""
 tfrkphn.487.t:0 "돌아온 공장이 만드는 것"
 tfrkphn.487.d:0 "영등포구, 정의당 중앙당 당사. 김서현은 이제 전화를 받는 대신 논평을 쓴다.\n\n§Y[논평 초안]§!\n선전에서 통신 장비를 조립하던 회사가 협력사 열두 곳과 함께 돌아온다. 환영한다. 일자리가 생긴다.\n그런데 국방부는 이 회사에 군용 통신 장비를 맡기려 한다. 올해 돌아온 공장 가운데 군수품을 만드는 곳이 벌써 여럿이다. 유럽은 징병제를 되살렸다. 이웃 나라들은 국방비를 올린다. 뉴스는 날마다 평화의 시대가 끝났다고 말한다.\n우리는 묻는다. 돌아온 일자리는 전쟁이 끝나면 어디로 가는가.\n\n사수가 초안을 읽고 물었다.\n\n\"환영한다는 말은 뺄까요?\"\n\n\"그건 둬요. 일자리는 일자리니까.\"\n\n서현이 저장 단추를 누르는데 전화벨이 울렸다. 이번에는 욕이 아니었고, 그 공장에 지원하려면 어디로 가야 하느냐는 문의였다."
 tfrkphn.488.t:0 "노란 테이프"
 tfrkphn.488.d:0 "서준은 졸업하고 두 해를 쉬었고, 형의 기일에는 해마다 광화문에 나갔다.\n\n채용 공고는 짧았다. 시안에서 돌아온 반도체 후공정 회사. 신입 엔지니어. 장비가 들어올 때까지 교육.\n\n장비가 들어오려면 이 년이 걸립니다. 수출 통제에 걸려 한 대도 못 가져왔습니다. 그동안은 빈 클린룸에서 교육만 받습니다. 괜찮겠습니까.\n괜찮습니다.\n이력서에 빈 기간이 있네요. 뭘 했습니까.\n\n서준은 말을 고르다가 결국 있는 그대로 말했다.\n\n집회에 나갔습니다. 형이 대만에서 죽었습니다.\n\n면접관은 펜을 내려놓고 시안에서 같이 일하던 중국인 동료 이야기를 했는데, 전쟁이 나던 날 그 동료가 공항까지 차를 태워 줬다는 것이었다.\n\n설비는 못 가져오고 사람만 왔습니다. 공장 터는 정부가 곧 정해 줍니다.\n\n방진복은 생각보다 가벼웠다. 임시 교육장 바닥에는 장비가 놓일 자리마다 노란 테이프가 붙어 있어서, 서준은 그 테이프를 따라 걸었다."
 TFRKPHN_ut_opt_cap:0 "수도권에 터를 내준다"
 TFRKPHN_ut_opt_reg:0 "지방 공단으로 보낸다"
 TFRKPHN_ut_cap_tt:0 "§Y일자리 대타협§! 탭의 일자리 §G+3만 개§!\n경영계의 신뢰 §G+3§!"
 TFRKPHN_ut_reg_tt:0 "§Y일자리 대타협§! 탭의 일자리 §G+2만 개§!\n경영계의 신뢰 §G+1§!"
 TFRKPHN_ut_civ_tt:0 "핵심 지역 한 곳에 §Y민간 공장§!이 하나 생깁니다."
 TFRKPHN_ut_mil_tt:0 "핵심 지역 한 곳에 §Y군수 공장§!이 하나 생깁니다.\n§Y북진통일 고토회복§! 탭의 육군 준비도가 오릅니다."
 TFRKPHN_ut_dock_tt:0 "바다에 닿은 핵심 지역 한 곳에 §Y조선소§!가 하나 생깁니다.\n§Y북진통일 고토회복§! 탭의 해군 준비도가 오릅니다."
 tfrkphn.489.t:0 "돌아온 기업 여섯 곳"
 tfrkphn.489.d:0 "중국에서 철수한 기업 여섯 곳이 모두 자리를 잡았습니다.\n\n세 곳은 예전에 만들던 것을 다시 만들고 두 곳은 군수품을 만들며, 나머지 한 곳은 조선소 옆에 자리를 잡았습니다. 산업부는 돌아오겠다는 문의가 스무 건 더 들어와 있다고 보고했습니다.\n\n돌아온 공장의 기계에는 아직 중국어 안내문이 붙어 있는데, 새로 뽑힌 직원들이 그 위에 한글 스티커를 하나씩 붙이고 있습니다."
 tfrkphn.489.a:0 "빈 공단이 다시 찬다"
 TFRKPHN_ut_focus_tt:0 "중국에서 철수한 기업이 §Y몇 달에 한 곳씩§! 돌아옵니다. 그때마다 어디에 받을지 정합니다.\n여섯 곳이 오고 §Y민간 공장 3§!, §Y군수 공장 2§!, §Y조선소 1§!이 생깁니다."
