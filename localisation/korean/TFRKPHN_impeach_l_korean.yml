 tfrkphn.7036.t:0 "신호등"
 tfrkphn.7036.d:0 "빨간불,파란불,그사이 짧게 지나가는 노란불.\n사람들은 출근길, 등교길 졸린 눈 비비며 선 신호등 앞에서 빨간불을 욕하고 파란불을 기다리지만 그사이 노란불은 아무도 관심가지지 않는다.\n\n지난 70년 한국사회도 마찬가지였다. 여,야 보수양당이 정권을 번갈아가며 차지할동안 그사이 소외받는 우리 사회의 수많은 약자들은 항상 뒤로 밀려나기만 해왔다.\n\n신자유주의 하에 서민들은 일생을 빼앗긴다.\n장애인들은 인간 이하의 대접을 받고, 노동자가 죽어가고, 여성과 성소수자들이 차별과 혐오에 신음하며, 지구가 불타오를 동안 \n이들은 항상 침묵을 강요당하거나 우리 사회의 아주 작은 부분만 차지해야 했다.\n\n그러나 대한민국 정치에 기반인 양당이 붕괴된 지금, 사람들은 노란불을 바라본다. 또다른 선택을 생각한다. 반만년 한반도 역사 이래 가장 소외받던 사람들이 권력에 중심에 가장 가까이 다가선다."
 tfrkphn.7036.a:0 "노란불이 켜졌다."
 tfrkphn.7037.t:0 "희망은 좋은거에요"
 tfrkphn.7037.d:0 "사회운동에 관심 많은 청년이자 정의당에서 작은 직책도 맞고있는 준우는 정의당에서 활동하며 여러번 선거를 치뤄봤지만 이런 광경은 난생 처음이였다.\n\n유세장소에는 새로 들어온 사람부터 처음 보는 사람들까지 거대양당 못지않은 수의 선거운동원들이 서있었다.\n유세차부터 거대 현수막, 비용만 수억원이 들어가는 이런 \"거대양당식 유세\"도 처음이였다. \n\n저기 처장님 돈을 얼마나 쓰신겁니까? \n\n아 운동원들이요? 알바 아입니다. 전부 지원해서 오신거에요 우리가 돈이 어디있겠습니까? 허허..\n\n네? 처음보는 분들도 많은데..\n\n아 저분들은 예전부터 당원이셨어요 그동안 안나오신거지. 알잖아요? 박근혜 탄핵때 정의당 반짝했던거,그때 입당하시고 활동은 안하시는.. 그분들 이번에 다 나오셨어요\n이번엔 진짜 되겠다. 이러니까\n\n준우는 직감적으로 알수있었다. 이번엔 정말 달랐다. 후보부터 말단 유세원까지, 눈빛에서부터 희망과 열정이 보였다.\n이번에는 정말 된다는 희망이."
 tfrkphn.7037.a:0 "저녘 늦게서야 끝난 선거운동에도 모두들 지친기색이 없었다."
 tfrkphn.7035.t:0 "정의당 지지율 29.5% ... \"역대 최고치\""
 tfrkphn.7035.d:0 "리얼미터가 지난 주 월요일(23일)부터 닷새간 전국 성인 2천5백여 명을 대상으로 실시한 조사 결과 정의당 지지율은 한 주 전보다 7.5% 포인트 오른 29.5%로 역대 최고치였습니다.\n\n정의당과 국민의당 등 제 3당이 급부상한 이유로는, 홍준표 대통령 탄핵안 이후 양당혐오 담론이 여론에 반영된 것으로 분석됐습니다.\n\n민주당은 12%, 국민의힘은 11.3%로 각각 3, 4위를 유지했고,\n4위에 이어 기타정당의 지지율도 14%에 육박하는 것으로 파악됐습니다."
 tfrkphn.7035.a:0 "이게 나라냐?"
