l_korean:
 # [안내] 탄핵 정국 (개입 패전 갈래). impeach_build.py가 만든다.
 TFRKPHN_impeach_category:0 "탄핵 정국"
 TFRKPHN_impeach_category_desc:0 "\n\n\n\n\n\n\n\n\n\n\n\n패전의 책임을 대통령에게 묻는 목소리가 국회에서 탄핵소추로 모이고 있습니다. 소추안이 가결되려면 재적 의원 3분의 2인 §Y200명§!의 찬성이 필요합니다.\n\n탄핵 찬성 예상: §R[?TFRKPHN_imp_yes|0]§!명 / 200명\n  처음부터 찬성하는 야당(민주당계, 진보정당): [?TFRKPHN_imp_opp|0]명\n  탄핵파(여당 이탈, 강경 보수, 무소속): §R[?TFRKPHN_imp_def|0]§!명\n\n탄핵파는 §Y14일§!마다 §R6명§!씩 늘어납니다. §Y책임회피§!나 §Y역공시도§! 중점을 마친 뒤 찬성이 §Y200명§!을 넘으면 소추안이 가결되고 §Y이인제 국무총리§!가 대통령 권한대행이 됩니다.\n\n---- §Y국회 원내 구성§! ----\n§3민주당계§!: [?KOR_NatAsm_DP_seats|0]석\n§A보수정당§!: [?KOR_NatAsm_PPP_seats|0]석\n§d진보정당§!: [?KOR_NatAsm_JP_seats|0]석\n§O제3지대§!: [?KOR_NatAsm_PP_seats|0]석\n§g무소속§!: [?KOR_NatAsm_Ind_seats|0]석\n§W우익 정당§!: [?KOR_NatAsm_ORP_seats|0]석"
 TFRKPHN_imp_opposition_moves:0 "여당 안의 동요"
 TFRKPHN_imp_opposition_moves_desc:0 "패전 뒤로 여당 의원들이 하나둘 대통령과 거리를 두고 있습니다. 지역구의 민심을 먼저 걱정하는 의원들은 탄핵소추에 이름을 올릴지 저울질하고 있습니다."
 TFRKPHN_imp_moves_tt:0 "탄핵파가 §R6명§! 늘어납니다."
 TFRKPHN_imp_start_tt:0 "§Y탄핵 정국§! 결정이 열립니다. 탄핵파가 §Y14일§!마다 §R6명§!씩 늘어납니다."
 tfrkphn.7020.t:0 "여당 안의 탄핵파"
 tfrkphn.7020.d:0 "여당 의원총회는 비공개로 열렸지만 고성은 문밖까지 새어 나왔다. 수도권에 지역구를 둔 초선 의원 몇이 먼저 일어섰다. 지역구 사무실에 전사자 유족이 찾아왔다는 사람도 있었고, 상가 셔터가 하나둘 내려가는 것을 매일 보고 있다는 사람도 있었다.\n\n그들은 탄핵소추안이 올라오면 자기 이름을 걸고 표결하겠다고 말했다. 반대하겠다는 말은 끝내 하지 않았다. 원내대표는 회의를 서둘러 끝냈다.\n\n다음 날 아침 신문들은 여당 안의 탄핵파라는 말을 처음으로 제목에 올렸다. 숫자는 아직 한 손으로 셀 만큼이었다. 그러나 그 숫자가 어디서 멈출지는 대통령실도 원내대표실도 알지 못했다.\n\n그날 밤 여당 원내대표실에는 의원들의 전화가 이어졌다. 대부분은 지역구 사정을 설명하는 전화였다. 다음 총선까지 남은 날짜를 세어 보는 의원도 있었다. 원내 수석부대표는 명단을 세 칸으로 나눴다. 찬성, 반대, 그리고 모름. 모름 칸이 가장 길었다.\n\n대통령실 정무수석은 그날 오후 의원회관을 돌았다. 문을 열어 주는 방은 지난주보다 적었다."
 tfrkphn.7020.a:0 "숫자는 아직 작다."
 tfrkphn.7021.t:0 "강경 보수의 이탈"
 tfrkphn.7021.d:0 "탄핵파가 나온 곳은 뜻밖이었다. 전쟁을 끝까지 밀어붙였어야 했다고 말해 온 강경 보수 쪽 의원들이었다. 그들의 셈법은 정반대였지만 결론은 같았다. 이길 수 있었던 전쟁을 진 대통령도, 이길 수 없는 전쟁에 들어간 대통령도 책임을 져야 한다는 것이다.\n\n광화문의 주말 집회에도 변화가 생겼다. 대통령을 지키자던 깃발 옆에 패전 책임자를 물러나게 하라는 손팻말이 섞여 들었다. 무대 위 연사들은 서로의 말을 끊었고 집회는 예정보다 일찍 끝났다.\n\n강경 보수 쪽 유튜브 채널들의 화면도 바뀌었다. 몇 달 전까지 대통령의 결단을 치켜세우던 진행자들이 이제는 패전의 책임자를 찾자는 제목을 걸었다. 구독자들의 댓글은 둘로 갈렸다. 대통령실은 그 방송들을 모니터링하는 직원을 따로 두었다. 보고서는 날마다 두꺼워졌고, 그 보고서를 끝까지 읽는 사람은 날마다 점점 줄었다.\n\n여당 지도부는 왼쪽과 오른쪽에서 동시에 흔들리고 있었다. 원내대표실의 칠판에는 찬반이 불분명한 의원 이름이 날마다 늘었고, 지워지는 이름은 없었다."
 tfrkphn.7021.a:0 "양쪽에서 무너진다."
 tfrkphn.7022.t:0 "이재명 의원의 비판"
 tfrkphn.7022.d:0 "민주당의 이재명 의원이 국회 소통관에서 기자회견을 열었다. 그는 참전 결정부터 패전 뒤 수습까지 정부의 판단을 하나씩 짚으며, 대통령이 국민과 국회에 진실을 말하지 않았다고 강하게 비판했다. 그리고 여당 의원들에게 당이 아니라 나라를 보고 표결에 나서 달라고 호소했다.\n\n회견은 짧았지만 파장은 길었다. 야당 지지층은 다시 거리로 모였고, 여당 안에서 망설이던 의원들은 지역구 여론조사 결과를 다시 들여다보았다.\n\n회견 다음 날 아침 민주당 지도부는 탄핵소추안 초안을 의원들에게 돌렸다. 초안에는 참전 결정의 절차와 패전 뒤 정보 공개를 문제 삼는 조항이 들어 있었다. 진보정당과 무소속 의원 몇도 서명에 이름을 올렸다. 서명란의 빈칸은 이제 손에 꼽을 만큼 남았다.\n\n여당 원내대표는 그 초안을 받아 들고 한참 동안 아무 말도 하지 않았다. 그리고 의원총회를 다시 소집했다.\n\n대통령실은 그날 저녁 짧은 입장문을 냈다. 국정 공백을 만드는 정치 공세라는 내용이었다. 입장문을 받아 든 기자들은 국회 본회의장의 의석표부터 다시 셌다."
 tfrkphn.7022.a:0 "의석표를 다시 센다."
 tfrkphn.7023.t:0 "탄핵소추안 가결"
 tfrkphn.7023.d:0 "본회의가 열리기 전부터 의장석은 여당 강경파 의원들이 차지하고 있었다. 그들은 의장석을 둘러싸고 팔짱을 낀 채 바닥에 앉았다. 표결을 막아야 한다는 것이었다. 의장은 정회를 거듭하다가 오전 11시를 넘겨 경호권을 발동했다.\n\n국회 경위들이 본회의장으로 들어왔다. 의원들은 한 사람씩 팔과 다리를 붙들려 끌려 나갔다. 고함과 몸싸움이 뒤엉켰고 넥타이가 풀리고 안경이 바닥에 떨어졌다. 끌려 나가던 한 의원은 이것이 의회냐고 소리쳤다. 방청석의 시민들은 일어선 채 그 장면을 내려다보았고, 몇은 고개를 돌렸다.\n\n표결이 시작되자 남은 여당 의원 몇은 의원석에 엎드려 울었다. 기표소로 걸어가는 의원들 뒤로 표결을 멈추라는 구호가 이어졌다. 투표함이 닫히고 개표가 끝날 때까지 본회의장의 누구도 자리에 앉지 못했다.\n\n찬성 [?TFRKPHN_imp_yes|0]표. 의장이 대통령 탄핵소추안의 가결을 선포하며 의사봉을 세 번 내리쳤다. 야당 의원석에서 박수가 터졌다. 그 순간 여당 의원석에서 명패와 구두가 의장석을 향해 날아들었고, 경위들이 다시 뛰어들었다."
 tfrkphn.7123.d:0 "소추의결서가 대통령실에 전달되자 대통령의 권한 행사는 멈췄다. 헌법에 따라 이인제 국무총리가 대통령 권한대행을 맡는다. 권한대행은 그날 밤 긴급 국무회의를 열고 군과 외교 라인에 흔들림 없이 맡은 일을 하라고 지시했다.\n\n그날 저녁 광화문에는 사람들이 모이기 시작했다. 대통령을 지지하던 사람들만이 아니었다. 전쟁에는 반대했지만 국회가 이렇게 대통령을 끌어내리는 것도 싫다는 사람들이 손에 촛불을 들었다. 방송사의 여론조사에서는 탄핵에 반대한다는 답이 처음으로 찬성을 앞질렀다.\n\n여당 당사에는 입당 원서가 몰려들었다. 탄핵을 이끈 야당의 지도부는 그날 밤 웃지 않았다. 당사 앞에는 탄핵을 규탄하는 손팻말이 붙었고, 지도부는 비상 회의를 열어 역풍을 막을 방법을 찾았다. 총선까지 남은 날짜를 세는 사람들이 이번에는 야당 쪽에 더 많았다.\n\n헌법재판소는 탄핵심판 사건을 접수했다. 심리가 끝날 때까지 대통령은 관저에 머물며 결정을 기다린다. 심판까지는 몇 달이 걸릴 것이고, 그 사이 나라는 권한대행 체제로 버텨야 한다."
 tfrkphn.7023.a:0 "권한대행 체제가 시작된다."
 tfrkphn.7024.t:0 "국민의힘 강경파의 탈당"
 tfrkphn.7024.d:0 "국회 소통관 단상에 국민의힘 의원 스물네 명이 줄지어 섰다. 전쟁을 끝까지 밀어붙였어야 했다고 말해 온 강경파 의원들이었다. 그들은 탈당계를 들어 보이며, 패전을 수습하는 당 지도부의 방식으로는 나라를 지킬 수 없다고 밝혔다.\n\n그들이 향한 곳은 원외에 머물던 우익 정당 우리공화당이었다. 우리공화당은 그날 오후 입당식을 열었다. 의원 스무 명을 넘긴 원외 정당이 하루아침에 원내 교섭단체가 된 것이다. 당 대표는 입당식에서 새 의원들에게 배지를 하나씩 달아 주었다.\n\n국민의힘 당사의 분위기는 무거웠다. 원내대표는 남은 의원들의 명단을 다시 받아 적었다. 여당의 의석은 하루 만에 스물네 석이 줄었다. 탄핵을 막을 표도, 법안을 넘길 표도 그만큼 사라졌다.\n\n광화문의 주말 집회에는 우리공화당의 깃발이 전보다 많아졌다. 집회 무대 위 연사들은 이번에는 서로의 말을 끊지 않았다. 대통령실 정무수석은 그 영상을 보다가 화면을 껐다.\n\n그날 밤 국회 사무처는 본회의장 의석 배치표를 새로 짰다. 스물네 개의 이름표가 오른쪽 끝으로 옮겨졌다."
 tfrkphn.7024.a:0 "당이 쪼개졌다."
 tfrkphn.7025.t:0 "여당 내의 배신"
 tfrkphn.7025.d:0 "총선을 앞두고 여당 지도부는 마지막 방어선을 쳤다. 탄핵소추안이 본회의에 올라와도 당론으로 반대하고, 표결에는 모두 참여해 반대표를 던지기로 했다. 의원총회에서 그 당론에 손을 든 의원은 과반을 훌쩍 넘었다. 원내대표는 회의가 끝난 뒤 이제 막았다고 말했다.\n\n표결은 무기명 비밀투표로 치러졌다. 의원들은 한 사람씩 기표소에 들어갔다가 나왔다. 여당 의원석은 거의 꽉 차 있었다. 원내 수석부대표는 투표함으로 걸어가는 의원들의 얼굴을 하나하나 눈으로 셌다.\n\n개표가 시작되자 본회의장이 조용해졌다. 찬성표가 예상한 숫자를 넘어서자 여당 의원석에서 술렁임이 일었다. 당론에 손을 들었던 의원들 가운데 적지 않은 수가 기표소 안에서 다른 선택을 한 것이다. 누가 그랬는지는 끝내 알 수 없었다. 야당 의원석에서는 숫자가 하나씩 불릴 때마다 낮은 탄성이 새어 나왔다. 반대표는 당론의 절반에도 미치지 못했다.\n\n원내대표는 개표 결과가 적힌 쪽지를 받아 들고 한참 동안 아무 말도 하지 않았다. 다음 총선의 공천표가 그의 머릿속을 스쳐 지나갔다."
 tfrkphn.7025.a:0 "반란표가 쏟아졌다."
 tfrkphn.7027.t:0 "무너진 양당"
 tfrkphn.7027.d:0 "탄핵 뒤 첫 대선 여론조사가 나왔다. 국민의힘은 패전의 책임을 고스란히 떠안았고, 민주당은 탄핵 역풍을 맞았다. 두 당의 지지율을 합쳐도 절반에 미치지 못했다. 지지하는 정당이 없다는 답이 처음으로 어느 한 당보다 많아졌다.\n\n빈자리를 먼저 노린 사람은 안철수였다. 2016년 국민의당을 만들어 총선에서 서른여덟 석을 얻었던 그는 패전 뒤 당 안에서 대통령의 책임을 가장 먼저 물은 사람이기도 했다. 정의당에서 두 차례 대선에 나섰던 심상정과 손을 잡을 수 있다는 관측이 나왔다. 중도 보수와 진보가 어디까지 함께 갈 수 있느냐는 물음이 바로 따라붙었다.\n\n오른쪽 끝에서는 조원진 대표의 우리공화당이 커졌다. 국민의힘을 떠난 의원들이 합류해 원내 교섭단체가 된 그 당은 패전을 항복이라 부르며 거리 집회를 키워 왔다. 대표의 지지율은 처음으로 두 자릿수에 닿았다.\n\n중앙선거관리위원회는 대통령 선거일을 공고했다. 남은 날은 70일이다. 두 거대 정당의 당사 앞에는 아직 후보를 정하지 못했다는 기자들의 중계 차량만 서 있었다."
 tfrkphn.7027.a:0 "양당의 시대가 끝나 간다."
 tfrkphn.7028.t:0 "단일화 성사"
 tfrkphn.7028.d:0 "협상은 마지막 날 새벽까지 이어졌다. 안철수 쪽과 심상정 쪽 실무자들은 국회 앞 한 호텔 방에서 정책 합의문을 한 줄씩 맞춰 나갔다. 재벌 개혁과 노동 정책에서 몇 번이나 판이 깨질 뻔했다. 그때마다 실무자들은 여론조사표를 다시 펼쳤다. 따로 나가면 둘 다 진다는 숫자였다.\n\n아침이 되자 두 사람이 함께 기자회견장에 섰다. 단일 후보는 여론조사 경선으로 정하고, 진 쪽은 공동선거대책위원장을 맡기로 했다. 경선 여론조사의 숫자는 오차 범위 안에서 갈리지 않았다. 마지막 결정은 두 사람의 회동에 맡겨졌다.\n\n제3지대 연합의 깃발 아래 중도 보수와 진보의 지지층이 한데 모이기 시작했다. 거대 양당에 실망한 표가 한쪽으로 흘러가는 모습이 다음 주 여론조사에 그대로 찍혔다. 우리공화당은 두 사람의 연합을 야합이라고 불렀다.\n\n국민의힘과 민주당의 선거대책위원회는 그날 오후 나란히 긴급 회의를 열었다. 두 당 모두 자기 지지층이 어디까지 빠져나갈지를 먼저 계산했다. 계산표의 숫자는 두 당 모두에게 좋지 않았다.\n\n선거까지는 25일이 남았다."
 tfrkphn.7028.ahn:0 "안철수가 단일 후보로 나선다."
 tfrkphn.7028.sim:0 "심상정이 단일 후보로 나선다."
 tfrkphn.7029.t:0 "단일화 결렬"
 tfrkphn.7029.d:0 "협상은 마지막 날 새벽에 깨졌다. 안철수 쪽과 심상정 쪽 실무자들은 국회 앞 한 호텔 방에서 정책 합의문을 맞추다가 재벌 개혁과 노동 정책에서 끝내 물러서지 않았다. 단일 후보를 정하는 방식을 두고도 서로의 셈법이 달랐다.\n\n아침에 두 캠프는 따로 기자회견을 열었다. 두 사람은 각자 끝까지 출마하겠다고 밝혔다. 같은 시간에 열린 두 회견이 모든 것을 말해 주었다. 거대 양당에 실망한 표는 두 갈래로 나뉘었다.\n\n그 틈을 파고든 것은 우리공화당이었다. 조원진 대표의 유세장은 날마다 커졌다. 패전의 책임을 묻는 분노와 탄핵에 대한 반발이 한곳으로 모였다. 다음 주 여론조사에서 우리공화당은 처음으로 1위에 올랐다. 두 거대 정당의 후보들은 그 뒤를 쫓았고, 갈라진 제3지대는 그보다 아래에 있었다.\n\n두 캠프의 실무자들은 그날 밤 각자의 사무실로 돌아가 선거 벽보 시안을 다시 꺼냈다. 함께 쓰려고 만들어 둔 연합의 이름은 끝내 인쇄소로 가지 못했다. 한 실무자는 그 시안을 접어 서랍에 넣었다.\n\n선거까지는 25일이 남았다."
 tfrkphn.7029.a:0 "표가 갈라졌다."
 tfrkphn.7030.t:0 "제3지대 연합의 승리"
 tfrkphn.7030.d:0 "개표 방송의 첫 숫자가 뜨자 연합 선거사무소에서 함성이 터졌다. 거대 양당의 후보는 처음부터 뒤처졌고, 우리공화당의 추격도 자정을 넘기며 꺾였다. 새벽 두 시, 방송사들은 안철수 후보의 당선이 확실하다고 보도했다.\n\n두 거대 정당이 아닌 후보가 대통령에 당선된 것은 이 나라에서 처음 있는 일이었다. 공동선거대책위원장을 맡았던 심상정은 당선인과 함께 단상에 올랐다. 지지자들은 두 사람의 이름을 번갈아 불렀다.\n\n당선인 앞에는 무거운 숙제가 쌓여 있다. 패전의 빚과 무너진 경제, 그리고 의석 대부분을 차지한 거대 양당의 국회다. 연합의 약속을 법으로 만들려면 국회부터 설득해야 한다.\n\n개표가 끝난 아침, 여의도의 두 거대 정당 당사는 조용했다. 두 당의 대표는 나란히 사퇴 의사를 밝혔다. 이 나라 정치를 수십 년 동안 나눠 가졌던 두 당이 같은 날 함께 무너진 것이다. 당직자들은 짐을 싸기 시작했다.\n\n권한대행을 맡아 온 이인제 국무총리는 그날 아침 당선인에게 축하 전화를 걸었다. 정권 인수위원회는 다음 날 꾸려진다."
 tfrkphn.7030.a:0 "새 대통령이 취임한다."
 tfrkphn.7031.t:0 "우리공화당의 승리"
 tfrkphn.7031.d:0 "개표 방송의 첫 숫자가 뜰 때부터 우리공화당 후보가 앞섰다. 갈라진 제3지대와 두 거대 정당의 후보가 표를 나눠 가지는 사이 그 격차는 끝까지 좁혀지지 않았다. 자정이 조금 지나 방송사들은 조원진 후보의 당선이 확실하다고 보도했다.\n\n원외 정당에서 출발한 우리공화당이 대통령을 배출한 것은 누구도 예상하지 못한 일이었다. 당사 앞에는 태극기를 든 지지자들이 밤새 모여 있었다. 다른 쪽 광장에는 결과를 받아들이기 어렵다는 사람들이 촛불을 들었다.\n\n외신들은 패전과 탄핵을 거친 한국이 오른쪽 끝을 골랐다고 썼다. 브뤼셀과 도쿄의 외교 라인은 새 정부의 대외 정책을 묻는 전화를 서울로 돌렸다. 시장은 크게 흔들렸다.\n\n개표가 끝난 아침, 여의도의 두 거대 정당 당사는 조용했다. 두 당의 대표는 나란히 사퇴 의사를 밝혔다. 제3지대의 두 캠프는 따로 성명을 냈다. 합쳤다면 달랐을 것이라는 계산은 소용이 없었다.\n\n권한대행을 맡아 온 이인제 국무총리는 그날 아침 당선인에게 축하 전화를 걸었다. 정권 인수위원회는 다음 날 꾸려진다."
 tfrkphn.7031.a:0 "새 대통령이 취임한다."
 tfrkphn.7032.t:0 "사실상 4파전"
 tfrkphn.7032.d:0 "후보 등록이 끝났다. 국민의힘과 민주당도 후보를 냈지만, 그 이름을 기억하는 사람은 많지 않았다. 두 당의 유세장에는 당직자와 기자 몇 사람뿐이었고, 방송사 중계 차량은 일찍 자리를 떴다. 여론조사표의 두 칸은 날마다 줄어들었다.\n\n사람들의 눈은 다른 곳에 가 있었다. 안철수의 유세장에는 중도층과 수도권 직장인들이 모였고, 심상정의 유세장에는 노동조합 깃발과 청년들이 섞였다. 둘은 아직 단일화 협상 중이었지만 유세장에서는 서로를 공격하지 않았다.\n\n조원진 대표의 우리공화당 유세장은 가장 시끄러웠다. 태극기를 든 지지자들이 광장을 메웠고, 패전과 탄핵에 분노한 사람들이 하나둘 그 줄에 섰다. 그 줄은 날마다 길어졌다.\n\n첫 TV 토론회는 안철수, 심상정, 조원진 세 사람의 싸움이었다. 다른 두 연단에 선 후보들에게 돌아간 질문은 손에 꼽을 만큼이었다. 방송이 끝난 뒤 인터넷에 오른 장면 가운데 두 거대 정당 후보가 나온 것은 거의 없었다.\n\n전문가들은 제3지대의 단일화를 승부처로 꼽았다. 단일화 협상의 시한까지는 20일이 남았다."
 tfrkphn.7032.a:0 "두 거대 정당의 연단은 조용했다."
 tfrkphn.7034.t:0 "제3지대 연합의 승리"
 tfrkphn.7034.d:0 "개표 방송의 첫 숫자가 뜨자 연합 선거사무소에서 함성이 터졌다. 거대 양당의 후보는 처음부터 뒤처졌고, 우리공화당의 추격도 자정을 넘기며 꺾였다. 새벽 두 시, 방송사들은 심상정 후보의 당선이 확실하다고 보도했다.\n\n진보 정당 출신 대통령은 이 나라에서 처음이었다. 공동선거대책위원장을 맡았던 안철수는 당선인과 함께 단상에 올랐다. 중도 보수와 진보가 한 무대에 선 장면을 두고 외신들은 독일식 연정을 떠올렸다. 지지자들은 두 사람의 이름을 번갈아 불렀고, 광장의 깃발은 노란색과 주황색이 섞여 있었다.\n\n당선인 앞에는 무거운 숙제가 쌓여 있다. 패전의 빚과 무너진 경제, 그리고 의석 대부분을 차지한 거대 양당의 국회다. 정의당의 의석만으로는 법 하나도 넘길 수 없다. 개혁을 하려면 민주당의 손을 잡아야 하고, 연합을 지키려면 안철수의 손도 놓을 수 없다.\n\n개표가 끝난 아침, 여의도의 두 거대 정당 당사는 조용했다. 권한대행을 맡아 온 이인제 국무총리는 그날 아침 당선인에게 축하 전화를 걸었다. 정권 인수위원회는 다음 날 꾸려진다."
 tfrkphn.7034.a:0 "새 대통령이 취임한다."
 tfrkphn.7038.t:0 "여름이 끝나간다"
 tfrkphn.7038.d:0 "올여름은 그 어느 때보다 뜨거웠다. 미국의 붕괴, 대만의 멸망, 대통령의 탄핵. 이 모든 일이 한 여름 안에 일어났다.\n\n적은 안에 있다. 민주당이 대만은 우리와 별개라고 말할 때부터 알아봤다. 대통령이 더 강하게 맞서지 않을 때부터 알아봤다. 이 나라의 적은 기득권이다. 모든 것이 안에 있는 적 때문이다.\n\n스무 살 남짓의 청년 김창수는 그렇게 생각한다. 이 나라를 바꾸려면 거대한 변화가 와야 한다고. 처음에 그는 탄핵에 분노했다. 국회가 대통령을 끌어내리는 장면을 보며 주먹을 쥐었다. 그러나 어느 순간부터 그 분노는 정치 전체에 대한 혐오로 바뀌었다. 여당도 야당도, 단일화를 하겠다던 제3지대도 그의 눈에는 같은 사람들이었다.\n\n그가 처음 우리공화당 집회에 나간 것은 친구를 따라서였다. 거기서 그는 자기와 같은 말을 하는 사람들을 만났다. 연단 위의 연설은 그가 하고 싶던 말을 대신해 주었다.\n\n그는 오늘도 광화문에서 태극기를 흔든다. 집회가 끝나고 해가 져도 그는 한동안 광장을 떠나지 않는다."
 tfrkphn.7038.a:0 "난 답장을 기다리네"
 tfrkphn.7039.t:0 "안녕 영원히"
 tfrkphn.7039.d:0 "국회의사당 앞마당에 태극기가 끝없이 물결쳤다. 제21대 대통령 취임식이었다. 군악대의 연주가 끝나자 조원진 당선인이 단상에 올라 취임 선서를 했다. 선서의 문장은 역대 대통령들이 읽었던 것과 한 글자도 다르지 않았다.\n\n취임사에서 새 대통령은 기득권을 모두 청산하고 패전의 책임자들을 끝까지 찾아내겠다고 약속했다. 앞자리의 지지자들은 그 대목마다 일어나 환호했다. 귀빈석에 앉은 두 거대 정당의 대표들은 끝까지 박수를 치지 않았다.\n\n광장 한쪽에서 김창수는 깃발을 높이 들었다. 그는 이 나라가 드디어 바뀐다고 믿었다.\n\n아무도 총을 들지 않았다. 아무도 탱크를 몰고 오지 않았다. 국민은 투표소에 줄을 서서 한 표씩 넣었고, 선관위는 개표를 마쳤으며, 헌법이 정한 절차는 하나도 어긋나지 않았다. 민주주의는 그렇게 스스로 죽음을 택했다. 마지막 순간까지 그것은 아름답고 순수했다. 광장에서 깃발을 흔드는 저 청년처럼.\n\n취임식이 끝난 뒤에도 광장의 깃발은 해가 질 때까지 내려가지 않았다. 국회의사당의 불은 그날 밤 일찍 꺼졌다."
 tfrkphn.7039.a:0 "이보다 더 슬픈 말은 없으니"
 tfrkphn.7040.t:0 "해산 명령"
 tfrkphn.7040.d:0 "취임 반년 만에 대통령과 국회는 더 이상 같은 나라를 보지 않았다. 우리공화당의 의석은 서른 석이 안 됐고, 대통령이 내놓은 법안은 하나도 본회의를 넘지 못했다. 국회는 정부의 예산안을 통째로 깎았고, 대통령은 거부권으로 맞섰다.\n\n그날 밤 대통령실은 국회를 해산하고 새 헌법을 국민투표에 부치겠다는 대통령 긴급명령을 발표했다. 새 헌법이 통과될 때까지 대통령령이 법률을 대신한다고 했다. 헌법 어디에도 대통령이 국회를 해산할 수 있다는 조항은 없었다.\n\n명령이 발표되자 장관 두 사람이 그 자리에서 사표를 냈다. 대통령실은 사표를 받지 않았다. 국회 사무처는 의원회관의 불을 모두 켜고 정문을 닫았다. 정문 밖에는 이미 경찰 버스가 와 있었다.\n\n국무총리실은 밤새 아무 말도 하지 않았다. 국방부 장관은 군은 정치적 중립을 지킨다는 한 줄짜리 입장을 냈다. 국회도 대통령실도 그 한 줄을 자기 편이라고 읽었다. 방송국 앞에도 경찰이 섰다.\n\n그날 밤 여의도로 가는 길목마다 경찰 버스가 늘어섰다. 한강 다리 위로는 밤새 헬기 소리가 오갔다."
 tfrkphn.7041.t:0 "여의도의 포성"
 tfrkphn.7041.d:0 "봉쇄는 열하루 동안 이어졌다. 국회의사당의 전기와 전화가 끊겼고, 의원들과 보좌진 수백 명이 촛불을 켜고 본회의장을 지켰다. 담장 밖에는 국회를 지키겠다는 시민들과 대통령을 지지하는 태극기 행렬이 마주 섰다.\n\n열이틀째 새벽, 대통령의 명령을 따르기로 한 부대의 전차가 여의도로 들어왔다. 첫 포탄은 국회의사당의 돔에 떨어졌다. 검은 연기가 한강 위로 올라갔고, 생중계 화면은 그 장면을 온 나라에 내보냈다. 오후가 되자 본회의장에 남아 있던 사람들이 손을 들고 걸어 나왔다.\n\n국회의장과 원내대표들은 그 자리에서 체포됐다. 사망자의 숫자는 발표마다 달랐다. 정부는 질서가 회복됐다고 발표했다.\n\n국회 사무처의 한 직원은 봉쇄 첫날부터 본회의장의 일지를 손으로 적었다. 일지의 마지막 줄에는 첫 포탄이 떨어진 시각만 적혀 있었다. 그 일지는 몇 해 뒤에야 세상에 나왔다.\n\n두 달 뒤 새 헌법이 국민투표에 부쳐졌다. 대통령은 국회를 해산할 수 있고, 국회는 대통령을 탄핵하기 어려워졌다. 투표율은 낮았지만 헌법은 통과됐다."
 tfrkphn.7041.a:0 "돔에서 연기가 올라간다."
 tfrkphn.7042.t:0 "물러선 대통령"
 tfrkphn.7042.d:0 "명령이 내려진 밤, 전차 수십 대가 여의도로 들어왔다. 그러나 국회 앞에는 이미 시민들이 버스와 화분, 철제 펜스로 바리케이드를 쌓고 있었다. 밤새 비가 내렸고, 사람들은 우비를 입은 채 전차 앞에 앉았다.\n\n새벽에 우원식 국회의장이 의사당 계단을 내려와 맨 앞 전차 위로 올라섰다. 그는 손에 든 종이를 읽었다. 긴급명령은 헌법에 없는 명령이니 따르지 말라는 내용이었다. 그 장면은 해외 방송을 타고 세계로 나갔다.\n\n둘째 날, 한 전차 부대의 포탑이 국회 반대쪽으로 돌아갔다. 부대장은 시민에게 포를 겨누지 않겠다고 밝혔다. 다른 부대들도 하나둘 움직이지 않았다. 셋째 날 새벽, 대통령실은 긴급명령을 거둬들였다. 사흘 만이었다.\n\n탄핵소추안은 다시 헌법재판소로 넘어갔다. 대통령은 자리에 남았지만 그의 명령을 따를 부대는 더 이상 없었다. 우리공화당 지지자들은 광장에서 배신이라고 외쳤다.\n\n전차 위에 선 사람과 그 아래 모인 시민들. 그 사진은 다음 날 모든 신문 1면에 실렸다. 다만 이번에 전차 위에 선 사람은 대통령이 아니었다."
 tfrkphn.7042.a:0 "탱크는 돌아섰다."
 tfrkphn.7043.t:0 "파면"
 tfrkphn.7043.d:0 "헌법재판소의 선고는 오전 11시에 시작됐다. 재판관들은 긴급명령이 헌법에 없는 권한이었고, 국회를 향해 전차를 보낸 것은 헌법 질서를 무너뜨린 일이라고 밝혔다. 주문은 짧았다. 피청구인 대통령 조원진을 파면한다.\n\n선고가 끝나자 헌법재판소 앞에 모여 있던 사람들 사이에서 함성과 울음이 함께 터졌다. 광화문에서는 우리공화당 지지자들이 깃발을 내리지 않은 채 오래 서 있었다.\n\n이인제 국무총리가 다시 대통령 권한대행을 맡았다. 한 해 사이에 두 번째였다. 권한대행은 그날 오후 국무회의를 열고 60일 안에 대통령 선거를 치르겠다고 발표했다.\n\n정치권의 눈은 한 사람에게 모였다. 전차 위에서 긴급명령을 따르지 말라고 읽었던 우원식 국회의장이었다. 국회의장은 당적을 가질 수 없다. 양당도 제3지대도 아닌 사람이 이 나라에 남아 있었다. 사흘 뒤 그는 의장직을 내려놓고 무소속으로 출마하겠다고 밝혔다.\n\n여의도의 전차 자국은 아직 아스팔트에 남아 있었다. 국회의사당 앞 바리케이드를 치우는 일은 그 주 내내 이어졌다."
 tfrkphn.7043.a:0 "헌법이 이겼다."
 tfrkphn.7044.t:0 "전차 위에 섰던 사람"
 tfrkphn.7044.d:0 "개표 방송의 첫 숫자부터 무소속 우원식 후보가 앞섰다. 그를 지지한 것은 한 정당이 아니었다. 무너진 양당의 지지자들, 단일화에 실패했던 제3지대의 두 캠프, 그리고 그 사흘 동안 여의도의 비를 맞으며 바리케이드를 지켰던 사람들이었다. 자정을 조금 넘겨 방송사들은 그의 당선이 확실하다고 보도했다.\n\n이 나라에서 무소속 대통령은 처음이었다. 그는 당선 소감에서 몇 가지를 약속했다. 정부의 회의록을 모두 공개하고, 군을 정치에서 영원히 떼어 놓으며, 북쪽과 이웃 나라들을 적이 아니라 대화의 상대로 보겠다는 것이었다. 낡은 질서를 고쳐 쓰지 않고 새로 짜겠다는 그의 말을 두고, 사람들은 그 이상이 이 나라에 너무 이른 것은 아닌지 걱정했다.\n\n당선인 사무실에는 그날 전차 위에서 찍힌 사진이 걸려 있었다. 사무실을 찾은 사람들은 그 사진 앞에서 한참씩 머물렀다.\n\n권한대행을 맡아 온 이인제 국무총리는 그날 아침 당선인에게 축하 전화를 걸었다. 새 정부의 첫 숙제는 갈라진 국회를 다시 한자리에 모으는 일이었다."
 tfrkphn.7044.a:0 "새 대통령이 취임한다."
 tfrkphn.7045.t:0 "모두 엎드려"
 tfrkphn.7045.d:0 "저녁 6시 반, 국회는 군의 정치 개입을 금지하는 법안을 표결하고 있었다. 그때 본회의장 문이 열리고 무장한 병력이 들이닥쳤다. 앞장선 장교가 권총을 들고 모두 엎드리라고 소리쳤다. 천장을 향해 총성이 울렸다.\n\n의원들은 책상 아래로 몸을 숨겼다. 엎드리지 않은 사람은 몇 되지 않았다. 국무총리는 자리에 그대로 앉아 있었다. 군 출신의 노장 국방부 장관은 자리에서 일어나 장교에게 다가가 물러나라고 명령했다. 병사들은 그를 거칠게 밀쳐 냈다.\n\n같은 시각 지방의 한 군단에서 전차가 도시로 나왔다는 보고가 들어왔다. 본회의장의 의원 삼백 명은 인질이 됐다. 방송국 한 곳의 카메라는 꺼지지 않고 그 장면을 계속 내보냈다.\n\n새벽 1시, 대통령이 텔레비전 화면에 나타났다. 그는 헌법을 거스르는 어떤 명령도 따르지 말라고 군에 명령했다. 이튿날 오후, 지방의 전차들은 부대로 돌아갔고 본회의장의 병력은 무기를 내려놓았다.\n\n사람들은 그날 밤의 총성을 오래 기억했다. 그날 이후 군복을 입은 사람이 국회의 문을 여는 일은 다시 없었다."
 tfrkphn.7045.a:0 "총성은 멎었다."
 tfrkphn.7046.t:0 "단 한 명의 후보"
 tfrkphn.7046.d:0 "후보 등록이 마감됐다. 파면된 대통령의 뒤를 잇겠다는 사람은 하나가 아니었다. 황교안 전 국무총리, 한국사 강사 출신의 전한길, 전광훈 목사, 황보승희 전 의원, 그 밖에도 여럿이 저마다 자기가 진짜 계승자라며 이름을 올렸다. 투표용지의 아래쪽은 그들의 이름으로 빼곡했다.\n\n광화문의 주말 집회는 여러 갈래로 나뉘었다. 같은 광장에 서로 다른 무대가 섰고, 같은 태극기를 든 사람들이 서로 다른 이름을 외쳤다. 지지자들은 누구에게 표를 줘야 할지 몰랐다.\n\n반대편의 풍경은 정반대였다. 민주당, 국민의힘, 제3지대 연합, 정의당이 일제히 후보를 내지 않기로 결정했다. 각 당의 대표들은 같은 날 우원식 후보에게 지지 선언을 보냈다. 지난 몇 해 동안 한 번도 같은 편에 선 적 없던 이름들이 한 장의 선언문 아래 나란히 적혔다.\n\n우원식은 지지 선언을 고맙게 받겠다고 하면서도, 어느 당의 공약도 대신 내걸지는 않겠다고 밝혔다. 그의 공약은 하나였다. 헌법을 지키는 것.\n\n여론조사 회사들은 그 주에 조사를 멈췄다. 숫자를 낼 필요가 없었다."
 tfrkphn.7046.a:0 "헌법 편에 선 단 한 명."
 tfrkphn.7054.t:0 "국회의장 담화"
 tfrkphn.7054.d:0 "긴급명령이 발표되고 한 시간쯤 지나, 국회 방송 화면에 우원식 국회의장이 나타났다.\n\n국민 여러분. 우원식 국회의장입니다.\n대통령의 긴급명령 발표에 대해 국회는 헌법적 절차에 따라 대응 조치하겠습니다.\n국민 여러분께서는 국회를 믿고 차분하게 상황을 주시해주시기 바랍니다.\n모든 국회의원께서는 지금 즉시 국회 본회의장으로 모여주시기 바랍니다.\n특별히 군경은 동요하지 말고 자리를 지켜줄 것을 당부드립니다.\n\n다시 한 번 말씀드리겠습니다.\n\n국민 여러분. 우원식 국회의장입니다.\n대통령의 긴급명령 발표에 따라 국회는 헌법적 절차에 따라 대응 조치하겠습니다.\n국민 여러분께서는 국회를 믿고 차분하게 상황을 주시해주시기 바랍니다.\n모든 국회의원께서는 지금 즉시 국회 본회의장으로 모여주시기 바랍니다.\n특별히 군경은 동요하지 말고 자리를 지켜줄 것을 당부드립니다.\n\n이상입니다.\n\n의원들은 막힌 정문 대신 담을 넘어 본회의장으로 들어갔다. 새벽 1시, 본회의는 긴급명령 무효 결의안과 대통령 탄핵소추안을 함께 가결했다. 대통령이 둘이 될지도 모르는 밤이었다."
 tfrkphn.7054.a:0 "국회를 봉쇄한다."
 tfrkphn.7054.b:0 "전차를 보내 압박만 한다."
 TFRKPHN_e21_alliance:0 "제3지대 연합"
 TFRKPHN_e21_alliance_long:0 "제3지대 연합"
 TFRKPHN_e21_category:0 "제3지대 협상"
 TFRKPHN_e21_category_desc:0 "안철수와 심상정이 단일화를 놓고 협상하고 있습니다. 권한대행 정부는 오른쪽 끝의 집권을 막기 위해 협상을 뒤에서 돕기로 했습니다.\n\n협상 진척도: §Y[?TFRKPHN_e21_uni|0]§! / 100\n\n시한이 끝날 때 §Y50§! 이상이면 §Y제3지대 연합§!이 하나의 후보로 나섭니다. 모자라면 두 사람이 각자 출마하고, 갈라진 표 사이로 §R우리공화당§!이 이깁니다."
 TFRKPHN_e21_deadline:0 "단일화 협상 시한"
 TFRKPHN_e21_deadline_desc:0 "선거까지 25일을 남기고 협상의 문이 닫힙니다."
 TFRKPHN_e21_deadline_tt:0 "협상 진척도가 §Y50§! 이상이면 단일화가 성사되고, 모자라면 결렬됩니다."
 TFRKPHN_e21_ahn:0 "안철수 쪽 설득"
 TFRKPHN_e21_ahn_desc:0 "안철수 캠프에 사람을 보내 단일 후보 결정 방식에서 한발 물러서도록 설득합니다."
 TFRKPHN_e21_sim:0 "심상정 쪽 설득"
 TFRKPHN_e21_sim_desc:0 "심상정 캠프에 사람을 보내 노동 정책 합의에서 접점을 찾도록 설득합니다."
 TFRKPHN_e21_policy:0 "정책 합의문 중재"
 TFRKPHN_e21_policy_desc:0 "재벌 개혁과 노동 정책을 두고 갈라진 두 캠프 사이에서 정부 실무자들이 합의문 문구를 중재합니다."
 TFRKPHN_e21_meet:0 "두 사람의 회동 주선"
 TFRKPHN_e21_meet_desc:0 "권한대행이 두 후보를 비공개로 한자리에 불러 마주 앉게 합니다."
 TFRKPHN_e21_up10_tt:0 "협상 진척도 §G+10§!"
 TFRKPHN_e21_up15_tt:0 "협상 진척도 §G+15§!"
 TFRKPHN_e21_uni_tt:0 "§Y제3지대 협상§! 결정이 열립니다. 협상 진척도는 §Y20§!에서 시작합니다(철수의 공세를 골랐으면 §G+20§!, 종북을 막아라를 골랐으면 §R-20§!). §Y35일§! 뒤 §Y50§! 이상이면 단일화가 성사되고, 모자라면 §R우리공화당§!이 대선에서 이깁니다."
 TFRKPHN_e21_ahn_tt:0 "§Y안철수§!가 대통령이 되고 §Y제3지대 연합§!이 집권합니다."
