 tfrkphn.346.desc:0 "개표가 끝난 새벽, 오세훈의 당선이 확정되었다. 그는 수도권과 충청에서 고르게 이겼고, 스스로 중도라고 답한 유권자의 표가 승부를 갈랐다. 여당 지도부는 축하 성명을 냈지만 강경파 의원 몇몇은 그날 국회에 나오지 않았다.\n\n취임식 날, 그는 국회 앞마당에서 오른손을 들고 헌법 선서를 했다. 그는 가장 약한 사람들의 이야기로 취임사를 시작했다. 서울시장 시절부터 써 온 말들이 이번에는 나라 전체를 향했다.\n\n보수 정권은 이어지고, 대통령은 바뀐다. 같은 당에서 나온 대통령이지만 그가 걷는 길은 전임자와 달랐다."
 tfrkphn.246.next:0 "이어서 본다"
