l_korean:
 TFRKPHN_sl_category:0 "서울런 확대"
 TFRKPHN_sl_category_desc:0 "서울런은 2021년 8월 서울시가 형편이 어려운 학생들에게 온라인 강의를 무료로 열어 준 사업입니다. 2026년 5월 가입자가 4만 명을 넘었습니다. 이제 그 문을 나라 전체로 넓힙니다.\n\n지금 수강생: §Y[?TFRKPHN_sl|0]만 명§! / 50만 명\n수강생 만 명마다 §G연구 속도§!가 0.1퍼센트 오르고, §G빈곤 개선§!과 §G사회 발전§!이 달마다 조금씩 빨라집니다. 지금 연구 속도 §G[?TFRKPHN_sl_rspct|1]퍼센트§! (졸업식 몫 포함)"
 TFRKPHN_sl_open:0 "서울런 전국 개방"
 TFRKPHN_sl_open_desc:0 "서울 학생에게만 열려 있던 서울런을 전국의 형편이 어려운 학생에게 엽니다. 한 번만 할 수 있습니다."
 TFRKPHN_sl_open_tt:0 "60일 뒤 수강생이 §G10만 명§! 늘어납니다."
 TFRKPHN_sl_teach:0 "강사진 넓히기"
 TFRKPHN_sl_teach_desc:0 "이름난 강사들의 강의를 더 사들이고, 과목을 늘립니다."
 TFRKPHN_sl_teach_tt:0 "60일 뒤 수강생이 §G3만 명§! 늘어납니다."
 TFRKPHN_sl_device:0 "태블릿과 데이터 지원"
 TFRKPHN_sl_device_desc:0 "공부할 기기와 데이터가 없는 집에 태블릿과 통신비를 대 줍니다. 90일 동안 §Y민수공장 1개§!가 묶입니다."
 TFRKPHN_sl_device_tt:0 "90일 뒤 수강생이 §G5만 명§! 늘어납니다."
 TFRKPHN_sl_mega:0 "메가시티 학습 거점"
 TFRKPHN_sl_mega_desc:0 "메가시티 권역마다 학습 거점을 두어 공부방과 상담 선생님을 붙입니다. §Y3단계§!를 넘은 메가시티 권역이 하나라도 있어야 할 수 있습니다. 120일 동안 §Y민수공장 1개§!가 묶입니다."
 TFRKPHN_sl_mega_tt:0 "120일 뒤 수강생이 §G2만 명§!에 3단계를 넘은 메가시티 권역마다 §G1만 명§!씩 더 늘어납니다 (최대 §G7만 명§!)."
 TFRKPHN_sl_mentor:0 "대학생 멘토단"
 TFRKPHN_sl_mentor_desc:0 "대학생 멘토가 수강생의 공부를 봐 줍니다. 수강생이 §Y15만 명§!을 넘어야 할 수 있습니다."
 TFRKPHN_sl_mentor_tt:0 "60일 뒤 수강생이 §G2만 명§! 늘어납니다."
 TFRKPHN_slearn:0 "서울런"
 TFRKPHN_slearn_desc:0 "형편이 어려운 학생들이 무료 온라인 강의로 공부합니다. 수강생이 늘수록 연구가 빨라지고, 빈곤이 줄고, 사회가 발전합니다."
 TFRKPHN_oh_c1_sl_tt:0 "§Y빈곤 개선§! §G+10퍼센트§!\n결정 탭 §Y서울런 확대§!가 열립니다 (수강생 4만 명에서 시작)."
 tfrkphn.6794.t:0 "서울런 50만 명"
 tfrkphn.6794.d:0 "서울런 수강생이 50만 명을 넘었습니다. 2021년 8월 서울에서 시작한 해의 가입자는 9천 명 남짓이었고, 2026년 5월에야 4만 명을 넘었습니다. 전국으로 문을 연 뒤 몇 해 만에 열 배가 넘게 늘었습니다.\n\n서울에서 이미 성과가 있었습니다. 서울런으로 공부해 대학에 붙은 학생은 2023학년도 462명에서 2026학년도 914명으로 늘었습니다. 올해 합격자 명단에는 섬마을과 산골 학교 이름이 처음으로 여럿 올랐습니다.\n\n대통령은 축하 자리에서 학원에 갈 형편이 안 되는 아이도 같은 강의를 듣게 하는 것이 약자와의 동행이라고 말했습니다."
 tfrkphn.6794.a:0 "배움에 문턱이 없게 합니다."
 TFRKPHN_sl_t1:0 "SLU 졸업식"
 TFRKPHN_sl_lq:0 "질문"
 TFRKPHN_sl_lp:0 "연습"
 TFRKPHN_sl_lg:0 "성장"
 TFRKPHN_sl_bq_tt:0 "§Y질문§!: 서울런이 어떤 사업인지 봅니다."
 TFRKPHN_sl_bp_tt:0 "§Y연습§!: 진짜 문제 하나를 풀어 봅니다. 효과는 없습니다."
 TFRKPHN_sl_bg_tt:0 "§Y성장§!: 지금까지의 성장 기록을 봅니다."
 TFRKPHN_sl_t2:0 "서울런으로 공부한 학생들이 대학에 붙고 일자리를 얻었습니다. 수강생이 10만 명 늘 때마다 문장을 눌러 졸업식을 엽니다."
 TFRKPHN_sl_t3:0 "지금까지 §Y[?TFRKPHN_sl_claim|0]§!번 / 5번"
 TFRKPHN_sl_ready:0 "§G문장을 눌러 졸업식을 엽니다§!"
 TFRKPHN_sl_wait:0 "다음 졸업식: 수강생 §Y[?TFRKPHN_sl_next|0]만 명§!을 넘으면"
 TFRKPHN_sl_btn_tt:0 "§YSLU 졸업식§!\n누를 때마다 §Y연구 속도§! §G+4퍼센트§! (계속), 정치력 §G+30§!, §Y사회 발전§! §G+3퍼센트§!\n수강생이 10만 명 늘 때마다 한 번, 모두 다섯 번 열 수 있습니다."
