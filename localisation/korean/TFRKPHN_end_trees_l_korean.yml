l_korean:
 # [안내] 우리공화당 엔딩 두 벌의 중점과 무너짐 사건. end_trees.py가 만든다.
 tfrkphn.7277.t:0 "발포 명령은 없다"
 tfrkphn.7277.d:0 "시위 첫날 저녁 경찰이 쏜 최루탄에 고등학생 한 명이 숨졌다. 학생은 학원 가방을 멘 채 시청 앞 지하도 입구에 쓰러져 있었다. 그 사진은 밤사이 전화기에서 전화기로 건너갔고, 이튿날 아침 광장의 사람은 두 배로 늘었다. 학생의 어머니는 영안실 앞에서 하루를 앉아 있었다.\n\n내무부 장관은 발포 명령서 초안을 들고 대통령 집무실에 들어왔다. 계엄 사령관으로 지명된 육군 참모총장이 그 뒤를 따랐다. 참모총장은 명령서가 내려오면 따르겠다고 말하지 않았다. 그는 군이 시민에게 총을 쏜 나라는 그 일을 백 년 동안 잊지 못한다고만 말했다.\n\n김진태는 명령서를 오래 들여다보았다. 그는 국회에 포탄이 떨어진 날을 기억했다. 그날 정부는 질서가 회복됐다고 발표했지만, 그을음은 아직 돔에 남아 있었다.\n\n그는 명령서에 서명하지 않았다. 참모총장이 나간 뒤 그는 비서실장에게 숨진 학생의 이름을 물었다. 비서실장은 수첩을 펴서 이름을 읽었다. 대통령은 그 이름을 메모지에 적어 책상 유리 밑에 끼웠다. 내무부 장관은 명령서를 다시 가방에 넣었다."
 tfrkphn.7277.a:0 "메모지를 유리 밑에 끼운다."
 tfrkphn.7278.t:0 "교수들의 행진"
 tfrkphn.7278.d:0 "엿새째 되는 날 오후 대학교수 이백오십여 명이 종로에 모였다. 그들은 학생들의 피에 보답하라고 적은 현수막을 들었다. 대부분 머리가 희었고, 몇은 지팡이를 짚었다. 맨 앞의 노교수는 일흔을 넘겼다. 그들이 걷기 시작하자 길가의 학생들이 길을 터 주었다. 누군가 행렬 맨 앞의 노교수에게 우산을 씌웠다.\n\n교수들 가운데에는 정부의 자문 위원을 지낸 사람도 있었다. 한 경제학자는 수출 목표를 세우는 회의에 세 해 동안 나갔다. 그는 기자에게 그 숫자들은 지금도 옳다고 말했다. 그러나 숫자를 지키려고 학생을 죽게 하는 정부는 따를 수 없다고 덧붙였다.\n\n경찰은 행렬을 막지 않았다. 기동대장은 무전으로 지시를 물었고, 본청은 한 시간 동안 답하지 않았다. 행렬은 시청 앞에 닿았고, 그곳에 있던 수만 명이 교수들을 둘러쌌다.\n\n그날 밤 방송은 처음으로 시위 현장을 생중계했다. 국영 방송의 보도국장은 사표를 낸 뒤였다. 화면에는 흰머리의 교수들 뒤로 끝없이 늘어선 사람들이 보였다. 그 사람들 가운데에는 넥타이를 맨 회사원도 있었다."
 tfrkphn.7278.a:0 "행렬이 시청 앞에 닿는다."
 tfrkphn.7279.t:0 "탈당계"
 tfrkphn.7279.d:0 "행진이 있은 날 밤 여당 의원 한 사람이 당사에 탈당계를 냈다. 그는 조원진이 원외 정당을 이끌던 시절부터 함께한 사람이었다. 그는 천막에서 잤고, 광장에서 연단에 올랐으며, 새 헌법의 조문을 직접 썼다. 그는 탈당계를 쓰기 전에 그 헌법을 한 번 더 읽었다고 했다.\n\n그는 기자들 앞에서 길게 말하지 않았다. 자신은 패전의 책임을 묻겠다고 정치를 했고, 그 일은 아직 옳다고 믿는다고 했다. 그러나 개표 화면의 140은 자기가 만든 헌법으로도 설명할 수 없다고 했다.\n\n새벽까지 여당 의원 절반이 같은 서류를 냈다. 몇은 울었고, 몇은 당사 앞에서 지지자들에게 욕을 들었다. 애국단 출신의 한 청년 당원은 탈당계를 내고 나오는 의원의 소매를 붙잡고 놓지 않았다. 의원은 청년의 손을 한참 잡고 있다가 천천히 떼어 냈다.\n\n대통령은 탈당한 의원들의 명단을 받았다. 그는 명단에서 함께 검사 생활을 했던 후배의 이름을 찾았다. 그는 전화를 걸지 않았다. 그날 아침 대통령실 대변인은 정례 브리핑을 취소했다."
 tfrkphn.7279.a:0 "브리핑을 취소한다."
 tfrkphn.7280.t:0 "집으로 간 애국단"
 tfrkphn.7280.d:0 "청년 애국단 본부에는 밤새 전화가 울렸다. 지역 지부장들은 광장으로 나가 시위대와 맞서겠다고 했다. 버스 서른 대가 대기하고 있었고, 몽둥이와 헬멧은 창고에 쌓여 있었다. 지시만 내려오면 되었다. 지부장들 가운데 몇은 이미 버스에 올라 있었다.\n\n단장은 스물아홉 살이었다. 그는 대학을 그만두고 애국단에 들어왔고, 그곳에서 처음으로 자기 이름이 불리는 일을 맡았다. 그는 대통령실에 지시를 물었다. 대통령실의 답은 한 줄이었다. 아무도 내보내지 말라는 것이었다. 그는 그 한 줄을 세 번 읽었다.\n\n단장은 지부장들을 모아 그 한 줄을 읽었다. 몇은 배신이라고 소리쳤고, 몇은 말없이 헬멧을 벗었다. 해군 군복 상의를 입은 청년 하나는 창고 문을 잠그고 열쇠를 단장에게 건넸다. 그는 동기들의 사진을 지갑에 넣은 채 집으로 돌아갔다.\n\n그날 애국단은 광장에 나가지 않았다. 버스 기사들은 오후가 되자 시동을 껐다. 단장은 본부 간판 아래에서 혼자 담배를 피웠다. 그는 광장 쪽에서 들려오는 함성을 오래 들었다."
 tfrkphn.7280.a:0 "버스의 시동을 끈다."
 tfrkphn.7281.t:0 "사십 초"
 tfrkphn.7281.d:0 "이튿날 아침 국회가 본회의를 열었다. 남은 여당 의원들과 야당 의원들이 오랜만에 같은 시간에 자리에 앉았다. 안건은 하나였다. 대통령의 사임을 권고하는 결의안이었다. 방청석은 기자와 시민으로 가득 찼다.\n\n국회의장은 토론 신청이 없다고 알렸다. 무제한 토론을 하던 의원들도, 그 토론을 막던 의원들도 손을 들지 않았다. 표결은 사십 초 만에 끝났다. 반대표는 일곱이었다. 의장이 가결을 선포하자 방청석에서 누군가 짧게 박수를 쳤다가 멈췄다.\n\n반대표를 던진 의원 가운데 한 사람은 기자들에게 끝까지 대통령 곁에 남겠다고 말했다. 그는 패전 때 아들을 잃었다. 그는 그 전쟁을 끝까지 했어야 했다고 지금도 믿는다고 했다. 기자들은 그의 말을 받아 적었고, 아무도 웃지 않았다.\n\n결의안은 법적 효력이 없었다. 국회의장은 결의안을 봉투에 넣어 대통령실로 보냈다. 봉투를 들고 간 사람은 국회 사무처의 젊은 직원이었다. 그는 포격 때 본회의장의 일지를 적었던 사람이었다. 그는 그 일지의 마지막 쪽에 오늘 날짜를 적었다."
 tfrkphn.7281.a:0 "봉투가 대통령실로 간다."
 tfrkphn.7282.t:0 "한 문장"
 tfrkphn.7282.d:0 "김진태는 그날 밤 관저에서 잠을 자지 않았다. 그는 서랍에서 낡은 수사 기록을 꺼냈다가 다시 넣었다. 책상 유리 밑에는 숨진 고등학생의 이름이 적힌 메모지가 있었다. 그는 그 이름을 소리 내어 한 번 읽었다.\n\n새벽에 그는 비서실장을 불러 담화문을 받아 적게 했다. 비서실장은 여러 장을 준비해 왔지만, 대통령은 한 문장만 불렀다. 국민이 원한다면 물러나겠다는 문장이었다. 그 문장은 조원진이 섣달그믐에 읽었던 문장과 같았다.\n\n담화는 아침 일곱 시 라디오로 나갔다. 광장에서 밤을 새운 사람들이 휴대용 라디오 앞에 모였다. 담화는 십 초 만에 끝났다. 처음에는 아무도 소리를 내지 않았다.\n\n누군가 애국가를 부르기 시작했다. 태극기를 든 청년들과 140이라고 적은 종이를 든 청년들이 같은 노래를 불렀다. 둘은 같은 대학을 다니는 사람들이기도 했다. 몇 주 동안 광장을 둘로 나누었던 경찰 버스는 그 자리에 그대로 서 있었다. 버스 위에 올라간 학생 하나가 운전석의 경찰에게 손을 흔들었다. 경찰도 손을 들었다."
 tfrkphn.7282.a:0 "라디오를 끈다."
 TFRKPHN_cho_eh0:0 "겨울"
 TFRKPHN_cho_eh0_desc:0 "인터넷을 끊고 광장을 비웁니다. 정권은 버팁니다."
 TFRKPHN_cho_eh1:0 "물러날 수 없는 이유"
 TFRKPHN_cho_eh1_desc:0 "정권이 무너지면 법정에 설 사람들의 명단이 금고에 있습니다."
 TFRKPHN_cho_eh2:0 "흰 종이"
 TFRKPHN_cho_eh2_desc:0 "집회를 허가제로 바꾸고 외국 대리인 명단을 넓힙니다."
 TFRKPHN_cho_eh3:0 "귀국편"
 TFRKPHN_cho_eh3_desc:0 "외국에서 돌아오는 야당 지도자를 공항에서 맞습니다."
 TFRKPHN_cho_eh4:0 "하루짜리 행군"
 TFRKPHN_cho_eh4_desc:0 "정부가 험한 일을 맡기던 경비 회사가 서울로 향합니다."
 TFRKPHN_cho_eh5:0 "도쿄의 연단"
 TFRKPHN_cho_eh5_desc:0 "망명한 세 사람이 일본 국회에 섭니다. 대통령은 조약에서 나갑니다."
 TFRKPHN_cho_eh6:0 "조용한 나라"
 TFRKPHN_cho_eh6_desc:0 "월급은 제때 나오고 광장은 비어 있습니다."
 TFRKPHN_cho_ef0:0 "발포 명령은 없다"
 TFRKPHN_cho_ef0_desc:0 "계엄 사령관이 될 장군은 시민에게 총을 쏘지 않겠다고 합니다."
 TFRKPHN_cho_ef1:0 "교수들의 행진"
 TFRKPHN_cho_ef1_desc:0 "흰머리의 교수들이 종로를 걷습니다."
 TFRKPHN_cho_ef2:0 "탈당계"
 TFRKPHN_cho_ef2_desc:0 "여당 의원 절반이 당을 떠납니다."
 TFRKPHN_cho_ef3:0 "집으로 간 애국단"
 TFRKPHN_cho_ef3_desc:0 "애국단은 광장에 나가지 않습니다."
 TFRKPHN_cho_ef4:0 "사십 초"
 TFRKPHN_cho_ef4_desc:0 "국회가 대통령의 사임을 권고합니다."
 TFRKPHN_cho_ef5:0 "한 문장"
 TFRKPHN_cho_ef5_desc:0 "대통령이 라디오로 담화를 냅니다."
 TFRKPHN_cho_ef6:0 "걸어서"
 TFRKPHN_cho_ef6_desc:0 "대통령은 걸어서 청와대를 나옵니다."
 TFRKPHN_kjt_hold_path_tt:0 "엔딩 가지 §Y겨울§!이 열립니다. 정권이 버팁니다."
 TFRKPHN_kjt_fall_path_tt:0 "엔딩 가지 §Y발포 명령은 없다§!가 열립니다. 정권이 무너집니다."
