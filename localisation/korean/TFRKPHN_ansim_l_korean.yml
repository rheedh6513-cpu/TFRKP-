l_korean:
 # 안심소득 탭. ansim_build.py가 만든다.
 TFRKPHN_oh_ansim_category:0 "안심소득"
 TFRKPHN_oh_ansim_category_desc:0 "기준에 모자라는 소득의 절반을 나라가 채워 주는 제도입니다. 서울에서 800가구로 하던 시범 사업을 단계를 밟아 나라 전체로 넓힙니다. 단계가 오를수록 빈곤이 줄고 소비재에 드는 공장이 늘어납니다.\n\n지금 단계: §Y[?TFRKPHN_an_stage|0]§! / 4"
 TFRKPHN_ansim:0 "안심소득"
 TFRKPHN_ansim_desc:0 "기준에 모자라는 소득의 절반을 나라가 채워 줍니다."
 TFRKPHN_an_c5_tt:0 "중점 §Y안심소득 전면 시행§!을 끝냄"
 TFRKPHN_an_d1:0 "안심소득 1단계: 시범 지역을 광역시로 넓힌다"
 TFRKPHN_an_d1_desc:0 "서울의 시범 사업은 800가구가 대상이었습니다. 기준 중위소득 85 이하인 가구에, 그 기준에서 모자라는 소득의 절반을 달마다 채워 주는 방식입니다. 같은 실험을 부산과 대구, 광주, 대전, 인천에서도 해 봅니다."
 TFRKPHN_an_wait1_tt:0 "§Y60일§! 뒤에 시행됩니다."
 TFRKPHN_an_d1_tt:0 "§Y안심소득§! 변동치: 빈곤 개선 §G+0.001§! (달마다), 소비재 공장 §R+0.5§!\n서울 강북권 14개 구의 여당 지지도 §G+1§!"
 tfrkphn.6621.t:0 "다섯 도시의 안심소득"
 tfrkphn.6621.d:0 "광역시 다섯 곳에서 안심소득 시범 사업이 시작됐습니다. 서울에서 800가구로 하던 실험이 도시마다 수천 가구로 커졌습니다.\n\n받는 가구와 받지 않는 가구를 나란히 놓고 일자리와 소비, 건강이 어떻게 달라지는지 지켜봅니다. 일을 하면 지원이 끊기는 지금의 제도와 달리, 벌이가 늘어도 지원이 조금씩만 줄어든다는 점이 이 제도의 핵심입니다."
 TFRKPHN_an_d2:0 "안심소득 2단계: 중위소득 절반 아래 가구부터 전국으로"
 TFRKPHN_an_d2_desc:0 "서울 시범 사업의 1단계는 기준 중위소득 50 이하 가구였습니다. 가장 어려운 이 가구들부터 전국에서 안심소득을 받게 합니다. 돈이 많이 들고, 그 돈은 세금에서 나옵니다."
 TFRKPHN_an_wait2_tt:0 "§Y75일§! 뒤에 시행됩니다."
 TFRKPHN_an_d2_tt:0 "§Y안심소득§! 변동치: 빈곤 개선 §G+0.002§! (달마다), 소비재 공장 §R+1§!\n서울 강북권과 서남권의 여당 지지도 §G+1§!\n2028년 총선 때 여당 의석 §G+2§!"
 tfrkphn.6622.t:0 "가장 어려운 집부터"
 tfrkphn.6622.d:0 "기준 중위소득의 절반에 못 미치는 가구가 전국 어디서나 안심소득을 받게 됐습니다. 첫 지급일에 주민센터 창구마다 줄이 생겼습니다.\n\n기초생활보장 제도에서 빠져 있던 사람들이 많이 들어왔습니다. 재산이나 부양가족 기준에 걸려 아무 지원도 받지 못하던 가구들입니다. 예산 당국은 내년 예산안에서 다른 사업을 줄여야 한다는 보고서를 냈습니다."
 TFRKPHN_an_d3:0 "안심소득 3단계: 중위소득 85 아래까지 전면 시행"
 TFRKPHN_an_d3_desc:0 "서울비전 2030은 2027년을 안심소득 전면 시행의 해로 잡았습니다. 대상을 기준 중위소득 85 이하 가구 전체로 넓힙니다. 나라 살림에서 가장 큰 복지 지출이 됩니다."
 TFRKPHN_an_wait3_tt:0 "§Y90일§! 뒤에 시행됩니다."
 TFRKPHN_an_d3_tt:0 "§Y안심소득§! 변동치: 빈곤 개선 §G+0.003§! (달마다), 안정도 §G+3§!, 소비재 공장 §R+2§!\n강남과 강북의 격차 §G-1§!\n2028년 총선 때 여당 의석 §G+3§!"
 tfrkphn.6623.t:0 "안심소득 전면 시행"
 tfrkphn.6623.d:0 "안심소득이 기준 중위소득 85 이하의 모든 가구로 넓어졌습니다. 서울 한 곳에서 800가구로 시작한 실험이 나라의 제도가 됐습니다.\n\n국회 예산 심사는 길었습니다. 야당은 돈이 너무 든다고 했고 여당 안에서도 같은 말이 나왔습니다. 시범 사업의 결과표가 그 논쟁을 끝냈습니다. 받은 가구의 근로소득이 줄지 않았다는 숫자였습니다."
 TFRKPHN_an_d4:0 "안심소득 4단계: 기존 복지와 하나로 묶는다"
 TFRKPHN_an_d4_desc:0 "안심소득과 겹치는 현금 지원들을 하나로 합칩니다. 창구가 하나가 되고, 같은 사람에게 두 번 나가던 돈이 정리됩니다."
 TFRKPHN_an_wait4_tt:0 "§Y60일§! 뒤에 시행됩니다."
 TFRKPHN_an_d4_tt:0 "§Y안심소득§! 변동치: 소비재 공장 §G-1.5§!, 개인 가치 §G+1§!"
 tfrkphn.6624.t:0 "창구는 하나"
 tfrkphn.6624.d:0 "생계급여와 근로장려금을 비롯해 안심소득과 겹치던 현금 지원이 하나로 묶였습니다. 신청 서류가 한 장으로 줄었습니다.\n\n제도를 합치면서 나라가 쓰는 돈도 얼마간 줄었습니다. 주민센터의 복지 담당 공무원들은 서류를 확인하던 시간에 집을 찾아다니게 됐습니다."
 TFRKPHN_an_ok:0 "다음 단계를 준비합니다."
