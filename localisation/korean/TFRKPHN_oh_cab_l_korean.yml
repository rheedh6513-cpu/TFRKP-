l_korean:
 # 오세훈 정부 국무총리 지명. oh_cab_build.py가 만든다.
 tfrkphn.640.d:0 "취임 이틀째, 우리는 아직 국무총리를 정하지 못했습니다. 승리는 지키고 국정은 바꾸겠다고 약속한 정부의 첫 얼굴을 고르는 일이고, 대통령의 책상에는 이름 두 개가 올라와 있습니다.\n\n조은희는 서울시 여성가족정책관을 거쳐 서울시의 첫 여성 정무부시장을 지냈습니다. 그 뒤 서초구청장에 두 번 당선됐는데, 2018년에는 서울 스물다섯 개 구 가운데 당시 야당 후보로는 혼자 이겼습니다. 대통령이 시장이던 때부터 손발을 맞춘 사람이고, 행정이 어디서 막히는지를 압니다.\n\n윤희숙은 한국개발연구원에서 재정과 복지 정책을 연구한 경제학자입니다. 2020년 총선에서 서초갑에 당선됐고, 그해 7월 국회 본회의에서 한 5분 발언으로 이름을 알렸습니다. 2021년 8월에는 부친의 농지 의혹에 책임을 지겠다며 의원직을 내놓았습니다. 숫자로 정책을 따지는 사람이고, 여당 안에서도 듣기 싫은 말을 합니다.\n\n국방과 외교는 홍준표 정부의 사람들이 그대로 맡습니다. 바뀌는 자리는 총리와 살림을 맡는 부처들입니다."
 TFRKPHN_cho_eun_hee_HM:0 "조은희"
 TFRKPHN_cho_eun_hee_HM_desc:0 "이력: 대한민국의 국무총리\n경북여고를 나와 서울대학교 대학원에서 국문학 석사를 받은 조은희는 경향신문 기자로 일을 시작했습니다. 청와대 문화관광비서관과 서울시 여성가족정책관을 거쳐 서울시의 첫 여성 정무부시장이 되었습니다. 2014년 지방선거에서 서초구청장에 당선됐고, 2018년에는 서울 스물다섯 개 구청장 가운데 자유한국당 소속으로는 유일하게 당선되어 재선에 성공했습니다. 오세훈 대통령은 시장 시절부터 함께 일한 그를 첫 국무총리로 지명했습니다."
 TFRKPHN_yoon_hee_sook_HM:0 "윤희숙"
 TFRKPHN_yoon_hee_sook_HM_desc:0 "출생: 1970년 대한민국 서울특별시\n\n이력: 대한민국의 국무총리\n서울대학교 경제학과와 같은 대학원을 나와 미국 컬럼비아대학교에서 경제학 박사 학위를 받은 윤희숙은 한국개발연구원에서 재정과 복지 정책 연구부장을 지냈습니다. 최저임금위원회 공익위원과 국민경제자문회의 위원으로도 일했습니다. 2020년 총선에서 서울 서초갑에 당선됐고, 그해 7월 30일 국회 본회의 5분 발언으로 널리 알려졌습니다. 2021년 8월 25일 부친의 농지법 위반 의혹에 책임을 지겠다며 의원직 사퇴를 선언했습니다. 오세훈 대통령은 그를 첫 국무총리로 지명했습니다."
 TFRKPHN_trait_district_mayor:0 "재선 구청장"
 TFRKPHN_trait_kdi_economist:0 "재정 복지 연구자"
 tfrkphn.646.t:0 "대통령의 입"
 tfrkphn.646.d:0 "우리 정부의 첫 대변인이 정해졌습니다. 김병민입니다.\n\n1982년에 태어난 그는 스물여덟 살이던 2010년에 서초구의원이 됐습니다. 2020년 총선에서는 광진갑에 나갔다가 졌고, 그해 당 비상대책위원회에 들어가 당의 강령을 고치는 일을 맡았습니다. 대통령이 서울시장이던 때에는 정무부시장으로 시청과 시의회 사이를 오갔습니다.\n\n대변인은 대통령의 긴 설명을 몇 줄로 줄여 기자들 앞에 내놓아야 합니다. 대통령을 오래 지켜본 사람이라 그 일을 맡겼습니다. 기자실은 새 대변인의 첫 브리핑을 기다리고 있습니다."
 tfrkphn.646.a:0 "첫 브리핑을 맡긴다"
 tfrkphn.646.a_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_portrait_kim_byung_min\n\n\n\n\n\n\n\n\n-------------------------------------\n§Y김병민§!이 대통령실 대변인이 됩니다."
 tfrkphn.647.t:0 "스물일곱 해의 보좌관"
 tfrkphn.647.d:0 "대통령이 취임하고 가장 먼저 정한 자리는 비서실장입니다. 강철원이 맡습니다.\n\n그는 2000년에 대통령이 처음 국회의원이 됐을 때 보좌진으로 들어왔습니다. 그 뒤로 스물일곱 해 동안 곁을 떠나지 않았습니다. 서울시에서는 정무조정실장을 지냈고, 2021년 서울시장 보궐선거 때는 캠프의 비서실장이었습니다.\n\n대통령이 무슨 말을 하려는지를 말하기 전에 아는 사람이 우리 정부에 한 명 있다면 그입니다. 대통령실의 일정과 보고는 이제 그의 책상을 거쳐 올라갑니다."
 tfrkphn.647.a:0 "곁에 둔다"
 tfrkphn.647.a_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_portrait_kang_chul_won\n\n\n\n\n\n\n\n\n-------------------------------------\n§Y강철원§!이 대통령 비서실장이 됩니다."
 tfrkphn.648.t:0 "국회로 가는 사람"
 tfrkphn.648.d:0 "우리 정부와 국회 사이를 오갈 정무수석에 오신환이 임명됐습니다.\n\n그는 서울시의원으로 정치를 시작해 관악을에서 두 번 국회의원이 됐습니다. 관악은 우리 당이 좀처럼 이기지 못하던 곳입니다. 바른미래당에 있을 때는 원내대표를 맡았는데, 1970년대에 태어난 사람이 교섭단체 원내대표가 된 것은 그가 처음이었습니다. 대통령이 서울시장이던 때에는 정무부시장으로 시의회와 국회, 정당을 상대했습니다.\n\n법안 하나를 통과시키려면 여당 의원뿐 아니라 야당 의원도 한 명씩 만나야 합니다. 여러 당을 거치며 양쪽에 아는 얼굴이 많은 그에게 우리는 그 일을 맡겼습니다."
 tfrkphn.648.a:0 "국회를 맡긴다"
 tfrkphn.648.a_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_portrait_oh_shin_hwan\n\n\n\n\n\n\n\n\n-------------------------------------\n§Y오신환§!이 대통령실 정무수석이 됩니다."
 tfrkphn.649.t:0 "회사에서 온 장관"
 tfrkphn.649.d:0 "산업통상자원부 장관에 고동진이 지명됐습니다. 정치를 해 본 적이 없는 사람입니다.\n\n그는 1984년에 평사원으로 삼성전자에 들어갔습니다. 2015년 12월에 무선사업부장이 됐고, 사장으로 휴대전화 사업 전체를 맡았습니다. 한 회사에서 사원으로 시작해 사장까지 올라간 사람은 흔하지 않습니다.\n\n대통령은 다시 성장하겠다고 말하며 취임했습니다. 그 말을 숫자로 바꿔야 하는 자리에 공무원도 교수도 아닌 사람을 앉힌 데에는 이유가 있습니다. 공장을 어디에 짓고 무엇을 팔지를 직접 정해 본 사람이 필요했습니다."
 tfrkphn.649.a:0 "기업에서 배운다"
 tfrkphn.649.a_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_portrait_koh_dong_jin\n\n\n\n\n\n\n\n\n-------------------------------------\n§Y고동진§!이 산업통상자원부 장관이 됩니다."
 TFRKPHN_koh_dong_jin_EM:0 "고동진"
 TFRKPHN_koh_dong_jin_EM_desc:0 "이력: 대한민국의 산업통상자원부 장관\n1984년 평사원으로 삼성전자에 입사한 고동진은 2015년 12월 무선사업부장에 올랐고, 사장 겸 IM부문장으로 회사의 휴대전화 사업을 이끌었습니다. 오세훈 대통령은 정치 경험이 없는 그를 기업에서 영입해 산업통상자원부 장관으로 지명했습니다."
 TFRKPHN_trait_handset_chief:0 "사원에서 사장까지"
 tfrkphn.650.t:0 "북한을 공부한 사람"
 tfrkphn.650.d:0 "통일부 장관에 김근식이 지명됐습니다.\n\n그는 서울대학교 정치학과에 다니던 때 민주화운동으로 옥살이를 했고, 그 뒤 북한을 연구하는 학자가 됐습니다. 김대중 정부 때는 아태평화재단 연구위원이었고 노무현 정부 때는 통일부와 국방부의 자문위원이었습니다. 경남대학교에서 가르치다가 국민의당과 바른미래당을 거쳐 우리 당으로 왔습니다. 2020년 총선에서는 송파병에 나갔다가 졌고, 2021년 서울시장 보궐선거 때는 당의 비전전략실장으로 일했습니다.\n\n햇볕정책을 안에서 본 사람이 보수 정부의 통일부를 맡습니다. 진보와 보수 양쪽 정부의 대북 정책을 가까이에서 지켜본 사람은 우리 당에 많지 않습니다. 대통령은 양쪽을 다 아는 사람이 필요하다고 했습니다."
 tfrkphn.650.a:0 "양쪽을 다 아는 사람"
 tfrkphn.650.a_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_portrait_kim_keun_sik\n\n\n\n\n\n\n\n\n-------------------------------------\n§Y김근식§!이 통일부 장관이 됩니다."
 tfrkphn.640.t:0 "첫 인선"
 tfrkphn.640.all:0 "취임 이틀째, 대통령실이 첫 인선을 한꺼번에 내놓았다.\n\n비서실장은 강철원이다. 2000년에 대통령이 처음 국회의원이 됐을 때부터 곁을 지킨 보좌관이다.\n대변인은 김병민이다. 스물여덟 살에 서초구의원이 됐고 서울시 정무부시장을 지냈다.\n정무수석은 오신환이다. 관악을에서 두 번 당선된 전직 의원이고 원내대표를 해 봤다.\n산업통상자원부 장관은 고동진이다. 평사원으로 들어가 삼성전자 사장까지 오른 사람이다.\n통일부 장관은 김근식이다. 진보와 보수 양쪽 정부에서 대북 정책을 지켜본 북한학자다.\n국방부 장관은 바꾸지 않았다. 전쟁을 치른 임종득이 그대로 남아 군을 평시로 되돌린다.\n\n국무총리 자리만 비어 있다. 서초구청장을 두 번 지낸 조은희와 한국개발연구원 출신 경제학자 윤희숙, 두 이름이 대통령의 책상에 올라와 있다."
 tfrkphn.640.a:0 "행정을 아는 사람, 조은희"
 tfrkphn.640.b:0 "경제를 아는 사람, 윤희숙"
 tfrkphn.640.a_tt:0 "§Y국무총리 지명§!\n\n\n\n\n   £GFX_TFRKPHN_oh640_cho\n\n\n\n\n\n§Y조은희§!를 국무총리로 지명합니다."
 tfrkphn.640.b_tt:0 "§Y국무총리 지명§!\n\n\n\n\n   £GFX_TFRKPHN_oh640_yoon\n\n\n\n\n\n§Y윤희숙§!을 국무총리로 지명합니다."
 TFRKPHN_oh_first_staff_tt:0 "\n\n\n\n\n   £GFX_TFRKPHN_oh640_staff\n\n\n\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_oh640_min\n\n\n\n\n\n장관들의 효과는 내각 화면에서 볼 수 있습니다."
