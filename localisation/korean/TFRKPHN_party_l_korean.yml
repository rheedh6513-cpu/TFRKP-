 tfrkphn.6982.t:0 "당이 먼저 바뀌어야 합니다"
 tfrkphn.6982.d:0 "취임 넉 달째 되는 주 목요일, 오세훈 대통령은 여당 의원 전원을 대통령실로 불렀다. 대통령이 의원 전원과 마주 앉은 것은 이번 정부에서 처음이다.\n\n그는 지난 대선 결과부터 꺼냈다. 국민은 전쟁을 이긴 정당을 다시 골랐지만, 그 정당의 목소리가 계속 커지기를 바란 것은 아니라고 말했다. 표를 준 사람들 가운데 절반은 이번만 찍었다고 답한 출구조사도 함께 내밀었다.\n\n대통령은 당의 강령과 공천 방식을 바꾸자고 했다. 전쟁 시기에 들어간 비상 대응 조항을 강령에서 빼고, 다음 총선부터는 지역구 공천의 절반을 국민 여론조사로 정하자는 안이었다.\n\n회의장에는 한동안 말이 없었다. 회의가 끝난 뒤 한 초선 의원은 기자들에게 대통령이 당을 다시 짓자고 했다고 전했다. 원내대표는 오늘 나온 이야기를 의원총회에서 다시 논의하겠다고만 밝혔다."
 tfrkphn.6982.a:0 "중도로 문을 연다."
 tfrkphn.6982.b:0 "지금은 국정이 먼저다."
 tfrkphn.6983.t:0 "강경파의 반발"
 tfrkphn.6983.d:0 "당 개혁안 초안이 공개된 지 사흘 만에 여당 의원 스물한 명이 성명을 냈다. 대부분 전쟁 시기에 국방위와 정보위에서 일한 의원들이다.\n\n성명은 전쟁을 이긴 원칙을 버리면 다음 위기에 나라를 지킬 수 없다고 적었다. 이름을 밝히지 않은 한 중진 의원은 기자들에게 대통령이 야당의 표를 얻으려고 당을 내준다고 말했다.\n\n성명이 나온 날 저녁 보수 성향 유튜브 채널 몇 곳은 대통령을 배신자라고 불렀다. 같은 날 발표된 여론조사에서는 당 개혁에 찬성한다는 응답이 열에 여섯이었다.\n\n대통령실은 성명에 직접 답하지 않았다. 다만 비서실장은 그날 저녁 여당 원내대표와 두 시간 동안 만났다. 다음 총선 공천 규칙은 아직 정해지지 않았다."
 tfrkphn.6983.a:0 "한 사람씩 만나 설득한다."
 tfrkphn.6983.b:0 "공천 규칙으로 답한다."
 tfrkphn.6984.t:0 "새 강령"
 tfrkphn.6984.d:0 "여당이 전당대회를 열고 새 강령을 통과시켰다. 첫 줄에는 따뜻한 보수가, 둘째 줄에는 약자와의 동행이 들어갔다.\n\n전쟁 시기에 들어간 비상 대응 조항은 부칙으로 옮겨졌다. 반대한 대의원은 열에 셋이었다. 강경파 의원들은 표결 직전 자리를 떴지만 탈당한 사람은 없었다. 개혁안을 처음부터 지지해 온 한동훈은 표결이 끝난 뒤 대통령과 나란히 연단에 올라 새 강령을 들어 보였다.\n\n전당대회장 밖에서는 전쟁 유족 모임 회원 몇 명이 조용히 팻말을 들고 서 있었다. 팻말에는 잊지 말아 달라는 한 문장만 적혀 있었다. 새 강령은 부칙에 전쟁 희생자를 기억하는 조항을 따로 두었다.\n\n여론조사에서 여당 지지율은 한 달 사이 4퍼센트포인트 올랐다. 오른 몫은 대부분 스스로 중도라고 답한 사람들에게서 나왔다. 대통령은 전당대회 축사에서 이제 보수가 지키는 것은 사람이라고 말했다."
 tfrkphn.6984.a:0 "이제 당과 대통령이 같은 쪽을 본다."
 TFRKPHN_pt_n2_tt:0 "서울 강북의 여당 지지도 §G+2§!"
 TFRKPHN_pt_n3_tt:0 "서울 강북의 여당 지지도 §G+3§!, 서남권 §G+2§!"
 TFRKPHN_pt_all2_tt:0 "서울 스물다섯 구 모두의 여당 지지도 §G+2§!"
 TFRKPHN_oh_a2_pt_tt:0 "§Y20일 뒤§! 사건 §Y당이 먼저 바뀌어야 합니다§!가 일어난다."
 TFRKPHN_pr_category:0 "당을 다시 짓는다"
 TFRKPHN_pr_category_desc:0 "가운데 버튼으로 당을 고친다. 개혁은 §G지지§!를 올리지만 강경파의 §R반발§!도 키운다. 지지가 §Y100§!에 닿으면 새 강령이 통과되고, 반발이 §R100§!에 닿으면 집단 탈당 위기가 온다. 반발이 처음 §Y60§!을 넘으면 강경파가 성명을 낸다."
 TFRKPHN_pr_head:0 "당을 다시 짓는다"
 TFRKPHN_pr_n_oh:0 "오세훈"
 TFRKPHN_pr_n_jang:0 "장동혁"
 TFRKPHN_pr_jang_tt:0 "§Y장동혁§!\n2025년 8월 국민의힘 대표에 당선되었다. 언론은 그를 탄핵 반대 강경파로 불렀다.\n이 탭에서는 당내 강경파를 대표한다."
 TFRKPHN_pr_v_sup:0 "개혁 지지 §B[?TFRKPHN_pr_sup|0]§!"
 TFRKPHN_pr_v_bk:0 "강경파 반발 §R[?TFRKPHN_pr_bk|0]§!"
 TFRKPHN_pr_goal:0 "지지 100이면 새 강령, 반발 100이면 집단 탈당 위기"
 TFRKPHN_pr_open_tt:0 "결정 탭 §Y당을 다시 짓는다§!가 열립니다 (개혁 지지 §B30§!, 강경파 반발 §R25§!에서 시작)."
 TFRKPHN_pr_6983a_tt:0 "강경파 반발 §G-10§!"
 TFRKPHN_pr_6983b_tt:0 "서울 강북의 여당 지지도 §G+3§!, 서남권 §G+2§!\n개혁 지지 §G+5§!, 강경파 반발 §R+10§!"
 TFRKPHN_pr_6992_tt:0 "개혁 지지 §R-20§!, 강경파 반발 §G-40§!\n서울 스물다섯 구 모두의 여당 지지도 §R-2§!"
 TFRKPHN_pr_6992_orp_tt:0 "탈당한 의원 §R14명§!이 §G우리공화당§!으로 간다. 국회 의석에서 여당 몫이 그만큼 줄어든다."
 tfrkphn.6992.t:0 "집단 탈당"
 tfrkphn.6992.d:0 "여당 의원 열네 명이 한꺼번에 탈당계를 냈다. 맨 앞에서 서류를 낸 사람은 장동혁 의원이었다. 그는 국회 소통관에서 이 당은 더 이상 전쟁을 이긴 당이 아니라고 말했다.\n\n일주일 뒤 이들은 모두 우리공화당에 입당했다. 원외에 머물던 우리공화당은 하루아침에 국회 의석 열네 개를 가진 정당이 되었다. 당사 앞에는 초록색 깃발이 걸렸다.\n\n대통령실은 하루 종일 말을 아꼈다. 여당은 과반을 지켰지만 표결마다 계산이 복잡해졌다. 여론조사에서 여당 지지율은 한 주 사이 3퍼센트포인트 내려갔다. 개혁안은 멈추지 않았다."
 tfrkphn.6992.a:0 "남은 사람들과 다시 시작한다."
 TFRKPHN_pr_b_plat_tt:0 "§Y강령을 고친다§!\n정치력 §Y50§!, 개혁 지지 §G+20§!, 강경파 반발 §R+10§!\n한 번만 할 수 있다."
 TFRKPHN_pr_b_nom_tt:0 "§Y공천 절반을 여론조사로§!\n정치력 §Y75§!, 개혁 지지 §G+20§!, 강경파 반발 §R+20§!\n한 번만 할 수 있다."
 TFRKPHN_pr_b_youth_tt:0 "§Y청년 공천 할당§!\n정치력 §Y40§!, 개혁 지지 §G+15§!, 강경파 반발 §R+5§!\n한 번만 할 수 있다."
 TFRKPHN_pr_b_emerg_tt:0 "§Y비상 조항을 부칙으로§!\n정치력 §Y50§!, 개혁 지지 §G+15§!, 강경파 반발 §R+10§!\n한 번만 할 수 있다."
 TFRKPHN_pr_b_pers_tt:0 "§Y한 사람씩 설득한다§!\n정치력 §Y60§!, 강경파 반발 §G-15§!\n60일에 한 번 할 수 있다."
