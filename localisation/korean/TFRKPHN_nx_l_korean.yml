l_korean:
 # [안내] 삼김 다음 대선. nx_build.py가 만든다.
 tfrkphn.7138.t:0 "다음 이름"
 tfrkphn.7138.d:0 "대통령의 임기가 마지막 해로 접어들었다. 비서실의 달력에는 이사 날짜가 연필로 적혔고, 여의도의 눈은 자연스럽게 다음 사람에게로 옮겨 갔다. 단임의 헌법은 김부겸에게 두 번째 기회를 주지 않았다. 그도 그것을 아쉬워하는 내색을 하지 않았다.\n\n신민당 안에서 두 이름이 오르내렸다. 하나는 부총리로 나라 살림의 장부를 지켜 온 김동연이었다. 다른 하나는 총리로 개혁의 역풍을 국회에서 몸으로 받아낸 임종석이었다. 한 사람은 숫자를, 한 사람은 사람을 다뤄 왔다.\n\n두 사람의 사무실은 같은 층 복도의 양 끝에 있었다. 보좌관들은 복도 가운데의 정수기 앞에서 마주쳐도 고개만 숙이고 지나갔다. 기자들은 그 복도의 길이를 재기 시작했고, 누가 먼저 그 복도를 건너갈지를 두고 내기를 걸었다.\n\n김부겸은 어느 쪽에도 손을 들어 주지 않았다. 그가 두 사람을 함께 불러 밥을 한 번 먹었다는 이야기만 전해졌다. 밥상에는 대구식 육개장이 올랐다고 했다. 무슨 말이 오갔는지는 그 자리에 있던 비서관들도 알지 못했다."
 tfrkphn.7138.a:0 "복도는 길다."
 tfrkphn.7139.t:0 "다음 이름"
 tfrkphn.7139.d:0 "대통령의 임기가 마지막 해로 접어들었다. 비서실의 달력에는 이사 날짜가 연필로 적혔고, 여의도의 눈은 자연스럽게 다음 사람에게로 옮겨 갔다. 단임의 헌법은 김동연에게 두 번째 기회를 주지 않았다. 그는 마지막 해의 장부부터 다시 펼쳤다.\n\n신민당 안에서 두 이름이 오르내렸다. 하나는 총리로 국회와 거리를 오가며 정부의 방패가 되어 준 김부겸이었다. 다른 하나는 경제를 맡아 빚 장부의 마지막 줄을 함께 맞춘 홍남기였다. 한 사람은 사람을, 한 사람은 숫자를 다뤄 왔다.\n\n두 사람의 사무실은 같은 층 복도의 양 끝에 있었다. 보좌관들은 복도 가운데의 정수기 앞에서 마주쳐도 고개만 숙이고 지나갔다. 기자들은 그 복도의 길이를 재기 시작했고, 누가 먼저 그 복도를 건너갈지를 두고 내기를 걸었다.\n\n김동연은 어느 쪽에도 손을 들어 주지 않았다. 그가 두 사람을 함께 불러 밥을 한 번 먹었다는 이야기만 전해졌다. 밥상에는 대통령이 직접 고른 국수가 올랐다고 했다. 그릇을 비운 쪽이 누구였는지를 두고 비서관들은 내기를 걸었다."
 tfrkphn.7139.a:0 "복도는 길다."
 tfrkphn.7140.t:0 "한 우산 아래"
 tfrkphn.7140.d:0 "두 사람은 민주화 운동 기념관의 작은 강당에서 만났다. 벽에는 오래전 거리에서 함께 최루탄을 맞던 두 야당 지도자의 사진이 걸려 있었다. 한 사람이 갇힌 집의 담장 너머로 다른 한 사람이 안부를 묻던 시절의 사진이었다. 누가 그 자리를 골랐는지는 끝내 알려지지 않았다.\n\n바깥 사정은 좋지 않았다. 패전 뒤 자란 양 끝의 세력은 광장을 나눠 가졌고, 헌정회복연대는 다시 권력을 되찾을 날을 세고 있었다. 둘로 나가면 둘 다 진다는 말이 이번에도 누군가의 입에서 나왔다. 당원들은 오래된 노래를 다시 꺼내 불렀다.\n\n[TFRKPHN_nx_A]과 [TFRKPHN_nx_B], 두 사람은 그 사진 앞에 나란히 섰다. 기자들의 셔터 소리가 한참 이어졌다. 두 사람은 누가 나설지는 일주일 안에 정하겠다고만 밝혔다. 그리고 그날 저녁 같은 차를 타고 돌아갔다. 강당 밖에는 비가 내렸다.\n\n지지자들은 그 차가 골목을 빠져나갈 때까지 휴대전화를 들고 있었다. 그 사진은 다음 날 아침 거의 모든 신문의 일 면에 실렸다. 사진 설명은 신문마다 달랐지만, 제목은 하나같이 짧았다. 함께 간다."
 tfrkphn.7141.t:0 "같은 쪽에 선 표"
 tfrkphn.7141.d:0 "선거는 생각보다 싱거웠다. 신민당의 단일 후보는 첫 여론조사부터 앞서 나갔고, 물러난 쪽은 유세 첫날부터 그의 곁에 섰다. 두 사람이 같은 유세차에 올라 손을 흔드는 장면은 선거 기간 내내 되풀이되었다. 지지자들은 그 장면이 나올 때마다 박수를 쳤다.\n\n헌정회복연대의 권영세는 끝까지 따라붙었지만 표차는 줄지 않았다. 양 끝의 후보들은 각자의 광장을 가득 채웠으나, 그 사람들을 투표소까지 데려오지는 못했다. 광장의 함성은 개표 방송의 숫자로 옮겨지지 않았다. 양 끝의 세력은 서로를 향해 날을 세우느라 신민당을 겨눌 틈이 없었다.\n\n개표가 끝난 밤, 당선자는 맨 먼저 [TFRKPHN_nx_prev] 대통령에게 전화를 걸었다고 전해졌다. 세 김씨의 시대는 그렇게 다음 사람에게 넘어갔다. 원로들은 오랜만에 같은 식당에 모여 늦게까지 술잔을 돌렸다. 물러난 쪽은 당선자 곁에서 가장 늦게까지 자리를 지켰다.\n\n고참 기자들은 그날 기사 끝에 같은 문장을 붙였다. 이번에는 둘이 갈라지지 않았다. 그 문장 아래에는 오래된 사진 한 장이 함께 실렸다."
 tfrkphn.7142.t:0 "두 장의 출마 선언문"
 tfrkphn.7142.d:0 "일주일 뒤 신민당 당사에서 출마 선언이 두 번 있었다. 오전에는 [TFRKPHN_nx_A] 후보가, 오후에는 [TFRKPHN_nx_B] 후보가 같은 연단에 섰다. 연단 뒤의 당 깃발은 바뀌지 않았다. 바뀐 것은 앞줄에 앉은 사람들의 얼굴뿐이었다. 당원들은 그날 박수를 두 번 쳤다.\n\n단일화 협상은 세 번 열렸다가 세 번 깨졌다. 여론조사 방식을 두고 한 번, 경선 날짜를 두고 한 번 깨졌고, 마지막에는 누가 먼저 양보를 말할지를 두고 깨졌다. 양쪽 모두 자기가 이긴다는 숫자를 들고 있었다. 협상장 앞 복도에는 양쪽 지지자들이 따로 줄을 섰다.\n\n지역의 표도 갈라졌다. 같은 당 이름을 단 당원들이 서로 다른 버스를 탔다. 원로들은 오래전 민주화를 얻어 놓고도 둘로 나뉘어 정권을 내주었던 선거를 이야기했지만, 듣는 사람은 많지 않았다. 다들 이번에는 다르다고 믿었다.\n\n헌정회복연대의 권영세는 그 모든 장면을 조용히 지켜보았다. 그의 유세는 짧았고, 말은 적었다. 그는 상대의 이름을 한 번도 부르지 않았다. 부를 필요가 없었다. 그의 선거 사무실은 늘 일찍 불이 꺼졌다."
 tfrkphn.7143.t:0 "셋으로 나뉜 밤"
 tfrkphn.7143.d:0 "개표 방송의 그래프는 밤새 세 갈래로 갈라져 있었다. 신민당의 두 후보는 엎치락뒤치락했고, 그 위에서 권영세의 막대가 조금씩 길어졌다. 자정 무렵 방송사들은 당선 유력이라는 자막을 띄웠다. 신민당의 두 당사에서는 동시에 불이 꺼졌다. 투표율은 높았다.\n\n두 후보의 표를 더하면 과반이 훨씬 넘었다. 그 계산은 개표가 끝나기도 전에 퍼졌고, 다음 날 아침 거의 모든 신문의 사설이 같은 숫자를 실었다. 누구도 그 숫자를 되돌릴 수는 없었다. 어떤 이는 그 숫자를 오려 당사 문 앞에 붙여 두었다.\n\n[TFRKPHN_nx_A]과 [TFRKPHN_nx_B], 두 사람은 각자의 당사에서 짧은 승복 연설을 했다. 두 사람은 끝내 서로의 이름을 부르지 않았다. [TFRKPHN_nx_prev] 대통령은 그날 밤 아무 성명도 내지 않았다. 지지자 몇은 당사 앞 계단에 앉아 날이 밝을 때까지 일어나지 않았다.\n\n권영세는 당선 소감에서 국민의 뜻을 겸허히 받들겠다고만 말했다. 광장의 양 끝에서는 그날 밤에도 집회가 이어졌다. 세 김씨의 시대는 그렇게 끝났다. 그 끝은 누구도 바라지 않던 모양이었다."
 tfrkphn.7140.a:0 "[TFRKPHN_nx_A]이 나선다."
 tfrkphn.7140.b:0 "[TFRKPHN_nx_B] 쪽이 나선다."
 tfrkphn.7141.a:0 "다음 사람에게 넘어간다."
 tfrkphn.7142.a:0 "둘 다 물러서지 않는다."
 tfrkphn.7143.a:0 "표는 셋으로 갈라졌다."
 TFRKPHN_nm_kbg:0 "김부겸"
 TFRKPHN_nm_kdy:0 "김동연"
 TFRKPHN_nm_ijs:0 "임종석"
 TFRKPHN_nm_hng:0 "홍남기"
 TFRKPHN_nx_a_tt:0 "§Y[TFRKPHN_nx_A]§!이 신민당 단일 후보로 나섭니다."
 TFRKPHN_nx_b_tt:0 "§Y[TFRKPHN_nx_B]§! 쪽이 신민당 단일 후보로 나섭니다."
 TFRKPHN_nx_score_tt:0 "신민당이 하나로 갈지는 다섯 가지로 정해집니다. 판을 이겼는지(§Y2§!), 안정도 50% 넘는지(§Y1§!), 개혁 저항 60 아래 또는 나라 빚 30 아래(§Y1§!), 연대와의 약속을 깨지 않았는지(§Y1§!). §Y4§! 이상이면 힘을 합칩니다."
 TFRKPHN_nx_split_tt:0 "§R헌정회복연대 권영세§!가 대통령이 됩니다."
 KOR_TFRKPHN_hng_char:0 "홍남기"
 TFRKPHN_hng_desc:0 "홍남기는 기획재정부의 경제 관료 출신으로, 김동연 정부에서 경제를 맡아 나라 빚 장부의 마지막 줄을 함께 맞췄습니다."
 tfrkphn.7161.t:0 "다음 차례"
 tfrkphn.7161.d:0 "[TFRKPHN_nx_W] 대통령의 임기는 조용하게 흘러갔다. 큰 개혁도 큰 위기도 없었다. 물러났던 [TFRKPHN_nx_O] 쪽은 당을 맡아 국회를 지켰고, 두 사람은 한 달에 한 번 같은 식당에서 점심을 먹었다. 그 식당 주인은 나중에 그 자리를 비워 두었다.\n\n다음 대선이 다가오자 당 안에서 다시 두 이름이 오르내리지는 않았다. 차례는 이미 정해져 있었다. [TFRKPHN_nx_O] 후보의 출마 선언장 맨 앞줄에는 현직 대통령이 앉아 있었다. 기자들은 그 장면을 두고 처음 보는 풍경이라고 적었다. 현직 대통령은 축사를 하지 않고 박수만 쳤다.\n\n선거는 다시 한 번 싱거웠다. 헌정회복연대는 젊은 후보를 냈지만, 같은 당에서 연달아 두 사람이 대통령이 되는 길을 막지는 못했다. 양 끝의 세력은 그사이 조금씩 작아졌다. 두 사람은 개표 방송을 같은 방에서 보았다.\n\n취임식 날 두 사람은 단상 위에서 나란히 섰다. 원로 몇은 객석에서 손수건을 꺼냈다. 세 김씨의 시대 뒤에 두 사람의 시대가 왔고, 그 시대는 싸우지 않고도 끝까지 갈 수 있다는 것을 보여 주었다."
 tfrkphn.7161.a:0 "두 사람의 시대가 끝까지 간다."
 tfrkphn.7162.t:0 "십 년"
 tfrkphn.7162.d:0 "권영세 정부는 처음부터 여소야대였다. 신민당의 두 쪽은 국회에서 표를 합치면 무엇이든 막을 수 있었지만, 법안 하나를 두고도 따로 움직였다. 정부는 그 틈으로 한 걸음씩 나아갔다. 국회는 열려 있었지만 앞으로 가지 않았다. 사람들은 그 시절을 기다림의 시절이라고 불렀다.\n\n임기 셋째 해 겨울, 밤사이 합당 발표가 나왔다. [TFRKPHN_nx_A] 쪽이 헌정회복연대와 손을 잡았다. 호랑이를 잡으려면 호랑이 굴에 들어가야 한다는 말이 그 쪽 당사에서 흘러나왔다. 남은 [TFRKPHN_nx_B] 쪽 사람들은 그 말을 배신이라고 불렀다.\n\n다음 대선에서 [TFRKPHN_nx_A] 후보는 여당의 이름으로 이겼다. [TFRKPHN_nx_B] 후보는 다시 졌다. 그는 한동안 정계를 떠났다가 돌아왔고, 그다음 선거에서 마침내 이겼다. 그가 돌아오던 날 공항에는 지지자들이 줄을 섰다.\n\n결국 두 사람 모두 대통령이 되었다. 다만 그 길은 십 년이 걸렸고, 한 사람은 잡지 말아야 할 손을 잡았다는 말을, 다른 한 사람은 너무 늦게 왔다는 말을 평생 들었다. 그 십 년 동안 갈라졌던 표는 끝내 하나로 돌아오지 않았다."
 tfrkphn.7162.a:0 "표는 끝내 하나로 돌아오지 않았다."
