 TFRKPHN_nk_op_radio:0 "대북 방송"
 TFRKPHN_nk_op_radio_tt:0 "§Y대북 방송을 맞춘다§!\n고른 지역의 사투리와 소식에 맞춘 방송을 내보냅니다.\n\n비용: £pol_power §Y15§!\n고른 지역 이반도 §G+8§!\n§g같은 지역에는 20일 동안 다시 쓸 수 없습니다. 다른 지역에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_op_leaflet:0 "전단과 저장 장치"
 TFRKPHN_nk_op_leaflet_tt:0 "§Y전단과 저장 장치를 보낸다§!\n바깥 소식을 담은 전단과 저장 장치를 들여보냅니다. 물건은\n장마당을 타고 이웃 지역으로 퍼집니다.\n\n비용: £pol_power §Y10§!\n고른 지역 이반도 §G+5§!\n이웃 지역 이반도 §G+2§!\n§g같은 지역에는 20일 동안 다시 쓸 수 없습니다. 다른 지역에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_op_route:0 "탈북 길목"
 TFRKPHN_nk_op_route_tt:0 "§Y탈북 길목을 넓힌다§!\n강을 건너는 사람들을 돕습니다. 중국, 러시아와 맞닿은\n지역에서만 할 수 있습니다.\n\n비용: £pol_power §Y23§!\n고른 지역 이반도 §G+12§!\n§g같은 지역에는 20일 동안 다시 쓸 수 없습니다. 다른 지역에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_op_market:0 "장마당 돈줄"
 TFRKPHN_nk_op_market_tt:0 "§Y장마당에 돈줄을 댄다§!\n장마당 상인들에게 돈과 물건을 댑니다. 배급에 기대지 않는\n사람이 늘어납니다.\n\n비용: £pol_power §Y20§!\n고른 지역 이반도 §G+10§!\n§g같은 지역에는 20일 동안 다시 쓸 수 없습니다. 다른 지역에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_mop_officer:0 "지휘관 포섭"
 TFRKPHN_nk_mop_officer_tt:0 "§Y지휘관에게 선을 댄다§!\n군단 지휘부의 장교에게 선을 대고 망명 길을 약속합니다.\n\n비용: £pol_power §Y25§!\n고른 군단 동요 §G+10§!\n§g같은 군단에는 20일 동안 다시 쓸 수 없습니다. 다른 군단에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_mop_speaker:0 "전선 확성기"
 TFRKPHN_nk_mop_speaker_tt:0 "§Y전선 확성기를 튼다§!\n휴전선의 확성기로 바깥 소식을 들려줍니다. 전방 군단에만\n닿습니다.\n\n비용: £pol_power §Y13§!\n고른 군단 동요 §G+6§!\n§g같은 군단에는 20일 동안 다시 쓸 수 없습니다. 다른 군단에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_mop_defect:0 "귀순 길"
 TFRKPHN_nk_mop_defect_tt:0 "§Y귀순 길을 연다§!\n넘어오는 병사를 받아 주고 그 소식을 다시 흘려보냅니다.\n\n비용: £pol_power §Y18§!\n고른 군단 동요 §G+8§!\n§g같은 군단에는 20일 동안 다시 쓸 수 없습니다. 다른 군단에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_mop_supply:0 "보급 실상 폭로"
 TFRKPHN_nk_mop_supply_tt:0 "§Y보급 실상을 흘린다§!\n간부들이 군량을 빼돌린다는 소식을 병사들에게 퍼뜨립니다.\n\n비용: £pol_power §Y15§!\n고른 군단 동요 §G+7§!\n§g같은 군단에는 20일 동안 다시 쓸 수 없습니다. 다른 군단에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_bop_pilot:0 "조종사 포섭"
 TFRKPHN_nk_bop_pilot_tt:0 "§Y조종사에게 선을 댄다§!\n고른 비행장의 조종사들에게 넘어올 길을 알립니다.\n\n비용: £pol_power §Y10§!\n고른 비행장의 동요 §G+25§!\n§g같은 비행장에는 20일 동안 다시 쓸 수 없습니다. 다른 비행장에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_bop_fuel:0 "연료 실상 폭로"
 TFRKPHN_nk_bop_fuel_tt:0 "§Y연료 실상을 흘린다§!\n항공유가 간부들의 차로 빠진다는 소식을 고른 비행장에\n퍼뜨립니다.\n\n비용: £pol_power §Y8§!\n고른 비행장의 동요 §G+18§!\n§g같은 비행장에는 20일 동안 다시 쓸 수 없습니다. 다른 비행장에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_bop_captain:0 "함장 포섭"
 TFRKPHN_nk_bop_captain_tt:0 "§Y함장에게 선을 댄다§!\n고른 기지의 함장들에게 넘어오면 신변을 지켜 주겠다고\n약속합니다.\n\n비용: £pol_power §Y10§!\n고른 기지의 동요 §G+25§!\n§g같은 기지에는 20일 동안 다시 쓸 수 없습니다. 다른 기지에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_bop_route:0 "귀순 뱃길"
 TFRKPHN_nk_bop_route_tt:0 "§Y귀순 뱃길을 알린다§!\n북방한계선 남쪽에서 받아 줄 자리를 고른 기지의 수병들에게\n알립니다.\n\n비용: £pol_power §Y8§!\n고른 기지의 동요 §G+18§!\n§g같은 기지에는 20일 동안 다시 쓸 수 없습니다. 다른 기지에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_hint:0 "§g민간은 이름표를, 군은 표지를 눌러 고른 뒤 아래 단추로 작전을 폅니다. 다른 곳을 고르면 같은 작전을 또 쓸 수 있습니다.§!"
 TFRKPHN_lee_nk_category:0 "북진통일 고토회복"
 TFRKPHN_lee_nk_category_desc:0 "위의 단추로 북한과 남한을 바꿔 봅니다. 북한 쪽에서는 체제를 흔들고, 남한 쪽에서는 우리 군의 전비 태세를 올립니다. 전비 태세가 오를수록 북한 육군 보기에 작전도가 그려집니다.\n\n북한 주민이 체제에서 돌아서야 체제가 바뀝니다. 민간은 지역마다 이반도를, 군은 군단마다 동요를 끌어올립니다. 민간과 군은 쓰는 수단이 다릅니다.\n\n§Y민간 평균 이반도§!가 오를수록 한국은 안정도(최대 §G+10%§!), 전쟁 지지도(§G+15%§!), 정치력 획득(§G+15%§!)을 얻고, 북한은 안정도와 전쟁 지지도를 잃습니다(최대 §G-20%§!).\n§Y민간 평균 이반도§!가 §Y75§!을 넘으면 북한에 국민정신 §R총체적 붕괴§!가 붙습니다.\n§Y육군, 공군, 해군의 동요§!가 오를수록 북한의 그 군종이 약해집니다. 동요가 35을 넘으면 전차, 전투기, 함정이 넘어옵니다."
 TFRKPHN_nk_collapse:0 "총체적 붕괴"
 TFRKPHN_nk_collapse_desc:0 "배급이 끊기고 명령이 내려가지 않습니다. 당도, 군도, 공장도 움직이지 않습니다. 주민은 체제에서 돌아섰습니다."
 tfrkphn.455.t:0 "총체적 붕괴"
 tfrkphn.455.d:0 "북한에서 올라오는 보고가 하루 사이에 달라졌습니다.\n\n도 당위원회는 평양의 지시에 답하지 않고, 공장은 멈췄으며 열차는 역에 선 채 움직이지 않습니다. 군부대의 식량 창고를 병사들이 털었다는 보고까지 올라오는데도 평양의 방송은 어제와 같은 말만 되풀이하고 있습니다."
 tfrkphn.455.a:0 "체제가 무너지고 있다"
 tfrkphn.455.tt:0 "북한이 국민정신 §Y총체적 붕괴§!를 얻습니다.\n안정도, 전쟁 지지도, 정치력, 군사력, 생산, 연구, 발전도가 모두 크게 떨어집니다."
 tfrkphn.456.t:0 "김정철의 망명"
 tfrkphn.456.d:0 "김정은의 형 김정철이 북한을 빠져나왔습니다.\n\n그는 권력에서 떨어져 지내던 사람으로, 바깥에는 에릭 클랩튼 공연장에서 찍힌 사진 정도로만 알려져 있었습니다. 그런 그가 제3국의 한국 대사관에 걸어 들어와 망명을 신청했는데도 평양은 아무 발표도 하지 않았습니다."
 tfrkphn.456.a:0 "서울에서 기자회견을 연다"
 tfrkphn.456.a_tt:0 "전쟁 지지도 §G+5%§!\n북한의 안정도와 전쟁 지지도가 §G-10%§! 됩니다.\n모든 군단의 동요가 §G+5§! 됩니다."
 tfrkphn.456.b:0 "조용히 보호한다"
 tfrkphn.456.b_tt:0 "북한의 안정도가 §G-10%§! 됩니다."
 TFRKPHN_nk_rn_hwn:0 "황해남도"
 TFRKPHN_nk_rn_gw:0 "강원도"
 TFRKPHN_nk_rn_none:0 "한 도"
 tfrkphn.457.t:0 "[TFRKPHN_nk_lost_name], 통제 불가"
 tfrkphn.457.d:0 "[TFRKPHN_nk_lost_name]에 주둔한 군단이 평양의 명령을 받지 않습니다.\n\n군단 지휘부는 총정치국에서 내려온 검열단을 부대 정문에서 돌려보냈고, 병사들이 도 보위부 청사를 에워싸자 보위원들은 무기를 내려놓았습니다. 도 경계의 초소마다 평양에서 오는 차를 막는 차단봉이 내려가 있어서, 평양은 그 도에 군대를 들여보내지 못하고 있습니다."
 tfrkphn.457.a:0 "북한이 갈라지기 시작했다"
 tfrkphn.457.tt:0 "§Y[TFRKPHN_nk_lost_name]§!의 이반도와 그곳 군단의 동요가 §G100§!이 됩니다.\n§Y[TFRKPHN_nk_lost_name]§!이 §Y비무장지대§!가 됩니다.\n북한의 안정도와 전쟁 지지도가 §G-10%§! 됩니다."
 TFRKPHN_nk_disobey:0 "명령 불복"
 TFRKPHN_nk_disobey_desc:0 "군단장들이 남으로 넘어갔습니다. 남은 지휘관들은 평양의 명령을 받고도 부대를 움직이지 않습니다."
 tfrkphn.458.t:0 "군단장들의 귀순"
 tfrkphn.458.d:0 "전방 군단의 지휘관들이 휴전선으로 걸어 나왔습니다.\n\n흰 천을 든 부관이 앞에 서고 군단장 둘과 사단장 여럿이 그 뒤를 따랐습니다. 그들이 가방째 넘긴 것은 작전 지도와 통신 암호였는데, 그 안에는 평양방어군단의 배치도도 들어 있었습니다."
 tfrkphn.458.a:0 "지도를 펼친다"
 tfrkphn.458.tt:0 "북한이 국민정신 §Y명령 불복§!을 얻습니다.\n우리 군 모든 부대의 전비 태세가 §G+20§! 됩니다."
 tfrkphn.459.t:0 "평양방어군단의 총격전"
 tfrkphn.459.d:0 "평양 한복판에서 총소리가 났습니다.\n\n평양방어군단의 한 여단이 호위사령부의 검문을 거부하면서 두 부대가 대동강 다리를 사이에 두고 밤새 총을 쏘았고, 아침에 길에 나온 평양 시민들은 불탄 장갑차를 보았습니다."
 tfrkphn.459.a:0 "평양도 안전하지 않다"
 tfrkphn.459.tt:0 "평양의 이반도가 §G+30§! 됩니다.\n평양방어군단의 동요가 §G100§!이 됩니다.\n북한의 안정도가 §G-10%§! 됩니다."
 tfrkphn.465.t:0 "검열단이 쫓겨났다"
 tfrkphn.465.d:0 "총정치국이 검열단을 내려보냈지만, 검열단은 부대 안으로 들어가지 못했습니다.\n\n위병소의 병사들이 총을 든 채 길을 막았고 지휘관은 끝내 나오지 않았습니다. 검열단장이 평양에 전화를 걸려고 하자 부대의 통신병이 선을 끊어 버려서, 검열단은 타고 온 차를 두고 걸어서 돌아갔습니다."
 tfrkphn.465.a:0 "군이 당의 말을 듣지 않는다"
 tfrkphn.465.tt:0 "동요가 §Y70§! 이상인 군단, 비행장, 기지에서는 검열이 실패했습니다.\n그곳의 동요가 내려가지 않고 §G+3§! 됩니다."
 tfrkphn.454.t:0 "단속하러 간 부대가 몰살당했다"
 tfrkphn.454.d:0 "보위부가 단속 부대를 보냈지만 그 부대는 돌아오지 못했습니다.\n\n장마당 상인들이 길을 막자 뒤따라온 주민들이 부대를 에워쌌습니다. 총소리가 한참 이어진 끝에 살아서 나온 보위원은 없었고, 평양은 그 지역에 단속 부대를 다시 보내지 못했습니다."
 tfrkphn.454.a:0 "이제 그들이 주민을 두려워한다"
 tfrkphn.454.tt:0 "이반도가 §Y70§! 이상인 지역에서는 단속이 실패했습니다.\n그 지역의 이반도가 내려가지 않고 §G+3§! 됩니다."
 TFRKPHN_nk_crackdown_mission:0 "보위부 단속"
 TFRKPHN_nk_crackdown_mission_desc:0 "북한 국가보위성이 지역마다 단속을 벌입니다."
 TFRKPHN_nk_crackdown_tt:0 "모든 지역의 이반도가 §R-3§! 됩니다.\n군단이 주둔한 지역은 군단 하나에 §R-1§! 더 내려갑니다 (최대 -2).\n이반도가 §Y70§! 이상인 지역에서는 단속이 실패하고 이반도가 §G+3§! 됩니다."
 TFRKPHN_nk_purge_mission:0 "총정치국 검열"
 TFRKPHN_nk_purge_mission_desc:0 "북한군 총정치국이 부대마다 사상 검열을 벌입니다."
 TFRKPHN_nk_purge_tt:0 "모든 군단의 동요가 §R-2§! 됩니다.\n평양방어군단과 11군단은 §R-4§! 됩니다.\n공군과 해군의 동요가 §R-2§! 됩니다.\n동요가 §Y70§! 이상인 곳에서는 검열이 실패하고 동요가 §G+3§! 됩니다."
 tfrkphn.298.t:0 "명령이 내려가지 않는다"
 tfrkphn.298.d:0 "평양에서 내려온 명령이 군단에서 멈췄습니다.\n\n지휘관 몇이 부대를 움직이지 않는 사이에, 병사들은 초소를 비우고 고향 쪽으로 걸어가기 시작했습니다."
 tfrkphn.298.a:0 "길이 열렸다"
 tfrkphn.298.tt:0 "북한의 안정도와 전쟁 지지도가 내려갔습니다."
 tfrkphn.441.t:0 "저항 조직의 소문"
 tfrkphn.441.d:0 "함흥의 장마당에서 소문이 돕니다.\n\n밤마다 벽보를 붙이는 사람들이 있다는데 이름도 얼굴도 아는 사람이 없습니다. 보위부는 벽보를 뗀 사람까지 잡아갔습니다."
 tfrkphn.441.a:0 "소문이 퍼지게 둔다"
 tfrkphn.441.a_tt:0 "모든 지역의 이반도가 §G+2§! 됩니다."
 tfrkphn.442.t:0 "자유조선의 마크"
 tfrkphn.442.d:0 "청진의 한 공장 담벼락에서 자유조선의 마크가 나왔습니다.\n\n보위원들이 새벽에 페인트로 덮었지만 덮은 자리가 오히려 더 눈에 띄었고, 출근하던 노동자들은 모두 그 앞을 지나갔습니다."
 tfrkphn.442.a:0 "누군가 안에 있다"
 tfrkphn.442.a_tt:0 "모든 지역의 이반도가 §G+3§! 됩니다."
 tfrkphn.447.t:0 "판문점을 넘은 병사"
 tfrkphn.447.d:0 "북한군 병사 한 명이 판문점 군사분계선을 넘었습니다.\n\n초소에서 뛰어나와 남쪽으로 달리는 그의 뒤에서 총소리가 났습니다. 쓰러진 그를 우리 경비대대가 끌어냈고, 그는 수술 끝에 목숨을 건졌습니다. 2017년 11월에도 북한군 병사 한 명이 총을 맞으며 이곳을 넘은 일이 있습니다."
 tfrkphn.447.a:0 "병사를 살려낸다"
 tfrkphn.447.a_tt:0 "모든 군단의 동요가 §G+3§! 됩니다."
 tfrkphn.443.t:0 "고위급의 귀순"
 tfrkphn.443.d:0 "북한의 고위 간부가 가족과 함께 제3국의 한국 대사관 문을 두드렸습니다.\n\n그의 가방에는 당 조직의 명단이 들어 있었고, 국가정보원은 그를 서울로 데려왔습니다."
 tfrkphn.443.a:0 "기자회견에 세운다"
 tfrkphn.443.a_tt:0 "모든 지역의 이반도가 §G+3§! 됩니다."
 tfrkphn.443.b:0 "조용히 정보를 받는다"
 tfrkphn.443.b_tt:0 "모든 군단의 동요가 §G+4§! 됩니다."
 tfrkphn.448.t:0 "국경경비대가 강을 건넜다"
 tfrkphn.448.d:0 "혜산의 국경경비대 한 개 분대가 압록강을 건넜습니다.\n\n탈북을 막는 일을 하던 병사들이 총을 강가에 두고 스스로 강을 건넌 것이어서, 평양은 국경의 경비 병력을 통째로 바꿨습니다."
 tfrkphn.448.a:0 "막던 사람들이 건넜다"
 tfrkphn.448.a_tt:0 "모든 지역의 이반도가 §G+2§! 됩니다.\n모든 군단의 동요가 §G+3§! 됩니다."
 tfrkphn.449.t:0 "외교관의 망명"
 tfrkphn.449.d:0 "유럽에 나가 있던 북한 외교관이 가족과 함께 사라졌습니다.\n\n며칠 뒤 서울에 나타난 그는 대사관이 외화벌이에 쓰던 계좌를 모두 넘겼습니다."
 tfrkphn.449.a:0 "그를 받아들인다"
 tfrkphn.449.a_tt:0 "모든 지역의 이반도가 §G+2§! 됩니다."
 tfrkphn.445.t:0 "북한에서 시위가 났다"
 tfrkphn.445.d:0 "신의주의 장마당에 사람들이 모였습니다.\n\n단속반이 한 상인의 쌀을 빼앗은 일이 시작이었는데, 수백 명이 인민위원회 건물 앞까지 걸어갔고 보위부가 총을 쏘고서야 흩어졌습니다."
 tfrkphn.445.a:0 "이 소식을 북한 전역에 알린다"
 tfrkphn.445.a_tt:0 "모든 지역의 이반도가 §G+4§! 됩니다.\n북한의 안정도가 §G-3%§! 됩니다."
 tfrkphn.446.t:0 "진압 부대가 돌아섰다는 소문"
 tfrkphn.446.d:0 "시위를 막으러 나간 부대가 총을 쏘지 않았다는 소문이 돕니다.\n\n지휘관이 발포 명령을 따르지 않았고 병사 몇은 아예 시위대 쪽에 섰다는 이야기입니다. 평양이 그 부대를 해산했지만 소문은 이미 다른 군단까지 번졌습니다."
 tfrkphn.446.a:0 "군이 흔들린다"
 tfrkphn.446.a_tt:0 "모든 군단의 동요가 §G+5§! 됩니다.\n북한의 전쟁 지지도가 §G-3%§! 됩니다."
 tfrkphn.450.t:0 "통제가 무너졌다"
 tfrkphn.450.d:0 "청진에서 보위부가 통제를 잃었습니다.\n\n시위대가 사흘 동안 도 인민위원회 앞을 차지하자 평양은 군을 보냈습니다. 장갑차가 광장으로 들어간 그날 밤 청진의 전화가 모두 끊겼고, 죽은 사람이 몇인지는 아무도 모릅니다."
 tfrkphn.450.a:0 "국제사회에 알린다"
 tfrkphn.450.a_tt:0 "모든 지역의 이반도가 §G+5§! 됩니다.\n북한의 안정도가 §G-5%§! 됩니다."
 tfrkphn.450.b:0 "방송으로 북한군 병사들에게 알린다"
 tfrkphn.450.b_tt:0 "모든 군단의 동요가 §G+4§! 됩니다.\n북한의 전쟁 지지도가 §G-5%§! 됩니다."
 tfrkphn.451.t:0 "주민들이 총을 들었다"
 tfrkphn.451.d:0 "양강도의 산골에서 주민들이 무기고를 털었습니다.\n\n그들은 보위부 지서를 습격한 뒤 산으로 들어갔는데, 진압하러 간 부대는 마을 사람들이 길을 알려 주지 않아서 사흘째 그들을 찾지 못하고 있습니다."
 tfrkphn.451.a:0 "그들에게 무전기를 보낸다"
 tfrkphn.451.a_tt:0 "모든 지역의 이반도가 §G+4§! 됩니다.\n모든 군단의 동요가 §G+4§! 됩니다.\n북한의 안정도가 §G-5%§! 됩니다."
 tfrkphn.451.b:0 "지켜본다"
 tfrkphn.451.b_tt:0 "모든 지역의 이반도가 §G+2§! 됩니다."
 tfrkphn.452.t:0 "전차가 넘어왔다"
 tfrkphn.452.d:0 "북한군 전차 한 대가 철원의 군사분계선을 넘었습니다.\n\n포신을 뒤로 돌린 채 넘어온 전차에서 승무원 넷이 해치를 열고 손을 들었고, 우리 군은 그 전차를 후방으로 옮겼습니다."
 tfrkphn.452.a:0 "전차를 넘겨받는다"
 tfrkphn.452.a_tt:0 "북한 전차 §Y1대§!를 얻습니다.\n모든 군단의 동요가 §G+3§! 됩니다.\n우리 육군 모든 부대의 전비 태세가 §G+5§! 됩니다."
 tfrkphn.444.t:0 "전투기가 넘어왔다"
 tfrkphn.444.d:0 "북한 공군의 전투기 한 대가 서해 위로 내려왔습니다.\n\n조종사가 날개를 좌우로 흔들자 우리 공군이 기체를 수원 기지로 이끌었습니다. 1996년에도 이철수 대위가 미그기를 몰고 넘어온 일이 있습니다."
 tfrkphn.444.a:0 "조종사를 맞이한다"
 tfrkphn.444.a_tt:0 "북한 전투기 §Y1대§!를 얻습니다.\n북한 공군의 동요가 §G+3§! 됩니다.\n우리 공군 모든 기지의 전비 태세가 §G+5§! 됩니다."
 tfrkphn.453.t:0 "바다 위의 반란"
 tfrkphn.453.d:0 "북한 해군의 함정 한 척이 동해 북방한계선을 넘었습니다.\n\n수병들이 함장과 정치지도원을 선실에 가두고는 흰 천을 걸고 속초로 뱃머리를 돌린 것이어서, 우리 해군이 함정을 항구까지 이끌었습니다."
 tfrkphn.453.a:0 "함정을 넘겨받는다"
 tfrkphn.453.a_tt:0 "북한 함정 §Y1척§!이 한국 해군으로 넘어옵니다.\n북한 해군의 동요가 §G+3§! 됩니다.\n우리 해군 모든 부대의 전비 태세가 §G+5§! 됩니다."
 TFRKPHN_nk_open_tt:0 "결정 창에 §Y북진통일 고토회복§! 탭이 다음 날 열립니다. 북한 쪽과 남한 쪽을 모두 쓸 수 있습니다."
 TFRKPHN_nk_kor:0 "북한 체제의 근본적 변화"
 TFRKPHN_nk_kor_desc:0 "북한 주민이 체제에서 돌아설수록 우리 국민은 통일이 가깝다고 느낍니다. 민간 평균 이반도에 비례합니다."
 TFRKPHN_nk_prk:0 "흔들리는 체제"
 TFRKPHN_nk_prk_desc:0 "주민이 체제에서 돌아서고 군이 흔들립니다. 안정도와 전쟁 지지도는 민간 평균 이반도에, 육군, 공군, 해군의 전투력은 군종마다의 동요에 비례합니다."
 tfrkphn.297.t:0 "체제가 흔들린다"
 tfrkphn.297.d:0 "북한 곳곳에서 같은 소식이 올라옵니다.\n\n배급소 앞의 줄이 사라지고 장마당이 그 자리를 대신했으며, 이제는 보위원이 지나가도 사람들이 하던 말을 멈추지 않는다고 합니다."
 tfrkphn.297.a:0 "때가 가까워졌다"
