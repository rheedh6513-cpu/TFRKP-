 TFRKPHN_nk_v_tt:0 "지도에 무엇을 보일지 고릅니다: 이반도, 육군 군단, 공군 비행장, 해군 기지.\n\n§g부대 배치는 보도 그래픽과 공개 지도를 참고한 것이고 자리는 대략적입니다. 육군은 국방부 2022 국방백서를 인용한 그래픽을 따랐습니다.§!"
