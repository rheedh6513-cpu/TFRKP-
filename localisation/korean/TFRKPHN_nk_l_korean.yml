l_korean:
 # 이인제 정부 북한 체제의 근본적 변화 탭. nk_build.py가 만든다. 내용은 nk_data.py에서 고친다.
 TFRKPHN_nk_pn_hb:0 "§Y함북§!\n[?TFRKPHN_nk_d_hb|0]"
 TFRKPHN_nk_tt_hb:0 "§Y함경북도§!\n이반도 [?TFRKPHN_nk_d_hb|0]\n\n도 소재지는 청진입니다. 두만강을 사이에 두고 중국, 러시아와\n맞닿아 있습니다. 탈북민 가운데 이곳 출신이 가장 많습니다.\n\n§R주둔: 9군단§!\n§g단속 때 이반도가 더 내려갑니다.§!\n\n§g국경 지역: 탈북 길목을 넓힐 수 있습니다.§!"
 TFRKPHN_nk_pn_ns:0 "§Y나선§!\n[?TFRKPHN_nk_d_ns|0]"
 TFRKPHN_nk_tt_ns:0 "§Y나선§!\n이반도 [?TFRKPHN_nk_d_ns|0]\n\n두만강 하구의 경제 특구입니다. 1991년에 자유경제무역지대로\n지정됐습니다.\n\n§g국경 지역: 탈북 길목을 넓힐 수 있습니다.§!"
 TFRKPHN_nk_pn_yg:0 "§Y양강§!\n[?TFRKPHN_nk_d_yg|0]"
 TFRKPHN_nk_tt_yg:0 "§Y양강도§!\n이반도 [?TFRKPHN_nk_d_yg|0]\n\n도 소재지는 혜산입니다. 압록강 건너가 중국이고, 백두산이 이\n도에 있습니다.\n\n§R주둔: 12군단§!\n§g단속 때 이반도가 더 내려갑니다.§!\n\n§g국경 지역: 탈북 길목을 넓힐 수 있습니다.§!"
 TFRKPHN_nk_pn_jg:0 "§Y자강§!\n[?TFRKPHN_nk_d_jg|0]"
 TFRKPHN_nk_tt_jg:0 "§Y자강도§!\n이반도 [?TFRKPHN_nk_d_jg|0]\n\n도 소재지는 강계입니다. 산이 깊고 군수 공장이 모여\n있습니다.\n\n§g국경 지역: 탈북 길목을 넓힐 수 있습니다.§!"
 TFRKPHN_nk_pn_pb:0 "§Y평북§!\n[?TFRKPHN_nk_d_pb|0]"
 TFRKPHN_nk_tt_pb:0 "§Y평안북도§!\n이반도 [?TFRKPHN_nk_d_pb|0]\n\n도 소재지는 신의주입니다. 압록강 다리 건너가 중국\n단둥입니다.\n\n§R주둔: 8군단§!\n§g단속 때 이반도가 더 내려갑니다.§!\n\n§g국경 지역: 탈북 길목을 넓힐 수 있습니다.§!"
 TFRKPHN_nk_pn_hn:0 "§Y함남§!\n[?TFRKPHN_nk_d_hn|0]"
 TFRKPHN_nk_tt_hn:0 "§Y함경남도§!\n이반도 [?TFRKPHN_nk_d_hn|0]\n\n도 소재지는 함흥입니다. 북한에서 손꼽히는 공업 도시입니다.\n\n§R주둔: 7군단§!\n§g단속 때 이반도가 더 내려갑니다.§!"
 TFRKPHN_nk_pn_pn:0 "§Y평남§!\n[?TFRKPHN_nk_d_pn|0]"
 TFRKPHN_nk_tt_pn:0 "§Y평안남도§!\n이반도 [?TFRKPHN_nk_d_pn|0]\n\n도 소재지는 평성입니다. 평양을 둘러싸고 있고 큰 장마당이\n있습니다.\n\n§R주둔: 11군단 (폭풍군단), 3군단§!\n§g단속 때 이반도가 더 내려갑니다.§!"
 TFRKPHN_nk_pn_py:0 "§Y평양§!\n[?TFRKPHN_nk_d_py|0]"
 TFRKPHN_nk_tt_py:0 "§Y평양§!\n이반도 [?TFRKPHN_nk_d_py|0]\n\n수도입니다. 출신 성분을 가려 뽑은 사람만 살 수 있습니다.\n가장 흔들기 어려운 곳입니다.\n\n§R주둔: 평양방어군단§!\n§g단속 때 이반도가 더 내려갑니다.§!\n\n§g평양은 모든 작전의 효과가 절반입니다.§!"
 TFRKPHN_nk_pn_hwb:0 "§Y황북§!\n[?TFRKPHN_nk_d_hwb|0]"
 TFRKPHN_nk_tt_hwb:0 "§Y황해북도§!\n이반도 [?TFRKPHN_nk_d_hwb|0]\n\n도 소재지는 사리원입니다. 평양과 개성을 잇는 길목입니다.\n\n§R주둔: 2군단§!\n§g단속 때 이반도가 더 내려갑니다.§!"
 TFRKPHN_nk_pn_hwn:0 "§Y황남§!\n[?TFRKPHN_nk_d_hwn|0]"
 TFRKPHN_nk_tt_hwn:0 "§Y황해남도§!\n이반도 [?TFRKPHN_nk_d_hwn|0]\n\n도 소재지는 해주입니다. 북한에서 가장 큰 곡창 지대입니다.\n\n§R주둔: 4군단§!\n§g단속 때 이반도가 더 내려갑니다.§!"
 TFRKPHN_nk_pn_gw:0 "§Y강원§!\n[?TFRKPHN_nk_d_gw|0]"
 TFRKPHN_nk_tt_gw:0 "§Y강원도§!\n이반도 [?TFRKPHN_nk_d_gw|0]\n\n도 소재지는 원산입니다. 금강산이 이 도에 있고 휴전선을 끼고\n있습니다.\n\n§R주둔: 10군단, 1군단, 5군단§!\n§g단속 때 이반도가 더 내려갑니다.§!"
 TFRKPHN_nk_pn_ks:0 "§Y개성§!\n[?TFRKPHN_nk_d_ks|0]"
 TFRKPHN_nk_tt_ks:0 "§Y개성§!\n이반도 [?TFRKPHN_nk_d_ks|0]\n\n휴전선 바로 북쪽의 도시입니다. 2004년부터 개성공단이\n가동됐고 2016년에 멈췄습니다."
 TFRKPHN_nk_mk_c9_tt:0 "§Y9군단§!\n동요 [?TFRKPHN_nk_m_c9|0]\n\n함경북도 청진 일대\n\n§g함경북도에 주둔합니다.§!"
