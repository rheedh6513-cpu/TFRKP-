 TFRKPHN_cho_kf0_desc:0 "물가 상승률이 일흔 퍼센트를 넘습니다."
 TFRKPHN_cho_kf1:0 "웃는 구청장"
 TFRKPHN_cho_kf1_desc:0 "서울시장 재선거에서 야당이 크게 이깁니다."
 TFRKPHN_cho_kf2:0 "안에서 나온 사람"
