 TFRKPHN_cho_kh4:0 "서울시장 재선거"
 TFRKPHN_cho_kh4_desc:0 "서울을 야당에게 내줍니다."
 TFRKPHN_cho_kh5:0 "시민의 다리"
 TFRKPHN_cho_kh5_desc:0 "쿠데타의 밤이 국경일이 됩니다."
