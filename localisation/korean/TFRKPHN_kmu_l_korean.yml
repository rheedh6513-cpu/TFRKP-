 TFRKPHN_cho_k24:0 "가정의 나라"
 TFRKPHN_cho_k24_desc:0 "아이를 넷 낳은 어머니는 평생 소득세를 내지 않습니다."
 TFRKPHN_cho_k25:0 "다리와 공항"
 TFRKPHN_cho_k25_desc:0 "바다를 건너는 다리를 놓습니다. 금리는 낮아야 합니다."
