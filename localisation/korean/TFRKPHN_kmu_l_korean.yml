l_korean:
 # [안내] 김문수 줄기의 중점과 사건. kmu_build.py가 만든다.
 tfrkphn.7284.t:0 "새해 첫 떡국"
 tfrkphn.7284.d:0 "한 해의 마지막 날 정오, 방송사들은 예고 없이 대통령 담화를 내보냈다. 조원진은 임기를 일 년 남기고 물러난다고 말했고, 건국 대통령이 물러나며 남긴 말로 담화를 맺었다. 담화는 십 분 만에 끝났다.\n\n헌법에 따라 김문수 총리가 그 시각부터 대통령 권한대행이 됐다. 그는 젊은 날 노동 운동을 하다 감옥에 갔고, 그 뒤 보수 정당으로 옮겨 경기도지사를 두 번 지냈다. 운동권 시절의 동료들은 그를 배신자라고 불렀고, 그는 그 말에 한 번도 대꾸하지 않았다.\n\n그는 권한대행으로서 첫 문서에 서명한 뒤 청와대를 나섰다. 자정에 그가 간 곳은 구로의 한 공장이었다. 그는 스무 살 무렵 이런 공장에서 학력을 숨기고 일했다. 야간조 노동자들은 처음에 그를 알아보지 못했다. 그는 그 시절 노조를 만들다 해고된 적이 있었다.\n\n그는 공장 식당에서 노동자들과 떡국을 먹었다. 방송은 그 장면을 새해 첫 뉴스로 내보냈다. 한 노동자가 옛날 공장의 임금이 얼마였느냐고 물었고, 그는 그 숫자를 정확히 기억해 말했다. 식당에는 웃음이 터졌다."
 tfrkphn.7284.a:0 "떡국을 먹는다."
 tfrkphn.7285.t:0 "압승"
 tfrkphn.7285.d:0 "김문수는 조기 대선과 총선을 같은 날 치르자고 국회에 제안했다. 국회는 반대할 명분을 찾지 못했다. 선거 운동 기간에 그는 하루에 시장 다섯 곳을 돌았다. 그는 연설 대신 상인들과 국밥을 먹었고, 그 사진이 날마다 인터넷에 올라왔다.\n\n야당은 일곱 갈래로 갈라져 있었다. 포격과 탄핵을 두고 서로를 탓하느라 후보를 하나로 모으지 못했다. 공장 지대와 대학가에서 여당 표가 쏟아졌다. 노동 운동가 출신이라는 이력은 노동자들에게, 반공의 언어는 청년 전역병들에게 함께 먹혔다. 금속 노조 위원장 몇이 지지를 선언했다.\n\n그는 대선에서 58퍼센트를 얻었다. 여당은 국회의 3분의 2를 넘는 의석을 가져갔다. 외국 선거 감시단은 투표와 개표에서 부정을 찾지 못했다고 발표했다. 다만 방송 시간과 선거 비용이 한쪽으로 크게 기울었다는 한 줄을 보고서 끝에 붙였다.\n\n당선 소감에서 그는 이번 선거를 투표함 안의 혁명이라고 불렀다. 그는 국민이 낡은 체제를 끝내라고 명령했다고 말했다. 그날 밤 여당 당사 앞에는 청년들이 모여 그의 이름을 불렀다."
 tfrkphn.7285.a:0 "투표함 안의 혁명."
 tfrkphn.7286.t:0 "새 기본법"
 tfrkphn.7286.d:0 "새 국회는 첫 해에 헌법을 처음부터 다시 썼다. 3분의 2 의석이 있었으므로 야당의 동의는 필요하지 않았다. 새 헌법의 이름은 기본법이었고, 전문에는 가정과 신앙과 민족이 나라의 바탕이라고 적혔다.\n\n판사의 정년은 일흔에서 예순둘로 내려갔다. 그 조항 하나로 대법관과 법원장 사백여 명이 한 해 안에 물러났다. 헌법재판관의 수는 아홉에서 열다섯으로 늘었고, 새로 생긴 자리는 국회가 채웠다.\n\n선거법도 바뀌었다. 선거구는 다시 그려졌고, 이긴 쪽에 의석을 더 얹어 주는 조항이 생겼다. 외국에 사는 동포들에게는 우편 투표가 허락됐다. 동포 단체들은 정부가 보낸 기념품을 받고 감사 편지를 보냈다. 노동 조합의 단체 협약은 손대지 않았다.\n\n야당은 헌법재판소에 소송을 냈다. 소송은 새로 임명된 재판관들에게 배당됐다. 김문수는 기자들에게 국민이 준 3분의 2를 쓰지 않는 것이야말로 국민을 배신하는 일이라고 말했다. 그는 새 헌법이 공포되는 날 서명에 쓴 펜을 국회 기념관에 보냈다. 야당 대표는 판결을 기다리지 않고 거리로 나갔다."
 tfrkphn.7286.a:0 "펜을 기념관에 보낸다."
 tfrkphn.7287.t:0 "친구들의 신문"
 tfrkphn.7287.d:0 "정부는 신문사를 닫지 않았다. 대신 광고를 옮겼다. 공기업과 정부 부처의 광고는 정부에 우호적인 신문으로만 갔다. 정부를 비판하던 신문 두 곳은 광고가 끊긴 지 여덟 달 만에 매물로 나왔다.\n\n신문사를 사들인 사람들은 대통령과 오래 알고 지낸 건설 회사와 가스 회사의 주인들이었다. 그들은 지역 방송과 인터넷 언론도 사들였다. 두 해가 지나자 나라 안 언론사의 절반이 그들의 손에 들어갔다. 공단 지역 방송과 노동 조합 신문 몇 곳도 그 가운데 있었다.\n\n셋째 해 가을에 주인들은 가진 언론사 사백여 곳을 한꺼번에 한 재단에 기부했다. 정부는 이 기부를 국가 전략 사안으로 정해 공정거래 심사에서 뺐다. 재단의 이사장은 대통령의 오랜 선거 참모였다.\n\n비판 기사는 여전히 나왔다. 독자가 낸 돈으로 꾸리는 작은 인터넷 매체 몇 곳이 남았다. 그들의 기사는 대도시 청년들 사이에서 돌았지만, 지방의 텔레비전에는 나오지 않았다. 김문수는 이 나라에 언론의 자유가 있다고 말했다. 그 말을 반박하는 기사도 인터넷에는 실렸다."
 tfrkphn.7287.a:0 "재단에 이사장이 선다."
 tfrkphn.7288.t:0 "가정의 나라"
 tfrkphn.7288.d:0 "출산율이 0.6까지 떨어진 해에 정부는 가정 지원법을 냈다. 아이를 넷 낳은 어머니는 평생 소득세를 내지 않는다. 결혼한 부부에게는 무이자 대출을 주고, 셋째 아이가 태어나면 남은 빚을 모두 없애 준다. 다둥이 가정에는 승합차 값을 보탰다. 공장 노동자 부부가 가장 많이 신청했다.\n\n학교의 일부는 교회와 성당, 절이 맡게 됐다. 정부는 종교 재단이 운영하는 학교에 운영비를 더 얹어 주었고, 그런 학교는 다섯 해 만에 두 배로 늘었다. 김문수는 주말마다 다른 교회에서 예배를 드렸다.\n\n법은 학교에서 가르칠 수 있는 가족의 모양도 정했다. 교과서에서 몇 쪽이 빠졌고, 몇몇 교사는 수업 자료 때문에 징계를 받았다. 인권 단체들은 그 조항을 성소수자를 지우는 법이라고 불렀다.\n\n젊은 부부들의 계산은 달랐다. 대출을 받은 부부들은 신혼집을 구했고, 셋째를 낳은 집은 빚을 갚지 않아도 됐다. 이듬해 출생아 수가 이십여 년 만에 처음으로 늘었다. 통계청의 발표가 나온 날 김문수는 한 산부인과를 찾아 신생아실 유리창 앞에 오래 서 있었다."
 tfrkphn.7288.a:0 "신생아실 앞에 선다."
 tfrkphn.7289.t:0 "다리와 공항"
 tfrkphn.7289.d:0 "김문수는 도지사 시절부터 길을 놓는 일을 좋아했다. 대통령이 된 뒤 그는 서해의 만을 건너는 다리와 가덕도의 새 공항, 수도권 땅속의 급행 철도를 한꺼번에 착공했다. 공사는 대개 언론사를 사들인 그 회사들이 맡았다.\n\n공사에는 돈이 들었고, 정부는 돈을 빌리기 쉽게 하려고 금리를 낮추라고 한국은행에 요구했다. 총재는 물가가 오른다며 거절했다. 대통령은 그를 해임했다. 다음 총재도 같은 말을 했고 같은 길을 갔다. 세 번째 총재는 금리를 낮췄다.\n\n그해 원화 가치는 절반으로 떨어졌다. 수입 물가가 먼저 올랐고, 그다음에 모든 것이 올랐다. 마트의 가격표는 일주일에 두 번 바뀌었다. 김문수는 높은 금리가 서민을 죽이는 고리대금이라고 말했고, 물가는 외국 투기 세력의 공격 탓이라고 했다.\n\n서해의 다리는 예정보다 일 년 일찍 개통했다. 개통식 날 대통령은 첫 차를 직접 몰고 다리를 건넜다. 다리 위에서 그는 차를 세우고 바다를 내려다보았다. 그날 저녁 뉴스의 두 번째 소식은 라면값이 다시 오른다는 것이었다."
 tfrkphn.7289.a:0 "첫 차를 몰고 다리를 건넌다."
 tfrkphn.7290.t:0 "쿠데타의 밤"
 tfrkphn.7290.d:0 "여름밤 열한 시, 한강 다리 두 곳에 전차가 올라섰다. 국영 방송에는 군복을 입은 장교가 나와 군이 헌정 질서를 회복하기 위해 나라를 장악했다는 성명을 읽었다. 대통령은 그때 남해안의 휴양지에 있었다.\n\n자정 무렵 한 민영 방송의 앵커가 생방송 중에 자기 전화기를 카메라 앞에 들었다. 화면 속 작은 화면에 대통령의 얼굴이 보였다. 김문수는 영상 통화로 국민에게 거리로 나와 달라고 말했다. 통화는 일 분이 조금 넘었다. 앵커의 손은 떨리고 있었다.\n\n사람들이 거리로 나왔다. 교회들은 밤중에 종을 울렸고, 택시 기사들은 경적을 울리며 다리로 달려갔다. 공단의 노동자들은 야간조 작업복을 입은 채 버스를 타고 다리로 갔다. 시민들이 전차 앞에 누웠고, 몇몇 병사는 전차에서 내려 시민들에게 끌려 나왔다. 그날 밤 이백여 명이 죽었다.\n\n새벽 네 시, 대통령이 탄 비행기가 김포에 내렸다. 쿠데타는 아침이 오기 전에 무너졌다. 대통령은 공항에서 이 일이 하늘이 내린 선물이라고 말했다. 그 말이 무엇을 뜻하는지는 그다음 주에 드러났다."
 tfrkphn.7290.a:0 "김포에 내린다."
 tfrkphn.7291.t:0 "대통령제 국민투표"
 tfrkphn.7291.d:0 "쿠데타가 실패한 다음 주에 정부는 비상사태를 선포했다. 석 달 동안 장교와 판사, 교사, 공무원 육만여 명이 직장에서 쫓겨났다. 정부는 그들이 쿠데타를 꾸민 군 안의 비밀 모임과 이어져 있다고 발표했다. 명단 가운데에는 쿠데타가 일어나기 전에 이미 작성된 것도 있었다.\n\n비상사태가 이어지는 동안 정부는 개헌안을 국민투표에 부쳤다. 총리직을 없애고, 대통령이 장관과 판사를 직접 임명하고, 명령으로 법을 대신할 수 있게 하는 개헌이었다. 대통령은 그날 밤 같은 위험을 막으려면 한 사람이 책임을 져야 한다고 말했다.\n\n투표 날 저녁 개표는 밤늦게까지 엎치락뒤치락했다. 대도시에서는 반대가 많았고 지방과 공단에서는 찬성이 많았다. 개표 도중 선거관리위원회는 도장이 찍히지 않은 투표용지도 유효로 세겠다고 발표했다.\n\n개헌안은 51.4퍼센트로 통과됐다. 야당은 무효표 문제로 소송을 냈고 소송은 기각됐다. 김문수는 그날 밤 쿠데타 때 시민들이 누웠던 다리 위에서 지지자들에게 손을 흔들었다. 다리의 이름은 그 주에 시민의 다리로 바뀌었다."
 tfrkphn.7291.a:0 "다리 위에서 손을 흔든다."
 tfrkphn.7292.t:0 "네 번째 압승"
 tfrkphn.7292.d:0 "기본법 아래에서 치른 네 번째 총선이었다. 야당들은 처음으로 후보를 하나로 모았다. 왼쪽 끝의 정당부터 탄핵 때 갈라져 나온 보수 정당까지 여섯 당이 한 명단에 이름을 올렸다. 그 명단에는 노동 운동 시절 김문수의 동료도 있었다.\n\n정부는 선거 석 달 전에 청년 정착금을 한 번 더 올렸고, 공공 주택 추첨을 앞당겼다. 지방의 텔레비전은 날마다 다리와 공항의 개통 소식을 내보냈다. 야당 후보의 유세는 인터넷 매체에만 나왔다.\n\n여당은 다시 3분의 2를 얻었다. 득표율은 오십 퍼센트가 조금 넘었지만, 다시 그린 선거구와 이긴 쪽에 얹어 주는 의석이 나머지를 채웠다. 공단 지역에서는 여당이 칠십 퍼센트를 넘게 가져갔다. 외국 감시단의 보고서에는 자유로웠지만 공정하지 않았다는 문장이 들어갔다.\n\n김문수는 승리 연설에서 이 나라가 자유주의 밖에서도 민주주의를 할 수 있다는 것을 보여 주었다고 말했다. 대도시 청년들은 그날 밤 인터넷에 검은 화면을 올렸다. 지방의 청년들은 당사 앞에서 그의 이름을 불렀다."
 tfrkphn.7292.a:0 "당사의 불을 켠다."
 tfrkphn.7293.t:0 "도쿄에 묻지 않는다"
 tfrkphn.7293.d:0 "태평양방위조약기구 사무국은 한국에 보낼 공동 개발 기금의 절반을 묶었다. 사무국은 법원의 독립과 언론의 다양성이 회복될 때까지 기금을 풀지 않겠다고 밝혔다. 기금은 다리와 공항 공사의 큰 몫을 대던 돈이었다.\n\n정부는 다음 달 전국에 광고판을 세웠다. 광고판에는 도쿄의 관료들이 한국의 아이들에게 무엇을 가르칠지 정하려 한다고 적혔다. 국민 설문지가 집집마다 우편으로 갔다. 설문의 질문은 다섯 개였고, 모두 예라고 답하기 쉬운 문장이었다. 설문지는 공장 휴게실에도 붙었다.\n\n김문수는 조약에서 나가지 않았다. 그는 회의에 빠짐없이 나갔고, 회원국들이 만장일치로 정해야 하는 안건마다 마지막까지 서명을 미뤘다. 사무국은 그때마다 한국과 따로 협상해야 했다.\n\n묶였던 기금의 일부는 이듬해 풀렸다. 정부는 그 소식을 승리라고 발표했다. 도쿄의 신문은 한국이 동맹 안의 골칫거리가 됐다고 썼고, 서울의 지방 방송은 그 기사를 인용하며 대통령이 나라의 주권을 지켰다고 전했다. 공단 지역의 노조 신문도 같은 기사를 실었다."
 tfrkphn.7293.a:0 "서명을 미룬다."
 tfrkphn.7294.t:0 "등을 돌린 학생들"
 tfrkphn.7294.d:0 "새 학기 첫날 정부는 서울의 한 국립대학에 새 총장을 임명했다. 그 학교는 오랫동안 교수들이 총장을 뽑아 왔다. 새 총장은 여당 비례대표 후보 명단에 이름이 올랐던 경영학자였다. 그는 취임사에서 학교가 공단과 손잡아야 한다고 말했다.\n\n취임식 날 학생 이천여 명이 본관 앞에 모였다. 그들은 소리를 지르지 않았다. 새 총장이 본관으로 들어오자 학생들은 일제히 돌아서서 등을 보였다. 교수들도 몇이 학생들 옆에 서서 등을 돌렸다.\n\n학생들은 그 뒤로 날마다 정오에 본관 앞에서 등을 돌리고 섰다. 경찰은 미신고 집회라며 몇 명을 연행했고, 정부는 그 학교에 새 학과 두 곳을 만들어 총장이 직접 교수를 뽑게 했다. 교수 몇이 사표를 내고 외국 대학으로 옮겼다.\n\n넉 달 뒤 정오의 대열은 백 명 남짓으로 줄었다. 졸업반 학생들은 취업을 준비했다. 김문수는 기자들에게 학교도 국민의 세금으로 운영되니 국민이 뽑은 정부가 책임을 진다고 말했다. 공단에서 일하는 학생들의 부모는 대개 대통령 편이었다. 백 명은 겨울에도 정오마다 섰다."
 tfrkphn.7294.a:0 "정오가 지나간다."
 tfrkphn.7295.t:0 "신생아실"
 tfrkphn.7295.d:0 "가정 지원법이 시행된 지 다섯 해째, 통계청은 합계 출산율이 0.6에서 0.9로 올랐다고 발표했다. 혼인 건수는 그보다 더 빨리 늘었다. 외국 신문들은 이 숫자를 두고 다투었다. 한쪽은 정책의 성공이라고 했고, 다른 쪽은 결혼을 미루던 세대가 한꺼번에 몰린 것이라고 했다.\n\n지방 소도시의 산부인과 몇 곳이 다시 문을 열었다. 문을 닫았던 초등학교 분교 두 곳에는 다시 입학생이 들어왔다. 입학식에는 군수와 교회 목사가 나란히 앉았다. 공단 근처의 어린이집에는 대기 명단이 생겼다.\n\n셋째를 낳고 대출을 면제받은 한 부부는 방송에 나와 대통령에게 감사하다고 말했다. 부부는 맞벌이였다. 같은 주에 한 여성 단체는 아이를 낳지 않는 여성을 세금으로 벌하는 나라가 됐다는 성명을 냈다. 두 이야기는 같은 날 저녁 뉴스에 차례로 나왔다.\n\n김문수는 그해 성탄절에 신생아 백 명의 부모에게 손으로 쓴 카드를 보냈다. 카드에는 이 아이들이 나라의 앞날이라고 적혀 있었다. 카드를 받은 부모 가운데 몇은 그것을 액자에 넣어 거실에 걸었다."
 tfrkphn.7295.a:0 "카드를 보낸다."
 tfrkphn.7296.t:0 "서울시장 재선거"
 tfrkphn.7296.d:0 "지방선거에서 서울시장 자리를 야당이 가져갔다. 표 차이는 만삼천 표였다. 당선자는 서른여덟 살의 전직 구청장이었고, 선거 운동 내내 웃는 얼굴로 다녀 사람들은 그를 웃는 구청장이라고 불렀다. 그는 버스 노조 위원장 출신이었다.\n\n여당은 개표 과정에 문제가 있다며 이의를 냈다. 선거관리위원회는 넉 달 뒤 선거를 무효로 하고 다시 치르라고 결정했다. 결정문은 투표함 관리 위원 몇 사람이 공무원이 아니었다는 이유를 들었다.\n\n재선거 날 서울의 투표율은 처음보다 높았다. 야당 후보는 팔십만 표 차이로 이겼다. 개표가 끝나자 김문수는 방송에 나와 결과를 축하한다고 말했다. 여당 안에서는 재선거를 밀어붙인 사람을 찾아 책임을 묻는 목소리가 나왔다. 공단 지역의 구청장 선거에서는 여당이 모두 이겼다.\n\n새 시장은 시청 앞 광장의 허가제를 풀었다. 정부는 그 결정을 막지 않았다. 서울의 광장에는 다시 사람이 모였지만, 지방의 표는 움직이지 않았다. 노동자들의 표는 여전히 대통령 쪽에 있었다. 대통령의 다음 선거는 세 해 뒤였다."
 tfrkphn.7296.a:0 "광장의 허가제가 풀린다."
 tfrkphn.7297.t:0 "시민의 다리"
 tfrkphn.7297.d:0 "쿠데타의 밤은 국경일이 됐다. 해마다 그날 밤이면 시민의 다리에 사람들이 모였다. 다리 난간에는 그날 죽은 이백여 명의 사진이 걸렸고, 자정에는 교회의 종이 울렸다.\n\n대통령은 해마다 다리 위에서 연설했다. 연설은 그날 밤 거리로 나온 사람들에게 감사하는 말로 시작해, 아직 숨어 있는 배신자들이 있다는 말로 끝났다. 그 주가 되면 새 해임 명단이 관보에 실렸다. 연설의 맨 앞줄에는 그날 밤 버스를 타고 온 공단 노동자들이 앉았다.\n\n해임된 교사 가운데 한 사람은 다섯 해째 복직 소송을 하고 있었다. 그는 쿠데타가 일어난 날 밤 학생들과 수련회에 가 있었다. 그의 이름이 명단에 오른 까닭은 그가 열 해 전에 가입한 한 독서 모임 때문이었다. 그 모임은 노동법을 읽는 모임이었다.\n\n그날 밤 다리 위에는 해임된 교사도 있었다. 그는 난간에 걸린 사진들 앞에 꽃을 놓았다. 그 가운데에는 그가 가르쳤던 제자의 사진도 있었다. 제자는 그날 밤 전차 앞에 누웠다. 교사는 사진 앞에 오래 서 있었다. 경찰은 그를 막지 않았다."
 tfrkphn.7297.a:0 "자정의 종이 울린다."
 tfrkphn.7298.t:0 "선거가 있는 나라"
 tfrkphn.7298.d:0 "김문수 정부는 네 번의 총선과 세 번의 대선에서 이겼습니다. 선거는 정해진 날에 열렸고, 개표는 투명했습니다. 투표소 앞에는 해마다 긴 줄이 섰습니다. 공단의 투표소에는 교대 시간에 맞춰 버스가 다녔습니다.\n\n아이를 셋 낳은 부부는 빚을 갚지 않아도 됐고, 다리와 공항은 예정보다 일찍 문을 열었습니다. 물가는 오르고 내리기를 되풀이했지만, 지방의 텔레비전은 그 이유를 늘 바다 건너에서 찾았습니다. 공장 노동자들은 그를 자기들 출신의 대통령이라고 불렀고, 그는 해마다 노동절에 공장 식당에서 점심을 먹었습니다.\n\n판사는 국회가 고른 사람이었고, 신문은 대통령의 친구들이 가진 재단이 냈습니다. 대학 본관 앞에는 정오마다 몇십 명이 등을 돌리고 섰습니다. 야당은 서울을 가졌지만 나라를 가지지는 못했습니다.\n\n사람들은 투표했고, 그는 이겼습니다. 선거 때마다 공단의 표는 그에게 돌아왔습니다. 이 나라는 언제든 투표할 수 있는 나라였습니다. 다만 그 투표로 바꿀 수 있는 것은 해마다 조금씩 줄어들었습니다."
 tfrkphn.7298.a:0 "투표소의 줄이 길다."
 tfrkphn.7299.t:0 "가격표"
 tfrkphn.7299.d:0 "물가 상승률이 일흔 퍼센트를 넘은 달, 대형 마트들은 종이 가격표를 떼고 전자 가격표를 달았다. 하루에 두 번 숫자를 바꾸기 위해서였다. 시장 상인들은 가격표 대신 칠판에 분필로 값을 적었다.\n\n정부는 물가를 잡겠다며 양파와 감자를 싸게 파는 공영 매장을 열었다. 매장 앞에는 새벽부터 줄이 섰다. 줄에는 청년이 많았다. 월세와 교통비가 월급보다 빨리 오르면서 청년들의 저축이 먼저 바닥났다. 공장의 임금 협상은 한 해에 두 번 열렸고, 두 번 모두 물가를 따라가지 못했다.\n\n김문수는 금리를 올리지 않겠다고 다시 말했다. 그는 금리를 올리는 것은 서민의 목을 조르는 일이라고 했고, 물가는 바다 건너 투기 세력이 원화를 공격한 결과라고 했다. 경제부총리는 그 발표 다음 날 사표를 냈다. 노조 위원장들은 대통령에게 면담을 청했다.\n\n한국은행 앞에서 대학생들이 처음으로 시위를 했다. 그들은 정착금 통장을 들고 나왔다. 통장에 찍힌 숫자는 세 해 전과 같았지만, 그 돈으로 살 수 있는 것은 절반이 되어 있었다."
 tfrkphn.7299.a:0 "칠판에 값을 고쳐 적는다."
 tfrkphn.7300.t:0 "웃는 구청장"
 tfrkphn.7300.d:0 "지방선거에서 서울시장 자리를 야당이 가져갔다. 당선자는 서른여덟 살의 전직 구청장이었다. 그는 선거 운동 내내 웃는 얼굴로 다녀 사람들은 그를 웃는 구청장이라고 불렀다. 표 차이는 만삼천 표였다. 그는 버스 노조 위원장 출신이었다.\n\n선거관리위원회는 여당의 이의를 받아들여 선거를 무효로 했다. 재선거 날 서울의 투표율은 처음보다 높았다. 웃는 구청장은 팔십만 표 차이로 이겼다. 부산과 대구, 공단 도시 두 곳에서도 야당 시장이 나왔다.\n\n김문수는 이번에는 축하한다고 말하지 않았다. 검찰은 새 시장이 대학 졸업장을 위조했다는 고발을 접수했다. 고발장을 낸 사람은 여당 청년 조직의 간부였다. 시장은 스무 해 전 졸업 앨범을 들고 기자 회견을 했고, 그 사진이 인터넷에서 삼백만 번 공유됐다.\n\n그해 여론 조사에서 웃는 구청장은 다음 대선 후보 가운데 처음으로 대통령을 앞질렀다. 그는 대선에는 나가지 않겠다고 말했다. 야당은 그 말을 믿지 않았고, 여당도 믿지 않았다. 공단 노동자들의 표가 움직이기 시작했다는 분석이 나왔다."
 tfrkphn.7300.a:0 "졸업 앨범이 공유된다."
 tfrkphn.7301.t:0 "안에서 나온 사람"
 tfrkphn.7301.d:0 "여당의 중진 변호사 한 사람이 방송에 나와 당을 떠난다고 말했다. 그는 마흔다섯 살이었고, 대통령의 재단에서 법률 고문을 지냈다. 그는 재단 이사회의 회의록 일부를 들고 나왔다. 회의록에는 다리 공사의 하청 회사들 이름이 적혀 있었다.\n\n그는 새 당을 만들었다. 당 이름은 짧았고, 깃발은 태극기 하나뿐이었다. 그는 자신이 여전히 보수라고 말했다. 가정 지원법도, 다리도 그대로 두겠다고 했다. 다만 판사와 신문을 대통령의 친구들에게서 돌려받겠다고 했다.\n\n그는 여름 내내 걸어서 지방을 돌았다. 하루에 마을 셋을 걸었고, 마을 회관에서 잤다. 여당 지지자가 많은 군 단위 마을에서도 사람들이 그를 보러 나왔다. 그는 공장 정문 앞에서 교대하는 노동자들과 악수했다. 그들은 대통령을 미워하지 않았지만, 장바구니가 가벼워진 것은 알고 있었다.\n\n정부의 방송은 그를 배신자라고 불렀다. 그 말은 김문수가 젊은 날 운동권 동료들에게서 들었던 말과 같았다. 김문수는 기자들이 그 이야기를 꺼내자 대답하지 않고 회의장으로 들어갔다."
 tfrkphn.7301.a:0 "마을 회관에서 잔다."
 tfrkphn.7302.t:0 "돌아선 청년들"
 tfrkphn.7302.d:0 "가을 여론 조사에서 서른 살 아래의 여당 지지율은 처음으로 이십 퍼센트 아래로 떨어졌다. 몇 해 전 광장 앞줄을 채웠던 세대였다. 그들 가운데 많은 수가 정착금을 받았고, 공공 주택 추첨에 붙었다.\n\n그러나 월세가 두 배가 됐고, 공단의 월급은 물가를 따라가지 못했다. 정착금으로 산 중고차는 기름값 때문에 주차장에 서 있었다. 결혼 대출을 받으려던 연인들은 집값을 보고 날짜를 미뤘다. 잔업은 줄었고, 공장들은 신규 채용을 멈췄다.\n\n한 전역병 단체가 성명을 냈다. 그들은 쿠데타의 밤에 다리로 달려간 사람들이었다. 성명은 짧았다. 그날 우리가 지키려 한 것은 투표함이었다는 문장으로 시작했고, 그 투표함을 다시 지키겠다는 문장으로 끝났다. 그 단체의 회원 절반은 공장 노동자였다.\n\n대학가의 술집에서는 다시 정치 이야기가 나왔다. 여당 청년 조직의 단체 대화방은 그해 겨울 조용해졌다. 마지막으로 올라온 글은 여당에서 나온 변호사가 여는 걷기 행사의 출발 시각이었다. 공단의 노조 사무실에서도 같은 이야기가 나왔다."
 tfrkphn.7302.a:0 "대화방이 조용해진다."
 tfrkphn.7303.t:0 "한 명단"
 tfrkphn.7303.d:0 "총선을 반년 앞두고 야당들은 후보를 하나로 모았다. 서울의 웃는 구청장과 여당에서 나온 변호사가 같은 무대에 섰다. 두 사람은 누가 명단 맨 위에 설지를 두고 사흘 동안 협상했고, 변호사가 맨 위에 섰다. 변호사는 첫 연설을 공단 정문 앞에서 했다.\n\n정부는 선거 석 달 전에 정착금을 한 번 더 올리고 공공 주택 추첨을 앞당겼다. 재단의 방송은 날마다 야당이 이기면 가정 지원법이 없어진다고 전했다. 야당은 그 법을 그대로 두겠다는 약속을 광고로 냈다. 노총은 이번에는 지지 선언을 하지 않았다.\n\n여론 조사는 엇갈렸다. 정부 쪽 조사 기관은 여당이 열 점 앞선다고 했고, 독립 조사 기관은 야당이 앞선다고 했다. 외국 감시단은 처음으로 투표소 일만 곳에 참관인을 보내겠다고 했다.\n\n투표 전날 밤 변호사는 마지막 유세를 시청 앞 광장에서 했다. 그 광장은 웃는 구청장이 허가제를 풀어 둔 곳이었다. 그날 밤 광장에 모인 사람의 수는 쿠데타의 밤에 다리로 나온 사람보다 많았다. 광장에는 작업복을 입은 사람들도 있었다."
 tfrkphn.7303.a:0 "광장에 사람이 찬다."
 tfrkphn.7304.t:0 "개표의 밤"
 tfrkphn.7304.d:0 "투표율은 팔십 퍼센트를 넘었다. 개표 방송은 저녁 여덟 시에 시작했다. 아홉 시 반, 지방 소도시들의 개표가 먼저 끝났다. 여당이 늘 이기던 곳에서 표 차이가 한 자릿수로 줄어 있었다. 공단 지역의 투표소 몇 곳에서는 야당이 처음으로 이겼다.\n\n열 시가 넘자 대도시의 표가 들어왔다. 야당 명단은 3분의 2에 가까운 의석을 얻었다. 재단의 방송은 한동안 다른 소식을 내보냈다. 대통령실 대변인은 기자실에 나오지 않았다. 노조 위원장들은 그날 밤 전화를 받지 않았다.\n\n열한 시에 김문수가 직접 방송에 나왔다. 그는 국민의 뜻을 받아들인다고 말했다. 야당의 승리를 축하했고, 새 국회와 함께 일하겠다고 했다. 연설은 사 분이었다. 그는 연설 끝에 젊은 날 노동 운동을 하며 배운 것은 결과를 받아들이는 일이었다고 덧붙였다.\n\n시청 앞 광장에서는 사람들이 서로를 껴안았다. 여당 당사 앞에서는 청년 몇이 깃발을 접었다. 외국 감시단은 이튿날 아침 이번 선거가 자유로웠고 대체로 공정했다고 발표했다. 공단의 술집은 늦게까지 문을 열었다."
 tfrkphn.7304.a:0 "깃발을 접는다."
 tfrkphn.7305.t:0 "인정"
 tfrkphn.7305.d:0 "§Y[칼럼] 김문수의 실패는 보수의 실패다§!\n\n김문수 대통령이 오늘 청와대를 나와 경기도의 옛집으로 내려갔다. 국회가 낸 개헌안은 칠십 퍼센트가 넘는 찬성으로 통과됐다. 다음 대선까지 나라를 맡을 과도 총리는 포격 때 체포됐던 우원식 전 국회의장이다.\n\n헌법 제1조 2항은 모든 권력이 국민으로부터 나온다고 적었다. 김문수는 이 조항을 투표함 하나로 읽었다. 선거에서 이기면 판사를 갈고 신문사의 주인을 바꿔도 된다고 믿었다. 다수결은 자유민주주의의 도구일 뿐이다. 자유민주주의의 몸통은 법치와 독립된 법원이다.\n\n그는 노동 운동가 출신이다. 공단에서 고문을 견딘 사람이 대통령이 되어 교사와 판사 육만 명을 쫓아냈다. 반공을 내걸고 언론을 사들인 정권은 공산주의자들이 바라던 일을 대신 해 주었다.\n\n김문수는 개헌안을 막지 않았다. 국민투표 날 투표소 줄에 서서 표를 냈고, 어느 쪽에 찍었는지는 끝내 말하지 않았다. 그가 대통령으로서 한 일 가운데 가장 옳은 일이다. 보수가 다시 일어서려면 이날에서 출발해야 한다."
 tfrkphn.7305.a:0 "경기도의 옛집으로 간다. ([GetDateText])"
 TFRKPHN_cho_k21:0 "압승"
 TFRKPHN_cho_k21_desc:0 "조기 대선과 총선을 같은 날 치릅니다. 투표함 안에서 혁명을 일으킵니다."
 TFRKPHN_cho_k22:0 "새 기본법"
 TFRKPHN_cho_k22_desc:0 "3분의 2 의석으로 헌법과 선거법을 다시 씁니다."
