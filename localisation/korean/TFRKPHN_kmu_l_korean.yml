 TFRKPHN_cho_kf5_desc:0 "대통령이 패배를 인정합니다."
 TFRKPHN_cho_kf6:0 "인정"
 TFRKPHN_cho_kf6_desc:0 "대통령은 경기도의 옛집으로 내려갑니다."
 tfrkphn.7172.b:0 "김문수를 지명한다."
 TFRKPHN_kmu_route_tt:0 "§Y김문수§!가 후계자가 됩니다. 김진태 대신 §Y김문수 줄기§!가 열립니다."
 TFRKPHN_kjt_route_tt:0 "§Y김진태§!가 후계자가 됩니다."
 TFRKPHN_kmu_acting_tt:0 "§Y김문수§!가 대통령 권한대행이 됩니다."
 TFRKPHN_kmu_stake_tt:0 "안정도가 §Y45%§!를 넘으면 정권이 버티는 엔딩 가지가, 넘지 못하면 무너지는 엔딩 가지가 열립니다."
 TFRKPHN_trait_leader_kmu:0 "투표함의 대통령"
 TFRKPHN_kmu_desc:0 "§Y투표함의 대통령§!\n\n김문수는 대한민국의 대통령입니다.\n\n그는 서울대학교에서 두 번 제적되었고, 미싱 공장에 위장 취업해 노동 운동을 시작했습니다. 1970년대와 80년대에 그는 공단의 노조를 이끌었고, 두 번 감옥에 갔습니다. 붙잡혀 있는 동안 구타와 전기 고문을 받았지만 동지들의 이름을 대지 않았습니다.\n\n1994년 그는 보수 정당에 들어갔습니다. 옛 동지들은 그를 등 돌린 사람으로 기억했습니다. 그는 보수의 불모지라던 부천에서 국회의원을 세 번 지냈고, 경기도지사를 두 번 지냈습니다. 도지사 시절에는 수도권 땅속에 급행철도를 놓자는 계획을 내놓았습니다.\n\n도지사에서 물러난 뒤 그는 선거에서 잇달아 졌고, 광화문 집회의 연단에 서는 날이 늘었습니다. 조원진은 그 연단에서 그를 다시 만났고, 자기 정부의 마지막 총리로 불렀습니다. 조원진이 물러나자 그는 권한대행이 되었고 조기 선거에서 압승했습니다. 공단의 노동자들과 탄핵 이후 오른쪽으로 돌아선 청년들이 함께 그의 이름을 적었습니다.\n\n대통령이 된 뒤에도 그는 한 달에 한 번 새벽에 공단 정문에 섭니다. 노조 위원장들은 약속 없이 그의 집무실에 들어갈 수 있는 몇 안 되는 사람들입니다. 그의 정부에 반대하는 사람들은 그 위원장들이 먼저 등을 돌리는 날을 기다립니다.\n\n그는 선거에서 이기는 것으로 나라를 바꿀 수 있다고 믿습니다. 그의 정부는 투표함을 지키면서 투표함 밖의 것들을 하나씩 바꾸어 갑니다."
