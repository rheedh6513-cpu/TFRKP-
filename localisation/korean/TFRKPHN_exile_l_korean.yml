l_korean:
 # 망명 기업 유치 탭. exile_build.py가 만든다.
 TFRKPHN_oh_exile_category:0 "망명 기업 유치"
 TFRKPHN_oh_exile_category_desc:0 "제2차 미국 내전으로 미대륙은 초토화됐고, 그곳에 본사를 두었던 회사들은 대륙을 포기했습니다. 세계 곳곳에 남은 지사와 공장, 연구소는 본사 없이 그 나라에 남았고 사실상 나라마다 나눠 가진 셈이 됐습니다. 우리 땅에 남은 몫과 건너온 사람들을 메가시티 권역에 정식으로 앉힙니다. 회사마다 갈 권역이 다르고, 그 권역이 충분히 자라 있어야 합니다.\n\n지금까지 유치한 회사: §Y[?TFRKPHN_ex_n|0]§!곳\n국내 기업의 불만: §R[?TFRKPHN_ex_gripe|0]§! (3에 닿으면 역차별 논란이 벌어집니다)"
 TFRKPHN_ex_d1:0 "오픈AI의 남은 기반 (수도권)"
 TFRKPHN_ex_d1_desc:0 "샌프란시스코에서 시작한 인공지능 연구 회사입니다. 본사가 있던 도시는 내전에 휩쓸렸고, 연구자들은 여러 나라로 흩어졌습니다. 우리나라로 건너온 연구 조직을 수도권의 새 산업 단지에 정식으로 앉힙니다."
 TFRKPHN_ex_need1_tt:0 "§Y수도권§! 메가시티가 §Y2단계§! 이상 (지금 §Y[?TFRKPHN_mega_s1|0]§!단계)"
 TFRKPHN_ex_d1_tt:0 "§Y오픈AI§!의 남은 기반이 §Y수도권§!에 자리를 잡습니다.\n연구 속도 §G+3§!"
 tfrkphn.681.t:0 "오픈AI, 수도권에 자리 잡다"
 tfrkphn.681.d:0 "오픈AI의 이름을 단 연구소가 수도권에 문을 열었습니다. 샌프란시스코의 본사는 더 없습니다. 내전을 피해 건너온 연구자들이 이곳에서 일을 이어 갑니다.\n\n같은 이름을 쓰는 조직이 다른 나라에도 남아 있지만 서로 지시를 주고받지는 않습니다. 우리 대학과 연구소에서 뽑힌 사람들이 그 건물로 출근하기 시작했습니다."
 TFRKPHN_ex_d2:0 "구글의 남은 기반 (충청권)"
 TFRKPHN_ex_d2_desc:0 "캘리포니아 마운틴뷰에 본사를 두었던 검색과 인공지능 회사입니다. 본사가 기능을 잃은 뒤 나라마다 있던 지사와 데이터 센터는 그 나라에 그대로 남았습니다. 한국에 남은 조직을 충청권에 모아 연구소와 데이터 센터를 짓게 합니다."
 TFRKPHN_ex_need2_tt:0 "§Y충청권§! 메가시티가 §Y2단계§! 이상 (지금 §Y[?TFRKPHN_mega_s2|0]§!단계)"
 TFRKPHN_ex_d2_tt:0 "§Y구글§!의 남은 기반이 §Y충청권§!에 자리를 잡습니다.\n연구 속도 §G+2§!\n충청에 §Y업무 지구§! §G1개§!와 건물 칸"
 tfrkphn.682.t:0 "구글, 충청권에 자리 잡다"
 tfrkphn.682.d:0 "구글의 한국 조직이 충청권에 연구소와 데이터 센터를 열었습니다. 대전의 연구 단지와 세종의 정부 청사 사이에 자리를 잡았습니다.\n\n마운틴뷰에서 내려오던 지시는 끊긴 지 오래입니다. 서버와 사람, 그리고 우리 말로 쌓인 자료가 이 땅에 남았고 이제 우리 법에 따라 움직입니다. 새 업무 지구에는 협력사들도 따라 들어오고 있습니다."
 TFRKPHN_ex_d3:0 "테슬라의 남은 기반 (호남권)"
 TFRKPHN_ex_d3_desc:0 "전기차와 배터리를 만들던 회사입니다. 미국 안의 공장은 멈췄고, 나라 밖의 공장과 설계 인력은 있던 자리에 남았습니다. 우리나라로 온 기술자들과 한국에 있던 조직을 묶어 호남권에 조립 공장을 세웁니다."
 TFRKPHN_ex_need3_tt:0 "§Y호남권§! 메가시티가 §Y3단계§! 이상 (지금 §Y[?TFRKPHN_mega_s3|0]§!단계)"
 TFRKPHN_ex_d3_tt:0 "§Y테슬라§!의 남은 기반이 §Y호남권§!에 자리를 잡습니다.\n소득 성장 §G+1§!\n전라에 §Y산업 단지§! §G1개§!와 건물 칸"
 tfrkphn.683.t:0 "테슬라, 호남권에 자리 잡다"
 tfrkphn.683.d:0 "테슬라의 이름을 단 조립 공장이 호남권에 섰습니다. 미국의 공장들이 멈춘 뒤 우리나라로 건너온 기술자들이 생산 설비를 다시 짰습니다. 광주의 자동차 부품 회사들이 첫 납품 계약을 맺었습니다.\n\n호남권 메가시티에 들어선 에너지 농장의 전기가 이 공장으로 갑니다. 광주와 전남에서는 오랜만에 큰 규모의 생산직 채용 공고가 났습니다."
 TFRKPHN_ex_d4:0 "엔비디아의 남은 기반 (대구경북)"
 TFRKPHN_ex_d4_desc:0 "캘리포니아 샌타클래라에서 그래픽 처리 장치를 설계하던 반도체 회사입니다. 설계만 하고 생산은 남에게 맡기던 회사여서, 본사가 사라진 뒤에는 설계자들이 간 곳이 곧 회사가 됐습니다. 우리나라로 온 설계 조직을 대구경북에 앉힙니다."
 TFRKPHN_ex_need4_tt:0 "§Y대구경북§! 메가시티가 §Y3단계§! 이상 (지금 §Y[?TFRKPHN_mega_s4|0]§!단계)"
 TFRKPHN_ex_d4_tt:0 "§Y엔비디아§!의 남은 기반이 §Y대구경북§!에 자리를 잡습니다.\n기업 가치 §G+3§!\n대구에 §Y산업 단지§! §G1개§!와 건물 칸"
 tfrkphn.684.t:0 "엔비디아, 대구경북에 자리 잡다"
 tfrkphn.684.d:0 "엔비디아의 설계 조직이 대구경북에 센터를 열었습니다. 구미의 전자 산업 단지와 대구의 대학들이 가까이 있다는 점이 이유로 꼽혔습니다.\n\n샌타클래라의 본사는 문을 닫았고 설계 자산은 설계자들이 흩어진 나라마다 나뉘어 있습니다. 우리 몫으로 남은 설계는 우리 반도체 회사들의 공장에서 생산하기로 했습니다."
 TFRKPHN_ex_d5:0 "보잉의 남은 기반 (부울경)"
 TFRKPHN_ex_d5_desc:0 "시애틀에서 시작한 항공기 회사입니다. 내전으로 조립 공장이 멈추자 세계 곳곳의 정비 거점과 부품 공장은 본사 없이 남았습니다. 한국에 있던 정비 조직과 건너온 기술자들을 경남 사천 가까이에 모읍니다."
 TFRKPHN_ex_need5_tt:0 "§Y부울경§! 메가시티가 §Y3단계§! 이상 (지금 §Y[?TFRKPHN_mega_s5|0]§!단계)"
 TFRKPHN_ex_d5_tt:0 "§Y보잉§!의 남은 기반이 §Y부울경§!에 자리를 잡습니다.\n경남에 §Y군수 공장§! §G2개§!와 건물 칸"
 tfrkphn.685.t:0 "보잉, 부울경에 자리 잡다"
 tfrkphn.685.d:0 "보잉의 이름을 단 조립과 정비 공장이 경남에 문을 열었습니다. 사천에 모여 있는 우리 항공기 회사들이 부품을 대기로 했습니다.\n\n시애틀의 조립 공장은 멈춘 지 오래입니다. 세계의 항공사들은 가까운 나라에 남은 거점에 정비를 맡기고 있고, 동아시아에서는 이 공장이 그 일을 합니다. 전쟁 동안 정비를 미뤄 둔 우리 군용기들도 이곳에서 손을 보게 됩니다."
 TFRKPHN_ex_d6:0 "골드만삭스의 남은 기반 (수도권)"
 TFRKPHN_ex_d6_desc:0 "뉴욕에서 시작한 투자은행입니다. 월가가 기능을 잃은 뒤 런던과 홍콩, 도쿄의 지점들은 저마다 그 나라의 금융사가 되어 가고 있습니다. 서울 지점과 그 고객 자산을 여의도와 용산의 업무 지구에 앉힙니다."
 TFRKPHN_ex_need6_tt:0 "§Y수도권§! 메가시티가 §Y4단계§! 이상 (지금 §Y[?TFRKPHN_mega_s1|0]§!단계)"
 TFRKPHN_ex_d6_tt:0 "§Y골드만삭스§!의 남은 기반이 §Y수도권§!에 자리를 잡습니다.\n기업 가치 §G+2§!, 소득 성장 §G+2§!\n서울에 §Y업무 지구§! §G1개§!와 건물 칸"
 tfrkphn.686.t:0 "골드만삭스, 수도권에 자리 잡다"
 tfrkphn.686.d:0 "골드만삭스 서울 지점이 독립 법인이 되어 수도권의 새 업무 지구로 옮겼습니다. 뉴욕 본사와의 결산은 내전이 터진 뒤 한 번도 이루어지지 못했습니다.\n\n다른 나라의 지점들도 같은 길을 가고 있습니다. 한 회사였던 조직이 나라마다 하나씩의 금융사로 남은 셈입니다. 원화로 거래되는 채권과 주식의 양이 눈에 띄게 늘었습니다."
 TFRKPHN_ex_d7:0 "마이크로소프트의 남은 기반 (호남권)"
 TFRKPHN_ex_d7_desc:0 "워싱턴주 레드먼드에 본사를 두었던 소프트웨어와 클라우드 회사입니다. 본사가 멈춘 뒤 나라마다 있던 데이터 센터는 그 나라가 맡아 돌리고 있습니다. 한국의 데이터 센터와 개발 조직을 재생 에너지 단지가 있는 호남권에 모읍니다."
 TFRKPHN_ex_need7_tt:0 "§Y호남권§! 메가시티가 §Y4단계§! 이상 (지금 §Y[?TFRKPHN_mega_s3|0]§!단계)"
 TFRKPHN_ex_d7_tt:0 "§Y마이크로소프트§!의 남은 기반이 §Y호남권§!에 자리를 잡습니다.\n연구 속도 §G+2§!\n전라에 §Y업무 지구§! §G1개§!와 건물 칸"
 tfrkphn.691.t:0 "마이크로소프트, 호남권에 자리 잡다"
 tfrkphn.691.d:0 "마이크로소프트의 한국 조직이 호남권에 데이터 센터와 개발 조직을 열었습니다. 호남권 메가시티의 에너지 농장에서 나오는 전기를 통째로 사들이는 계약이 함께 맺어졌습니다.\n\n레드먼드가 멈춘 뒤로 우리 관공서와 회사의 자료는 주인 없는 서버에 얹혀 있었습니다. 이제 그 서버를 우리 땅의 회사가 책임집니다."
 TFRKPHN_ex_d8:0 "화이자의 남은 기반 (충청권)"
 TFRKPHN_ex_d8_desc:0 "뉴욕에서 시작한 제약 회사입니다. 내전으로 본사와 연구소가 흩어졌고, 나라 밖의 공장들은 가진 허가와 기술로 생산을 이어 가고 있습니다. 한국 조직과 건너온 연구자들을 충청권 오송에 모읍니다."
 TFRKPHN_ex_need8_tt:0 "§Y충청권§! 메가시티가 §Y4단계§! 이상 (지금 §Y[?TFRKPHN_mega_s2|0]§!단계)"
 TFRKPHN_ex_d8_tt:0 "§Y화이자§!의 남은 기반이 §Y충청권§!에 자리를 잡습니다.\n학문 발전 §G+0.002§! (달마다)\n충청에 §Y산업 단지§! §G1개§!와 건물 칸"
 tfrkphn.692.t:0 "화이자, 충청권에 자리 잡다"
 tfrkphn.692.d:0 "화이자의 이름을 단 연구소와 생산 시설이 충청권에 문을 열었습니다. 오송의 바이오 단지 안, 보건 당국의 청사에서 멀지 않은 자리입니다.\n\n뉴욕의 본사가 사라진 뒤 약의 허가와 제조 기술은 공장이 있는 나라마다 따로 남았습니다. 우리 몫으로 남은 품목은 이곳에서 만듭니다. 약학 대학의 연구실에는 공동 연구 제안이 들어오고 있습니다."
 TFRKPHN_ex_d9:0 "록히드마틴의 남은 기반 (대구경북)"
 TFRKPHN_ex_d9_desc:0 "메릴랜드에 본사를 두었던 방위 산업 회사입니다. 우리 공군의 주력 전투기 여럿이 이 회사의 것입니다. 본사의 생산 라인이 멈춘 뒤 운용국들은 저마다 가진 도면과 설비로 기체를 고쳐 쓰고 있습니다. 한국에 있던 정비 조직과 건너온 기술자들을 대구경북에 모읍니다."
 TFRKPHN_ex_need9_tt:0 "§Y대구경북§! 메가시티가 §Y4단계§! 이상 (지금 §Y[?TFRKPHN_mega_s4|0]§!단계)"
 TFRKPHN_ex_d9_tt:0 "§Y록히드마틴§!의 남은 기반이 §Y대구경북§!에 자리를 잡습니다.\n경상에 §Y군수 공장§! §G2개§!와 건물 칸"
 tfrkphn.693.t:0 "록히드마틴, 대구경북에 자리 잡다"
 tfrkphn.693.d:0 "록히드마틴의 이름을 단 생산과 정비 시설이 대구경북에 문을 열었습니다. 구미와 그 둘레에 모여 있는 우리 방산 업체들이 협력사로 들어갔습니다.\n\n본사의 생산 라인이 멈춘 뒤 이 회사의 기체를 쓰는 나라들은 부품을 스스로 만들어야 했습니다. 우리도 그 가운데 하나였고, 이제 그 부품의 상당수가 우리 땅에서 나옵니다."
 TFRKPHN_ex_d10:0 "아마존의 남은 기반 (부울경)"
 TFRKPHN_ex_d10_desc:0 "시애틀에 본사를 두었던 전자 상거래와 물류 회사입니다. 태평양을 건너던 물류망은 끊겼고, 나라마다 있던 창고와 배송망은 그 나라 안에서 따로 돌아갑니다. 동아시아에 남은 물류 조직을 부울경의 항만에 모읍니다."
 TFRKPHN_ex_need10_tt:0 "§Y부울경§! 메가시티가 §Y4단계§! 이상 (지금 §Y[?TFRKPHN_mega_s5|0]§!단계)"
 TFRKPHN_ex_d10_tt:0 "§Y아마존§!의 남은 기반이 §Y부울경§!에 자리를 잡습니다.\n기업 가치 §G+2§!, 소득 성장 §G+1§!\n부산에 §Y산업 단지§! §G1개§!와 건물 칸"
 tfrkphn.694.t:0 "아마존, 부울경에 자리 잡다"
 tfrkphn.694.d:0 "아마존의 동아시아 물류 조직이 부울경에 본부를 열었습니다. 부산의 항만 배후 단지에 창고가 들어섰고, 그 옆으로 배송을 맡을 회사들이 따라 들어오고 있습니다.\n\n시애틀에서 짜던 물류망은 대륙마다 잘려 나갔고, 잘린 조각은 그것이 놓인 나라가 이어받았습니다. 우리 중소 업체들의 물건이 이 창고를 거쳐 나라 밖으로 나가기 시작했습니다."
 TFRKPHN_ex_d11:0 "애플의 남은 기반 (수도권)"
 TFRKPHN_ex_d11_desc:0 "캘리포니아 쿠퍼티노에 본사를 두었던 회사입니다. 전화기와 컴퓨터를 설계하고 생산은 아시아의 공장에 맡겨 왔습니다. 두 해를 버티던 설계 조직이 마침내 대륙을 떠났고, 부품을 대던 우리 회사들 곁으로 오려 합니다."
 TFRKPHN_ex_need11_tt:0 "§Y수도권§! 메가시티가 §Y5단계§! 이상 (지금 §Y[?TFRKPHN_mega_s1|0]§!단계)"
 TFRKPHN_ex_d11_tt:0 "§Y애플§!의 남은 기반이 §Y수도권§!에 자리를 잡습니다.\n기업 가치 §G+3§!\n서울에 §Y업무 지구§! §G1개§!와 건물 칸"
 tfrkphn.6811.t:0 "애플, 수도권에 자리 잡다"
 tfrkphn.6811.d:0 "애플의 설계 조직이 수도권에 자리를 잡았습니다. 쿠퍼티노에서 두 해를 버티다 떠나온 사람들입니다.\n\n이 회사의 전화기에 들어가는 화면과 반도체는 오래전부터 우리 회사들이 만들어 왔습니다. 설계하는 사람과 부품을 만드는 사람이 처음으로 같은 나라에서 일하게 됐습니다."
 TFRKPHN_ex_d12:0 "인텔의 남은 기반 (충청권)"
 TFRKPHN_ex_d12_desc:0 "캘리포니아 샌타클래라에 본사를 두었던 반도체 회사입니다. 설계와 생산을 한 회사 안에서 해 왔고, 그 공장들이 내전 한가운데에 놓여 있었습니다. 떠나온 공정 기술자들을 충청권의 산업 단지에 모읍니다."
 TFRKPHN_ex_need12_tt:0 "§Y충청권§! 메가시티가 §Y5단계§! 이상 (지금 §Y[?TFRKPHN_mega_s2|0]§!단계)"
 TFRKPHN_ex_d12_tt:0 "§Y인텔§!의 남은 기반이 §Y충청권§!에 자리를 잡습니다.\n연구 속도 §G+1§!\n충청에 §Y산업 단지§! §G2개§!와 건물 칸"
 tfrkphn.6812.t:0 "인텔, 충청권에 자리 잡다"
 tfrkphn.6812.d:0 "인텔의 이름을 단 연구소와 시험 생산 시설이 충청권에 문을 열었습니다. 미국의 공장을 두 해 동안 지키다 떠나온 공정 기술자들이 주축입니다.\n\n장비는 가져오지 못했습니다. 그들이 가져온 것은 공정을 다루는 손과 머리였고, 우리 반도체 회사들이 가장 먼저 이들을 찾아왔습니다."
 tfrkphn.695.t:0 "샘 알트만, 서울에 남다"
 tfrkphn.695.d:0 "샘 알트만이 서울에 정착했습니다. 수도권에 문을 연 연구소의 책임자 자리를 맡았습니다.\n\n그는 1985년 시카고에서 태어나 세인트루이스 교외에서 자랐습니다. 스탠퍼드에서 컴퓨터과학을 공부하다 두 해 만에 그만두고 2005년에 루프트라는 회사를 세웠습니다. 2014년부터 2019년까지 창업 지원 기관 와이콤비네이터의 사장을 지냈고, 2015년 오픈AI를 함께 세운 뒤 2019년에 최고경영자가 됐습니다.\n\n연구소 쪽은 그가 우리나라에 장기 체류 자격을 신청했다고 밝혔습니다. 돌아갈 날짜는 정해 두지 않았다고 합니다."
 tfrkphn.695.a:0 "환영합니다."
 TFRKPHN_ex_p695_tt:0 "§Y망명 기업§! 변동치: 연구 속도 §G+1§!"
 tfrkphn.696.t:0 "젠슨 황, 대구에 오다"
 tfrkphn.696.d:0 "젠슨 황이 대구경북의 설계 센터에 합류했습니다. 샌타클래라의 본사가 문을 닫은 뒤의 일입니다.\n\n그는 1963년 대만 타이난에서 태어나 1972년에 미국으로 건너갔습니다. 오리건 주립대에서 전기공학을 공부했고 1992년 스탠퍼드에서 석사 학위를 받았습니다. AMD와 LSI 로직에서 일한 뒤 1993년에 크리스 말라초프스키, 커티스 프리엠과 함께 엔비디아를 세웠고 그때부터 줄곧 최고경영자였습니다.\n\n그가 맡은 일은 세 나라를 잇는 것입니다. 태평양 방위 조약기구가 회원국 사이의 기술 이전과 인력 이동을 보장하면서 길이 열렸습니다. 설계는 한국에서 하고, 생산은 전쟁을 버텨 낸 대만의 공장이, 소재와 장비는 일본이 맡습니다. 그는 세 곳 가운데 하나라도 빠지면 칩이 나오지 않는다고 말했다고 합니다."
 tfrkphn.696.a:0 "환영합니다."
 TFRKPHN_ex_p696_tt:0 "§Y망명 기업§! 변동치: 기업 가치 §G+1§!"
 TFRKPHN_ex_wait_tt:0 "§Y60일§! 동안 협상과 공사가 이어지고, 그동안 §Y민간 공장 1개§!가 여기에 묶입니다."
 TFRKPHN_ex_gripe_tt:0 "국내 기업의 불만 §R+1§!"
 TFRKPHN_ex_ok:0 "이제 이 땅의 회사입니다."
 TFRKPHN_exile_corps:0 "망명 기업"
 TFRKPHN_exile_corps_desc:0 "미대륙을 포기한 회사들이 남긴 기반 가운데 우리 몫이 이 땅에서 연구하고 물건을 만듭니다."
 tfrkphn.687.t:0 "역차별 논란"
 tfrkphn.687.d:0 "망명 기업에 주는 혜택을 두고 국내 기업들의 불만이 터져 나왔습니다. 땅값을 깎아 주고 세금을 미뤄 주는 조건이 우리 회사들에는 없다는 것입니다.\n\n경제 단체들은 같은 날 성명을 냈습니다. 외국 회사를 부르는 일에는 반대하지 않지만, 같은 권역에 먼저 들어와 있던 회사들이 더 비싼 값을 치르고 있다는 내용이었습니다. 국회에서도 여야를 가리지 않고 질의가 이어지고 있습니다."
 tfrkphn.687.a:0 "국내 기업에도 같은 조건을 줍니다."
 tfrkphn.687.b:0 "조건은 그대로 둡니다."
 TFRKPHN_ex_gripe_reset_tt:0 "국내 기업의 불만이 §G0§!이 됩니다."
 tfrkphn.698.t:0 "두 번째 물결"
 tfrkphn.698.d:0 "미국의 내전이 끝날 기미를 보이지 않습니다. 곧 끝나리라 믿고 버티던 사람들이 두 해 만에 짐을 싸기 시작했습니다.\n\n처음 건너온 이들은 본사가 무너진 회사의 사람들이었습니다. 이번에는 공장과 연구실을 끝까지 지키던 기술자와 교수, 그 가족들입니다. 인천공항 입국장에는 영어로 된 안내판이 새로 걸렸고, 먼저 온 회사들이 마중을 나왔습니다. 대륙에 남아 있던 큰 회사 두 곳도 우리 정부에 자리를 물어 왔습니다."
 tfrkphn.698.a:0 "자리를 마련합니다."
 TFRKPHN_ex_wave2_tt:0 "결정 §Y애플의 남은 기반§!과 §Y인텔의 남은 기반§!이 열립니다.\n§Y망명 기업§! 변동치: 연구 속도 §G+1§!\n국내 기업의 불만 §R+1§!"
 tfrkphn.688.t:0 "나눠 가진 유산"
 tfrkphn.688.d:0 "미대륙을 떠난 회사들이 우리 땅에 자리를 잡은 지 두 해가 지났습니다. 그 대륙으로 돌아가겠다는 말은 이제 어느 이사회에서도 나오지 않습니다.\n\n한때 한 회사였던 조직들은 나라마다 따로 살아남았습니다. 같은 이름과 같은 상표를 쓰지만 주인도, 따르는 법도 다릅니다. 본사가 남긴 특허와 설계는 그것이 놓여 있던 나라의 것이 됐습니다. 우리 몫으로 남은 조직들이 다른 나라에 남은 형제 회사들과 어떻게 지낼지를 정해야 합니다."
 tfrkphn.688.a:0 "다른 나라의 몫과 기술을 나눕니다."
 tfrkphn.688.b:0 "우리 몫은 우리 힘으로 키웁니다."
 TFRKPHN_ex_688a_tt:0 "§Y망명 기업§! 변동치: 연구 속도 §G+2§!"
 TFRKPHN_ex_688b_tt:0 "§Y망명 기업§! 변동치: 기업 가치 §G+2§!"
