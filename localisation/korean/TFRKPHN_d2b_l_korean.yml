 # 이인제 정부: 국회 입법으로 돌파. d2b_build.py가 만든다.
 tfrkphn.539.t:0 "국회 입법으로 돌파"
 tfrkphn.539.story:0 "2015년 9월 15일 노사정위원회 본회의는 노동시장 개혁에 관한 대타협을 의결했다. 이인제는 그때 여당의 노동시장선진화특위 위원장이었다.\n\n합의는 넉 달 만에 흔들렸다. 정부와 여당이 근로기준법과 고용보험법, 산재보험법, 기간제법, 파견법 개정안을 추진하면서 일반해고와 취업규칙에 관한 두 지침까지 내놓자, 한국노총은 이듬해 1월 합의 파기를 경고하고 노사정위원회 탈퇴를 선언했다. 합의문에 없던 비정규직 사용기간 연장과 파견 업종 확대가 법안에 들어갔다는 것이 노동계의 이유였다.\n\n법안이 국회에 묶여 있는 사이 선거가 왔다. 2016년 4월 13일 총선에서 새누리당은 122석에 그쳐 과반을 잃었고, 16년 만에 여소야대 국회가 들어섰다. 다섯 법안을 한꺼번에 처리할 힘은 그날로 사라졌다.\n\n이인제는 그 봄을 잊지 않았다. 합의를 기다리는 동안에도 의석은 줄어들 수 있고, 지금의 다수가 다음 선거 뒤에도 남아 있으리라는 보장은 어디에도 없다. 언제 다시 소수당이 될지 모른다.\n\n그는 당 지도부를 불러 근로기준법과 기간제법, 파견법 개정안을 이번 회기 안에 모두 처리해 달라고 했다. 승전의 지지율이 남아 있는 지금, 필요한 것은 전부 통과시켜 두겠다는 뜻이다. 노동계가 등을 돌리리라는 것은 그도 알고 있었다."
 tfrkphn.539.a:0 "필요한 것은 지금 다 통과시킨다"
