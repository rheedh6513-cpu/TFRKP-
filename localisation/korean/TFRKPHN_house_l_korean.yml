l_korean:
 TFRKPHN_hs_category:0 "31만 호"
 TFRKPHN_hs_category_desc:0 "오세훈은 2026년 5월 서울시장 선거 공약에서 31만 호를 압도적인 속도로 공급하겠다고 했습니다. 이제 그 숫자를 대통령의 목표로 삼습니다.\n\n지금 착공: §Y[?TFRKPHN_hs|0]만 호§! / 31만 호\n만 호마다 §G안정도 0.1퍼센트§!, §G건설 속도 0.2퍼센트§!가 오릅니다. 지금 건설 속도 §G[?TFRKPHN_hs_pct|1]퍼센트§!\n빠르게 밀어붙이는 결정은 §R개발 반발§!을 키웁니다(2028 총선에 영향)."
 TFRKPHN_hs_speed:0 "재개발 속도전"
 TFRKPHN_hs_speed_desc:0 "멈춰 있던 재개발 구역의 인허가를 한꺼번에 풉니다. 90일 동안 §Y민수공장 1개§!가 묶입니다."
 TFRKPHN_hs_speed_tt:0 "90일 뒤 착공 §G4만 호§!, 개발 반발이 §R커집니다§!."
 TFRKPHN_hs_fast:0 "신속통합기획"
 TFRKPHN_hs_fast_desc:0 "정비계획 수립을 공공이 처음부터 함께 해 기간을 줄입니다. 120일 동안 §Y민수공장 1개§!가 묶입니다. 한 번만 할 수 있습니다."
 TFRKPHN_hs_fast_tt:0 "120일 뒤 착공 §G5만 호§!"
 TFRKPHN_hs_moa:0 "모아주택 확대"
 TFRKPHN_hs_moa_desc:0 "작은 필지를 모아 블록 단위로 짓는 모아주택을 넓힙니다."
 TFRKPHN_hs_moa_tt:0 "60일 뒤 착공 §G2만 호§!"
 TFRKPHN_hs_ss:0 "상생주택 확대"
 TFRKPHN_hs_ss_desc:0 "민간의 땅을 빌려 공공이 짓는 장기전세주택을 늘립니다."
 TFRKPHN_hs_ss_tt:0 "90일 뒤 착공 §G3만 호§!, 개발 반발이 §G누그러집니다§!."
 TFRKPHN_hs_mega:0 "메가시티 주택"
 TFRKPHN_hs_mega_desc:0 "메가시티 권역마다 일자리 옆에 집을 짓습니다. §Y3단계§!를 넘은 메가시티 권역이 하나라도 있어야 합니다. 120일 동안 §Y민수공장 1개§!가 묶입니다."
 TFRKPHN_hs_mega_tt:0 "120일 뒤 착공 §G2만 호§!에 3단계를 넘은 권역마다 §G1만 호§!씩 더 (최대 §G7만 호§!)"
 TFRKPHN_house:0 "31만 호"
 TFRKPHN_house_desc:0 "새 집이 올라갈수록 민심이 안정되고 건설 현장이 빨리 돕니다."
 TFRKPHN_oh_b1_hs_tt:0 "결정 탭 §Y31만 호§!가 열립니다."
 tfrkphn.6975.t:0 "31만 호"
 tfrkphn.6975.d:0 "착공 물량이 31만 호를 넘었습니다. 오세훈이 2026년 5월 서울시장 선거에서 내건 숫자를 대통령이 되어 나라 전체에서 채운 셈입니다.\n\n재개발 구역마다 타워크레인이 섰고, 모아주택과 상생주택의 입주 추첨에는 매번 사람이 몰렸습니다. 다만 속도를 낸 만큼 밀려난 세입자들의 이야기도 함께 쌓였습니다. 국토교통부는 첫 입주가 시작되는 두 해 뒤부터 집값이 본격적으로 안정될 것이라고 보고했습니다."
 tfrkphn.6975.a:0 "첫 입주를 기다린다."
