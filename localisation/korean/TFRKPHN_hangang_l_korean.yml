l_korean:
 TFRKPHN_hg_category:0 "그레이트 한강"
 TFRKPHN_hg_category_desc:0 "서울시장 시절 한강에서 벌인 일들을 나라 전체의 사업으로 키웁니다. 지도에서 §Y한강버스§!와 북한강, 남한강, 팔당, 임진강의 §Y댐§!을 눌러 지을 수 있습니다. 댐을 지으면 그 지역에 발전소와 §Y댐§! 변동치가 생깁니다.\n\n한강버스, 수변 개발, 빗물터널을 모두 마치면 사건이 일어나고, 네 유역의 댐을 모두 마치면 또 하나의 사건이 일어납니다."
 TFRKPHN_hg_bus:0 "한강버스를 늘린다"
 TFRKPHN_hg_bus_desc:0 "2025년 9월 마곡과 잠실 사이 28.9킬로미터에서 처음 뜬 한강버스를 늘리고 수도권과 금강 물길로 넓힙니다. 한 번만 할 수 있습니다."
 TFRKPHN_hg_bus_tt:0 "90일 뒤 수도권과 충청에 §Y기반 시설§! §G+1§!"
 TFRKPHN_hg_river:0 "한강 수변 개발"
 TFRKPHN_hg_river_desc:0 "강변의 낡은 시설을 걷어 내고 일터와 공원을 함께 짓습니다. 150일 동안 §Y민수공장 1개§!가 묶입니다."
 TFRKPHN_hg_river_tt:0 "150일 뒤 서울의 건물 칸 §G+2§!, 개발 반발이 §R커집니다§!."
 TFRKPHN_hg_tunnel:0 "대심도 빗물터널"
 TFRKPHN_hg_tunnel_desc:0 "2022년 여름 폭우 뒤 서울은 강남역, 광화문, 도림천 땅 밑에 큰 빗물터널을 짓기로 했습니다. 같은 방식을 물난리가 잦은 도시로 넓힙니다. 180일 동안 §Y민수공장 1개§!가 묶입니다."
 TFRKPHN_hg_tunnel_tt:0 "180일 뒤 §Y오세이돈§! 재난 대비 점수 §G+20§!"
 TFRKPHN_oh_e4_hg_tt:0 "결정 탭 §Y그레이트 한강§!이 열립니다 (한강 유역 지도)."
 tfrkphn.6985.t:0 "한강이 다시 흐른다"
 tfrkphn.6985.d:0 "한강버스가 출근 시간에도 빈자리 없이 오가기 시작했습니다. 2025년 9월 첫 운항 직후에는 잦은 고장으로 운항을 멈추고 시장이 사과한 일도 있었습니다. 그 뒤 배를 손보고 선착장을 늘린 끝에 이제는 수도권 물길을 잇는 교통수단이 되었습니다.\n\n강변에는 낡은 주차장 자리에 일터와 공원이 들어섰습니다. 땅 밑에서는 빗물터널이 완공되어 첫 장마를 무사히 넘겼습니다. 강남역 사거리는 그해 여름 한 번도 물에 잠기지 않았습니다.\n\n국토교통부는 한강 방식을 낙동강과 금강에도 적용하는 계획을 내놓았습니다."
 tfrkphn.6985.a:0 "강을 따라 나라가 자랍니다."
 TFRKPHN_hg_bukhan:0 "북한강 댐 연계 운영"
 TFRKPHN_hg_bukhan_desc:0 "1973년 춘천에 들어선 소양강댐을 중심으로 화천, 춘천, 의암, 청평으로 이어지는 북한강의 댐들을 하나로 묶어 운영합니다. 휴전선 가까이에는 1989년 1단계를 마친 화천 평화의댐이 있습니다. 120일 동안 §Y민수공장 1개§!가 묶입니다."
 TFRKPHN_hg_bukhan_tt:0 "120일 뒤 §Y강원§!에 건물 칸 §G+1§!, §Y발전소§! §G1개§!, 지역 변동치 §Y댐§!(건설 속도 §G+10퍼센트§!, 보급 §G+20퍼센트§!)\n§Y오세이돈§! 재난 대비 점수 §G+10§!"
 TFRKPHN_hg_namhan:0 "남한강 수계 정비"
 TFRKPHN_hg_namhan_desc:0 "1985년 충주댐과 2000년 횡성댐, 여주의 세 보를 잇는 남한강 물길을 손봅니다. 120일 동안 §Y민수공장 1개§!가 묶입니다."
 TFRKPHN_hg_namhan_tt:0 "120일 뒤 §Y충청§!에 건물 칸 §G+1§!, §Y발전소§! §G1개§!, 지역 변동치 §Y댐§!(건설 속도 §G+10퍼센트§!, 보급 §G+20퍼센트§!)\n§Y오세이돈§! 재난 대비 점수 §G+10§!"
 TFRKPHN_hg_paldang:0 "팔당 상수원 보강"
 TFRKPHN_hg_paldang_desc:0 "북한강과 남한강이 만나는 팔당은 수도권 이천만 명이 마시는 물의 시작입니다. 댐과 취수장을 보강합니다. 90일 동안 §Y민수공장 1개§!가 묶입니다."
 TFRKPHN_hg_paldang_tt:0 "90일 뒤 §Y서울과 경기§!에 건물 칸 §G+1§!, §Y발전소§! §G1개§!, 지역 변동치 §Y댐§!(건설 속도 §G+10퍼센트§!, 보급 §G+20퍼센트§!)\n§Y오세이돈§! 재난 대비 점수 §G+5§!"
 TFRKPHN_hg_imjin:0 "임진강 홍수 조절"
 TFRKPHN_hg_imjin_desc:0 "북쪽에서 예고 없이 내려오는 물을 막으려고 2013년 연천에 군남홍수조절지를, 2016년 포천과 연천에 한탄강댐을 지었습니다. 두 시설을 키우고 경보망을 넓힙니다. 90일 동안 §Y민수공장 1개§!가 묶입니다."
 TFRKPHN_hg_imjin_tt:0 "90일 뒤 §Y서울과 경기§!에 건물 칸 §G+1§!, §Y발전소§! §G1개§!, 지역 변동치 §Y댐§!(건설 속도 §G+10퍼센트§!, 보급 §G+20퍼센트§!)\n§Y오세이돈§! 재난 대비 점수 §G+15§!"
 TFRKPHN_dam_bukhan:0 "북한강 댐"
 TFRKPHN_dam_bukhan_desc:0 "소양강댐을 중심으로 북한강의 댐들을 하나로 운영합니다."
 TFRKPHN_dam_namhan:0 "남한강 댐"
 TFRKPHN_dam_namhan_desc:0 "충주댐과 횡성댐, 여주의 세 보가 남한강 물길을 다스립니다."
 TFRKPHN_dam_paldang:0 "팔당댐"
 TFRKPHN_dam_paldang_desc:0 "수도권의 물이 여기서 시작됩니다."
 TFRKPHN_dam_imjin:0 "임진강 홍수 조절"
 TFRKPHN_dam_imjin_desc:0 "군남홍수조절지와 한탄강댐이 북쪽에서 내려오는 물을 막습니다."
 tfrkphn.6986.t:0 "한강 수계가 하나로"
 tfrkphn.6986.d:0 "북한강과 남한강, 팔당, 임진강의 댐들이 한 상황실에서 함께 움직이기 시작했습니다. 큰비가 예보되면 소양강댐과 충주댐이 미리 물을 빼고, 팔당은 하류 수위를 보며 문을 엽니다. 임진강에서는 군남홍수조절지와 한탄강댐이 북쪽에서 내려오는 물을 받아 냅니다.\n\n댐마다 새 발전 설비가 돌기 시작하면서 강원과 충청의 공업 지대에도 전기가 넉넉해졌습니다. 환경부는 올여름 한강 수계에서 홍수 특보가 내려진 날이 지난해의 절반이었다고 밝혔습니다."
 tfrkphn.6986.a:0 "물길을 다스리는 나라가 됩니다."
 TFRKPHN_hg_b_bus_tt:0 "§Y한강버스를 늘린다§!\n2025년 9월 마곡과 잠실 사이 28.9킬로미터에서 처음 뜬 한강버스를 늘리고 수도권과 금강 물길로 넓힙니다.\n\n완공되면 수도권과 충청에 §Y기반 시설§! §G+1§!\n\n누르면 §Y정치력 50§!을 내고 §Y90일§! 뒤 완공됩니다.\n아래 막대가 §Y노랑§!이면 짓는 중, §G초록§!이면 완공입니다."
 TFRKPHN_hg_b_imjin_tt:0 "§Y임진강 홍수 조절§!\n북쪽에서 예고 없이 내려오는 물을 막으려고 2013년 연천에 군남홍수조절지를, 2016년 포천과 연천에 한탄강댐을 지었습니다. 두 시설을 키우고 경보망을 넓힙니다.\n\n완공되면 §Y서울과 경기§!에 건물 칸 §G+1§!, §Y발전소§! §G1개§!, 지역 변동치 §Y댐§!(건설 속도 §G+10퍼센트§!, 보급 §G+20퍼센트§!)\n§Y오세이돈§! 재난 대비 점수 §G+15§!\n\n누르면 §Y정치력 60§!을 내고 §Y90일§! 뒤 완공됩니다.\n아래 막대가 §Y노랑§!이면 짓는 중, §G초록§!이면 완공입니다."
 TFRKPHN_hg_b_bukhan_tt:0 "§Y북한강 댐 연계 운영§!\n1973년 춘천에 들어선 소양강댐을 중심으로 화천, 춘천, 의암, 청평으로 이어지는 북한강의 댐들을 하나로 묶어 운영합니다. 휴전선 가까이에는 1989년 1단계를 마친 화천 평화의댐이 있습니다.\n\n완공되면 §Y강원§!에 건물 칸 §G+1§!, §Y발전소§! §G1개§!, 지역 변동치 §Y댐§!(건설 속도 §G+10퍼센트§!, 보급 §G+20퍼센트§!)\n§Y오세이돈§! 재난 대비 점수 §G+10§!\n\n누르면 §Y정치력 75§!을 내고 §Y120일§! 뒤 완공됩니다.\n아래 막대가 §Y노랑§!이면 짓는 중, §G초록§!이면 완공입니다."
 TFRKPHN_hg_b_paldang_tt:0 "§Y팔당 상수원 보강§!\n북한강과 남한강이 만나는 팔당은 수도권 이천만 명이 마시는 물의 시작입니다. 댐과 취수장을 보강합니다.\n\n완공되면 §Y서울과 경기§!에 건물 칸 §G+1§!, §Y발전소§! §G1개§!, 지역 변동치 §Y댐§!(건설 속도 §G+10퍼센트§!, 보급 §G+20퍼센트§!)\n§Y오세이돈§! 재난 대비 점수 §G+5§!\n\n누르면 §Y정치력 60§!을 내고 §Y90일§! 뒤 완공됩니다.\n아래 막대가 §Y노랑§!이면 짓는 중, §G초록§!이면 완공입니다."
 TFRKPHN_hg_b_namhan_tt:0 "§Y남한강 수계 정비§!\n1985년 충주댐과 2000년 횡성댐, 여주의 세 보를 잇는 남한강 물길을 손봅니다.\n\n완공되면 §Y충청§!에 건물 칸 §G+1§!, §Y발전소§! §G1개§!, 지역 변동치 §Y댐§!(건설 속도 §G+10퍼센트§!, 보급 §G+20퍼센트§!)\n§Y오세이돈§! 재난 대비 점수 §G+10§!\n\n누르면 §Y정치력 75§!을 내고 §Y120일§! 뒤 완공됩니다.\n아래 막대가 §Y노랑§!이면 짓는 중, §G초록§!이면 완공입니다."
