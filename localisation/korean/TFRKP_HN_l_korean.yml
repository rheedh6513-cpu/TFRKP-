 TFRKPHN_const_nbi_tt:0 "헌법 조문이 바뀝니다: §Y국가수사국법§! → 모든 범죄 수사는 국가수사국이 전담\n(타협 §R4회§! 이상이면 §O타협안§!: 국가수사국은 중대범죄만 수사)"
 TFRKPHN_const_district_old:0 "선거법 21조 : 한 선거구에서 국회의원 1인 선출"
 TFRKPHN_const_district_new:0 "§G선거법 21조§! : 한 선거구에서 2~4인 선출"
 TFRKPHN_const_district_weak:0 "§O선거법 21조§! : 대도시 선거구에서만 2~4인 선출"
 TFRKPHN_const_district_tt:0 "헌법 조문이 바뀝니다: §Y선거법 21조§! → 한 선거구에서 2~4인 선출\n(타협 §R4회§! 이상이면 §O타협안§!: 대도시 선거구에서만 2~4인 선출)"
 TFRKPHN_const_nec_old:0 "헌법 114조 : 선거관리위원회를 둔다"
 TFRKPHN_const_nec_new:0 "§G헌법 114조§! : 선관위는 국가 선거·정당 사무만, 외부 감사"
 TFRKPHN_const_nec_weak:0 "§O헌법 114조§! : 선관위 외부 감사는 법률로 정한다"
 TFRKPHN_const_nec_tt:0 "헌법 조문이 바뀝니다: §Y헌법 114조§! → 선관위는 국가 선거·정당 사무만, 외부 감사\n(타협 §R4회§! 이상이면 §O타협안§!: 선관위 외부 감사는 법률로 정한다)"
 TFRKPHN_amend_d_committee:0 "$TFRKPHN_hong_b04_17$"
 TFRKPHN_amend_d_committee_desc:0 "개헌이 실패해 온 이유는 분명합니다. 집권하면 미루고, 좌우는 서로를 믿지 못했으며, 권력 구조를 두고 셈법이 엇갈렸습니다. 이번에는 정부와 국회가 함께 개헌위원회를 세우고 모든 논의를 공개합니다. 특정 진영이 아니라 국민 모두가 받아들일 수 있는 헌법이어야 합니다."
 TFRKPHN_amend_d_term:0 "$TFRKPHN_hong_b04_02$"
 TFRKPHN_amend_d_term_desc:0 "5년 단임제는 장기 집권을 막으려고 만든 장치였지만, 임기 후반마다 레임덕을 불렀습니다. 대통령 임기를 4년으로 줄이고 한 번 더 국민의 평가를 받게 하면, 정책은 이어지고 책임은 분명해집니다."
 TFRKPHN_amend_d_vp:0 "$TFRKPHN_hong_b04_11$"
 TFRKPHN_amend_d_vp_desc:0 "대통령이 자리를 비우면 국민이 뽑지 않은 국무총리가 그 권한을 대신합니다. 주권은 국민에게 있다는 원칙에 맞지 않습니다. 대통령과 함께 선출되는 부통령을 두어 유고 시 권한을 잇게 하고, 평소에는 국정을 보좌하며 상원의 의장을 맡게 합니다."
 TFRKPHN_amend_d_bicam:0 "$TFRKPHN_hong_b04_03$"
 TFRKPHN_amend_d_bicam_desc:0 "국회를 서로 다른 방식으로 뽑는 상원과 하원으로 나눕니다. 상원은 광역자치단체를 단위로 50명 이하를 뽑아 법사위가 하던 법률 심사를 맡고, 하원은 비례대표 없이 인구 비례 지역구로 200명 이하를 뽑습니다. 의원의 면책특권은 두되 불체포특권은 없앱니다. 한 세력이 입법을 독점하는 일을 막고 국회의 교착을 줄이기 위해서입니다."
 TFRKPHN_amend_d_court:0 "$TFRKPHN_hong_b04_12$"
 TFRKPHN_amend_d_court_desc:0 "헌법재판소는 탄핵 심판을 거치며 국민의 신뢰를 크게 잃었습니다. 재판관의 이념적 편향과 별도 기관의 비효율을 더는 감당할 이유가 없습니다. 헌법재판소를 없애고 대법관을 4명 늘려 대법원 안에 헌법재판부를 둡니다. 정당 해산과 탄핵 심판도 이곳이 맡아, 법률 판단과 헌법 판단이 한 지붕 아래에서 일관되게 내려지게 합니다."
 TFRKPHN_amend_d_cio:0 "$TFRKPHN_hong_b04_13$"
 TFRKPHN_amend_d_cio_desc:0 "검찰 위에 또 하나의 수사기관을 얹은 공수처는 성과 없이 옥상옥이라는 비판만 받아 왔습니다. 공수처를 폐지하고, 대통령 친인척과 고위공직자는 특별감찰관이 엄정하게 감시하게 합니다."
 TFRKPHN_amend_d_nbi:0 "$TFRKPHN_hong_b04_16$"
 TFRKPHN_amend_d_nbi_desc:0 "흩어져 있던 수사 기능을 하나로 모아 한국판 FBI인 국가수사국을 세웁니다. 모든 범죄 수사는 이곳이 맡고, 정치적 중립을 지키도록 외부의 감시를 받게 합니다."
 TFRKPHN_amend_d_district:0 "$TFRKPHN_hong_b04_14$"
 TFRKPHN_amend_d_district_desc:0 "한 선거구에서 한 명만 당선되는 지금의 방식은 승자독식과 지역주의를 키웠습니다. 한 선거구에서 여러 명을 뽑는 중대선거구제로 바꿔, 영남과 호남에서도 다른 당의 의원이 나올 수 있게 합니다."
 TFRKPHN_amend_d_nec:0 "$TFRKPHN_hong_b04_15$"
 TFRKPHN_amend_d_nec_desc:0 "부정선거 논란과 채용 비리, 근무 기강 해이로 선관위는 국민의 신뢰를 잃었습니다. 아파트 입주자 대표 선거까지 업무를 넓혀 온 조직을 다시 짭니다. 선관위는 남기되 국가 선거와 정당 사무만 맡게 하고, 감사원이나 특별감찰관의 외부 감사를 받게 합니다."
 TFRKPHN_amend_d_review:0 "$TFRKPHN_hong_b04_10$"
 TFRKPHN_amend_d_review_desc:0 "개헌의 장들을 하나씩 마쳤습니다. 이제 새 헌법에 따라 양원제 국회를 꾸리고, 4년 중임 대통령을 뽑을 차례입니다. 한 해 동안 쓴 새 헌법을 점검하고, 제7공화국의 출범을 선언합니다."
 TFRKPHN_amend_req_term_tt:0 "§Y$TFRKPHN_amend_d_committee$§!을(를) 먼저 마쳐야 합니다."
 TFRKPHN_amend_req_vp_tt:0 "§Y$TFRKPHN_amend_d_committee$§!을(를) 먼저 마쳐야 합니다."
 TFRKPHN_amend_req_bicam_tt:0 "§Y$TFRKPHN_amend_d_committee$§!을(를) 먼저 마쳐야 합니다."
 TFRKPHN_amend_req_court_tt:0 "§Y$TFRKPHN_amend_d_committee$§!을(를) 먼저 마쳐야 합니다."
 TFRKPHN_amend_req_cio_tt:0 "§Y$TFRKPHN_amend_d_committee$§!을(를) 먼저 마쳐야 합니다."
 TFRKPHN_amend_req_nbi_tt:0 "§Y$TFRKPHN_amend_d_cio$§!을(를) 먼저 마쳐야 합니다."
 TFRKPHN_amend_req_district_tt:0 "§Y$TFRKPHN_amend_d_committee$§!을(를) 먼저 마쳐야 합니다."
 TFRKPHN_amend_req_nec_tt:0 "§Y$TFRKPHN_amend_d_committee$§!을(를) 먼저 마쳐야 합니다."
 TFRKPHN_amend_req_review_tt:0 "다른 개헌 결정 §Y8개§!를 모두 마쳐야 합니다."
 TFRKPHN_amend_not_busy_tt:0 "진행 중인 다른 개헌 결정이 없어야 합니다."
 TFRKPHN_amend_busy_tt:0 "§Y30일§! 동안 이 개헌을 진행합니다. 그동안 다른 개헌 결정은 시작할 수 없습니다."
 TFRKPHN_amend_comp_tt:0 "§O타협 +1회§!: 가결 뒤 개헌 결정의 효과가 §R10%§!씩 줄어듭니다 (최소 30%).\n현재 타협 [?TFRKPHN_amend_comp|0]회 · 개헌 효과 [?TFRKPHN_amend_eff|%0]\n타협이 §R4회§! 이상이면 헌법 조문이 원안 대신 §O타협안§!으로 바뀝니다."
 TFRKPHN_7rep_up_scaled_tt:0 "국민정신 §Y제7공화국§!이 §G[?TFRKPHN_amend_eff|2]단계§! 강해집니다. (타협 [?TFRKPHN_amend_comp|0]회 · 개헌 효과 [?TFRKPHN_amend_eff|%0])\n정치력·안정도 보상도 같은 비율로 줄어듭니다."
 TFRKPHN_7rep_start_scaled_tt:0 "$TFRKPHN_7rep_start_tt$\n이번 결정으로 §G[?TFRKPHN_amend_eff|2]단계§!가 됩니다. (타협 [?TFRKPHN_amend_comp|0]회 · 개헌 효과 [?TFRKPHN_amend_eff|%0])"
 tfrkphn.130.t:0 "개헌안 가결"
 tfrkphn.130.desc:0 "국회 본회의장 전광판에 찬성 [?TFRKPHN_amend_yes|0]표가 떠올랐다. 재적 의원 3분의 2를 넘긴 순간, 의석 한쪽에서 박수가 터져 나왔다. 개헌안이 가결되었다."
 tfrkphn.130.a:0 "이제부터가 진짜다."
 tfrkphn.131.t:0 "개헌안 부결"
 tfrkphn.131.desc:0 "개헌안은 끝내 재적 의원 3분의 2의 벽을 넘지 못했다. 찬성 [?TFRKPHN_amend_yes|0]표. 본회의장을 나서는 여당 의원들의 표정은 어두웠다."
 tfrkphn.131.a:0 "여기까지인가."
 TFRKPHN_hong_b04_02:0 "4년 중임제 개헌"
 TFRKPHN_hong_b04_02_desc:0 "5년 단임의 한계를 넘어, 평가받고 책임지는 제도를 만듭니다."
 tfrkphn.76.t:0 "4년 중임제 개헌"
 tfrkphn.76.desc:0 "국회 헌법개정특별위원회, 회의실 화면에 비교표가 떠 있다.\n\n현행 헌법 제70조는 대통령의 임기를 5년으로 하고 중임할 수 없다고 정한다. 정부안은 임기를 4년으로 줄이되 한 차례 다시 출마할 수 있게 하는 것이었다. 일을 잘한 대통령에게는 한 번 더 기회를, 못한 대통령은 4년 만에 투표로 끝낸다는 논리였다.\n\n\"임기 후반만 되면 아무도 대통령 말을 안 듣잖아요. 5년 단임은 그게 문제예요.\"\n\"재선이 가능해지면 현직이 선거에 국정을 쓴다는 얘기가 나오겠죠. 그리고 이 개헌, 누구한테 이득입니까?\"\n\n질문이 나오자 회의실이 잠시 조용해졌다. 헌법 개정은 국회 재적의원 3분의 2의 찬성을 얻은 뒤 국민투표를 통과해야 한다. 어느 쪽이든 결국 국민 앞에 설 수밖에 없는 일이었다.\n\n정부안은 국회로 넘어갔다."
 tfrkphn.76.a:0 "비교표는 한 장, 논쟁은 백 장."
 TFRKPHN_hong_b04_03:0 "양원제 도입"
 TFRKPHN_hong_b04_03_desc:0 "국회를 상원과 하원으로 나누어 입법의 속도와 신중함을 함께 확보합니다."
 TFRKPHN_senate_tt:0 "기존 국회 300석은 §Y하원§!이 됩니다.\n하원 의석 비율대로 §Y상원 50석§!이 새로 구성되고, 결정 탭에 §Y상원§!이 생깁니다."
 TFRKPHN_senate_category:0 "상원"
 TFRKPHN_senate_category_desc:0 "양원제 도입으로 새로 구성된 상원입니다. 하원을 통과한 법안을 한 번 더 심의합니다."
 TFRKPHN_senate_title:0 "대한민국 상원 의석 현황"
 TFRKPHN_senate_total:0 "전체 의석수\n50석"
 TFRKPHN_senate_legend:0 "§B더불어민주당§! [?TFRKPHN_sen_DP|0]석   §R국민의힘§! [?TFRKPHN_sen_PPP|0]석   §Y정의당§! [?TFRKPHN_sen_JP|0]석\n§O국민의당§! [?TFRKPHN_sen_PP|0]석   §g무소속§! [?TFRKPHN_sen_Ind|0]석"
 TFRKPHN_NatAsm_title_normal:0 "국회"
 TFRKPHN_NatAsm_title_lower:0 "하원 (국회)"
 tfrkphn.77.t:0 "상원과 하원"
 tfrkphn.77.desc:0 "여의도, 국회 본관 복도.\n\n정부 개헌안 요약본이 의원실마다 돌고 있었다. 국회를 지역 대표성을 가진 상원과 예산과 민생을 다루는 하원으로 나누고, 하원 의석은 지금의 300석에서 200석으로 줄인다는 내용이었다. 의원 수가 줄어든다는 대목에서 일부 의원이 박수를 쳤다. 상원이 새로 생긴다는 대목에서는 같은 의원들이 고개를 갸웃했다.\n\n\"결국 자리를 줄이겠다는 거잖아? 그럼 누가 상원에 가는 건데?\"\n\"법안이 두 번 걸러지니까 졸속 입법이 줄어든다는 취지랍니다. 대신 한 번 걸리면 영영 안 나오겠죠.\"\n\n보좌관 하나가 복사기 앞에서 요약본을 접어 주머니에 넣으며 중얼거렸다. 어느 쪽이든 자기 일자리는 불안하다고.\n\n개헌안은 국회와 국민 앞으로 한 걸음 더 나아갔다."
 tfrkphn.77.a:0 "의원 수는 줄고, 논쟁은 늘었다."
 TFRKPHN_hong_b04_04:0 "사법시험 부활"
 TFRKPHN_hong_b04_04_desc:0 "출신 배경이 아니라 실력으로 법조인이 되는 길을 다시 엽니다."
 tfrkphn.78.t:0 "신림동의 두 청년"
 tfrkphn.78.desc:0 "관악구 신림동, 고시원 골목의 편의점.\n\n2017년 마지막 사법시험이 치러진 뒤 이 골목에서는 간판이 하나둘 내려갔다. 그 빈자리에 정부가 사법시험을 다시 치르겠다는 발표가 걸렸다. 로스쿨 제도와 병행하되, 법학 전공이 아닌 수험생과 형편이 넉넉하지 못한 수험생에게도 길을 열어 주겠다는 취지였다.\n\n\"드디어 돌아오는 건가... 몇 년만 더 일찍 나왔어도.\"\n\"저는 로스쿨 2학년인데요. 등록금이랑 생활비로 빚이 1억 가까이 되는데, 이제 와서 사시가 부활하면 우리는 뭐가 돼요?\"\n\n같은 편의점 테이블에 마주 앉은 두 청년은 한동안 서로의 컵라면만 바라보았다. 같은 길 위에서 서로 다른 시간을 살아온 사람들이었다.\n\n어느 쪽에게든, 이 제도는 공정해야 했다."
 tfrkphn.78.a:0 "같은 골목, 다른 시간."
 TFRKPHN_hong_b04_05:0 "정시 확대"
 TFRKPHN_hong_b04_05_desc:0 "대입의 공정성은 입시 방식이 아니라 신뢰에서 나옵니다. 수능의 비중을 키웁니다."
 tfrkphn.79.t:0 "수능 한 번에"
 tfrkphn.79.desc:0 "교육부 대입제도 개편 브리핑.\n\n정시 모집 비율을 단계적으로 늘리고, 수능은 연 2회 응시 기회를 주는 방안이 발표되었다. 학생부 중심 전형은 학교와 지역에 따라 기회가 갈린다는 지적을 받아 왔고, 수능은 한 번의 시험으로 인생이 갈린다는 반론을 받아 왔다. 정부는 그 둘 사이에서 선택을 했다.\n\n서울 대치동 학원가에는 그날 저녁 설명회 문의 전화가 평소의 세 배로 늘었다. 지방 소도시의 한 고등학교 교무실에서는 부장 교사가 한숨을 쉬었다.\n\n\"서울 애들만 유리해지는 거 아닌가요? 학원 없는 우리 애들은 어떻게 합니까.\"\n\"그래서 EBS랑 방과후 지원을 같이 늘린다고는 하는데...\"\n\n입시 제도는 언제나 모두를 만족시키지 못했다. 이번에도 마찬가지였다."
 tfrkphn.79.a:0 "시험은 하나, 출발선은 여럿."
 TFRKPHN_hong_b04_06:0 "단계적 모병제"
 TFRKPHN_hong_b04_06_desc:0 "병력의 숫자보다 병사의 숙련도를 먼저 따지는 군으로 나아갑니다."
 tfrkphn.80.t:0 "병무청의 새 포스터"
 tfrkphn.80.desc:0 "병무청 회의실, 벽면 가득 연도별 입영 대상자 그래프가 떠 있었다. 줄어드는 병역 자원의 곡선은 어느 해를 기점으로 가파르게 꺾여 있었다.\n\n정부는 징병제를 곧바로 폐지하지 않고, 단계적으로 모병제로 옮겨 간다고 발표했다. 직업군인의 처우를 높이고, 복무 기간과 인원은 몇 해에 걸쳐 조정한다. 양안전쟁을 치른 군이 숙련도의 가치를 몸으로 배웠다는 점이 근거로 제시되었다. 반면 북한과 마주한 나라가 병력을 줄이는 것이 맞느냐는 반론도 거셌다.\n\n\"저는 환영입니다. 아들 군대 보내느라 우리 집 인생 계획이 다 틀어졌었거든요.\"\n\"저는 반댑니다. 결국 가난한 집 아이들만 군대 가는 나라가 되는 거 아닙니까.\"\n\n병무청 복도의 입영 안내 포스터는 아직 바뀌지 않은 채였다."
 tfrkphn.80.a:0 "포스터는 아직 그대로다."
 TFRKPHN_hong_b04_07:0 "핵공유 협의체"
 TFRKPHN_hong_b04_07_desc:0 "핵우산이 흔들린 시대, 스스로 지킬 수단을 협의의 테이블 위에 올립니다."
 tfrkphn.81.t:0 "지하 회의실"
 tfrkphn.81.desc:0 "합동참모본부 지하, 보안 점검을 마친 회의실.\n\n탁자 위에는 표지에 아무 제목도 없는 서류철 하나가 놓여 있었다. 미국이 무너지며 핵우산도 함께 흔들린 뒤, 대한민국은 어떤 방식으로 억제력을 확보할 것인가. 서류철에는 핵을 가진 우방과의 공동 운용 협의체 구상 초안이 들어 있었다. 독자 핵무장은 제재와 비확산 체제의 벽 앞에 서 있었고, 핵을 가진 우방과 운용을 나누는 방안이 그나마 현실적인 대안으로 거론되었다.\n\n\"이걸 협의하는 것만으로도 중국은 한마디 할 겁니다.\"\n\"그렇다고 안 하면, 우리 손에 아무것도 없다는 걸 인정하는 꼴이 됩니다.\"\n\n참석자들은 휴대전화를 전부 문밖 보관함에 두고 들어왔다. 회의록에는 참석자 이름이 적히지 않았다.\n\n서류철의 첫 장이 넘어갔다."
 tfrkphn.81.a:0 "회의록에는 이름이 없다."
 TFRKPHN_hong_b04_08:0 "노동 유연성 확대"
 TFRKPHN_hong_b04_08_desc:0 "일자리를 지키는 방법과 일자리를 만드는 방법은 같지 않습니다."
 tfrkphn.82.t:0 "울산 부품공장의 점심시간"
 tfrkphn.82.desc:0 "울산의 한 자동차 부품 공장 휴게실.\n\n정부가 노동시장 유연화 방안을 발표한 날 점심시간, 텔레비전 앞에는 작업복 차림의 사람들이 둘러서 있었다. 정리해고 요건 완화, 근로시간 선택권 확대, 그 대신 실업급여와 재교육 지원 강화. 정부는 일자리를 쉽게 줄이자는 것이 아니라 쉽게 옮기게 하자는 것이라고 설명했다.\n\n\"일하는 시간을 내가 정할 수 있으면 좋긴 하지.\"\n\"그게 되겠어? 결국 사장이 정하는 거지. 쉬운 해고가 쉬운 취업이 되는 걸 본 적 있어?\"\n\n한쪽 구석에서 납품 단가를 걱정하던 하청업체 사장이 조용히 커피를 내렸다. 노조 조끼를 입은 청년은 아무 말 없이 화면에서 눈을 떼지 않았다.\n\n그날 오후에도 라인은 평소처럼 돌아갔다. 다만 휴게실의 공기만은 평소와 달랐다."
 tfrkphn.82.a:0 "라인은 평소처럼 돌아갔다."
 TFRKPHN_hong_b04_09:0 "공영방송 민영화"
 TFRKPHN_hong_b04_09_desc:0 "누구의 방송이어야 하는가. 정부의 손을 떠난 방송의 길을 엽니다."
 tfrkphn.83.t:0 "매각 공고"
 tfrkphn.83.desc:0 "여의도, 어느 방송사 로비.\n\n정부가 공영방송 지배구조 개편안과 함께 지분 매각 방침을 발표했다. 국민의 수신료와 세금으로 운영되면서도 정권이 바뀔 때마다 사장 자리가 바뀌는 구조를 끊겠다는 것이 정부의 설명이었다. 민영화되면 광고와 시청률에 더 얽매일 것이라는 우려와, 지금처럼 정치권이 인사권을 쥐는 구조보다는 낫다는 주장이 부딪혔다.\n\n\"공영이라는 이름만 붙여 놓고 결국 누구 편이냐는 소리를 오랫동안 듣고 있잖아요.\"\n\"민영이 되면 뉴스가 돈 되는 쪽으로만 흘러갈 텐데, 재난방송 같은 건 누가 합니까.\"\n\n편집회의실 화이트보드에는 그날의 첫 꼭지 대신 '우리는 누구의 방송인가'라는 한 줄이 적혀 있었다. 아무도 그것을 지우지 않았다.\n\n정부 공고문은 한 쪽짜리였다. 논쟁은 그보다 훨씬 길었다."
 tfrkphn.83.a:0 "논쟁은 공고문보다 길었다."
 TFRKPHN_hong_b04_10:0 "연말 국정 점검"
 TFRKPHN_hong_b04_10_desc:0 "한 해 동안 꺼내 든 개혁의 성적표를 받아 듭니다."
 tfrkphn.84.t:0 "한 해의 성적표"
 tfrkphn.84.desc:0 "연말, 대통령 주재 국정 점검 회의.\n\n보고서의 목차에는 4년 중임제, 정·부통령제, 양원제, 헌법재판소, 공수처, 선거제도, 선관위까지 개헌의 장들이 나란히 놓여 있었다. 어떤 장은 박수를, 어떤 장은 비판을 불러왔다. 지지율 그래프는 어느 한 방향으로 곧게 뻗지 않았다.\n\n\"성공한 개혁은 칭찬을 못 받고, 실패한 개혁만 기억에 남습니다.\"\n\"그래도 하지 않았다면 평가받을 일조차 없었겠지요.\"\n\n회의가 끝나고 참모들이 자리에서 일어서자, 맨 마지막 장 여백에 누군가 연필로 한 줄을 적어 놓은 것이 보였다. 다음 정부가 이걸 지킬까, 라고.\n\n창밖에는 첫눈이 내리고 있었다."
 tfrkphn.84.a:0 "다음 정부의 몫이다."
 TFRKPHN_hong_b04_11:0 "정·부통령제 도입"
 TFRKPHN_hong_b04_11_desc:0 "대통령 유고 시의 공백을 없애고 국정의 연속성을 지키기 위해, 대통령과 부통령을 함께 뽑는 정·부통령제를 헌법에 담습니다."
 tfrkphn.132.t:0 "정·부통령제 도입"
 tfrkphn.132.desc:0 "헌법개정특별위원회가 정·부통령제 조항을 확정했다.\n\n다음 대선부터 대통령 후보는 부통령 후보와 한 표로 묶여 출마한다. 부통령은 대통령이 자리를 비우면 그 권한을 잇고, 평소에는 국무총리가 하던 일을 맡으며 상원의 의장을 겸한다. 국민이 직접 뽑지 않은 총리가 대통령 권한을 대신하던 시대가 끝난 것이다.\n\n막판까지 남은 쟁점은 국무총리 자리였다. 위원회 회의실에서 한 위원이 말했다. "총리를 없애면 내각은 누가 챙깁니까?" 다른 위원이 답했다. "그걸 부통령이 하라고 뽑는 겁니다.""
 tfrkphn.132.a:0 "러닝메이트의 시대가 온다."
 TFRKPHN_hong_b04_12:0 "헌법재판소 폐지"
 TFRKPHN_hong_b04_12_desc:0 "정치적 사법기관으로 전락한 헌법재판소를 없애고, 대법원 안에 헌법재판부를 두어 중립적인 법관들이 헌법재판을 맡게 합니다."
 tfrkphn.133.t:0 "헌법재판소 폐지"
 tfrkphn.133.desc:0 "헌법재판소 대심판정의 마지막 선고가 끝났다.\n\n재판관들은 결정문을 낭독한 뒤 조용히 법정을 떠났다. 헌법재판 권한은 대법원 헌법재판부로 넘어가고, 늘어난 대법관 4명이 그 자리를 채운다. 정당 해산과 탄핵 심판도 이제 대법원이 맡는다.\n\n법조계의 반응은 엇갈렸다. 법률 판단과 헌법 판단이 한곳에서 내려지니 일관성이 생긴다는 쪽과, 대법원에 너무 큰 힘이 몰린다는 쪽이 맞섰다. 1987년 헌법이 낳은 기관 하나가 그렇게 역사 속으로 들어갔다."
 tfrkphn.133.a:0 "법관에게 헌법을 맡긴다."
 TFRKPHN_hong_b04_13:0 "공수처 폐지"
 TFRKPHN_hong_b04_13_desc:0 "옥상옥이라는 비판을 받아온 공수처를 폐지하고, 모든 범죄 수사는 국가수사국이 전담하게 하며 특별감찰관 제도를 도입합니다."
 tfrkphn.134.t:0 "공수처 폐지"
 tfrkphn.134.desc:0 "과천 정부청사, 고위공직자범죄수사처의 현판이 내려졌다.\n\n출범 이후 성과를 두고 늘 말이 많았던 조직이었다. 남은 사건 기록은 상자에 담겨 국가수사국 준비단으로 옮겨졌다. 대통령 친인척과 고위공직자를 감시할 특별감찰관도 새로 임명된다.\n\n현판을 떼어 낸 자리에는 못 자국만 남았다. 지나가던 직원 하나가 휴대전화로 그 벽을 찍었다."
 tfrkphn.134.a:0 "수사는 한곳에서, 감찰은 엄정하게."
 TFRKPHN_hong_b04_14:0 "중대선거구제 도입"
 TFRKPHN_hong_b04_14_desc:0 "한 지역구에서 한 명만 뽑는 소선거구제는 승자독식과 지역주의를 키웠습니다. 한 선거구에서 여러 명을 뽑는 중대선거구제로 바꿉니다."
 tfrkphn.135.t:0 "중대선거구제 도입"
 tfrkphn.135.desc:0 "국회가 공직선거법 개정안을 통과시켰다.\n\n다음 총선부터 한 선거구에서 두 명에서 네 명까지 의원을 뽑는다. 한 표라도 더 얻은 후보가 모든 것을 가져가던 승자독식이 무너지고, 영남에서 민주당 의원이, 호남에서 국민의힘 의원이 나올 길이 열렸다.\n\n여의도에서는 벌써 선거구 지도를 펴 놓고 계산기를 두드리는 소리가 들렸다."
 tfrkphn.135.a:0 "지역주의의 벽에 금이 갔다."
 TFRKPHN_hong_b04_15:0 "선관위 개편"
 TFRKPHN_hong_b04_15_desc:0 "부실 관리와 채용 비리로 신뢰를 잃은 선거관리위원회를 대대적으로 개편하고, 누구도 의심하지 않는 공정선거 시스템을 새로 만듭니다."
 tfrkphn.136.t:0 "선관위 개편"
 tfrkphn.136.desc:0 "중앙선거관리위원회 개편안이 확정되었다.\n\n선관위는 국가 선거와 정당 사무만 맡게 되고, 그동안 넓혀 온 각종 위탁 선거 업무는 내려놓는다. 감사원과 특별감찰관의 외부 감사가 정례화되고, 투표와 개표의 전 과정이 공개된다.\n\n채용 비리로 얼룩졌던 조직에 처음으로 바깥의 눈이 들어간다. 선거 결과를 두고 되풀이되던 소모적인 논란도 줄어들 것으로 보인다."
 tfrkphn.136.a:0 "선거는 공정해야 한다."
 TFRKPHN_hong_b04_16:0 "국가수사국 설치"
 TFRKPHN_hong_b04_16_desc:0 "공수처가 사라진 자리에 한국판 FBI, 국가수사국을 세웁니다. 모든 범죄 수사는 이곳이 전담합니다."
 tfrkphn.137.t:0 "국가수사국 출범"
 tfrkphn.137.desc:0 "국가수사국이 공식 출범했다.\n\n경찰과 여러 기관에 흩어져 있던 수사 기능이 한 지붕 아래로 모였다. 출범식에서 초대 국장은 정치적 사건이라고 해서 더 세게도, 더 약하게도 수사하지 않겠다고 말했다. 수사의 중립을 지키기 위한 외부 감시 위원회도 함께 꾸려졌다.\n\n기자들은 그 말을 받아 적으면서도, 첫 번째 사건이 무엇이 될지에 더 관심을 두었다."
 tfrkphn.137.a:0 "한국판 FBI의 시작이다."
 TFRKPHN_hong_b04_17:0 "개헌위원회 설립"
 TFRKPHN_hong_b04_17_desc:0 "정부와 국회에 함께 개헌위원회를 세워 여야가 합동으로 조율합니다. 날치기 개헌이라는 말은 나오지 않게 해야 합니다."
 tfrkphn.138.t:0 "개헌위원회 출범"
 tfrkphn.138.desc:0 "청와대 영빈관에서 개헌위원회 출범식이 열렸다.\n\n여야가 추천한 위원과 헌법학자들이 한자리에 모였다. 역대 정부는 개헌을 약속하고도 집권하면 미뤘고, 좌우는 서로를 믿지 못했으며, 권력 구조를 두고 셈법이 엇갈렸다. 위원장은 첫 회의에서 그 세 가지를 하나씩 짚은 뒤, 모든 회의록을 국민에게 공개하겠다고 약속했다.\n\n"특정 진영에 유리한 헌법이라는 말이 나오는 순간, 이 위원회는 실패한 겁니다.""
 tfrkphn.138.a:0 "새 헌법의 첫 장을 연다."
 TFRKPHN_7th_republic:0 "제7공화국 ([?TFRKPHN_7rep_lv|1]단계)"
 TFRKPHN_7th_republic_desc:0 "1987년 이후 37년 만에 새 헌법이 쓰이고 있습니다. 개헌 과제를 하나씩 마칠 때마다 제7공화국의 기틀이 단단해집니다."
 TFRKPHN_7rep_start_tt:0 "국민정신 §Y제7공화국§!을 얻습니다.\n단계마다 안정도 §G+1.5%§!, 정치력 획득 §G+5%§!, 연구 속도 §G+2%§!, 월간 학문 발전도 §G+2§!, 월간 농업 발전도 §G+1§!, 전쟁지지도 §G+2%§!, 주간 안정도 §G+0.01%§!\n이후 개헌 중점을 찍을 때마다 1단계씩 강해집니다. (최대 10단계)"
 TFRKPHN_7rep_up_tt:0 "국민정신 §Y제7공화국§!이 §G1단계§! 강해집니다.\n(10단계 기준: 안정도 +15%, 정치력 획득 +50%, 연구 속도 +20%, 월간 학문 발전도 +20, 월간 농업 발전도 +10, 전쟁지지도 +20%, 주간 안정도 +0.10%)"
 TFRKPHN_postwar_prosperity:0 "전후 번영"
 TFRKPHN_postwar_prosperity_desc:0 "전쟁의 폐허 위에서 가장 먼저 일어선 나라."
 TFRKPHN_postwar_defense:0 "자주국방"
 TFRKPHN_postwar_defense_desc:0 "대한민국의 안보는 대한민국이 지킵니다."
 TFRKPHN_postwar_diplomacy:0 "아시아 민주주의 연합"
 TFRKPHN_postwar_diplomacy_desc:0 "자유를 지킨 나라들이 하나의 이름으로 모였습니다."
 TFRKPHN_national_unity_1:0 "국민 통합"
 TFRKPHN_national_unity_1_desc:0 "전쟁을 지지한 이도, 반대한 이도 모두 대한민국의 국민입니다. 갈라진 마음을 하나로 모아 다시 앞으로 나아갑니다."
 TFRKPHN_national_unity_2:0 "하나 된 대한민국"
 TFRKPHN_national_unity_2_desc:0 "전쟁을 건넌 대한민국은 다시 하나가 되었습니다. 하나 된 국민의 힘이 나라를 더 빠르게 일으켜 세웁니다."
 TFRKPHN_postwar_friend:0 "전후 협력"
 tfrkphn.292.t:0 "대한민국 제20대 대통령 선거 홍준표 후보 대통령 당선"
 tfrkphn.292.d:0 "2022년, 한국에서 열린 제20대 대통령 선거에서 홍준표 국민의힘 대통령 후보가 대통령으로 당선되었다는 소식이 들려왔습니다. 홍준표 후보의 당선에 여러 외신에서는 미국의 붕괴 이후 한국의 우경화에 주목했습니다.\n\n문재인 정부 시기 대한민국과 세계에 닥친 코로나 팬데믹, 사우디아라비아 내전으로 인한 오일쇼크, 제2차 미국 내전, 그리고 민주당 내부의 끊이지 않는 분열 등 여당에게 매우 불리한 상황이 여럿 있었고, 실제로 문재인 정부는 여러 위기를 겪으며 국민의 신뢰를 잃었기에 이번 대선에서의 정권 교체는 많은 이들의 예상 범위 속에 있었습니다.\n\n경선에서 '당심'과 '민심'을 모두 얻어 후보 자리에 오른 홍준표 대통령은 '서민 대통령'을 제 일의 목표로 내걸고 국정 운영을 시작하였습니다."
 tfrkphn.292.a:0 "당당한 서민 대통령, 홍준표!"
 tfrkphn.294.t:0 "대한민국 홍준표 후보 당선"
 tfrkphn.294.desc:0 "방금 서울에서 들어온 소식에 따르면, 2022년 대한민국 제20대 대통령 선거가 보수 야당인 국민의힘의 승리로 마무리되며 문재인 정부의 뒤를 이어 홍준표 후보가 정권교체를 이루게 되었습니다.\n\n새로운 10년에 접어든 가운데, 국민들은 문재인 대통령이 코로나19 사태와 석유 위기, 미국의 붕괴 등 세계사적 대격변에 제대로 대처하지 못했다고 평가했으며, 이번 대한민국 대통령 선거는 이러한 정권 심판의 결과물인 것으로 분석됩니다.\n\n이번 대선에서 당선된 홍준표 당선인은 강력한 안보관과 서민 중심의 국정 운영을 주요 가치로 내걸고 있으며, 거침없는 직설 화법으로 이름난 전형적인 우익 정치인입니다.\n\n홍준표 당선인의 강경한 대북, 대중 기조에 중국 외교부는 한반도와 양안 문제에 간섭하지 말라며 다소 강경한 입장을 이어갔으며, 이로 인해 동북아에서의 전쟁의 위협이 한 층 더 커진 것으로 보입니다."
 tfrkphn.294.o1:0 "당당한 서민 대통령!"
 tfrkphn.294.o2:0 "양국 협력에 도움이 될 것이다."
 tfrkphn.294.o3:0 "또 다른 강경파다."
 tfrkphn.294.o4:0 "한국이 우경화 된다."
 TFRKPHN_hong_hourglass_category:0 "모래시계 검사"
 TFRKPHN_hourglass_drop_tt:0 "모래시계의 모래가 한 단계 떨어집니다."
 TFRKPHN_hong_hourglass_01:0 "재판 지연 해소"
 TFRKPHN_hong_hourglass_01_desc:0 "사건이 쌓여 판결을 기다리는 사이 시민의 시간은 멈춰 섭니다. 판사 정원을 늘리고 사건 배당을 손질해 재판의 속도를 높입니다."
 TFRKPHN_hong_hourglass_01_tt:0 "안정도 §G+2%§!\n정치력 §G+20§!\n서울 지지도 §G+1%§!"
 TFRKPHN_hong_hourglass_02:0 "국민참여재판 확대"
 TFRKPHN_hong_hourglass_02_desc:0 "시민이 법정의 배심석에 앉을 때 재판은 달라집니다. 국민참여재판의 대상 사건과 참여 범위를 넓힙니다."
 TFRKPHN_hong_hourglass_02_tt:0 "안정도 §G+2%§!\n경기 지지도 §G+1%§!"
 TFRKPHN_hong_hourglass_03:0 "법관 인사 투명화"
 TFRKPHN_hong_hourglass_03_desc:0 "누가 어떤 기준으로 승진하고 어디로 가는지 알 수 없는 인사는 불신을 키웁니다. 법관 평가와 인사 기준을 공개합니다."
 TFRKPHN_hong_hourglass_03_tt:0 "안정도 §G+1%§!\n정치력 §G+40§!"
 TFRKPHN_hong_hourglass_04:0 "대법관 증원과 구성 다양화"
 TFRKPHN_hong_hourglass_04_desc:0 "법복의 색이 하나뿐인 법정은 세상을 반쪽만 봅니다. 대법관 수를 늘리고 출신 배경이 다양한 인사를 임명합니다. 야당에서는 사법부를 길들이려는 시도라는 반발이 나옵니다."
 TFRKPHN_hong_hourglass_04_tt:0 "안정도 §R-1%§!\n정치력 §G+80§!"
 TFRKPHN_hong_hourglass_05:0 "양형기준 정비"
 TFRKPHN_hong_hourglass_05_desc:0 "같은 죄에 다른 형이 내려지면 법을 믿기 어렵습니다. 양형기준을 정비하고 강력범죄에 대한 처벌 기준을 분명히 합니다."
 TFRKPHN_hong_hourglass_05_tt:0 "안정도 §G+2%§!\n전쟁 지지도 §G+2%§!"
 TFRKPHN_hong_hourglass_label:0 "사법·검찰 개혁"
 TFRKPHN_hong_hourglass_count:0 "[?TFRKPHN_hourglass_step|0] / 11"
 TFRKPHN_hong_hourglass_note:0 "개혁을 시행할 때마다 위쪽 모래가 한 단계씩 떨어집니다."
 TFRKPHN_hourglass_need_tt:0 "사법부 개혁 5가지와 검찰 개혁 5가지를 모두 시행해야 합니다."
 TFRKPHN_hong_hourglass_06:0 "검찰 인사 독립성 보장"
 TFRKPHN_hong_hourglass_06_desc:0 "검찰총장과 검사의 인사가 정권의 눈치를 보지 않도록 추천 절차를 법으로 정하고, 외부 인사가 참여하는 인사위원회를 세웁니다."
 TFRKPHN_hong_hourglass_06_tt:0 "안정도 §G+2%§!\n정치력 §G+30§!"
 TFRKPHN_hong_hourglass_07:0 "별건수사·장기 소환 제한"
 TFRKPHN_hong_hourglass_07_desc:0 "하나를 캐다 안 나오면 다른 것을 캐는 수사와 몇 달씩 이어지는 소환은 사람을 지치게 합니다. 별건수사와 장기 소환을 제한하는 규칙을 정합니다."
 TFRKPHN_hong_hourglass_07_tt:0 "안정도 §G+1%§!\n정치력 §G+40§!\n경남 지지도 §G+1%§!"
 TFRKPHN_hong_hourglass_08:0 "검찰 특수활동비 공개"
 TFRKPHN_hong_hourglass_08_desc:0 "쓰임새가 드러나지 않던 예산의 사용 내역을 공개합니다. 검찰 내부에서는 수사 기밀이 샌다는 불만이 나옵니다."
 TFRKPHN_hong_hourglass_08_tt:0 "안정도 §G+2%§!\n정치력 §G+20§!"
 TFRKPHN_hong_hourglass_09:0 "수사 과정 전면 녹화와 변호인 참여 확대"
 TFRKPHN_hong_hourglass_09_desc:0 "조사실의 문이 닫혀 있는 동안 벌어진 일은 기록으로 남아야 합니다. 조사 전 과정을 녹화하고 변호인이 참여할 수 있는 범위를 넓힙니다."
 TFRKPHN_hong_hourglass_09_tt:0 "안정도 §G+2%§!\n서울 지지도 §G+1%§!\n경기 지지도 §G+1%§!"
 TFRKPHN_hong_hourglass_10:0 "고위공직자 수사기관 정비"
 TFRKPHN_hong_hourglass_10_desc:0 "고위공직자를 수사하는 기관이 정치적 도구가 되지 않도록 권한과 견제 장치를 다시 정리합니다. 여야 모두에서 불만이 나옵니다."
 TFRKPHN_hong_hourglass_10_tt:0 "안정도 §R-1%§!\n정치력 §G+70§!"
 TFRKPHN_hong_hourglass_11:0 "사법·검찰 신뢰 회복 선언"
 TFRKPHN_hong_hourglass_11_desc:0 "개혁은 끝이 아니라 신뢰를 되찾는 일의 시작입니다. 그동안의 사법부 개혁과 검찰 개혁을 정리하고 국민 앞에 결과를 보고합니다."
 TFRKPHN_hong_hourglass_11_tt:0 "안정도 §G+5%§!\n정치력 §G+150§!"
 TFRKPHN_hong_hourglass_category_desc:0 "판사는 이회창처럼 검사는 홍준표처럼 변호사는 노무현처럼"
 TFRKPHN_hong_hourglass_title:0 "§R모래시계 검사§!"
 TFRKPHN_hong_hourglass_story_title:0 "§R모래시계 검사§! 홍준표"
 TFRKPHN_hong_hourglass_story:0 "§R모래시계 검사§!는 §R홍준표§!의 대표적인 별명 중 하나입니다.\n\n그의 검사 생활은 고려대학교 행정학과를 졸업한 후 서울지검 남부지청에 발령받아 5공화국의 비리 수사를 맡게 되면서 시작되었습니다. 진주시 골재 채취권에서 전명렬이 채취권을 따내려 한 권력형 비리를 수사하려다 안기부의 압력에 굴복한 뒤, 그는 다시는 이런 일이 없을 것이라 다짐했습니다. 이후 전두환의 외조카 김영도를 변호사법 위반으로 구속한 것을 시작으로, 그 유명한 §G노량진 수산시장 강탈 사건§! 수사를 전두환·노태우 정권 실세들의 제지에도 불구하고 강행하여 '§G통제 불능§!'이라는 평가를 받았습니다.\n\n이후 서울지검 강력부 검사로 발령된 홍준표는 §G슬롯머신 사건§! 당시 주도자인 김태촌을 구속시키고 이인섭 경찰청장, 엄삼탁 안기부 기조실장을 모두 구속한 뒤, 6공의 황태자인 박철언까지 구속기소 하면서 절정에 달합니다.\n\n이러한 일화가 드라마 <모래시계>를 통해 알려진 뒤, 홍준표는 '§R모래시계 검사§!'로 불리게 됩니다."
 TFRKPHN_b04_after_ge_tt:0 "제22대 국회의원 총선거가 끝난 뒤여야 합니다."
 tfrkphn.151.desc:0 "2024년 4월 10일, 양안전쟁의 승전 분위기가 채 가시지 않은 가운데 제22대 국회의원 총선거가 치러졌습니다. 국민의힘은 전쟁을 승리로 이끈 홍준표 정부의 안보 능력과 책임 있는 국정 운영을 전면에 내세웠고, 유권자들은 이에 힘을 실어 주었습니다.\n\n개표 결과 국민의힘은 199석, 더불어민주당은 94석을 얻었고, 제3지대 정당은 모두 합쳐 7석에 그쳤습니다. 국민의힘은 과반을 훌쩍 넘는 압승을 거두었지만 개헌 의결선인 200석에는 단 1석이 모자랍니다.\n\n더불어민주당은 양안전쟁 국면에서 뚜렷한 대안을 내놓지 못했고 대만 지원에 반대했다는 점에서 친중 공세에 시달렸습니다. 한편 국민의당은 국민의힘과 합당하지 않은 채 독자 노선을 지켰습니다.\n\n전쟁에서 이긴 정부 앞에 이제 개혁의 시간이 열렸습니다."
 tfrkphn.151.a:0 "좋군."
 TFRKPHN_amend_wait14_tt:0 "§Y14일§! 동안 진행되며, 끝나면 아래 효과가 적용됩니다. 끝난 뒤 다시 누를 수 있습니다."
 TFRKPHN_arms_once_tt:0 "아직 다른 지역에 군수공장을 짓지 않았음 (전국에서 한 번만 가능)"
 TFRKPHN_hong_b03_33:0 "동서 화합"
 TFRKPHN_hong_b03_33_desc:0 "영남과 호남, 오래된 지역 갈등의 벽을 허뭅니다."
 tfrkphn.200.t:0 "동서 화합"
 tfrkphn.200.desc:0 "영남과 호남, 오래된 지역 갈등의 벽을 허뭅니다. (이벤트 내용 작성 예정)"
 tfrkphn.200.a:0 "확인"
