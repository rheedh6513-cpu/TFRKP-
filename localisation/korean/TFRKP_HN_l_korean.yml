 # 2027 대선 분기
 KOR_lee_in_je_char:0 "이인제"
 KOR_oh_se_hoon_char:0 "오세훈"
 tfrkphn.301.t:0 "제21대 대통령 이인제"
 tfrkphn.301.desc:0 "· 2027년 3월 3일, 양안전쟁 종전 후 첫 대선이 치러짐.\n· 홍준표 대통령은 5년 단임제로 출마하지 못함.\n· 참전 승리로 정부 지지율이 높게 유지됨.\n· 국민의힘은 '승전 정부 계승'을 내세움.\n· 당내 원로이자 안보 보수의 상징인 이인제를 후보로 세움.\n· 원로를 고른 것은 홍준표 정부 5년을 그대로 잇겠다는 신호임.\n· 이인제가 당선됨. 홍준표가 시작한 개혁과 전후 동맹 질서를 굳히는 '연속 정부'가 출범함."
 tfrkphn.301.a:0 "승전 정부는 계속된다."
 TFRKPHN_ge2027_lee_in_je_tt:0 "§Y이인제§!이(가) 대통령이 됩니다. 이인제 정부의 중점 트리로 바뀝니다."
 TFRKPHN_lee_in_je_b01_01:0 "연속 정부"
 TFRKPHN_lee_in_je_b01_01_desc:0 "홍준표 정부가 연 길을 그대로 이어 감. 전후 동맹 질서와 개혁 과제를 굳힘."
 tfrkphn.302.t:0 "제21대 대통령 오세훈"
 tfrkphn.302.desc:0 "· 2027년 3월 3일, 양안전쟁 종전 후 첫 대선이 치러짐.\n· 홍준표 대통령은 5년 단임제로 출마하지 못함.\n· 전쟁에는 이겼으나 전시 물가, 징집, 희생자 문제로 민심이 지침.\n· 국민의힘은 홍준표와 거리를 둔 서울시장 오세훈을 후보로 세움.\n· '승리는 지키고 국정은 바꾸겠다'를 내세움.\n· 오세훈이 당선됨. 전후 재건과 민생, 실용 노선으로 방향을 틂."
 tfrkphn.302.a:0 "승리는 지키고, 국정은 바꾼다."
 TFRKPHN_ge2027_oh_se_hoon_tt:0 "§Y오세훈§!이(가) 대통령이 됩니다. 오세훈 정부의 중점 트리로 바뀝니다."
 TFRKPHN_oh_se_hoon_b01_01:0 "전후 재건"
 TFRKPHN_oh_se_hoon_b01_01_desc:0 "지친 민심을 달래고 전쟁의 상처를 메움. 민생과 실용을 앞세움."
 tfrkphn.303.t:0 "제21대 대통령 조원진"
 tfrkphn.303.desc:0 "· 2027년 3월 3일, 양안전쟁 종전 후 첫 대선이 치러짐.\n· 참전했으나 대만이 무너짐. 한국군의 희생이 헛된 것이 됨.\n· 책임론으로 국민의힘이 분열함.\n· 분노한 보수층이 \"배신자들이 나라를 망쳤다\"는 우리공화당 조원진에게 표를 몰아줌.\n· 조원진이 당선됨. 강경 반중, 비상 통치, 국가 재무장을 내세우는 권위주의 보수 정권이 들어섬."
 tfrkphn.303.a:0 "배신의 대가를 묻는다."
 TFRKPHN_ge2027_cho_won_jin_tt:0 "§Y조원진§!이(가) 대통령이 됩니다. §Y우리공화당§!이 집권당이 되고, 조원진 정부의 중점 트리로 바뀝니다."
 TFRKPHN_party_cho_won_jin:0 "우리공화당"
 TFRKPHN_party_cho_won_jin_long:0 "우리공화당"
 TFRKPHN_cho_won_jin_b01_01:0 "비상 통치"
 TFRKPHN_cho_won_jin_b01_01_desc:0 "패전의 책임을 묻고 나라를 다시 무장시킴. 비상 통치를 선포함."
 tfrkphn.304.t:0 "제21대 대통령 안철수"
 tfrkphn.304.desc:0 "· 2027년 3월 3일, 양안전쟁 종전 후 첫 대선이 치러짐.\n· 한국은 참전하지 않았고 대만은 버팀.\n· 전쟁을 피하고도 결과가 나쁘지 않았다는 점이 실용·중도에 힘을 실어 줌.\n· 거대 양당이 전쟁 논쟁으로 상처 입은 사이 제3지대가 부상함.\n· 국민의당 안철수가 과학기술과 경제를 내세워 당선됨.\n· 첨단 산업 육성과 균형 외교를 추진함."
 tfrkphn.304.a:0 "제3지대의 시대가 열린다."
 TFRKPHN_ge2027_ahn_cheol_soo_tt:0 "§Y안철수§!이(가) 대통령이 됩니다. §Y국민의당§!이 집권당이 되고, 안철수 정부의 중점 트리로 바뀝니다."
 TFRKPHN_party_ahn_cheol_soo:0 "국민의당"
 TFRKPHN_party_ahn_cheol_soo_long:0 "국민의당"
 TFRKPHN_ahn_cheol_soo_b01_01:0 "실용 정부"
 TFRKPHN_ahn_cheol_soo_b01_01_desc:0 "양당 정치를 넘어 과학기술과 경제를 국정의 중심에 둠. 균형 외교를 추진함."
 tfrkphn.305.t:0 "제21대 대통령 황교안"
 tfrkphn.305.desc:0 "· 2027년 3월 3일, 양안전쟁 종전 후 첫 대선이 치러짐.\n· 한국이 지켜보는 동안 대만이 무너짐.\n· \"방관한 대가로 다음 차례는 한국\"이라는 공포가 퍼짐.\n· 중립을 택한 정부는 비겁했다는 비난을 받음.\n· 자유와혁신 황교안이 안보 위기와 내부의 적을 내세워 당선됨.\n· 반공과 질서를 앞세운 강경 노선으로 감."
 tfrkphn.305.a:0 "질서가 먼저다."
 TFRKPHN_ge2027_hwang_kyo_ahn_tt:0 "§Y황교안§!이(가) 대통령이 됩니다. §Y자유와혁신§!이 집권당이 되고, 황교안 정부의 중점 트리로 바뀝니다."
 TFRKPHN_party_hwang_kyo_ahn:0 "자유와혁신"
 TFRKPHN_party_hwang_kyo_ahn_long:0 "자유와혁신"
 TFRKPHN_hwang_kyo_ahn_b01_01:0 "반공 질서"
 TFRKPHN_hwang_kyo_ahn_b01_01_desc:0 "안보 위기를 앞세워 내부의 적을 단속함. 반공과 질서를 국정의 첫째로 둠."
 # 2020 총선: 무소속 홍준표 당선
 tfrkphn.306.t:0 "[당선] 출구조사 뒤엎고, 대구에서 살아난 무소속 홍준표"
 tfrkphn.306.desc:0 "                                                     £GFX_Chosun_Ilbo \n\n4·15 총선 대구 수성을에서 무소속 홍준표 후보의 당선이 확실해졌다. 16일 새벽 2시 30분, 개표가 90.9% 진행된 시점에 홍 후보는 38.9%(3만6798표)를 얻어 미래통합당 이인선 후보(36.2%, 3만4244표)를 앞섰다. 더불어민주당 이상식 후보는 24.2%에 그쳤다.\n\n투표 직후 공개된 출구조사는 이인선 39.5%, 홍준표 36.4%로 정반대 결과를 내다봤으나, 개표가 진행되며 판세가 뒤집혔다.\n\n홍 후보는 애초 고향인 경남 밀양·의령·함안·창녕 출마를 원했지만, 수도권 험지 출마를 요구한 당 지도부와 부딪쳤다. 경남 양산을 출마마저 가로막히자 당을 떠나 무소속으로 수성을에 나섰다."
 tfrkphn.306.a:0 "\"홍카콜라\"가 돌아왔나?"
 # 제20대 대선 뒤 정의당 당사
 tfrkphn.307.t:0 "늘 그래 왔으니까"
 tfrkphn.307.desc:0 "대한민국 서울특별시 영등포구 국회대로 70길 7, 정의당 중앙당 당사는 울려 대는 전화벨 소리로 가득 차 있었다.\n신입 사무처 당직자 김서현이 서류 업무에 적응하기도 전에 전화 업무로 배정된 이유도 그 때문이었다.\n\n띠리링, 띠리링.\n\"홍준표 그 새끼한테 나라 넘기니까 좋냐? 안철수처럼 단일화를 하든지!\"\n뚝.\n\n띠리링, 띠리링.\n\"심상정이 다 망쳤다, 왜 단일화 안 했어? 어! 대가리가 달려 있으면 알 거 아냐! 니들은 안 된다고!\"\n\n\"민원인님, 말씀하신…\"\n\n뚝.\n\n걸려 오는 전화 100통 중 90통은 거의 그런 내용이었다. 민주당의 선거 패배 책임을 심상정과 정의당에게 묻는, 그런 내용이었다.\n떨리는 목소리로 눈을 고정한 채 매뉴얼을 다급히 따라 읽는 서현과 달리, 민원팀 선배들은 너무나 태연하게 전화에 대응하고 있었다.\n\n몇 시간의 업무가 끝난 뒤, 멍한 표정의 그녀는 사수에게 악성 민원은 왜 이렇게 많은 것이냐고, 소수정당 정치인은 출마도 못 하는 것이냐고, 눈가가 붉어진 억울한 얼굴로 나지막이 물었다.\n\n사수가 입을 떼려는 몇 초 사이, 사무총장이 허심탄회하게 웃으며 말문을 열었다.\n\"우린 이때까지 선거만 끝나면 늘 이랬지. 진보신당 때도, 통진당 때도, 매번 선거 끝나면 민원으로 2~3일은 사무처가 멈추는 게 관례 아니었나?\"\n사수는 능글맞게 맞장구치며 서현의 어깨를 두드렸다.\n\n\"서현 동지, 너무 기죽지 말아요. 오히려 이렇게 욕을 많이 먹는 건 우리가 그만큼 열심히 했다는 거죠. 세상에 지지 맙시다. 우리는 더 나은 세상을 그리니까요. 그렇죠?\""
 tfrkphn.307.a:0 "네, 동지…  §g(쟤네들은 어차피 떨어질 거. 왜 나오는 거야?)§!"
 # 2020.3.27 북한 선전매체 메아리
 tfrkphn.308.t:0 "홍준표를 응원하는 북한 선전매체?"
 tfrkphn.308.desc:0 "27일 북한 선전매체 '메아리'가 미래통합당을 탈당해 무소속으로 4·15 총선에 출마한 홍준표 전 자유한국당 대표를 공개적으로 언급하며 긍정적인 평가를 내놓았습니다.\n\n북한 매체는 홍 전 대표가 공천 경쟁에서 패배했음에도 주저앉지 않고 총선 출마를 강행한 점을 거론하며, 과거 '칼날 검사'로 불렸던 그의 강한 성격과 정치적 기개가 여전히 남아 있다고 평가했습니다. 또한 황교안 당시 미래통합당 대표가 홍 전 대표의 공천 탈락을 주도한 것으로 묘사하며 당내 갈등을 부각했습니다.\n\n특히 북한 매체는 홍 전 대표가 무소속으로 당선되고 황교안 대표가 종로에서 낙선할 경우 총선 이후 정치적 상황이 달라질 수 있다고 주장했습니다. 이에 정치권에서는 북한이 보수진영 내부의 공천 갈등과 분열을 즐기고 있다는 해석이 나왔습니다."
 tfrkphn.308.a:0 "가장 안 어울리는 조합이군"
 # 대만 파병 반대 시민대행진
 tfrkphn.309.t:0 "형의 이름으로"
 tfrkphn.309.desc:0 "올해로 대학교 4학년인 서준은 난생처음으로 '대만 파병 반대 시민대행진'이라는 집회에 참가했다.\n\n지나가는 어르신들 눈에는 '영락없는 빨갱이'로 보였겠지만, 서준 자신은 불과 몇 달 전까지 열성적인 홍카… 아니, 홍준표의 지지자였다.\n\n그러나 이 모든 운명을 바꿔 놓은 건 바로 자기 자신이었다.\n자신이 만든 대통령 홍준표는 양안전쟁에 파병을 결정했고, 전문하사였던 형은 이역만리 낯선 땅에서 쓸쓸히 죽어 가야만 했다.\n\n주위를 둘러보니 자신이 그렇게 혐오했던 민주노총과 각종 노조부터 정의당, 진보당 같은 진보정당들, 그 뒤로는 처음 듣는 이름의 수많은 정당과 시민단체의 깃발이 나부끼고 있었다.\n\n집회 주최 측으로 보이는 사람에게 말을 걸기도 전에, 그는 구호가 적힌 코팅 종이와 작은 방석 하나를 내밀고는 쌩 지나가 버렸다.\n\n뭐 어떻게 하라고? 깔고 앉으라고?\n얼떨결에 4차선 아스팔트 도로에 방석을 깔고 앉으니, 앞 전광판에서는 고막이 터질 듯한 음량으로 각종 '운동권' 노래가 흘러나오고 있었다. 평소라면 지나쳐 버렸을 노래들이었지만 왠지 모르게 오늘은 싫지 않았다. 그의 심장은 노랫소리에 맞춰 떨리고 있었다.\n\n유족들과 활동가들의 연설이 끝나고, 사회자가 구호를 외치기 시작했다.\n\"함께 외칩시다! 대만 파병 중단하라!\"\n\n\"중단하라! 중단하라! 중단하라! 투쟁!\"\n\n둘러보면 사람들은 모두 저마다의 신념을 위해, 목적의식을 품고 열의에 차 구호를 외치고 있었다.\n그러나 서준의 목소리는 어딘가 분노에 차 있었다.\n자신의 형과 수많은 동료 시민들을 죽음의 구렁텅이로 몰아넣은 정부를 향해."
 tfrkphn.309.a:0 "아스팔트는 생각보다 차가웠다."
 # 양철 인간 (패전 310 / 승전 311)
 tfrkphn.310.t:0 "양철 인간"
 tfrkphn.310.desc:0 "'대통령님, 우리 아들은 무얼 위해 죽은 겁니까?' 수요일 아침 청와대로 날아온 편지의 첫 문구였다. 홍준표는 이 첫 문구를 읽고 그날 일정을 전부 취소했다.\n이제는 그도 답할 수 없는 질문이었다. 국익을 위해서. 중국의 패권 확장을 막기 위해서. 대한 건아로서 영광스럽게 남기 위해서. 말은 좋았다. 어쩌면 최소한 이기기라도 했더라면 변명할 말이 조금은 남았을지도 몰랐다.\n'친애하는 김진우 군의 어머님.' 이 첫 문장은 거의 두 시간 전에 쓰인 것이었다. 그 뒤로 어떤 글자도 이 무거운 종이에 무게를 더하지 못했다. 시계는 벌써 열한 시를 넘어가고 있었다. 째깍, 째깍.\n\n그에게 이런 편지쯤은 아무것도 아니었다. 죄송하다, 드릴 말씀이 없다, 유가족들에겐 최대한의 지원을 하겠다. 그 정도 문장이면 족하다고 정치인 홍준표의 감각이 말하고 있었다.\n인간 홍준표는 아니었다. 과연 그에게 이 편지에 답장할 자격이 있을까? 그의 결단으로 사람이 죽었다. 대한 건아가 죽었다. 인생의 가장 아름다운 시기를 살아가던 청년들이 벚꽃처럼 떨어졌다.\n그리고 그 청년들을 죽음으로 내몬 대한민국은 아무것도 얻지 못했다. 그들은 만리타향에서 이름도 알리지 못한 채 땅에 묻혔다. 잊혔다.\n\n그는 철의 심장을 가지고 있었다. 다만 지금 그의 내면에서는 새로운 용광로가 돌아가고 있었다. 자기혐오와 죄책감이라는 이름의 용광로였다. 딱히 끄고 싶은 마음도 들지 않았다.\n미국이 웃으며 자신의 관자놀이에 총구를 갖다 댄 채 마지막 손가락을 놀렸다. 중국은 미국 내전의 영향에서 벗어나기도 전에 대만 침공이라는 도박수를 걸었다. 그래서 그는 참전을 결심했다.\n예전에 어떤 빨갱이 두목은 한 사람의 죽음은 비극이지만 수만 명의 죽음은 통계라고 했다. 인간 홍준표는 그 말에 동의하지 않았다. 그에게는 숫자 하나하나가 비극이었고, 남은 인생 동안 평생 안고 가야 할 원죄였다. 그는 제발 신이 자신을 데려가길 바랐다. 목을 맬 자신도 들지 않았다.\n\n대통령은 철의 심장을 가져야 했다. 다만 오늘은 아니었다. 홍준표는 비서에게 오늘 온 연락은 전부 돌려보내라고 했다. 비서는 홍준표의 얼굴을 빤히 보더니 건성으로 대답하고 방을 나갔다. 홍준표는 의아해하다가 곧 깨달았다. 비서의 남동생이 파병 명단에 있었다. 또 자기혐오의 불이 타오르기 시작했다.\n\n그는 잠시 화장실로 가서 거울을 보았다. 그리고 보자마자 눈을 돌리며 빠져나왔다.\n\n그의 얼굴은, 세상에서 가장 혐오스러운 얼굴이었다."
 tfrkphn.310.a:0 "…심장은 그것이 얼마나 많이 사랑하느냐가 아니라, 얼마나 다른 사람들로부터 사랑을 받느냐로 판단되는 거란다."
 tfrkphn.311.t:0 "양철 인간"
 tfrkphn.311.desc:0 "'대통령님, 우리 아들은 무얼 위해 죽은 겁니까?' 수요일 아침 청와대로 날아온 편지의 첫 문구였다. 홍준표는 이 첫 문구를 읽고 그날 일정을 전부 취소했다.\n답은 이미 정해져 있었다. 국익을 위해서. 중국의 패권 확장을 막기 위해서. 대한 건아로서 영광스럽게 남기 위해서. 그리고 대한민국은 이겼다. 신문은 승전을 말했고, 광장에는 태극기가 넘실댔다. 답할 말은 차고 넘쳤다.\n'친애하는 김진우 군의 어머님.' 이 첫 문장은 거의 두 시간 전에 쓰인 것이었다. 그 뒤로 어떤 글자도 이 무거운 종이에 무게를 더하지 못했다. 시계는 벌써 열한 시를 넘어가고 있었다. 째깍, 째깍.\n\n그에게 이런 편지쯤은 아무것도 아니었다. 아드님은 조국을 지킨 영웅이다, 그 희생으로 대한민국이 이겼다, 국가가 끝까지 기억하겠다. 그 정도 문장이면 족하다고 정치인 홍준표의 감각이 말하고 있었다.\n인간 홍준표는 아니었다. 승리라는 말이 한 어머니의 아들을 돌려줄 수 있을까? 그의 결단으로 사람이 죽었다. 대한 건아가 죽었다. 인생의 가장 아름다운 시기를 살아가던 청년들이 벚꽃처럼 떨어졌다.\n그리고 그 청년들 위에서 대한민국은 승리를 얻었다. 그들의 이름은 기념비에 새겨질 것이다. 그러나 기념비는 아무도 안아 주지 않는다.\n\n그는 철의 심장을 가지고 있었다. 다만 지금 그의 내면에서는 새로운 용광로가 돌아가고 있었다. 승리가 데워 놓은 쇳물 아래에서 죄책감이 조용히 끓고 있었다. 아무도 그 불을 보지 못했다.\n미국이 웃으며 자신의 관자놀이에 총구를 갖다 댄 채 마지막 손가락을 놀렸다. 중국은 미국 내전의 영향에서 벗어나기도 전에 대만 침공이라는 도박수를 걸었다. 그래서 그는 참전을 결심했고, 그 도박에서 이겼다.\n예전에 어떤 빨갱이 두목은 한 사람의 죽음은 비극이지만 수만 명의 죽음은 통계라고 했다. 세상은 그 말대로 그를 대했다. 전사자 수는 승전 보고서의 한 줄이 되었고, 지지율 그래프는 위로 솟았다. 인간 홍준표는 그 말에 동의하지 않았다. 그에게는 숫자 하나하나가 비극이었다.\n\n대통령은 철의 심장을 가져야 했다. 다만 오늘은 아니었다. 홍준표는 비서에게 오늘 온 연락은 전부 돌려보내라고 했다. 비서는 환하게 웃으며 축하 화환이 또 들어왔다고 전하고 방을 나갔다. 비서의 남동생은 파병 명단에 있었고, 살아서 돌아왔다. 그 웃음이 홍준표의 가슴을 찔렀다.\n\n그는 잠시 화장실로 가서 거울을 보았다. 그리고 보자마자 눈을 돌리며 빠져나왔다.\n\n그의 얼굴은, 세상에서 가장 사랑받는 얼굴이었다."
 tfrkphn.311.a:0 "…심장은 그것이 얼마나 많이 사랑하느냐가 아니라, 얼마나 다른 사람들로부터 사랑을 받느냐로 판단되는 거란다."
 # 주요 추진 정책: 전통경찰국 설립
 tfrkphn.312.t:0 "전통경찰국 설립"
 tfrkphn.312.desc:0 "· 정부가 경찰 조직 개편안을 발표함.\n· 흩어져 있던 경찰 지휘 체계를 하나로 묶는 전통경찰국을 세움.\n· 무너진 공권력과 치안 기강을 바로 세우는 것이 목표임.\n· 야당은 \"경찰 장악 시도\"라며 반발함.\n· 정부는 \"법 앞에 예외는 없다\"는 입장을 굽히지 않음."
 tfrkphn.312.a:0 "법과 질서가 먼저다."
 # 지지도 개편: 전쟁 전엔 사건으로만, 종전 뒤 정치력 순회, 전쟁 중 여론조사 금지
 TFRKPHN_hong_tour_prewar_info:0 "지역 순회는 종전 뒤에"
 TFRKPHN_hong_tour_prewar_info_desc:0 "양안전쟁의 그림자가 드리운 지금은 정치력을 지역 순회에 쓸 여유가 없습니다. 전쟁 전에는 지지도가 사건으로만 움직이며, §Y양안전쟁이 끝나면§! 정치력을 들여 지역을 직접 돌 수 있습니다."
 TFRKPHN_hong_b02_20:0 "여론조사 금지"
 TFRKPHN_hong_b02_20_desc:0 "전시에 여론은 무기가 됩니다. 전쟁이 끝날 때까지 정당 지지율과 국정 지지도 조사의 공표를 금지합니다."
 TFRKPHN_poll_ban_tt:0 "§Y양안전쟁이 끝날 때까지§! 2주마다 오던 지역 지지도 하락과 '전국 지지도 하락' 미션이 멈춥니다.\n종전 뒤에는 다시 시작됩니다."
 # 막말 구설수 (취임 뒤 70·105·140일)
 tfrkphn.313.t:0 "말 한마디의 무게"
 tfrkphn.313.desc:0 "· 취임 석 달째, 대통령의 기자간담회가 생중계됨.\n· 민감한 질문이 이어지자 대통령의 말투가 거칠어짐.\n· 질문한 기자를 면박 주는 장면이 그대로 전파를 탐.\n· 영상은 반나절 만에 조회수 수백만을 넘김.\n· 야당은 \"국민을 대하는 태도가 저렇다\"며 공세에 나섬."
 tfrkphn.313.a:0 "고개를 숙인다."
 tfrkphn.313.b:0 "물러서지 않는다."
 tfrkphn.314.t:0 "페이스북 한 줄"
 tfrkphn.314.desc:0 "· 새벽에 대통령 개인 SNS에 글 한 줄이 올라옴.\n· 야당 대표를 겨냥한 날 선 표현이 담겨 있었음.\n· 참모진이 급히 글을 내렸으나 이미 캡처가 퍼진 뒤였음.\n· 지지층은 \"속이 시원하다\"며 환호함.\n· 중도층은 \"대통령의 품격\"을 묻기 시작함."
 tfrkphn.314.a:0 "참모진의 말을 듣는다."
 tfrkphn.314.b:0 "할 말은 한다."
 tfrkphn.315.t:0 "홍카콜라의 그늘"
 tfrkphn.315.desc:0 "· 시원한 직설로 사랑받던 '홍카콜라' 화법이 도마에 오름.\n· 연이은 설화로 여당 안에서도 우려가 나옴.\n· 한 중진 의원은 \"대통령의 입이 정부의 가장 큰 리스크\"라고 말함.\n· 지지율은 취임 초의 기세를 잃고 내리막을 탐.\n· 대통령은 어떤 화법을 이어 갈지 선택해야 함."
 tfrkphn.315.a:0 "말을 아끼겠다."
 tfrkphn.315.b:0 "나는 원래 이랬다."
 TFRKPHN_gaffe_apology_tt:0 "모든 지역 지지도 §R-4%§!"
 TFRKPHN_gaffe_defiant_tt:0 "모든 지역 지지도 §R-8%§!, 대신 §Y경북·경남§! 지지도 §G+6%§! (지지층 결집)"
