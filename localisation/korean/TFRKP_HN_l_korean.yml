 TFRKPHN_hong_b03_32:0 "채무 제로"
 TFRKPHN_hong_b03_32_desc:0 "경남도를 빚 없는 광역단체로 만들었던 그 방식으로 나라 살림을 바로 세웁니다."
 tfrkphn.126.t:0 "채무 제로"
 tfrkphn.126.desc:0 "채무제로는 홍준표가 경남도지사 시절 실행한 대표적 정책입니다. 도지사 취임 당시 '당당한 경남 시대'라는 구호를 내걸고, 경남 미래 50년 사업과 다음 임기 4년을 합해 5년 6개월 동안 채무 1조 3,488억 원의 절반을 갚겠다고 약속했습니다. 보궐선거 당선 직후 재정점검단을 만들어 재정 건전화 정책을 1순위로 정했습니다. 그가 취임할 당시 경상남도의 재정 상황은 파산 전 단계인 '재정고통상황'으로 평가받았지만, 홍준표 당시 도지사는 이를 3년 6개월 만에 100% 줄여 해결했습니다.\n\n행정 개혁 사안으로 무분별한 선심성 사업 폐지 3,388억 원, 보조사업 재정 점검 793억 원, 진주의료원 폐원 및 경남도 산하기관 구조조정 615억 원, 복지 누수 차단 588억 원, 낭비성 예산 구조조정 등을 추진하여 총 절감한 비용만 6,464억 원에 달했습니다. 또한 재정 개혁으로 거가대로 재구조화, 체납·탈루·은닉 세원 발굴 1,598억 원 등을 통해 절감 및 확보한 예산이 7,024억 원에 달했습니다.\n\n아울러 이를 통해 절감한 예산으로 취임 초 2조 178억 원이던 복지예산을 2016년에는 2조 5,319억 원으로 사상 최대액까지 증액했는데, 이는 전체 예산의 34.7%로 전국 광역단체 중 최고 수준의 복지예산 편성 비율이었습니다. 또한 SOC(사회간접자본) 사업을 줄이기는커녕, '경남 미래 50년 사업'의 일환으로 사천의 항공 산단, 밀양의 나노 산단, 거제의 해양플랜트 산단 등 국가산업단지를 3개나 동시에 유치하여 경남의 미래 50년에 대비했습니다."
 tfrkphn.126.a:0 "경남에서 했던 일을 이제 나라에서 한다."
 TFRKPHN_hong_b04_01:0 "개헌 논의"
 TFRKPHN_hong_b04_01_desc:0 "1987년 헌법은 민주화를 뿌리내리게 했지만, 40년 가까이 지나며 낡은 조항들이 국정의 발목을 잡고 있습니다. 역대 정부는 개헌을 약속하고도 집권하면 미뤄 왔습니다. 전쟁에서 이긴 지금이 '87년 체제'를 넘어설 마지막 기회입니다. 개헌안을 국회에 올리고, 300일 안에 찬성 200석을 모아야 합니다."
 tfrkphn.75.t:0 "개헌 논의"
 tfrkphn.75.desc:0 "전쟁 승리 선언 이틀 뒤, 대통령 집무실 옆 소회의실.\n\n화이트보드에는 마커 글씨로 다섯 줄이 적혀 있었다. 헌법, 입시와 사법시험, 병역과 안보, 노동, 방송. 줄마다 옆에는 물음표와 함께 '반대 예상'이라는 메모가 붙어 있었다.\n\n\"전쟁 끝났다고 다들 한숨 돌리는 지금이 아니면 못 합니다. 지지율은 시간이 지날수록 빠집니다.\"\n\"반대로 지금 밀어붙이면 승리에 취해 오만해졌다는 소리를 들을 겁니다.\"\n\n두 비서관의 말다툼이 길어지자 누군가 마커 뚜껑을 닫으며 말했다. 어느 쪽이든 욕은 먹게 되어 있다고. 그렇다면 순서라도 정하자고.\n\n그날 저녁, 다섯 줄 가운데 맨 윗줄에 동그라미가 쳐졌다."
 tfrkphn.75.a:0 "일단 화이트보드는 지우지 않는다."
 # 개헌 논의
 TFRKPHN_hong_amend_category:0 "개헌 논의"
 TFRKPHN_hong_amend_category_desc:0 "제7공화국은 나라 운영의 실질을 바꾸는 개혁이고, 새 헌법은 그 개혁을 담는 그릇입니다.\n\n개헌안이 국회에 올라왔습니다. 300일 안에 재적 의원 3분의 2인 §G찬성 200석§!을 모아야 가결됩니다. 찬성이 100석 이하로 줄어들거나 기한이 끝날 때까지 200석을 넘지 못하면 부결됩니다.\n\n가결되면 이곳에서 §Y개헌 결정§!을 하나씩 진행합니다. 야당과 타협한 만큼 새 헌법의 내용도 무뎌집니다."
 TFRKPHN_hong_amend_title:0 "[TFRKPHN_GetAmendTitle]"
