 TFRKPHN_hong_amend_info:0 "§G찬성§!  §R반대§!   가결 조건: 찬성 200석 이상   남은 기간: [?TFRKPHN_amend_days|0]일\n가결되면 이 범주에 개헌 결정 10개가 열립니다. (하나당 30일, 한 번에 하나씩)"
