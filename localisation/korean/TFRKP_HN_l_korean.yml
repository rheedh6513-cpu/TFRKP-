 TFRKPHN_const_body:0 "헌법 1조 1항 : 대한민국은 민주공화국이다.\n헌법 1조 2항 : 대한민국의 주권은 국민에게 있고,\n                    모든 권력은 국민으로부터 나온다.\n[TFRKPHN_GetConst_term]\n[TFRKPHN_GetConst_vp]\n[TFRKPHN_GetConst_bicam]\n[TFRKPHN_GetConst_court]\n[TFRKPHN_GetConst_cio]\n[TFRKPHN_GetConst_nbi]\n[TFRKPHN_GetConst_district]\n[TFRKPHN_GetConst_nec]\n§g타협 [?TFRKPHN_amend_comp|0]회 · 개헌 효과 [?TFRKPHN_amend_eff|%0]   §G초록§!=개정  §O주황§!=타협안§!"
