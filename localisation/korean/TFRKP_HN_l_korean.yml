 # 1-6, 1-7 이벤트와 진정한 보수
 tfrkphn.21.t:0 "청년에게 희망을"
 tfrkphn.21.desc:0 "서울의 한 청년 창업 지원센터. 대통령과 청년들의 간담회가 열린 자리였다.\n\n\"솔직히 말씀드리겠습니다. 저희는 집도 못 사고, 결혼도 못 하고, 이제는 취직도 못 합니다. 미국이 망했다, 경제가 어렵다, 다 좋습니다. 그런데 그 청구서는 왜 늘 저희한테만 날아옵니까?\"\n\n마이크를 잡은 스물여덟 살 청년의 목소리가 떨렸다. 객석 여기저기서 고개를 끄덕이는 사람들이 보였다. 수행원들이 서로 눈치를 보는 사이, 홍준표는 메모하던 펜을 내려놓고 한참 동안 그 청년을 바라보았다.\n\n후보 시절부터 그가 거듭 짚어 온 진단이 바로 이 자리에 있었다.\n\n\"대한민국 70년을 관통해 온 '성취와 긍정의 인식' 대신 '불안과 좌절의 부정적 인식'이 더욱 강해지고 있다\"\n\n그날 대통령은 준비해 온 원고를 끝내 읽지 않았다. 대신 청년 일자리와 주거 지원을 정부의 최우선 과제로 삼겠다고, 꿈을 잃은 청년이 있는 나라에는 미래가 없다고 그 자리에서 약속했다.\n\n간담회가 끝난 뒤에도 청년들은 쉽게 자리를 뜨지 않았다."
 tfrkphn.21.a:0 "그날 밤, 청년 커뮤니티에는 오랜만에 \"한번 믿어 볼까\"라는 글이 올라왔다."
 tfrkphn.22.t:0 "국민에게 행복을"
 tfrkphn.22.desc:0 "경기도 어느 낡은 아파트의 거실. 저녁 9시 뉴스가 대통령의 대국민 담화를 생중계하고 있었다.\n\n\"여보, 저 사람 또 뭐라는 거야?\"\n\"민생 대책이래. 물가 잡고, 자영업자 지원하고... 매번 하는 소리지 뭐.\"\n\n남편은 시큰둥하게 리모컨을 집어 들었다가 이내 다시 내려놓았다. 화면 속 대통령은 정치란 결국 국민을 행복하게 하기 위해 존재하는 것이라며, 서민 경제와 민생 회복에 정부의 모든 힘을 쏟겠다고 말하고 있었다. 이어서 취약계층 긴급 지원과 생필품 가격 안정 대책이 하나씩 발표되었다.\n\n가게 문을 닫은 지 석 달째인 남편은 아무 말 없이 화면을 바라보았다. 식탁 위에는 아직 뜯지 않은 독촉장이 쌓여 있었다."
 tfrkphn.22.a:0 "\"그래, 이번엔 좀 믿어 보자.\""
 TFRKPHN_true_conservative_wait_tt:0 "청년에게 희망을과 국민에게 행복을을 모두 마치면 국민정신 진정한 보수를 얻습니다."
 TFRKPHN_true_conservative:0 "진정한 보수"
 TFRKPHN_true_conservative_desc:0 "청년에게는 희망을, 국민에게는 행복을. 국민의 삶을 먼저 챙기는 것이야말로 진정한 보수의 길입니다."
 # 1-8, 1-9 이벤트
 tfrkphn.23.t:0 "위장 평화쇼는 끝났다"
 tfrkphn.23.desc:0 "청와대 국가안보실, 대북 정책 재검토 회의.\n\n벽면 화면에는 지난 5년의 기록이 차례로 떠올랐다. 판문점 도보다리 위의 두 정상, 평양 능라도 경기장을 가득 메운 15만 명의 박수, 그리고 9·19 군사합의 서명식. 그 화면 위로 또 다른 기록이 겹쳐졌다. 멈추지 않은 북한의 탄도미사일 발사, 2020년 6월 잿더미가 된 개성 남북공동연락사무소, 그리고 같은 해 9월 서해에서 북한군의 총격에 숨진 우리 공무원.\n\n\"이게 평화였습니까? 북한한테 핵 만들 시간만 벌어 준 거 아닙니까?\"\n\n누군가의 낮은 목소리가 회의실의 침묵을 깼다. 아무도 대답하지 않았다.\n\n회의가 끝난 뒤 정부는 새 대북 노선을 발표했다. 북한이 비핵화를 향해 실제로 움직이지 않는 한 어떤 대가도 주지 않는다. 우리 군의 손발을 묶어 온 9·19 군사합의는 전면 재검토한다. 북한의 도발에는 즉각적이고 단호하게 대응한다. 대화의 문은 열어 두되, 그 대화는 굴종이 아닌 힘을 바탕으로 한다.\n\n야당은 한반도의 긴장을 키우는 결정이라며 거세게 반발했다. 그러나 대통령의 판단은 후보 시절 이미 밝힌 그대로였다. 대북 정책 하나만의 문제가 아니었다는 것이다.\n\n\"지금 정치, 경제, 사회, 문화, 대북, 외교, 국방 등 국가 전 분야의 정책 혼란과 무능은 국민 고통을 최악의 상황으로 몰고 가고 있다\"\n\n힘이 뒷받침되지 않는 평화는 평화가 아니다."
 tfrkphn.23.a:0 "판문점의 도보다리는 이제 사진 속에만 남았다."
 tfrkphn.24.t:0 "연평도를 잊지 마라"
 tfrkphn.24.desc:0 "(속보) 2010년 11월 23일\n오늘 오후 2시 34분, 북한군이 서해 연평도를 향해 해안포와 방사포 170여 발을 퍼부었습니다. 포격은 약 한 시간 동안 이어졌고, 해병대 연평부대 진지와 민가에 포탄이 떨어지면서 섬 곳곳에서 불길이 치솟았습니다. 해병대는 K-9 자주포로 80여 발의 대응 사격을 했습니다.\n이 공격으로 해병대 서정우 하사와 문광욱 일병이 전사했고, 민간인 2명이 숨졌습니다. 수십 명이 다쳤으며 민가 수십 채가 불에 타거나 부서졌습니다. 주민들은 어선을 타고 인천으로 피란길에 올랐습니다.\n\n새벽 2시, 청와대 집무실.\n\n국방부가 올린 서해 접경지역 보고서 맨 위에는 누렇게 바랜 기사 한 장이 꽂혀 있었다. 홍준표는 그 종이를 한참 동안 내려다보았다. 그을린 K-9 자주포, 소나무에 박힌 채 발견된 어느 해병의 정모, 그리고 피란선에 오른 섬 주민들의 얼굴.\n\n그날 이후 대한민국은 다시는 당하지 않겠다고 다짐했다. 그러나 그 다짐 뒤에는 늘 미국이라는 든든한 버팀목이 있었다. 이제 그 미국은 없다.\n\n'또다시 연평도에 포탄이 떨어진다면, 그때 우리를 지켜 줄 것은 오직 우리 군뿐이다.'\n\n너무 강하게 맞서면 전면전이 될 수도 있었다. 머뭇거리면 국민이 죽는다. 대통령의 책상 위에 쉬운 답은 없었다.\n\n창밖이 희미하게 밝아 올 무렵, 홍준표는 보고서를 덮었다. 도발에는 망설임 없이 응징한다. 그리고 그 응징을 감당할 힘을 반드시 갖춘다. 연평도를 잊지 않는 것, 그것이 대한민국 안보의 출발점이었다."
 tfrkphn.24.a:0 "다시는 당하지 않는다!"
 TFRKPHN_hong_all_regions_dpk_down_tt:0 "전국 모든 지역에서 §B민주당§! 지지도 §R-5%§! (§R국민의힘§! 지지도 §G+5%§!)"
 # 1-10, 1-11 이벤트
 tfrkphn.25.t:0 "민생도 보수"
 tfrkphn.25.desc:0 "청와대 지하 벙커, 국가위기관리센터.\n\n\"대통령님, 비상경제대책회의 준비 끝났습니다.\"\n\n두꺼운 철문이 닫히자 바깥의 소음이 거짓말처럼 사라졌다. 이 방에 다시 비상경제상황실이 차려진 것은 십수 년 만이었다.\n\n2008년 가을, 리먼 브라더스의 파산과 함께 세계 경제가 무너져 내렸을 때 이명박 정부는 바로 이곳에 상황실을 차리고 매주 대책회의를 열었다. 미국과 300억 달러 규모의 통화스와프를 맺어 외환시장을 진정시켰고, 과감한 재정 투입으로 일자리를 지켰다. 서민의 내 집 마련을 위해 값싼 보금자리주택을 내놓았고, 얼어붙은 부동산 시장도 되살려 냈다. 대한민국은 OECD 국가 가운데 가장 빨리 위기를 벗어난 나라로 꼽혔다. 그리고 그때 여당 원내대표로서 그 과정을 함께했던 사람이 바로 홍준표였다.\n\n\"그때랑은 다릅니다. 통화스와프를 맺어 줄 미국이 없습니다.\"\n\n경제수석의 보고에 회의실이 무겁게 가라앉았다. 장바구니 물가는 치솟고, 일자리는 줄고, 끼니를 걱정하는 가정은 늘고 있었다.\n\n회의실 한쪽에서는 기업 규제 문제도 거론되었다. 홍준표는 후보 시절부터 이 점을 지적해 왔다.\n\n\"국가는 기업이 활동하는 데 창의력을 발휘하도록 지원해주면 되는데, 문재인 정부는 걸핏하면 세무조사하고 공정거래위원회를 동원해 갑질을 한다\"\n\n이번 정부는 그 반대로 가겠다는 것이 대통령의 뜻이었다.\n\n대통령은 그때의 교훈을 살리되 이번에는 우리 힘으로 버텨야 한다며, 서민 생계 지원과 집값 안정, 일자리 지키기에 나라의 모든 힘을 모으라고 지시했다. 보수는 가진 사람만을 위한 정치라는 말을 이번에야말로 끊어 내야 했다."
 tfrkphn.25.a:0 "서민이 살아야 나라가 산다!"
 tfrkphn.26.t:0 "안보도 보수"
 tfrkphn.26.desc:0 "수신: 대한민국 합동참모본부, 국가정보원\n발신: 대통령실 국가안보실\n제목: 대북 도발 대응 지침 및 정보 역량 재건 지시\n\n1. 배경\n2010년 연평도 포격 직후 국방부 장관에 오른 김관진은 일선 부대에 북한이 도발하면 위에 묻지 말고 먼저 대응한 뒤 보고하라는 '선조치 후보고' 원칙을 내렸음. 아울러 도발의 원점은 물론 이를 지원하고 지휘한 세력까지 응징하라는 지침을 함께 하달하였음.\n2015년 북한의 목함지뢰 도발로 우리 장병이 중상을 입었을 당시, 국가안보실장이던 김관진은 11년간 중단되었던 대북 확성기 방송을 재개하였고, 결국 북한으로부터 유감 표명을 받아 냄.\n\n2. 지시 사항\n가. 전방 부대에 '선조치 후보고' 권한을 즉시 복원할 것.\n나. 북한의 도발 발생 시 대북 확성기 방송을 즉각 재개할 것.\n다. 도발 원점·지원 세력·지휘 세력에 대한 응징 계획을 재정비할 것.\n라. 미국의 정보 지원 중단에 따라, 약화된 대북 정보망을 처음부터 재건할 것.\n\n3. 비고\n정보기관은 정치에 휘둘리지 않고 오직 국가 안보에만 전념할 것."
 tfrkphn.26.a:0 "음지에서 일하고 양지를 지향한다"
 TFRKPHN_intel_restore:0 "대북 정보망 재건"
 TFRKPHN_intel_restore_desc:0 "정치에 휘둘리던 정보기관이 본래의 자리로 돌아왔습니다. 무너졌던 대북 정보망이 다시 세워지고 있습니다."

 tfrkphn.27.desc:0 "새벽 3시, 청와대 관저의 전화벨이 울렸다.\n\n\"대통령님, 중국군이 대만 해협 일대에서 대규모 상륙 훈련을 시작했습니다. 규모가 지난번과는 비교도 안 됩니다.\"\n\n수화기 너머 국가안보실장의 목소리는 평소보다 한 톤 낮았다. 홍준표는 아무 말 없이 침대에서 몸을 일으켰다.\n\n집무실의 화면에는 쉴 새 없이 보고가 올라왔다. 대만 해협을 가득 메운 중국 함정들, 대만 언론의 긴급 특보, 평화헌법을 고치겠다는 일본 정부의 담화, 그리고 그 틈을 노려 또다시 동해로 탄도미사일을 쏘아 올린 북한. 미국이 무너진 자리에 생긴 거대한 공백 위로, 동북아의 모든 나라가 저마다 불을 지피고 있었다.\n\n\"이 불이 대만에서 멈출까요?\"\n\n누군가 혼잣말처럼 물었다. 대답하는 사람은 없었다. 바다 건너 대만과 이 땅 사이의 거리는 생각보다 가까웠다.\n\n대통령은 오래도록 지도를 내려다보았다. 불길은 이미 타오르기 시작했다. 남은 것은 그 불길이 이 땅까지 번져 올 때, 대한민국이 무엇을 들고 서 있느냐는 것뿐이었다."
 tfrkphn.27.t:0 "타오르는 불길"
 tfrkphn.27.a:0 "불길은 이미 바다 건너까지 번져 오고 있었다."


 # 양안전쟁 중점 (2-N)

 TFRKPHN_hong_b02_01:0 "대만지원법 발의"
 TFRKPHN_hong_b02_01_desc:0 "대만이 불타고 있습니다. 대만이 무너지면 다음은 우리입니다. 정부는 대만을 돕기 위한 법안을 국회에 발의합니다."
 tfrkphn.29.t:0 "대만지원법 표결"
 tfrkphn.29.desc:0 "(속보) 중국군, 대만 본섬 상륙 개시\n타이베이를 비롯한 대만 전 지역이 불바다에 휩싸이고 있습니다. 새벽부터 이어진 미사일 공격으로 타이베이 도심 곳곳에서 거대한 불길이 치솟았고, 가오슝과 타이중 항구에는 중국군 상륙함들이 줄지어 접근하고 있습니다. 대만 정부는 전 국민에게 대피령을 내렸습니다.\n\n같은 시각, 여의도 국회의사당.\n\n본회의장의 공기는 팽팽하게 얼어붙어 있었다. 정부와 여당이 발의한 대만지원법이 표결을 앞두고 있었다. 무기와 물자 지원, 그리고 필요하다면 우리 군의 파견까지 열어 두는 법안이었다.\n\n\"대만이 무너지면 다음은 우리입니다! 지금 손을 놓고 있으면 역사가 우리를 용서하지 않을 겁니다!\"\n\"이건 전쟁에 뛰어들겠다는 선언입니다! 국민을 사지로 몰아넣을 셈입니까!\"\n\n여당 의원들은 일제히 찬성 표결을 마쳤다. 이제 공은 과반 의석을 쥔 야당에게 넘어갔다. 야당 의원들은 의원총회를 마치고 하나둘 본회의장으로 들어서고 있었지만, 그들의 표정에서는 아무것도 읽어 낼 수 없었다.\n\n청와대 집무실의 홍준표는 국회 중계 화면에서 눈을 떼지 못했다. 전광판에 숫자가 하나씩 올라가기 시작했다."
 tfrkphn.29.a:0 "가결되었다"
 tfrkphn.29.b:0 "부결되었다"
 TFRKPHN_hong_tw_bill_passed_tt:0 "§G대만 지원§! 중점(2-2)을 진행할 수 있게 됩니다."
 TFRKPHN_hong_tw_bill_rejected_tt:0 "중립 중점(2-3)을 진행할 수 있게 됩니다."

 TFRKPHN_hong_b02_02:0 "대한민국의 양안전쟁 참전"
 TFRKPHN_hong_b02_02_desc:0 "대만지원법이 국회를 통과했습니다. 대한민국은 여전히 중립국입니다. 적어도 서류 위에서는 말입니다."
 tfrkphn.30.t:0 "대한민국의 양안전쟁 참전"
 tfrkphn.30.desc:0 "국방부 브리핑룸, 오전 10시.\n\n\"대한민국은 이번 양안 간 무력 충돌에 대해 중립의 입장을 유지하고 있으며, 우리 군이 전투에 참여하는 일은 없을 것입니다. 이번 대만지원법에 따른 조치는 어디까지나 인도적 지원과 방어 물자 제공에 한정됩니다.\"\n\n국방부 대변인은 준비된 원고를 또박또박 읽어 내려갔다. 기자들의 질문이 쏟아졌지만, 대답은 끝까지 같았다. 중립. 인도적 지원. 방어 물자.\n\n그 시각, 부산항에서는 '농기계'와 '의료 장비'라고 적힌 컨테이너들이 대만행 화물선에 실리고 있었다. 성남 서울공항에서는 국적 표시를 지운 수송기가 남쪽 하늘로 날아올랐고, 며칠 전 '개인 사유'로 전역 신청서를 낸 공군 조종사 수십 명은 오키나와행 민항기에 몸을 실었다. 대만 해협 너머 전장에서는 한국어로 된 무전이 심심치 않게 잡히기 시작했다.\n\n베이징은 즉각 강력한 항의 성명을 냈다. 서울의 대답은 이번에도 같았다. 대한민국은 중립국이며, 어떠한 전투에도 참여하지 않는다.\n\n서류 위의 대한민국은 여전히 중립국이었다. 그러나 이 전쟁에 대한민국이 발을 들였다는 사실을 모르는 사람은 아무도 없었다."
 tfrkphn.30.a:0 "\"대한민국은 중립국입니다.\""

 TFRKPHN_hong_b02_04:0 "탄약 지원"
 TFRKPHN_hong_b02_04_desc:0 "현대전에서 가장 중요한 것은 보급입니다. 대한민국은 지난 70년간의 정전으로 수많은 탄약과 포탄을 보유하고 있습니다. 이를 우리는 대만과 일본에 \"대여\"해 줄 것입니다."

 tfrkphn.31.t:0 "빌려주는 겁니다"
 tfrkphn.31.desc:0 "경상북도 어느 산골짜기의 탄약고.\n\n70년 동안 언제 다시 터질지 모르는 전쟁을 기다리며 쌓아 두었던 포탄들이 줄지어 트럭에 실리고 있었다. 녹슨 철문 위에는 '탄약 정비 및 재배치'라는 공문이 붙어 있었다.\n\n\"중사님, 이거 진짜 다 빼는 겁니까? 북한이 쳐들어오면 어쩌려고요.\"\n\"위에서 다 계산하고 하는 거겠지. 빌려주는 거래, 빌려주는 거.\"\n\n트럭 행렬은 밤새 부산항으로 이어졌다. 서류상 행선지는 '우방국 정비 지원', 품목은 '대여 물자'였다. 반납 기한을 적는 칸은 비어 있었다.\n\n같은 주, 대만과 일본의 보급 창고에는 한국어 표기가 선명한 탄약 상자들이 차곡차곡 쌓이기 시작했다."
 tfrkphn.31.a:0 "반납 기한: 미정"

 # 2-8 후방의 싸움
 TFRKPHN_hong_b02_08:0 "후방의 싸움"
 TFRKPHN_hong_b02_08_desc:0 "일제강점기 당시 한국인은 봉오동 전투와 광복군 등으로 연합국을 지원했습니다. 다시 한번 민주주의가 위협받는 상황에서, 우리는 민주주의의 당당한 대의를 함께할 것입니다."
 tfrkphn.32.t:0 "후방의 싸움"
 tfrkphn.32.desc:0 "1920년 6월, 만주 봉오동 골짜기.\n\n홍범도가 이끄는 독립군은 골짜기로 일본군을 끌어들인 뒤 사방에서 총탄을 퍼부었다. 나라를 잃은 지 10년, 조선의 젊은이들은 총 한 자루를 들고 제국의 군대에 맞섰다.\n\n그로부터 20년 뒤, 충칭에서 창설된 한국광복군은 연합국의 일원으로 싸웠다. 인도와 버마의 정글에서는 영국군과 함께 일본군의 방송을 감청하고 포로를 심문했고, 국내 진공을 위해 미국 OSS와 손을 잡고 특수 훈련을 받았다. 정규군도, 나라도 없었지만 그들은 전선의 뒤편에서 자유를 위해 싸웠다.\n\n그리고 다시 80여 년이 지났다.\n\n청와대 국가안보실의 회의 탁자 위에는 푸젠성의 군수 시설 위성사진, 서해의 중국 해군 이동 경로, 그리고 이어도 해양과학기지의 설계도가 펼쳐져 있었다. 이번에도 대한민국은 전선에 서지 않는다. 적어도 공식적으로는.\n\n그러나 전쟁은 총성이 울리는 곳에서만 벌어지는 것이 아니다."
 tfrkphn.32.a:0 "전선의 뒤편에서, 다시 한번."
 TFRKPHN_hong_rear_category:0 "후방의 싸움"
 TFRKPHN_hong_rear_category_desc:0 "공식적으로 대한민국은 중립국입니다. 그러나 중국의 후방을 흔드는 일까지 멈출 이유는 없습니다."
 TFRKPHN_hong_rear_defectors:0 "붉은 장막 너머의 탈출로"
 TFRKPHN_hong_rear_defectors_desc:0 "중국 공산당에 맞서 온 반공 인사들을 몰래 빼내 망명을 돕습니다. 그들이 사라진 자리에는 불안과 동요만이 남을 것입니다."
 TFRKPHN_hong_rear_fujian_sabotage:0 "푸젠의 밤을 불태워라"
 TFRKPHN_hong_rear_fujian_sabotage_desc:0 "대만 침공의 전진기지인 푸젠성의 군수 시설을 타격합니다."
 TFRKPHN_hong_rear_fujian_sabotage_tt:0 "푸젠성(샤먼, 푸저우, 취안저우) 중 중국이 장악한 지역마다:\n기반시설 §R-2§!\n군수공장 §R-1§!\n비행장 §R-1§!"
 TFRKPHN_hong_rear_ieodo:0 "이어도의 눈"
 TFRKPHN_hong_rear_ieodo_desc:0 "이어도 해양과학기지를 감시 거점으로 활용해, 동중국해를 오가는 중국군의 움직임을 대만과 일본에 실시간으로 넘겨줍니다."
 TFRKPHN_hong_rear_west_sea:0 "서해를 걸어 잠가라"
 TFRKPHN_hong_rear_west_sea_desc:0 "서해의 경비를 강화해 중국 북해함대의 발을 묶습니다. 서해에서 중국 해군은 더 이상 마음대로 움직일 수 없습니다."
 TFRKPHN_ieodo_watch:0 "이어도의 눈"
 TFRKPHN_ieodo_watch_desc:0 "대한민국이 이어도에서 넘겨주는 감시 정보 덕분에 하늘과 바다의 적을 먼저 찾아낼 수 있습니다."
 TFRKPHN_west_sea_patrol:0 "서해 봉쇄"
 TFRKPHN_west_sea_patrol_desc:0 "대한민국 해군이 서해를 틀어막고 있습니다. 북해함대는 서해에서 제대로 힘을 쓰지 못하고 있습니다."

 # 2-5, 2-9 국내
 TFRKPHN_hong_b02_05:0 "국민 안심시키기"
 TFRKPHN_hong_b02_05_desc:0 "바다 건너에서 전쟁이 벌어지자 국민들의 불안이 커지고 있습니다. 정부는 국민의 일상을 끝까지 지킬 것이며, 그 누구도 원치 않는 전쟁에 내몰리지 않을 것임을 분명히 약속해야 합니다."
 TFRKPHN_hong_b02_09:0 "강경한 대북관"
 TFRKPHN_hong_b02_09_desc:0 "중국이 대만에 발이 묶인 지금, 북한이 오판할 가능성은 어느 때보다 높습니다. 북한의 어떤 도발에도 즉각 응징할 것임을 분명히 보여 주어, 평양이 감히 움직일 엄두조차 내지 못하게 하겠습니다."
 tfrkphn.33.t:0 "국민 안심시키기"
 tfrkphn.33.desc:0 "청와대 춘추관 브리핑룸, 오후 2시.\n\n플래시 세례 속에서 홍준표 대통령이 단상에 올랐다. 브리핑룸은 국내외 기자들로 발 디딜 틈이 없었다. 바다 건너 대만에서 전쟁이 터진 지 열흘째, 마트의 생필품 진열대는 텅 비었고 주식시장은 연일 곤두박질치고 있었다.\n\n대통령의 짧은 모두발언이 끝나자마자 질문이 쏟아졌다.\n\n\"대통령님, 우리 장병들이 대만 전선에 투입될 가능성은 정말 없습니까?\"\n\"중국이 우리를 표적으로 삼으면 정부 대책은 무엇입니까?\"\n\"사재기가 벌어지고 있는데, 국민들은 지금 무엇을 준비해야 합니까?\"\n\n대통령은 질문 하나하나에 거침없이 답했다. 우리 장병이 대만 전선에 투입되는 일은 없다. 생필품과 에너지는 충분히 비축되어 있다. 정부는 국민의 일상을 끝까지 지킨다.\n\n그리고 마지막 질문. 맨 앞줄의 젊은 기자가 손을 들었다.\n\n\"그래도 불안해하는 국민들에게, 딱 한마디만 해 주신다면요?\"\n\n대통령은 잠시 기자를 바라보더니 씩 웃으며 마이크를 다시 잡았다."
 tfrkphn.33.a:0 "\"라면 사십쇼, 방독면 챙기십쇼.\""
 tfrkphn.34.t:0 "강경한 대북관"
 tfrkphn.34.desc:0 "합동참모본부 지하 지휘통제실.\n\n대형 화면에는 휴전선 이북의 북한군 배치도가 빼곡하게 떠 있었다. 중국이 대만에 발이 묶인 지금, 평양이 가만히 있을 리 없었다. 오히려 지금이야말로 북한이 오판하기 가장 좋은 때였다.\n\n\"북한이 이 틈을 노린다면, 망설임 없이 응징한다. 그게 대통령님 지시입니다.\"\n\n정부는 전방 부대의 경계 태세를 최고 단계로 끌어올렸다. 서해와 동해에서는 대규모 해상 훈련이 이어졌고, 휴전선 일대에서는 대북 확성기가 밤낮없이 울려 퍼졌다. 확성기에서는 대만 전선의 소식과 함께, 중국이 북한을 지켜 줄 여유가 없다는 사실이 쉼 없이 흘러나왔다.\n\n평양의 반응은 어느 때보다 조용했다. 그러나 그 조용함이 무엇을 뜻하는지, 북한 주민들은 누구보다 잘 알고 있었다."
 tfrkphn.34.a:0 "평양은 오늘도 침묵했다."

 # 2-12 병력 파견
 TFRKPHN_hong_b02_12:0 "병력 파견"
 TFRKPHN_hong_b02_12_desc:0 "아무리 우리가 간접적으로 지원해도, 전쟁은 결국 개똥밭에 직접 발을 들여야 하는 법입니다."
 tfrkphn.35.t:0 "존재하지 않는 군대"
 tfrkphn.35.desc:0 "새벽 4시, 진해 군항.\n\n부두에는 군복 대신 이름 모를 작업복을 입은 사내들이 줄지어 서 있었다. 계급장도, 부대 마크도, 태극기도 없었다. 그들의 서류에는 모두 '전역' 도장이 찍혀 있었고, 행선지란에는 '해외 취업'이라고 적혀 있었다.\n\n\"이름은 자유의용군이다. 우리는 국군이 아니다. 대한민국은 이 전쟁에 참전하지 않았다. 알겠나?\"\n\"예, 알겠습니다!\"\n\n대답하는 목소리들은 우렁찼다. 그들 대부분은 불과 며칠 전까지 같은 부대에서 같은 군복을 입던 사람들이었다.\n\n탄약을 빌려주고, 정보를 넘기고, 후방을 흔드는 것만으로는 이 전쟁을 막을 수 없었다. 대만의 해안선이 무너지면 그다음은 제주이고, 부산이고, 서울이었다. 결국 누군가는 직접 그 진흙탕에 발을 들여야 했다.\n\n수송선이 천천히 부두를 떠났다. 배웅 나온 사람은 아무도 없었다. 공식적으로 그들은 존재하지 않는 사람들이었다."
 tfrkphn.35.a:0 "\"대한민국은 이 전쟁에 참전하지 않았다.\""
 TFRKPHN_free_volunteers:0 "자유의용군"
 TFRKPHN_free_volunteers_desc:0 "계급장도 부대 마크도 없는 대한민국의 의용군이 대만 전선에서 싸우고 있습니다. 공식적으로 그들은 존재하지 않습니다."
 TFRKPHN_free_volunteers_tt:0 "대만에 §G의용군§!을 보낼 수 있게 됩니다.\n자유의용군 국민정신은 §R양안전쟁이 끝나면 사라집니다.§!"

 # 2-3 부결
 TFRKPHN_hong_b02_03:0 "부결"
 TFRKPHN_hong_b02_03_desc:0 "대만지원법이 야당의 반대로 국회에서 부결되었습니다. 대한민국은 이 전쟁에서 중립을 지킵니다. 그러나 중립을 지키는 데에도 힘이 필요합니다."
 tfrkphn.36.t:0 "부결"
 tfrkphn.36.desc:0 "\"재석 287인 중 찬성 112인, 반대 171인, 기권 4인으로 대만지원법안은 부결되었음을 선포합니다.\"\n\n국회의장의 의사봉이 세 번 울렸다. 야당 의원석에서는 박수가 터져 나왔고, 여당 의원석에서는 탄식과 고성이 뒤섞였다. 몇몇 여당 의원은 자리를 박차고 본회의장을 빠져나갔다.\n\n같은 시각, 청와대 집무실의 TV 화면에도 같은 장면이 흘러나오고 있었다. 홍준표는 한동안 아무 말 없이 화면을 바라보다가 리모컨을 내려놓았다.\n\n국회가 길을 막았다. 대한민국은 이 전쟁에서 공식적으로 중립을 지킨다. 대만으로 향할 탄약도, 의용군도 없다.\n\n그러나 중립이 곧 아무것도 하지 않는다는 뜻은 아니었다. 바다 건너의 불길이 언제 이쪽으로 번져 올지 모르는 지금, 정부가 해야 할 일은 오히려 더 많아졌다."
 tfrkphn.36.a:0 "중립도 힘이 있어야 지킬 수 있다."

 # 2-6 해상보급 지원
 TFRKPHN_hong_b02_06:0 "해상보급 지원"
 TFRKPHN_hong_b02_06_desc:0 "요즘 대한민국 조선소에 이름도 처음 듣는 해외 해운사들의 주문이 쏟아지고 있습니다. 이상하게도 그 배들은 하나같이 대만과 일본 근해에서 발견됩니다. 물론 대한민국은 중립국이며, 민간 기업의 수출에는 관여하지 않습니다."
 tfrkphn.37.t:0 "수상한 발주"
 tfrkphn.37.desc:0 "거제 옥포 조선소, 영업팀 사무실.\n\n\"부장님, 또 들어왔습니다. 이번엔 화물선 30척이요.\"\n\"발주처는?\"\n\"싱가포르에 있는 해운회사라는데... 작년에 설립된 회사입니다. 직원은 세 명이고요.\"\n\n부장은 말없이 계약서를 넘겼다. 지난달에는 파나마 국적의 신생 해운사가 25척을, 그 전달에는 홍콩의 무역회사가 40척을 주문했다. 하나같이 이름도 처음 듣는 회사들이었고, 하나같이 납기는 '최대한 빨리', 결제는 선금 전액이었다. 그리고 하나같이, 인도된 배들은 얼마 지나지 않아 대만 해협과 일본 근해에서 목격되었다.\n\n\"이거... 괜찮은 겁니까? 중국이 알면...\"\n\"우리는 배를 팔았을 뿐이야. 산 사람이 그 배로 뭘 하든 그건 우리가 알 바 아니지.\"\n\n정부의 공식 입장도 다르지 않았다. 대한민국은 중립국이며, 민간 기업의 정상적인 수출 계약에 관여하지 않는다.\n\n그날 밤에도 조선소의 용접 불꽃은 꺼지지 않았다."
 tfrkphn.37.a:0 "\"우리는 배를 팔았을 뿐이다.\""

 # 2-10 그래도 할 건 해야지
 TFRKPHN_hong_b02_10:0 "그래도 할 건 해야지"
 TFRKPHN_hong_b02_10_desc:0 "국회는 대만지원법을 막았고, 대한민국은 공식적으로 중립국입니다. 그러나 공식적으로 할 수 없다고 해서 아무것도 하지 않을 수는 없습니다. 보이지 않는 곳에서, 할 건 해야 합니다."
 tfrkphn.38.t:0 "그래도 할 건 해야지"
 tfrkphn.38.desc:0 "서울 신촌의 한 PC방, 새벽 1시.\n\n\"야, 너 이거 봤냐? 요즘 커뮤니티마다 '중국 위협론' 글이 미친 듯이 올라오잖아.\"\n\"그게 왜?\"\n\"이상하지 않냐? 글 쓴 계정들 가입일이 다 지난달이야. 말투도 다 똑같고. 이거 국정원 댓글부대라니까. 부결돼서 대놓고 못 도우니까 여론부터 만지는 거지.\"\n\"에이, 또 그 소리. 너는 맨날 음모론이야.\"\n\"진짜라니까? 아무튼 우리 삼촌이 국정원에서 일하는데, 삼촌한테 물어보면...\"\n\n그 순간 PC방 유리문 밖으로 빨간 마티즈 한 대가 천천히 멈춰 섰다. 운전석 창문이 스르륵 내려가더니, 선글라스를 낀 중년 남자가 두 사람을 향해 손을 흔들었다.\n\n\"어이, 조카. 늦었는데 삼촌이 집까지 태워 줄까?\"\n\n두 사람은 한동안 아무 말도 하지 못했다."
 tfrkphn.38.a:0 "\"...우리 삼촌 차는 마티즈가 아닌데.\""

 # 2-7 국제사회에 중국 규탄
 TFRKPHN_hong_b02_07:0 "국제사회에 중국 규탄"
 TFRKPHN_hong_b02_07_desc:0 "총을 들 수 없다면 목소리라도 높여야 합니다. 대한민국은 아시아의 민주주의 국가들과 함께 국제무대에서 중국의 침략을 규탄할 것입니다."
 tfrkphn.39.t:0 "런던의 목소리"
 tfrkphn.39.desc:0 "런던, 국제 안보 총회장.\n\n대한민국 외교부 장관이 단상에 올라 공동성명을 읽어 내려갔다. 그 뒤로 일본, 호주, 뉴질랜드, 그리고 동남아 몇몇 나라의 대표들이 나란히 섰다.\n\n\"우리 아시아의 민주주의 국가들은 중화인민공화국의 대만 침공을 강력히 규탄한다. 무력에 의한 현상 변경은 결코 용납될 수 없으며, 국제사회는 즉각적인 휴전과 침략군의 철수를 요구한다.\"\n\n성명이 끝나자 박수가 이어졌다. 그러나 회의장 한쪽, 중국 대표단석의 외교관들은 박수 대신 서로 귀엣말을 주고받으며 피식 웃었다. 그들은 성명이 끝나기도 전에 서류를 챙겨 자리에서 일어났다. 종이 위의 규탄으로는 해협을 건너는 상륙함 한 척도 멈출 수 없다는 것을, 그들은 누구보다 잘 알고 있었다.\n\n미국 대표단석은 반쯤 비어 있었다. 자리를 지킨 외교관 몇 명은 성명서를 받아 들고도 아무 말이 없었다. 본국이 내전으로 갈라진 지금, 그들은 누구를 대표하는지조차 확신할 수 없었다. 한때 이런 자리에서 가장 먼저, 가장 크게 목소리를 내던 나라였다.\n\n총회가 끝난 뒤, 독일과 프랑스, 영국의 대표들이 한국 대표단을 찾아왔다. 적어도 유럽은 이 목소리를 듣고 있었다."
 tfrkphn.39.a:0 "적어도 누군가는 듣고 있다."
 TFRKPHN_condemn_china:0 "중국 규탄에 동참"

 # 2-11 유럽으로 가는 K-방산
 TFRKPHN_hong_b02_11:0 "유럽으로 가는 K-방산"
 TFRKPHN_hong_b02_11_desc:0 "미국이 무너진 뒤 유럽의 무기고는 텅 비었습니다. 대만에 총을 보낼 수 없다면, 우리를 믿어 주는 유럽에 팔면 됩니다. 중립국 대한민국의 공장은 멈추지 않습니다."
 tfrkphn.40.t:0 "바르샤바의 서명"
 tfrkphn.40.desc:0 "바르샤바, 폴란드 국방부 청사.\n\n긴 탁자 양쪽에 앉은 두 나라 대표가 마지막 서명을 마치자 플래시가 일제히 터졌다. K2 전차와 K9 자주포, 그리고 FA-50 경공격기. 한국 방위산업 역사상 가장 큰 수출 계약이었다.\n\n\"솔직히 처음엔 반신반의했습니다. 아시아의 중립국이 우리에게 무기를 팔 수 있을지.\"\n폴란드 국방차관이 통역을 통해 웃으며 말했다.\n\"그런데 런던에서 한국이 하는 말을 들었습니다. 바다 건너 전쟁을 보면서도 할 말은 하는 나라라면, 믿고 거래할 수 있다고 생각했죠.\"\n\n미국이 무너진 뒤 유럽의 무기고는 텅 비어 있었다. 대서양 건너에서 오던 탱크와 포탄은 끊겼고, 동쪽 국경의 긴장은 날로 높아졌다. 유럽은 빠르게, 그리고 많이 만들어 줄 수 있는 나라가 필요했다. 그리고 70년 동안 전쟁을 대비해 온 대한민국에는 바로 그런 공장들이 있었다.\n\n그 주 창원의 방산 공장들은 3교대로 돌아가기 시작했다. 대만에 총을 보낼 수는 없었지만, 대한민국의 공장은 쉬지 않고 있었다."
 tfrkphn.40.a:0 "창원의 공장은 오늘도 3교대다."

 # 2-13 비밀스러운 지원
 TFRKPHN_hong_b02_13:0 "비밀스러운 지원"
 TFRKPHN_hong_b02_13_desc:0 "국회는 대만지원법을 막았습니다. 그러나 장부에서 탄약 몇 상자가 사라지는 일까지 국회가 막을 수는 없습니다."
 tfrkphn.41.t:0 "장부에서 사라진 탄약"
 tfrkphn.41.desc:0 "국방부 군수지원과, 연말 재고 조사 보고서.\n\n\"제3탄약창 소화기탄 재고, 장부상 수량과 실재고 차이 약 40만 발. 사유: 노후 탄약 폐기 처분.\"\n\"제7탄약창 105mm 포탄, 차이 약 2만 발. 사유: 훈련 소모.\"\n\"제2보급창 지원 장비, 차이 약 500세트. 사유: 정비 중 분실.\"\n\n보고서를 넘기던 국방부 장관은 한숨도 쉬지 않고 결재란에 서명했다. 이 보고서가 국회 국방위원회에 올라가면 야당은 분명 난리를 칠 것이다. 그러나 야당 의원들도 알고 있었다. 사라진 탄약이 어디로 갔는지 굳이 캐묻는 순간, 모두가 곤란해진다는 것을.\n\n그 보고서는 결국 대통령 책상에도 올라갔다. 검사 시절의 홍준표는 장부 속의 거짓을 가장 먼저 읽어 내던 사람이었다. 그는 훗날 이렇게 회고했다.\n\n\"1993년 4월 동화은행 비자금 사건 때 함승희 주임 검사의 요청으로 20분 만에 김종인 전 경제수석의 뇌물 사건을 자백받았다\"\n\n그런 그가 이번만큼은 숫자가 맞지 않는 장부를 두고 아무것도 묻지 않았다.\n\n같은 시각, 공해상의 어느 해역. 국적 표시가 없는 화물선 한 척이 대만 해군 함정 옆에 조용히 멈춰 섰다. 크레인이 움직이기 시작했다.\n\n국회는 대만지원법을 부결했다. 대한민국은 중립국이다. 그리고 군대에서 탄약이 조금 사라지는 일은, 원래 흔한 일이다."
 tfrkphn.41.a:0 "\"사유: 정비 중 분실.\""
 TFRKPHN_hong_b03_01:0 "승리의 날"
 TFRKPHN_hong_b03_01_desc:0 "양안전쟁이 끝났습니다. 대만은 살아남았고, 중국의 침공은 실패로 돌아갔습니다. 대한민국은 이 전쟁의 승전국입니다."
 tfrkphn.50.t:0 "승리의 날"
 tfrkphn.50.desc:0 "도쿄, 타이베이, 시드니, 그리고 서울.\n사방에서 승전의 폭죽이 터지고 있고 모두가 기뻐하고 있지만, 단 한 사람만은 아니었다.\n\n\"중국은 절대 여기서 포기하지 않는다. 이건 잠깐 시간을 번 것일 뿐, 저들이 개혁을 하든 보복을 하든 좌익이 정권을 잡든 그들의 목표는 여전히 아시아다. 수나라, 당나라, 청나라, 그리고 시진핑은 실패했지만 그 다음은 다를 것이다. 더 이상 자주국방은 북한만을 상대로 해서는 안 된다. 적룡은 다시 돌아올 것이다.\"\n"
 tfrkphn.50.a:0 "홍 대통령님, 국정원장의 연락입니다."
 TFRKPHN_hong_b03_02:0 "떠나간 이를 기리며"
 TFRKPHN_hong_b03_02_desc:0 "전쟁에 참여한 모든 이들을 기억해야 합니다. 의용군과 장병, 그리고 후방에서 싸운 이름 없는 사람들까지."
 tfrkphn.51.t:0 "떠나간 이를 기리며"
 tfrkphn.51.desc:0 "현충원, 대한민국을 위해 목숨을 바친 분들이 안치되는 곳. 홍준표는 승전의 날 같은 모든 일정을 제쳐두고 이곳에 왔다. 잠시 뒤 이름이 하나씩 적힌 벽을 올려다보았다. \"김대식 (1934~1952), 이환정 (1951~1972).\"\n\n그리고 새로 쓰인 이름들을 바라보았다. \"황이준 (2002~2022), 이정준 (2000~2022), 박삼경 (1999~2022)...\" 모두 머나먼 타국을 위해 희생한 이들이었다. '과연 내 선택이 옳은 것일까? 이들을 죽인 건 내가 아닌가….' 홍준표는 자기 자신에게 물었다. 하지만 그는 끝내 답을 찾을 수 없었다."
 tfrkphn.51.a:0 "그는 한참 동안 아무 말 없이 서 있었다."
 TFRKPHN_hong_b03_03:0 "진(盡) — 다할 진"
 TFRKPHN_hong_b03_03_desc:0 "다할 진(盡). 대통령은 남은 임기의 모든 것을 국정에 쏟아붓겠다고 다짐합니다. 정치의 갈래가 열립니다."
 tfrkphn.52.t:0 "진(盡) — 다할 진"
 tfrkphn.52.desc:0 "다할 진(盡). 대통령은 남은 임기의 모든 것을 국정에 쏟아붓겠다고 다짐합니다. 정치의 갈래가 열립니다. (이벤트 내용 작성 예정)"
 tfrkphn.52.a:0 "확인"
 TFRKPHN_hong_b03_04:0 "모래시계의 칼"
 TFRKPHN_hong_b03_04_desc:0 "모래시계 검사 시절 그대로, 성역 없는 부패 척결에 나섭니다."
 tfrkphn.53.t:0 "모래시계의 칼"
 tfrkphn.53.desc:0 "\"2011년 5월, 6월경 호텔에서 성완종 회장을 만난 일이 있습니까?\"\n\"없습니다.\"\n\n2015년 4월 10일, 나는 공직 생활 중 처음으로 비리에 연루되는 치욕을 맛보았다. 성완종 회장이 자살하며 남긴 종이 한 장에 내 이름이 적혀 있다는 이유였다. 내가 1억 원을 받았다는 메모에는 친박 인사 6명과 함께 내 이름이 기재되어 있다는 것이었다. 출근길마다 현장에는 기자가 가득했고, 어느 방송은 내가 출국금지를 당했다며 허위 보도를 하기도 했다. 2015년 5월 초 검찰 조사를 받으러 출두할 때는 500여 명의 기자들에게 \"간단히 소명하러 왔다\"라고 말했다.\n\n조사실에 올라가 조사가 시작되자 이상한 방향으로 진행되고 있었다. 4시간에 걸쳐 120페이지 분량을 조사하지만, 범죄 사실은 전혀 묻지 않았다.\n\n\"2011년 5월, 6월경 호텔에서 성완종 회장을 만난 일이 있습니까?\"\n\"없습니다.\"\n\n성완종 사건의 범죄 사실 조사는 이 한 줄뿐이었다. 이튿날 발표 내용을 보니 내가 12시간 동안 강도 높은 조사를 받았다고 기록되어 있었다. 범죄 사실을 전혀 추궁하지 않았음에도 이를 일방적으로 발표해 버린 것이다.\n\n1심은 이보다 더 황당했다. 우리 주장은 아예 무시하고 검찰 주장만 받아들였으며, 검사는 우리 변호인을 협박하기까지 했다. 내가 검사 생활을 할 때에는 상대의 배후에 대통령이 있어도 어떻게든 기소했다. 하지만 지금은 검사가 청와대를 등에 업고 오만방자하게 굴고 있다. 그리고 징역 2년 구형에 실형 1년 6개월이 선고되던 날, 난 마치 노상강도를 당한 기분이라고 답했다.\n\n항소심에서는 나에게 운이 따랐다. 들어올 수 없는 폐쇄된 문으로 들어왔다는 윤 모 씨의 주장이 거짓으로 판명된 것이다. 또한 내가 성완종을 잘 모르는 상태였기에, 미리 만나 잘 아는 사이인 것처럼 조작한 정황도 드러났다.\n\n과거 내가 검사로 일할 때는 경찰이 고문으로 사건을 조작했지만, 이제는 검사가 이런 짓을 할 줄은 꿈에도 몰랐다. 검찰의 수준이 이토록 타락했으니 나라의 기강이 설 리가 있겠는가."
 tfrkphn.53.a:0 "이제 그 칼을 바로 세울 때다."
 TFRKPHN_hong_b03_05:0 "작은 정부"
 TFRKPHN_hong_b03_05_desc:0 "비대해진 정부 조직을 줄이고 공무원 정원을 묶어 군살을 뺍니다."
 tfrkphn.54.t:0 "작은 정부"
 tfrkphn.54.desc:0 "비대해진 정부 조직을 줄이고 공무원 정원을 묶어 군살을 뺍니다. (이벤트 내용 작성 예정)"
 tfrkphn.54.a:0 "확인"
 TFRKPHN_hong_b03_06:0 "범죄와의 전쟁"
 TFRKPHN_hong_b03_06_desc:0 "검사 홍준표의 이름을 알린 그 전쟁을 대통령 홍준표가 다시 시작합니다."
 tfrkphn.55.t:0 "범죄와의 전쟁"
 tfrkphn.55.desc:0 "\"야 이씨, 너 이번에 대통령이 특별담화 한다는 거 들었냐?\"\n\"형님요, 저희가 그런 거 들어 봤자 뭔 소용이 있겠습니까? 어차피 뭐 뻔하지예. '나라가 어려우니 잘하겠습니다.' 어차피 아무 일도 안 일어납니다.\"\n\n몇십 분 후, 식당 TV에는 홍준표 대통령의 대국민 담화 화면이 드러났다.\n\n\"첫째, 저는 우리 공동체를 파괴하는 범죄와 폭력에 대한 전쟁을 선포하고, 헌법이 부여한 대통령의 모든 권한을 동원해서 이를 소탕해 나갈 것입니다. 둘째, 민주 사회의 기틀을 위협하는 불법과 무질서를 추방할 것입니다. 셋째, 과소비와 투기, 그리고 퇴폐와 향락을 바로잡아 일하는 사회, 건강한 사회를 만들어 나갈 것입니다.\"\n\n\"저 새끼 뭐라는 거냐? 뭐, 우리 같은 새끼들 잡아 처넣겠다는 거냐?\"\n\"형님요, 걱정 마쇼. 우리가 짭새 새끼들한테 준 게 얼마입니까? 이 새끼들 절대 우리 못 잡습니다. 걱정 마시고 밥이나 드십시오. 저 짭새 새끼들이 잡는다고 해도 이렇게 휙, 휙 하면 바로 게임 끝입니다. 지 꼴에 검사라고 뭐 새로운 거 시도라도 해 보는 거 같은데, 우리의 의리는 절대 못 막습니다.\"\n\n\"그래, 네 말이 맞다. 어디 한두 번 겪은 일도 아니고…….\"\n\n형님이라 불린 사내는 국밥에 숟가락을 얹으며 덤덤하게 응수했다. 하지만 화면 속 대통령의 눈빛과 단호한 목소리는 이전의 정권들이 보냈던 유화책과는 사뭇 달랐다. TV 화면 아래로 '조직폭력 및 민생침해사범 전면 소탕'이라는 자막이 붉게 흘러갔다.\n\n\"근데 이번엔 기류가 좀 이상하다. '검사 출신'들이 직접 지휘 라인을 잡고 내려온다는 소문이 있어. 우리가 관리하던 관할 경찰서 라인 선에서 해결될 문제가 아닐 수도 있다.\"\n\n\"에이, 형님도 참. 법 위에 돈 있고, 돈 위에 의리 있는 거 모릅니까? 식기 전에 밥이나 드십시오.\"\n\n동생은 헛웃음을 치며 소주잔을 비웠지만, 식당 구석에서 TV를 주시하던 다른 손님들과 식당 주인의 표정은 이미 싸늘하게 굳어 있었다. 시대의 공기가 완전히 바뀌고 있다는 것을, 오직 그들만 눈치채지 못한 듯했다."
 tfrkphn.55.a:0 "시대의 공기가 바뀌고 있다."
 TFRKPHN_hong_b03_07:0 "강성 귀족노조 개혁"
 TFRKPHN_hong_b03_07_desc:0 "기득권이 된 강성 노조의 불법 파업에 법과 원칙으로 대응합니다."
 tfrkphn.56.t:0 "3퍼센트"
 tfrkphn.56.desc:0 "이 나라의 노동자 중 3퍼센트도 안 되는 이들이 노동시장을 좌지우지하고 있다. 원래 노조란 부당한 이익에 맞서는 자들이지만, 강성 노조는 대한민국을 변질시켰다. 전주의료원 폐쇄 당시 난 그들의 악폐를 보았다. 원래 파업이라면 '무임금 무근로'가 기본이지만, 이들은 '유임금 무근로'로 배짱 장사를 했다. 또한 환자 운송 중 채혈이 필요했으나 가족들의 반대로 수혈을 하지 못해 사망한 사건이 발생하자, 민노총은 나를 마치 살인자로 몰아가며 형사 고소까지 했다. 다행히 외과의사가 가족들로부터 수혈 거부 동의서를 받아두어 민노총의 공세는 거짓으로 판명되었다.\n\n이들의 행보는 여기서 끝나지 않았다. 전교조는 무상급식 감사를 반대했다. 난 당시 무상급식 지원금으로 교육청에 700억 원 이상을 지원하고 있으면서도 단 한 번도 감사가 없다는 걸 지적하였다. 하물며 1백만 원을 지원하더라도 당연히 예산 감사가 있어야 하지만, 여기에는 그 어떤 감사도 없는 비리의 온상이었다. 결국 수천억 원의 도민 세금을 지키고자 감사가 없을 시 지원 중단을 선언했으나, 전교조는 내가 어린애들 밥그릇을 빼앗는다고 허위 선전을 하며 협박했다. 1년 이상의 싸움 끝에 결국 지원금을 축소하는 대신 감사를 받기로 합의하자 진실이 드러났다. 질 낮은 식재료 납품, 입찰 담합, 위장 업체의 입찰 참가 등 무려 88개 학교에서 2,306건의 불법 행위를 적발했다. 이 사건은 무상급식 지원 반대가 아닌 예산 감사 거부로 촉발된 것이며, 아낀 그 돈으로 서민 자녀 교육 지원 사업을 전국 최초로 실행했으나 그들은 이 같은 사실은 쏙 빼먹고 내가 마치 도의 빚을 갚은 것으로 왜곡해 선전하였다.\n\n강성 귀족 노조는 그들만의 세계에 살고 있다. 고용 세습으로 자기들만의 천국을 만들고, 노조의 경영권 침해와 간섭은 상례화되었으며, 불법 파업은 일상화되었다. 또한 노동생산성은 현저히 낮음에도 고임금 혜택을 누리는 집단이다. 기업이 잘돼야 일자리가 늘고 기회가 균등하게 주어져야 청년들의 일자리 문제가 해결되지만, 이를 바로잡지 못하면 아무것도 하지 못한 채 기업들은 해외로 탈출할 것이다. 실업 대란이 일상화되고 경제는 나락으로 빠지고 있다. 현대차의 임금은 도요타와 폭스바겐을 앞질렀지만 매년 연례행사로 파업을 일삼고, 노동생산성은 미국에 뒤처졌다. 지난 정권은 이들과 연합한 자들이었지만, 이번에는 그들을 반드시 개혁할 것이다.\n\n나는 노조 자체를 부정하는 것이 아니다. 노조의 부당하고 부정한 행동을 바로잡으려는 것이다. 우리가 이를 해결하지 못하면 디트로이트의 몰락이 전국에서 반복될 것이다."
 tfrkphn.56.a:0 "디트로이트의 몰락을 되풀이할 수는 없다."
 TFRKPHN_hong_b03_08:0 "홍카콜라 국정 소통"
 TFRKPHN_hong_b03_08_desc:0 "페이스북에 쓰는 글은 내 인생의 기록이자 내 생각을 정리하여 후대에 남기는 개인 실록이자 국민과 직접 소통하는 방법이기도 하지만 더 중요한 것은 제도권 언론의 편향성을 극복하기 위해서다. 트럼프는 트위터 하나로 반트럼프 진영의 모든 언론을 상대한다. 이제 우리도 그런 시대가 도래했다."
 tfrkphn.57.t:0 "TV 홍카콜라"
 tfrkphn.57.desc:0 "홍카콜라 시청자 여러분, 벌써 제가 대통령이 된 지 이만큼 지났습니다. 지난 대만 전쟁 당시 저는 대만지원법 가결을 촉구했고, 국회는 제 말을 믿고 자유민주주의를 지켰습니다. 미국이 내전으로 붕괴했을 당시 저는 모든 걸 다 포기해야 한다고 생각했습니다. 하지만 민주주의의 이상은 제 생각보다 강하였고, 이는 대한민국과 국민들의 승리로 나타났습니다.\n\n국민 여러분, TV홍카콜라는 2018년 12월 초순에 시험 방송을 거치고 중순에 개국을 하였습니다. 이것은 제가 기울어진 운동장 같은 정치판과 언론 속에서, 속 시원한 청량감과 진실을 국민들에게 알려주겠다고 결심했기 때문입니다. 언론의 기능은 팩트를 보도하여 국민의 올바른 판단을 유도하는 것이지만, 박근혜 탄핵 때부터 언론은 팩트 보도보다 자신들이 바라는 방향으로 사건을 전개하기 시작했습니다. 좌파 언론 중심으로 하던 짓이 다른 언론으로까지 전이되어, 소위 자신들의 망상이 사실이라고 보도하는 행위에 기가 찼네요.\n\n이 나라 공영방송의 시청률은 한때 40%에 달했으나 이제 10% 아래로 떨어졌고, 어느 공영방송은 10% 밑으로 추락했다고 합니다. 신문 구독 부수도 날로 떨어져 사실상 경영에 큰 어려움을 겪고 있습니다. 홍카콜라 시청자 여러분, 국민 여러분, 저는 이 홍카콜라TV를 공정한 언론으로 나아가게 하려고 만들었습니다. 이제 우린 가짜 뉴스를 다 척결해 버릴 것을 저 홍준표가 약속하겠습니다."
 tfrkphn.57.a:0 "그가 돌아왔다."
