 TFRKPHN_hong_invest_category:0 "해외 투자"
 TFRKPHN_hong_invest_category_desc:0 "세계 각국에 투자해 대한민국의 무역로와 자원을 넓힙니다.\n\n1회 투자: 무역 관계 강화\n3회 투자: 그 나라의 자원 권리 획득\n5회 투자: 무역 관계 추가 강화\n\n§R중국§!과 §B대만§! 중에서는 한 나라만 고를 수 있습니다. 양안전쟁이 시작되면 두 나라에는 더 이상 투자할 수 없습니다."
 TFRKPHN_hong_choose_prc:0 "중국 시장을 택한다"
 TFRKPHN_hong_choose_prc_desc:0 "거대한 중국 시장은 놓칠 수 없습니다. 중국과의 경제 협력을 넓힙니다."
 TFRKPHN_hong_choose_prc_tt:0 "중국에 투자할 수 있게 됩니다. 중국에 투자할 때마다 민간 공장이 하나씩 늘어납니다.\n§R대만에는 투자할 수 없게 됩니다.§!"
 TFRKPHN_hong_choose_chi:0 "대만과 손잡는다"
 TFRKPHN_hong_choose_chi_desc:0 "자유 진영의 동반자 대만과 반도체 동맹을 맺습니다."
 TFRKPHN_hong_choose_chi_tt:0 "대만에 투자할 수 있게 됩니다. 대만에 투자할 때마다 동남아 각 나라의 §OPDTO§! 영향력이 §G10%§!씩 오릅니다.\n§R중국에는 투자할 수 없게 됩니다.§!"
 TFRKPHN_after_14_tt:0 "§Y14일§! 동안 진행되며, 끝나면 아래 효과가 적용됩니다.\n개혁은 §Y한 번에 하나씩§!만 진행할 수 있습니다."
 TFRKPHN_military_unlock_tt:0 "기존 국방개혁 중점이 트리 오른쪽에 따로 열립니다."
 TFRKPHN_hong_arms_factory_tt:0 "해당 지역에 건설 슬롯 1칸이 늘고 군수공장 1개가 지어집니다.\n§Y군수공장 건설은 전국에서 한 곳만 할 수 있습니다.§!"
 TFRKPHN_hong_rear_defectors_tt:0 "중국 안정도 §R-10%§!\n중국 전쟁 지지도 §R-10%§!"
 TFRKPHN_hong_rear_ieodo_tt:0 "대만과 일본이 이어도의 눈 효과를 얻습니다.\n제공권 우세 효율 §G+10%§!\n항공 임무 효율 §G+10%§!\n해군 협조 §G+5%§!"
 TFRKPHN_hong_rear_west_sea_tt:0 "중국이 365일 동안 서해 봉쇄 효과를 받습니다.\n해군 협조 §R-10%§!\n해군 피해 §R-10%§!\n해군 조직도 §R-10%§!"
