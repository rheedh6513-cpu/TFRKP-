 TFRKPHN_amend_deadline:0 "개헌 논의 기한"
 TFRKPHN_amend_deadline_desc:0 "기한이 끝나면 결과와 상관없이 개헌 논의가 마무리됩니다."
 TFRKPHN_amend_deadline_tt:0 "개헌 논의가 끝납니다. 그때까지 가결되지 않았다면 §R부결§!됩니다."
 TFRKPHN_amend_start_tt:0 "결정 탭에 §Y개헌 논의§!가 열립니다. 찬성 §G147석§!, 반대 §R153석§!에서 시작합니다."
 TFRKPHN_amend_passed_tt:0 "개헌안이 §G가결§!되어야 합니다."
 TFRKPHN_amend_auto_tt:0 "개헌안이 가결되면 결정 탭 §Y개헌 논의§!에 §Y개헌 결정 10개§!가 열립니다. 하나당 §Y30일§!이 걸리며, 한 번에 하나씩만 진행할 수 있습니다.\n§O야당과 협력§!으로 타협할수록 개헌 결정의 효과가 약해집니다."
