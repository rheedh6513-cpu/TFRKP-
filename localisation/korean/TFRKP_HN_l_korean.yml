 TFRKPHN_amend_persuade_tt:0 "반대 의원 §G2~4명§!이 찬성으로 돌아섭니다."
 TFRKPHN_amend_unity:0 "여당 단결"
 TFRKPHN_amend_unity_desc:0 "흔들리는 여당 의원들을 다잡아 이탈을 막습니다."
 TFRKPHN_amend_unity_tt:0 "반대 의원 §G1~2명§!이 찬성으로 돌아섭니다.\n다음 §Y반대파가 움직이는 중§!에서 이탈하는 의원이 §G0~2명§!으로 줄어듭니다."
