 tfrkphn.20.t:0 "홍준표 정부 출범"
 tfrkphn.20.desc:0 "2022년 5월 10일, 국회의사당 앞마당.\n\n봄바람에 태극기가 펄럭였지만, 취임식장을 메운 사람들의 얼굴은 마냥 밝지만은 않았다. 불과 몇 해 전까지만 해도 세계의 경찰을 자처하던 미국은 내전의 수렁에 빠져 산산조각이 났고, 그 여파로 세계 경제는 바닥을 알 수 없는 나락으로 떨어지고 있었다. 수출로 먹고살던 대한민국에게 그것은 목이 조여 오는 것과 다름없었다.\n\n코로나의 폭풍도 아직 완전히 지나가지 않았다. 텅 빈 상가, 셔터를 내린 식당, 그리고 지칠 대로 지친 사람들. 새 대통령이 물려받은 나라는 바로 그런 나라였다.\n\n단상에 오른 홍준표는 잠시 객석을 내려다보았다. 수십 년을 정치판에서 굴러 온 그였지만, 이번만큼은 어깨를 누르는 무게가 달랐다. 취임 선서가 끝나기가 무섭게 그는 이인제 국무총리를 비롯한 새 내각 명단을 발표했다. 기다려 줄 시간 따위는 없었다.\n\n기댈 곳 없는 시대. 이제 대한민국은 스스로의 힘으로 이 폭풍을 이겨 내야 한다."
 tfrkphn.20.a:0 "당당한 대한민국을 위하여!"
 TFRKPHN_lee_in_je_HM_desc:0 "출생: 1948년 대한민국 충청남도 논산군\n\n이력: 대한민국의 국무총리\n서울대학교 법대를 나와 판사로 법관 생활을 하던 이인제는 1988년 제13대 국회의원에 당선되며 정계에 입문하였습니다. 김영삼 정부의 첫 노동부 장관과 민선 초대 경기도지사를 거치며 차세대 지도자로 떠올랐으나, 1997년 신한국당 경선 불복과 독자 출마로 '경선 불복'의 꼬리표를 얻었습니다. 이후 여러 차례 대권에 도전하고 수많은 당적을 옮겨 다니며 '피닉제'라는 별명을 얻었지만, 6선 국회의원이라는 이력이 말해 주듯 끝내 쓰러지지 않는 생존력과 노련함만큼은 누구도 부정할 수 없습니다."
 TFRKPHN_kim_dae_sik_FM_desc:0 "출생: 대한민국 전라남도 영광군 염산면 옥실리\n\n이력: 대한민국의 외교부 장관\n16살의 나이에 생계를 위해 고향을 떠나 부산 사상으로 건너온 김대식은 낮에는 일하고 밤에는 공부하는 주경야독 끝에 일본 오타니대학교에서 문학 박사 학위를 받았습니다. 35년간 경남정보대학교와 동서대학교에서 교수와 총장으로 일하였고, 이명박 정부에서 민주평화통일자문회의 사무처장과 국민권익위원회 부위원장을, 홍준표 당 대표 시절에는 여의도연구원장을 맡았습니다. 헌정 최초의 호남 출신 부산 국회의원이라는 독특한 이력을 지닌 그는 지역과 진영을 잇는 가교를 자처하며, 일본통 학자로서의 경험을 외교 무대에서 펼치고자 합니다."
 TFRKPHN_seo_byung_soo_EM_desc:0 "출생: 1952년 대한민국 부산\n\n이력: 대한민국의 기획재정부 장관\n2000년 해운대구청장에 당선되며 정치에 발을 들인 서병수는 해운대구·기장군 갑에서 제16대부터 제19대까지 내리 4선을 지내며 부산 보수 정치의 중심에 섰습니다. 2014년 부산광역시장에 당선되어 4년간 부산 시정을 이끌었으나 재선에는 실패하였고, 이후 부산진구 갑에서 다시 당선되어 5선 중진의 자리에 올랐습니다. 지방 행정과 중앙 정치를 모두 경험한 그는 위기에 빠진 대한민국 경제의 살림을 맡게 되었습니다."
 TFRKPHN_hong_il_pyo_IM_desc:0 "출생: 1956년 대한민국 충청남도 홍성군\n\n이력: 대한민국의 행정안전부 장관\n건국대학교를 나와 1981년 사법시험에 합격한 홍일표는 서울고등법원 판사와 대법원 재판연구관을 지낸 법관 출신입니다. 인천에서 변호사로 개업한 뒤 인천광역시 정무부시장을 거쳐 인천 남구 갑에서 제18대부터 제20대까지 3선을 지냈으며, 국회 법제사법위원회 간사와 산업통상자원중소벤처기업위원회 위원장을 맡았습니다. 탄핵 정국 속에서 당적을 여러 번 옮기는 곡절을 겪기도 하였으나, 법과 행정을 두루 아는 실무형 정치인으로 평가받습니다."
 TFRKPHN_yoon_jae_ok_IntelM_desc:0 "출생: 1961년 대한민국 경상남도 합천군\n\n이력: 대한민국의 국가정보원장\n경찰대학교 1기로 수석 입학과 수석 졸업의 기록을 남긴 윤재옥은 경찰청 정보국장과 경북·경기지방경찰청장을 지내며 경찰 정보 분야의 정점에 올랐습니다. 이후 대구 달서구 을에서 국회의원에 당선되어 정계에 들어섰고, 2023년 국민의힘 원내대표를 맡아 거대 야당과의 협상을 이끌며 노련한 협상가로 이름을 알렸습니다. 정보와 수사의 현장을 모두 겪은 그는 국가 정보 기관을 이끌 적임자로 꼽힙니다."
 TFRKPHN_lim_jong_deuk_TM_desc:0 "출생: 1964년 대한민국 경상북도 영주군\n\n이력: 대한민국의 국방부 장관\n육군사관학교 42기로 임관한 임종득은 합동참모본부 비서실장과 제17보병사단장, 수도군단 부군단장을 지낸 야전과 참모를 두루 거친 군인입니다. 박근혜 정부에서 청와대 국방비서관을, 윤석열 정부에서 국가안보실 제2차장을 맡아 국가 안보 정책의 중심에 섰으며, 제22대 총선에서 고향 영주·영양·봉화에 당선되어 국회에 입성하였습니다. 혼란한 동아시아 정세 속에서 대한민국의 국방을 책임지게 되었습니다."
 TFRKPHN_hong_b01_02:0 "폭풍이 지나간 이후"
 TFRKPHN_hong_b01_02_desc:0 "한때 우리를 위협했던 코로나는 끝났습니다. 정부는 사회적 거리두기 완화와 새로운 미래를 기대하고 있습니다."
