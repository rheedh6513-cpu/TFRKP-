l_korean:
 tfrkphn.1.t:0 "국민의힘 전당대회"
 tfrkphn.1.desc:0 "2021년 11월 5일, 국민의힘 대통령 후보 경선 대회가 막을 올렸습니다.\n\n야당인 국민의힘은 레임덕에 빠진 문재인 정권에 대한 심판론을 내세우며 정권 교체를 목표로 했습니다. 최종적으로 두 후보가 유력한 경쟁자로 남았습니다.\n\n윤석열 후보는 민주당의 지지율이 고공행진하던 당시, 기존 보수 후보들이 제대로 대처하지 못하는 상황에서 정치권에 등장해 주목받았습니다. 하지만 정치 초보라는 꼬리표와 60~70대 유권자들의 높은 지지로 인해 '노인의힘', '틀딱의힘'이라는 비판을 받기도 했습니다.\n\n한편, 홍준표 후보로 대표되는 전통 보수 세력은 2030세대 당원들의 강력한 지지를 바탕으로 정권을 탈환하겠다고 밝혔습니다. 5선 국회의원이라는 경력과 두 차례의 당 대표 경험을 가진 그는 제2의 전성기를 맞이했다는 평가를 받았습니다. 하지만 조국 전 법무부 장관에 대한 과잉 수사 발언으로 일부 핵심 지지층의 이탈이 나타났고, 평소의 거친 발언들 역시 논란이 되었습니다.\n\n국민의힘 당원들의 선택은?"
 tfrkphn.1.a:0 "윤석열 후보가 선출된다"
 tfrkphn.1.b:0 "홍준표 후보가 선출된다"
 tfrkphn.2.t:0 "더불어민주당 전당대회"
 tfrkphn.2.desc:0 "2021년 10월 10일, 더불어민주당의 대통령 후보 경선이 마무리되고 있습니다.\n\n이재명 경기도지사 후보로 대표되는 친명 세력과 이낙연 후보로 대표되는 친문 세력의 대결이 막바지에 접어들었습니다. 대장동 의혹을 비롯한 여러 논란이 불거진 가운데, 새롭게 성장하는 친명 세력이 당내 주도권을 차지할까요? 아니면 민주당 내 친문 세력이 기존의 입지를 지켜낼까요?\n\n1,459,992명의 선택은 과연?"
 tfrkphn.2.a:0 "이재명 후보가 선출된다"
 tfrkphn.2.b:0 "이낙연 후보가 선출된다"
 TFRKPHN_tt_lee_jaemyung:0 "이재명 후보\n\n\n\n\n\n\n\n\n\n\n£GFX_TFRKPHN_tt_lee_jaemyung \n\n\n\n\n\n\n\n\n\n이재명의 친명이 주도권을 탈환했다."
