 tfrkphn.466.d:0 "이인제 대통령이 유승민 전 의원을 집무실로 불렀습니다.\n\n전화를 받은 유승민은 놀랐습니다. 홍준표가 물려준 정부가 자신을 부를 까닭이 없다고 생각했기 때문입니다. 비서관이 재벌개혁 공약집을 가져와 달라고 하자 그는 무슨 공약집이냐고 되물었고, 2017년 것이라는 답이 돌아왔습니다.\n\n유승민이 내놓은 것은 서류 한 묶음이었습니다. 공정거래위원회의 전속고발권을 없애고, 집단소송제와 징벌적 손해배상제를 들이고, 총수 일가의 개인회사를 막는 안이었습니다. 대통령은 그 서류를 끝까지 읽으면서 중간에 두 번 되물었는데, 두 번 다 조문 번호를 짚은 질문이었습니다.\n\n유승민이 알던 이인제는 당을 여러 번 옮겨 사람들에게 철새라고 불리던 사람이었습니다. 그런 사람이 재계와 맞서는 법안을 끝까지 읽으리라고는 기대하지 않았던 터라, 집무실을 나오면서 그는 자신이 사람을 별명으로만 알고 있었다고 생각했습니다."
 tfrkphn.469.d:0 "유승민이 청와대에 다녀갔다는 기사가 오후에 났고, 그날 저녁 홍준표 전 대통령이 페이스북에 글을 올렸습니다.\n\n글은 여덟 줄이었습니다. 첫 줄은 이인제 대통령이 누구 덕분에 그 자리에 앉았느냐는 물음이었고, 이어서 홍준표는 자신이 전쟁을 치르고 물려준 정부의 집무실에 유승민이 들어갔다고 썼습니다.\n\n그는 옛일을 차례로 꺼냈습니다. 2011년에 유승민이 최고위원 자리를 던지는 바람에 자신이 당 대표에서 물러났고, 2017년 대선에서는 유승민이 보수 표를 갈랐다는 것이었습니다. 이번 재벌개혁안도 그때 자신이 정의당 공약과 비슷하다고 했던 바로 그 안이라고 했습니다.\n\n마지막 줄은 짧았습니다. 사람을 쓰는 일은 대통령의 몫이라고 하면서도, 유승민을 쓰려거든 자기 이름은 빼라고 했습니다.\n\n글은 한 시간 만에 기사 수십 건이 됐고 여당 의원들의 전화가 밤새 비서실로 걸려 왔습니다. 유승민은 다음 날 기자들을 만나서도 재벌개혁안 이야기만 했습니다."
 tfrkphn.470.story:0 "경기도 시흥, 시화공단 끝자락의 금형 공장.\n\n오전 열 시에 사장 김씨의 휴대폰이 울렸다. 모르는 번호였는데 받아 보니 대기업 구매팀 과장이라고 했다.\n\n김씨는 삼십 년 동안 그런 전화를 한 번도 받아 본 적이 없었다. 늘 사이에 회사가 하나 끼어 있었기 때문이다. 회장 조카가 차린 그 회사는 직원이 넷이고 기계는 없었는데, 일감을 받아 김씨에게 넘기면서 단가의 이 할을 떼어 갔다.\n\n\"입찰 공고 보셨습니까. 이번부터는 직접 받습니다.\"\n\n그 회사는 지난달에 문을 닫았다. 총수 일가가 개인회사를 세우지 못하게 한 법이 시행된 달이었다.\n\n전화를 끊은 김씨가 서랍을 열자 누렇게 바랜 서류 봉투가 그대로 있었다. 몇 해 전 새 설비를 들일 때 냈던 서류였다. 김씨는 그 옆에 견적서 양식을 꺼내 놓고, 단가 칸에 처음으로 이 할을 빼지 않은 자기 숫자를 적었다.\n\n창밖에서는 프레스 소리가 났다. 직원은 열일곱 명으로 늘었고, 박 반장은 정년을 두 해 넘기고도 나와 있었다.\n\n\"박 반장! 사람 둘 더 뽑아야겠어.\"\n\n\"일감이 그만큼 됩니까, 사장님?\"\n\n\"되게 써냈어. 떨어지면 내가 삼겹살 사고, 붙으면 자네가 사.\"\n\n박 반장이 장갑을 벗으며 웃었다.\n\n\"어느 쪽이든 삼겹살이네요.\"\n\n김씨는 견적서를 봉투에 넣고 겉에 날짜를 적었다. 입찰 마감은 금요일이었다."
 tfrkphn.474.d:0 "특별수사팀이 한 그룹의 재무팀에서 장부를 압수했습니다.\n\n장부에는 전쟁 동안 군납 계약을 따낸 날짜와 그 전후로 나간 돈이 적혀 있었는데, 받은 사람 칸에는 이름 대신 머리글자만 있었습니다. 수사팀이 머리글자 열하나 가운데 일곱을 풀어 보니 그 가운데 넷이 여당 현역 의원이었습니다.\n\n검찰총장이 보고서를 들고 청와대에 왔을 때, 여당 원내대표는 그보다 한 시간 먼저 와서 기다리고 있었습니다."
 tfrkphn.475.d:0 "검찰이 수사 결과를 발표했습니다.\n\n그룹 총수 둘과 전현직 의원 다섯이 뇌물과 배임 혐의로 재판에 넘겨졌습니다. 삼백 쪽이 넘는 공소장에는 군납 계약서와 계좌 내역, 운전기사의 운행 일지까지 증거로 붙었습니다.\n\n경제 단체들은 그날 성명을 내지 않았고, 주요 그룹의 대관 담당 임원들은 그 주에 줄줄이 자리를 옮겼습니다."
 tfrkphn.468.d:0 "경제 단체들이 같은 날 짧은 성명을 냈습니다.\n\n기업을 죄인으로 모는 법이 이어지면 투자를 미루겠다는 내용이었고, 다음 날에는 주요 그룹 몇이 신규 채용 계획을 내년으로 넘겼습니다."
 tfrkphn.483.d:0 "이정훈은 올해로 쉰둘이 되었다.\n\n공원 벤치에서 딸과 마주친 날로부터 다섯 해가 지났고, 그 사이 그는 대리운전을 하고 물류센터에서 상자를 나르다가 전쟁 중에는 탄약 공장에서 야간 검수를 했다. 그동안 명함에 부장이라고 적힌 적은 한 번도 없었다.\n\n면접은 인천항 부두에서 봤다. 쑤저우에서 십오 년 동안 세탁기 모터를 만들다가 전쟁이 나자 설비를 뜯어 돌아온 회사였는데, 야적장에는 컨테이너 마흔 개가 쌓여 있었다. 공장장이 그 가운데 하나를 열어 보이자 중국어 안내문이 그대로 붙은 기계가 나왔다.\n\n이정훈 씨, 공대 나오셨죠. 이 라인을 돌려 보신 분이 국내에 몇 없습니다.\n공장은 어디에 세웁니까.\n아직 모릅니다. 정부가 터를 정해 주기로 했습니다. 정해지면 바로 나오실 수 있습니까.\n어디든 나갑니다.\n\n부두를 나온 정훈은 주차장에 한참 서 있다가, 이제 대학생이 된 딸 서진에게 먼저 전화를 걸었다.\n\n아빠 취직했다.\n진짜? 어디?\n중국에서 돌아온 회사. 아빠가 옛날에 하던 일이야."
 tfrkphn.484.d:0 "경기도 시흥, 시화공단 끝자락의 금형 공장.\n\n공장 문 앞에 낯선 사람 셋이 서 있었다. 톈진의 전기차 배터리 공장에서 일하던 기술자들로, 마지막 여객선을 타고 나왔다고 했다. 그 가운데 한 사람이 가방에서 배터리 셀을 담는 케이스의 도면을 꺼냈다.\n\n\"설비는 다 두고 왔습니다. 도면하고 사람만 왔습니다. 금형부터 다시 파야 합니다.\"\n\n사장 김씨가 작업대에 펴 놓은 도면을 보니 공차가 머리카락 굵기의 십분의 일이었다. 옆에서 들여다보던 박 반장이 혀를 찼다.\n\n\"사장님, 이거 우리 기계로 됩니까?\"\n\n\"되게 해야지. 이 사람들은 공장 터도 아직 없대.\"\n\n기술자 하나가 톈진에서는 이 금형을 석 달 만에 받았다고 하자, 김씨는 벽에 걸린 달력을 한 번 쳐다보았다.\n\n\"두 달에 해 주겠소. 대신 시험 사출 때 와서 같이 보시오.\"\n\n기술자들이 돌아간 뒤 박 반장이 장갑을 벗었다.\n\n\"두 달이면 밤일입니다.\"\n\n\"삼겹살은 내가 사.\""
 tfrkphn.485.d:0 "외교부 청사 9층, 동북아국 중국과. 박영환 국장의 책상에 전문 한 장이 올라왔다.\n\n§Y발신: 주칭다오 총영사관§!\n§Y제목: 관내 우리 기업 철수 동향§!\n\n1. 관내 조선 기자재 업체 한 곳이 오늘 재고와 인력을 싣고 출항함. 선박용 밸브와 펌프를 만드는 회사임.\n2. 이 회사의 거래처였던 조선소는 지난달부터 중국 해군 함정을 짓고 있음.\n3. 회사 대표는 이십 년 거래한 조선소 사장과 어제 마지막으로 통화했다고 함. 상대는 미안하다고 했다고 함.\n4. 국방부가 이 회사에 함정용 밸브와 펌프를 맡기려 한다는 말이 있음.\n5. 관내에 남은 우리 기업은 열한 곳임.\n\n박 국장은 전문을 덮었다. 서랍에는 1992년 수교 서명식 사진이 그대로 들어 있었지만 그는 꺼내 보지 않았고, 결재란에 서명한 다음 귀국 기업의 터를 산업부와 협의하라는 한 줄을 적어 넣었다.\n\n\"국장님, 남은 열한 곳은 어떻게 됩니까.\"\n\n\"돌아올 배편부터 알아봐.\""
 tfrkphn.486.d:0 "§Y[지역신문]§! 광저우에서 돌아온 변속기 회사가 공장 터를 찾고 있다.\n\n광저우에서 자동차 변속기를 만들던 이 회사는 현지 합작사가 공장을 넘기라고 요구하자 금형만 빼내 홍콩을 거쳐 실어 왔고, 현지에서 뽑은 직원 가운데 서른 명이 회사를 따라왔다. 국방부가 이 회사에 장갑차 변속기를 맡길 계획이어서, 정부는 수도권과 지방 공단을 놓고 터를 고르는 중이다.\n\n후보지 가운데 한 곳이 경기도 어느 소도시의 보훈회관 맞은편에 칠 년째 비어 있는 공장이다. 회관에서 만난 박정수 할아버지는 맹호부대 출신이다.\n\n\"우리 때는 장갑차가 미제였지. 변속기가 나가면 부품이 배로 한 달 걸려 왔어. 여기서 만들면 좋지.\"\n\n6.25 학도병 출신인 김복동 할아버지는 창밖의 빈 공장을 한참 바라보다가 입을 열었다.\n\n\"공장 소리 나면 좋지. 와 다시 나는지는 생각하면 안 좋고.\""
 tfrkphn.487.d:0 "영등포구, 정의당 중앙당 당사. 김서현은 이제 전화를 받는 대신 논평을 쓴다.\n\n§Y[논평 초안]§!\n선전에서 통신 장비를 조립하던 회사가 협력사 열두 곳과 함께 돌아온다. 환영한다. 일자리가 생긴다.\n그런데 국방부는 이 회사에 군용 통신 장비를 맡기려 한다. 올해 돌아온 공장 가운데 군수품을 만드는 곳이 벌써 여럿이다. 유럽은 징병제를 되살렸다. 이웃 나라들은 국방비를 올린다. 뉴스는 날마다 평화의 시대가 끝났다고 말한다.\n우리는 묻는다. 돌아온 일자리는 전쟁이 끝나면 어디로 가는가.\n\n사수가 초안을 읽고 물었다.\n\n\"환영한다는 말은 뺄까요?\"\n\n\"그건 둬요. 일자리는 일자리니까.\"\n\n서현이 저장 단추를 누르는데 전화벨이 울렸다. 이번에는 욕이 아니었고, 그 공장에 지원하려면 어디로 가야 하느냐는 문의였다."
 tfrkphn.488.d:0 "서준은 졸업하고 두 해를 쉬었고, 형의 기일에는 해마다 광화문에 나갔다.\n\n채용 공고는 짧았다. 시안에서 돌아온 반도체 후공정 회사. 신입 엔지니어. 장비가 들어올 때까지 교육.\n\n장비가 들어오려면 이 년이 걸립니다. 수출 통제에 걸려 한 대도 못 가져왔습니다. 그동안은 빈 클린룸에서 교육만 받습니다. 괜찮겠습니까.\n괜찮습니다.\n이력서에 빈 기간이 있네요. 뭘 했습니까.\n\n서준은 말을 고르다가 결국 있는 그대로 말했다.\n\n집회에 나갔습니다. 형이 대만에서 죽었습니다.\n\n면접관은 펜을 내려놓고 시안에서 같이 일하던 중국인 동료 이야기를 했는데, 전쟁이 나던 날 그 동료가 공항까지 차를 태워 줬다는 것이었다.\n\n설비는 못 가져오고 사람만 왔습니다. 공장 터는 정부가 곧 정해 줍니다.\n\n방진복은 생각보다 가벼웠다. 임시 교육장 바닥에는 장비가 놓일 자리마다 노란 테이프가 붙어 있어서, 서준은 그 테이프를 따라 걸었다."
 tfrkphn.489.d:0 "중국에서 철수한 기업 여섯 곳이 모두 자리를 잡았습니다.\n\n세 곳은 예전에 만들던 것을 다시 만들고 두 곳은 군수품을 만들며, 나머지 한 곳은 조선소 옆에 자리를 잡았습니다. 산업부는 돌아오겠다는 문의가 스무 건 더 들어와 있다고 보고했습니다.\n\n돌아온 공장의 기계에는 아직 중국어 안내문이 붙어 있는데, 새로 뽑힌 직원들이 그 위에 한글 스티커를 하나씩 붙이고 있습니다."
 tfrkphn.482.story:0 "이정훈이 새 공장에 처음 출근한 날이었다.\n\n정문에서 받은 사원증에는 생산기술부장 이정훈이라고 적혀 있었고, 그는 그것을 목에 걸고 한참 내려다보았다.\n\n자리에는 생산 계획표가 놓여 있었다. 쑤저우에서 세탁기 모터를 만들던 라인인데도 계획표의 품목은 절반이 무인기 모터였고, 납품처 칸에는 방위사업청과 폴란드 회사의 이름이 적혀 있었다.\n\n기계에는 중국어 안내문이 그대로 붙어 있었고, 쑤저우의 반장이 매직으로 적어 둔 숫자도 남아 있었다. 조임 값, 급유 주기, 고장 난 날짜.\n\n부장님, 이거 번역해서 다시 붙일까요.\n숫자는 그대로 둬. 십오 년 돌린 사람이 적은 거야.\n\n점심시간에 식당 텔레비전에서 뉴스가 나왔다. 유럽 나라들이 징병제를 되살리고 일본은 국방비를 두 배로 올린다는 소식에 이어, 동남아 나라들이 한국 공장에 탄약을 주문하러 줄을 섰다는 소식이 나왔다. 아나운서는 평화의 시대가 끝났다고 말했다.\n\n식당에서 고개를 든 사람은 없었다. 다들 그 주문으로 월급을 받는 사람들이었기 때문이다.\n\n오후에 정훈은 탕비실에서 믹스커피를 한 잔 탔는데, 이번에는 뭐라고 하는 사람이 없었다. 다섯 해 만에 얻은 일자리였고, 그 일자리가 어디서 왔는지를 그는 계획표를 보고 알았다."
 tfrkphn.476.story:0 "창원, 어느 기계 공장의 노조 사무실.\n\n점심시간이 끝나 가는데 벽의 텔레비전에서는 대통령이 고용 창출 전략회의를 주재하고 있었다. 젊은 조합원 하나가 채널을 돌리려 하자 지회장 최씨가 그냥 두라고 했다.\n\n\"지회장님, 저 사람 찍으셨다면서요.\"\n\n사무실이 조용해졌다. 최씨는 민주노총 조끼를 삼십 년 입었고, 선거 때마다 진보정당을 찍었다고 스스로 말해 온 사람이었다.\n\n\"찍었다.\"\n\n\"홍준표가 세운 사람인데요.\"\n\n최씨는 대답 대신 믹스커피를 저었다. 1998년 2월에 그는 스물아홉이었고, 딸이 백일을 갓 넘긴 때에 다니던 공장이 부도났다. 실업급여라는 말을 처음 들은 것은 노동사무소 창구에서였다. 넉 달 동안 나온 돈은 많지 않았어도 분유와 월세는 됐고, 그 넉 달 사이에 그는 지금 공장에 들어왔다.\n\n그 제도를 누가 들여왔는지는 나중에야 알았다. 파업한 사람한테도 생계비는 줘야 한다고 했다가 재계에 두들겨 맞은 1993년의 노동부 장관이었다.\n\n\"그 사람이 당을 몇 번 옮겼는지는 나도 안다. 나하고 생각이 다른 것도 안다.\"\n\n\"그런데요?\"\n\n\"빚이 있어서. 한 번은 갚아야지.\"\n\n최씨가 종이컵을 구기고 일어섰을 때, 텔레비전 속 대통령은 일자리 숫자를 읽고 있었다.\n\n\"대신 저 숫자 못 채우면 내가 제일 먼저 머리띠 맨다.\""
 tfrkphn.286.d:0 "정진석 총리가 사의를 밝혔습니다.\n\n총리실이 올린 안건이 잇달아 밀리자, 이름뿐인 책임총리는 더 할 수 없다는 뜻을 전해 온 것입니다.\n\n장관들과 임기를 함께하겠다는 것은 대통령이 직접 한 약속이었습니다."
 tfrkphn.287.d:0 "조현동 외교부 장관이 사의를 밝혔습니다.\n\n외교부의 요청이 예산과 정원에서 번번이 깎인 데다, 대사들 사이에서도 불만이 나오고 있기 때문입니다.\n\n장관들과 임기를 함께하겠다는 것은 대통령이 직접 한 약속이었습니다."
 tfrkphn.288.d:0 "방기선 장관이 사의를 밝혔습니다.\n\n다른 부처의 지출 요구를 막을 길이 없다는 것이 이유인데, 예산을 다루는 직원들까지 술렁이고 있습니다.\n\n장관들과 임기를 함께하겠다는 것은 대통령이 직접 한 약속이었습니다."
 tfrkphn.289.d:0 "이명수 행정안전부 장관이 사의를 밝혔습니다.\n\n지방에 약속한 돈이 내려가지 않으면서 시장과 군수들의 항의가 모두 장관에게 몰렸습니다.\n\n장관들과 임기를 함께하겠다는 것은 대통령이 직접 한 약속이었습니다."
 tfrkphn.290.d:0 "김홍균 국가정보원장이 사의를 밝혔습니다.\n\n국정원의 권한이 하나씩 다른 기관으로 넘어가는 동안 조직을 지키지 못했다는 것이 그가 든 이유입니다.\n\n장관들과 임기를 함께하겠다는 것은 대통령이 직접 한 약속이었습니다."
 tfrkphn.291.d:0 "신범철 국방부 장관이 사의를 밝혔습니다.\n\n전쟁에서 쓴 탄약을 채울 예산이 또 밀렸고, 군 안에서는 장관에게 힘이 없다는 말까지 돌고 있습니다.\n\n장관들과 임기를 함께하겠다는 것은 대통령이 직접 한 약속이었습니다."
 tfrkphn.285.d:0 "정부조직법 개정안이 국무회의에 올라왔습니다.\n\n기획재정부를 둘로 나누는 안으로, 예산 편성은 국무총리 소속 기획예산처로 넘어가고 남은 부처는 재정경제부가 됩니다.\n\n재정경제부라는 이름은 2008년에 재정경제부와 기획예산처가 합쳐져 기획재정부가 되면서 사라졌는데, 이번 안은 그 합병을 되돌리는 것입니다."
 tfrkphn.295.d:0 "야당이 부처가 제 일을 못 한다는 이유로 [TFRKPHN_dept_who] 해임 건의안을 냈습니다.\n\n헌법은 국회가 장관의 해임을 대통령에게 건의할 수 있다고 적고 있지만, 대통령이 그 건의를 반드시 따라야 하는 것은 아닙니다."
 tfrkphn.296.d:0 "국무회의가 한 시간 만에 멈췄습니다.\n\n두 장관이 서로 상대 부처 탓을 하다가 벌어진 일인데, 그날 저녁에는 회의록까지 언론에 흘러나갔습니다."
 tfrkphn.460.d:0 "합참의장이 두꺼운 서류철을 들고 집무실에 들어왔는데, 북으로 올라가는 작전계획이었습니다.\n\n지도에는 길이 둘 그려져 있었습니다. 하나는 개성을 지나 평양으로 가는 길이고, 다른 하나는 동해안에 병력을 올려 원산을 치는 길입니다. 합참의장은 어느 쪽에 무게를 둘 것인지 물었습니다."
 tfrkphn.461.d:0 "예비군 동원 훈련이 끝났습니다.\n\n동원사단마다 사람이 찼고 전방 창고에는 탄약과 연료가 들어갔습니다. 국방부 장관은 명령만 내려오면 사흘 안에 병력을 전방에 세울 수 있다고 보고했습니다."
 tfrkphn.462.d:0 "대통령이 전방 군단을 돌아보았습니다.\n\n군단장들은 하나같이 명령만 내리면 된다고 했습니다. 포병은 표적을 정해 두었고 기동군단은 도하 장비를 강가에 가져다 놓았다는 보고를 다 듣고 난 대통령은, 북쪽을 한참 바라보다가 차에 올랐습니다."
 tfrkphn.463.d:0 "오산과 군산의 활주로에서 옛 미군 소속이던 공군의 전투기가 줄지어 떴습니다.\n\n동해 건너에서는 일본 공군의 편대가 같은 시각에 이륙했습니다. 두 편대가 휴전선 남쪽 하늘에서 만나 북한을 향해 날아가기 시작하자, 평양의 방공 레이더가 한꺼번에 켜졌습니다."
 tfrkphn.464.d:0 "사세보와 부산의 부두에 함정이 모였습니다.\n\n과거 미군 소속이었던 7함대의 수병들과 제3해병원정군의 장병들이 해상자위대와 대한민국 해군의 함정에 올랐고, 갑판에서는 상륙 장갑차를 묶는 작업이 밤새 이어졌습니다. 함대는 이제 북한 해안으로 가라는 명령을 기다립니다."
 tfrkphn.283.d:0 "청와대 집무실, 밤 아홉 시.\n\n책상에 놓인 통계청 보고서의 첫 장에는 숫자가 하나 있었다. 취임 뒤 새로 생긴 일자리가 100만 개를 넘었다는 숫자였는데, 이인제는 안경을 벗고 그 숫자를 다시 읽었다.\n\n그는 1993년 6월의 울산을 떠올렸다. 김영삼 정부의 노동부 장관이던 그는 마흔넷으로 내각에서 가장 젊었고, 현대 계열사의 분규가 번지자 직접 울산으로 내려갔다. 밤에는 현대정공 노조 사무실에 앉아 간부들의 말을 들었고, 이튿날 아침에는 현대자동차 노조를 찾은 다음 오전에 사장단과 임원 스물여섯 명과 마주 앉았다. 장관이 분규 현장에 내려온 것은 정부가 생긴 뒤 처음이라고 신문이 썼다.\n\n그 이틀 동안 그는 양쪽에서 같은 것을 보았다. 노조도 사장들도 결국 공장이 돌아가야 할 수 있는 이야기를 하고 있었다.\n\n그해 12월에 고용보험법이 만들어졌고 그는 그달에 장관에서 물러났다. 법이 1995년 7월에 시행되는 것을 그는 장관실 밖에서 지켜보았다.\n\n대통령이 되던 날 그는 일자리부터 만들겠다고 말했다. 전쟁에서 돌아온 장병들이 구직 창구 앞에 줄을 서 있던 때였는데, 보고서 둘째 장에는 그 줄이 지난달에 없어졌다고 적혀 있었다.\n\n그는 보고서를 덮고 비서실장을 불렀다.\n\n\"내일 일정에 울산을 넣게.\"\n\n\"잡혀 있는 행사가 없습니다.\"\n\n\"행사는 필요 없네. 공장 식당에서 점심이나 먹고 오세.\""
 tfrkphn.455.d:0 "북한에서 올라오는 보고가 하루 사이에 달라졌습니다.\n\n도 당위원회는 평양의 지시에 답하지 않고, 공장은 멈췄으며 열차는 역에 선 채 움직이지 않습니다. 군부대의 식량 창고를 병사들이 털었다는 보고까지 올라오는데도 평양의 방송은 어제와 같은 말만 되풀이하고 있습니다."
 tfrkphn.456.d:0 "김정은의 형 김정철이 북한을 빠져나왔습니다.\n\n그는 권력에서 떨어져 지내던 사람으로, 바깥에는 에릭 클랩튼 공연장에서 찍힌 사진 정도로만 알려져 있었습니다. 그런 그가 제3국의 한국 대사관에 걸어 들어와 망명을 신청했는데도 평양은 아무 발표도 하지 않았습니다."
 tfrkphn.457.d:0 "[TFRKPHN_nk_lost_name]에 주둔한 군단이 평양의 명령을 받지 않습니다.\n\n군단 지휘부는 총정치국에서 내려온 검열단을 부대 정문에서 돌려보냈고, 병사들이 도 보위부 청사를 에워싸자 보위원들은 무기를 내려놓았습니다. 도 경계의 초소마다 평양에서 오는 차를 막는 차단봉이 내려가 있어서, 평양은 그 도에 군대를 들여보내지 못하고 있습니다."
 tfrkphn.458.d:0 "전방 군단의 지휘관들이 휴전선으로 걸어 나왔습니다.\n\n흰 천을 든 부관이 앞에 서고 군단장 둘과 사단장 여럿이 그 뒤를 따랐습니다. 그들이 가방째 넘긴 것은 작전 지도와 통신 암호였는데, 그 안에는 평양방어군단의 배치도도 들어 있었습니다."
 tfrkphn.459.d:0 "평양 한복판에서 총소리가 났습니다.\n\n평양방어군단의 한 여단이 호위사령부의 검문을 거부하면서 두 부대가 대동강 다리를 사이에 두고 밤새 총을 쏘았고, 아침에 길에 나온 평양 시민들은 불탄 장갑차를 보았습니다."
 tfrkphn.465.d:0 "총정치국이 검열단을 내려보냈지만, 검열단은 부대 안으로 들어가지 못했습니다.\n\n위병소의 병사들이 총을 든 채 길을 막았고 지휘관은 끝내 나오지 않았습니다. 검열단장이 평양에 전화를 걸려고 하자 부대의 통신병이 선을 끊어 버려서, 검열단은 타고 온 차를 두고 걸어서 돌아갔습니다."
 tfrkphn.454.d:0 "보위부가 단속 부대를 보냈지만 그 부대는 돌아오지 못했습니다.\n\n장마당 상인들이 길을 막자 뒤따라온 주민들이 부대를 에워쌌습니다. 총소리가 한참 이어진 끝에 살아서 나온 보위원은 없었고, 평양은 그 지역에 단속 부대를 다시 보내지 못했습니다."
 tfrkphn.298.d:0 "평양에서 내려온 명령이 군단에서 멈췄습니다.\n\n지휘관 몇이 부대를 움직이지 않는 사이에, 병사들은 초소를 비우고 고향 쪽으로 걸어가기 시작했습니다."
 tfrkphn.441.d:0 "함흥의 장마당에서 소문이 돕니다.\n\n밤마다 벽보를 붙이는 사람들이 있다는데 이름도 얼굴도 아는 사람이 없습니다. 보위부는 벽보를 뗀 사람까지 잡아갔습니다."
 tfrkphn.442.d:0 "청진의 한 공장 담벼락에서 자유조선의 마크가 나왔습니다.\n\n보위원들이 새벽에 페인트로 덮었지만 덮은 자리가 오히려 더 눈에 띄었고, 출근하던 노동자들은 모두 그 앞을 지나갔습니다."
 tfrkphn.447.d:0 "북한군 병사 한 명이 판문점 군사분계선을 넘었습니다.\n\n초소에서 뛰어나와 남쪽으로 달리는 그의 뒤에서 총소리가 났습니다. 쓰러진 그를 우리 경비대대가 끌어냈고, 그는 수술 끝에 목숨을 건졌습니다. 2017년 11월에도 북한군 병사 한 명이 총을 맞으며 이곳을 넘은 일이 있습니다."
 tfrkphn.443.d:0 "북한의 고위 간부가 가족과 함께 제3국의 한국 대사관 문을 두드렸습니다.\n\n그의 가방에는 당 조직의 명단이 들어 있었고, 국가정보원은 그를 서울로 데려왔습니다."
 tfrkphn.448.d:0 "혜산의 국경경비대 한 개 분대가 압록강을 건넜습니다.\n\n탈북을 막는 일을 하던 병사들이 총을 강가에 두고 스스로 강을 건넌 것이어서, 평양은 국경의 경비 병력을 통째로 바꿨습니다."
 tfrkphn.449.d:0 "유럽에 나가 있던 북한 외교관이 가족과 함께 사라졌습니다.\n\n며칠 뒤 서울에 나타난 그는 대사관이 외화벌이에 쓰던 계좌를 모두 넘겼습니다."
 tfrkphn.445.d:0 "신의주의 장마당에 사람들이 모였습니다.\n\n단속반이 한 상인의 쌀을 빼앗은 일이 시작이었는데, 수백 명이 인민위원회 건물 앞까지 걸어갔고 보위부가 총을 쏘고서야 흩어졌습니다."
 tfrkphn.446.d:0 "시위를 막으러 나간 부대가 총을 쏘지 않았다는 소문이 돕니다.\n\n지휘관이 발포 명령을 따르지 않았고 병사 몇은 아예 시위대 쪽에 섰다는 이야기입니다. 평양이 그 부대를 해산했지만 소문은 이미 다른 군단까지 번졌습니다."
 tfrkphn.450.d:0 "청진에서 보위부가 통제를 잃었습니다.\n\n시위대가 사흘 동안 도 인민위원회 앞을 차지하자 평양은 군을 보냈습니다. 장갑차가 광장으로 들어간 그날 밤 청진의 전화가 모두 끊겼고, 죽은 사람이 몇인지는 아무도 모릅니다."
 tfrkphn.451.d:0 "양강도의 산골에서 주민들이 무기고를 털었습니다.\n\n그들은 보위부 지서를 습격한 뒤 산으로 들어갔는데, 진압하러 간 부대는 마을 사람들이 길을 알려 주지 않아서 사흘째 그들을 찾지 못하고 있습니다."
 tfrkphn.452.d:0 "북한군 전차 한 대가 철원의 군사분계선을 넘었습니다.\n\n포신을 뒤로 돌린 채 넘어온 전차에서 승무원 넷이 해치를 열고 손을 들었고, 우리 군은 그 전차를 후방으로 옮겼습니다."
 tfrkphn.444.d:0 "북한 공군의 전투기 한 대가 서해 위로 내려왔습니다.\n\n조종사가 날개를 좌우로 흔들자 우리 공군이 기체를 수원 기지로 이끌었습니다. 1996년에도 이철수 대위가 미그기를 몰고 넘어온 일이 있습니다."
 tfrkphn.453.d:0 "북한 해군의 함정 한 척이 동해 북방한계선을 넘었습니다.\n\n수병들이 함장과 정치지도원을 선실에 가두고는 흰 천을 걸고 속초로 뱃머리를 돌린 것이어서, 우리 해군이 함정을 항구까지 이끌었습니다."
 tfrkphn.297.d:0 "북한 곳곳에서 같은 소식이 올라옵니다.\n\n배급소 앞의 줄이 사라지고 장마당이 그 자리를 대신했으며, 이제는 보위원이 지나가도 사람들이 하던 말을 멈추지 않는다고 합니다."
 tfrkphn.301.desc:0 "2027년 3월 3일, 양안전쟁이 끝나고 처음 치르는 대통령 선거의 날이 밝았다.\n\n5년 단임제에 묶인 홍준표는 출마할 수 없었고, 국민의힘은 승전 정부를 잇겠다는 뜻으로 당의 원로 이인제를 후보로 세웠다. 전쟁에서 이긴 정부의 지지율은 선거 날까지 내려가지 않았다.\n\n이인제는 아침 일찍 투표를 마치고 돌아와 오래된 글 하나를 다시 꺼내 읽었다. 5년 전 3월 9일, 그때도 대선 날 아침에 쓴 글이었다. 주권자인 국민이 결단할 시간이 왔고 국민에게는 두려울 것이 없다고 적은 글인데, 맨 끝에 그는 모두 함께 \"새로운 출발선에 서자\"고 써 두었다. 그날은 다른 사람의 당선을 바라며 쓴 글이었다.\n\n개표는 자정을 넘기기 전에 기울었다. 당선이 확실하다는 자막이 뜨자 선거 사무소에 모인 사람들이 그의 이름을 불렀지만, 여든을 바라보는 당선인은 한동안 자리에서 일어나지 않았다. 1997년에 처음 도전한 뒤로 30년이 걸린 일이었다.\n\n홍준표 정부가 시작한 개혁과 전후의 동맹 질서는 이제 그의 정부가 이어받는다."
