l_korean:
 # 문장 끝을 고친 글. style_build.py가 만든다. 같은 키의 원래 글을 덮는다.
 tfrkphn.493.d:0 "재벌개혁 법안 넷이 국회를 통과한 주에 홍준표 전 대통령이 다시 글을 올렸는데, 이번 글은 전보다 훨씬 길었습니다.\n\n그가 꺼낸 것은 2017년 봄이었습니다. 그해 자유한국당 경선에서 자신은 1위였고 이인제는 3위였으며, 이듬해에는 자신이 당 대표로서 이인제를 충남지사 후보로 추대했다는 이야기였습니다. 그때 충청도가 낳은 큰 인물이라고 자기 입으로 말했다는 대목도 빠지지 않았습니다.\n\n홍준표는 그런 사람이 이제 유승민의 공약집으로 나라를 운영한다고 쓰고, 기업을 때려서 일자리가 생긴 나라는 없다는 말을 덧붙였습니다. 글은 수레의 두 바퀴 가운데 한쪽만 굴리면 그 수레가 어디로 가느냐는 물음으로 끝났습니다.\n\n청와대 참모들은 답을 낼 것인지 말 것인지를 두고 둘로 갈렸습니다."
 tfrkphn.494.d:0 "장부에서 이름이 나온 여당 의원은 넷이었고, 그 가운데 둘은 홍준표 정부에서 장관과 수석을 지낸 사람들이었습니다.\n\n그날 밤 대통령의 휴대폰이 울렸습니다. 화면에 뜬 이름은 홍준표였는데, 그가 글이 아닌 전화로 연락한 것은 이인제가 취임한 뒤로 처음 있는 일이었습니다.\n\n홍준표는 자신도 검사였으니 수사를 막을 생각은 없다는 말로 시작했습니다. 다만 전쟁을 같이 치른 사람들을 포토라인에 세우는 일에는 순서가 있지 않겠느냐고 했고, 통화는 그 말을 끝으로 사 분 만에 끝났습니다.\n\n대통령은 전화를 내려놓고도 한동안 자리에서 일어나지 않았습니다. 문 밖에서는 민정수석이 결재판을 든 채 기다리고 있었습니다."
 tfrkphn.495.d:0 "재벌개혁 법안이 모두 통과된 주말에 홍준표 전 대통령이 수행원도 없이 청와대에 왔는데, 손에는 막걸리 두 병이 들려 있었습니다.\n\n관저 식탁에 마주 앉자 홍준표는 할 말부터 했습니다. 유승민을 들인 것은 지금도 마음에 들지 않고 자기 글에 답이 늦은 것도 섭섭했다는 이야기였는데, 이인제는 잔을 채우며 듣기만 했습니다.\n\n둘째 병을 딸 무렵 홍준표가 2018년 충남 이야기를 꺼냈습니다. 어려운 선거인 줄 알면서 나가 달라고 했다는 그의 말에 이인제는 알고 나갔다고 짧게 답했습니다.\n\n홍준표는 일어서면서 법은 통과시켰으니 지키게 하는 일까지 하라는 한마디를 남겼고, 다음 날 그의 글은 올라오지 않았습니다."
 tfrkphn.496.d:0 "새 일자리가 50만 개를 넘었다는 발표가 난 날 홍준표 전 대통령이 방송에 나왔습니다.\n\n진행자가 후임 정부의 일자리 정책을 묻자 그는 숫자부터 따지고 들어, 그 가운데 세금으로 만든 자리가 몇 개냐고 되물었습니다. 경남도지사 때 자신은 빚부터 갚았고 다 갚고 남은 돈으로 일을 벌였다는 말도 이어졌습니다.\n\n방송이 끝날 무렵에야 다른 말이 나왔습니다. 그래도 전역한 아이들이 줄을 덜 선다니 그것 하나는 잘한 일이라는 것이었습니다.\n\n청와대 대변인실은 그 마지막 한마디를 논평에 넣을지 말지를 두고 한 시간을 회의했습니다."
 tfrkphn.497.d:0 "북진 준비가 끝났다는 보고가 올라간 주에 홍준표 전 대통령이 청와대로 전화를 걸었는데, 이번에는 비서실을 거쳐서 온 전화였습니다.\n\n그는 양안전쟁 때의 일을 이야기했습니다. 참전을 결정한 날 밤에는 잠을 자지 못했고, 전사자의 어머니가 보낸 편지를 읽은 날은 일정을 모두 취소했다고 했습니다. 전쟁은 시작하는 날보다 끝내는 날을 정하기가 훨씬 어렵다는 말도 했습니다.\n\n홍준표는 훈수를 둘 생각은 없으며, 그 자리에 앉아 본 사람이 둘뿐이라 하는 말이라고 덧붙였습니다.\n\n이인제는 전화를 끊고 수첩에 한 줄을 적었습니다. 끝내는 날."
 tfrkphn.500.d:0 "통일이 공포된 날 저녁에 홍준표 전 대통령이 세 줄짜리 글을 올렸습니다.\n\n첫 줄에서 그는 자신이 전쟁에서는 이겼지만 이 일은 하지 못했다고 썼고, 둘째 줄에는 이인제가 했다고만 적었습니다. 셋째 줄은 판문점 표지판을 뽑는 날에는 자기도 불러 달라는 부탁이었습니다.\n\n기자들이 유승민에게도 소감을 물었지만 그는 홍준표의 글에 공감을 눌렀다고만 답했습니다. 두 사람이 서로의 글에 공감을 누른 것은 그날이 처음이었습니다."
 tfrkphn.501.d:0 "대통령이 통일되는 날 한반도의 핵을 모두 내려놓겠다고 선언하자, 그날 밤 홍준표 전 대통령이 글을 올렸습니다.\n\n홍준표는 2017년 9월의 대구를 꺼냈습니다. 그날 자신은 거리에서 핵에는 핵으로 맞서야 한다고 말했고, 전술핵을 들여오지 못하면 우리 손으로 만들자고까지 했는데 그 생각은 지금도 같다는 것이었습니다.\n\n이인제는 그해에 독자 핵무장에 반대하면서 독일은 핵 없이도 유럽에서 가장 강한 나라라는 논리를 폈습니다. 홍준표는 독일 옆에는 중국이 없다는 한 줄로 그 논리를 받았습니다.\n\n글의 끝에는 물음이 하나 달려 있었습니다. 내려놓겠다는 핵에 북쪽 것만 들어가는지, 아니면 우리가 가질 수도 있었던 것까지 들어가는지를 그는 물었습니다."
 tfrkphn.502.d_pm:0 "책임총리제 담화가 나간 날 홍준표 전 대통령이 기자들을 만났습니다.\n\n그는 대통령이 내치를 총리에게 넘기는 것을 이해할 수 없다면서, 자신은 전쟁 중에도 경제 회의를 직접 주재했다고 말했습니다. 권한을 나누면 책임질 사람이 없어진다는 것이 그의 주장이었습니다.\n\n한 기자가 이인제 대통령은 1997년부터 그 말을 해 왔다고 하자, 홍준표는 삼십 년을 말했어도 틀린 것은 틀린 것이라고 짧게 받았습니다.\n\n총리실은 그날 논평을 내지 않았고, 총리는 다음 날 첫 경제장관회의를 예정대로 열었습니다."
 tfrkphn.502.d_st:0 "대통령이 책임총리제 담화를 접고 국정을 직접 챙기겠다고 발표한 날 홍준표 전 대통령이 기자들을 만났습니다.\n\n그는 잘한 결정이라면서, 자신은 전쟁 중에도 경제 회의를 직접 주재했다고 말했습니다. 다들 다음 전쟁을 준비하는 때에 권한을 쪼개는 나라가 어디 있느냐는 것이 그의 말이었습니다.\n\n한 기자가 이인제 대통령은 1997년부터 책임총리를 말해 왔다고 하자 홍준표는 웃으면서, 앉아 보면 생각이 바뀌는 자리라고 답했습니다.\n\n청와대는 그 말을 받지 않았고, 대통령은 다음 날 아침 일곱 시에 첫 회의를 잡았습니다."
 tfrkphn.503.d:0 "양안전쟁 참전용사 예우법이 공포된 날 국립서울현충원에서 기념식이 열렸습니다.\n\n홍준표 전 대통령은 초청장을 받고도 단상에 오르지 않고 유족석 맨 뒷줄에 앉았습니다. 그 전쟁에 장병을 보낸 사람이 바로 그였습니다.\n\n식이 끝나자 한 어머니가 그에게 다가왔는데, 몇 해 전 아들이 무엇을 위해 죽었느냐고 묻는 편지를 청와대로 보낸 사람이었습니다. 홍준표는 자리에서 일어나 고개를 숙였고, 두 사람이 그 뒤에 무슨 말을 나눴는지는 알려지지 않았습니다.\n\n이인제 대통령은 단상에서 그 모습을 지켜보다가, 준비한 연설의 마지막 문단을 읽지 않은 채 내려왔습니다."
 tfrkphn.504.d:0 "대통령이 통일 뒤에 북쪽 사람들에게 보복하지 않겠다고 선언한 다음 날 홍준표 전 대통령이 방송에 나왔습니다.\n\n그는 자신이 검사였다는 말로 시작해, 용서와 사면은 재판이 끝난 뒤에 하는 일이라고 했습니다. 정치범수용소를 만들고 운영한 사람들까지 묻지 않겠다는 뜻이냐고 되물으면서, 아랫사람은 살리고 윗사람은 법정에 세우는 것이 순서라고 말했습니다.\n\n진행자가 그러면 북쪽 군인들이 끝까지 싸우지 않겠느냐고 묻자 홍준표는 잠깐 말을 멈췄습니다. 그 걱정은 대통령이 하는 것이 맞고 자신은 이제 그 걱정을 하는 자리에 있지 않다는 답이 조금 뒤에 나왔습니다.\n\n그날 밤 통일부는 선언문의 한 문장을 두고 늦게까지 회의했습니다."
 tfrkphn.508.d:0 "첫 재벌개혁 법안이 국회를 통과한 주에 대통령이 유승민을 다시 불렀습니다.\n\n대통령은 법을 만든 사람이 법을 집행하는 것이 맞다면서 공정거래위원장 자리를 제안했고, 유승민은 한참을 듣고 난 뒤에 사양했습니다.\n\n자신이 그 자리에 앉으면 이 법은 유승민의 법이 되고, 그러면 반대하는 쪽은 법 대신 사람을 공격할 것이라는 이유였습니다. 자신은 밖에서 조문을 봐 주는 것으로 충분하다고 했습니다.\n\n집무실을 나서기 전에 그는 한 가지를 부탁했습니다. 위원장에는 정치인 말고 숫자를 읽을 줄 아는 사람을 앉혀 달라는 것이었습니다."
 tfrkphn.509.d:0 "재계와 타협한 안이 국회를 통과한 다음 날 아침, 대통령의 책상에 유승민이 보낸 메모 한 장이 올라와 있었습니다.\n\n메모는 세 줄이었습니다. 첫 줄은 예외 조항이 붙은 자리를 조문 번호로 짚었고, 둘째 줄은 그 예외로 빠져나가는 그룹이 몇 곳인지를 적었습니다. 셋째 줄에는 한 번 붙인 예외는 다음 법안에서도 요구받게 된다는 말이 있었습니다.\n\n끝에 붙은 말은 없었습니다. 그만두겠다는 말도 화가 났다는 말도 없었는데, 비서실장은 오히려 그 점이 더 무겁다고 말했습니다."
 tfrkphn.510.d:0 "경제 단체들이 성명을 낸 이틀 뒤 유승민이 방송 토론에 나갔고, 맞은편에는 경제 단체의 상근부회장이 앉았습니다.\n\n부회장은 기업을 죄인 취급하는 법이 이어지면 투자가 나라 밖으로 나간다고 말했습니다. 유승민이 꺼낸 것은 종이 한 장이었는데, 지난 십 년 동안 총수 일가의 개인회사가 내부거래로 올린 매출과 같은 기간 그 그룹의 국내 투자액을 나란히 적은 표였습니다.\n\n한국개발연구원 연구원 출신인 그는 목소리를 높이지 않고 표의 숫자를 한 줄씩 읽어 내려갔습니다. 부회장이 그 숫자의 출처를 묻자, 그 단체가 해마다 내는 보고서라는 답이 돌아왔습니다.\n\n다음 날 경제 단체들은 두 번째 성명을 미뤘습니다."
 tfrkphn.511.d:0 "검찰이 그룹 본사를 압수수색한 날 기자들이 유승민을 둘러쌌습니다. 재벌개혁이 결국 재벌 손보기 아니냐는 질문이 쏟아졌습니다.\n\n유승민은 수사와 입법을 한데 섞으면 둘 다 망가진다고 답했습니다. 죄가 있으면 벌을 받아야 하지만 법안 표결을 압수수색 날짜에 맞추는 일은 없어야 한다는 말도 했습니다.\n\n그날 저녁 그는 같은 말을 대통령에게 따로 전하면서, 수사가 끝날 때까지 다음 법안의 상정을 미루자고 제안했습니다."
 tfrkphn.512.d_full:0 "통일세가 발표된 주말에 유승민이 신문에 글을 실었습니다.\n\n그는 2015년 4월 원내대표 연설에서 증세 없는 복지는 허구라고 말했던 사람입니다. 이번 글의 첫 문장도 세금 없는 통일은 없다는 것이어서 그때와 꼴이 같았고, 그 뒤로는 북쪽의 도로와 병원과 학교에 드는 돈이 항목마다 적혀 있었습니다.\n\n유승민은 정부가 욕을 먹으면서도 원안대로 걷기로 한 것을 옳다고 쓰면서, 걷은 돈을 어디에 쓰는지는 해마다 국회에 보고하라고 했습니다. 여당 안에서 통일세를 편든 사람은 그가 처음이었습니다."
 tfrkphn.512.d_half:0 "통일세가 발표된 주말에 유승민이 신문에 글을 실었습니다.\n\n그는 2015년 4월 원내대표 연설에서 증세 없는 복지는 허구라고 말했던 사람입니다. 이번 글의 첫 문장도 세금 없는 통일은 없다는 것이어서 그때와 꼴이 같았고, 그 뒤로는 북쪽의 도로와 병원과 학교에 드는 돈이 항목마다 적혀 있었습니다.\n\n유승민은 세율을 절반으로 낮춘 것이 아쉽다고 썼습니다. 모자라는 절반은 결국 다음 정부가 걷게 된다는 이유였는데, 그래도 세금이라는 말을 피하지 않은 것만은 평가한다고 덧붙였습니다."
 tfrkphn.512.d_none:0 "통일세 논란이 지나간 주말에 유승민이 신문에 글을 실었습니다.\n\n그는 2015년 4월 원내대표 연설에서 증세 없는 복지는 허구라고 말했던 사람입니다. 이번 글의 첫 문장도 세금 없는 통일은 없다는 것이어서 그때와 꼴이 같았고, 그 뒤로는 북쪽의 도로와 병원과 학교에 드는 돈이 항목마다 적혀 있었습니다.\n\n유승민은 정부가 세금 대신 국채를 고른 것을 비판하면서, 국채도 결국 세금으로 갚아야 하는데 그 세금은 지금 투표권이 없는 아이들이 내게 된다고 썼습니다. 신문들은 재벌개혁을 같이 하는 사이에도 할 말은 한다는 뜻으로 그 글을 풀이했습니다."
 tfrkphn.513.d:0 "2021년 10월 29일, 국민의힘 경선 토론에서 홍준표와 유승민이 마주 섰습니다. 유승민이 경제 정책을 설명하자 홍준표는 경제부총리를 하면 안 되겠느냐고 물었고, 유승민은 자신이 대통령이 되면 홍준표를 법무부장관에 임명할까 싶다고 받아 방청석에서 웃음이 터졌습니다.\n\n취임 닷새째 되는 날 대통령은 그 농담을 진담으로 바꿔, 비서실장을 통해 유승민에게 경제부총리 자리를 제안했습니다.\n\n그날 저녁에 온 답은 사양이었습니다. 공매도와 모병제에 주택 공약까지 토론에서 반대한 것이 너무 많은데, 그렇게 반대하던 사람이 내각에 앉으면 자신도 정부도 말이 꼬인다는 이유였습니다. 밖에서 할 말을 하는 쪽이 정부에 더 쓸모가 있을 것이라고도 했습니다."
 tfrkphn.514.d:0 "정부가 모병제 확대안을 내놓은 주에 유승민이 방송에 나와, 경선 토론에서 했던 질문을 다시 꺼냈습니다.\n\n그때 유승민은 4년 전 징병제를 말하던 홍준표가 왜 생각을 바꿨느냐고 물었습니다. 홍준표는 병력 자원이 줄고 있고 모병제가 세계의 흐름이라고 답하면서, 해병대 지원 경쟁률이 10대 1이라는 말도 했습니다.\n\n유승민은 그때의 걱정이 그대로라고 말했습니다. 월급을 보고 입대하는 군대가 되면 형편이 어려운 집 아들부터 총을 들게 되고, 전쟁을 막 치른 나라에서는 그것이 누가 죽느냐의 문제가 된다는 것이었습니다.\n\n국방부는 다음 날 지원병의 출신 지역과 가구 소득을 해마다 공개하겠다고 밝혔습니다."
 tfrkphn.515.d:0 "토지임대부 주택의 첫 분양 공고가 난 날 유승민이 글을 올렸습니다.\n\n땅은 나라가 갖고 집만 파는 이 주택은 홍준표의 경선 공약이었고, 유승민은 토론 때부터 한 가지를 짚어 왔습니다. 10년이 지나 소유권이 넘어가면 시세와의 차익이 당첨된 사람에게 통째로 간다는 것이었는데, 홍준표는 10년을 산 사람의 소유권은 인정해야 한다고 맞섰습니다.\n\n유승민의 글은 첫 단지의 분양가와 둘레 시세, 그리고 10년 뒤의 예상 차익 같은 숫자로 채워져 있었습니다. 집을 싸게 주는 것은 좋지만 그 값을 누가 치르는지는 밝혀야 한다는 것이 글의 요지였습니다.\n\n국토교통부가 해명 자료를 냈지만, 기자들은 해명 자료보다 유승민의 표를 더 많이 실었습니다."
 tfrkphn.516.d:0 "법인세 인하안이 국회를 통과한 주말에 유승민이 신문에 글을 실었습니다.\n\n유승민은 2015년 4월 원내대표 연설에서 증세 없는 복지는 허구라고 말했고, 그 말로 당시 청와대와 멀어졌습니다. 이번 글도 깎은 세금은 누군가 메워야 한다는 같은 자리에서 출발했습니다.\n\n그는 전쟁에 쓴 돈과 보훈에 쓸 돈을 먼저 적고 그다음에 줄어드는 법인세수를 적었는데, 두 숫자 사이의 빈칸은 일부러 비워 두었습니다. 정부가 채워야 할 칸이라는 뜻이었습니다.\n\n여당 의원들은 내부 총질이라고 했고, 기획재정부는 아무 말도 하지 않았습니다."
 tfrkphn.517.d:0 "임기 마지막 해에 한 방송이 유승민에게 홍준표 정부 4년의 점수를 물었습니다.\n\n유승민은 과목을 나눠 답했습니다. 전쟁을 치르고도 나라가 흔들리지 않았다면서 안보에는 합격점을 줬지만, 경제에는 절반만 줬습니다. 기업이 뛰게 한 것은 맞아도 재벌은 손대지 않고 넘어갔고, 그 숙제는 다음 정부로 넘어갔다는 이유였습니다.\n\n진행자가 경선 토론의 농담을 꺼내 경제부총리를 맡았다면 달랐겠느냐고 묻자, 유승민은 웃기만 하고 답하지 않았습니다.\n\n방송이 나간 밤에 대통령이 글을 올렸습니다. 유승민의 채점이 박하다고 쓰고는, 틀린 데는 없다는 말을 덧붙였습니다."
 tfrkphn.518.d:0 "법무부가 대통령에게 서류 한 묶음을 올렸는데, 전임 정부가 준비해 두고 떠난 사형 집행 명령서였습니다.\n\n홍준표는 오래전부터 사형을 집행하자고 말해 온 사람입니다. 2017년 대선 토론에서는 사형을 집행하지 않으니 흉악범이 날뛴다고 했고, 2021년 경선에서는 사형 집행 재개를 공약으로 걸었습니다. 그해 7월에 쓴 글에서는 해마다 사형을 집행하는 일본과 미국이 미개한 나라냐고 물으면서, 형이 확정되면 여섯 달 안에 집행하라는 것이 형사소송법인데 집행하지 않는 것은 법무부 장관의 직무유기라고 했습니다.\n\n그가 대통령이 된 뒤 법무부는 대상자 명단까지 추렸습니다. 그러나 곧 전쟁이 터졌고 전쟁이 끝난 뒤에는 수습이 먼저여서, 서류는 서명란이 빈 채로 다음 정부에 넘어왔습니다.\n\n대한민국은 1997년 12월 30일에 23명을 집행한 뒤로 한 사람도 집행하지 않았습니다.\n\n법무부의 보고는 간단했습니다. 온정주의 없는 법 집행을 내건 정부이니 서명만 하면 된다는 것이었습니다."
 tfrkphn.519.d:0 "서류는 하룻밤 동안 대통령의 책상 위에 놓여 있었습니다.\n\n대통령은 젊은 날 3년 동안 판사였습니다. 판사는 기록을 보고 판결하는데, 그 기록은 사람이 만드는 것이어서 틀린 데가 있기 마련입니다. 법복을 벗은 뒤에는 해고된 노동자들을 변호하면서, 법이 힘없는 사람 앞에서 얼마나 쉽게 틀리는지를 가까이에서 보았습니다.\n\n사형을 없애자는 것은 그의 오랜 생각이기도 했습니다. 2015년 7월에 유인태 의원이 여야 의원 172명의 서명을 받아 사형 폐지 특별법을 발의했는데, 유인태가 전한 바로는 발의한 뒤에 이인제가 찾아와 자신도 사형 폐지에 찬성하는데 왜 묻지 않았느냐고 했다고 합니다. 사형을 없애고 가석방 없는 종신형을 두자는 법안이었습니다.\n\n그가 말해 온 엄한 법은 정해진 벌을 끝까지 치르게 하고 돈과 자리로 형을 줄이는 일을 막자는 것이었습니다. 사형은 처음부터 거기에 들어 있지 않았는데, 판결이 틀렸을 때 나라가 돌려줄 수 있는 것이 하나도 없기 때문입니다.\n\n잘못된 판결은 재심으로 고칠 수 있지만 집행한 사형은 되돌릴 길이 없다는 생각을 그는 바꾸지 않았습니다.\n\n아침이 되었고, 법무부는 답을 기다리고 있습니다."
 tfrkphn.520.d_no:0 "대통령은 끝내 서명하지 않았습니다.\n\n그날 밤 홍준표 전 대통령이 글을 올려, 법에 있는 형벌을 집행하지 않는 것도 온정주의라고 썼습니다. 여섯 달 안에 집행하라는 조문이 지금도 살아 있는데 정부가 스스로 내건 말을 지키지 않는다는 것이었습니다.\n\n청와대는 그 글에 답하지 않았습니다."
 tfrkphn.520.d_yes:0 "대통령은 서명했습니다. 생각은 달라도 법이 살아 있는 동안에는 대통령도 그 법을 따라야 한다는 이유였고, 법무부는 곧바로 집행 날짜를 잡았습니다. 1997년 12월 뒤로 처음 있는 일입니다.\n\n그날 밤 홍준표 전 대통령이 글을 올렸습니다. 자신이 끝내지 못한 일을 후임자가 끝냈다고 쓰고는, 소신과 다른 서명을 하는 것이 쉬운 일은 아니라는 말을 붙였습니다.\n\n사형 폐지를 말해 온 단체들은 청와대 앞에 모였는데, 그 가운데에는 2015년에 폐지에 찬성한다던 사람이 서명했다고 적은 손팻말도 보였습니다."
 tfrkphn.521.d:0 "정치 명예혁명을 말하기에 앞서 대통령은 세 사람의 이름을 꺼냈는데, 그 첫 번째가 김영삼입니다.\n\n김영삼은 1927년 12월 20일 거제에서 태어나 1954년에 만 25세로 국회의원이 되었고, 이것은 최연소 당선이었습니다. 1979년에는 국회에서 제명되었으며 1983년에는 민주화를 요구하며 23일 동안 밥을 굶었습니다. 1990년에 3당 합당으로 여당에 들어간 그는 1993년에 대통령이 되어 군 안의 사조직 하나회를 걷어 냈고, 2015년 11월 22일에 세상을 떠났습니다.\n\n이인제는 1987년에 김영삼의 통일민주당에서 정치를 시작해 1993년에는 그의 정부에서 노동부 장관을 맡았습니다. 그러나 1997년에는 그의 당을 떠나 따로 대선에 나갔습니다.\n\n대통령이 김영삼에게서 물려받기로 한 것은 군이 정치에 손대지 못하게 한 일 하나입니다. 전쟁을 치르는 동안 군의 예산과 목소리가 함께 커졌기 때문에, 대통령은 장성 인사와 국방 예산을 국회의 심사 아래 두겠다고 밝혔습니다. 전쟁에서 이긴 군대는 목소리가 커지기 마련이라는 이유에서였습니다."
 tfrkphn.522.d:0 "두 번째 이름은 김대중입니다.\n\n김대중은 목포 앞바다 하의도에서 소작농의 아들로 태어났습니다. 1971년 대선에서 박정희에게 95만 표 차이로 졌고, 1973년에는 도쿄에서 중앙정보부 요원들에게 납치되었으며, 1980년에는 내란음모 혐의로 사형을 선고받았습니다. 대선에 네 번 나간 끝에 1997년에 당선되면서 정권이 야당으로 넘어갔습니다. 그의 정부는 외환위기를 빠르게 넘겼고 2000년 6월에는 남북 정상회담을 열었습니다. 그는 2009년 8월 18일에 세상을 떠났습니다.\n\n이인제는 1997년 대선에서 김대중과 맞섰지만, 이듬해에는 그의 당인 새정치국민회의에 들어갔습니다.\n\n대통령이 김대중에게서 물려받기로 한 것은 마주 앉는 일입니다. 김대중은 전쟁을 치른 상대와 정상회담을 연 사람이기 때문입니다. 대통령은 북쪽 정권에는 물러서지 않겠다고 하면서도, 통일은 결국 그 사람들과 함께 사는 일이니 북쪽 주민에게 건넬 말은 따로 준비하겠다고 밝혔습니다."
 tfrkphn.523.d:0 "세 번째 이름은 김종필입니다.\n\n김종필은 1926년 1월 7일 충남 부여에서 태어났습니다. 1961년 5.16에 앞장섰고 그해 6월에는 중앙정보부를 만들어 첫 부장이 되었습니다. 국무총리를 두 번 지냈는데, 1971년부터 1975년까지는 박정희 아래에서였고 1998년부터는 김대중 아래에서였습니다. 1990년에는 3당 합당에 들어갔고 1995년에는 자유민주연합을 만들었으며, 1997년 11월 3일에는 김대중과 후보 단일화에 합의했습니다. 2004년 총선에서 당이 무너지자 정계를 떠난 그는 2018년 6월 23일에 92세로 세상을 떠났습니다.\n\n이인제는 2002년에 김종필의 자유민주연합에 들어갔고, 그의 고향 논산은 부여 바로 옆입니다. 이로써 그는 세 사람의 당을 모두 거친 정치인이 되었습니다.\n\n대통령이 김종필에게서 물려받기로 한 것은 2인자에게 일을 맡기는 정치이고, 장관들과 임기를 함께하겠다는 약속도 그 연장에 있습니다. 버리기로 한 것은 한 사람이 한 지역을 쥐고 표를 흥정하던 방식입니다. 대통령은 충청의 표로 당선되었다는 말을 다시는 듣지 않겠다고 했습니다.\n\n세 사람의 시대를 끝내자는 것은 30년 전 이인제가 내건 구호였는데, 이제 그는 세 사람에게서 무엇을 물려받을지를 정했습니다."
 tfrkphn.524.story:0 "대전, 조달청 별관 3층.\n\n시화공단에서 금형 공장을 하는 김씨는 맨 뒷줄에 앉았다. 군이 전쟁 때 쓴 탄약 상자를 다시 채우는 사업이었고, 그 상자의 걸쇠를 찍는 금형이 잘하면 그의 몫이 될 수 있었다.\n\n설명회가 끝나자 복도에서 누가 명함을 내밀었는데, 회사 이름 밑에 고문이라고 적혀 있고 본인 말로는 예비역 대령이라고 했다.\n\n\"사장님, 이런 건 서류만 잘 낸다고 되는 게 아닙니다. 저희가 길을 좀 압니다. 낙찰가의 오 부만 자문료로 잡으시면 됩니다.\"\n\n김씨는 명함을 받아 주머니에 넣었지만 자문료는 견적서에 넣지 않았다.\n\n열흘 뒤에 나온 낙찰 결과에서 김씨의 공장은 이등이었고, 일등은 처음 듣는 회사였다. 박 반장이 주소를 찾아보니 오피스텔 7층인데 기계는 한 대도 없다고 했다.\n\n\"사장님, 여기는 뭘로 찍습니까?\"\n\n\"안 찍지. 받아서 넘기지.\"\n\n그 일감은 한 달 뒤에 정말로 김씨의 공장으로 왔다. 단가는 김씨가 써 낸 값보다 이 할이 낮았다.\n\n그날 저녁 공장 라디오에서 대통령의 목소리가 나왔다. 전쟁이 만든 돈이 정치로 흘러드는 길목을 막겠다는 말에 박 반장은 소리를 키웠지만, 김씨는 프레스를 세우지 않았다."
 tfrkphn.525.d:0 "1995년 노태우 전 대통령의 비자금 사건에서 수표를 바꿔치기한 돈세탁이 드러났지만, 그때는 돈세탁을 벌할 법이 없었습니다. 1997년에 정부가 자금세탁방지법을 준비했는데도 법은 2001년에야 만들어졌고, 금융정보분석원이 문을 연 것도 그해입니다.\n\n1997년 대선에 나선 이인제는 후보 등록을 하던 날 선거자금의 수입과 지출을 시민단체의 감시 아래 두겠다고 했습니다. 기성 정당들이 금권정치에 빠져 있다는 말도 그날 했습니다.\n\n그로부터 30년이 지났습니다. 전쟁은 군수 계약과 복구 사업이라는 큰돈을 만들었는데, 감사원의 보고로는 전쟁 동안 맺은 군수 계약의 절반 이상이 경쟁 없이 맺어졌습니다. 낙찰받은 회사들의 고문 명단에는 전역한 장성과 퇴직한 관료의 이름이 있었고, 그 회사들이 낸 후원금은 여야를 가리지 않았습니다.\n\n대통령은 길목을 계약과 사람과 정치자금, 세 곳으로 짚었습니다. 한꺼번에 막을 힘은 없으니 어디부터 막을지를 정해야 합니다."
 tfrkphn.526.d:0 "기획재정부가 전쟁 국채의 마지막 회차를 갚았다고 발표했는데, 약속한 기한을 넘기지 않은 상환이었습니다.\n\n대한민국은 전에도 큰 빚을 일찍 갚은 적이 있습니다. 1997년 11월 21일에 정부는 국제통화기금에 돈을 빌려 달라고 했고, 2001년 8월 23일에 마지막 돈을 갚았습니다. 빌린 돈은 195억 달러였으며 갚은 날은 약속한 날보다 3년쯤 빨랐습니다.\n\n1997년 12월, 대선에 나선 이인제는 300일 경제위기 극복대책을 내놓았습니다. 석 달 안에 위기에서 벗어나고 여섯 달 안에 안정을 찾아 열두 달 안에 제자리로 돌아간다는 계획이었지만, 그가 선거에서 지는 바람에 써 보지도 못했습니다.\n\n30년 뒤에 그는 다른 빚을 갚았습니다. 기자들 앞에 선 대통령은 길게 말하지 않고, 이 빚은 세금을 낸 국민이 갚았다고만 했습니다."
 tfrkphn.527.d:0 "약속한 기한이 지났는데도 전쟁 국채는 [?TFRKPHN_wd_left|0]이 남았습니다.\n\n기획재정부가 상환 일정을 다시 짜겠다고 발표하자 야당은 대통령이 스스로 건 약속을 스스로 어겼다고 했고, 채권 시장에서는 국채 금리가 올랐습니다.\n\n대통령은 변명하지 않고, 남은 빚은 다음 예산에 먼저 넣겠다고만 했습니다."
 tfrkphn.528.d:0 "법무부 장관이 백서를 들고 왔다. 표지에는 과제 열한 개가 적혀 있었는데, 맨 위가 재판 지연 해소였고 맨 아래가 사법, 검찰 신뢰 회복 선언이었으며 열한 줄 모두에 완료 도장이 찍혀 있었다.\n\n대통령은 백서를 넘기다 손을 멈췄다. 1993년에 그는 서울지검 강력부 검사였고, 그해 5월에는 슬롯머신 업자의 돈을 받은 혐의로 6공의 황태자라 불리던 박철언 의원을 구속했다. 마지막 재판에서 홍준표 검사는 태양에 가까이 날다 날개가 녹아 떨어진 이카로스에 피고인을 빗댔고, 대법원은 징역 1년 6개월을 확정했다.\n\n모래시계 검사라는 별명은 이 수사에서 나왔다. 그는 2년 뒤에 검찰을 떠나 이듬해 국회의원이 됐다.\n\n대통령이 다음 정부가 이걸 뒤집으면 어떻게 되느냐고 묻자, 장관은 시행령은 바꿀 수 있어도 법으로 올린 것은 못 바꾼다고 답했다. 법으로 올린 과제는 일곱 개였고, 대통령은 나머지 네 개도 올리라고 했다.\n\n장관이 나가자 대통령은 백서를 서랍에 넣었는데, 서랍 안쪽에는 30년 넘은 공소장 사본이 한 부 들어 있었다."
 tfrkphn.505.d:0 "대북 확성기가 시간 제한 없이 켜졌습니다.\n\n전방의 확성기는 이제 밤낮을 가리지 않고 방송합니다. 첫 소식은 중국이 양안전쟁에서 졌다는 것이었는데, 북쪽 주민들이 한 번도 제대로 들어 본 적이 없는 이야기입니다. 그 뒤로는 날씨와 장마당 쌀값, 먼저 내려온 사람들의 안부가 이어집니다.\n\n풍선도 올라갑니다. 전에 북쪽이 내려보낸 풍선에는 오물이 채워져 있었지만, 남쪽이 올려 보내는 풍선에는 전단과 라디오와 쌀이 가득 들어 있어서 하룻밤에 수백 개씩 휴전선을 넘습니다.\n\n지난주에는 공군 무인기 편대가 평양 방공망 가장자리까지 올라갔다가 돌아왔습니다. 북한군 레이더는 켜졌지만 미사일은 올라오지 않았고 전투기도 뜨지 않았는데, 합참은 그것이 연료가 없어서인지 명령이 없어서인지는 알 수 없다고 보고했습니다.\n\n어느 쪽이든 평양 사람들은 그날 밤 하늘에서 나는 소리를 들었고, 다음 날 아침 조선중앙방송은 그 일을 전하지 않았습니다."
 tfrkphn.506.d:0 "PDTO 회원국 외교장관들이 서울에서 두 문장짜리 공동성명을 냈습니다.\n\n회원국들은 한반도의 유일한 합법 정부가 대한민국이며 중국을 대표하는 정부는 타이베이의 중화민국이라고 확인했습니다. 신문들은 이 성명에 자유중국, 하나의 한국이라는 이름을 붙였고, 일본과 중화민국의 외교장관이 대한민국 외교부 장관과 나란히 서명했습니다.\n\n같은 날 국회에서는 더불어민주당의 친이재명계 의원들이 기자회견을 열어, 정부가 남의 나라 정통성 문제에 도장을 찍는 바람에 베이징과는 앞으로 수십 년 동안 마주 앉지 못하게 됐다고 비판했습니다. 하나의 한국이라는 말은 북쪽에 흡수하겠다는 통보로 들릴 것이라고 했고, 전쟁을 끝낸 지 몇 해 만에 다음 전쟁의 명분을 문서로 만들었다는 말까지 나왔습니다.\n\n여당은 동맹국이 통일을 받아들였다는 뜻이라고 맞받았습니다.\n\n베이징은 그날 밤 극한 수위의 성명을 냈습니다. 중국 외교부는 서명한 나라들이 불장난의 값을 치를 것이라고 하면서 대한민국과 일본과 타이베이 당국의 이름을 하나씩 적었고, 인민해방군 동부전구는 같은 시각에 훈련 영상을 공개했습니다."
 tfrkphn.507.d:0 "정부가 통일 기금에 넣을 돈으로 통일세를 걷겠다고 발표했습니다. 소득세와 법인세에 일정 비율을 얹는 방식입니다.\n\n통일세라는 말은 2010년 8월 15일 이명박 대통령의 광복절 경축사에 처음 나왔지만, 그때는 반대가 커서 세금으로 만들어지지 못했습니다.\n\n이번에도 반응은 빨랐습니다. 납세자 단체는 전쟁 때 오른 세금도 아직 그대로라는 성명을 냈고, 광화문에는 주말마다 세금 고지서를 든 사람들이 모였습니다. 자영업자 단체가 통일은 찬성하지만 청구서는 반대한다는 현수막을 거는 동안, 시민단체들은 걷은 돈을 어디에 쓸지부터 밝히라고 요구했습니다.\n\n우려는 여당 안에서도 나왔습니다. 수도권 의원 스무 명이 원내대표를 찾아가 다음 선거를 세금 고지서와 함께 치를 수는 없다고 했고, 기획재정부 장관은 국무회의에서 세율을 절반으로 낮춘 안도 준비해 두었다고 보고했습니다."
 tfrkphn.471.d:0 "국군 선두 부대가 대동강을 건넜습니다.\n\n평양 시내에는 총소리가 드물었고 김일성광장의 주석단은 비어 있었습니다. 만수대 언덕의 동상 앞에 이북5도위원회 깃발을 든 병사 몇이 서 있는 동안, 사람들은 아파트 창문으로 내다보기만 할 뿐 거리로 나온 이는 적었습니다.\n\n국군은 1950년 10월 19일에도 평양에 들어갔지만 그해 12월에 물러났습니다. 오늘 들어간 부대는 평양역에 보급소를 차리고 대동강 다리마다 초소를 세웠습니다."
 tfrkphn.472.d:0 "이북5도위원회가 평양에서 마지막 회의를 열었습니다.\n\n안건은 위원회가 다스리던 땅과 군대를 대한민국 정부에 넘기는 안 하나였고, 반대는 없었습니다. 위원들은 회의록에 서명한 다음 깃발을 내렸습니다.\n\n이북5도위원회는 1949년에 생긴 기구로, 대통령이 북쪽 다섯 도의 도지사를 임명해 두는 곳이었습니다. 그 도지사들은 70년 넘게 자기 도에 한 번도 가 보지 못했는데, 오늘 임명된 도지사 다섯은 내일 아침 임지로 떠납니다."
 tfrkphn.473.d:0 "정부가 대한민국 헌법이 한반도 전역에 시행된다고 공포했습니다.\n\n이인제 대통령이 판문점에서 공포문에 서명하자 군사분계선 표지판이 그날 오후부터 뽑히기 시작했습니다. 1953년에 세운 표지판은 1,292개였지만 남아 있는 것은 그보다 훨씬 적었습니다.\n\n서울역 전광판에는 평양행 열차 시간표가 올라왔고, 첫 열차는 다음 달로 잡혔습니다. 북쪽의 주민등록과 화폐, 학교와 병원이 내일부터 정부의 일이 되기 때문에 행정안전부는 공무원 3천 명을 먼저 올려 보내기로 했습니다."
 tfrkphn.491.story:0 "강원도 철원, 전방 사단의 탄약고 앞. 새벽 네 시.\n\n김지원 하사는 분대원 아홉 명을 한 줄로 세웠다. 일병 때 계룡대 연병장에서 대통령의 사열을 받았던 그녀는 전역할 날짜가 지나고도 군복을 벗지 않았고, 지난봄에 하사 계급장을 달았다.\n\n탄약고 문이 열리고 병사들 앞에 실탄 상자가 하나씩 놓였다. 훈련 때는 탄피 개수까지 세어 반납했는데 오늘은 반납 장부가 아예 없었다.\n\n\"분대장님, 이거 진짜 나가는 겁니까.\"\n\n\"모른다. 준비하라는 명령만 받았다.\"\n\n옆 막사는 동원된 예비군으로 찼다. 마흔 가까운 사람들이 군복 단추를 잠그면서 휴대폰으로 아이 사진을 들여다보고 있었는데, 그 가운데 하나가 지원에게 물었다.\n\n\"하사님은 왜 안 나가고 남았습니까. 안 와도 되는 군대인데.\"\n\n지원은 탄창에 탄을 끼우던 손을 멈추지 않고 대답했다.\n\n\"똑같이 받으려고 왔습니다. 받을 때만 똑같으면 안 되잖습니까.\"\n\n날이 밝자 북쪽 능선이 드러났다. 능선 너머는 조용했고, 분대원들은 그쪽을 쳐다보지 않은 채 탄창을 채웠다."
 tfrkphn.490.story:0 "평안북도 초산, 압록강변.\n\n오후 두 시가 조금 지나 김지원 하사의 분대가 선두로 강가에 닿았다. 강은 생각보다 좁아서 건너편 둑의 중국군 초소가 훤히 보였다.\n\n1950년 10월 26일 오후 2시 15분에도 국군은 이 강에 닿았다. 6사단 7연대 1대대 1중대였고, 중대장은 이승만 대통령에게 보낼 물을 수통에 담았지만 그 부대는 이틀 뒤에 후퇴 명령을 받았다.\n\n대대장이 무전으로 물었다.\n\n\"강물 떴나.\"\n\n\"아직입니다.\"\n\n\"떠라. 수통 하나는 청와대로 보낸다.\"\n\n지원은 군화를 벗지 않고 물가로 내려가 수통을 물에 눕혔다. 차가운 물에서 흙냄새가 났다. 수통이 차자 그녀는 마개를 잠그고 겉에 날짜를 적었다.\n\n옆에서 지켜보던 상병이 물었다.\n\n\"분대장님, 이번에는 이틀 뒤에 안 물러납니까.\"\n\n지원이 건너편 초소를 보니 그쪽 병사도 이쪽을 보고 있었는데, 양쪽 다 총은 들지 않았다.\n\n\"모른다. 그래서 수통을 두 개 떴다. 하나는 내가 가진다.\""
 tfrkphn.492.story:0 "정부서울청사 별관, 북부 행정요원 발대식.\n\n강당에 삼천 명이 앉았다. 북쪽 읍면동에 먼저 올라갈 공무원들로, 절반은 현직이고 나머지 절반은 이번에 새로 뽑힌 사람들이었는데 제대군인은 가산점을 받았다.\n\n지난달에 전역한 김지원이 군복 대신 받은 것은 회색 점퍼와 발령장 한 장이었다. 발령지 칸에는 평안북도 초산군이라고 적혀 있었다.\n\n\"초산이면 압록강 바로 옆인데. 괜찮겠어요?\"\n\n옆자리에서 팀장 명찰을 단 남자가 발령장을 넘겨다보며 말했다. 지원은 그 얼굴을 한참 들여다보았다.\n\n\"혹시 노량진 독서실 다니셨습니까.\"\n\n남자가 눈을 크게 떴다. 그해 9급에 붙어 지금은 7급이 된 이준호였다.\n\n\"그때 그 일병. 가산점 받는다고 좋아하던.\"\n\n\"받았습니다. 이번에.\"\n\n\"나도 그걸로 붙었어요. 초산은 우리 팀입니다.\"\n\n버스는 다음 날 새벽에 떠났다. 지원의 배낭 옆주머니에는 마개 옆에 날짜를 적은 수통이 하나 들어 있었고, 초산 읍사무소에 닿으면 그녀는 그 물을 강에 도로 부을 생각이었다."
 tfrkphn.467.d0:0 "여의도, 국회 본회의장 방청석.\n\n마지막 법안의 표결 결과가 전광판에 떴을 때 유승민은 방청석 맨 뒷줄에 앉아 있었다. 의원 배지를 뗀 지도 여러 해였다. 아래층 의석에서 박수가 나왔지만 그는 박수를 치는 대신 찬성 숫자를 끝까지 읽고 나서야 자리에서 일어났다.\n\n복도는 조용했다. 네 번의 임기 동안 걸었던 복도였고, 2015년 봄에는 원내대표로 저 아래 연단에 서기도 했다. 그날 그는 증세 없는 복지는 허구라고 말했고 재벌도 개혁에 동참해야 한다고 말했는데, 석 달 뒤에는 원내대표에서 물러나야 했다.\n\n2017년 2월에는 기자들 앞에서 재벌개혁 공약을 읽었다. 전속고발권 폐지, 집단소송제, 징벌적 손해배상, 총수 일가의 개인회사 금지. 석 달 뒤에 받은 표는 6.8퍼센트였고, 공약집은 서재 책장 맨 아래 칸으로 내려갔다. 그 뒤로 당이 여러 번 바뀌는 동안에도 공약집은 그 자리에 그대로 있었다.\n\n그는 한국개발연구원에서 13년을 일한 경제학자였다. 숫자가 맞아야 정책이 선다고 배운 사람이었는데, 정치에 와서는 맞는 숫자를 들고도 표를 얻지 못한 일이 여러 번이었다. 이인제 대통령이 집무실로 불렀을 때 그가 가방에 넣고 간 것이 바로 그 공약집이었고, 대통령은 그 서류를 끝까지 읽었다.\n\n오늘 통과된 여덟 법안은 그 공약집과 뼈대가 같았고, 재계와 타협해 고친 줄은 하나도 없었다. 경제 단체들이 세 번 성명을 냈지만 표결은 세 번 다 예정대로 열렸다.\n\n주차장에서 그는 휴대폰을 꺼내 그때 공약집을 같이 썼던 사람에게 문자를 보냈다. 답은 금방 왔다. 오래 걸렸네요.\n\n그는 휴대폰을 주머니에 넣고 시동을 걸었다."
