 TFRKPHN_cab_ttd_ahn_duk_geun:0 "출생: 1968년 대한민국 대구광역시\n\n이력: 대한민국의 산업통상자원부 장관\n안덕근은 통상을 연구한 학자입니다. KDI 국제정책대학원을 거쳐 2005년 서울대학교 국제대학원 교수가 되었습니다. 2022년 5월 통상교섭본부장에 임명되었습니다. 2024년 1월 산업통상자원부 장관이 되었습니다.\n\n통상 협상을 직접 이끈 사람입니다. 미국이 무너진 뒤 무역의 규칙은 새로 써야 했습니다.\n\n§Y어록§!\n\"한국은 보호무역을 통한 시장 확보가 어려운 만큼 글로벌 통상연대를 강화해 나갈 예정\"\n§g최종현학술원 컨퍼런스§!"
 TFRKPHN_cab_ttd_bang_ha_nam:0 "출생: 1957년 대한민국 전라남도 완도\n\n이력: 대한민국의 고용노동부 장관\n방하남은 한국노동연구원에서 일한 연구자입니다. 2012년 한국연금학회 회장을 지냈습니다. 2013년 3월부터 2014년 7월까지 고용노동부 장관으로 일했습니다. 2015년에는 한국노동연구원 원장이 되었습니다.\n\n일자리와 연금을 연구한 학자입니다. 대통령은 고용보험을 다시 설계할 사람으로 그를 떠올렸습니다.\n\n§Y어록§!\n\"새 정부가 국민행복, 희망의 새 시대를 열기 위해 고용률 70% 달성, 중산층 70% 복원을 약속했다\"\n§g고용노동부 장관 취임식§!"
 TFRKPHN_cab_ttd_bang_moon_kyu:0 "출생: 1962년 대한민국 경기도 수원\n\n이력: 대한민국의 산업통상자원부 장관\n방문규는 1984년 행정고시에 합격했습니다. 기획재정부 예산실장과 제2차관, 보건복지부 차관을 지냈습니다. 2019년 한국수출입은행장이 되었습니다. 이후 국무조정실장을 거쳐 2023년 산업통상자원부 장관에 임명되었습니다.\n\n예산과 수출 금융을 모두 다뤄 본 관료입니다. 대통령은 전쟁 빚을 갚으면서 수출도 늘려야 했습니다.\n\n§Y어록§!\n\"우리 경제의 혁신성장을 선도해 나가겠다\"\n§g수출입은행장 취임식§!"
 TFRKPHN_cab_ttd_cho_tae_yong:0 "출생: 1956년 대한민국 서울특별시\n\n이력: 대한민국의 국가안보실장\n조태용은 정통 외교관입니다. 외교부 제1차관과 국가안보실 제1차장을 지냈습니다. 주미국 대사도 지냈고, 대미 관계와 대북 안보 양쪽에서 일했습니다.\n\n미국이 무너진 뒤 대한민국 외교는 기댈 곳을 잃었습니다. 이인제 대통령은 외교와 안보를 함께 다뤄 본 사람을 곁에 두기로 했습니다. 첫 숙제는 PDTO 동맹국과의 공조입니다. 주변국이 한반도 통일을 받아들이게 만드는 일은 그 뒤에 기다리고 있습니다.\n\n§Y어록§!\n\"문제를 삼는다면 북한만 문제 삼겠죠.\"\n§g머니투데이 전화 인터뷰§!"
 TFRKPHN_cab_ttd_chun_young_woo:0 "출생: 1952년 대한민국 경상남도 밀양\n\n이력: 대한민국의 국가안보실장\n천영우는 2006년부터 북핵 6자회담 수석대표와 한반도평화교섭본부장을 맡았습니다. 이후 주영국 대사와 외교통상부 제2차관을 지냈습니다. 2010년부터 2013년까지 대통령실 외교안보수석비서관으로 일했습니다.\n\n북한과 직접 마주 앉아 본 협상가입니다. 이인제 대통령은 북한 체제를 바꾸겠다고 약속했고, 그 상대를 아는 사람이 필요했습니다.\n\n§Y어록§!\n\"북한은 정권이 무너지기 전에 핵을 포기할 것이다.\"\n§g세계일보 인터뷰§!"
 TFRKPHN_cab_ttd_chung_hwang_keun:0 "출생: 1960년 대한민국 충청남도 천안\n\n이력: 대한민국의 농림축산식품부 장관\n정황근은 농정 관료입니다. 2013년 대통령비서실 농축산식품비서관을 지냈습니다. 2016년 농촌진흥청장이 되었고, 2022년 5월 농림축산식품부 장관에 올랐습니다.\n\n농촌진흥청과 농식품부를 모두 이끌어 본 사람입니다. 대통령은 전쟁 뒤의 농정을 처음부터 가르칠 시간이 없었습니다. 천안 출신이라는 점도 대통령의 눈에 들었습니다.\n\n§Y어록§!\n\"전북은 전통적인 농도입니다.\"\n§g전북일보 인터뷰§!"
 TFRKPHN_cab_ttd_hong_yong_pyo:0 "출생: 1964년 대한민국 서울특별시\n\n이력: 대한민국의 통일부 장관\n홍용표는 통일연구원 연구위원을 거쳐 2001년 한양대학교 교수가 되었습니다. 2013년 대통령비서실 통일비서관으로 들어갔습니다. 2015년 3월부터 2017년 7월까지 통일부 장관을 지냈습니다.\n\n청와대와 통일부를 모두 겪은 사람입니다. 이인제 대통령은 통일 정책을 부처 사이에서 조율할 장관을 원했습니다.\n\n§Y어록§!\n\"이제 광복 70년을 맞아 한강의 기적을 넘어 한반도의 기적을 만들어야 할 때\"\n§g통일박람회 개막사§!"
 TFRKPHN_cab_ttd_jang_ho_jin:0 "출생: 1961년 대한민국 서울특별시\n\n이력: 대한민국의 국가안보실장\n장호진은 직업 외교관입니다. 2008년 외교통상부 북미국장, 2010년 주캄보디아 대사를 지냈습니다. 2012년에는 대통령비서실 외교비서관으로 일했습니다. 2022년 주러시아 대사, 2023년 외교부 제1차관을 거쳐 2024년 1월 국가안보실장에 올랐습니다.\n\n이 자리를 이미 해 본 사람입니다. 이인제 대통령은 인수인계가 필요 없는 실장을 원했습니다.\n\n§Y어록§!\n\"러시아 측이 하기 나름이라는 것을 강조하고 싶다\"\n§gKBS 일요진단§!"
 TFRKPHN_cab_ttd_jeong_jeom_sig:0 "출생: 1965년 대한민국 경상남도 진주\n\n이력: 대한민국의 법무부 장관\n정점식은 1988년 제30회 사법시험에 합격해 검사가 되었습니다. 대검찰청 공안부장을 지내고 2017년 검찰을 떠났습니다. 2019년 경남 통영 고성에서 국회의원에 당선되어 3선을 했습니다.\n\n공안 검사 출신입니다. 북한 체제를 흔들겠다는 정부에서 공안은 다시 무거운 말이 되었습니다.\n\n§Y어록§!\n\"우리 당의 분열을 막기 위해 제가 사퇴하는 게 맞다는 생각을 가졌다\"\n§g국회 기자회견§!"
 TFRKPHN_cab_ttd_jo_gun_shik:0 "출생: 1952년 대한민국 서울특별시\n\n이력: 대한민국의 통일부 장관\n조건식은 통일원에서 교류협력국장을 지냈습니다. 1997년 대통령비서실 통일비서관으로 일했습니다. 2003년부터 이듬해까지 통일부 차관을 맡았습니다. 2008년 현대아산 대표이사가 되었습니다.\n\n관료였고 대북 사업을 하는 기업의 대표였습니다. 이인제 대통령은 통일은 경제라고 말해 왔습니다.\n\n§Y어록§!\n\"중요한 것은 현대아산이라는 배를 먼저 살려야 하는 것\"\n§g현대아산 기자 간담회§!"
 TFRKPHN_cab_ttd_joo_hyung_hwan:0 "출생: 1961년 대한민국 서울특별시\n\n이력: 대한민국의 산업통상자원부 장관\n주형환은 1982년 제26회 행정고시에 합격했습니다. 2014년 기획재정부 제1차관을 지냈습니다. 2016년 산업통상자원부 장관에 임명되어 2017년 7월까지 일했습니다. 2024년에는 대통령 직속 저출산고령사회위원회 부위원장이 되었습니다.\n\n경제 부처와 산업 부처를 모두 겪은 관료입니다. 이인제 대통령은 기업하기 좋은 나라를 약속했습니다.\n\n§Y어록§!\n\"지금 추세라면 12월 수출도 플러스를 유지할 것으로 보인다\"\n§g세종시 기자 간담회§!"
 TFRKPHN_cab_ttd_kim_do_eup:0 "출생: 1964년 대한민국 부산광역시\n\n이력: 대한민국의 법무부 장관\n김도읍은 1996년부터 2011년까지 검사로 일했습니다. 부산지검 공판부장과 외사부장을 지냈습니다. 2012년 부산에서 제19대 국회의원에 당선된 뒤 네 번 당선되었습니다. 2022년 7월부터 2024년 5월까지 국회 법제사법위원장을 맡았습니다.\n\n법사위원장을 지낸 4선 의원입니다. 대통령이 내놓을 법안은 모두 법사위를 지나야 합니다.\n\n§Y어록§!\n\"이제 대답도 안하십니까\"\n§g국회 법제사법위원회§!"
 TFRKPHN_cab_ttd_kim_gi_woong:0 "출생: 1961년 대한민국 인천광역시\n\n이력: 대한민국의 통일부 장관\n김기웅은 1990년 국토통일원에 특채로 들어왔습니다. 통일부에서 남북회담 업무를 오래 맡았고 남북회담본부장을 지냈습니다. 2022년 대통령비서실 통일비서관을 거쳐 통일부 차관이 되었습니다. 2024년 대구 중구 남구에서 제22대 국회의원에 당선되었습니다.\n\n남북회담 실무를 오래 맡은 관료입니다. 대통령은 회담의 기술을 아는 장관을 원했습니다.\n\n§Y어록§!\n\"같은 합의를 50년째 되풀이하고 있어요.\"\n§g국회 외교통일위원회§!"
 TFRKPHN_cab_ttd_kim_tae_heum:0 "출생: 1962년 대한민국 충청남도 보령\n\n이력: 대한민국의 농림축산식품부 장관\n김태흠은 국회의원 보좌관으로 정치를 시작했습니다. 김종필 국무총리 시절 총리실에서 정책담당관과 공보과장으로 일했습니다. 이완구 충남지사 아래에서는 정무부지사를 맡아 2006년 금산세계인삼엑스포를 치렀습니다. 제19대 총선부터 충남 보령 서천에서 내리 세 번 당선되었습니다. 당 최고위원과 국회 농림축산식품해양수산위원장을 지냈습니다. 2021년 원내대표 경선에서는 김기현에게 네 표 차이로 뒤져 2위를 했습니다.\n\n이인제 대통령은 농촌을 지역구로 둔 사람에게 농정을 맡겼습니다. 김태흠은 국회에서 농림축산식품해양수산위원회를 이끌었습니다. 전쟁을 치르며 흔들린 먹거리 수급이 그의 손에 넘어왔습니다.\n\n§Y어록§!\n\"그에 맞서기 위해서는 투쟁력 있고 결기 있는 원내대표가 필요하다\"\n§g원내대표 출마 선언§!"
 TFRKPHN_cab_ttd_kim_yung_ho:0 "출생: 1959년 대한민국 경상남도 진주\n\n이력: 대한민국의 통일부 장관\n김영호는 정치학자입니다. 1999년부터 성신여자대학교 정치외교학과 교수로 일했습니다. 2011년 대통령실 통일비서관을 지냈습니다. 2023년 7월 통일부 장관에 임명되었습니다.\n\n대통령실에서 통일 정책을 다뤄 본 학자입니다. 이인제 대통령은 북한 체제의 근본 변화를 약속했고, 그 일을 맡길 장관이 필요했습니다.\n\n§Y어록§!\n\"그렇기 때문에 인권과 안보 문제는 분리될 수 없다\"\n§g데일리안 인터뷰§!"
 TFRKPHN_cab_ttd_kwon_ki_seop:0 "출생: 1969년 대한민국 경상북도 예천\n\n이력: 대한민국의 고용노동부 장관\n권기섭은 1992년 제36회 행정고시에 합격해 이듬해 노동부에서 공직을 시작했습니다. 2021년 노동정책실장과 산업안전보건본부장을 맡았습니다. 2022년 고용노동부 차관이 되었고, 2024년 경제사회노동위원회 위원장에 올랐습니다.\n\n노동부에서 30년을 일한 관료입니다. 대통령이 장관이던 시절에 그는 갓 들어온 사무관이었습니다.\n\n§Y어록§!\n\"하루빨리 현장의 위험요인을 살펴 선제적으로 안전보건관리체계를 개선해야 한다\"\n§g고용노동부 발표§!"
 TFRKPHN_cab_ttd_lee_chang_yang:0 "출생: 1962년 대한민국 경상남도 고성\n\n이력: 대한민국의 산업통상자원부 장관\n이창양은 1985년 제29회 행정고시에 합격해 상공부에서 일했습니다. 2000년 KAIST 경영대학 교수가 되었습니다. 2022년 5월부터 2023년 9월까지 산업통상자원부 장관을 지냈습니다.\n\n관료로 시작해 기술 경영을 가르친 교수입니다. 이인제 대통령은 벤처 대국을 말해 왔습니다.\n\n§Y어록§!\n\"진정한 혁신성장이 절실하다\"\n§g한국경제신문 칼럼§!"
 TFRKPHN_cab_ttd_lee_do_hoon:0 "출생: 1962년 대한민국 부산광역시\n\n이력: 대한민국의 국가안보실장\n이도훈은 1985년 외무고시 19회로 외교관이 되었습니다. 2012년부터 2년간 외교부 북핵외교기획단장을 맡았습니다. 2016년 청와대 외교비서관, 2022년 외교부 제2차관을 지냈습니다. 2023년 7월 주러시아 대사로 나갔습니다.\n\n북핵과 러시아를 함께 다뤄 본 외교관입니다. 미국이 무너진 뒤 북쪽 국경 너머를 읽는 일이 더 중요해졌습니다.\n\n§Y어록§!\n\"비핵화 협상의 기본적인 해결책은 제재가 아니다\"\n§g연세대 김대중도서관 세미나§!"
 TFRKPHN_cab_ttd_lee_dong_phil:0 "출생: 1955년 대한민국 경상북도 의성\n\n이력: 대한민국의 농림축산식품부 장관\n이동필은 1980년 한국농촌경제연구원에 들어가 2011년 원장이 되었습니다. 2013년부터 2016년까지 농림축산식품부 장관을 지냈습니다. 2018년부터는 경상북도지사의 농촌살리기 정책자문관으로 일했습니다.\n\n농촌을 연구했고 장관도 해 본 사람입니다. 대통령은 농민 단체와 말이 통할 장관을 원했습니다.\n\n§Y어록§!\n\"예산은 아쉽지만 알뜰하게 쓰겠다.\"\n§g이투데이 인터뷰§!"
 TFRKPHN_cab_ttd_lee_jung_sik:0 "출생: 1961년 대한민국 충청북도 제천\n\n이력: 대한민국의 고용노동부 장관\n이정식은 서울대학교 경제학과를 나왔습니다. 1986년 한국노동조합총연맹에 들어가 30년 넘게 일했습니다. 조사부장, 기획조정국장, 정책본부장을 거쳐 사무처장에 올랐습니다. 2004년부터 2년간 건설교통부 장관 정책보좌관을 지냈습니다. 2012년에는 최저임금위원회 근로자위원을 맡았습니다. 2017년에는 노동계 출신으로는 처음으로 노사발전재단 사무총장이 되었습니다.\n\n노동부 장관을 지낸 대통령이 노동계에서 30년을 보낸 사람을 불렀습니다. 이정식은 노동계의 말과 경영계의 말을 모두 알아듣습니다. 대통령이 그에게 바라는 것은 노사가 한 탁자에 다시 앉는 일입니다.\n\n§Y어록§!\n\"노사관계는 국가의 미래다.\"\n§g뉴스토마토 인터뷰§!"
 TFRKPHN_cab_ttd_lee_ki_kweon:0 "출생: 1957년 대한민국 전라남도 함평\n\n이력: 대한민국의 고용노동부 장관\n이기권은 1981년 제25회 행정고시에 합격했습니다. 2011년 고용노동부 차관을 지냈고, 2012년 한국기술교육대학교 총장이 되었습니다. 2014년 7월부터 2017년 7월까지 고용노동부 장관으로 일했습니다.\n\n장관을 3년 한 사람입니다. 이인제 대통령은 그 경험을 노동개혁에 다시 쓰려 했습니다.\n\n§Y어록§!\n\"특히 노동시장 구조개선은 반드시 금년 중 확실한 토대를 갖춰야 한다\"\n§g정부세종청사 기자 간담§!"
 TFRKPHN_cab_ttd_lee_noh_kong:0 "출생: 1969년 대한민국 인천광역시\n\n이력: 대한민국의 법무부 장관\n이노공은 1994년 제36회 사법시험에 합격했습니다. 2018년 7월 서울중앙지방검찰청 제4차장검사가 되었습니다. 여성으로는 처음이었습니다. 2019년 수원지방검찰청 성남지청장을 지냈습니다. 2022년 5월 법무부 차관에 임명되어 2024년 1월까지 일했습니다.\n\n법무부 살림을 차관으로 2년 가까이 맡아 본 사람입니다. 이인제 대통령은 부처를 조용히 굴릴 장관을 원했습니다.\n\n§Y어록§!\n\"공정과 상식에 기반한 법무행정을 위해 노력을 다하겠다\"\n§g법무부 차관 취임사§!"
 TFRKPHN_cab_ttd_lee_yang_soo:0 "출생: 1967년 대한민국 강원도 속초\n\n이력: 대한민국의 농림축산식품부 장관\n이양수는 2016년 강원 속초 고성 양양에서 제20대 국회의원에 당선되어 내리 세 번 당선되었습니다. 국회 농림축산식품해양수산위원회에서 간사를 맡았습니다. 국민의힘 원내수석부대표를 지냈고, 2024년 12월 사무총장이 되었습니다.\n\n국회 농해수위에서 오래 일한 의원입니다. 대통령은 농정 예산을 국회에서 따낼 사람을 골랐습니다.\n\n§Y어록§!\n\"여당이 타작물 재배 예산을 획기적으로 확대하는 등의 대안을 제시했다\"\n§g국회 기자회견§!"
 TFRKPHN_cab_ttd_lim_i_ja:0 "출생: 1964년 대한민국 경상북도 예천\n\n이력: 대한민국의 고용노동부 장관\n임이자는 노동운동가 출신 정치인입니다. 한국노동조합총연맹 경기본부 상임부의장을 지냈고, 2014년 한국노총 부위원장이 되었습니다. 중앙노동위원회 근로자위원으로도 일했습니다. 2016년 제20대 국회에 비례대표로 들어왔고, 이후 경북 상주 문경에서 두 번 더 당선되었습니다.\n\n노동계 출신이면서 보수 정당의 3선 의원입니다. 이인제 대통령은 노동개혁 법안을 국회에서 통과시킬 장관을 찾았습니다.\n\n§Y어록§!\n\"민주노총은 현 체제를 인정하지 않고 있어요.\"\n§g한경비즈니스 인터뷰§!"
 TFRKPHN_cab_ttd_park_cheol_hee:0 "출생: 1963년 대한민국 충청북도 충주\n\n이력: 대한민국의 국가안보실장\n박철희는 일본 정치를 연구한 학자입니다. 서울대학교 국제대학원 교수로 일하며 일본연구소장과 국제대학원장을 맡았습니다. 대통령직 인수위원회 외교안보분과 전문위원과 국립외교원장을 지냈습니다. 2024년 주일본 대사에 임명되었습니다.\n\n충주 사람입니다. 이인제 대통령은 PDTO의 동맹국 일본을 연구해 온 학자를 곁에 두려 했습니다.\n\n§Y어록§!\n\"한일 관계는 지뢰밭 같다.\"\n§g서울신문 칼럼§!"
 TFRKPHN_cab_ttd_ryoo_kihl_jae:0 "출생: 1959년 대한민국 서울특별시\n\n이력: 대한민국의 통일부 장관\n류길재는 1987년 경남대학교 극동문제연구소에서 연구를 시작했습니다. 1998년 북한대학원 교수가 되었습니다. 2013년 3월 통일부 장관에 임명되었습니다.\n\n북한을 오래 연구한 학자입니다. 대통령은 통일 뒤 북한 주민의 삶을 설계할 사람으로 그를 골랐습니다.\n\n§Y어록§!\n\"작년부터 북한이 하는 걸 보면 이 사람들하고 신뢰가 쌓일 수 있을까하는 생각이 든다\"\n§g기자 간담회§!"
 TFRKPHN_cab_ttd_shim_woo_jung:0 "출생: 1971년 대한민국 충청남도 공주\n\n이력: 대한민국의 법무부 장관\n심우정은 1994년 사법시험에 합격했습니다. 2021년 서울동부지검장, 2022년 인천지검장을 지냈습니다. 2023년 대검찰청 차장검사, 2024년 법무부 차관을 거쳐 그해 9월 검찰총장이 되었습니다. 심대평 전 충남지사의 아들로 알려져 있습니다.\n\n공주 사람이고 검찰의 꼭대기까지 올라간 검사입니다. 대통령은 충청 출신 법조인을 눈여겨봤습니다.\n\n§Y어록§!\n\"우리 검찰은 민생범죄로부터 국민을 지키는데 온 힘을 다해야 할 것\"\n§g검찰총장 취임사§!"
 TFRKPHN_cab_ttd_song_mi_ryung:0 "출생: 1967년 대한민국 충청남도 논산\n\n이력: 대한민국의 농림축산식품부 장관\n송미령은 1997년부터 한국농촌경제연구원에서 일했습니다. 농촌정책연구부장과 기획조정실장, 부원장을 거쳤습니다. 2023년 12월 농림축산식품부 장관에 임명되었습니다.\n\n대통령과 같은 논산 사람입니다. 농촌을 숫자로 들여다본 연구자이기도 합니다. 이인제 대통령은 농촌에 사람이 줄어드는 문제를 그에게 물었습니다.\n\n§Y어록§!\n\"정부가 청년들이 농촌에 정착할 수 있는 인프라를 마련해줘야 한다\"\n§g더나은미래 기사§!"
 TFRKPHN_cab_ttd_yoo_sang_bum:0 "출생: 1966년 대한민국 강원도 영월\n\n이력: 대한민국의 법무부 장관\n유상범은 1989년 제31회 사법시험에 합격했습니다. 1992년 검사로 임용되었습니다. 2015년 창원지방검찰청 검사장이 되었고, 2017년 광주고등검찰청 차장검사를 끝으로 검찰을 떠났습니다. 2020년 제21대 국회의원에 당선되었고 2024년 재선했습니다.\n\n검사장을 지낸 재선 의원입니다. 대통령은 검찰과 국회 양쪽에 말이 통하는 사람을 찾았습니다.\n\n§Y어록§!\n\"장관이 청와대 대변인이냐\"\n§g국회 법제사법위원회§!"
 TFRKPHN_cab_ttd_yoon_sang_jick:0 "출생: 1956년 대한민국 경상북도 경산\n\n이력: 대한민국의 산업통상자원부 장관\n윤상직은 1982년 제25회 행정고시에 합격했습니다. 2011년 지식경제부 제1차관이 되었습니다. 2013년부터 2016년까지 산업통상자원부 장관을 지냈습니다. 2016년 부산 기장에서 제20대 국회의원에 당선되었습니다.\n\n장관을 3년 하고 국회의원도 한 사람입니다. 대통령은 공장을 다시 짓는 일을 그에게 맡기려 했습니다.\n\n§Y어록§!\n\"기업이 없으면 노조도 없다\"\n§g수출 부진업종 긴급 점검회의§!"
 TFRKPHN_cab_ttd_yoon_suk_yeol:0 "출생: 1960년 대한민국 서울특별시\n\n이력: 대한민국의 법무부 장관\n윤석열은 1991년 제33회 사법시험에 합격했습니다. 2013년 국가정보원 여론 조작 사건 특별수사팀장을 맡았습니다. 2016년에는 특검 수사팀장으로 일했습니다. 2017년 서울중앙지검장, 2019년 7월 검찰총장에 올랐습니다. 2021년 3월 총장직에서 물러났고, 그해 7월 국민의힘에 입당했습니다.\n\n2021년 경선에서 홍준표에게 패했습니다. 정치를 시작한 지 넉 달 된 신인이었습니다. 모두에게 잊혀진 뒤에는 찾는 사람이 없었고, 그는 잊힌 채 지냈습니다. 법무부 장관 자리가 끝내 비자 그의 이름이 다시 나왔습니다. 문재인 정부에서 검찰총장을 지낸 이력 때문이었습니다.\n\n§Y어록§!\n\"저는 사람에 충성하지 않기 때문에 제가 오늘도 이런 말씀을 드리는 겁니다.\"\n§g국회 국정감사§!"
 TFRKPHN_chb_a_probe_tt:0 "§Y공정위가 직권조사에 나선다§!\n공정거래위원회가 부당 내부거래를 직접 조사합니다.\n재계는 반발하고 노동계는 반깁니다.\n\n비용: £pol_power §Y13§!\n재계의 저항 §R+5§!\n경영계의 신뢰 §R-3§!\n노동계의 신뢰 §G+6§!\n§g한 번 쓰면 45일 동안 다시 쓸 수 없습니다.§!"
 TFRKPHN_chb_card_tt:0 "§Y유승민§!\n\n§Y이력§!\n1958년 1월 7일 대구 출생\n서울대학교 경제학과 졸업, 1987년 위스콘신 대학교 경제학 박사\n1987년부터 2000년까지 한국개발연구원(KDI) 연구위원, 선임연구위원\n2000년부터 2003년까지 한나라당 여의도연구소장\n2004년 제17대 국회의원 (비례대표)\n2005년 박근혜 대표 비서실장, 대구 동구 을 보궐선거 당선\n2008년, 2012년, 2016년 대구 동구 을 당선 (4선)\n2012년부터 2014년까지 국회 국방위원장\n2015년 새누리당 원내대표\n2017년 바른정당 창당, 대통령 후보 (득표율 6.8%)\n2018년 바른미래당 공동대표\n2020년 새로운보수당 창당\n2021년 국민의힘 대선 경선 3위\n\n§Y성향§!\n개혁보수로 분류됩니다.\n원내대표 시절 증세론과 재벌 개혁 등 진보적인 경제관을 보였습니다.\n안보에서는 사드 배치와 전술핵 재배치 등 강경 노선을 취했습니다.\n\n§Y2015년 원내대표 연설에서§!\n\"'증세 없는 복지'는 허구임이 입증되고 있습니다.\"\n\"재벌도 개혁에 동참해야 한다\"\n\"그러나 국가안보 만큼은 정통보수의 길을 확실하게 가겠습니다.\"\n\n§Y2017년 2월 토론회에서§!\n\"경제권력이 정치권력에 영향을 미치고 심지어 언론에도 영향을 미치는 그런 사회에선\n민주주의 시장경제가 제대로 발전할 수 없다\"\n\n§Y홍준표와의 관계§!\n2007년 경선에서 홍준표는 이명박 쪽, 유승민은 박근혜 쪽에 섰습니다.\n2011년 12월 유승민이 최고위원에서 물러났고 홍준표 대표도 물러났습니다.\n2017년 대선에 홍준표는 자유한국당, 유승민은 바른정당 후보로 나왔습니다.\n\n§Y2017년 4월 13일 토론에서§!\n홍준표: \"시중에는 '유 후보가 정책적으로 배신했다. 강남좌파가 됐다'는 주장이 나온다\"\n유승민: \"좌파는 아니고, 새로운 보수가 나갈 방향\"\n\n§Y2021년 9월 23일 경선 토론에서§!\n홍준표: \"아픈 질문을 하겠다. '배신자 프레임'을 어떻게 풀어나갈 것인가\"\n유승민: \"제가 배신자면 최순실은 충신이라는 것인가\""
 TFRKPHN_chb_half_desc:0 "\n\n\n\n£GFX_banner_TFRKPHN_chb_half\n\n\n\n\n\n재벌개혁 법안 여덟 개가 모두 국회를 통과했습니다. 그 가운데 절반 이상은 재계와 마주 앉아 고친 안이었습니다. 타협한 법안에는 예외 조항이 붙었습니다. 적용 대상은 자산 규모가 큰 몇 개 그룹으로 좁혀졌습니다. 시행일은 대부분 몇 해 뒤로 밀렸습니다.\n\n총수 일가의 개인회사는 이름을 바꾸고 지분을 쪼개 남았습니다. 경제 단체들은 투자를 미루겠다던 성명을 거뒀습니다. 정부는 재계와 찍은 간담회 사진을 내고 대타협이라고 발표했습니다. 노동계는 그 사진에 노조가 없다고 논평했습니다. 재벌은 예전보다 조심스러워졌고, 그 이상 달라진 것은 많지 않습니다."
 TFRKPHN_chb_inv_go_tt:0 "§Y정경유착 수사§!\n전쟁 동안 재벌과 정치권 사이에 오간 돈을 검찰이 수사합니다.\n\n1단계: 내사 착수\n2단계: 압수수색\n3단계: 총수와 정치인 소환\n4단계: 기소\n\n비용: £pol_power §Y15§!\n재계의 저항 §G-10§!\n경영계의 신뢰 §R-3§!\n안정도 §G+1%§!\n\n§G네 단계를 다 마치면 원안 개혁의 재계의 저항 증가가 +15에서 +10으로 줄어듭니다.§!\n§g한 번 지시하면 30일 동안 다시 지시할 수 없습니다.§!\n§G중점 정경유착의 뿌리 뽑기를 끝내면 비용 10, 대기 20일로 줄어듭니다.§!\n§g수사는 게임 설정입니다.§!"
 TFRKPHN_chb_k_ban_tt:0 "§Y처벌받은 기업인의 경영 복귀 제한§!\n일정 수준 이상의 형사처벌을 받은 기업인은 경영에\n참여하지 못하게 법을 고칩니다.\n\n비용: £pol_power §Y20§!\n경영계의 신뢰 §R-5§!\n노동계의 신뢰 §G+3§!\n정치력 §G+20§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-2§!\n노동계의 신뢰 §G+1§!\n정치력 §G+10§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_k_class_tt:0 "§Y집단소송제 도입§!\n피해자 한 사람이 이기면 같은 피해를 본 사람 모두가\n배상을 받습니다. 공정거래 관련 법률 전반에 들입니다.\n\n비용: £pol_power §Y20§!\n경영계의 신뢰 §R-5§!\n노동계의 신뢰 §G+5§!\n안정도 §G+2%§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-2§!\n노동계의 신뢰 §G+2§!\n안정도 §G+1%§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_k_ftc_tt:0 "§Y공정위 전속고발권 폐지§!\n공정거래위원회만 고발할 수 있던 권한을 없앱니다.\n피해자가 공정위를 거치지 않고 법원에 바로 갑니다.\n\n비용: £pol_power §Y25§!\n경영계의 신뢰 §R-6§!\n노동계의 신뢰 §G+4§!\n안정도 §G+2%§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-3§!\n노동계의 신뢰 §G+2§!\n안정도 §G+1%§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_k_inherit_tt:0 "§Y편법 상속과 증여 차단§!\n총수 일가가 헐값에 지분을 넘겨받는 길을 감시하고\n막습니다.\n\n비용: £pol_power §Y20§!\n경영계의 신뢰 §R-5§!\n노동계의 신뢰 §G+4§!\n안정도 §G+2%§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-2§!\n노동계의 신뢰 §G+2§!\n안정도 §G+1%§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_k_internal_tt:0 "§Y총수 일가 회사와의 내부거래 금지§!\n총수 일가의 개인회사와 그룹 계열사 사이의 거래를\n금지합니다. 그 일감이 중소기업으로 갑니다.\n\n비용: £pol_power §Y25§!\n경영계의 신뢰 §R-6§!\n공장 산출량 §G+3%§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-3§!\n공장 산출량 §G+1.5%§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_k_pardon_tt:0 "§Y비리 총수 사면과 복권 금지§!\n비리를 저지른 재벌 총수 일가와 경영진을 사면하거나\n복권하지 않습니다.\n\n비용: £pol_power §Y20§!\n경영계의 신뢰 §R-5§!\n노동계의 신뢰 §G+4§!\n안정도 §G+2%§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-2§!\n노동계의 신뢰 §G+2§!\n안정도 §G+1%§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_k_private_tt:0 "§Y총수 일가 개인회사 설립 금지§!\n총수 일가가 개인회사를 세워 계열사 일감을 몰아받는\n일을 막습니다. 2017년 공약 때 \"서미경법\"으로\n불렸습니다.\n\n유승민: \"총수 일가의 개인회사가 아니라 계열사를\n만들어 거래하면 된다\"\n\n비용: £pol_power §Y25§!\n경영계의 신뢰 §R-6§!\n소비재 공장 §G-2%§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-3§!\n소비재 공장 §G-1%§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_k_punitive_tt:0 "§Y징벌적 손해배상제 도입§!\n일부러 저지른 불공정 행위에는 손해액보다 훨씬 많은\n배상을 물립니다.\n\n비용: £pol_power §Y20§!\n경영계의 신뢰 §R-5§!\n노동계의 신뢰 §G+5§!\n정치력 §G+30§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-2§!\n노동계의 신뢰 §G+2§!\n정치력 §G+15§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_mode_tt:0 "§Y타협안§!\n켜 두고 개혁 카드를 누르면 재계와 타협한 안으로 통과시킵니다.\n\n재계의 저항이 §Y+5§!만 오릅니다. (원안은 +15)\n재계의 저항이 60 이상이어도 통과됩니다.\n경영계의 신뢰가 절반만 내려갑니다.\n§R노동계의 신뢰와 개혁의 효과도 절반입니다.§!\n§R타협한 개혁 하나마다 마지막 보상의 일자리가 1만 개 줄어듭니다.§!\n§R한 번이라도 타협하면 마지막에 중소기업의 약진을 얻지 못합니다.§!\n§R타협한 개혁이 4개 이상이면 재벌의 협력 대신 재벌과의 타협이 붙습니다.§!\n\n§g타협은 게임 설정입니다.§!"
 TFRKPHN_chb_sme_desc:0 "\n\n\n\n£GFX_banner_TFRKPHN_chb_sme\n\n\n\n\n\n재벌개혁 법안 여덟 개가 한 줄도 고쳐지지 않고 국회를 통과했습니다. 총수 일가의 개인회사는 문을 닫았습니다. 그 회사들이 수의계약으로 받던 일감이 공개 입찰에 나왔습니다. 첫 해에 입찰을 따낸 곳의 절반이 직원 쉰 명이 안 되는 회사였습니다.\n\n납품 단가를 깎인 업체는 이제 공정위를 거치지 않고 법원에 갑니다. 한 사람이 이기면 같은 피해를 본 업체가 모두 배상을 받습니다. 대기업 구매 담당자들은 계약서를 다시 쓰기 시작했습니다. 공단의 작은 공장들이 십 년 만에 설비를 새로 들이고 사람을 뽑습니다."
 TFRKPHN_cho_eun_hee_HM_desc:0 "이력: 대한민국의 국무총리\n경북여고를 나와 서울대학교 대학원에서 국문학 석사를 받은 조은희는 경향신문 기자로 일을 시작했습니다. 청와대 문화관광비서관과 서울시 여성가족정책관을 거쳐 서울시의 첫 여성 정무부시장이 되었습니다. 2014년 지방선거에서 서초구청장에 당선됐고, 2018년에는 서울 스물다섯 개 구청장 가운데 자유한국당 소속으로는 유일하게 당선되어 재선에 성공했습니다. 오세훈 대통령은 시장 시절부터 함께 일한 그를 첫 국무총리로 지명했습니다."
 TFRKPHN_cho_hyun_dong_FM_desc:0 "출생: 1960년 대한민국 서울특별시\n\n이력: 대한민국의 외교부 장관\n조현동은 직업 외교관입니다. 2022년 5월 외교부 제1차관에 올랐습니다. 2023년 4월부터 2025년 7월까지 주미국 대사를 지냈습니다.\n\n그는 미국을 잘 압니다. 그런데 그 미국이 무너졌습니다. 이인제 대통령은 그래도 그를 불렀습니다. 무너진 나라의 빈자리를 누가 채우려 드는지 읽으려면 그 나라를 알아야 하기 때문입니다."
 TFRKPHN_cho_q_category_desc:0 "조원진 정부는 건국 대통령의 말을 빌려 국민을 모읍니다. 걸려 있는 구절을 누르면 대통령이 그 말로 연설합니다. 같은 구절은 여섯 달에 한 번 쓸 수 있습니다. 정부가 하는 일이 그 말에서 멀어지면 구절은 빛이 바래 더는 쓸 수 없습니다.\n아래쪽 세 구절은 공장을 짓는 말씀입니다. 유동성을 들여 한 번씩 누를 수 있습니다."
 TFRKPHN_cho_qb10_tt:0 "§Y\"부정을 보고 일어서지 않는 백성은 죽은 백성이지. 이 젊은 학생들은 참으로 장하다.\"§!\n1960년 4월 다친 학생들을 병원으로 찾아가 위문하며\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  안정도 §G+2%§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qb11_tt:0 "§Y\"기한과 질병을 다 이겨냈으며 우리의 농지들을 농민들에게 다 넘겨주어서 농민들이 농토의 주인이 되게 한 것입니다.\"§!\n1956년 8월 15일 제3대 대통령 취임사\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  안정도 §G+1%§! 산업 발전도 §G+0.02§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qb12_tt:0 "§Y\"잃었던 나라의 독립을 다시 찾는 일이 얼마나 어렵고 힘들었는지 우리 국민은 알아야 하며 불행했던 과거사를 거울삼아 다시는 어떤 종류의 것이든 노예의 멍에를 메지 않도록 해야 한다. 이것이 내가 우리 민족에게 주는 유언이다.\"§!\n유언\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  안정도 §G+2%§! 전쟁 지지도 §G+3%§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qb2_tt:0 "§Y\"이 정부를 국민이 자기들을 위하여 자기들 손으로 세운 자기들의 정부임을 깊이 각오해야 될 것입니다.\"§!\n1948년 8월 15일 정부 수립 선포식 연설\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  안정도 §G+2%§! 산업 발전도 §G+0.02§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qb3_tt:0 "§Y\"경영주들은 노동자들을 이용만 하지 못할 것이고 노동자는 자본가를 해롭게 못할 것입니다.\"§!\n1948년 8월 15일 정부 수립 선포식 연설\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  산업 발전도 §G+0.04§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qb4_tt:0 "§Y\"우리의 가장 주장하는 바는 계급 전쟁을 피하여 전 민족에 화동을 도모하나니\"§!\n1948년 8월 15일 정부 수립 선포식 연설\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  안정도 §G+2%§! 산업 발전도 §G+0.02§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qb6_tt:0 "§Y\"쌀과 다른 곡식의 생산을 늘이고 공장에서는 생산력을 증가시키며 또 농산물을 매매하는 제도와 물산수출을 전적으로 장려하자는 것입니다.\"§!\n1956년 8월 15일 제3대 대통령 취임사\n\n누르면 대통령이 이 구절을 내걸고 §Y충청도§!에 비료 공장을 짓습니다.\n정치력 §R-25§!  유동성 §R-30§!\n180일 뒤 충청도에 민간 공장 §G1§!개가 들어서고 산업 발전도가 §G+0.02§! 오릅니다.\n한 번만 누를 수 있습니다."
 TFRKPHN_cho_qb7_tt:0 "§Y\"원주나 춘천같이 전쟁에 전수히 파괴되였던 도시들이 날로 재건축이 되어가는 중이며 지나간 수 년 동안에 새 공장들이 건축되어서 우리 민족이 여러 대를 내려가며 누릴 복리를 양출하고 있는 중입니다.\"§!\n1956년 8월 15일 제3대 대통령 취임사\n\n누르면 대통령이 이 구절을 내걸고 §Y경상도§!에 시멘트 공장을 짓습니다.\n정치력 §R-25§!  유동성 §R-30§!\n180일 뒤 경상도에 민간 공장 §G1§!개가 들어서고 산업 발전도가 §G+0.02§! 오릅니다.\n한 번만 누를 수 있습니다."
 TFRKPHN_cho_qb8_tt:0 "§Y\"첫째는 우리가 중소공업을 많이 발전시키는 것이니 이 공업들을 다 민간에서 자유로 해가도록 만들어서 전국적으로 생산력을 증가해 가지고 국내에서 쓸 것과 해외에 수출할 것을 만들며 동시에 직업을 마련해서 실업자가 없도록 만들자는 것입니다.\"§!\n1956년 8월 15일 제3대 대통령 취임사\n\n누르면 대통령이 이 구절을 내걸고 §Y수도권§!에 판유리 공장을 짓습니다.\n정치력 §R-25§!  유동성 §R-30§!\n180일 뒤 수도권에 민간 공장 §G1§!개가 들어서고 산업 발전도가 §G+0.02§! 오릅니다.\n한 번만 누를 수 있습니다."
 TFRKPHN_cho_qb9_tt:0 "§Y\"오늘 와서 보면 우리 정부는 삼권분립으로 행정부 입법부 사법부가 병행해서 발전되고 있는 것이며 우리가 전국적으로 또 지방적으로 여러 번 선거를 집행했었는데 매번에 각오가 깊이 박히는 것은 우리나라의 주권이 민중에게 있다는 것이며 또 우리 유권자들의 권리가 점점 늘어가서 굳건한 토대가 선 것입니다.\"§!\n1956년 8월 15일 제3대 대통령 취임사\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  안정도 §G+3%§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qg9_tt:0 "§Y\"오늘 와서 보면 우리 정부는 삼권분립으로 행정부 입법부 사법부가 병행해서 발전되고 있는 것이며 우리가 전국적으로 또 지방적으로 여러 번 선거를 집행했었는데 매번에 각오가 깊이 박히는 것은 우리나라의 주권이 민중에게 있다는 것이며 또 우리 유권자들의 권리가 점점 늘어가서 굳건한 토대가 선 것입니다.\"§!\n1956년 8월 15일 제3대 대통령 취임사\n\n§R새 헌법을 만든 뒤로 이 구절은 기념사에서 빠졌습니다.§!"
 TFRKPHN_cho_ryong_hae_char_desc:0 "최룡해는 1950년에 태어난 북조선 권력층의 대표적인 원로입니다. 그의 아버지 최현은 김일성과 함께 항일 빨치산 활동을 했습니다. 인민무력부장까지 지냈습니다. 그는 태어날 때부터 혁명 1세대 가문의 자식이었습니다.\n\n그는 김일성사회주의청년동맹을 이끌며 당 관료로 이름을 쌓았습니다. 그러나 권력의 바람에 따라 몇 번이나 쫓겨났다가 다시 돌아왔습니다. 김정은 시대에는 군복을 입고 조선인민군 총정치국장과 차수에 올랐습니다. 군을 당의 손아귀에 묶어 두는 역할이었습니다. 혁명화 교육을 받으며 밀려났다가도 끝내 다시 일어섰습니다. 2019년에는 최고인민회의 상임위원장과 국무위원회 제1부위원장이 되었습니다. 명목상 국가수반의 자리입니다.\n\n김정은이 쓰러지고 박정천의 쿠데타가 평양을 뒤흔들었습니다. 최룡해는 총정치국장 시절 쌓아 둔 군부 인맥을 움직였습니다. 자강도와 량강도, 함경도의 부대들이 그의 편에 섰습니다. 그는 조선인민군 군사위원회를 세워 백두혈통과 결별했습니다.\n\n올해 일흔이 넘은 그는 쫓겨났다 돌아오기를 몇 번이나 겪었습니다. 이번에는 돌아갈 평양이 없습니다."
 TFRKPHN_chung_jin_suk_HM_desc:0 "출생: 1960년 대한민국 충청남도 공주\n\n이력: 대한민국의 국무총리\n정진석은 한국일보 기자로 15년을 일했습니다. 정치부에서 국회를 출입했고 워싱턴 특파원과 논설위원을 지냈습니다. 1999년 김종필의 특보로 정계에 들어왔습니다. 이듬해 자유민주연합 후보로 제16대 국회의원에 당선되었습니다. 지금까지 모두 다섯 번 당선되었습니다. 청와대 정무수석과 국회 사무총장, 새누리당 원내대표, 국회부의장을 지냈습니다. 2024년에는 대통령 비서실장에 임명되었습니다.\n\n이인제 대통령도 자유민주연합을 거쳤습니다. 두 사람은 충청 정치가 어떻게 움직이는지 압니다. 국회를 상대해야 하는 총리 자리에 대통령은 원내대표와 국회부의장을 지낸 정진석을 앉혔습니다."
 TFRKPHN_const_term_tt:0 "헌법 조문이 바뀝니다: §Y헌법 70조§! -> 대통령 임기 4년, 1차에 한해 중임\n§Y다음 정권부터 적용됩니다.§! 근거: §Y헌법 제128조 제2항§! \"대통령의 임기연장 또는 중임변경을 위한 헌법개정은 그 헌법개정 제안 당시의 대통령에 대하여는 효력이 없다.\"\n(타협 §R4회§! 이상이면 §O타협안§!)"
 TFRKPHN_cr_b4_tt:0 "§Y광화문 국민대회§!\n연단에는 한국사 강사 출신 전한길이 섭니다. 국민대회가 박수로 받은 안건을 월요일 국무회의에 그대로 올립니다.\n\n광장 §R-20§!  정치력 §G+50§!\n광장이 §Y60§! 이상일 때 누를 수 있습니다.\n다시 누르려면 §Y60일§!을 기다려야 합니다."
 TFRKPHN_daegu_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_daegu_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9팔공산에 둘러싸인 분지라 여름이면 대프리카라는 소리를 듣습니다. 한때는 전국 옷감의 상당수를 이 도시 방직공장이 짰고, 대구 사과는 시집가는 딸에게 들려 보내던 선물이었습니다. 지금 공장 자리에는 아파트가 섰고 사과밭은 북쪽으로 올라갔습니다. 1인당 지역총생산은 30년 가까이 광역시 꼴찌입니다. 섬유 공장이 떠난 자리를 채울 산업을 찾겠다는 공약은 선거 때마다 나왔다가 사라졌습니다.\n\n선거철마다 보수의 심장이라는 말이 나옵니다. 표가 어디로 갈지 다들 알다 보니 어느 당도 공을 들이지 않습니다. 동성로 카페에서 만난 대학생은 졸업하면 서울이나 수도권으로 갈 생각이라고 했습니다. 서문시장 상인들은 그래도 이 동네만 한 데가 없다고 합니다.§!\n\n§7능금꽃 향기로운 내 고향땅은\n팔공산 바라보는 해뜨는 거리\n그대와 나 여기서 꿈을 꾸었네\n아름답고 정다운 꿈을 꾸었네\n둘이서 걸어가는 희망의 거리\n능금꽃 피고 지는 사랑의 거리\n대구는 내 고향 정다운 내 고향§![GetTFRKPHNGov_daegu]"
 TFRKPHN_daejeon_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_daejeon_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9옛 이름은 한밭, 큰 밭이라는 뜻입니다. 경부선과 호남선이 갈라지는 철도 도시로 컸고, 1973년 대덕연구단지가 들어서면서 과학 도시라는 이름을 얻었습니다. 1993년 엑스포 때 세운 한빛탑은 지금도 갑천 옆에 서 있습니다.\n\n인터넷에서는 노잼 도시로 유명합니다. 대전 사람들도 그 말에 크게 반박하지 않습니다. 주말이면 성심당 앞에 줄이 늘어서는데, 빵을 산 외지 사람들은 대부분 그 길로 대전역에 돌아갑니다. 연구단지 박사들과 원도심 상인들은 같은 도시에 살아도 마주칠 일이 별로 없습니다. 은행동 지하상가는 예전 같지 않습니다. 세종시가 생긴 뒤로는 젊은 부부들이 아파트를 찾아 그쪽으로 넘어갑니다. 대전 사람들은 그래도 살기는 여기가 제일 편하다고 말합니다.§!\n\n§2모든 길이 통하지만 정작 누구도 머물지 않는, 화려한 과학의 외투를 입은 무채색의 환승역.§![GetTFRKPHNGov_daejeon]"
 TFRKPHN_dd_category_desc:0 "기준 중위소득 85퍼센트에 모자라는 소득의 절반을 나라가 채워 줍니다. 서울이 2022년 7월 첫 지급을 시작해 2024년 9월 서울디딤돌소득으로 이름을 바꾼 제도를 이제 전국으로 넓힙니다.\n\n받는 가구: §Y[?TFRKPHN_dd|0]만 가구§! / 60만 가구\n만 가구마다 §G빈곤 개선§!과 §G안정도§!가 오르고, 나라 살림의 §R소비재 부담§!도 늘어납니다.\n지금 안정도 §G+[?TFRKPHN_dd_stpct|1]퍼센트§!, 소비재 §R+[?TFRKPHN_dd_cgpct|1]퍼센트§!"
 TFRKPHN_dept_req_dm10_desc:0 "소위와 하사가 군을 떠나고 있습니다. 국방부가 초급 간부 수당을 올리자고 합니다.\n\n§G좋아함§! §Y국가정보원§!: 군 출신 요원을 뽑기 쉬워집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해마다 나가는 돈이 늘어납니다.\n§R싫어함§! §Y외교부§!: 외교관 수당은 그대로입니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm11_desc:0 "병사가 줄어드는 만큼 군무원을 늘리자는 안입니다. 정원과 인건비가 함께 늘어납니다.\n\n§G좋아함§! §Y외교부§!: 해외 파견 부대 지원이 쉬워집니다.\n§R싫어함§! §Y행정안전부§!: 정원을 내줘야 합니다.\n§R싫어함§! §Y국가정보원§!: 신원 조사 일이 늘어납니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm12_desc:0 "국방부가 무기 수출 허가를 빨리 내주자고 합니다. 외교부는 분쟁 지역 수출에 신중합니다.\n\n§G좋아함§! §Y행정안전부§!: 방산 공장이 있는 지역 경제가 삽니다.\n§R싫어함§! §Y외교부§!: 분쟁 지역 수출은 외교 부담이 됩니다.\n§R싫어함§! §Y국가정보원§!: 기술 보안 심사 시간이 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm13_desc:0 "군 공항 주변은 건물 높이가 묶여 있습니다. 지자체들이 이를 풀어 달라고 합니다. 국방부는 지금 기준을 지키자고 합니다.\n\n§G좋아함§! §Y국가정보원§!: 기지 주변 보안이 지켜집니다.\n§R싫어함§! §Y행정안전부§!: 지자체 개발이 막힙니다.\n§R싫어함§! §Y국무총리실§!: 지자체 민원이 총리실로 몰립니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm14_desc:0 "평시 군사 법원을 없애자는 주장이 있습니다. 국방부가 지금 제도를 지키겠다고 합니다. 반대 여론이 큽니다.\n\n§G좋아함§! §Y국가정보원§!: 군 기밀이 민간 법정에 나가지 않습니다.\n§R싫어함§! §Y국무총리실§!: 반대 여론을 총리실이 떠안습니다.\n§R싫어함§! §Y행정안전부§!: 경찰이 군 사건을 넘겨받지 못합니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm1_desc:0 "신범철 장관이 내년 국방비를 올려 달라고 합니다. 전쟁에서 쓴 탄약을 아직 다 채우지 못했습니다.\n\n§G좋아함§! §Y국가정보원§!: 정찰 자산 예산이 함께 늘어납니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 다른 예산을 깎아야 합니다.\n§R싫어함§! §Y행정안전부§!: 지방에 갈 돈이 밀립니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm2_desc:0 "국방부가 전환 복무와 대체 복무를 줄이자고 합니다. 입대할 청년이 해마다 줄고 있습니다. 그 인력을 쓰던 경찰과 소방, 지자체가 반발합니다.\n\n§G좋아함§! §Y국무총리실§!: 병역 형평성 논란이 줄어듭니다.\n§R싫어함§! §Y행정안전부§!: 경찰과 소방, 지자체 인력이 빠집니다.\n§R싫어함§! §Y외교부§!: 국제 협력 요원 제도가 사라집니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm3_desc:0 "군 정보 부대의 특수활동비는 국정원이 짜고 감사합니다. 신범철 장관이 이를 국방부로 가져오겠다고 합니다.\n\n§G좋아함§! §Y행정안전부§!: 경찰도 같은 요구를 할 명분이 생깁니다.\n§R싫어함§! §Y국가정보원§!: 편성권과 감사권을 잃습니다.\n§R싫어함§! §Y국무총리실§!: 정보 예산 조정이 흩어집니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm4_desc:0 "군 공항을 옮기는 돈은 옛 터를 팔아 마련하게 되어 있습니다. 모자라는 돈을 나라가 대자고 국방부가 요청합니다.\n\n§G좋아함§! §Y행정안전부§!: 지자체의 오랜 숙원입니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 수조 원이 듭니다.\n§R싫어함§! §Y국가정보원§!: 새 기지 보안 시설을 다시 지어야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm5_desc:0 "국방부가 병장 월급을 200만 원까지 올리자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 청년 여론이 좋아집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해마다 수조 원이 듭니다.\n§R싫어함§! §Y행정안전부§!: 9급 공무원보다 병장 월급이 많아집니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm6_desc:0 "군 정찰 위성이 궤도에 올랐습니다. 영상을 누가 먼저 받느냐를 두고 군과 국정원이 맞섭니다. 국방부가 운용을 군에 맡겨 달라고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 운용 책임이 분명해집니다.\n§R싫어함§! §Y국가정보원§!: 영상을 먼저 받지 못합니다.\n§R싫어함§! §Y외교부§!: 영상 공유 협의 창구가 바뀝니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm7_desc:0 "의대생이 병사로 입대하는 일이 늘어 군의관이 모자랍니다. 국방부가 의사 인력을 군에 먼저 배정하자고 합니다. 보건소 의사가 그만큼 줄어듭니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 군 병원 민간 위탁비가 줄어듭니다.\n§R싫어함§! §Y행정안전부§!: 보건소 의사가 줄어듭니다.\n§R싫어함§! §Y외교부§!: 해외 의료 지원 인력이 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm8_desc:0 "예비군 훈련에 나오면 받는 돈이 하루 일당에 못 미칩니다. 국방부가 이를 올리자고 합니다.\n\n§G좋아함§! §Y국가정보원§!: 예비 전력이 든든해집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해마다 수천억 원이 듭니다.\n§R싫어함§! §Y국무총리실§!: 다른 수당 인상 요구가 줄을 잇습니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm9_desc:0 "방위사업청은 2006년에 국방부에서 떨어져 나왔습니다. 국방부가 무기 도입을 다시 직접 챙기겠다고 합니다.\n\n§G좋아함§! §Y외교부§!: 수출 협상 상대가 하나로 줄어듭니다.\n§R싫어함§! §Y행정안전부§!: 조직을 다시 짜야 합니다.\n§R싫어함§! §Y국가정보원§!: 방산 보안 감사 대상이 흐려집니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em10_desc:0 "[TFRKPHN_mof]는 해마다 재정 사업을 평가합니다. 점수가 낮은 사업은 예산을 깎자고 합니다. 총리실의 부처 평가와 일이 겹칩니다.\n\n§G좋아함§! §Y외교부§!: 원조 사업 점수가 높았습니다.\n§R싫어함§! §Y국무총리실§!: 부처 평가와 일이 겹칩니다.\n§R싫어함§! §Y국가정보원§!: 비공개 사업은 성과를 보여 줄 수 없습니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em11_desc:0 "[TFRKPHN_mof]가 모든 부처에 재량 지출을 10%씩 줄이라고 하자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 전쟁 빚 상환 실적이 생깁니다.\n§R싫어함§! §Y외교부§!: 공관 운영비가 줄어듭니다.\n§R싫어함§! §Y국방부§!: 훈련비가 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em12_desc:0 "군인 연금은 해마다 나랏돈으로 적자를 메웁니다. [TFRKPHN_mof]가 이 제도를 고치자고 합니다.\n\n§G좋아함§! §Y외교부§!: 아낀 돈이 다른 부처로 돌아옵니다.\n§R싫어함§! §Y국방부§!: 간부들이 전역을 서두릅니다.\n§R싫어함§! §Y국가정보원§!: 요원 연금도 다음 차례로 봅니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em13_desc:0 "경제 부처 장관 회의는 부총리가 주재합니다. [TFRKPHN_mof]가 경제 현안은 이 회의에서 끝내자고 합니다. 총리실의 조정 회의는 힘이 빠집니다.\n\n§G좋아함§! §Y국가정보원§!: 경제 안보 보고 창구가 하나로 정리됩니다.\n§R싫어함§! §Y국무총리실§!: 총리실 조정 회의가 힘을 잃습니다.\n§R싫어함§! §Y행정안전부§!: 지방 경제 현안이 뒤로 밀립니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em14_desc:0 "부처들은 세금 말고도 부담금을 따로 걷습니다. 여권을 만들 때 내는 돈도 그중 하나입니다. [TFRKPHN_mof]가 부담금을 줄이거나 없애자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 국민 부담이 줄어 여론이 좋아집니다.\n§R싫어함§! §Y외교부§!: 여권에 붙는 기여금 수입이 줄어듭니다.\n§R싫어함§! §Y행정안전부§!: 지자체가 걷는 부담금도 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em1_desc:0 "방기선 장관이 재정 적자를 국내총생산의 3% 안으로 묶는 법을 만들자고 합니다. 돈을 많이 쓰는 부처부터 예산이 깎입니다.\n\n§G좋아함§! §Y국가정보원§!: 안보 예산은 예외로 인정받았습니다.\n§R싫어함§! §Y국방부§!: 국방비 증액이 막힙니다.\n§R싫어함§! §Y외교부§!: 원조 예산 약속을 못 지킵니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em2_desc:0 "큰 사업은 예비 타당성 조사를 거쳐야 합니다. [TFRKPHN_mof]가 면제 요건을 좁히자고 합니다. 지방 사업이 가장 먼저 걸립니다.\n\n§G좋아함§! §Y외교부§!: 원조 예산에 여유가 생깁니다.\n§R싫어함§! §Y행정안전부§!: 지방 사업이 줄줄이 걸립니다.\n§R싫어함§! §Y국무총리실§!: 국무회의 의결로 면제해 주던 길이 좁아집니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em3_desc:0 "국정원과 군의 특수활동비는 쓴 곳을 밝히지 않습니다. [TFRKPHN_mof]가 이 돈을 줄이자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 총리실은 특수활동비가 거의 없습니다.\n§R싫어함§! §Y국가정보원§!: 요원 활동비가 줄어듭니다.\n§R싫어함§! §Y국방부§!: 군 정보 부대 활동비가 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em4_desc:0 "[TFRKPHN_mof]가 공공기관마다 정원을 줄이고 남는 자산을 팔게 하자고 합니다. 공공기관은 부처마다 딸려 있습니다.\n\n§G좋아함§! §Y국방부§!: 군 관련 기관은 빠졌습니다.\n§R싫어함§! §Y외교부§!: 산하 원조 기관 인력이 줄어듭니다.\n§R싫어함§! §Y행정안전부§!: 지방 공기업도 대상입니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em5_desc:0 "지방은 지방소비세율을 올려 달라고 합니다. 국세가 그만큼 줄어듭니다. [TFRKPHN_mof]가 지금 비율을 지키자고 합니다.\n\n§G좋아함§! §Y국방부§!: 국방비 재원이 지켜집니다.\n§R싫어함§! §Y행정안전부§!: 지방 재정 확충이 막힙니다.\n§R싫어함§! §Y국무총리실§!: 총리가 지방에 한 약속이 깨집니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em6_desc:0 "큰 무기 도입 사업은 타당성 조사를 받습니다. [TFRKPHN_mof]가 진행 중인 사업도 다시 보자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 대형 사업 잡음이 줄어듭니다.\n§R싫어함§! §Y국방부§!: 진행 중인 사업이 멈춥니다.\n§R싫어함§! §Y외교부§!: 수출 상대국과 한 약속이 흔들립니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em7_desc:0 "[TFRKPHN_mof]가 4급 이상 공무원의 봉급을 올리지 말자고 합니다. 군 간부와 외교관도 여기에 들어갑니다.\n\n§G좋아함§! §Y행정안전부§!: 하위직 처우를 고칠 돈이 생깁니다.\n§R싫어함§! §Y국방부§!: 군 간부 봉급이 묶입니다.\n§R싫어함§! §Y외교부§!: 외교관 봉급이 묶입니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em8_desc:0 "올해 세금이 예상보다 덜 걷혔습니다. [TFRKPHN_mof]가 지방에 보낼 교부세를 그만큼 줄이자고 합니다.\n\n§G좋아함§! §Y국가정보원§!: 안보 예산은 깎이지 않습니다.\n§R싫어함§! §Y행정안전부§!: 지자체가 사업을 멈춰야 합니다.\n§R싫어함§! §Y국방부§!: 군 부대 주변 지원 사업이 멈춥니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em9_desc:0 "[TFRKPHN_mof]가 쓰지 않는 국유지를 팔아 빚을 갚자고 합니다. 군이 쓰지 않고 쥔 땅도 대상입니다.\n\n§G좋아함§! §Y행정안전부§!: 지자체가 그 땅을 개발할 수 있습니다.\n§R싫어함§! §Y국방부§!: 군 유휴지를 내놓아야 합니다.\n§R싫어함§! §Y국가정보원§!: 보안 시설 주변 땅이 팔립니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm10_desc:0 "외교부가 본부에 정보 분석 조직을 따로 두겠다고 합니다. 해외 정보는 국정원이 맡아 온 일입니다.\n\n§G좋아함§! §Y행정안전부§!: 해외 재난 정보를 빨리 받습니다.\n§R싫어함§! §Y국가정보원§!: 해외 정보를 혼자 쥐지 못합니다.\n§R싫어함§! §Y국방부§!: 군 정보와 분석이 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm11_desc:0 "대사관에는 국방부가 보낸 무관이 있습니다. 외교부가 무관의 보고도 대사를 거치게 하자고 합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 공관 예산 집행이 단순해집니다.\n§R싫어함§! §Y국방부§!: 무관의 보고 선이 대사를 거칩니다.\n§R싫어함§! §Y국가정보원§!: 파견 요원도 같은 요구를 받을까 걱정합니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm12_desc:0 "외교부가 외교관 선발 인원을 늘리자고 합니다. 공무원 정원은 행정안전부가 정합니다.\n\n§G좋아함§! §Y국방부§!: 국방 협력 담당 외교관이 늘어납니다.\n§R싫어함§! §Y행정안전부§!: 정원을 내줘야 합니다.\n§R싫어함§! §Y국가정보원§!: 신원 조사 일이 늘어납니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm13_desc:0 "외교부가 공관이 없는 나라 열두 곳에 대사관을 열자고 합니다. 건물과 사람 모두 새로 필요합니다.\n\n§G좋아함§! §Y국가정보원§!: 해외 거점이 늘어납니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 건물과 운영비가 듭니다.\n§R싫어함§! §Y국방부§!: 무관을 보낼 사람이 모자랍니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm14_desc:0 "무상 원조는 수십 개 기관이 제각각 합니다. 외교부가 이를 한데 모으자고 합니다. 조정은 지금 총리실 위원회가 맡고 있습니다.\n\n§G좋아함§! §Y국가정보원§!: 원조 현장 정보가 한곳에 모입니다.\n§R싫어함§! §Y국무총리실§!: 조정권이 총리실에서 외교부로 넘어갑니다.\n§R싫어함§! §Y행정안전부§!: 새마을 원조 사업을 넘겨야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm1_desc:0 "조현동 장관이 재외 공관 인력을 늘려 달라고 합니다. 공무원 정원은 행정안전부가 정합니다.\n\n§G좋아함§! §Y국방부§!: 무관부 지원 인력도 늘어납니다.\n§R싫어함§! §Y행정안전부§!: 다른 부처 정원을 줄여야 합니다.\n§R싫어함§! §Y국가정보원§!: 공관의 파견 자리가 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm2_desc:0 "해외 원조는 둘로 나뉘어 있습니다. 거저 주는 원조는 외교부가, 빌려주는 원조는 [TFRKPHN_mof]가 맡습니다. 외교부가 이를 하나로 모으자고 합니다.\n\n§G좋아함§! §Y국방부§!: 방산 협력과 원조를 묶기 쉬워집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 유상 원조를 내놓아야 합니다.\n§R싫어함§! §Y국무총리실§!: 총리실 위원회의 조정 몫이 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm3_desc:0 "통상 교섭은 1998년부터 외교부가 맡다가 2013년에 산업통상자원부로 넘어갔습니다. 외교부가 이를 되찾겠다고 합니다. 산업통상자원부가 크게 반발합니다.\n\n§G좋아함§! §Y행정안전부§!: 지자체 수출 지원 창구가 단순해집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 경제 부처의 협상 주도권이 줄어듭니다.\n§R싫어함§! §Y국방부§!: 방산 수출 협상이 통상 협상에 묶입니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm4_desc:0 "외교관이 아닌 사람이 대사로 나가는 자리를 특임 공관장이라고 부릅니다. 외교부가 이 자리를 줄이자고 합니다. 대통령이 쓸 수 있는 인사 카드가 줄어듭니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 대사 교체 비용이 줄어듭니다.\n§R싫어함§! §Y국무총리실§!: 총리실 출신이 나갈 자리가 줄어듭니다.\n§R싫어함§! §Y국가정보원§!: 원장 출신이 나갈 대사 자리가 사라집니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm5_desc:0 "방위비 분담 협상 대표는 대대로 외교부 사람이었습니다. 2019년에 처음으로 경제 관료가 맡았습니다. 외교부가 이 자리를 되찾겠다고 합니다.\n\n§G좋아함§! §Y행정안전부§!: 미군 기지 주변 지자체의 요구를 전하기 쉽습니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 경제 관료가 맡던 자리를 잃습니다.\n§R싫어함§! §Y국가정보원§!: 협상 정보에서 멀어집니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm6_desc:0 "재외동포 업무는 여러 부처에 흩어져 있습니다. 외교부가 이를 모아 산하에 청을 두자고 합니다. 새 조직을 만들려면 행정안전부가 정원을 내줘야 합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 동포 자본을 끌어올 창구가 생깁니다.\n§R싫어함§! §Y행정안전부§!: 정원을 내줘야 합니다.\n§R싫어함§! §Y국가정보원§!: 동포 사회 정보 창구가 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm7_desc:0 "정부는 2030년까지 원조를 국민총소득의 0.3%로 늘리겠다고 약속했습니다. 외교부가 그 약속대로 예산을 올리자고 합니다.\n\n§G좋아함§! §Y국방부§!: 방산 수출 길이 넓어집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해마다 수천억 원이 더 듭니다.\n§R싫어함§! §Y국무총리실§!: 원조 규모는 총리실 위원회가 정해 왔습니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm8_desc:0 "공급망과 기술 문제를 다루는 회의는 [TFRKPHN_mof]가 주재합니다. 외교부가 이 주도권을 달라고 합니다.\n\n§G좋아함§! §Y행정안전부§!: 지자체의 외국 기업 유치에 도움이 됩니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 경제 안보 회의 주도권을 잃습니다.\n§R싫어함§! §Y국무총리실§!: 총리실 조정을 거치지 않습니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm9_desc:0 "북한 인권 대사 자리는 법에 있지만 오래 비어 있었습니다. 외교부가 이 자리를 채우자고 합니다.\n\n§G좋아함§! §Y국방부§!: 대북 압박에 힘이 실립니다.\n§R싫어함§! §Y국가정보원§!: 대북 물밑 접촉이 어려워집니다.\n§R싫어함§! §Y국무총리실§!: 대북 메시지가 여러 갈래로 나갑니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im10_desc:0 "수도권에 남은 공공기관을 지방으로 옮기자는 안입니다. 외교부 산하 기관도 대상에 들어갑니다.\n\n§G좋아함§! §Y국무총리실§!: 균형 발전 실적이 생깁니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 이전 비용이 듭니다.\n§R싫어함§! §Y외교부§!: 산하 기관이 서울을 떠나야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im11_desc:0 "부처마다 따로 두던 서버를 행정안전부 전산 센터로 모으자고 합니다. 보안 점검은 국정원 일이라 권한이 겹칩니다.\n\n§G좋아함§! §Y국무총리실§!: 부처 간 자료 공유가 쉬워집니다.\n§R싫어함§! §Y국가정보원§!: 보안 점검 권한이 겹칩니다.\n§R싫어함§! §Y외교부§!: 외교 전문 서버는 못 옮긴다고 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im12_desc:0 "강원과 전북이 특별자치도 지위를 요구합니다. 행정안전부가 이를 들어주자고 합니다. 중앙 부처의 권한이 그만큼 내려갑니다.\n\n§G좋아함§! §Y외교부§!: 지자체가 해외 투자 유치에 나섭니다.\n§R싫어함§! §Y국무총리실§!: 중앙의 조정 권한이 줄어듭니다.\n§R싫어함§! §Y국방부§!: 접경 지역 규제 권한이 흔들립니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im13_desc:0 "전시 대비 정부 연습은 행정안전부가 주관합니다. 군은 같은 기간에 따로 연합 연습을 합니다. 행정안전부가 계획을 먼저 짜겠다고 합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 따로 하던 연습이 합쳐져 돈이 덜 듭니다.\n§R싫어함§! §Y국방부§!: 군 연습 일정을 맞춰야 합니다.\n§R싫어함§! §Y국가정보원§!: 전시 정보 계획을 미리 내놓아야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im14_desc:0 "전국 민방위 훈련은 여러 해 동안 열리지 않았습니다. 행정안전부가 온 국민이 참여하는 훈련을 다시 하자고 합니다.\n\n§G좋아함§! §Y국가정보원§!: 대피 체계 점검에 도움이 됩니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 훈련 날 경제 활동이 멈춥니다.\n§R싫어함§! §Y국무총리실§!: 총리실에 민원이 몰립니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im1_desc:0 "지방 교부세는 내국세의 19.24%입니다. 이명수 장관이 이 비율을 22%로 올리자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 지방의 불만이 줄어듭니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해마다 수조 원이 지방으로 나갑니다.\n§R싫어함§! §Y국방부§!: 국방비 재원이 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im2_desc:0 "행정안전부가 해마다 부처 정원의 1%를 거둬 필요한 곳에 다시 나눠 주겠다고 합니다. 사람이 모자란 부처일수록 싫어합니다.\n\n§G좋아함§! §Y국무총리실§!: 새 사업에 인력을 돌려쓸 수 있습니다.\n§R싫어함§! §Y외교부§!: 사람이 가장 모자란 부처입니다.\n§R싫어함§! §Y국방부§!: 군무원 정원도 대상입니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im3_desc:0 "접경 지역 지자체들이 군사 시설 보호 구역을 풀어 달라고 합니다. 행정안전부가 이 요구를 들고 왔습니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 개발로 세금이 더 걷힙니다.\n§R싫어함§! §Y국방부§!: 작전 구역이 줄어듭니다.\n§R싫어함§! §Y국무총리실§!: 총리실 조정 없이 접경 정책이 바뀝니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im4_desc:0 "행정안전부가 중앙 부처의 사무 수백 건을 한꺼번에 지방으로 넘기자고 합니다. 일을 넘기면 돈도 따라가야 합니다.\n\n§G좋아함§! §Y외교부§!: 지자체의 국제 교류가 늘어납니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 돈도 함께 넘겨야 합니다.\n§R싫어함§! §Y국무총리실§!: 총리실이 조정할 일이 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im5_desc:0 "행정안전부는 각 부처의 재난 안전 예산을 먼저 살펴 [TFRKPHN_mof]에 의견을 냅니다. 이 의견을 반드시 따르게 하자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 재난 책임 소재가 분명해집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 예산 편성권을 침해받습니다.\n§R싫어함§! §Y국가정보원§!: 보안 시설 예산도 심의를 받습니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im6_desc:0 "고향에 기부하면 10만 원까지 세금에서 전액 빼 줍니다. 행정안전부가 이 한도를 올리자고 합니다.\n\n§G좋아함§! §Y국방부§!: 군 부대가 있는 시군의 살림이 나아집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 세금이 덜 걷힙니다.\n§R싫어함§! §Y국무총리실§!: 총리실의 지방 지원 사업이 빛을 잃습니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im7_desc:0 "인구가 줄어드는 시군에 해마다 1조 원이 나갑니다. 이명수 장관이 이 기금을 늘리자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 지방 민심이 좋아집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해마다 나가는 돈이 늘어납니다.\n§R싫어함§! §Y외교부§!: 원조 재원이 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im8_desc:0 "행정안전부가 소방관과 경찰관을 더 뽑자고 합니다. 인건비는 해마다 나가는 돈입니다.\n\n§G좋아함§! §Y외교부§!: 해외에 파견할 경찰 주재관이 늘어납니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 인건비가 해마다 나갑니다.\n§R싫어함§! §Y국가정보원§!: 경찰 수사 인력이 커지는 것을 경계합니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im9_desc:0 "행정안전부가 부처 안에 경찰 업무를 맡는 국을 두겠다고 합니다. 경찰 인사를 장관이 직접 보겠다는 뜻입니다. 일선 경찰이 반발합니다.\n\n§G좋아함§! §Y외교부§!: 해외 경찰 협력 창구가 분명해집니다.\n§R싫어함§! §Y국무총리실§!: 경찰위원회의 자리가 좁아집니다.\n§R싫어함§! §Y국가정보원§!: 경찰 정보가 장관에게 먼저 올라갑니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis10_desc:0 "방첩은 국정원과 군 방첩 부대, 경찰이 나눠 맡습니다. 국정원이 이들의 계획을 조정하겠다고 합니다.\n\n§G좋아함§! §Y외교부§!: 외국 공관 관련 사건 창구가 하나가 됩니다.\n§R싫어함§! §Y국방부§!: 군 방첩 부대가 조정을 받습니다.\n§R싫어함§! §Y국무총리실§!: 총리실 조정을 거치지 않습니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis11_desc:0 "휴대 전화는 법원 허가가 있어도 감청할 설비가 없습니다. 국정원이 통신사에 설비를 갖추게 하는 법을 요구합니다. 반대 여론이 큽니다.\n\n§G좋아함§! §Y행정안전부§!: 경찰 수사에도 쓸 수 있습니다.\n§R싫어함§! §Y국무총리실§!: 반대 여론을 총리실이 떠안습니다.\n§R싫어함§! §Y외교부§!: 인권 문제로 국제 평판이 걱정됩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis12_desc:0 "국정원은 각 부처와 재외 공관의 보안을 점검합니다. 이 감사를 해마다 하겠다고 합니다.\n\n§G좋아함§! §Y국방부§!: 군 보안 기준이 다른 부처에도 퍼집니다.\n§R싫어함§! §Y외교부§!: 공관마다 해마다 감사를 받습니다.\n§R싫어함§! §Y행정안전부§!: 지자체까지 감사를 받습니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis13_desc:0 "국정원이 공급망과 원자재 정보를 모아 경보를 내겠다고 합니다. [TFRKPHN_mof]도 같은 일을 하는 회의를 두고 있습니다.\n\n§G좋아함§! §Y행정안전부§!: 지역 기업 피해를 미리 알 수 있습니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 경제 안보 회의와 일이 겹칩니다.\n§R싫어함§! §Y외교부§!: 경제 안보 외교와 일이 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis14_desc:0 "국정원 특수활동비는 2018년에 안보비로 이름이 바뀌었습니다. 김홍균 원장이 이 예산을 늘려 달라고 합니다.\n\n§G좋아함§! §Y국방부§!: 군 정보 부대 지원비가 함께 늘어납니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 내역을 모르는 돈이 늘어납니다.\n§R싫어함§! §Y국무총리실§!: 감사할 길이 없는 돈입니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis1_desc:0 "간첩 수사권은 법이 바뀌어 경찰로 넘어갔습니다. 김홍균 원장이 이를 국정원에 다시 달라고 합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 수사 조직을 새로 꾸릴 돈이 안 듭니다.\n§R싫어함§! §Y행정안전부§!: 경찰이 수사권을 내놓아야 합니다.\n§R싫어함§! §Y외교부§!: 인권 문제로 국제 평판이 걱정됩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis2_desc:0 "국정원이 사이버 안보 지휘를 맡는 법을 만들자고 합니다. 군은 사이버작전사령부를 따로 두고 있습니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 금융 전산망 보호가 강화됩니다.\n§R싫어함§! §Y국방부§!: 사이버작전사령부가 지휘를 받게 됩니다.\n§R싫어함§! §Y행정안전부§!: 전자 정부 보안 권한이 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis3_desc:0 "국정원장이 대통령에게 혼자 보고하는 자리를 다시 만들자고 합니다. 이 자리에는 총리도 들어가지 못합니다.\n\n§G좋아함§! §Y외교부§!: 해외 정보가 대통령에게 빨리 닿습니다.\n§R싫어함§! §Y국무총리실§!: 총리가 모르는 보고가 생깁니다.\n§R싫어함§! §Y국방부§!: 군 정보 보고가 뒤로 밀립니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis4_desc:0 "지금 간첩죄는 적국을 위해 일한 사람만 벌합니다. 국정원이 대상을 모든 외국으로 넓히자고 합니다. 법을 고쳐야 하는 일입니다.\n\n§G좋아함§! §Y행정안전부§!: 경찰 안보 수사 대상이 넓어집니다.\n§R싫어함§! §Y외교부§!: 우방국과 마찰이 생길 수 있습니다.\n§R싫어함§! §Y국무총리실§!: 법 개정 부담을 총리실이 집니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis5_desc:0 "국정원에는 산업 기밀을 지키는 부서가 있습니다. 김홍균 원장이 기술 유출 사건을 직접 수사하게 해 달라고 합니다. 지금은 경찰이 수사합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 수출 기업의 기술이 지켜집니다.\n§R싫어함§! §Y행정안전부§!: 경찰이 수사를 내놓아야 합니다.\n§R싫어함§! §Y국무총리실§!: 수사 기관 조정이 다시 꼬입니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis6_desc:0 "국정원은 고위 공직자 후보의 신원을 조사합니다. 이 대상을 더 넓히자고 합니다. 인사 검증을 맡은 쪽과 일이 겹칩니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 기관장 인선 잡음이 줄어듭니다.\n§R싫어함§! §Y국무총리실§!: 인사 검증과 일이 겹칩니다.\n§R싫어함§! §Y외교부§!: 외교관 인사가 늦어집니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis7_desc:0 "대테러센터는 총리실에 있습니다. 국정원이 테러 정보를 쥐고 있으니 지휘도 맡겠다고 합니다.\n\n§G좋아함§! §Y국방부§!: 군은 정보를 쥔 쪽이 지휘하기를 바랍니다.\n§R싫어함§! §Y국무총리실§!: 대테러센터를 내놓아야 합니다.\n§R싫어함§! §Y외교부§!: 해외 테러 대응 창구가 바뀝니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis8_desc:0 "국정원의 국내 정보 부서는 2017년에 없어졌습니다. 국정원이 이를 다시 두자고 합니다. 국내 정보는 지금 경찰이 모읍니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 경제 동향 보고가 빨라집니다.\n§R싫어함§! §Y행정안전부§!: 경찰 정보 부서와 겹칩니다.\n§R싫어함§! §Y국방부§!: 군 방첩 부대와 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis9_desc:0 "국정원 요원은 대사관 직원 신분으로 해외에 나갑니다. 국정원이 그 자리를 늘려 달라고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 해외 위기 보고가 빨라집니다.\n§R싫어함§! §Y외교부§!: 대사관 자리를 내줘야 합니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해외 활동비가 듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm10_desc:0 "장관 후보의 인사 검증은 대통령실 일이었습니다. 총리실이 이를 넘겨 달라고 합니다. 국정원의 신원 조사와 일이 겹칩니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 검증이 빨라져 인사 공백이 줄어듭니다.\n§R싫어함§! §Y국가정보원§!: 신원 조사와 일이 겹칩니다.\n§R싫어함§! §Y국방부§!: 장성 인사 검증도 넘어갑니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm11_desc:0 "국가보훈처는 총리 밑의 처입니다. 총리실이 이를 부로 올리자고 합니다. 부가 되면 정원과 조직이 늘어납니다.\n\n§G좋아함§! §Y국방부§!: 참전 용사 예우가 좋아집니다.\n§R싫어함§! §Y행정안전부§!: 정원과 조직을 내줘야 합니다.\n§R싫어함§! §Y외교부§!: 해외 참전 용사 사업이 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm12_desc:0 "공정거래위원회는 총리 소속입니다. 총리실이 이 위원회의 조사 권한을 넓히자고 합니다. [TFRKPHN_mof]는 기업 투자가 움츠러든다고 봅니다.\n\n§G좋아함§! §Y국가정보원§!: 기업 정보가 더 많이 쌓입니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 기업 투자가 움츠러든다고 봅니다.\n§R싫어함§! §Y국방부§!: 방산 업체가 조사 대상이 됩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm13_desc:0 "재난 대책 본부장은 행정안전부 장관입니다. 2020년 감염병 때는 총리가 처음으로 본부장을 맡았습니다. 총리실이 이를 원칙으로 삼자고 합니다.\n\n§G좋아함§! §Y국가정보원§!: 위기 보고 체계가 단순해집니다.\n§R싫어함§! §Y행정안전부§!: 재난 지휘권을 내놓아야 합니다.\n§R싫어함§! §Y국방부§!: 군 병력 지원 요청이 늘어납니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm14_desc:0 "청년 정책은 부처마다 따로 합니다. 총리가 위원장인 위원회가 이를 조정하게 되어 있습니다. 총리실이 이 위원회에 예산 조정권을 달라고 합니다.\n\n§G좋아함§! §Y외교부§!: 해외 청년 사업이 힘을 받습니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 예산 조정권을 나눠야 합니다.\n§R싫어함§! §Y행정안전부§!: 지자체 청년 사업과 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm1_desc:0 "정진석 총리가 예산 편성을 총리 소속 기관으로 옮기자고 합니다. [TFRKPHN_mof]는 예산실을 내놓아야 합니다.\n\n§G좋아함§! §Y국방부§!: [TFRKPHN_mof_s] 힘이 빠지면 국방비 협상이 쉬워집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 예산실을 내놓아야 합니다.\n§R싫어함§! §Y외교부§!: 예산 설명을 두 곳에 해야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm2_desc:0 "부처마다 쥐고 있는 규제를 총리실 추진단이 모아서 심사하겠다고 합니다. [TFRKPHN_mof]도 경제 규제 심사를 따로 하고 있습니다.\n\n§G좋아함§! §Y외교부§!: 외국 기업의 불만이 줄어듭니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 경제 규제 심사를 빼앗깁니다.\n§R싫어함§! §Y국방부§!: 군사 규제도 심사 대상이 됩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm3_desc:0 "총리가 대통령을 매주 만나 국정을 보고하겠다고 합니다. 대통령이 보고를 받는 시간은 정해져 있어서 다른 기관의 몫이 줄어듭니다.\n\n§G좋아함§! §Y행정안전부§!: 지방 현안이 대통령에게 빨리 닿습니다.\n§R싫어함§! §Y국가정보원§!: 독대 보고 시간이 줄어듭니다.\n§R싫어함§! §Y외교부§!: 외교 현안이 총리를 거쳐 올라갑니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm4_desc:0 "헌법은 총리가 장관을 제청한다고 적고 있습니다. 지금까지는 이름뿐이었습니다. 정진석 총리가 이 권한을 실제로 쓰겠다고 합니다.\n\n§G좋아함§! §Y행정안전부§!: 장관 자리가 대통령실 입김에서 멀어집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 부총리 위에 총리가 서게 됩니다.\n§R싫어함§! §Y국가정보원§!: 원장 인사에도 총리 입김이 닿을까 걱정합니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm5_desc:0 "국무조정실은 해마다 부처 업무를 평가합니다. 총리실이 이 점수를 다음 해 예산에 반영하자고 합니다. 예산은 [TFRKPHN_mof]의 일입니다.\n\n§G좋아함§! §Y외교부§!: 지난해 평가 점수가 높았습니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 예산 편성에 총리실이 끼어듭니다.\n§R싫어함§! §Y국방부§!: 군 사업은 점수로 재기 어렵습니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm6_desc:0 "부처 대부분은 세종에 있습니다. 외교부와 국방부는 서울에 남았습니다. 총리실이 국무회의를 세종에서 열자고 합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 청사가 세종에 있습니다.\n§R싫어함§! §Y외교부§!: 서울 청사에서 세종까지 오가야 합니다.\n§R싫어함§! §Y국가정보원§!: 보안 통신 설비를 새로 깔아야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm7_desc:0 "총리실 감찰반이 모든 부처의 복무 기강을 살피겠다고 합니다. 감찰을 받는 부처는 달가워하지 않습니다.\n\n§G좋아함§! §Y국가정보원§!: 보안 사고가 줄어든다고 봅니다.\n§R싫어함§! §Y행정안전부§!: 공무원 복무 관리는 행안부 일입니다.\n§R싫어함§! §Y국방부§!: 군에는 군 감찰이 따로 있습니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm8_desc:0 "해외 원조 사업은 총리가 위원장인 위원회를 거칩니다. 총리실이 새 사업을 모두 이 위원회 의결에 부치자고 합니다.\n\n§G좋아함§! §Y국방부§!: 방산 협력과 원조를 묶기 쉬워집니다.\n§R싫어함§! §Y외교부§!: 무상 원조 사업을 마음대로 못 정합니다.\n§R싫어함§! §Y행정안전부§!: 새마을 원조 사업도 의결을 받아야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm9_desc:0 "대테러센터는 총리실 소속입니다. 법을 만들 때 국정원에 두자는 주장도 있었습니다. 총리실이 센터 인력을 늘리겠다고 합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 국정원의 예산 증액 요구가 줄어듭니다.\n§R싫어함§! §Y국가정보원§!: 테러 정보 주도권을 잃습니다.\n§R싫어함§! §Y국방부§!: 군 대테러 부대가 지휘를 받게 됩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_tt_em:0 "§Y기획재정부§! 방기선\n신임 70 이상: 소비재 공장 §G-5%§!\n신임 30 이하: 소비재 공장 §R+2%§!\n\n§Y정부조직법 제30조(기획재정부)§!\n1. 기획재정부장관은 중장기 국가발전전략수립, 경제/재정정책의\n수립/총괄/조정, 예산/기금의 편성/집행/성과관리,\n화폐/외환/국고/정부회계/내국세제/관세/국제금융, 공공기관 관리,\n경제협력/국유재산/민간투자 및 국가채무에 관한 사무를 관장합니다.\n2. 기획재정부에 차관보 1명을 둘 수 있습니다."
 TFRKPHN_dept_tt_em2:0 "§Y재정경제부§! 방기선\n신임 70 이상: 소비재 공장 §G-5%§!\n신임 30 이하: 소비재 공장 §R+2%§!\n\n§Y정부조직법 제30조(재정경제부)§!\n1. 재정경제부장관은 경제정책의 수립/총괄/조정,\n화폐/외환/국고/정부회계/내국세제/관세/국제금융, 공공기관 관리,\n경제협력 및 국유재산에 관한 사무를 관장합니다.\n2. 재정경제부에 차관보 1명을 둘 수 있습니다."
 TFRKPHN_dept_tt_fm:0 "§Y외교부§! 조현동\n신임 70 이상: 외교 관계 개선 속도 §G+20%§!\n신임 30 이하: 외교 관계 개선 속도 §R-10%§!\n\n§Y정부조직법 제33조(외교부)§!\n1. 외교부장관은 외교, 경제외교 및 국제경제협력외교, 국제관계\n업무에 관한 조정, 조약 기타 국제협정, 재외국민의 보호/지원,\n국제정세의 조사/분석에 관한 사무를 관장합니다.\n2. 외교부에 차관보 1명을 둘 수 있습니다."
 TFRKPHN_dept_tt_im:0 "§Y행정안전부§! 이명수\n신임 70 이상: 안정도 §G+5%§!\n신임 30 이하: 안정도 §R-3%§!\n\n§Y정부조직법 제37조(행정안전부)§!\n1. 행정안전부장관은 국무회의의 서무, 법령 및 조약의 공포,\n정부조직과 정원, 상훈, 정부혁신, 행정능률, 전자정부,\n정부청사의 관리, 지방자치제도, 지방자치단체의\n사무지원/재정/세제, 낙후지역 등 지원, 지방자치단체간 분쟁조정,\n선거/국민투표의 지원, 안전 및 재난에 관한 정책의\n수립/총괄/조정, 비상대비, 민방위 및 방재에 관한 사무를\n관장합니다.\n2. 국가의 행정사무로서 다른 중앙행정기관의 소관에 속하지\n아니하는 사무는 행정안전부장관이 이를 처리합니다."
 TFRKPHN_dept_tt_nis:0 "§Y국가정보원§! 김홍균\n신임 70 이상: 적국 공작 효율 §G-20%§!\n신임 30 이하: 적국 공작 효율 §R+10%§!\n\n§Y정부조직법 제17조(국가정보원)§!\n1. 국가안전보장에 관련되는 정보 및 보안에 관한 사무를 담당하기\n위하여 대통령 소속으로 국가정보원을 둡니다.\n2. 국가정보원의 조직/직무범위 그 밖에 필요한 사항은 따로\n법률로 정합니다."
 TFRKPHN_dept_tt_pm:0 "§Y국무총리실§! 정진석\n신임 70 이상: 정치력 획득 §G+10%§!\n신임 30 이하: 정치력 획득 §R-5%§!\n\n§Y정부조직법 제18조(국무총리의 행정감독권)§!\n1. 국무총리는 대통령의 명을 받아 각 중앙행정기관의 장을\n지휘/감독합니다.\n2. 국무총리는 중앙행정기관의 장의 명령이나 처분이 위법 또는\n부당하다고 인정될 경우에는 대통령의 승인을 받아 이를 중지 또는\n취소할 수 있습니다."
 TFRKPHN_e21_category_desc:0 "안철수와 심상정이 단일화를 놓고 협상하고 있습니다. 권한대행 정부는 오른쪽 끝의 집권을 막기 위해 협상을 뒤에서 돕기로 했습니다.\n\n협상 진척도: §Y[?TFRKPHN_e21_uni|0]§! / 100\n\n시한이 끝날 때 §Y50§! 이상이면 §Y제3지대 연합§!이 하나의 후보로 나섭니다. 모자라면 두 사람이 각자 출마하고, 갈라진 표 사이로 §R우리공화당§!이 이깁니다."
 TFRKPHN_e21_uni_tt:0 "§Y제3지대 협상§! 결정이 열립니다. 협상 진척도는 §Y20§!에서 시작합니다(철수의 공세를 골랐으면 §G+20§!, 종북을 막아라를 골랐으면 §R-20§!). §Y35일§! 뒤 §Y50§! 이상이면 단일화가 성사되고, 모자라면 §R우리공화당§!이 대선에서 이깁니다."
 TFRKPHN_e22_116_d:0 "[TFRKP_HN_dpk_name] 후보가 전국을 돌고 있다. 가는 곳마다 민생과 경제 회복을 약속했고, 나라 살림을 맡아 본 경험이 있다는 점을 내세웠다.\n\n[TFRKP_HN_ppp_name] 후보를 겨냥한 말도 빠지지 않았다. 그는 위기에는 해 본 사람이 필요하다고 말했다. 유세장의 분위기는 뜨거웠고, 지지자들이 모이면서 여론이 움직이고 있다."
 TFRKPHN_e22_122_d:0 "경선이 끝나고 이틀 뒤, 홍준표 후보와 이준석 대표가 마주 앉았다.\n\n두 사람은 사이가 나쁘지 않다. 당 대표를 뽑을 때도, 대표와 다른 주자가 부딪쳤을 때도 홍 후보는 이 대표 편에 섰다. 홍 후보가 그 덕을 봤다. 2021년 9월 초 한 여론조사에서 그는 20대에서 26.3을 얻어 여야 주자 가운데 가장 높았고, 젊은 지지자들은 무조건 야권 후보는 홍준표라는 말을 줄여 무야홍이라고 불렀다.\n\n이날 두 사람은 선거대책위원회를 작게 꾸리고 젊은 사람을 앞에 세우기로 했다. 후보의 유세차에 이십 대가 오르게 됐다."
 TFRKPHN_e22_123_d:0 "홍준표 후보는 거침없는 말로 여기까지 왔다. 듣는 사람이 시원하다고 느끼는 말을 그는 골라서 할 줄 안다.\n\n그런데 본선은 경선과 달랐다. 지방 유세에서 [TFRKP_HN_dpk_name] 후보를 두고 한 거친 표현이 그날 저녁 뉴스의 첫머리에 올랐다. 캠프는 앞뒤 맥락을 봐 달라고 했지만 화면에는 그 한 문장만 되풀이해 나왔다.\n\n경선 때 다른 주자가 그를 두고 토론은 주도하는데 내용은 없다고 했던 말이 다시 돌았다. 지지자들은 속이 시원하다고 했고, 아직 마음을 정하지 못한 사람들은 고개를 저었다."
 TFRKPHN_e22_124_d:0 "텔레비전 토론의 주제는 북핵이었다.\n\n홍준표 후보는 미국과 나토 방식으로 핵을 공유해야 한다고 했다. 다섯 해 전부터 해 온 주장이다. 미국이 거절하면 어떻게 하겠느냐는 물음에는, 서독의 슈미트 총리가 핵 개발 뜻을 내비친 뒤에야 미국이 전술핵을 다시 들여놓았다는 이야기를 꺼냈다.\n\n[TFRKP_HN_dpk_name] 후보는 그 길이 비확산 체제를 벗어나는 길이고 우리를 고립시킬 것이라고 받아쳤다. 경선 때 같은 당 주자에게서 들었던 반박과 거의 같았다.\n\n토론이 끝난 뒤 지지층은 환호했다. 핵무장이라는 낱말에 놀란 중도층의 반응은 달랐다."
 TFRKPHN_e22_281_d:0 "신문들이 이낙연 후보의 지난날을 잇달아 싣고 있다.\n\n그는 전남 영광의 가난한 농가에서 일곱 남매의 맏이로 태어났다. 광주제일고와 서울대 법대를 나와 1979년 동아일보에 들어갔고, 도쿄 특파원과 논설위원, 국제부장을 거치며 스물한 해 동안 기자로 일했다. 2000년 총선에서 함평과 영광에 나가 당선되며 정치를 시작했고, 2002년에는 노무현 당선인의 대변인이었다.\n\n2014년에 전남지사가 됐고 2017년에는 문재인 정부의 첫 국무총리가 됐다. 역대 총리 가운데 가장 오래 그 자리에 있었다. 2020년 4월 종로에서 당선됐고 그해 8월 당 대표가 됐다.\n\n기자, 의원, 도지사, 총리, 당 대표를 다 거친 대선 후보는 흔치 않다."
 TFRKPHN_e22_282_d:0 "이낙연 후보의 수도권 유세가 열렸다. 사회자가 이름을 외치고 지지자들이 따라 외쳤다.\n\n후보의 연설은 길고 정확했다. 숫자는 틀리지 않았고 문장은 끝까지 맺었다. 기자였던 사람답게 틀린 말을 하지 않으려 했다.\n\n그러나 박수가 터질 대목이 좀처럼 나오지 않았다. 연설이 끝난 뒤 한 지지자는 맞는 말씀인데 가슴이 뛰지는 않는다고 말했다. 그날 밤에는 [TFRKP_HN_ppp_name] 후보 쪽 유세 영상이 더 많이 돌았다."
 TFRKPHN_e22_283_d:0 "선거 막바지에 한 해 전의 일이 다시 불려 나왔다.\n\n2021년 1월 1일, 당 대표이던 이낙연 후보는 국민 통합을 명분으로 두 전직 대통령의 사면을 대통령에게 건의하겠다고 했다. 당 지지층은 거세게 반발했다. 그는 그해 3월 대표에서 물러나며, 국민의 마음을 더 세밀하게 헤아려야 한다는 아픈 공부가 됐다고 말했다.\n\n상대 진영은 이 일을 다시 꺼내 양쪽에서 두드리고 있다. 보수 쪽에서는 말만 꺼내고 물러선 사람으로, 진보 쪽에서는 그때 사면을 말한 사람으로 본다. 후보는 이미 설명한 일이라고만 답했다."
 TFRKPHN_e22_284_d:0 "이낙연 후보가 대표 공약을 다시 내놓았다. 신복지와 중산층 경제다.\n\n신복지는 소득과 돌봄, 건강, 주거, 고용, 교육, 문화, 환경, 안전의 아홉 영역에서 나라가 보장할 최저 기준을 정하겠다는 구상이다. 중산층 경제는 지금 57인 중산층 비율을 70까지 끌어올리겠다는 약속이다. 한 번에 눈길을 끄는 공약은 아니다.\n\n경선 때는 옛 복지와 무엇이 다르냐는 물음을 받았다. 그래도 얼마를 주겠다는 말보다 어디까지 책임지겠다는 말을 믿는 사람들이 있었고, 중도층의 반응은 나쁘지 않았다."
 TFRKPHN_e22_285_d:0 "정의당 심상정 후보가 대선을 며칠 앞두고 후보에서 물러나 [TFRKP_HN_dpk_name] 후보를 지지하겠다고 밝혔다.\n\n심 후보는 정의당의 대통령 선거는 여기서 멈추지만 진보 정치의 길은 멈추지 않겠다고 말했다. [TFRKP_HN_dpk_name] 후보는 어려운 결단에 감사한다고 답했고, 두 당은 정치 개혁을 함께 추진하겠다는 선언문에 이름을 올렸다.\n\n정의당 안에서는 반발이 나왔다. 완주를 약속하고 모은 표를 어디에 쓰느냐는 것이다. 그래도 근소한 차이로 갈릴 선거에서 이 표가 어디로 가느냐는 작은 일이 아니다."
 TFRKPHN_e22_286_d:0 "유세가 뜨거워지는 가운데 이낙연 후보가 경제를 앞세웠다.\n\n그는 도지사와 총리로 일하며 살림을 맡아 본 사람이라는 점을 내세웠다. 코로나로 가게 문을 닫은 자영업자와 일자리를 찾는 청년에게 필요한 것은 해 본 사람의 손이라고 말했다.\n\n[TFRKP_HN_ppp_name] 후보 쪽은 바로 그 경험을 겨눈다. 집값이 오르던 때에 총리가 누구였느냐는 것이다. 가장 오래 재임한 총리라는 이력은 이 선거에서 그의 자랑이고, 동시에 그가 지고 가야 할 짐이다.\n\n경제를 누가 더 잘 아느냐는 싸움은 선거 날까지 이어질 것으로 보인다."
 TFRKPHN_e22_287_d:0 "선거 전날 밤, 이낙연 후보의 마지막 유세가 서울 도심에서 열렸다.\n\n후보는 목이 쉬어 있었다. 그는 스물한 해 동안 남의 말을 받아 적는 일을 했고, 그 뒤 스무 해는 자기 말에 책임지는 일을 했다고 말했다. 화려한 약속은 하지 않고 지킬 수 있는 것만 말하겠다고도 했다.\n\n연설이 끝나자 그는 연단에서 내려와 앞줄 사람들과 일일이 손을 잡았다. 지지자들은 자리를 뜨지 않고 이름을 연호했다. 앞줄의 한 노인이 쉰 목소리로 외쳤다.\n\n\"낙연아, 내일 꼭 이기라잉!\""
 TFRKPHN_e22_288_d:0 "텔레비전 토론에서 [TFRKP_HN_ppp_name] 후보가 이낙연 후보에게 물었다. 문재인 정부에서 가장 오래 총리를 한 사람으로서 그 정부의 실패에 얼마나 책임이 있느냐는 질문이었다.\n\n이 후보는 잘한 일과 못한 일을 나눠 답하려 했다. 답이 길어졌고 사회자가 시간을 알렸다. 다 계승하겠다고 하면 정권 교체를 바라는 표를 잃고, 다르게 하겠다고 하면 당의 지지층이 서운해한다. 그는 그 사이에서 말을 골랐다.\n\n토론 다음 날 신문들은 그의 답보다 그 질문을 제목에 올렸다."
 TFRKPHN_e22_289_d:0 "부동산 토론에서 이낙연 후보는 자신이 낸 토지독점규제 3법을 설명했다. 2021년 7월 15일에 발의한 법안으로, 서울과 수도권에서 한 사람이 가질 수 있는 택지를 1,320제곱미터, 사백 평쯤으로 묶는 내용이다.\n\n[TFRKP_HN_ppp_name] 후보는 법안을 제쳐 두고 후보의 땅을 물었다. 이 후보가 서울 평창동과 전남 영광에 천 평이 넘는 땅을 갖고 있다는 보도가 경선 때 나왔기 때문이다. 이 후보 쪽은 영광 땅은 물려받은 것이고 모두 적법하게 얻었다고 설명해 왔다.\n\n설명은 틀리지 않았다. 그래도 상한을 말하는 후보가 자기 땅을 해명하는 장면이 화면에 남았다."
 TFRKPHN_e22_290_d:0 "에너지 토론에서 [TFRKP_HN_ppp_name] 후보가 물었다. 문재인 정부의 탈원전 정책을 그대로 이어 갈 것이냐는 질문이었다.\n\n이낙연 후보는 그 정부에서 총리를 지냈다. 그는 원전을 수십 년에 걸쳐 천천히 줄여 가자는 정책이라고 답했다. 상대는 짓다가 멈춘 원전은 어떻게 할 것이냐고 다시 물었고, 이 후보는 공론을 거쳐 정하겠다고 답했다.\n\n신중한 답이었다. 그러나 전기 요금 고지서를 받아 든 시청자들은 분명한 답을 기다리고 있었고, 두 번 모두 미루는 말로 들었다."
 TFRKPHN_e22_81_d:0 "삼성생명에서 과장으로 일하는 김정훈은 개표 결과가 대형 화면에 뜨는 순간 자기도 모르게 주먹을 쥐었다. 당원 투표에서는 밀릴 것이라는 전망이 우세했지만, 홍준표는 그 전망을 뒤집고 국민의힘 대선 후보가 되었다.\n\n경선 내내 그는 당내 세력에 기대지 않겠다는 말을 되풀이했다.\n\n\"제가 당내 당대표 경선 3번, 도지사 경선, 대선 후보 경선 등 참 많이 해봤다. 그 때마다 당협위원장이나 국회의원들을 줄세우기 하지도 않았다\"\n\n상대 후보를 겨냥한 말도 있었다. 대통령은 경험이 있어야 한다는 것이다.\n\n\"우리나라 대선 구도를 보면 초보자가 나와서 된 적도 없고 초보자가 나와서는 나라 경영하기가 어렵다\"\n\n김정훈은 휴대폰으로 가족 단체방에 짧게 적었다. 이번에는 정말 바뀔지도 모른다고."
 TFRKPHN_ge22_wait_tt:0 "제22대 국회의원 총선거가 다가와야 합니다."
