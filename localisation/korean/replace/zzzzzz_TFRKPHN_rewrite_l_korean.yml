 TFRKPHN_le_bio_g2:0 "£GFX_KOR_PPP_texticon §Y한동훈§!  새 후보\n§Y출생:§! 1973년, 서울\n§Y학력:§!\n현대고등학교, 서울대학교 법과대학, 미국 컬럼비아대학교 로스쿨\n§Y이력:§!\n1995년 사법시험에 합격했습니다(사법연수원 27기). 공군 법무관을\n마치고 서울, 천안, 부산의 검찰청에서 검사로 일했고 대검찰청 중앙수사부\n검찰연구관을 지냈습니다. 2019년 대검찰청 반부패강력부장에 올랐습니다.\n§Y눈에 띄는 일:§!\n2019년 검사장이 됐을 때 역대 가장 젊은 검사장이었습니다.\n \n§Y이 세계에서는:§!\n3선 제한으로 물러나는 박형준 시장의 뒤를 잇는 여당의 새 후보입니다."
