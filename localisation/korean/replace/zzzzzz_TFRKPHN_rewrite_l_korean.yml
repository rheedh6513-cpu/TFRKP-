 TFRKPHN_le_bio_o10:0 "£GFX_KOR_DemocraticParty_texticon §Y우상호§!  도전\n§Y출생:§! 1962년 12월 12일\n§Y학력:§!\n연세대학교 국어국문학과\n§Y이력:§!\n1987년 연세대학교 총학생회장을 지냈습니다. 2000년 서울 서대문구\n갑 총선에서 낙선했고 2004년 같은 곳에서 제17대 국회의원에\n당선됐습니다. 열린우리당과 민주당의 대변인을 지냈습니다. 2012년과\n2016년에 당선됐고 2016년 더불어민주당 원내대표를 맡았습니다.\n2020년 4선에 올랐고 2021년 서울시장 후보 경선에 나섰다가\n졌습니다.\n§Y눈에 띄는 일:§!\n1987년 6월 항쟁 때 숨진 후배 이한열의 장례식에서 집행위원장을\n맡았습니다.\n \n§Y이 세계에서는:§!\n야당의 강원도지사 후보입니다."
