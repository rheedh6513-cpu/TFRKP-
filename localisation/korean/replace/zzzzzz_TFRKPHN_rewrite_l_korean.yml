 # [안내] 문체를 다시 쓴 글 (rewrite_build.py). 원래 글은 각 빌더에 남아 있고 이 파일이 덮는다.
 KOR_NatAsm_diagram_tt:0 "§8국회 원내 구성§!\n§3민주당계§!: [?KOR_NatAsm_DP_seats]석\n§A보수정당§!: [?KOR_NatAsm_PPP_seats]석[TFRKPHN_NA_orp_line]\n§d진보정당§!: [?KOR_NatAsm_JP_seats]석\n§O제3지대§!: [?KOR_NatAsm_PP_seats]석\n§g무소속§!: [?KOR_NatAsm_Ind_seats]석"
 KOR_TFRKPHN_kang_sin_chul_desc:0 "§Y임관:§! §L육군사관학교 46기§!\n\n§L강신철은 작전과 국방개혁 업무를 모두 맡아 본 육군 장성입니다. 문재인 정부에서 국가안보실 국방개혁비서관으로 군 구조와 제도 개혁을 담당했습니다. 정부가 바뀐 뒤에는 합동참모본부 작전본부장에 기용되었습니다. 2023년 10월 대장으로 진급해 PDTO연합군 부사령관이 되었습니다.§!"
 KOR_TFRKPHN_kim_myung_soo_desc:0 "§Y임관:§! §L해군사관학교 43기§!\n\n§L김명수는 해군 작전 분야에서 주로 근무했습니다. 해군작전사령관으로 3개 함대와 잠수함, 항공 전력을 지휘했습니다. 2023년 10월 합동참모의장에 발탁되었습니다. 해군 출신 합참의장은 최윤희 대장에 이어 두 번째입니다.§!"
 KOR_TFRKPHN_ko_chang_jun_desc:0 "§Y임관:§! §L육군3사관학교 26기§!\n\n§L고창준은 육군3사관학교 출신입니다. 제37보병사단장으로 후방 지역 방위를 지휘했습니다. 이후 모교인 육군3사관학교의 교장을 맡았습니다. 수도군단장을 거쳐 2023년 10월 대장으로 진급했습니다. 지금은 육군 제2작전사령관입니다. 육사를 나오지 않고 4성 장군에 올랐습니다.§!"
 KOR_TFRKPHN_lee_young_soo_desc:0 "§Y임관:§! §L공군사관학교 38기§!\n\n§L마산고등학교를 졸업하고 1990년 공군사관학교 38기로 임관했습니다. 2005년 공군이 F-15K를 처음 도입할 때 첫 조종사 가운데 한 명으로 뽑혔습니다. 괌에서 한반도까지 기체를 직접 몰고 왔습니다. 이후 전투비행 부대와 공군 작전 부서를 거쳤습니다. 합동참모본부 전략기획본부장으로 군사전략과 전력 기획을 총괄했습니다. 2023년 10월 F-15K 조종사 출신으로는 처음 공군참모총장에 올랐습니다.§!"
 KOR_choo_kyung_hoo_EM_desc:0 "출생: 1960년 대한민국 경상북도 달성\n\n이력: 대한민국의 기획재정부 장관\n추경호는 1987년 경제기획원에서 공직을 시작했습니다. 금융위원회 부위원장을 지냈고 2013년 기획재정부 제1차관, 이듬해 국무조정실장이 되었습니다. 2016년 고향 달성에서 국회의원에 당선된 뒤 내리 당선되었습니다.\n\n취임 선서가 끝나면 홍준표 대통령은 새 내각의 명단을 발표합니다. 그때까지 이 자리를 지킵니다."
 KOR_copreation_of_chaebols_desc:0 "\n\n\n\n£GFX_banner_TFRKPHN_chb_coop\n\n\n\n\n\n재벌은 이제 우리의 통제 아래에 있습니다. 그들은 더 이상 자기들 멋대로 독주하지 않을 것이며, 교활한 술책을 일삼으며 주주권을 행사하지도 않을 것입니다. 이제 우리 사회의 일원으로서 공정한 경쟁을 통해 건전한 성장을 이뤄나갈 것입니다. 대한민국도, 그들 자신도."
 KOR_han_duck_soo_HM_desc:0 "출생: 1949년 대한민국 전라북도 전주\n\n이력: 대한민국의 국무총리\n한덕수는 경제 부처에서 오래 일한 관료입니다. 2005년 경제부총리를 지냈고 2007년 국무총리가 되었습니다. 2009년부터 세 해 동안 주미국 대사를 지냈고, 그 뒤 한국무역협회 회장을 맡았습니다.\n\n취임 선서가 끝나면 홍준표 대통령은 새 내각의 명단을 발표합니다. 그때까지 이 자리를 지킵니다."
 KOR_kim_seung_han_IntelM_desc:0 "출생: 1960년 대한민국\n\n이력: 대한민국의 국가정보원장\n김성한은 고려대학교 영문학과를 나와 텍사스 대학교에서 정치학 박사 학위를 받았습니다. 외교안보연구원에서 열세 해 동안 미국을 연구했고 미주연구부장을 지냈습니다. 2007년 고려대학교 국제대학원 교수가 되었고, 2012년부터 한 해 동안 외교통상부 제2차관을 지냈습니다.\n\n취임 선서가 끝나면 홍준표 대통령은 새 내각의 명단을 발표합니다. 그때까지 이 자리를 지킵니다."
 KOR_lee_in_je_char_desc:0 "이인제는 대한민국의 제21대 대통령입니다.\n\n1948년 충청남도 논산에서 소작농의 아들로 태어났습니다. 서울대학교 법과대학을 나와 판사와 노동 변호사로 일했습니다. 1988년 김영삼의 통일민주당 소속으로 국회에 들어갔습니다. 1993년 김영삼 정부의 첫 노동부 장관이 되어 고용보험 도입을 이끌었고, 1995년 첫 민선 경기도지사에 당선되었습니다.\n\n1997년 신한국당 경선에서 이회창에게 지자 탈당해 대선에 나섰고 19.2%로 3위를 했습니다. '경선 불복'이라는 꼬리표가 그때 붙었습니다. 2002년 민주당 경선에서는 노무현에게 밀렸고, 2007년 대선에서는 0.68%에 그쳤습니다. 그 사이 6선 의원이 되었습니다.\n\n당적은 이렇게 옮겼습니다. 1987년 통일민주당, 1990년 민주자유당, 이어서 신한국당, 1997년 국민신당, 1998년 새정치국민회의, 2000년 새천년민주당, 2002년 자유민주연합, 2006년 국민중심당, 2007년 민주당, 2008년 통합민주당을 나와 무소속, 2011년 자유선진당, 2012년 선진통일당과 새누리당, 그 뒤 자유한국당, 미래통합당, 국민의힘. 무소속까지 합쳐 열일곱 개입니다.\n\n2016년 총선, 2017년 자유한국당 경선, 2018년 충남지사 선거에서 내리 졌습니다. 그래도 그는 번번이 다시 출마했고, 사람들은 불사조에 빗대 그를 피닉제라고 불렀습니다.\n\n불사조는 또 한 번 돌아왔습니다. 경선에서 자신을 꺾었던 홍준표의 정부에서 국무총리를 지냈고, 2027년 대선에서 이겼습니다. 처음 대권에 도전한 지 30년 만입니다. 그는 취임사에서 일자리 이야기를 가장 길게 했습니다."
 KOR_lee_jung_sub_TM_desc:0 "출생: 1960년 대한민국 경상북도 영천\n\n이력: 대한민국의 국방부 장관\n이종섭은 육군사관학교를 나와 1984년 임관했습니다. 2017년 합동참모본부 차장이 되었고 2019년 중장으로 전역했습니다.\n\n취임 선서가 끝나면 홍준표 대통령은 새 내각의 명단을 발표합니다. 그때까지 이 자리를 지킵니다."
 KOR_lee_sang_min_IM_desc:0 "출생: 1964년 대한민국 전라북도 익산\n\n이력: 대한민국의 행정안전부 장관\n이상민은 서울대학교 법과대학을 나와 판사로 일했습니다. 법복을 벗은 뒤에는 변호사로 일했습니다.\n\n취임 선서가 끝나면 홍준표 대통령은 새 내각의 명단을 발표합니다. 그때까지 이 자리를 지킵니다."
 KOR_oh_se_hoon_char_desc:0 "오세훈은 대한민국의 제21대 대통령입니다.\n\n1961년 서울 성수동에서 태어났습니다. 대일고를 나와 한국외국어대에 들어갔다가 고려대 법대로 옮겼고, 1984년 제26회 사법시험에 합격했습니다. 변호사 시절 아파트 일조권 피해보상 재판에서 주민 쪽을 맡아 이름이 알려졌고, 1994년에는 텔레비전 생활법률 프로그램을 진행했습니다.\n\n2000년 총선에서 서울 강남을에 당선되며 정치를 시작했습니다. 2006년 서울시장 선거에서 61.1을 얻어 당선됐고 2010년에는 0.6포인트 차이로 재선했습니다. 2011년 8월 무상급식 주민투표가 투표율 25.7로 개표 기준에 못 미치자 시장직에서 물러났습니다. 그 뒤 2016년과 2020년 총선에서 잇달아 졌습니다.\n\n2021년 4월 7일 보궐선거에서 이겨 열 해 만에 시청으로 돌아왔습니다. 2027년 3월 3일 대통령 선거에서 당선되어 홍준표의 뒤를 이었습니다.\n\n그의 정부는 전쟁이 끝난 나라의 집과 일자리부터 손대려 합니다. 서울시장 시절의 주택 공급과 약자와의 동행을 나라 전체로 넓히는 것이 그의 첫 계획입니다. 휴전선 너머에서는 무너진 북쪽의 도시들을 다시 세우는 일이 기다립니다.\n\n홍준표 정부가 남긴 비상 조치들은 아직 다 걷히지 않았습니다. 그는 그것을 하나씩 걷어 내겠다고 약속했습니다. 2011년 주민투표에 시장직을 걸었다가 물러났던 그는 지금도 큰일을 국민에게 직접 묻는 쪽을 좋아합니다."
 KOR_park_jin_FM_desc:0 "출생: 1956년 대한민국 서울특별시\n\n이력: 대한민국의 외교부 장관\n박진은 1977년 외무고시에 합격했고 옥스퍼드 대학교에서 정치학 박사 학위를 받았습니다. 김영삼 정부 청와대에서 비서관으로 다섯 해를 일했습니다. 서울 종로에서 세 번, 강남에서 한 번 국회의원에 당선되었고 제18대 국회에서 외교통상통일위원장을 맡았습니다.\n\n취임 선서가 끝나면 홍준표 대통령은 새 내각의 명단을 발표합니다. 그때까지 이 자리를 지킵니다."
 PRK_pak_jong_chon_desc:0 "박정천은 조선인민군 포병 출신의 군인이다. 2012년 포병사령관으로 김정은의 서해 최전방 방어대 시찰에 동행하며 이름을 알렸다. 2019년 9월에는 포병 출신으로는 이례적으로 조선인민군 총참모장에 올랐다. 2020년에는 차수를 거쳐 원수 칭호까지 받았다. 김정은 정권의 대표적인 군부 실세로 떠올랐다.\n\n그의 길이 순탄하기만 했던 것은 아니다. 2021년 방역 실패의 책임을 지고 원수에서 차수로 강등되었다. 그러나 곧바로 당 정치국 상무위원으로 복귀했다. 2023년 초에는 당 중앙군사위원회 부위원장에서 갑작스럽게 물러났다. 그해 말 다시 그 자리로 돌아왔다. 몇 번을 떨어져도 그는 매번 군부 꼭대기로 돌아왔다.\n\n김정은의 죽음 이후 가장 먼저 움직인 인물도 박정천이었다. 그는 김정은이 쓰러지자마자 군권을 앞세워 김여정과 최룡해 등을 숙청하려 했다. 그러나 평양으로의 무리한 병력 이동은 군 내부의 반발을 불렀다. 수도를 메운 장갑차와 포성은 주민들을 걷잡을 수 없이 동요시켰다.\n\n쿠데타는 실패했고 그의 생사는 확인되지 않는다. 평양 한복판에서는 시민과 군이 들고일어났고, 그 틈을 타 대한민국까지 들어왔다. 북조선은 네 갈래로 찢어졌다. 그 첫 총성을 울린 사람이 박정천이었다."
 TFRKPHN_EL_KIS_TT_FJ:0 "§W민족의 배신자:§! 김일성\n\n\n\n\n\n\n\n\n\n\n   £GFX_PRK_eternal_leader_kim_il_sung\n\n\n\n\n\n\n\n\n\n\n-------------------------------------\n§L김일성(본명 김성주)은 1912년 4월 15일 평안남도 대동군 만경대에서 태여났습니다. 평양당국은 그의 집안을 \"애국적인 혁명가문\"으로 꾸며내였으나, 그 력사의 대부분은 우상화를 위해 날조되거나 부풀려진것입니다.\n\n그는 1930년대 만주에서 중국공산당이 이끈 동북항일련군의 한 지휘관으로 활동하다가 일본군의 토벌에 쫓겨 1940년 쏘련 땅으로 달아났습니다. 평양당국이 떠벌이는 \"조선인민혁명군\"과 \"20성상의 항일혁명투쟁\"은 그를 신격화하기 위해 만들어낸 거짓말입니다.\n\n조선을 일제로부터 해방한것은 김일성이 아니라 련합국과 대한민국 림시정부였습니다. 그는 1945년 9월 쏘련군 대위의 군복을 입고 원산항으로 들어와 쏘련군정의 비호밑에 권력을 잡았으며, 조선로동당과 정권을 세워 북녘땅에 공산독재의 뿌리를 내리였습니다.\n\n1950년 6월 25일 \"미제의 침공\"이라는 그의 주장은 새빨간 거짓입니다. 김일성은 스딸린의 승인과 모택동의 지원을 받아 38선 전역에서 남침을 감행하였으며 3년간의 전쟁으로 수백만 동포가 목숨을 잃고 수많은 리산가족이 생겨났습니다. 전쟁뒤에도 그는 정적들을 모조리 숙청하고 1.21 청와대습격과 판문점도끼만행을 저지르며 남녘을 끊임없이 위협하였다.§!\n\n§H\"개인의 자유가 없는 사회주의는 감옥에 불과하다.\"\n\"북한 정권은 인민을 위한 정권이 아니라, 오직 김씨 일가의 개인 왕조를 유지하기 위한 집단이다.\"\n- 황장엽§!"
 TFRKPHN_EL_KJI_TT_FJ:0 "§W민족의 배신자:§! 김정일\n\n\n\n\n\n\n\n\n\n\n   £GFX_PRK_eternal_leader_kim_jong_il\n\n\n\n\n\n\n\n\n\n-------------------------------------\n§L김정일은 1942년 2월 16일 쏘련 하바롭스크 린근의 군사야영지에서 태여났으며 어린시절 이름은 \"유라\"였습니다. 평양당국이 내세우는 \"백두산밀영 출생\"과 상서로운 징조들은 그의 세습을 정당화하기 위해 지어낸 신화에 지나지 않습니다.\n\n1994년 권력을 물려받은 그는 \"선군정치\"를 내세워 나라의 모든 자원을 군대와 핵무기 개발에 쏟아부었습니다. 그 대가로 1990년대 중후반 \"고난의 행군\" 대기근때 수십만에서 수백만으로 추산되는 인민들이 굶어죽었으나, 그는 외국산 고급꼬냐크와 사치품으로 호화로운 생활을 이어간것으로 알려져있습니다.\n\n그는 \"온 사회의 김일성주의화\"를 내걸고 아버지를 신으로 떠받드는 우상숭배를 온 사회에 강요하였으며, 이를 거스르는 사람들은 일가족까지 정치범수용소로 끌려갔습니다. 2014년 유엔 북조선인권조사위원회는 이 수용소의 참상을 반인도범죄로 규정하였습니다.\n\n평양당국은 그가 6.15공동선언과 10.4선언으로 \"자주통일의 새시대\"를 열었다고 선전하지만, 그는 1983년 아웅산폭탄테로와 1987년 대한항공 858편 폭파의 배후로 지목되였고 일본사람과 남녘사람들을 랍치하였으며 2006년과 2009년 핵시험을 강행하였다.§!\n\n§H\"정치범수용소는 북한이라는 거대한 감옥 축소판이다. 그곳에서 인간의 존엄성은 배고픔과 폭력 앞에 철저히 부서진다.\"\n\"북한 정권을 옹호하는 것은 그 정권 아래서 신음하는 2천만 주민들의 고통 외면하는 방관 행위이다.\"\n- 강철환§!"
 TFRKPHN_KHS_TT_FJ:0 "§W자유조선이 지킨 사람§!\n\n\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_kim_han_sol_big\n\n\n\n\n\n\n\n            김한솔\n\n\n§L김한솔은 김정은의 이복형 김정남의 아들입니다. 어릴 때 북한을 떠나 마카오 등지에서 자랐고, 2011년 보스니아 헤르체고비나의 유나이티드월드칼리지 모스타르에 입학했습니다. 2012년 핀란드 방송과의 인터뷰에서는 북한 주민의 생활이 나아지도록 돕고 싶다고 말했습니다.\n\n2017년 2월 아버지 김정남이 쿠알라룸푸르 공항에서 숨진 뒤, 3월 8일 천리마민방위가 올린 영상에 나와 무사히 피신했다고 밝혔습니다. 천리마민방위는 뒤에 자유조선으로 이름을 바꾸었습니다.\n\n그 뒤로 알려지지 않았던 그의 행방은 자유조선이 평양으로 향하면서 드러났습니다. 그는 자리를 맡지 않은 채 자유조선 정부 곁에 머물고 있습니다.§!"
 TFRKPHN_NA_orp_desc:0 "£GFX_TFRKPHN_orp_texticon §W우익 정당§!\n\n\n\n\n£GFX_TFRKPHN_orp_banner_texticon\n\n\n\n\n\n£GFX_TFRKPHN_orp_texticon §W우익 정당§!§L들은 박근혜 전 대통령 탄핵에 반대한 태극기 집회를 기반으로 등장한 정당들입니다. 이들은 보수 정당보다 더 강한 반공과 안보를 내세우며, 원내에서 보수 정당과 따로 움직입니다.§!\n§W------------§!\n§W원내 우익 정당 목록§!\n[TFRKPHN_NA_orp_member]"
 TFRKPHN_PREMIER_TT_FJ:0 "§W자유조선 정부의 대표§!\n\n\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_premier_park_choong_kwon\n\n\n\n\n\n\n\n            박충권\n\n\n§L1986년 함경남도에서 태어난 박충권은 평양 국방종합대학을 졸업한 공학도 출신입니다. 2009년 탈북해 대한민국에 들어왔습니다. 서울대학교에서 재료공학 박사학위를 받았습니다. 서울대 재료공학연구소와 현대제철 연구개발본부에서 연구원으로 일했습니다.\n\n2024년 제22대 총선에서 비례대표로 국회에 들어갔습니다. 조명철, 태영호, 지성호에 이은 네 번째 탈북민 출신 국회의원입니다. 북녘의 무기 개발 교육을 직접 받은 과학자가 이제 자유조선의 정부를 이끕니다.§!"
 TFRKPHN_adrian_hong_chang_char_desc:0 "홍으뜸은 자유조선(천리마민방위)의 중요 인물 중 하나입니다. 그는 본래 에이드리언 홍 창이라는 이름으로 알려졌습니다. 해방된 조선을 위해 싸우기로 하면서 한국식 이름인 홍으뜸으로 바꾸었습니다. 미국에서 대학을 다니던 시절 북한 인권 문제에 관심을 가졌습니다. 재학 중 북한 인권단체 링크(LiNK)를 함께 세웠습니다.\n\n오랫동안 그는 북한 바깥에서 북녘 동포들의 자유를 외쳐 왔습니다. 김정은이 죽자 그는 서북부로 들어가 자유조선군의 깃발을 올렸습니다."
 TFRKPHN_allyfac_category_desc:0 "시장이나 도지사가 지금 정부와 같은 당인 지역에는 중앙정부 사업이 빨리 들어갑니다. 지도에서 §Y여당 단체장§! 표시가 붙은 지역을 골라 공장을 들일 수 있습니다. 정치력과 함께 공사 기간 동안 민수공장 1개가 묶입니다. 한 번에 한 곳만 진행되고, 같은 지역은 1년 뒤에 다시 할 수 있습니다."
 TFRKPHN_amend_d_term_desc:0 "5년 단임제는 장기 집권을 막으려고 만든 장치였지만, 임기 후반마다 레임덕을 불렀습니다. 대통령 임기를 4년으로 줄이고 한 번 더 국민의 평가를 받게 하면, 정책은 이어지고 책임은 분명해집니다.\n\n그런데 §Y헌법 제128조 제2항§!에 따라 이 개헌은 제안 당시의 대통령에게는 효력이 없습니다. 4년 중임제는 §Y다음 정권부터§! 적용됩니다."
 TFRKPHN_bamboo_curtain_desc:0 "1949년 10월 1일 베이징에서 중화인민공화국이 세워졌습니다. 그해 12월 중화민국 정부는 타이베이로 옮겨 갔습니다. 한반도에는 한 해 전에 두 정부가 들어서 있었습니다. 이듬해 6월에 한국전쟁이 일어났습니다. 동아시아는 그 몇 해 사이에 둘로 갈렸습니다.\n\n사람들은 유럽의 철의 장막에 빗대어 그 경계를 죽의 장막이라고 불렀습니다. 중국을 비롯한 동아시아의 공산 국가들과, 일본과 한국과 대만과 파키스탄 같은 그 바깥 나라들을 가르는 선이었습니다. 미국과 중국이 가까워진 뒤로 이 말은 거의 쓰이지 않았습니다.\n\nPDTO의 공동성명과 베이징의 성명이 같은 날 나왔습니다. 신문들은 오래된 그 말을 다시 꺼냈습니다. 장막의 양쪽에서 대사관 직원들이 짐을 싸고 있습니다."
 TFRKPHN_bang_ki_sun_EM_desc:0 "출생: 1965년 대한민국\n\n이력: 대한민국의 기획재정부 장관\n방기선은 1990년 제34회 행정고시에 합격했습니다. 경제기획원에서 공직을 시작해 기획예산처와 기획재정부 예산실을 거쳤습니다. 2017년 정책조정국장, 2019년 차관보를 맡았습니다. 2021년에는 아시아개발은행 상임이사로 나갔습니다. 2022년 기획재정부 제1차관이 되었고, 이듬해 국무조정실장에 올랐습니다.\n\n이인제 대통령은 전쟁 빚을 2년 안에 갚겠다고 약속했습니다. 그 약속을 숫자로 바꾸는 일이 방기선의 몫입니다. 그는 예산을 짜 본 사람이고 부처 사이를 조정해 본 사람입니다."
 TFRKPHN_bj_op_strike_tt:0 "§Y합동 타격 훈련을 한다§!\n고른 기지의 전투기가 육군과 같은 표적을 치는 훈련을 합니다.\n\n비용: £pol_power §Y10§!\n고른 부대의 태세 §G+35§!\n§g같은 부대에는 20일 동안 다시 할 수 없습니다. 다른 부대에는 바로 할 수 있습니다.§!"
 TFRKPHN_bo_category_desc:0 "우원식 정부는 새로 짓지 않습니다. 남은 네 기둥이 무너지지 않게 붙들고 있다가 다음 정부에 넘깁니다.\n기둥은 달마다 깎이고, 넘겨받은 값보다 높이 올릴 수 없습니다. 평균이 50을 넘는 만큼 안정도가 오르고 밑돌면 내려갑니다. 기둥 하나가 §R20§! 아래로 떨어지면 달마다 안정도가 깎입니다.\n§Y정부가 끝나는 날 남은 값을 다음 정부가 그대로 넘겨받습니다.§!"
 TFRKPHN_busan_han:0 "\n\n\n\n                    §Y부산광역시장§!\n\n\n                    §Y집권 정당§!\n£GFX_TFRKPHN_gvp_KOR_han_dong_hoon\n                    £GFX_KOR_PPP_texticon §A국민의힘§!\n\n\n\n\n\n\n"
 TFRKPHN_by_b2_tt:0 "§Y구청장과의 만남§!\n후보가 이 생활권의 구청들을 찾아 구청장과 마주 앉습니다. 여당 구청장이면 구청이 함께 움직여 줍니다.\n\n정치력 §R-15§!\n고른 생활권의 구마다 여당 지지도 §G+2§!\n여당 구청장이 있는 구는 §G+3§!\n\n먼저 지도에서 생활권을 골라야 합니다. 한 번 누르면 사흘 뒤에 다시 누를 수 있습니다."
 TFRKPHN_by_b3_tt:0 "§Y지역 사업 약속§!\n이 생활권이 바라던 사업을 시장이 되면 하겠다고 약속합니다. 맞닿은 생활권에도 소문이 납니다.\n\n정치력 §R-25§!\n고른 생활권의 구마다 여당 지지도 §G+2§!\n맞닿은 생활권의 구마다 §G+1§!\n\n먼저 지도에서 생활권을 골라야 합니다. 한 번 누르면 사흘 뒤에 다시 누를 수 있습니다."
 TFRKPHN_by_b4_tt:0 "§Y재개발 약속§!\n묶여 있던 재개발과 재건축을 풀겠다고 약속합니다. 이기면 그 약속을 지켜야 합니다.\n\n정치력 §R-30§!\n고른 생활권의 구마다 여당 지지도 §G+3§!\n선거에서 이기면 우리가 가진 모든 지역의 건물 칸이 한 번 §G+1§! 늘어납니다 (약속을 몇 번 해도 한 번).\n\n먼저 지도에서 생활권을 골라야 합니다. 한 번 누르면 사흘 뒤에 다시 누를 수 있습니다."
