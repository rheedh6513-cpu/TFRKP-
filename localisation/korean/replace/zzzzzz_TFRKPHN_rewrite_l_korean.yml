 TFRKPHN_le_bio_o15:0 "£GFX_KOR_DemocraticParty_texticon §Y오중기§!  새 후보\n§Y출생:§! 1967년 7월 23일, 경상북도 포항\n§Y학력:§!\n대동고등학교, 영남대학교 철학과\n§Y이력:§!\n1995년부터 한국일보, 2002년부터 동아일보에서 일했습니다.\n2007년 보건복지부 장관 특별보좌관을 지냈고 2008년부터 민주당\n포항시 북구 지역위원장을 맡았습니다. 2012년 민주통합당\n경북도당위원장이 됐고 2012년과 2017년 대통령 선거에서 문재인\n후보의 경북 선거대책위원회 상임위원장을 맡았습니다. 2017년 청와대\n균형발전비서관실 선임행정관을 지냈고 2018년 경북도지사 선거에 나섰다가\n낙선했습니다.\n§Y눈에 띄는 일:§!\n포항 죽도시장에서 과일과 해산물 도매를 하던 상인의 아들입니다.\n \n§Y이 세계에서는:§!\n야당의 경북도지사 후보입니다."
