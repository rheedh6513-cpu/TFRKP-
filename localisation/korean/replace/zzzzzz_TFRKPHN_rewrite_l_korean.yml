 tfrkphn.469.d:0 "유승민이 청와대에 다녀갔다는 기사가 오후에 났고, 그날 저녁 홍준표 전 대통령이 페이스북에 글을 올렸습니다.\n\n글은 여덟 줄이었습니다. 첫 줄은 이인제 대통령이 누구 덕분에 그 자리에 앉았느냐는 물음이었고, 이어서 홍준표는 자신이 전쟁을 치르고 물려준 정부의 집무실에 유승민이 들어갔다고 썼습니다.\n\n그는 옛일을 차례로 꺼냈습니다. 2011년에 유승민이 최고위원 자리를 던지는 바람에 자신이 당 대표에서 물러났고, 2017년 대선에서는 유승민이 보수 표를 갈랐다는 것이었습니다. 이번 재벌개혁안도 그때 자신이 정의당 공약과 비슷하다고 했던 바로 그 안이라고 했습니다.\n\n마지막 줄은 짧았습니다. 사람을 쓰는 일은 대통령의 몫이라고 하면서도, 유승민을 쓰려거든 자기 이름은 빼라고 했습니다.\n\n글은 한 시간 만에 기사 수십 건이 됐고 여당 의원들의 전화가 밤새 비서실로 걸려 왔습니다. 유승민은 다음 날 기자들을 만나서도 재벌개혁안 이야기만 했습니다."
 tfrkphn.470.story:0 "경기도 시흥, 시화공단 끝자락의 금형 공장.\n\n오전 열 시에 사장 김씨의 휴대폰이 울렸다. 모르는 번호였는데 받아 보니 대기업 구매팀 과장이라고 했다.\n\n김씨는 삼십 년 동안 그런 전화를 한 번도 받아 본 적이 없었다. 늘 사이에 회사가 하나 끼어 있었기 때문이다. 회장 조카가 차린 그 회사는 직원이 넷이고 기계는 없었는데, 일감을 받아 김씨에게 넘기면서 단가의 이 할을 떼어 갔다.\n\n\"입찰 공고 보셨습니까. 이번부터는 직접 받습니다.\"\n\n그 회사는 지난달에 문을 닫았다. 총수 일가가 개인회사를 세우지 못하게 한 법이 시행된 달이었다.\n\n전화를 끊은 김씨는 견적서 양식을 꺼내 단가 칸에 처음으로 이 할을 빼지 않은 자기 숫자를 적었다.\n\n창밖에서는 프레스 소리가 났다. 직원은 열일곱 명으로 늘었고, 박 반장은 정년을 두 해 넘기고도 나와 있었다.\n\n\"박 반장! 사람 둘 더 뽑아야겠어.\"\n\n\"일감이 그만큼 됩니까, 사장님?\"\n\n\"되게 써냈어. 떨어지면 내가 삼겹살 사고, 붙으면 자네가 사.\"\n\n박 반장이 장갑을 벗으며 웃었다.\n\n\"어느 쪽이든 삼겹살이네요.\"\n\n김씨는 견적서를 봉투에 넣고 겉에 금요일 입찰 마감 날짜를 적었다."
 tfrkphn.471.d:0 "국군 선두 부대가 대동강을 건넜습니다.\n\n평양 시내에는 총소리가 드물었고 김일성광장의 주석단은 비어 있었습니다. 만수대 언덕의 동상 앞에 이북5도위원회 깃발을 든 병사 몇이 서 있는 동안, 사람들은 아파트 창문으로 내다보기만 할 뿐 거리로 나온 이는 적었습니다.\n\n국군은 1950년 10월 19일에도 평양에 들어갔지만 그해 12월에 물러났습니다. 오늘 들어간 부대는 평양역에 보급소를 차리고 대동강 다리마다 초소를 세웠습니다."
 tfrkphn.472.d:0 "이북5도위원회가 평양에서 마지막 회의를 열었습니다.\n\n안건은 위원회가 다스리던 땅과 군대를 대한민국 정부에 넘기는 안 하나였고, 반대는 없었습니다. 위원들은 회의록에 서명한 다음 깃발을 내렸습니다.\n\n이북5도위원회는 1949년에 생긴 기구로, 대통령이 북쪽 다섯 도의 도지사를 임명해 두는 곳이었습니다. 그 도지사들은 70년 넘게 자기 도에 한 번도 가 보지 못했는데, 오늘 임명된 도지사 다섯은 내일 아침 임지로 떠납니다."
 tfrkphn.473.d:0 "정부가 대한민국 헌법이 한반도 전역에 시행된다고 공포했다.\n\n이인제 대통령이 판문점에서 공포문에 서명하자 군사분계선 표지판이 그날 오후부터 뽑히기 시작했다. 1953년에 세운 표지판은 1,292개였지만 남아 있는 것은 그보다 훨씬 적었다.\n\n서울역 전광판에는 평양행 열차 시간표가 올라왔고, 첫 열차는 다음 달로 잡혔다. 북쪽의 주민등록과 화폐, 학교와 병원이 내일부터 정부의 일이 되기 때문에 행정안전부는 공무원 3천 명을 먼저 올려 보내기로 했다."
 tfrkphn.474.d:0 "특별수사팀이 한 그룹의 재무팀에서 장부를 압수했습니다.\n\n장부에는 전쟁 동안 군납 계약을 따낸 날짜와 그 전후로 나간 돈이 적혀 있었는데, 받은 사람 칸에는 이름 대신 머리글자만 있었습니다. 수사팀이 머리글자 열하나 가운데 일곱을 풀어 보니 그 가운데 넷이 여당 현역 의원이었습니다.\n\n검찰총장이 보고서를 들고 청와대에 왔을 때, 여당 원내대표는 그보다 한 시간 먼저 와서 기다리고 있었습니다."
 tfrkphn.475.d:0 "검찰이 수사 결과를 발표했다.\n\n그룹 총수 둘과 전현직 의원 다섯이 뇌물과 배임 혐의로 재판에 넘겨졌다. 삼백 쪽이 넘는 공소장에는 군납 계약서와 계좌 내역, 운전기사의 운행 일지까지 증거로 붙었다.\n\n경제 단체들은 그날 성명을 내지 않았고, 주요 그룹의 대관 담당 임원들은 그 주에 줄줄이 자리를 옮겼다."
 tfrkphn.476.kp:0 "창원의 어느 기계 공장 노조 사무실에서 있었던 일이다. 점심시간이 끝나 가는데 벽의 텔레비전에서는 대통령이 고용 창출 전략회의를 주재하고 있었다. 젊은 조합원 하나가 채널을 돌리려 하자 지회장 최씨가 그냥 두라고 했다.\n\n\"지회장님, 저 사람 찍으셨다면서요.\"\n\n사무실이 조용해졌다. 최씨는 민주노총 조끼를 삼십 년 입었고 선거 때마다 진보정당을 찍었다고 스스로 말해 온 사람이다.\n\n\"찍었다.\"\n\"홍준표가 세운 사람인데요.\""
 tfrkphn.476.kp2:0 "최씨는 대답 대신 믹스커피를 저었다. 1998년 2월에 그는 스물아홉이었고, 딸이 백일을 갓 넘긴 때에 다니던 공장이 부도났다. 그는 노동사무소 창구에서 실업급여라는 말을 처음 들었다. 넉 달 동안 나온 돈은 많지 않았어도 분유와 월세는 됐고, 그 넉 달 사이에 그는 지금 공장에 들어왔다.\n\n그 제도를 누가 들여왔는지는 나중에야 알았다. 파업한 사람한테도 생계비는 줘야 한다고 했다가 재계에 두들겨 맞은 1993년의 노동부 장관이었다.\n\n\"그 사람이 당을 몇 번 옮겼는지는 나도 안다. 나하고 생각이 다른 것도 안다.\"\n\"그런데요?\"\n\"빚이 있어서. 한 번은 갚아야지.\"\n\n최씨가 종이컵을 구기고 일어섰을 때 텔레비전 속 대통령은 일자리 숫자를 읽고 있었다.\n\n\"대신 저 숫자 못 채우면 내가 제일 먼저 머리띠 맨다.\""
 tfrkphn.478.kp:0 "좋은 일자리라는 것이 과연 가능한지를 대통령은 스스로 묻고, 역대 정부는 늘 일자리를 늘리겠다고 발표해 왔다.\n\n그는 그 대통령들을 다 기억한다. 유신 반대를 하던 때의 박정희, 변호사 일을 하던 때의 전두환, 자기를 정계로 끌어들인 김영삼, 끝내 승리한 김대중, 자기와 싸운 노무현, 그리고 이명박과 박근혜와 문재인까지 모두가 좋은 일자리를 약속했다.\n\n그들 가운데 정말로 좋은 일자리를 만든 사람은 없었다고 대통령은 말한다. 약속을 지키지 못했거나 수만 늘렸다는 것인데, 자기라고 다를 것 같지는 않다는 말도 그는 숨기지 않았다.\n\n그래도 이것은 그가 오래전부터 해 온 약속이고, 약속을 한 이상 해 보기는 해야 한다. 우리는 군수 공장을 민수로 돌리고, 전역 장병에게 직업훈련을 시키고, 고용정보망을 넓힌다. 목표는 5년 안에 100만 개다.\n\n늙은 노인이 갑자기 회의를 연다고 발표했다."
 tfrkphn.479.kp:0 "일자리 하나면 가정 하나를 먹일 수 있고, 고용보험은 그 일자리를 잃은 가정이 무너지지 않게 하려고 만든 제도다.\n\n그런데 지금의 고용보험에는 실업급여만 되풀이해 타 가는 사람이 있는가 하면 혜택을 아예 누리지 못하는 사람도 있다. 임시직과 일용직, 프리랜서가 그렇다. 대통령은 자기가 설계한 것이 이런 모습은 아니었다고 했다. 굶는 사람을 구하려고 만든 법이 배부른 사람을 먹이고, 굶주린 사람은 계속 굶는다는 것이다.\n\n노인은 오랜만에 책을 읽고 글을 쓴다.\n\n§Y고용보험법 개정법§!"
 tfrkphn.480.kp:0 "기업하기 좋은 나라란 지금 어디에도 없다. 미국이 붕괴했을 때 동쪽의 수출길이 막혔고 중국이 침공을 시작하자 서쪽의 수출길이 막혔다.\n\n그래도 기업은 있어야 한다. 살기 힘들수록 돈을 벌어야 하고 돈을 버는 곳은 기업뿐이다. 기업하기 좋은 나라가 없다면 우리가 직접 만들어야 한다는 것이 대통령의 생각이다.\n\n규제는 교통신호등처럼 단순하고 분명하게 한다. 비상 시기의 경제 규제를 걷어 낸다. 정부보다 민간을, 대기업보다 중소기업을 앞에 둔다.\n\n늙은 노인이 규제 목록을 가져오라고 했다."
 tfrkphn.482.story:0 "이정훈은 그날 새 공장에 처음 출근했다.\n\n정문에서 받은 사원증에는 생산기술부장 이정훈이라고 적혀 있었고, 그는 그것을 목에 걸고 한참 내려다보았다.\n\n자리에는 생산 계획표가 놓여 있었다. 쑤저우에서 세탁기 모터를 만들던 라인인데도 계획표의 품목은 절반이 무인기 모터였고, 납품처 칸에는 방위사업청과 폴란드 회사의 이름이 적혀 있었다.\n\n기계에는 중국어 안내문이 그대로 붙어 있었고, 쑤저우의 반장이 매직으로 적어 둔 숫자도 남아 있었다. 조임 값, 급유 주기, 고장 난 날짜.\n\n\"부장님, 이거 번역해서 다시 붙일까요.\"\n\"숫자는 그대로 둬. 십오 년 돌린 사람이 적은 거야.\"\n\n점심시간에 식당 텔레비전에서 뉴스가 나왔다. 유럽 나라들이 징병제를 되살리고 일본은 국방비를 두 배로 올린다는 소식에 이어, 동남아 나라들이 한국 공장에 탄약을 주문하러 줄을 섰다는 소식이 나왔다. 아나운서는 평화의 시대가 끝났다고 말했다.\n\n식당에서 고개를 든 사람은 없었다. 다들 그 주문으로 월급을 받는 사람들이었기 때문이다.\n\n오후에 정훈은 탕비실에서 믹스커피를 한 잔 탔는데, 이번에는 뭐라고 하는 사람이 없었다. 다섯 해 만에 얻은 일자리였고, 그 일자리가 어디서 왔는지를 그는 계획표를 보고 알았다."
 tfrkphn.483.d:0 "이정훈은 올해로 쉰둘이 되었습니다.\n\n공원 벤치에서 딸과 마주친 날로부터 다섯 해가 지났고, 그 사이 그는 대리운전을 하고 물류센터에서 상자를 나르다가 전쟁 중에는 탄약 공장에서 야간 검수를 했습니다. 그동안 명함에 부장이라고 적힌 적은 한 번도 없었습니다.\n\n면접은 인천항 부두에서 봤습니다. 쑤저우에서 십오 년 동안 세탁기 모터를 만들다가 전쟁이 나자 설비를 뜯어 돌아온 회사였는데, 야적장에는 컨테이너 마흔 개가 쌓여 있었습니다. 공장장이 그 가운데 하나를 열어 보이자 중국어 안내문이 그대로 붙은 기계가 나왔습니다.\n\n\"이정훈 씨, 공대 나오셨죠. 이 라인을 돌려 보신 분이 국내에 몇 없습니다.\"\n\"공장은 어디에 세웁니까.\"\n\"아직 모릅니다. 정부가 터를 정해 주기로 했습니다. 정해지면 바로 나오실 수 있습니까.\"\n\"어디든 나갑니다.\"\n\n부두를 나온 정훈은 주차장에 한참 서 있다가, 이제 대학생이 된 딸 서진에게 먼저 전화를 걸었습니다.\n\n\"아빠 취직했습니다.\"\n\"진짜? 어디?\"\n\"중국에서 돌아온 회사. 아빠가 옛날에 하던 일이야.\""
 tfrkphn.484.d:0 "경기도 시흥, 시화공단 끝자락의 금형 공장.\n\n공장 문 앞에 낯선 사람 셋이 서 있었습니다. 톈진의 전기차 배터리 공장에서 일하던 기술자들로, 마지막 여객선을 타고 나왔다고 했습니다. 그 가운데 한 사람이 가방에서 배터리 셀을 담는 케이스의 도면을 꺼냈습니다.\n\n\"설비는 다 두고 왔습니다. 도면하고 사람만 왔습니다. 금형부터 다시 파야 합니다.\"\n\n사장 김씨가 작업대에 펴 놓은 도면을 보니 공차가 머리카락 굵기의 십분의 일이었습니다. 옆에서 들여다보던 박 반장이 혀를 찼습니다.\n\n\"사장님, 이거 우리 기계로 됩니까?\"\n\n\"되게 해야지. 이 사람들은 공장 터도 아직 없대.\"\n\n기술자 하나가 톈진에서는 이 금형을 석 달 만에 받았다고 하자, 김씨는 벽에 걸린 달력을 한 번 쳐다보았습니다.\n\n\"두 달에 해 주겠소. 대신 시험 사출 때 와서 같이 보시오.\"\n\n기술자들이 돌아간 뒤 박 반장이 장갑을 벗었습니다.\n\n\"두 달이면 밤일입니다.\"\n\n\"삼겹살은 내가 사.\""
 tfrkphn.485.d:0 "외교부 청사 9층, 동북아국 중국과. 박영환 국장의 책상에 전문 한 장이 올라왔습니다.\n\n§Y발신: 주칭다오 총영사관§!\n§Y제목: 관내 우리 기업 철수 동향§!\n\n1. 관내 조선 기자재 업체 한 곳이 오늘 재고와 인력을 싣고 출항함. 선박용 밸브와 펌프를 만드는 회사임.\n2. 이 회사의 거래처였던 조선소는 지난달부터 중국 해군 함정을 짓고 있음.\n3. 회사 대표는 이십 년 거래한 조선소 사장과 어제 마지막으로 통화했다고 함. 상대는 미안하다고 했다고 함.\n4. 국방부가 이 회사에 함정용 밸브와 펌프를 맡기려 한다는 말이 있음.\n5. 관내에 남은 우리 기업은 열한 곳임.\n\n박 국장은 전문을 덮었습니다. 서랍에는 1992년 수교 서명식 사진이 그대로 들어 있었지만 그는 꺼내 보지 않았고, 결재란에 서명한 다음 귀국 기업의 터를 산업부와 협의하라는 한 줄을 적어 넣었습니다.\n\n\"국장님, 남은 열한 곳은 어떻게 됩니까.\"\n\n\"돌아올 배편부터 알아봐.\""
 tfrkphn.486.d:0 "§Y[지역신문]§! 광저우에서 돌아온 변속기 회사가 공장 터를 찾고 있습니다.\n\n광저우에서 자동차 변속기를 만들던 이 회사는 현지 합작사가 공장을 넘기라고 요구하자 금형만 빼내 홍콩을 거쳐 실어 왔고, 현지에서 뽑은 직원 가운데 서른 명이 회사를 따라왔습니다. 국방부가 이 회사에 장갑차 변속기를 맡길 계획이어서, 정부는 수도권과 지방 공단을 놓고 터를 고르는 중입니다.\n\n후보지 가운데 한 곳이 경기도 어느 소도시의 보훈회관 맞은편에 칠 년째 비어 있는 공장입니다. 회관에서 만난 박정수 할아버지는 맹호부대 출신입니다.\n\n\"우리 때는 장갑차가 미제였지. 변속기가 나가면 부품이 배로 한 달 걸려 왔어. 여기서 만들면 좋지.\"\n\n6.25 학도병 출신인 김복동 할아버지는 창밖의 빈 공장을 한참 바라보다가 입을 열었습니다.\n\n\"공장 소리 나면 좋지. 와 다시 나는지는 생각하면 안 좋고.\""
 tfrkphn.487.d:0 "영등포구, 정의당 중앙당 당사. 김서현은 이제 전화를 받는 대신 논평을 씁니다.\n\n§Y[논평 초안]§!\n선전에서 통신 장비를 조립하던 회사가 협력사 열두 곳과 함께 돌아옵니다. 환영합니다. 일자리가 생깁니다.\n그런데 국방부는 이 회사에 군용 통신 장비를 맡기려 합니다. 올해 돌아온 공장 가운데 군수품을 만드는 곳이 벌써 여럿입니다. 유럽은 징병제를 되살렸습니다. 이웃 나라들은 국방비를 올립니다. 뉴스는 날마다 평화의 시대가 끝났다고 말합니다.\n우리는 묻습니다. 돌아온 일자리는 전쟁이 끝나면 어디로 가는가.\n\n사수가 초안을 읽고 물었습니다.\n\n\"환영한다는 말은 뺄까요?\"\n\n\"그건 둬요. 일자리는 일자리니까.\"\n\n서현이 저장 단추를 누르는데 전화벨이 울렸습니다. 이번에는 욕이 아니었고, 그 공장에 지원하려면 어디로 가야 하느냐는 문의였습니다."
 tfrkphn.488.d:0 "서준은 졸업하고 두 해를 쉬었고, 형의 기일에는 해마다 광화문에 나갔습니다.\n\n채용 공고는 짧았습니다. 시안에서 돌아온 반도체 후공정 회사. 신입 엔지니어. 장비가 들어올 때까지 교육.\n\n\"장비가 들어오려면 이 년이 걸립니다. 수출 통제에 걸려 한 대도 못 가져왔습니다. 그동안은 빈 클린룸에서 교육만 받습니다. 괜찮겠습니까.\"\n\"괜찮습니다.\"\n\"이력서에 빈 기간이 있네요. 뭘 했습니까.\"\n\n서준은 말을 고르다가 결국 있는 그대로 말했습니다.\n\n\"집회에 나갔습니다. 형이 대만에서 죽었습니다.\"\n\n면접관은 펜을 내려놓고 시안에서 같이 일하던 중국인 동료 이야기를 했는데, 전쟁이 나던 날 그 동료가 공항까지 차를 태워 줬다는 것이었습니다.\n\n\"설비는 못 가져오고 사람만 왔습니다. 공장 터는 정부가 곧 정해 줍니다.\"\n\n방진복은 생각보다 가벼웠습니다. 임시 교육장 바닥에는 장비가 놓일 자리마다 노란 테이프가 붙어 있어서, 서준은 그 테이프를 따라 걸었습니다."
 tfrkphn.489.d:0 "중국에서 철수한 기업 여섯 곳이 모두 자리를 잡았습니다.\n\n세 곳은 예전에 만들던 것을 다시 만들고 두 곳은 군수품을 만들며, 나머지 한 곳은 조선소 옆에 자리를 잡았습니다. 산업부는 돌아오겠다는 문의가 스무 건 더 들어와 있다고 보고했습니다.\n\n돌아온 공장의 기계에는 아직 중국어 안내문이 붙어 있는데, 새로 뽑힌 직원들이 그 위에 한글 스티커를 하나씩 붙이고 있습니다."
 tfrkphn.490.story:0 "평안북도 초산, 압록강변.\n\n오후 두 시가 조금 지나 김지원 하사의 분대가 선두로 강가에 닿았다. 강은 생각보다 좁아서 건너편 둑의 중국군 초소가 훤히 보였다.\n\n1950년 10월 26일 오후 2시 15분에도 국군은 이 강에 닿았다. 6사단 7연대 1대대 1중대였고, 중대장은 이승만 대통령에게 보낼 물을 수통에 담았지만 그 부대는 이틀 뒤에 후퇴 명령을 받았다.\n\n대대장이 무전으로 물었다.\n\n\"강물 떴나.\"\n\n\"아직입니다.\"\n\n\"떠라. 수통 하나는 청와대로 보낸다.\"\n\n지원은 군화를 벗지 않고 물가로 내려가 수통을 물에 눕혔다. 차가운 물에서 흙냄새가 났다. 수통이 차자 그녀는 마개를 잠그고 겉에 날짜를 적었다.\n\n옆에서 지켜보던 상병이 물었다.\n\n\"분대장님, 이번에는 이틀 뒤에 안 물러납니까.\"\n\n지원이 건너편 초소를 보니 그쪽 병사도 이쪽을 보고 있었는데, 양쪽 다 총은 들지 않았다.\n\n\"모른다. 그래서 수통을 두 개 떴다. 하나는 내가 가진다.\""
 tfrkphn.491.story:0 "강원도 철원, 전방 사단의 탄약고 앞. 새벽 네 시.\n\n김지원 하사는 분대원 아홉 명을 한 줄로 세웠다. 일병 때 계룡대 연병장에서 대통령의 사열을 받았던 그녀는 전역할 날짜가 지나고도 군복을 벗지 않았고, 지난봄에 하사 계급장을 달았다.\n\n탄약고 문이 열리고 병사들 앞에 실탄 상자가 하나씩 놓였다. 훈련 때는 탄피 개수까지 세어 반납했는데 오늘은 반납 장부가 아예 없었다.\n\n\"분대장님, 이거 진짜 나가는 겁니까.\"\n\n\"모른다. 준비하라는 명령만 받았다.\"\n\n옆 막사는 동원된 예비군으로 찼다. 마흔 가까운 사람들이 군복 단추를 잠그면서 휴대폰으로 아이 사진을 들여다보고 있었는데, 그 가운데 하나가 지원에게 물었다.\n\n\"하사님은 왜 안 나가고 남았습니까. 안 와도 되는 군대인데.\"\n\n지원은 탄창에 탄을 끼우던 손을 멈추지 않고 대답했다.\n\n\"똑같이 받으려고 왔습니다. 받을 때만 똑같으면 안 되잖습니까.\"\n\n날이 밝자 북쪽 능선이 드러났다. 능선 너머는 조용했고, 분대원들은 그쪽을 쳐다보지 않은 채 탄창을 채웠다."
 tfrkphn.492.story:0 "정부서울청사 별관, 북부 행정요원 발대식.\n\n강당에 삼천 명이 앉았다. 북쪽 읍면동에 먼저 올라갈 공무원들로, 절반은 현직이고 나머지 절반은 이번에 새로 뽑힌 사람들이었는데 제대군인은 가산점을 받았다.\n\n지난달에 전역한 김지원은 회색 점퍼와 발령장 한 장을 받았다. 발령지 칸에는 평안북도 초산군이라고 적혀 있었다.\n\n\"초산이면 압록강 바로 옆인데. 괜찮겠어요?\"\n\n옆자리에서 팀장 명찰을 단 남자가 발령장을 넘겨다보며 말했다. 지원은 그 얼굴을 한참 들여다보았다.\n\n\"혹시 노량진 독서실 다니셨습니까.\"\n\n남자가 눈을 크게 떴다. 그해 9급에 붙어 지금은 7급이 된 이준호였다.\n\n\"그때 그 일병. 가산점 받는다고 좋아하던.\"\n\n\"받았습니다. 이번에.\"\n\n\"나도 그걸로 붙었어요. 초산은 우리 팀입니다.\"\n\n버스는 다음 날 새벽에 떠났다. 지원의 배낭 옆주머니에는 마개 옆에 날짜를 적은 수통이 하나 들어 있었고, 초산 읍사무소에 닿으면 그녀는 그 물을 강에 도로 부을 생각이었다."
 tfrkphn.493.d:0 "재벌개혁 법안 넷이 국회를 통과한 주에 홍준표 전 대통령이 다시 글을 올렸는데, 이번 글은 전보다 훨씬 길었습니다.\n\n그가 꺼낸 것은 2017년 봄이었습니다. 그해 자유한국당 경선에서 자신은 1위였고 이인제는 3위였으며, 이듬해에는 자신이 당 대표로서 이인제를 충남지사 후보로 추대했다는 이야기였습니다. 그때 충청도가 낳은 큰 인물이라고 자기 입으로 말했다는 대목도 빠지지 않았습니다.\n\n홍준표는 그런 사람이 이제 유승민의 공약집으로 나라를 운영한다고 쓰고, 기업을 때려서 일자리가 생긴 나라는 없다는 말을 덧붙였습니다. 글은 수레의 두 바퀴 가운데 한쪽만 굴리면 그 수레가 어디로 가느냐는 물음으로 끝났습니다.\n\n청와대 참모들은 답을 낼 것인지 말 것인지를 두고 둘로 갈렸습니다."
 tfrkphn.494.d:0 "장부에서 이름이 나온 여당 의원은 넷이었고, 그 가운데 둘은 홍준표 정부에서 장관과 수석을 지낸 사람들이었습니다.\n\n그날 밤 대통령의 휴대폰이 울렸습니다. 화면에는 홍준표의 이름이 떴는데, 그는 이인제가 취임한 뒤로 글만 올렸을 뿐 전화를 건 적이 없었습니다.\n\n홍준표는 자신도 검사였으니 수사를 막을 생각은 없다는 말로 시작했습니다. 그러면서 전쟁을 같이 치른 사람들을 포토라인에 세우는 일에는 순서가 있지 않겠느냐고 했고, 통화는 그 말을 끝으로 사 분 만에 끝났습니다.\n\n대통령은 전화를 내려놓고도 한동안 자리에서 일어나지 않았습니다. 문 밖에서는 민정수석이 결재판을 든 채 기다리고 있었습니다."
 tfrkphn.495.d:0 "재벌개혁 법안이 모두 통과된 주말에 홍준표 전 대통령이 수행원도 없이 청와대에 왔는데, 손에는 막걸리 두 병이 들려 있었습니다.\n\n관저 식탁에 마주 앉자 홍준표는 할 말부터 했습니다. 유승민을 들인 것은 지금도 마음에 들지 않고 자기 글에 답이 늦은 것도 섭섭했다는 이야기였는데, 이인제는 잔을 채우며 듣기만 했습니다.\n\n둘째 병을 딸 무렵 홍준표가 2018년 충남 이야기를 꺼냈습니다. 어려운 선거인 줄 알면서 나가 달라고 했다는 그의 말에 이인제는 알고 나갔다고 짧게 답했습니다.\n\n홍준표는 일어서면서 법은 통과시켰으니 지키게 하는 일까지 하라는 한마디를 남겼고, 다음 날 그의 글은 올라오지 않았습니다."
 tfrkphn.496.d:0 "새 일자리가 50만 개를 넘었다는 발표가 난 날 홍준표 전 대통령이 방송에 나왔습니다.\n\n진행자가 후임 정부의 일자리 정책을 묻자 그는 숫자부터 따지고 들어, 그 가운데 세금으로 만든 자리가 몇 개냐고 되물었습니다. 경남도지사 때 자신은 빚부터 갚았고 다 갚고 남은 돈으로 일을 벌였다는 말도 이어졌습니다.\n\n방송이 끝날 무렵에야 다른 말이 나왔습니다. 그래도 전역한 아이들이 줄을 덜 선다니 그것 하나는 잘한 일이라는 것이었습니다.\n\n청와대 대변인실은 그 마지막 한마디를 논평에 넣을지 말지를 두고 한 시간을 회의했습니다."
 tfrkphn.497.d:0 "북진 준비가 끝났다는 보고가 올라간 주에 홍준표 전 대통령이 청와대로 전화를 걸었는데, 이번에는 비서실을 거쳐서 온 전화였습니다.\n\n그는 양안전쟁 때의 일을 이야기했습니다. 참전을 결정한 날 밤에는 잠을 자지 못했고, 전사자의 어머니가 보낸 편지를 읽은 날은 일정을 모두 취소했다고 했습니다. 전쟁은 시작하는 날보다 끝내는 날을 정하기가 훨씬 어렵다는 말도 했습니다.\n\n홍준표는 훈수를 둘 생각은 없으며, 그 자리에 앉아 본 사람이 둘뿐이라 하는 말이라고 덧붙였습니다.\n\n이인제는 전화를 끊고 수첩에 한 줄을 적었습니다. 끝내는 날."
 tfrkphn.500.d:0 "통일이 공포된 날 저녁에 홍준표 전 대통령이 세 줄짜리 글을 올렸습니다.\n\n첫 줄에서 그는 자신이 전쟁에서는 이겼지만 이 일은 하지 못했다고 썼고, 둘째 줄에는 이인제가 했다고만 적었습니다. 셋째 줄은 판문점 표지판을 뽑는 날에는 자기도 불러 달라는 부탁이었습니다.\n\n기자들이 유승민에게도 소감을 물었지만 그는 홍준표의 글에 공감을 눌렀다고만 답했습니다. 두 사람이 서로의 글에 공감을 누른 것은 그날이 처음이었습니다."
 tfrkphn.501.d:0 "대통령이 통일되는 날 한반도의 핵을 모두 내려놓겠다고 선언하자, 그날 밤 홍준표 전 대통령이 글을 올렸습니다.\n\n홍준표는 2017년 9월의 대구를 꺼냈습니다. 그날 자신은 거리에서 핵에는 핵으로 맞서야 한다고 말했고, 전술핵을 들여오지 못하면 우리 손으로 만들자고까지 했는데 그 생각은 지금도 같다는 것이었습니다.\n\n이인제는 그해에 독자 핵무장에 반대하면서 독일은 핵 없이도 유럽에서 가장 강한 나라라는 논리를 폈습니다. 홍준표는 독일 옆에는 중국이 없다는 한 줄로 그 논리를 받았습니다.\n\n글의 끝에는 물음이 하나 달려 있었습니다. 내려놓겠다는 핵에 북쪽 것만 들어가는지, 아니면 우리가 가질 수도 있었던 것까지 들어가는지를 그는 물었습니다."
 tfrkphn.502.d_pm:0 "책임총리제 담화가 나간 날 홍준표 전 대통령이 기자들을 만났다.\n\n그는 대통령이 내치를 총리에게 넘기는 것을 이해할 수 없다면서, 자신은 전쟁 중에도 경제 회의를 직접 주재했다고 말했다. 권한을 나누면 책임질 사람이 없어진다는 것이 그의 주장이었다.\n\n한 기자가 이인제 대통령은 1997년부터 그 말을 해 왔다고 하자, 홍준표는 삼십 년을 말했어도 틀린 것은 틀린 것이라고 짧게 받았다.\n\n총리실은 그날 논평을 내지 않았고, 총리는 다음 날 첫 경제장관회의를 예정대로 열었다.\n\n그날 오후 총리실 사무실에서는 그 기사를 띄운 모니터 앞에 직원들이 모여들었다. 한 국장이 의자를 돌리며 말했다.\n\n\"전직 대통령이 저래 말하면 우리는 잘하는 수밖에 없다.\"\n\n첫 경제장관회의 안건은 그날 밤 세 번 고쳐졌다. 다음 날 아침 국무회의장에 들어선 장관들은 총리 자리가 대통령 바로 옆으로 옮겨진 것을 봤다. 회의 자료를 총리실에 먼저 보내는 순서에 다들 익숙해지기까지 한 달쯤 걸렸다."
 tfrkphn.502.d_st:0 "대통령이 책임총리제 담화를 접고 국정을 직접 챙기겠다고 발표한 날 홍준표 전 대통령이 기자들을 만났다.\n\n그는 잘한 결정이라면서, 자신은 전쟁 중에도 경제 회의를 직접 주재했다고 말했다. 다들 다음 전쟁을 준비하는 때에 권한을 쪼개는 나라가 어디 있느냐는 것이 그의 말이었다.\n\n한 기자가 이인제 대통령은 1997년부터 책임총리를 말해 왔다고 하자 홍준표는 웃으면서, 앉아 보면 생각이 바뀌는 자리라고 답했다.\n\n청와대는 그 말을 받지 않았고, 대통령은 다음 날 아침 일곱 시에 첫 회의를 잡았다.\n\n그날 밤 총리실 직원들은 몇 달 밤을 새워 만든 책임총리 준비 서류를 상자에 담았다. 한 국장이 상자에 끈을 묶으며 말했다.\n\n\"버리지는 마라. 언젠가 누가 다시 열 끼다.\"\n\n상자는 지하 문서고 맨 안쪽 선반에 올라갔다. 국무회의 자리 배치는 그대로였고, 장관들은 예전처럼 대통령실에 먼저 자료를 보냈다. 총리실 결재함은 그 주에도 가벼웠다."
 tfrkphn.503.d:0 "양안전쟁 참전용사 예우법이 공포된 날 국립서울현충원에서 기념식이 열렸습니다.\n\n홍준표 전 대통령은 초청장을 받고도 단상에 오르지 않고 유족석 맨 뒷줄에 앉았습니다. 그 전쟁에 장병을 보낸 사람이 바로 그였습니다.\n\n식이 끝나자 한 어머니가 그에게 다가왔는데, 몇 해 전 아들이 무엇을 위해 죽었느냐고 묻는 편지를 청와대로 보낸 사람이었습니다. 홍준표는 자리에서 일어나 고개를 숙였고, 두 사람이 그 뒤에 무슨 말을 나눴는지는 알려지지 않았습니다.\n\n이인제 대통령은 단상에서 그 모습을 지켜보다가, 준비한 연설의 마지막 문단을 읽지 않은 채 내려왔습니다."
 tfrkphn.504.d:0 "대통령이 통일 뒤에 북쪽 사람들에게 보복하지 않겠다고 선언한 다음 날 홍준표 전 대통령이 방송에 나왔습니다.\n\n그는 자신이 검사였다는 말로 시작해, 용서와 사면은 재판이 끝난 뒤에 하는 일이라고 했습니다. 정치범수용소를 만들고 운영한 사람들까지 묻지 않겠다는 뜻이냐고 되물으면서, 아랫사람은 살리고 윗사람은 법정에 세우는 것이 순서라고 말했습니다.\n\n진행자가 그러면 북쪽 군인들이 끝까지 싸우지 않겠느냐고 묻자 홍준표는 잠깐 말을 멈췄습니다. 그 걱정은 대통령이 하는 것이 맞고 자신은 이제 그 걱정을 하는 자리에 있지 않다는 답이 조금 뒤에 나왔습니다.\n\n그날 밤 통일부는 선언문의 한 문장을 두고 늦게까지 회의했습니다."
 tfrkphn.505.d:0 "대북 확성기가 시간 제한 없이 켜졌습니다.\n\n전방의 확성기는 이제 밤낮을 가리지 않고 방송합니다. 첫 소식은 중국이 양안전쟁에서 졌다는 것이었는데, 북쪽 주민들이 한 번도 제대로 들어 본 적이 없는 이야기입니다. 그 뒤로는 날씨와 장마당 쌀값, 먼저 내려온 사람들의 안부가 이어집니다.\n\n풍선도 올라갑니다. 전에 북쪽이 내려보낸 풍선에는 오물이 채워져 있었지만, 남쪽이 올려 보내는 풍선에는 전단과 라디오와 쌀이 가득 들어 있어서 하룻밤에 수백 개씩 휴전선을 넘습니다.\n\n지난주에는 공군 무인기 편대가 평양 방공망 가장자리까지 올라갔다가 돌아왔습니다. 북한군 레이더는 켜졌지만 미사일은 올라오지 않았고 전투기도 뜨지 않았는데, 합참은 그것이 연료가 없어서인지 명령이 없어서인지는 알 수 없다고 보고했습니다.\n\n어느 쪽이든 평양 사람들은 그날 밤 하늘에서 나는 소리를 들었고, 다음 날 아침 조선중앙방송은 그 일을 전하지 않았습니다."
 tfrkphn.506.d:0 "PDTO 회원국 외교장관들이 서울에서 두 문장짜리 공동성명을 냈다.\n\n회원국들은 한반도의 유일한 합법 정부가 대한민국이며 중국을 대표하는 정부는 타이베이의 중화민국이라고 확인했다. 신문들은 이 성명에 자유중국, 하나의 한국이라는 이름을 붙였고, 일본과 중화민국의 외교장관이 대한민국 외교부 장관과 나란히 서명했다.\n\n같은 날 국회에서는 더불어민주당의 친이재명계 의원들이 기자회견을 열어, 정부가 남의 나라 정통성 문제에 도장을 찍는 바람에 베이징과는 앞으로 수십 년 동안 마주 앉지 못하게 됐다고 비판했다. 하나의 한국이라는 말은 북쪽에 흡수하겠다는 통보로 들릴 것이라고 했고, 전쟁을 끝낸 지 몇 해 만에 다음 전쟁의 명분을 문서로 만들었다는 말까지 나왔다.\n\n여당은 동맹국이 통일을 받아들였다는 뜻이라고 맞받았다.\n\n베이징은 그날 밤 극한 수위의 성명을 냈다. 중국 외교부는 서명한 나라들이 불장난의 값을 치를 것이라고 하면서 대한민국과 일본과 타이베이 당국의 이름을 하나씩 적었고, 인민해방군 동부전구는 같은 시각에 훈련 영상을 공개했다."
 tfrkphn.507.d:0 "정부가 통일 기금에 넣을 돈으로 통일세를 걷겠다고 발표했습니다. 소득세와 법인세에 일정 비율을 얹는 방식입니다.\n\n통일세라는 말은 2010년 8월 15일 이명박 대통령의 광복절 경축사에 처음 나왔지만, 그때는 반대가 커서 세금으로 만들어지지 못했습니다.\n\n이번에도 반응은 빨랐습니다. 납세자 단체는 전쟁 때 오른 세금도 아직 그대로라는 성명을 냈고, 광화문에는 주말마다 세금 고지서를 든 사람들이 모였습니다. 자영업자 단체가 통일은 찬성하지만 청구서는 반대한다는 현수막을 거는 동안, 시민단체들은 걷은 돈을 어디에 쓸지부터 밝히라고 요구했습니다.\n\n우려는 여당 안에서도 나왔습니다. 수도권 의원 스무 명이 원내대표를 찾아가 다음 선거를 세금 고지서와 함께 치를 수는 없다고 했고, 기획재정부 장관은 국무회의에서 세율을 절반으로 낮춘 안도 준비해 두었다고 보고했습니다."
 tfrkphn.508.d:0 "첫 재벌개혁 법안이 국회를 통과한 주에 대통령이 유승민을 다시 불렀습니다.\n\n대통령은 법을 만든 사람이 법을 집행하는 것이 맞다면서 공정거래위원장 자리를 제안했고, 유승민은 한참을 듣고 난 뒤에 사양했습니다.\n\n자신이 그 자리에 앉으면 이 법은 유승민의 법이 되고, 그러면 반대하는 쪽은 법 대신 사람을 공격할 것이라는 이유였습니다. 자신은 밖에서 조문을 봐 주는 것으로 충분하다고 했습니다.\n\n집무실을 나서기 전에 그는 한 가지를 부탁했습니다. 위원장에는 정치인 말고 숫자를 읽을 줄 아는 사람을 앉혀 달라는 것이었습니다."
 tfrkphn.509.d:0 "재계와 타협한 안이 국회를 통과한 다음 날 아침, 대통령의 책상에 유승민이 보낸 메모 한 장이 올라와 있었습니다.\n\n메모는 세 줄이었습니다. 첫 줄은 예외 조항이 붙은 자리를 조문 번호로 짚었고, 둘째 줄은 그 예외로 빠져나가는 그룹이 몇 곳인지를 적었습니다. 셋째 줄에는 한 번 붙인 예외는 다음 법안에서도 요구받게 된다는 말이 있었습니다.\n\n끝에 붙은 말은 없었습니다. 그만두겠다는 말도 화가 났다는 말도 없었는데, 비서실장은 오히려 그 점이 더 무겁다고 말했습니다."
 tfrkphn.510.d:0 "경제 단체들이 성명을 낸 이틀 뒤 유승민이 방송 토론에 나갔고, 맞은편에는 경제 단체의 상근부회장이 앉았습니다.\n\n부회장은 기업을 죄인 취급하는 법이 이어지면 투자가 나라 밖으로 나간다고 말했습니다. 유승민이 꺼낸 것은 종이 한 장이었는데, 지난 십 년 동안 총수 일가의 개인회사가 내부거래로 올린 매출과 같은 기간 그 그룹의 국내 투자액을 나란히 적은 표였습니다.\n\n한국개발연구원 연구원 출신인 그는 목소리를 높이지 않고 표의 숫자를 한 줄씩 읽어 내려갔습니다. 부회장이 그 숫자의 출처를 묻자, 그 단체가 해마다 내는 보고서라는 답이 돌아왔습니다.\n\n다음 날 경제 단체들은 두 번째 성명을 미뤘습니다."
 tfrkphn.511.d:0 "검찰이 그룹 본사를 압수수색한 날 기자들이 유승민을 둘러쌌습니다. 재벌개혁이 결국 재벌 손보기 아니냐는 질문이 쏟아졌습니다.\n\n유승민은 수사와 입법을 한데 섞으면 둘 다 망가진다고 답했습니다. 죄가 있으면 벌을 받아야 하지만 법안 표결을 압수수색 날짜에 맞추는 일은 없어야 한다는 말도 했습니다.\n\n그날 저녁 그는 같은 말을 대통령에게 따로 전하면서, 수사가 끝날 때까지 다음 법안의 상정을 미루자고 제안했습니다."
 tfrkphn.512.d_full:0 "통일세가 발표된 주말에 유승민이 신문에 글을 실었다.\n\n그는 2015년 4월 원내대표 연설에서 증세 없는 복지는 허구라고 말했던 사람이다. 이번 글의 첫 문장도 세금 없는 통일은 없다는 것이어서 그때와 꼴이 같았고, 그 뒤로는 북쪽의 도로와 병원과 학교에 드는 돈이 항목마다 적혀 있었다.\n\n유승민은 정부가 욕을 먹으면서도 원안대로 걷기로 한 것을 옳다고 쓰면서, 걷은 돈을 어디에 쓰는지는 해마다 국회에 보고하라고 했다. 여당 안에서 통일세를 편든 사람은 그때까지 그밖에 없었다.\n\n그 글이 실린 날 여당 원내대표실의 전화는 하루 종일 울렸다. 통일세에 반대하던 의원들은 유승민의 글을 두고 불편해했고, 찬성하던 의원들은 그 글을 퍼 날랐다. 기획재정부는 그 글의 마지막 문장을 그대로 받아, 해마다 통일 기금의 쓰임을 국회에 보고하는 조항을 법안에 넣기로 했다.\n\n그 조항은 다음 주 상임위원회에서 이견 없이 통과됐다. 첫 보고서는 이듬해 봄에 나왔다. 보고서의 맨 앞 장에는 거둔 돈과 쓴 돈이 한 줄씩 적혀 있었다."
 tfrkphn.512.d_half:0 "통일세가 발표된 주말에 유승민이 신문에 글을 실었다.\n\n그는 2015년 4월 원내대표 연설에서 증세 없는 복지는 허구라고 말했던 사람이다. 이번 글의 첫 문장도 세금 없는 통일은 없다는 것이어서 그때와 꼴이 같았고, 그 뒤로는 북쪽의 도로와 병원과 학교에 드는 돈이 항목마다 적혀 있었다.\n\n유승민은 세율을 절반으로 낮춘 것이 아쉽다고 썼다. 모자라는 절반은 결국 다음 정부가 걷게 된다는 이유였는데, 그래도 세금이라는 말을 피하지 않은 것만은 평가한다고 덧붙였다.\n\n그 글이 실린 날 기획재정부 세제실의 직원들은 절반으로 줄어든 세율이 몇 해 뒤 얼마의 빈칸을 남길지 다시 계산했다. 계산표의 맨 아래 칸에는 다음 정부라는 말이 적혀 있었다. 여당 원내대표는 그 표를 보고 한숨을 쉬었다.\n\n그 빈칸은 다음 해 예산안에서 국채라는 이름으로 메워졌다. 야당은 그 숫자를 두고 반쪽짜리 세금이 온전한 빚을 남겼다고 했다. 여당은 그 말에 따로 답하지 않았다. 세제실의 계산표는 해마다 길어졌고, 직원들은 그 표를 다음 정부 표라고 불렀다."
 tfrkphn.512.d_none:0 "통일세 논란이 지나간 주말에 유승민이 신문에 글을 실었다.\n\n그는 2015년 4월 원내대표 연설에서 증세 없는 복지는 허구라고 말했던 사람이다. 이번 글의 첫 문장도 세금 없는 통일은 없다는 것이어서 그때와 꼴이 같았고, 그 뒤로는 북쪽의 도로와 병원과 학교에 드는 돈이 항목마다 적혀 있었다.\n\n유승민은 정부가 세금 대신 국채를 고른 것을 비판하면서, 국채도 결국 세금으로 갚아야 하는데 그 세금은 지금 투표권이 없는 아이들이 내게 된다고 썼다. 신문들은 재벌개혁을 같이 하는 사이에도 할 말은 한다는 뜻으로 그 글을 풀이했다.\n\n그 글이 실린 날 기획재정부 국채과의 직원들은 통일 국채의 상환 일정표를 다시 펼쳤다. 일정표의 마지막 칸에는 서른 해 뒤의 날짜가 적혀 있었다. 한 사무관은 그때쯤이면 내 아이가 이 빚을 갚고 있겠다고 했다.\n\n그 사무관은 퇴근길에 아이 학원 앞에서 차를 세우고 기다렸다. 가방을 메고 나온 아이가 조수석에 타며 물었다.\n\n\"아빠, 오늘 무슨 일 있었어?\"\n\"아니. 숫자 좀 봤어.\"\n\n다음 날 아침 상환 일정표 맨 앞 칸에는 새 발행 날짜가 하나 더 적혔다."
 tfrkphn.513.d:0 "2021년 10월 29일, 국민의힘 경선 토론에서 홍준표와 유승민이 마주 섰습니다. 유승민이 경제 정책을 설명하자 홍준표는 경제부총리를 하면 안 되겠느냐고 물었고, 유승민은 자신이 대통령이 되면 홍준표를 법무부장관에 임명할까 싶다고 받아 방청석에서 웃음이 터졌습니다.\n\n취임 닷새째 되는 날 대통령은 그 농담을 진담으로 바꿔, 비서실장을 통해 유승민에게 경제부총리 자리를 제안했습니다.\n\n그날 저녁에 온 답은 사양이었습니다. 공매도와 모병제에 주택 공약까지 토론에서 반대한 것이 너무 많은데, 그렇게 반대하던 사람이 내각에 앉으면 자신도 정부도 말이 꼬인다는 이유였습니다. 밖에서 할 말을 하는 쪽이 정부에 더 쓸모가 있을 것이라고도 했습니다."
 tfrkphn.514.d:0 "정부가 모병제 확대안을 내놓은 주에 유승민이 방송에 나와, 경선 토론에서 했던 질문을 다시 꺼냈습니다.\n\n그때 유승민은 4년 전 징병제를 말하던 홍준표가 왜 생각을 바꿨느냐고 물었습니다. 홍준표는 병력 자원이 줄고 있고 모병제가 세계의 흐름이라고 답하면서, 해병대 지원 경쟁률이 10대 1이라는 말도 했습니다.\n\n유승민은 그때의 걱정이 그대로라고 말했습니다. 월급을 보고 입대하는 군대가 되면 형편이 어려운 집 아들부터 총을 들게 되고, 전쟁을 막 치른 나라에서는 그것이 누가 죽느냐의 문제가 된다는 것이었습니다.\n\n국방부는 다음 날 지원병의 출신 지역과 가구 소득을 해마다 공개하겠다고 밝혔습니다."
 tfrkphn.515.d:0 "토지임대부 주택의 첫 분양 공고가 난 날 유승민이 글을 올렸습니다.\n\n땅은 나라가 갖고 집만 파는 이 주택은 홍준표의 경선 공약이었고, 유승민은 토론 때부터 한 가지를 짚어 왔습니다. 10년이 지나 소유권이 넘어가면 시세와의 차익이 당첨된 사람에게 통째로 간다는 것이었는데, 홍준표는 10년을 산 사람의 소유권은 인정해야 한다고 맞섰습니다.\n\n유승민의 글은 첫 단지의 분양가와 둘레 시세, 그리고 10년 뒤의 예상 차익 같은 숫자로 채워져 있었습니다. 집을 싸게 주는 것은 좋지만 그 값을 누가 치르는지는 밝혀야 한다는 것이 글의 요지였습니다.\n\n국토교통부가 해명 자료를 냈지만, 기자들은 해명 자료보다 유승민의 표를 더 많이 실었습니다."
 tfrkphn.516.d:0 "법인세 인하안이 국회를 통과한 주말에 유승민이 신문에 글을 실었습니다.\n\n유승민은 2015년 4월 원내대표 연설에서 증세 없는 복지는 허구라고 말했고, 그 말로 당시 청와대와 멀어졌습니다. 이번 글도 깎은 세금은 누군가 메워야 한다는 같은 자리에서 출발했습니다.\n\n그는 전쟁에 쓴 돈과 보훈에 쓸 돈을 먼저 적고 그다음에 줄어드는 법인세수를 적었는데, 두 숫자 사이의 빈칸은 일부러 비워 두었습니다. 정부가 채워야 할 칸이라는 뜻이었습니다.\n\n여당 의원들은 내부 총질이라고 했고, 기획재정부는 아무 말도 하지 않았습니다."
 tfrkphn.517.d:0 "임기 마지막 해에 한 방송이 유승민에게 홍준표 정부 4년의 점수를 물었습니다.\n\n유승민은 과목을 나눠 답했습니다. 전쟁을 치르고도 나라가 흔들리지 않았다면서 안보에는 합격점을 줬지만, 경제에는 절반만 줬습니다. 기업이 뛰게 한 것은 맞아도 재벌은 손대지 않고 넘어갔고, 그 숙제는 다음 정부로 넘어갔다는 이유였습니다.\n\n진행자가 경선 토론의 농담을 꺼내 경제부총리를 맡았다면 달랐겠느냐고 묻자, 유승민은 웃기만 하고 답하지 않았습니다.\n\n방송이 나간 밤에 대통령이 글을 올렸습니다. 유승민의 채점이 박하다고 쓰고는, 틀린 데는 없다는 말을 덧붙였습니다."
 tfrkphn.518.d:0 "법무부가 대통령에게 서류 한 묶음을 올렸는데, 전임 정부가 준비해 두고 떠난 사형 집행 명령서였습니다.\n\n홍준표는 오래전부터 사형을 집행하자고 말해 온 사람입니다. 2017년 대선 토론에서는 사형을 집행하지 않으니 흉악범이 날뛴다고 했고, 2021년 경선에서는 사형 집행 재개를 공약으로 걸었습니다. 그해 7월에 쓴 글에서는 해마다 사형을 집행하는 일본과 미국이 미개한 나라냐고 물으면서, 형이 확정되면 여섯 달 안에 집행하라는 것이 형사소송법인데 집행하지 않는 것은 법무부 장관의 직무유기라고 했습니다.\n\n그가 대통령이 된 뒤 법무부는 대상자 명단까지 추렸습니다. 그러나 곧 전쟁이 터졌고 전쟁이 끝난 뒤에는 수습이 먼저여서, 서류는 서명란이 빈 채로 다음 정부에 넘어왔습니다.\n\n대한민국은 1997년 12월 30일에 23명을 집행한 뒤로 한 사람도 집행하지 않았습니다.\n\n법무부의 보고는 간단했습니다. 온정주의 없는 법 집행을 내건 정부이니 서명만 하면 된다는 것이었습니다."
 tfrkphn.519.d:0 "서류는 하룻밤 동안 대통령의 책상 위에 놓여 있었다.\n\n대통령은 젊은 날 3년 동안 판사로 일했다. 판사는 기록을 보고 판결하는데, 그 기록은 사람이 만드는 것이어서 틀린 데가 있기 마련이다. 법복을 벗은 뒤에는 해고된 노동자들을 변호하면서, 법이 힘없는 사람 앞에서 얼마나 쉽게 틀리는지를 가까이에서 보았다.\n\n사형을 없애자는 것은 그의 오랜 생각이기도 했다. 2015년 7월에 유인태 의원이 여야 의원 172명의 서명을 받아 사형 폐지 특별법을 발의했는데, 유인태가 전한 바로는 발의한 뒤에 이인제가 찾아와 자신도 사형 폐지에 찬성하는데 왜 묻지 않았느냐고 했다. 사형을 없애고 가석방 없는 종신형을 두자는 법안이었다.\n\n그는 엄한 법이란 정해진 벌을 끝까지 치르게 하고 돈과 자리로 형을 줄이는 일을 막는 법이라고 말해 왔다. 사형은 처음부터 거기에 들어 있지 않았는데, 판결이 틀렸을 때 나라가 돌려줄 수 있는 것이 하나도 없기 때문이다.\n\n잘못된 판결은 재심으로 고칠 수 있지만 집행한 사형은 되돌릴 길이 없다는 생각을 그는 바꾸지 않았다.\n\n아침이 되었고, 법무부는 답을 기다리고 있다."
 tfrkphn.520.d_no:0 "대통령은 끝내 서명하지 않았다.\n\n그날 밤 홍준표 전 대통령이 글을 올려, 법에 있는 형벌을 집행하지 않는 것도 온정주의라고 썼다. 그는 여섯 달 안에 집행하라는 조문이 지금도 살아 있는데 정부가 스스로 내건 말을 지키지 않는다고 비판했다.\n\n청와대는 그 글에 답하지 않았다.\n\n서류를 가져왔던 과장은 그날 저녁 동료에게, 서명하지 않은 서류도 기록에 남는다고 했다.\n\n사형 폐지 단체들은 대통령의 결정을 반겼다. 피해자 유족 단체의 반응은 달랐다. 한 유족은 기자에게, 법에 있는 벌을 집행하지 않는다면 그 법은 누구를 위한 것이냐고 물었다. 그 질문은 그날 밤 여러 방송에서 되풀이됐다.\n\n여당 원내대표는 대통령의 소신을 존중한다는 두 줄짜리 논평만 냈다.\n\n다음 날 아침 서울구치소 독방에는 여느 날과 같은 시각에 식판이 들어갔다. 배식을 마친 교도관이 복도 끝에서 동료에게 말했다.\n\n\"뉴스 봤나. 이번에도 안 한단다.\"\n\"우리는 밥만 주면 된다.\""
 tfrkphn.520.d_yes:0 "대통령은 서명했다. 생각은 달라도 법이 살아 있는 동안에는 대통령도 그 법을 따라야 한다는 이유였고, 법무부는 곧바로 집행 날짜를 잡았다. 1997년 12월 뒤로 처음 있는 일이다.\n\n그날 밤 홍준표 전 대통령이 글을 올렸다. 자신이 끝내지 못한 일을 후임자가 끝냈다고 쓰고는, 소신과 다른 서명을 하는 것이 쉬운 일은 아니라는 말을 붙였다.\n\n사형 폐지를 말해 온 단체들은 청와대 앞에 모였는데, 그 가운데에는 2015년에 폐지에 찬성한다던 사람이 서명했다고 적은 손팻말도 보였다.\n\n집행 날 아침 과천 법무부 청사 앞에는 기자들과 시민단체 사람들이 섞여 섰다. 장관은 발표문 한 장을 읽고 질문은 받지 않은 채 들어갔다. 그날 오후 브뤼셀의 유럽연합이 깊은 유감을 밝혔고, 국제 인권 단체들은 한국을 사형 집행국 명단에 다시 올렸다.\n\n외교부는 밤새 각국 대사관에 설명 자료를 보냈다. 몇몇 나라는 잡혀 있던 회담을 미뤘다. 같은 주 국내 여론조사에서는 집행을 지지한다는 답이 더 많이 나왔다."
 tfrkphn.521.d:0 "정치 명예혁명을 말하기에 앞서 대통령은 세 사람의 이름을 꺼냈는데, 그 첫 번째가 김영삼이다.\n\n김영삼은 1927년 12월 20일 거제에서 태어나 1954년에 만 25세로 역대 가장 어린 나이에 국회의원이 되었다. 1979년에는 국회에서 제명되었으며 1983년에는 민주화를 요구하며 23일 동안 밥을 굶었다. 1990년에 3당 합당으로 여당에 들어간 그는 1993년에 대통령이 되어 군 안의 사조직 하나회를 걷어 냈고, 2015년 11월 22일에 세상을 떠났다.\n\n이인제는 1987년에 김영삼의 통일민주당에서 정치를 시작해 1993년에는 그의 정부에서 노동부 장관을 맡았다. 그러나 1997년에는 그의 당을 떠나 따로 대선에 나갔다.\n\n대통령이 김영삼에게서 물려받기로 한 것은 군이 정치에 손대지 못하게 한 일 하나다. 전쟁을 치르는 동안 군의 예산과 목소리가 함께 커졌기 때문에, 대통령은 장성 인사와 국방 예산을 국회의 심사 아래 두겠다고 밝혔다. 전쟁에서 이긴 군대는 목소리가 커지기 마련이라는 이유에서였다."
 tfrkphn.522.d:0 "두 번째 이름은 김대중입니다.\n\n김대중은 목포 앞바다 하의도에서 소작농의 아들로 태어났습니다. 1971년 대선에서 박정희에게 95만 표 차이로 졌고, 1973년에는 도쿄에서 중앙정보부 요원들에게 납치되었으며, 1980년에는 내란음모 혐의로 사형을 선고받았습니다. 대선에 네 번 나간 끝에 1997년에 당선되면서 정권이 야당으로 넘어갔습니다. 그의 정부는 외환위기를 빠르게 넘겼고 2000년 6월에는 남북 정상회담을 열었습니다. 그는 2009년 8월 18일에 세상을 떠났습니다.\n\n이인제는 1997년 대선에서 김대중과 맞섰지만, 이듬해에는 그의 당인 새정치국민회의에 들어갔습니다.\n\n대통령이 김대중에게서 물려받기로 한 것은 마주 앉는 일입니다. 김대중은 전쟁을 치른 상대와 정상회담을 연 사람이기 때문입니다. 대통령은 북쪽 정권에는 물러서지 않겠다고 하면서도, 통일은 결국 그 사람들과 함께 사는 일이니 북쪽 주민에게 건넬 말은 따로 준비하겠다고 밝혔습니다."
 tfrkphn.523.d:0 "세 번째 이름은 김종필이다.\n\n김종필은 1926년 1월 7일 충남 부여에서 태어났다. 1961년 5.16에 앞장섰고 그해 6월에는 중앙정보부를 만들어 첫 부장이 되었다. 국무총리를 두 번 지냈는데, 1971년부터 1975년까지는 박정희 아래에서였고 1998년부터는 김대중 아래에서였다. 1990년에는 3당 합당에 들어갔고 1995년에는 자유민주연합을 만들었으며, 1997년 11월 3일에는 김대중과 후보 단일화에 합의했다. 2004년 총선에서 당이 무너지자 정계를 떠난 그는 2018년 6월 23일에 92세로 세상을 떠났다.\n\n이인제는 2002년에 김종필의 자유민주연합에 들어갔고, 그의 고향 논산은 부여 바로 옆이다. 이로써 그는 세 사람의 당을 모두 거친 정치인이 되었다.\n\n대통령이 김종필에게서 물려받기로 한 것은 2인자에게 일을 맡기는 정치이고, 장관들과 임기를 함께하겠다는 약속도 그 연장에 있다. 버리기로 한 것은 한 사람이 한 지역을 쥐고 표를 흥정하던 방식이다. 대통령은 충청의 표로 당선되었다는 말을 다시는 듣지 않겠다고 했다.\n\n30년 전 이인제는 삼김 시대를 끝내자는 구호로 대선에 나섰다. 그 세 사람의 당을 모두 거친 끝에 그가 대통령이 됐다."
 tfrkphn.524.kp:0 "대전의 조달청 별관 3층에서 있었던 일인데, 시화공단에서 금형 공장을 하는 김씨는 설명회장 맨 뒷줄에 앉았다. 군이 전쟁 때 쓴 탄약 상자를 다시 채우는 사업이었고, 그 상자의 걸쇠를 찍는 금형이 잘하면 그의 몫이 될 수 있었다.\n\n설명회가 끝나자 복도에서 누가 명함을 내밀었다. 회사 이름 밑에 고문이라고 적혀 있었고 본인 말로는 예비역 대령이라고 했다.\n\n\"사장님, 이런 건 서류만 잘 낸다고 되는 게 아닙니다. 저희가 길을 좀 압니다. 낙찰가의 오 부만 자문료로 잡으시면 됩니다.\""
 tfrkphn.524.kp2:0 "김씨는 명함을 주머니에 넣었지만 자문료는 견적서에 넣지 않았다. 열흘 뒤 나온 낙찰 결과에서 김씨 공장은 이등이었다. 일등은 처음 듣는 회사였다. 박 반장이 주소를 찾아보니 오피스텔 7층인데 기계는 한 대도 없다고 했다.\n\n\"사장님, 여기는 뭘로 찍습니까?\"\n\"안 찍지. 받아서 넘기지.\"\n\n그 일감은 한 달 뒤에 정말로 김씨의 공장으로 왔고, 단가는 김씨가 써 낸 값보다 이 할이 낮았다.\n\n그날 저녁 공장 라디오에서 대통령의 목소리가 나왔고, 전쟁이 만든 돈이 정치로 흘러드는 길목을 막겠다는 말이었다. 박 반장이 소리를 키웠다. 김씨는 프레스를 세우지 않고 한마디만 했다.\n\n\"저 말, 작년에도 들었다.\""
 tfrkphn.525.d:0 "1995년 노태우 전 대통령의 비자금 사건에서 수표를 바꿔치기한 돈세탁이 드러났지만, 그때는 돈세탁을 벌할 법이 없었습니다. 1997년에 정부가 자금세탁방지법을 준비했는데도 법은 2001년에야 만들어졌고, 금융정보분석원이 문을 연 것도 그해입니다.\n\n1997년 대선에 나선 이인제는 후보 등록을 하던 날 선거자금의 수입과 지출을 시민단체의 감시 아래 두겠다고 했습니다. 기성 정당들이 금권정치에 빠져 있다는 말도 그날 했습니다.\n\n그로부터 30년이 지났습니다. 전쟁은 군수 계약과 복구 사업이라는 큰돈을 만들었는데, 감사원의 보고로는 전쟁 동안 맺은 군수 계약의 절반 이상이 경쟁 없이 맺어졌습니다. 낙찰받은 회사들의 고문 명단에는 전역한 장성과 퇴직한 관료의 이름이 있었고, 그 회사들이 낸 후원금은 여야를 가리지 않았습니다.\n\n대통령은 길목을 계약과 사람과 정치자금, 세 곳으로 짚었습니다. 한꺼번에 막을 힘은 없으니 어디부터 막을지를 정해야 합니다."
 tfrkphn.526.d:0 "기획재정부가 전쟁 국채의 마지막 회차를 갚았다고 발표했는데, 약속한 기한을 넘기지 않은 상환이었습니다.\n\n대한민국은 전에도 큰 빚을 일찍 갚은 적이 있습니다. 1997년 11월 21일에 정부는 국제통화기금에 돈을 빌려 달라고 했고, 2001년 8월 23일에 마지막 돈을 갚았습니다. 빌린 돈은 195억 달러였으며 갚은 날은 약속한 날보다 3년쯤 빨랐습니다.\n\n1997년 12월, 대선에 나선 이인제는 300일 경제위기 극복대책을 내놓았습니다. 석 달 안에 위기에서 벗어나고 여섯 달 안에 안정을 찾아 열두 달 안에 제자리로 돌아간다는 계획이었지만, 그가 선거에서 지는 바람에 써 보지도 못했습니다.\n\n30년 뒤에 그는 다른 빚을 갚았습니다. 기자들 앞에 선 대통령은 길게 말하지 않고, 이 빚은 세금을 낸 국민이 갚았다고만 했습니다."
 tfrkphn.527.d:0 "약속한 기한이 지났는데도 전쟁 국채는 [?TFRKPHN_wd_left|0]이 남았습니다.\n\n기획재정부가 상환 일정을 다시 짜겠다고 발표하자 야당은 대통령이 스스로 건 약속을 스스로 어겼다고 했고, 채권 시장에서는 국채 금리가 올랐습니다.\n\n대통령은 변명하지 않고, 남은 빚은 다음 예산에 먼저 넣겠다고만 했습니다."
 tfrkphn.528.d:0 "법무부 장관이 백서를 들고 왔다. 표지에는 과제 열한 개가 적혀 있었는데, 맨 위가 재판 지연 해소였고 맨 아래가 사법, 검찰 신뢰 회복 선언이었으며 열한 줄 모두에 완료 도장이 찍혀 있었다.\n\n대통령은 백서를 넘기다 손을 멈췄다. 1993년에 그는 서울지검 강력부 검사였고, 그해 5월에는 슬롯머신 업자의 돈을 받은 혐의로 6공의 황태자라 불리던 박철언 의원을 구속했다. 마지막 재판에서 홍준표 검사는 태양에 가까이 날다 날개가 녹아 떨어진 이카로스에 피고인을 빗댔고, 대법원은 징역 1년 6개월을 확정했다.\n\n모래시계 검사라는 별명은 이 수사에서 나왔다. 그는 2년 뒤에 검찰을 떠나 이듬해 국회의원이 됐다.\n\n대통령이 다음 정부가 이걸 뒤집으면 어떻게 되느냐고 묻자, 장관은 시행령은 바꿀 수 있어도 법으로 올린 것은 못 바꾼다고 답했다. 법으로 올린 과제는 일곱 개였고, 대통령은 나머지 네 개도 올리라고 했다.\n\n장관이 나가자 대통령은 백서를 서랍에 넣었는데, 서랍 안쪽에는 30년 넘은 공소장 사본이 한 부 들어 있었다."
 tfrkphn.529.d:0 "기획재정부 장관이 보고서를 들고 왔는데, 표지를 넘기기도 전에 결론부터 말했습니다. 갚을 전쟁 국채가 남아 있지 않다는 것이었습니다.\n\n전쟁을 치른 나라가 빚 없이 전후를 맞는 일은 드뭅니다. 대한민국은 1997년 11월 21일에 국제통화기금에 손을 벌렸다가 2001년 8월 23일에야 마지막 돈을 갚았고, 그 195억 달러를 약속보다 3년쯤 일찍 갚은 일을 오래도록 자랑으로 삼아 온 나라입니다.\n\n대통령은 2년 안에 갚겠다고 써 둔 연설문을 서랍에 넣었습니다. 빚 갚을 돈이 따로 필요 없다면 그만큼을 세금에서 덜어 내라는 것이 그 자리에서 내린 지시였습니다."
 tfrkphn.53.kp:0 "나라를 하나로 묶으려면 먼저 썩은 곳을 도려내야 하고, 그 칼을 들기 전에 대통령은 자기가 칼끝에 섰던 날의 이야기를 우리에게 들려주었다.\n\n\"2011년 5월, 6월경 호텔에서 성완종 회장을 만난 일이 있습니까?\"\n\"없습니다.\"\n\n2015년 4월 10일, 공직 생활 처음으로 그의 이름에 비리 의혹이 붙었다. 성완종 회장이 세상을 떠나며 남긴 메모 한 장 때문이었고, 거기에는 1억 원이라는 숫자와 함께 친박 인사 여섯 명 사이에 그의 이름이 적혀 있었다.\n\n출근길마다 기자들이 몰려들었고 어느 방송은 그가 출국금지를 당했다고 잘못 보도했다. 5월 초 검찰에 출두한 그는 기자 500여 명 앞에서 \"간단히 소명하러 왔습니다\"라고 말했다."
 tfrkphn.53.kp2:0 "대통령의 기억으로는 조사가 이상하게 흘러갔다. 네 시간 동안 120쪽을 채웠는데 범죄 사실은 묻지 않았다는 것이다. 호텔에서 성 회장을 만난 일이 있느냐는 그 한 줄만 빼고 말이다. 이튿날 검찰은 그가 12시간 동안 강도 높은 조사를 받았다고 발표했다.\n\n1심은 징역 2년 구형에 징역 1년 6개월 선고였다. 재판부가 자기 쪽 주장을 듣지 않았고 검사가 변호인을 협박했다는 것이 그의 주장이다. 그날 그는 노상강도를 당한 기분이라고 말했다.\n\n항소심에서 판이 뒤집혔다. 폐쇄된 문으로 들어왔다는 윤 모 씨의 말이 거짓으로 드러났고, 서로 잘 모르는 사이였던 두 사람을 잘 아는 사이처럼 꾸민 정황도 나왔다.\n\n대통령은 이렇게 말을 맺었다. 자기가 검사이던 시절에는 경찰이 고문으로 사건을 만들었는데 이제는 검사가 그 일을 한다고, 검찰이 이렇게 무너졌는데 나라의 기강이 설 리 없다고 했다."
 tfrkphn.530.story:0 "경기도 북부, 어느 탄약창.\n\n트럭 열두 대가 새벽부터 창고 앞에 줄을 섰다. 전쟁이 끝나고 남은 포탄을 우방에 판다는 공문이 내려온 것이 지난주였고, 오늘은 그 첫 물량이 나가는 날이었다.\n\n하사 계급장을 단 지 얼마 안 된 김지원이 인수증을 들고 상자 수를 셌다. 상자 옆면에는 생산 연월이 찍혀 있었는데, 전쟁이 한창이던 달에 공장들이 밤을 새워 찍어 낸 것들이었다.\n\n\"분대장님, 이거 다 나가면 우리는 뭘로 훈련합니까.\"\n\n\"교탄은 따로 남긴단다. 서류에는 그렇게 돼 있어.\"\n\n\"서류에는요.\"\n\n지원은 대답하지 않고 인수증에 서명했다. 마지막 트럭이 정문을 빠져나간 뒤 창고에 들어가 보니 선반 세 줄이 통째로 비어 있었고, 바닥에는 상자가 놓였던 자리만 먼지 없이 네모나게 남아 있었다."
 tfrkphn.531.story:0 "서울 노원구, 한 시중은행 지점.\n\n최씨는 몇 해 전과 같은 대기석에 앉아 번호표를 쥐고 있었다. 이제 일흔을 바라보는 나이였고 오늘도 정기예금 만기였다. 그때 반만 떼어 넣었던 미래펀드는 전쟁 통에 반 토막이 났다가 지난해에야 제자리를 찾았는데, 그사이 손녀는 대학을 졸업하고 반도체 회사에 들어갔다.\n\n대기석 위 TV에서는 승전 채권 광고가 나오고 있었다. 전쟁에서 진 빚을 국민이 먼저 사 주면 외국에 줄 이자가 준다는 내용이었다.\n\n옆자리에서 혀 차는 소리가 났다. 돌아보지 않아도 철물점 박씨인 줄 알 수 있었다.\n\n\"이번엔 채권이래. 펀드 다음엔 채권, 채권 다음엔 또 뭐가 나오려나.\"\n\n\"자네는 안 사나.\"\n\n\"샀지. 어제. 아들놈이 거기 갔다 왔는데 안 살 수가 있나.\"\n\n박씨는 그 말만 하고 번호표를 들여다보았다. 그 집 아들이 대만에 갔다 왔다는 것을 최씨는 그날 처음 알았다.\n\n번호가 불렸다. 창구 직원은 그때 그 직원이 아니었지만 내미는 서류는 같았다.\n\n\"재예치하시겠어요, 고객님? 승전 채권도 오늘부터 받고 있습니다.\"\n\n\"이자는 예금보다 못하다면서요.\"\n\n\"네, 조금 낮습니다.\"\n\n최씨는 펜을 든 채 잠깐 창밖을 보았다. 길 건너 철물점 셔터에는 휴가 나온 군인이 붙이고 간 부대 스티커가 아직 붙어 있었다.\n\n\"반만 해 주시오. 반은 그냥 예금으로 두고.\"\n\n직원이 웃으면서 지난번에도 그렇게 하셨다고 기록에 나온다고 했다. 최씨는 그러냐고만 하고 서명했다."
 tfrkphn.532.d:0 "PDTO 재무장관 회의에서 대한민국이 전쟁 비용을 나눠 지자고 요청했고, 회의는 예정보다 세 시간이나 길어졌습니다.\n\n일본은 함께 싸운 전쟁이니 나눠 지는 것이 맞다면서도 금액은 본국 의회와 상의해야 한다고 했습니다. 가장 먼저 분담에 동의한 것은 자기 땅에서 치른 전쟁이라고 말한 중화민국이었고, 호주는 참전 규모에 견주어 몫을 정하자는 안을 냈습니다.\n\n공동 발표문에는 구체적인 숫자 대신 형평에 맞는 분담이라는 말만 들어갔습니다. 회의장을 나온 기획재정부 장관은 기자들에게 첫 송금이 다음 달에 들어온다고 귀띔했습니다."
 tfrkphn.533.d:0 "채무 제로는 홍준표가 가장 큰 업적으로 꼽는 일이고, 경남도지사 시절을 말할 때마다 빼놓지 않는 자랑거리다. 그러나 대통령이 된 뒤로는 그것을 업적이라고 부르기 어려워졌다. 채무 제로를 약속하고 취임했지만 미국은 혼란에 빠지고 중국은 침공에 나섰고, 세계화와 정반대로 가는 다극화 시대의 대통령에게 빚을 줄일 여유는 주어지지 않았다.\n\n자신의 임기에는 지키지 못한 그 약속이 후임 정부에서 이루어졌다. 전임 정권을 잇겠다고 한 정부가 약속을 지켜 냈다는 데에 홍준표는 기뻐했지만, 정작 그 성과에 다른 사람의 이름이 붙는다는 것은 못내 아쉬워했다. 그날 그의 페이스북에 글이 하나 올라왔다.\n\n§Y제가 공약하고도 실현하지 못한 것을 이인제 정부가 실현했다. 이인제 대통령의 결단과 유능함 덕분이다.§!"
 tfrkphn.534.d:0 "채무 제로는 홍준표가 가장 큰 업적으로 꼽는 일이고, 경남도지사 시절을 말할 때마다 빼놓지 않는 자랑거리다. 그런데 자신의 뜻을 잇겠다던 정부가 그 약속을 지키지 못했으니, 그로서는 부끄럽기 그지없는 일이었다. 기한이 지난 그날 홍준표의 SNS에 글이 하나 올라왔다.\n\n§Y이인제 대통령은 똑똑히 들어라. 내 이름 팔아 가며 정치할 생각이면 당장 사퇴하라. 나는 경남에서 대한민국 최악의 빚쟁이 도를 정상으로 돌려놓았는데 당신은 한 게 무엇인가. 당신이 잘하는 철새 노릇으로 차라리 민주당으로 당적을 옮겨라.§!\n\n그날 청와대 회의에는 전임 대통령의 글에 어떻게 대응할 것인지가 안건으로 올라왔다. 이인제는 이 일은 자신의 책임이 맞다면서, 어떤 대응도 발표도 하지 말라고 지시했다."
 tfrkphn.535.d:0 "문재인 정부 시절은 대한민국 최악의 시기라고 불릴 만합니다. 대한민국은 2008년부터 11년 동안 해마다 유엔 북한인권결의안의 공동제안국에 이름을 올렸는데, 그 정부는 2019년부터 그 명단에서 빠졌습니다. 누구보다 인권을 앞세우던 사람들이 정작 같은 민족의 인권 앞에서는 입을 닫았으니, 이 얼마나 끔찍한 일인가.\n\n이재명 같은 사람들이 이 나라를 다스렸다면 대북 정책이 어디까지 망가졌을지는 짐작하기도 어렵습니다.\n\n북한인권법은 2016년 3월에 국회를 통과했고, 그 법에 따라 북한인권재단을 세우게 되어 있었습니다. 그러나 문재인 정부 5년 동안 민주당은 재단 이사를 추천하지 않았고, 100억 원이 넘던 재단 예산은 8억 원으로 깎였습니다. 그렇게 막혀 있던 재단이 오늘 정식으로 문을 엽니다. 법이 생긴 지 십 년이 넘어서야 맞는 역사적인 순간입니다.\n\n좌파가 앞으로도 인권을 말하려거든 제 민족의 인권부터 챙기기를 바랍니다."
 tfrkphn.535.kp:0 "문재인 정부 시절은 북한 인권에 관한 한 대한민국 최악의 시기라고 불릴 만하다. 대한민국은 2008년부터 11년 동안 해마다 유엔 북한인권결의안의 공동제안국에 이름을 올렸는데, 그 정부는 2019년부터 그 명단에서 빠졌다. 누구보다 인권을 앞세우던 사람들이 정작 같은 민족의 인권 앞에서는 입을 닫았으니 끔찍한 일이다.\n\n이재명 같은 사람들이 이 나라를 다스렸다면 대북 정책이 어디까지 망가졌을지는 짐작하기도 어렵다.\n\n북한인권법은 2016년 3월에 국회를 통과했고, 그 법에 따라 북한인권재단을 세우게 되어 있었다. 그러나 문재인 정부 5년 동안 민주당은 재단 이사를 추천하지 않았고 100억 원이 넘던 재단 예산은 8억 원으로 깎였다. 그렇게 막혀 있던 재단을 우리는 오늘 정식으로 연다. 법이 생긴 지 십 년이 넘어서야 맞는 날이다.\n\n좌파가 앞으로도 인권을 말하려거든 제 민족의 인권부터 챙기기를 바란다."
 tfrkphn.536.kp:0 "북쪽에서 넘어온 사람이 우리 조사관 앞에 처음 앉던 날의 기록이다.\n\n\"아, 예. 여기다가 이름 적으시면 됩니다.\"\n\"함경도 출신 맞으신가요?\"\n\"예, 맞습네다.\"\n\"직업은 공장 노동자 맞으시고요.\"\n\"예, 맞습니다.\"\n\"몇 가지만 더 조사하고 여기서 나가시게 해 드리겠습니다.\"\n\n그는 신기했다. 조사를 받는 동안 이렇게 친절한 사람은 처음 보았기 때문이다. 남조선의 심리 공작이려니 했는데 저 사람들은 자기들끼리 말할 때도 똑같이 말했다. 몇 시간이 지나도록 한 대도 맞지 않은 것이 그는 더 신기했다.\n\n지금 먹는 밥만 해도 이북에서는 구경하기 어려웠다. 그래도 그의 마음은 고기에 가 있었는데, 이 고기를 마음껏 먹어 보는 것이 그의 소원이었다. 그는 오랜만에 용기를 냈다.\n\n\"저, 고기 좀 더 주실 수 있겠습네까.\"\n\n그는 맞을 각오를 했다. 우리 조사관은 식판을 들고 일어나 고기를 한 번 더 담아 왔다."
 tfrkphn.537.kp:0 "\"무분별한 세습 경영이 우리 기업들을 다 망치고 있습니다. 세습, 뭐 좋다 이거예요. 그런데 이 나라는 도가 넘었습니다. 유럽 보세요. 유럽에서 한국처럼 하면 회사가 망합니다. 심지어 그 중국도 그 정도로는 안 해요.\"\n\n집무실 텔레비전에서 토론에 나온 누군가가 말하고 있었다. 대통령은 맞는 말이라고 했다. 그는 대통령이 되기 전부터 기업의 횡포를 보아 왔다.\n\n기업은 이 나라에 꼭 필요하다. 하지만 물은 이미 고일 대로 고였고 새로 들어오는 물은 번번이 바깥으로 떨어진다. 내부거래와 기술 약탈은 모두 제 나라 기업을 상대로 하는 짓이다.\n\n고여 있기는 일터도 마찬가지다. 한번 들어간 사람은 나오지 않고 밖에 선 사람은 들어가지 못하는 것이, 대통령이 노동부 장관이던 때와 달라진 데가 없다.\n\n욕을 먹더라도 누군가는 해야 하는 일이다. 대통령은 공정거래위원장을 다음 날 아침 7시로 불렀다."
 tfrkphn.538.kp:0 "2002년 독일은 실업률이 11퍼센트에 가까웠고 노동시장은 굳을 대로 굳어 있었다. 슈뢰더 총리는 폭스바겐의 인사 담당 이사 페터 하르츠에게 이 일을 맡겼다. 노조와 협상해 본 경험을 높이 샀기 때문이다. 하르츠는 노동계와 경영계, 정부와 학계 사람 열다섯 명으로 위원회를 꾸려 그해에 개선안 열세 가지를 내놓았다.\n\n법은 네 차례에 걸쳐 나왔다. 2003년의 첫 두 법은 실직 넉 달째부터 취업이나 직업훈련에 나설 의무를 지웠고, 월 400유로 이하의 미니잡을 넓히면서 생계형 1인 창업을 지원했다. 세 번째 법은 연방고용청을 뜯어고치고 실업급여를 받는 기간을 최장 32개월에서 18개월로 줄였다.\n\n2005년 1월에 시행된 네 번째 법은 기한 없이 주던 실업부조를 사회부조와 합쳐 월 345유로 안팎의 실업급여 2로 바꾸었으며, 알선받은 일자리를 거절하면 급여가 깎이게 했다."
 tfrkphn.538.kp2:0 "2005년에 486만 명, 실업률 11.2퍼센트까지 올랐던 실업은 그 뒤로 줄어들었다. 15세에서 64세 사이의 고용률도 2003년 64.6퍼센트에서 2011년에는 72.6퍼센트로 올랐다. 그 대신 저임금 일자리와 불안정한 일자리가 늘었다는 비판이 지금껏 따라다니고, 실업이 줄어든 것이 이 개혁 덕인지를 두고도 논란이 남아 있다. 슈뢰더의 연립정부는 네 번째 법이 시행된 그해 11월에 막을 내렸다.\n\n대통령은 이 개혁을 오래 지켜보았다. 2015년 새누리당 노동시장선진화특위 위원장이던 그는 한국이 추구할 모델이 하르츠 개혁과 비슷하다고 말했고, 그 개혁이 독일 경제를 젊고 강력하게 했다는 평가를 받는다고 덧붙였다.\n\n그가 독일에서 먼저 가져오려는 것은 열다섯 명이 한자리에 앉았던 그 방식이다. 전쟁을 함께 버틴 노동계와 경영계가 노사정위원회에 다시 앉는 날, 우리는 독일이 얻은 것과 치른 값을 나란히 적은 자료부터 돌리기로 했다."
 tfrkphn.539.kp:0 "2015년 9월 15일 노사정위원회 본회의는 노동시장 개혁에 관한 대타협을 의결했다. 대통령은 그때 여당의 노동시장선진화특위 위원장이었다.\n\n합의는 넉 달 만에 흔들렸다. 정부와 여당이 근로기준법과 고용보험법, 산재보험법, 기간제법, 파견법 개정안을 추진하면서 일반해고와 취업규칙에 관한 두 지침까지 내놓자, 한국노총은 이듬해 1월 합의 파기를 경고하고 노사정위원회 탈퇴를 선언했다. 합의문에 없던 비정규직 사용기간 연장과 파견 업종 확대가 법안에 들어갔다는 것이 노동계의 이유였다."
 tfrkphn.539.kp2:0 "법안이 국회에 묶여 있는 사이 선거가 왔다. 2016년 4월 13일 총선에서 새누리당은 122석에 그쳐 과반을 잃었고 16년 만에 여소야대 국회가 들어섰다. 다섯 법안을 한꺼번에 처리할 힘은 그날로 사라졌다.\n\n대통령은 그 봄을 잊지 않았다. 합의를 기다리는 동안에도 의석은 줄어들 수 있고, 지금의 다수가 다음 선거 뒤에도 남아 있으리라는 보장은 어디에도 없다. 우리는 언제 다시 소수당이 될지 모른다.\n\n그는 당 지도부를 불러 근로기준법과 기간제법, 파견법 개정안을 이번 회기 안에 모두 처리해 달라고 했다. 승전의 지지율이 남아 있는 지금 필요한 것은 전부 통과시켜 두겠다는 뜻이다. 노동계가 등을 돌리리라는 것은 대통령도 우리도 알고 있다."
 tfrkphn.54.kp:0 "국무회의실의 긴 탁자 위에 두꺼운 보고서가 놓였다. 표지에는 건조한 글씨로 '정부 조직 진단 결과'라고 적혀 있다.\n\n장관들은 서로 눈치를 보며 첫 장을 넘겼고, 위원회만 수백 개인데 이름만 있고 회의를 한 번도 열지 않은 곳이 수두룩했다. 같은 일을 하는 부서가 서너 곳씩 겹쳤고, 서류 한 장이 결재를 받으려면 도장 일곱 개를 거쳐야 했다. 전쟁을 치르는 동안 우리가 급한 대로 늘려 놓은 것들이다.\n\n\"전쟁은 끝났습니다. 그런데 정부는 아직도 전시 몸집 그대로입니다.\"\n\n대통령이 보고서를 덮었다.\n\n\"도지사 시절에 배운 게 하나 있습니다. 빚은 버릇입니다. 쓰던 대로 쓰고 늘리던 대로 늘리면, 그 청구서는 우리 아이들한테 날아갑니다.\""
 tfrkphn.54.kp2:0 "누군가 조심스럽게 손을 들었다. 공무원 노조의 반발과 지역구 의원들의 민원, 일자리를 줄인다는 비판이 뒤따를 것이라는 걱정이었고 대통령도 모르지 않았다.\n\n사람을 내보내자는 게 아닙니다. 새로 뽑을 자리를 묶고, 겹치는 일은 합치고, 안 쓰는 위원회부터 닫자는 겁니다. 국민 세금으로 돌아가는 조직이라면, 국민이 한눈에 알아볼 만큼 단순해야 합니다.\n\n그날 오후 우리는 공무원 정원 동결과 위원회 정비, 중복 부처 통폐합을 발표했다. 어떤 신문은 '칼바람'이라 썼고 어떤 신문은 '늦었지만 필요한 다이어트'라 썼다.\n\n집무실로 돌아온 대통령 앞에는 도장 칸이 일곱 개에서 세 개로 줄어든 새 결재판이 놓였다. 그는 짧게 웃고 첫 서명을 했다."
 tfrkphn.540.kp:0 "통계청이 2022년 8월에 내놓은 숫자로 2021년에 태어난 아이는 26만 600명, 합계출산율은 0.81명이었다. 통계를 내기 시작한 1970년 이래 가장 낮은 숫자였는데 우리는 그 뒤로 전쟁까지 치렀다.\n\n전쟁은 사람을 데려갔고, 살아 돌아온 청년의 수는 공장과 건설 현장의 빈자리를 채우기에 모자랐다. 사람은 나날이 줄어드는데 일할 사람이 없다.\n\n예전 같으면 바깥에서 사람을 불러왔을 것이다. 그러나 전쟁이 끝난 뒤로 바닷길과 하늘길은 예전 같지 않고, 사람을 보내던 나라들은 제 나라 일손을 붙잡아 두기 시작했다. 고용허가제로 들어오는 외국인 노동자는 전쟁 전보다 크게 줄었다."
 tfrkphn.540.kp2:0 "남은 길은 나라 안에 있다. 2013년 국회는 정년을 60세 이상으로 정하도록 법을 고쳤고, 이 법은 2016년에 300명 이상 사업장부터, 이듬해에는 나머지 사업장까지 적용되었다. 그때 정부와 여당은 임금피크제를 함께 묶어야 한다고 주장했지만 야당의 반대로 절충에 그쳤다.\n\n대통령은 이번에는 둘을 한 법안에 담기로 했다. 정년을 더 늘려 일하던 사람을 일터에 남기고, 해마다 저절로 오르는 임금체계를 고쳐 돌아온 청년을 뽑을 여력을 만든다는 것이다."
 tfrkphn.542.kp:0 "1993년 5월 18일, 노동부 장관 이인제는 파업 기간에도 가족수당과 식대, 교통비처럼 생활을 보장하는 성격의 임금은 주도록 행정지도를 하겠다고 발표했다. 무노동 무임금 원칙이 임금을 둘로 나누어 본 대법원 판례와 어긋난다는 것이 그의 논리였다.\n\n재계는 정면으로 반발했다. 지난해 분규를 겪은 회사의 97퍼센트가 무노동 무임금을 지켰고 미국과 서구도 그렇게 한다는 것, 파업 중에 임금을 주면 파업을 부추긴다는 것이 재계의 주장이었다. 경제기획원과 상공부도 반대했고 당정회의는 제도를 미루는 쪽으로 기울었다. 한 신문은 사설 제목에 장관의 노정관이 너무 튄다고 적었다."
 tfrkphn.542.kp2:0 "6월 9일 노동부는 방침을 거두었다. 그는 기자들에게 무노동 무임금 원칙의 현실성과 타당성을 논쟁으로 검증한 것만으로도 성과가 있었다고 말했다. 그러고도 열이틀 뒤 3부 장관 합동회견에서 이 문제가 노동관계법령을 대법원 판례와 맞추려는 과정에서 생긴 일이라고 다시 설명했다.\n\n서른 해가 넘게 지나 대통령은 그때 거둔 지침을 다시 꺼냈다. 전쟁 내내 파업을 참은 노동자들이 먼저 요구해 온 것이기도 하다. 파업을 해도 밥값과 가족수당은 끊기지 않으며, 일하지 않은 시간의 기본급은 여전히 나가지 않는다. 이번에 우리는 그것을 법에 적어 두기로 했다."
 tfrkphn.544.d:0 "한일 공동 핵억지를 그대로 두겠다는 결정이 알려진 뒤로 주변국의 항의가 쌓였습니다. 중국 외교부는 연일 성명을 냈고, 몇몇 나라는 원자력 협력과 수출 허가를 다시 살펴보겠다고 통보해 왔습니다.\n\n외교부는 이 억지력이 북핵이 사라지는 날까지만 유지된다는 점을 대통령이 직접 설명해야 한다고 건의했습니다. 청와대 안에서는 대꾸할수록 일이 커진다는 의견도 적지 않습니다."
 tfrkphn.545.d:0 "국방부가 전후 군 재편을 마쳤다고 보고했습니다. 비상 대기로 부풀었던 군은 눈에 띄게 줄었고, 군복을 벗은 사람들은 공장과 건설 현장의 빈자리로 돌아갔습니다.\n\n남은 부대는 북쪽 국경과 통일 뒤의 임무에 맞추어 다시 짜였습니다. 대통령은 보고서 끝에 서명하면서, 수를 줄인 만큼 남은 장병의 처우를 먼저 챙기라고 덧붙였습니다."
 tfrkphn.546.d:0 "국방부가 전후 군 재편을 마쳤다고 보고했습니다. 대만해협에서 이기고 돌아온 군대는 흩어지지 않았고, 편제를 거의 그대로 지킨 채 북쪽으로 돌아섰습니다.\n\n일손이 모자란다는 재계의 불만은 여전합니다. 대통령은 통일이 되는 날까지는 이 군대가 필요하다고 답했고, 그날이 오면 가장 먼저 군복을 벗길 사람들의 명단부터 만들어 두라고 지시했습니다."
 tfrkphn.55.kp:0 "대통령은 담화 원고 마지막 장에 직접 펜으로 한 줄을 덧붙였다. '말로 끝나면, 나도 끝이다.'\n\n그 담화가 나가던 시각, 변두리의 한 국밥집에서 있었던 일을 우리는 나중에 수사 기록으로 읽었다. 점심때가 조금 지나 있었다.\n\n\"야 이씨, 이번에 대통령이 특별담화 한다는 거 들었냐?\"\n\"형님요, 그런 거 들어 봐야 뭐 합니까. 뻔하지예. '나라가 어려우니 잘하겠습니다.' 아무 일도 안 일어납니다.\"\n\n몇십 분 뒤 식당 TV에 대통령의 대국민 담화가 나왔다.\n\n\"첫째, 저는 우리 공동체를 파괴하는 범죄와 폭력에 전쟁을 선포합니다. 헌법이 부여한 대통령의 모든 권한을 동원해 소탕하겠습니다. 둘째, 민주 사회의 기틀을 위협하는 불법과 무질서를 몰아내겠습니다. 셋째, 과소비와 투기, 퇴폐와 향락을 바로잡아 일하는 사회, 건강한 사회를 만들겠습니다.\""
 tfrkphn.55.kp2:0 "\"저 새끼 뭐라는 거냐? 우리 같은 놈들 잡아 처넣겠다는 거냐?\"\n\"걱정 마쇼, 형님. 우리가 짭새들한테 갖다 바친 게 얼맙니까? 절대 못 잡습니다. 잡는다 캐도 이래, 휙 하면 게임 끝입니다. 지 꼴에 검사 출신이라고 뭐 해 보는 갑지예.\"\n\"그래, 네 말이 맞다. 한두 번 겪은 일도 아니고.\"\n\n형님이라 불린 사내가 국밥에 숟가락을 얹었을 때 화면 아래로 붉은 자막이 흘렀다. '조직폭력 및 민생침해사범 전면 소탕.' 숟가락이 멈췄다.\n\n\"근데 이번엔 기류가 좀 이상하다. 검사 출신들이 직접 지휘 라인을 잡고 내려온다는 소문이 있어. 우리가 관리하던 경찰서 선에서 끝날 일이 아닐 수도 있다.\"\n\"에이, 형님도 참. 법 위에 돈 있고, 돈 위에 의리 있는 거 모릅니까. 식기 전에 드이소.\"\n\n동생은 헛웃음을 치며 소주잔을 비웠다. 구석의 다른 손님들은 TV에서 눈을 떼지 않았고 주인의 얼굴도 싸늘하게 굳어 있었다.\n\n계산대 옆에서 주인이 조용히 휴대폰을 꺼내 112를 눌렀다."
 tfrkphn.556.d:0 "1950년 여름의 낙동강 방어선은 대한민국의 마지막 보루였다. 이 선이 뚫렸다면 부산과 함께 대한민국도 지도에서 사라졌을 것이다. 그때 세계는 자유민주주의를 위해 이름도 모르던 나라에 와서 피를 흘렸다.\n\n이름 없던 그 나라는 폐허에서 일어나 이제 세계 10위 안에 드는 선진국이 되었다. 그 과정에 위기가 많았지만 한국인은 그때마다 이겨 냈다. 총탄이 날아오는 길에서는 가장 먼저 앞장섰고, 다음 세대를 위해 공장을 지었으며, 자유로운 세대를 위해 스스로 피를 흘렸다.\n\n오늘의 대한민국이 완벽한 나라는 아니다. 고쳐야 할 것도, 아직 아물지 않은 상처도 남아 있다. 그래도 한국인은 그 어느 때보다 강인하다.\n\n한국전쟁 때 압록강에서 떠 온 수통의 물은 이 격동의 세월을 견뎌 냈다. 그 물을 떴던 강가에 한국군이 다시 섰다. 이제 그 물로 상처를 닦아 낼 때다."
 tfrkphn.557.d:0 "한 주무관은 여군 부사관으로 대만해협 전쟁과 대아대전을 모두 치렀다. 전역한 뒤 홍준표 정부가 되살린 군 가산점을 받아 9급 시험에 붙었고, 첫 발령지로 평양을 받았다.\n\n평양은 부서져 있다. 몇 달 전 그녀가 소총을 들고 지나간 거리가 이제 그녀의 관할이다. 대동강의 다리는 절반이 끊겼고, 전기는 하루에 몇 시간만 들어오며, 임시 구청은 유리창 자리에 비닐을 친 학교 건물이다. 오전에는 무너진 집의 잔해를 치울 순서를 정하고 배급 줄을 정리한다."
 tfrkphn.558.d:0 "한국과 일본은 예로부터 사이가 나빴다. 식민 지배의 기억은 한 세기가 지나도록 지워지지 않았고, 1965년에 국교를 다시 연 뒤에도 두 나라는 가까워졌다가 멀어지기를 되풀이했다.\n\n그런 두 나라도 민주주의와 자유를 지킨다는 점은 같았다. 대만해협에서 민주주의가 위협받자 두 나라는 그 대의 앞에서 처음으로 하나가 되었고, 같은 바다에서 같은 적과 싸웠다.\n\n자유가 다시 위협받았을 때에도 그들은 물러서지 않았다. 대아대전에서 두 나라의 군대는 서로의 옆을 맡아 자유를 위해 싸웠고, 전쟁이 끝난 지금은 아시아의 새 질서를 짜는 자리에 나란히 앉아 있다.\n\n두 나라의 사이가 다 회복된 것은 아니다. 풀지 못한 과거사는 그대로 남아 있고, 서로에게 아직 하지 못한 말도 많다. 그래도 오늘 두 나라는 대의 앞에서 새로운 희망을 향해 나아간다."
 tfrkphn.559.d:0 "\"우리 열차는 잠시 후 마지막 역인 서울, 서울역에 도착하겠습니다. 두고 내리는 물건이 없도록 다시 한번 살펴보시기 바랍니다. 오늘도 빠르고 편안한 KTX를 이용해 주셔서 감사합니다. 안녕히 가십시오.\"\n\n안내 방송이 끝나자 그는 선반에서 더플백을 내렸다. 해군 소속이던 그는 전쟁이 시작된 뒤 처음으로 고향 서울에 왔다.\n\n전쟁이 끝난 서울은 분위기가 달라져 있었다. 역 광장의 전광판에는 귀환 열차 시간표가 떠 있었고, 여의도를 지나는 버스 창밖으로 보이는 국회의사당의 한쪽 벽에는 이산가족을 찾는다는 종이가 빼곡히 붙어 있었다. 그 맞은편에서는 사람들이 돌아온 이들을 꽃과 박수로 축복하고 있었다.\n\n집에 돌아온 그는 돌아온 자였다. 어머니는 그가 좋아하던 반찬을 상에 다 올렸고, 아버지는 말없이 그의 밥그릇에 고기를 얹었다. 오랜만에 부모님과 함께 밥을 먹었지만 이야기는 길게 이어지지 않았다. 오래 지쳐 있던 그는 오늘이야말로 푹 자고 싶었다."
 tfrkphn.56.kp:0 "정부의 군살을 빼고 나자 다음 차례가 어디인지 모두가 알았다. 노동계는 대통령이 도지사 시절에 무엇을 했는지 잊지 않았고 대통령도 잊지 않았다. 그가 회의에서 편 주장을 우리는 받아 적었다.\n\n이 나라 노동자 가운데 3퍼센트도 안 되는 사람들이 노동시장을 쥐고 흔든다는 것이 대통령의 진단이다. 노조는 원래 부당한 이익에 맞서는 사람들인데 강성 노조는 스스로 부당한 이익을 챙기는 쪽이 되었다고 그는 말한다.\n\n대통령은 진주의료원을 닫을 때 그 민낯을 보았다고 했다. 파업의 기본은 '무노동 무임금'인데 그들은 '무노동 유임금'으로 버텼다는 것이다.\n\n환자를 옮기던 중 수혈이 필요했던 한 분이 끝내 돌아가신 일도 있었다. 가족이 수혈을 반대했기 때문인데, 민노총은 그를 살인자로 몰아 형사 고소까지 했다. 외과의사가 가족에게 받아 둔 수혈 거부 동의서가 있어서 그 공세는 사실과 다른 것으로 드러났다.\n\n무상급식 감사도 그가 드는 사례다. 경남은 해마다 교육청에 무상급식비로 700억 원 넘게 보냈지만 감사는 한 번도 없었다. 백만 원을 지원해도 예산 감사는 받는 법이라며 그는 감사를 받지 않으면 지원을 끊겠다고 했고, 전교조는 그가 아이들 밥그릇을 빼앗는다고 선전했다."
 tfrkphn.56.kp2:0 "1년 넘는 싸움 끝에 감사가 이루어졌고 88개 학교에서 질 낮은 식재료와 입찰 담합, 위장 업체 같은 불법 2,306건이 나왔다. 아낀 돈으로 경남은 전국 최초로 서민 자녀 교육 지원 사업을 시작했는데, 반대쪽은 그 이야기는 쏙 빼고 그가 그 돈으로 도의 빚을 갚았다고 퍼뜨렸다는 것이 대통령의 말이다.\n\n그가 보기에 강성 귀족 노조는 그들만의 세상에 산다. 일자리를 자식에게 대물림하고 경영에 간섭하며 불법 파업을 연례행사로 치른다. 현대차의 임금은 도요타와 폭스바겐보다 높은데 노동생산성은 미국보다 낮다는 숫자도 그는 빼놓지 않았다.\n\n기업이 살아야 일자리가 생긴다. 이것을 바로잡지 못하면 기업은 해외로 떠나고 청년들은 갈 곳을 잃는다. 지난 정권은 그들과 손을 잡았지만 우리 정부는 그러지 않을 것이다.\n\n대통령은 노조 자체를 부정하지는 않는다고 했다. 바로잡으려는 것은 노조의 부당한 행동이라는 것이다. 지금 바로잡지 못하면 디트로이트의 몰락이 이 땅에서 되풀이된다는 말로 그는 회의를 끝냈다."
 tfrkphn.560.d:0 "부산 영도다리는 1934년 11월에 놓인 우리나라의 첫 연륙교이자 도개교다. 하루 일곱 번씩 다리가 하늘로 들리는 모습은 그 시절 부산의 구경거리였다.\n\n한국전쟁 때 이 다리는 다른 뜻을 얻었다. 피란길에 흩어진 사람들은 헤어진 가족을 만나려고 다리 밑으로 모여들었고, 그곳은 기다리는 사람들의 자리가 되었다. 가족의 생사만이라도 알고 싶은 사람들이 찾아오면서 다리 밑에는 점집이 줄지어 들어섰다."
 tfrkphn.561.d:0 "마침내 포연이 걷혔다. 대만해협에서 시작해 압록강에서 끝난 두 번의 전쟁에서 대한민국과 그 동맹은 승리했고, 한반도는 하나의 나라가 되었다.\n\n플레이어여, 당신은 두 사람의 대통령과 함께 이 길을 걸었다. 검사 출신의 대통령과 함께 대만의 자유를 지켰고 미국이 거두어 간 핵우산의 빈자리를 메웠으며, 가장 늙은 대통령과 함께 전쟁 빚을 갚고 재벌을 고치고 북녘의 동포를 맞았다. 한라에서 출발한 걸음은 백두에 닿았다."
 tfrkphn.562.d:0 "노인의 완주는 끝이 났다. 숨을 고르며 그는 이제 다음 주자를 기다리기 시작한다.\n\n한때 그는 가장 젊은 대권 주자였다. 젊은 나이에 노동부 장관이 되어 재계와 맞섰고, 1997년에는 처음으로 대통령 선거의 출발선에 섰다. 그 뒤로도 여러 번 출발선에 섰지만 결승선에는 그때마다 다른 사람이 먼저 들어갔다. 사람들이 그의 이름을 지난 시대의 것으로 여기게 된 뒤에도 그는 달리기를 그만두지 않았다.\n\n가장 늙은 대통령이 되었을 때 노인은 마지막 힘을 냈다. 그는 이긴 전쟁과 갚아야 할 빚, 휴전선 너머의 오래된 숙제를 물려받았다. 전쟁으로 나라가 혼란에 빠지고, 아시아가 다시 짜이고, 공산 독재가 무너지기 시작하는 동안 그는 한 번도 걸음을 늦추지 않았다. 한라에서 출발을 알렸고, 백두를 바라보았으며, 마침내 압록강에 닿았다."
 tfrkphn.563.story:0 "내각이 출범한 지 두 달이 지났다. 여의도는 여전히 시끄럽지만 대통령의 책상 위는 조금씩 정리되어 가고 있다. 그 책상에 가장 자주 서류를 올리는 사람은 이인제 국무총리다.\n\n우리는 이 사람을 잘 안다. 2017년 경선에서 대통령과 맞붙었고, 독자 핵무장을 묻는 토론에서 반대 팻말을 든 사람이다. 그 이듬해 당이 가장 어려웠을 때 아무도 나서려 하지 않던 충남지사 선거에 나가 달라고 부탁한 쪽도 우리였다. 당 대표였던 대통령은 그를 김종필 이후 충청이 낳은 가장 큰 인물이라고 치켜세웠고, 그는 벽돌 한 장이 되겠다며 그 부름을 받았다."
 tfrkphn.564.story:0 "대통령은 2021년 가을의 경선 토론에서 나토식 핵공유를 다섯 해 전부터 주장해 왔다고 말했다. 서독의 슈미트 총리가 미국에 전술핵을 들여놓으라고 요구했던 일이 그가 든 근거였다. 이제 우리는 그 주장을 협의체라는 이름으로 책상 위에 올렸다.\n\n국무회의에서는 한 사람만 반대했다. 이인제 총리다. 그는 2017년에 들었던 반대 팻말을 내려놓은 적이 없고, 유럽에서 가장 강한 나라 독일에는 핵이 없다는 말을 그날도 되풀이했다.\n\n대통령은 독일이 핵 없이 버티는 것은 미국의 핵이 그 땅에 들어가 있어서라고 받았다. 회의는 십 분 만에 끝났고 안건은 원안대로 넘어갔다."
 tfrkphn.565.story:0 "전쟁이 석 달째로 접어들었다. 조선소와 탄약 공장의 노조가 전시 수당을 걸고 파업을 예고했고, 군수 생산이 멈추면 전선도 멈추기 때문에 우리는 긴급조정권을 꺼낼 채비를 했다.\n\n그때 이인제 총리가 자기가 내려가겠다고 했다. 핵공유에 혼자 반대표를 던졌던 그 사람이다. 그에게는 내세울 것이 하나 있었다. 1993년 6월 노동부 장관이던 그는 현대 노사분규가 한창이던 울산에 내려갔다. 장관이 분규 현장에 직접 들어가 중재한 것은 정부 수립 뒤 처음이었고, 그는 열여섯 시간 만에 현대자동차 노조 위원장에게서 당장 강경한 파업은 하지 않겠다는 말을 받아 냈다."
 tfrkphn.566.story:0 "전당대회가 끝났고 후보는 이인제로 정해졌다. 다섯 해 가까이 대통령의 책상에 서류를 올리던 총리가 이제 후보다. 2022년에 그를 부를 때 여기까지 내다본 사람은 우리 가운데 없다. 그날 밤 대통령은 그를 관저로 불렀고, 차는 내오지 않았다.\n\n전쟁에서 이긴 대통령에게는 한 번 더 하라는 말이 따라붙는다. 헌법을 고쳐 다시 나서라는 권유가 여러 번 올라왔지만 대통령은 그때마다 서류를 돌려보냈다. 그는 2017년 5월 9일 밤 개표가 열에 하나도 끝나지 않았을 때 선거 결과를 수용하겠다고 말한 사람이다. 그런 사람이 전쟁을 핑계로 선거를 건너뛸 수는 없다는 것이 그의 대답이었다.\n\n대통령에게는 계파가 없다. 물려줄 계파가 없으니 넘겨줄 것은 일밖에 없다. 그가 내민 종이에는 네 줄이 적혀 있었다. 핵억지, 채무, 군 가산점, 사형제. 손대지 말라는 것들의 목록이다."
 tfrkphn.57.kp:0 "칼을 휘두를수록 적은 늘었다. 신문은 매일 아침 '독선'이라 썼고 방송은 '불통'이라 했다. 우리가 해명 자료를 아무리 내도 달라지는 것은 없었다. 대통령은 마이크를 직접 잡기로 했고, 대통령이 되고 처음으로 그 오래된 채널의 녹화 버튼이 다시 켜졌다.\n\n\"홍카콜라 시청자 여러분, 오랜만이다. 제가 대통령이 된 지 벌써 이만큼 지났다.\n\n대만 전쟁 때 저는 대만을 도와야 한다고 호소했다. 국회의 결정이 어떻게 났든, 대한민국은 끝까지 자유민주주의 편에 섰다. 미국이 내전으로 무너졌을 때, 솔직히 저는 다 끝났다고 생각했다. 그런데 민주주의는 제 생각보다 강했다. 그 승리는 대한민국 국민 여러분의 것이다."
 tfrkphn.57.kp2:0 "TV홍카콜라는 2018년 12월에 문을 열었다. 정치판도 언론도 기울어진 운동장이었다. 저는 속 시원한 진실을 국민께 직접 전하고 싶었다.\n\n언론이 할 일은 사실을 전하는 것이다. 그래야 국민이 바르게 판단한다. 그런데 박근혜 탄핵 무렵부터 언론은 사실보다 자기들이 바라는 방향을 먼저 보도했다. 좌파 언론에서 시작된 버릇이 다른 언론으로 번졌다.\n\n한때 40퍼센트에 이르던 공영방송 시청률은 이제 10퍼센트 아래로 떨어졌다. 신문 구독 부수도 날로 줄고 있다.\n\n저는 홍카콜라를 공정한 언론으로 키우겠다. 가짜 뉴스는 이 홍준표가 척결하겠다.\""
 tfrkphn.570.d:0 "부결이다. 탕탕탕. 그런데 도장이 없다.\n\n도장은 뛰고 있다. 다리 위를 뛴다. 빨간 조끼를 입었다. 도장이 왜 조끼를 입습니까. 묻지 마십시오. 지금 중요한 것은 도장이 꽤 빠르다는 것이다.\n\n2016년 3월 24일, 새누리당 대표는 공천장 다섯 장에 도장을 찍지 않겠다며 부산으로 내려갔다. 서른 시간쯤 뒤에 그는 서울로 돌아왔고 세 곳은 후보 없이 선거를 치렀다. 사람들은 화를 내다가 웃었고 웃다가 다시 화를 냈다. 당은 그 일로 무성이 나르샤라는 홍보 영상을 찍었고 회의장 벽에는 정신 차리자, 한순간 훅 간다는 글을 붙였다. 그리고 그해 총선에서 정말로 훅 갔다. 여기까지가 실제 일이다.\n\n다시 도장이다. 도장은 한강을 건넜다. 천안을 지났다. 대전에서 빵을 샀다는 제보가 있다. 도장에게 손이 있느냐고 묻자 제보자는 전화를 끊었다.\n\n여론조사 기관이 급히 전화를 돌렸다. 도장이 뛰는 것을 어떻게 보십니까. 잘 뛴다 41, 못 뛴다 12, 도장이 뭔데 47. 나라의 절반 가까이가 도장이 뭔지 모른다. 우리는 이 숫자를 대통령에게 보고하지 않기로 했다.\n\n도장이 없으면 부결 통지서를 보낼 수 없다. 통지서를 못 보내면 부결은 없던 일이다. 누가 정한 규칙이냐고요. 방금 정했다.\n\n재표결이다. 야당 의원들은 도장을 잡으러 부산에 갔다. 본회의장에는 여당만 남았다. 재석 112인, 찬성 112인. 가결이다. 탕탕탕. 도장은 대통령 것을 빌렸다.\n\n밤 열한 시, 영도다리에서 도장이 잡혔다. 도장은 고뇌에 찬 얼굴로 바다를 보고 있었다. 도장에게 얼굴이 있느냐는 질문은 받지 않겠다."
 tfrkphn.572.d:0 "2011년 8월 24일 서울에서 무상급식 주민투표가 치러졌습니다. 오세훈 시장은 이 투표에 시장직을 걸었고, 투표율은 25.7퍼센트로 개표 기준인 3분의 1에 못 미쳤습니다. 이틀 뒤 그는 즉각적인 사퇴로 책임을 다하겠다며 물러났습니다.\n\n그때 한나라당 대표가 홍준표였습니다. 그는 당과 상의 없이 투표를 밀어붙인 것, 시장직을 건 것, 사퇴를 미루지 않은 것을 들어 오 시장에게 세 번 농락당했다고 말했습니다.\n\n십 년이 넘게 지나 한 사람은 대통령이, 한 사람은 다시 서울시장이 되었습니다. 서울시장은 국무회의에 배석할 수 있는 자리라 두 사람은 이제 같은 방에 앉습니다. 첫 회의에서 대통령은 오 시장 쪽을 보지 않았고, 오 시장은 서울시 안건이 나올 때만 입을 열었습니다.\n\n우리 가운데 누군가 그때 일을 꺼내자 대통령은 약속한 대로 물러난 것 하나는 인정한다고 했습니다."
 tfrkphn.573.d:0 "서울시는 2021년 11월 11일 안심소득 시범사업의 정부 승인을 받았습니다. 중위소득 85퍼센트에 못 미치는 800가구를 골라, 기준액에서 모자라는 소득의 절반을 세 해 동안 현금으로 채워 주는 사업입니다.\n\n정부가 서민 대책을 내놓은 주에 오세훈 시장은 이 사업을 전국으로 넓히자고 제안했습니다. 모두에게 똑같이 주는 돈보다 어려운 사람에게 더 주는 돈이 보수가 할 복지라는 것이 그의 설명이었습니다.\n\n대통령은 2020년 6월 기본소득을 두고 사회주의 배급제도를 실시하자는 것과 다름이 없다고 말한 사람입니다. 안심소득은 기본소득과 다르다는 보고를 받고도 그는 현금을 쥐여 주는 일에는 선뜻 고개를 끄덕이지 않았습니다.\n\n기획재정부는 서울의 세 해 결과를 본 뒤에 정하자는 의견을 올렸습니다."
 tfrkphn.574.d:0 "2019년 2월 17일 자유한국당 당 대표 후보 토론에서 오세훈은 북한에 핵 폐기 기간을 주고 우리도 핵을 개발한다고 하는 넛지 전략을 써야 한다고 말했습니다. 우리가 핵 개발의 여지를 가질 때 중국도 움직이고 미국도 심각하게 생각한다는 것이 이유였습니다.\n\n핵공유 협의체가 발표된 날 오 시장은 그 말을 다시 꺼냈습니다. 협의체는 첫걸음이고, 협의가 막히면 스스로 만들 수 있다는 것을 보여 줘야 상대가 자리에 앉는다는 글이었습니다.\n\n국무회의에서 혼자 반대한 총리와 정부보다 더 나가자는 서울시장 사이에서 대통령은 협의체 원안을 그대로 밀고 갑니다. 외교부는 오 시장의 글이 협상에 쓸모가 있다고 보고 있습니다. 한국 안에 더 센 목소리가 있다는 것을 상대도 읽기 때문입니다."
 tfrkphn.575.d:0 "임기 마지막 해가 되자 당 안에서는 다음 후보를 두고 말이 많아졌습니다. 총리 이인제와 서울시장 오세훈이 앞서 있고, 두 사람 모두 대통령과 가깝다고 하기는 어렵습니다.\n\n대통령이 한쪽 손을 들어 주면 끝나는 일이라는 건의가 여러 번 올라왔지만 대통령은 받지 않았습니다. 2011년에 오 시장이 당과 상의 없이 시장직을 걸었을 때 가장 화를 낸 사람이 당 대표이던 자신이었다는 것, 그러니 이제 와서 자기가 당원들과 상의 없이 후보를 정할 수는 없다는 것이 그의 말이었습니다.\n\n오세훈 시장이 출마하려면 시장직에서 물러나야 합니다. 그는 한 번 시장직을 걸었다가 잃은 사람이고, 이번에는 스스로 내려놓고 나섭니다. 전당대회는 당원 투표와 국민 여론조사로 치르기로 했습니다."
 tfrkphn.576.d:0 "1997년 7월 21일 신한국당 전당대회 결선에서 이인제는 이회창에게 졌습니다. 그는 그 자리에서 경선 결과에 승복한다고 말했고, 도정에만 전념하겠다고도 했습니다. 그해 9월 13일 그는 당을 떠나 민심의 바다에 뛰어들겠다며 출마를 선언했습니다. 그 뒤로 경선 불복이라는 말은 삼십 년 동안 그의 이름 앞에 붙어 다녔습니다.\n\n2027년 킨텍스에서 진 사람은 오세훈입니다. 그는 결과가 나온 자리에서 연단에 올라 승복한다고 말했고, 선거가 끝날 때까지 유세차에 함께 올랐습니다. 시장직은 이미 내려놓은 뒤라 그에게 돌아갈 자리는 없었습니다.\n\n취임 뒤 대통령은 오세훈을 따로 불러 점심을 함께했습니다. 그 자리에서 대통령은 자기는 그때 그렇게 하지 못했다고 말했습니다. 오세훈이 무엇이라고 답했는지는 전해지지 않습니다."
 tfrkphn.577.d:0 "2017년 3월 19일의 경선 토론에서 대통령은 독자 핵무장에 반대 팻말을 들었습니다. 두 해 뒤인 2019년 2월 17일 오세훈은 당 대표 후보 토론에서 우리도 핵을 개발한다고 하는 넛지 전략을 써야 한다고 말했습니다. 두 사람은 같은 당 안에서 가장 멀리 떨어진 자리에 서 있었습니다.\n\n정부가 핵 문제의 방향을 내놓자 오세훈이 신문에 글을 실었습니다. 북쪽의 핵이 사라진 것이 확인될 때까지는 물려받은 억지력에 손대지 말아야 하고, 내려놓는 순서는 상대가 먼저여야 한다는 내용이었습니다.\n\n대통령은 그 글을 오려서 보고서 맨 뒤에 붙여 두라고 했습니다. 생각은 다르지만 협상장에 들고 갈 반대 의견으로는 쓸 만하다는 것이었습니다."
 tfrkphn.578.d:0 "오세훈은 서울시장 때 안심소득 시범사업을 시작했습니다. 중위소득 85퍼센트에 못 미치는 가구에 모자라는 소득의 절반을 현금으로 채워 주는 사업으로, 2021년 11월 11일에 정부 승인을 받았습니다.\n\n시장직에서 물러난 그는 그 사업의 결과 보고서를 들고 대통령을 찾아왔습니다. 대통령의 복지는 일자리가 먼저이고 고용보험과 복지카드가 그 뒤를 받칩니다. 일할 수 없거나 일해도 벌이가 모자라는 사람들이 그 사이로 빠진다는 것이 오세훈의 말이었습니다.\n\n대통령은 보고서를 끝까지 읽고 보건복지부에 넘겼습니다. 전쟁 빚을 갚는 동안에는 새 현금 사업을 벌이기 어렵다는 것이 재정 당국의 의견입니다."
 tfrkphn.579.d:0 "오세훈이 시장이던 2007년에 서울은 2010년 세계디자인수도로 뽑혔습니다. 한강 둔치를 고치고 동대문운동장 자리에 새 건물을 올리는 일도 그의 임기에 시작되었습니다. 돈을 너무 썼다는 비판과 도시가 달라졌다는 평가가 지금도 함께 따라다닙니다.\n\n대통령은 그에게 북쪽 도시를 다시 짓는 일을 준비하는 위원회를 맡아 달라고 했습니다. 통일이 오면 평양과 신의주, 원산에는 상하수도와 전기, 집이 한꺼번에 필요합니다. 시장직을 내려놓으며 서울에서 배운 것을 나라로 가져가겠다고 한 사람이니 그 말을 북쪽에서 써 보라는 것이었습니다.\n\n오세훈은 사흘 뒤에 맡겠다고 답했습니다. 조건은 위원회의 회의록을 모두 공개한다는 것 하나였습니다."
 tfrkphn.580.d:0 "대통령은 1995년 첫 민선 경기도지사였습니다. 그로부터 스물세 해 뒤 같은 자리에 앉은 사람이 지금의 더불어민주당 대표 이재명입니다. 이재명 지사의 경기도는 2019년부터 만 24세 청년에게 분기마다 25만 원을 지역화폐로 주는 청년기본소득을 시작했습니다.\n\n이재명은 다섯 해째 당을 쥐고 있습니다. 그사이 그에게 맞섰던 의원들은 공천에서 차례로 떨어졌고, 지금 야당에서 그와 다른 말을 하는 사람은 손에 꼽습니다.\n\n정부가 고용보험을 넓히는 안을 내놓자 그는 다른 안을 들고 나왔습니다. 일자리를 잃은 사람만 받는 보험으로는 일자리를 가져 본 적 없는 사람이 빠지니, 전쟁에서 돌아온 청년 모두에게 조건 없이 주자는 것이었습니다. 정부가 이 안을 받지 않으면 돌아온 청년들의 불만이 고스란히 정부 몫이 된다는 것을 그도 알고 있습니다.\n\n대통령은 일해서 버는 돈이 복지의 뼈대라는 생각을 바꾸지 않았습니다. 그러면서도 야당 안을 국회 상임위원회에 함께 올려 같은 날 심사하게 하라고 했습니다."
 tfrkphn.581.d:0 "이낙연은 2019년 10월 28일 재임 881일로 가장 오래 일한 국무총리가 되었고 이듬해 1월에 물러났습니다. 2022년 대선에서는 홍준표 대통령에게 졌습니다.\n\n정부가 책임총리제를 내놓은 주에 한 신문이 그에게 생각을 물었습니다. 그는 제도보다 대통령이 참는 것이 먼저라고 답했습니다. 총리가 고른 장관이 마음에 들지 않을 때, 총리의 결정이 여론에 밀릴 때 대통령이 끼어들지 않아야 제도가 선다는 것이었습니다.\n\n대통령은 그 기사를 읽고 이낙연에게 전화를 걸었습니다. 두 사람 모두 대통령 선거에서 져 본 사람입니다. 통화가 끝난 뒤 대통령은 총리를 지낸 사람들을 여야 가리지 않고 한 해에 두 번 청와대로 부르기로 했습니다."
 tfrkphn.582.d:0 "국회 국방위원회에서 김병주 의원이 국방부 장관을 불러 세웠습니다. 그는 한미연합사 부사령관을 지낸 예비역 대장이고, 대만지원법 때는 파병 조항에 반대한 사람입니다.\n\n질문은 세 가지였습니다. 대만해협에서 돌아온 부대를 북쪽 산악에 맞게 다시 짜는 데 몇 해가 걸리는지, 그동안 전방의 빈자리는 누가 메우는지, 북쪽 안정화 부대가 주민을 상대할 때 따를 교전 규칙은 누가 정하는지였습니다.\n\n국방부는 앞의 둘에는 숫자로 답했고 마지막 질문에는 답을 미뤘습니다. 보고를 받은 대통령은 교전 규칙의 뼈대를 국회에 먼저 보고하라고 지시했습니다. 군이 북쪽에 들어가기 전에 국회가 그 규칙을 알고 있어야 한다는 이유였습니다."
 tfrkphn.583.d:0 "대선 다음 날 아침 이낙연이 전화를 걸어 왔습니다. 그는 결과를 받아들인다고 했고, 지지해 준 사람들에게 미안하다는 말을 먼저 한 다음 당선을 축하했습니다.\n\n대통령은 그 전화가 어떤 것인지 압니다. 2017년 5월 9일 밤 개표가 열에 하나도 끝나지 않았을 때 그는 선거 결과를 수용한다고 말했습니다. 다섯 해 전에 자기가 하던 말을 이번에는 듣는 쪽이 되었습니다.\n\n이낙연은 2019년 10월 28일에 가장 오래 일한 국무총리가 된 사람입니다. 통화 끝에 그는 한 가지를 부탁했습니다. 선거에서 진 쪽의 대표를 정해진 날짜에 만나 달라는 것이었습니다.\n\n대통령은 그러겠다고 답했습니다. 우리는 달력에 석 달에 한 번씩 표시를 해 두었습니다."
 tfrkphn.584.d:0 "대선에서 진 더불어민주당이 새 대표를 뽑았습니다. 2021년 10월 경선에서 이낙연에게 졌던 이재명입니다. 진 후보를 도왔던 의원들은 당직에서 물러났고, 그 자리는 한 주 만에 이재명의 사람들로 채워졌습니다.\n\n이재명은 성남의 공장에서 일하며 검정고시로 대학에 갔고, 사법시험에 붙은 뒤 인권과 노동 사건을 맡다가 성남시장과 경기도지사를 지냈습니다. 2021년 가을에 불거진 대장동 의혹은 그를 경선에서 넘어뜨렸지만 그를 따르는 사람들을 흩어 놓지는 못했습니다.\n\n전당대회장 밖에는 그의 이름을 외치는 사람들이 늦게까지 남아 있었습니다. 그는 수락 연설에서 정권을 심판하겠다고 했고, 바다 건너의 싸움에는 끼어들지 않겠다는 것을 당의 방침으로 못 박았습니다. 다른 목소리를 낸 의원 몇은 그날 밤 문자를 수천 통씩 받았습니다.\n\n대통령은 연설을 보고 나서 저 사람은 지는 법을 한 번 배웠으니 두 번은 지지 않으려 들 것이라고 했습니다. 우리는 앞으로 국회에서 올라올 반대가 모두 이 사람의 손을 거쳐 올 것이라고 보고했습니다."
 tfrkphn.585.d:0 "2017년 2월 8일 성남시장이던 이재명은 사법시험이 우리 사회에 계층 이동의 기회를 부여한다고 말했습니다. 국민 다수가 사법시험과 로스쿨이 함께 있기를 바란다는 말도 했습니다. 같은 당의 문재인 전 대표는 로스쿨을 만든 정부 사람으로서 되돌리기 어렵다는 입장이었습니다.\n\n정부가 사법시험 부활안을 내자 야당 안에서는 반대가 먼저 나왔습니다. 이재명 대표는 그 반대를 당론으로 묶지 않았습니다. 자기가 예전에 한 말을 뒤집을 수는 없다는 것이 내놓은 이유였습니다. 우리 가운데에는 고시생과 그 부모들의 표를 여당에 통째로 넘겨주지 않으려는 계산으로 읽는 사람이 더 많습니다.\n\n법안은 야당 의원 일부의 찬성표를 얻었습니다. 표결 결과를 보고받은 대통령은 정권 심판을 외치는 사람에게서 표를 받을 줄은 몰랐다고 했습니다."
 tfrkphn.586.d:0 "대만지원법 표결 전날 밤 국회 본청의 야당 대표실에는 불이 늦게까지 켜져 있었습니다. 우리가 이 이야기를 들은 것은 한참 뒤의 일이고, 전해 준 사람은 그날 그 방에 있었습니다.\n\n이재명 대표는 법안이 어느 쪽으로 가든 손해 볼 것이 없다고 말했습니다. 법이 통과되면 전사자가 나올 때마다 정부가 값을 치르고, 막히면 대만이 무너진 책임이 대통령에게 돌아간다는 계산이었습니다.\n\n반대 토론은 김병주 의원에게 맡겼습니다. 군복을 입었던 사람이 말해야 반대가 겁쟁이의 말로 들리지 않는다는 이유였습니다. 김 의원이 헌법 60조를 읽겠다고 하자 대표는 좋은 생각이라고만 했습니다.\n\n방을 나서던 한 의원이 대만이 정말로 무너지면 어떻게 하느냐고 물었습니다. 대표는 대답 대신 내일 표결에서 이탈하는 사람의 이름을 적어 오라고 했습니다."
 tfrkphn.587.d:0 "2016년 3월 10일 정청래는 더불어민주당 공천에서 배제되었습니다. 마포을의 재선 의원이었고 거친 말이 이유로 꼽혔습니다. 엿새 뒤 그는 당사 앞에서 당 지도부는 저를 버렸지만 저는 당을 버리지 않겠다고 말했고, 탈당하지 않은 채 다른 후보들의 유세를 도왔습니다.\n\n이재명 대표가 당직을 갈아 치운 뒤 이낙연을 도왔던 의원들 사이에서 탈당 이야기가 돌았습니다. 정청래 의원은 그 의원들을 한 사람씩 찾아가 말렸습니다. 자기는 잘려 봤고, 잘린 사람이 나가면 당은 자른 사람의 것이 된다는 말이었습니다.\n\n같은 주에 그는 의원총회에서 대표를 마주 보고 사람을 잘라 내는 것으로 당을 쥐려 하지 말라고 했습니다. 회의장은 조용했고 박수를 친 사람은 없었습니다.\n\n우리는 이 보고를 올리면서 야당이 갈라지면 정부에 이롭다고 덧붙였습니다. 대통령은 야당이 한 사람의 것이 되는 쪽이 나라에는 더 나쁘다고 답했습니다."
 tfrkphn.588.d:0 "정청래 의원은 2016년 공천에서 배제되고도 당에 남으면서 나라의 주인이 국민이듯 당의 주인은 당원이라고 말한 사람입니다. 그는 지금 야당에서 이재명 대표와 다른 말을 하는 몇 안 되는 의원입니다.\n\n대통령이 진영 정치로 돌아가지 말자며 정치 개혁을 꺼내자 야당 지도부는 논의에 들어오지 않기로 했습니다. 정청래 의원은 혼자 회의장에 나왔습니다. 그가 들고 온 것은 공천을 당원 투표로 정하도록 못 박는 법안이었습니다.\n\n그 법안이 통과되면 여당도 같은 규칙을 따라야 해서 여당 안에서도 반대가 많았습니다. 대통령은 1997년에 경선 결과를 두고 당을 떠났던 사람이고, 누가 후보를 정하느냐는 물음이 얼마나 무거운지 압니다. 그는 이 법안을 정부안과 함께 심사하게 하라고 했습니다.\n\n회의가 끝난 뒤 정청래 의원은 당에 돌아가면 징계가 기다리고 있을 것이라며 웃었습니다."
 tfrkphn.589.d:0 "정청래 의원은 대학 시절 미 대사관저 점거 농성으로 두 해를 복역한 사람입니다. 대만지원법에는 반대표를 던졌고, 사람들이 바다를 건넌 뒤에도 본회의장에서 돌아오게 하라고 요구했습니다.\n\n전쟁이 끝난 주에 그는 전사자들의 합동 빈소를 찾았습니다. 유족 가운데 한 사람이 반대하던 사람이 여기는 왜 왔느냐고 소리쳤습니다. 그는 대꾸하지 않고 영정마다 절을 한 뒤 방명록에 이름만 적고 나왔습니다.\n\n기자들이 따라붙어 지금도 반대하느냐고 물었습니다. 그는 보내지 말자고 한 사람도 돌아오지 못한 사람 앞에서는 고개를 숙여야 한다고 답했습니다.\n\n그날 저녁 대통령도 같은 빈소에 들렀습니다. 두 사람이 마주쳤는지는 우리도 모릅니다. 방명록에는 두 이름이 한 장 건너 적혀 있었습니다."
 tfrkphn.59.kp:0 "여당 지도부와의 당정협의가 세 시간째 이어지고 있다. 탁자 위에는 내년도 예산안이 펼쳐져 있고 당이 원하는 것은 분명하다. 선거가 다가오고 있어서 지역구마다 다리와 도로, 체육관이 필요한데, 그 돈을 마련할 가장 손쉬운 곳이 국방 예산이다.\n\n\"전쟁은 끝났습니다, 대통령님. 국민들은 이제 총보다 밥을 원합니다.\"\n\"전력증강 사업 몇 개만 몇 년 늦추면 됩니다. 아무도 모릅니다.\"\n\n대통령은 말없이 예산안을 넘겼고, 3축 체계 예산 옆에 연필로 그은 줄이 보였다. 누군가 미리 지워 둔 자리다. 그는 연필을 내려놓았다.\n\n\"여러분 말이 맞을 수도 있습니다. 선거는 이겨야 하지요. 당도 살아야 하고.\""
 tfrkphn.59.kp2:0 "몇몇 의원의 얼굴이 풀렸고, 대통령은 천천히 자리에서 일어섰다.\n\n\"지난 30년간 나는 당에 충성하는 정치를 해왔다\n이제부터 나는 국익에 충성하는 정치를 해오겠다\"\n\n회의실이 조용해졌고, 대통령은 지워진 줄 위에 다시 동그라미를 쳤다.\n\n\"국방은 정쟁의 대상이 아닙니다. 여당의 것도, 야당의 것도 아닙니다. 다음 전쟁은 우리가 준비한 만큼만 이길 수 있습니다.\"\n\n그날 밤 당 지도부에서는 대통령이 당을 버렸다는 말이 돌았다. 다음 날 아침 우리는 국방부 장관의 책상에 한 장짜리 지시를 올렸다. '전력증강 사업, 한 건도 미루지 말 것.'"
 tfrkphn.590.d:0 "공천 법안을 들고 정부 회의에 나온 뒤 정청래 의원은 당 윤리심판원에 넘겨졌습니다. 사유는 당론을 어기고 정부와 손을 잡았다는 것입니다. 당원 게시판에는 그를 내보내라는 글이 하루에 수천 건씩 올라왔습니다.\n\n심판원에 나가는 길에 기자들이 탈당할 생각이 있느냐고 물었습니다. 그는 2016년에 한 말을 그대로 되풀이했습니다. 당 지도부는 저를 버렸지만 저는 당을 버리지 않겠다는 말입니다.\n\n결정은 당원 자격 정지 여섯 달이었습니다. 그는 결정문을 받아 들고 여섯 달 뒤에 다시 오겠다고 했고, 이튿날부터 지역구 사무실로 출근했습니다.\n\n대통령은 보고를 듣고 자기는 저 나이에 저렇게 하지 못했다고 했습니다. 1997년의 그는 당을 떠났습니다."
 tfrkphn.591.d:0 "통일 뒤 처음 열린 더불어민주당 전당대회에 이재명 대표는 출마하지 않았습니다. 여러 해 동안 대표가 정하던 자리를 이번에는 당원 투표로 뽑기로 했고, 그 규칙을 처음 들고 나왔던 사람이 후보로 나섰습니다.\n\n정청래 의원은 자격 정지가 풀린 뒤 지역구에서 올라와 출마를 선언했습니다. 연설은 짧았습니다. 나라의 주인이 국민이듯 당의 주인은 당원이라는 2016년의 말을 다시 했고, 당을 떠난 사람들에게 돌아오라고 했습니다.\n\n개표 결과 그가 대표로 뽑혔습니다. 무대에 오른 그는 두 손을 들어 보였고, 객석에는 몇 해 전 당을 떠났다가 돌아온 얼굴들이 섞여 있었습니다.\n\n대통령은 축하 전화를 걸어 이제 상대할 맛이 나겠다고 했습니다. 우리는 다음 국회가 지금보다 시끄러워질 것이라고 보고했고, 대통령은 그것이 정상이라고 답했습니다."
 tfrkphn.592.d:0 "개헌 논의가 시작된 지 한 달 만에 더불어민주당이 의원총회를 열어 개헌안 반대를 당론으로 정했습니다. 이재명 대표는 전쟁에서 이긴 정부가 그 기세로 헌법까지 고치려 든다고 말했습니다.\n\n그는 조문을 하나하나 따지지 않았습니다. 지금 헌법을 고치면 고친 사람의 헌법이 된다는 말만 되풀이했고, 찬성 쪽으로 기울던 의원 몇을 대표실로 불렀습니다. 그 의원들은 방에서 나온 뒤로 입을 닫았습니다.\n\n우리가 세던 찬성표는 그날 저녁에 몇 줄었습니다."
 tfrkphn.593.d:0 "정청래 의원이 본회의 자유 발언을 신청했습니다. 당론은 반대인데 그는 찬성 쪽에 이름을 올렸습니다.\n\n그는 1987년 헌법이 거리에서 싸운 사람들이 얻어 낸 것이라는 말로 시작했습니다. 그는 그렇게 얻은 헌법이라 사십 해 가까이 아무도 손대지 못했지만 손대지 못하는 것과 지키는 것은 다르다고 말했습니다. 정부안의 조문에 다 찬성하는 것은 아니고 논의의 문을 여는 표결에만 찬성한다는 말도 덧붙였습니다.\n\n발언이 끝나자 야당 의석에서 야유가 나왔습니다. 그날 저녁 야당 의원 몇이 그의 방을 찾아갔습니다.\n\n대통령은 중계를 보고 저 사람 말이 여당 누구의 말보다 낫다고 했습니다."
 tfrkphn.594.d:0 "표가 좀처럼 늘지 않자 여당 안에서 목소리가 거칠어졌습니다. 원내 지도부의 한 의원은 방송에 나와 개헌에 반대하는 사람들을 낡은 헌법 뒤에 숨은 세력이라고 불렀습니다. 반대하는 의원의 지역구마다 현수막을 걸자는 말도 나왔습니다.\n\n대통령은 2011년 당 대표가 되던 날 자기에게는 계파가 없다고 말한 사람이고, 여당이 한목소리로 야당을 몰아세우는 일에는 익숙하지 않습니다. 그래도 그 공격 덕에 흔들리던 여당 의원 몇이 자리를 잡았습니다.\n\n야당은 이것이 헌법을 함께 고치자는 사람들의 태도냐고 되물었습니다."
 tfrkphn.60.kp:0 "새벽 두 시인데 청와대 관저의 불은 아직 꺼지지 않았고, 대통령은 오래된 습관대로 휴대폰을 들었다. 우리가 다듬어 올린 담화문은 옆에 밀어 두고, 직접 한 글자씩 눌러 쓰는 글이다. 그 글은 이렇게 시작한다.\n\n19세기 말부터 20세기 중반까지 60여 년 동안 한반도를 중심으로 국제전쟁이 다섯 번 일어났다. 청일전쟁, 러일전쟁, 중일전쟁, 태평양전쟁, 그리고 6.25전쟁이다. 그중 넷은 일본이 일으켰고 하나는 북한이 일으켰다.\n\n전쟁은 힘의 균형이 무너질 때 일어나고, 균형이 유지되면 일어나지 않는다고 대통령은 썼다. 사람들은 발칸반도를 유럽의 화약고라 부르지만 역사를 보면 한반도야말로 세계의 화약고였던 시대가 있었다는 것이다.\n\n그 화약고가 6.25 이후 70년 넘게 평화를 지킨 것은 휴전선을 사이에 두고 두 진영이 팽팽하게 맞섰기 때문이다. 한쪽에는 북한과 중국, 러시아가 있었고 다른 쪽에는 한국과 미국, 일본이 있었다. 때로는 낭만적 민족주의와 거짓 평화를 내세워 그 동맹을 흔드는 이들도 있었다고 그는 적었다."
 tfrkphn.60.kp2:0 "그리고 이제 미국은 없다. 대통령은 거기서 손가락을 멈췄다가 한참 뒤에 다음 줄을 썼다.\n\n평화는 거저 주어지지 않는다. 힘에 의한 무장평화만이 진정한 자유와 평화를 가져다준다.\n\n한때 서로 죽고 죽이던 미국과 일본이 손을 잡았고, 한국과 베트남은 화해하고 함께 미래로 가고 있다. 어제의 적이 오늘의 동맹이 되는 것이 국제정치라는 말이 이어졌다.\n\n미국이 떠난 자리를 누가 대신 채워 주지는 않는다. 북한이 핵을 가졌다면 우리도 그에 맞설 힘을 가져야 한다. PDTO의 이웃들과 손을 잡되 마지막 한 걸음은 우리 힘으로 버텨야 한다. 남북 핵균형, 그것이 앞으로 이 나라 국방의 원칙이라고 글은 끝난다.\n\n게시 버튼을 누르고 나서야 그는 휴대폰을 내려놓았다. 아침이 되자 신문들은 일제히 대통령의 새벽 글을 1면에 올렸다. 어떤 신문은 '무장평화론'이라 이름 붙였고 어떤 신문은 '핵 도미노의 시작'이라 썼다."
 tfrkphn.61.kp:0 "국방부 대강당이다. 대통령은 단상에 서자마자 우리가 써 준 원고를 덮었다.\n\n\"군 개혁을 해야 합니다.\n\n현대전은 사병의 수가 아니라 사병의 질이 국방력을 좌우합니다. 아이는 줄어드는데, 우리는 아직도 머릿수로 군대를 채우려 합니다. 그 방식은 이제 끝났습니다.\n\n모병제를 대폭 확대하겠습니다. 첨단 장비를 다룰 줄 아는 남녀 전문병사를 크게 늘리겠습니다. 그만큼 징병제의 부담은 줄어듭니다.\n\n오늘부터 여성도 일반병으로 지원할 수 있습니다. 장교와 부사관만이 아닙니다. 소총을 들고 전방 철책을 지키는 병사의 자리도 이제 남녀 모두에게 열립니다.\n\n지금까지의 군 현대화는 사병 복지에 초점을 맞췄습니다. 이제는 장비를 현대화해야 합니다. 오래 복무할 기간병의 대우를 높여야 합니다. 실제로 싸워 이기는 전투력을 키우는 데 집중해야 합니다.\n\n결국 우리도 모병제를 근간으로 갈 수밖에 없습니다. 오늘이 그 첫걸음입니다.\""
 tfrkphn.61.kp2:0 "질문이 쏟아졌다. 예산은 어디서 나오느냐, 지원자가 모자라면 어떻게 하느냐는 것이었고 대통령은 짧게 답했다.\n\n좋은 대우를 해 주면 사람은 옵니다. 안 오면 대우가 모자란 겁니다.\n\n한 달 뒤 대전의 한 병무청 민원실에서 있었던 일이 우리에게 보고되었다. 스물한 살 김지원은 지원서를 쓰고 있었다. 지원 분야 칸에는 '일반병(육군 보병)'이라고 적혀 있었다.\n\n\"정말 괜찮겠어요? 훈련소부터 남자들이랑 똑같이 받는 건데.\"\n\n담당 주무관이 조심스럽게 묻자 그녀가 웃었다.\n\n\"똑같이 받으려고 온 거예요.\"\n\n도장이 찍혔다. 그날 하루 동안 전국 병무청에 들어온 여성 일반병 지원서는 천 장을 넘었다."
 tfrkphn.613.d:0 "수도권 메가시티의 4단계 공사가 끝났습니다.\n\n시장 시절 그가 한강 둔치를 고치던 사업입니다. 강을 따라 걷는 길과 배가 닿는 곳을 서해까지 잇습니다.\n\n서울은 육백 년 넘게 우리의 수도였습니다. 조선의 한양에서 시작한 이 도시는 한국 전쟁으로 폐허가 됐다가 다시 일어섰고, 우리는 그 시절을 한강의 기적이라고 부릅니다. 정부와 큰 기업의 본사가 모두 이곳에 있습니다. 그렇게 모든 것이 모인 도시의 한가운데를 흐르는 강을, 우리는 이번에 시민이 걸어서 닿을 수 있는 곳으로 바꿉니다."
 tfrkphn.616.d:0 "충청권 메가시티의 2단계 공사가 끝났습니다.\n\n연구소가 모여 있는 대덕을 다시 짭니다. 담장 안에 있던 연구 시설을 기업과 대학에 엽니다.\n\n우리에게 대전은 서울에서 영남과 호남으로 내려가는 길이 갈라지는 곳입니다. 1950년 여름 보름 남짓 정부가 이곳에 머물렀던 것도 그 자리 때문이었습니다. 1973년 1월에 대덕이 연구 도시 후보지로 정해졌고, 스무 해 가까이 걸려 1992년 11월에 단지가 준공됐습니다. 1998년에는 정부대전청사가 문을 열었습니다. 우리는 이 도시에 연구소와 관청을 차례로 내려보냈고, 이번에는 그 연구소의 담장을 낮춥니다."
 tfrkphn.62.kp:0 "충남 태안 안흥, 국방과학연구소 종합시험장에 바닷바람이 거세게 불고 있다. 관측소 유리창 너머로 이동식 발사대가 천천히 몸을 일으켰고, 대통령 옆에 선 합참 작전본부장이 낮은 목소리로 설명을 시작했다.\n\n\"지금부터 보실 것은 하나의 체계입니다. 따로따로가 아닙니다.\"\n\n첫째는 킬체인이다. 북한의 핵미사일이 발사대에 올라가는 순간을 위성과 정찰기가 잡아내고, 그 정보는 몇 분 안에 타격 부대로 넘어간다. 미사일이 하늘로 오르기 전에 발사대를 먼저 부수는 것이다.\n\n둘째는 한국형 미사일 방어다. 그래도 날아오는 미사일은 하늘에서 떨어뜨린다. 전국의 레이더가 궤적을 그리고 요격미사일이 그 길목을 막는다.\n\n셋째는 대량응징보복이다. 그래도 한 발이 떨어진다면 그 대가는 평양의 지휘부가 치르고, 핵을 쓰는 순간 정권이 끝난다는 것을 저쪽이 알아야 한다."
 tfrkphn.62.kp2:0 "\"하나라도 빠지면 나머지 둘이 의미가 없습니다.\"\n\n대통령은 고개를 끄덕였다. 몇 달 전 당정협의 탁자 위에서 누군가 연필로 지워 두었던 바로 그 예산이다.\n\n카운트다운이 끝나자 굉음과 함께 현무 미사일이 흰 연기를 끌며 서해 위로 솟구쳤다. 관측소의 유리창이 낮게 떨렸다.\n\n\"양산은 언제부터 됩니까.\"\n\"예산만 그대로 가면 올해 안에 시작합니다.\"\n\"그대로 갑니다. 한 푼도 안 깎습니다.\"\n\n대통령은 멀어지는 연기를 끝까지 바라보았다.\n\n\"이거 보고 나면 저쪽도 먼저 쏠 생각은 못 할 깁니다.\"\n\n그해 겨울 전국의 산꼭대기에 새 레이더 기지가 들어섰고, 현무의 생산 라인은 밤에도 멈추지 않는다."
 tfrkphn.620.d:0 "호남권 메가시티의 1단계 공사가 끝났습니다.\n\n광주와 혁신도시 나주를 철길로 잇습니다. 두 도시 사이를 오가던 출퇴근길이 반으로 줄어듭니다.\n\n광주는 무등산 북서쪽 기슭에 앉아 있고, 광주천이 시내를 지나 영산강으로 흘러듭니다. 1896년에 전라남도 도청이 놓인 뒤로 호남의 일은 이 도시에 모였습니다. 우리는 1980년 5월에 이곳에서 일어난 민주화운동을 기억합니다. 1986년 11월에 직할시가 됐지만 살림은 오래도록 상업이 맡았고, 공업단지는 자동차 공장 하나를 가운데 두고 짜였습니다. 우리가 이 도시에 새 일거리를 놓으려는 까닭이 거기 있습니다."
 tfrkphn.625.d:0 "대구경북 메가시티의 1단계 공사가 끝났습니다.\n\n구미에서 대구를 지나 경산까지 철길로 잇습니다. 세 도시의 공단과 대학이 한 노선에 놓입니다.\n\n대구는 팔공산을 등지고 분지 한가운데에 앉아 있고, 금호강이 북쪽을 돌아 낙동강으로 들어갑니다. 1601년에 경상도 감영이 옮겨 온 뒤로 영남의 행정과 상업은 이곳에 모였습니다. 우리가 아는 대구의 공장은 대부분 섬유 공장이었습니다. 1999년 말에도 제조업체 열 곳 가운데 네 곳 가까이가 섬유 업체였습니다. 그 공장들이 줄어든 뒤 이 도시가 무엇으로 먹고살지를 우리는 아직 정하지 못했습니다."
 tfrkphn.63.kp:0 "도쿄의 주일 대한민국 대사관에서 있었던 일인데, 책상 위 조간신문 1면에는 며칠 전 대통령이 새벽에 올린 글이 실려 있었다. 남북 핵균형. 2등서기관 김상주는 그 기사를 대충 넘겼다. 그때는 그것이 자기 일이 될 줄 몰랐다.\n\n퇴근을 한 시간 앞둔 오후 다섯 시에 우리가 보낸 3급 비밀 전문이 대사관에 닿았다. 암호를 풀어 출력한 종이를 든 김상주는 한참 동안 자리에서 일어나지 못했다. 세 번을 다시 읽어도 내용은 바뀌지 않았고, 그는 서류를 봉투에 넣고 대사실 문을 두드렸다.\n\n\"대사님, 긴급하게 보고드릴 서류가 있습니다.\"\n\n대사는 안경을 고쳐 쓰며 웃었다.\n\n\"뭔데, 뭐 핵이라도 만든다는 거냐?\"\n\"죄송하지만, 그게 맞습니다.\""
 tfrkphn.63.kp2:0 "대사의 웃음이 그대로 굳었다.\n\n겉으로 보면 평범한 문서다. 제목은 'PDTO 회원국 간 원자력 협력 강화 방안'이고, 한일 두 나라가 원자력 분야의 협력을 넓힌다는 외교 문서의 말투로 쓰여 있다.\n\n첨부 문서를 넘길수록 단어가 달라진다. 고농축 우라늄의 보관 위치와 수량, 미국이 무너지며 주인을 잃은 옛 주한미군과 주일미군 전술핵의 행방, 두 나라 기술진이 함께 쓸 시설의 후보지가 차례로 나온다. 마지막 장에는 우리가 적어 넣은 지시 한 줄이 있다. \"일본 정부 최고위층에 대통령 친서를 비공개로 전달할 것.\"\n\n대사는 서류를 덮었고 한참 뒤에야 입을 열었다.\n\n\"우리 좆된 거 맞냐?\"\n\n김상주는 대답하지 못했다. 그날 대사관의 전깃불은 꺼지지 않았다."
 tfrkphn.631.d:0 "부울경 메가시티의 2단계 공사가 끝났습니다.\n\n낡은 부두를 걷어 내고 바다를 도시에 돌려줍니다. 오래 끌어 온 공사를 이번에 끝냅니다.\n\n부산은 우리의 두 번째 도시이고 가장 큰 항구입니다. 한국 전쟁 때는 임시 수도가 되어 전국에서 밀려온 피난민을 받아들였습니다. 그 뒤로 이 도시는 바다를 통해 나라 밖과 물건을 주고받으며 세계적인 물류 거점으로 컸습니다. 우리는 그 항구에서 가장 오래된 부두 자리를 이번에 시민에게 돌려줍니다."
 tfrkphn.632.d:0 "부울경 메가시티의 3단계 공사가 끝났습니다.\n\n울산 앞바다에 풍력 단지를 띄우고 그 전기로 수소를 만듭니다. 조선소와 자동차 공장이 그 수소를 씁니다.\n\n울산은 우리가 공업을 처음 배운 곳입니다. 1962년 1월 27일에 특정공업지구로 지정됐고 이레 뒤에 공업센터 기공식이 열렸으며, 1964년 4월에는 첫 정유공장이 돌아가기 시작했습니다. 1972년에는 나라에서 처음으로 나프타 분해 시설을 가동했고, 그 뒤로 자동차와 조선이 들어와 주력이 됐고 1997년에는 광역시가 됐습니다. 우리는 예순 해 넘게 기름으로 큰 이 도시에 이번에는 수소 설비를 놓습니다."
 tfrkphn.64.kp:0 "오후 3시 11분, 판문점 공동경비구역이다. 북쪽 도로를 달려온 군용 지프 한 대가 배수로에 바퀴가 빠져 멈춰 섰다. 운전석에서 뛰어내린 북한군 병사가 남쪽을 향해 내달렸고, 몇 초 뒤 판문각에서 쏟아져 나온 추격조가 총을 쏘기 시작했다.\n\n마흔 발이 넘는 총탄이 군사분계선을 넘어 날아들었고, 추격병 하나는 귀순자를 쫓아 분계선 남쪽까지 몇 걸음을 내려왔다가 황급히 돌아섰다.\n\n이번에 우리는 침묵하지 않았다. JSA 경비대대의 확성기가 울렸다. \"북한군은 즉시 사격을 중지하라. 정전협정 위반이다.\" 경고 방송이 끝나기도 전에 우리 군의 경고사격이 분계선 너머 빈 땅에 꽂혔고, 그 사이 부사관 둘이 포복으로 다가가 쓰러진 귀순자를 끌어냈다.\n\n그날 저녁 국방부 브리핑룸에서 우리는 이렇게 발표했다.\n\n\"오늘 아침 판문점에서 귀순자가 왔습니다.\n\n북한군은 귀순자를 잡으려고 정전협정을 위반했습니다. 우리 측 영토에 총을 쏘았습니다. 우리 군은 귀순자의 안전을 가장 먼저 확보했습니다. 그리고 북측에 경고 방송과 경고사격을 했습니다.\n\n귀순자는 이국종 박사의 지휘 아래 수술을 받았습니다. 지금은 건강을 회복하며 보호 조치를 받고 있습니다.\""
 tfrkphn.64.kp2:0 "기자들의 질문은 두 갈래였고, 보복 사격을 해야 했던 것 아니냐는 쪽과 경고사격이 지나쳤던 것 아니냐는 쪽이다.\n\n같은 시각 청와대 지하 벙커에서 대통령은 합참의 보고를 끝까지 듣고 짧게 정리했다.\n\n\"북한 체제에 간섭하지 않습니다. 저쪽이 어떻게 살든, 누구를 지도자로 모시든 그건 저쪽 일입니다. 그러나 우리 땅에 넘어온 사람은 우리가 지킵니다. 그리고 우리 땅으로 날아온 총알에는 반드시 답합니다. 거기까지입니다. 한 발도 더 나가지 않습니다. 안흥에서 현무를 쏘아 올린 것도 쏘지 않기 위해서였습니다.\"\n\"그 원칙을 북측에 그대로 전하십시오. 간섭하지도, 간섭받지도 않는다. 힘의 균형 위에서 각자 살자고.\"\n\n그날 밤 우리는 판문점 연락채널로 짧은 통지문을 넘겼고, 북쪽에서는 답이 오지 않았다. 그런데 다음 날부터 분계선 북쪽의 추격조 초소가 뒤로 물러났다.\n\n수원의 한 대학병원 중환자실에서 두 차례의 대수술이 이어지는 동안 귀순자의 몸에는 남쪽 사람들의 피가 1만 2천cc 넘게 들어갔다. 일주일 뒤 스스로 숨을 쉬기 시작한 그가 처음 한 말은 짧았다.\n\n\"여기가... 남쪽입니까?\""
 tfrkphn.640.d:0 "취임 이틀째, 우리는 아직 국무총리를 정하지 못했습니다. 승리는 지키고 국정은 바꾸겠다고 약속한 정부의 첫 얼굴을 고르는 일이고, 대통령의 책상에는 이름 두 개가 올라와 있습니다.\n\n조은희는 서울시 여성가족정책관을 거쳐 서울시의 첫 여성 정무부시장을 지냈습니다. 그 뒤 서초구청장에 두 번 당선됐는데, 2018년에는 서울 스물다섯 개 구 가운데 당시 야당 후보로는 혼자 이겼습니다. 대통령이 시장이던 때부터 손발을 맞춘 사람이고, 행정이 어디서 막히는지를 압니다.\n\n윤희숙은 한국개발연구원에서 재정과 복지 정책을 연구한 경제학자입니다. 2020년 총선에서 서초갑에 당선됐고, 그해 7월 국회 본회의에서 한 5분 발언으로 이름을 알렸습니다. 2021년 8월에는 부친의 농지 의혹에 책임을 지겠다며 의원직을 내놓았습니다. 숫자로 정책을 따지는 사람이고, 여당 안에서도 듣기 싫은 말을 합니다.\n\n국방과 외교는 홍준표 정부의 사람들이 그대로 맡습니다. 바뀌는 자리는 총리와 살림을 맡는 부처들입니다."
 tfrkphn.641.a_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_portrait_kim_byung_min\n\n\n\n\n\n\n\n\n-------------------------------------\n§Y김병민§!이 여당 서울시장 후보가 됩니다.\n동남권 4개 구의 여당 지지도 §G+3§!\n강북권 14개 구의 여당 지지도 §G+1§!\n당선되면 서울의 건물 칸 §G+2§!, 강남과 강북의 격차 §G-1§!"
 tfrkphn.641.d:0 "지방선거가 석 달 앞으로 다가왔습니다. 서울시청은 세 해 전 보궐선거에서 이긴 정원오 시장이 지키고 있습니다.\n\n우리 당에서는 김병민이 나섭니다. 스물여덟 살에 서초구의원이 됐고, 대통령이 시장이던 때 정무부시장으로 곁에 있었으며, 이 정부에서는 대변인으로 세 해 동안 대통령의 말을 전했습니다. 2020년 총선에서는 광진갑에 나갔다가 졌습니다.\n\n현직 시장을 상대로 하는 선거는 쉽지 않습니다. 그래도 대통령을 가장 세게 밀어 온 동남권의 당원들은 대통령의 사람이 나서자 다시 모였습니다."
 tfrkphn.643.d:0 "개표가 끝났습니다. 우리 당의 [GetTFRKPHNSdCand] 후보가 서울시장에 당선됐습니다. 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었습니다.\n\n구청장은 스물다섯 곳 가운데 우리가 §R[?TFRKPHN_sd_won|0]§!곳, 야당이 §B[?TFRKPHN_sd_lost|0]§!곳을 가져갔습니다.\n\n성동구: [GetTFRKPHNSdK13]\n서초구: [GetTFRKPHNSdK23]\n용산구: [GetTFRKPHNSdK16]\n중구구: [GetTFRKPHNSdK12]\n강북구: [GetTFRKPHNSdK2]\n성북구: [GetTFRKPHNSdK5]\n\n서울시는 앞으로 네 해 동안 우리 당 시장이 맡습니다."
 tfrkphn.644.d:0 "개표가 끝났습니다. 서울시장은 야당의 정원오 후보에게 돌아갔습니다. 우리 당 [GetTFRKPHNSdCand] 후보는 졌고, 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었습니다.\n\n구청장은 스물다섯 곳 가운데 우리가 §R[?TFRKPHN_sd_won|0]§!곳, 야당이 §B[?TFRKPHN_sd_lost|0]§!곳을 가져갔습니다.\n\n성동구: [GetTFRKPHNSdK13]\n서초구: [GetTFRKPHNSdK23]\n용산구: [GetTFRKPHNSdK16]\n중구구: [GetTFRKPHNSdK12]\n강북구: [GetTFRKPHNSdK2]\n성북구: [GetTFRKPHNSdK5]\n\n서울시는 앞으로 네 해 동안 야당 시장이 맡습니다. 남은 임기 동안 서울의 일은 그와 마주 앉아 풀어야 합니다."
 tfrkphn.65.kp:0 "외교부 청사 9층, 동북아국 중국과다. 박영환 국장은 책상 서랍을 정리하다가 오래된 사진 한 장을 꺼냈다. 1992년 8월 24일 베이징 댜오위타이, 한중 수교 서명식 뒤편에 앳된 얼굴의 신입 외교관이 서 있다. 서른 해 전의 자신이다.\n\n그 시절에는 모두가 북방을 말했다. 노태우 정부는 모스크바와 수교했고 2년 뒤에는 베이징과 손을 잡았다. 공산권이든 아니든 문을 열면 길이 생긴다고 믿었고, 이념보다 국익이 먼저였다. 사람들은 그것을 북방정책이라고 불렀다.\n\n오늘 아침 우리가 장관실을 거쳐 내려보낸 지시는 한 장이다.\n\n'EADI 회원국과의 고위급 교류 전면 재검토. 대중국 신규 협력사업 동결. 동남아 PDTO 우호국과의 안보협력 최우선 추진.'\n\n\"국장님, 이거 사실상... 단교 준비 아닙니까?\"\n\n젊은 사무관이 조심스럽게 물었고, 박 국장은 턱으로 창밖을 가리켰다. 광화문 거리에는 오성홍기를 불태우는 시위대와 그것을 막아선 경찰이 뒤엉켜 있었다.\n\n\"단교는 아니야. 아직은.\""
 tfrkphn.65.kp2:0 "전쟁이 모든 것을 바꿔 놓았다. 도쿄 대사관에서는 밤새 불이 꺼지지 않는다는 소문이 돌았고 판문점에서는 경고사격이 울렸다. 중국은 대만을 쳤고 EADI라는 이름으로 이웃들을 줄 세웠다. 이제 서울에서 중국은 교역 상대로 불리지 않으며 신문은 위협이라고 쓴다.\n\n그날 오후 국무회의에서 대통령은 신남방정책을 다시 꺼내 들었다. 베트남과 필리핀, 인도네시아처럼 중국의 남쪽 바다를 둘러싼 나라들과 손을 잡겠다는 것이고 명분은 억지력이다.\n\n신문들은 저마다 이름을 붙였다. 어떤 신문은 '가치 외교'라 했고 어떤 신문은 더 오래된 이름을 꺼냈다. '70년 만에 돌아온 이승만식 반공 외교.'\n\n공산 국가와는 어떤 거래도 하지 않던 시절, 친구와 적을 이념으로 가르던 시절이 있었다. 북방정책이 그 시절을 끝냈다고 박 국장은 믿었는데 서른 해 만에 시계가 거꾸로 돌고 있다.\n\n퇴근길에 박 국장은 수교 사진을 서랍 깊숙이 다시 넣었다. 버리지는 않았다.\n\n\"언젠가 다시 꺼낼 날이 오겠지.\"\n\n엘리베이터 앞에서 혼잣말을 하다가 그는 옆에 선 후배와 눈이 마주쳤다. 후배는 못 들은 척 휴대폰을 봤다."
 tfrkphn.651.a_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_portrait_chung_mong_joon\n\n\n\n\n\n\n\n\n-------------------------------------\n§Y정몽준§!이 여당 서울시장 후보가 됩니다.\n스물다섯 구 모두의 여당 지지도 §G+3§!\n선거를 앞두고 나이와 공백이 입길에 오를 수 있습니다.\n당선되어도 시청은 대통령과 거리를 둡니다."
 tfrkphn.651.b_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_portrait_cho_eun_hee\n\n\n\n\n\n\n\n\n-------------------------------------\n§Y조은희§!가 여당 서울시장 후보가 됩니다.\n동남권 4개 구의 여당 지지도 §G+4§!\n강북권 14개 구의 여당 지지도 §G+1§!\n당선되면 서울의 건물 칸 §G+2§!, 강남과 강북의 격차 §G-1§!"
 tfrkphn.651.c_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_TFRKPHN_portrait_yoon_hee_sook\n\n\n\n\n\n\n\n\n-------------------------------------\n§Y윤희숙§!이 여당 서울시장 후보가 됩니다.\n스물다섯 구 모두의 여당 지지도 §G+2§!\n당선되면 서울의 건물 칸 §G+2§!, 강남과 강북의 격차 §G-1§!"
 tfrkphn.651.d:0 "대통령이 비우고 나온 서울시장 자리를 채울 보궐선거가 4월 7일로 잡혔다. 취임 한 달 만에 치르는 선거라 따뜻한 보수를 내건 새 정부가 받는 첫 성적표가 된다.\n\n[GetTFRKPHNByNaPara]\n\n다른 한 사람은 [GetTFRKPHNByOther]이다. 총리 후보로 대통령의 책상에 올랐던 사람이고 대통령과 오래 일했다. 시장이 되면 시청과 대통령실이 한 몸처럼 움직인다."
 tfrkphn.651.e_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_portrait_KOR_na_kyung_won_gamerule\n\n\n\n\n\n\n\n\n-------------------------------------\n§L홍준표 대선 때 서울 지지율이 50 이상이라 나올 수 있었습니다.§!\n§Y나경원§!이 여당 서울시장 후보가 됩니다.\n서남권 7개 구의 여당 지지도 §G+3§!\n동남권 4개 구의 여당 지지도 §G+2§!\n당선되어도 시청은 대통령과 거리를 둡니다."
 tfrkphn.652.a_tt:0 "-------------------------------------\n\n\n\n\n\n\n\n   £GFX_portrait_KOR_chong_won_oh_gamerule\n\n\n\n\n\n\n\n\n-------------------------------------\n§Y정원오§!가 야당 서울시장 후보가 됩니다.\n성동구의 여당 지지도 §R-3§!\n강북권 14개 구의 여당 지지도 §R-1§!"
 tfrkphn.652.d:0 "야당이 서울시장 보궐선거 후보로 정원오를 세웠습니다.\n\n그는 성동구청장을 세 번 했습니다. 2022년 지방선거에서 우리 당이 한강을 낀 구를 거의 다 이겼을 때도 성동만은 그가 57.60으로 지켰습니다. 같은 날 같은 성동에서 오세훈 시장이 60.90을 얻었으니, 시장은 오세훈을 찍고 구청장은 정원오를 찍은 사람이 그만큼 많았다는 뜻입니다.\n\n당이 달라도 표를 받는 사람이 상대로 나왔습니다. 우리는 그가 대통령의 옛 지지자들을 얼마나 데려갈지를 걱정해야 합니다."
 tfrkphn.653.d:0 "개표가 끝났습니다. 우리 당의 [GetTFRKPHNSdCand] 후보가 서울시장 보궐선거에서 이겼습니다. 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었습니다.\n\n취임 한 달 만에 치른 첫 선거였고, 새 정부의 방향을 서울이 받아들였다는 뜻으로 읽힙니다. 대통령이 떠난 자리를 우리 당이 지켰고, 새 시장은 2030년 6월까지 남은 임기를 맡습니다. 정원오 후보는 결과를 받아들인다고 말했습니다."
 tfrkphn.654.d:0 "개표가 끝났습니다. 서울시장 보궐선거는 야당의 정원오 후보가 이겼습니다. 우리 당 [GetTFRKPHNSdCand] 후보는 졌고, 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었습니다.\n\n대통령이 시장으로 일하던 시청이 취임 한 달 만에 야당으로 넘어갔습니다. 새 시장은 2030년 6월까지 남은 임기를 맡습니다. 서울의 일은 이제 야당 시장과 마주 앉아 풀어야 합니다. 모두와 함께 가겠다던 약속을 시청에서부터 지켜야 하게 됐습니다."
 tfrkphn.655.d:0 "지방선거가 석 달 앞으로 다가왔습니다. 2027년 보궐선거에서 당선된 [GetTFRKPHNSdCand] 시장이 다시 나서겠다고 밝혔습니다.\n\n보궐선거로 들어온 시장은 남은 임기만 채웁니다. 세 해 동안 한 일을 들고 처음으로 온전한 네 해를 달라고 하는 선거입니다. 당 안에서 맞서겠다는 사람은 나오지 않았습니다.\n\n야당에서는 정원오가 다시 나옵니다. 세 해 전에 졌던 사람이 같은 상대와 한 번 더 붙습니다."
 tfrkphn.656.d:0 "보궐선거가 열흘 앞입니다. 토론회에서 정원오 후보가 정몽준 후보에게 물었습니다. 마지막으로 선거를 치른 것이 2014년인데 그 사이 서울이 어떻게 달라졌는지 아느냐는 질문이었습니다.\n\n후보는 막힘 없이 답했습니다. 그런데 다음 날 기사 제목에는 답 대신 질문만 실렸습니다. 강북의 젊은 유권자들 사이에서는 우리 당이 새 사람을 내지 못했다는 말이 돕니다.\n\n이름값으로 얻은 표가 강북에서 조금씩 빠지고 있습니다."
 tfrkphn.657.d:0 "오후에는 명단을 쓴다. 대아대전으로 죽은 사람들의 이름을 동네마다 돌며 받아 적는 일인데, 군인과 민간인, 남쪽 사람과 북쪽 사람을 가리지 않고 한 장부에 올린다. 이름을 불러 준 노인들은 글자가 틀리지 않았는지 장부를 몇 번씩 들여다본다. 장부의 앞쪽에는 그녀가 직접 적어 넣은 분대원 두 사람의 이름도 있다.\n\n그녀는 할아버지에게서 전쟁 뒤의 서울 이야기를 들으며 자랐다. 다리가 끊기고 건물이 주저앉은 그 도시를 사람들은 벽돌 한 장씩 다시 쌓았다. 서울이 그렇게 이겨 냈으니 평양도 이겨 낼 것이라고, 한 주무관은 장부를 덮으며 생각한다."
 tfrkphn.658.d:0 "보궐선거에서 이긴 새 시장이 첫 결재로 재개발과 재건축 구역 지정안에 서명했습니다. 선거 때 구마다 돌며 한 약속입니다.\n\n서울시가 길을 열자 다른 시도도 같은 기준을 받아들였습니다. 묶여 있던 구역들이 한꺼번에 풀리면서 우리가 지을 수 있는 자리가 전국에서 늘었습니다."
 tfrkphn.66.kp:0 "대통령이 회의에서 꺼낸 옛이야기가 하나 있다. 춘추시대 진나라에 위무자라는 장수가 있었다. 그에게는 아끼는 첩이 하나 있었는데 둘 사이에는 자식이 없었다. 위무자는 병들어 눕자 아들 위과를 불렀다.\n\n\"내가 죽거든 저 사람을 좋은 곳에 개가시켜라.\"\n\n그러나 병이 깊어지자 말이 바뀌었다.\n\n\"내가 죽거든 저 사람을 나와 함께 묻어라.\"\n\n그 시절에는 주인이 죽으면 아끼던 사람을 함께 묻는 순장의 풍습이 있었다. 아버지가 세상을 떠나자 위과는 두 유언 사이에서 오래 고민하다가 첫 번째 말을 따랐다.\n\n\"사람은 병이 깊으면 정신이 흐려진다. 나는 아버지가 맑은 정신일 때 하신 말씀을 따르겠다.\"\n\n위과는 그 여인을 살려 좋은 집안에 시집보냈다. 몇 해 뒤 서쪽의 진나라가 쳐들어왔고 위과는 보씨 땅에서 적을 맞았다. 적장은 두회라는 이름난 장사였는데, 그가 휘두르는 창 앞에서 병사들이 줄줄이 쓰러졌다."
 tfrkphn.66.kp2:0 "그때 이상한 일이 일어났다. 말을 몰아 달려들던 두회의 발목을 들판의 풀이 휘감은 것이다. 누군가 풀을 엮어 매듭을 지어 놓았고, 천하장사는 그 풀매듭에 걸려 넘어져 위과에게 사로잡혔다. 그날 밤 위과의 꿈에 한 노인이 나타났다.\n\n\"나는 그대가 시집보낸 여인의 아비요. 그대가 아버지의 맑은 말씀을 따라 내 딸을 살렸기에, 오늘 풀을 묶어 그 은혜를 갚았소.\"\n\n풀을 맺어 은혜를 갚는다는 결초보은이 여기서 나왔다. 죽은 사람도 은혜를 잊지 않는데 산 나라가 잊어서야 되겠느냐고 대통령은 물었다.\n\n나라 사이에도 은혜와 빚이 있다. 이번 전쟁에서 우리에게 배를 보내 준 나라가 있었고 항구를 닫은 나라가 있었다. 갚을 보에는 받은 은혜를 갚는다는 뜻과 저지른 잘못에 값을 치르게 한다는 뜻이 함께 들어 있고, 우리는 둘 다 하기로 했다.\n\n외교부는 전쟁 때 각국이 한 일을 정리한 명단부터 만들고 있다."
 tfrkphn.660.d:0 "기다린 사람이 모두 만난 것은 아니다. 다리는 1966년에 들리기를 멈추었다가 2013년에야 47년 만에 다시 들렸는데, 그 긴 세월이 지나도록 끝내 돌아오지 못한 사람이 많았다.\n\n대아대전이 끝난 지금, 영도다리에는 다시 기다리는 사람들이 모여든다. 다리 난간과 여의도 국회의사당의 벽에는 이산가족을 찾는다는 종이가 빼곡히 붙어 있고, 사람들은 사진 한 장과 이름 석 자를 붙여 놓고 날마다 다시 찾아온다. 정부는 그 종이를 한 장씩 옮겨 적어 전사자와 실종자, 북쪽에서 소식이 끊긴 사람들의 명단과 맞추어 보기 시작했다."
 tfrkphn.6601.a:0 "뭐라고 시발? 다 갈아엎어."
 tfrkphn.6601.b:0 "뭐라고 시발? 현역으로 가."
 tfrkphn.6601.d:0 "제23대 국회의원 선거가 한 달 앞으로 다가왔습니다. 여당은 지난 총선에서 199석을 얻었습니다. 양안전쟁이 끝난 직후에 치른 선거였고, 이번에는 그 바람이 없습니다.\n\n당 공천관리위원회가 대통령실에 뜻을 물어 왔습니다. 현역 의원을 크게 바꿔 새 얼굴을 세우자는 쪽과, 지역을 다져 온 현역을 그대로 내보내자는 쪽이 맞서 있습니다."
 tfrkphn.6603.d:0 "개표가 끝났습니다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석입니다.\n\n여당은 지난번에 버금가는 의석을 지켰습니다. 전쟁의 바람 없이 치른 선거에서 얻은 결과입니다. 출구조사가 나온 순간 당사에서는 박수가 터졌고, 수도권의 접전지 여러 곳이 자정 무렵 여당 쪽으로 넘어왔습니다. 남은 임기 동안 국회는 정부의 편에 섭니다."
 tfrkphn.6604.d:0 "개표가 끝났습니다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석입니다.\n\n여당은 의석을 여럿 잃었지만 과반은 지켰습니다. 지난 총선의 199석은 전쟁 직후의 숫자였고, 이번이 평시의 성적에 가깝다는 평가가 나옵니다. 수도권에서 잃은 의석을 메가시티 사업이 진행된 권역에서 얼마간 되찾았습니다."
 tfrkphn.6605.d:0 "개표가 끝났습니다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석입니다.\n\n여당이 과반을 잃었습니다. 지난 총선의 199석에서 크게 줄었습니다. 서울의 여러 구와 개발에서 밀려난 지역에서 표가 빠졌습니다. 당사에는 자정이 되기 전에 불이 꺼졌습니다. 남은 임기 동안 예산과 법안은 야당과 마주 앉아야 통과됩니다."
 tfrkphn.6606.d:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당 혼자 200석을 넘겼다. 국회 재적의 3분의 2, 헌법을 고칠 수 있는 숫자다. 지난 총선의 199석은 전쟁 직후의 바람이 만든 숫자였다. 이번에는 바람 없이 그 선을 넘었다.\n\n서울의 스물다섯 구가 거의 한 색으로 칠해졌고, 메가시티 사업이 들어선 권역에서도 여당 후보가 잇달아 이겼다. 출구조사가 뜬 순간 당사는 환호보다 탄성이 먼저 터졌다.\n\n대통령은 자정 무렵 당사에 들러 짧게 인사만 하고 돌아갔다. 다음 날 아침 그는 수석들에게 이 숫자가 오히려 무섭다고 말했다. 그는 이긴 쪽이 무엇이든 할 수 있다고 믿는 순간 다음 선거는 진다고 설명했다."
 tfrkphn.661.d:0 "오늘 백두산 천지에는 두 사람이 나란히 서 있다. 이인제 대통령의 초청을 받은 홍준표 전 대통령은 천지를 한참 내려다보다가, 자신이 시작한 일을 끝까지 해 주어 고맙다고 말했다. 이인제는 출발선을 그어 준 사람이 있었기에 결승선까지 올 수 있었다고 답했다. 두 사람은 수행원을 물리고 호숫가를 따라 한동안 걸었다.\n\n이제 서울에서 떠난 열차는 평양과 신의주를 지나 대륙으로 달리고, 백두에서 한라까지는 누구나 걸어서 갈 수 있는 길이 되었다. 영도다리에서 기다리던 사람들도, 평양에서 장부를 쓰던 주무관도 저마다의 집으로 돌아간다.\n\n수고하셨다. 당신이 맡은 길은 여기까지다. 노인은 완주를 마쳤고, 다음 출발선에는 다음 세대가 서 있다."
 tfrkphn.6611.d:0 "재개발 구역에서 철거를 막는 농성이 시작됐습니다. 세입자들과 작은 가게 주인들입니다. 집주인들은 조합을 만들어 새 아파트를 받지만, 세 들어 살던 사람들은 이사 비용만 받고 떠나야 합니다.\n\n농성장에는 이 동네에서 서른 해 장사를 했다는 현수막이 걸렸습니다. 건설사는 공사 일정이 하루 밀릴 때마다 드는 돈을 계산해 구청에 보냈습니다. 우리 재개발 사업은 이제 다섯 구역 가운데 두 곳을 넘겼습니다."
 tfrkphn.6612.d:0 "지방의 시장과 도지사들이 한목소리로 성명을 냈습니다. 메가시티 사업이 수도권부터 앞서 나가고 있다는 것입니다. 수도권은 벌써 세 단계를 올렸는데 다른 권역은 첫 삽을 겨우 떴다고 그들은 말합니다.\n\n성명에는 여당 소속 단체장들도 이름을 올렸습니다. 지방 신문들은 일제히 1면에 수도권과 지방의 사업 진행표를 나란히 실었습니다."
 tfrkphn.6613.d:0 "메가시티로 묶이는 권역의 한 군에서 통합 반대 서명이 주민 절반을 넘겼습니다. 큰 도시에 합쳐지면 군청이 없어지고 예산도 도시 쪽으로 쏠린다는 걱정입니다.\n\n군의회는 만장일치로 반대 결의안을 냈습니다. 권역의 광역철도 노선도에서 이 군을 지나는 역이 하나뿐이라는 점도 불만을 키웠습니다."
 tfrkphn.6614.d:0 "망명 기업이 자리 잡은 동네의 집값과 월세가 한 해 사이에 크게 올랐습니다. 높은 연봉을 받는 직원들이 한꺼번에 집을 구했기 때문입니다.\n\n원래 살던 세입자들이 재계약을 하지 못하고 밀려나고 있습니다. 부동산 중개소 유리창에는 영어로 쓴 매물 안내가 붙었고, 동네 주민 모임은 구청 앞에서 집회를 열었습니다."
 tfrkphn.6615.d:0 "강북의 여러 구에서 주민들이 날마다 구청 앞에 모이고 있습니다. 개발이 한강 남쪽에만 몰린다는 것입니다. 강남과 강북의 격차는 우리가 취임했을 때보다 더 벌어졌습니다.\n\n집회에는 여당을 찍었다는 사람들도 나왔습니다. 한 참가자는 약자와의 동행이라는 말을 선거 때 분명히 들었다고 말했습니다."
 tfrkphn.662.d:0 "그 길을 노인은 많은 사람과 함께 달렸다. 전선에서 돌아오지 못한 장병들과 밤새 공장을 지킨 사람들, 전쟁 빚을 나누어 진 국민이 그의 곁에 있었다. 노인은 그들의 이름을 다 알지 못하지만, 그들이 없었다면 여기까지 오지 못했으리라는 것은 알고 있다.\n\n결승선을 마주 보고 선 지금, 노인은 젊은 시절의 자신을 돌아본다. 젊은 날의 그는 가장 위대한 사람이 되고 싶었다. 세월은 그 꿈을 여러 번 비웃었지만 그는 끝내 꿈을 내려놓지 않았다. 그 소원을 그는 가장 늙은 나이에 이루었다.\n\n노인은 이제 바통을 쥔 손을 뒤로 내민다. 다음 주자의 발소리가 가까워지고 있다."
 tfrkphn.6621.d:0 "광역시 다섯 곳에서 안심소득 시범 사업이 시작됐습니다. 서울에서 800가구로 하던 실험이 도시마다 수천 가구로 커졌습니다.\n\n받는 가구와 받지 않는 가구를 나란히 놓고 일자리와 소비, 건강이 어떻게 달라지는지 지켜봅니다. 일을 하면 지원이 끊기는 지금의 제도와 달리, 벌이가 늘어도 지원이 조금씩만 줄어든다는 점이 이 제도의 핵심입니다."
 tfrkphn.6622.d:0 "기준 중위소득의 절반에 못 미치는 가구가 전국 어디서나 안심소득을 받게 됐습니다. 첫 지급일에 주민센터 창구마다 줄이 생겼습니다.\n\n기초생활보장 제도에서 빠져 있던 사람들이 많이 들어왔습니다. 재산이나 부양가족 기준에 걸려 아무 지원도 받지 못하던 가구들입니다. 예산 당국은 내년 예산안에서 다른 사업을 줄여야 한다는 보고서를 냈습니다."
 tfrkphn.6623.d:0 "안심소득이 기준 중위소득 85 이하의 모든 가구로 넓어졌습니다. 서울 한 곳에서 800가구로 시작한 실험이 나라의 제도가 됐습니다.\n\n국회 예산 심사는 길었습니다. 야당은 돈이 너무 든다고 했고 여당 안에서도 같은 말이 나왔습니다. 시범 사업의 결과표가 그 논쟁을 끝냈습니다. 받은 가구의 근로소득이 줄지 않았다는 숫자였습니다."
 tfrkphn.663.story:0 "총리 자리를 맡긴 까닭을 대통령은 한 번도 길게 말하지 않았다. 우리가 들은 것은 계파가 없어 빚질 데가 없고 노동부 장관을 해 봐서 공장을 안다는 두 마디가 전부다. 대통령의 셈으로는 그것으로 충분하다. 필요해서 불렀고 부른 사람이 왔으니까요.\n\n지난주 주례 보고에서 총리는 노동 개혁만은 대통령이 직접 챙겨야 한다고 말했다. 대통령은 고개도 끄덕이지 않다가 그가 나간 뒤에 비서실장에게 일렀다. 일흔이 넘어서도 할 말이 남은 사람이니 보고 시간을 줄이지 말라고.\n\n두 사람이 한 책상에서 얼마나 오래 갈지 우리는 아직 모른다."
 tfrkphn.6631.d:0 "도쿄일렉트론과 우리 반도체 회사들이 장비 협력 협약을 맺었습니다. 반도체 공장의 장비는 한 대가 멈추면 라인 전체가 섭니다. 전쟁 동안 우리는 부품 하나를 기다리느라 공장을 세운 적이 있습니다.\n\n이제 이 회사의 정비 인력이 우리 공장 가까이에 머뭅니다. 다음 세대 장비의 시험도 두 나라 기술자가 한 방에서 합니다."
 tfrkphn.6632.d:0 "도요타와 우리 자동차 회사들이 부품 규격을 맞추기로 했습니다. 미국 시장이 닫힌 뒤 두 나라의 자동차 회사들은 줄어든 시장을 두고 다투는 대신 비용을 줄이는 길을 골랐습니다.\n\n울산에서 만든 부품이 나고야의 공장으로 가고, 아이치에서 만든 부품이 울산으로 옵니다. 부산과 규슈를 오가는 화물선이 한 주에 몇 편 더 늘었습니다."
 tfrkphn.6633.d:0 "TSMC와 우리 반도체 회사들이 서로의 주문을 대신 만들어 주는 약속을 맺었습니다. 전쟁 동안 세계는 대만의 공장이 멈추면 무슨 일이 벌어지는지 보았습니다.\n\n한쪽 공장에 일이 생기면 다른 쪽이 그 주문을 이어받습니다. 경쟁하던 두 나라 회사가 처음으로 생산 계획을 서로에게 보여 주게 됐습니다. 주문을 넣는 회사들은 이 약속을 반겼습니다."
 tfrkphn.6634.d:0 "폭스콘이 우리나라에 조립 공장을 세우기로 했습니다. 대륙에 있던 공장을 전쟁으로 잃은 뒤 이 회사는 새 자리를 찾고 있었습니다.\n\n공장에는 우리 회사들이 만든 화면과 반도체, 배터리가 들어갑니다. 부품을 배에 실어 보내던 일이 트럭으로 한나절 거리가 됐습니다. 공장이 들어설 도시에서는 채용 설명회에 긴 줄이 섰습니다."
 tfrkphn.6635.d:0 "타타 그룹과 우리 회사들이 여러 건의 계약을 한꺼번에 맺었습니다. 우리 회사들의 전산 업무 일부가 인도로 가고, 인도에 짓는 제철소와 자동차 공장에는 우리 설비가 들어갑니다.\n\n인도는 사람이 많고 젊은 나라입니다. 우리 회사들은 중국에서 잃은 시장을 대신할 곳으로 인도를 꼽아 왔습니다. 뭄바이와 인천을 오가는 직항편이 늘었습니다."
 tfrkphn.6636.d:0 "빈그룹과 우리 회사들이 협력 협약을 맺었습니다. 베트남에는 우리 회사들의 공장이 이미 많습니다. 그 공장에서 만든 물건이 이제 이 회사의 매장과 온라인 장터에서 팔립니다.\n\n지금까지는 베트남에서 만들어 다른 나라에 팔았습니다. 이번 협약으로 베트남 안에서도 팝니다. 하노이와 호찌민의 매장 진열대에 우리 상표가 늘었습니다."
 tfrkphn.6637.d:0 "산미겔이 짓는 공항과 도로 공사에 우리 건설사들이 들어갑니다. 필리핀은 섬이 많아 다리와 항만, 공항이 늘 모자랍니다.\n\n우리 건설사들은 설계와 시공을 맡고 자재의 상당 부분을 우리나라에서 가져갑니다. 마닐라 근교의 공사 현장에 우리말로 쓴 안전 표지판이 섰습니다."
 tfrkphn.6638.d:0 "BHP와 우리 제철 회사들이 철광석과 구리를 여러 해 동안 정해진 물량으로 받는 계약을 맺었습니다. 전쟁 동안 원자재 값은 하루가 다르게 뛰었고, 값을 치르고도 배를 구하지 못한 때가 있었습니다.\n\n호주 서부의 항구에서 떠난 배가 정해진 날짜에 포항과 광양에 닿습니다. 건설 현장에 들어가는 철근 값이 한결 차분해졌습니다."
 tfrkphn.6639.d:0 "안탐과 우리 배터리 회사들이 니켈 공급 계약을 맺었습니다. 인도네시아는 니켈이 많이 나는 나라이고, 니켈은 전기차 배터리에 들어갑니다.\n\n현지에서 캐고 한 번 가공한 니켈이 배에 실려 호남권의 소재 공장으로 옵니다. 공장은 호남권 메가시티의 산업 단지 안에 섰습니다. 광양항에 니켈을 내리는 부두가 따로 생겼습니다."
 tfrkphn.664.story:0 "회의록에는 반대 1이라는 숫자가 남았다. 총리의 반대를 그대로 적어 두어도 되겠느냐고 묻자 대통령은 그냥 두라고 했다. 반대가 한 표라도 적혀 있어야 핵을 가진 우방에 내밀 때 모양이 난다는 것이다.\n\n대통령은 총리를 따로 부르지도 않았다. 국무회의는 헌법이 정한 심의 기구이고 반대가 나오라고 여는 자리라는 것이 그의 말이었다. 총리는 다음 주에도 같은 자리에 앉아 다른 안건에 찬성했다.\n\n그 한 표가 언젠가 다른 무게로 돌아올 수 있다는 생각을 우리는 그때 하지 못했다."
 tfrkphn.6640.d:0 "CP 그룹과 우리 식품과 유통 회사들이 여러 해짜리 공급 계약을 맺었습니다. 전쟁 동안 바닷길이 흔들리면서 닭고기와 사료 곡물 값이 크게 올랐던 일이 있습니다.\n\n값이 올라도 물량은 끊기지 않게 하는 것이 이 계약의 요점입니다. 태국에서 떠난 냉동 컨테이너가 부산항에 들어오는 날짜가 달력에 고정됐습니다."
 tfrkphn.665.story:0 "대통령은 삼십 년 전 이야기라고 잘랐다. 그러고는 사흘을 주겠다면서, 사흘 안에 풀지 못하면 긴급조정권을 쓸 것이고 그때는 총리 자리도 같이 걸린다는 조건을 달았다.\n\n그는 이틀 만에 돌아왔다. 손에는 수당을 전쟁이 끝난 뒤에 정산하고 파업은 미룬다는 합의문이 들려 있었다. 수고했다는 말은 없었다. 대통령은 합의문을 끝까지 읽고 나서 다음은 거제라고 했다.\n\n전쟁이 끝난 뒤에 정산한다는 그 한 줄을 누가 갚게 될지, 우리는 아직 모른다."
 tfrkphn.6651.d:0 "선거를 열흘 앞두고 두 후보가 방송 토론에서 마주 앉습니다. 토론은 한 번뿐이고 시간은 아흔 분입니다.\n\n우리 후보 [GetTFRKPHNSdCand]의 참모들은 무엇을 앞세울지를 두고 밤새 다퉜습니다. 낡은 주거지가 많은 동북쪽은 재개발 이야기를, 서울 바깥쪽 생활권은 교통 이야기를, 일터가 몰린 곳은 일자리 이야기를 듣고 싶어 합니다. 셋을 다 말하면 아무것도 남지 않는다는 것이 참모들의 한결같은 말입니다."
 tfrkphn.6652.d:0 "정원오 후보가 [GetTFRKPHNByOppAt]에서 큰 공약을 내놓았습니다. 이 생활권을 지나는 철길을 땅 밑으로 넣고 그 위를 공원과 주택으로 채우겠다는 것입니다.\n\n그는 구청장을 지낸 경험을 내세우며, 구청에서 해 본 일을 시청에서 하겠다고 말했습니다. 현장에는 평소 유세보다 훨씬 많은 사람이 모였습니다. 우리 후보 캠프는 그날 저녁 대책 회의를 열었습니다."
 tfrkphn.6653.d:0 "저녁 여덟 시에 투표가 끝났습니다. 투표함이 구마다 체육관으로 옮겨졌고 개표가 시작됐습니다.\n\n한강 북쪽의 표가 먼저 열렸습니다. 앞의 숫자가 우리 후보, 뒤의 숫자가 상대 후보입니다.\n\n도심  §R[?TFRKPHN_by_z1|1]§! 대 §B[?TFRKPHN_by_zo1|1]§!\n서북  §R[?TFRKPHN_by_z2|1]§! 대 §B[?TFRKPHN_by_zo2|1]§!\n동북1  §R[?TFRKPHN_by_z3|1]§! 대 §B[?TFRKPHN_by_zo3|1]§!\n동북2  §R[?TFRKPHN_by_z4|1]§! 대 §B[?TFRKPHN_by_zo4|1]§!"
 tfrkphn.6654.d:0 "자정이 가까워졌습니다. 개표소의 탁자마다 표 묶음이 쌓이고, 참관인들이 한 장씩 넘어가는 표를 지켜봅니다.\n\n한강 남쪽 서편의 표가 열렸습니다.\n\n서남1  §R[?TFRKPHN_by_z5|1]§! 대 §B[?TFRKPHN_by_zo5|1]§!\n서남2  §R[?TFRKPHN_by_z6|1]§! 대 §B[?TFRKPHN_by_zo6|1]§!\n서남3  §R[?TFRKPHN_by_z7|1]§! 대 §B[?TFRKPHN_by_zo7|1]§!"
 tfrkphn.6655.d:0 "새벽이 됐습니다. 남은 것은 동남쪽 두 생활권의 표입니다.\n\n동남1  §R[?TFRKPHN_by_z8|1]§! 대 §B[?TFRKPHN_by_zo8|1]§!\n동남2  §R[?TFRKPHN_by_z9|1]§! 대 §B[?TFRKPHN_by_zo9|1]§!\n\n스물다섯 구를 모두 더했습니다.\n우리 후보 §R[?TFRKPHN_sd_avg|1]§! 대 상대 후보 §B[?TFRKPHN_by_opp|1]§!"
 tfrkphn.666.story:0 "이인제는 목록을 끝까지 읽고 접어서 주머니에 넣었다. 지키겠다는 말도 못 지키겠다는 말도 하지 않았다. 그는 자기가 1997년에 오백만 표 가까이 받고도 진 사람이니 이번에는 남의 약속을 들고 뛰지는 않겠다고만 말했다.\n\n대통령은 웃지 않았다. 여든을 앞둔 사람이 바통이나 떨어뜨리지 말라고 했고, 이인제는 문을 나서면서 떨어뜨릴 바통이었으면 받지도 않았다고 받아쳤다.\n\n이인제가 떠난 뒤 대통령은 현관까지 혼자 걸어 나와 차가 내려가는 것을 지켜보았다. 배웅하러 따라 나온 사람은 없었다. 계파 없이 들어온 관저는 나가는 날에도 조용했다.\n\n우리는 곧 짐을 싼다. 그리고 우리 가운데 몇은 저 노인 밑에서 다시 짐을 풀게 될 것이다."
 tfrkphn.67.kp:0 "우리가 PDTO 가입을 발표하던 날 아침, 바다 건너 중화민국 금문현의 한 해안 초소에서 있었던 일이다. 새벽 다섯 시, 상등병 린웨이는 망원경을 눈에서 떼고 손등으로 눈을 비볐다. 바다 건너편이 밝아 오고 있었다.\n\n샤먼까지는 직선거리로 몇 킬로미터인데, 맑은 날이면 맨눈으로도 고층 빌딩의 창문 개수를 셀 수 있다. 빌딩 숲 아래로 해안도로를 달리는 차들의 불빛이 보였다. 저쪽 사람들도 지금쯤 출근 준비를 할 것이다.\n\n그 사이 바다 한가운데에 작은 바위섬이 하나 떠 있다. 섬 전체가 콘크리트 벙커이고, 할아버지 세대가 포탄을 맞아 가며 지킨 곳이다. 1958년에 44일 동안 47만 발의 포탄이 이 섬들 위로 떨어졌다고 린웨이는 학교에서 배웠다.\n\n얼마 전 다시 포성이 울렸고, 린웨이는 그날을 잊지 못한다. 섬 전체가 흔들렸고 통신이 끊겼으며 모두가 이번에는 끝이라고 생각했다. 미국은 제 나라 안의 전쟁으로 바빠 오지 않았다."
 tfrkphn.67.kp2:0 "대신 다른 배들이 왔고, 일본의 호위함과 필리핀의 초계정, 그리고 태극기를 단 구축함이 해협으로 들어왔다. 초소의 무전기에서 처음 듣는 언어가 흘러나왔고, 린웨이는 옆 초소 병사에게 물어보고서야 그것이 한국어라는 것을 알았다.\n\n초소 안 라디오에서 아침 뉴스가 흘러나왔다.\n\n\"대한민국 정부는 오늘 PDTO에 정식 가입한다고 발표했습니다. 이로써 대한민국은 일본, 중화민국 등 회원국과 집단방위 의무를 공유하게 됩니다....\"\n\n선임병 천 하사가 담배를 물고 초소 안으로 들어왔다.\n\n\"들었어? 한국이 들어왔대.\"\n\"들었습니다.\"\n\"우리 아버지 때는 한국이 우리를 버렸다고들 했지. 하룻밤 사이에 대사관 문을 닫았다고. 그런데 이번엔 와서 같이 싸웠어. 이제는 아예 한 편이 됐고.\"\n\n린웨이는 다시 망원경을 들었고, 바다 건너 빌딩들 위로 해가 떠오르고 오성홍기가 걸린 건물 옥상이 붉게 빛났다.\n\n\"하사님.\"\n\"응.\"\n\"이제 이 섬, 우리만 지키는 거 아니죠.\"\n\n천 하사가 담배를 비벼 끄며 말했다.\n\n\"그래. 이제 우리끼리만은 아니야.\""
 tfrkphn.6701.d:0 "우리는 내각과 당직의 문을 가운데 쪽으로 열었습니다. 전쟁 동안 우리와 거리를 두었던 사람들에게도 자리를 권했습니다.\n\n홍준표 정부는 전쟁을 치르는 동안 반대편을 밀어붙이는 방식으로 일했습니다. 우리는 그 방식을 물려받지 않기로 했습니다. 대통령은 2019년 2월 7일 당 대표 선거에 나서며 박 전 대통령을 극복할 수 있어야 보수정치는 부활할 수 있다고 말한 사람입니다. 그해 선거에서 그는 졌습니다. 당 안에서는 벌써 불만이 나옵니다. 전쟁을 함께 치른 사람들을 두고 왜 밖에서 사람을 찾느냐는 것입니다."
 tfrkphn.6702.d:0 "우리는 가장 크게 갈린 쟁점을 국민투표에 부치기로 했습니다. 국회에서 몇 달째 풀리지 않던 문제입니다.\n\n대통령에게 투표함은 쓰라린 기억입니다. 2011년 8월 그는 무상급식을 주민투표에 부치고 시장직을 걸었습니다. 투표율은 개표 기준에 못 미쳤고 그는 물러났습니다. 참모들은 이번에도 직을 걸 것이냐고 물었고, 대통령은 걸지 않는다고 답했습니다. 결과가 어느 쪽으로 나오든 임기는 그대로 간다는 뜻입니다."
 tfrkphn.6703.d:0 "양안전쟁 동안 홍준표 정부가 걸어 두었던 비상 조치를 오늘부터 풉니다. 여론조사 공표 금지가 풀렸고, 비상 대기로 붙들려 있던 장병들에게 귀가 명령이 내려갔습니다.\n\n신문들은 오랜만에 정당 지지율 조사를 1면에 실었습니다. 부대 정문 앞에는 가족들이 새벽부터 차를 대고 기다렸습니다. 통제를 푸는 순서를 두고는 안에서 말이 많았습니다. 한꺼번에 풀면 중국을 자극한다는 걱정과, 끝난 전쟁의 비상 조치를 더 끌 까닭이 없다는 말이 맞섰습니다."
 tfrkphn.6704.d:0 "양안전쟁 때 비밀 지원에 나섰다가 숨진 사람들의 명단이 처음 공개됐습니다. 군인과 선원, 조종사의 이름과 숨진 날짜가 한 줄씩 적혔습니다.\n\n대한민국은 서류 위로는 중립국이었고, 이 이름들은 그동안 작전 보안을 이유로 묶여 있었습니다. 유족들은 사고로 숨졌다는 통지서 한 장만 받고 기다려 왔습니다. 보상의 기준도 법으로 정했습니다. 같은 전투에서 숨진 사람의 유족이 서로 다른 금액을 받는 일이 다시 없게 하려는 것입니다. 대통령은 명단이 걸린 벽 앞에서 한참 서 있었습니다. 몇몇 유족은 끝내 벽 앞에 서지 못했습니다. 사고였다는 말만 믿고 몇 해를 보낸 사람들이었습니다."
 tfrkphn.6705.d:0 "주택 공급 계획을 발표했습니다. 2021년 4월 서울시장 선거에서 대통령은 다섯 해 동안 36만 가구를 약속했습니다. 그때의 방식을 나라 전체로 넓힙니다.\n\n핵심은 인허가에 걸리는 시간을 줄이는 것입니다. 지금은 구역 지정에서 착공까지 여러 해가 걸립니다. 따로 열리던 심의를 한 번에 묶어 그 시간을 크게 줄이기로 했습니다. 건설사들은 반겼고, 세입자 단체는 철거부터 빨라질 것이라고 걱정했습니다."
 tfrkphn.6706.d:0 "아파트 높이를 35층으로 묶어 두었던 규제를 풀었습니다. 낮게 잡혀 있던 용적률도 함께 고쳤습니다.\n\n같은 땅에 더 많은 집을 지을 수 있게 됐습니다. 한강을 따라 선 낡은 단지들이 가장 먼저 재건축 계획을 냈고, 조감도에는 쉰 층이 넘는 건물이 그려져 있습니다. 강변의 하늘선이 달라진다는 말에 반기는 사람과 눈살을 찌푸리는 사람이 반씩입니다. 뒤 단지의 주민들은 햇빛이 가려진다며 구청에 의견서를 냈습니다."
 tfrkphn.6707.d:0 "상생주택의 첫 단지가 입주를 시작했습니다. 민간의 땅을 빌려 공공이 짓는 장기전세주택입니다. 2007년 서울에서 시작한 시프트의 두 번째 판이기도 합니다.\n\n땅 주인은 땅을 팔지 않고 임대료를 받고, 나라는 땅값을 들이지 않고 집을 짓습니다. 입주자는 주변 시세보다 낮은 보증금으로 길게 삽니다. 첫 단지의 경쟁률은 수십 대 일이었습니다. 추첨에서 떨어진 사람들이 다음 단지는 언제냐고 묻고 있습니다."
 tfrkphn.6708.d:0 "복지 정책의 이름을 약자와의 동행으로 정했습니다. 대통령이 서울시장 때 시정의 맨 앞에 두었던 말이고, 우리가 내건 따뜻한 보수의 첫 장이기도 합니다.\n\n2021년 9월 15일 그는 서울비전 2030을 내놓으며 계층 이동 사다리를 복원하겠다고 말했습니다. 우리 복지의 목표도 거기에 둡니다. 가난한 집 아이가 공부할 길, 일자리를 잃은 사람이 다시 설 길, 집 없는 사람이 집을 가질 길을 하나씩 놓겠다는 것입니다. 예산 당국은 전쟁 빚부터 갚아야 한다는 의견을 붙였습니다."
 tfrkphn.6709.d:0 "형편이 어려운 집 아이들에게 온라인 강의를 무료로 열어 주던 서울의 사업이 전국으로 넓어졌습니다.\n\n민간 교육 회사의 강의를 나라가 사서 아이들에게 나눠 주는 방식입니다. 섬과 산골의 학생들이 대도시 학원가의 강의를 집에서 듣게 됐습니다. 교사 단체는 학교 수업이 밀려난다고 걱정했고, 학원 업계는 값을 너무 깎는다고 불평했습니다. 첫 달에 가입한 학생의 절반 가까이가 읍과 면에 사는 아이들이었습니다."
 tfrkphn.671.d:0 "경부고속선 보강 공사가 끝났습니다. 2004년 4월 1일에 첫 고속열차가 달린 선로가 서울에서 부산까지 전 구간 최고 등급이 됐습니다.\n\n대전에는 물류 거점이 들어섰습니다. 경부선과 호남선이 갈라지는 도시여서, 남쪽으로 내려가는 물자가 여기서 영남과 호남으로 나뉩니다. 서울과 부산을 잇는 축이 한결 넉넉해졌습니다."
 tfrkphn.6710.d:0 "청년취업사관학교가 전국에서 문을 열었습니다. 기업이 바라는 기술을 가르쳐 곧바로 일자리로 잇는 학교입니다. 서울에서는 열 곳을 약속했던 사업입니다.\n\n첫 기수의 자리는 전쟁에서 돌아온 청년들에게 먼저 돌아갔습니다. 군복을 벗은 지 한 달이 안 된 사람들이 교실에 앉아 프로그래밍을 배웁니다. 수료생을 뽑겠다고 약속한 회사의 명단이 학교 벽에 붙었습니다. 접수 첫날 정원의 몇 배가 넘는 지원서가 들어왔습니다."
 tfrkphn.6711.d:0 "서울을 세계 5대 도시로 올리겠다는 목표를 나라의 계획으로 발표했습니다. 대통령이 서울비전 2030에 적었던 목표입니다.\n\n전쟁은 뜻밖의 기회를 남겼습니다. 홍콩과 상하이에 있던 회사들이 새 주소를 찾고 있고, 미대륙을 떠난 회사들도 자리를 구합니다. 우리는 세금과 비자, 영어로 되는 행정을 묶어 내놓았습니다. 경쟁 도시는 도쿄와 싱가포르입니다. 외국 경제지들은 서울의 사무실 임대료가 벌써 오르기 시작했다고 썼습니다."
 tfrkphn.6712.d:0 "여의도가 디지털금융특구로 지정됐습니다. 서울에 있는 해외 금융기관을 250곳까지 늘리는 것이 서울시 때부터의 계획입니다.\n\n특구 안에서는 외국 금융사가 들어와 영업을 시작하기까지의 절차가 크게 줄어듭니다. 홍콩을 떠난 자본이 첫 손님이 될 것으로 보입니다. 국내 은행들은 같은 조건을 달라고 요구했습니다. 금융 당국은 특구 밖으로 위험이 번지지 않게 칸막이를 치겠다고 답했습니다."
 tfrkphn.6713.d:0 "수출 상품의 디자인을 나라가 돕는 사업을 시작했습니다.\n\n2007년 10월 서울은 2010년 세계디자인수도로 뽑혔습니다. 그때 서울시장이 지금의 대통령입니다. 그때 도시의 모습에 들였던 공을 이번에는 나라 밖으로 팔려 나가는 물건에 들입니다. 중소기업이 만든 가전과 화장품, 식품의 포장과 모양을 전문가들이 다시 그립니다. 첫 해 지원을 받은 회사 가운데 몇 곳이 나라 밖의 디자인 상을 받았습니다."
 tfrkphn.6714.d:0 "망명 기업 특별법이 국회를 통과했습니다. 혜택의 기준과 기한을 법에 적었습니다.\n\n땅값을 깎아 주는 폭, 세금을 미뤄 주는 햇수, 외국인 직원의 비자 조건이 조문으로 정해졌습니다. 같은 권역에 있는 국내 기업도 같은 조건을 신청할 수 있다는 조항이 마지막 협상에서 들어갔습니다. 경제 단체들은 이 조항을 반겼습니다. 법이 생기면서 회사마다 따로 하던 협상은 끝났습니다."
 tfrkphn.6715.d:0 "2050년 탄소중립을 나라의 목표로 다시 확인했습니다. 서울이 세웠던 일정은 2030년까지 온실가스를 40퍼센트 줄이고 2050년에 순배출을 없애는 것이었습니다.\n\n전쟁 동안 발전소와 공장은 가릴 것 없이 돌았고 그 사이 배출량은 크게 늘었습니다. 산업계는 재건이 먼저라고 말합니다. 우리는 재건에 들어가는 설비부터 새 기준에 맞추기로 했습니다. 메가시티 권역마다 들어서는 에너지 농장에서 그 일이 시작됩니다."
 tfrkphn.6716.d:0 "동네 하천을 걷고 쉬는 곳으로 바꾸는 사업이 시작됐습니다. 한강에서 하던 일을 지천으로 가져간 것입니다.\n\n콘크리트 둑을 걷어 내고 물가에 길과 의자를 놓습니다. 첫 구간이 열린 날 저녁, 동네 사람들이 돗자리를 들고 나왔습니다. 하천 둘레의 가게들은 영업 시간을 늘렸습니다. 큰비가 오면 어떻게 되느냐는 질문에는 물이 차는 구간과 대피로를 표시한 지도로 답했습니다."
 tfrkphn.6717.d:0 "대통령의 첫 안보 연설문은 일곱 번 고쳐졌다. 마지막까지 남은 쟁점은 한 단어였다. 기한이라는 말을 넣을지 뺄지를 두고 안보실 비서관과 외교부 차관이 새벽까지 다퉜다. 기한을 넣으면 북한에 시계를 들이미는 셈이고, 빼면 연설은 지난 정부들의 말과 다를 것이 없었다.\n\n결국 대통령이 직접 펜을 들었다. 북한에 핵을 없앨 기한을 주고, 그 기한이 지나면 우리도 핵을 개발한다는 문장이 그대로 남았다. 2019년 2월 17일 당 대표 후보 토론회에서 그는 이것을 넛지 전략이라고 불렀다. 그때는 후보의 말이었고 지금은 대통령의 말이다."
 tfrkphn.6718.d:0 "[GetTFRKPHNOhH3Open]\n\n2017년 문재인 정부는 사드를 더 들이지 않고, 미국의 미사일 방어 체계에 들어가지 않으며, 한미일 군사 동맹으로 가지 않는다는 세 가지 입장을 중국에 밝혔다. 사람들은 이것을 삼불이라 불렀다. 그 뒤 어느 정부도 이 입장을 공식으로 거둔 적이 없었다.\n\n외교부는 한 장짜리 문서를 만들었다. 우리 정부는 그 입장을 이어받지 않으며, 안보에 관한 결정은 우리가 내린다는 내용이었다. 미국이 무너진 지금, 미사일 방어를 함께할 상대도 군사 협력의 상대도 그때와는 다른 나라들이었다. 문서는 그 이름들을 일부러 적지 않았다."
 tfrkphn.6719.d:0 "양안전쟁 동안 비상 대기로 늘려 둔 병력을 평시 규모로 되돌리는 명령이 내려갔다. 비상소집으로 불려 왔던 예비역들이 가장 먼저 군복을 벗었다. 그들 가운데 많은 수가 두 해 가까이 집에 가지 못했다.\n\n강원도의 한 대대에서 전역식은 연병장 한쪽 천막 아래에서 치러졌다. 대대장은 준비한 원고를 반쯤 읽다가 접었다. 훈장을 받은 사람도 아무것도 받지 못한 사람도 같은 버스를 탔다. 버스가 위병소를 지날 때 남는 병사들이 경례를 했고, 몇 사람은 창문을 열고 손을 흔들었다."
 tfrkphn.672.d:0 "호남고속선 공사가 끝났습니다. 2015년 4월 2일 광주송정까지 열린 고속선이 이제 목포 방면까지 같은 수준으로 이어집니다.\n\n광주에는 물류 거점이 들어섰습니다. 본선에서 광주로 들어가는 지선도 함께 놓였습니다. 호남으로 내려가는 물자는 광주에 모였다가 목포와 순천 쪽으로 흩어지게 됩니다."
 tfrkphn.6720.d:0 "다섯 해의 국정 계획을 발표했습니다. 주택과 복지, 산업을 한 권에 묶었고 표지에는 따뜻한 보수라는 말을 적었습니다.\n\n홍준표 정부는 전쟁의 불길이 이 땅에 번지지 않게 막았습니다. 그 나라를 살 만한 곳으로 만드는 일이 이번 정부의 몫입니다. 계획서의 뼈대는 대통령이 서울에서 해 본 일들입니다. 집은 빨리 짓고, 복지는 사다리를 놓는 데 쓰고, 산업은 사람과 돈이 모이는 도시를 만드는 데서 시작합니다. 발표장에서 한 기자가 지키지 못하면 어떻게 하겠느냐고 물었고, 대통령은 임기 끝에 성적표를 내겠다고 답했습니다."
 tfrkphn.6721.d:0 "임기의 마지막 해가 저물고 있습니다. 취임하던 날 우리는 승리는 지키고 국정은 바꾸겠다고 약속했습니다.\n\n2011년에 대통령은 서울시장 임기를 채우지 못하고 떠났습니다. 그 뒤 열 해 동안 그는 선거에서 여러 번 졌습니다. 이번에는 끝까지 일했습니다. 집무실 책상에는 다음 정부에 넘길 서류가 쌓여 있고, 지킨 약속과 지키지 못한 약속이 같은 크기의 글씨로 적혀 있습니다. 우리는 이 서류를 다음 사람에게 건넵니다."
 tfrkphn.6722.d:0 "연설문의 마지막 장을 넘기기 전에 오세훈 대통령은 잠시 원고에서 눈을 뗐다. 본회의장의 의석은 반으로 갈라져 있었고, 다섯 해 내내 대만지원법과 비밀 지원을 두고 싸운 여야 의원들이 서로 눈을 마주치지 않고 앉아 있었다. 대통령은 양안전쟁이 끝난 뒤 처음으로 이 연단에 섰다.\n\n따뜻한 보수는 그가 오래 써 온 말이다. 보수가 사람을 가장 앞에 두어야 하고, 시장이 돌아가게 두되 그 시장에서 넘어진 사람을 일으켜 세우는 일까지 맡아야 한다고 생각해 왔다. 모두에게 똑같이 나눠 주는 돈 대신 어려운 사람에게 더 주는 돈, 안심소득이 그 생각에서 나왔다.\n\n서울시장으로 돌아온 이듬해인 2022년 7월 1일, 그는 취임사에서 약자와의 동행을 두고 '제가 서울시장으로서 존재하는 이유이자, 제 평생의 과업'이라고 했다. 2026년 5월 28일, 다섯 번째 서울시장 선거를 엿새 앞두고는 '서울마저 내어준다면 이 땅에 합리적이고 건강한 보수를 다시 일으켜 세울 최소한의 바탕마저 소멸하는 것'이라고 말했다."
 tfrkphn.6723.d:0 "국정 연설 뒤에 처음 연 국무회의의 안건은 세 가지였습니다. 홍준표 정부가 걸어 둔 비상 조치와 비밀 지원의 뒷정리, 그리고 다섯 해 동안 얼어붙은 여야 관계입니다.\n\n모두 홍준표 정부가 대만을 뒤에서 돕느라 미뤄 둔 일입니다. 우리는 서류 위의 중립과 실제로 한 일 사이의 틈부터 메우기로 했습니다. 비상 조치는 중국을 자극하지 않는 순서로 풀어야 합니다. 베이징은 비밀 지원의 증거를 쥐고 있다는 말을 흘리며 우리 기업의 통관 심사를 늦추기 시작했습니다. 비밀 지원에 나섰다가 숨진 사람들의 이름을 찾아 적는 일과 야당 대표를 대통령실로 부르는 일도 같은 표에 올랐습니다. 대통령은 이 세 가지가 끝나야 다음 일을 시작할 수 있다고 말했습니다."
 tfrkphn.6724.d:0 "외교부의 서른여섯 살 과장이 협상단의 막내로 따라갔다. 그는 석 달 동안 우방의 수도와 서울을 열한 번 오갔다. 마지막 회의가 끝난 밤, 그는 호텔 방에서 합의문 초안의 한 줄을 몇 번이고 다시 읽었다. 핵무기의 열쇠는 우방이 쥐고, 그것을 실어 나를 전투기와 조종사는 한국이 맡는다는 문장이었다.\n\n대통령은 2020년 6월의 방송에서 처음으로 이 길을 입에 올려 전술핵 재배치와 나토식 핵공유를 선택지로 꼽았는데, 그때 그는 아무 공직도 맡고 있지 않았다. 홍준표 정부는 그 말을 협의체라는 이름으로 책상 위에 올려 두었다. 이번 정부는 책상 위의 서류를 땅 위로 옮기려 하고 있다."
 tfrkphn.6725.d:0 "핵공유 협의체의 첫 회의를 앞두고 국방부 장관이 대통령실로 올라왔다. 그는 두 가지 안을 들고 왔다. 하나는 협의를 넘어 배치를 요구하는 안, 다른 하나는 홍준표 정부가 만든 협의체를 그대로 잇는 안이었다.\n\n대통령의 생각은 원래 첫 번째 안에 가까웠다. 그는 오래전부터 나토식 핵공유를 주장해 왔고, 전술핵을 다시 들여오는 길도 닫지 않았다. 그러나 장관이 펼친 전문에는 우방들의 사정이 적혀 있었다. 한 나라는 이듬해 봄 총선을 앞두고 있었고, 다른 나라는 전쟁 빚을 갚느라 국방 예산을 깎는 중이었다. 지금 배치를 꺼내면 협의체부터 흔들린다는 것이 실무진의 판단이었다."
 tfrkphn.6726.d:0 "태평양방위조약기구의 정상회의가 열렸다. 전쟁이 끝난 뒤 처음으로 회원국 정상이 한 탁자에 앉아 전쟁이 남긴 일을 누가 맡을지를 논의했다.\n\n큰 나라들은 함대와 기지를 내놓았다. 어느 나라는 항공모함 한 척을 남중국해에 상주시키겠다고 했고, 어느 나라는 해병대 기지를 새로 열겠다고 했다. 우리 차례가 오자 대통령은 군대 이야기를 꺼내지 않았다. 대신 무너진 항만과 철도를 다시 짓는 일, 탄약과 부품을 대는 일, 피란민이 들어갈 집을 짓는 일을 한국이 맡겠다고 했다. 조선소와 건설사, 방산 공장이 그 일을 나눠 지겠다는 제안이었다."
 tfrkphn.6727.d:0 "김 하사는 양안전쟁이 끝나기 두 달 전 대만 해협의 이름 없는 섬에서 오른쪽 다리를 잃었다. 서류 위로 대한민국은 그 전쟁에 없던 나라였고, 그가 탄 수송선도 없던 배였다. 그래서 그는 오랫동안 참전용사로 인정받지 못했다.\n\n그는 법이 바뀐 뒤에야 참전용사가 되었다. 정부는 비밀 지원에 나섰던 군인과 선원, 정비사를 참전용사로 인정하는 법부터 고쳤다. 그다음에는 집을 마련해 주는 일에 나섰다. 상생주택과 값을 낮춘 집의 일부를 참전용사 몫으로 떼어 두고, 다친 사람과 가족을 잃은 사람에게 먼저 열쇠를 주기로 했다."
 tfrkphn.6728.d:0 "대한민국투자청이 문을 열었다. 외국 기업이 이 나라에 돈을 넣으려면 지금까지 부처 예닐곱 곳을 따로 돌아야 했다. 땅은 지자체에, 세금은 국세청에, 비자는 법무부에, 공장 허가는 또 다른 곳에 물어야 했다. 이제는 투자청 한 곳에서 답을 받는다.\n\n대통령은 서울시장 때 서울투자청을 만들어 같은 일을 해 보았다. 그때 창구에 앉았던 직원 몇이 이번에도 첫 상담 창구에 앉았다. 그들은 외국 회사들이 세금보다 허가를 얼마나 기다려야 하는지를 더 많이 묻는다고 했다."
 tfrkphn.6729.d:0 "서울 도심에 첫 모빌리티 허브가 문을 열었다. 지하에는 지하철이, 지상에는 버스와 공유 자전거가, 옥상에는 도심 항공기가 내리는 정류장이다. 서울의 계획은 2030년까지 이런 허브를 서른두 곳 짓는 것이었고, 이번에는 그 계획을 다른 큰 도시들로 넓힌다.\n\n첫 비행은 아침 일곱 시에 있었다. 네 사람이 타는 작은 기체가 옥상을 떠나 김포공항까지 날았다. 차로 한 시간이 걸리던 길이 십오 분으로 줄었다. 첫 승객 가운데 한 사람은 출근길 회사원이었고, 그는 내리자마자 휴대전화로 사진을 찍어 가족에게 보냈다.\n\n값은 아직 비싸서 한 번 타는 데 택시 요금의 몇 배가 들었다. 시민 단체는 하늘길이 부자들의 지름길이 될 것이라고 했다. 국토부는 허브의 아래층 버스와 자전거 요금을 한 장의 교통카드로 묶어, 하늘을 타지 않는 사람도 허브를 쓰게 만들겠다고 답했다.\n\n허브가 들어선 동네의 주민들은 소음을 걱정했다. 시험 비행 동안 구청은 옥상 둘레의 아파트 여섯 곳에 소음 측정기를 달았다. 측정값은 매일 구청 홈페이지에 그대로 올라갔다."
 tfrkphn.673.d:0 "전라선 공사가 끝났습니다. 2011년에 전 구간이 복선이 된 뒤에도 굽은 구간이 많아 고속열차가 제 속도를 내지 못하던 선로입니다. 오늘부터 익산에서 여수까지 열차가 전보다 빠르게 달립니다.\n\n순천과 여수에서 나오는 화물은 광주의 물류 거점과 한 줄로 이어졌습니다."
 tfrkphn.6730.d:0 "민원 창구가 가상 공간에 열렸다. 주민등록 서류를 떼거나 세금을 묻거나 복지 상담을 받으러 관공서에 가지 않아도, 집에서 화면 속 창구 앞에 앉으면 된다. 서울은 2023년에 그 틀을 만들고 2030년에 모든 분야로 넓히기로 했다. 이번에는 그 계획을 나라 전체로 가져간다.\n\n첫 달에는 뜻밖에도 전쟁 때 흩어진 가족의 행방을 묻는 민원이 가장 많이 들어왔다. 피란 기록과 주소 이전 기록을 한꺼번에 볼 수 있게 되자 사람들이 몰렸다. 상담 직원 한 사람은 하루에 이산가족 열네 집과 마주 앉았다고 했다."
 tfrkphn.6731.d:0 "2030년 6월 전국동시지방선거까지 두 달이 남았습니다. 시장과 도지사 [?TFRKPHN_le_total|0]자리가 한꺼번에 걸린 선거이고, 임기 네 해째를 맞은 우리 정부에는 중간평가나 다름없습니다. 메가시티가 올라간 권역과 그렇지 못한 권역의 민심은 벌써 다르게 움직입니다. 당은 후보를 모두 확정했고, 참모들은 대통령이 지역을 얼마나 찾아도 되는지를 두고 의견이 갈립니다. 공무원인 대통령은 법으로 선거 중립을 지켜야 합니다. 선거 상황실은 오늘부터 날마다 판세를 올립니다."
 tfrkphn.6733.d:0 "대통령의 지역 방문이 잦아지자 야당이 선거 개입이라고 공세를 편다. 야당은 대통령이 가는 곳마다 지역 사업 이야기가 따라붙는다며 선거관리위원회에 조사를 요구했다. 여당 안에서도 대통령이 앞에 서면 선거가 정권 심판 구도로 흐를 수 있다는 걱정이 나온다. 남은 기간 대통령의 일정을 어떻게 짤지 정해야 한다.\n\n선거관리위원회는 대통령실에 최근 일정 자료를 요청했다. 대통령실은 자료를 그대로 냈다. 지역 방문 가운데 몇은 선거 공고 전부터 잡혀 있던 사업 현장이었다. 그러나 언론은 날짜보다 사진을 먼저 실었다. 사진 속 대통령 옆에는 여당 후보가 서 있었다.\n\n정무수석은 남은 일정표를 펴 놓고 지역마다 동그라미와 가위표를 그렸다. 동그라미는 점점 줄었다. 지방선거까지는 한 달이 남았다.\n\n그날 저녁 여당 상황실에는 대통령의 다음 방문지를 묻는 후보들의 전화가 끊이지 않았다. 상황실장은 전화마다 같은 말을 했다.\n\n\"이제 대통령님 사진은 기대하지 마이소.\"\n\n몇몇 후보는 그 말을 듣고 대통령과 찍은 옛 사진을 현수막에서 떼어 냈다."
 tfrkphn.6733.d_oh:0 "대통령의 지역 방문이 잦아지자 야당이 선거 개입이라고 공세를 편다. 야당은 대통령이 가는 곳마다 지역 사업 이야기가 따라붙는다며 선거관리위원회에 조사를 요구했다.\n\n논란이 커지자 오세훈 대통령이 기자들 앞에서 고개를 깊이 숙였다. 서울시장이던 2011년 8월 21일, 무상급식 주민투표를 앞두고 무릎을 꿇은 채 '이번 주민투표 결과에 시장직을 걸어 그 책임을 다하겠다'고 했던 장면을 떠올리는 사람이 많다. 그때 투표는 개표 기준에 못 미쳐 무산됐고, 그는 닷새 뒤 시장직을 내려놓았다.\n\n남은 기간 대통령의 일정을 어떻게 짤지 정해야 한다.\n\n대통령실 정무수석은 그날 저녁 남은 일정표를 다시 펼쳤다. 지역 사업 현장 방문 몇 개에 가위표가 그어졌다. 빈자리에는 장마 대비 배수펌프장 점검 같은 일정이 들어갔다. 언론은 다음 날 대통령이 몸을 낮췄다고 썼다.\n\n여당 후보들은 그 소식을 듣고 실망했다. 몇몇은 자기 지역이 빠졌다고 항의했다. 상황실장은 전화를 받을 때마다 같은 말을 했다.\n\n\"지금은 엎드릴 때입니다. 우리 대통령 무릎 꿇는 건 한 번이면 됩니다.\""
 tfrkphn.6734.d:0 "투표가 끝나자 방송사 출구조사가 일제히 나옵니다. 시도마다 예측 결과가 지도 위에 차례로 칠해지고, 당사 상황실에서는 지역 이름이 불릴 때마다 박수와 탄식이 엇갈립니다. 경합으로 분류된 곳은 자정을 넘겨야 윤곽이 잡힐 것으로 보입니다. 대통령은 참모 몇 사람과 함께 개표를 지켜보고 있습니다."
 tfrkphn.6735.d:0 "개표 결과 여당이 시도지사 [?TFRKPHN_le_total|0]자리 가운데 [?TFRKPHN_le_wins|0]곳에서 이겼습니다. 언론은 정부가 중간평가를 넉넉히 통과했다고 씁니다. 당 안에서는 강경한 노선을 접고 재건과 민생을 앞세운 선택이 지역에서 받아들여졌다는 말이 나옵니다. 대통령은 이긴 곳과 진 곳을 가리지 않고 당선인을 모두 만나겠다는 뜻을 전했습니다."
 tfrkphn.6736.d:0 "개표 결과 여당이 시도지사 [?TFRKPHN_le_total|0]자리 가운데 [?TFRKPHN_le_wins|0]곳에서 이겼습니다. 여당은 텃밭을 지켰지만 경합 지역 여러 곳을 내줬고, 야당은 심판론이 절반만 통했다고 자평합니다. 사업이 더딘 권역에서 표가 빠졌다는 분석이 당 보고서에 올랐습니다. 남은 임기의 지역 사업은 야당 단체장들과 협의해서 풀어야 합니다."
 tfrkphn.6737.d:0 "방송사 개표 화면에 여당 참패라는 자막이 걸렸습니다. 여당은 시도지사 [?TFRKPHN_le_total|0]자리 가운데 [?TFRKPHN_le_wins|0]곳에서 이기는 데 그쳤고, 야당은 정권 심판이 끝났다고 선언했습니다.\n\n여당 지도부는 개표가 끝나기도 전에 물러나겠다고 밝혔습니다. 당 안에서는 2024년 4월 11일 총선에 진 뒤 한동훈 당시 비상대책위원장이 물러나며 남긴 '민심은 언제나 옳다'는 말이 다시 돌았습니다. 여섯 해 만에 같은 장면을 본다는 말도 나옵니다.\n\n다음 대선을 준비하려는 사람들은 벌써 대통령과 거리를 두기 시작했습니다. 남은 임기 동안 국회와 지방정부 어느 쪽에서도 협조를 얻기 어려워졌습니다."
 tfrkphn.6738.d:0 "광주와 전남을 하나로 묶는 특별법이 1일 국회 본회의를 통과했다. 재석 175명 가운데 159명이 찬성했다. 광주가 1986년 직할시가 되며 전남에서 떨어져 나간 지 40년 만이다.\n\n신정훈 국회 행정안전위원장은 법안을 설명하며 '통합은 선택이 아닌 생존 전략'이라고 말했다. 김영록 전남지사는 '1 더하기 1이 2에 그치지 않고, 3 이상이 돼' 지역이 다시 일어서게 하자고 했다.\n\n전남광주통합특별시는 6월 3일 지방선거에서 첫 통합시장을 뽑고 7월 1일 인구 약 320만 명으로 출범한다. 정부는 네 해 동안 해마다 5조 원씩 모두 20조 원을 지원한다. 청사는 광주, 무안, 전남동부 세 곳을 함께 쓰지만, 본청을 어디에 둘지는 지역마다 말이 엇갈린다."
 tfrkphn.6738.d2:0 "광주와 전남을 하나로 묶는 특별법이 1일 국회 본회의를 통과했다. 재석 175명 가운데 159명이 찬성했다. 광주가 1986년 직할시가 되며 전남에서 떨어져 나간 지 40년 만이다.\n\n신정훈 국회 행정안전위원장은 법안을 설명하며 '통합은 선택이 아닌 생존 전략'이라고 말했다. 김영록 전남지사는 '1 더하기 1이 2에 그치지 않고, 3 이상이 돼' 지역이 다시 일어서게 하자고 했다.\n\n전남광주통합특별시는 6월 3일 지방선거에서 첫 통합시장을 뽑고 7월 1일 인구 약 320만 명으로 출범한다. 정부는 네 해 동안 해마다 5조 원씩 모두 20조 원을 지원한다. 청사는 광주, 무안, 전남동부 세 곳을 함께 쓰지만, 본청을 어디에 둘지는 지역마다 말이 엇갈린다."
 tfrkphn.674.d:0 "동해선 보강 공사가 끝났습니다. 부산에서 울산과 포항을 지나 강릉까지 동해안을 따라 올라가는 선로입니다. 1920년대 말에 처음 계획이 나왔고 2025년 1월 1일에야 한 선로로 이어진 길이기도 합니다.\n\n포항에는 물류 거점이 들어섰습니다. 동해안의 항구와 공단에서 나오는 화물이 철길을 타고 남북으로 오가게 됩니다."
 tfrkphn.6741.d:0 "2023년 6월 11일 0시, 강원도가 강원특별자치도로 새로 출발했습니다. 628년 동안 써 온 이름이 바뀌었고, 제주와 세종에 이어 세 번째 특별자치 시도가 됐습니다. 특별법은 지난해 5월 국회를 통과했고, 출범을 앞둔 올해 5월에는 국회가 법을 고쳐 환경, 국방, 산림, 농지 네 분야의 규제 권한 일부를 도에 넘겼습니다. 이제 도는 군사시설 보호구역을 조정해 달라고 건의할 수 있고, 산림과 농지를 개발에 쓸 길도 넓어졌습니다. 반도체와 수소 산업을 키울 첨단과학단지도 만들 수 있게 됐습니다. 도청에서는 새 이름을 단 공문이 나가기 시작했고, 영문 이름도 Gangwon State로 바뀌었습니다."
 tfrkphn.6742.d:0 "2024년 1월 18일, 전라북도가 전북특별자치도로 새로 출발했습니다. 1896년 전라도가 남북으로 나뉘며 생긴 이름을 128년 만에 내려놓은 것입니다. 출범식은 전주 한국소리문화의전당에서 열립니다. 전날 도청에서 열린 전야제에서 김관영 지사는 '128년간 사용했던 전라북도를 떠나보내고 이제 전북특별자치도를 맞이하게 됐다'고 말했습니다. 국회는 지난해 12월 8일 131개 조문에 333개 특례를 담은 전부개정안을 통과시켰고, 이 특례들은 올해 12월 27일부터 시행됩니다. 그 가운데에는 외국인의 비자 발급 절차와 체류 기간을 달리 정할 수 있는 이민 특례도 있습니다."
 tfrkphn.6743.d:0 "대법원은 21일 이른바 드루킹 댓글 조작에 공모한 혐의로 기소된 김경수 경남도지사에게 징역 2년을 선고한 원심을 확정했습니다. 선거를 도운 대가로 일본 센다이 총영사 자리를 제안했다는 공직선거법 위반 혐의는 무죄가 유지됐습니다.\n\n김 지사는 이날로 지사직을 잃었습니다. 그는 경남도청에서 '안타깝지만, 법정을 통한 진실 찾기는 더는 진행할 방법이 없어졌다'며 '대법원이 내린 판결에 따라 제가 감내해야 할 몫은 온전히 감당하겠다'고 밝혔습니다. 이어 '특히 지난 3년간 도정을 적극 도와준 도민께 진심으로 송구하고 감사하다'고 말했습니다.\n\n도정은 하병필 행정부지사가 권한대행으로 이끕니다. 보궐선거를 치를지는 경남도 선거관리위원회가 다음 주에 정할 예정입니다."
 tfrkphn.6744.d:0 "원희룡 제주특별자치도지사가 지사직을 내려놓았습니다. 원 지사는 지난 1일 제주도청에서 기자회견을 열고 '정권교체를 위해 대통령 선거에 출마하기로 했다'며 사퇴 의사를 밝혔습니다.\n\n그는 '임기를 다하지 못하고 퇴임하는 것에 대해 제주도민에게 죄송하다'면서도 '도지사가 대선을 위해 행정자원을 쓰는 것은 공직윤리로 문제가 있다고 생각한다'고 사퇴 이유를 설명했습니다. 원 지사는 다음 날 도의회에 사임 통지문을 보냈고, 그 뒤 열흘 동안 코로나19 방역 같은 현안을 구만섭 행정부지사에게 넘겼습니다.\n\n사퇴는 12일 0시부터 효력을 얻었습니다. 구 부지사는 내년 6월 30일까지 약 11개월 동안 제주지사 권한대행을 맡습니다."
 tfrkphn.6745.d:0 "더불어민주당 대통령 후보로 확정된 이재명 경기도지사가 25일 지사직에서 물러났습니다. 후보로 확정된 지 보름 만입니다.\n\n이 지사는 이날 오전 수원 경기도청에서 기자회견을 열고 '경기도지사직에서 물러나 20대 대통령 선거 더불어민주당 후보로 나서고자 합니다'라고 밝혔습니다. 그는 '경기도의 주인이시며 주권자이신 1,380만 도민께 드린 약속과 공직자로서의 책임을 다 하기 위해 오늘까지 최선을 다했습니다'라며 '도민 여러분의 큰 사랑에 다시 한 번 감사드립니다'라고 말했습니다.\n\n도정은 오병권 행정1부지사가 권한대행으로 맡습니다. 경기도가 부지사 권한대행 체제로 운영되는 것은 24년 만입니다."
 tfrkphn.6746.d:0 "오세훈 서울시장이 국민의힘 대선 경선에 나서려고 시장직을 내려놓았다. 대선에 나서려는 단체장은 선거일 90일 전까지 자리에서 물러나야 한다. 그는 지난 6월 정원오 후보와 1퍼센트포인트도 안 되는 차이로 이겨 사상 처음 다섯 번째로 서울시장에 당선됐다.\n\n당선 뒤 인터뷰에서 그는 '대선에 대한 생각, 계획 있느냐고 묻는다면 앞으로 4년 동안 내 대답은 한결같을 것이다. 오직 서울을 바꾸는 데 미쳐 있을 것이다'라고 말했다. 2025년 4월에는 '저는 이번 대선에 출마하지 않겠다'며 한 번 물러선 적도 있다. 이번에는 다르다. 오 시장 측은 서울에서 해 온 일을 나라 전체로 넓힐 때라고 설명했다.\n\n시정은 행정1부시장이 권한대행으로 맡는다."
 tfrkphn.675.d:0 "강릉선 보강 공사가 끝났습니다. 2017년 12월 22일 평창 동계올림픽을 앞두고 열린 선로이고, 이번 공사로 서울에서 강원으로 넘어가는 구간이 최고 등급이 됐습니다.\n\n춘천에는 물류 거점이 들어섰고 본선에서 춘천으로 들어가는 지선도 함께 놓였습니다. 강원으로 가는 물자는 이제 춘천을 거칩니다."
 tfrkphn.6751.d:0 "더불어민주당 정청래 대표가 6월 3일 지방선거를 두 달 앞두고 정권 심판을 내걸었습니다. 임기 마지막 해를 맞은 정부를 이번에 꺾으면 다음 대선까지 흐름을 가져올 수 있다는 계산입니다.\n\n그래도 그는 당 안의 들뜬 분위기부터 다잡았습니다. 3월 27일 세종시당 현장 최고위원회의에서 '쉬운 선거는 없다. 모든 선거는 다 어렵다'고 말했고, 후보들에게 '절실한 마음으로 선거에 임해야 한다'고 당부했습니다. 민주당은 지난해 8월 조승래 사무총장을 단장으로 지방선거기획단을 꾸려 공천 기준을 일찌감치 다듬어 왔습니다.\n\n시장과 도지사 [?TFRKPHN_l6_total|0]자리가 한꺼번에 걸렸습니다. 광주와 전남은 7월 1일 통합특별시로 합쳐지고, 서울에서는 오세훈 시장이 다섯 번째 당선에 도전합니다. 상황실 지도에서 자리를 골라 여당 후보를 도울 수 있습니다."
 tfrkphn.6751.d2:0 "더불어민주당 정청래 대표가 6월 3일 지방선거를 두 달 앞두고 후보들에게 몸을 낮추라고 주문했습니다. 3월 27일 세종시당 현장 최고위원회의에서 그는 '쉬운 선거는 없다. 모든 선거는 다 어렵다'고 말했고, '절실한 마음으로 선거에 임해야 한다'고 당부했습니다. 당 안에 선거를 쉽게 보는 분위기가 돌자 미리 단속에 나선 것입니다.\n\n민주당은 지난해 8월 조승래 사무총장을 단장으로 지방선거기획단을 꾸려 공천 기준을 일찌감치 다듬어 왔습니다. 정 대표는 이번 선거를 임기 마지막 해 정부의 성적표이자 다음 대선의 출발선으로 봅니다.\n\n시장과 도지사 [?TFRKPHN_l6_total|0]자리가 한꺼번에 걸렸습니다. 광주와 전남은 7월 1일 통합특별시로 합쳐지고, 서울에서는 오세훈 시장이 다섯 번째 당선에 도전합니다. 상황실 지도에서 자리를 골라 여당 후보를 도울 수 있습니다."
 tfrkphn.6753.d:0 "대통령의 지역 방문이 잦아지자 야당이 선거 개입이라고 공세를 폅니다. 야당은 대통령이 가는 곳마다 지역 사업 이야기가 따라붙는다며 선거관리위원회에 조사를 요구했습니다. 여당 안에서도 대통령이 앞에 서면 선거가 정권 심판 구도로 흐를 수 있다는 걱정이 나옵니다. 남은 기간 대통령의 일정을 어떻게 짤지 정해야 합니다."
 tfrkphn.6754.d:0 "투표가 끝나자 방송사 출구조사가 일제히 나옵니다. 시도마다 예측 결과가 지도 위에 차례로 칠해지고, 당사 상황실에서는 지역 이름이 불릴 때마다 박수와 탄식이 엇갈립니다. 경합으로 분류된 곳은 자정을 넘겨야 윤곽이 잡힐 것으로 보입니다. 대통령은 참모 몇 사람과 함께 개표를 지켜보고 있습니다."
 tfrkphn.6755.d:0 "개표 결과 여당이 시도지사 [?TFRKPHN_l6_total|0]자리 가운데 [?TFRKPHN_l6_wins|0]곳을 가져갔습니다. 임기 마지막 해에 치른 선거에서 이만큼 이긴 것은 드문 일입니다. 여당은 다음 대선을 앞두고 지방 조직을 든든히 다졌고, 야당 지도부는 책임론에 휩싸였습니다. 새 시장과 도지사들은 7월 1일 일을 시작합니다."
 tfrkphn.6756.d:0 "개표 결과 여당이 시도지사 [?TFRKPHN_l6_total|0]자리 가운데 [?TFRKPHN_l6_wins|0]곳에서 이겼다. 여당과 야당이 지도를 나눠 칠했다. 텃밭은 서로 지켰고 승부는 수도권과 충청에서 갈렸다.\n\n선거 막판에는 박근혜 전 대통령이 국민의힘 후보 지원에 나서 눈길을 끌었다. 5월 23일 대구 칠성시장에서 추경호 후보를 도운 그는 이틀 뒤 어머니 육영수 여사의 옥천 생가를 찾아 '약속을 지키는 믿음을 보여준다면 국민이 선택할 것'이라고 말했다. 27일에는 진주와 양산, 울산을 거쳐 부산 기장시장까지 돌았다. 영남과 충청의 보수 표가 다시 모였다는 분석과 수도권에서는 힘이 미치지 못했다는 분석이 함께 나온다.\n\n누구도 크게 웃지 못한 결과에 양쪽 모두 다음 대선을 셈하기 시작했다. 새 시장과 도지사들은 7월 1일 일을 시작한다."
 tfrkphn.6757.d:0 "개표 결과 여당은 시도지사 [?TFRKPHN_l6_total|0]자리 가운데 [?TFRKPHN_l6_wins|0]곳에서 이기는 데 그쳤습니다. 유권자들은 임기 마지막 해의 정부에 차가운 성적표를 건넸습니다. 야당은 정권 심판이 시작됐다고 선언했고, 여당 안에서는 다음 대선 후보를 두고 목소리가 커지고 있습니다. 새 시장과 도지사들은 7월 1일 일을 시작합니다."
 tfrkphn.676.d:0 "서울에서 평양까지 선로가 다시 이어졌습니다.\n\n1906년 4월에 용산에서 신의주까지 열렸던 경의선은 1950년 6월 25일 문산과 개성 사이에서 끊겼습니다. 2007년의 시험 열차와 그 뒤 얼마 동안 오간 화물열차를 빼면, 일흔 해 넘게 정기 열차가 다니지 못한 구간입니다.\n\n오늘 서울역을 떠난 첫 열차는 개성과 사리원을 지나 평양역에 닿았습니다. 개성에는 물류 거점이 들어섰습니다."
 tfrkphn.6761.d:0 "오세훈 전 시장이 경선에 나서며 비운 서울시장 자리를 채울 보궐선거가 4월 7일로 잡혔습니다. 시청은 지난 12월부터 권한대행이 지켜 왔고, 이인제 대통령 취임 한 달 만에 치르는 선거라 새 정부가 받는 첫 성적표가 됩니다.\n\n당 안에서는 두 이름이 나옵니다. 정몽준은 당이 불러낸 원로입니다. 1988년에 국회에 들어와 일곱 번 당선됐고 당 대표를 지냈습니다. 2014년 6월 4일 서울시장 선거에 나가 43.02를 얻고 졌는데, 그 뒤로 열세 해가 지났습니다. 이름을 모르는 유권자가 없지만, 시청에 들어간 뒤에 대통령의 말을 들을 사람은 아닙니다.\n\n다른 한 사람은 조은희입니다. 서울시 첫 여성 정무부시장을 지냈고, 2018년에는 서울 스물다섯 구 가운데 우리 당이 이긴 단 한 곳 서초에서 구청장에 다시 뽑혔습니다. 경선에서 진 오 전 시장 쪽 사람들이 그를 밀고 있습니다."
 tfrkphn.6762.d:0 "더불어민주당이 서울시장 보궐선거 후보로 정원오 전 성동구청장을 확정했습니다. 지난해 6월 지방선거에서 오세훈 시장에게 1퍼센트포인트도 안 되는 차이로 진 지 열 달 만의 재도전입니다.\n\n그는 지난해 2월 8일 문래동 북콘서트에서 '서울시장에 출마하려고 한다'며 처음 도전을 알렸고, '세금이 아깝지 않은 서울'을 내걸었습니다. 개표가 끝난 6월 4일 아침에는 '시민 여러분의 선택을 무겁고 겸허히 받들겠습니다. 제가 부족했습니다'라고 말했습니다.\n\n성동구청장을 세 번 하며 성수동을 바꾼 이력이 그의 가장 큰 무기입니다. 이번에는 현직 시장 없이 치르는 맞대결입니다."
 tfrkphn.6763.d:0 "국민의힘 조은희 후보가 7일 치러진 서울시장 보궐선거에서 정원오 후보를 꺾고 당선됐습니다. 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었습니다. 서울시 첫 여성 정무부시장을 지낸 그는 이번에 첫 여성 서울시장이 됐습니다.\n\n2018년 지방선거 뒤 서울 구청장 스물다섯 명 가운데 스물네 명이 다른 당이던 때, 그는 '더 낮아지고 넓어져서' 일하겠다고 했고 '엄마의 마음으로 구석구석을 따뜻하고 꼼꼼하게 살피겠다'고 말했습니다. 이번에는 시청에서 그 약속을 지켜야 합니다.\n\n대선 한 달 만에 치른 첫 선거에서 여당이 서울을 지켰습니다. 넉 달 동안 비어 있던 시장실에 새 주인이 들어가고, 새 시장은 2030년 6월까지 남은 임기를 맡습니다."
 tfrkphn.6764.d:0 "더불어민주당 정원오 후보가 7일 치러진 서울시장 보궐선거에서 당선됐습니다. 우리 당 [GetTFRKPHNSdCand] 후보는 졌고, 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었습니다. 지난해 6월 오세훈 시장에게 1퍼센트포인트도 안 되는 차이로 진 지 열 달 만에 같은 자리를 차지했습니다.\n\n정 당선인은 지난해 출마를 알리며 '세금이 아깝지 않은 서울'을 내걸었고, '행정은 시민들의 삶의 요구에서부터 시작해야 한다'고 말했습니다. 성동구청장 시절 성수동에서 해 온 방식을 서울 전체로 넓히겠다는 것입니다.\n\n오세훈 전 시장이 다섯 번 이긴 시청이 그가 떠난 지 넉 달 만에 야당으로 넘어갔습니다. 새 시장은 2030년 6월까지 남은 임기를 맡습니다. 정부는 이제 야당 시장과 마주 앉아 서울의 일을 풀어야 합니다."
 tfrkphn.6766.d:0 "2014년 5월 26일 밤, 여의도 MBC. 서울시장 선거를 아흐레 앞두고 박원순 시장과 정몽준 후보가 마주 앉았습니다. 일주일 전 토론에서 정 후보는 '서울에서 사람은 빠져나가고, 장사는 안 되고, 범죄는 늘어나는 등 서울이 가라앉고 있다'고 몰아붙였습니다. 이날 용산 개발을 두고 그가 '단군 이래 최대 사업인데, 이 정도의 우여곡절은 있을 수 있다'고 하자, 박 시장은 '이제 우리는 낡은 개발 시대와 결별해야 한다'고 받았습니다. 정 후보는 43.02를 얻고 졌습니다.\n\n열세 해 뒤 보궐선거 토론회에서 정원오 후보가 그해를 꺼냈습니다. 마지막으로 선거를 치른 것이 2014년인데 그 사이 서울이 어떻게 달라졌는지 아느냐는 질문이었습니다. 다음 날 기사 제목에는 답 대신 질문만 실렸습니다.\n\n이름값으로 얻은 표가 강북에서 조금씩 빠지고 있습니다."
 tfrkphn.6767.d:0 "국민의힘 정몽준 후보가 7일 치러진 서울시장 보궐선거에서 정원오 후보를 꺾고 당선됐습니다. 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었습니다. 2014년 박원순 시장에게 진 지 열세 해 만입니다.\n\n그해 6월 5일 새벽 그는 '시민들의 선택을 겸허하게 받아들이겠다'며 물러섰고, 선거 기간 받은 사랑을 '항상 감사하게 생각하고 마음속에 오랫동안 간직하겠다'고 말했습니다. 일곱 번 국회에 들어간 원로가 이번에는 시청으로 갑니다.\n\n대선 한 달 만에 치른 첫 선거에서 여당이 서울을 지켰습니다. 그러나 당 안에서는 새 시장이 대통령의 말을 그대로 따르지는 않으리라는 말이 나옵니다. 남은 임기는 2030년 6월까지입니다."
 tfrkphn.6768.d:0 "[TFRKPHN_allyfac_st.GetName]에 새 공장이 문을 열었습니다. 시장과 도지사가 정부와 손발을 맞춘 덕에 부지 확보와 인허가가 예상보다 빨리 끝났습니다. 준공식에는 지역 주민과 협력 업체 사람들이 함께했고, 단체장은 일자리가 늘어날 것이라고 했습니다."
 tfrkphn.677.d:0 "서울에서 원산까지 선로가 다시 이어졌습니다.\n\n1914년 8월에 열린 경원선은 1945년 8월 24일 삼팔선에서 연결 운행이 끊겼습니다. 남쪽 열차는 2012년부터 백마고지역에서 멈췄고, 그 너머는 여든 해 넘게 비어 있었습니다.\n\n오늘 그 구간에 열차가 들어갔습니다. 서울에서 떠난 열차는 이제 동해 바다가 보이는 원산에 닿습니다."
 tfrkphn.6770.d:0 "조은희 서울시장이 취임 뒤 처음으로 구청장 스물다섯 명을 시청으로 불렀습니다. 당이 다른 구청장도 모두 자리에 나왔습니다.\n\n서초구청장 시절 주변 구청장 대부분이 다른 당이던 때를 지나 온 그는 첫 회의에서 구마다 숙원 사업을 하나씩 들고 오라고 했습니다. 회의가 끝난 뒤 몇몇 야당 구청장은 이야기를 끝까지 들어 준 자리였다고 했습니다.\n\n서울시는 그 사업들에 들어갈 돈의 절반을 정부가 대 달라고 요청했습니다."
 tfrkphn.6771.d:0 "구청장 협의회에서 나온 숙원 사업들이 하나둘 끝나고 있습니다. 골목 주차장, 구립 어린이집, 오래된 하수관 같은 작은 공사들입니다.\n\n조은희 시장은 준공식마다 그 구의 구청장을 앞에 세웠습니다. 당이 다른 구청장도 마찬가지였습니다. 시청 안에서는 생색은 구청장이 내고 일은 시가 한다는 농담이 돌았습니다.\n\n여론조사에서 서울의 정부 지지도가 조금 올랐습니다."
 tfrkphn.6772.d:0 "정몽준 서울시장이 정부의 수도권 정책을 두고 다른 목소리를 냈습니다. 일곱 번 국회의원을 지내고 2002년에는 대선에도 나섰던 그는 서울시 몫을 분명히 하겠다며 물러서지 않았습니다.\n\n같은 당 시장과 대통령이 공개적으로 엇갈리자 여당 안에서는 부담스럽다는 말이 나옵니다. 야당은 여당이 서울시장 하나도 다루지 못한다고 꼬집었습니다.\n\n대통령은 시장을 따로 만나 풀지, 시장의 말로 두고 넘길지 정해야 합니다."
 tfrkphn.6773.d:0 "대통령과 정몽준 서울시장이 따로 만난 지 반년이 지났다. 두 사람은 그 뒤로 수도권 정책을 두고 공개적으로 다투지 않았다.\n\n시청 사람들은 시장이 국무회의 뒤 대통령과 짧게 따로 이야기하는 일이 잦아졌다고 전한다. 서울시가 바라던 사업 몇 개는 정부 계획에 들어갔고, 정부는 서울시의 협조를 얻어 수도권 법안을 국회로 넘겼다.\n\n현대에서 잘 먹고 잘살 수 있던 사람이 이제 늙은 몸으로 대통령과 직접 마주 앉았다. 한때 그가 꿈꾸던 사업들을 그는 지금 직접 이루고 있었다. 둘 다 서울시장 후보였고 둘 다 서울에서 자랐다. 이만큼 잘 맞는 짝도 드물었다.\n\n야당은 두 사람이 너무 가까워졌다고 공세를 바꿨다. 서울시 의회의 야당 의원들은 시장이 정부의 하청이 됐다고 비판했다. 시청은 그 비판에 정부 계획에 들어간 서울시 사업의 목록으로 답했다.\n\n몇 주 뒤 서울시의 내년 예산안에는 정부 계획과 겹치는 사업들이 표시돼 있었다. 시의회는 그 표를 두고 한 달 동안 다퉜다. 결국 예산안은 거의 그대로 통과됐다."
 tfrkphn.6773.d2:0 "정몽준 서울시장과 정부의 엇갈림이 반년째 이어지고 있다. 시장은 시정 설명회 때마다 정부 정책과 다른 서울시 안을 따로 내놓았다.\n\n여당 안에서는 다음 지방선거 공천을 두고 벌써 말이 갈린다. 야당은 같은 당끼리 싸우는 사이 서울 일이 멈췄다고 공세를 편다. 여당 지지율이 조금 내려갔다.\n\n시청과 대통령실 사이를 오가던 행정관은 수첩에 형광펜으로 칠한 칸을 세어 보았다. 반년 전보다 늘어 있었다. 숫자가 맞지 않는 칸, 서로 다른 표를 들고 나온 칸이었다.\n\n서울의 여당 국회의원들은 지역구 사무실에서 시장과 대통령이 왜 싸우느냐는 질문을 받았다. 한 의원은 그 질문에 답하다 지쳐 지역구 소식지에 따로 해명 글을 실었다. 그 글은 오히려 시장 쪽 지지자들의 항의를 불렀다.\n\n다음 국무회의 자리 배치표에서 서울시장의 자리는 대통령과 가장 먼 끝으로 옮겨졌다.\n\n시장은 그 소식을 듣고도 다음 회의에 빠지지 않았다. 그는 끝자리에 앉아 정해진 시간 안에 서울시의 안건만 읽고 나왔다. 기자들은 그 자리 사진만 찍어 갔다."
 tfrkphn.6774.d:0 "정원오 서울시장이 취임 뒤 첫 추가경정예산안을 내놓았습니다. 열두 해 동안 성동구청장을 지낸 그는 구에서 해 온 생활 행정을 서울 전체로 넓히겠다고 했습니다.\n\n남은 문제는 정부가 대야 할 몫입니다. 야당 시장의 공약 사업에 국비를 얼마나 줄지를 두고 여당 안에서도 생각이 엇갈립니다. 서울을 내준 마당에 시장 공을 키워 줄 이유가 없다는 쪽과, 국비를 끊으면 피해는 시민이 본다는 쪽입니다."
 tfrkphn.6775.d:0 "정원오 서울시장이 취임한 지 반년이 지났다. 정부가 국비를 깎지 않으면서 서울시 사업들은 예정대로 돌아가고 있다.\n\n시장은 시정 설명회에서 정부와 생각이 다른 대목은 분명히 말하면서도, 도와준 몫은 도와줬다고 말했다. 야당 안에서는 그를 다음 대선 후보로 보는 사람이 늘고 있다.\n\n국비로 이어진 사업 가운데에는 대통령이 시장이던 시절 시작한 것도 있었다. 시장은 그 사업의 준공식에서 앞 시장의 이름을 빼지 않고 읽었다. 그 장면은 그날 저녁 뉴스에 짧게 나왔다.\n\n여당 안에서는 국비를 끊지 않은 결정을 두고 생각이 갈렸다. 서울을 내준 마당에 시장 공을 키워 줬다는 말과, 그래도 시민은 정부가 서울을 버리지 않았다는 것을 알았다는 말이 함께 나왔다.\n\n시청 앞 광장에서는 그 주말 공사가 끝난 공공 화장실 개장식이 열렸다.\n\n개장식에는 시장과 구청장 몇 사람만 나왔다. 대통령실에서는 화환 하나가 왔다. 시청 직원들은 그 화환을 행사가 끝날 때까지 맨 앞에 두었다. 그 사진도 다음 날 아침 신문의 작은 칸에 실렸다."
 tfrkphn.6775.d2:0 "정원오 서울시장이 취임한 지 반년이 지났다. 국비가 줄면서 서울시 사업 몇 개가 멈췄다.\n\n시장은 시정 설명회마다 멈춘 공사 현장 사진을 띄웠다. 야당은 정부가 서울시민을 볼모로 잡았다고 공세를 폈고, 서울에서 여당 지지율이 내려갔다.\n\n멈춘 공사 현장 가운데 하나는 강북의 구립 어린이집이었다. 지붕만 올라간 채 반년째 비어 있었다. 아이를 맡길 곳을 기다리던 부모들은 그 앞에 모여 손팻말을 들었다. 손팻말에는 정부도 시장도 아닌 아이들의 이름이 적혀 있었다.\n\n여당 서울시당은 국비를 깎은 결정이 서울 선거를 어렵게 만든다고 대통령실에 보고했다. 대통령실 정무수석은 그 보고를 받고, 다음 추가경정예산에서 무엇을 되돌릴 수 있는지 기획재정부에 물었다.\n\n시청의 시정 설명회는 그 주에도 열렸다.\n\n설명회 자리의 맨 앞줄에는 그 어린이집을 기다리던 부모 몇 사람이 앉아 있었다. 시청의 담당 과장은 공사를 언제 다시 시작하느냐는 질문에 아직 모른다고만 답했다. 부모들은 그 답을 듣고 일어나 나갔다. 그들이 앉았던 의자는 설명회가 끝날 때까지 비어 있었다."
 tfrkphn.6776.d:0 "오세훈 대통령이 취임 뒤 처음 연 경제 장관 회의에서 개발을 정부의 첫째 과제로 못 박았습니다. 전쟁 특수가 끝나 가는 경제를 계속 돌리려면 공사 현장부터 열어야 한다는 것입니다.\n\n그는 서울시장 선거를 치르던 2026년 5월 11일 토론회에서 '공급, 닥치고 공급이 가장 근본적인 해법'이라고 말했습니다. 같은 달 주택 공약을 내놓으면서는 '31만 호를 압도적인 속도로 공급해 시민들의 주거 불안을 근본부터 해소하겠다'고 했습니다. 이제 그 말을 나라 전체에 옮기려 합니다.\n\n장관들 사이에서는 인허가를 한꺼번에 풀자는 쪽과 단계를 밟자는 쪽이 갈렸습니다."
 tfrkphn.6777.d:0 "전국의 착공 물량이 한 해 사이 눈에 띄게 늘었습니다. 서울 재개발 구역마다 타워크레인이 올라가고, 멈춰 있던 재건축 단지들도 철거를 시작했습니다.\n\n남은 걱정은 집값입니다. 개발 소식이 도는 동네마다 호가가 먼저 뛰었습니다. 금융 당국은 대출을 조여 열기를 식히자고 하고, 대통령실 참모들은 공급을 더 밀어 값을 누르자고 합니다. 대통령은 시장 시절부터 공급이 답이라고 말해 왔지만, 총선을 앞둔 여당은 집값 기사 하나에도 예민합니다."
 tfrkphn.6778.d:0 "재개발 구역에서 밀려나는 세입자 문제가 커지고 있습니다. 철거 일정에 맞춰 옮길 곳을 찾지 못한 사람들이 구청 앞에 모였습니다.\n\n오 대통령은 2022년 7월 1일 서울시장 취임사에서 약자와의 동행을 두고 '제가 서울시장으로서 존재하는 이유이자, 제 평생의 과업'이라고 말했습니다. 야당은 그 말을 그대로 되돌려주며 공세를 폅니다.\n\n여당 안에서는 동행 예산을 늘리자는 쪽과 속도를 늦추면 다 놓친다는 쪽이 맞섭니다."
 tfrkphn.6779.d:0 "총선이 끝났습니다. 대통령실은 남은 임기 동안 개발을 어디까지 밀지 다시 정해야 합니다.\n\n첫 삽을 뜬 현장들은 대부분 아직 공사 중입니다. 건설업계는 지금 멈추면 반쯤 지은 단지만 남는다고 했고, 경제 부처는 금리와 공사비가 부담이라고 맞섰습니다. 2030년 지방선거까지는 두 해가 남았습니다."
 tfrkphn.678.d:0 "동해안을 따라 북쪽 끝까지 가는 선로가 놓였습니다. 1937년에 열렸다가 분단으로 끊긴 동해북부선이 그 첫 구간입니다. 2007년 5월 17일 금강산에서 제진까지 시험 열차가 한 번 달린 뒤로는 멈춰 있던 길이었습니다.\n\n이제 열차는 강원 동해안에서 원산과 함흥, 청진을 차례로 지납니다. 남쪽 동해선과 맞닿아 있어서 부산에서 함경도까지 한 줄로 이어집니다."
 tfrkphn.6780.d:0 "지방 재개발 조합원들이 버스를 나눠 타고 서울로 올라왔습니다. 여의도에 모인 이들은 재개발 지원 대책을 마련하라는 손팻말을 들고 구호를 외쳤습니다. 같은 날 지방 시도지사들도 공동 성명을 냈습니다. 정부의 개발 예산과 인허가가 수도권에 몰린다는 내용입니다.\n\n성명에는 크레인은 서울에 서고 지방에는 빈집만 는다는 대목이 들어갔습니다. 여당 소속 단체장도 여럿 이름을 올렸습니다. 대통령실 안에서는 서울이 먼저 살아야 지방에도 돈이 돈다는 쪽과, 이대로 가면 총선에서 지방 의석을 잃는다는 쪽이 맞섭니다."
 tfrkphn.6781.d:0 "총선을 두 달 앞두고 언론이 정부의 개발 성적표를 매기기 시작했다.\n\n착공 숫자는 분명히 늘었다. 여당은 공사 현장과 새 일자리를 앞세워 선거를 치르겠다고 했다. 야당은 집값과 세입자 문제를 파고들고 있지만, 아직 판세를 뒤집을 만한 바람은 불지 않는다.\n\n신문들은 대부분 착공은 합격이고 집값은 아직 지켜봐야 한다고 평가했다. 한 경제 신문은 1면에 전국 공사 현장의 크레인 숫자를 실었다. 지난해보다 두 배 가까이 늘어 있었다.\n\n여당 상황실은 그 기사를 오려 후보들에게 돌렸다. 후보들은 유세 현장마다 그 숫자를 읽었다. 야당 후보들은 같은 신문의 다른 면에 실린 전셋값 그래프를 들고 다녔다.\n\n선거는 두 달 뒤다. 숫자 두 개 가운데 어느 쪽이 더 크게 들릴지는 아직 모른다.\n\n여당 상황실의 벽에는 지역마다 착공 현장의 이름이 붙었다. 상황실장은 그 목록이 표가 될지 아직 모르겠다고 했다. 그는 그날 밤 목록 옆에 전셋값 그래프도 함께 붙여 두라고 했다. 둘 다 유권자의 눈에 보이기 때문이다."
 tfrkphn.6781.d2:0 "총선을 두 달 앞두고 언론이 정부의 개발 성적표를 매기기 시작했다.\n\n착공 숫자는 늘었지만 재개발 구역의 반발과 오른 집값이 더 크게 보도된다. 야당은 개발 심판을 구호로 내걸었고, 여당 후보들 가운데에는 유세에서 대통령 이름을 덜 꺼내는 사람도 생겼다.\n\n신문들은 대부분 착공은 합격이고 사람을 다루는 일은 낙제라고 평가했다. 한 신문은 1면에 철거 현장 사진과 크레인 사진을 나란히 실었다. 사진 아래에는 같은 동네라는 짧은 설명이 붙었다.\n\n여당 상황실은 후보들에게 대통령의 이름 대신 지역 사업 이름을 앞세우라는 지침을 돌렸다. 몇몇 후보는 그 지침을 받기도 전에 이미 그렇게 하고 있었다.\n\n그 주 지역 방송에는 철거 현장 세입자들이 나왔다. 이십 년 치킨집을 했다는 남자가 말했다.\n\n\"새 아파트요? 우리 같은 사람은 못 들어가요. 그건 다 알고 시작한 거고.\"\n\n화면 아래로는 착공 숫자가 흘렀다. 대통령실은 세입자 대책을 먼저 낼지를 두고 그날 밤 다시 회의를 열었다."
 tfrkphn.6782.d:0 "평양에 이북자치정부가 문을 열었다. 옛 인민위원회 건물에 간판을 새로 달았고, 북쪽 출신 관료와 남쪽에서 파견된 공무원이 한 사무실에 책상을 나란히 놓았다. 북쪽의 행정은 몇 해 동안 자치정부가 맡고, 남쪽은 돈과 사람을 보낸다.\n\n정부가 이 길을 고른 데에는 까닭이 있었다. 일흔 해 넘게 다른 체제에서 산 사람들에게 남쪽의 법과 시장을 한꺼번에 들이밀면 버티지 못하는 사람이 먼저 쓰러진다는 판단이었다. 1990년 통일한 독일에서 동쪽의 공장들이 문을 닫고 실업자가 쏟아졌던 일도 회의 때마다 거론되었다."
 tfrkphn.6783.d:0 "평양의 하늘에 타워크레인이 스무 대 넘게 섰다. 대동강을 끼고 평양과 남포를 하나로 묶는 북쪽의 첫 메가시티 공사다. 남쪽 다섯 권역에서 쓰던 방식을 그대로 가져와 철도와 항만, 공단을 한 계획 안에 묶었다.\n\n남포항에는 큰 배가 댈 수 있는 새 부두가 들어서고, 평양과 남포 사이 들판에는 공단과 아파트 단지가 함께 올라간다. 공단에는 남쪽 기업들이 먼저 들어왔고, 그 공장에서 일할 사람들의 집이 바로 옆에 지어졌다. 남쪽 건설사들이 지은 첫 아파트에는 북쪽 노동자 가족들이 먼저 입주했다."
 tfrkphn.6784.d:0 "이북자치정부 의회가 마지막 회의에서 대한민국과 하나가 되는 안을 통과시켰다. 표결이 끝나자 의원들은 자리에서 일어나 한참 동안 박수를 쳤다. 며칠 뒤 국회도 같은 안을 가결했다.\n\n자치정부가 문을 연 지 몇 해 만이었다. 그동안 북쪽의 법은 하나씩 남쪽의 법으로 바뀌었고, 북쪽 주민들의 주민등록번호도 남쪽과 같은 체계로 옮겨졌다. 땅 문제가 마지막까지 남았다. 옛 국유지를 누구에게 돌려줄지를 두고 긴 다툼이 있었고, 정부는 지금 그 땅에 살고 있는 사람의 권리를 먼저 지키기로 했다."
 tfrkphn.6785.d:0 "임기를 마치는 대통령을 두고 언론이 성적표를 냈다. 신문마다 기준은 달랐지만 맨 위 칸은 모두 같았다. 통일은 누구도 깎아내리지 못한 성과로 첫 줄에 올랐다.\n\n그 아래 칸부터는 평가가 갈렸다. 개발만이 살 길이라며 시작한 다섯 해였고, 신문들은 그 말이 얼마나 지켜졌는지를 분야마다 하나씩 따졌다."
 tfrkphn.6786.d:0 "임기 마지막 날 저녁, 오세훈 전 대통령은 경호차를 돌려보내고 광화문역에서 지하철을 탔다. 퇴근길 객차는 붐볐다. 그를 알아본 승객 몇이 고개를 숙였고, 끝내 알아보지 못한 대학생은 휴대폰으로 평양 메가시티 준공 뉴스를 보고 있었다.\n\n객차 안 광고판에는 신의주행 열차 시간표와 평양 새 아파트 분양 광고가 나란히 붙어 있었다. 그는 손잡이를 잡은 채 그 광고를 오래 보았다. 다섯 해 전 첫 경제 장관 회의에서 개발만이 살 길이라고 말한 사람이 그였다.\n\n그는 여의나루역에서 내려 한강으로 걸어 나갔다. 2007년 7월 3일, 서울시장이던 그는 이 강을 시민에게 돌려주겠다며 한강 르네상스 계획을 내놓았다. 강변의 공원과 자전거 길, 밤마다 켜지는 다리 조명을 지나며 그는 걸음을 늦췄다."
 tfrkphn.6787.d:0 "대아대전이 태평양방위조약기구의 승리로 끝났다. 평양 외곽의 마지막 저항이 멎었다는 보고가 들어온 것은 새벽이었고, 오세훈 대통령은 아침 일찍 국무회의를 열었다. 장관들이 승전 기념식 일정부터 꺼내자 그는 그 이야기를 뒤로 미뤘다.\n\n그는 북쪽 동포를 이긴 쪽의 눈으로 대하지 말라는 지시부터 내렸다. 군정 기간은 짧게 끝내고, 북쪽 주민의 집과 재산에는 함부로 손대지 않으며, 굶는 사람이 없도록 쌀과 의약품부터 보내라는 내용이 뒤따랐다. 회의실 벽의 지도에는 아직 옛 휴전선이 붉은 줄로 남아 있었다."
 tfrkphn.6788.d:0 "서울역 전광판에 신의주라는 행선지가 처음 떴다. 아침 일곱 시 열차의 표는 예매를 연 지 몇 분 만에 다 팔렸고, 대합실에는 첫 열차를 보려는 사람들이 새벽부터 모여들었다.\n\n1906년에 용산과 신의주를 이었던 경의선은 1950년에 끊긴 뒤 일흔 해 넘게 한 줄로 이어지지 못했다. 2007년에 시험 열차가 군사분계선을 넘은 적이 있지만 정기 열차로 이어지지는 않았다. 평양에서 신의주까지 옛 평의선 구간에도 새 선로가 놓이면서, 서울에서 압록강까지 한 번에 가는 길이 열렸다."
 tfrkphn.6789.d:0 "방산 수출 특별법이 국회를 통과했다. 수출 금융과 정부 승인 절차를 한 법으로 묶어, 해외 계약을 따는 데 걸리던 시간을 절반으로 줄이는 것이 목표다. 지금까지는 계약 하나를 따려면 여러 부처의 승인을 차례로 받아야 했고, 그사이 경쟁국이 먼저 계약서를 내미는 일이 잦았다.\n\n법안을 두고 국회에서는 긴 토론이 있었다. 여당은 방산 수출이 조선과 반도체에 이은 다음 먹거리라고 했고, 야당은 무기 장사로 경제를 살리겠다는 것이냐고 따졌다. 표결 직전까지 수출 대상국을 어디까지 열지를 두고 조문이 몇 번이나 고쳐졌다."
 tfrkphn.6790.d:0 "정부가 전차와 자주포를 묶은 대규모 수출 계약을 맺었다. 서명식은 사들이는 나라의 수도에서 열렸고, 우리 대표단은 계약서와 함께 첫 인도 일정표를 내밀었다. 상대국 국방장관은 약속한 날짜에 물건이 온다는 것이 한국을 고른 가장 큰 이유라고 말했다.\n\n계약서에 서명한 날, 창원 공장의 생산 라인은 세 교대 근무로 바뀌었다. 밤에도 불이 꺼지지 않는 조립 공장 옆으로 협력 업체의 트럭이 줄을 이었고, 공장 근처 식당들은 새벽 영업을 시작했다."
 tfrkphn.6791.d:0 "국산 다목적 전투기의 첫 대량 수출 계약이 성사됐다. 동맹국 공군 대표단은 사천 공장의 조립 라인과 시험 비행장을 돌아본 뒤 계약서에 서명했다. 대표단장은 시험 비행을 마치고 내려온 조종사와 한참 이야기를 나눈 뒤 펜을 들었다.\n\n전투기는 전차보다 부품이 훨씬 많다. 엔진과 레이더, 전자 장비, 날개와 동체의 작은 부품까지 수천 가지가 들어가고, 그만큼 협력 업체도 많다. 정부는 이번 계약으로 부품 업체 수백 곳의 일감이 몇 해 치 늘어난다고 밝혔다.\n\n계약서에는 일부 부품을 사들이는 나라에서 만들도록 하는 조건도 붙었다. 정부는 핵심 기술은 국내에 남기고 조립과 정비는 현지에 맡기는 방식으로 협상을 마무리했다. 대표단은 정비 기술자들을 사천에 보내 몇 달 동안 교육을 받게 하기로 했다."
 tfrkphn.6792.d:0 "수출로 번 돈으로 지은 방산 클러스터가 문을 열었다. 전차와 전투기, 탄약을 만드는 공장과 시험장, 부품 업체들이 한 단지에 모였다. 부품이 공장 사이를 트럭 대신 단지 안 도로로 오가면서 조립에 걸리던 날이 크게 줄었다.\n\n단지에는 연구소와 직업학교도 함께 들어섰다. 공고를 졸업한 학생들이 직업학교에서 한 해 동안 용접과 정밀 가공을 배우고 바로 옆 공장으로 출근한다. 첫 입학생 가운데에는 북쪽 출신 청년도 여럿 있었다."
 tfrkphn.6793.d:0 "기업가치가 1조 원을 넘은 비상장 스타트업이 쉰 곳을 채웠습니다. 서울시가 2023년 성수동 창업허브 계획을 내놓으며 내건 숫자를 나라 전체가 먼저 넘었습니다.\n\n쉰 번째 회사는 지방 메가시티 권역에서 나왔습니다. 대통령은 축하 자리에서 창업자들에게 다음 쉰 개는 서울 밖에서 나오게 해 달라고 말했습니다. 성수동 창업허브의 밤은 여전히 밝았고, 그 옆 골목의 작은 사무실들에서는 다음 유니콘을 꿈꾸는 사람들이 밤을 새우고 있었습니다."
 tfrkphn.6794.d:0 "서울런 수강생이 50만 명을 넘었습니다. 2021년 8월 서울에서 시작한 해의 가입자는 9천 명 남짓이었고, 2026년 5월에야 4만 명을 넘었습니다. 전국으로 문을 연 뒤 몇 해 만에 열 배가 넘게 늘었습니다.\n\n서울에서 이미 성과가 있었습니다. 서울런으로 공부해 대학에 붙은 학생은 2023학년도 462명에서 2026학년도 914명으로 늘었습니다. 올해 합격자 명단에는 섬마을과 산골 학교 이름이 처음으로 여럿 올랐습니다.\n\n대통령은 축하 자리에서 학원에 갈 형편이 안 되는 아이도 같은 강의를 듣게 하는 것이 약자와의 동행이라고 말했습니다."
 tfrkphn.68.kp:0 "서울 종로구, 광화문 네거리의 한 오피스 빌딩이다. 오전 열 시에 빌딩 입구 옆에 붙어 있던 현판이 내려졌다. '주한국 타이베이대표부'. 30년 넘게 대사관이라는 이름을 쓰지 못한 채 그 자리를 지킨 이름이다.\n\n새 현판이 올라갔다. '주대한민국 중화민국 대사관'.\n\n현판을 덮은 천이 걷히는 순간 건물 앞에 모인 사람들 사이에서 박수가 터졌다. 태극기와 청천백일만지홍기가 나란히 게양대에 올랐고, 애국가에 이어 중화민국 국가가 연주되었다.\n\n맨 앞줄에는 서울에서 나고 자란 백발의 화교 노인이 서 있었다. 그는 손수건으로 눈가를 눌렀다.\n\n\"1992년 8월이었지요. 명동 대사관에서 청천백일기가 내려가는 걸 봤습니다. 교민들이 울면서 국가를 불렀어요. 하룻밤 사이에 우리는 친구 나라에서 없는 나라가 됐습니다. 대사관 건물도 그날로 남의 것이 됐고요.\"\n\"그런데 이번 전쟁 때 한국이 약속을 지켰어요. 끝까지 같이 가겠다고 했고, 정말로 끝까지 왔어요.\"\n\n신임 중화민국 대사가 단상에 올랐고, 그는 준비한 원고 대신 서툰 한국어로 짧게 말했다."
 tfrkphn.68.kp2:0 "\"30여 년 전 우리는 명동에서 문을 닫고 떠났습니다. 오늘 광화문에서 그 문을 다시 엽니다. 이번에는 닫지 않겠습니다.\"\n\n같은 시각, 걸어서 20분 거리의 명동에서는 중국대사관 앞 골목이 붉은 깃발로 가득했다. 수백 명의 중국인 유학생들이 대사관 정문을 향해 오성홍기를 흔들며 의용군행진곡을 불렀다. 항일전쟁 때 만들어진, 침략자에 맞서 일어서라는 노래가 이제는 우리를 향해 울려 퍼졌다.\n\n경찰 기동대가 골목 양쪽을 막아섰다. 지나가던 시민들이 걸음을 멈추고 휴대폰을 들었고 누군가 중얼거렸다.\n\n\"저 건물이 원래 대만 대사관이었다는 건 알까.\"\n\n노랫소리는 점점 커졌다. 앞줄의 학생 하나가 목이 터져라 소리쳤는데, 그 얼굴에는 분노와 함께 억울함 같은 것이 섞여 있었다. 그들에게 이것은 배신이다. 한국은 하나의 중국을 약속했고 그 약속을 깼다는 것이다. 우리는 그 말에 답하지 않기로 했다.\n\n광화문의 연주가 끝난 뒤에도 명동의 노래는 한 시간 넘게 이어졌고 경찰은 해가 질 때까지 골목을 지켰다."
 tfrkphn.681.d:0 "오픈AI의 이름을 단 연구소가 수도권에 문을 열었습니다. 샌프란시스코의 본사는 더 없습니다. 내전을 피해 건너온 연구자들이 이곳에서 일을 이어 갑니다.\n\n같은 이름을 쓰는 조직이 다른 나라에도 남아 있지만 서로 지시를 주고받지는 않습니다. 우리 대학과 연구소에서 뽑힌 사람들이 그 건물로 출근하기 시작했습니다."
 tfrkphn.6811.d:0 "애플의 설계 조직이 수도권에 자리를 잡았습니다. 쿠퍼티노에서 두 해를 버티다 떠나온 사람들입니다.\n\n이 회사의 전화기에 들어가는 화면과 반도체는 오래전부터 우리 회사들이 만들어 왔습니다. 설계하는 사람과 부품을 만드는 사람이 처음으로 같은 나라에서 일하게 됐습니다."
 tfrkphn.6812.d:0 "인텔의 이름을 단 연구소와 시험 생산 시설이 충청권에 문을 열었습니다. 미국의 공장을 두 해 동안 지키다 떠나온 공정 기술자들이 주축입니다.\n\n장비는 가져오지 못했습니다. 그들이 가져온 것은 공정을 다루는 손과 머리였고, 우리 반도체 회사들이 가장 먼저 이들을 찾아왔습니다."
 tfrkphn.6817.d:0 "연설이 끝나고 한 시간 만에 동맹국 대사 셋이 외교부에 설명을 요청했다. 그들은 한국이 정말로 핵무기를 만들 생각이냐고 물었다. 차관은 준비해 둔 답을 읽었다. 홍준표 정부가 만든 핵공유 협의체는 그대로 두고, 그 위에 한 걸음을 더 얹는 것뿐이라는 답이었다.\n\n여론조사에서는 연설에 찬성한다는 응답이 열에 여섯을 넘었다. 전쟁을 치른 나라의 사람들은 더 이상 핵이라는 말에 놀라지 않았다. 그래도 대학가 몇 곳에는 핵 없는 한반도를 외치는 대자보가 붙었고, 그 앞에서도 사람들이 걸음을 멈추고 읽었다.\n\n그날 밤 안보실 비서관은 그 기한이 돌아올 날에 찾아보기 쉽도록, 연설문 원본을 금고에 넣기 전에 기한이라는 단어 밑에 붉은 줄을 그어 두었다."
 tfrkphn.6818.d:0 "발표 다음 날 태평양방위조약기구 회원국들은 환영 성명을 냈다. 베이징 외교부 대변인은 정례 브리핑에서 한국이 스스로 약속을 깼다고 했다. 서울의 중국 대사관 앞에서는 작은 집회가 두 번 열렸고, 두 번 모두 경찰보다 기자가 많았다.\n\n방공포병 사령부는 그 주부터 새 포대를 둘 자리를 고르기 시작했다. 지도 위에 찍힌 후보지 가운데 셋은 십 년 전 사드 배치를 두고 주민들이 길을 막았던 곳과 멀지 않았다. 담당 영관 장교는 그 지명들 옆에 작은 물음표를 그려 넣었다."
 tfrkphn.6819.d:0 "서른두 살 박 병장은 버스 안에서 봉투 두 개를 받았다. 하나는 전역증이었고, 다른 하나는 청년취업사관학교와 중장년 일자리 안내문이었다. 그가 입대 전에 다니던 물류 회사는 전쟁 중에 문을 닫았다. 그는 안내문의 첫 장을 끝까지 읽은 다음 접어서 가슴 주머니에 넣었다.\n\n모두가 반긴 것은 아니었다. 여당 국방위원 몇은 국경 쪽 병력까지 줄이는 것은 이르다고 했고, 예비역 장성 모임은 단계적 해제를 요구하는 성명을 냈다. 군은 줄어든 병력으로 지킬 수 있는 선을 지도 위에 다시 그었다. 비워지는 초소마다 감시 장비가 대신 들어갔다.\n\n박 병장이 탄 버스는 저녁 무렵 터미널에 닿았다. 그는 내리자마자 집에 들르지도 않고 근처 편의점으로 가서 이력서 용지를 한 묶음 샀다."
 tfrkphn.682.d:0 "구글의 한국 조직이 충청권에 연구소와 데이터 센터를 열었습니다. 대전의 연구 단지와 세종의 정부 청사 사이에 자리를 잡았습니다.\n\n마운틴뷰에서 내려오던 지시는 끊긴 지 오래되었습니다. 서버와 사람, 그리고 우리 말로 쌓인 자료가 이 땅에 남았고 이제 우리 법에 따라 움직입니다. 새 업무 지구에는 협력사들도 따라 들어오고 있습니다."
 tfrkphn.6822.d:0 "그 말을 하던 때를 그는 떠올렸다. 그때는 보수가 무너질까 걱정했고, 지금은 이긴 보수가 사람들을 지치게 할까 걱정한다. 홍준표 정부의 다섯 해는 범죄와의 전쟁으로 시작해 양안전쟁으로 끝났다. 그 싸움을 이긴 것은 맞지만, 국민은 이제 큰소리에 질려 있었다. 해협 건너에서는 중국이 여전히 우리를 노려보고 있었고, 비밀 지원에 나섰다가 돌아오지 못한 사람들의 이름은 아직 공개조차 되지 않았다.\n\n대통령은 원고로 눈을 돌려 마지막 대목을 읽었다. 승리는 지키겠다고 했고, 이긴 사람과 진 사람, 지지한 사람과 반대한 사람 모두와 함께 가겠다고 했다. 연설문에는 따뜻한 보수라는 말이 세 번 나온다. 세 번째로 그 말을 했을 때 야당 의석에서도 박수가 나왔다.\n\n연단을 내려오며 그는 2011년 8월을 생각했다. 그때 그는 시장직을 걸고 혼자 싸웠고, 졌다. 이번에는 혼자 싸우지 않겠다고 그는 속으로 다짐했다."
 tfrkphn.6824.d:0 "배치 후보지가 평택의 오산 공군기지라는 보도가 나온 날, 기지 앞 철망에는 아침부터 사람들이 모였다. 미군은 떠나면서 이 기지를 비워 두고 갔다. 송탄에서 평생 양복점을 해 온 일흔 살 노인은 미군이 떠날 때 장사가 끝나는 줄만 알았지 이런 것이 들어올 줄은 몰랐다고 기자에게 말했다. 그 옆에서 젊은 부부는 북한은 핵을 가졌는데 우리만 맨손이냐는 피켓을 들었다.\n\n베이징은 그날 오후 우리 대사를 불렀다. 서해에서는 중국 해군의 훈련 공지가 사흘 앞당겨졌다. 국회 국방위원회에서 야당 의원이 이것이 평화냐고 묻자 국방부 장관은 우리가 스스로 설 때까지 버틸 시간을 들여오는 것이라고 답했다.\n\n서울로 돌아오는 비행기에서 과장은 합의문 마지막 장의 빈 서명란을 내려다보았다. 그 칸에는 대통령이 서명한다."
 tfrkphn.6825.d:0 "대통령은 말없이 전문을 넘기다가 두 번째 안에 서명했다. 이름도 회의 주기도 의장국의 순서도 바꾸지 않기로 했다. 그는 장관에게 동맹은 한 나라의 속도로 가지 않는다고 말했다고 한다.\n\n반발은 당 안에서 먼저 나왔다. 강경파 의원들은 의원총회에서 홍준표 정부보다 물러선 정부라는 말을 꺼냈고, 보수 유튜브 채널들은 그 장면을 며칠씩 틀었다. 야당은 드물게 정부의 판단을 반겼다. 민주당 대변인은 그해 들어 처음으로 정부를 칭찬하는 논평을 냈다.\n\n반년 뒤 도쿄에서 열린 회의에서 우리 대표단은 전과 같은 자리에 앉았다. 회의가 끝나자 우방의 대표 한 사람이 우리 대사에게 다가와 짧게 고맙다고 했다. 그 말은 어느 서류에도 기록되지 않았다."
 tfrkphn.6826.d:0 "회의장 밖에서 외신 기자들은 한국이 군대 대신 크레인을 보낸다고 썼다. 칭찬으로 읽는 사람도, 비꼬는 말로 읽는 사람도 있었다. 국방부 안에서는 동맹에서 목소리를 키우려면 군을 더 보내야 한다는 불만이 나왔다. 전쟁에서 피를 흘린 나라가 끝나고 나서 공사판을 맡는 꼴이라는 말이었다.\n\n그 주에 거제의 조선소로 수주 소식이 들어왔다. 전쟁 때 군함을 고치느라 석 달 동안 집에 들어가지 못했던 용접공은, 이번에는 남의 나라 항구를 고칠 배를 만든다는 말을 듣고 웃었다. 어느 쪽이든 일감은 일감이라고 했다.\n\n귀국하는 전용기 안에서 대통령은 기자들에게 다음 전쟁을 막는 것은 다시 지은 도시라고 말했다. 그 도시는 누가 지키느냐는 물음이 나오자 그는 대답 대신 창밖을 가리켰다. 구름 아래로 남해의 조선소들이 지나가고 있었다."
 tfrkphn.6827.d:0 "첫 집은 경기도의 한 마을에 지은 작은 단독 주택이었다. 준공식 날 김 하사는 맨 앞줄 의자에 앉았고, 양옆에는 지난 전쟁의 노병 두 사람이 앉았다. 사진을 찍는 동안 노병 한 사람이 다리는 어디서 그랬느냐고 물었다. 김 하사가 섬 이름을 대지 못하자 노인은 고개를 끄덕였다. 자기도 평생 말하지 못한 곳이 있었다고 했다.\n\n열쇠를 받아 든 김 하사의 어깨를 노병이 두드렸다. 박수가 그친 뒤에도 그는 집 안으로 들어가지 않고 현관 앞 계단에 앉아 있었다. 그 집에는 문턱이 없었다. 휠체어가 드나들 수 있게 일부러 그렇게 지었다고 시공사 직원이 일러 주었다.\n\n보훈처 대기 명단에는 아직 사천 명이 넘는 이름이 남아 있다."
 tfrkphn.6828.d:0 "첫 주에 가장 먼저 찾아온 손님은 홍콩에서 옮겨 온 반도체 장비 회사였다. 그 회사의 부사장은 상담을 마치고 나서, 도쿄에서는 같은 답을 듣는 데 석 달이 걸렸다고 말했다. 상담 기록은 그날 저녁 투자청장의 책상에 올라갔다.\n\n부처들은 반기지 않았다. 권한을 내주는 일이기 때문이다. 한 부처의 국장은 회의에서 창구를 하나로 모으면 잘못도 하나로 모인다고 말했다. 투자청은 그 말을 받아, 창구에서 내준 답이 틀리면 투자청이 책임진다는 문장을 운영 규정 첫 줄에 적었다."
 tfrkphn.683.d:0 "테슬라의 이름을 단 조립 공장이 호남권에 섰습니다. 미국의 공장들이 멈춘 뒤 우리나라로 건너온 기술자들이 생산 설비를 다시 짰습니다. 광주의 자동차 부품 회사들이 첫 납품 계약을 맺었습니다.\n\n호남권 메가시티에 들어선 에너지 농장의 전기가 이 공장으로 갑니다. 광주와 전남에서는 오랜만에 큰 규모의 생산직 채용 공고가 났습니다."
 tfrkphn.6830.d:0 "노인들에게는 화면이 낯설었다. 동사무소마다 가상 창구 사용법을 알려 주는 도우미가 배치됐고, 그 자리의 상당수는 전쟁에서 돌아온 청년들이 맡았다. 할머니가 화면 속 창구 직원에게 고개를 숙여 인사하는 영상이 그 주에 가장 많이 퍼졌다.\n\n야당은 사람 대신 화면을 앉힌다고 비판했다. 행정안전부는 가상 창구를 열면서 실제 창구를 하나도 닫지 않았다는 표를 국회에 냈다. 두 창구를 함께 두는 데 드는 돈은 다음 해 예산의 숙제로 남았다."
 tfrkphn.684.d:0 "엔비디아의 설계 조직이 대구경북에 센터를 열었습니다. 구미의 전자 산업 단지와 대구의 대학들이 가까이 있다는 점이 이유로 꼽혔습니다.\n\n샌타클래라의 본사는 문을 닫았고 설계 자산은 설계자들이 흩어진 나라마다 나뉘어 있습니다. 우리 몫으로 남은 설계는 우리 반도체 회사들의 공장에서 생산하기로 했습니다."
 tfrkphn.685.d:0 "보잉의 이름을 단 조립과 정비 공장이 경남에 문을 열었습니다. 사천에 모여 있는 우리 항공기 회사들이 부품을 대기로 했습니다.\n\n시애틀의 조립 공장은 멈춘 지 오래되었습니다. 세계의 항공사들은 가까운 나라에 남은 거점에 정비를 맡기고 있고, 동아시아에서는 이 공장이 그 일을 합니다. 전쟁 동안 정비를 미뤄 둔 우리 군용기들도 이곳에서 손을 보게 됩니다."
 tfrkphn.686.d:0 "골드만삭스 서울 지점이 독립 법인이 되어 수도권의 새 업무 지구로 옮겼습니다. 뉴욕 본사와의 결산은 내전이 터진 뒤 한 번도 이루어지지 못했습니다.\n\n다른 나라의 지점들도 같은 길을 가고 있습니다. 한 회사였던 조직이 나라마다 하나씩의 금융사로 남은 셈입니다. 원화로 거래되는 채권과 주식의 양이 눈에 띄게 늘었습니다."
 tfrkphn.687.d:0 "망명 기업에 주는 혜택을 두고 국내 기업들의 불만이 터져 나왔습니다. 땅값을 깎아 주고 세금을 미뤄 주는 조건이 우리 회사들에는 없다는 것입니다.\n\n경제 단체들은 같은 날 성명을 냈습니다. 외국 회사를 부르는 일에는 반대하지 않지만, 같은 권역에 먼저 들어와 있던 회사들이 더 비싼 값을 치르고 있다는 내용이었습니다. 국회에서도 여야를 가리지 않고 질의가 이어지고 있습니다."
 tfrkphn.688.d:0 "미대륙을 떠난 회사들이 우리 땅에 자리를 잡은 지 두 해가 지났습니다. 그 대륙으로 돌아가겠다는 말은 이제 어느 이사회에서도 나오지 않습니다.\n\n한때 한 회사였던 조직들은 나라마다 따로 살아남았습니다. 같은 이름과 같은 상표를 쓰지만 주인도, 따르는 법도 다릅니다. 본사가 남긴 특허와 설계는 그것이 놓여 있던 나라의 것이 됐습니다. 우리 몫으로 남은 조직들이 다른 나라에 남은 형제 회사들과 어떻게 지낼지를 정해야 합니다."
 tfrkphn.6882.d:0 "오세훈 대통령은 출범식에서 서울시장 시절 내건 약자와의 동행을 북쪽에서 먼저 하겠다고 말했다. 소득이 적은 집에 모자란 만큼을 채워 주는 안심소득 시범 사업이 평양과 함흥에서 먼저 시작되고, 서울 학생들이 듣던 서울런 강의도 북쪽 학교에 열린다.\n\n모두가 반긴 것은 아니다. 남쪽에서는 북쪽에 돈을 너무 많이 쓴다는 불만이 나왔고, 북쪽에서는 남쪽 공무원들이 윗사람 행세를 한다는 말이 돌았다. 자치정부는 매달 첫째 주에 남북 공무원이 함께 주민 앞에서 업무를 설명하는 자리를 열었다.\n\n자치정부 청사 앞에는 아침마다 줄이 길게 늘어섰다. 배급표 대신 주민등록증을 받으려는 사람들이었다. 증을 받아 든 한 노인은 사진 속 자기 얼굴을 한참 들여다보다가, 이제 어디든 가도 되느냐고 창구 직원에게 물었다."
 tfrkphn.6883.d:0 "현장의 모습은 남쪽과 조금 달랐다. 공사장마다 남쪽 기술자 한 명에 북쪽 일꾼 열 명이 붙어 일을 배웠고, 그렇게 기술을 익힌 사람들이 다음 현장의 반장이 되었다. 점심시간이면 남쪽 말과 북쪽 말이 섞인 농담이 오갔고, 같은 공구를 서로 다른 이름으로 부르다 웃음이 터지는 일도 잦았다.\n\n평양 시내의 오래된 아파트들은 하나씩 안전 점검을 받기 시작했다. 무너질 위험이 큰 건물에 사는 사람들은 새 단지로 먼저 옮겨 갔다. 서울에서 재개발 반발을 겪어 본 정부는 이번에는 옮겨 갈 집을 먼저 지은 다음에 헌 집을 헐었다.\n\n첫 겨울이 오자 정부는 공사장 옆에 임시 학교와 진료소를 세웠다. 북쪽 일꾼들의 아이들은 낮에는 그 학교에서 남쪽 교과서로 공부했고, 저녁이면 아버지를 기다리며 크레인에 켜지는 불빛을 세었다."
 tfrkphn.6884.d:0 "선언은 광화문에서 했다. 오세훈 대통령은 광장을 가득 메운 사람들 앞에서 완전한 통일을 선언했고, 같은 시각 평양의 광장에서도 큰 화면으로 그 장면이 중계되었다. 연설은 짧았다. 그는 오늘부터 이 나라에 남쪽과 북쪽은 없고 동네와 동네만 있다고 말하고 단상을 내려왔다.\n\n자치정부 청사의 간판은 내려지고 평양에는 특별시청이 들어선다. 광화문에 모인 사람들 가운데에는 이산가족 명단을 손에 든 노인들이 많았다. 그들 가운데 몇은 끝내 이름을 찾지 못한 채 명단을 접어 주머니에 넣었다.\n\n그날 밤 공개된 다음 날 국무회의 안건 맨 위에는 북쪽 공공 병원을 늘리는 예산이 올라 있었다."
 tfrkphn.6885.d:0 "[GetTFRKPHNRcHouse] [GetTFRKPHNRcMega]\n\n[GetTFRKPHNRcGe] [GetTFRKPHNRcLe][GetTFRKPHNRcKju][GetTFRKPHNRcNuke]\n\n성적표를 두고 여당 안에서는 다음 대선을 걱정하는 소리가 나왔고, 야당은 개발의 그늘을 따지는 토론회를 열었다. 평양의 신문들도 처음으로 서울의 신문들과 같은 날 같은 성적표를 실었다.\n\n성적표를 받아 본 대통령은 신문을 그대로 대통령실 게시판에 붙이라고 했다. 지킨 것과 지키지 못한 것을 같은 크기의 글씨로 적겠다던 약속을 그는 마지막 날까지 지켰다."
 tfrkphn.6886.d:0 "그 강변에서 홍준표 전 대통령이 기다리고 있었다. 서울시장 자리를 두 번 내려놓은 사람이 이번에는 끝까지 왔다고 홍준표가 말했고, 오세훈은 웃기만 했다. 두 사람은 수행원을 멀찍이 물리고 한동안 말없이 강을 따라 걸었다.\n\n강 건너 철교 위로 신의주행 막차가 지나갔다. 서울에서 떠난 열차는 이제 평양을 지나 압록강까지 닿고, 대동강에도 밤마다 크레인 불빛이 켜진다.\n\n플레이어여, 당신은 서울시장 자리를 내려놓고 대선에 나섰던 사람과 함께 이 길을 걸었다. 개발과 동행 사이에서 고르고, 전쟁을 이기고, 둘이던 나라를 하나로 묶었다. 수고하셨다. 당신이 맡은 길은 여기까지다."
 tfrkphn.6886.d2:0 "강변은 조용했다. 신문들의 성적표는 박했고, 퇴임 인사를 하러 온 여당 의원도 많지 않았다. 그는 혼자서 한동안 강을 따라 걸었다. 2011년에는 임기를 채우지 못하고 떠났지만, 이번에는 마지막 날까지 자리를 지켰다.\n\n강 건너 철교 위로 신의주행 막차가 지나갔다. 서울에서 떠난 열차는 이제 평양을 지나 압록강까지 닿고, 대동강에도 밤마다 크레인 불빛이 켜진다.\n\n플레이어여, 당신은 서울시장 자리를 내려놓고 대선에 나섰던 사람과 함께 이 길을 걸었다. 성적표에는 아쉬운 칸이 많이 남았지만, 둘이던 나라는 하나가 되었다. 수고하셨다. 당신이 맡은 길은 여기까지다."
 tfrkphn.6887.d:0 "그는 서울시장 시절부터 약자와의 동행을 시정의 첫머리에 두었다. 2022년 7월 1일 취임사에서는 그 일을 '제가 서울시장으로서 존재하는 이유이자, 제 평생의 과업'이라고 했고, 안심소득과 서울런이 그 말에서 나왔다. 전쟁이 끝난 지금 이 나라에서 가장 약한 사람들은 옛 휴전선 너머에 있다.\n\n여당 안에서는 북쪽을 곧바로 흡수해 남쪽 법을 그대로 적용하자는 목소리도 컸다. 통일 비용을 걱정하는 사람들은 하루라도 빨리 정리해야 돈이 덜 든다고 했다. 대통령은 그 말을 끝까지 들은 뒤, 서두르다 넘어지는 사람은 북쪽에서 먼저 나온다며 시간을 들여 하나가 되는 길을 고르겠다고 말했다.\n\n그날 오후 대통령은 국방부에 들러 전사자 명단을 받아 보았다. 명단에는 우리 장병과 함께 싸운 동맹군의 이름도 있었다. 그는 마지막 장까지 넘긴 뒤, 북쪽에서 죽은 사람들의 이름도 같은 방식으로 정리해 두라고 지시했다."
 tfrkphn.6888.d:0 "첫 열차는 개성과 사리원, 평양을 지나 압록강 앞에서 멈췄다. 객실에는 고향을 찾아가는 실향민 가족과 북쪽 공사 현장으로 가는 기술자들이 함께 탔다. 창밖으로 사리원역 간판이 지나가자 한 실향민 할머니가 그 자리에서 울음을 터뜨렸고, 옆자리의 젊은 기술자가 휴지를 꺼내며 물었다. \"할머니, 여기가 고향이세요?\"\n\n신의주역 광장에는 남쪽에서 온 승객과 마중 나온 북쪽 사람들이 뒤섞였다. 역 앞 노점에서는 남쪽 돈과 북쪽 돈을 함께 받았고, 해가 지자 압록강 건너편 단둥의 불빛이 강물에 비쳤다.\n\n돌아오는 열차에는 북쪽 학생들이 많이 탔다. 서울의 대학에 붙은 신입생들과, 수학여행으로 처음 서울을 보러 가는 중학생들이었다. 서울역에 내린 아이들은 광장에 서자마자 떠들기 시작했다. \"야, 저게 다 아파트야?\""
 tfrkphn.6889.d:0 "오세훈 대통령은 법안 공포식에서 방위산업도 개발이라고 말했다. 공장을 돌려 일자리를 만들고, 수출로 번 돈으로 우리 군의 장비를 싸게 만들겠다는 계산이다. 해외에서 계약을 따 오면 생산 라인이 길어지고, 라인이 길어지면 한 대를 만드는 값이 내려간다는 설명이 뒤따랐다.\n\n법에는 수출로 남긴 이익의 일부를 국내 생산 설비에 다시 넣도록 하는 조항도 들어갔다. 기업이 해외 계약으로 번 돈이 우리 군의 공장으로 돌아오게 하려는 장치다.\n\n방산 기업들이 몰린 경남과 대전에서는 환영 현수막이 걸렸다. 창원의 한 협력 업체 사장은 그날 저녁 직원들에게 다음 달부터 일감이 늘어날 테니 사람을 더 뽑겠다고 말했다."
 tfrkphn.6890.d:0 "한국 전차의 대형 수출은 처음이 아니다. 2022년 8월 26일 폴란드와 맺은 1차 이행계약에는 K2 전차 180대와 K9 자주포 48문, 57억 6천만 달러가 담겼다. 그때 쌓은 납기 기록이 이번 계약의 밑천이 되었다.\n\n계약 소식이 전해지자 다른 나라들의 문의도 잇따랐다. 방위사업청에는 시험 운용을 해 보고 싶다는 공문이 몇 주 사이 여러 건 들어왔고, 수출 담당 부서는 주말에도 불을 켜 두었다. 업계에서는 다음 계약이 어디가 될지를 두고 내기를 거는 사람까지 생겼다.\n\n이번 계약으로 생산 라인이 몇 해 치 이어지면서 우리 군이 사는 전차의 값도 내려간다. 국방부는 같은 라인에서 우리 군 물량을 함께 뽑으면 한 대 값이 눈에 띄게 줄어든다고 보고했다."
 tfrkphn.6891.d:0 "사천과 진주의 부품 공장들은 사람을 새로 뽑기 시작했다. 지역 대학의 항공 관련 학과에는 지원자가 몰렸고, 공장 앞 원룸에는 빈방이 사라졌다.\n\n첫 수출 기체가 시험 비행을 마치고 활주로에 내려오던 날, 공장 직원들은 격납고 앞에 줄지어 서서 박수를 쳤다. 기체 꼬리에는 사들인 나라의 국기가 칠해져 있었다.\n\n생산 대수가 늘면 한 대를 만드는 값이 내려가고, 우리 공군이 사는 전투기도 그만큼 싸진다. 공군은 남는 예산으로 조종사 훈련 시간을 늘리겠다고 했다."
 tfrkphn.6892.d:0 "준공식에서 오세훈 대통령은 수출 물량과 우리 군 물량을 같은 라인에서 만들겠다고 말했다. 평시에는 수출로 공장을 돌리고, 위기가 오면 그 라인을 그대로 우리 군에 돌린다는 계획이다. 국방부는 전시에 생산을 늘리는 데 걸리는 시간이 몇 달에서 몇 주로 줄어든다고 보고했다.\n\n클러스터가 들어선 동네도 달라졌다. 공장 직원과 가족들이 살 아파트와 학교가 함께 지어졌고, 비어 가던 시골 읍내에 다시 아이들 목소리가 들렸다. 지방에서도 개발이 된다는 것을 보여 주겠다는 대통령의 말이 이 단지에서는 지켜졌다.\n\n단지 입구에는 첫 수출 전차가 기념물로 세워졌다. 준공식이 끝나고 손님들이 돌아간 뒤에도 조립 공장의 불은 꺼지지 않았다."
 tfrkphn.69.kp:0 "인과응보는 인할 인, 열매 과, 응할 응, 갚을 보를 쓴다. 원인이 있으면 결과가 있고, 행한 일에는 반드시 그에 맞는 갚음이 돌아온다는 말이다.\n\n본래 불교의 가르침에서 나왔다. 콩을 심은 자리에서 콩이 나고 팥을 심은 자리에서 팥이 난다. 착한 씨앗은 좋은 열매를 맺고 악한 씨앗은 나쁜 열매를 맺는다 하여 선인선과, 악인악과라고도 한다. 열매가 언제 맺힐지는 알 수 없어도 맺히지 않는 씨앗은 없고, 서양에도 뿌린 대로 거둔다는 같은 말이 있다."
 tfrkphn.69.kp2:0 "앞서 갚을 보에는 두 가지 뜻이 있다고 했다. 은혜를 갚는 것이 결초보은이고, 잘못에 값을 치르게 하는 것이 인과응보다.\n\n전쟁은 저절로 일어나지 않고, 누군가 먼저 바다를 건넜고 누군가 먼저 포를 쏘았다. 그 포탄에 대만의 섬들이 불탔고 우리 젊은이들이 바다에 묻혔다. 전쟁이 끝났다고 그 씨앗이 사라지지는 않는다.\n\n대가를 묻지 않으면 같은 씨앗은 다시 뿌려진다. 다음 전쟁을 막으려면 이번 전쟁의 값을 받아야 한다는 것이 우리의 판단이다.\n\n그래서 우리는 묻기로 했다. 전쟁을 일으킨 쪽이 그 열매를 거두게 할 것이다. 정부는 배상 청구 목록을 만들기 시작했다."
 tfrkphn.6900.d:0 "서울런은 서울시가 2021년 8월에 시작한 교육 사업이다. 학원에 다니기 어려운 형편의 학생들에게 이름난 강사들의 온라인 강의를 무료로 열어 주는 것이 처음 목표였다.\n\n강의만 주는 데서 그치지 않았다. 대학생 멘토가 공부 계획을 함께 짜 주고, 자격증과 어학, 독서 강좌까지 차례로 늘었다. 2026년 5월에는 가입자가 4만 명을 넘었고, 서울런으로 공부해 대학에 붙은 학생은 2023학년도 462명에서 2026학년도 914명으로 늘었다.\n\n이 나라에서 서울런은 이제 서울만의 사업이 아니다. 탭 아래의 결정으로 수강생을 늘리면 연구가 빨라지고 빈곤이 줄어든다."
 tfrkphn.691.d:0 "마이크로소프트의 한국 조직이 호남권에 데이터 센터와 개발 조직을 열었습니다. 호남권 메가시티의 에너지 농장에서 나오는 전기를 통째로 사들이는 계약이 함께 맺어졌습니다.\n\n레드먼드가 멈춘 뒤로 우리 관공서와 회사의 자료는 주인 없는 서버에 얹혀 있었습니다. 이제 그 서버를 우리 땅의 회사가 책임집니다."
 tfrkphn.692.d:0 "화이자의 이름을 단 연구소와 생산 시설이 충청권에 문을 열었습니다. 오송의 바이오 단지 안, 보건 당국의 청사에서 멀지 않은 자리입니다.\n\n뉴욕의 본사가 사라진 뒤 약의 허가와 제조 기술은 공장이 있는 나라마다 따로 남았습니다. 우리 몫으로 남은 품목은 이곳에서 만듭니다. 약학 대학의 연구실에는 공동 연구 제안이 들어오고 있습니다."
 tfrkphn.6929.d:0 "지금 서울런 수강생은 §Y[?TFRKPHN_sl|0]만 명§!이다. 목표는 50만 명이다.\n\nSLU 졸업식은 지금까지 §Y[?TFRKPHN_sl_claim|0]§!번 열었다. 다음 졸업식은 수강생이 §Y[?TFRKPHN_sl_next|0]만 명§!을 넘으면 열 수 있다.\n\n서울런 덕분에 연구 속도가 §G[?TFRKPHN_sl_rspct|1]퍼센트§! 빨라졌다. 빈곤 개선과 사회 발전도 달마다 조금씩 나아지고 있다."
 tfrkphn.693.d:0 "록히드마틴의 이름을 단 생산과 정비 시설이 대구경북에 문을 열었습니다. 구미와 그 둘레에 모여 있는 우리 방산 업체들이 협력사로 들어갔습니다.\n\n본사의 생산 라인이 멈춘 뒤 이 회사의 기체를 쓰는 나라들은 부품을 스스로 만들어야 했습니다. 우리도 그 가운데 하나였고, 이제 그 부품의 상당수가 우리 땅에서 나옵니다."
 tfrkphn.694.d:0 "아마존의 동아시아 물류 조직이 부울경에 본부를 열었습니다. 부산의 항만 배후 단지에 창고가 들어섰고, 그 옆으로 배송을 맡을 회사들이 따라 들어오고 있습니다.\n\n시애틀에서 짜던 물류망은 대륙마다 잘려 나갔고, 잘린 조각은 그것이 놓인 나라가 이어받았습니다. 우리 중소 업체들의 물건이 이 창고를 거쳐 나라 밖으로 나가기 시작했습니다."
 tfrkphn.695.d:0 "샘 알트만이 서울에 정착했습니다. 수도권에 문을 연 연구소의 책임자 자리를 맡았습니다.\n\n그는 1985년 시카고에서 태어나 세인트루이스 교외에서 자랐습니다. 스탠퍼드에서 컴퓨터과학을 공부하다 두 해 만에 그만두고 2005년에 루프트라는 회사를 세웠습니다. 2014년부터 2019년까지 창업 지원 기관 와이콤비네이터의 사장을 지냈고, 2015년 오픈AI를 함께 세운 뒤 2019년에 최고경영자가 됐습니다.\n\n연구소 쪽은 그가 우리나라에 장기 체류 자격을 신청했다고 밝혔습니다. 돌아갈 날짜는 정해 두지 않았습니다."
 tfrkphn.696.d:0 "젠슨 황이 대구경북의 설계 센터에 합류했습니다. 샌타클래라의 본사가 문을 닫은 뒤의 일입니다.\n\n그는 1963년 대만 타이난에서 태어나 1972년에 미국으로 건너갔습니다. 오리건 주립대에서 전기공학을 공부했고 1992년 스탠퍼드에서 석사 학위를 받았습니다. AMD와 LSI 로직에서 일한 뒤 1993년에 크리스 말라초프스키, 커티스 프리엠과 함께 엔비디아를 세웠고 그때부터 줄곧 최고경영자였습니다.\n\n그가 맡은 일은 세 나라를 잇는 것입니다. 태평양 방위 조약기구가 회원국 사이의 기술 이전과 인력 이동을 보장하면서 길이 열렸습니다. 설계는 한국에서 하고, 생산은 전쟁을 버텨 낸 대만의 공장이, 소재와 장비는 일본이 맡습니다. 그는 세 곳 가운데 하나라도 빠지면 칩이 나오지 않는다고 말했습니다."
 tfrkphn.6970.d:0 "국방부 앞에 검은 옷을 입은 사람들이 모였습니다. 맨 앞의 어머니가 든 팻말에는 우리 아들 살려내라는 글씨가 삐뚤게 적혀 있었습니다. 훈련 중 사고로 숨졌다는 통지서를 받은 장병들의 유족이었습니다.\n\n그들의 아들들은 대만해협에서 숨졌습니다. 사실 사람들은 오래전부터 알음알음 알고 있었습니다. 부산항에서 밤마다 떠나는 화물선과 국적 표시를 지운 수송기, 휴가 나와서도 어디에 다녀왔는지 말하지 못하는 장병들의 이야기가 술자리마다 돌았습니다. 그러다 외신이 대만 남부 해안에 떨어진 우리 수송기 잔해 사진을 실었고, 모두가 짐작만 하던 일이 뉴스 첫머리에 올랐습니다. 서류 위로는 중립국인 나라가 실제로는 군대를 보냈다는 사실이 처음으로 큰 논란이 되었습니다.\n\n여론은 둘로 갈렸습니다. 대만을 지킨 것은 잘한 일이라는 사람도 많았지만, 다 알던 일을 왜 끝까지 숨겼느냐는 물음에는 누구도 답하지 못했습니다. 여당 지지율이 조금 내려갔습니다."
 tfrkphn.6971.d:0 "유족들이 국가를 상대로 손해배상 소송을 내려다 벽에 부딪혔습니다. 헌법 제29조 제2항은 군인과 경찰 등이 전투나 훈련 같은 직무 중에 입은 손해에 대해서는 법률이 정한 보상 말고는 국가에 배상을 청구할 수 없게 막고 있습니다. 1967년 국가배상법을 고치면서 처음 들어온 이 규정을 사람들은 이중배상 금지라고 부릅니다.\n\n유족들은 거짓 통지서로 진실을 가린 나라가 보상금 몇 푼으로 끝내려 한다며 이 조항을 없애라고 요구합니다. 헌법에 적힌 조항이라 법률만 고쳐서는 없앨 수 없습니다. 개헌안에 넣자는 쪽과, 특별법으로 보상을 크게 늘리면 된다는 쪽, 나라 재정과 군의 형평을 생각하면 그대로 둬야 한다는 쪽이 맞섰습니다."
 tfrkphn.6972.d:0 "정쟁의 줄과 비밀 지원의 줄, 중국의 줄이 모두 우리 쪽으로 넘어왔다. 오세훈 대통령은 국무회의를 마치고 안건 목록의 맨 위 세 줄에 차례로 줄을 그었다. 취임 뒤 처음 연 국무회의에서 올렸던 그 세 가지였다.\n\n대만지원법을 두고 다섯 해 동안 서로 눈도 마주치지 않던 여야 의원들은 이제 같은 위원회에서 예산을 깎고 붙인다. 비밀 지원의 진상은 국회와 국민 앞에 공개됐고, 사고로 숨졌다던 장병들의 이름은 제자리를 찾았다. 유족들은 여전히 다 용서하지는 않았지만, 더는 국방부 앞에서 팻말을 들지 않는다."
 tfrkphn.6973.d:0 "베이징은 한동안 통관 심사를 늦추며 버텼지만, 우리가 공급망을 넓히고 특사를 보내자 결국 심사 속도를 되돌렸다. 숨긴 것을 다 밝히고도 나라가 흔들리지 않았다는 것을 보여 주었다.\n\n그해 현충일, 국립묘지 한쪽에 새 묘역이 문을 열었다. 비석에는 비로소 진짜 숨진 곳이 새겨졌다. 대만해협이라는 네 글자를 처음 본 어머니들 가운데 몇은 비석을 오래 쓰다듬었고, 그 옆에는 여야 대표가 나란히 서서 고개를 숙였다.\n\n대통령은 기자회견에서 서류 위의 중립과 실제로 한 일 사이의 틈을 메우는 데 한 해가 넘게 걸렸다고 말했다. 다음 질문은 집값이었고, 그는 그 질문에 더 길게 답했다."
 tfrkphn.6975.d:0 "착공 물량이 31만 호를 넘었습니다. 오세훈이 2026년 5월 서울시장 선거에서 내건 숫자를 대통령이 되어 나라 전체에서 채운 셈입니다.\n\n재개발 구역마다 타워크레인이 섰고, 모아주택과 상생주택의 입주 추첨에는 매번 사람이 몰렸습니다. 속도를 낸 만큼 밀려난 세입자들의 이야기도 함께 쌓였습니다. 국토교통부는 첫 입주가 시작되는 두 해 뒤부터 집값이 본격적으로 안정될 것이라고 보고했습니다."
 tfrkphn.6976.d:0 "장마 전선이 수도권에 걸려 하루에 한 달 치 비가 쏟아졌습니다. 강남역 일대 땅 밑의 빗물터널이 처음으로 제 몫을 했습니다. 도로 몇 곳이 잠깐 잠겼지만 물은 몇 시간 만에 빠졌고, 반지하에서 옮겨 간 사람들의 집은 젖지 않았습니다.\n\n재난 문자는 비가 쏟아지기 한 시간 전에 나갔습니다. 다음 날 아침 출근길은 평소와 다르지 않았습니다."
 tfrkphn.6977.d:0 "큰 태풍이 남해안에 올라왔습니다. 사흘 전부터 어선이 항구로 돌아왔고, 해안가 주민들은 미리 대피소로 옮겼습니다. 바람에 간판 몇 개가 떨어지고 정전이 잠깐 이어졌지만 크게 다친 사람은 없었습니다.\n\n지자체들은 매뉴얼에 적힌 순서대로 움직였고, 복구는 이틀 만에 끝났습니다."
 tfrkphn.698.d:0 "미국의 내전이 끝날 기미를 보이지 않습니다. 곧 끝나리라 믿고 버티던 사람들이 두 해 만에 짐을 싸기 시작했습니다.\n\n처음 건너온 이들은 본사가 무너진 회사의 사람들이었습니다. 이번에는 공장과 연구실을 끝까지 지키던 기술자와 교수, 그 가족들입니다. 인천공항 입국장에는 영어로 된 안내판이 새로 걸렸고, 먼저 온 회사들이 마중을 나왔습니다. 대륙에 남아 있던 큰 회사 두 곳도 우리 정부에 자리를 물어 왔습니다."
 tfrkphn.6981.d:0 "디딤돌소득을 받는 가구가 60만을 넘었습니다. 서울에서 500가구로 시작한 제도입니다.\n\n2025년 5월 토론회에서 서울시가 내놓은 수치는 탈수급 8.6퍼센트, 근로소득이 늘어난 가구 31.1퍼센트였습니다. 오세훈은 그 자리에서 이렇게 말했습니다.\n\n\"이미 효과가 입증된 디딤돌소득과 서울런의 전국화는 우리사회 양극화 해소에 결정적인 변혁을 가지고 올 것\"\n\n대통령이 된 그는 그 말을 전국에서 시험했습니다. 보건복지부는 이번 달 통계에서 처음으로 상대적 빈곤율이 한 해 사이 눈에 띄게 내려갔다고 보고했습니다. 야당은 재정 부담을 따졌고, 정부는 다음 예산안에서 답하겠다고 했습니다."
 tfrkphn.6982.d:0 "취임 넉 달째 되는 주 목요일, 오세훈 대통령은 여당 의원 전원을 대통령실로 불렀습니다. 대통령이 의원 전원과 마주 앉은 것은 이번 정부에서 처음입니다.\n\n그는 지난 대선 결과부터 꺼냈습니다. 국민은 전쟁을 이긴 정당을 다시 골랐지만, 그 정당의 목소리가 계속 커지기를 바란 것은 아니라고 말했습니다. 표를 준 사람들 가운데 절반은 이번만 찍었다고 답한 출구조사도 함께 내밀었습니다.\n\n대통령은 당의 강령과 공천 방식을 바꾸자고 했습니다. 전쟁 시기에 들어간 비상 대응 조항을 강령에서 빼고, 다음 총선부터는 지역구 공천의 절반을 국민 여론조사로 정하자는 안이었습니다.\n\n회의장에는 한동안 말이 없었습니다. 회의가 끝난 뒤 한 초선 의원은 기자들에게 대통령이 당을 다시 짓자고 했다고 전했습니다. 원내대표는 오늘 나온 이야기를 의원총회에서 다시 논의하겠다고만 밝혔습니다."
 tfrkphn.6983.d:0 "당 개혁안 초안이 공개된 지 사흘 만에 여당 의원 스물한 명이 성명을 냈습니다. 대부분 전쟁 시기에 국방위와 정보위에서 일한 의원들입니다.\n\n성명은 전쟁을 이긴 원칙을 버리면 다음 위기에 나라를 지킬 수 없다고 적었습니다. 이름을 밝히지 않은 한 중진 의원은 기자들에게 대통령이 야당의 표를 얻으려고 당을 내준다고 말했습니다.\n\n성명이 나온 날 저녁 보수 성향 유튜브 채널 몇 곳은 대통령을 배신자라고 불렀습니다. 같은 날 발표된 여론조사에서는 당 개혁에 찬성한다는 응답이 열에 여섯이었습니다.\n\n대통령실은 성명에 직접 답하지 않았고, 비서실장은 그날 저녁 여당 원내대표와 두 시간 동안 만났습니다. 다음 총선 공천 규칙은 아직 정해지지 않았습니다."
 tfrkphn.6984.d:0 "여당이 전당대회를 열고 새 강령을 통과시켰습니다. 첫 줄에는 따뜻한 보수가, 둘째 줄에는 약자와의 동행이 들어갔습니다.\n\n전쟁 시기에 들어간 비상 대응 조항은 부칙으로 옮겨졌습니다. 반대한 대의원은 열에 셋이었습니다. 강경파 의원들은 표결 직전 자리를 떴지만 탈당한 사람은 없었습니다. 개혁안을 처음부터 지지해 온 한동훈은 표결이 끝난 뒤 대통령과 나란히 연단에 올라 새 강령을 들어 보였습니다.\n\n전당대회장 밖에서는 전쟁 유족 모임 회원 몇 명이 조용히 팻말을 들고 서 있었습니다. 팻말에는 잊지 말아 달라는 한 문장만 적혀 있었습니다. 새 강령은 부칙에 전쟁 희생자를 기억하는 조항을 따로 두었습니다.\n\n여론조사에서 여당 지지율은 한 달 사이 4퍼센트포인트 올랐습니다. 오른 몫은 대부분 스스로 중도라고 답한 사람들에게서 나왔습니다. 대통령은 전당대회 축사에서 이제 보수가 지키는 것은 사람이라고 말했습니다."
 tfrkphn.6985.d:0 "한강버스가 출근 시간에도 빈자리 없이 오가기 시작했습니다. 2025년 9월 첫 운항 직후에는 잦은 고장으로 운항을 멈추고 시장이 사과한 일도 있었습니다. 그 뒤 배를 손보고 선착장을 늘린 끝에 이제는 수도권 물길을 잇는 교통수단이 되었습니다.\n\n강변에는 낡은 주차장 자리에 일터와 공원이 들어섰습니다. 땅 밑에서는 빗물터널이 완공되어 첫 장마를 무사히 넘겼습니다. 강남역 사거리는 그해 여름 한 번도 물에 잠기지 않았습니다.\n\n국토교통부는 한강 방식을 낙동강과 금강에도 적용하는 계획을 내놓았습니다."
 tfrkphn.6986.d:0 "북한강과 남한강, 팔당, 임진강의 댐들이 한 상황실에서 함께 움직이기 시작했습니다. 큰비가 예보되면 소양강댐과 충주댐이 미리 물을 빼고, 팔당은 하류 수위를 보며 문을 엽니다. 임진강에서는 군남홍수조절지와 한탄강댐이 북쪽에서 내려오는 물을 받아 냅니다.\n\n댐마다 새 발전 설비가 돌기 시작하면서 강원과 충청의 공업 지대에도 전기가 넉넉해졌습니다. 환경부는 올여름 한강 수계에서 홍수 특보가 내려진 날이 지난해의 절반이었다고 밝혔습니다."
 tfrkphn.6992.d:0 "여당 의원 열네 명이 한꺼번에 탈당계를 냈습니다. 맨 앞에서 서류를 낸 사람은 장동혁 의원이었습니다. 그는 국회 소통관에서 이 당은 더 이상 전쟁을 이긴 당이 아니라고 말했습니다.\n\n일주일 뒤 이들은 모두 우리공화당에 입당했습니다. 원외에 머물던 우리공화당은 하루아침에 국회 의석 열네 개를 가진 정당이 되었습니다. 당사 앞에는 초록색 깃발이 걸렸습니다.\n\n대통령실은 하루 종일 말을 아꼈습니다. 여당은 과반을 지켰지만 표결마다 계산이 복잡해졌습니다. 여론조사에서 여당 지지율은 한 주 사이 3퍼센트포인트 내려갔습니다. 개혁안은 멈추지 않았습니다."
 tfrkphn.6994.d:0 "오세훈 대통령이 밤 아홉 시 긴급 담화에서 김정은 국무위원장을 생포했다고 발표하고 작전 영상을 공개했습니다. 평양 외곽의 반쯤 무너진 저택에서 붙잡힌 그는 지금 한국군 병원에 있습니다. 평양의 고위 간부들이 자신들의 안전을 보장받는 대가로 그의 위치를 넘겼다는 보도가 잇따랐습니다.\n\n전쟁 막바지에 돌던 그의 신변 이상설은 이것으로 끝났습니다. 김일성에서 시작된 세습도 3대 만에 끝났습니다.\n\n담화가 끝나자 서울 광화문 앞에 사람들이 모여들었습니다. 고향이 북쪽인 노인들은 태극기 대신 고향 마을 이름을 적은 종이를 들고 나왔고, 젊은 사람들은 휴대폰 속보 화면을 서로 돌려 보았습니다. 환호보다 조용히 우는 사람이 더 많았습니다.\n\n각국 정부도 잇달아 입장을 냈습니다. 브뤼셀의 유럽연합은 한반도의 오랜 전쟁이 끝났다며 한국 정부에 축하를 전했고, 도쿄는 납북자 문제의 진상부터 밝혀야 한다고 했습니다. 베이징 외교부는 하루 내내 논평을 내지 않았습니다. 유엔 안전보장이사회는 내일 긴급회의를 열어 그를 어느 법정에 세울지 논의합니다."
 tfrkphn.6995.d:0 "방금 서울에서 들어온 소식에 따르면, 2027년 대한민국 제21대 대통령 선거에서 여당인 국민의힘의 이인제 후보가 당선되었습니다. 홍준표 정부를 이어 보수 정권이 다섯 해 더 이어지게 되었습니다.\n\n이인제 당선인은 1997년 대선에 처음 나선 뒤 여러 번 고배를 마셨던 정치인입니다. 서른 해 만에 마침내 대통령 자리에 오른 셈입니다. 선거 내내 그는 홍준표 정부의 노선을 지키고 더 밀고 나가겠다고 말했습니다.\n\n개표 결과가 나온 새벽, 그의 선거 사무소 앞에는 지지자들이 모여 오래 기다린 승리를 축하했습니다. 불사조처럼 끈질기게 다시 일어선다고 해서 붙은 피닉제라는 별명이 이날 하루 종일 기사 제목에 오르내렸습니다.\n\n외신들은 그의 당선을 홍준표 노선의 연장으로 읽었습니다. 양안전쟁 때의 비밀 지원 논란을 겪고도 보수 정권이 다시 신임을 얻었다는 점에 주목한 보도가 많았습니다. 도쿄는 두 나라의 안보 협력이 그대로 이어질 것으로 보았고, 베이징은 한국의 대중 정책이 더 단단해질 것을 경계했습니다."
 tfrkphn.6996.d:0 "방금 서울에서 들어온 소식에 따르면, 2027년 대한민국 제21대 대통령 선거에서 여당인 국민의힘의 오세훈 후보가 당선되었습니다. 오랫동안 서울시장을 지낸 그가 이번에는 나라 전체를 맡게 되었습니다.\n\n같은 당의 후보였지만 그가 내건 말은 전임 정부와 결이 달랐습니다. 약자와의 동행과 따뜻한 보수를 앞세운 그는 강경 노선에 지친 중도층의 표를 크게 끌어왔습니다. 출구조사에서는 스스로 중도라고 답한 유권자의 절반 넘게 그를 찍었습니다.\n\n개표가 끝난 새벽, 서울시청 앞 광장에는 시청 직원 몇몇이 나와 떠나는 시장을 배웅했습니다. 그는 시청 건물을 한 번 돌아본 뒤 차에 올랐습니다.\n\n외신들은 그의 당선을 같은 당 안의 방향 전환으로 평가했습니다. 양안전쟁을 치른 정당에 다시 표를 주면서도, 국민이 한결 부드러운 얼굴을 골랐다는 분석이 이어졌습니다. 도쿄와 베이징은 새 정부의 대외 정책이 어디로 갈지 지켜보겠다는 반응을 내놓았습니다."
 tfrkphn.6997.d:0 "대통령과 야당 대표가 마주 앉은 다음 날 아침, 여당 의원총회는 예정보다 한 시간 늦게 끝났습니다. 회의장 문 밖까지 고성이 들렸습니다.\n\n강경파의 맨 앞에는 장동혁 의원이 섰습니다. 그는 회담에서 나온 합의문을 문제 삼았습니다. 전쟁 시기에 만든 비상 입법 몇 개를 여야가 함께 다시 살펴보자는 한 줄이었습니다. 장 의원은 마이크도 없이 소리쳤습니다. 이럴 거면 국민의힘을 탈당하고 민주당으로 가라는 말이었습니다. 몇몇 의원이 박수를 쳤습니다. 그 한마디는 그날 저녁 모든 방송의 첫 화면에 걸렸습니다.\n\n원내대표는 합의문의 후속 협의를 당분간 미루자는 의견을 대통령실에 전했습니다. 같은 날 오후 야당 대변인은 여당이 하루 만에 말을 바꾸려 한다고 논평했습니다.\n\n대통령실 회의에서 정무수석은 어느 쪽을 골라도 누군가는 등을 돌릴 것이라고 보고했습니다."
 tfrkphn.6998.d:0 "안심소득 전면 시행에 드는 첫해 예산이 국회 예산결산특별위원회에 올라왔습니다. 정부는 기존 현금 복지 일곱 가지를 하나로 묶어 늘어나는 돈을 줄였다고 설명했습니다.\n\n여당 강경파 의원 열여섯 명은 표결 전날 장동혁 의원의 방에 모였습니다. 장 의원은 민주당 공약을 우리 정부가 대신 해 주는 꼴이라며 수정안을 앞장서 냈습니다. 시행 지역을 수도권과 일부 광역시로 줄이고, 나머지는 3년 뒤에 다시 논의하자는 내용입니다.\n\n수정안이 통과되면 정부안은 반쪽이 됩니다. 반대로 정부안을 그대로 밀면 여당 표가 갈리고, 야당 표를 빌려야 합니다. 야당은 안심소득 자체에는 찬성한다고 밝혀 왔습니다.\n\n표결은 금요일 오후 두 시로 잡혔습니다. 국회 앞에는 시범 사업에 참여한 가구 몇십 명이 나와 피켓을 들었습니다."
 tfrkphn.6999.d:0 "정부가 비상 태세를 풀겠다고 발표한 지 열흘 만에 국회 국방위원회가 긴급 현안 질의를 열었습니다. 이번 질의는 여당 의원들이 요구했습니다.\n\n여당 국방위원 다섯 명은 국방부 장관을 상대로 네 시간 동안 질문을 이어 갔습니다. 북쪽 국경의 경계 병력, 예비군 동원 기간, 해상 초계 횟수가 모두 줄어드는 것이 맞는지 하나씩 따졌습니다. 한 의원은 민주당 정부도 이렇게 빨리 풀지는 않았을 거라고 말했습니다.\n\n예비역 장성 모임은 같은 날 성명을 내고 단계적 해제를 요구했습니다. 국방부는 해제 일정을 이미 각 부대에 내려보낸 상태였습니다.\n\n장관은 질의가 끝나자 곧장 대통령실로 올라왔습니다. 그가 든 서류철에는 부대별 해제 날짜가 빼곡하게 적혀 있었습니다."
 tfrkphn.70.kp:0 "군대에는 오래된 격언이 있다. 아마추어는 전술을 말하고 전문가는 보급을 말한다는 것이다. 총이 있어도 탄이 없으면 막대기이고, 탄이 있어도 밥이 없으면 병사는 쓰러진다. 그리고 탄과 밥이 다 있어도 기름이 없으면 전차도 군함도 전투기도, 탄과 밥을 실어 나를 트럭조차도 움직이지 않는다.\n\n1941년 미국이 석유 수출을 끊자 일본은 남쪽의 유전을 차지하려고 진주만을 쳤다. 기름 때문에 시작한 전쟁이었고 기름이 바닥나 진 전쟁이었다. 전쟁 말기 일본의 전함들은 연료가 없어 항구에 묶여 있었다.\n\n1944년 겨울 아르덴 숲에서 독일군 전차들은 연합군의 연료 창고를 노리고 진격했다. 그러나 창고에 닿기 전에 기름이 떨어졌고, 승무원들은 멀쩡한 전차를 버리고 걸어서 돌아갔다.\n\n이번 전쟁에서 우리도 같은 일을 겪었고, 대만해협에 들어간 우리 함대가 가장 먼저 부딪힌 적은 연료였다. 우리는 기름 한 방울 나지 않는 나라이고 쓰는 석유의 거의 전부를 바다 건너에서 들여온다. 그 바닷길을 지켜 주던 미국 해군은 사라졌다. 전쟁이 시작되자 중동에서 오던 유조선들이 말라카 해협 앞에서 멈칫거렸고 보험료는 하루가 다르게 치솟았다."
 tfrkphn.70.kp2:0 "구축함 함장들은 작전 해역보다 남은 연료 눈금을 더 자주 들여다봤다. 기름이 떨어지면 돌아가야 했고 돌아가면 그 자리는 비었다. 우리는 이제 그 교훈을 제도로 만든다. PDTO 회원국들은 태평양의 네 항구를 에너지 거점으로 묶기로 했다.\n\n§Y부산§! 한반도와 동해의 관문. 우리 해군과 산업의 심장에 기름을 댄다.\n§Y요코하마§! 도쿄만의 입구. 일본 열도의 정유와 비축을 맡는다.\n§Y가오슝§! 대만 남부의 군항. 해협 최전선에 기름을 댄다.\n§Y시드니§! 남태평양의 후방 기지. 전선이 아무리 흔들려도 무너지지 않을 마지막 창고다.\n\n네 항구에는 공동 비축 기지가 들어서고, 한 곳의 탱크가 마르면 나머지 세 곳이 채운다. 어느 한 나라의 바닷길이 막혀도 연합 전체의 기름은 마르지 않는다. 다음 전쟁에서 우리 함장들은 연료 눈금을 덜 들여다봐도 될 것이다."
 tfrkphn.7000.d:0 "정부가 이천오십 탄소중립 이행 계획을 내놓자 공업 지역에 지역구를 둔 여당 의원들이 먼저 들고일어났습니다. 계획에는 석탄 발전소 열한 곳을 앞당겨 닫고, 제철과 석유화학 공장에 탄소 배출 한도를 두는 내용이 들어 있었습니다.\n\n의원 열네 명은 연판장을 돌렸습니다. 맨 앞에 이름을 올린 사람은 화력 발전소가 있는 충남 보령이 지역구인 장동혁 의원이었습니다. 전쟁 때 탄약과 군함을 만든 공장들이 이제 겨우 숨을 돌리는데 문을 닫으라는 말이냐고 적었습니다. 장 의원은 기자들 앞에서 이건 민주당이 십 년 전에 내놓은 공약을 그대로 베낀 것이라고 말했습니다.\n\n울산과 포항의 노조도 같은 주에 집회를 열었습니다. 노조는 탄소중립 자체보다 일자리 전환 지원이 빠진 것을 문제 삼았습니다.\n\n같은 날 환경부와 산업부 장관은 서로 다른 보고서를 들고 대통령실 문을 두드렸습니다."
 tfrkphn.7001.d:0 "총선 개표가 끝나자 우리공화당은 아홉 석을 얻은 것으로 집계되었습니다. 지역구 다섯 곳과 비례대표 네 석입니다. 지난번 탈당한 의원 열네 명 가운데 다시 국회로 돌아온 사람은 절반이 되지 않았습니다.\n\n그래도 당선자 명단에서 가장 눈길을 끈 이름은 따로 있었습니다. 조원진 대표가 대구에서 지역구를 되찾았고, 비례대표 1번에는 황교안 전 국무총리가 이름을 올렸습니다. 지난 대선에서 오세훈에게 밀려난 두 사람이 나란히 국회로 돌아온 것입니다.\n\n당사 앞 개표 상황실에서는 초록색 깃발이 밤늦게까지 흔들렸습니다. 보수 진영의 표가 둘로 갈린 지역에서는 민주당 후보가 어부지리로 이긴 곳도 여럿 나왔습니다.\n\n정치권에서는 보수가 다시 두 개의 원내 정당으로 나뉘었다는 말이 나왔습니다. 여당 지도부는 개표 결과에 대한 논평을 다음 날로 미뤘습니다."
 tfrkphn.7004.d:0 "헤이그 국제형사재판소의 첫 공판은 한국 정부가 로마 규정 당사국으로서 사태를 회부한 지 다섯 달 만에, 오전 아홉 시 반에 열렸다. 법정 경위들이 방탄유리 문을 닫자 장내가 조용해졌다.\n\n서아프리카 출신의 수석 검사가 검사석에 섰다. 그는 낮고 고른 목소리로 공소장을 한 시간 넘게 읽었고, 한 번도 원고에서 눈을 떼지 않았다. 정치범 수용소, 민간인 거주지에 쏟아진 포격, 항복한 포로의 처형. 죄목이 하나 넘어갈 때마다 방청석의 탈북민 증인들이 고개를 숙였다.\n\n발언 기회를 얻은 피고인은 이 법정에 자신을 재판할 권한이 없다고 했다. 재판장은 그 주장을 기록에 남기겠다고만 답했다. 재판소가 지정한 변호인 셋은 관할 문제를 서면으로 다시 내겠다고 했다.\n\n서울에서는 저녁 다섯 시 반, 모든 방송이 공판을 생중계했다. 국회 몇몇 의원은 그래도 우리 법정에 세웠어야 했다고 다시 말했다. 판결까지는 몇 해가 걸릴 것이다. 사형은 없다. 국제 재판의 가장 무거운 형은 종신형이다."
 tfrkphn.7005.d:0 "서울중앙지방법원 417호 대법정. 이 나라의 전직 대통령들이 섰던 그 자리에 오늘은 평양의 마지막 세습자가 섰다. 방청권 추첨에는 일만 명 넘게 몰렸다.\n\n공소장에는 죄목 세 가지가 적혀 있었다. 전쟁 도발, 민간인 학살, 포로 처형. 피고인은 대한민국 법원을 인정하지 않는다는 말만 남겼다. 사건을 맡겠다는 변호사가 끝내 나서지 않아 법원이 국선변호인을 지정했다. 열다섯 해 경력의 그는 첫 공판 내내 담담하게 절차만 짚었다.\n\n맨 앞줄에는 유가족이 앉았다. 개전 첫날 포격에 아들을 잃은 노인이 증인석에 섰다가 끝내 말을 잇지 못하고 내려왔다. 재판장은 한참 증인석 쪽을 바라보다가 십 분간 휴정을 알렸다.\n\n법원 밖에서는 사형을 구하라는 쪽과 사형만은 안 된다는 쪽이 길 하나를 사이에 두고 맞섰다. 이 나라는 1997년 겨울 이후 사형을 집행한 적이 없다. 브뤼셀은 사형 구형을 우려한다는 서한을 보내왔다. 검찰은 구형을 앞두고 대통령실의 뜻을 물었다."
 tfrkphn.7006.d:0 "김정은이 생포된 지 이레. 강계로 물러난 북한의 남은 정권에서 새 소식이 들어왔다. 그의 동생 김여정이 당과 군의 직책을 모두 넘겨받고 최고 영도자의 자리에 올랐다는 첩보다.\n\n조선중앙방송은 오빠의 생포를 끝내 인정하지 않았다. 방송은 그를 원쑤들에게 납치된 수령이라 부르며, 그가 돌아올 때까지 동생이 대신 나라를 지킨다고 했다.\n\n정보기관의 판단은 달랐다. 수도는 이미 무너졌고 남은 부대는 산골짜기에 흩어져 있다. 지도자를 산 채로 내준 정권에서 백두혈통의 마지막 이름이 무엇을 붙잡을 수 있을지는 오래지 않아 드러날 것이다."
 tfrkphn.7007.d:0 "아시아의 전황을 뒤흔든 생포 소식에 이어 또 하나의 소식이 전해졌습니다. 한국군에 생포된 김정은 국무위원장의 동생 김여정 부부장이 북한에 남은 모든 권력을 넘겨받았다는 사실이 확인되었습니다.\n\n김여정은 조선중앙방송으로 낸 첫 성명에서 오빠가 적에게 납치되었을 뿐이라고 주장하고, 전 인민에게 마지막 한 사람까지 싸우라고 명령했습니다.\n\n하지만 군사 전문가들은 이 선언이 공허한 외침에 불과하다고 봅니다. 평양은 이미 함락되었고 북한군의 지휘 체계는 사실상 무너졌습니다. 전선 곳곳에서 식량과 보급이 끊긴 부대의 투항이 잇따르고 있습니다.\n\n지도자를 산 채로 적에게 내준 정권이 다시 일어설 수 있을지 의심하는 목소리가 많으며, EADI 또한 무너지는 독재 정권을 도울 힘이 없어 보입니다."
 tfrkphn.7008.d:0 "제23대 국회의원 선거가 한 달 앞으로 다가왔다. 양안전쟁의 승리가 막 전해진 뒤에 치른 지난 총선에서 여당은 199석을 얻었다. 이번에는 그 바람이 잦아들었고, 선거는 이인제 정부 첫해의 성적표가 된다.\n\n당 공천관리위원회 앞에는 두 갈래 길이 놓였다. 하나는 전쟁에서 돌아온 장교와 전역 장병, 복구 현장의 사람들을 앞세우는 길이다. 현역 의원 여럿이 밀려나고, 그들은 벌써 무소속 출마를 입에 올린다.\n\n다른 하나는 현역을 지키는 길이다. 당은 조용하겠지만 얼굴은 바뀌지 않는다. 야당은 벌써 낡은 정당이라는 구호를 내걸었다.\n\n대통령은 당을 여러 번 옮기며 살아남은 사람이다. 밀려난 사람이 어디로 가는지 누구보다 잘 안다."
 tfrkphn.7009.d:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당은 전쟁의 바람 없이도 지난번에 버금가는 의석을 지켰다. 충청의 지역구가 거의 한 색으로 칠해졌고, 수도권의 접전지도 자정 무렵 여당 쪽으로 넘어왔다.\n\n당사에서 개표 방송을 보던 대통령은 오래 말이 없다가 일어서서 당직자들의 손을 하나씩 잡았다. 1997년 겨울, 그는 492만 표를 얻고도 3위에 그쳤다. 서른 해 남짓 지난 이 밤은 그때와 달랐다.\n\n남은 네 해 동안 정부의 법안은 국회 문턱에서 멈추지 않을 것이다."
 tfrkphn.7010.d:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당은 의석을 여럿 잃었지만 과반은 지켰다. 지난 총선의 199석은 전쟁 직후의 숫자였고, 이번이 평시의 성적에 가깝다는 말이 나온다. 수도권에서 잃은 자리를 충청과 영남이 메웠다.\n\n대통령은 결과를 담담하게 받았다. 이긴 선거보다 진 선거를 더 많이 치러 본 사람이다. 그는 다음 날 아침 국무회의를 예정대로 열었다."
 tfrkphn.7011.d:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당이 과반을 잃었다. 지난 총선의 199석에서 크게 줄었다. 개혁에 지친 공단 지역과 수도권에서 표가 빠졌다. 당사의 불은 자정이 되기 전에 꺼졌다.\n\n언론은 피닉제라는 별명을 다시 꺼내며 이번에도 다시 일어설 수 있겠느냐고 물었다. 남은 임기 동안 예산과 법안은 야당과 마주 앉아 풀어야 한다."
 tfrkphn.7012.d:0 "임기를 몇 달 남긴 어느 봄날, 대통령은 일정에 없던 길을 나섰다. 행선지는 충남 논산, 그가 태어난 고장이다.\n\n충청은 오래 대통령을 꿈꿨다. 큰 이름들이 하나같이 문턱에서 멈췄다. 그 자신도 그랬다. 1997년에는 492만 표를 얻고도 3위에 그쳤고, 2007년에는 1퍼센트도 얻지 못했다. 사람들은 불사조와 그의 이름을 합쳐 피닉제라 불렀다. 넘어질 때마다 다시 일어섰기 때문이다.\n\n들판 가장자리의 작은 정자에서 마을 노인들이 그를 맞았다. 누구는 손을 잡았고, 누구는 그저 고개를 끄덕였다. 대통령은 연설을 하지 않았다. 한참 들판을 바라보다가, 이제는 내려앉아도 되겠다고 혼잣말처럼 말했다고 수행 비서관은 전했다."
 tfrkphn.7013.d:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당 혼자 200석을 넘겼다. 국회 재적의 3분의 2, 헌법을 고칠 수 있는 숫자다. 지난 총선의 199석은 전쟁 직후의 바람이 만든 숫자였다. 이번에는 바람 없이 그 선을 넘었다.\n\n출구조사가 화면에 뜨자 당사가 한동안 조용했다. 당 지도부가 예상한 숫자와는 크게 달랐다. 야당 대표는 자정을 넘겨 짧게 패배를 인정했다.\n\n대통령은 그날 밤 당선자들에게 개헌 이야기는 함부로 꺼내지 말라고 일렀다. 오래 내걸어 온 책임총리제를 헌법에 적는 일도 이제는 손에 닿는 곳에 있다. 그래서 더 조심해야 한다는 말이 나왔다."
 tfrkphn.7014.d:0 "국민투표 대신 국회를 택했다. 여야 원내대표와 정부가 한 테이블에 앉는 여야정 협의체가 국회 본청에서 첫 회의를 열었다. 안건은 전쟁 때 만든 비상 입법 열한 개다. 무엇을 남기고 무엇을 거둘지 석 달 안에 답을 내기로 했다.\n\n첫 회의는 네 시간 만에 끝났다. 야당은 언론 통제 조항부터 없애자고 했고, 정부는 징발과 동원 조항부터 정리하자고 했다. 양쪽은 다음 회의 날짜만 합의했다.\n\n회의장 밖 복도에서는 장동혁 의원이 기다리고 있었다. 그는 기자들에게 협의체가 야당에 칼자루를 쥐여 준 꼴이라고 했다. 당 지도부가 이 협의체를 끝까지 지켜 줄지는 아직 모른다.\n\n2011년의 그였다면 투표함으로 갔을 것이다. 이번에는 국회의 느린 시계를 따르기로 했다."
 tfrkphn.7015.d:0 "헤이그 국제형사재판소가 판결을 내렸다. 첫 공판에서 한 해 남짓, 재판부는 공소장의 죄목 거의 전부를 유죄로 인정했다. 정치범 수용소의 운영, 민간인 거주지 포격, 포로 처형. 재판부는 종신형을 선고했다.\n\n예순을 넘긴 남미 출신 판사가 재판장을 맡았다. 그는 주문을 읽다가 증언 한 대목에서 잠시 안경을 벗었고, 다시 쓰고 나서야 끝까지 읽었다. 방청석의 탈북민 증인 몇은 서로의 손을 잡았다. 판결문은 수천 쪽에 이르렀고, 재판부는 그 대부분을 증언을 옮겨 적는 데 썼다.\n\n서울의 반응은 갈렸다. 정부는 세계가 함께 내린 판결이라고 했다. 사형이 없는 법정에 그를 넘긴 것이 옳았느냐는 물음도 다시 나왔다. 유가족 단체는 짧은 성명을 냈다. 이제 누구도 그날을 지울 수 없다고."
 tfrkphn.7016.d:0 "서울중앙지방법원 417호 대법정. 첫 공판에서 일곱 달, 재판장이 주문을 읽었다. 전쟁 도발, 민간인 학살, 포로 처형. 세 죄목 모두 유죄, 형은 검찰의 구형대로 사형이었다.\n\n방청석 맨 앞줄의 유가족 가운데 몇은 울었고, 몇은 박수를 쳤다.\n\n법원 밖에서는 환호와 침묵이 길 하나를 사이에 두고 갈렸다. 이 나라는 1997년 겨울 이후 사형을 집행한 적이 없다. 선고는 내려졌지만 집행 명령은 법무부 장관의 몫이다. 브뤼셀은 집행만은 안 된다는 서한을 다시 보내왔다.\n\n이튿날 과천 법무부 앞에서는 집행하라는 쪽과 하지 말라는 쪽이 길 하나를 사이에 두고 따로 집회를 열었다. 장관은 출근길 기자들의 질문에 아무 답도 하지 않았다."
 tfrkphn.7016.d2:0 "서울중앙지방법원 417호 대법정. 첫 공판에서 일곱 달, 재판장이 주문을 읽었다. 전쟁 도발, 민간인 학살, 포로 처형. 세 죄목 모두 유죄, 형은 검찰의 구형대로 무기징역이었다.\n\n재판장은 선고문을 읽는 한 시간 동안 물 한 모금 마시지 않았다. 검사석의 젊은 검사는 서류철 위에 깍지 낀 손을 풀지 못했고, 국선변호인은 마지막 주문이 끝나자 천천히 펜을 내려놓았다. 방청석 맨 앞줄의 유가족 가운데 몇은 울었고, 몇은 끝까지 아무 표정도 짓지 않았다.\n\n법원 밖에서는 사형을 외치던 사람들이 한동안 자리를 뜨지 않았다. 길 건너편에서는 이 나라가 법으로 이겼다는 피켓이 올라갔다. 그는 남쪽의 교도소에서 남은 생을 보낸다. 브뤼셀은 판결을 환영한다는 짧은 논평을 냈다.\n\n그날 밤 유가족 단체 사무실에서는 판결문을 돌아가며 소리 내어 읽었다. 다 읽는 데 두 시간이 걸렸다. 연평도에서 아들을 잃은 어머니가 마지막 장을 맡았는데, 주문 대목에서 목이 메어 옆 사람이 대신 읽었다."
 tfrkphn.7017.d:0 "오산에 우방의 핵이 들어온 지 두 달, 서해가 먼저 움직였다. 중국 해군은 백령도 서쪽 공해에서 실탄 훈련을 열흘 동안 이어 갔고, 우리 어선들은 조업 구역을 비워야 했다. 연평도 어민들은 꽃게 철을 그대로 놓쳤다.\n\n항구에서는 다른 일이 벌어졌다. 칭다오와 다롄의 세관이 한국산 화장품과 반도체 부품의 통관을 이유 없이 늦추기 시작했다. 공식 발표는 없었고 보낸 서류만 돌아오지 않았다. 산업부는 한 달 손실을 수천억 원으로 어림했다.\n\n인천의 한 화장품 수출 회사는 컨테이너 마흔 개가 칭다오 부두에 묶였다. 사장은 직원들에게 이번 달 월급은 준다고 했지만 다음 달은 약속하지 못했다. 이 회사는 전쟁 중에도 하루도 공장을 세우지 않았다."
 tfrkphn.7018.d:0 "방금 서울에서 들어온 소식에 따르면, 대한민국 대통령 선거에서 이인제 현 대통령이 재선에 성공했습니다. 개정 헌법에 따라 처음 치러진 중임 대선이었고, 현직 대통령이 다시 투표용지에 이름을 올린 것도 이 나라 헌정사에서 처음입니다.\n\n선거는 지난 4년에 대한 평가였습니다. 이인제 대통령은 양안전쟁의 뒷정리와 노동개혁, 전쟁 빚 상환을 성과로 내세웠고, 야당은 임기 내내 이어진 노사 갈등을 파고들었습니다. 개표 결과는 그의 손을 들어 주었습니다.\n\n여러 번 쓰러졌다가 다시 일어선 정치인이라는 뜻의 피닉제라는 별명이 이번에도 기사 제목을 채웠습니다. 그에게는 이번이 마지막입니다. 개정 헌법은 대통령의 연임을 한 번으로 묶었습니다.\n\n개표가 끝난 새벽, 대통령은 당사에 들러 짧게 인사한 뒤 곧장 대통령실로 돌아갔습니다. 다음 날 아침 국무회의가 예정대로 열렸다는 소식이 첫 기사의 마지막 줄을 차지했습니다.\n\n외신들은 한국 유권자들이 전쟁 이후의 안정을 택했다고 평가했습니다. 도쿄는 두 나라의 협력이 그대로 이어지게 된 것을 반겼고, 베이징은 짧은 논평만 내놓았습니다."
 tfrkphn.7019.d:0 "방금 서울에서 들어온 소식에 따르면, 대한민국 대통령 선거에서 오세훈 현 대통령이 재선에 성공했습니다. 개정 헌법에 따라 처음 치러진 중임 대선이었고, 현직 대통령이 다시 투표용지에 이름을 올린 것도 이 나라 헌정사에서 처음입니다.\n\n선거는 지난 4년에 대한 평가였습니다. 오세훈 대통령은 주택 공급과 약자와의 동행, 메가시티를 성과로 내세웠고, 야당은 개발의 그늘과 오른 집값을 파고들었습니다. 개표 결과는 그의 손을 들어 주었습니다.\n\n서울시장 시절 한 번은 임기를 채우지 못하고 물러났던 그가, 이번에는 나라를 맡아 두 번째 임기를 시작합니다. 그에게는 이번이 마지막입니다. 개정 헌법은 대통령의 연임을 한 번으로 묶었습니다.\n\n개표가 끝난 새벽, 대통령은 당사 대신 서울의 한 상생주택 단지를 찾아 주민들과 짧게 인사를 나눴습니다. 첫 임기의 첫 약속이 시작된 곳이었습니다.\n\n외신들은 한국 유권자들이 따뜻한 보수에 한 번 더 표를 주었다고 평가했습니다. 도쿄는 대화의 문이 계속 열려 있게 된 것을 반겼고, 베이징은 새 임기의 대외 정책을 지켜보겠다고 했습니다."
 tfrkphn.7020.d:0 "여당 의원총회는 비공개로 열렸지만 고성은 문밖까지 새어 나왔다. 수도권에 지역구를 둔 초선 의원 몇이 먼저 일어섰다. 지역구 사무실에 전사자 유족이 찾아왔다는 사람도 있었고, 상가 셔터가 하나둘 내려가는 것을 매일 보고 있다는 사람도 있었다.\n\n그들은 탄핵소추안이 올라오면 자기 이름을 걸고 표결하겠다고 말했다. 반대하겠다는 말은 끝내 하지 않았다. 원내대표는 회의를 서둘러 끝냈다.\n\n다음 날 아침 신문들은 여당 안의 탄핵파라는 말을 처음으로 제목에 올렸다. 탄핵에 찬성한다고 밝힌 여당 의원은 아직 다섯 명이 안 됐다. 그러나 그 숫자가 어디서 멈출지는 대통령실도 원내대표실도 알지 못했다.\n\n그날 밤 원내대표실 전화는 쉬지 않고 울렸다. 의원들은 하나같이 지역구 사정부터 늘어놓았다. 원내 수석부대표는 화이트보드에 찬성, 반대, 모름 세 칸을 그었는데 모름 칸이 제일 길어졌다.\n\n\"형님, 이거 다 모름이면 사실상 찬성 아닙니까.\"\n\"입 다물고 적기나 해라.\"\n\n같은 날 오후 의원회관을 돈 대통령실 정무수석은 지난주보다 닫힌 방문을 더 많이 두드려야 했다."
 tfrkphn.7021.d:0 "탄핵파는 뜻밖의 곳에서 나왔다. 전쟁을 끝까지 밀어붙였어야 했다고 말해 온 강경 보수 쪽 의원들이었다. 그들의 셈법은 정반대였지만 결론은 같았다. 이길 수 있었던 전쟁을 진 대통령도, 이길 수 없는 전쟁에 들어간 대통령도 책임을 져야 한다는 것이다.\n\n광화문의 주말 집회에도 변화가 생겼다. 대통령을 지키자던 깃발 옆에 패전 책임자를 물러나게 하라는 손팻말이 섞여 들었다. 무대 위 연사들은 서로의 말을 끊었고 집회는 예정보다 일찍 끝났다.\n\n강경 보수 유튜브 채널들도 말을 바꿨다. 몇 달 전까지 대통령의 결단을 치켜세우던 진행자가 이번 주에는 패전 책임자를 찾자는 제목을 달고 방송을 켰다. 대통령실은 그런 방송을 따로 챙겨 보는 행정관을 두었는데, 그가 올리는 보고서는 날마다 두꺼워졌고 끝까지 읽는 사람은 날마다 줄었다.\n\n여당 지도부는 왼쪽과 오른쪽에서 동시에 흔들리고 있었다. 원내대표실의 칠판에는 찬반이 불분명한 의원 이름이 날마다 늘었고, 지워지는 이름은 없었다."
 tfrkphn.7022.d:0 "민주당의 이재명 의원이 국회 소통관에서 기자회견을 열었다. 그는 참전 결정부터 패전 뒤 수습까지 정부의 판단을 하나씩 짚으며, 대통령이 국민과 국회에 진실을 말하지 않았다고 강하게 비판했다. 그리고 여당 의원들에게 당론에 묶이지 말고 표결에 나서 달라고 호소했다.\n\n회견은 짧았지만 파장은 길었다. 야당 지지층은 다시 거리로 모였고, 여당 안에서 망설이던 의원들은 지역구 여론조사 결과를 다시 들여다보았다.\n\n회견 다음 날 아침 민주당 지도부는 탄핵소추안 초안을 의원들에게 돌렸다. 초안에는 참전 결정의 절차와 패전 뒤 정보 공개를 문제 삼는 조항이 들어 있었다. 진보정당과 무소속 의원 몇도 서명에 이름을 올렸다. 서명란의 빈칸은 이제 손에 꼽을 만큼 남았다.\n\n여당 원내대표는 그 초안을 받아 들고 한참 동안 아무 말도 하지 않았다. 그리고 의원총회를 다시 소집했다.\n\n대통령실은 그날 저녁 탄핵 추진이 국정 공백을 만드는 정치 공세라는 짧은 입장문을 냈다. 입장문을 받아 든 기자들은 국회 본회의장의 의석표부터 다시 셌다."
 tfrkphn.7023.d:0 "본회의가 열리기 전부터 의장석은 여당 강경파 의원들이 차지하고 있었다. 그들은 표결을 막으려고 의장석을 둘러싸고 서로 팔짱을 낀 채 바닥에 앉았다. 의장은 정회를 거듭하다가 오전 11시를 넘겨 경호권을 발동했다.\n\n국회 경위들이 본회의장으로 들어왔다. 의원들은 한 사람씩 팔과 다리를 붙들려 끌려 나갔다. 고함과 몸싸움이 뒤엉켰고 넥타이가 풀리고 안경이 바닥에 떨어졌다. 끌려 나가던 한 의원은 이것이 의회냐고 소리쳤다. 방청석의 시민들은 일어선 채 그 장면을 내려다보았고, 몇은 고개를 돌렸다.\n\n표결이 시작되자 남은 여당 의원 몇은 의원석에 엎드려 울었다. 기표소로 걸어가는 의원들 뒤로 표결을 멈추라는 구호가 이어졌다. 의원들은 투표함이 닫히고 개표가 끝날 때까지 본회의장에 선 채로 기다렸다.\n\n찬성 [?TFRKPHN_imp_yes|0]표. 의장이 대통령 탄핵소추안의 가결을 선포하며 의사봉을 세 번 내리쳤다. 야당 의원석에서 박수가 터졌다. 그 순간 여당 의원석에서 명패와 구두가 의장석을 향해 날아들었고, 경위들이 다시 뛰어들었다."
 tfrkphn.7024.d:0 "국회 소통관 단상에 국민의힘 의원 스물네 명이 줄지어 섰다. 전쟁을 끝까지 밀어붙였어야 했다고 말해 온 강경파 의원들이었다. 그들은 탈당계를 들어 보이며, 패전을 수습하는 당 지도부의 방식으로는 나라를 지킬 수 없다고 밝혔다.\n\n그들은 원외에 머물던 우익 정당 우리공화당에 입당했다. 우리공화당은 그날 오후 입당식을 열었다. 의원 스무 명을 넘긴 원외 정당이 하루아침에 원내 교섭단체가 된 것이다. 당 대표는 입당식에서 새 의원들에게 배지를 하나씩 달아 주었다.\n\n국민의힘 당사의 분위기는 무거웠다. 원내대표는 남은 의원들의 명단을 다시 받아 적었다. 여당의 의석은 하루 만에 스물네 석이 줄었다. 탄핵을 막을 표도, 법안을 넘길 표도 그만큼 사라졌다.\n\n그 주말 광화문 집회에는 우리공화당 깃발이 전보다 훨씬 많았고, 무대 위 연사들은 이번에는 서로 말을 끊지 않았다. 영상을 보던 대통령실 정무수석은 말없이 화면을 껐다. 그날 밤 국회 사무처 직원들은 본회의장 이름표 스물네 개를 오른쪽 끝 줄로 옮겨 붙였다."
 tfrkphn.7025.d:0 "총선을 앞두고 여당 지도부는 마지막 방어선을 쳤다. 탄핵소추안이 본회의에 올라와도 당론으로 반대하고, 표결에는 모두 참여해 반대표를 던지기로 했다. 의원총회에서 그 당론에 손을 든 의원은 과반을 훌쩍 넘었다. 원내대표는 회의가 끝난 뒤 이제 막았다고 말했다.\n\n표결은 무기명 비밀투표로 치러졌다. 의원들은 한 사람씩 기표소에 들어갔다가 나왔다. 여당 의원석은 거의 꽉 차 있었다. 원내 수석부대표는 투표함으로 걸어가는 의원들의 얼굴을 하나하나 눈으로 셌다.\n\n개표가 시작되자 본회의장이 조용해졌다. 찬성표가 예상한 숫자를 넘어서자 여당 의원석에서 술렁임이 일었다. 당론에 손을 들었던 의원들 가운데 적지 않은 수가 기표소 안에서 다른 선택을 한 것이다. 누가 그랬는지는 확인되지 않았다. 야당 의원석에서는 숫자가 하나씩 불릴 때마다 낮은 탄성이 새어 나왔다. 반대표는 당론의 절반에도 미치지 못했다.\n\n원내대표는 개표 결과가 적힌 쪽지를 받아 들고 한참 동안 아무 말도 하지 않았다. 다음 총선의 공천표가 그의 머릿속을 스쳐 지나갔다."
 tfrkphn.7027.d:0 "탄핵 뒤 첫 대선 여론조사가 나왔다. 국민의힘은 패전의 책임을 고스란히 떠안았고, 민주당은 탄핵 역풍을 맞았다. 두 당의 지지율을 합쳐도 절반에 미치지 못했다. 지지하는 정당이 없다는 답이 처음으로 어느 한 당보다 많아졌다.\n\n안철수가 가장 먼저 그 빈자리를 노리고 나섰다. 2016년 국민의당을 만들어 총선에서 서른여덟 석을 얻었던 그는 패전 뒤 당 안에서 대통령의 책임을 가장 먼저 물은 사람이기도 했다. 정의당에서 두 차례 대선에 나섰던 심상정과 손을 잡을 수 있다는 관측이 나왔다. 중도 보수와 진보가 어디까지 함께 갈 수 있느냐는 물음이 바로 따라붙었다.\n\n오른쪽 끝에서는 조원진 대표의 우리공화당이 커졌다. 국민의힘을 떠난 의원들이 합류해 원내 교섭단체가 된 그 당은 패전을 항복이라 부르며 거리 집회를 키워 왔다. 대표의 지지율은 처음으로 두 자릿수에 닿았다.\n\n중앙선거관리위원회는 대통령 선거일을 공고했다. 남은 날은 70일이다. 두 거대 정당의 당사 앞에는 아직 후보를 정하지 못했다는 기자들의 중계 차량만 서 있었다."
 tfrkphn.7028.d:0 "협상은 마지막 날 새벽까지 이어졌다. 안철수 쪽과 심상정 쪽 실무자들은 국회 앞 한 호텔 방에서 정책 합의문을 한 줄씩 맞춰 나갔다. 재벌 개혁과 노동 정책에서 몇 번이나 판이 깨질 뻔했다. 그때마다 실무자들은 따로 나가면 둘 다 진다는 여론조사표를 다시 펼쳤다.\n\n아침이 되자 두 사람이 함께 기자회견장에 섰다. 단일 후보는 여론조사 경선으로 정하고, 진 쪽은 공동선거대책위원장을 맡기로 했다. 경선 여론조사의 숫자는 오차 범위 안에서 갈리지 않았다. 마지막 결정은 두 사람의 회동에 맡겨졌다.\n\n제3지대 연합의 깃발 아래 중도 보수와 진보의 지지층이 한데 모이기 시작했다. 거대 양당에 실망한 표가 한쪽으로 흘러가는 모습이 다음 주 여론조사에 그대로 찍혔다. 우리공화당은 두 사람의 연합을 야합이라고 불렀다.\n\n그날 오후 국민의힘과 민주당 선대위는 거의 같은 시각에 긴급회의를 열었다. 두 당 전략실장이 들고 들어간 계산표는 숫자만 달랐지 결론은 같았다. 지지층이 생각보다 많이 빠져나가고 있었다.\n\n선거까지는 25일이 남았다."
 tfrkphn.7029.d:0 "협상은 마지막 날 새벽에 깨졌다. 안철수 쪽과 심상정 쪽 실무자들은 국회 앞 한 호텔 방에서 정책 합의문을 맞추다가 재벌 개혁과 노동 정책에서 끝내 물러서지 않았다. 단일 후보를 정하는 방식을 두고도 서로의 셈법이 달랐다.\n\n아침에 두 캠프는 따로 기자회견을 열었다. 두 사람은 각자 끝까지 출마하겠다고 밝혔다. 같은 시간에 열린 두 회견이 모든 것을 말해 주었다. 거대 양당에 실망한 표는 두 갈래로 나뉘었다.\n\n우리공화당이 그 틈을 파고들었다. 조원진 대표의 유세장은 날마다 커졌다. 패전의 책임을 묻는 분노와 탄핵에 대한 반발이 한곳으로 모였다. 다음 주 여론조사에서 우리공화당은 처음으로 1위에 올랐다. 두 거대 정당의 후보들은 그 뒤를 쫓았고, 갈라진 제3지대는 그보다 아래에 있었다.\n\n그날 밤 안철수 캠프의 한 실무자는 연합 이름을 넣어 만들어 둔 벽보 시안을 꺼냈다가 다시 접어 서랍에 넣었다. 인쇄소에는 원래 넘기려던 날짜를 하루 앞두고 취소 전화를 걸었다.\n\n선거까지는 25일이 남았다."
 tfrkphn.7030.d:0 "개표 방송의 첫 숫자가 뜨자 연합 선거사무소에서 함성이 터졌다. 거대 양당의 후보는 처음부터 뒤처졌고, 우리공화당의 추격도 자정을 넘기며 꺾였다. 새벽 두 시, 방송사들은 안철수 후보의 당선이 확실하다고 보도했다.\n\n이 나라에서 두 거대 정당 밖의 후보가 대통령에 당선된 적은 그전까지 없었다. 공동선거대책위원장을 맡았던 심상정은 당선인과 함께 단상에 올랐다. 지지자들은 두 사람의 이름을 번갈아 불렀다.\n\n당선인 앞에는 무거운 숙제가 쌓여 있다. 패전의 빚과 무너진 경제, 그리고 의석 대부분을 차지한 거대 양당의 국회다. 연합의 약속을 법으로 만들려면 국회부터 설득해야 한다.\n\n개표가 끝난 아침, 여의도의 두 거대 정당 당사는 조용했다. 두 당의 대표는 나란히 사퇴 의사를 밝혔다. 이 나라 정치를 수십 년 동안 나눠 가졌던 두 당이 같은 날 함께 무너진 것이다. 당직자들은 짐을 싸기 시작했다.\n\n권한대행을 맡아 온 이인제 국무총리는 그날 아침 당선인에게 축하 전화를 걸었다. 정권 인수위원회는 다음 날 꾸려진다."
 tfrkphn.7031.d:0 "개표 방송의 첫 숫자가 뜰 때부터 우리공화당 후보가 앞섰다. 갈라진 제3지대와 두 거대 정당의 후보가 표를 나눠 가지는 사이 그 격차는 끝까지 좁혀지지 않았다. 자정이 조금 지나 방송사들은 조원진 후보의 당선이 확실하다고 보도했다.\n\n원외 정당에서 출발한 우리공화당이 대통령을 배출하리라고는 누구도 예상하지 못했다. 당사 앞에는 태극기를 든 지지자들이 밤새 모여 있었다. 다른 쪽 광장에는 결과를 받아들이기 어렵다는 사람들이 촛불을 들었다.\n\n외신들은 패전과 탄핵을 거친 한국이 오른쪽 끝을 골랐다고 썼다. 브뤼셀과 도쿄의 외교 라인은 새 정부의 대외 정책을 묻는 전화를 서울로 돌렸다. 시장은 크게 흔들렸다.\n\n개표가 끝난 아침, 여의도의 두 거대 정당 당사는 조용했다. 두 당의 대표는 나란히 사퇴 의사를 밝혔다. 제3지대의 두 캠프는 따로 성명을 냈다. 합쳤다면 달랐을 것이라는 계산은 소용이 없었다.\n\n권한대행을 맡아 온 이인제 국무총리는 그날 아침 당선인에게 축하 전화를 걸었다. 정권 인수위원회는 다음 날 꾸려진다."
 tfrkphn.7032.d:0 "후보 등록이 끝났다. 국민의힘과 민주당도 후보를 냈지만, 그 이름을 기억하는 사람은 많지 않았다. 두 당의 유세장에는 당직자와 기자 몇 사람뿐이었고, 방송사 중계 차량은 일찍 자리를 떴다. 여론조사표의 두 칸은 날마다 줄어들었다.\n\n사람들의 눈은 다른 곳에 가 있었다. 안철수의 유세장에는 중도층과 수도권 직장인들이 모였고, 심상정의 유세장에는 노동조합 깃발과 청년들이 섞였다. 둘은 아직 단일화 협상 중이었지만 유세장에서는 서로를 공격하지 않았다.\n\n조원진 대표의 우리공화당 유세장은 가장 시끄러웠다. 태극기를 든 지지자들이 광장을 메웠고, 패전과 탄핵에 분노한 사람들이 하나둘 그 줄에 섰다. 그 줄은 날마다 길어졌다.\n\n첫 TV 토론회는 안철수, 심상정, 조원진 세 사람의 싸움이었다. 다른 두 연단에 선 후보들에게 돌아간 질문은 손에 꼽을 만큼이었다. 방송이 끝난 뒤 인터넷에 오른 장면 가운데 두 거대 정당 후보가 나온 것은 거의 없었다.\n\n전문가들은 제3지대의 단일화를 승부처로 꼽았다. 단일화 협상의 시한까지는 20일이 남았다."
 tfrkphn.7034.d:0 "개표 방송의 첫 숫자가 뜨자 연합 선거사무소에서 함성이 터졌다. 거대 양당의 후보는 처음부터 뒤처졌고, 우리공화당의 추격도 자정을 넘기며 꺾였다. 새벽 두 시, 방송사들은 심상정 후보의 당선이 확실하다고 보도했다.\n\n진보 정당 출신 대통령은 그전까지 없었다. 공동선거대책위원장을 맡았던 안철수는 당선인과 함께 단상에 올랐다. 중도 보수와 진보가 한 무대에 선 장면을 두고 외신들은 독일식 연정을 떠올렸다. 지지자들은 두 사람의 이름을 번갈아 불렀고, 광장의 깃발은 노란색과 주황색이 섞여 있었다.\n\n당선인 앞에는 무거운 숙제가 쌓여 있다. 패전의 빚과 무너진 경제, 그리고 의석 대부분을 차지한 거대 양당의 국회다. 정의당의 의석만으로는 법 하나도 넘길 수 없다. 개혁을 하려면 민주당의 손을 잡아야 하고, 연합을 지키려면 안철수의 손도 놓을 수 없다.\n\n개표가 끝난 아침, 여의도의 두 거대 정당 당사는 조용했다. 권한대행을 맡아 온 이인제 국무총리는 그날 아침 당선인에게 축하 전화를 걸었다. 정권 인수위원회는 다음 날 꾸려진다."
 tfrkphn.7038.d:0 "올여름은 그 어느 때보다 뜨거웠다. 미국의 붕괴, 대만의 멸망, 대통령의 탄핵. 이 모든 일이 한 여름 안에 일어났다.\n\n적은 안에 있다. 민주당이 대만은 우리와 별개라고 말할 때부터 알아봤다. 대통령이 더 강하게 맞서지 않을 때부터 알아봤다. 이 나라의 적은 기득권이다. 모든 것이 안에 있는 적 때문이다.\n\n스무 살 남짓의 청년 김창수는 그렇게 생각한다. 이 나라를 바꾸려면 거대한 변화가 와야 한다고. 처음에 그는 탄핵에 분노했다. 국회가 대통령을 끌어내리는 장면을 보며 주먹을 쥐었다. 그러나 어느 순간부터 그 분노는 정치 전체에 대한 혐오로 바뀌었다. 여당도 야당도, 단일화를 하겠다던 제3지대도 그의 눈에는 같은 사람들이었다.\n\n그는 고등학교 친구를 따라 처음 우리공화당 집회에 나갔다. 거기서 그는 자기와 같은 말을 하는 사람들을 만났다. 연단 위의 연설은 그가 하고 싶던 말을 대신해 주었다.\n\n그는 오늘도 광화문에서 태극기를 흔든다. 집회가 끝나고 해가 져도 그는 한동안 광장을 떠나지 않는다."
 tfrkphn.7039.d:0 "국회의사당 앞마당에 태극기가 끝없이 물결쳤다. 제21대 대통령 취임식이었다. 군악대의 연주가 끝나자 조원진 당선인이 단상에 올라 취임 선서를 했다. 선서의 문장은 역대 대통령들이 읽었던 것과 한 글자도 다르지 않았다.\n\n취임사에서 새 대통령은 기득권을 모두 청산하고 패전의 책임자들을 끝까지 찾아내겠다고 약속했다. 앞자리의 지지자들은 그 대목마다 일어나 환호했다. 귀빈석에 앉은 두 거대 정당의 대표들은 끝까지 박수를 치지 않았다.\n\n광장 한쪽에서 김창수는 깃발을 높이 들었다. 그는 이 나라가 드디어 바뀐다고 믿었다.\n\n총을 든 사람도 탱크를 몰고 온 사람도 없었다. 국민은 투표소에 줄을 서서 한 표씩 넣었고, 선관위는 개표를 마쳤으며, 헌법이 정한 절차는 하나도 어긋나지 않았다. 민주주의는 그렇게 스스로 죽음을 택했다. 마지막 순간까지 그것은 아름답고 순수했다. 광장에서 깃발을 흔드는 저 청년처럼.\n\n취임식이 끝난 뒤에도 광장의 깃발은 해가 질 때까지 내려가지 않았다. 국회의사당의 불은 그날 밤 일찍 꺼졌다."
 tfrkphn.7040.d:0 "취임 반년 만에 대통령과 국회는 더 이상 같은 나라를 보지 않았다. 우리공화당의 의석은 서른 석이 안 됐고, 대통령이 내놓은 법안은 하나도 본회의를 넘지 못했다. 국회는 정부의 예산안을 통째로 깎았고, 대통령은 거부권으로 맞섰다.\n\n그날 밤 대통령실은 국회를 해산하고 새 헌법을 국민투표에 부치겠다는 대통령 긴급명령을 발표했다. 새 헌법이 통과될 때까지 대통령령이 법률을 대신한다고 했다. 헌법 어디에도 대통령이 국회를 해산할 수 있다는 조항은 없었다.\n\n명령이 발표되자 장관 두 사람이 그 자리에서 사표를 냈다. 대통령실은 사표를 받지 않았다. 국회 사무처는 의원회관의 불을 모두 켜고 정문을 닫았다. 정문 밖에는 이미 경찰 버스가 와 있었다.\n\n국무총리실은 밤새 아무 말도 하지 않았다. 국방부 장관은 군은 정치적 중립을 지킨다는 한 줄짜리 입장을 냈다. 국회도 대통령실도 그 한 줄을 자기 편이라고 읽었다. 방송국 앞에도 경찰이 섰다.\n\n그날 밤 여의도로 가는 길목마다 경찰 버스가 늘어섰다. 한강 다리 위로는 밤새 헬기 소리가 오갔다."
 tfrkphn.7041.d:0 "봉쇄는 열하루 동안 이어졌다. 국회의사당의 전기와 전화가 끊겼고, 의원들과 보좌진 수백 명이 촛불을 켜고 본회의장을 지켰다. 담장 밖에는 국회를 지키겠다는 시민들과 대통령을 지지하는 태극기 행렬이 마주 섰다.\n\n열이틀째 새벽, 대통령의 명령을 따르기로 한 부대의 전차가 여의도로 들어왔다. 첫 포탄은 국회의사당의 돔에 떨어졌다. 검은 연기가 한강 위로 올라갔고, 생중계 화면은 그 장면을 온 나라에 내보냈다. 오후가 되자 본회의장에 남아 있던 사람들이 손을 들고 걸어 나왔다.\n\n국회의장과 원내대표들은 그 자리에서 체포됐다. 사망자의 숫자는 발표마다 달랐다. 정부는 질서가 회복됐다고 발표했다.\n\n국회 사무처의 한 직원은 봉쇄 첫날부터 본회의장의 일지를 손으로 적었다. 일지의 마지막 줄에는 첫 포탄이 떨어진 시각만 적혀 있었다. 그 일지는 몇 해 뒤에야 세상에 나왔다.\n\n두 달 뒤 새 헌법이 국민투표에 부쳐졌다. 대통령은 국회를 해산할 수 있고, 국회는 대통령을 탄핵하기 어려워졌다. 투표율은 낮았지만 헌법은 통과됐다."
 tfrkphn.7042.d:0 "명령이 내려진 밤, 전차 수십 대가 여의도로 들어왔다. 그러나 국회 앞에는 이미 시민들이 버스와 화분, 철제 펜스로 바리케이드를 쌓고 있었다. 밤새 비가 내렸고, 사람들은 우비를 입은 채 전차 앞에 앉았다.\n\n새벽에 우원식 국회의장이 의사당 계단을 내려와 맨 앞 전차 위로 올라섰다. 그는 손에 든 종이를 읽었다. 긴급명령은 헌법에 없는 명령이니 따르지 말라는 내용이었다. 그 장면은 해외 방송을 타고 세계로 나갔다.\n\n둘째 날, 한 전차 부대의 포탑이 국회 반대쪽으로 돌아갔다. 부대장은 시민에게 포를 겨누지 않겠다고 밝혔다. 다른 부대들도 하나둘 움직이지 않았다. 대통령실은 사흘째 새벽에 결국 긴급명령을 거둬들였다.\n\n탄핵소추안은 다시 헌법재판소로 넘어갔다. 대통령은 자리에 남았지만 그의 명령을 따를 부대는 더 이상 없었다. 우리공화당 지지자들은 광장에서 배신이라고 외쳤다.\n\n전차 위에 선 사람과 그 아래 모인 시민들. 그 사진은 다음 날 모든 신문 1면에 실렸고, 외국 신문들도 같은 사진을 실었다."
 tfrkphn.7043.d:0 "헌법재판소의 선고는 오전 11시에 시작됐다. 재판관들은 긴급명령이 헌법에 없는 권한이었고, 국회를 향해 전차를 보낸 것은 헌법 질서를 무너뜨린 일이라고 밝혔다. 주문은 짧았다. 피청구인 대통령 조원진을 파면한다.\n\n선고가 끝나자 헌법재판소 앞에 모여 있던 사람들 사이에서 함성과 울음이 함께 터졌다. 광화문에서는 우리공화당 지지자들이 해가 질 때까지 깃발을 내리지 않았다.\n\n이인제 국무총리가 한 해 사이에 두 번째로 다시 대통령 권한대행을 맡았다. 권한대행은 그날 오후 국무회의를 열고 60일 안에 대통령 선거를 치르겠다고 발표했다.\n\n정치권의 눈은 한 사람에게 모였다. 전차 위에서 긴급명령을 따르지 말라고 읽었던 우원식 국회의장이었다. 국회의장은 당적을 가질 수 없다. 양당도 제3지대도 아닌 사람이 이 나라에 남아 있었다. 사흘 뒤 그는 의장직을 내려놓고 무소속으로 출마하겠다고 밝혔다.\n\n여의도의 전차 자국은 아직 아스팔트에 남아 있었다. 국회의사당 앞 바리케이드를 치우는 일은 그 주 내내 이어졌다."
 tfrkphn.7044.d:0 "개표 방송의 첫 숫자부터 무소속 우원식 후보가 앞섰다. 여러 세력이 당을 가리지 않고 함께 그를 지지했다. 무너진 양당의 지지자들, 단일화에 실패했던 제3지대의 두 캠프, 그리고 그 사흘 동안 여의도의 비를 맞으며 바리케이드를 지켰던 사람들이었다. 자정을 조금 넘겨 방송사들은 그의 당선이 확실하다고 보도했다.\n\n이 나라에서 무소속 후보가 대통령이 된 적은 그전까지 없었다. 그는 당선 소감에서 정부의 회의록을 모두 공개하고, 군을 정치에서 영원히 떼어 놓으며, 북쪽과 이웃 나라들을 대화의 상대로 대하겠다고 약속했다. 낡은 질서를 고쳐 쓰지 않고 새로 짜겠다는 그의 말을 두고, 사람들은 그 이상이 이 나라에 너무 이른 것은 아닌지 걱정했다.\n\n당선인 사무실에는 그날 전차 위에서 찍힌 사진이 걸려 있었다. 사무실을 찾은 사람들은 그 사진 앞에서 한참씩 머물렀다.\n\n권한대행을 맡아 온 이인제 국무총리는 그날 아침 당선인에게 축하 전화를 걸었다. 새 정부의 첫 숙제는 갈라진 국회를 다시 한자리에 모으는 일이었다."
 tfrkphn.7045.d:0 "저녁 6시 반, 국회는 군의 정치 개입을 금지하는 법안을 표결하고 있었다. 그때 본회의장 문이 열리고 무장한 병력이 들이닥쳤다. 앞장선 장교가 권총을 들고 모두 엎드리라고 소리쳤다. 천장을 향해 총성이 울렸다.\n\n의원들은 책상 아래로 몸을 숨겼다. 엎드리지 않은 사람은 몇 되지 않았다. 국무총리는 자리에 그대로 앉아 있었다. 군 출신의 노장 국방부 장관은 자리에서 일어나 장교에게 다가가 물러나라고 명령했다. 병사들은 그를 거칠게 밀쳐 냈다.\n\n같은 시각 지방의 한 군단에서 전차가 도시로 나왔다는 보고가 들어왔다. 본회의장의 의원 삼백 명은 인질이 됐다. 방송국 한 곳의 카메라는 꺼지지 않고 그 장면을 계속 내보냈다.\n\n새벽 1시, 대통령이 텔레비전 화면에 나타났다. 그는 헌법을 거스르는 어떤 명령도 따르지 말라고 군에 명령했다. 이튿날 오후, 지방의 전차들은 부대로 돌아갔고 본회의장의 병력은 무기를 내려놓았다.\n\n국회는 해마다 그날 본회의장에서 추념식을 열었다. 그날 이후 군복을 입은 사람이 국회의 문을 여는 일은 다시 없었다."
 tfrkphn.7046.d:0 "후보 등록이 마감됐다. 파면된 대통령의 뒤를 잇겠다는 사람이 여럿 나왔다. 황교안 전 국무총리, 한국사 강사 출신의 전한길, 전광훈 목사, 황보승희 전 의원, 그 밖에도 여럿이 저마다 자기가 진짜 계승자라며 이름을 올렸다. 투표용지의 아래쪽은 그들의 이름으로 빼곡했다.\n\n광화문의 주말 집회는 여러 갈래로 나뉘었다. 같은 광장에 서로 다른 무대가 섰고, 같은 태극기를 든 사람들이 서로 다른 이름을 외쳤다. 지지자들은 누구에게 표를 줘야 할지 몰랐다.\n\n민주당, 국민의힘, 제3지대 연합, 정의당이 일제히 후보를 내지 않기로 결정했다. 각 당의 대표들은 같은 날 우원식 후보에게 지지 선언을 보냈다. 지난 몇 해 동안 한 번도 같은 편에 선 적 없던 이름들이 한 장의 선언문 아래 나란히 적혔다.\n\n우원식은 지지 선언을 고맙게 받겠다고 하면서도, 어느 당의 공약도 대신 내걸지는 않겠다고 밝혔다. 그의 공약은 하나였다. 헌법을 지키는 것.\n\n여론조사 회사들은 그 주에 조사를 멈췄다. 숫자를 낼 필요가 없었다."
 tfrkphn.7047.d:0 "진실 위원회의 첫 청문회가 국회 회의실에서 열렸다. 첫 증인은 참전 결정 당시 국가안보실에 있던 사람이었다. 그는 대통령에게 올라간 보고서와 내려온 지시를 하나씩 읽었다. 방청석은 조용했다.\n\n청문회는 매주 열렸다. 패전의 책임은 한 사람에게 모이지 않았다. 군 지휘부와 정보기관, 국회와 언론, 그리고 박수를 쳤던 사람들에게까지 흩어져 있었다. 청문회가 거듭될수록 사람들은 불편해졌다.\n\n여의도의 사흘을 다룬 청문회에서는 전차를 몰았던 부대의 장교가 증언했다. 그는 명령을 따랐을 뿐이라고 했고, 방청석의 유족 하나가 자리에서 일어나 그를 바라보았다.\n\n청문회의 기록은 날마다 인터넷에 그대로 올라갔다. 몇몇 증언은 수십만 번 읽혔고, 몇몇 이름은 다음 날 아침 신문의 1면에 실렸다. 이름이 오른 사람들 가운데에는 지금도 국회에 앉아 있는 의원들이 있었다.\n\n처벌받은 사람은 아직 없었다. 위원장은 기자들에게 처벌보다 기록이 먼저라고 했고, 그 말을 들은 유족 한 사람이 회의실 문을 세게 닫고 나갔다."
 tfrkphn.7048.d:0 "국회 본회의장에서 사면법이 통과됐다. 패전과 긴급명령, 여의도의 사흘에 관여한 사람들은 더 이상 법정에 서지 않는다. 대신 누구도 지난 일을 정치의 무기로 꺼내지 않기로 여야가 약속했다. 사람들은 그것을 망각의 협약이라고 불렀다.\n\n표결이 끝나자 본회의장은 오히려 조용했다. 박수를 친 사람은 많지 않았다. 유족 단체는 국회 앞에서 피켓을 들었다. 기억하지 않는 나라는 같은 일을 되풀이한다는 내용이었다.\n\n대통령은 법안에 서명하면서, 지난 일을 잠시 내려놓을 뿐이며 이 나라가 더 단단해지면 다시 꺼내 보게 된다는 짧은 담화를 냈다.\n\n사면법에 반대한 의원은 많지 않았다. 반대표를 던진 의원 가운데 한 사람은 본회의장을 나서며 기자들에게, 덮어 둔 상자는 언젠가 누군가 반드시 연다고 말했다. 그 말은 그날 뉴스에 나왔다.\n\n협약 뒤로 국회는 조용해졌다. 서로를 고발하던 일이 줄었고, 법안은 전보다 빨리 넘어갔다. 국회 지하 문서고에는 겉면에 날짜만 적힌 상자들이 봉인된 채 쌓였다."
 tfrkphn.7049.d:0 "국회 사랑재의 긴 탁자에 모든 정당의 대표가 앉았다. 무너졌던 두 거대 정당과 제3지대 연합, 정의당, 우리공화당의 대표가 한자리에 모인 적은 그전까지 없었다. 탁자 위에는 경제 재건 협약과 헌정 원칙 협약이라는 두 장의 문서가 놓였다.\n\n경제 재건 협약에는 임금과 물가를 함께 묶어 두고, 그 대신 복지와 일자리를 넓힌다는 약속이 담겼다. 헌정 원칙 협약에는 군과 정보기관을 정치에서 떼어 놓고, 어떤 정당도 선거 결과에 불복하지 않는다는 약속이 담겼다.\n\n협상은 석 달 동안 이어졌다. 임금을 묶는 조항에서 노동계가 등을 돌릴 뻔했고, 군 조항에서는 우리공화당이 자리를 박차고 나갈 뻔했다. 그때마다 대통령실은 회의를 다음 날로 미뤘을 뿐 협상을 끝내지는 않았다.\n\n서명은 오후 늦게 시작됐고 우리공화당 대표가 맨 마지막으로 서명했다.\n\n대통령은 서명식이 끝난 뒤, 오늘 이긴 사람이 없으니 오늘을 이 나라의 첫날로 삼자는 짧은 담화를 냈다. 서명이 끝난 문서는 그날 밤 국회 홈페이지에 그대로 올라갔다."
 tfrkphn.7050.d:0 "국민투표 날 아침 투표소마다 줄이 길었다. 투표용지는 일곱 사람이 쓴 헌법에 찬성하는지만 물었다.\n\n새 헌법에는 일곱 사람의 요구가 조금씩 들어갔다. 일곱 사람 가운데 자기 요구를 모두 관철한 사람은 없다. 대통령의 권한은 줄었고 국회의 권한은 나뉘었다. 비례대표가 의석의 절반을 차지하고, 군은 정치에서 영원히 떨어진다. 그리고 23대 총선과 함께 새 체제로 넘어가며 지금의 대통령은 그때 물러난다는 경과 조항이 붙어 있었다.\n\n자신의 임기를 줄이는 헌법을 대통령이 앞장서 내놓았다는 사실을 두고 말이 많았다. 권력을 쥐고 있지 않으려는 사람이라는 말도 있었고, 순진한 사람이라는 말도 있었다.\n\n투표 전날 밤, 헌법의 일곱 사람은 함께 텔레비전 토론에 나왔다. 그들은 서로 다른 당에서 왔고, 조문마다 다른 생각을 가지고 있었다. 그러나 그날 밤에는 일곱 사람 모두 이 헌법으로 이긴 쪽은 없다고 말했다.\n\n개표가 끝났다. 찬성이 많았다. 압도적이지는 않았지만 분명했다. 대통령은 결과 화면을 보고 짧게 고개를 끄덕였다."
 tfrkphn.7051.d:0 "23대 총선의 개표가 끝났다. 국회에는 일곱 개의 정당이 자리를 얻었다. 어느 당도 과반을 넘지 못했고, 다음 날부터 연정 협상이 시작됐다. 두 당이 번갈아 정권을 잡던 국회 지형이 이번 선거로 바뀌었다.\n\n새 국회가 열리던 날 아침, 대통령은 마지막 국무회의를 마치고 청사를 나섰다. 그는 헌법에 적힌 대로 남은 임기를 내려놓았다. 재선에 나서라는 요구도 있었지만 그는 끝내 받아들이지 않았다.\n\n청사 앞에는 사람들이 모여 있었다. 몇 해 전 여의도의 비를 맞으며 바리케이드를 지켰던 사람들도 그 안에 섞여 있었다. 그들은 박수를 쳤다. 그는 차에 오르기 전에 한 번 뒤를 돌아보았다.\n\n새 국회의 첫 본회의는 몇 해 전 총성이 울렸던 그 본회의장에서 조용히 열렸다. 천장에 남아 있던 총탄 자국은 메우지 않고 그대로 두기로 했다. 의원들은 그 아래에서 선서를 했다.\n\n그날 저녁 여의도 표지석 앞에는 꽃이 쌓였다. 꽃다발 사이에 누가 두고 간 쪽지에는 \"수고하셨습니다\" 한 줄이 적혀 있었다."
 tfrkphn.7052.d:0 "23대 총선 개표가 끝나자 국회는 열 개가 넘는 정당으로 쪼개졌고 어느 당도 다른 당과 연정을 꾸리려 하지 않았다. 정당들은 공개된 기록에 나온 이름들을 두고 선거 내내 서로를 고발했다.\n\n대통령은 새 헌법이 정한 날에 약속대로 물러났다. 연정 협상은 석 달이 지나도 끝나지 않았고 그동안 거리의 집회가 다시 커졌다. 총리 후보 표결은 두 번 부결됐다.\n\n사람들은 그를 나라를 연 사람이라고도 했고 나라를 흩어 놓은 사람이라고도 했다. 그가 한 약속은 대부분 법에 남았지만 그 법을 집행할 정부가 서지 못했다.\n\n새 국회의 첫 본회의는 고성으로 시작됐다. 몇 해 전 총성이 울렸던 천장 아래에서 의원들은 다시 서로에게 손가락질을 했고, 의장은 개회 한 시간 만에 정회를 선포했다.\n\n우원식은 고향으로 내려갔다. 여의도에서는 국회가 정부를 세우지 못하니 다음 대통령 선거에서 나라를 다시 묶을 사람을 뽑아야 한다는 말이 나오기 시작했다. 신문들은 우원식 내각에서 일했던 장관들과 연정에 남은 보수 원로의 이름을 다음 후보로 꼽았다."
 tfrkphn.7053.d:0 "문을 너무 빨리 열었다는 말이 정부 안에서도 나오기 시작했다. 공개된 문서마다 새 이름이 나왔고, 이름이 나올 때마다 누군가는 거리로 나섰다. 어떤 이는 처벌을 요구했고, 어떤 이는 공개를 멈추라고 했다.\n\n지방의 한 도시에서는 문서에 이름이 오른 전직 지휘관을 지지하는 집회와 그를 규탄하는 집회가 같은 광장에서 맞붙었다. 경찰이 그 사이에 섰다. 다친 사람이 여럿 나왔다.\n\n여당 없는 대통령에게 기댈 곳은 많지 않았다. 국회의 여러 정당은 저마다 속도를 늦추라고 했고, 시민 단체들은 멈추면 배신이라고 했다.\n\n공개를 멈추라는 쪽에는 뜻밖에 전직 관료들과 군 원로들이 많았다. 그들은 국가 안보를 이유로 들었다. 공개를 계속하라는 쪽에는 유족들과 젊은 기자들이 많았다. 양쪽 모두 대통령이 자기 편이라고 믿고 있었다.\n\n대통령은 다음 날 짧은 담화를 냈다. 문을 닫지는 않겠지만 한 번에 다 열지도 않겠다는 내용이었다. 그 말에 안도한 사람도 있었고, 실망한 사람도 있었다."
 tfrkphn.7055.d:0 "취임 열흘 만에 첫 국무회의가 열렸다. 국무위원들은 출신 정당과 경력이 저마다 달랐다. 무너진 두 거대 정당에서 온 사람, 제3지대 연합과 정의당에서 온 사람, 그리고 어느 당에도 속하지 않은 관료와 학자들이었다. 대통령은 당을 보지 않고 사람을 골랐다고 했다.\n\n국방부 장관 자리에는 전차를 돌려 세웠던 그 사흘 동안 병력을 움직이지 않았던 장군이 앉았다. 법무부 장관은 진보 쪽 변호사 출신이었고, 기획재정부 장관은 홍준표 정부에서 일했던 관료였다. 신문들은 그 명단을 두고 짜깁기라고도 했고, 처음 보는 내각이라고도 했다.\n\n첫 회의의 안건은 하나였다. 무엇부터 고칠 것인가. 장관들은 저마다 자기 부처의 일이 가장 급하다고 했다. 대통령은 회의가 끝날 무렵, 다툼은 이 방 안에서 끝내고 문밖으로는 한 목소리로 나가자고 짧게 말했다.\n\n국무위원 가운데 우리공화당 출신은 없었다. 대통령은 그 당에도 자리를 제안했지만 당은 받지 않았다.\n\n회의는 네 시간 만에 끝났다. 회의록은 그날 밤 그대로 공개됐다."
 tfrkphn.7056.d:0 "여의도의 바리케이드가 마침내 치워졌다. 사흘 밤을 지켰던 시민들이 직접 나와 버스와 펜스를 옮겼다. 전차가 지나간 아스팔트는 새로 깔기로 했지만, 국회 앞 한 구간만은 그대로 두었다. 그 자리에는 작은 표지석이 섰다.\n\n대통령은 그날 아침 경찰과 군의 지휘관들을 대통령실로 불렀다. 그 사흘 동안 명령을 따랐던 사람도 있었고, 따르지 않았던 사람도 있었다. 대통령은 누구도 내쫓지 않았다. 대신 앞으로 헌법을 거스르는 명령은 누구의 것이든 따르지 말라는 지시를 문서로 남겼다.\n\n오후에는 그 사흘 동안 다친 사람들의 병실을 찾았다. 시민도 있었고, 경찰도 있었고, 젊은 병사도 있었다. 대통령은 병실마다 오래 머물렀다. 카메라는 병실 밖에서 기다렸다.\n\n그날 저녁 대통령은 담화에서 그 사흘을 다시는 되풀이하지 않을 날로 기억하자고 말했다. 담화는 여의도의 바리케이드가 있던 자리에서 생중계됐다. 담화는 오 분이 채 걸리지 않았다.\n\n밤이 되자 국회의사당의 불이 하나둘 켜졌다. 국회는 다음 날 아침부터 다시 문을 연다."
 tfrkphn.7057.d:0 "기획재정부가 패전의 계산서를 처음으로 공개했다. 전쟁 빚과 끊긴 수출, 피난민 지원과 무너진 항구를 모두 더한 숫자였다. 숫자는 신문 1면에 그대로 실렸다. 그동안 어느 정부도 이 숫자를 한 장에 모아 보여 준 적이 없었다.\n\n정부는 같은 날 긴급 재정 계획을 내놓았다. 고소득층과 대기업의 세금을 몇 해 동안 한시적으로 올리고, 그 돈으로 일자리와 피난민 정착을 먼저 돕는다는 내용이었다. 브뤼셀의 유럽 개발 은행에는 재건 차관을 요청했다.\n\n반발이 없지는 않았다. 경제 단체들은 세금이 기업을 내쫓을 것이라고 했고, 노동 단체들은 그래도 모자라다고 했다. 대통령은 두 단체의 대표를 같은 날 같은 방으로 불렀다.\n\n첫 차관은 석 달 뒤에 들어왔다. 브뤼셀은 돈이 어디에 쓰이는지 매달 공개하라는 조건을 붙였다. 정부는 그 조건을 기꺼이 받아들였다.\n\n그 주말, 시장의 상인들은 처음으로 정부가 숫자를 숨기지 않는다는 이야기를 주고받았다. 한 생선 가게 주인은 \"숫자가 나빠도 알고 당하는 게 낫지\" 하며 신문을 접었다."
 tfrkphn.7058.d:0 "주말의 광화문은 여전히 둘로 나뉘어 있었다. 한쪽에는 파면된 대통령을 그리워하는 태극기가, 다른 쪽에는 그를 끌어내린 시민들의 깃발이 있었다. 두 광장 사이에는 경찰 버스가 줄지어 서 있었다.\n\n대통령은 그 토요일, 경호원 몇만 데리고 태극기 집회 쪽으로 걸어갔다. 고함이 터졌고, 물병이 날아왔다. 그는 멈추지 않았다. 집회 무대 아래에서 그는 사람들의 이야기를 한 시간 넘게 들었다. 일자리를 잃은 사람, 아들을 전쟁에서 잃은 사람, 아무도 자기 말을 들어 주지 않았다는 사람이었다.\n\n군중 사이에 김창수가 있었다. 그는 대통령에게 끝내 다가가지 않았지만, 그날 처음으로 깃발을 내린 채 집회가 다 끝날 때까지 서 있었다.\n\n대통령실 참모들은 그날 일정에 반대했었다. 대통령은 다른 쪽 광장에도 똑같이 걸어갔고, 그쪽에서도 고함과 박수가 함께 나왔다. 그는 두 광장 어느 쪽에도 연설하지 않았다. 그는 듣기만 했다.\n\n다음 주 광화문에서는 두 광장 사이의 경찰 버스가 한 줄 줄었다."
 tfrkphn.7061.d:0 "여의도 국회 소통관 기자실, 오후 세 시.\n\n새 헌법에 따른 첫 대선 날짜가 적힌 선관위 공고문이 팩스로 들어오자 기자들이 우르르 몰려들었다. 우원식은 헌법을 되살리는 데까지만 하겠다며 일찌감치 불출마를 못 박아 두었으니, 이제 남은 건 누가 나오느냐뿐이었다.[TFRKPHN_sk_start]\n\n\"김부겸이 내일 대구에서 한답니다.\" \"벌써? 그 양반 대구에서 몇 번 떨어졌는데.\" \"그러니까 대구에서 하는 거지.\"\n\n김부겸은 정말로 이튿날 대구에서 출마를 선언했다. 낡은 판을 깬 자리에 새 판을 짤 사람이 필요하다고 그는 말했다. 이틀 뒤에는 우원식 정부에서 경제를 맡았던 김동연이 패전의 빚부터 갚아야 한다며 뒤따라 나섰다. 여의도의 사흘 동안 같은 편에 섰고 국무회의에서도 나란히 앉았던 두 사람은, 이번에는 연정을 떠나 신민당을 함께 세우고 한 당 안에서 후보를 다투기로 했다.\n\n헌정회복연대에 남은 의원들은 보수 원로 김무성을 내세웠다. 김무성은 출마 회견을 마치자마자 연정을 떠날까 말까 저울질하던 의원들 사무실에 차례로 전화를 돌렸다."
 tfrkphn.7062.d:0 "잠실 학생체육관, 신민당 후보 지명 전당대회.\n\n1차 투표 결과가 전광판에 뜨자 체육관이 한꺼번에 들썩였다가 이내 조용해졌다. 김부겸이 앞섰지만 과반에 몇십 표가 모자랐다. 투표함에서는 아무 이름도 안 적은 백지표가 꽤 나왔다.\n\n결선을 앞둔 밤, 김동연 캠프 사람들이 3위를 한 중진 의원의 호텔 방문을 두드렸다. 그들은 자리 대신 패전의 빚을 어떤 순서로 갚고 누가 얼마씩 떠안을지 적은 계산서 한 장을 내밀었다. 새벽이 되자 그 의원 쪽 대의원들이 김동연한테 넘어간다는 말이 돌았다.\n\n\"결선 미룹시다. 이건 공작입니다.\" \"공작은 무슨. 정해진 날 하면 됩니다.\"\n\n체육관 복도에서 두 캠프 대의원들이 멱살 직전까지 갔다. 당 지도부는 새벽 회의 끝에 결선을 무기한 미룬다고 발표했다.\n\n체육관 앞에는 두 캠프 버스가 나란히 서 있었다. 몇 달 전 같이 당을 세우고 같은 버스로 올라왔던 사람들이 그날 밤엔 각자 다른 버스에 올랐다. 이튿날 여론조사에서 두 사람은 따로 나가면 누구도 김무성을 못 넘었다. "
 tfrkphn.7063.d:0 "결선이 멈추자 신민당 원로들은 후보 지명권을 당 대표에게 넘기라고 두 사람을 다그쳤다. 두 사람 다 대의원이 안 뽑은 후보로는 선거를 못 치른다며 버텼고, 결국 결선 대신 협상으로 후보를 정하기로 했다.\n\n첫 협상은 의원회관 작은 회의실에서 열렸다. 김부겸 쪽은 여론조사로 정하자고 했고 김동연 쪽은 정책부터 맞추자고 했다. 네 시간을 싸우고 다음 회의 날짜 하나만 정했다.\n\n\"오늘 뭐 나왔어요?\" \"날짜요.\" \"그게 다예요?\" \"그게 다예요.\"\n\n퇴임한 우원식은 두 사람이 차례로 찾아와도 누구 손도 들어 주지 않았다. 후보는 둘이서 직접 정해야 한다는 말만 했다. 당 원로들은 두 사람이 갈라서면 당이 무너진다며 밤마다 양쪽 캠프에 전화를 넣었고, 어떤 원로는 둘을 아예 자기 집으로 불러 된장찌개를 끓여 먹이기도 했다.\n\n후보 등록까지 다섯 주가 남아 있었다. 그 안에 한 사람으로 못 줄이면 신민당 표는 둘로 쪼개진다. 김무성 캠프는 협상 소식이 날 때마다 여론조사를 새로 돌려 상황실 벽에 붙였는데, 벽이 금방 종이로 덮였다."
 tfrkphn.7064.d:0 "다섯 주 만에 협상이 타결됐다. 두 사람은 같이 회견장에 나와 공동 정부를 꾸리고 경제와 개혁을 나눠 맡는다는 합의문을 읽었다. 누구 이름을 투표용지에 올릴지는 그때까지도 못 정했다. 합의문 마지막 줄은 빈칸이었다.\n\n여론조사로는 오차 범위 안이라 두 사람은 마지막으로 단둘이 만나 정하기로 했다. 회동은 자정을 넘겼다. 먼저 나온 비서실장들은 기자들이 물어도 고개만 저었다.\n\n\"한 시간째예요. 둘이 뭐 하는 거야?\" \"싸우는 소리는 안 나던데.\" \"그게 더 무섭지.\"\n\n한 시간 뒤 두 사람이 함께 문을 열고 나왔다. 회견장 단상 앞에서 누가 먼저 마이크를 잡을지 잠깐 서로 눈치를 봤고, 플래시가 그 순간을 다 찍었다. 다음 날 아침 신문 일 면에 두 사람이 맞잡은 손을 높이 든 사진이 실렸고, 사진 밑에 후보 한 사람의 이름이 굵게 박혔다.\n\n그날 밤 김무성 캠프 상황실에서는 아무도 퇴근하지 못했다. 연정에 남은 표만으로는 하나가 된 신민당을 넘기 어려웠다. 참모들은 누가 후보로 나와도 쓸 수 있게 연설문을 두 벌씩 고쳐 썼다."
 tfrkphn.7065.d:0 "개표가 끝나자 단일 후보 김부겸이 김무성을 넉넉하게 앞섰다. 대구와 광주에서 비슷한 득표율이 나왔다.\n\n선거 내내 김부겸 대신 지방 유세를 돌던 김동연은 개표 방송이 끝나기도 전에 캠프로 달려왔다. 그는 지지자들 앞 단상에서 김부겸의 손을 잡아 번쩍 들었고, 약속대로 경제부총리로 내각에 들어가기로 했다. 김무성은 짧은 회견에서 패배를 인정하고 연정이 다시 일어설 길을 찾겠다고 했다. 그의 뒤에 선 의원 수가 캠프 예상보다 많았다.\n\n취임식은 국회 앞마당에서 열렸다. 정문 앞 아스팔트에는 그 사흘 동안 전차가 남긴 바퀴 자국 한 줄이 아직 있었다. 새 대통령은 선서를 마치고 그 자국 앞에 한참 서 있었다.\n\n\"대구서 왔능교?\" \"광주요. 아재는요?\" \"대구. 희한하네, 우리가 한 줄에 다 서 있고.\"\n\n대구 사람들과 광주 사람들이 한 줄에 서서 애국가를 불렀다. 김부겸은 집무실에 들어가자마자 군 인사 자료부터 가져오라고 했다. 여의도의 사흘 동안 명령을 내린 사람들과 그 명령을 따른 사람들이 아직 군복 차림으로 출근하고 있었다."
 tfrkphn.7066.d:0 "개표가 끝나자 단일 후보 김동연이 김무성을 넉넉하게 앞섰다. 공장 지대와 항구 도시에서 표가 많이 나왔는데, 하나같이 패전 빚을 제일 크게 떠안은 동네들이었다.\n\n선거 내내 김동연 대신 지방 유세를 돌던 김부겸은 개표 방송이 끝나기 전에 캠프로 와서 지지자들 앞 단상에서 김동연의 손을 번쩍 들었다. 그는 약속대로 국무총리를 맡기로 했다. 김무성은 짧은 회견에서 패배를 인정했다. 그 뒤에 선 의원 수는 캠프 예상보다 많았다.\n\n취임식은 국회 앞마당에서 열렸다. 새 대통령은 취임사에서 갚을 빚, 다시 열 항구, 되살릴 일자리 수를 하나씩 숫자로 읽었다.\n\n\"취임사에 숫자가 몇 개 나왔는지 세 봤어요?\" \"세다가 포기했어요.\" \"저 양반 원래 저래요. 결혼식 축사도 숫자로 할걸.\"\n\n식장을 빠져나가던 사람들이 그렇게 웃었다. 김동연은 첫 지시로 빚 갚는 순서와 세금 걷는 순서를 종이 한 장에 정리해 오라고 했다. 기획재정부 직원들은 그 주 내내 자정 넘어 퇴근했고, 청사 앞 편의점은 처음으로 밤새 문을 열었다."
 tfrkphn.7067.d:0 "협상은 끝내 깨졌다. 김동연을 따르는 의원들이 신민당을 나가 새 당을 차렸고, 후보 등록 마감일에 두 사람은 한날 따로 서류를 냈다. 지지자들은 서로를 배신자라고 불렀다.\n\n선거 운동 내내 두 사람은 김무성보다 서로를 더 자주 때렸다. 마지막 주 여론조사에서는 세 후보가 모두 오차 범위 안에 들었다. 개표 결과 김무성이 1위를 했다. 두 김씨 표를 합치면 그를 훌쩍 넘었지만 투표용지에는 두 이름이 따로 있었고, 김무성 쪽 표는 처음부터 끝까지 한 사람에게 몰렸다.\n\n개표 방송을 보던 신민당 의원들은 하나둘 자리를 떴다. 당을 같이 세운 지 몇 달 만이었다.\n\n\"선배, 이거 어디서 본 것 같지 않아요?\" \"봤지. 87년에.\" \"그다음엔 어떻게 됐어요?\" \"묻지 마라.\"\n\n정치부에 오래 있던 기자 둘이 국회 흡연실에서 그렇게 주고받았다. 두 김씨는 그날 밤 서로 전화하지 않았다. 새 대통령은 당선 소감에서 두 사람에게 같이 일하자고 제안했고, 소감을 마친 뒤 캠프 사람들과 일일이 악수했다. 악수는 새벽 세 시가 넘어서야 끝났다."
 tfrkphn.7069.d:0 "역대 대통령은 국회 앞마당에서 취임했다. 대통령실은 국민 앞에서 선서하겠다며 취임식을 광화문에서 열었고, 무대는 매주 집회가 열리던 바로 그 자리에 세웠다. 광장은 아침부터 태극기로 가득 찼다. 새벽 첫차를 타고 지방에서 올라온 버스들이 종로까지 줄지어 섰다.\n\n귀빈석에는 국회의원들의 이름표가 나란히 놓여 있었지만 자리에 앉은 의원은 몇 사람밖에 없었다. 방송 카메라는 몇 번이나 빈 의자들을 비췄고, 광장의 사람들은 그 화면을 보며 야유를 보냈다. 몇몇 의원은 참석 여부를 끝내 밝히지 않았다.\n\n선서가 끝나자 함성이 광장을 덮었다. 군악대가 행진곡을 연주했고, 하늘에는 공군 편대가 지나갔다. 몇 달 전 패전 소식이 들려오던 바로 그 하늘이었다. 사람들은 고개를 들고 오래 박수를 쳤다.\n\n같은 시각 여의도의 본회의장은 문이 닫혀 있었다. 국회 사무처는 취임식 중계를 켜 두지 않았다. 본회의장 앞 복도에는 기자 몇 명만이 서성였다."
 tfrkphn.7071.d:0 "기득권 청산 위원회는 개전 당시 지상작전을 맡았던 퇴역 육군 대장에게 첫 소환장을 보냈다. 위원회는 출석일을 일주일 뒤로 정했고, 그 날짜는 방송으로 미리 알려졌다. 위원회 사무실에는 축하 화환이 늘어섰다.\n\n출석일 아침 위원회 청사 앞에는 취재진과 태극기를 든 사람들이 몰렸다. 오전 열 시가 지나고 정오가 지났다. 퇴역 대장은 나타나지 않았다. 그의 변호인이 보낸 한 장짜리 서면만 도착했다. 기다리던 사람들은 해가 질 무렵까지 자리를 뜨지 않았다.\n\n서면에는 위원회가 대통령령으로 만들어져 법률의 근거가 없으니 누구를 부를 권한도 없다고 적혀 있었다. 법학자 여럿이 같은 의견을 냈다. 위원장은 다음 날 강제 구인을 검토하겠다고 밝혔다. 언론은 그 말을 머리기사로 실었다.\n\n경찰은 영장 없이 움직일 수 없다고 했다. 법원은 영장 청구를 받아 주지 않았다. 그 주 토요일 광화문 무대에서는 영장을 기각한 판사의 이름이 처음으로 불렸다. 다음 소환 대상자 명단은 이미 위원회 책상 위에 올라 있었다."
 tfrkphn.7072.d:0 "토요일 오후 광화문은 다시 태극기로 덮였다. 대통령실이 마련한 무대와 음향 장비 덕분에 연설은 세종대로 끝까지 울렸다. 주최 측은 백만 명이 모였다고 했고, 경찰은 숫자를 내놓지 않았다. 무대 뒤편에는 대통령의 대형 사진이 걸렸다.\n\n같은 시각 여의도 국회 앞에는 다른 사람들이 모였다. 촛불과 손팻말을 든 사람들이었다. 그들은 국회를 지키자고 외쳤다. 그 가운데에는 낡은 군복을 입은 상이군인들도 섞여 있었다. 두 집회는 지하철로 이십 분 떨어진 곳에서 열렸다.\n\n경찰은 마포대교와 서강대교 앞에 버스를 세워 벽을 쳤다. 다리를 건너려던 양쪽 행렬이 버스 앞에서 멈췄고, 해가 질 때까지 고성이 오갔다. 몇 명이 다쳤고, 몇 명이 연행됐다. 버스 지붕 위에는 양쪽에서 던진 물병이 쌓였다.\n\n저녁 뉴스는 화면을 둘로 나눠 두 광장을 함께 보여 줬다. 화면 왼쪽과 오른쪽에서 거의 같은 크기의 함성이 들렸다. 그날부터 사람들은 토요일마다 어느 쪽 다리를 건널지 정해야 했다. 가족끼리도 식탁에서는 그 이야기를 꺼내지 않게 됐다."
 tfrkphn.7073.d:0 "청년 애국단은 처음엔 집회의 질서를 맡았다. 노란 완장을 차고 행렬을 정리했고, 방송은 그들을 성실한 청년들이라고 소개했다. 모집 공고에는 수천 명이 몰렸다. 대통령실은 그들에게 숙소와 밥을 내주었다.\n\n두 달쯤 지나자 완장을 찬 청년들이 광장 밖으로 나갔다. 그들은 몽둥이를 들고 노조 사무실과 시민단체 사무실을 찾아갔다. 문을 부수고 들어가 서류를 바닥에 쏟아 놓았고, 나오면서 벽에 멸공이라는 두 글자를 크게 써 놓았다.\n\n그들이 누구를 좌익이라고 부르면 그 사람은 좌익이 됐다. 지방으로 내려간 단원들은 경찰서 한쪽에 사무실을 얻었고, 경찰은 그들을 말리지 않았다. 가게 주인들은 애국 성금이라는 이름으로 돈을 내야 했다. 내지 않은 가게의 유리창은 다음 날 아침 깨져 있었다.\n\n신문 한 곳이 그들의 행패를 보도했다. 그 주 토요일 신문사 앞에 노란 완장 수백 개가 모였고, 다음 호에는 사과문이 실렸다. 사람들은 이제 노란 천 조각이 보이면 길을 건넜다. 그 완장이 어디까지 들어갈 수 있는지 아는 사람은 없었다."
 tfrkphn.7074.d:0 "대통령은 국회가 의결한 법안에 열한 번째로 거부권을 행사했다. 국회는 재의결에 나섰지만 정족수를 채우지 못했고, 법안은 그대로 폐기됐다. 예산안도 석 달째 묶여 있었다. 의원회관 복도에는 반송된 법안 사본이 쌓였다.\n\n그날 저녁 국회의장 우원식이 대국민 담화를 냈다. 그는 국회 정문 앞에 나와 담화문을 읽었다. 그는 대통령의 거부권도 헌법이 준 권한이지만, 국회를 멈추는 데 쓰여서는 안 된다고 말했다. 그의 뒤로는 국회 경위 몇 명만이 서 있었다.\n\n그는 여야를 가리지 않고 의원들에게 본회의장으로 돌아오라고 했다. 거리에 나간 국민들에게는 다리를 건너지 말고 투표함으로 오라고 했다. 담화는 칠 분이었고, 그는 한 번도 대통령의 이름을 부르지 않았다.\n\n대통령실은 논평하지 않았다. 광화문 무대에서는 국회의장을 향한 야유가 나왔다. 그러나 그날 밤 국회 앞에 모인 사람들은 처음으로 광화문보다 많았고, 국회 사무처의 불은 새벽까지 꺼지지 않았다. 다음 날 의원 몇 명이 조용히 본회의장으로 돌아왔다."
 tfrkphn.7075.d:0 "예산안 없이 나랏돈을 집행하라는 대통령령이 내려왔다. 집행 명령서에는 각 부처 차관의 서명이 필요했다. 첫날 서명을 마친 부처는 절반이 되지 않았고, 나머지 결재판은 차관실 책상 위에 그대로 놓여 있었다. 국무회의는 그 결재판들을 두고 두 시간 동안 말이 없었다.\n\n사흘째 되는 날 경제 부처의 차관 한 명이 사표를 냈다. 다음 날 두 명이 더 냈다. 그들은 기자들 앞에 서지 않았고, 사표에는 개인 사정이라고만 적혀 있었다. 대통령실은 사표를 바로 수리했다.\n\n빈자리는 대통령실 비서관들이 채웠다. 새 차관들은 첫날 명령서에 서명했다. 그러나 과장과 국장들이 결재 서류를 올리지 않았다. 공무원들은 거부한다는 말 없이 일을 멈췄다. 세종시의 사무실들에는 키보드 소리만 낮게 이어졌다.\n\n공무원 노조는 성명을 내지 않았다. 대신 점심시간마다 청사 앞 벤치에 앉은 사람들이 늘어났다. 연금 지급일이 다가오고 있었다. 명령은 위에서 내려와도 돈을 지급하는 일은 아래 직원들이 했다. 은행들은 정부 계좌의 지급을 하루씩 미루기 시작했다."
 tfrkphn.7076.d:0 "국방부가 수도권 지휘관 인사를 발표했다. 수도방위사령관과 특수전사령관, 그리고 수도권의 기갑여단장 여럿이 한꺼번에 바뀌었다. 새 지휘관들은 대부분 광화문 무대에 자주 서던 예비역들과 가까운 사람들이었다. 발표는 금요일 밤 늦게 나왔다.\n\n교체된 장군들 가운데 몇은 그날 바로 전역 신청서를 냈다. 이임식도 열지 않았다. 몇은 새 보직을 받아들이고 조용히 짐을 쌌다. 국방부는 정상적인 인사라고 했고, 그 이상의 설명은 없었다. 군 관사 앞에는 이삿짐 트럭이 줄지어 섰다.\n\n한 기갑여단장은 달랐다. 그는 명령서를 받았지만 부대를 떠나지 않았다. 후임자가 부대 정문에 도착했을 때, 위병소는 출입 명단에 그 이름이 없다고 했다. 후임자는 차를 돌려 돌아갔다. 그 장면은 누군가의 휴대전화에 찍혀 다음 날 아침 퍼졌다.\n\n다음 날 여단장은 명령서의 절차를 확인하고 있다는 짧은 보고를 올렸다. 국방부는 그를 징계하지 않았다. 그가 지휘하는 부대는 여의도에서 가장 가까운 기갑부대여서 국방부도 그를 함부로 건드리지 못했다."
 tfrkphn.7077.d:0 "그날 행사장 맨 앞줄에 나도 있었다. 지방 순방 중인 대통령의 모습이 이상했다. 처음에는 나이 들면 다 그런 줄 알았다. 하지만 오늘은 말이 자꾸 끊겼고, 대통령은 두 손으로 연단을 붙잡고 한참 서 있었다. 연설은 급하게 마무리되었다.\n\n나는 이 모든 걸 영상으로 찍어 커뮤니티에 올렸다. 잠시 후 이 글은 추천을 잔뜩 받았고 다른 커뮤니티로도 퍼졌다. 몇 시간 뒤에는 뉴스에서도 내 영상을 써 가며 대통령 건강이상설을 보도하기 시작했다."
 tfrkphn.7078.a:0 "레알 크크"
 tfrkphn.7078.d:0 "실시간 본인 병원에서 이인제 봄\n\n나 군 병원에 면회 왔는데 갑자기 경찰들 들이닥쳐서 사람들 물러나게 하더니 잠시 후 대통령 쓰러진 채로 오더라\n이거 나라 좆된 거임?\n\n> 지랄 노노\n> 대통령이 쓰러졌다고? 차라리 다음엔 죽었다고 해라\n> 걱정 마라 피닉제는 안 죽음"
 tfrkphn.7079.d:0 "새벽 네 시, 전화를 받은 정진석에게 그날은 인생 최악의 날이었다. 그도 권력의 최정상에 오르고 싶어 했지만, 이런 식으로는 아니었다.\n\n오전 일곱 시 대통령실 대변인이 단상에 섰다. 대통령이 과로로 쓰러져 끝내 세상을 떠났다고 발표했다. 발표문은 세 문장으로 끝났다. 대변인은 질문을 받지 않았고 기자들은 한동안 자리에 그대로 앉아 있었다. 일 분쯤 지나서야 누군가 먼저 자판을 두드리기 시작했다.\n\n집무실 책상 위에는 한 사람의 온기가 아직 남아 있었다. 어제까지만 해도 그는 이 자리에 있었지만 이제는 없다. 정진석은 그 어느 때보다 혼란스러웠다.\n비서관이 물었다.\n책상 위를 치울까요?\n아니, 아직은 하지 마. 그분도 마지막으로 정리는 해야지.\n\n헌법에 따라 국무총리가 대통령의 권한을 대행한다. 정진석은 그날 오전 국무회의를 열고 국정의 공백은 없을 것이라고 밝혔다. 그는 대통령이 앉던 자리에 앉지 않았다. 국무회의는 묵념으로 시작됐다."
 tfrkphn.7082.d:0 "의원회관 7층 복도에 빈 상자가 산더미처럼 쌓였다. 김부겸을 따르는 옛 민주당 사람들과 김동연을 따르는 제3지대 의원들이 같은 날 짐을 쌌다.\n\n\"보좌관님, 이 액자는 어떡합니까?\" \"민주당 로고 박힌 건 다 버려. 어차피 못 쓴다.\"\n\n옛 민주당 사람들은 돌아갈 당이 없었다. 조원진 정부가 낸 해산 심판으로 민주당은 강제로 해산됐고, 법은 해산된 당의 이름과 강령을 다시 못 쓰게 막아 놓았다. 두 세력은 창당준비위원회를 따로 꾸렸다가, 야당이 둘로 나가면 헌정회복연대를 못 이긴다는 여론조사가 나오자 양쪽 대표 네 사람이 사흘을 붙어 앉아 합당에 도장을 찍었다. 당 이름은 오래전 두 야당이 합쳐 만들었던 통합 야당에서 따와 신민당으로 정했다. 대표는 어느 김씨 쪽에도 안 속한 원로 헌법학자가 맡았고, 후보는 전당대회에서 대의원 투표로 뽑기로 했다.\n\n창당대회 날 두 김씨는 단상 양쪽 끝에 앉아 박수를 쳤다. 김무성은 그날 밤 중계를 끝까지 보고 나서 연정에 남은 의원들에게 다시 전화를 돌렸다."
 tfrkphn.7083.d:0 "국방부 청사, 오전 여덟 시.\n\n김부겸은 취임 열하루째 되는 날, 여의도의 사흘 동안 전차를 움직였던 장성들을 한꺼번에 내보냈다. 정권이 두 번 바뀌는 동안 군에 남아 있던 이들이다.\n\n장성들은 여느 날처럼 관용차에서 내려 경례를 받으며 계단을 올랐다. 여덟 시 정각, 오늘 날짜로 전역을 명한다는 한 줄짜리 명령이 내려왔다. \"이게 무슨 뜻입니까.\" 한 소장이 따져 묻는 사이 청사 앞에는 방송 차량들이 몰려왔고, 전역 장성 명단은 점심 전에 군 관사 단톡방마다 돌았다.\n\n\"야, 박 병장. 우리 사단장님 오늘 집에 일찍 가신다.\" \"예? 왜 말입니까?\" \"뉴스 봐라.\"\n\n오전에 국방부 대변인은 정기 인사를 당겼을 뿐이라고 했다. 오후에는 대통령이 직접 카메라 앞에 섰다.\n어떤 이유로 정당화하든, 여의도의 사흘은 반헌법적 쿠데타였습니다. 힘으로 헌법을 누르는 방식은 결코 받아들일 수 없습니다. 군인 여러분께 호소합니다. 높은 시민 의식을 보여 주십시오.\n\n부총리 김동연은 회의를 미루고 환율 화면만 지켜봤다. 하루에 장성 마흔 명 남짓이 군복을 벗었고, 퇴역 군인 단체는 이튿날 국방부 앞 집회를 신고했다."
 tfrkphn.7084.d:0 "저녁 일곱 시 반, 대통령실이 방송사들에 여덟 시 특별 담화를 통보했다. 주제를 모르는 보도국들은 일단 정규 방송을 끊을 준비부터 했고, 같은 시각 은행연합회에는 전 지점 책임자를 자리에 붙잡아 두라는 공문이 내려갔다.\n\n여덟 시 정각, 화면에 나온 대통령은 내일 아침부터 모든 금융 거래를 실제 이름으로만 하게 된다고 발표했다. 남의 이름을 빌린 계좌는 두 달 안에 안 바꾸면 묶인다. 담화는 사 분이 채 안 걸렸다.\n\n강남의 한 사무실에서는 전화에 불이 났다.\n\n\"지금 바꾸면 다 드러납니다, 회장님.\" \"그럼 묶이게 둬? 그게 얼만데!\" \"제 말은, 그러니까...\" \"그러니까 뭐!\"\n\n부총리 김동연은 그날 밤 은행장들을 불러 내일 아침 창구 하나라도 멈추면 안 된다고 했다. 은행원들은 집에 못 가고 전산을 고쳤다. 이튿날 아침에는 은행 문이 열리기도 전에 창구 앞에 줄이 길게 늘어섰다.\n\n차명 계좌 주인들이 그 주부터 하나둘 은행에 나와 이름을 바꿨다. 국세청은 바뀐 계좌 명단을 넘겨받자마자 정치인과 고위 공직자 이름부터 대조했다."
 tfrkphn.7085.d:0 "여의도 뒷골목, 간판도 낡은 한정식집 안쪽 방. 선거가 끝나고 세 사람이 처음 한자리에 모였다. 눈치챈 기자는 없었다.\n\n대통령이 먼저 와서 기다렸다. 부총리 김동연이 뒤이어 왔고 김무성은 약속 시간을 조금 넘겨 들어섰다. 주인이 술을 내왔고, 첫 잔은 맥주로 가볍게 비웠다.\n\n이야기는 공직자 재산 공개에서 시작됐다. 대통령이 자기 재산 목록부터 내놓겠다고 하자 김무성이 껄껄 웃으며 잔을 들었고, 김동연은 목록을 받아 숫자 몇 개를 손가락으로 짚었다. 국회 일정 얘기는 자정이 지나서야 나왔고 그사이 술병이 세 번 바뀌었다.\n\n문밖에서는 수행 비서들이 담배를 나눠 피웠다.\n\n\"무슨 얘기가 오가는 걸까요.\" \"모르는 게 낫지.\" \"그래도 궁금한데.\" \"궁금하면 니가 들어가 보든가.\"\n\n방 안에서는 이따금 웃음이 터졌다. 새벽 한 시, 세 사람은 서로 다른 문으로 나갔다. 그 방에서 무엇을 합의했는지 적어 둔 사람은 없었는데, 그 주 국회는 재산 공개 법안을 큰 다툼 없이 처리했다."
 tfrkphn.7086.d:0 "김부겸은 대구에서 여러 번 떨어졌고 떨어질 때마다 다시 나왔다. 대통령이 되어 처음 대구로 내려가던 날, 그는 경호처가 몇 번이나 말리는데도 전용기를 두고 KTX에 올랐다.\n\n그는 창가에 앉아 대구까지 들판만 내다봤다. 옆자리 노인이 비닐봉지에서 귤 하나를 꺼내 내밀었다.\n\n\"드이소. 내는 선거 때 댁 안 찍었심더.\" \"압니다. 대구 분들 대부분 그러셨지요.\" \"그래도 귤은 무소.\"\n\n대구역 광장에는 환영 현수막 옆에 끝까지 안 찍었다는 팻말도 함께 나와 있었다. 대통령은 그 사이를 천천히 걸어 나갔고 앞을 막는 사람은 없었다. 오후에는 대구시장과 광주시장이 한 단상에 올라 두 도시를 잇는 철도 협약에 서명했다. 대통령은 맨 앞줄에 앉아 두 사람이 손을 맞잡는 걸 지켜봤다.\n\n\"떨어질 때마다 다시 오셨다면서요.\" 돌아오는 열차에서 한 기자가 물었다. 비서관이 대신 웃으며 받았다. \"그래서 오늘은 이긴 겁니다.\" 대통령은 그 말에도 창밖에서 눈을 떼지 않았다. 손에는 아까 받은 귤 껍질이 아직 쥐여 있었다."
 tfrkphn.7087.d:0 "금융실명제로 차명 계좌가 드러나자 돈줄 막힌 기업들이 투자를 멈췄다. 사정이 공직 사회로 번지면서 관료들은 서류에 제 이름 쓰기를 꺼렸고, 옷 벗은 장성들은 퇴역 군인 단체를 앞세워 거리로 나왔다.\n\n부총리 김동연이 대통령실에 와서 석 달째 내리막인 성장률 전망표를 책상에 펼쳤다. 그는 속도를 조금만 늦추자고 했다. 대통령이 대꾸하지 않자 같은 말을 한 번 더 했다.\n\n같은 날 김무성은 개혁이 나라가 버틸 속도를 넘었다고 주장했고, 신문 사설은 하루 만에 논조를 바꿨다.\n\n밤이 되자 비서동 흡연실이 북적였다.\n\n\"속도 늦추면 수사 흐지부지됩니다. 그동안 한 게 다 날아가요.\" \"안 늦추면? 다음 달 실업률 보셨어요? 그거 들고 지역구 가 보세요.\" \"그럼 그만두자고요?\" \"누가 그만두재요!\"\n\n대통령은 집무실에 혼자 남아 사정 대상자 명단과 전망표를 번갈아 넘겼다. 새벽 두 시에 비서실장이 문을 두드리고 내일 아침 담화 시간을 비워 두겠다고 했다. 대통령은 고개만 끄덕이고 다시 명단으로 눈을 돌렸다."
 tfrkphn.7088.d:0 "금 모으기 운동 첫 주, 시청 앞 은행 지점에는 문 열기 전부터 줄이 모퉁이를 돌아 나갔다. 사람들 손에는 손수건에 싼 결혼반지와 돌반지, 오래 묵은 저금통이 들려 있었다.\n\n\"이거, 시어머니가 물려주신 건데요.\" 한 여자가 작은 금비녀를 창구에 내밀었다.\n\n\"정말 괜찮으시겠어요? 이건 나중에...\" \"괜찮아요. 우리 어머님 살아 계셨으면 먼저 들고 오셨을 양반이에요.\"\n\n뒤에 선 할아버지가 헛기침을 하더니 주머니에서 금니 두 개를 꺼냈다. 창구 직원은 웃음을 참느라 한참 고개를 숙였다. 할아버지는 금은 금이라며 저울에 그것을 올렸다.\n\n대통령 책상에는 매일 아침 그날 모인 금의 양과 그걸로 갚을 빚의 액수가 올라왔다. 첫 주에만 예상의 세 배가 모여서 국무총리 김부겸도 은행에 나가 줄 선 이들에게 고개를 숙였고, 은행들은 근처 금은방에서 저울을 빌려다 썼다. 그 겨울 모은 금으로 갚은 빚은 전체에 비하면 얼마 안 됐다. 그래도 외국 신문들이 줄 선 사람들 사진을 일 면에 실은 뒤로 한국 국채를 사겠다는 주문이 조금씩 들어왔다."
 tfrkphn.7089.d:0 "저녁 일곱 시, 노동계와 경영계와 정부 대표가 한 회의실에 마주 앉았다. 노동계는 해고부터 막자고 했다. 정부 쪽 자리에는 대통령이 직접 보낸 계산서 한 장이 놓여 있었다.\n\n자정이 넘어 도시락이 들어왔고, 세 쪽은 먹으면서도 말을 멈추지 않았다.\n\n\"오늘 안에 안 끝나면 다음 달 월급날 없는 회사가 백 곳이 넘습니다.\" 정부 쪽 차관이 낮게 말했다. \"그 회사 노동자들이 우리 조합원입니다. 모를 것 같습니까.\" \"그러니까 드리는 말씀입니다.\"\n\n새벽 세 시, 바람 쐬러 나간 노동계 대표가 복도 끝 자판기 앞에서 경영계 대표와 딱 마주쳤다.\n\n\"동전 있어요?\" \"카드 되던데요.\" \"아, 요즘은 되나.\"\n\n둘은 커피를 한 잔씩 뽑아 들고 같이 회의실로 돌아갔다. 다섯 시 반에 세 대표는 일자리를 지키는 대신 임금 인상을 함께 미룬다는 합의문에 서명했다.\n\n아침 신문들이 합의문 전문을 실었다. 노동계 대표는 조합원 총회에서 야유를 들었고 경영계 대표는 회원사 항의 전화에 하루 종일 시달렸다."
 tfrkphn.7090.d:0 "선거 뒤 세 사람이 처음 마주 앉은 곳은 마포의 오래된 갈빗집 이층이었다. 눈치챈 기자는 없었다.\n\n국무총리 김부겸이 먼저 와서 고기를 굽고 있었다. 김무성은 맞은편에서 벌써 한 잔을 비웠다. 늦게 온 대통령이 앉자마자 수첩부터 꺼내자 두 사람이 웃었다. 주인은 그날 이층에 다른 손님을 올리지 않았다.\n\n첫 화제는 실업 급여였다. 대통령이 숫자를 하나하나 짚어 나가자 김무성이 그 돈은 어디서 나오느냐고 물었고, 김부겸은 말없이 두 사람의 잔을 채웠다. 대통령은 자정을 넘기고서야 수첩을 덮었다.\n\n계단 아래에서는 수행 비서들이 주인이 내준 김치찌개를 나눠 먹었다.\n\n\"총리님 오늘 통 말씀이 없으시네.\" \"원래 저런 자리선 듣기만 하셔. 고기 굽는 거 봐라, 저게 다 듣는 거야.\"\n\n이따금 위층의 웃음소리가 계단을 타고 내려왔다.\n\n새벽 한 시가 넘어 세 사람은 따로따로 계단을 내려갔다. 무슨 얘기가 오갔는지는 끝내 새어 나오지 않았는데, 그 주 국회에서 사회 안전망 예산이 이렇다 할 다툼 없이 통과됐다."
 tfrkphn.7091.d:0 "대통령은 상업고등학교를 나와 열일곱 살에 은행 창구에 앉았다. 낮에는 돈을 세고 밤에는 야간대학에 다니며 공부해서 고시에 붙었다.\n\n기초생활 보장법이 국회를 통과한 다음 날 저녁 일곱 시, 그는 아무 예고 없이 그 대학 야간 강의실을 찾아갔다. 학생들은 한동안 그가 누군지 몰랐다.\n\n뒷줄에는 퇴근하자마자 작업복 차림으로 달려온 학생들이 앉아 있었다. 대통령은 맨 뒤 빈 의자에 앉아 강의를 끝까지 들었다. 교수도 강의를 멈추지 않고 칠판에 분개 문제를 풀었다.\n\n쉬는 시간에 앞줄 학생이 옆자리에 속삭였다.\n\n\"저분 여기 다녔대.\" \"그래서 뭐가 달라지는데. 내일 출근은 똑같이 여섯 시야.\" 대통령은 그 말을 다 들었다. 뒤를 돌아보지는 않았지만 볼펜을 쥔 손이 잠깐 멈췄다가 다시 필기를 이어 갔다.\n\n강의가 끝나자 그는 학생들에게 짧게 인사하고 강의실을 나섰다. 대통령실은 이튿날 아침 야간 과정 장학금을 두 배로 늘리는 예산안을 국회에 보냈다. 학교는 그가 앉았던 맨 뒷자리 의자를 치우지 않고 학생들이 계속 쓰게 두었다."
 tfrkphn.7093.d:0 "취임 한 달째 되는 날, 대통령은 신민당의 두 김씨에게 내각 자리를 비워 두겠다고 했다. 한때 같이 싸운 동료들이니 이 정도는 마땅하다고 생각했다. 그는 전화를 걸어 두 사람을 한 명씩 설득하기 시작했다.\n\n두 김씨는 고민했지만, 그 고민을 깬 건 대통령의 발표였다. 기자회견에서 신민당 두 분께 장관 자리를 비워 두겠다고 공개해 버린 것이다.\n\n\"받으면 들러리, 안 받으면 발목잡이. 이래도 욕먹고 저래도 욕먹게 판을 짜 놓는 거, 그게 저 양반 정치예요.\" 신민당 한 중진이 국회 흡연실에서 기자들에게 털어놓았다."
 tfrkphn.7094.d:0 "선거 뒤 세 사람이 처음 한자리에 모인 곳은 남산 아래 복집이었다. 갈라섰던 두 김씨가 같은 상에 앉는 것도 선거 뒤로는 처음이라, 대통령은 부산 출신 의원에게 조용한 집을 골라 달라고 했다.\n\n대통령이 먼저 와서 기다렸다. 김부겸과 김동연은 오 분 차이로 들어와 서로 눈인사만 건넸다. 대통령이 웃으며 두 사람 잔부터 채웠다.\n\n선거구 얘기가 먼저 나왔다. 대통령이 한 지역구에서 여러 명을 뽑자고 하자 김동연은 계산부터 해 보자고 했다. 김부겸은 지역의 벽이 낮아진다면 생각해 보겠다고 했다. 그날 대통령은 총리 자리 얘기는 입 밖에 내지 않았다.\n\n문밖의 수행 비서들은 서로 눈치만 봤다.\n\n\"저 두 분이 한 상에 앉는 걸 다 보네.\" \"판 까는 데는 선수잖아. 상도동에서 배운 게 그거라던데.\" 방 안은 한동안 조용했다.\n\n새벽 한 시가 넘어 세 사람은 각자 다른 문으로 빠져나갔다. 한 달 뒤 대통령은 신민당 출신 의원 한 명을 국무총리 후보로 지명했고, 여의도는 그제야 그날 밤 복집에서 무슨 얘기가 오갔는지 짐작했다."
 tfrkphn.7095.d:0 "당 대표 시절 김무성은 공천장에 도장을 찍지 않고 부산으로 내려가 버린 적이 있다. 그 며칠 동안 후보 여럿의 공천이 그의 도장 하나에 묶여 있었고, 여의도 사람들은 지금도 그 일을 옥새 파동이라고 부른다.\n\n개헌안을 국회에 내는 날 아침, 대통령 책상에 서류 한 묶음과 국새가 올라왔다. 기자들은 아침부터 대통령실 앞을 지키고 있었다.\n\n서류를 한 장씩 넘기던 대통령의 손이 대통령 권한을 국회와 나눈다는 조항에서 멎었다. 자기가 앉은 자리의 힘을 덜어 내는 조항이었다.\n\n\"찍으시면 됩니다, 각하.\" 비서실장이 낮게 말했다가 아차 싶었는지 얼른 고쳐 불렀다. \"아니, 대통령님.\" 대통령은 대꾸 없이 인주 뚜껑을 열었다. 이번에는 도장을 들고 부산으로 갈 생각이 없었다.\n\n열한 시 사 분, 대통령이 국새를 들어 서류에 눌렀다. 비서실장은 서류를 받자마자 국회로 가는 차에 올랐고, 대변인은 십 분 뒤 개헌안 제출을 발표했다. 국회의장실은 서류를 접수하고 본회의 보고 날짜를 잡았다."
 tfrkphn.7097.d:0 "임기 마지막 가을, 대통령은 부산에 내려가 영도 앞바다가 내려다보이는 언덕에 올랐다. 그가 마지막으로 국회의원에 당선된 지역구가 영도였다. 수행원들은 언덕 아래에 남겨 두고 혼자 걸어 올라갔다.\n\n젊은 시절 그는 상도동 사랑방에서 손님을 맞았다. 당 대표가 된 뒤에는 남을 후보로 세우는 일을 했다. 그런 사람이 대통령 자리에 앉게 될 줄은 그 자신도 몰랐다.\n\n\"이제 올라가셔야 합니다. 비행기 시간이...\" 비서관이 조심스레 말했다. 대통령은 조금만 더 있자고 했다. 해가 바다 쪽으로 기울고 멀리서 뱃고동이 울렸다.\n\n차 옆에서 기다리던 늙은 운전기사가 김소월의 초혼 한 구절을 혼잣말처럼 읊었다. \"붉은 해는 서산마루에 걸리었다.\" 비서관이 돌아보자 그는 머쓱하게 웃었다. \"학교 때 외운 깁니더.\"\n\n해가 다 넘어간 뒤에야 대통령은 차에 올랐다. 서울에서는 그가 떠난 자리를 두고 헌정회복연대 의원들이 벌써 모이고 있었다. 이튿날 신문들은 그의 다섯 해를 판을 쥔 사람의 시대라고 불렀다."
 tfrkphn.7099.d:0 "서울중앙지방법원 대법정, 오전 열 시.\n\n전역 명령서를 받았던 장성 몇이 일 년 만에 피고인석에 앉았다. 검찰은 여의도의 사흘 동안 포격 준비 명령을 아래로 전달한 지휘관들을 내란 혐의로 기소했다. 검사는 긴급명령과 포격 명령이 누구 손에서 누구 손으로 넘어갔는지 한 줄씩 읽었다. 방청석에는 그 사흘 동안 바리케이드를 지켰던 시민들도 앉아 있었다.\n\n\"명령에 따랐을 뿐입니다.\" 한 피고인이 말했다. 재판장은 서류에서 눈도 들지 않았다. \"그 명령이 헌법에 맞는지는 안 물어보셨습니까.\" 피고인은 입을 다물었다.\n\n쉬는 시간에 복도 정수기 앞에서 방청객 둘이 종이컵을 들고 섰다.\n\n\"저 사람, 그날 밤 국회 앞에 있던 그 대령 맞죠?\" \"맞아요. 그땐 별 하나 더 달고 있었는데.\"\n\n대통령은 공판을 묻는 기자들에게 판결은 법원 몫이라고만 했다. 재판은 그 뒤로 일 년을 더 끌었다. 방청권을 받으려고 새벽에 늘어서는 줄은 선고 날까지 한 번도 짧아지지 않았다."
 tfrkphn.71.kp:0 "1994년 11월 호주 시드니에서 아시아태평양경제협력체(APEC) 정상회의를 마친 김영삼 대통령이 기자들 앞에 섰다. 그는 그 자리에서 세계화라는 새 국정 목표를 내놓았다.\n\n좁은 한반도를 벗어나 세계로 나가자는 말이었다. 우물 안에서 남북끼리, 동서끼리 싸우지 말고 바깥 세계와 경쟁해서 이기자는 뜻이었다. 정부에는 세계화추진위원회가 생겼고 2년 뒤 대한민국은 선진국 클럽이라 불리던 OECD에 가입했다.\n\n그 무렵 모래시계 검사로 이름을 알린 한 사람이 정치에 뛰어들었다. 1996년 총선을 앞두고 그를 정치판으로 불러낸 사람이 김영삼이었고, 그 검사가 지금 우리의 대통령이다.\n\n이듬해 IMF가 왔고 세계화는 실패한 말이 되었다. 문을 서둘러 열었고 준비 없이 바다로 나갔다고들 했다. 기업들은 쓰러졌고 거리에는 실업자가 넘쳤다. 사람들은 세계화라는 말을 들으면 금 모으기 운동과 눈물부터 떠올렸다."
 tfrkphn.71.kp2:0 "대통령은 그때를 두고 방향은 맞았는데 순서가 틀렸다고 말한다. 바깥으로 나가기 전에 안을 다졌어야 했고, 남의 기준을 따라가기 전에 내 이익을 먼저 셈했어야 했다는 것이다.\n\n30여 년이 지났다. 미국은 무너졌고 세계는 다시 쪼개졌다. 이념의 줄을 서면 안전하던 시대는 끝났고, 이제 누구와 손을 잡을지는 국익이 정한다. 그래서 우리는 서쪽의 인도를 본다.\n\n인도는 14억의 시장과 세계에서 가장 젊은 노동력을 가졌다. 어느 진영에도 몸을 맡기지 않고 제 이익을 지켜 온 나라여서 이념보다 국익을 먼저 셈하는 법을 누구보다 잘 안다.\n\n인도 동부 오디샤 주에는 이 나라 크롬의 거의 전부가 묻혀 있고, 크롬이 없으면 스테인리스강도 전차의 장갑도 제트엔진의 합금도 만들 수 없다. 우리는 그 크롬을 가져오고 인도에는 공장과 기술과 일자리를 가져간다.\n\n첫 실무단은 다음 달 오디샤 주도 부바네스와르로 떠난다. 산업부는 출장자 명단에 철강 회사 사람을 셋 넣었다."
 tfrkphn.7100.d:0 "여의도 호텔 연회장, 밤 아홉 시.\n\n선진국 경제 기구가 한국의 가입을 승인한 날이었다. 대통령은 단상에 올라 밤 여덟 시 담화로 시작한 일이 여기까지 왔다고만 짧게 말했다. 박수가 오래 이어졌다. 기업인들이 잔을 부딪는 사이 장관들은 서로 어깨를 두드렸고, 입구에는 김무성이 보낸 축하 화환까지 서 있었다.\n\n부총리 김동연은 연회장 구석에서 잔도 안 들고 휴대전화만 들여다봤다. 화면에는 나라 밖에서 빌린 단기 외채가 석 달 내리 늘었다는 숫자가 적혀 있었다.\n\n\"부총리님, 오늘 같은 날은 좀...\" 옆에 선 차관이 웃으며 잔을 내밀었다. \"한 잔만 받으세요. 사진도 찍어야 하고.\" \"사진은 찍읍시다. 술은 내일 아침 보고 끝나고.\" \"내일 아침에 술 드실 일은 없잖습니까.\" \"그러니까요.\"\n\n연회는 자정을 넘겨 끝났다. 김동연은 차에 오르자마자 외환 담당 국장에게 전화를 걸었다. 상대가 잠이 덜 깬 목소리로 받자 그는 미안하다는 말도 없이 만기별 외채 명세를 아침 여덟 시까지 책상에 올려 두라고 했다."
 tfrkphn.7101.d:0 "김부겸은 임기 내내 개혁의 고삐를 늦추지 않았고, 그 임기가 끝나는 날이 왔다. 관저 앞에는 아침부터 이삿짐 트럭이 서 있었다.\n\n마지막 국무회의는 십오 분 만에 끝났다. 대통령은 장관들에게 고맙다는 말만 했다. 부총리 김동연은 마지막 경제 지표를 읽으며 나라 빚이 줄었다고 보고했고, 국방부 장관은 다섯 해 동안 군이 한 번도 부대 밖으로 안 나왔다고 했다.\n\n그날 아침 대통령은 국회 정문 앞에서 걸음을 멈췄다. 아스팔트에 그 사흘 동안 전차가 남긴 바퀴 자국 한 줄이 아직 있었다.\n\n\"대통령님, 다음엔 부총리님이 나선다는 말이 돕니다.\" 비서실장이 뒤에서 조심스레 말했다. 대통령이 웃기만 하자 그가 한마디 보탰다. \"저 자국, 이번에 덮는다던데요. 도로 공사한답니다.\" \"그래요? 그럼 사진이나 한 장 찍어 둡시다.\"\n\n비서실장이 휴대전화를 꺼내 쪼그려 앉자 대통령은 구두가 안 찍히게 한 발 물러섰다. 임기를 두고는 너무 서둘렀다는 사람과 서둘렀으니 해냈다는 사람이 오래 다퉜지만, 군을 정치에서 떼어 놓은 일로 그를 탓하는 사람은 없었다."
 tfrkphn.7102.d:0 "정부는 공장이 문을 닫은 도시들에 초고속 통신망을 깔기로 했다. 낮에는 차가 다니니 인부들은 밤마다 골목을 파서 광케이블을 묻었다. 주민들은 밤새 울리는 굴착기 소리에 구청으로 전화를 걸었다. 대통령은 현장을 두 번 찾아가 흙투성이 인부들과 컵라면을 먹고 일정표를 받아 왔다.\n\n석 달 뒤 동네마다 컴퓨터 수십 대를 들여놓은 게임방이 생겼다. 일자리를 잃은 젊은이들이 그곳에서 밤을 새웠다. 대부분은 게임을 했지만 그 자리에서 회사를 차린 사람도 몇 있었고, 그들은 컵라면 국물 옆에 사업계획서를 펴 놓았다.\n\n\"사장님, 이번 달 회선 요금 반으로 줄었어요.\" \"정부가 깔아 줬잖냐. 세금 낸 보람이 이제야 있네.\" \"사장님 세금 안 내시잖아요.\" \"쉿.\" 계산대 옆 벽에는 정책 홍보 포스터가 반쯤 찢겨 매달려 있었다.\n\n국무총리 김부겸은 국회에서 통신망 예산을 끝까지 지켜 냈다. 야당의 김무성은 그 돈이면 공장을 하나 더 짓겠다며 반대표를 던졌다. 몇 해 뒤 이 통신망 위에서 사업을 시작한 회사 몇 곳이 수출 순위에 이름을 올렸다."
 tfrkphn.7103.d:0 "패전 뒤로 두 나라 정상은 한 번도 마주 앉은 적이 없었다. 대화 정책을 편 지 두 해 만에 대통령은 그 나라에 직접 가기로 했고, 이른 아침 비행기 안에서 연설문을 세 번이나 고쳐 썼다.\n\n공항에는 예정에 없던 상대국 정상이 직접 나와 있었다. 두 사람이 활주로에서 오래 손을 맞잡는 동안 셔터 소리가 그치지 않았다. 서울에서는 사무실 직원들이 일손을 놓고 생중계를 봤다.\n\n\"와, 진짜 손잡네.\" \"저거 언제 놓을까요?\" \"놓을 때까지 화면 바꾸지 마.\" 한 방송국 보도국 부장은 그 말만 하고 담배를 찾았다. 그날 저녁 뉴스는 처음부터 끝까지 회담 소식으로 채워졌다.\n\n국무총리 김부겸은 국회에 남아 질의에 답했고, 김무성은 서두르지 말라고 경고하면서도 회담이 성과를 내기를 바란다고 덧붙였다.\n\n두 정상은 이틀 동안 회담한 끝에 이산가족 상봉과 철도 연결에 합의했다. 군사 문제는 합의문에 들어가지 못했고 실무 회담은 다음 달로 잡혔다. 대통령은 돌아오는 비행기에서 합의문 사본 귀퉁이에 날짜를 적고 수첩 사이에 끼워 넣었다."
 tfrkphn.7104.d:0 "임기 마지막 국무회의에서 대통령은 수첩을 펴고 다섯 해 동안 갚은 빚과 다시 연 항구, 되살린 일자리 수를 차례로 읽었다. 숫자마다 맡았던 장관 이름을 같이 불러서 낭독은 이십 분 가까이 걸렸다.\n\n마지막으로 국무총리 김부겸이 일어나 고맙다고 인사했다. 단일화 협상 때 신민당이 둘로 쪼개질 뻔했던 다섯 주를 기억하는 장관들은 두 사람이 악수하자 박수를 쳤다.\n\n\"마지막 날까지 숫자만 보시네요.\" 비서관이 웃자 대통령도 수첩을 덮으며 따라 웃었다. \"숫자는 거짓말을 안 하니까요. 사람은 해도.\" 다음 대통령에게 넘길 인수 문서 첫 장에도 그는 남은 과제를 숫자로 적어 두었다. 김무성은 그날 오후 수고 많았다는 짧은 덕담 한 줄을 보내왔다.\n\n그의 임기 동안 나라가 부자가 되지는 못했다. 그래도 빚은 다 갚았고, 실업 급여와 기초생활 보장 제도가 처음 생겼다. 이튿날 신문들은 그의 다섯 해에 계산서의 시대라는 이름을 붙였다. 퇴임한 대통령은 따로 사무실을 얻지 않고 원래 살던 집으로 돌아갔다."
 tfrkphn.7105.d:0 "패전과 국회 포격을 거치면서 보수 정치인들은 여러 갈래로 흩어졌다. 취임 넉 달째, 대통령은 영남과 충청의 원로들과 젊은 소장파 의원들을 관저로 불러 한 방에 앉혔다.\n\n그중 몇은 십 년 넘게 말도 섞지 않은 사이였다. 부산에서 올라온 회가 상에 오르고 젓가락이 오가는 동안 들리는 건 서로를 비꼬는 말뿐이었다. 한 원로는 옆자리 의원이 따라 주는 술잔을 끝내 받지 않았다.\n\n대통령은 먼저 말을 꺼내지 않았다. 사람들이 서로에게 쌓인 불만을 쏟아 내는 것을 끝까지 듣고 있다가, 자정 가까이 되어 목소리들이 잦아들자 술병을 들고 한 사람씩 잔을 채웠다.\n\n\"결국 다 저 양반 판에 들어간 거네.\" 관저를 나서며 한 소장파 의원이 투덜거렸다. 옆에 있던 원로가 외투 깃을 올리며 웃었다. \"들어와 보니 따뜻하잖아. 밖은 춥다.\"\n\n한 달 뒤 대통령은 보수 대연합을 발표했다. 거리에서 집회를 이어 가던 극우 단체들은 끼지 못했다. 연합에 들어온 의원들은 이튿날부터 헌정회복연대 이름을 걸고 원내 회의를 함께 열었다."
 tfrkphn.7106.d:0 "경제 부처 대회의실 벽에 사람 키보다 큰 계획표가 붙었다. 다섯 해 동안 지을 공단과 항만과 도로가 해마다 칸칸이 적혀 있었다. 대통령은 그 앞에 한참 서 있다가 한 칸을 손가락으로 짚었고 기자들이 그 장면을 놓치지 않고 찍었다.\n\n\"이 항만은 두 해 당기지요.\" 대통령이 짚은 항만은 예산도 부지도 아직 정해지지 않은 사업이라 실무자들 얼굴이 굳었다. 회의가 끝나자 복도에서 과장 하나가 땅이 꺼져라 한숨을 쉬었다. \"두 해를 어디서 당겨요. 바다를 당겨?\" \"조용히 해라. 저 양반 귀 밝다.\"\n\n신민당은 계획표가 옛날식이라고 비판했다. 김동연은 숫자가 안 맞는다고 했다. 김부겸은 사업이 한 지역에 몰렸다고 짚었다. 대통령이 두 사람 말대로 계획표의 두 칸을 고치자 신민당의 비판은 거기서 그쳤다.\n\n계획표에 적힌 사업을 정부가 다 끝내지는 못했다. 그래도 그 다섯 해 동안 공단에는 주문이 끊이지 않아 밤에도 기계가 돌았다. 항만은 고친 계획보다는 한 해 늦게, 처음 계획보다는 한 해 이르게 문을 열었다. "
 tfrkphn.7107.d:0 "개헌안이 국회를 넘은 날부터 광장에서는 찬성 집회와 반대 집회가 번갈아 열렸다. 찬성 쪽은 다시는 한 사람에게 권력을 몰아주지 말자고 외쳤다. 반대 쪽은 국회의원들이 나라를 나눠 먹으려 한다고 맞섰다. 텔레비전 토론은 날마다 자정을 넘겼고, 저녁 밥상에서 찬반을 놓고 언성을 높이는 집도 많았다.\n\n반대 운동의 맨 앞에는 신민당이 섰다. 갈라섰던 김부겸과 김동연도 선거 뒤 처음으로 한 연단에 올랐다. 연설을 마친 두 사람은 악수를 하고 각자 다른 차를 타고 돌아갔다.\n\n\"이번엔 진짜 모르겠습니다. 어제 찬성이 이기면 오늘은 반대가 이겨요.\" 한 여론조사 기관 연구원이 기자에게 말했다. 마지막 주 조사도 오차 범위 안이었고 기관들은 투표율이 승부를 가를 거라고 봤다.\n\n대통령은 운동 기간 내내 연단에 서지 않았다. 찬성 연설은 원로와 학자들 몫이었다. 기자들은 그가 왜 나서지 않는지 매일 다른 풀이를 내놓았다. 투표 전날 밤 그는 관저에서 지역별 예상 득표를 적은 개표 시나리오를 혼자 끝까지 넘겨 봤다."
 tfrkphn.7108.d:0 "노사정 합의문에 서명한 지 석 달 만에 경제부처가 정리 대상 기업 쉰다섯 곳의 명단을 대통령에게 올렸다. 명단이 새어 나간 날 아침, 남쪽 공단의 한 조선소 정문 앞에 작업복 차림의 노동자들이 모여들었다. 출근 카드를 찍은 사람은 없었다.\n\n\"스물두 해 다녔습니다! 딴 거 안 묻습니다. 이번 달 월급 나옵니까, 안 나옵니까!\" 노조 위원장이 확성기를 잡고 외쳤다. 정문 위 크레인은 멈춰 있었고 방송 차량이 공단 길로 줄지어 들어왔다.\n\n대통령은 오후에 명단을 다시 펼쳐 놓고 회사마다 남은 빚과 일자리 수를 옆에 적게 했다. 국무총리 김부겸이 찾아와 몇 곳에는 시간을 더 주자고 했다. 대통령은 끝까지 다 듣고 나서야 시간을 주면 그 빚은 누가 갚느냐고 물었다.\n\n대통령실은 밤늦도록 불을 끄지 못했다. 회사에 돈을 넣으면 돈을 빌려준 은행이 흔들렸고, 은행을 살리려 돈을 빼면 공장 문이 닫혔다. 자정이 넘도록 대통령은 명단 어느 줄에도 펜을 대지 못했다. 그 시각 총리실로 돌아간 김부겸은 조선소 노조에 면담을 청하는 전화를 넣었다."
 tfrkphn.7109.d:0 "개혁 속도를 늦추고 석 달이 지나자 멈췄던 투자가 돌아왔고 성장률 전망도 조금씩 올라갔다. 그 달 국무회의에서 부총리 김동연이 처음 웃었다. \"부총리님 웃는 거 처음 봐요.\" 옆자리 장관이 속삭이자 그는 표정을 거뒀다.\n\n사정이 느슨해지자 수사를 받던 사람들이 다시 공개 석상에 얼굴을 내밀었다. \"수사 다 끝난 겁니까?\" 검찰청 앞에서 한 기자가 물었지만 대변인은 시계만 봤다. 그 주에 피의자 셋이 무혐의로 풀려났다.\n\n대통령은 그 보고서를 끝까지 읽은 뒤 때가 되면 수사를 다시 시작하겠다고 했다. 참모들은 고개를 끄덕였는데 그때가 언제냐고 되묻는 사람은 없었다. 김무성은 늦었지만 옳은 결정이라는 논평을 냈다.\n\n개혁을 기다리던 사람들은 등을 돌렸다. 그해 겨울 대통령 지지율이 처음으로 절반 아래로 떨어졌다. 신민당 젊은 의원 몇은 당사 앞에서 수사를 재개하라는 성명을 읽었고, 무혐의로 풀려난 전직 장관 하나는 주말 방송에 나와 애초부터 무리한 수사였다고 큰소리쳤다. 수사팀 검사 두 명은 인사 발령을 받고 지방으로 내려갔다."
 tfrkphn.7110.d:0 "대통령은 속도를 늦추지 않았다. 사정의 칼끝은 재벌 회장실과 장관 집무실까지 올라갔고, 한 달 사이 장관 둘이 옷을 벗고 연정 의원 셋이 검찰에 불려 갔다.\n\n신문은 아침마다 새 이름을 일 면에 올렸다. 시민들은 박수를 보냈지만 기업들은 투자를 미뤘다. \"이번 분기 신규 채용 없습니다. 위에서 보류래요.\" 한 대기업 인사팀장이 회의에서 못 박았다. 공단 하청 업체들은 대금 결제를 두 달씩 미뤘고 대학가 게시판에서 채용 공고가 사라졌다.\n\n부총리 김동연은 속도 얘기를 다시 꺼내지 않았다. 대신 실업 대책 예산안을 짜서 올렸고 대통령은 그 자리에서 서명했다. 국회에서는 김무성이 개혁 속도를 다시 생각해 달라고 요구했다.\n\n그해 겨울까지 차명 계좌 절반이 실명으로 바뀌었다. 같은 기간 일자리는 열에 하나꼴로 사라졌다. 대통령은 연말 회견에서 일자리를 잃은 사람들에게 머리를 숙였지만 수사를 멈추겠다고는 하지 않았다. 이듬해 봄까지 검찰은 전직 장관 둘과 재벌 회장 셋을 재판에 넘겼다. 실업 급여 창구 앞 줄은 그때까지 짧아지지 않았다."
 tfrkphn.7111.d:0 "오늘 아침 원 엔 환율이 100엔당 1,800원을 돌파했습니다. 이대로라면 2천 원을 넘을 것으로 보이며...\n\n야, 우리 집 망했다. 아빠 회사 부도났대.\n\n이게 요즘 서민들의 대화였다. 청와대에서는 긴급 대책 회의가 열렸다.\n방법이 있는가?\n부총리 김동연이 답했다.\n현재로선... 없습니다.\n\n한때 자신이 지킨 여의도에서는 대통령 퇴진을 외치는 목소리가 그치지 않았다. 사회 곳곳에서 극단적인 목소리도 다시 들리기 시작했다."
 tfrkphn.7111.t:0 "아빠 회사 부도났다"
 tfrkphn.7112.d:0 "축하연 다음 날 아침, 대통령은 단기 외채가 석 달째 늘고 있다는 부총리 보고를 끝까지 듣고 바로 손쓰라고 했다. 부총리는 그날 오후부터 은행장들을 하나씩 불러 만기가 짧은 빚을 긴 빚으로 갈아타게 했고, 외화 보유액도 조금씩 쌓아 갔다.\n\n\"잔칫집에 찬물 끼얹는다고 말이 많습니다.\" 차관이 몸 사리는 정부를 꼬집은 사설을 내밀었다. \"나중에 끼얹으면 얼음물입니다.\" 부총리는 신문을 접어 서랍에 넣었다.\n\n두 달 뒤 이웃 나라들 환율이 줄줄이 폭락했다. 한국 환율도 며칠 흔들렸지만 쌓아 둔 외화가 넉넉해서 수출 기업들은 그 주에 계약을 한 건도 안 놓쳤다.\n\n명동 한 은행 딜링룸에서는 그 주 내내 고함이 났다. \"태국 바트 또 빠집니다!\" \"우리는?\" \"우리는... 괜찮은데요? 이상하게 괜찮아요.\" \"누가 미리 쟁여 놨으니까 괜찮지.\"\n\n국회에서 김무성은 정부가 미리 대비한 것만큼은 인정한다고 했다. 위기가 오지 않으니 신문들은 그 겨울을 거의 다루지 않았다. 부총리는 임기가 끝나는 날까지 사설을 넣어 둔 서랍을 비우지 않았다."
 tfrkphn.7113.d:0 "투표가 끝난 저녁 여섯 시에 방송사들이 개표 방송을 시작했다. 찬성과 반대 막대그래프가 밤새 엎치락뒤치락했다. 영남과 충청에서는 찬성이, 수도권과 호남에서는 반대가 앞섰고 신민당 당사에서도 헌정회복연대 당사에서도 자리를 뜨는 사람이 없었다.\n\n\"아직 몰라요. 서울 다 까 봐야 압니다. 아니, 부장님, 제가 점쟁이도 아니고...\" 개표 상황실 연구원이 전화기에 대고 말했다. 책상 위에는 식은 커피 잔이 세 개, 뜯지도 않은 김밥 한 줄이 놓여 있었다.\n\n대통령은 관저에서 개표 방송을 보지 않겠다고 했다. 그래 놓고 비서관이 들어올 때마다 지금 몇 대 몇이냐고 먼저 물었다.\n\n새벽 한 시, 마지막 개표함이 열렸다. 앵커가 최종 집계가 곧 나온다며 화면을 중앙선거관리위원회로 넘기자 광장에서 개표를 지켜보던 사람들도 숨을 죽였고, 누군가 든 촛불이 바람에 흔들렸다. 관저에서는 대통령이 또 물었다. 몇 대 몇이야?"
 tfrkphn.7114.d:0 "남산 아래 회색 청사는 조원진 정부 시절 청산 위원회가 쓰던 건물이다. 지하에 창문 없는 방이 여럿 있었고, 여의도의 사흘 동안에도 이 건물은 밤새 불이 꺼지지 않았다.\n\n대통령은 철거를 앞두고 하루 동안 건물을 시민들에게 열었고, 아침부터 언덕길에 줄이 늘어섰다.\n\n지하 복도 끝에서 한 중년 남자가 걸음을 멈췄다.\n\n\"여기, 이 방이었어.\" 그는 문틀을 손바닥으로 천천히 쓸었다. 따라온 딸이 물었다. \"아빠, 여기서 며칠 있었어?\" \"열하루. 근데 그땐 며칠인지도 몰랐다. 불을 안 껐거든.\"\n\n방에는 철제 책상 하나와 다리가 하나 짧은 의자가 남아 있었다.\n\n건물을 남기자는 쪽은 기억하려면 건물이 있어야 한다고 했고, 허물자는 쪽은 그런 방이 다시 있어서는 안 된다고 했다. 대통령은 양쪽 말을 다 듣고 건물은 허물되 지하 방 하나만 통째로 떼어 옮겨 남기라고 지시했다.\n\n이튿날 굴착기가 들어왔다. 이듬해 그 자리에 작은 공원이 생겼고, 공원 한쪽에 옮겨 놓은 방에는 그 짧은 다리 의자도 그대로 들어갔다."
 tfrkphn.7116.d:0 "임기 마지막 날에도 대통령은 새벽 다섯 시에 어김없이 일어나 환율과 외환 보유액부터 확인했다. 열일곱 살에 은행 창구에 앉은 뒤로 하루도 거르지 않은 일이다. 그날 숫자는 평소와 다르지 않았고, 그는 마지막으로 그 숫자들을 수첩에 옮겨 적었다.\n\n국무총리 김부겸은 대구행 기차표를 미리 끊어 두었고 김무성은 부산 바닷가에 내려가 있었다. 오후에 정계를 떠나 있던 이낙연 전 국무총리가 세 사람에게 똑같은 편지를 한 통씩 보내왔다.\n\n셈은 세 분이 잘하셨으니 이제 셈 바깥의 것을 다음 사람들에게 가르쳐 달라는 부탁이었다. 세 사람이 다툰 세월보다 함께 버틴 세월이 더 길었다는 말도 편지 끝에 적혀 있었다.\n\n해 질 무렵 대통령은 수첩 한 권을 들고 청사를 나섰다. 길가 가게 라디오에서 한용운의 님의 침묵이 흘러나왔다. \"아아, 님은 갔지마는 나는 님을 보내지 아니하였습니다.\" 가게 주인이 라디오 소리를 조금 키웠다. 이튿날 신문들은 세 사람이 함께 정치를 한 세월에 세 사람의 시대라는 이름을 붙였다.[TFRKPHN_end_7116_mech][TFRKPHN_end_7116_prom][TFRKPHN_end_7116_hong]"
 tfrkphn.7117.d:0 "국무회의는 둘로 갈렸다. 외교부 장관은 우방과 함께 맞서면 베이징도 오래 버티지 못한다고 했다. 산업부 장관은 중소 협력사들이 석 달을 버티지 못한다고 했다. 경제 단체들은 대통령실에 면담을 요청했고, 여당 강경파는 여기서 물러서면 핵을 들인 의미가 없다는 성명을 냈다.\n\n연평도의 한 선주는 기자에게 배를 묶어 둔 지 열하루째라고 했다. 바다 건너에서 무엇이 들어오든 자기 그물에는 아무것도 들어오지 않는다고 했다.\n\n대통령은 저녁 늦게까지 집무실에 남아 두 장관의 보고서를 나란히 펴 놓았다."
 tfrkphn.7123.d:0 "소추의결서가 대통령실에 전달되자 대통령의 권한 행사는 멈췄다. 헌법에 따라 이인제 국무총리가 대통령 권한대행을 맡는다. 권한대행은 그날 밤 긴급 국무회의를 열고 군과 외교 라인에 흔들림 없이 맡은 일을 하라고 지시했다.\n\n그날 저녁 광화문에는 대통령을 지지하던 사람들뿐 아니라 다른 사람들도 모이기 시작했다. 전쟁에는 반대했지만 국회가 이렇게 대통령을 끌어내리는 것도 싫다는 사람들이 손에 촛불을 들었다. 방송사의 여론조사에서는 탄핵에 반대한다는 답이 처음으로 찬성을 앞질렀다.\n\n여당 당사에는 입당 원서가 몰려들었다. 탄핵을 이끈 야당의 지도부는 그날 밤 웃지 않았다. 당사 앞에는 탄핵을 규탄하는 손팻말이 붙었고, 지도부는 비상 회의를 열어 역풍을 막을 방법을 찾았다. 총선까지 남은 날짜를 세는 사람들이 이번에는 야당 쪽에 더 많았다.\n\n헌법재판소는 탄핵심판 사건을 접수했다. 심리가 끝날 때까지 대통령은 관저에 머물며 결정을 기다린다. 심판까지는 몇 달이 걸릴 것이고, 그 사이 나라는 권한대행 체제로 버텨야 한다."
 tfrkphn.7124.d:0 "무위무능. 제자리에 있지 못한 기물은 제 구실을 못 한다. 강한 차라도 자리가 나쁘면 졸만 못하다.\n\n그날 국무회의는 짧았다. 대통령은 서류 한 장을 들고 들어와 마지막 개혁 법안의 공포를 알렸다. 군의 사조직, 이름 없는 돈, 낡은 청사. 지난 임기 동안 하나씩 베어 낸 것들이 서류 한 장에 줄지어 적혀 있었다. 장관들은 아무 말 없이 서명란을 넘겼다. 임기의 마지막이었다.\n\n일수불퇴. 한 번 둔 수는 물릴 수 없다. 그래서 신중하게 두어야 한다. 그는 김영삼이 그랬던 것처럼 한번 정한 일에서는 절대 물러서지 않았다. 총독부 첨탑이 떨어져 나갈 때도, 하나회를 숙청할 때도 그랬다.\n\n같은 날 오후, 부총리 김동연은 개혁에 든 비용을 정리한 보고서를 올렸다. 야당의 김무성은 짧은 논평에서 속도에는 이견이 있었지만 방향에는 이견이 없었다고 했다.\n\n신문들은 그의 임기를 칼의 시대라는 제목으로 정리했다. 칼은 거칠었고 때로는 너무 빨랐다. 그러나 그 칼이 지나간 자리에는 다시는 옛것이 돌아오지 않았다."
 tfrkphn.7125.d:0 "판을 밀어붙이던 손이 어느 순간 멈췄다. 앞으로 나아갈 길이 모두 막혀 있었다.\n\n퇴역 장성 단체와 돈줄이 막힌 기업들, 서명을 미루는 관료들이 한꺼번에 등을 돌렸다. 여당 안에서도 속도를 늦추자는 목소리가 커졌다. 국회에 올라간 마지막 개혁 법안은 상임위원회 문턱을 넘지 못하고 회기를 넘겼다. 신문들은 개혁의 동력이 다했다고 썼다. 거리에서는 다음은 누구냐는 말 대신 이제 끝났느냐는 말이 돌았다. 대통령에게는 그 말이 더 아팠다.\n\n\"한 수만 더 있었으면 됐는데요.\" 비서관이 혼잣말처럼 말했다. 대통령은 대답하지 않고 책상 위의 서류를 오래 정리했다. 그는 마지막 서류를 서랍에 넣고 열쇠를 돌렸다.\n\n부총리 김동연은 그날 밤 남은 예산으로 할 수 있는 일의 목록을 올렸다. 야당의 김무성은 개혁이 잠시 멈췄을 뿐 실패하지는 않았다고 논평했다.\n\n신문들은 그의 임기를 미완의 개혁이라는 제목으로 정리했다. 베어 낸 것들은 돌아오지 않았지만, 베지 못한 것들도 끝내 그대로 남았다. 칼은 그 자리에 꽂힌 채 녹이 슬었다."
 tfrkphn.7126.d:0 "판의 끝줄에 닿은 폰은 무엇이든 될 수 있다. 오래 걸어온 계산이 마침내 끝줄에 닿았다.\n\n임기 초에 세운 경제 재건 계획의 마지막 보고서가 올라왔다. 갚을 빚, 다시 세울 공장, 늘릴 일자리. 계획표의 칸이 마지막 하나까지 채워져 있었다. 대통령은 보고서를 한 장씩 넘기며 숫자를 다시 셌다. 틀린 곳은 없었다. 그는 서명란에 이름과 날짜를 또박또박 적었다.\n\n\"정말 다 채운 겁니까.\" 젊은 사무관이 물었다. 차관이 웃으며 장부를 덮었다. \"이제부터는 우리 돈으로 셈하는 겁니다.\"\n\n국무총리 김부겸은 그날 국회에서 짧게 감사 인사를 했다. 야당의 김무성은 숫자로는 반박할 것이 없다고 논평했다. 그날 저녁 경제 부처 앞 포장마차에는 늦게까지 불이 켜져 있었다. 실무자들은 처음으로 계산기 없이 술잔을 셌다. 그날은 영수증을 챙기는 사람이 없었다.\n\n신문들은 그의 임기를 계산의 시대라는 제목으로 정리했다. 그는 화려한 수를 두지 않았지만 한 수도 틀리지 않았다. 그 장부는 지금도 경제 부처의 서고에 꽂혀 있다."
 tfrkphn.7127.d:0 "이기지도 지지도 않은 판이 있다. 서로 같은 수를 되풀이하다 보면, 판은 그 자리에서 멈춘다.\n\n경제 재건 계획의 마지막 보고서는 절반만 채워져 있었다. 빚은 줄었지만 다 갚지 못했고, 공장은 다시 돌았지만 일자리는 예전만 못했다. 대통령은 보고서의 빈칸에 연필로 표시를 해 두었다. 그는 빈칸마다 다음 정부가 해야 할 일을 연필로 적어 넣었다.\n\n\"무승부라고들 합니다.\" 비서관이 신문을 내밀었다. 대통령은 신문을 접으며 지지 않은 것도 셈이라고 했다. 그는 그날 오후 내내 다음 정부에 넘길 인수 문서를 직접 고쳤다. 고친 자리마다 날짜와 이유를 적었다. 문서는 처음보다 두 배로 두꺼워졌다. 비서관은 그 문서를 두 번 제본했다.\n\n국무총리 김부겸은 남은 과제를 정리해 국회에 보고했다. 야당의 김무성은 칭찬과 비판을 반씩 섞어 절반의 성공이라고 논평했다.\n\n그의 임기에 대한 평가는 엇갈렸지만, 다음 정부가 그가 남긴 장부의 빈칸부터 채우기 시작했다는 점은 누구나 인정했다. 연필 자국은 아직도 지워지지 않았다."
 tfrkphn.7128.d:0 "대한민국 수출액 미 내전 이후 최악, 대한민국 이대로 망하는가.\n\n나락이다. 수출로 먹고사는 나라가 완전 나락으로 갔다. 뭐가 잘못된 거지? 우린 미국 내전도 극복했고 민주주의도 위기 속에서 지켜 냈다.\n\n아무리 빚을 갚아도 그만큼 다시 늘어났다. 이대로면 21년의 파국으로 다시 갈 거다. 뉴스는 빚 갚는 대통령이 아니라 빚 늘리는 대통령이라고 전했다.\n\n국무총리 김부겸은 국회에서 야당의 질문을 받았다. 야당은 정부의 책임을 묻는 결의안을 냈다. 결의안은 부결됐지만, 표 차이는 크지 않았다.\n\n그날 대통령은 다시 옛 대통령의 초상화를 바라보았다. 김영삼이었다. 그는 김영삼의 길을 따라가고 있었다."
 tfrkphn.7129.d:0 "흑돌이 마지막 빈자리를 메웠다. 판은 이제 누구의 집인지 셀 필요도 없었다.\n\n국회 본회의장의 전광판에 숫자가 떴다. 개헌안 찬성은 의결 정족수를 넘겼다. 의장이 의사봉을 세 번 두드렸다. 본회의장 뒤편에서 누군가 박수를 쳤고, 곧 박수가 번졌다. 신민당 의원들 가운데서도 몇몇이 자리에서 일어났다. 기자석의 셔터 소리가 한동안 그치지 않았다.\n\n\"이제 국민투표만 남았습니다.\" 비서관이 관저로 전화를 걸어 왔다. 그는 아직 반집도 끝나지 않았다고만 했다.\n\n신민당의 김부겸과 김동연은 표결 뒤 각자 기자들 앞에 섰다. 두 사람은 국민투표에서 국민의 뜻을 따르겠다고 했다. 김부겸은 찬성도 반대도 말하지 않았고, 김동연은 개헌에 드는 비용부터 셈해 보겠다고 했다. 기자들은 두 사람의 말을 두고 밤늦게까지 저마다 다른 해석을 달았다.\n\n그날 밤 헌정회복연대 당사 앞에서는 지지자들이 국민투표 운동 출정식을 열었다."
 tfrkphn.7130.d:0 "판의 한쪽이 무너지자 다른 쪽도 버티지 못했다. 바둑에서는 그것을 돌을 거둔다고 한다.\n\n개헌안 표결을 앞두고 찬성하기로 했던 의원들이 하나둘 자리를 비웠다. 밀약이 새어 나갔다는 소문이 돌았고, 소문은 곧 기사가 되었다. 국회 본회의장의 전광판에 찍힌 숫자는 의결 정족수에 한참 모자랐다. 의장이 부결을 선포했다.\n\n\"다시 셈하면 됩니다.\" 비서관이 말했다. 대통령은 고개를 저었다. 그는 셈은 맞았는데 판을 너무 빨리 짰다고 했다.\n\n신민당의 김부겸과 김동연은 표결 뒤 짧은 논평만 냈다. 두 사람 모두 대통령을 탓하는 말은 하지 않았다. 국회 앞 계단에서는 찬성 쪽 지지자들이 현수막을 접으며 배신자 이름을 불렀다.\n\n이튿날 신문들은 판을 너무 빨리 짰다는 그의 한마디를 제목으로 뽑았다."
 tfrkphn.7131.d:0 "법무부 장관 황교안이 헌법재판소에 민주당 해산 심판을 청구했다. 그는 오래전에도 같은 자리에서 통합진보당 해산을 청구해 받아 낸 사람이었다. 청구서에는 패전의 책임과 적과 내통했다는 의혹, 그리고 새어 나간 명단에 올랐던 의원들의 이름이 함께 적혀 있었다. 국무회의는 이 안건을 십 분 만에 통과시켰다.\n\n공개 변론은 두 번뿐이었고, 그는 두 번 모두 청구인석에 직접 앉았다. 선고일 아침 대심판정 앞에는 태극기와 촛불이 길 하나를 사이에 두고 마주 섰다. 재판관 여섯 명이 해산에 찬성해 정족수를 겨우 채웠다. 통합진보당 때는 여덟 명이 찬성했다.\n\n그날 오후 여의도 당사 앞에 사다리차가 섰다. 인부들이 간판의 나사를 하나씩 풀었다. 당직자들은 건물 앞에 줄지어 서서 그 장면을 지켜보았다. 누군가 당가를 부르기 시작했지만 끝까지 부른 사람은 없었다.\n\n소속 의원들은 그날로 의원직을 잃었다. 선관위는 같은 이름도, 같은 강령의 당도 등록할 수 없다고 알려 왔다. 광화문 무대에서는 만세 소리가 났다. 당적이 없던 국회의장 우원식만 의장석에 남았다. 그는 그날 밤 텅 빈 본회의장의 불을 늦게까지 켜 두었다."
 tfrkphn.7132.d:0 "탄핵 때는 두 사람이 가장 앞에 섰다. 이재명은 패전 직후 가장 먼저 기자회견을 열어 대통령에게 진실을 물었고, 정청래는 소추위원으로 탄핵소추안을 들고 헌법재판소에 섰다. 탄핵이 가결되던 밤, 두 사람은 국회 앞 광장에서 같은 단상에 올랐다.\n\n그러나 탄핵으로 열린 대통령 자리는 두 사람에게 돌아가지 않았다. 조기 대선에서 광장의 표는 갈라졌고, 대통령 자리는 광화문에 앉았다. 당 안에서 처음으로 그 말이 나왔다. 탄핵을 서두른 사람들이 저 정권을 불러들였다는 말이었다.\n\n해산 심판 청구서의 첫 장에는 두 사람의 이름이 맨 위에 적혀 있었다. 간판이 내려진 날 두 사람은 의원직을 잃었고, 다음 주에는 출국 금지 통보가 왔다. 검찰은 소환장을 매주 보냈다. 기자들은 더 이상 그들의 집 앞에서 기다리지 않았다.\n\n옛 동료들은 전화를 받지 않았다. 마포의 사무실은 임대료가 밀려 문을 닫았다. 이재명은 법원 복도의 긴 의자에서 하루를 보내는 날이 많아졌다. 헌정이 돌아온 뒤 옛 민주당 사람들은 두 사람 대신 대구의 김부겸을 찾아갔다."
 tfrkphn.7133.d:0 "새 헌법에 따른 첫 총선이 치러졌다. 투표소마다 과반 의석을 모은 정당들이 함께 정부를 꾸린다는 안내문이 붙었고, 노인들은 기표소 앞에서 그 안내문을 한 번 더 읽었다. 투표율은 지난 어느 선거보다 높았다.\n\n김무성은 이 선거에 출마하지 않았다. 그는 선거 전날 당사에 들러 젊은 후보들의 어깨를 한 번씩 두드렸고, 소감을 묻는 기자들에게는 웃기만 했다. 그는 평생 주장해 온 내각제의 첫 선거를 집 거실에서 개표 방송으로 끝까지 지켜봤다. 당사 벽에는 그가 처음 내각제를 주장했을 때의 신문 기사가 붙어 있었다.\n\n개표 방송은 밤새 의석을 점으로 찍은 반원 그림을 내보냈다. 의석이 정해질 때마다 점의 색이 바뀌었고 앵커는 과반선을 여러 번 가리켰다. 자정이 넘자 진행자들은 어느 당이 어느 당과 연정을 꾸릴 수 있는지를 따지기 시작했다.\n\n마지막 의석은 새벽 네 시에 정해졌고 만세를 부른 당사는 한 곳도 없었다. 사람들은 조간신문에 실린 반원 그림을 펴 놓고 색깔별로 의석을 세었고, 각 당은 아침부터 협상단을 꾸렸다."
 tfrkphn.7134.d:0 "국회의 임기가 끝나 총리는 마지막 국무회의를 마치고 국회에 가서 의원들에게 인사했다. 유권자들은 이제 총선이 정부를 꾸릴 의석 분포를 정하는 선거라는 데 익숙해졌고, 투표소 앞의 줄은 지난번보다 길었다.\n\n선거 운동은 짧고 조용했다. 큰 유세가 줄고 골목의 작은 간담회가 늘었으며, 후보들은 선거 뒤에 연정 협상에서 마주 앉을 수도 있는 상대 당을 거칠게 공격하지 않았다. 후보들은 자기 당이 몇 석을 얻으면 무엇을 할 수 있는지를 주로 설명했다.\n\n개표 방송은 이번에도 반원 그림을 내보냈다. 자정 무렵 박수가 나온 당사도 있었고 일찍 불을 끈 당사도 있었다. 낙선한 중진 의원 몇 사람은 의원회관에서 오래된 명함이 가득 든 짐을 쌌다. 방송사들은 예상 의석으로 만들 수 있는 연정 조합을 표로 보여 줬다.\n\n아침이 되자 여의도의 전화가 다시 바빠졌다. 의석은 정해졌지만 어느 당이 정부를 이끌지는 정해지지 않았고, 각 당 협상단의 명단이 하나둘 언론에 흘러나왔다. 제1당 대표는 아침 일곱 시에 첫 전화를 받았다."
 tfrkphn.7135.d:0 "총선 다음 날부터 각 당 협상단이 국회 사랑재의 작은 방에 모였다. 협상단은 정책보다 먼저 의석수를 따졌는데, 백오십일 석을 채우지 못하면 정부를 꾸릴 수 없기 때문이었다. 사랑재 앞에는 방마다 다른 당의 협상단 이름표가 붙었다.\n\n장관 자리와 예산의 우선순위, 첫 해에 처리할 법안이 차례로 협상에 올랐다. 작은 당의 협상단은 의석에 비해 많은 것을 요구했고 큰 당의 협상단은 듣는 시늉을 하며 시계를 봤다. 협상문 초안은 밤마다 고쳐졌고 아침이면 누군가 그 초안을 언론에 흘렸다. 기자들은 마당에서 밤을 새웠다.\n\n사흘째 밤 제1당 대표는 협상단을 돌려보내고 혼자 남아 탁자 위의 명단 몇 장을 들여다봤다. 어느 명단을 골라도 연정에서 빠지는 당이 생기고, 빠진 당은 다음 선거 때까지 이 일을 잊지 않는다.\n\n그는 펜을 두 번 돌리다가 내려놓고 명단 한 장을 집어 비서관을 불렀고, 내일 아침에 발표하겠다고 말했다. 발표문에 정당 이름을 적는 순서를 정하는 데에도 한참이 걸렸다. 비서관은 그 명단을 받아 밤사이 발표문을 만들었다."
 tfrkphn.7136.d:0 "정부 불신임안이 국회 본회의에 올라왔다. 연정의 표가 흩어진 지 몇 달이 지나 법안은 상임위원회에 묶여 있었고 예산안은 두 번 되돌아왔다. 야당은 더 기다리지 않겠다고 선언했고 연정 소속 의원 몇 사람도 불신임에 찬성하겠다고 밝혔다. 본회의는 오전 열 시에 열렸다.\n\n총리는 표결 전날 밤 연정에 참여한 당의 대표들을 한 사람씩 불렀다. 조건을 내건 대표도 있었고 전화를 받지 않은 대표도 있었다. 새벽까지 통화한 끝에 총리실 비서관은 표가 모자란다고 보고했고, 총리는 창문을 열고 담배를 찾다가 그만두었다.\n\n표결 날 아침 국회 앞에는 기자들이 줄지어 섰고 의원들은 말없이 본회의장으로 들어갔다. 전광판의 숫자가 바뀌는 동안 회의장에서는 아무도 말하지 않았다. 방청석의 기자들은 펜을 쥔 채 전광판만 올려다봤다.\n\n의장이 의사봉을 들 때까지 총리는 자리에서 일어나지 않았고 마지막 연설도 하지 않았다. 불신임안이 통과되면 총리는 물러나거나 국회를 해산하고 총선을 다시 치러야 한다. 국회 사무처는 선거 일정표를 미리 꺼내 두었다."
 tfrkphn.7137.d:0 "패전의 비용은 해마다 다시 청구됐다. 전사자들의 이름은 동네 게시판에 그대로 붙어 있었고 다쳐서 돌아온 사람들은 보훈 창구 앞에서 몇 달씩 기다렸다. 전쟁을 결정한 사람들은 대부분 자리에서 물러났지만 그 부담은 평범한 사람들에게 남았다.\n\n민주당이 해산된 뒤 그 지지자들은 지지할 당을 찾지 못했다. 그들은 신민당이 너무 온건하고 헌정회복연대는 성향이 너무 넓다고 여겼다. 대학가에서는 반전 모임이 학생회관을 채웠고, 전쟁 특수가 끝나 해고된 공단 노동자들은 작은 진보 정당들의 사무실로 모여들어 타협을 말하는 정치인을 믿지 않게 됐다.\n\n반대쪽 끝의 세력도 커졌다. 광화문에서는 패전이 배신 때문이라고 주장하는 집회가 다시 열렸고 우리공화당의 깃발은 줄지 않았다. 지방 소도시에서는 양쪽 집회가 같은 날 같은 광장을 두고 다투기도 했다.\n\n여론조사 기관들은 중도 정당의 지지율이 계속 내려간다고 발표했다. 새 헌법에 따른 첫 총선을 앞두고 정치부 기자들은 의석 전망을 양쪽 끝 정당부터 계산하기 시작했다."
 tfrkphn.7138.d:0 "대통령의 임기가 마지막 해에 들어섰다. 비서실 달력에는 이사 날짜가 연필로 적혔고 여의도의 관심은 다음 대통령 후보로 옮겨 갔다. 헌법이 단임제여서 김부겸은 다시 출마할 수 없었고, 그는 그것을 아쉬워하는 기색을 보이지 않았다.\n\n신민당에서는 부총리로 나라 살림을 맡아 온 김동연과 국무총리로 국회에서 개혁 법안을 방어해 온 임종석이 후보로 거론됐다. 김동연은 경제 관료 출신이고 임종석은 오랫동안 당과 국회에서 일했다. 두 사람 모두 출마 뜻을 숨기지 않았다.\n\n두 사람의 사무실은 같은 층 복도의 양쪽 끝에 있었다. 보좌관들은 복도 가운데 정수기 앞에서 마주쳐도 고개만 숙이고 지나갔고, 기자들은 누가 먼저 복도를 건너 상대 사무실을 찾아갈지를 두고 내기를 했다.\n\n김부겸은 어느 쪽도 공개적으로 지지하지 않았다. 그는 두 사람을 함께 불러 대구식 육개장으로 밥을 한 번 먹었는데, 그 자리에 배석한 비서관들도 세 사람이 무슨 이야기를 했는지 듣지 못했다. 두 캠프는 그 식사를 저마다 자기 쪽에 유리하게 해석했다."
 tfrkphn.7139.d:0 "대통령의 임기가 마지막 해에 들어섰다. 비서실 달력에는 이사 날짜가 연필로 적혔고 여의도의 관심은 다음 대통령 후보로 옮겨 갔다. 헌법이 단임제여서 김동연은 다시 출마할 수 없었고, 그는 마지막 해의 예산 장부를 다시 펴는 것으로 새해 업무를 시작했다.\n\n신민당에서는 국무총리로 국회와 거리를 오가며 정부 정책을 설명해 온 김부겸과 경제부총리로 빚 상환을 함께 마무리한 홍남기가 후보로 거론됐다. 김부겸은 평생 선거를 치른 정치인이고 홍남기는 경제 관료 출신이다.\n\n두 사람의 사무실은 같은 층 복도의 양쪽 끝에 있었다. 보좌관들은 복도 가운데 정수기 앞에서 마주쳐도 고개만 숙이고 지나갔고, 기자들은 누가 먼저 복도를 건너 상대 사무실을 찾아갈지를 두고 내기를 했다.\n\n김동연은 어느 쪽도 공개적으로 지지하지 않았다. 그는 두 사람을 함께 불러 자기가 고른 국숫집에서 밥을 한 번 먹었고, 비서관들은 두 사람 가운데 누가 그릇을 비웠는지를 두고 내기를 했다. 식사는 한 시간 만에 끝났고 세 사람은 따로 차를 타고 돌아갔다."
 tfrkphn.7140.d:0 "두 사람은 민주화 운동 기념관의 작은 강당에서 만났다. 강당 벽에는 오래전 거리에서 함께 최루탄을 맞던 두 야당 지도자의 사진과, 한 사람이 갇혀 있던 집 담장 너머로 다른 한 사람이 안부를 묻는 사진이 걸려 있었다. 누가 이 장소를 골랐는지는 알려지지 않았다.\n\n당 바깥 사정은 좋지 않았다. 패전 뒤에 커진 양쪽 끝의 세력이 광장을 나눠 차지했고 헌정회복연대는 정권을 되찾을 준비를 하고 있었다. 신민당 원로들은 이번에도 둘로 나가면 둘 다 진다고 두 사람을 설득했다. 당원들은 당사 앞에서 두 사람의 이름을 함께 적은 손팻말을 들었다.\n\n[TFRKPHN_nx_A]과 [TFRKPHN_nx_B], 두 사람은 그 사진들 앞에 나란히 서서 기자들의 촬영에 응했다. 두 사람은 누가 출마할지를 일주일 안에 정하겠다고 발표하고, 비가 내리는 강당 밖에서 같은 차를 타고 돌아갔다.\n\n지지자들은 그 차가 골목을 빠져나갈 때까지 휴대전화로 촬영했다. 다음 날 아침 거의 모든 신문이 두 사람이 나란히 선 사진을 일 면에 싣고 함께 간다는 제목을 달았다."
 tfrkphn.7141.d:0 "선거는 처음부터 신민당이 앞섰다. 단일 후보는 첫 여론조사에서 일 위를 했고, 후보를 양보한 사람은 유세 첫날부터 같은 유세차에 올라 손을 흔들었다. 지지자들은 두 사람이 함께 나올 때마다 박수를 쳤다. 두 사람은 선거 기간에 전국의 시장과 공단을 함께 돌았다.\n\n헌정회복연대의 권영세는 선거 막판까지 추격했지만 격차를 줄이지 못했다. 양쪽 끝 정당의 후보들은 집회에 많은 사람을 모았지만 그 사람들이 투표소까지 가지는 않았고, 두 정당은 서로를 공격하느라 신민당을 비판할 여유가 없었다.\n\n당선자는 개표가 끝난 밤 [TFRKPHN_nx_prev] 대통령에게 가장 먼저 전화를 걸었다. 신민당 원로들은 오랜만에 한 식당에 모여 늦게까지 술을 마셨고, 후보를 양보한 사람은 당선자 옆자리를 끝까지 지켰다. 당선자는 수락 연설에서 양보한 사람의 이름을 가장 먼저 불렀다.\n\n고참 기자들은 그날 기사에 이번에는 두 사람이 갈라서지 않았다고 적고, 민주화 운동 기념관에 걸려 있던 옛 사진을 함께 실었다. 헌정회복연대는 이튿날 아침 패배를 인정하는 논평을 냈다."
 tfrkphn.7142.d:0 "일주일 뒤 신민당 당사에서는 출마 선언이 두 번 열렸다. 오전에는 [TFRKPHN_nx_A] 후보가, 오후에는 [TFRKPHN_nx_B] 후보가 같은 연단에 섰고, 당원들은 앞줄에 앉은 사람만 바뀐 행사장에서 박수를 두 번 쳤다. 두 선언문은 공약 순서까지 거의 같았다.\n\n단일화 협상은 세 번 열려 세 번 모두 깨졌다. 두 캠프는 첫 번째 협상에서 여론조사 방식을, 두 번째 협상에서 경선 날짜를 합의하지 못했고, 세 번째 협상에서는 어느 쪽도 먼저 양보하겠다고 말하지 않았다. 양쪽 모두 자기 후보가 이긴다는 조사 결과를 들고 있었다.\n\n지역 조직도 둘로 갈려 같은 당 당원들이 서로 다른 유세 버스를 탔다. 원로들은 민주화를 이루고도 두 후보가 따로 나서 정권을 내준 옛 선거를 예로 들며 말렸지만, 두 캠프는 이번에는 다르다며 듣지 않았다.\n\n헌정회복연대의 권영세는 유세를 짧게 하고 상대 후보의 이름을 한 번도 입에 올리지 않았다. 그의 선거 사무실은 매일 일찍 불을 껐다. 그의 캠프는 신민당 두 후보의 지지율을 따로 적은 표를 날마다 새로 만들었다."
 tfrkphn.7143.d:0 "개표 방송의 그래프는 밤새 세 갈래로 움직였다. 신민당의 두 후보가 엎치락뒤치락하는 동안 권영세의 득표가 조금씩 앞서 나갔고, 방송사들은 자정 무렵 권영세의 당선이 유력하다는 자막을 내보냈다. 신민당의 두 당사는 거의 같은 시각에 불을 껐다.\n\n두 후보의 표를 더하면 과반을 훨씬 넘었다. 다음 날 아침 거의 모든 신문이 사설에 그 합계를 실었고, 한 당원은 그 숫자를 오려 당사 문 앞에 붙였다. 신민당 원로들은 그날 아침 아무도 기자들의 전화를 받지 않았다.\n\n[TFRKPHN_nx_A]과 [TFRKPHN_nx_B], 두 사람은 각자의 당사에서 짧게 승복 연설을 했지만 서로의 이름을 부르지 않았다. [TFRKPHN_nx_prev] 대통령은 그날 밤 성명을 내지 않았다. 지지자 몇 사람은 당사 앞 계단에 앉아 날이 밝을 때까지 자리를 지켰다.\n\n권영세는 당선 소감에서 국민의 뜻을 겸허히 받들겠다고 말했다. 양쪽 끝 정당의 지지자들은 그날 밤에도 광장에서 집회를 이어 갔다. 헌정회복연대 당사 앞에서는 지지자들이 새벽까지 당가를 불렀고, 권영세는 이튿날 첫 일정으로 국립묘지를 찾았다."
 tfrkphn.7144.d:0 "사정이 길어지자 조사를 받은 장성들의 동기 모임이 성명을 냈고 재계는 투자 계획을 미뤘다. 보수 신문들은 사설마다 표적 사정이라는 말을 썼고, 여당 안에서도 속도를 늦추자는 의원이 늘었다. 검찰청 앞에서는 수사 중단을 요구하는 집회가 열렸다.\n\n대통령에게는 두 가지 길이 있었다. 첫 번째는 반발하는 세력과 손잡는 것이다. 그러면 개혁은 이름만 남겠지만 확실한 아군을 얻는다. 두 번째는 김영삼처럼 하는 것이다. 김영삼은 3당 합당이라는 도박으로 대통령이 된 뒤 하나회를 완전히 숙청했다. 하지만 보수 정치는 갈라졌고 김영삼계는 훗날 당에서 밀려났다.\n\n그들을 상대할수록 지지율이 오르는 만큼 반발도 커졌다. 여당 안에서도 이쯤에서 그만하자는 말이 나왔다. 그의 펜 하나에 정권의 움직임이 달라질 수도 있다. 대통령이 된 이상 결단을 내려야 한다. 개혁인가, 안정인가."
 tfrkphn.7145.d:0 "기획재정부 국고국의 한 직원이 새벽에 마지막 상환 전표를 출력했다. 전표의 결재란 세 칸에 국장과 차관, 장관이 차례로 도장을 찍었고, 마지막 도장이 찍히자 누군가 사무실 창문을 열었다. 결재는 십 분도 걸리지 않았다.\n\n대통령은 아침 아홉 시에 한 장짜리 원고를 들고 춘추관에 서서 패전 뒤 나라가 진 빚을 마지막 한 푼까지 갚았다고 발표했다. 그는 평소처럼 건조한 목소리로 숫자를 읽었는데, 기자들은 원고를 접는 그의 손끝이 조금 떨렸다고 기사에 적었다. 발표는 삼 분 만에 끝났다.\n\n금 모으기 줄에 섰던 사람들과 문 닫은 공장으로 돌아가지 못한 사람들, 야간 강의실의 학생들이 그 발표를 들었다. 박수를 친 사람도 있었고 눈물을 훔친 사람도 있었다. 시장 골목의 한 국밥집 주인은 그날 하루 국밥 값을 받지 않았다.\n\n국고국 직원은 퇴근길에 전표 사본을 찍어 가족 단톡방에 올렸다. 금 모으기 때 받은 확인증 사진도 같이 올렸다."
 tfrkphn.7146.a:0 "사정의 속도를 늦춘다."
 tfrkphn.7146.b:0 "사정은 그대로 간다."
 tfrkphn.7146.d:0 "그날 밤 대통령이 물었다.\n정말 다시 생각해 보지 않겠는가?\n죄송합니다. 사정이 이 속도면 시장이 버티지 못합니다. 대통령님과 저는 걷는 길이 다릅니다.\n\n몇 시간 뒤 뉴스에는 김동연 부총리가 잠시 쉬겠다는 소식이 나왔지만, 모두 사퇴라는 것을 알았다. 첫 반응은 기자실에서 나왔다.\n대통령과 갈등이 있었다는 게 사실입니까?\n후임자는 누구입니까?\n\n시장도 반응했다. 소식이 뜨자마자 주가는 몇 시간 만에 5% 넘게 급락했다."
 tfrkphn.7147.d:0 "헌정회복연대의 김무성이 오래된 한정식집 안쪽 방으로 대통령을 초대했다. 연정의 한 축을 이끄는 사람이 대통령을 따로 부르는 일은 드물어서 비서실은 초대에 응할지를 한나절 의논했다. 김무성은 예전에 개헌 이야기를 꺼냈다가 하루 만에 거둬들인 적이 있다. 방에는 두 사람만 들어갔다.\n\n그는 술을 한 잔 따른 뒤, 연대가 지금까지 개혁 법안마다 표를 보탰으니 이제 권력 구조를 논의하자고 말했다. 대통령 한 사람에게 권한이 몰린 헌법을 그대로 두면 다음 정부도 같은 일을 겪는다는 주장이었다.\n\n대통령은 잔을 비우지 않고, 개혁이 끝나기 전에 개헌 논의를 시작하면 개혁이 묻힌다고 답했다. 김무성은 웃으며 고개를 끄덕이면서도 같은 요구를 한 번 더 했다. 연정이 깨지면 개혁 법안도 통과되지 않는다는 사정을 두 사람 모두 알고 있었다.\n\n두 사람은 문 앞에서 두 손으로 악수하고 헤어졌다. 다음 날 연대의 원내대표는 법사위 일정을 하루 미뤘다. 대통령실은 그날 저녁 식사를 일정표에 올리지 않았고, 연대도 따로 설명하지 않았다."
 tfrkphn.7148.d:0 "공기업 매각안이 국무회의에 올라온 날 국무총리 김부겸이 처음으로 반대 발언을 했다. 매각 대상에 대구 공단의 오래된 기계 회사가 들어 있었는데, 김부겸은 대구에서 거듭 낙선하던 시절에도 그 회사의 노조 위원장을 해마다 찾아갔고 그 집 아이들의 이름까지 기억했다.\n\n총리는 매각안의 숫자를 반박하는 대신 그 공장 정문 앞에서 매일 아침 담배를 피우는 노동자 몇 사람의 이름을 불렀다. 장관들은 서로 눈을 피했고 경제부처 차관 한 명은 손을 들었다가 내렸다. 회의실에서는 한동안 서류 넘기는 소리만 났다.\n\n대통령은 끝까지 듣고 회의를 중단했다. 매각을 미루면 나라 빚이 다시 늘어나고, 그대로 진행하면 그 공장 노동자들이 일자리를 잃는다. 회의는 이미 예정 시간을 한참 넘기고 있었다. 장관들은 휴대전화로 다음 일정을 미뤘다.\n\n대통령은 자정 무렵 총리에게 전화를 걸어 내일 아침 국무회의에서 결정하겠다고 짧게 알렸다. 그는 전화를 끊고 장부를 다시 펴서 매각 대상 명단의 맨 아래 줄을 손가락으로 짚은 채 한참 앉아 있었다."
 tfrkphn.7149.d:0 "헌정회복연대는 그 어느 때보다 바빴다. 탄핵과 국회 포격, 그리고 다시 탄핵. 나라 꼴이 이러니 뭐가 제대로 돌아갈 리가 없다. 김무성은 TV 카메라 앞에서 서류 한 장을 꺼내 들었다.\n대통령님, 이게 지난 정부들의 계산서입니다. 대통령 한 사람이 다 쥐는 제도가 이 빚을 만들었습니다. 저는 이 자리에서 대통령님께 호소합니다. 개헌을 해서라도 이 빚을 갚아야 합니다. 다 못 갚으면 우리 모두 현해탄으로 뛰어내려야 합니다.\n\n그날 저녁 청와대의 계산기는 그 어느 때보다 분주했다."
 tfrkphn.7150.d:0 "개헌안이 국회 본회의에 올라왔다. 국민투표에 부치려면 재적 의원 3분의 2인 이백 명이 찬성해야 했고, 대통령은 그 이백 석을 채우려고 지난 몇 달 동안 원로를 찾아가고 야당 의원들과 밥을 먹고 선거구를 양보했다.\n\n표결 날 본회의장에는 빈자리가 없었고 방청석에는 기자들과 원로들이 섞여 앉았다. 국회의장이 결과를 읽기 직전 전광판에 찬성과 반대의 숫자가 함께 떴다. 의원들은 누가 어느 쪽을 눌렀는지 서로 확인하지 않았다. 신민당 의원석에서는 김부겸과 김동연이 서로 떨어져 앉아 있었다.\n\n국회 앞에서는 찬반 집회가 길 하나를 사이에 두고 맞섰다. 방송사들은 화면 한쪽에 이백 석까지 남은 표를 세는 그래픽을 띄웠다.\n\n대통령은 중계를 보지 않겠다고 했다. 대변인 책상에는 통과됐을 때와 부결됐을 때 읽을 담화문 두 가지가 나란히 놓여 있었다."
 tfrkphn.7151.d:0 "개헌안은 국회에서 부결됐다. 찬성이 과반을 넘었지만 3분의 2에는 몇 석이 모자랐고, 신문들은 모자란 의석수를 기사 첫 줄에 적었다. 국민투표는 열리지 않는다.\n\n의장이 부결을 선포하자 본회의장이 한꺼번에 시끄러워졌다. 반대한 쪽은 피켓을 들고 퇴장했고, 찬성한 쪽에서는 역사의 죄인들이라는 고함이 터졌다. 누가 마지막에 마음을 바꿨는지 묻는 기자들이 복도를 메웠다.\n\n김무성은 국회 로비에서 기자들을 만났다. 그는 크게 웃으며 표가 모자라면 더 모으면 된다고 했다. 다음은 언제냐는 질문에도 또 웃었다. 뒤에 선 의원들 가운데 따라 웃는 사람은 없었다.\n\n평생 다른 사람의 표를 세어 준 그가 자기 개헌안의 표는 채우지 못했다. 그날 밤 여당 단톡방에는 반대표를 던진 사람을 찾는 메시지가 끝없이 올라왔다."
 tfrkphn.7152.d:0 "총선을 앞두고 각 당이 공약집을 찍어 냈다. 공약집들은 첫 장에서 똑같이 패전 뒤의 나라를 어떻게 다시 세울지를 물었지만 둘째 장부터는 숫자와 약속이 당마다 달랐다. 인쇄소 주인들은 이번 선거가 어느 때보다 바쁘다고 했다.\n\n집권 연정의 선거대책위원회는 마지막 회의에서 칠판에 개혁, 안정, 경계라는 세 단어를 적었다. 연정에 참여한 당들은 저마다 다른 단어에 동그라미를 쳤고, 어느 단어를 앞세우느냐에 따라 총선 뒤의 의석 분포가 달라질 터였다. 회의는 세 시간을 넘겼지만 세 단어 가운데 하나를 고르지 못했다.\n\n광장에서는 이미 선거전이 시작돼, 한쪽 끝의 당들은 패전의 책임을 물었고 반대쪽 끝의 당들은 배신의 책임을 물었다. 여론조사 기관들은 중도 정당을 고르는 유권자가 줄고 있다고 발표했지만 투표하겠다는 사람은 여전히 중도층에 가장 많았다.\n\n총리는 회의가 끝날 무렵 칠판 앞으로 걸어가 분필로 한 단어 아래에 줄을 그었다. 회의실에 있던 사람들은 말을 멈췄고, 대변인은 그 단어를 받아 적어 선거 구호 시안을 만들러 나갔다."
 tfrkphn.7153.d:0 "연정에 참여한 당의 대표가 총리실을 찾아와 문을 닫고 한 시간 넘게 총리와 언성을 높였다. 복도의 비서관들은 목소리를 들었지만 내용을 기록하지 않았고, 문이 열렸을 때 두 사람의 얼굴은 붉어져 있었다.\n\n그 당은 자기 당 공약 하나를 이번 회기 안에 처리해 달라고 요구했고, 들어주지 않으면 다음 예산안 표결에서 자유 투표를 하겠다고 통보했다. 연정의 표가 흩어지면 과반이 위태로워서 총리실은 그날 오후 내내 표 계산을 했다.\n\n정부 안에서는 연정이 깨지면 모든 것을 잃으니 들어주자는 의견과 한 번 물러서면 다음 요구가 또 온다는 의견이 맞섰다. 회의는 결론 없이 끝났고 장관들은 각자 차에 오르면서 전화를 걸었다. 한 장관은 차 문을 닫기도 전에 그 당의 원내대표와 통화를 시작했다.\n\n총리는 퇴근 직전 그 당의 대표에게 내일 아침 다시 만나자는 문자를 보냈지만 답장을 받지 못했다. 그는 휴대전화를 책상에 엎어 두고 새벽까지 잠들지 못했다. 총리실 직원들은 다음 날 아침 총리 일정을 모두 비워 두었다."
 tfrkphn.7154.d:0 "연정 협약서 서명이 끝나고 총리의 이름을 적는 칸 하나가 남았다. 새 헌법에서 총리는 국회의 신임을 받아 취임하고 불신임을 받으면 물러나기 때문에, 누가 총리가 되느냐에 따라 연정이 얼마나 오래갈지가 달라진다. 연정의 당들은 저마다 다른 사람을 총리로 생각하고 있었다.\n\n제1당 안에서는 당을 오래 이끌며 협상을 마무리한 사람과 연정 상대 당들과 더 가까운 사람이 후보로 거론됐다. 당원들은 앞사람을, 연정 상대 당들은 뒷사람을 원했다.\n\n의원총회는 밤늦게까지 이어졌지만 표결은 하지 않기로 했다. 표결에서 진 쪽이 연정이 흔들릴 때 먼저 등을 돌린다는 우려 때문이었고, 원로 몇 사람은 일찍 자리를 떴다. 회의장 밖 복도에서는 두 사람을 지지하는 의원들이 따로 모여 있었다.\n\n결정은 당 대표에게 넘어갔다. 다음 날 아침 국회의장실로 보낼 공문에는 이름 칸이 비어 있었고 비서관은 펜을 들고 기다렸다. 당 대표는 두 사람을 차례로 불러 짧게 이야기했는데 두 사람 모두 자기를 지명해 달라고 말하지 않았다."
 tfrkphn.7155.d:0 "신민당의 김부겸과 김동연이 함께 청와대를 찾아왔다. 야당 대표 두 사람이 나란히 대통령을 만난 것은 이 정부 들어 처음이어서 기자들은 두 사람이 차에서 내리기 전에 무언가 의논하는 모습까지 사진에 담았다.\n\n두 사람은 개헌안에 넣을 조건 세 가지를 손으로 적은 종이 한 장을 내놓았다. 총리 불신임에 건설적 불신임 방식을 쓰고, 지방에 권한을 나누고, 비례대표를 늘리라는 조건이었다. 두 사람은 이 조건을 받아들이면 신민당 안에서 찬성표를 모아 보겠다고 했다. 종이에는 두 사람의 서명이 나란히 있었다.\n\n대통령은 조건을 하나씩 소리 내어 읽고는 세 가지 모두 자기가 오래전부터 생각해 온 것이라고 웃으며 말했다. 그 말이 조건을 받아들인다는 뜻인지 알 수 없어서 두 야당 대표는 웃지 않았고, 배석한 비서관들도 대통령의 뜻을 짐작하지 못했다.\n\n면담은 사십 분 만에 끝났고 세 사람은 사진을 찍지 않았다. 다음 날 신문들은 세 사람의 이름을 설명에 적은 빈 회의실 사진을 실었다. 대통령실은 면담 내용을 한 줄로만 발표했다."
 tfrkphn.7156.d:0 "개헌 표결을 앞두고 신민당이 둘로 갈렸다. 김동연은 의원총회에서 권력을 나누는 헌법이라면 반대할 이유가 없다고 말했고, 김부겸은 대통령이 임기 끝에 헌법을 바꾸려는 의도를 믿을 수 없다고 말했다. 의원들은 가운데 통로를 사이에 두고 두 사람 쪽으로 나뉘어 앉았다.\n\n신민당은 과거와 똑같았다. 우리는 역사에서 배운 게 없다고 당 원로 하나가 혀를 찼다. 이대로라면 당은 다시 갈라질 것이다. 의원들은 반대할 만한 의원들 이름에 빨간 동그라미를 치고 찬성을 강요하기도 했다.\n\n김동연 쪽이 먼저 움직였다. 반대하는 의원들에게 상임위원장 자리 같은 대가를 주자고 대통령에게 제안해 온 것이다. 하지만 그건 김부겸과의 관계가 파탄 난다는 걸 의미했다. 대통령은 이것만은 안 된다고 했지만, 스스로도 다시 생각하기 시작했다.\n\n다음 날 국회는 어제와 달리 조용했다. 중계 화면을 보던 대통령은 더 긴장했다. 김동연에게도 김부겸에게도 아직 연락하지 않았다. 표결까지 남은 시간은 하루였다."
 tfrkphn.7157.d:0 "대통령은 대구에 내려간 길에 홍준표의 집을 찾았다. 탄핵으로 물러난 홍준표는 고향 가까운 이 도시에서 손님을 거의 받지 않고 지냈고, 날마다 신문 세 개를 끝까지 읽었다. 대문 앞에는 경호원 두 명이 서 있었고 수행원들은 차 안에서 기다렸다.\n\n두 사람은 같은 도시에서 정치를 했지만 같은 당에 있었던 적이 없다. 김부겸은 이 도시에서 여러 번 낙선했고 홍준표는 이 도시에서 출마해 당선됐다.\n\n사정은 이미 홍준표 정부의 장관 몇 사람에게까지 닿아 있었고, 홍준표가 그 이야기를 먼저 꺼냈다. 검사 시절 권력형 비리 수사로 이름을 얻은 그는 돌려 말하지 않고, 수사를 시작한 사람은 그 수사가 어디까지 가는지 끝까지 책임져야 한다고 말했다. 자기도 그런 수사를 해 봤다는 말도 했다.\n\n대통령은 그 말에 대답하지 않고, 패전 뒤 홍준표가 혼자 졌던 책임을 이제 나라가 나누어 지고 있다고 말했다. 홍준표는 찻잔을 내려놓았다. 두 사람은 대문 앞에서 짧게 인사하고 헤어졌다. 대통령은 차에 오르기 전에 대문 쪽을 한 번 돌아봤다."
 tfrkphn.7158.d:0 "나라 빚 장부의 첫 장에는 바다 건너로 보낸 군대와 돌아오지 못한 배, 그 뒤에 날아온 청구서들이 적혀 있다. 이 빚은 홍준표 정부 때 생겼고 김동연 정부가 갚고 있었다. 장부는 임기 첫날부터 대통령 책상에 놓여 있었다.\n\n그 무렵 홍준표가 오랜만에 긴 글을 올려 긴축만으로는 나라를 지킬 수 없다고 주장했다. 전쟁을 결정한 사람이 할 말은 아니라는 비판이 먼저 쏟아졌지만 그 글은 하루 만에 수십만 번 읽혔다.\n\n비서실은 대응하지 말자고 건의했다. 대통령은 그 글을 출력해 끝까지 읽다가 전쟁 첫해의 국채 이자를 잘못 적은 숫자 하나를 찾아내 연필로 동그라미를 쳤다. 그는 틀린 숫자 옆에 맞는 숫자를 적어 넣고 종이를 서랍에 넣었다.\n\n대통령은 다음 날 국무회의에서 전 정부 이야기를 꺼내지 않고 장부의 첫 장을 펴서 장관들에게 돌렸다. 장관들은 그 장을 빨리 넘겼고, 회의가 끝난 뒤 비서관이 그 장을 장부 맨 앞에 다시 끼웠다. 경제부총리는 그날 오후 국채 이자 지급 내역을 연도별로 정리해 공개했다."
 tfrkphn.7159.d:0 "대통령은 개헌 표결을 앞두고 전직 대통령 홍준표를 만나러 대구로 내려갔다. 두 사람은 같은 보수 정당의 대표를 차례로 지냈고, 서로 비난한 적도 많았지만 같은 선거를 함께 치른 적도 있다. 두 사람이 따로 만난 것은 탄핵 뒤로 처음이다.\n\n탄핵 뒤 홍준표를 따르던 의원들은 헌정회복연대와 작은 당들로 흩어졌다. 개헌안이 이백 석을 넘기려면 그 의원들의 표가 필요해서, 정무수석은 그 명단을 들고 대통령과 함께 기차에 올랐다. 명단에는 열두 명의 이름이 적혀 있었다.\n\n홍준표는 대통령의 이야기를 끝까지 듣고, 권력을 나누는 헌법이 왜 필요한지는 권력을 가져 본 사람이 안다고 말했다. 자기는 그 권력의 무게를 견디지 못하고 물러났다는 말도 했다. 그는 돕겠다는 약속도 거절도 하지 않았다.\n\n대구역 앞에서 기다리던 기자들이 무슨 얘기를 나눴느냐고 묻자 대통령은 옛날 얘기만 했다고 했다. 다음 주에 의원 몇 사람이 조용히 찬성 명단에 이름을 올렸는데, 누가 그들에게 전화를 걸었는지 밝힌 사람은 없다. 홍준표는 그 뒤로도 개헌에 대해 공개적으로 말하지 않았다."
 tfrkphn.7160.d:0 "헌정회복연대의 원내대표가 기자회견을 열어 종이 한 장을 들어 보였다. 몇 해 전 대통령과 연대 대표가 만나 나눈 약속을 정리한 메모였고, 대통령이 개헌 논의를 시작하겠다고 해서 연대가 표를 보탰다는 내용이 두 사람의 서명과 함께 적혀 있었다.\n\n청와대 대변인은 개혁 일정이 먼저였다고 해명했지만 연대 의원들은 그 해명을 받아들이지 않았다. 저녁 뉴스는 메모의 손글씨를 화면 가득 내보냈다. 청와대는 메모가 진짜인지에 대해서는 말하지 않았다.\n\n다음 날 연대 소속 장관 두 명이 사표를 냈고 본회의에 올라 있던 법안 세 건의 표결이 미뤄졌다. 연정이 깨지지는 않았지만 정무수석이 연대 의원들에게 돌린 전화는 대부분 연결되지 않았다. 사표를 낸 장관들은 이임식도 하지 않고 청사를 떠났다.\n\n김무성은 그날 기자들 앞에 나서지 않고 저녁에 대통령에게 짧은 문자를 보냈다. 두 사람은 그 문자의 내용을 공개하지 않았다. 신민당은 그날부터 다음 대선에서 연대의 지원을 받기 어렵다고 보고 선거 전략을 다시 짜기 시작했다."
 tfrkphn.7161.d:0 "[TFRKPHN_nx_W] 대통령의 임기는 큰 개혁도 큰 위기도 없이 조용하게 지나갔다. 후보를 양보했던 [TFRKPHN_nx_O] 쪽은 당 대표를 맡아 국회를 이끌었고, 두 사람은 한 달에 한 번 같은 식당에서 점심을 먹었다. 그 식당 주인은 두 사람이 앉던 자리를 다른 손님에게 내주지 않았다.\n\n다음 대선이 다가왔을 때 신민당에서는 후보 경쟁이 벌어지지 않았다. 당은 일찌감치 [TFRKPHN_nx_O] 후보를 추대했고, 현직 대통령은 출마 선언장 맨 앞줄에 앉아 축사 없이 박수를 쳤다. 기자들은 현직 대통령이 다음 후보의 선언장에 앉아 있는 모습을 처음 본다고 기사에 적었다.\n\n선거는 이번에도 신민당이 여유 있게 이겼다. 헌정회복연대가 젊은 후보를 냈지만 신민당의 연속 집권을 막지 못했고, 양쪽 끝 정당들의 득표는 지난 선거보다 줄었다. 두 사람은 개표 방송을 한 방에서 함께 봤다.\n\n두 사람은 취임식 날 단상에 나란히 섰고 객석의 원로 몇 사람은 손수건을 꺼냈다. 신문들은 세 김씨의 시대 다음에 온 두 사람의 집권기가 한 번의 다툼 없이 끝났다고 정리했다."
 tfrkphn.7162.d:0 "권영세 정부는 여소야대로 출발했다. 신민당에서 갈라진 두 당은 표를 합치면 어떤 법안이든 막을 수 있었지만 법안마다 따로 움직였고, 정부는 그 틈에 법안을 하나씩 통과시켰다. 국회가 열려 있어도 큰일이 처리되지 않아서 사람들은 이 몇 해를 기다림의 시절이라고 불렀다.\n\n임기 셋째 해 겨울 밤사이에 [TFRKPHN_nx_A] 쪽이 헌정회복연대와 합당한다는 발표가 나왔다. [TFRKPHN_nx_A] 쪽 당사에서는 호랑이를 잡으려면 호랑이 굴에 들어가야 한다는 말이 나왔고, [TFRKPHN_nx_B] 쪽 사람들은 이 합당을 배신이라고 불렀다.\n\n다음 대선에서 [TFRKPHN_nx_A] 후보는 여당 후보로 나서 이겼고 [TFRKPHN_nx_B] 후보는 다시 졌다. [TFRKPHN_nx_B] 후보는 한동안 정계를 떠났다가 돌아와 그다음 선거에서 당선됐는데, 그가 귀국하던 날 공항에는 지지자들이 줄을 섰다.\n\n두 사람은 십 년에 걸쳐 차례로 대통령이 되었다. 먼저 된 쪽은 손잡아서는 안 될 상대와 손을 잡았다는 비판을, 나중에 된 쪽은 너무 늦게 왔다는 말을 평생 들었다. 그 십 년 동안 갈라진 두 당의 지지층은 다시 합쳐지지 않았다."
 tfrkphn.7166.d:0 "국회의사당 돔의 그을음은 석 달이 지나도록 그대로였다. 정부는 돔을 고치는 예산보다 국민투표 예산을 먼저 편성했고, 새 헌법안은 공고 스무 날 만에 투표에 부쳐졌다. 투표소마다 완장을 찬 청년 애국단이 나와 줄을 세웠다.\n\n새 헌법은 대통령에게 국회 해산권과 법률과 같은 효력을 가진 명령권을 줬다. 대통령을 탄핵하려면 국회 4분의 3과 대법원, 헌법재판소가 모두 동의해야 했다. 선거관리위원회는 투표율이 절반을 겨우 넘겼고 찬성이 58퍼센트라고 발표했다. 부칙에는 나라가 안정될 때까지 지방선거를 미룬다는 조항이 들어갔다.\n\n같은 날 치른 국회의원 선거 결과는 대통령의 기대와 달랐다. 우리공화당은 3분의 1에도 못 미치는 의석을 얻었고, 해산된 민주당 사람들이 무소속으로 나와 여러 곳에서 당선됐다. 조원진은 개표 방송을 끝까지 보지 않고 자리를 떴다.\n\n이튿날 아침 그는 새 헌법에 서명했다. 서명식은 그을린 본회의장을 피해 청와대 영빈관에서 열렸다. 그는 서명에 쓴 만년필을 홍문종 총리에게 건넸다."
 tfrkphn.7167.d:0 "국무회의는 팔월 십오일을 건국절로 정했다. 조원진은 그날 광화문 광장에 세울 이승만 동상의 받침돌 앞에서 연설했다. 받침돌에는 \"뭉치면 살고 흩어지면 죽는다\"가 새겨졌다. 그는 이 나라를 세운 사람을 이 나라가 오랫동안 부끄러워했다고 말했고, 연단 아래의 노인과 청년들은 태극기를 흔들며 울었다.\n\n동상은 높이 십이 미터로 정해졌다. 건립 비용은 국민 성금으로 모으기로 했고 공무원과 공기업 직원은 월급에서 하루 치를 냈다. 교육부는 새 학기 교과서의 대한민국 수립이라는 말을 대한민국 건국으로 고쳤다. 역사 교사 이천 명이 반대 성명에 이름을 올렸다.\n\n광장 한쪽에는 사월에 쓰러진 학생들을 기리는 표지석이 있었다. 제막식 날 아침 대학생 삼백 명이 그 앞에서 침묵 시위를 했다. 경찰이 그들을 광장 밖으로 밀어냈고, 청년 애국단이 뒤따라가 태극기 깃대로 길을 막았다.\n\n조원진은 동상을 덮은 흰 천을 직접 걷었다. 그는 집무실에 걸린 역대 대통령 사진의 순서를 바꿔 이승만의 사진을 자기 책상 맞은편에 걸게 했다."
 tfrkphn.7168.d:0 "전쟁이 끝난 뒤 달러와 원자재는 정부만 가지고 있었다. 밀가루와 설탕, 면화를 누가 얼마에 받는지는 재정경제부의 배정표 한 장이 정했다. 배정받은 물건은 공장 문을 나서는 순간 값이 세 배가 됐다.\n\n조원진은 취임 때 전쟁으로 돈을 번 기업인들을 벌주겠다고 약속했고, 검찰은 재벌 회장 스물네 명을 조사했다. 조사는 석 달 만에 끝났다. 회장들은 여당 후원회 명단 맨 앞에 이름을 올렸고, 배정표 윗줄에는 그 회장들의 회사가 적혔다.\n\n정부는 전쟁 중에 압류하거나 떠맡은 공장과 은행 주식도 그들에게 넘겼다. 값은 감정가의 십 분의 일이었고 대금은 열다섯 해에 나눠 내면 됐다. 방송사 두 곳과 일간지 세 곳도 불하 목록에 들어 있었다. 배정표에 이름이 없는 중소 공장은 원료를 암시장에서 샀다.\n\n그해에는 밀가루와 설탕과 면방직 공장을 가진 회사들이 가장 많은 돈을 벌었다. 시장 사람들은 배정표에 오르는 일을 줄을 댄다고 불렀다. 광화문에서 태극기를 들던 사람들이 설탕값을 내려 달라며 같은 자리에 다시 모였다."
 tfrkphn.7169.d:0 "재계 7위 그룹의 회장은 새 권한대행이 연 첫 재계 만찬에 삼십 분 늦게 도착했다. 비서실은 폭설 탓이라고 해명했다. 그 그룹은 지난 선거 때 낸 후원금도 재벌들 가운데 가장 적었다. 회장은 평소 정치인과 가깝게 지내지 않는 것을 자랑으로 삼았다.\n\n석 달 뒤 금요일 오후, 주거래 은행이 그 그룹의 어음 결제를 거절했다. 은행장은 청와대의 전화를 받고 한 시간 만에 결정을 내렸다. 계열사 스물한 곳의 부도 소식이 저녁 뉴스에 나왔고, 그룹을 나누는 방안은 주말 사이 정부 청사에서 정리됐다. 회장은 은행에 전화를 걸었지만 은행장이 자리에 없다는 답만 들었다.\n\n월요일 아침 신문에는 계열사를 누가 가져가는지 적은 표가 실렸다. 신발 공장은 재계 3위에게, 건설사와 종합상사는 5위에게 넘어갔다. 인수 대금은 은행이 새로 빌려줬다. 본사 사옥에는 그 주에 다른 그룹의 간판이 걸렸다.\n\n직원 삼만 팔천 명은 출근해서야 회사 주인이 바뀐 것을 알았다. 다음 재계 만찬에는 회장들이 한 시간 먼저 와서 기다렸다."
 tfrkphn.7170.d:0 "선거를 반년 앞둔 여론조사에서 조원진의 지지율은 한 자릿수였다. 그는 담화를 내고 다음 선거에 나가지 않겠다고 말했다. 우리공화당 사무실에는 그날 밤 불이 꺼지지 않았다.\n\n이튿날부터 전국에서 대통령의 재출마를 요구하는 집회가 열렸다. 시청 직원들이 참가자 수를 채웠고 시골에서는 경운기와 소가 끄는 수레까지 행렬에 나왔다. 버스 회사와 택시 조합은 사흘 동안 파업했다. 한 신문은 소와 말도 대통령을 원한다고 비꼬았다.\n\n조원진은 열이틀 만에 민의를 거스를 수 없다며 출마를 선언했다. 야당 후보가 유세하는 날이면 그 도시의 학교는 일요일에도 등교했고 공무원들은 야유회를 갔다. 통장과 반장이 집집마다 밀가루와 비누를 돌렸다. 선거 비용은 공장을 불하받은 재벌들이 냈다.\n\n개표 결과 그는 54퍼센트를 얻었다. 야당은 개표소 열두 곳에서 전기가 나갔던 일을 따졌고 법원은 소송을 기각했다. 취임 선서는 사십오 초 만에 끝났다. 그날 밤 대구의 한 개표소 앞에서 고등학생들이 투표함을 지키겠다며 밤을 새웠다."
 tfrkphn.7171.d:0 "야당이 서울의 한 체육관에서 선거 무효를 주장하는 강연회를 열었다. 강연이 시작되고 십 분 뒤 청년 사백 명이 문을 부수고 들어왔다. 그들은 연단의 마이크를 뽑고 의자를 던졌고, 강연자와 청중 서른 명이 병원에 실려 갔다. 문밖의 경찰은 호루라기를 불지 않았다.\n\n청년들은 시장 상인회와 운수 조합의 이름으로 움직였다. 우두머리는 동대문 일대의 극장과 노점을 쥔 사람이었고 청년 애국단 간부 명함을 가지고 다녔다. 그날 청년들이 먹은 도시락은 관공서에 급식을 대는 업자가 실어 왔다.\n\n봄에는 대학생들이 교문을 나서다가 쇠 파이프와 벽돌을 든 남자들에게 습격당했다. 사진 기자가 찍은 사진 한 장이 다음 날 신문 일 면에 실렸다. 그날 밤 신문사에 낯선 사람들이 들어와 윤전기에 모래를 뿌렸다.\n\n내무부는 폭력 사건을 엄정하게 수사하겠다고 발표했다. 체육관을 습격한 청년 가운데 세 명이 재판을 받았고 모두 집행유예로 나왔다. 조원진은 국무회의에서 애국 청년들의 충정은 이해하지만 방법이 지나쳤다고 말했다. 총리가 책임을 지고 물러났다."
 tfrkphn.7172.d:0 "홍문종 총리가 폭력 사태의 책임을 지고 물러났다. 뒤를 이은 오경훈 총리는 여덟 달 만에 지지율이 대통령의 세 배가 되자 해임됐고, 윤상현 총리는 탄핵안이 열일곱 표 차로 부결된 다음 날 해임됐다.\n\n대통령은 그사이 눈에 띄게 늙었다. 비서실은 아침마다 신문에서 나쁜 기사를 오려 낸 뒤 대통령 책상에 올렸다. 대통령이 지방을 방문하는 날이면 군수가 시장 상인들을 미리 모아 물가가 내렸다고 말하게 했다. 대통령은 차 안에서 국민이 원한다면 더 일하겠다고 비서에게 말했다.\n\n네 번째 총리 후보로 두 사람의 이름이 올라왔다. 김진태 내무부 장관은 검사 출신으로 춘천에서 국회의원을 두 번 지냈고, 수사 기관을 손에 쥐고 있었다. 김문수 전 경기도지사는 노동 운동가 출신으로 국회의원을 세 번, 도지사를 두 번 지냈고, 공단과 교회에 사람이 많았다.\n\n측근들은 법을 아는 사람과 표를 아는 사람 가운데 하나를 고르라고 했다. 누가 되든 그 사람이 후계자가 될 것이라는 걸 모두가 알았다. 대통령은 두 사람의 이력서를 책상 위에 나란히 놓았다."
 tfrkphn.7173.d:0 "한 해의 마지막 날 정오, 방송사들은 예고 없이 대통령 담화를 내보냈다. 녹화는 그날 아침 청와대 접견실에서 했고, 카메라 옆에는 장식을 떼지 않은 성탄 나무가 서 있었다.\n\n조원진은 임기를 일 년 남기고 물러난다고 말했다. 이어서 국민에게 용서를 구했다. 단번에 건너갈 수 있다고 믿었던 길이 생각보다 길었고, 자신을 믿어 준 사람들의 기대를 채우지 못했다고 했다. 담화는 십 분 만에 끝났다. 그는 건국 대통령이 물러나며 남긴 말로 담화를 맺었다.\n\n헌법에 따라 김진태 총리가 그 시각부터 대통령 권한대행이 됐다. 그는 권한대행으로서 첫 문서에 서명했다. 전직 대통령의 신변과 예우를 보장하는 명령이었다. 국방부 장관이 그 자리에서 군 통수권이 넘어갔다는 문서를 건넸다.\n\n조원진은 오후에 짐을 싣고 청와대를 나서며 김진태에게 나라를 잘 돌봐 달라고 말했다. 자정이 되자 김진태는 전방 부대 식당에서 병사들과 떡국을 먹었고, 방송은 그 장면을 새해 첫 뉴스로 내보냈다. 국민 대부분은 그날 권한대행의 목소리를 처음 들었다."
 tfrkphn.7174.d:0 "김진태는 조기 대선에서 53퍼센트를 얻었고 취임식을 이십 분 만에 끝냈다. 연단에는 꽃도 축가도 없었다. 그는 취임사에서 법 앞에서는 재벌도 장관도 대통령도 같다고 말했고, 박수가 나오기 전에 연단을 내려왔다.\n\n첫 국무회의는 아침 일곱 시에 열렸다. 장관들은 보고서를 한 장으로 줄여 오라는 지시를 받았다. 대통령은 보고를 끝까지 듣고 날짜와 담당자를 물었다. 답을 못 한 차관 두 명이 그 주에 바뀌었다. 회의는 매번 사십 분 안에 끝났다.\n\n둘째 주에 그는 재벌 회장 스물한 명을 청와대로 불렀다. 지난 정부에서 불하받은 공장과 방송은 그대로 가져도 좋다고 했다. 대신 세금을 내고 방송과 선거에서 손을 떼라고 했다. 대통령 옆자리에는 검찰총장이 앉아 있었고, 회장들은 아무도 질문하지 않았다.\n\n밀린 월급이 석 달 만에 모두 나갔다. 저녁 뉴스는 새벽에 한강을 뛰는 대통령과 시장에서 국밥을 먹는 대통령을 번갈아 내보냈다. 지지율은 70퍼센트를 넘었다. 그달 방송사 한 곳의 사주가 탈세 혐의로 조사를 받았다."
 tfrkphn.7175.d:0 "방송사를 가진 재벌 두 곳은 약속을 지키지 않았다. 한 곳은 잠수함 사고 때 휴가지에 있던 대통령의 사진을 저녁 뉴스 첫머리에 내보냈고, 다른 한 곳은 인형극으로 대통령을 놀렸다. 대통령은 두 방송을 직접 챙겨 봤다.\n\n국세청과 검찰이 같은 주에 두 그룹의 본사에 들어갔다. 한 회장은 사흘 동안 구치소에 있다가 방송사 지분을 가스 공사에 넘긴다는 서류에 서명하고 풀려났다. 다른 회장은 출장을 떠나 돌아오지 않았다. 인형극은 그 주에 편성표에서 빠졌다.\n\n이듬해 정부는 언론의 난립을 바로잡는다며 통폐합 계획을 발표했다. 신문과 방송, 통신사 예순네 곳이 열여덟 곳으로 줄었다. 사주들은 계엄 때 쓰던 청사 지하실에 불려 가 포기 각서를 썼고, 기자 천이백 명이 직장을 잃었다. 통폐합은 일주일 만에 끝났다.\n\n그 뒤로 아홉 시 뉴스는 시보가 울리면 대통령의 하루 일정부터 전했다. 문화부는 날마다 편집국에 기사 제목과 사진 크기를 적은 종이를 보냈다. 시청자들은 그 순서를 외웠고, 아이들은 시보 소리를 듣고 대통령 흉내를 냈다."
 tfrkphn.7176.d:0 "새 헌법 부칙은 나라가 안정될 때까지 지방선거를 미룬다고 적어 두었습니다. 김진태는 그 조항을 근거로 시도지사를 대통령이 임명하는 법안을 냈습니다. 학교 한 곳이 무장 괴한에게 점거된 사건 열흘 뒤의 일입니다.\n\n정부는 국민이 아직 스스로 다스릴 준비가 덜 됐고, 그때까지는 나라가 가르쳐야 한다고 설명했습니다. 관보는 이 시기를 헌정 준비 기간이라고 부릅니다. 기간이 언제 끝나는지는 법에 적혀 있지 않습니다.\n\n선거로 뽑힌 시도지사 열일곱 명 가운데 열넷이 한 달 안에 사표를 내고 대통령의 임명장을 다시 받았습니다. 사표를 내지 않은 세 명의 도청에는 감사원 직원들이 내려갔습니다. 석 달 뒤 세 명은 모두 건강을 이유로 물러났습니다.\n\n국회에서는 정당 등록 요건이 올라갔습니다. 다음 총선에서 여당은 의석의 4분의 3을 얻었고, 나머지는 여당 출신이 만든 야당 두 곳이 나눠 가졌습니다. 본회의 표결은 한 건에 평균 사십 초가 걸립니다. 두 야당 대표는 방송 토론에서 누가 대통령을 더 잘 돕는지를 두고 다퉜습니다."
 tfrkphn.7177.d:0 "청와대 회의실 벽에는 수출 목표를 적은 판이 걸렸다. 대통령은 매달 수출 진흥 회의를 직접 열고 회사별 실적을 불러 가며 물었다. 그는 장관들에게 어느 이념의 정책인지는 묻지 않을 테니 숫자를 가져오라고 말했다.\n\n적자를 내던 공기업 사백 곳이 문을 닫거나 합쳐졌고 노동자 육십만 명이 일자리를 잃었다. 정부는 바닷가 도시 네 곳을 특구로 정해 세금을 깎아 줬다. 일부가 먼저 부자가 돼도 좋다는 말이 관보에 실렸고, 기업인들은 줄을 서서 여당에 입당했다.\n\n수출은 다섯 해 만에 세 배가 됐고 성장률은 해마다 9퍼센트를 넘었다. 서울의 아파트값은 그사이 네 배가 됐다. 고속철도가 해마다 한 노선씩 개통됐고, 몇 해 전 설탕을 사려고 줄을 섰던 사람들이 자동차를 샀다. 백화점 주차장은 주말마다 모자랐다.\n\n농촌과 공장 지대에서 시위가 한 해 팔만 건 일어났다. 정부는 조화로운 사회를 새 구호로 내걸었다. 그해 치안 예산이 처음으로 국방 예산을 넘었다. 대통령 고향의 고등학교를 나온 사람들이 그 예산을 쓰는 자리 여덟 곳에 앉았다."
 tfrkphn.7178.d:0 "두 번째 임기가 끝나 가자 기자들은 헌법의 연임 제한 조항을 물었다. 김진태는 헌법을 고치지 않겠다고 답했다. 그는 그 말을 지켰고, 여당 전당대회에서 다음 대통령 후보로 윤상현 전 총리를 추천했다.\n\n선거는 국민이 직접 뽑는 방식 그대로 치러졌다. 방송 토론은 열리지 않았고 윤상현은 71퍼센트를 얻었다. 그는 취임한 날 저녁 김진태를 국무총리로 지명했고 국회는 이튿날 인준했다.\n\n청와대 집무실에는 새 대통령이 앉았지만 장관들은 보고서를 들고 총리 공관으로 갔다. 외국 대사들도 신임장을 낸 뒤 총리를 따로 찾았다. 총리 공관 앞 골목에는 검은 차가 아침마다 줄을 섰다. 사람들은 두 사람이 자전거 한 대에 같이 탔다고 농담했다.\n\n사 년 뒤 여당 전당대회에서 윤상현은 연단에 올라 다음 후보로 김진태를 추천했다. 그는 두 사람이 이 일을 여러 해 전에 정해 두었다고 말했다. 그날 밤 서울 도심에 대학생 수천 명이 모여 표를 돌려 달라고 외쳤다. 그사이 대통령 임기는 다섯 해에서 여섯 해로 늘어 있었다."
 tfrkphn.7179.d:0 "새 헌법도 대통령의 임기는 다섯 해 한 번이라고 적었다. 국민투표를 통과시키려고 남겨 둔 조항이었다. 임기 넷째 해에 여당은 새 헌법의 첫 대통령에 한해 이 제한을 두지 않는다는 개헌안을 냈다. 여당은 무소속 의원들을 한 사람씩 불러 표를 모았다.\n\n개헌에는 재적 의원 삼백 명의 3분의 2가 필요했다. 표결 결과 찬성은 백구십구 표였다. 삼백의 3분의 2는 이백이었으므로 사회를 보던 부의장은 부결을 선포했고, 방청석의 학생 몇 명이 박수를 쳤다.\n\n이틀 뒤 국회는 다시 열렸다. 여당은 수학과 교수의 의견서를 들고 나왔다. 삼백 명 가운데 의원직을 잃은 한 명을 빼면 재적은 이백구십구 명이고, 그 3분의 2는 백구십구 점 삼삼이며, 사람을 소수점으로 셀 수 없으니 반올림한 백구십구 표로 충분하다는 내용이었다.\n\n부의장은 지난 선포를 고쳐 가결을 선포했다. 야당 의원들이 단상으로 뛰어올랐으나 경위들에게 끌려 내려왔다. 관보는 그날 밤 인쇄됐다. 시민들은 그 뒤로 모자라는 것을 채울 때 반올림한다고 말했다."
 tfrkphn.7180.d:0 "임기를 영에서 다시 세기로 한 뒤 첫 대통령 선거가 치러졌다. 정부는 자신이 있었다. 야당 후보 두 명은 서류 미비로 등록이 취소됐고, 남은 후보의 유세장은 번번이 수도 공사로 막혔다.\n\n투표 날 저녁 국영 방송은 지역별 개표 상황을 막대그래프로 내보냈다. 한 지역의 화면에서 김진태는 59퍼센트, 2위는 33퍼센트, 3위는 24퍼센트를 얻었고, 나머지 후보들까지 더하면 합은 140퍼센트였다. 화면은 십이 초 동안 나갔다. 진행자는 숫자를 그대로 읽었다.\n\n방송사는 자막 사고라고 해명했다. 그 십이 초를 찍은 사진은 밤사이 전화기에서 전화기로 건너갔다. 새벽에 선거관리위원회는 김진태가 80퍼센트를 얻어 당선됐다고 발표했다. 사진 밑에는 수학을 다시 배우라는 글이 붙었다.\n\n아침이 되자 대학생들이 먼저 교문을 나섰다. 그들은 140이라고 적은 종이를 들었다. 점심때는 넥타이를 맨 회사원들이 사무실에서 내려와 줄에 섰고, 저녁에는 광화문에서 시청까지 차도가 사람으로 찼다. 내무부 장관이 대통령에게 전화를 걸어 지시를 물었다."
 tfrkphn.7181.d:0 "정부는 그날 밤 인터넷을 끊었다. 사흘 동안 전화기는 통화만 됐고, 사람들은 아파트 창문에 종이를 붙여 모일 곳을 알렸다. 기동대는 광화문에 나온 사람들을 버스에 실었다. 나흘 동안 칠천 명이 잡혀갔고, 풀려난 사람들은 등과 다리의 멍을 사진으로 찍어 올렸다.\n\n주말마다 흰옷을 입은 여성들이 꽃을 들고 줄지어 걸었다. 자동차 공장과 조선소의 노동자들이 일손을 놓았고, 공장을 찾아간 대통령은 물러가라는 고함을 들었다. 그 주 일요일 김진태는 헬기를 타고 광장 위를 돌았다. 방송은 방탄조끼를 입고 헬기에서 내리는 그를 내보냈다.\n\n야당 지도자들은 외국으로 나가거나 갇혔다. 김진태는 두 달 뒤 예고 없이 취임 선서를 했고, 정부는 식이 끝난 뒤에 그 사실을 발표했다. 식장에 온 외국 정상은 없었다.\n\n그해 겨울 서울의 한 고등학교 교실 칠판 귀퉁이에 누가 분필로 140이라고 썼다. 교사는 그것을 지우고 수업을 했다. 다음 날 아침 같은 자리에 같은 숫자가 다시 적혀 있었다. 교사는 지우개를 들었다가 내려놓고 출석을 불렀다."
 tfrkphn.7182.d:0 "담화가 나간 날 오후 김진태는 청와대를 나왔다. 경호실은 차를 준비했지만 그는 걸어서 사저까지 가겠다고 했다. 사저까지는 사십 분이 걸렸다. 경호원 넷이 몇 걸음 뒤에서 따라왔다.\n\n길가에 선 사람들 가운데 몇은 욕을 했고, 몇은 고생하셨다고 외쳤다. 애국단 완장을 뗀 청년 하나가 그에게 다가와 손을 잡았다. 청년은 고생하셨다고 한마디 하고 손을 놓았다.\n\n과도 정부는 포격 때 체포됐다가 풀려난 우원식 전 국회의장이 맡았다. 첫 국무회의는 대통령을 국민이 직접 뽑는 개헌안과 지방선거 날짜를 의결했다. 회의록은 그날 밤 공개됐다. 체포됐던 의원들과 보좌진은 그 주에 모두 풀려났다.\n\n국회의사당 돔의 그을음은 그해 가을에 닦아 냈다. 비계를 걷어 내던 날 국회 앞에는 사람들이 모였다. 마지막 방수포가 내려오자 누군가 박수를 치기 시작했다."
 tfrkphn.7183.d:0 "김무성 의원은 국회 본회의에서 사십 분 동안 연설했다. 대통령이 불출마를 뒤집은 일과 동원된 집회를 하나씩 짚었고, 통장이 돌린 밀가루 포대를 단상에 올려놓았다. 여당 의석에서 고함이 나왔고 방송은 중계를 끊었다. 그는 젊은 날 야당 총재 밑에서 정치를 배운 사람이었다.\n\n엿새 뒤 아침 그의 차가 집 앞 골목을 빠져나올 때 청년 셋이 길을 막았다. 한 명이 뒷좌석 문을 열려고 했고, 문이 잠겨 있자 다른 한 명이 병을 던졌다. 병은 창틀에 맞아 깨졌다. 차 유리와 문짝의 칠이 연기를 내며 녹아내렸다.\n\n병에 든 것은 질산이었다. 운전기사는 차를 멈추지 않고 국회까지 몰았다. 김무성은 녹은 차를 본청 앞에 세워 두고 기자들을 불렀다. 그는 이 병이 어디서 나왔는지 온 국민이 안다고 말했다.\n\n경찰은 수사본부를 차렸지만 청년 셋을 찾지 못했다. 내무부는 야당의 자작극일 가능성도 살핀다고 발표했다. 차는 한 달 동안 본청 앞에 서 있었고, 의원들은 출근길에 그 옆을 지나갔다. 지나가던 시민들이 차 사진을 찍어 갔다."
 tfrkphn.7184.d:0 "팔월의 어느 낮 한 시쯤, 김부겸은 도쿄의 한 호텔 이십이 층에서 점심을 마치고 복도로 나왔다. 건장한 남자 대여섯이 그를 옆방으로 끌고 들어갔다. 방에는 마취약 냄새가 남았고 배낭 두 개와 긴 밧줄이 발견됐다.\n\n그는 차에 실려 이튿날 항구에서 화물선으로 옮겨졌다. 배 위에서 손발이 묶이고 눈이 가려졌다. 발목에는 무거운 추가 달렸다. 그는 나중에, 갑판으로 끌려 나갔을 때 머리 위에서 비행기 소리가 났고 그 뒤 남자들이 추를 풀었다고 말했다.\n\n일본 경찰은 그날 오후부터 항구와 공항을 막았고, PDTO 사무국은 서울에 그의 안전을 묻는 전문을 보냈다. 닷새 뒤 밤 그는 서울 자기 집 대문 앞에서 발견됐다. 눈에는 붕대가 감겨 있었고 입술이 터져 있었다.\n\n정부는 사건과 관계가 없다고 발표했다. 호텔 방에서 나온 지문 하나가 대사관 일등 서기관의 것이라는 일본 경찰의 발표는 국내 신문에 실리지 않았다. 일본 정부는 주권을 침해당했다고 항의했고 국무총리가 도쿄에 가서 유감을 전했다. 그날부터 그의 집 앞에 경찰 버스가 섰다."
 tfrkphn.7185.d:0 "김무성은 의원직에서 제명됐다. 외국 신문과 만나 이 정권을 더는 돕지 말라고 말한 것이 이유였다. 표결은 여당 의원들만 모인 별실에서 십 분 만에 끝났다. 그는 집으로 돌아갔고 대문 밖으로 나갈 수 없게 됐다.\n\n봄에 그는 다섯 가지를 요구하며 밥을 끊었다. 갇힌 사람들을 풀고, 정치 활동 금지를 없애고, 대통령을 국민이 직접 뽑게 하라는 요구였다. 여드레째에 정부는 그를 대학 병원으로 옮겼다. 그는 병실에서도 링거를 거부했다. 몸무게는 열나흘 만에 십사 킬로그램이 빠졌다.\n\n신문과 방송은 이 일을 한 줄도 쓰지 못했다. 한 신문이 열하루째에 정치 현안이라는 네 글자로 돌려 적었고, 사람들은 그 뜻을 물어물어 알았다. 여당 사무총장이 병실을 찾아 외국에 나가 쉬라고 권하자, 그는 자신을 시체로 만들어 부치면 된다고 답했다. 병원 앞에는 날마다 꽃을 든 사람이 늘었다.\n\n스물사흘째 되는 날 그는 단식을 풀며 앉아서 죽기보다 서서 싸우겠다고 말했다. 석 달 뒤 외국에 있던 김부겸이 그와 함께 이름을 올린 성명이 복사지로 돌았다."
 tfrkphn.7186.d:0 "수출 진흥 회의에서 숫자를 읽는 사람은 김동연 경제부총리였다. 그는 상업고등학교를 나와 은행에 다니며 야간 대학을 마치고 고시에 붙은 관료였다. 대통령은 정당에 몸담은 적이 없는 그를 불러 경제를 맡겼다. 장관들은 그를 회의에서 가장 먼저 오고 가장 늦게 가는 사람으로 기억했다.\n\n성장률이 오를수록 그의 이름이 신문에 자주 났다. 지방 공단 준공식에서는 대통령보다 그에게 사람이 더 몰렸다. 여론조사 기관 한 곳이 다음 지도자를 묻는 조사에 그의 이름을 넣었다가 사흘 뒤 세무 조사를 받았다.\n\n그는 치안 예산을 줄여 해고된 노동자를 돕자는 보고서를 올렸다. 보고서는 대통령 책상까지 가지 못했다. 다음 주 그는 사표를 냈고, 공항에서 기자들에게 자의 반 타의 반으로 떠난다고 말했다. 대통령은 사표를 그날로 받았다.\n\n그는 외국 대학의 연구실에서 두 해를 보냈다. 돌아온 뒤에는 공직을 맡지 않고 지방을 돌며 강연을 했다. 강연장 뒤쪽에는 늘 같은 남자 둘이 앉아 받아 적었다. 김부겸과 김무성이 그에게 편지를 보냈다는 소문이 돌았다."
 tfrkphn.7187.d:0 "과도 정부는 대통령 선거를 넉 달 뒤로 잡았다. 김부겸은 집 앞의 경찰 버스가 떠난 날 대문을 열고 나와 기자들 앞에 섰다. 김무성은 유리가 녹았던 그 차를 고쳐 타고 제명됐던 국회로 돌아왔고, 김동연은 시위 중에 귀국해 서울에 사무실을 냈다.\n\n세 사람은 광장에서 같은 편이었다. 시위 엿새 동안 김무성은 맨 앞줄에서 최루탄을 맞았고, 김부겸은 갇힌 집 담 너머로 성명을 읽었으며, 김동연은 넥타이를 맨 회사원들의 줄에 섞여 걸었다.\n\n후보 등록을 석 달 앞두고 세 사람은 한 음식점에서 만났다. 김부겸은 납치와 연금을 겪은 사람이 먼저 나서야 한다고 했고, 김무성은 단식으로 길을 연 사람이 누구냐고 물었다. 김동연은 나라 살림을 아는 사람이 필요하다고 말했다. 식사는 네 시간 이어졌고 발표문은 나오지 않았다.\n\n옛 여당은 그사이 이름을 바꾸고 후보를 냈다. 여론조사에서 그 후보의 지지율은 30퍼센트였고 세 사람의 지지율을 합치면 65퍼센트였다. 음식점 주인은 세 사람이 다음 주에 같은 방을 다시 잡았다고 기자들에게 말했다."
 tfrkphn.7188.d:0 "한 해에 한 번 대통령은 생방송으로 국민의 전화를 받았다. 방송은 정오에 시작해 네 시간 넘게 이어졌고, 그동안 다른 채널도 같은 화면을 내보냈다. 접수된 질문은 이백만 건이었다. 질문을 고르는 일은 청와대 홍보실이 석 달 전부터 준비했다.\n\n강원도 어느 마을의 할머니가 마을에 수도가 아직 안 들어왔다고 말했다. 대통령은 군수의 이름을 물었다. 그날 저녁 뉴스에는 굴착기가 마을 길을 파는 장면이 나왔고 군수는 다음 날 사표를 냈다. 전국의 군수들은 방송 날이 다가오면 묵은 민원 서류를 다시 뒤졌다.\n\n밀린 월급을 받게 해 달라는 공장 노동자, 딸의 수술비를 호소하는 어머니, 강아지를 갖고 싶다는 아홉 살 아이가 차례로 연결됐다. 대통령은 원고를 보지 않고 숫자를 외워서 답했다. 야당이나 선거를 묻는 전화는 연결되지 않았다.\n\n방송이 끝나면 여론조사 기관들은 지지율이 사 점쯤 올랐다고 발표했다. 한 지방 신문 기자가 일 년 뒤 그 마을을 다시 찾았다. 수도는 할머니 집까지만 들어와 있었다. 후임 군수는 그 마을에 가지 않았다."
 tfrkphn.7189.d:0 "새 법은 외국에서 돈을 받는 단체와 언론을 외국 대리인이라고 불렀다. 그들은 법무부에 등록하고 석 달마다 회계 장부를 내야 했다. 내놓는 글과 영상에는 맨 위에 스물네 글자짜리 문구를 큰 글씨로 달아야 했다. 문구는 이 글은 외국 대리인이 만들었다는 내용이었다.\n\n처음 등록된 곳은 선거 감시 단체였다. 지난 선거 때 개표소 사진을 모아 지도에 올린 단체였고, 외국 재단에서 받은 돈은 사무실 석 달 치 월세였다. 다음 해에는 여론조사 기관과 인권 변호사 모임, 실종 군인 가족 모임이 명단에 올랐다.\n\n명단에 오른 단체에는 광고가 끊겼고 건물 주인은 계약을 연장하지 않았다. 학교는 그 단체 사람을 강사로 부르지 못했다. 한 인터넷 신문은 기사마다 문구를 달다가 독자가 줄어 일 년 만에 문을 닫았다. 기자들은 마지막 기사에도 그 문구를 달았다.\n\n명단은 삼 년 만에 사백 곳을 넘었고 개인도 오를 수 있게 법이 고쳐졌다. 한 대학생은 외국에 사는 이모에게 생일 용돈을 받았다가 명단에 올랐다. 그는 그 뒤 쓰는 글마다 그 문구를 달았다."
 tfrkphn.7190.d:0 "첫 총선이 끝난 뒤 국회에는 과반을 가진 당이 없었다. 연정 협약서의 총리 칸은 사흘째 비어 있었다. 신민당은 김부겸과 김동연 가운데 한 사람을 고르지 못했고, 헌정회복연대는 내각제를 만든 김무성이 첫 총리를 맡아야 한다고 했다.\n\n세 사람은 사랑재 뒷방에서 만났다. 김무성이 먼저 종이를 꺼내 임기 사 년을 셋으로 나누는 줄을 그었다. 한 사람이 열여섯 달씩 총리를 맡고 나머지 두 사람은 그동안 부총리와 당 대표를 맡는다는 안이었다. 김부겸은 약속을 어긴 사람을 어떻게 할지부터 적자고 했다.\n\n종이에는 세 줄이 적혔다. 차례가 끝난 사람은 그날로 사표를 낸다. 차례를 어긴 사람의 당은 연정에서 나간다. 의석이 없는 김무성의 차례에는 국회가 따로 동의안을 표결한다. 세 사람은 그 밑에 차례로 서명했다.\n\n정치부 기자들은 이 합의를 나눠 먹기라고 썼다. 한 원로 기자는 지난 대통령 선거 때 다섯 주 동안 단일화 협상을 하고도 갈라섰던 사람들이 이번에는 한 시간 만에 종이 한 장을 채웠다고 칼럼에 적었다."
 tfrkphn.7191.d:0 "약속한 열여섯 달이 찼다. [TFRKPHN_rot_out] 총리는 아침에 마지막 국무회의를 열어 안건 네 건을 처리했고, 회의가 끝나자 장관들과 한 사람씩 악수했다. 사표는 전날 밤에 써 두었다.\n\n국회는 오후에 [TFRKPHN_rot_in]의 총리 인준안을 표결했다. 세 사람이 순번을 정할 때 서명한 종이의 사본이 의원들 책상에 놓여 있었다. 반대표를 던진 의원들도 표결이 끝나자 일어나 박수를 쳤다. 정치부 기자들은 약속이 깨졌다는 기사를 미리 써 두었다가 지웠다.\n\n총리 공관의 인수인계는 삼십 분이 걸렸다. 떠나는 사람은 서랍 열쇠와 진행 중인 일을 적은 종이 두 장을 건넸다. 종이 맨 위에는 연정 안에서 아직 합의하지 못한 법안의 이름이 적혀 있었다. 받는 사람은 종이를 읽고 두 군데에 줄을 그었다. 공관 직원들은 그사이 침실의 이불을 바꿨다.\n\n두 사람은 공관 마당의 감나무 밑에서 차를 한 잔씩 마셨다. 이번 인수인계와 상관없는 나머지 한 사람이 조금 늦게 와서 세 번째 잔을 받았다. 세 사람은 사진 기자들이 돌아간 뒤에도 한 시간을 더 앉아 있었다."
 tfrkphn.7192.d:0 "국무회의 첫 안건은 지난 탄핵이 부당했다고 확인하는 결의문이었다. 법적인 효력은 없었다. 우리공화당은 그 탄핵에 반대하며 만들어진 당이었다. 조원진은 결의문을 액자에 넣어 직접 들고 대구로 내려갔고, 태극기를 든 사람들이 고속도로 휴게소마다 나와 그의 차를 기다렸다.\n\n사저 앞 골목에는 새벽부터 천 명 넘게 모였다. 박근혜 전 대통령은 대문 앞까지 나와 그를 맞았고, 두 사람은 십오 분 동안 안에 있었다. 무슨 말이 오갔는지는 발표되지 않았다. 조원진은 골목을 나오며 지지자들에게 약속을 지켰다고 말했다.\n\n정부가 더 할 수 있는 일은 많지 않았다. 국무회의는 전직 대통령 예우를 모두 되살리는 법 개정안을 의결했고, 국회는 그 안을 상정하지 않았다. 조원진은 국회가 국민의 뜻을 깔고 앉았다고 말했다. 대구 시내 식당들은 그날 점심값을 받지 않았다.\n\n그날 저녁 서울 도심에서는 그 결의문을 찢는 집회가 열렸다. 길 건너편에는 태극기 집회가 섰고 두 집회 사이에 경찰 버스 스무 대가 늘어섰다. 버스 위로 구호가 넘어갔다."
 tfrkphn.7193.d:0 "조원진은 취임 뒤에도 광화문 천막을 걷지 않았다. 천막 안에는 접이식 탁자와 난로, 전화기 두 대가 있었고, 그는 금요일 밤이면 청와대를 나와 그곳에서 잤다. 장관들은 월요일 국무회의에 올릴 안건을 토요일 집회가 끝난 뒤 천막에서 먼저 보고했다.\n\n토요일 오후 두 시가 되면 그는 연단에 올랐다. 새 검찰총장의 이름도 추가경정예산의 액수도 그 연단에서 처음 나왔다. 기자들은 청와대 춘추관을 비우고 광화문 인도에 간이 의자를 폈다. 집회가 박수로 받은 안건은 월요일에 통과됐고, 야유를 받은 장관은 그 주에 사표를 냈다.\n\n집회는 보수 유튜브 채널 열두 곳이 생중계했다. 연설이 끝나면 진행자들은 박수 소리의 크기를 숫자로 화면에 띄웠다. 청와대 대변인은 방송사 기자들의 질문을 받지 않는 날에도 그 채널들의 질문에는 답했다. 조회수는 저녁 뉴스 시청자의 두 배였다.\n\n국회의장은 나라의 일을 광장의 박수로 정할 수는 없다고 말했다. 다음 토요일 연단 뒤 현수막에는 그 말이 그대로 적혔고, 사람들은 그 밑에서 삼 분 동안 야유를 보냈다."
 tfrkphn.7194.d:0 "정부는 전역 장병에게 정착금을 주고, 서른 살 아래의 무주택자에게 공공 임대 주택을 먼저 배정했다. 공기업과 공무원 채용에는 전역자 가산점이 다시 생겼다. 돈은 노인 일자리 사업과 경로당 운영비를 줄여 마련했다.\n\n조원진은 정착금이 처음 나가는 날 창원의 한 공단 기숙사에서 전역병들과 점심을 먹었다. 방송은 통장을 들여다보며 웃는 청년들을 저녁 뉴스에 내보냈다. 대학 총학생회장들은 국회의원보다 먼저 청와대 초청장을 받았다.\n\n반발은 두 곳에서 나왔다. 가산점에서 빠진 여학생들이 대학가에 대자보를 붙였고, 노인 단체들은 경로당 난방비가 깎였다며 구청 앞에 모였다. 명절에 내려간 손주들은 할아버지와 텔레비전 채널을 두고 다퉜다. 이번에는 손주 쪽이 대통령 편이었다.\n\n서른 살 아래 남성의 대통령 지지율은 육십 퍼센트를 넘었고, 같은 나이의 여성에서는 한 자릿수였다. 가을에 한 대학 총학생회가 가산점 폐지 서명을 받았다. 서명대 앞에 전역병 서른 명이 찾아와 누가 나라를 지켰느냐고 소리쳤다. 학생들은 서명대를 접지 않았다."
 tfrkphn.7196.d:0 "김진태가 청와대로 돌아온 뒤 두 번째 임기의 넷째 해였다. 헌법은 대통령이 한 번만 연임할 수 있다고 적고 있었고, 그는 기자회견에서 헌법을 지키겠다고 여러 번 말했다.\n\n그해 봄 정부는 헌법을 이백여섯 군데 고치기로 했다. 최저임금을 생계비보다 높게 정한다는 조항과 청년에게 공공 주택을 보장한다는 조항, 영토를 넘겨주지 못한다는 조항이 들어갔다. 국회 심의 마지막 날 여당의 여든세 살 의원이 손을 들었다. 올림픽 금메달을 땄던 사람이었다.\n\n그는 새 헌법이 시행되면 지금 대통령의 지난 임기는 세지 말자고 제안했다. 본회의장은 잠시 조용했다. 한 시간 반 뒤 김진태가 예고 없이 국회에 나와 연단에 섰다. 그는 헌법재판소가 괜찮다고 하면 받아들이겠다고 말했다. 헌법재판소는 엿새 만에 괜찮다고 결정했다.\n\n국민투표는 일주일 동안 치러졌다. 투표소는 공원 벤치와 버스 정류장, 자동차 짐칸에도 차려졌고, 투표한 사람은 아파트 추첨에 응모할 수 있었다. 투표용지에는 이백여섯 군데를 한꺼번에 묻는 칸 하나만 있었다. 찬성은 78퍼센트였다."
 tfrkphn.72.kp:0 "11월 11일 오전 11시, 부산 남구 유엔기념공원에 사이렌이 울렸다. 묘역에 선 사람들이 일제히 고개를 숙였고, 같은 시각 마닐라와 방콕, 캔버라와 런던, 오타와에서도 사람들이 부산 쪽을 향해 서서 1분 동안 묵념했다. 6.25전쟁에 목숨을 바친 유엔군 용사들을 기리는 국제 추모식, 턴 투워드 부산이다.\n\n이곳은 세계에서 하나뿐인 유엔군 묘지인데, 이름도 잘 모르던 나라를 지키러 와서 돌아가지 못한 2천여 명이 잠들어 있다.\n\n묵념이 끝나자 대통령이 헌화대 앞으로 걸어 나왔고 그 뒤로 참전국 대사들이 줄지어 섰다. 맨 앞줄에는 필리핀과 태국의 대사가 있었는데, 1950년에 아시아에서 가장 먼저 군대를 보낸 나라들이다. 그때 필리핀은 우리보다 잘사는 나라였고 우리에게 원조를 주던 나라였다."
 tfrkphn.72.kp2:0 "헌화를 마친 대통령이 연단에 섰다.\n\n\"70여 년 전, 여러분의 할아버지들은 지도에서 찾기도 힘든 나라에 왔습니다. 그분들이 흘린 피 위에 오늘의 대한민국이 서 있습니다. 우리는 그 빚을 잊은 적이 없습니다. 이번 전쟁에서 우리는 대만 곁에 섰습니다. 오늘은 아시아의 친구들과 손을 잡습니다. 모두 그 빚을 갚는 일입니다.\"\n\"오늘부터 대한민국은 참전국 후손들에게 장학금을 줍니다. 참전국과의 교역과 방산 협력도 넓히겠습니다. 은혜를 아는 나라는 친구를 잃지 않습니다.\"\n\n객석의 한 노인이 지팡이를 짚고 일어나 경례했다. 필리핀에서 온 참전용사의 아들이었다."
 tfrkphn.7200.d:0 "신문들은 취임 첫 달에 같은 기획 기사를 실었다. 선거로 뽑힌 서울시장 가운데 대통령이 된 사람은 이명박에 이어 오세훈이 두 번째라는 내용이었다.\n\n이명박은 건설 회사 사장 출신으로 2002년에 시장이 됐다. 그는 청계천 고가도로를 뜯고 5.84킬로미터의 물길을 두 해 석 달 만에 열었고, 2004년 7월 1일에는 서울의 버스 노선과 요금 체계를 하루아침에 바꿨다. 개편 첫 주에 교통카드 단말기가 말썽을 부렸지만 그는 물러서지 않았다.\n\n오세훈은 2006년에 그 자리를 물려받았다. 변호사와 방송 진행자를 거친 그는 한강과 디자인을 말했고 서울을 디자인 수도로 만들겠다고 했다. 2011년 8월 그는 주민투표에 시장직을 걸었다가 임기를 채우지 못하고 물러났다. 전임자는 그때 청와대에 있었다.\n\n기자가 두 사람의 차이를 묻자 오세훈은 그분에게서 속도를 배웠고 자신은 거기에 묻는 절차를 하나 더하겠다고 답했다. 그날 저녁 한 방송은 밀어붙이는 시장과 물어보는 시장이라는 자막을 달았다. 청와대는 그 자막에 논평하지 않았다."
 tfrkphn.7201.d:0 "지천 르네상스 첫 구간이 열리는 날, 기자들은 2005년 10월 1일의 청계천을 꺼냈다. 그날 청계천에 물이 다시 흘렀고 개통 첫 주말에는 사람들이 물가를 가득 메웠다. 이명박 시장은 두 해 뒤 대통령이 됐다.\n\n청계천은 한강에서 끌어 올린 물을 흘려보내는 하천이다. 복원에는 3,867억 원이 들었고 물을 퍼 올리는 전기료가 해마다 따로 든다. 비판하는 쪽은 그것을 커다란 인공 어항이라고 불렀고, 찬성하는 쪽은 도심 한가운데에 사람이 걷는 길이 생겼다고 답했다.\n\n오세훈의 지천 르네상스는 방식이 달랐다. 이미 흐르고 있는 수십 개의 작은 하천에 계단과 의자, 찻집을 놓는 사업이었다. 돈은 한 곳에 몰지 않고 동네마다 조금씩 넣었다. 준공식은 구청장이 열었고 대통령은 가지 않았다. 첫 구간은 여덟 달 만에 끝났다.\n\n야당은 이름만 바꾼 청계천이라고 했다. 청와대 대변인은 지천이 동네 사람들의 퇴근길을 바꿀 것이라고 답했다. 첫 구간이 열린 물가에는 그날 저녁 돗자리가 깔렸고, 건너편 아파트 주민들이 슬리퍼를 신고 내려왔다."
 tfrkphn.7202.d:0 "정부가 한강 물길과 수상 교통 계획을 내놓자 야당은 대운하라는 말을 다시 꺼냈다. 2007년 이명박 후보는 한강과 낙동강을 잇는 운하를 공약해 그해 겨울 큰 표 차로 당선됐고, 대통령이 된 첫해 여름 광화문의 촛불 집회를 겪었다.\n\n2008년 6월 19일 그는 청와대 기자회견에서 \"대선 공약이었던 대운하 사업도 국민이 반대한다면 추진하지 않겠다\"고 말했다. 그 뒤 정부는 운하를 접고 네 개의 강을 정비하는 사업으로 방향을 바꿨다. 22조 원이 들어간 그 사업을 두고 나라는 십 년 넘게 싸웠다.\n\n오세훈에게도 한강의 기억이 있었다. 시장 시절 한강에 띄운 인공 섬은 다 짓고도 몇 해 동안 문을 열지 못했고, 한강에 배를 띄우겠다는 계획은 그가 시장직을 내려놓으면서 멈췄다.\n\n국무회의에서 그는 전임자가 겪은 일을 되풀이하지 않겠다고 말했다. 계획서에서 강바닥을 파는 항목이 빠졌고, 선착장 자리는 주민 설명회를 거쳐 정하기로 했다. 야당은 그래도 반대했고 환경 단체 사람들은 설명회마다 맨 앞줄에 앉았다."
 tfrkphn.7203.d:0 "과도 정부는 첫 달에 사건 기록 세 건을 다시 열었다. 김무성의 차에 던진 질산 병, 김부겸이 끌려간 호텔, 단식 때 신문사에 내려간 지침이었다. 기록은 경찰청 지하 문서고의 철제 선반에 사건 번호 없이 꽂혀 있었다.\n\n질산 병 사건의 기록은 열두 쪽이었다. 수사본부는 석 달 동안 목격자 넷을 불렀고 골목의 방범 카메라 영상은 확보하지 않았다. 병 조각의 감정서에는 공업용 질산이라는 한 줄만 있었다. 본청 앞에 한 달 서 있던 차는 경찰 창고에서 찾아냈다.\n\n납치 사건의 기록에는 화물선의 출항 신고서가 붙어 있었다. 배의 주인은 주소지에 사무실이 없는 회사였다. 현지 경찰이 보낸 지문 감정서는 봉투도 뜯기지 않은 채였다. 김부겸은 조사관에게 추를 달았던 발목의 흉터를 보여 주었다.\n\n신문사에 내려간 지침은 원본이 남아 있지 않았다. 한 편집국장이 그때 받아 적은 수첩을 들고 나왔다. 세 기록 어디에도 지시한 사람의 이름은 없었다. 조사관들은 결재란이 비어 있는 서류를 복사해 국회에 보냈고, 국회는 특별 조사 위원회를 꾸렸다."
 tfrkphn.7204.d:0 "김부겸은 조기 대선에서 진 뒤에도 유세를 다녔다. 지방선거 지원 유세를 가던 밤 국도에서 화물 트럭이 그의 차를 들이받았다. 그는 골반을 다쳤고 그 뒤로 지팡이를 짚었다. 경찰은 운전 부주의로 결론을 냈다.\n\n가을에 그는 다리를 치료하러 도쿄로 갔다. 그가 병원에 있는 동안 정부는 지방선거를 무기한 미루고 정당의 옥외 집회를 금지했다. 측근들은 전화로 지금 돌아오면 공항에서 바로 끌려간다고 전했다.\n\n그는 호텔 방에서 성명을 냈다. 돌아가지 않고 밖에서 싸우겠다는 내용이었다. 일본 정부는 체류를 허가했다. 그는 도쿄와 오사카를 오가며 교민들 앞에서 연설했고, PDTO 회원국의 의원들을 찾아다니며 이 정권에 대한 지원을 다시 따져 보라고 말했다. 연설이 끝나면 그는 지팡이를 짚고 맨 뒷줄까지 걸어가 악수했다.\n\n정부는 그의 여권을 무효로 했다. 대사관은 강연장마다 직원을 보내 참석자의 이름을 적었다. 그해 여름 그는 교민 단체의 결성 대회를 닷새 앞두고 있었다. 대회장으로 빌린 강당에는 의자 팔백 개가 놓였다."
 tfrkphn.7205.d:0 "김부겸은 망명 두 해 만에 돌아가겠다고 발표했다. 정부는 돌아오면 남은 형기를 살게 하겠다고 경고했다. 측근들은 공항에서 무슨 일이 날지 모른다고 말렸다. 그는 예정한 날짜를 바꾸지 않았다.\n\n비행기에는 PDTO 회원국의 의원 둘과 전직 대사, 인권 단체 사람들과 기자까지 서른일곱 명이 함께 탔다. 그들은 그의 앞뒤 좌석을 채웠고, 내리면 그를 둘러싸고 걷기로 했다. PDTO 사무국의 외교관 한 명이 수첩을 들고 맨 앞에 섰다.\n\n문이 열리자 사복 차림의 남자 오십여 명이 통로로 밀고 들어왔다. 그들은 동행한 사람들을 밀쳐 내고 김부겸 부부를 승강기에 태웠다. 의원 한 명이 바닥에 쓰러졌고 외교관의 수첩은 발에 밟혔다. 그는 승합차에 실려 집으로 갔고 대문에는 다시 경찰이 섰다.\n\n공항 밖에는 수만 명이 나와 있었지만 그를 보지 못했다. PDTO 회원국들은 대사를 불러 항의했다. 신문은 그의 귀국을 일 단짜리 기사로 실었다. 나흘 뒤 치러진 총선에서 김무성을 따르는 사람들이 급히 만든 신당은 창당 스물닷새 만에 제1야당이 됐다."
 tfrkphn.7206.d:0 "봄에 김부겸은 재야 인사들과 함께 성당 미사에서 선언문을 읽었다. 집회 금지를 풀고 갇힌 사람들을 내보내라는 내용이었다. 그는 연금된 집에서 끌려 나와 감옥으로 갔다. 함께 기소된 사람은 열여덟 명이었다.\n\n이듬해 남쪽 도시에서 큰 시위가 일어나자 군 검찰은 그가 뒤에서 내란을 꾸몄다고 기소했다. 군사 재판은 사형을 선고했다. 그는 최후 진술에서 자신이 죽더라도 정치 보복은 다시 없어야 한다고 말했다.\n\nPDTO 회원국 정부들이 차례로 성명을 냈고, 일본 총리는 형이 집행되면 협력을 이어 가기 어렵다고 전했다. 대통령은 형을 무기 징역으로, 다시 이십 년으로 줄였다. 그는 감옥에서 엽서 한 장에 깨알 같은 글씨로 가족에게 편지를 썼다. 엽서는 한 달에 한 장만 허락됐다.\n\n두 해 뒤 겨울 정부는 병을 치료한다는 조건으로 그를 풀어 비행기에 태웠다. 그는 공항에서 기자를 만나지 못했다. 비행기 문이 닫힐 때까지 요원 둘이 양옆에 앉아 있었다. 그가 내린 곳은 PDTO 회원국의 수도였고, 그는 그곳 대학에서 연구원 자리를 얻었다."
 tfrkphn.7207.d:0 "문을 닫은 봉제 공장의 여공 백팔십칠 명이 야당 당사 사 층 강당에 들어와 앉았다. 사장은 밀린 월급을 두고 외국으로 떠난 뒤였다. 노동청도 은행도 그들을 만나 주지 않았다. 김무성은 강당에 올라가 여기까지 온 사람들을 내보내지 않겠다고 말했다.\n\n사흘째 새벽 두 시 경찰 천여 명이 당사를 에워쌌다. 그들은 현관 셔터를 뜯고 계단으로 올라왔다. 여공들은 서로 팔을 끼고 노래를 불렀다. 강당이 비는 데는 이십삼 분이 걸렸다.\n\n의원들과 기자들이 복도에서 맞았다. 당 대변인은 코뼈가 부러졌다. 김무성은 양팔이 잡힌 채 끌려 나와 승용차에 실려 집으로 보내졌다. 스물한 살 여공 한 명이 건물 뒤편 바닥에서 숨진 채 발견됐다. 경찰은 스스로 뛰어내렸다고 발표했다.\n\n김무성은 그날 아침 당사로 돌아와 깨진 유리 위에서 기자들을 만났다. 한 달 뒤 법원은 그의 당 대표 직무를 정지시켰다. 그는 외국 신문 기자를 집으로 불러 이 정권을 더는 돕지 말라고 말했다. 여당은 그 발언을 문제 삼아 징계안을 냈다."
 tfrkphn.7208.d:0 "김동연은 외국에서 돌아와 지방을 돌며 강연하고 있었다. 봄의 어느 새벽 수사관들이 그의 집에 와서 그를 차에 태웠다. 그는 수사 기관의 지하 조사실에서 사십육 일을 보냈다. 가족은 그가 어디 있는지 듣지 못했다. 조사실에는 창이 없었고 전등은 밤에도 꺼지지 않았다.\n\n정부는 공직에 있으면서 재산을 부당하게 불린 사람들의 명단을 발표했다. 그의 이름이 맨 위에 있었다. 근거가 된 서류는 공개되지 않았다. 신문은 발표문을 한 글자도 고치지 않고 실었다. 방송은 그의 집 대문을 사흘 동안 비췄다.\n\n그는 조사실에서 각서 두 장에 서명했다. 한 장은 집과 땅과 예금을 나라에 내놓는다는 내용이었고, 다른 한 장은 공직에서 물러나 정치를 하지 않겠다는 내용이었다. 각서의 날짜 칸은 비어 있었다. 그는 서명한 날 저녁에 풀려났다.\n\n가을에 정부는 정치 활동을 금지하는 사람 오백육십칠 명의 이름을 관보에 실었다. 김무성과 김부겸의 이름도 거기에 있었다. 김동연은 짐을 싸서 다시 외국으로 떠났다. 공항에는 예전 부하 직원 셋이 나와 있었다."
 tfrkphn.7212.d:0 "연정 대표들이 대통령 집무실로 서류 한 장을 들고 왔다. 예산안이 국회에서 넉 달째 묶여 있으니 대통령 긴급명령으로 먼저 집행하자는 초안이었다. 초안에는 서명란만 비어 있었다. 대표들 가운데 둘은 지난 선거에서 우원식의 유세 차에 함께 올랐던 사람들이었다.\n\n대표들은 급한 사정을 차례로 설명했다. 피난민 지원금이 다음 달이면 끊기고, 지방 병원 두 곳이 문을 닫는다고 했다. 국회가 뒤에 승인하면 절차에도 문제가 없다고 덧붙였다. 기획재정부 장관은 금고에 남은 돈으로는 석 주를 버티기 어렵다고 보고했다.\n\n우원식은 초안을 끝까지 읽었다. 조원진이 국회를 해산할 때 낸 명령도 같은 조항을 근거로 삼았다. 그가 전차 위에서 읽은 글은 바로 그 조항을 따르지 말라는 내용이었다.\n\n서명하면 지원금은 다음 주에 나간다. 돌려보내면 예산은 국회가 합의할 때까지 묶이고, 연정 대표들은 대통령이 손을 놓았다고 기자들에게 말할 것이다. 기자실에는 벌써 대통령이 서명한다는 말이 돌고 있었다. 비서관이 만년필을 책상 위에 올려놓았다."
 tfrkphn.7213.d:0 "방송 당국이 허가 취소안 한 건을 대통령실에 올렸다. 대상은 조원진 지지 집회를 날마다 중계하는 방송사였다. 이 방송은 긴급명령이 정당했다고 말했고, 대통령을 국회가 세운 허수아비라고 불렀다.\n\n취소안에는 연정 의원 백여 명의 서명이 붙어 있었다. 서명한 의원 가운데에는 장관을 겸한 사람도 있었다. 의원들은 이 방송이 토요일마다 사람들을 광장으로 불러낸다고 적었다. 지난주 집회에서는 경찰관 세 명이 다쳤다. 다친 경찰관의 가족이 대통령실 앞에서 일인 시위를 시작했다.\n\n우원식은 공영방송 사장을 대통령이 고르지 못하게 하겠다고 약속한 사람이다. 그가 취임하던 날 밤에 공개한 국무회의 회의록에도 같은 약속이 적혀 있다. 정부가 싫어하는 방송을 닫을 수 있다면 그 약속은 뜻이 없어진다. 다음 정부는 같은 서류로 다른 방송을 닫을 수 있다.\n\n취소하면 광장은 한동안 조용해진다. 허가를 유지하면 그 방송은 오늘 밤에도 대통령을 조롱한다. 결재 시한은 오늘 자정이고, 비서실장은 서류철을 든 채 문 앞에 서 있다."
 tfrkphn.7214.d:0 "법원이 긴급명령에 가담한 장성 두 명에게 무죄를 선고했다. 재판부는 두 사람이 명령서를 전달했을 뿐이고 병력을 움직인 증거가 없다고 판단했다. 방청석에서 고함이 터졌고 법정 경위가 방청객들을 내보냈다. 두 사람은 법정을 나서며 기자들의 질문에 답하지 않았다.\n\n그날 저녁 연정 의원들이 법안을 냈다. 긴급명령 사건만 맡는 특별 재판부를 두고, 판사는 국회가 추천한다는 내용이었다. 발의자 명단에는 여의도에서 담을 넘었던 의원들의 이름이 맨 앞에 있었다. 법원 앞에는 판결에 항의하는 촛불이 모였다.\n\n우원식은 판결문을 읽었고, 그도 이 판결이 못마땅했다. 그러나 국회가 판사를 골라 원하는 판결을 받아 내면 다음 국회도 같은 일을 할 수 있다. 조원진의 청산 위원회가 바로 그렇게 일했다. 그때 명단에 오른 사람들은 변호인도 없이 조사를 받았다.\n\n법안은 대통령이 서명해야 법이 된다. 거부하면 무죄 판결은 그대로 남고, 촛불은 법원 앞에서 대통령 관저 앞으로 옮겨 온다. 법무부 장관은 대통령의 뜻을 따르겠다고만 말했다."
 tfrkphn.7215.d:0 "합동참모의장이 대통령에게 면담을 청했다. 면담은 예정에 없던 것이어서 비서실은 오후 일정 두 개를 미뤘다. 그는 전군 지휘관 회의에서 대통령을 지지하는 성명을 내겠다고 보고했다. 거리 집회가 다시 커지고 있으니 군이 누구 편인지 밝혀 두자는 뜻이었다.\n\n성명 초안은 짧았다. 군은 헌법에 따라 뽑힌 대통령을 끝까지 지킨다는 한 문장이었다. 서명한 지휘관은 마흔 명이 넘었고 해군과 공군도 들어 있었다. 의장은 여의도에서 포탑을 돌린 부대장들이 먼저 서명했다고 말했다.\n\n우원식에게 이 성명은 고마운 일이었다. 연정은 갈라지고 있었고 지지율은 석 달째 내려갔다. 군의 지지 성명 한 장이면 광장의 구호는 한풀 꺾인다. 비서실장은 성명이 나오면 내일 조간 일 면이 바뀐다고 말했다.\n\n그는 초안을 오래 들여다보았다. 대통령을 지지한다고 밝힌 군은 다음에는 지지하지 않는다고 밝힐 수도 있다. 조원진도 취임 첫해에 수도권 지휘관들의 충성 서약을 받았다. 그의 책상에는 군의 정치 개입을 금지하는 법안이 서명을 기다리며 놓여 있었다."
 tfrkphn.7216.d:0 "임기 마지막 주에 대통령은 우원식의 집을 찾았다. 집은 작았고 대문은 열려 있었다. 경호원들은 골목 어귀에 남았다. 우원식은 물러난 뒤 한 번도 청사에 오지 않았다. 두 사람은 마당 평상에 앉아 보리차를 마셨다. 해가 기울고 있었다.\n\n우원식은 자기가 한 일을 길게 말하지 않았다. 무너지지 않게 붙들고 있었을 뿐이고 새로 지은 것은 하나도 없다고 했다. 그는 거절한 서류들을 하나씩 떠올렸지만 입 밖에 내지는 않았다. 국회와 법원, 언론과 군을 넘겨줄 때 모두 금이 가 있었다는 것도 그는 알고 있었다.\n\n대통령은 수첩을 꺼내 지난 몇 해 동안 고친 것들을 읽어 주었다. 국회가 다시 예산을 심의하게 된 일과 법원이 정부에 불리한 판결을 낸 일이 적혀 있었다. 대통령은 고치지 못한 것들도 빼지 않고 읽었다. 우원식은 끝까지 듣고 고개를 끄덕였다.\n\n[Root.TFRKPHN_rb_end_loc]"
 tfrkphn.7219.d:0 "교육부가 새 역사 교과서의 집필 기준을 대통령실에 올렸다. 양안전쟁을 다루는 단원에서 집필진이 한 문장을 두고 갈라졌다. 정부가 국회에 알리지 않고 대만을 도운 일을 어떻게 적느냐는 문제였다.\n\n한쪽 초안은 그 일을 나라를 지킨 결단이라고 썼다. 다른 초안은 국회의 동의 없이 군을 움직인 일이라고 썼다. 여당은 앞의 문장을 밀었고 야당은 뒤의 문장을 밀었다. 유족회는 어느 쪽이든 숨진 사람들의 이름이 빠지지 않게 해 달라고 요구했다. 교사 단체는 시험에 나올 문장부터 정해 달라고 했다.\n\n오세훈은 두 초안을 나란히 놓고 읽었다. 그는 그 다섯 해 동안 서울시장이었고 그 결정에 참여하지 않았다. 그래도 그 전쟁이 끝난 나라를 물려받은 사람은 그였다. 그 전쟁에서 숨진 사람들의 명단을 공개한 것도 그의 정부였다.\n\n두 문장을 모두 실으면 교과서는 길어지고 양쪽이 다 불만을 품는다. 한 문장만 고르면 다음 정부가 그 문장을 다시 고친다. 집필 기준의 확정 시한은 이번 주 금요일이고, 교육부 장관은 어느 쪽이든 따르겠다고 했다."
 tfrkphn.7220.d:0 "부산의 한 해운 회사 앞에서 늙은 선원 서른 명이 농성을 시작했다. 그들은 양안전쟁 때 정부가 빌려 쓴 화물선을 타고 대만 해협을 오갔다. 배는 서류에 다른 이름으로 적혔고 선원들은 계약서 없이 탔다. 운임은 현금으로 받았고 영수증은 없었다.\n\n군인과 정비사는 법이 바뀌어 참전용사가 되었다. 민간 선원은 그 법에 들어 있지 않았다. 기뢰에 배를 잃은 선주들은 보상을 받지 못했고, 다친 선원들은 산재 신청을 거절당했다. 근로복지공단은 그 항해가 기록에 없다고 답했다. 선원들의 평균 나이는 예순여덟이다.\n\n해양수산부는 선원 명단을 다 밝히면 그 배들이 실어 나른 물건의 목록도 함께 드러난다고 보고했다. 중국 정부는 그 목록을 오래 기다려 왔다. 외교부는 공개 시기를 늦춰 달라는 의견서를 따로 냈다.\n\n명단을 밝혀 선원들을 참전용사로 올릴 수 있다. 명단은 묶어 둔 채 이름 없는 위로금만 줄 수도 있다. 농성장의 천막에는 배 이름 열두 개가 적혀 있었고, 그 가운데 넷은 돌아오지 못한 배였다. 농성은 오늘로 스무 날째다."
 tfrkphn.7221.d:0 "총선을 앞두고 예비역 장교 열일곱 명이 출마를 선언했다. 모두 양안전쟁의 비밀 작전에 나섰던 사람들이었다. 그들은 기자회견장에 훈장을 달고 나왔고, 그 훈장은 지난해에야 공개로 수여된 것이었다. 작전 이름은 아직도 비밀이어서 그들은 자기 공적을 말하지 못했다.\n\n여당과 야당은 그들을 서로 데려가려 했다. 전쟁을 치른 사람이 국방 예산을 다뤄야 한다는 말이 방송마다 나왔다. 현역 장성 몇은 사석에서 후배들의 출마를 반겼고, 그 말이 신문에 실렸다. 국방부는 현역의 정치 발언을 조사하겠다고 했지만 징계는 없었다.\n\n오세훈은 국방 예산을 줄여 주택과 복지로 돌리려던 참이었다. 훈장을 단 의원 스무 명이 국방위원회에 앉으면 그 계획은 통과하기 어렵다. 그들의 출마를 막을 법은 없고, 막아서도 안 되는 일이었다.\n\n여당 지도부는 대통령의 뜻을 물었다. 그들을 여당 후보로 받아들이면 선거에는 도움이 된다. 거리를 두면 그들은 무소속이나 다른 당의 이름으로 나온다. 그들의 지지율은 현역 의원보다 높았다. 공천 심사는 다음 주에 시작된다."
 tfrkphn.7222.a:0 "단호히 응하지 않는다."
 tfrkphn.7222.b:0 "일부 응하겠다."
 tfrkphn.7222.d:0 "중화인민공화국 외교부는 한국 정부에 해명을 요구한다. 공개된 자료는 한국어 음성과 한국제 무기, 대한민국 해군이라고 쓰인 군함 등을 분명히 가리키고 있다.\n\n중국 쪽의 요구는 간단했다. 태평양방위조약기구와 어떠한 협력도 하지 말라는 것이다. 오세훈은 각 부처를 불렀다. 산업부는 가뜩이나 무너진 대중 무역이 이 일로 완전히 끊기면 경제가 크게 다친다고 했다. 국방부는 달랐다. 이참에 중공과 단교하고 중화민국을 공식 방문하자는 것이다. 외교부는 대통령이 어떤 결정을 하든 따르겠다고 했다.\n\n중국의 요구를 들어준다면 경제는 살 것이다. 하지만 이는 주권에 간섭하는 일이다. 그렇다고 주권에 간섭하는 자들을 믿을 수 있겠는가. 대통령의 결단은 그 어느 때보다 무거웠다.\n\n외교부는 성명을 발표할 준비를 하십시오.\n대한민국 정부는 중국의 요구에"
 tfrkphn.7233.d:0 "김부겸은 임기 마지막 해에 군 인사법 개정안을 국회에 냈다. 대장으로 진급하는 사람은 국회 국방위원회의 청문을 거친다는 내용이었다. 대통령이 혼자 쥐고 있던 권한을 절반 내놓는 법이었다. 그 권한은 정부가 선 뒤로 한 번도 국회와 나눈 적이 없었다.\n\n국방부는 조용히 반대했다. 청문회가 열리면 장군들이 의원들 눈치를 보게 된다는 이유였다. 예비역 단체는 군을 정치판에 끌어들인다는 성명을 냈다. 여당 안에서도 다음 대통령의 손을 묶는다는 말이 나왔다.\n\n대통령은 합동참모본부 회의에 직접 갔다. 그는 여의도에 전차가 들어온 날 그 명령서에 서명한 사람도 대통령이 고른 장군이었다고 말했다. 회의실은 한동안 조용했다. 그는 법안을 거두지 않겠다는 말만 하고 일어섰다.\n\n법안은 석 달 뒤 통과됐다. 첫 청문회에 나온 대장 후보자는 일곱 시간 동안 질문을 받았다. 그는 헌법에 어긋나는 명령을 받으면 따르지 않겠다고 속기록에 남겼다. 청문회는 방송으로 나갔고 병사들은 생활관에서 그것을 보았다. 그는 열한 표 차이로 인준됐다."
 tfrkphn.7234.d:0 "헌법재판관 세 명의 임기가 같은 달에 끝났다. 세 자리 모두 대통령이 지명할 수 있었다. 참모들은 개혁을 지킬 사람을 앉힐 마지막 기회라고 보고했다. 세 사람이 바뀌면 재판소의 과반이 바뀐다.\n\n김부겸은 명단을 받지 않았다. 그는 판사와 변호사, 법학 교수와 시민 대표가 섞인 추천 위원회를 꾸리고, 위원회가 올린 사람 가운데서만 고르겠다고 발표했다. 위원회의 회의는 방송으로 내보냈다. 추천 위원 열한 명 가운데 대통령이 고른 사람은 한 명도 없었다. 회의는 아홉 번 열렸다.\n\n위원회가 올린 여섯 명 가운데에는 정부의 사정 수사를 비판하는 글을 쓴 판사가 있었다. 민정수석은 그 이름만은 빼자고 했다. 대통령은 그 판사를 세 사람 가운데 첫째로 지명했다. 나머지 두 자리도 위원회가 매긴 순서대로 채웠다.\n\n여당 지지자들의 항의 전화가 대통령실에 종일 걸려 왔다. 새 재판관은 취임 넉 달 뒤 정부가 낸 법률 하나에 위헌 의견을 냈다. 대통령실은 판결을 존중한다는 한 줄짜리 논평을 냈다. 그 법률은 그가 선거에서 약속한 것이었다."
 tfrkphn.7235.d:0 "김부겸은 임기 마지막 가을에 광주와 대구를 하루에 다녀오는 일정을 잡았다. 아침에는 광주의 묘역에 가고 저녁에는 대구의 시장에 가는 일정이었다. 수행원은 열 명으로 줄였다.\n\n그는 대구에서 여러 번 출마했고 한 번 이겼다. 떨어질 때마다 당을 바꾸라는 말을 들었다. 두 도시를 잇는 철도는 그의 임기에 착공됐고 아직 절반이 남아 있었다.\n\n광주의 묘역에서 그는 방명록에 이름만 적었다. 방명록의 앞 장에는 다섯 해 전 그가 적은 이름이 남아 있었다. 대구의 시장에서는 상인 한 사람이 어묵 값을 받지 않겠다고 했고, 그는 끝내 돈을 냈다. 시장 입구에는 그를 반대하는 현수막과 환영하는 현수막이 나란히 걸려 있었다. 현수막은 둘 다 그대로 두라고 그는 말했다.\n\n돌아오는 기차에서 수행 기자가 지역 구도가 깨졌다고 보느냐고 물었다. 그는 지난 총선의 지역별 득표율 표를 꺼내 보여 주었다. 표의 숫자는 다섯 해 전보다 조금 움직여 있었다. 그는 표를 접어 윗옷 안주머니에 넣었고, 기차는 밤 열한 시에 서울역에 닿았다."
 tfrkphn.7236.d:0 "개혁이 다섯 해째에 이르자 대통령 곁에는 처음 시작한 사람이 몇 남지 않았다. 사정 수사는 여당 의원 넷을 법정에 세웠고, 그 가운데 둘은 대통령의 선거를 도왔던 사람이었다. 나머지는 장관을 그만두었거나 스스로 떠났다.\n\n한 사람은 재판을 받으러 가는 길에 기자들 앞에서 대통령을 원망했다. 다른 한 사람의 부인은 대통령 부인에게 긴 편지를 보냈다. 김부겸은 그 편지를 읽었고 답장을 쓰지 않았다. 편지에는 삼십 년 전 함께 찍은 사진이 들어 있었다.\n\n지지율은 취임 때의 절반이 됐다. 재계 단체는 정권이 바뀌기만 기다린다는 말을 숨기지 않았다. 군에서 밀려난 장군들은 회고록을 준비했다. 여당 원내대표는 다음 총선을 걱정하는 의원들의 연판장을 들고 왔다.\n\n민정수석은 남은 수사 가운데 몇 건을 다음 정부로 넘기자고 건의했다. 대통령은 수사에 관해 보고를 받지 않겠다고 다시 말했다. 검찰은 그 주에 여당 중진 한 사람을 더 불렀고, 대통령은 그 소식을 저녁 뉴스에서 처음 들었다. 그는 텔레비전을 끄지 않았다."
 tfrkphn.7237.a:0 "다음엔 필요할 때 보자."
 tfrkphn.7237.d:0 "임기가 반년 남았을 때 김부겸은 김동연과 김무성을 청와대로 불러 점심을 먹었다. 배석자는 없었다. 상에는 칼국수 세 그릇이 올라왔다.\n\n김동연은 노란 봉투에서 보고서를 꺼냈다. 국회와 법원, 언론과 군에서 고친 것과 고치지 못한 것이 한 쪽씩 마주 보게 적혀 있었다. 그는 항목을 하나씩 짚어 가며 물었다.\n\n김무성은 고치지 못한 쪽이 더 길다며 웃었다. 김동연은 숫자가 틀린 곳 두 군데를 그 자리에서 짚었다. 대통령은 두 사람의 말을 받아 적었다. 김동연이 석 달에 한 번씩 이렇게 만나자고 하자, 김무성은 필요할 때 만나면 된다고 받았다.\n\n점심은 두 시간을 넘겼다. 청와대 앞에 진을 친 기자들이 다음 선거의 킹메이커가 누구냐고 묻자, 김무성은 오늘 칼국수는 대통령이 샀다고만 했다."
 tfrkphn.7238.d:0 "전쟁 때 발행한 국채의 마지막 회차가 만기를 맞았다. 기획재정부는 상환 자금을 석 달 전에 따로 떼어 두었다. 김동연은 상환하는 날 한국은행 전산실에 직접 갔다. 방문은 일정표에 없었다. 수행원은 비서관 한 명이었다.\n\n담당 과장이 화면의 단추를 눌렀다. 숫자가 영으로 바뀌는 데는 사 초가 걸렸다. 전산실 직원 열두 명이 박수를 쳤고, 대통령은 과장에게 영수증을 한 장 뽑아 달라고 했다. 박수는 오래가지 않았다. 영수증에는 상환 금액과 시각이 초 단위까지 찍혀 있었다.\n\n그 빚은 그가 일으키지 않은 전쟁에서 생긴 것이었다. 다섯 해 동안 예산의 여섯에 하나가 이자로 나갔다. 그 돈이면 지방 병원 서른 곳을 지을 수 있었다는 계산을 그는 수첩에 적어 두고 있었다. 그는 그 계산을 임기 첫 주에 했다.\n\n외신은 패전국이 빚을 기한 안에 다 갚았다고 짧게 전했다. 국채 금리는 그날 오후 조금 내렸다. 대통령은 영수증을 접어 수첩 사이에 끼우고, 다음 일정인 예산 회의에 십 분 늦게 들어갔다. 회의 안건은 내년에 새로 빌릴 돈이었다."
 tfrkphn.7239.d:0 "정부는 나라 살림의 지출 내역을 날마다 인터넷에 올리기 시작했다. 어느 부처가 어디에 얼마를 썼는지 누구나 찾아볼 수 있었다. 김동연이 우원식 정부에서 경제를 맡았을 때부터 밀던 일이었다. 자료는 내려받아 표로 만들 수 있는 형식이었다.\n\n장관들은 반기지 않았다. 공개 첫 주에 한 신문은 어느 부처의 회식비를 찾아내 일 면에 실었다. 다음 주에는 대통령실의 꽃값이 기사가 됐다. 비서실장은 공개 범위를 줄이자고 건의했다. 장관 둘은 국무회의에서 공개를 멈추자고 발언했다.\n\n대통령은 범위를 줄이지 않았다. 그는 기자들이 숫자를 직접 볼 수 있어야 정부의 발표를 받아쓰지 않는다고 말했다. 대통령실은 꽃값을 절반으로 줄였다.\n\n석 달 뒤 한 지방 신문의 기자가 장부에서 이상한 계약 한 건을 찾아냈다. 감사원이 조사에 들어갔고 국장 한 사람이 물러났다. 감사원장은 장부가 없었다면 찾지 못했을 계약이라고 국회에 보고했다. 그 기자는 그해 언론상을 받았고, 수상 소감에서 정부가 준 자료로 정부를 고발했다고 말했다."
 tfrkphn.7240.d:0 "전쟁으로 수출길이 끊긴 뒤 문을 닫았던 제철소가 여섯 해 만에 고로에 불을 넣었다. 김동연은 화입식에 참석했다. 고로 앞에는 다시 고용된 노동자 이천 명이 서 있었다. 제철소 굴뚝에서 연기가 오르는 것을 보려고 시민들이 방파제에 모였다.\n\n그 가운데 절반은 그사이 다른 일을 했다. 택배를 나른 사람이 있었고 식당을 열었다가 닫은 사람도 있었다. 회사를 떠난 지 여섯 해 만에 작업복을 다시 입은 사람들이었다. 돌아오지 않은 사람은 삼천 명이었다. 회사는 그 자리를 다 채우지 못했다.\n\n대통령은 준비한 연설문을 읽지 않았다. 그는 자기도 열일곱 살에 은행에 들어가 낮에는 일하고 밤에는 학교에 다녔다고 말했다. 연설은 이 분 만에 끝났다. 노동자들은 박수를 치지 않고 고개를 끄덕였다.\n\n불씨는 가장 오래 일한 노동자가 넣었다. 쇳물이 처음 나온 것은 이틀 뒤였다. 첫 쇳물로 만든 강판은 다시 열린 항구에서 배에 실렸고, 그 배의 목적지는 여섯 해 전에 거래가 끊긴 나라였다. 항구의 크레인 기사도 그해 봄에 다시 고용된 사람이었다."
 tfrkphn.7241.d:0 "빚을 갚는 다섯 해 동안 정부는 많은 것을 깎았다. 공무원 임금은 세 해 동안 오르지 않았다. 지방 도로 공사 사백 건이 미뤄졌고 공기업 여섯 곳이 팔렸다. 대학 연구비와 군 장병의 급식비도 줄었다.\n\n김동연은 임기 마지막 해에 깎은 것의 목록을 따로 만들게 했다. 목록은 예산서와 같은 두께가 됐다. 그는 그 목록을 예산서 옆에 나란히 공개했다. 참모들은 선거를 앞두고 그럴 필요가 있느냐고 물었다. 대통령은 숨기면 다음 정부가 같은 것을 다시 깎는다고 답했다.\n\n목록의 맨 앞에는 노인 요양 시설의 인력 감축이 있었다. 한 시설의 원장은 방송에 나와 빚은 갚았지만 그동안 돌보지 못한 사람이 있다고 말했다. 야당은 그 방송을 선거 광고에 썼다. 그 시설에서는 요양 보호사 한 사람이 노인 열두 명을 맡고 있었다.\n\n대통령은 그 시설을 찾아갔다. 그는 원장의 말을 한 시간 동안 들었고 변명하지 않았다. 이듬해 예산안에는 깎았던 요양 인력이 먼저 되돌아왔다. 도로 공사는 여전히 목록에 남았다. 목록의 둘째 줄은 지방 병원이었다."
 tfrkphn.7242.d:0 "임기가 끝나 가자 김동연은 다음 정부에 넘길 보고서를 직접 고쳤다. 보고서는 숫자로 가득했다. 나라 빚과 외환 보유고, 실업률과 수출액이 다섯 해 치 표로 실렸다. 초안은 기획재정부가 썼고 사백 쪽이었다. 그는 사흘 밤을 썼다.\n\n그는 표 옆에 칸을 하나 더 만들게 했다. 그 숫자를 만든 사람의 이름을 적는 칸이었다. 항구를 다시 연 과장과 채권단을 설득한 국장의 이름이 들어갔다. 공장 문을 다시 연 노동조합 위원장의 이름도 들어갔다. 이름을 넣어도 되느냐고 물으면 당사자들은 대개 망설였다.\n\n비서관은 관례에 없는 일이라고 했다. 대통령은 다음 사람이 숫자가 흔들릴 때 누구에게 전화해야 하는지 알아야 한다고 답했다. 이름은 모두 삼백여 개가 됐다. 전화번호는 적지 않았지만 소속과 직책은 적었다.\n\n보고서의 마지막 표는 비어 있었다. 제목은 아직 하지 못한 일이었고, 그는 거기에 다섯 줄을 손으로 적었다. 첫 줄은 지방의 일자리였다. 둘째 줄은 요양 시설이었고 셋째 줄은 지방 병원이었다. 인쇄소는 그 손글씨를 그대로 찍었다."
 tfrkphn.7243.d:0 "김무성은 임기 마지막 해에 국회 본회의에 달마다 한 번씩 나가기로 했다. 대통령이 의원들의 질문을 직접 받는 자리였다. 헌법에는 그럴 의무가 없었다. 날짜는 매달 첫 수요일로 정했다.\n\n첫날 야당 의원 열두 명이 질문에 나섰다. 질문은 네 시간 동안 이어졌고 절반은 대통령을 몰아세우는 것이었다. 한 초선 의원은 개헌이 대통령 자신의 자리를 늘리려는 것 아니냐고 물었다. 그는 임기가 끝나면 집에 간다고 답했다. 여당 의원 몇은 대통령을 감싸는 질문을 준비했다가 그에게 꾸중을 들었다.\n\n비서진은 두 번째부터는 총리를 대신 보내자고 했다. 대통령은 내각제를 하자는 사람이 국회에서 도망치면 누가 그 말을 믿겠느냐고 했다. 그는 다음 달에도 나갔다. 총리는 그 옆자리에 앉아 답변 자료를 넘겨 주었다.\n\n여섯 번째 되는 달에 본회의장 방청석은 가득 찼다. 방송사들은 그 시간을 생중계로 잡았다. 의원들의 질문은 처음보다 짧아졌고, 숫자를 들고 나오는 의원이 늘었다. 대통령의 답도 처음보다 짧아졌다. 속기록은 그날 밤 공개됐다."
 tfrkphn.7244.d:0 "국회가 대통령의 뜻과 다른 법안을 통과시켰다. 대기업의 지주 회사 규제를 강하게 묶는 법이었다. 여당 일부가 야당과 손잡고 찬성표를 던졌다. 표결은 백육십 대 백이십이었다.\n\n재계는 거부권을 요청했다. 경제 부처 장관 셋도 같은 의견을 올렸다. 김무성 자신도 그 법이 지나치다고 보았다. 성장을 앞세운 그의 다섯 해와 맞지 않는 법이었다. 법이 시행되면 큰 회사 다섯 곳이 지분을 정리해야 했다. 주가는 사흘 동안 내렸다.\n\n그는 거부권 행사 시한 전날 밤까지 서류를 책상에 두었다. 조원진은 국회가 보낸 법안마다 거부권을 썼다. 그 끝이 어디였는지는 온 나라가 기억했다. 거부권 서류의 초안은 이미 결재판에 끼워져 있었다. 그는 밤 열한 시에 비서실장을 불러 초안을 돌려보냈다.\n\n대통령은 법안에 서명했다. 그는 서명한 뒤 국회에 보완 입법을 요청하는 글을 따로 보냈다. 재계 단체의 회장은 실망했다는 말을 전해 왔다. 석 달 뒤 국회는 그 법의 조항 둘을 스스로 고쳤다. 고친 조항은 대통령이 글에서 짚은 것과 같은 곳이었다."
 tfrkphn.7245.d:0 "대통령 관저의 응접실은 임기 내내 저녁마다 손님이 있었다. 김무성은 여야 의원들을 열 명씩 불러 밥을 먹었다. 그는 그 방을 사랑방이라고 불렀다. 식사는 저녁 일곱 시에 시작해 아홉 시 전에 끝났다.\n\n처음에는 여당 의원만 왔다. 야당은 들러리가 되지 않겠다며 거절했다. 대통령은 야당 원내대표의 지역구 행사에 예고 없이 찾아가 막걸리를 한 잔 받았다. 그다음 달부터 야당 의원들도 관저에 왔다. 원내대표는 그 자리에서 다음 주 저녁 날짜를 물었다.\n\n사랑방에서 법안이 여럿 풀렸다. 넉 달 동안 묶여 있던 추가 예산이 그 방에서 합의됐다. 기자들은 밀실 정치가 돌아왔다고 썼다. 대통령은 그 뒤로 저녁 식사의 참석자 명단과 오간 이야기의 요지를 이튿날 공개하게 했다. 요지는 한 쪽을 넘지 않았다.\n\n임기 마지막 달에 그는 세어 보았다. 관저에서 밥을 먹은 의원은 재적 삼백 명 가운데 이백팔십일 명이었다. 오지 않은 열아홉 명에게는 따로 편지를 보냈다. 편지의 내용은 모두 달랐고 그는 초안을 직접 썼다. 답장은 일곱 통이 왔다."
 tfrkphn.7246.d:0 "여당은 다음 대통령 선거의 후보를 정해야 했다. 중진 의원 셋이 나서겠다고 했고, 세 사람 모두 대통령의 뜻을 물으러 관저에 왔다. 셋 가운데 둘은 그가 처음 공천을 준 사람이었다.\n\n김무성은 오랫동안 다른 사람을 후보로 세우는 일을 했다. 당 사람들은 이번에도 그가 한 사람을 찍어 줄 것으로 믿었다. 그는 그 일을 잘했고 그 일로 원망도 많이 들었다.\n\n그는 세 사람에게 같은 말을 했다. 당원과 국민이 뽑는 대로 따르겠다는 말이었다. 한 의원은 서운한 얼굴로 돌아갔다. 다른 의원은 대통령의 측근들을 따로 만나고 다녔다. 세 번째 의원은 아무 말 없이 차만 마시고 갔다.\n\n대통령은 측근들을 불러 경선에 끼어들면 인연을 끊겠다고 일렀다. 여당 사무총장은 경선 규칙을 대통령실에 묻지 않고 정했다. 경선은 석 달 동안 이어졌고 세 후보는 방송 토론을 여덟 번 했다. 그는 토론을 관저에서 혼자 보았다. 결과가 나온 날 그는 당선자에게 축하 전화를 걸었고, 통화는 일 분이 걸리지 않았다. 떨어진 두 사람에게는 그가 먼저 저녁을 청했다."
 tfrkphn.7247.d:0 "임기 마지막 겨울에 김무성은 관저 서재의 바둑판을 꺼냈다. 그는 바둑을 잘 두지 못했다. 판 위에 돌을 놓으며 생각을 정리하는 버릇이 있을 뿐이었다. 바둑판은 관저에 전부터 있던 것이었다.\n\n그는 검은 돌 네 개를 네 귀에 놓았다. 국회와 법원, 언론과 군이었다. 넘겨받을 때 그 돌들은 모두 끊어질 자리에 있었다. 그는 다섯 해 동안 국회라는 돌 하나를 살리는 데 가장 많은 수를 썼다. 흰 돌은 놓지 않았다.\n\n나머지 세 귀는 다른 사람들이 이어 주었다. 김부겸은 군과 법원의 일로 여러 번 자문에 응했다. 김동연은 예산 장부를 여는 법을 알려 주었다. 세 사람은 선거에서 싸웠지만 그 뒤로는 서로의 전화를 받았다. 언론의 일은 세 사람 누구도 다 풀지 못했다고 그는 생각했다.\n\n그는 돌을 하나씩 통에 담았다. 검은 돌 넷은 다른 돌과 섞이지 않게 따로 넣었다. 판은 다음 사람이 처음부터 다시 놓게 된다. 그는 퇴임 회견에서 이 바둑판 이야기를 했다. 바둑판은 다음 사람을 위해 관저에 두고 간다고 했다."
 tfrkphn.7248.d:0 "대아대전이 태평양방위조약기구의 승리로 끝났다. 평양 외곽의 마지막 저항이 멎었다는 보고는 새벽에 들어왔다. 김부겸은 관저에서 전화를 받았고, 날이 밝기 전에 국가안전보장회의를 열었다. 장관들은 넥타이를 매지 못한 채 들어왔다. 밖은 아직 어두웠다.\n\n회의실의 분위기는 들떠 있었다. 한 참모는 광화문에서 기념식을 열자고 했다. 다른 참모는 이참에 국방 예산을 늘리자고 했다. 예비역 단체는 군의 위상을 되찾을 때라는 성명을 아침 일찍 냈다.\n\n대통령은 기념식을 열지 않기로 했다. 이 나라는 몇 해 전 다른 전쟁에서 진 나라였다. 그때 전쟁을 끝까지 해야 했다고 외치던 사람들이 조원진을 대통령으로 만들었다. 그는 이긴 전쟁의 열기가 같은 길로 흐르는 것을 경계했다.\n\n그는 국방부 장관에게 두 가지를 지시했다. 북쪽에 들어간 부대는 주민의 집과 재산에 손대지 말고, 작전의 모든 과정을 국회에 보고하라는 것이었다. 그날 오후 대통령은 전사자 명단을 받았다. 그는 명단을 끝까지 읽었고, 유족에게 보낼 편지의 초안을 직접 고쳤다."
 tfrkphn.7249.d:0 "전쟁이 끝난 뒤의 첫 정기 국회가 열렸다. 김부겸은 시정 연설에서 남은 임기 동안 새 개혁 법안을 내지 않겠다고 말했다. 본회의장이 잠시 술렁였다. 연설문의 그 대목은 그가 전날 밤 직접 고쳐 쓴 것이었다.\n\n그는 이유를 설명했다. 군 인사와 재판관 추천, 수사의 독립은 이제 법에 적혀 있다. 대통령이 더 밀어붙이면 그 법들은 한 사람의 뜻으로 남는다. 다음 대통령이 그 법을 지키는지 지켜보는 것은 국회와 법원의 일이라고 그는 말했다.\n\n야당 대표는 대통령이 힘이 빠지니 물러서는 것이라고 논평했다. 여당의 젊은 의원들은 아직 할 일이 남았다며 서운해했다. 개혁에 밀려났던 사람들은 조용히 다음 선거를 기다렸다. 재계는 논평을 내지 않았다.\n\n연설을 마친 대통령은 의장석 쪽으로 돌아서서 허리를 숙였다. 그 의장석은 우원식이 긴급명령 무효 결의안의 가결을 선포한 자리였다. 본회의장 뒤편의 방청석에는 견학 온 중학생들이 앉아 있었고, 한 학생이 옆자리 친구에게 저 사람이 대통령이냐고 물었다. 인솔 교사가 그렇다고 답했다."
 tfrkphn.7250.d:0 "대아대전이 태평양방위조약기구의 승리로 끝났다. 소식이 들어온 아침에 김동연은 외환 시장이 열리기를 기다리고 있었다. 환율은 개장 십 분 만에 크게 내렸고 주가는 올랐다.\n\n경제 부처는 바빠졌다. 전쟁이 끝나면 항로가 다시 열리고 북쪽의 복구 사업이 시작된다. 건설 회사와 제철소의 주가는 상한가를 쳤다. 여당은 추가 예산을 짜서 전후 특수를 잡자고 요구했다. 빚을 다시 내자는 말이었다.\n\n대통령은 회의에서 지난 전쟁 얘기부터 꺼냈다. 이 나라는 지난 전쟁의 빚을 갚는 데 다섯 해를 썼고, 이번 전쟁을 치르느라 다시 빚을 졌다. 지난번에도 사람들은 전쟁이 끝나면 다 갚는다고 말했다.\n\n그는 추가 예산을 짜되 빚은 내지 않겠다고 발표했다. 세금이 더 걷히는 만큼만 쓰고, 기업이 복구 사업을 따내면 정부는 보증만 서겠다는 것이었다. 건설 회사들의 주가는 이튿날 조금 내렸다. 기획재정부의 한 과장은 대통령이 잔치에 장부를 들고 왔다고 동료에게 말했다."
 tfrkphn.7251.d:0 "전쟁이 끝난 이듬해 봄에 김동연은 인천항에 갔다. 북쪽의 남포항으로 가는 복구 물자를 실은 첫 배가 떠나는 날이었다. 부두에는 강판과 시멘트, 변압기가 쌓여 있었다.\n\n그 물자를 만든 공장들 가운데 여럿은 여섯 해 전에 문을 닫았던 곳이었다. 다시 켠 용광로에서 나온 강판이 맨 앞줄에 있었다. 수출 대금은 외상이 아니었다. 정부는 이번에는 물건값을 떼이지 않도록 계약서를 직접 검토했다.\n\n항만 노동자 대표는 대통령에게 일감이 얼마나 갈 것 같으냐고 물었다. 그는 세 해라고 답했다. 복구가 끝나면 주문은 줄어든다. 그 뒤에 무엇을 팔지는 지금 정해야 한다고 그는 말했다. 노동자 대표는 세 해라는 말을 그 자리에서 조합 단톡방에 올렸다.\n\n배가 떠난 뒤 대통령은 부두의 컨테이너를 세고 있었다. 따라온 기자가 무엇을 세느냐고 묻자, 그는 돌아올 때 빈 채로 오는 상자가 몇 개인지 센다고 답했다. 기자는 그 말을 받아 적었다. 돌아오는 차 안에서 대통령은 산업부 장관에게 전화를 걸어 다음 주 회의의 안건을 바꿨다."
 tfrkphn.7252.d:0 "대아대전이 태평양방위조약기구의 승리로 끝났다. 소식이 들어온 날 김무성은 여야 대표를 모두 관저로 불렀다. 일곱 정당의 대표가 한 방에 앉았다. 그 방에 일곱이 다 모인 것은 처음이었다.\n\n그는 전쟁 뒤의 일을 대통령 혼자 정하지 않겠다고 말했다. 전후 회담에 보낼 대표단을 국회가 함께 꾸리고, 북쪽을 다스릴 방식과 회담에서 맺는 약속은 모두 국회의 동의를 받겠다는 것이었다. 외교부 장관은 협상에서 손이 묶인다며 반대했다. 여당 대표도 처음 듣는 이야기라는 얼굴이었다.\n\n대통령은 지난 전쟁을 꺼냈다. 그때 전쟁의 중요한 결정은 대통령실 안에서 내려졌다. 졌을 때 책임을 나눠 질 사람이 없었고, 그 빈자리에 조원진이 들어섰다. 방 안의 누구도 그 말에 토를 달지 않았다.\n\n대표들은 그 자리에서 대표단의 구성에 합의했다. 여당 둘, 야당 셋, 정부 둘이었다. 진보 정당의 대표는 대통령과 처음으로 악수했다. 회의는 사십 분 만에 끝났고, 대통령은 대표들에게 저녁을 먹고 가라고 붙잡았다. 일곱 가운데 다섯이 남았다."
 tfrkphn.7253.d:0 "전후 회담에서 돌아온 대표단이 국회에 보고했다. 김무성은 본회의장의 대통령석이 아닌 방청석에 앉아 보고를 들었다. 경호원들은 그 자리를 말렸지만 그는 듣지 않았다. 방청석의 의자는 좁고 딱딱했다.\n\n보고는 야당 의원이 맡았다. 회담은 북쪽의 군정을 언제 끝내고 선거를 언제 치를지를 정했다. 대표단은 군정 기간을 한 해로 줄여 왔다. 그 약속에는 일곱 정당의 서명이 모두 들어 있었다. 정권이 바뀌어도 뒤집을 사람이 없는 약속이었다.\n\n질의는 세 시간 동안 이어졌다. 여당 의원이 야당 출신 대표를 몰아세웠고 야당 의원이 정부 대표를 몰아세웠다. 의장은 한 번도 정회를 선포하지 않았다. 비준 동의안은 이백사십 표로 통과됐다.\n\n표결이 끝나자 몇몇 의원이 방청석을 올려다보았다. 대통령은 이미 자리를 뜬 뒤였다. 그는 복도에서 만난 국회 직원에게 구내식당이 어디냐고 물었고, 그날 점심을 거기서 먹었다. 식판을 든 대통령을 알아본 직원들이 자리를 비켜 주려 하자 그는 손을 저었다. 그는 창가의 빈자리에 혼자 앉았다."
 tfrkphn.7254.d:0 "§R[속보]§! 북한군, 휴전선에서 남하 중. 국군 대응 조치 시작. 전군 데프콘 1 발령.\n\n대아대전이 한반도에 닿았다. 새벽에 휴전선 너머에서 포격이 시작됐고, 북한군은 세 방향으로 내려왔다. 합동참모본부는 십오 분 뒤 대통령에게 첫 보고를 올렸다. 대통령은 관저에서 곧바로 지하 벙커로 내려갔다.\n\n대한민국은 태평양방위조약기구의 회원국이다. 조약에 따라 회원국들은 같은 날 오전에 한국을 돕겠다고 통보해 왔다. 도쿄의 연합 사령부는 한국군과 작전 계획을 맞추기 시작했다. 중국은 북한과 한편에 섰다.\n\n대통령은 벙커에서 국무회의를 열었다. 국회의장과 여야 대표에게는 회의 전에 직접 전화를 걸었다. 국회는 그날 오후 본회의를 열어 방어 전쟁을 승인하는 결의안을 통과시켰다. 반대표는 없었다.\n\n서울의 지하철역은 대피소가 됐다. 예비군 동원령이 방송으로 나갔고, 동원 첫날의 응소율은 구십 퍼센트를 넘었다. 부대 정문 앞에는 군복을 꺼내 입은 사람들이 새벽부터 줄을 섰다. 이번 전쟁은 남의 바다가 아닌 이 나라의 땅에서 벌어지고 있었다."
 tfrkphn.7255.d:0 "광장이 비워진 지 한 달 뒤 국회는 법 두 개를 하루에 통과시켰다. 첫째 법은 집회를 신고제에서 허가제로 바꿨다. 허가 없이 세 번 모이면 징역형이었다. 둘째 법은 군과 경찰에 대한 거짓 정보를 퍼뜨린 사람을 처벌했고, 무엇이 거짓인지는 검찰이 정했다.\n\n외국 대리인 명단은 그해 겨울에 세 배로 늘었다. 이제는 외국 돈을 받지 않아도 외국의 영향 아래 있다고 법무부가 판단하면 명단에 올랐다. 광장에서 다친 사람을 치료한 의사 모임이 올랐고, 잡혀간 사람의 이름을 모으던 변호사들도 올랐다.\n\n신문사 두 곳은 광고가 끊겨 문을 닫았다. 기자들 가운데 여럿이 도쿄로 건너가 그곳에서 방송을 시작했다. 방송은 밤마다 서울의 전화기로 들어왔다. 집에 갇혀 있던 김부겸은 치료를 조건으로 다시 출국을 허락받았다.\n\n거리는 조용해졌다. 일인 시위는 허가가 필요 없었으므로 사람들은 한 사람씩 떨어져 서서 흰 종이를 들었다. 경찰은 흰 종이를 든 사람도 연행했고, 조서의 혐의 칸에는 미신고 집회라고 적었다. 빈손을 들고 서 있던 사람도 잡혀갔다."
 tfrkphn.7256.d:0 "외국에 머물던 야당 지도자가 귀국하겠다고 밝혔다. 그는 변호사 출신으로, 고위 관리들의 별장과 재산을 찾아내 영상으로 올리던 사람이었다. 검찰은 그가 나가 있는 동안 횡령 혐의로 영장을 받아 두었다.\n\n측근들은 돌아가면 잡힌다고 말렸다. 그는 밖에서 하는 말은 안에서 들리지 않는다고 답했다. 그가 탄 비행기에는 기자 서른 명이 함께 탔다. 인천 공항에는 지지자 이천 명이 나왔고, 경찰은 버스로 도착장을 막았다.\n\n비행기는 착륙 십 분 전에 김포로 방향을 바꿨다. 그는 입국 심사대에서 아내와 인사를 나눈 뒤 경찰에게 넘겨졌다. 재판은 이튿날 경찰서 안에 차린 임시 법정에서 열렸고 삼십 분이 걸렸다. 변호인은 재판이 열린다는 통지를 한 시간 전에 받았다.\n\n그는 징역 삼 년 반을 받았다. 이듬해 형량은 구 년이 됐고 그다음 해에는 십구 년이 됐다. 교도소는 그를 서울에서 가장 먼 곳으로 옮겼다. 그가 법정에서 한 마지막 진술은 방송에 나가지 않았다. 지지자들은 그 진술을 손으로 받아 적어 서로에게 돌렸다."
 tfrkphn.7257.d:0 "정부는 몇 해 전부터 경비 회사 한 곳에 험한 일을 맡겼다. 회사의 주인은 관공서에 급식을 대던 업자였고, 청년 애국단에 도시락을 실어 나르던 사람이었다. 그의 회사는 교도소에서 사람을 뽑아 무장시켰고, 정부는 그 회사가 무엇을 하는지 모른다고 말해 왔다.\n\n회사의 주인은 국방부 장관과 사이가 나빴다. 국방부가 그의 부대를 군 아래로 넣으려 하자 그는 부대를 이끌고 서울로 향했다.\n\n무장한 차량 행렬은 하루 만에 고속도로를 이백 킬로미터 올라왔다. 지방 도시 한 곳의 군 사령부가 총 한 발 없이 넘어갔다. 길가의 주민들은 그들에게 물과 빵을 건넸다. 대통령은 아침 방송에서 반란을 용서하지 않겠다고 말했다.\n\n행렬은 서울을 백 킬로미터 앞두고 멈췄다. 누가 무엇을 약속했는지는 발표되지 않았다. 부대는 왔던 길로 돌아갔고 회사의 주인은 외국으로 나갔다. 두 달 뒤 그가 탄 비행기가 떨어졌다. 이듬해 대통령 선거에서 대통령은 팔십칠 퍼센트를 얻었다. 개표 방송에 나온 숫자의 합은 이번에는 정확히 백이었다."
 tfrkphn.7258.d:0 "광장이 비워진 뒤 세 사람은 차례로 나라를 떠났다. 김부겸은 치료를 이유로 나갔고, 김무성은 의원직을 잃은 뒤에 나갔다. 김동연은 그보다 먼저 나가 있었다. 세 사람이 도쿄에서 한자리에 선 것은 그해 가을이었다.\n\n일본 국회는 세 사람을 본회의장에 불렀다. 태평양방위조약기구 회원국의 대사들이 방청석에 앉았다. 김부겸이 먼저 말했고 김동연이 숫자를 댔고 김무성이 마지막에 섰다.\n\n세 사람의 요구는 같았다. 한국 정부가 선거 결과를 공개하고 갇힌 사람들을 풀 때까지, 회원국들이 한국 정부를 조약의 동반자로 대하지 말아 달라는 것이었다. 연설은 한국에서 방송되지 않았다. 사람들은 막힌 주소를 돌아 전화기로 그것을 보았다.\n\n서울의 대답은 사흘 뒤에 나왔다. 대통령은 외국 의회가 한국의 내정에 끼어들었다며 태평양방위조약기구에서 탈퇴한다고 발표했다. 외교부는 세 사람의 여권을 무효로 했다. 연합 사령부에 나가 있던 한국군 장교들은 그 주에 짐을 쌌다. 그날 저녁 아홉 시 뉴스의 첫 소식은 수출 실적이었다."
 tfrkphn.7260.d:0 "대한민국 대통령실이 오늘 오전 성명을 내고 자유민주주의를 수호했다고 발표했습니다. 성명은 국회를 점거한 세력이 헌정 질서를 무너뜨리려 했고, 군이 법에 따라 질서를 회복했다고 밝혔습니다. 같은 시각 각국 방송은 검은 연기에 휩싸인 국회의사당의 돔을 생중계하고 있었습니다.\n\n국회의장과 야당 원내대표들의 행방은 확인되지 않고 있습니다. 사망자 수는 정부 발표와 병원 집계가 서로 다릅니다. 서울에 있는 외국 기자들은 인터넷이 여러 차례 끊겼다고 전했습니다. 한강 다리 세 곳은 아직 군이 막고 있습니다.\n\n태평양방위조약기구 사무국은 깊은 우려를 밝히고 한국과의 합동 훈련을 미뤘습니다. 도쿄 외환 시장에서 원화는 하루 만에 크게 떨어졌습니다. 베이징은 다른 나라의 내정이라며 논평을 삼갔습니다. 몇몇 나라는 자국민에게 한국 여행을 미루라고 권고했습니다.\n\n대통령실은 오후에 새 헌법을 국민투표에 부치겠다고 덧붙였습니다. 광화문에서는 대통령 지지자들이 태극기를 들고 승리를 외쳤습니다. 성명의 제목은 자유민주주의 수호였습니다."
 tfrkphn.7261.d:0 "대한민국에서 사흘 동안 이어진 대치가 끝났습니다. 대통령실은 오늘 새벽 국회를 해산하는 긴급명령을 거둬들였습니다. 여의도에 들어왔던 전차 부대들은 국회 앞에서 움직이지 않았고, 한 부대는 포탑을 국회 반대쪽으로 돌렸습니다. 총성은 한 번도 들리지 않았습니다.\n\n세계 여러 신문이 같은 사진을 1면에 실었습니다. 비에 젖은 국회의장이 전차 위에 서서 종이를 읽는 사진입니다. 그 아래에는 우비를 입은 시민들이 바리케이드 앞에 앉아 있습니다. 사진을 찍은 사람은 이름을 밝히지 않은 시민이었습니다.\n\n태평양방위조약기구 사무국은 한국 국민이 스스로 헌법을 지켜 냈다는 성명을 냈습니다. 여러 나라 의회가 같은 날 지지 결의안을 냈습니다. 원화 가치는 사흘 만에 대치 전 수준을 되찾았습니다. 서울 주재 외국 기자들은 시민들이 전차병에게 우비와 컵라면을 건네는 장면을 전했습니다.\n\n국회는 대통령 탄핵 심판 절차를 다시 밟기로 했습니다. 국회 앞 바리케이드는 오늘 오후 시민들 손으로 치워졌고, 화분은 제자리로 돌아갔습니다."
 tfrkphn.7263.d:0 "\"종로서 상황실, 여기는 순찰 3호. 세종대로 일본 공보문화원 앞이다. 학생으로 보이는 인원 서른 명가량이 정문을 넘어 들어갔다.\"\n\n\"무기 소지 여부 확인하라.\"\n\n\"확인했다. 무기 없다. 손에 든 건 현수막뿐이다. 이 층 창문에 걸고 있다. 외국 대리인 법 철폐, 태평양방위조약기구는 독재 정권과의 동맹을 끊어라. 그렇게 적혀 있다.\"\n\n\"문화원 쪽 반응은.\"\n\n\"직원들이 학생들에게 차를 내주고 있다. 문화원장이 경찰은 건물에 들어오지 말아 달라고 요청했다.\"\n\n\"본청 지시다. 진입하지 말고 포위만 하라. 기자들 접근 막아라.\"\n\n\"늦었다. 외신 기자들이 벌써 와 있다. 학생 하나가 창문으로 확성기를 내밀었다. 오늘부터 단식한다고 한다.\"\n\n\"광장 쪽은 어떤가.\"\n\n\"애국단 청년들이 버스 두 대로 왔다. 문화원 앞에서 태극기를 흔들며 학생들을 매국노라고 부르고 있다. 우리 쪽 지시는.\"\n\n\"두 무리 사이에 서라. 애국단은 건드리지 마라.\"\n\n\"사흘째 보고. 학생들 전원 자진 퇴거. 연행 서른한 명. 저항 없음.\"\n\n\"남긴 물건은.\"\n\n\"창문의 현수막. 그리고 바닥에 접어 둔 이부자리 서른한 채.\""
 tfrkphn.7264.d:0 "조원진은 군 지휘관 교체 명단에 서명한 밤 집무실에서 오래된 신문 한 부를 꺼냈다. 양안전쟁 때 대만 지원 예산이 국회에서 석 달 동안 묶였던 날의 신문이었다. 그때 그는 의석 하나 없는 원외 정당의 대표였다. 신문은 누렇게 바래 있었다.\n\n그는 그 석 달을 광화문 천막에서 보냈다. 해협에서 돌아오지 못한 병사들의 부모가 천막을 찾아왔다. 그들은 국회가 다투는 동안 아들들이 탄약을 아껴 쏘았다고 말했다. 전쟁에 진 뒤 국회는 그 전쟁을 이끈 대통령을 탄핵했다. 예산을 묶었던 의원들 가운데 책임을 진 사람은 없었다.\n\n대통령이 된 뒤에도 같은 일이 되풀이됐다. 국회는 그의 첫 예산을 절반 가까이 깎았고, 그가 낸 법안은 하나도 본회의에 오르지 못했다. 그를 뽑은 사람들은 왜 아무것도 바뀌지 않느냐고 물었다.\n\n그는 국회가 나라를 지키지 못했다고 믿었다. 그 믿음은 천막에서 만난 부모들의 얼굴로 이루어져 있었다. 책상 위에는 비서관이 놓고 간 긴급명령의 초안이 있었다. 그는 그날 밤 초안을 읽기만 하고 서명하지 않았다."
 tfrkphn.7265.d:0 "토요일마다 광화문 연단 앞 셋째 줄에는 같은 청년이 앉았다. 그는 스물여섯 살이었고, 해군 군복 상의를 입고 나왔다. 그는 대만 해협에서 탄약을 나르던 보급함의 갑판병이었다. 같은 침실을 쓰던 동기 넷은 돌아오지 못했다.\n\n배는 휴전 협상이 시작되기 사흘 전에 기뢰에 맞았다. 그는 갑판에서 바다로 뛰어내려 살았다. 국회 청문회에서 한 의원은 그 전쟁이 애초에 하지 말았어야 할 전쟁이라고 말했다. 그는 그 장면을 재활 병원 휴게실의 텔레비전으로 보았다.\n\n하지 말았어야 할 전쟁이라면 동기들은 헛되이 죽은 것이 된다. 그는 그 말을 받아들일 수 없었다. 광장의 사람들만이 그 전쟁을 끝까지 했어야 했다고 말했다. 그 말 속에서 동기들은 나라를 지키다 죽은 사람으로 남았다.\n\n기자가 다가와 대통령을 지지하는 이유를 물었다. 그는 지갑에서 전역증과 동기들의 사진을 꺼내 보였을 뿐 대답하지 않았다. 집회가 끝나면 그는 천막 옆에서 다른 전역병들과 컵라면을 먹었다. 대학 친구들은 그가 광장에 나가는 것을 알지 못했다."
 tfrkphn.7266.d:0 "국가정보원장이 김진태에게 보고서 한 장을 올렸다. 대만이 넘어간 뒤 홍콩의 회사 열네 곳을 거쳐 국내 단체들로 들어온 돈의 흐름을 정리한 표였다. 받은 단체 가운데에는 시민 단체와 인터넷 언론, 대학 연구소가 섞여 있었다. 대외비 도장이 찍혀 있었다.\n\n액수는 크지 않았다. 표에 오른 단체 이백여 곳 가운데 돈을 보낸 쪽이 중국 정부와 이어진다고 확인된 곳은 열한 곳이었다. 나머지는 확인되지 않았다. 보고서 맨 아래에는 대만의 선거 때 같은 방식의 송금이 있었다는 첨부 자료가 붙어 있었다.\n\n김진태는 검사로 이십 년을 일했다. 그는 증거가 다 모이기를 기다리다 놓친 사건들을 기억하고 있었다. 대만은 증거가 다 모였을 때 이미 없는 나라였다. 그는 법으로 먼저 문을 닫아야 한다고 생각했다.\n\n법무부 장관은 열한 곳만 처벌하는 법을 만들자고 했다. 대통령은 표에 오른 이백여 곳을 모두 등록하게 하라고 지시했다. 어느 곳이 열한 곳에 들지 가려낼 시간이 없다는 이유였다. 장관은 지시를 받아 적었고, 그날 밤 사표를 썼다가 찢었다."
 tfrkphn.7267.a:0 "명단을 내려보낸다."
 tfrkphn.7267.d:0 "늦은 밤 김진태 앞에 서류철 하나가 놓였다. 그 안에는 예술, 정치, 예능, 사회, 교육 등 여러 분야 사람들의 이름이 적혀 있었다. 정권에 위협이 되는 사람들의 명단이었다.\n\n그는 과거의 블랙리스트 사건을 떠올렸다. 거기 적힌 사람들은 표현의 자유를 내세워 이명박, 박근혜 정부를 비판했지만, 그가 보기에는 그저 정권을 비판하는 데만 앞서는 자들이었다. 명단을 없애겠다고 나선 문재인 정부도 똑같았다. 명단을 없애겠다면서 명단이라고 불리지 않는 명단을 만들었을 뿐이다.\n\n대통령님, 아무리 생각해도 이건...\n나도 안다네, 이게 얼마나 위험한지. 하지만 이건 국민을 위한 거야. 이 명단의 사람들은 국민을 어둠의 길로 이끌고 있어. 우리야말로 국민을 광명으로 이끌 수 있어.\n\n모두에게는 사명이 있다. 김진태의 사명은 국민을 광명으로 이끄는 것이다."
 tfrkphn.7268.d:0 "조원진 정부의 첫해가 끝나 갈 무렵 국회는 장관 열두 명에 대한 탄핵소추안을 차례로 통과시켰다. 소추된 장관은 헌법재판소의 결정이 나올 때까지 직무가 멈췄다. 국방부와 법무부, 기획재정부의 장관 자리가 한꺼번에 비었다.\n\n국회는 대통령령마다 효력을 멈춰 달라는 소송을 냈고, 정부가 낸 추가 예산을 세 번 연달아 부결했다. 대통령이 거부한 법안은 다시 의결해 돌려보냈다. 정부 쪽 안건이 본회의에 오를 때마다 야당은 무제한 토론으로 날을 넘겼다. 한 의원은 열여섯 시간 동안 연단을 지켰다.\n\n국회 쪽에도 까닭은 있었다. 대통령은 법 대신 명령으로 다스렸고, 청산 위원회는 의원들을 불러 조사했다. 의원들은 국회가 손을 놓으면 남는 것은 대통령의 명령뿐이라고 말했다. 그 말을 믿는 사람과 믿지 않는 사람이 반씩이었다.\n\n그 사이 공무원들은 어느 쪽의 지시를 따라야 할지 몰랐다. 지방 공항 공사는 예산이 묶여 멈췄고, 병사들의 봄 휴가 날짜는 두 번 바뀌었다. 광장의 연단에서는 국회를 해산하라는 구호가 처음으로 나왔다."
 tfrkphn.7269.d:0 "첫 포탄을 쏜 사람은 전차 부대의 스물아홉 살 중사였다. 그는 그날 새벽 무전으로 사격 명령을 받았다. 중대장은 국회 안에 무기를 든 반국가 세력이 있다고 말했고, 그는 그 말을 의심하지 않았다. 지난 석 달 동안 부대 안의 텔레비전은 같은 말을 했다.\n\n그의 아버지는 토요일마다 광화문에 나갔다. 형은 대만 해협에서 돌아오지 못했다. 그는 국회가 형의 탄약을 묶었다는 말을 집에서 수없이 들었다. 조준경 속의 돔은 그에게 형을 버린 건물이었다.\n\n포탄이 떨어지고 한 시간 뒤 본회의장에서 사람들이 손을 들고 걸어 나왔다. 무기를 든 사람은 없었다. 보좌진과 국회 직원, 촛불을 들고 있던 대학생 몇이 있었다. 포탄에 무너진 계단 옆에는 신발 한 짝이 놓여 있었다. 그는 조준경에서 눈을 떼지 못했다.\n\n한 달 뒤 그는 훈장을 받았다. 수여식은 방송으로 나갔고 아버지는 그 장면을 녹화해 두었다. 그는 그 뒤로 밤에 잠을 자지 못했다. 군의관은 그의 기록에 불면이라고만 적었다. 그는 다음 해 봄에 전역 신청서를 냈다."
 tfrkphn.7270.d:0 "스물다섯 살의 청년은 다섯 해 동안 신림동의 반지하 방에서 살았다. 비가 많이 오는 날이면 창문 높이까지 물이 찼고, 그는 그때마다 노트북을 들고 피시방으로 갔다. 전역한 뒤 그는 택배 상하차와 편의점 야간 일을 함께 했다. 월세는 그 둘 가운데 하나의 월급을 통째로 가져갔다.\n\n공공 임대 주택 추첨 결과는 문자로 왔다. 그는 처음에 스팸인 줄 알고 지울 뻔했다. 방은 열네 평이었고 창문이 땅 위에 있었다. 이삿짐은 친구의 승용차 한 대에 다 실렸다. 친구는 이삿날 짜장면을 샀다.\n\n신문들은 그 주택이 노인 일자리 예산을 깎아 지은 것이라고 썼다. 그는 그 기사를 읽고 시골의 할머니에게 전화를 걸었다. 할머니는 손자가 볕 드는 방에 산다는 말에 오래 웃었다. 할머니는 경로당 난방비 이야기는 꺼내지 않았다.\n\n그는 편의점 야간 일을 그만두었다. 토요일이면 같은 단지의 청년들과 지하철을 타고 광화문에 갔다. 그는 연단의 연설을 다 믿지는 않았지만 박수는 쳤다. 그날 밤 그는 처음으로 창문 밖이 환한 방에서 잠이 들었다."
 tfrkphn.7271.d:0 "새 헌법이 통과된 날 밤 조원진은 경호원 둘만 데리고 여의도에 갔다. 국회의사당의 돔에는 비계가 둘러져 있었다. 포탄이 뚫은 자리는 방수포로 덮여 있었고, 바람이 불 때마다 방수포가 소리를 냈다. 계단에는 깨진 대리석이 쌓여 있었다.\n\n그는 계단에 서서 오래 돔을 올려다보았다. 그는 이 건물이 석 달 동안 나라를 멈춰 세웠다고 믿었다. 장관 자리는 비어 있었고 예산은 묶여 있었으며, 그를 뽑은 사람들은 아무것도 바뀌지 않는다고 했다. 누군가는 그 매듭을 끊어야 했다.\n\n돌아오는 차에서 그는 경호실장에게 그날의 사망자 수를 물었다. 정부가 발표한 숫자는 열한 명이었다. 경호실장은 잠시 머뭇거리다 병원에서 집계한 숫자는 그보다 많다고 답했다. 대통령은 그 숫자를 더 묻지 않았다.\n\n이튿날 그는 돔의 그을음을 닦지 말고 그대로 두라고 지시했다. 국회가 나라를 멈춘 대가를 사람들이 보아야 한다는 이유였다. 비서실장은 그 지시를 받아 적었다. 그을음은 그 뒤로 여러 해 동안 남았다. 관광버스들은 국회 앞을 지날 때 속도를 늦췄다."
 tfrkphn.7272.d:0 "권한대행이 된 첫 주 김진태는 총리실 서랍을 정리하다 낡은 수사 기록 한 권을 찾았다. 검사 시절 그가 끝내 기소하지 못한 사건이었다. 증인이 진술을 바꿨고 그는 그 사건을 놓쳤다. 피의자는 그 뒤 국회의원이 되었고, 그는 그 이름을 신문에서 여러 번 보았다.\n\n그는 그 일 뒤로 법은 먼저 손에 쥔 쪽의 것이라고 믿게 됐다. 조원진이 물러나자 여당 안에서는 벌써 다음 자리를 두고 다툼이 시작됐다. 청산 위원회에 불려 갔던 사람들은 보복을 말했다. 공단의 청년들은 일자리가 다시 사라질까 걱정했다. 애국단의 청년들은 다음 명령을 기다렸다.\n\n그는 누군가 질서를 쥐지 않으면 이 모든 것이 한꺼번에 무너진다고 보았다. 그 질서를 쥐는 방법을 그는 하나밖에 알지 못했다. 수사 기관과 법원, 그리고 그 둘 사이를 오가는 서류였다.\n\n그는 수사 기록을 다시 서랍에 넣었다. 첫 국무회의의 안건은 치안이었다. 그는 회의를 시작하며 장관들에게 앞으로의 모든 일은 법대로 하겠다고 말했다. 법을 누가 고칠지는 말하지 않았다."
 tfrkphn.7273.d:0 "국가정보원은 외국 대리인 법이 시행된 지 두 달 만에 일곱 명을 체포했다. 무역 회사 직원과 대학 강사, 해군 기지 근처에서 식당을 하던 부부가 있었다. 그들은 기지를 드나드는 배의 이름과 시각을 적어 홍콩의 회사로 보냈다.\n\n수사 기록은 법정에서 공개됐다. 암호를 적은 수첩과 외장 하드, 다섯 해 동안 받은 돈의 영수증이 증거로 나왔다. 그 돈의 출발점은 김진태가 받았던 보고서 속 열한 곳 가운데 하나였다. 체포된 강사의 연구실에서는 같은 암호표가 두 벌 더 나왔다. 한 벌은 다른 사람의 필체였다.\n\n야당은 처음에 조작을 의심했다. 재판이 석 달째에 이르자 야당 의원 몇은 증거가 진짜라는 것을 인정했다. 한 의원은 법의 범위는 여전히 넓다고 말하면서도, 간첩이 있었다는 것만은 부정할 수 없다고 했다.\n\n여론 조사에서 외국 대리인 법을 지지한다는 응답이 처음으로 절반을 넘었다. 식당 부부의 가게 자리에는 그해 가을 편의점이 들어섰다. 기지의 해병들은 그 편의점에서 컵라면을 샀다. 남은 한 벌의 주인은 끝내 잡히지 않았다."
 tfrkphn.7274.d:0 "패전 뒤 네 해 동안 대구의 한 주부는 가계부에 빨간 줄을 그었다. 쌀값과 기름값이 오를 때마다였다. 그해 가을 그녀는 석 달 만에 처음으로 빨간 줄을 긋지 않았다. 물가 상승률은 한 해 전의 절반으로 내려와 있었다. 그녀는 가계부를 덮고 빨간 볼펜을 서랍에 넣었다.\n\n남편이 다니던 자동차 부품 공장은 전쟁 뒤에 주문이 끊겨 주 사흘만 돌았다. 정부가 수출 목표를 공장 벽에 걸게 한 다음 해부터 주문이 돌아왔다. 남편은 다시 주 닷새를 일했고 잔업 수당이 붙었다. 그는 퇴근길에 통닭을 사 오기 시작했다.\n\n그녀는 정치에 관심이 없었다. 텔레비전에서 대통령이 나오면 채널을 돌렸다. 신문이 언론 탄압을 말하는 날에도 그녀는 장바구니의 무게를 먼저 보았다. 무게는 조금씩 늘고 있었다. 정육점에서 소고기를 산 것은 네 해 만이었다.\n\n딸은 대통령이 나라를 망친다고 말했다. 그녀는 딸과 다투지 않았다. 그녀는 딸의 등록금 고지서를 냉장고에 붙이고, 남편의 월급날 그 위에 납부 도장을 찍었다. 그해에는 할부 없이 한 번에 냈다."
 tfrkphn.7275.d:0 "스물일곱 살의 청년은 세 해 동안 원서를 백 장 넘게 냈다. 패전 뒤 청년 실업률은 열여덟 퍼센트까지 올랐고, 그의 대학 동기 절반이 같은 처지였다. 그해 봄 그는 창원의 방산 부품 회사에 합격했다. 합격 문자를 받은 날 그는 고시원 방을 정리했다.\n\n그 회사는 정부의 수출 계획에 따라 공장을 두 배로 늘린 곳이었다. 그해 청년 실업률은 아홉 퍼센트로 내려왔다. 신문은 그 숫자를 일 면에 실었고, 야당은 새 일자리의 절반이 비정규직이라고 반박했다. 두 말이 모두 맞았다.\n\n그는 대학에서 진보 동아리에 있었다. 그때 그는 이 정부가 나라를 망칠 것이라고 믿었다. 첫 월급을 받은 날 그는 그 믿음이 흔들리는 것을 느꼈다. 동기들 가운데 여럿이 같은 이야기를 했다. 동아리 단체 대화방은 그해 여름 조용해졌다.\n\n그해 여론 조사에서 이십 대의 여당 지지율은 처음으로 사십 퍼센트를 넘었다. 그는 그 조사에 응답하지 않았다. 출근 버스에서 그는 이어폰을 꽂고 창밖의 공단을 보았다. 굴뚝 세 개 가운데 두 개에서 연기가 나고 있었다."
 tfrkphn.7276.d:0 "도쿄의 연설이 있은 뒤에도 서울의 아침은 달라지지 않았습니다. 출근 버스는 제시간에 왔고, 월급은 날짜에 맞춰 들어왔습니다. 고시원에서 원서를 쓰던 청년들은 공단의 기숙사로 옮겨 갔습니다. 물가는 더 오르지 않았습니다.\n\n광장은 비어 있었습니다. 집회에는 허가가 필요했고, 허가는 나오지 않았습니다. 신문은 두 곳이 줄었고, 남은 신문들은 수출 실적을 일 면에 실었습니다. 도쿄에서 들어오는 방송을 찾아 듣는 사람은 해마다 줄었습니다.\n\n사람들은 알고 있었습니다. 먼 교도소에 있는 야당 지도자의 이름도, 지워진 개표 화면의 숫자도 모두가 기억했습니다. 그러나 그들은 패전과 멈춘 국회와 밀린 월급의 시절도 기억했습니다. 그 시절에 나라는 지는 나라였고, 지금은 다시 이기는 나라처럼 보였습니다. 그들은 그때로 돌아가기를 바라지 않았습니다.\n\n다음 선거의 투표율은 낮았고, 결과는 아무도 놀라게 하지 않았습니다. 국회의사당 돔의 그을음 위로 담쟁이가 자랐습니다."
 tfrkphn.7277.a:0 "호헌철폐! 독재타도!"
 tfrkphn.7277.d:0 "시위 첫날 저녁 경찰이 쏜 최루탄에 대학생 한 명이 숨졌다. 학생은 가방을 멘 채 시청 앞 지하도 입구에 쓰러져 있었다. 그 사진은 밤사이 전화기에서 전화기로 건너갔고, 이튿날 아침 광장의 사람은 두 배로 늘었다. 학생의 어머니는 영안실 앞에서 하루를 앉아 있었다.\n\n며칠 뒤 시위는 더 크게 번졌다. 전국 곳곳에서 호헌철폐, 독재타도, 민주쟁취가 울려 퍼졌다. 내무부 장관은 반대 세력이 퍼뜨린 거짓이라고 발표했고, 학생은 탁 치니 억 하고 죽은 것이라고 했다.\n\n얼마 뒤 언론은 학생이 경찰이 쏜 최루탄에 머리를 직격으로 맞아 숨졌다고 보도했다. 거리 곳곳은 최루탄이 바닥나 달아나는 경찰들로 가득했다. 어느 도시에서는 경찰이 시민들 편에 섰다는 소식도 있었다.\n\n청와대에서는 지금이라도 계엄령을 선포해 군을 투입하자는 목소리가 나오기 시작했다. 이제 남은 건 김진태의 선택이었다. 군을 투입하면 진압할 수 있겠는가. 검사 시절 남들이 감당하지 못한 사건을 많이 맡아 왔지만 이런 일은 처음이었다.\n\n계엄을 선포하면 당장은 살아도, 그때는 우리 목도 날아갈 것이네. 대통령은 그렇게 말하며 계엄령 선포를 거부했다.\n\n비서실장이 말했다.\n지금 당장 긴급 담화를 여십시오."
 tfrkphn.7278.d:0 "엿새째 되는 날 오후 대학교수 이백오십여 명이 종로에 모였다. 그들은 학생들의 피에 보답하라고 적은 현수막을 들었다. 대부분 머리가 희었고, 몇은 지팡이를 짚었다. 맨 앞의 노교수는 일흔을 넘겼다. 그들이 걷기 시작하자 길가의 학생들이 길을 터 주었다. 누군가 행렬 맨 앞의 노교수에게 우산을 씌웠다.\n\n교수들 가운데에는 정부의 자문 위원을 지낸 사람도 있었다. 한 경제학자는 수출 목표를 세우는 회의에 세 해 동안 나갔다. 그는 기자에게 그 숫자들은 지금도 옳다고 말했다. 그러나 숫자를 지키려고 학생을 죽게 하는 정부는 따를 수 없다고 덧붙였다.\n\n경찰은 행렬을 막지 않았다. 기동대장은 무전으로 지시를 물었고, 본청은 한 시간 동안 답하지 않았다. 행렬은 시청 앞에 닿았고, 그곳에 있던 수만 명이 교수들을 둘러쌌다.\n\n그날 밤 방송은 처음으로 시위 현장을 생중계했다. 국영 방송의 보도국장은 사표를 낸 뒤였다. 화면에는 흰머리의 교수들 뒤로 끝없이 늘어선 사람들이 보였다. 그 사람들 가운데에는 넥타이를 맨 회사원도 있었다."
 tfrkphn.7279.d:0 "행진이 있은 날 밤 여당 의원 한 사람이 당사에 탈당계를 냈다. 그는 조원진이 원외 정당을 이끌던 시절부터 함께한 사람이었다. 그는 천막에서 잤고, 광장에서 연단에 올랐으며, 새 헌법의 조문을 직접 썼다. 그는 탈당계를 쓰기 전에 그 헌법을 한 번 더 읽었다고 했다.\n\n그는 기자들 앞에서 길게 말하지 않았다. 자신은 패전의 책임을 묻겠다고 정치를 했고, 그 일은 아직 옳다고 믿는다고 했다. 그러나 개표 화면의 140은 자기가 만든 헌법으로도 설명할 수 없다고 했다.\n\n새벽까지 여당 의원 절반이 같은 서류를 냈다. 몇은 울었고, 몇은 당사 앞에서 지지자들에게 욕을 들었다. 애국단 출신의 한 청년 당원은 탈당계를 내고 나오는 의원의 소매를 붙잡고 놓지 않았다. 의원은 청년의 손을 한참 잡고 있다가 천천히 떼어 냈다.\n\n대통령은 탈당한 의원들의 명단을 받았다. 그는 명단에서 함께 검사 생활을 했던 후배의 이름을 찾았다. 그는 전화를 걸지 않았다. 그날 아침 대통령실 대변인은 정례 브리핑을 취소했다."
 tfrkphn.7280.d:0 "청년 애국단 본부에는 밤새 전화가 울렸다. 지역 지부장들은 광장으로 나가 시위대와 맞서겠다고 했다. 버스 서른 대가 대기하고 있었고, 몽둥이와 헬멧은 창고에 쌓여 있었다. 지시만 내려오면 되었다. 지부장들 가운데 몇은 이미 버스에 올라 있었다.\n\n단장은 스물아홉 살이었다. 그는 대학을 그만두고 애국단에 들어왔고, 그곳에서 처음으로 자기 이름이 불리는 일을 맡았다. 그는 대통령실에 지시를 물었다. 대통령실의 답은 한 줄이었다. 아무도 내보내지 말라는 것이었다. \n\n단장은 지부장들을 모아 그 한 줄을 읽었다. 몇은 배신이라고 소리쳤고, 몇은 헬멧을 벗어 던졌다. 해군 군복 상의를 입은 청년 하나는 창고 문을 잠그고 열쇠를 단장에게 건넸다. 그는 그 길로 집에 갔다.\n\n그날 애국단은 광장에 나가지 않았다. 버스 기사들은 오후가 되자 시동을 껐다. 단장은 본부 간판 아래에서 담배를 피우며 광장 생중계를 휴대전화로 봤다."
 tfrkphn.7281.d:0 "이튿날 아침 국회가 본회의를 열었다. 남은 여당 의원들과 야당 의원들이 오랜만에 같은 시간에 자리에 앉았다. 안건은 하나였다. 대통령의 사임을 권고하는 결의안이었다. 방청석은 기자와 시민으로 가득 찼다.\n\n국회의장은 토론 신청이 없다고 알렸다. 무제한 토론을 하던 의원들도, 그 토론을 막던 의원들도 손을 들지 않았다. 표결은 사십 초 만에 끝났다. 반대표는 일곱이었다. 의장이 가결을 선포하자 방청석에서 누군가 짧게 박수를 쳤다가 멈췄다.\n\n반대표를 던진 의원 가운데 한 사람은 기자들에게 끝까지 대통령 곁에 남겠다고 말했다. 그는 패전 때 아들을 잃었다. 그는 그 전쟁을 끝까지 했어야 했다고 지금도 믿는다고 했다. 기자들은 그의 말을 받아 적었고, 아무도 웃지 않았다.\n\n결의안은 법적 효력이 없었다. 그래도 그날 저녁 모든 방송이 사십 초라는 숫자를 첫 화면에 걸었다."
 tfrkphn.7282.a:0 "김진태는 당장 퇴진하라!"
 tfrkphn.7282.d:0 "새벽의 서울은 그 어느 때보다 혼란스러웠다. 며칠 전 시위에서 대학생 한 명이 숨진 뒤로 경찰도 적극적으로 막지 않기 시작했다.\n\n광화문은 그중에서도 더했다. 박근혜를 탄핵시켰던 이 광장에서 시민들은 이제 김진태 탄핵을 외쳤다. 잠시 후 전광판에 속보가 떴다. 긴급, 김진태 대통령 사임 발표.\n\n한쪽은 2017년 3월의 그날처럼 환호했고, 한쪽은 그날 태극기를 든 사람들처럼 분노했다.\n\n누군가 애국가를 부르기 시작했다. 태극기를 든 청년들과 140이라고 적은 종이를 든 청년들이 같은 노래를 불렀다. 둘은 같은 대학을 다니는 사람들이기도 했다. 몇 주 동안 광장을 둘로 나누었던 경찰 버스는 그 자리에 그대로 서 있었다. 버스 위에 올라간 학생 하나가 운전석의 경찰에게 손을 흔들었다. 경찰도 손을 들었다."
 tfrkphn.7282.t:0 "광화문의 새벽"
 tfrkphn.7283.d:0 "취임 뒤 첫 토요일 집회에서 조원진은 연단에 올라 광장을 내려다보았다. 그는 이 광장에서 몇 해 동안 천막을 지켰다. 그때 태극기를 든 사람들은 대개 그의 부모뻘이었다. 그날 연단 앞 첫 줄에는 스무 살 남짓한 청년들이 앉아 있었다.\n\n변화는 탄핵 뒤에 시작됐다. 전쟁에서 돌아온 전역병들과 군 복무를 앞둔 대학생들이 먼저 왔다. 그들은 전쟁을 이끈 대통령을 끌어내린 국회를 보며 정치에 처음 화를 냈다. 인터넷 방송에서 광장의 연설을 퍼 나른 것도 그들이었다.\n\n당원 명부를 정리하던 사무처 직원은 새로 들어온 당원 셋 가운데 둘이 서른 살 아래라고 보고했다. 조원진은 그 보고서를 두 번 읽었다. 그는 노인들의 당이라는 말을 오랫동안 들어 왔다.\n\n연설이 끝나자 청년 하나가 연단 아래로 다가와 휴대전화를 내밀었다. 함께 사진을 찍자는 것이었다. 조원진은 잠시 머뭇거리다 화면을 보며 웃었다. 그는 그날 밤 참모들에게 청년들이 무엇을 바라는지 알아 오라고 했다. 참모들 가운데 서른 살 아래는 한 명도 없었다."
 tfrkphn.7284.d:0 "한 해의 마지막 날 정오, 방송사들은 예고 없이 대통령 담화를 내보냈다. 조원진은 임기를 일 년 남기고 물러난다고 말했고, 건국 대통령이 물러나며 남긴 말로 담화를 맺었다. 담화는 십 분 만에 끝났다.\n\n헌법에 따라 김문수 총리가 그 시각부터 대통령 권한대행이 됐다. 그는 젊은 날 노동 운동을 하다 감옥에 갔고, 그 뒤 보수 정당으로 옮겨 경기도지사를 두 번 지냈다. 운동권 시절의 동료들은 그를 배신자라고 불렀고, 그는 그 말에 한 번도 대꾸하지 않았다.\n\n그는 권한대행으로서 첫 문서에 서명한 뒤 청와대를 나섰다. 자정에 그가 간 곳은 구로의 한 공장이었다. 그는 스무 살 무렵 이런 공장에서 학력을 숨기고 일했다. 야간조 노동자들은 처음에 그를 알아보지 못했다. 그는 그 시절 노조를 만들다 해고된 적이 있었다.\n\n그는 공장 식당에서 노동자들과 떡국을 먹었다. 방송은 그 장면을 새해 첫 뉴스로 내보냈다. 한 노동자가 옛날 공장의 임금이 얼마였느냐고 물었고, 그는 그 숫자를 정확히 기억해 말했다. 식당에는 웃음이 터졌다."
 tfrkphn.7285.d:0 "김문수는 조기 대선과 총선을 같은 날 치르자고 국회에 제안했다. 국회는 반대할 명분을 찾지 못했다. 선거 운동 기간에 그는 하루에 시장 다섯 곳을 돌았다. 그는 연설 대신 상인들과 국밥을 먹었고, 그 사진이 날마다 인터넷에 올라왔다.\n\n야당은 일곱 갈래로 갈라져 있었다. 포격과 탄핵을 두고 서로를 탓하느라 후보를 하나로 모으지 못했다. 공장 지대와 대학가에서 여당 표가 쏟아졌다. 노동 운동가 출신이라는 이력은 노동자들에게, 반공의 언어는 청년 전역병들에게 함께 먹혔다. 금속 노조 위원장 몇이 지지를 선언했다.\n\n그는 대선에서 58퍼센트를 얻었다. 여당은 국회의 3분의 2를 넘는 의석을 가져갔다. 외국 선거 감시단은 투표와 개표에서 부정을 찾지 못했다고 발표했다. 그러면서도 방송 시간과 선거 비용이 한쪽으로 크게 기울었다는 한 줄을 보고서 끝에 붙였다.\n\n당선 소감에서 그는 이번 선거를 투표함 안의 혁명이라고 불렀다. 그는 국민이 낡은 체제를 끝내라고 명령했다고 말했다. 그날 밤 여당 당사 앞에는 청년들이 모여 그의 이름을 불렀다."
 tfrkphn.7286.d:0 "새 국회는 첫 해에 헌법을 처음부터 다시 썼다. 3분의 2 의석이 있었으므로 야당의 동의는 필요하지 않았다. 새 헌법의 이름은 기본법이었고, 전문에는 가정과 신앙과 민족이 나라의 바탕이라고 적혔다.\n\n판사의 정년은 일흔에서 예순둘로 내려갔다. 그 조항 하나로 대법관과 법원장 사백여 명이 한 해 안에 물러났다. 헌법재판관의 수는 아홉에서 열다섯으로 늘었고, 새로 생긴 자리는 국회가 채웠다.\n\n선거법도 바뀌었다. 선거구는 다시 그려졌고, 이긴 쪽에 의석을 더 얹어 주는 조항이 생겼다. 외국에 사는 동포들에게는 우편 투표가 허락됐다. 동포 단체들은 정부가 보낸 기념품을 받고 감사 편지를 보냈다.\n\n야당은 헌법재판소에 소송을 냈다. 소송은 새로 임명된 재판관들에게 배당됐다. 김문수는 기자들에게 국민이 준 3분의 2를 쓰지 않는 것이야말로 국민을 배신하는 일이라고 말했다. 그는 새 헌법이 공포되는 날 서명에 쓴 펜을 국회 기념관에 보냈다. 야당 대표는 판결을 기다리지 않고 거리로 나갔다."
 tfrkphn.7287.d:0 "정부는 신문사를 닫지 않았다. 대신 광고를 옮겼다. 공기업과 정부 부처의 광고는 정부에 우호적인 신문으로만 갔다. 정부를 비판하던 신문 두 곳은 광고가 끊긴 지 여덟 달 만에 매물로 나왔다.\n\n신문사를 사들인 사람들은 대통령과 오래 알고 지낸 건설 회사와 가스 회사의 주인들이었다. 그들은 지역 방송과 인터넷 언론도 사들였다. 두 해가 지나자 나라 안 언론사의 절반이 그들의 손에 들어갔다. 공단 지역 방송과 노동 조합 신문 몇 곳도 그 가운데 있었다.\n\n셋째 해 가을에 주인들은 가진 언론사 사백여 곳을 한꺼번에 한 재단에 기부했다. 정부는 이 기부를 국가 전략 사안으로 정해 공정거래 심사에서 뺐다. 재단의 이사장은 대통령의 오랜 선거 참모였다.\n\n비판 기사는 여전히 나왔다. 독자가 낸 돈으로 꾸리는 작은 인터넷 매체 몇 곳이 남았다. 그들의 기사는 대도시 청년들 사이에서 돌았지만, 지방의 텔레비전에는 나오지 않았다. 김문수는 이 나라에 언론의 자유가 있다고 말했다. 그 말을 반박하는 기사도 인터넷에는 실렸다."
 tfrkphn.7288.d:0 "출산율이 0.6까지 떨어진 해에 정부는 가정 지원법을 냈다. 아이를 넷 낳은 어머니는 평생 소득세를 내지 않는다. 결혼한 부부에게는 무이자 대출을 주고, 셋째 아이가 태어나면 남은 빚을 모두 없애 준다. 다둥이 가정에는 승합차 값을 보탰다. 공장 노동자 부부가 가장 많이 신청했다.\n\n학교의 일부는 교회와 성당, 절이 맡게 됐다. 정부는 종교 재단이 운영하는 학교에 운영비를 더 얹어 주었고, 그런 학교는 다섯 해 만에 두 배로 늘었다. 김문수는 주말마다 다른 교회에서 예배를 드렸다.\n\n법은 학교에서 가르칠 수 있는 가족의 모양도 정했다. 교과서에서 몇 쪽이 빠졌고, 몇몇 교사는 수업 자료 때문에 징계를 받았다. 인권 단체들은 그 조항을 성소수자를 지우는 법이라고 불렀다.\n\n젊은 부부들의 계산은 달랐다. 대출을 받은 부부들은 신혼집을 구했고, 셋째를 낳은 집은 빚을 갚지 않아도 됐다. 이듬해 출생아 수가 이십여 년 만에 처음으로 늘었다. 통계청의 발표가 나온 날 김문수는 한 산부인과를 찾아 신생아실 유리창 앞에 오래 서 있었다."
 tfrkphn.7289.d:0 "김문수는 도지사 시절부터 길을 놓는 일을 좋아했다. 대통령이 된 뒤 그는 서해의 만을 건너는 다리와 가덕도의 새 공항, 수도권 땅속의 급행 철도를 한꺼번에 착공했다. 공사는 대개 언론사를 사들인 그 회사들이 맡았다.\n\n공사에는 돈이 들었고, 정부는 돈을 빌리기 쉽게 하려고 금리를 낮추라고 한국은행에 요구했다. 총재는 물가가 오른다며 거절했다. 대통령은 그를 해임했다. 다음 총재도 같은 말을 했고 같은 길을 갔다. 세 번째 총재는 금리를 낮췄다.\n\n그해 원화 가치는 절반으로 떨어졌다. 수입 물가가 먼저 올랐고, 그다음에 모든 것이 올랐다. 마트의 가격표는 일주일에 두 번 바뀌었다. 김문수는 높은 금리가 서민을 죽이는 고리대금이라고 말했고, 물가는 외국 투기 세력의 공격 탓이라고 했다.\n\n서해의 다리는 예정보다 일 년 일찍 개통했다. 개통식 날 대통령은 첫 차를 직접 몰고 다리를 건넜다. 다리 위에서 그는 차를 세우고 바다를 내려다보았다. 그날 저녁 뉴스의 두 번째 소식은 라면값이 다시 오른다는 것이었다."
 tfrkphn.7290.d:0 "여름밤 열한 시, 한강 다리 두 곳에 전차가 올라섰다. 국영 방송에는 군복을 입은 장교가 나와 군이 헌정 질서를 회복하기 위해 나라를 장악했다는 성명을 읽었다. 대통령은 그때 남해안의 휴양지에 있었다.\n\n자정 무렵 한 민영 방송의 앵커가 생방송 중에 자기 전화기를 카메라 앞에 들었다. 화면 속 작은 화면에 대통령의 얼굴이 보였다. 김문수는 영상 통화로 국민에게 거리로 나와 달라고 말했다. 통화는 일 분이 조금 넘었다. 앵커의 손은 떨리고 있었다.\n\n사람들이 거리로 나왔다. 교회들은 밤중에 종을 울렸고, 택시 기사들은 경적을 울리며 다리로 달려갔다. 공단의 노동자들은 야간조 작업복을 입은 채 버스를 타고 다리로 갔다. 시민들이 전차 앞에 누웠고, 몇몇 병사는 전차에서 내려 시민들에게 끌려 나왔다. 그날 밤 이백여 명이 죽었다.\n\n새벽 네 시, 대통령이 탄 비행기가 김포에 내렸다. 쿠데타는 아침이 오기 전에 무너졌다. 대통령은 공항에서 이 일이 하늘이 내린 선물이라고 말했다. 그 말이 무엇을 뜻하는지는 그다음 주에 드러났다."
 tfrkphn.7291.d:0 "쿠데타가 실패한 다음 주에 정부는 비상사태를 선포했다. 석 달 동안 장교와 판사, 교사, 공무원 육만여 명이 직장에서 쫓겨났다. 정부는 그들이 쿠데타를 꾸민 군 안의 비밀 모임과 이어져 있다고 발표했다. 명단 가운데에는 쿠데타가 일어나기 전에 이미 작성된 것도 있었다.\n\n비상사태가 이어지는 동안 정부는 개헌안을 국민투표에 부쳤다. 총리직을 없애고, 대통령이 장관과 판사를 직접 임명하고, 명령으로 법을 대신할 수 있게 하는 개헌이었다. 대통령은 그날 밤 같은 위험을 막으려면 한 사람이 책임을 져야 한다고 말했다.\n\n투표 날 저녁 개표는 밤늦게까지 엎치락뒤치락했다. 대도시에서는 반대가 많았고 지방과 공단에서는 찬성이 많았다. 개표 도중 선거관리위원회는 도장이 찍히지 않은 투표용지도 유효로 세겠다고 발표했다.\n\n개헌안은 51.4퍼센트로 통과됐다. 야당은 무효표 문제로 소송을 냈고 소송은 기각됐다. 김문수는 그날 밤 쿠데타 때 시민들이 누웠던 다리 위에서 지지자들에게 손을 흔들었다. 다리의 이름은 그 주에 시민의 다리로 바뀌었다."
 tfrkphn.7292.d:0 "기본법 아래에서 치른 네 번째 총선이었다. 야당들은 처음으로 후보를 하나로 모았다. 왼쪽 끝의 정당부터 탄핵 때 갈라져 나온 보수 정당까지 여섯 당이 한 명단에 이름을 올렸다. 그 명단에는 노동 운동 시절 김문수의 동료도 있었다.\n\n정부는 선거 석 달 전에 청년 정착금을 한 번 더 올렸고, 공공 주택 추첨을 앞당겼다. 지방의 텔레비전은 날마다 다리와 공항의 개통 소식을 내보냈다. 야당 후보의 유세는 인터넷 매체에만 나왔다.\n\n여당은 다시 3분의 2를 얻었다. 득표율은 오십 퍼센트가 조금 넘었지만, 다시 그린 선거구와 이긴 쪽에 얹어 주는 의석이 나머지를 채웠다. 공단 지역에서는 여당이 칠십 퍼센트를 넘게 가져갔다. 외국 감시단의 보고서에는 자유로웠지만 공정하지 않았다는 문장이 들어갔다.\n\n김문수는 승리 연설에서 이 나라가 자유주의 밖에서도 민주주의를 할 수 있다는 것을 보여 주었다고 말했다. 대도시 청년들은 그날 밤 인터넷에 검은 화면을 올렸다. 지방의 청년들은 당사 앞에서 그의 이름을 불렀다."
 tfrkphn.7293.d:0 "태평양방위조약기구 사무국은 한국에 보낼 공동 개발 기금의 절반을 묶었다. 사무국은 법원의 독립과 언론의 다양성이 회복될 때까지 기금을 풀지 않겠다고 밝혔다. 기금은 다리와 공항 공사의 큰 몫을 대던 돈이었다.\n\n정부는 다음 달 전국에 광고판을 세웠다. 광고판에는 도쿄의 관료들이 한국의 아이들에게 무엇을 가르칠지 정하려 한다고 적혔다. 국민 설문지가 집집마다 우편으로 갔다. 설문의 질문은 다섯 개였고, 모두 예라고 답하기 쉬운 문장이었다. 설문지는 공장 휴게실에도 붙었다.\n\n김문수는 조약에서 나가지 않았다. 그는 회의에 빠짐없이 나갔고, 회원국들이 만장일치로 정해야 하는 안건마다 마지막까지 서명을 미뤘다. 사무국은 그때마다 한국과 따로 협상해야 했다.\n\n묶였던 기금의 일부는 이듬해 풀렸다. 정부는 그 소식을 승리라고 발표했다. 도쿄의 신문은 한국이 동맹 안의 골칫거리가 됐다고 썼고, 서울의 지방 방송은 그 기사를 인용하며 대통령이 나라의 주권을 지켰다고 전했다. 공단 지역의 노조 신문도 같은 기사를 실었다."
 tfrkphn.7294.d:0 "새 학기 첫날 정부는 서울의 한 국립대학에 새 총장을 임명했다. 그 학교는 오랫동안 교수들이 총장을 뽑아 왔다. 새 총장은 여당 비례대표 후보 명단에 이름이 올랐던 경영학자였다. 그는 취임사에서 학교가 공단과 손잡아야 한다고 말했다.\n\n취임식 날 학생 이천여 명이 본관 앞에 모였다. 그들은 소리를 지르지 않았다. 새 총장이 본관으로 들어오자 학생들은 일제히 돌아서서 등을 보였다. 교수들도 몇이 학생들 옆에 서서 등을 돌렸다.\n\n학생들은 그 뒤로 날마다 정오에 본관 앞에서 등을 돌리고 섰다. 경찰은 미신고 집회라며 몇 명을 연행했고, 정부는 그 학교에 새 학과 두 곳을 만들어 총장이 직접 교수를 뽑게 했다. 교수 몇이 사표를 내고 외국 대학으로 옮겼다.\n\n넉 달 뒤 정오의 대열은 백 명 남짓으로 줄었다. 졸업반 학생들은 취업을 준비했다. 김문수는 기자들에게 학교도 국민의 세금으로 운영되니 국민이 뽑은 정부가 책임을 진다고 말했다. 공단에서 일하는 학생들의 부모는 대개 대통령 편이었다. 백 명은 겨울에도 정오마다 섰다."
 tfrkphn.7295.d:0 "가정 지원법이 시행된 지 다섯 해째, 통계청은 합계 출산율이 0.6에서 0.9로 올랐다고 발표했다. 혼인 건수는 그보다 더 빨리 늘었다. 외국 신문들은 이 숫자를 두고 다투었다. 한쪽은 정책의 성공이라고 했고, 다른 쪽은 결혼을 미루던 세대가 한꺼번에 몰린 것이라고 했다.\n\n지방 소도시의 산부인과 몇 곳이 다시 문을 열었다. 문을 닫았던 초등학교 분교 두 곳에는 다시 입학생이 들어왔다. 입학식에는 군수와 교회 목사가 나란히 앉았다. 공단 근처의 어린이집에는 대기 명단이 생겼다.\n\n셋째를 낳고 대출을 면제받은 한 부부는 방송에 나와 대통령에게 감사하다고 말했다. 부부는 맞벌이였다. 같은 주에 한 여성 단체는 아이를 낳지 않는 여성을 세금으로 벌하는 나라가 됐다는 성명을 냈다. 두 이야기는 같은 날 저녁 뉴스에 차례로 나왔다.\n\n김문수는 그해 성탄절에 신생아 백 명의 부모에게 손으로 쓴 카드를 보냈다. 카드에는 이 아이들이 나라의 앞날이라고 적혀 있었다. 카드를 받은 부모 가운데 몇은 그것을 액자에 넣어 거실에 걸었다."
 tfrkphn.7296.d:0 "지방선거에서 서울시장 자리를 야당이 가져갔다. 표 차이는 만삼천 표였다. 당선자는 서른여덟 살의 전직 구청장이었고, 선거 운동 내내 웃는 얼굴로 다녀 사람들은 그를 웃는 구청장이라고 불렀다. 그는 버스 노조 위원장 출신이었다.\n\n여당은 개표 과정에 문제가 있다며 이의를 냈다. 선거관리위원회는 넉 달 뒤 선거를 무효로 하고 다시 치르라고 결정했다. 결정문은 투표함 관리 위원 몇 사람이 공무원이 아니었다는 이유를 들었다.\n\n재선거 날 서울의 투표율은 처음보다 높았다. 야당 후보는 팔십만 표 차이로 이겼다. 개표가 끝나자 김문수는 방송에 나와 결과를 축하한다고 말했다. 여당 안에서는 재선거를 밀어붙인 사람을 찾아 책임을 묻는 목소리가 나왔다. 공단 지역의 구청장 선거에서는 여당이 모두 이겼다.\n\n새 시장은 시청 앞 광장의 허가제를 풀었다. 정부는 그 결정을 막지 않았다. 서울의 광장에는 다시 사람이 모였지만, 지방의 표는 움직이지 않았다. 노동자들의 표는 여전히 대통령 쪽에 있었다. 대통령의 다음 선거는 세 해 뒤였다."
 tfrkphn.7297.d:0 "쿠데타의 밤은 국경일이 됐다. 해마다 그날 밤이면 시민의 다리에 사람들이 모였다. 다리 난간에는 그날 죽은 이백여 명의 사진이 걸렸고, 자정에는 교회의 종이 울렸다.\n\n대통령은 해마다 다리 위에서 연설했다. 연설은 그날 밤 거리로 나온 사람들에게 감사하는 말로 시작해, 아직 숨어 있는 배신자들이 있다는 말로 끝났다. 그 주가 되면 새 해임 명단이 관보에 실렸다. 연설의 맨 앞줄에는 그날 밤 버스를 타고 온 공단 노동자들이 앉았다.\n\n해임된 교사 가운데 한 사람은 다섯 해째 복직 소송을 하고 있었다. 그는 쿠데타가 일어난 날 밤 학생들과 수련회에 가 있었다. 그의 이름이 명단에 오른 까닭은 그가 열 해 전에 가입한 한 독서 모임 때문이었다. 그 모임은 노동법을 읽는 모임이었다.\n\n그날 밤 다리 위에는 해임된 교사도 있었다. 그는 난간에 걸린 사진들 앞에 꽃을 놓았다. 그 가운데에는 그가 가르쳤던 제자의 사진도 있었다. 제자는 그날 밤 전차 앞에 누웠다. 교사는 사진 앞에 오래 서 있었다. 경찰은 그를 막지 않았다."
 tfrkphn.7298.d:0 "김문수 정부는 네 번의 총선과 세 번의 대선에서 이겼습니다. 선거는 정해진 날에 열렸고, 개표는 투명했습니다. 투표소 앞에는 해마다 긴 줄이 섰습니다. 공단의 투표소에는 교대 시간에 맞춰 버스가 다녔습니다.\n\n아이를 셋 낳은 부부는 빚을 갚지 않아도 됐고, 다리와 공항은 예정보다 일찍 문을 열었습니다. 물가는 오르고 내리기를 되풀이했지만, 지방의 텔레비전은 그 이유를 늘 바다 건너에서 찾았습니다. 공장 노동자들은 그를 자기들 출신의 대통령이라고 불렀고, 그는 해마다 노동절에 공장 식당에서 점심을 먹었습니다.\n\n판사는 국회가 고른 사람이었고, 신문은 대통령의 친구들이 가진 재단이 냈습니다. 대학 본관 앞에는 정오마다 몇십 명이 등을 돌리고 섰습니다. 야당은 서울을 가졌지만 나라를 가지지는 못했습니다.\n\n사람들은 투표했고, 그는 이겼습니다. 선거 때마다 공단의 표는 그에게 돌아왔습니다. 투표는 언제든 할 수 있었습니다. 투표로 바꿀 수 있는 것이 해마다 줄었을 뿐입니다."
 tfrkphn.7299.d:0 "물가 상승률이 일흔 퍼센트를 넘은 달, 대형 마트들은 종이 가격표를 떼고 전자 가격표를 달았다. 하루에 두 번 숫자를 바꾸기 위해서였다. 시장 상인들은 가격표 대신 칠판에 분필로 값을 적었다.\n\n정부는 물가를 잡겠다며 양파와 감자를 싸게 파는 공영 매장을 열었다. 매장 앞에는 새벽부터 줄이 섰다. 줄에는 청년이 많았다. 월세와 교통비가 월급보다 빨리 오르면서 청년들의 저축이 먼저 바닥났다. 공장의 임금 협상은 한 해에 두 번 열렸고, 두 번 모두 물가를 따라가지 못했다.\n\n김문수는 금리를 올리지 않겠다고 다시 말했다. 그는 금리를 올리는 것은 서민의 목을 조르는 일이라고 했고, 물가는 바다 건너 투기 세력이 원화를 공격한 결과라고 했다. 경제부총리는 그 발표 다음 날 사표를 냈다. 노조 위원장들은 대통령에게 면담을 청했다.\n\n한국은행 앞에서 대학생들이 처음으로 시위를 했다. 그들은 정착금 통장을 들고 나왔다. 통장에 찍힌 숫자는 세 해 전과 같았지만, 그 돈으로 살 수 있는 것은 절반이 되어 있었다."
 tfrkphn.73.kp:0 "자정이 넘은 대통령 집무실에 다시 불이 켜져 있다. 3년 전에도 대통령은 이 자리에 이렇게 혼자 앉아 있었다. 승전의 폭죽 소리가 겨우 잦아들던 무렵이었고, 그날 밤 그는 끊었던 담배를 꺼내 물고 어두운 창유리에 비친 제 얼굴을 보았다.\n\n그때 책상 위에는 선진대국을 만들겠다는 약속만 있었다. 국민 앞에서 한 그 말이 얼마나 무거운지 그는 그 밤에야 알았을 것이다. 오늘 밤 그는 담배 대신 만년필을 들고 백지 위에 네 글자를 천천히 적었다.\n\n진. 충. 보. 국.\n\n진충보국은 정성을 다해 충성하고 나라의 은혜에 보답한다는 말이다. 대통령이 되겠다고 나서던 날 그가 마지막 도전이라며 국민 앞에 내건 말이기도 하다. 그는 그 네 글자를 무엇을 먼저 하고 무엇을 나중에 할지 정하는 순서로 읽었고, 우리는 그 순서대로 일했다.\n\n§Y진, 다할 진.§!\n정치는 사람을 무디게 만든다. 30년을 하다 보면 칼은 녹슬고 날은 무뎌진다. 대통령은 취임하자마자 모래시계 검사 시절의 그 칼을 다시 갈았다."
 tfrkphn.73.kp2:0 "범죄와의 전쟁을 선포하고 조직폭력배와 마약 조직, 아이들을 노리는 자들에게 국가의 칼끝을 겨눴다. 부처를 합치고 위원회를 없애 정부의 군살을 뺐고, 공무원들에게는 보고서 말고 결과를 가져오라고 했다.\n\n귀족이 된 노조와도 부딪쳤다. 그들은 거리로 나왔고 대통령은 물러서지 않았다. 일하는 사람을 지키는 것과 일하지 않는 특권을 지키는 것은 다르다고 했다. 욕을 많이 먹었지만 공장은 다시 돌았다.\n\n그는 기자회견장 대신 카메라 앞에 혼자 앉아 국민에게 직접 말했고, 사람들은 톡 쏘는 맛이 있다며 그 방송을 홍카콜라라고 불렀다. 서민의 대통령이 되겠다며 시장 바닥의 국밥집에서 밥을 먹었고, 동과 서가 서로를 미워하지 않도록 달빛동맹의 다리를 놓았다. 꿈을 잃은 청년들에게는 사다리를 놓으려 했고, 다 이루었다고는 못 해도 힘이 닿는 데까지는 했다.\n\n§Y충, 충성 충.§!\n지난 30년 동안 그는 당에 충성하는 정치를 했다. 공천을 받으려고, 당권을 잡으려고 계파와 계파 사이에서 줄을 섰다. 대통령이 된 날 그는 이제부터 국익에만 충성하겠다고 했다. 그 말은 때로 자기 편에게 등을 돌려야 한다는 뜻이었고, 우리가 생각한 것보다 훨씬 무거웠다."
 tfrkphn.73.kp3:0 "미국이 무너지고 핵우산이 흔들렸을 때 그는 힘이 있어야 평화도 지킨다고 했다. 모병제를 넓혀 직업군인의 나라를 만들었고 여성도 일반병으로 총을 들 수 있게 했다. 킬체인과 미사일방어와 대량응징보복의 3축 체계를 완성했고, 핵 앞에서 물러서지 않겠다며 PDTO의 동맹들과 마주 앉았다.\n\n북한에는 간섭하지도 간섭받지도 않겠다고 했다. 판문점을 넘어온 병사를 돌려보내지 않았고 평양의 협박에도 고개를 숙이지 않았다. 적룡의 동맹들이 동쪽으로 손을 뻗을 때는 이념을 앞세우지 않고 국익으로 맞섰다.\n\n국방과학연구소 전시실의 빈 액자를 채웠고, 군복을 입고 청춘을 바친 젊은이들의 시간을 나라가 갚게 했다. 그리고 육해공에 해병과 우주를 더한 3축 5군이 대한민국을 지키게 되었다. 당에 하던 충성을 나라에 했다는 말을 그는 이제 부끄럽지 않게 할 수 있다."
 tfrkphn.7300.d:0 "지방선거에서 서울시장 자리를 야당이 가져갔다. 당선자는 서른여덟 살의 전직 구청장이었다. 그는 선거 운동 내내 웃는 얼굴로 다녀 사람들은 그를 웃는 구청장이라고 불렀다. 표 차이는 만삼천 표였다. 그는 버스 노조 위원장 출신이었다.\n\n선거관리위원회는 여당의 이의를 받아들여 선거를 무효로 했다. 재선거 날 서울의 투표율은 처음보다 높았다. 웃는 구청장은 팔십만 표 차이로 이겼다. 부산과 대구, 공단 도시 두 곳에서도 야당 시장이 나왔다.\n\n김문수는 이번에는 축하한다고 말하지 않았다. 검찰은 새 시장이 대학 졸업장을 위조했다는 고발을 접수했다. 고발장을 낸 사람은 여당 청년 조직의 간부였다. 시장은 스무 해 전 졸업 앨범을 들고 기자 회견을 했고, 그 사진이 인터넷에서 삼백만 번 공유됐다.\n\n그해 여론 조사에서 웃는 구청장은 다음 대선 후보 가운데 처음으로 대통령을 앞질렀다. 그는 대선에는 나가지 않겠다고 말했다. 야당은 그 말을 믿지 않았고, 여당도 믿지 않았다. 공단 노동자들의 표가 움직이기 시작했다는 분석이 나왔다."
 tfrkphn.7301.d:0 "여당의 중진 변호사 한 사람이 방송에 나와 당을 떠난다고 말했다. 그는 마흔다섯 살이었고, 대통령의 재단에서 법률 고문을 지냈다. 그는 재단 이사회의 회의록 일부를 들고 나왔다. 회의록에는 다리 공사의 하청 회사들 이름이 적혀 있었다.\n\n그는 새 당을 만들었다. 당 이름은 짧았고, 깃발은 태극기 하나뿐이었다. 그는 자신이 여전히 보수라고 말했다. 가정 지원법도, 다리도 그대로 두겠다고 했다. 다만 판사와 신문을 대통령의 친구들에게서 돌려받겠다고 했다.\n\n그는 여름 내내 걸어서 지방을 돌았다. 하루에 마을 셋을 걸었고, 마을 회관에서 잤다. 여당 지지자가 많은 군 단위 마을에서도 사람들이 그를 보러 나왔다. 그는 공장 정문 앞에서 교대하는 노동자들과 악수했다. 그들은 대통령을 미워하지 않았지만, 장바구니가 가벼워진 것은 알고 있었다.\n\n정부의 방송은 그를 배신자라고 불렀다. 그 말은 김문수가 젊은 날 운동권 동료들에게서 들었던 말과 같았다. 김문수는 기자들이 그 이야기를 꺼내자 대답하지 않고 회의장으로 들어갔다."
 tfrkphn.7302.d:0 "가을 여론 조사에서 서른 살 아래의 여당 지지율은 처음으로 이십 퍼센트 아래로 떨어졌다. 몇 해 전 광장 앞줄을 채웠던 세대였다. 그들 가운데 많은 수가 정착금을 받았고, 공공 주택 추첨에 붙었다.\n\n그러나 월세가 두 배가 됐고, 공단의 월급은 물가를 따라가지 못했다. 정착금으로 산 중고차는 기름값 때문에 주차장에 서 있었다. 결혼 대출을 받으려던 연인들은 집값을 보고 날짜를 미뤘다. 잔업은 줄었고, 공장들은 신규 채용을 멈췄다.\n\n한 전역병 단체가 성명을 냈다. 그들은 쿠데타의 밤에 다리로 달려간 사람들이었다. 성명은 짧았다. 그날 우리가 지키려 한 것은 투표함이었다는 문장으로 시작했고, 그 투표함을 다시 지키겠다는 문장으로 끝났다. 그 단체의 회원 절반은 공장 노동자였다.\n\n대학가의 술집에서는 다시 정치 이야기가 나왔다. 여당 청년 조직의 단체 대화방은 그해 겨울 조용해졌다. 마지막으로 올라온 글은 여당에서 나온 변호사가 여는 걷기 행사의 출발 시각이었다. 공단의 노조 사무실에서도 같은 이야기가 나왔다."
 tfrkphn.7303.d:0 "총선을 반년 앞두고 야당들은 후보를 하나로 모았다. 서울의 웃는 구청장과 여당에서 나온 변호사가 같은 무대에 섰다. 두 사람은 누가 명단 맨 위에 설지를 두고 사흘 동안 협상했고, 변호사가 맨 위에 섰다. 변호사는 첫 연설을 공단 정문 앞에서 했다.\n\n정부는 선거 석 달 전에 정착금을 한 번 더 올리고 공공 주택 추첨을 앞당겼다. 재단의 방송은 날마다 야당이 이기면 가정 지원법이 없어진다고 전했다. 야당은 그 법을 그대로 두겠다는 약속을 광고로 냈다. 노총은 이번에는 지지 선언을 하지 않았다.\n\n여론 조사는 엇갈렸다. 정부 쪽 조사 기관은 여당이 열 점 앞선다고 했고, 독립 조사 기관은 야당이 앞선다고 했다. 외국 감시단은 처음으로 투표소 일만 곳에 참관인을 보내겠다고 했다.\n\n투표 전날 밤 변호사는 마지막 유세를 시청 앞 광장에서 했다. 그 광장은 웃는 구청장이 허가제를 풀어 둔 곳이었다. 그날 밤 광장에 모인 사람의 수는 쿠데타의 밤에 다리로 나온 사람보다 많았다. 광장에는 작업복을 입은 사람들도 있었다."
 tfrkphn.7304.d:0 "투표율은 팔십 퍼센트를 넘었다. 개표 방송은 저녁 여덟 시에 시작했다. 아홉 시 반, 지방 소도시들의 개표가 먼저 끝났다. 여당이 늘 이기던 곳에서 표 차이가 한 자릿수로 줄어 있었다. 공단 지역의 투표소 몇 곳에서는 야당이 처음으로 이겼다.\n\n열 시가 넘자 대도시의 표가 들어왔다. 야당 명단은 3분의 2에 가까운 의석을 얻었다. 재단의 방송은 한동안 다른 소식을 내보냈다. 대통령실 대변인은 기자실에 나오지 않았다. 노조 위원장들은 그날 밤 전화를 받지 않았다.\n\n열한 시에 김문수가 직접 방송에 나왔다. 그는 국민의 뜻을 받아들인다고 말했다. 야당의 승리를 축하했고, 새 국회와 함께 일하겠다고 했다. 연설은 사 분이었다. 그는 연설 끝에 젊은 날 노동 운동을 하며 배운 것은 결과를 받아들이는 일이었다고 덧붙였다.\n\n시청 앞 광장에서는 사람들이 서로를 껴안았다. 여당 당사 앞에서는 청년 몇이 깃발을 접었다. 외국 감시단은 이튿날 아침 이번 선거가 자유로웠고 대체로 공정했다고 발표했다. 공단의 술집은 늦게까지 문을 열었다."
 tfrkphn.7305.d:0 "§Y[칼럼] 김문수의 실패는 보수의 실패다§!\n\n김문수 대통령이 오늘 청와대를 나와 경기도의 옛집으로 내려갔다. 국회가 낸 개헌안은 칠십 퍼센트가 넘는 찬성으로 통과됐다. 다음 대선까지 나라를 맡을 과도 총리는 포격 때 체포됐던 우원식 전 국회의장이다.\n\n헌법 제1조 2항은 모든 권력이 국민으로부터 나온다고 적었다. 김문수는 이 조항을 투표함 하나로 읽었다. 선거에서 이기면 판사를 갈고 신문사의 주인을 바꿔도 된다고 믿었다. 다수결은 자유민주주의의 도구일 뿐이다. 자유민주주의의 몸통은 법치와 독립된 법원이다.\n\n그는 노동 운동가 출신이다. 공단에서 고문을 견딘 사람이 대통령이 되어 교사와 판사 육만 명을 쫓아냈다. 반공을 내걸고 언론을 사들인 정권은 공산주의자들이 바라던 일을 대신 해 주었다.\n\n김문수는 개헌안을 막지 않았다. 국민투표 날 투표소 줄에 서서 표를 냈고, 어느 쪽에 찍었는지는 끝내 말하지 않았다. 그가 대통령으로서 한 일 가운데 가장 옳은 일이다. 보수가 다시 일어서려면 이날에서 출발해야 한다."
 tfrkphn.7306.d:0 "명동의 환전소 앞에 사람들이 줄을 섰다. 전광판의 숫자는 오전과 오후가 달랐고, 줄 선 사람들은 숫자가 바뀔 때마다 전화기를 꺼내 사진을 찍었다. 은행은 달러 예금 창구를 늘렸다. 정부가 다리와 공항을 짓느라 찍어 낸 국채는 그해 예산의 절반에 가까웠다.\n\n외국의 신용 평가 회사는 한국의 등급을 두 단계 내렸다. 대통령은 그 회사들이 한국의 성장을 시기한다고 말했다. 정부는 연기금에 국채를 더 사라고 지시했다. 기금 운용 책임자는 사표를 냈고, 후임자는 그 주에 국채를 샀다.\n\n공단의 반응은 여의도보다 빨랐다. 수입 부품값이 오르자 하청 업체들이 먼저 잔업을 없앴다. 월급날 노동자들은 지난달보다 얇아진 명세서를 받았다. 대통령을 찍었던 한 용접공은 방송 기자에게 다리는 좋은데 그 다리로 출근할 공장이 남아 있겠느냐고 물었다.\n\n그날 저녁 대통령은 예정에 없이 공단을 찾았다. 구내식당에서 그는 식판을 들고 줄을 섰다. 식당 벽의 텔레비전에서는 그날의 환율이 자막으로 지나갔다. 그와 악수하려고 일어선 사람은 예전보다 적었다."
 tfrkphn.7307.d:0 "§Y[사설] 신문 통폐합 계획을 거두라§!\n\n정부는 어제 신문과 방송, 통신사 예순네 곳을 열여덟 곳으로 줄인다고 발표했다. 정부는 난립을 바로잡겠다고 했다. 통폐합을 맡은 위원회의 명단은 공개되지 않았다. 신문이 몇 개나 있어야 하는지는 독자가 고를 일이고, 정부가 숫자를 정할 일이 아니다.\n\n본지는 부수가 커서 이번 통폐합 명단에서 빠졌다. 본지는 반공과 시장 경제를 내건 이 정부를 지지해 왔다. 오늘 이 글을 쓰는 이유도 거기에 있다. 사주를 불러 포기 각서를 받는 일을 이 나라는 1980년에 이미 겪었다. 그때 정부도 질서를 내세웠다. 그 뒤 언론이 제자리를 찾는 데 칠 년이 걸렸고, 그 일은 보수가 두고두고 갚아야 할 빚으로 남았다.\n\n문을 닫는 마흔여섯 곳 가운데에는 본지와 논조가 다른 신문이 많다. 본지는 그들의 주장에 반대해 왔고 앞으로도 반대할 것이다. 그래도 그들이 신문을 낼 권리는 정부가 거두어 갈 수 있는 것이 아니다. 본지는 정부가 통폐합 계획을 거두기를 요구한다. 내일 아침에도 이 자리에 사설이 실릴 것이다."
 tfrkphn.7308.d:0 "사설이 실리고 열하루 뒤, 국세청 조사관 마흔 명이 조선일보 본사에 들어갔다. 국세청은 정기 세무 조사라고 했다. 조사관들은 편집국 서랍까지 열었고, 사주 일가의 계좌 열두 개가 같은 날 묶였다.\n\n그날 밤 편집국장은 내일 자 1면을 비우기로 했다. 윤전기는 평소처럼 돌았다. 이튿날 아침 가판대에 놓인 조선일보 1면에는 제호와 날짜만 있었고 그 아래는 하얬다. 맨 아래에 작은 글씨로 한 줄이 적혀 있었다. 오늘 1면에 실릴 기사는 국세청에 있습니다.\n\n신문은 정오 전에 다 팔렸다. 사람들은 백지 1면을 오려 창문에 붙였다. 외국 통신사들은 백지 1면 사진을 그날 저녁 전 세계에 보냈다. 문화부는 편집국에 보내는 종이에 1면을 비우지 말라는 줄을 새로 넣었다.\n\n조선일보는 그다음 날 1면을 채웠다. 맨 위에는 국세청의 조사 일정이 실렸고, 대통령의 하루 일정은 그 아래로 밀렸다. 조사는 넉 달 동안 이어졌다. 추징금은 사주가 가진 땅을 팔아 냈고, 조선일보는 사설을 하루도 거르지 않았다. 편집국장은 그 주에 사표를 내지 않았다."
 tfrkphn.7309.d:0 "통폐합 명단에서 한겨레와 경향신문, 오마이뉴스는 한 회사로 묶였다. 새 회사의 제호는 한겨레로 남았다. 경향신문 기자들은 합병 서류가 오기 전날 밤 편집국에 모여 마지막 호를 만들었지만, 그 신문은 인쇄소를 나가지 못했다. 세 곳의 기자 가운데 절반이 해고 통지를 받았고, 정부는 가스 공사 출신 사장을 앉혔다.\n\n합병 뒤 첫 신문의 1면에는 대통령이 직업 훈련원에서 용접을 배우는 청년들과 악수하는 사진이 실렸다. 제목은 일하는 사람의 정부였다. 사설은 통폐합이 재벌 언론의 독과점을 깨뜨렸다고 썼다.\n\n남은 기자들은 기사에서 자기 이름을 뺐다. 기사 끝에는 이름 대신 편집국이라고만 적혔다. 해고된 기자 몇몇은 동네 복사집에서 소식지를 찍어 대학가에 돌렸다. 소식지의 제호도 한겨레였다.\n\n독자들은 같은 제호의 신문 두 가지를 받아 보았다. 하나는 가판대에서 샀고, 하나는 지하철 의자 위에서 주웠다. 정부는 두 달 뒤 소식지를 찍던 복사집 세 곳을 무허가 인쇄로 고발했다. 고발장에는 소식지 제호가 상표권을 침해했다는 내용도 있었다."
 tfrkphn.7310.d:0 "조선일보에 세무 조사가 들어간 다음 날, 동아일보는 조선일보의 백지 1면 사진을 자기 1면 한가운데에 실었다. 사진 아래에는 통폐합 계획을 거두라는 사설이 붙었다. 동아일보도 통폐합 명단에서 빠진 신문이었다. 사설은 살아남은 신문이 입을 다물면 통폐합은 끝나지 않는다고 썼다.\n\n한 주 뒤 공기업과 대기업의 광고가 동아일보에서 한꺼번에 빠졌다. 광고 담당자들은 이유를 말하지 않았다. 다음 날 신문의 광고면 열네 쪽이 비어 있었다. 정부 대변인은 광고는 기업이 알아서 정할 일이라고 말했다.\n\n편집국은 1974년 겨울에 했던 일을 다시 했다. 빈 광고면에 독자 광고를 받는다는 공고를 냈다. 사흘 만에 광고면이 찼다. 한 줄에 만 원짜리 작은 광고들이었다. 대학 신문사 기자들과 이름을 밝히지 않은 회사원들이 광고를 냈고, 해고된 한겨레 기자들도 돈을 모아 한 줄을 샀다.\n\n광고 가운데 하나는 조선일보 편집국이 낸 것이었다. 내일도 신문은 나온다는 한 줄이었다. 두 신문의 독자들은 그 광고면을 오려 서로에게 보냈다."
 tfrkphn.7311.d:0 "§Y[알림] 해직 기자 마흔두 명을 맞아들입니다§!\n\n본사는 이번 통폐합으로 직장을 잃은 한겨레, 경향신문, 오마이뉴스 출신 기자 마흔두 명을 오늘 자로 채용했습니다. 본사는 이들이 쓰는 기사의 논조를 고치지 않겠습니다. 이들의 기사는 매일 8면과 9면에 실리며, 지면 맨 위에는 다른 목소리라는 문패를 답니다.\n\n§Y[다른 목소리] 조선일보에서 쓰는 첫 기사§!\n\n우리는 이 신문을 오래 비판해 왔다. 지난달 우리 회사의 문이 닫혔고, 우리가 만들던 신문의 제호는 정부가 앉힌 사장이 가져갔다. 이 신문은 우리에게 책상과 지면을 내주었다.\n\n우리는 지금도 이 신문의 논조에 동의하지 않는다. 그 사실을 이 지면에 처음으로 적어 둔다. 이 신문도 그것을 조건으로 우리를 불렀다.\n\n오늘 8면에는 통폐합으로 해고된 기자 천이백 명의 이름이 실린다. 9면에는 통폐합 위원회가 공개하지 않은 회의록 가운데 우리가 구한 세 쪽이 실린다. 회의록에는 문을 닫을 신문을 고른 기준이 적혀 있다. 그 기준은 부수가 아니었다. 내일 9면에는 네 번째 쪽이 실린다."
 tfrkphn.7314.d:0 "국가수사국이 문을 연 지 스무 날 만에 첫 사건 목록이 대통령실에 올라왔다. 맨 위에 적힌 것은 2021년 국민의힘 대선 경선이었다. 그해 7월부터 9월 사이 책임당원 가입이 평소의 몇 배로 늘었고, 늘어난 당원 가운데 상당수가 신천지 신도였다는 진술이 나왔다. 진술한 사람은 신천지 청년회 간부 출신이었고, 그해 봄에 위에서 입당 지시가 내려왔다고 말했다.\n\n그 경선에서 이긴 사람은 대통령 자신이었다. 그래서 사건은 더 꼬였다. 신천지가 밀었다는 쪽은 경선에서 졌고, 그쪽을 따르던 의원들은 지금도 당 안에 있다. 그들은 대통령이 새 수사 기관으로 옛 경쟁자를 치려 한다고 말했다. 민주당은 여당이 종교 단체의 표로 경선을 치렀다며 특검을 요구했다. 당 대표는 기자들 앞에서 말없이 당사로 들어갔다.\n\n신천지는 성명을 내고 탈퇴자의 일방적 주장이라고 반박했다. 수사국장은 당원 명부를 넘겨받지 않으면 진술을 확인할 길이 없다고 보고했다. 명부는 여의도 당사의 서버에 있었다. 당 사무처는 영장 없이는 한 줄도 내줄 수 없다고 했다."
 tfrkphn.7315.d:0 "국가수사국은 여의도 당사 서버에서 2021년 당원 명부를 가져왔다. 당 지도부는 압수수색 날 당사 앞에서 항의했고, 경선에서 진 쪽 의원들은 하루 종일 방송에 나와 정치 보복이라고 말했다.\n\n명부를 맞춰 본 결과는 수사국장의 보고서 두 쪽에 담겼다. 7월부터 9월 사이 같은 날 같은 지역에서 수백 명씩 가입한 기록이 여러 번 나왔다. 누구를 찍었는지는 비밀투표라 알 수 없었다. 신도가 당원으로 가입하는 일 자체는 불법이 아니다. 처벌하려면 단체가 어떤 후보에게서 대가를 받거나 약속을 받았다는 증거가 있어야 하는데, 그런 증거는 나오지 않았다. 수사국은 아무도 입건하지 않았다.\n\n보고서 끝에는 제도에 관한 한 줄이 붙어 있었다. 그 경선은 한 달 치 당비만 내도 투표권을 주었다. 당 안팎에서 그 기간을 늘리자는 말이 나왔다. 대통령은 그날 저녁 당 대표를 관저로 불렀다. 두 사람은 명부를 공개하지 않기로 하고 다음 경선의 규칙을 바꾸기로 했다. 경선에서 진 쪽 의원들은 입건한 사람이 없다는 것이 보복 수사의 증거라고 말했다."
 tfrkphn.7316.d:0 "영장은 사흘 만에 나왔다. 아침 일곱 시, 국가수사국 수사관 서른 명이 승합차 다섯 대에 나눠 타고 여의도 당사 앞에 섰다. 정문 앞에는 이미 당직자와 당원 백여 명이 팔짱을 끼고 줄지어 서 있었다. 아무도 길을 비키지 않았다. 방송사 중계차가 길 건너편에 자리를 잡았다.\n\n수사팀장이 영장을 펼쳐 보이자 사무총장이 앞으로 나와 종이를 한 장씩 넘기며 읽었다. 영장에 적힌 것은 2021년 7월부터 9월까지의 당원 가입 기록과 당비 납부 기록이었다. 사무총장은 그 기록이 서버 하나에 다른 해의 명부와 함께 들어 있다며, 나머지 명부까지 가져갈 수는 없다고 말했다. 수사팀장은 해당 기간만 따로 뽑아 가겠다고 답했다.\n\n협상은 점심때까지 이어졌다. 그사이 경선에서 진 쪽 의원 열두 명이 당사 로비에 들어와 앉았다. 오후가 되자 서버실 앞에 남은 것은 수사관 여섯 명과 당 전산 담당자 두 명이었다. 밖에서는 당원들이 대통령의 이름을 부르며 구호를 외쳤다. 수사팀장은 해가 지기 전에 결정해야 한다고 대통령실에 전화로 보고했다."
 tfrkphn.7320.d:0 "대구 신공항 기공식이 끝나자 대통령은 단상에서 내려와 내빈석 둘째 줄에 앉아 있던 김부겸에게 갔다. 김부겸은 전직 국무총리 자격으로 초청을 받아 와 있었다. 두 사람은 오래전 수성구의 이웃한 두 지역구에서 의원을 지냈고, 선거 때마다 서로 반대편 유세차에 올랐다. 대통령이 사진 기자들을 손짓해 부르자 김부겸은 잠깐 망설이다가 옆에 섰다.\n\n셔터 소리가 잦아들 무렵 대통령은 국민통합위원회를 맡아 달라고 했다. 김부겸은 당과 먼저 상의하겠다고 답하고 악수를 한 번 더 한 뒤 차에 올랐다. 비서실장과 정무수석은 그 대답을 승낙으로 볼지 거절로 볼지를 두고 저녁까지 다퉜다.\n\n이튿날 대구 지역 신문 세 곳이 그 사진을 1면에 실었다. 여당 강경파 의원 몇은 야당 사람에게 위원장 자리를 주면 지지층이 떠난다며 원내대표실을 찾아갔고, 야당 대변인은 사진 한 장으로 하는 정치라고 논평했다. 서문시장 건어물 가게 주인은 신문을 오려 계산대 옆 벽에 테이프로 붙였다.\n\n대통령은 위원장 자리를 일주일 동안 비워 두라고 비서실에 일렀다."
 tfrkphn.7321.d:0 "탄핵안이 가결되고 이레째 되는 날, 권한대행 이인제가 김무성을 총리 공관으로 불렀다. 십여 년 전 두 사람은 같은 당 지도부에서 대표와 최고위원으로 나란히 앉았고, 본회의장에서도 자주 고개를 맞대고 귓속말을 했다.\n\n김무성은 찻잔을 받기도 전에 출마할 생각이 있느냐고 물었다. 이인제는 웃으면서 탁상 달력을 넘겨 선거일까지 남은 날을 셌다. 김무성이 권한대행이 출마하면 선거를 관리할 사람이 없다고 하자, 이인제는 대통령 선거에 여러 번 나가 본 사람에게 할 말은 아니라며 다시 웃었다.\n\n이야기는 한 시간을 넘겼다. 김무성은 흩어진 의원들을 모아 헌정을 바로 세우는 연대를 꾸리겠다며 그 연대가 권한대행을 공격하지 않게 하겠다고 약속했고, 대신 선거를 관리하는 내각에서 당적을 가진 장관들을 빼 달라고 했다. 이인제는 메모지에 장관 이름을 몇 개 적었다.\n\n공관 앞에서 기다리던 기자들이 무슨 이야기를 했느냐고 묻자 김무성은 옛날 얘기를 좀 했다고 말하고 차 문을 닫았다. 그날 밤 권한대행 비서실은 장관 세 명에게서 사표를 받았다."
 tfrkphn.7322.d:0 "'심상정 후보 대통령 당선'\n\n향선이 간간이 보는 조선일보 헤드라인에 이 10글자가 박히자 그녀의 기분은 오묘해졌다. 15년 전이었던가 그때 그녀는 정치에 관심이 없었다. 아들 두 놈을 장가 보내고 남편이랑 둘이서 무료하게 시간을 때웠다. 선거일에는 투표장에 가서 맹목적으로 보수 후보를 찍는 것이 전부였다.\n\n오랜만에 아침 일찍 장을 보러 버스를 타러 나간 날이었다. 버스를 기다리고 있는데 옆에서 한 여자가 그녀를 불렀다.\n\n\"어머, 안녕하세요?\"\n\n\"네, 안녕하세요.\"\n\n여자가 부른 말에 그녀도 답했다. 여자는 수수하고 단정한 차림이었다. 그 후 여인들은 간단한 대화를 나누고 헤어졌다. 그렇게 여인들은 가끔씩 인사를 주고받았다. 언젠가부터 여자는 보이지 않았고 한참 지나서야 향선은 여자가 국회의원이던 심상정이라는 걸 알게 되었다.\n\n회상이 끝나고도 그녀는 신문을 계속 바라봤다. 그리고 이렇게 생각하며 신문을 접었다."
 tfrkphn.7330.a:0 "히히 오줌발싸"
 tfrkphn.7330.d:0 "탄핵소추안이 국회에 올라와 있던 날, 대통령이 총선 준비 회의를 열겠다고 했다. 참모들이 지금은 탄핵부터 막아야 한다고 말리자 대통령은 웃기 시작했다.\n\n선거? 좋지. 내가 선거로 큰 사람 아이가. 탄핵? 그거 다 좌파 놈들 장난이다. 국회 해산해 뿌고 총선 새로 하면 된다. 와 안 되노? 헌법? 헌법은 내가 검사 때 다 외웠다. 마 다 데리고 온나. 출마할 놈 다 데리고 온나. 유승민이는 빼고.\n\n비서실장이 대통령님 괜찮으시냐고 물었다. 대통령은 대답 대신 페이스북에 글을 올렸다. 오늘 아침 나는 돼지발정제 맞은 멧돼지처럼 힘이 넘친다. 총선 이긴다. 내가 이긴다. 나 홍준표다.\n\n글은 십 분 만에 지워졌지만 캡처는 이미 퍼진 뒤였다. 여당 단톡방이 터졌고, 그날 오후 탄핵 찬성으로 돌아선 여당 의원이 스무 명을 넘었다."
 tfrkphn.7330.t:0 "맛이 간 대통령"
 tfrkphn.74.kp:0 "2026년 가을, 대통령 선거를 다섯 달 앞둔 여의도다. 헌법이 정한 5년 단임 때문에 대통령은 다시 출마할 수 없다. 사람들의 눈은 이제 다음 사람에게로 향했고, 여당 안에서는 두 사람의 이름이 오르내린다.\n\n§Y이인제§!\n충남 논산 출신이다. 판사를 거쳐 정치에 들어왔고 김영삼 정부에서 노동부 장관을 지냈다. 경기도지사를 지냈고 대통령 선거에 나섰으며 여섯 번 국회의원이 되었다. 우리 정부에서는 처음부터 국무총리로 대통령의 책상에 서류를 올려 온 사람이다.\n\n두 사람은 같은 시대를 걸었다. 같은 사람에게 발탁되었고 같은 당에서 부딪치고 화해하기를 되풀이했다. 이제 둘 다 백발이다. 이인제는 기자들 앞에서 짧게 말했다.\n\n\"홍 대통령이 걸어온 길, 제가 이어서 걷겠습니다. 전쟁을 이긴 정부입니다. 그 정부가 시작한 일을 끝내는 것이 제 일입니다. 새 길을 찾는 건 그다음입니다.\"\n\n그의 곁에는 국방과 외교를 함께 꾸려 온 사람들이 섰고, 3축 5군과 PDTO, 대만과의 약속, 진충보국의 네 글자를 그는 그대로 잇겠다고 했다. 사람들은 그를 연속성의 후보라고 부른다."
 tfrkphn.74.kp2:0 "§Y오세훈§!\n서울 출신이다. 변호사로 이름을 알렸고 마흔다섯에 서울시장이 되었다. 시장직을 걸었다가 내려놓았고 10년 만에 다시 돌아와 서울시청에 앉았다. 서울시장을 네 번 지낸 사람이다.\n\n그는 대통령과 자주 부딪쳤다. 서울공화국이라는 말에 맞섰고 방송에서 날 선 말을 주고받았다. 그러면서도 토지임대부 주택은 서울이 먼저 했다며 웃었다. 오세훈은 시청 브리핑룸에서 말했다.\n\n\"홍 대통령은 전쟁을 이겼습니다. 그건 누구도 부정할 수 없습니다. 그런데 국민들 지쳤습니다. 전쟁 끝난 지가 언젠데 아직도 뉴스 첫 꼭지가 국방입니다. 이제 장바구니 얘기 좀 합시다. 저는 전임자와는 다른 길을 찾겠습니다.\"\n\n그의 곁에는 젊은 의원들과 수도권의 단체장들이 섰고, 재건과 민생, 실용을 내건 그를 사람들은 변화의 후보라고 부른다.\n\n청와대 집무실에서 대통령은 두 사람의 출마 회견을 차례로 보았다. 비서실장이 물었다.\n\n\"어느 쪽을 미십니까?\"\n\n대통령은 텔레비전을 껐다.\n\n\"그건 내가 정할 일이 아니야. 당원하고 국민이 정하는 거지. 대통령이 후계자를 고르는 나라는 선진국이 아니야.\""
 tfrkphn.76.desc:0 "국회 헌법개정특별위원회, 회의실 화면에 비교표가 떠 있다.\n\n현행 헌법 제70조는 대통령의 임기를 5년으로 하고 중임할 수 없다고 정한다. 정부안은 임기를 4년으로 줄이되 한 차례 다시 출마할 수 있게 하는 것이었다. 일을 잘한 대통령에게는 한 번 더 기회를, 못한 대통령은 4년 만에 투표로 끝낸다는 논리였다.\n\n\"임기 후반만 되면 아무도 대통령 말을 안 듣잖아요. 5년 단임은 그게 문제예요.\"\n\"재선이 가능해지면 현직이 선거에 국정을 쓴다는 얘기가 나오겠죠. 그리고 이 개헌, 누구한테 이득입니까?\"\n\n질문이 나오자 회의실이 잠시 조용해졌다. 국회 입법조사처의 연구관이 헌법 조문집을 펼쳤다.\n\n\"헌법 제128조 제2항입니다. '대통령의 임기연장 또는 중임변경을 위한 헌법개정은 그 헌법개정 제안 당시의 대통령에 대하여는 효력이 없다.' 이번 개헌이 통과되더라도 지금 대통령께는 적용되지 않습니다. 4년 중임제는 다음 정권부터입니다.\"\n\n헌법 개정은 국회 재적의원 3분의 2의 찬성을 얻은 뒤 국민투표를 통과해야 한다. 어느 쪽이든 결국 국민 앞에 설 수밖에 없는 일이었다.\n\n정부안은 국회로 넘어갔다."
 tfrkphn.78.kp:0 "2017년에 마지막 사법시험이 치러졌다. 그 뒤로 법조인이 되는 길은 로스쿨 하나만 남았고, 관악구 신림동 고시원 골목에서는 간판이 하나둘 내려갔다.\n\n대통령은 후보 시절부터 이 제도를 고치겠다고 말해 왔다. 2021년 여름에는 로스쿨과 의학전문대학원, 국립외교원을 음서제도라 부르면서 사법시험과 행정고시, 외무고시를 되살려 개천에서도 용이 나는 사회를 만들겠다고 적었다. 그보다 앞선 2017년에는 그가 대표로 있던 당의 혁신위원회가 사법시험 부활을 계층 이동의 사다리라는 이름으로 내놓은 적도 있다."
 tfrkphn.78.kp2:0 "우리가 내놓은 안은 그 말보다 한 걸음 물러서 있고, 로스쿨은 그대로 두고 사법시험을 함께 치른다. 법학을 전공하지 않은 수험생과 형편이 넉넉하지 못한 수험생에게도 길을 열어 주자는 취지인데, 이미 로스쿨에 들어간 학생들을 하루아침에 내칠 수는 없다는 계산도 들어 있다.\n\n발표가 난 날 저녁, 신림동의 한 편의점 테이블에 두 청년이 마주 앉았다.\n\n\"드디어 돌아오는 건가... 몇 년만 더 일찍 나왔어도.\"\n\"저는 로스쿨 2학년인데요. 등록금이랑 생활비로 빚이 1억 가까이 되는데, 이제 와서 사시가 부활하면 우리는 뭐가 돼요?\"\n\n두 사람은 한동안 말없이 컵라면만 저었다. 라면이 다 불어 버렸다.\n\n둘 중 누구에게도 불공정하다는 말을 듣지 않을 방법을 찾는 일은 이제 법무부와 교육부 몫이다."
 tfrkphn.79.kp:0 "대통령은 2021년 여름 입학사정관제와 수시를 없애고 정시로만 대학에 가게 하겠다고 적었다. 수능을 한 해에 두 번 치르게 하겠다는 말도 그때 했다.\n\n오늘 교육부가 발표한 대입제도 개편안은 그 말을 단계로 나눈 것이다. 정시 모집 비율을 해마다 늘리고, 수능은 한 해에 두 번 응시할 기회를 준다. 학생부 전형은 사는 동네와 다니는 학교에 따라 기회가 갈린다는 말을 오래 들었다. 수능에는 하루 시험으로 인생이 갈린다는 비판이 따라붙는다. 우리는 수능을 고르고, 시험을 두 번 보게 해서 그 비판을 덜어 보기로 했다."
 tfrkphn.79.kp2:0 "그날 저녁 서울 대치동 학원가에는 설명회 문의 전화가 평소의 세 배로 늘었다. 지방 소도시의 한 고등학교 교무실에서는 부장 교사가 한숨을 쉬었다.\n\n\"서울 애들만 유리해지는 거 아닌가요? 학원 없는 우리 애들은 어떻게 합니까.\"\n\"그래서 EBS랑 방과후 지원을 같이 늘린다고는 하는데...\"\n\n교무실 창밖으로 야간자율학습을 마친 아이들이 버스 정류장으로 뛰어가고 있었다."
 tfrkphn.80.kp:0 "대통령은 2017년 대선 때부터 모병제를 말해 왔다. 2021년 9월에도 모병제 도입은 다섯 해 전 대선 공약이었고 지금도 변함이 없다고 했다.\n\n병무청 회의실 벽에는 연도별 입영 대상자 그래프가 떠 있고, 줄어드는 병역 자원의 곡선은 어느 해를 기점으로 가파르게 꺾인다. 스무 살 남자의 수가 줄어드는 만큼 징병으로 채울 수 있는 자리도 줄어든다.\n\n우리는 징병제를 곧바로 없애지 않기로 했다. 직업군인의 처우를 먼저 높이고, 복무 기간과 인원은 몇 해에 걸쳐 조정하면서 단계적으로 모병제로 옮겨 간다. 장비가 복잡해질수록 오래 복무한 숙련병이 필요하다는 것이 군이 든 근거다. 북한과 마주한 나라가 병력을 줄여도 되느냐는 반론도 국회 안팎에서 거세다."
 tfrkphn.80.kp2:0 "여론도 갈린다. 병무청 민원실에서 들은 두 사람의 말이 그대로 보고서에 실렸다.\n\n\"저는 환영입니다. 아들 군대 보내느라 우리 집 인생 계획이 다 틀어졌었거든요.\"\n\"저는 반댑니다. 결국 가난한 집 아이들만 군대 가는 나라가 되는 거 아닙니까.\"\n\n병무청 복도에는 아직 예전 입영 안내 포스터가 붙어 있다."
 tfrkphn.82.kp:0 "대통령은 2021년 9월 경선 공약 발표회에서 대통령긴급명령권을 발동해서라도 강성귀족노조의 패악을 막아 노동 유연성을 높이겠다고 말했다. 그 말이 오늘 정부안이 되어 나왔다.\n\n미국 시장이 사라진 뒤로 수출 공장의 주문은 들쭉날쭉하다. 일감이 몰릴 때 사람을 쓰고 빠질 때 줄일 수 없으면 공장이 통째로 문을 닫는다는 것이 경영계의 오랜 하소연이었다.\n\n정부안은 정리해고 요건을 풀고 근로시간을 고를 폭을 넓힌다. 그 대신 실업급여와 재교육 지원을 늘린다. 우리는 브리핑에서 해고보다 이직을 쉽게 하려는 법이라고 거듭 설명했다. 긴급명령은 꺼내지 않았다. 노동부 장관을 지낸 이인제 총리가 국회를 거치는 길로 가자고 했다."
 tfrkphn.82.kp2:0 "발표가 나던 날 점심시간, 울산의 한 자동차 부품 공장 휴게실에서는 작업복 차림의 사람들이 텔레비전 앞에 둘러서 있었다.\n\n\"일하는 시간을 내가 정할 수 있으면 좋긴 하지.\"\n\"그게 되겠어? 결국 사장이 정하는 거지. 쉬운 해고가 쉬운 취업이 되는 걸 본 적 있어?\"\n\n한쪽 구석에서 커피를 내리던 하청업체 사장은 납품 단가부터 걱정했고, 노조 조끼를 입은 청년은 화면에 대고 웃기고 있네라고 했다.\n\n오후 1시 종이 울리자 사람들은 하던 말을 마저 하며 라인으로 돌아갔다."
 tfrkphn.83.kp:0 "대통령은 2021년 여름 공영방송을 민영화하겠다고 공약했다. 오늘 우리는 공영방송 지배구조 개편안과 함께 지분 매각 방침을 발표했다.\n\n공영방송은 국민의 수신료와 세금으로 운영된다. 그런데도 정권이 바뀔 때마다 사장이 바뀌어 왔고, 그때마다 누구 편이냐는 시비가 따라붙었다. 그 고리를 끊으려면 정부가 쥔 지분부터 내려놓아야 한다는 것이 우리의 설명이다. 매각 대금이 빠듯한 나라 살림에 보탬이 된다는 계산도 숨기지 않았다.\n\n반론도 만만치 않다. 민영화되면 광고와 시청률에 더 얽매일 것이라는 우려가 나왔고, 정치권이 인사권을 쥐는 지금보다는 낫다는 주장이 거기에 맞섰다."
 tfrkphn.83.kp2:0 "발표가 난 날 여의도의 한 방송사 로비에서는 이런 말이 오갔다.\n\n\"공영이라는 이름만 붙여 놓고 결국 누구 편이냐는 소리를 오랫동안 듣고 있잖아요.\"\n\"민영이 되면 뉴스가 돈 되는 쪽으로만 흘러갈 텐데, 재난방송 같은 건 누가 합니까.\"\n\n편집회의실 화이트보드에는 그날의 첫 꼭지 대신 '우리는 누구의 방송인가'라는 한 줄이 적혔고, 아무도 그것을 지우지 않았다.\n\n저녁 메인뉴스는 그 개편안을 아홉 번째 꼭지로 짧게 다뤘다."
 tfrkphn.85.desc:0 "대만해협의 포성이 서울까지 들려오기 시작한 날, 중앙선거여론조사심의위원회에 정부의 공문이 도착했습니다.\n\n\"전시에 여론은 무기가 됩니다. 적은 우리의 숫자를 보고 우리의 흔들림을 읽습니다.\"\n\n전쟁이 끝날 때까지 정당 지지율과 국정 지지도 조사의 공표가 금지되었습니다. 방송사들은 매주 내보내던 지지율 그래프를 내렸고, 야당은 '숫자가 무서운 정부'라며 거세게 반발했습니다.\n\n그러나 거리의 시민들은 지지율보다 내일의 뉴스를 더 걱정하고 있었습니다."
 tfrkphn.86.story:0 "§Y[자료화면] 1995년 11월 14일, 저녁 9시 뉴스§!\n\n\"김영삼 대통령과 중국 장쩌민 국가주석이 오늘 청와대에서 정상회담을 가졌습니다. 두 정상은 최근 일본 각료의 과거사 망언에 대해 강한 유감을 표시했습니다.\"\n\n\"앞서 에토 다카미 일본 총무청 장관의 발언이 파문을 일으켰습니다. 일본이 식민지 시절 한국에 좋은 일도 했다는 발언입니다.\"\n\n\"김 대통령은 공동 기자회견에서 강한 어조로 일본 정부를 비판했습니다. 이번에야말로 일본의 버르장머리를 고쳐놓겠다고 했습니다. 정부는 에토 장관의 해임을 거듭 촉구하고 있습니다. 한일 관계는 당분간 냉각될 전망입니다.\"\n\n국민들은 시원하다며 박수를 쳤다. 2년 뒤 외환위기가 닥쳤고, 제일 먼저 돈을 빼 간 게 일본계 자금이었다는 말이 돌았다. 그 뒤로 외교부에서는 화가 나도 계산기부터 두드리라는 말이 신입 교육 때마다 나왔다.\n\n30여 년이 지난 지금, 그 일본은 PDTO의 동맹국이 되어 대만해협에서 함께 싸웠다. 외교부 청사 1층에는 그날의 뉴스 화면과 대만해협의 연합 함대 사진이 나란히 걸렸다. 지나가던 젊은 사무관들은 두 사진 사이에서 한 번씩 걸음을 멈췄다."
 tfrkphn.87.story:0 "사내는 잠시 펜을 내려놓고 식은 차를 한 모금 마셨다. 창밖으로 북악산의 윤곽이 어둠 속에 검게 누워 있었다. 그는 다시 펜을 들었다.\n\n§Y보, 갚을 보.§!\n\n갚을 보에는 두 가지 뜻이 있다. 받은 은혜를 갚는 것, 그리고 저지른 잘못에 값을 치르게 하는 것.\n\n대만해협에 불이 붙었을 때, 국회는 대만지원법을 놓고 둘로 갈라졌다. 그는 끝까지 함께하겠다고 약속했고, 그 약속을 지켰다. 태극기를 단 구축함이 해협으로 들어갔다. 30여 년 전 명동에서 하룻밤 사이에 대사관의 문을 닫았다. 이번에는 광화문에서 그 문을 다시 열었다. 같은 시각 명동에서는 붉은 깃발과 노랫소리가 골목을 메웠다. 그는 광화문 쪽을 골랐다.\n\n대한민국은 PDTO의 정식 회원국이 되었다. 대만의 병사들은 금문의 바위섬에서 바다 건너 적룡의 빌딩 숲을 바라보았다. 그들은 이제 그 섬을 혼자 지키지 않았다. 부산과 요코하마와 가오슝과 시드니의 탱크에는 같은 기름이 채워졌다.\n\n김영삼이 시드니에서 외쳤던 세계화를, 그는 다시 꺼냈다. 이번에는 국익을 먼저 챙기고 세계는 그다음에 챙기는 순서를 지켰다. 인도와 손을 잡았고, 오디샤의 크롬이 바다를 건너왔다.\n\n부산의 유엔기념공원에 헌화하던 날이었다. 그는 70여 년 전 이 나라를 지키러 온 스물두 나라의 이름을 하나하나 불렀다. 폴란드의 그디니아 부두에는 K2가 내렸다. 그단스크의 담장을 넘었던 사람들이 그 전차를 맞았다. 보훈회관의 의자는 해마다 줄었지만, 남은 의자마다 국가유공자의 명패가 걸렸다.\n\n그리고 적룡에게는 저지른 만큼 값을 치르게 했다.\n\n풀을 맺어 은혜를 갚는다. 결초보은.\n\n마지막 글자 앞에서 사내의 펜이 오래 멈췄다.\n\n§Y국, 나라 국.§!\n\n전쟁에서 이기고 장사에서 지던 나라였다. 승전 보고서 옆에는 수출이 반 토막 난 통계표가 놓여 있었다. 중국이라는 가장 큰 시장의 문이 닫혔고, 성장률 전망은 한 줄이었다.\n\n그는 비상경제위원회를 만들고 위원장을 직접 맡았다. 매주 밤 열한 시까지 회의를 했다. 장관들에게 보고서 말고 대안을 가져오라고 했다.\n\n규제를 거꾸로 뒤집었다. 하지 말라는 것만 빼고 다 해도 되는 나라. 시흥의 금형공장 사장은 3년 묵힌 서류 봉투를 꺼냈다. 5년 만에 직원들과 삼겹살을 구웠다. 법인세를 낮췄다. 노조와 기자들은 비판했다. 여의도 순댓국집의 철물점 박씨는 누가 맞든 돈만 돌면 된다고 했다.\n\n반도체 다음에 먹고살 씨앗 일곱 개를 심었다. AI, 바이오, 메모리 반도체, 모빌리티, 우주, 수소와 원전, 콘텐츠. 3,500조 원의 잠자던 돈을 깨워 100조 원의 미래펀드로 보냈다. 노원의 퇴직 공무원은 예금의 절반을 그 펀드에 넣었다. 벽돌 한 장쯤은 되겠지 하면서.\n\n경남에서 했던 것처럼 나라의 빚을 갚았다. 줄일 것은 줄이고 지을 것은 지었다. 땅은 국가가, 집은 국민이 갖는 집을 지방 곳곳에 지었다. 서울시장과는 방송으로 말싸움을 했지만, 잘한 건 잘했다고 인정했다. 고리의 늙은 원전이 은퇴한 자리에는 젊은 원전이 들어섰다.\n\n전국 여섯 도의 건설사와 향토기업들이 제 고장에 공장을 짓고 길을 냈다. 경기의 반도체 단지에서 제주의 바다까지, 육각형의 여섯 꼭짓점이 하나씩 채워졌다.\n\n그리고 대한민국은 무너진 세계 위에서 선진국들의 탁자에 앉았다. 미국이 있을 때는 미국 덕에 컸다는 소리를 들었다. 미국이 없는데도 컸다. 이제 그런 말을 하는 사람은 없었다.\n\n네 글자를 다 짚고 나서, 사내는 펜을 내려놓았다. 진충보국. 백지 위의 네 글자가 스탠드 불빛 아래서 조용히 마르고 있었다."
 tfrkphn.88.story:0 "사내는 의자 등받이에 몸을 기댔다. 눈을 감자, 오래된 기억들이 차례로 떠올랐다.\n\n경남 창녕의 가난한 집 아들이었다. 일곱 살 무렵 가세가 기울어, 손수레에 세간을 싣고 이틀을 걸어 대구로 갔다. 월세가 싼 곳을 찾아 초등학교를 다섯 번 옮겼다. 도시락을 싸 가지 못해 수돗물로 배를 채운 날이 많았다. 아버지는 학교 문턱을 밟아 보지 못했고, 어머니는 글을 몰랐다. 아버지는 울산의 조선소에서 하룻밤 800원을 받는 야간 경비원으로 일했다.\n\n중학생 때는 직물공장에 다니던 누나의 월세방에 얹혀 살았다. 주인집이 불을 끄라고 하면 이불을 뒤집어쓰고 공부했다. 의사가 되고 싶었지만 학비가 없어 육군사관학교에 붙었다. 그러던 어느 날, 아버지가 억울한 누명을 쓰는 것을 보았다. 그는 진로를 바꿨다. 힘없는 사람이 억울한 일을 당하지 않게 하는 사람, 검사가 되기로 했다. 빚을 내 마련한 등록금을 들고 서울로 올라갔다.\n\n1982년, 사법시험에 붙었다. 아버지는 그 소식을 듣지 못했다. 그 전에 암으로 세상을 떠났다.\n\n1993년, 슬롯머신 사건을 맡았다. 6공화국의 황태자라 불리던 실세 의원과 고검장과 경찰청장이 줄줄이 구속되었다. 그 사건이 드라마 모래시계가 되었고, 사람들은 그를 모래시계 검사라고 불렀다. 그러나 검찰 안에서 그는 이단아였다. 버티지 못하고 옷을 벗었다.\n\n1996년, 김영삼의 부름을 받아 정치에 들어왔다. 서울에서 내리 네 번 국회의원이 되었고, 당 대표가 되었다가 다섯 달 만에 물러났다. 경남도지사가 되어 도의 빚을 갚았고, 대구시장이 되었다. 대선에서 떨어졌고, 공천에서 잘렸고, 무소속으로 다시 일어섰다. 어느 계파에도 속하지 않았다.\n\n수없이 넘어졌다. 그때마다 다시 일어났다. 사람들은 그를 독하다고 했고, 거칠다고 했고, 말이 험하다고 했다. 다 맞는 말이었다. 나랏일을 대충 한 적이 없다는 것만은 그도 자신 있었다.\n\n그는 눈을 뜨고 새 종이를 한 장 꺼냈다. 맨 위에 이렇게 적었다.\n\n'다음에 이 길을 걸을 사람에게.'\n\n그 사람이 누구일지 그는 몰랐다. 같은 당일지 아닐지도 몰랐다. 남자일지 여자일지, 서울 사람일지 지방 사람일지도 몰랐다. 언젠가 그 사람도 오늘 밤의 그처럼 된다. 자정이 넘은 이 방에 홀로 앉아 창유리에 비친 제 얼굴을 보게 된다.\n\n한참을 쓰고, 지우고, 다시 썼다. 종이 세 장이 구겨져 휴지통으로 들어갔고 마지막에는 몇 줄만 남았다.\n\n§Y국민을 두려워하십시오.§! 박수 칠 때보다 조용할 때를 살피십시오. 국민이 조용해지면 이미 늦은 거다.\n\n§Y약속은 적게 하고, 한 약속은 반드시 지키십시오.§! 나라와 나라 사이에서도, 대통령과 국민 사이에서도 마찬가지다. 대한민국이 대만과의 약속을 지켰기에 오늘 친구들이 곁에 있다.\n\n§Y적룡은 돌아온다.§! 우리가 이긴 것은 시간을 번 것일 뿐이다. 저들이 개혁을 하든 복수를 하든, 그 눈은 언제나 아시아를 향해 있을 것이다. 이 방에 앉은 첫날부터 그날을 준비하십시오.\n\n§Y그리고 청년을 믿으십시오.§! 낙동강에서 총을 든 것은 젊은 사람들이었다. 공장에서 밤을 새운 것도, 광장에서 독재를 끝낸 것도 그랬다. 이 나라를 여기까지 끌고 온 것은 늘 그들이었다.\n\n마지막 줄 아래에 그는 짧게 덧붙였다.\n\n이 자리는 외롭다. 그래도 이 책상에 먼저 앉았던 사람이 여럿 있다. 저도 그 가운데 하나다.\n\n그는 편지를 접어 봉투에 넣었다. 봉투에는 아무 이름도 쓰지 않았다. 책상 맨 아래 서랍을 열고, 그 안쪽 깊숙이 넣었다. 다음 사람이 이 책상에 앉는 첫날 밤에 찾게 될 자리였다.\n\n인터폰을 눌렀다. 퇴근하지 않고 버티던 비서실장이 들어왔다.\n\n\"아직 안 갔어?\"\n\n\"대통령님이 안 주무시는데 어떻게 갑니까.\"\n\n사내가 피식 웃었다.\n\n\"다음 주부터 일정 좀 바꿔. 젊은 사무관들, 젊은 장교들, 지방에서 기업 하는 젊은 사장들, 대학에서 공부하는 애들. 한 달에 한 번씩 밥 먹는 자리 만들어. 보고 받는 자리 말고, 내가 듣는 자리로.\"\n\n\"무슨 일 있으십니까?\"\n\n\"일은 무슨. 이 길이 나로 끝나면 안 되잖아. 걸을 사람을 키워 놔야지. 내가 30년 걸려서 배운 거, 그 사람들은 3년 만에 배우게 해 줘야 돼.\"\n\n비서실장이 고개를 숙이고 나갔다. 문이 닫히고, 방은 다시 조용해졌다.\n\n사내는 다시 창유리를 보았다.\n\n3년 전보다 머리는 더 희었고 주름은 더 깊었다. 그래도 그 얼굴이 싫지는 않았다.\n\n그는 스탠드 불을 껐다. 어둠 속에서 책상 위의 네 글자만 희미하게 남아 있었다."
 tfrkphn.89.story:0 "경기도 고양시, 킨텍스 전시장.\n\n국민의힘 제21대 대통령 후보 선출 전당대회. 1만 석의 객석이 당원들로 가득 찼다. 한쪽 객석에서는 이인제 이름이 적힌 피켓이, 반대쪽에서는 오세훈 이름이 적힌 피켓이 흔들렸다.\n\n한 달 전, 오세훈은 서울시장직에서 물러났다. 현직 시장은 대선에 나설 수 없다. 그는 사퇴 회견에서 서울에서 배운 걸 나라로 가져가겠다고 했다. 시청 직원들이 청사 앞에 줄지어 서서 그를 배웅했다.\n\n연설은 이인제가 먼저 했다.\n\n\"우리는 전쟁에서 이겼습니다. 적룡은 물러갔지만 돌아올 것입니다. 지금 키를 바꾸면 배가 흔들립니다. 홍준표 정부 5년의 길, 제가 끝까지 지키겠습니다.\"\n\n객석의 절반이 일어나 박수를 쳤다.\n\n이어서 오세훈이 연단에 올랐다.\n\n\"우리는 전쟁에서 이겼습니다. 그런데 국민들은 왜 웃지 않습니까? 장바구니는 무겁고, 아들은 아직 군에서 돌아오지 않았고, 집값은 여전히 높습니다. 승리는 지키겠습니다. 이제 그 승리 뒤의 삶을 바꿀 차례입니다.\"\n\n객석의 나머지 절반이 일어나 박수를 쳤다.\n\n당원 투표와 국민 여론조사가 합산되었다. 개표 화면의 숫자가 엎치락뒤치락했다. 결국 국민 여론조사가 승부를 갈랐다.\n\n대회장의 조명이 꺼졌다. 사회자가 봉투를 열었다.\n\n\"국민의힘 제21대 대통령 후보는...\""
