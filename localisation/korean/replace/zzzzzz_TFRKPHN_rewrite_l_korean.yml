 TFRKPHN_le_bio_g13:0 "£GFX_KOR_PPP_texticon §Y조배숙§!  도전\n§Y출생:§! 1956년 9월 10일, 전라북도 익산\n§Y학력:§!\n서울대학교 법학과\n§Y이력:§!\n1980년 사법시험에 합격했습니다(사법연수원 12기). 1982년\n서울지방검찰청 검사가 됐고 1986년부터 판사로 일했습니다. 1995년\n변호사로 개업했습니다. 2001년 비례대표로 제16대 국회의원이 됐고\n2004년과 2008년 익산시 을에서 당선됐습니다. 2012년 낙선했다가\n2016년 국민의당 후보로 익산시 을에서 다시 당선됐습니다. 2018년\n민주평화당 초대 대표를 맡았습니다.\n§Y눈에 띄는 일:§!\n1982년 검사로 임용될 때 우리나라 첫 여성 검사 가운데 한\n사람이었습니다.\n \n§Y이 세계에서는:§!\n여당의 전북도지사 후보입니다."
