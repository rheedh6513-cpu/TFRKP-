 TFRKPHN_le_bio_o9:0 "£GFX_KOR_DemocraticParty_texticon §Y김동연§!  현직\n§Y출생:§! 1957년 1월 28일, 충청북도 음성\n§Y학력:§!\n덕수상업고등학교, 국제대학(현 서경대학교), 서울대학교 행정대학원, 미국\n미시간대학교 정책학 박사\n§Y이력:§!\n1983년 경제기획원에서 공직을 시작했습니다. 2002년 세계은행\n선임정책관, 2008년 대통령비서실 경제금융비서관, 2010년 기획재정부\n예산실장, 2012년 기획재정부 제2차관을 지냈습니다. 2013년 초대\n국무조정실장, 2015년 아주대학교 총장을 맡았고 2017년 경제부총리\n겸 기획재정부 장관이 됐습니다. 2021년 9월 대통령 선거 출마를\n선언했습니다.\n§Y눈에 띄는 일:§!\n아버지를 일찍 여의고 청계천 판잣집과 천막촌에서 자랐습니다.\n상업고등학교를 졸업하기 전에 취업했고 야간대학을 다녔습니다.\n \n§Y이 세계에서는:§!\n2022년에 당선된 현직입니다."
 TFRKPHN_le_bio_o9v1:0 "£GFX_KOR_DemocraticParty_texticon §Y김동연§!  도전\n§Y출생:§! 1957년 1월 28일, 충청북도 음성\n§Y학력:§!\n덕수상업고등학교, 국제대학(현 서경대학교), 서울대학교 행정대학원, 미국\n미시간대학교 정책학 박사\n§Y이력:§!\n1983년 경제기획원에서 공직을 시작했습니다. 2002년 세계은행\n선임정책관, 2008년 대통령비서실 경제금융비서관, 2010년 기획재정부\n예산실장, 2012년 기획재정부 제2차관을 지냈습니다. 2013년 초대\n국무조정실장, 2015년 아주대학교 총장을 맡았고 2017년 경제부총리\n겸 기획재정부 장관이 됐습니다. 2021년 9월 대통령 선거 출마를\n선언했습니다.\n§Y눈에 띄는 일:§!\n아버지를 일찍 여의고 청계천 판잣집과 천막촌에서 자랐습니다.\n상업고등학교를 졸업하기 전에 취업했고 야간대학을 다녔습니다.\n \n§Y이 세계에서는:§!\n야당의 경기도지사 후보입니다."
 TFRKPHN_le_bio_o9v2:0 "£GFX_KOR_DemocraticParty_texticon §Y추미애§!  현직\n§Y출생:§! 1958년 10월 23일, 경상북도 달성군 다사면\n§Y학력:§!\n한양대학교 법학과, 연세대학교 경제대학원 경제학 석사\n§Y이력:§!\n춘천지방법원과 광주고등법원 등에서 판사로 일했습니다. 1996년 제15대\n총선에서 처음 국회의원에 당선됐고 2016년까지 다섯 번 당선됐습니다.\n더불어민주당 대표를 지냈고, 문재인 정부에서 제67대 법무부 장관을\n맡았습니다.\n \n§Y이 세계에서는:§!\n야당의 경기도지사 후보입니다. 2026년 지방선거에서 당선돼 지금 이\n자리를 맡고 있습니다."
 TFRKPHN_le_chipm_tt:0 "§Y전남광주통합특별시장§!\n광주와 전남이 합쳐져 한 사람을 뽑습니다.\n£GFX_KOR_PPP_texticon 이정현  대  £GFX_KOR_DemocraticParty_texticon 민형배\n여당 후보 지지 [?TFRKPHN_le_v14|0]\n누르면 이 자리를 고릅니다."
 TFRKPHN_lee_chaebol_category_desc:0 "전쟁 특수로 몸집을 불린 재벌을 바로잡습니다. 개혁 하나를 통과시킬 때마다 경영계의 신뢰가 내려가고 재계의 저항이 오릅니다. 저항이 60에 닿으면 여론전이나 간담회로 먼저 가라앉혀야 다음 개혁을 할 수 있습니다. 타협 단추를 켜면 저항이 높아도 통과시킬 수 있지만 효과가 절반입니다. 정경유착 수사를 지시하면 재계의 저항이 내려갑니다."
 TFRKPHN_lee_in_je_a1_desc:0 "충청은 오래 대통령을 꿈꿨습니다. 김종필도, 이회창도, 반기문도, 안희정도, 이인제 자신도 문턱에서 멈췄습니다. 영남과 호남이 맞붙는 동안 충청은 승부를 가르는 표였을 뿐 주인공이 된 적이 없었습니다. 이제 논산 사람이 청와대에 앉았습니다. 1997년 첫 출마 때부터 그는 지역 갈등을 푸는 대통령이 되겠다고 말해 왔습니다."
 TFRKPHN_lee_in_je_b01_01_desc:0 "30년 넘게 기다린 첫 출근."
 TFRKPHN_lee_in_je_b1_desc:0 "1993년, 마흔넷의 노동부 장관은 파업 노동자의 생계비 문제로 재계와 맞섰습니다. 그해 고용보험 도입도 이끌었습니다. 장관 자리는 열 달 만에 끝났지만, 그는 그 뒤로 어디서든 일자리가 최고의 복지라는 말을 입에 달고 다녔습니다. 이제 그 말을 지켜야 할 자리에 앉았습니다."
 TFRKPHN_lee_in_je_g3b_desc:0 "노래 굳세어라 금순아는 1950년 12월 흥남 부두에서 금순이와 헤어져 홀로 남쪽에 온 피란민의 이야기입니다. 부산 국제시장에서 장사를 하며 살아가는 그는 영도다리 난간에 서서 고향과 금순이를 그리워하고, 통일이 되는 날 다시 만나 얼싸안고 춤을 추자고 다짐합니다.\n\n그 다짐을 이루지 못하고 떠난 사람이 많았습니다. 이제 나라가 돌아오지 못한 사람들의 이름을 끝까지 찾습니다."
 TFRKPHN_lee_myoung_su_IM_desc:0 "출생: 1955년 대한민국\n\n이력: 대한민국의 행정안전부 장관\n이명수는 1978년 제22회 행정고시에 합격했습니다. 1993년 충청남도 금산군수를 지냈고, 2001년부터 2004년까지 충청남도 행정부지사로 일했습니다. 2008년 자유선진당 후보로 충남 아산에서 처음 당선되었습니다. 제21대까지 네 번을 내리 이겼습니다. 국회 보건복지위원장을 지냈습니다.\n\n이인제와는 선진통일당에서 같은 당 의원이었습니다. 2012년 8월 이명수는 당을 떠나 새누리당으로 갔습니다. 당 대표이던 이인제가 전날 만나 말렸지만 소용없었습니다. 대통령이 된 이인제는 그 일을 따지지 않았습니다. 지방 행정을 군수부터 해 본 사람이 필요했습니다."
 TFRKPHN_lee_nk_category_desc:0 "위의 단추로 북한과 남한을 바꿔 봅니다. 북한 쪽에서는 체제를 흔들고, 남한 쪽에서는 우리 군의 전비 태세를 올립니다. 전비 태세가 오를수록 북한 육군 보기에 작전도가 그려집니다.\n\n북한 주민이 체제에서 돌아서야 체제가 바뀝니다. 민간은 지역마다 이반도를, 군은 군단마다 동요를 끌어올립니다. 민간과 군은 쓰는 수단이 다릅니다.\n\n§Y민간 평균 이반도§!가 오를수록 한국은 안정도(최대 §G+10%§!), 전쟁 지지도(§G+15%§!), 정치력 획득(§G+15%§!)을 얻고, 북한은 안정도와 전쟁 지지도를 잃습니다(최대 §G-20%§!).\n§Y민간 평균 이반도§!가 §Y75§!을 넘으면 북한에 국민정신 §R총체적 붕괴§!가 붙습니다.\n§Y육군, 공군, 해군의 동요§!가 오를수록 북한의 그 군종이 약해집니다. 동요가 35을 넘으면 전차, 전투기, 함정이 넘어옵니다."
 TFRKPHN_lg_130_a:0 "국회 본회의장 전광판에 찬성 [?TFRKPHN_amend_yes|0]표가 떴다. 재적 3분의 2를 넘긴 순간 한쪽 의석에서 박수가 터졌다. 개헌안이 가결됐다.\n\n본회의장 밖 복도에서 여야 의원들이 엇갈려 지나갔다. 찬성한 의원들은 기자들 앞에 섰고 반대한 의원들은 엘리베이터 쪽으로 걸어갔다. 찬성표를 던졌다는 걸 굳이 숨기지 않는 야당 의원도 몇 있었다.\n\n이제 국민투표가 남았다. 투표권자 과반이 투표하고 그 과반이 찬성해야 새 헌법이 된다. 정무수석실은 그날 밤 시도별 여론조사 표를 다시 꺼내 펼쳤다. 국회 표결과 달리 국민투표에서는 지역마다 찬반이 크게 갈릴 거라는 보고가 먼저 올라와 있었다."
 TFRKPHN_lg_130_b:0 "이튿날 아침 중앙선거관리위원회가 국민투표 공고 준비에 들어갔다. 투표용지에 넣을 문구를 두고 법제처와 선관위 실무자들이 밤늦도록 씨름했다. 문장이 한 군데 바뀔 때마다 몇 사람이 돌려 가며 다시 읽었다.\n\n거리의 시민들은 아직 실감이 나지 않았다. 1987년 이후 처음 있는 개헌이 코앞까지 와 있었다. 그날 밤 정부는 국민투표 홍보 예산을 따로 짜겠다고 발표했고, 야당은 그 돈이 찬성 운동에 쓰일 거라며 눈을 떼지 않겠다고 했다."
 TFRKPHN_lg_131_a:0 "개헌안은 끝내 재적 3분의 2를 넘지 못했다. 찬성은 [?TFRKPHN_amend_yes|0]표에 그쳤고 본회의장을 나서는 여당 의원들 얼굴이 어두웠다.\n\n개헌을 이끌어 온 여당 원내대표는 표결이 끝나자마자 기자들에게 둘러싸였다. 몇 달 동안 야당 의원들을 하나하나 찾아다니고도 왜 졌느냐는 질문에 그는 다음에 다시 하겠다고만 했다.\n\n그날 저녁 야당은 개헌 자체에는 찬성하며 이번 정부 안에 반대했을 뿐이라는 짧은 논평을 냈다. 여당 대변인은 그럼 다음 정부 안에는 찬성하겠느냐고 되받았다."
 TFRKPHN_lg_131_b:0 "그날 밤 정무수석은 개헌 서류를 상자에 담아 문서고로 보냈다. 상자 겉에는 보류 두 글자만 적었고, 상자는 문서고 맨 위 선반에 올라갔다. 개헌을 약속했다가 접은 역대 정부 명단에 이 정부도 한 줄을 보탰다.\n\n몇 주 뒤 한 신문 여론조사에서 개헌 자체에 찬성한다는 답은 여전히 절반을 넘었다. 국회가 거부한 건 이번 안이었을 뿐이라는 해석이 뒤따랐다. 국회 사무처는 그날 표결 기록을 의사록에 빠짐없이 남겼다."
 TFRKPHN_lg_132_a:0 "헌법개정특별위원회가 정부통령제 조항을 확정했다.\n\n다음 대선부터 대통령 후보는 부통령 후보와 한 표로 묶여 나온다. 부통령은 대통령이 자리를 비우면 그 권한을 넘겨받고, 평소에는 국무총리가 하던 일을 맡으면서 상원 의장을 겸한다. 국민이 직접 뽑지도 않은 총리가 대통령 권한을 대신하는 일은 이제 없다.\n\n막판까지 쟁점으로 남은 건 총리 자리였다. 한 위원이 총리를 없애면 내각은 누가 챙기느냐고 묻자 다른 위원이 그러라고 부통령을 뽑는 거라고 받았다."
 TFRKPHN_lg_132_b:0 "부통령 후보를 누구로 세울지를 두고 각 당은 벌써 셈을 시작했다. 같은 지역 출신 둘을 세우면 표가 넓어지지 않는다. 영남 후보라면 호남이나 충청 출신을, 수도권 후보라면 지방 출신을 찾을 거라는 분석이 신문마다 실렸다.\n\n총리실 직원들은 일은 그대로고 결재란 이름만 바뀐다며 담담했다. 한 국장은 서랍에서 직제표를 꺼내 맨 위 칸에 연필로 새 직함을 적어 봤다. 그날 저녁 특위 회의록은 손대지 않은 채 국회 홈페이지에 올라갔다."
 TFRKPHN_lg_133_a:0 "헌법재판소 대심판정에서 마지막 선고가 끝났다. 결정문을 다 읽은 재판관들은 조용히 법정을 나갔다. 헌법재판 권한은 대법원 헌법재판부로 넘어가고, 새로 늘린 대법관 네 명이 그 자리를 채운다. 정당 해산 심판과 탄핵 심판도 이제 대법원 몫이다. 1987년 헌법이 만든 기관 하나가 이렇게 문을 닫았다.\n\n이 조문은 국회 재적 3분의 2의 찬성과 국민투표를 거쳐 바뀌었다. 끝까지 반대표를 던진 야당 의원 몇은 마지막 선고 날 방청석에 앉아 있었다.\n\n1988년 문을 연 뒤로 헌법재판소는 정부가 진 사건을 적잖이 남겼다. 대법원이 그 일을 이어받아 정부를 지게 만들 수 있겠느냐는 질문이 대통령실에도 들어왔다. 대통령은 지게 하라고 만든 자리라고 답했다.\n\n법조계 반응은 엇갈렸다. 법률 판단과 헌법 판단이 한곳에서 나오니 앞뒤가 맞아진다고 반기는 사람이 있었고, 대법원에 힘이 너무 몰린다고 걱정하는 사람도 많았다.\n\n마지막 방청객들이 나가자 직원들이 법대 뒤 휘장을 걷어 냈다. 휘장은 상자에 담겨 국가기록원으로 갔다."
 TFRKPHN_lg_134_a:0 "과천 정부청사에서 고위공직자범죄수사처 현판이 내려왔다.\n\n출범 때부터 성과를 두고 말이 끊이지 않던 조직이다. 남은 사건 기록은 상자에 담겨 국가수사국 준비단으로 넘어갔다. 대통령 친인척과 고위공직자를 지켜볼 특별감찰관은 새로 임명되며, 그 자리는 국회 추천을 거쳐 채운다.\n\n공수처 직원 상당수는 국가수사국으로 옮겼다. 몇은 원래 있던 검찰과 경찰로 돌아갔고 몇은 아예 그만뒀다.\n\n야당은 정부가 자기를 겨눌 칼부터 치웠다고 몰아붙였다. 여당은 같은 칼이 두 자루일 필요는 없다고 맞받았다. 특별감찰관 후보 추천은 국회에 맡기기로 했지만 야당이 추천에 참여할지는 아직 정해지지 않았다.\n\n몇 주 뒤 과천 청사의 그 층에는 다른 부처가 들어왔다. 특별감찰관실 현판은 그다음 주 다른 건물 입구에 걸렸다."
 TFRKPHN_lg_135_a:0 "국회가 공직선거법 개정안을 통과시켰다.\n\n다음 총선부터 한 선거구에서 두 명에서 네 명까지 의원을 뽑는다. 한 표라도 더 얻은 후보가 다 가져가던 승자독식이 깨지면서 영남에서 민주당 의원이, 호남에서 국민의힘 의원이 나올 길이 열렸다. 여의도에서는 벌써 선거구 지도를 펴 놓고 계산기를 두드린다.\n\n정당마다 획정안을 놓고 밤샘 회의가 이어졌다. 한 선거구에서 여럿을 뽑으니 같은 당 후보끼리 붙는 일도 생긴다. 현역 의원들은 자기 이름이 몇 번째에 오르는지부터 물었다."
 TFRKPHN_lg_135_b:0 "영남의 민주당 지역위원장들과 호남의 국민의힘 당협위원장들은 모처럼 기대에 부풀었다. 수십 년 동안 두 번째에 머물던 표가 이제 한 석이 될 수 있다. 그날로 사무실 간판을 새로 단 사람도 있었다.\n\n반대도 만만치 않았다. 작은 정당들은 비례대표가 줄어든다며 들고일어났고, 한 시민단체는 거대 양당이 한 선거구를 나눠 먹게 될 수 있다고 경고했다. 획정위원회가 그 주에 잡은 첫 공청회에는 예상보다 훨씬 많은 사람이 몰렸다."
 TFRKPHN_lg_136_a:0 "중앙선거관리위원회 개편안이 확정됐다. 선관위는 국가 선거와 정당 사무만 맡고, 그동안 넓혀 온 위탁 선거 업무는 내려놓는다. 감사원과 특별감찰관의 외부 감사가 정례화되고 투표와 개표 전 과정이 공개된다.\n\n위원을 뽑는 방식은 건드리지 않았다. 대통령과 국회, 대법원장이 세 명씩 정하는 지금 틀이 그대로 남는다. 감사가 정부의 손이 되면 안 된다는 야당 요구도 받아들여 감사 결과는 국회에 먼저 보고하게 했다.\n\n채용 비리로 얼룩졌던 조직에 처음으로 바깥의 눈이 들어간다. 선거 때마다 되풀이되던 결과 논란도 얼마간 잦아들 것으로 보인다. 개표 참관인 수도 정당마다 두 배로 늘어난다.\n\n개편안을 받은 날 오후 선관위 사무처가 내부 회의를 열었다. 바깥에서 감사를 받는 게 못마땅하다는 직원이 있었고, 이제야 의심을 덜게 됐다며 반기는 직원도 있었다. 사무총장은 회의를 마치며 숨길 게 없다는 걸 보여 주면 된다고만 했다.\n\n다음 선거부터 개표소 안의 모든 과정은 영상으로 남아 공개된다. 첫 외부 감사 결과는 반년 뒤 국회로 올라간다."
 TFRKPHN_lg_137_a:0 "국가수사국이 공식 출범했다.\n\n경찰과 여러 기관에 흩어져 있던 수사 기능이 한 지붕 아래로 모였다. 초대 국장은 출범식에서 정치 사건이라고 더 세게 하지도, 더 약하게 하지도 않겠다고 했다. 수사 중립을 지킬 외부 감시 위원회도 함께 꾸려졌다. 기자들은 그 말을 받아 적으면서도 첫 사건이 뭐가 될지에 더 관심을 뒀다.\n\n출범식이 끝나고 수사관들은 새 신분증을 받았다. 경찰청과 공수처, 관세청과 국세청에서 온 사람들이 한 층 한 사무실에 앉았다. 첫 주에는 저마다 쓰던 서류 양식이 달라서 결재 하나 받는 데도 한참 걸렸고, 점심마다 예전 직장 얘기로 식당이 시끄러웠다.\n\n검찰은 조용했다. 수사권 일부를 내준 검찰 안에서는 국가수사국이 결국 정부 손이 될 거라는 말이 돌았다. 국가수사국은 대꾸하지 않고 외부 감시 위원회 첫 회의 날짜만 발표했다. 야당은 첫 사건이 정부 쪽을 겨누는지 지켜보겠다고 했다.\n\n출범 석 달 뒤 국가수사국이 첫 공개 사건을 내놓았다. 기자들은 발표문을 받자마자 피의자가 어느 쪽 사람인지부터 찾았다."
 TFRKPHN_lg_138_a:0 "청와대 영빈관에서 개헌위원회 출범식이 열렸다.\n\n여야가 추천한 위원들과 헌법학자들이 한자리에 모였다. 역대 정부는 개헌을 약속해 놓고 집권하면 미뤘다. 좌우는 서로를 믿지 못했고 권력 구조를 두고 셈법이 엇갈렸다. 위원장은 첫 회의에서 그 세 가지를 차례로 짚은 다음, 회의록을 하나도 빼지 않고 국민에게 공개하겠다고 약속했다. 특정 진영에 유리한 헌법이라는 말이 나오는 순간 이 위원회는 실패한 거라는 말도 했다.\n\n출범식이 끝나자 위원들은 영빈관 옆 회의실에 다시 모여 회의 날짜부터 정했다. 여당 추천 위원은 빨리 끝내자고 했다. 야당 추천 위원은 서두르면 반쪽짜리가 된다고 했다. 위원장은 두 사람 말을 다 받아 적은 뒤 첫 반년은 국민 의견을 듣는 데 쓰자고 정리했다.\n\n첫 회의록은 그 주 금요일 오후 인터넷에 올라갔다. 첫날 조회 수는 기대에 한참 못 미쳤다. 기자들조차 몇 줄 읽다 말았다는 말이 나왔지만 위원장은 공개를 멈추지 않겠다고 했다. 둘째 주 회의록은 첫 주보다 두 배 길었고 조회 수도 조금 늘었다."
 TFRKPHN_lg_230_a:0 "대만해협 포성이 멎고 며칠 뒤, 중앙선거여론조사심의위원회가 전시 여론조사 공표 금지를 풀었다.\n\n여론조사 회사들은 기다렸다는 듯 전화를 돌렸다. 전쟁 동안 묻어 두었던 물가와 일자리와 집값 얘기가 숫자로 다시 쏟아졌다.\n\n첫 조사가 나온 날 아침, 정무수석실 막내 행정관이 출근하자마자 결과표를 뽑았다. 전쟁 내내 그는 이런 표를 본 적이 없었다. 대통령 지지율은 높게 나왔다. 그런데 바로 아래, 지금 가장 걱정되는 게 무엇이냐는 질문에서는 물가와 집값이 전쟁보다 위에 올라 있었다."
 TFRKPHN_lg_230_b:0 "방송사들은 저녁 뉴스에 그래프를 다시 띄웠다. 전쟁 전 마지막 조사와 이번 조사를 나란히 놓았는데 그 사이 두 해는 빈칸으로 비어 있었다. 앵커는 그 빈칸을 가리키며 전쟁 동안 묻지 못한 숫자라고 설명했다.\n\n야당은 첫 조사를 두고 승전 효과는 오래가지 않는다고 논평했다. 여당 대변인은 숫자는 숫자일 뿐이라고 받았다. 전쟁은 이겼어도 이제부터는 매주 나오는 숫자와 싸워야 한다. 그날 국회 식당에서 의원들은 오랜만에 여론조사 얘기를 반찬 삼아 점심을 먹었다."
 TFRKPHN_lg_241_a:0 "개정 헌법 제70조에 따른 첫 중임 대선이 끝났다.\n\n네 해 전과는 달리 이번 투표용지에는 현직 대통령 [Root.GetLeader]의 이름이 다시 올랐다. 선거는 사실상 지난 네 해를 두고 매기는 성적표였고, 국민은 한 번 더 맡겨 보기로 했다.\n\n선거운동 내내 야당은 네 해 동안 오른 집값과 물가, 전쟁 빚을 내밀었다. 여당은 같은 네 해 동안 늘어난 일자리와 수출, 끝난 전쟁을 내밀었다. 유권자들은 두 쪽 계산서를 다 받아 들고 투표소에 갔다."
 TFRKPHN_lg_241_b:0 "개표가 끝난 새벽에 당선 확정 소식이 나왔다. 투표소마다 처음 보는 풍경이 있었다. 현직 대통령 이름 옆에 도장을 찍던 사람들 상당수는 이 사람을 고를 수 있는 게 이번이 마지막이라는 걸 알고 있었다.\n\n대통령실은 들뜨지 않았다. 비서실장은 직원들에게 축하는 하루만 하자고 했다. 회의실 벽에는 벌써 남은 네 해 일정표가 붙어 있었다.\n\n이번 임기가 마지막이다. 다음 대선에는 다시 나설 수 없다. 이튿날 아침 신문들은 하나같이 마지막 네 해라는 제목을 달았다."
 TFRKPHN_lg_245_a:0 "현직 대통령 [Root.GetLeader]는 헌법에 막혀 이번 대선에 나설 수 없었다. 보수 진영의 깃발을 누가 넘겨받느냐를 두고 여당은 일찍부터 셈이 바빴다.\n\n경선은 생각보다 싱겁게 끝났다. 다른 주자들은 첫 토론회가 끝나자 하나둘 물러섰다. 이인제가 홍준표가 걸어온 길을 함께 걷겠다고 하자 당원들은 표를 몰아줬다. 양안전쟁과 그 뒤 힘든 시절을 같이 버틴 정부를 굳이 바꿀 까닭이 없다고 본 것이다."
 TFRKPHN_lg_245_b:0 "본선 내내 그는 지난 정부가 이룬 것을 지키고 이어 가겠다는 말을 되풀이했다. 유세장에는 홍준표 정부 장관들이 번갈아 올라왔다. 상대 진영은 그의 나이와 긴 정치 이력을 물고 늘어졌다. 그때마다 그는 쓰러졌다가 다시 일어선 경험이 자기 밑천이라고 받아넘겼다.\n\n개표가 끝난 새벽, 이인제의 당선이 확정됐다. 1997년 첫 도전 뒤로 서른 해 만이다. 영남과 충청에서 고르게 이겼고 수도권에서도 크게 밀리지 않았다.\n\n취임식 날 그는 국회 앞마당에서 오른손을 들고 헌법 선서를 했다. 취임사는 앞 정부가 시작한 일을 끝까지 해내겠다는 다짐으로 끝났다. 보수 정권은 그대로 이어지고 대통령 이름만 바뀌었다."
 TFRKPHN_lg_250_a:0 "참으로 암흑의 날이다! 현지지도에 나선 경애하는 지도자께서 괴한의 습격을 받고 끝내 서거하셨다. 호위사령부는 범인이 누구인지조차 밝혀내지 못했다.\n\n조선중앙방송은 오후 내내 장송곡을 틀었고 평양 거리 확성기에서도 같은 곡이 되풀이됐다. 광장에 모인 사람들이 울었다. 누가 진심으로 울고 누가 우는 시늉을 하는지 서로 묻는 사람은 없었다. 그날은 묻는 일이 가장 위험했다.\n\n열흘 동안의 애도 기간이 선포됐다. 장례위원회 명단이 발표되자 간부들은 순서부터 훑었다. 누구 이름이 앞에 놓였고 누구 이름이 빠졌는지를 보면 앞으로 권력이 어디로 갈지 보였다."
 TFRKPHN_lg_250_b:0 "그런데 명단에 이상한 데가 있었다. 장례위원장 자리가 비어 있었다. 아무도 먼저 그 자리에 앉으려 하지 않았고, 그렇다고 남에게 내주려는 사람도 없었다.\n\n애도 기간 첫날 밤 평양 외곽 몇몇 부대가 이동 명령을 받았는데, 누가 내린 명령인지는 끝내 확인되지 않았다. 평양의 권력자들은 벌써 서로를 노려보고 있다.\n\n국경 너머 단둥 상인들은 그날 밤 장사를 일찍 접었다. 강 건너 방송이 끊길 때마다 라디오를 껐다 켜기를 되풀이하며 밤을 새웠다."
 TFRKPHN_lg_252_a:0 "북한 내전 사흘째, 평양에 맞선 자유조선군이 이북5도위원회 아래로 들어가겠다고 선언했다.\n\n이북5도위원회는 대한민국 정부 기구다. 헌법이 대한민국 영토로 정한 황해, 평안남북, 함경남북 다섯 도를 맡아 왔다. 칠십 년 넘게 이름뿐이던 도지사 자리가 마침내 실제 땅을 갖게 됐다. 위원회 수장으로는 북한 외교관 출신인 태영호가 추대됐다."
 TFRKPHN_lg_252_b:0 "그날 밤 서울 구기동 이북5도위원회 청사는 불이 꺼지지 않았다. 명예직으로만 여겨지던 도지사 사무실마다 처음으로 전화가 쉬지 않고 울렸다. 청사 앞에는 실향민 단체 노인들이 고향 이름을 적은 깃발을 들고 모였다. 평안북도 정주가 고향이라는 한 노인은 죽기 전에 도청 문을 열고 들어가 보고 싶다고 했다.\n\n국방부와 통일부는 자유조선군에 무엇을 얼마나 보낼지 밤새 회의를 이어 갔다. 서류상으로 대한민국은 아직 북한 내전에 끼어들지 않았다. 그렇지만 자유조선군이 대한민국 정부 기구 이름을 내건 순간부터 그 선은 흐려지기 시작했다.\n\n같은 날 중국은 평양 정권을 사실상 보호국으로 삼았다."
 TFRKPHN_lg_253_a:0 "한반도 내전이 끝내 대한민국과 중화인민공화국의 정면충돌로 번졌다.\n\n북한의 두 정권 뒤에 서 있던 서울과 베이징이 서로에게 총구를 겨눴다. 일본과 태평양방위조약기구 회원국들이 전쟁에 뛰어들고 있고, 중국이 이끄는 동아시아방위구상 회원국들도 뒤따른다.\n\n첫 포성은 압록강 하구에서 울렸다. 평양을 돕던 중국군 부대와 북쪽으로 올라가던 국군 선발대가 신의주 남쪽에서 맞닥뜨렸다는 보도가 잇따랐다. 몇 시간 뒤 서해에서는 두 나라 함정이 서로를 향해 경고 사격을 했다.\n\n도쿄는 곧장 각료 회의를 열고 태평양방위조약기구 공동 방위 조항을 발동했다. 베이징은 한국이 먼저 국경을 넘었다고 주장했다. 서울은 대한민국 헌법이 정한 영토 안에서 벌어진 일이라고 맞섰다.\n\n세계 증시는 문을 열자마자 곤두박질쳤다. 아시아 해운 보험료는 하루 만에 두 배 넘게 뛰었다. 브뤼셀이 당장 교전을 멈추라는 성명을 냈지만 귀 기울이는 쪽은 없었다.\n\n양안전쟁이 끝나고 몇 해 지나지 않아 아시아가 다시 불길에 휩싸였다. 사람들은 이 전쟁을 대아대전이라고 부르기 시작했다."
 TFRKPHN_lg_254_a:0 "경애하는 지도자가 쓰러지고 이레가 지났지만 평양은 끝내 하나로 뭉치지 못했다.\n\n당 조직을 손에 쥔 김여정이 평양에서 정통 정부를 선포했다. 군부를 장악한 최룡해는 동북부 부대를 이끌고 평양의 명령을 거부했다. 서북부에서는 체제에 등을 돌린 장교와 주민들이 자유조선군 깃발을 올렸고, 평양 한복판에서도 시민과 일부 군인이 인민봉기위원회를 세웠다.\n\n조선은 넷으로 쪼개졌다. 먼저 물러서겠다는 쪽은 어디에도 없다."
 TFRKPHN_lg_254_b:0 "국가정보원 상황실 대형 화면에 북녘 지도가 네 가지 색으로 칠해졌다. 색은 하루에도 몇 번씩 바뀌었다. 한 분석관은 같은 부대가 오전에는 평양 편이었다가 오후에는 군부 편으로 돌아섰다고 보고했다. 보고서 끝에는 이 내전에서 제일 먼저 무너지는 게 명령 체계라고 적었다.\n\n휴전선 우리 초소에서는 밤마다 북쪽 하늘에 섬광이 번쩍였다. 경계를 서던 한 상병은 근무 일지에 오늘 밤 북쪽에서 포성이 세 번 들렸다고 썼고, 아래 칸에 우리 쪽에서는 아무도 쏘지 않았다고 덧붙였다.\n\n서울의 실향민 단체에는 북녘 가족 소식을 묻는 전화가 쏟아졌지만 직원들도 대답할 말이 없었다."
 TFRKPHN_lg_255_a:0 "김정은이 죽은 뒤 조선은 세 갈래로 찢어졌다. 평양에서는 김여정이 백두혈통을 내세워 당과 정부를 붙들고 있다. 최룡해는 조선인민군 군사위원회를 앞세워 군부를 쥐었다. 남조선의 지원을 받는 이북5도위원회는 북쪽으로 밀고 올라오는 중이다.\n\n압록강 건너의 혼란은 이제 남의 일이 아니다. 조선이 남조선과 일본 손에 넘어가면 우리의 완충지대는 사라진다. 중앙이 결단을 내려야 할 때다."
 TFRKPHN_lg_255_b:0 "단둥 국경 검문소에는 강을 건너오려는 피란민이 날마다 늘어난다. 국경 수비대는 돌려보내라는 명령과 받아들이라는 명령을 하루 사이에 번갈아 받았다. 베이징의 방침이 아직 하나로 모이지 않았다는 뜻이다.\n\n중앙군사위원회 회의실에 보고서 두 건이 올라왔다. 한 건은 백두혈통을 지켜야 조선 인민이 따라온다고 했다. 다른 한 건은 내전은 총을 쥔 쪽이 이기는 싸움이니 군부와 손잡아야 전선을 빨리 닫을 수 있다고 했다. 두 보고서는 같은 숫자를 놓고 정반대로 읽었다.\n\n백두혈통의 정통성을 지킬 것인가, 총을 쥔 군부와 손을 잡을 것인가?"
 TFRKPHN_lg_256_a:0 "자유조선군이 이북5도위원회로 이름을 바꾸고 대한민국 정부와 손을 잡은 다음 날, 자유조선군이 지켜 온 개성에 국군이 들어갔다. 개성은 고려의 옛 수도이고 6.25 전까지 대한민국 땅이었다. 1950년 겨울에 물러난 뒤로 칠십여 년 만에 국군이 그 땅을 다시 밟았다.\n\n장병들이 개성공단 빈 공장 앞에서 태극기를 흔드는 모습이 전국에 생중계됐다. 실향민들은 텔레비전 앞에서 울음을 터뜨렸다. 국방부는 개성을 대한민국 영토로 선포하고 이 지역 행정 절차에 들어갔다고 밝혔다."
 TFRKPHN_lg_256_b:0 "개성공단에서 공장을 돌렸던 남쪽 기업인 몇은 그날 오후 국방부에 전화를 걸어 자기 공장이 아직 서 있느냐고 물었다. 국방부가 공장 몇 곳 사진을 보내 줬다. 녹슨 재봉틀이 줄지어 선 작업장 사진을 받은 한 사장은 그 사진을 휴대전화 배경 화면으로 바꿨다.\n\n개성 주민들은 처음 며칠 집 밖으로 나오지 않았다. 사흘째 되던 날 국군 보급 트럭이 쌀을 내리자 한 노인이 먼저 다가왔다. 노인이 국군 장교에게 고맙다고 하자 장교도 같은 말로 답했다. 국군은 지금 개성 북쪽에 다음 진지를 파고 있다."
 TFRKPHN_lg_258_a:0 "평양 인민봉기위원회가 이북5도위원회에 합류했다. 봉기를 이끈 박현준은 휴전선을 넘어 대한민국으로 귀순했다. 오래전 제 발로 북녘에 건너갔던 그가 평양 봉기를 이끈 자유투사가 되어 고향 땅으로 돌아온 것이다.\n\n통일부는 귀순 사실을 확인하고 관계기관 합동신문에 들어갔다고 밝혔다. 평양에서 멸공의 횃불을 들었던 그가 남녘에서 무엇을 하게 될지는 아직 알려지지 않았다."
 TFRKPHN_lg_258_b:0 "그는 새벽 네 시에 휴전선을 넘었다. 마중 나온 국군 수색대가 그의 배낭을 열어 보니 봉기위원회 명단과 평양 시내 지도, 오래된 남쪽 주민등록증 한 장이 들어 있었다. 수색대장은 주민등록증 사진과 그의 얼굴을 한참 번갈아 들여다봤다.\n\n귀순 소식이 알려지자 남쪽 여론은 둘로 갈렸다. 영웅이 돌아왔다며 반기는 목소리 옆에서, 한때 북을 택했던 사람을 어디까지 믿겠느냐는 물음도 나왔다.\n\n합동신문은 오래 걸릴 것이다. 그가 가져온 명단에 적힌 사람들은 아직 평양에 남아 있다. 그날 저녁 그의 옛 고향 마을 사람들은 뉴스 화면에 나온 얼굴을 알아보려고 텔레비전 앞으로 바짝 다가앉았다."
 TFRKPHN_lg_271_a:0 "청와대에 두 달째 불이 꺼져 있는 방이 하나 있다. 문패에는 국가안보실장이라고 적혀 있다.\n\n실장 자리가 비어 아침 보고는 차장이 대신 올린다. 그는 보고를 마치고 서류철을 덮을 때마다 실장 결재를 기다리는 건이 몇 건인지 덧붙이는데, 하루에 하나꼴로 늘어 오늘은 열일곱 건이 됐다.\n\n그중에는 우방과 맺은 정보 공유 협정 개정안과 서해 작전 규칙을 바꾸는 문서, 국가정보원 해외 공작 예산이 들어 있었다. 차관급 도장으로는 하나도 끝낼 수 없는 서류들이다."
 TFRKPHN_lg_271_b:0 "빈방 책상에는 전임 실장이 두고 간 탁상 달력이 그대로 있다. 날짜는 두 달 전에 멈춰 있다. 청소하러 들어간 직원은 달력을 넘기지 않고 먼지만 훔치고 나왔다.\n\n대통령은 차장 보고에 대꾸하지 않았다. 그날 저녁 퇴근하려던 행정관 하나를 불러 세웠다. \"인사 파일, 내일 아침까지 다 올려요. 다섯 개 전부.\"\n\n다음 날 아침 집무실 책상 한가운데에 파일 다섯 개가 놓였다. 대통령은 그중 둘을 따로 빼서 끝까지 읽었다. 차장은 그날도 결재가 열여덟 건 밀렸다고 보고했다."
 TFRKPHN_lg_272_a:0 "광화문 한복판에 볏가마가 쌓였다. 농민 단체가 밤새 트럭으로 실어 와 사람 키 높이까지 올린 것이다. 그 위에 걸린 현수막에는 전쟁은 끝났는데 쌀값은 왜 그대로냐는 물음이 적혀 있다.\n\n대답해 줄 사람이 없다. 농림축산식품부 장관 자리가 두 달째 비어 있어서 대신 마이크를 잡은 차관은 야유만 들었다.\n\n볏가마 옆에 전남 해남에서 올라온 예순 살 농민이 앉아 있었다. 전쟁 동안 그는 군에 쌀을 대느라 정부가 정한 값에 쌀을 넘겼다. 전쟁이 끝나자 수입 쌀이 다시 들어왔고 산지 쌀값은 떨어졌다. \"전쟁 땐 애국이라 카더니, 끝나고 나니 남는 기 빚뿐이라.\" 그가 기자 앞에서 담배를 비벼 껐다."
 TFRKPHN_lg_272_b:0 "광화문을 지나던 시민 몇은 농민들에게 따뜻한 음료를 건넸고, 몇은 차가 막힌다며 경적을 울렸다. 경찰은 볏가마를 치우라는 지시를 기다렸지만 지시는 끝내 내려오지 않았다.\n\n길 건너 정부서울청사는 그 어느 때보다 분주했다. 농림축산식품부 대변인이 청사 앞에 나와 진정해 달라고 했지만, 그 목소리는 잃을 것 없는 사람들의 고함에 금방 묻혔다. 그날 밤 대통령은 농림축산식품부 장관 후보를 다섯으로 좁혔다."
 TFRKPHN_lg_273_a:0 "노사정 회의장에 의자 셋이 놓였다. 노동계 대표가 먼저 앉았고 조금 뒤 경영계 대표가 맞은편에 앉았다. 남은 하나는 정부 자리였는데 회의가 끝날 때까지 아무도 앉지 않았다.\n\n회의는 이십 분 만에 끝났다. \"장관도 없는 정부랑 무슨 대타협을 합니까?\" 노동계 대표가 기자들 앞에서 한 말을 저녁 뉴스는 자르지 않고 그대로 내보냈다.\n\n\"정부가 자리를 비웠는데 우리 둘이 무슨 얘기를 해요.\" 경영계 대표도 나가면서 거들었다. 두 사람이 같은 말을 한 건 그날이 처음이었다."
 TFRKPHN_lg_273_b:0 "빈 의자 앞 명패에는 고용노동부 장관이라고 적혀 있었다. 회의가 끝나자 사무처 직원이 그 명패를 다른 명패들과 함께 상자에 담았다. 다음 회의 날짜는 잡지 못했다.\n\n대통령은 노동 개혁을 맨 앞에 내걸고 당선된 사람이다. 그날 저녁 뉴스는 빈 의자를 첫 화면에 걸었다.\n\n같은 시각 노동계 대표와 경영계 대표는 각자 다른 식당에서 저녁을 먹으며 같은 뉴스를 봤다. 둘 다 빈 의자가 화면에 나오는 대목에서 숟가락을 내려놓았다고 한다."
 TFRKPHN_lg_274_a:0 "통일부 장관실 문에 두 달째 종이 한 장이 붙어 있다. 공석, 두 글자다.\n\n북한 체제를 바꾸겠다고 약속하고 들어선 정부이니 청사를 드나드는 기자들이 그 종이를 놓칠 리 없었다. 누군가 찍어 간 사진이 이튿날 아침 신문 일 면 한가운데에 실렸다.\n\n그날 아침 출근하던 통일부 직원들은 서로 눈을 마주치지 않았다. 장관이 없어도 일은 쌓였다. 탈북민 정착 지원 예산과 이산가족 상봉 신청서, 북녘 인권 기록 보고서가 차관 책상에서 서명을 기다리고 있었다."
 TFRKPHN_lg_274_b:0 "실향민 단체가 성명을 냈다. 북한 체제를 바꾸겠다는 정부가 통일 업무를 맡을 사람 하나를 두 달째 못 찾는데 그 약속을 어떻게 믿겠느냐는 내용이었다.\n\n대통령은 그날 오후 후보 명단을 다시 펼쳤다. 명단은 다섯 줄이었다. 통일부 차관 출신과 대학 교수, 국회의원이 섞여 있었다. 그는 그 가운데 북한 내전 이후를 그릴 수 있는 사람을 찾고 있었다. 청사 앞 종이는 그날도 떨어지지 않았다."
 TFRKPHN_lg_275_a:0 "두 달째 법무부에서 올라오는 서류의 장관 서명란은 비어 있다. 그 옆에 차관 도장이 대신 찍혀 있다. 사면 심사도 검찰 인사도 그렇게 한 주 두 주 밀렸다.\n\n검찰 안에서는 인사가 늦어지는 걸 두고 말이 많았다. 한 지방 검찰청 부장검사는 누가 장관으로 오느냐에 따라 자리가 다 바뀐다고 동료들에게 말했다. 그 말을 들은 젊은 검사들은 맡은 사건 결재를 슬금슬금 미루기 시작했다.\n\n교도소에서는 사면 심사를 기다리는 수형자 가족들이 보낸 편지가 법무부로 쌓였다. 전쟁 중 군수 공장에서 일하다 사고를 낸 사람들의 가족이 많았다.\n\n오늘은 결재판을 들고 온 비서실장이 먼저 입을 뗐다. \"온정주의 없는 법 집행 하신다더니, 집행할 사람이 없습니다.\" 농담처럼 꺼낸 말이었지만 대통령이 웃지 않자 비서실장도 머쓱하게 헛기침만 했다.\n\n그날 저녁 대통령실은 법무부 장관 후보를 추리고 있다고 기자들에게 흘렸다. 검사 출신 대통령답게 후보들이 맡았던 사건 목록부터 본다는 말이 따라붙었다."
 TFRKPHN_lg_276_a:0 "이달 수출 통계가 나왔는데 숫자만 보면 나쁘지 않다. 문제는 그 숫자를 들고 국회에 나가 의원들 질문을 받아 줄 장관이 없다는 것이다. 기업인 간담회도 벌써 두 번 미뤘다. 돌아오는 기업을 맞겠다고 큰소리친 정부가 정작 마중 나갈 장관을 못 구했다.\n\n산업통상자원부 국장들이 장관 대신 국회 상임위원회에 불려 나갔다. 한 의원이 이 숫자에 책임질 사람이 누구냐고 따지자 국장은 대답 대신 수출 실적표 맨 아랫줄을 다시 읽었다."
 TFRKPHN_lg_276_b:0 "해외에서 돌아오려는 기업들도 기다리다 지쳐 갔다. 동남아에 공장을 둔 한 부품 회사 대표는 세 번째로 미뤄진 간담회 일정을 받아 들고, 다음 달에도 장관이 없으면 일본 쪽 제안을 받겠다고 했다. 그 말은 그날 오후 산업부 국장 보고서에 한 글자도 빠지지 않고 옮겨졌다.\n\n대통령은 탁상 달력을 한 장 넘겨 봤지만 더 미룰 날짜가 없었다.\n\n그날 저녁 산업부 차관이 장관 대행 이름으로 간담회를 다시 잡았다. 장관 자리가 비었다는 걸 감출 생각도 없었는지 초청장 주최자 칸에는 차관 이름이 큼직하게 적혀 있었다."
 TFRKPHN_lg_281_a:0 "노동계가 협상장을 떠났다. 양대 노총이 같은 날 총파업을 선언했고 공장과 항만이 멈췄다.\n\n노사정 대화가 깨진 건 새벽 두 시였다. 임금 체계를 바꾸는 문구 하나를 붙들고 열네 시간째 이어지던 회의였다. 노동계 대표가 먼저 일어나 서류를 챙겼고, 문을 나서면서 정부가 경영계 편에 섰다고 말했다.\n\n이튿날 아침 울산 자동차 공장과 부산 부두가 멈춰 섰다. 출근길 지하철도 평소보다 띄엄띄엄 다녔다. 조선소 정문 앞에는 붉은 머리띠를 두른 노동자들이 모였다. 공장 안에는 짓다 만 배의 철판이 크레인에 매달린 채 그대로 있었다.\n\n파업 사흘째부터 수출 화물을 실은 컨테이너가 부두에 쌓였다. 경영계는 하루 손실이 수천억 원이라는 계산서를 내밀었다. 노동계는 그만큼 노동자들도 버티고 있다고 받아쳤다. 대통령실은 노사 대표를 다시 한자리에 앉힐 방법을 찾는 중이다.\n\n파업 닷새째 밤, 울산의 한 노동자가 공장 앞 천막에서 아이와 영상 통화를 했다. 아빠 언제 오느냐는 물음에 그는 대답하지 못하고 휴대전화를 들어 천막 밖 별을 비춰 주었다."
 TFRKPHN_lg_282_a:0 "경영계가 협상장을 떠났다. 주요 기업들이 올해 국내 투자 계획을 거둬들였고 새 공장 터에는 울타리만 남았다.\n\n노사정 대화는 저녁 무렵 깨졌다. 해고 요건을 다루는 조항 하나 때문에 경영계 대표들이 자리를 박차고 나갔다. 이런 조건이면 이 나라에 공장을 더 지을 수 없다는 게 그들의 말이었다.\n\n다음 날 주요 기업 열 곳이 올해 국내 투자 계획을 다시 따져 보겠다고 발표했다. 평택과 천안 공장 예정지의 굴착기가 멈췄다. 공사장 둘레 식당과 숙소는 한 주 만에 손님이 반으로 줄었고, 일감을 기다리던 하청 업체 사장들은 대출을 연장해 달라고 은행을 찾아다녔다.\n\n노동계는 경영계가 투자를 볼모로 잡았다고 비판했다. 경영계는 볼모가 아니고 계산대로 했을 뿐이라고 받았다. 같은 날 외국 신용평가사 한 곳이 한국 노사 관계가 불확실해졌다는 짧은 보고서를 냈다.\n\n대통령실은 노사 대표를 다시 불러 앉힐 길을 찾고 있다. 그 주 경제 신문 일 면에는 멈춘 굴착기 사진이 실렸고, 노동 신문 일 면에는 텅 빈 공장 구내식당 사진이 실렸다."
 TFRKPHN_lg_285_a:0 "정부조직법 개정안이 국무회의에 올라왔다.\n\n기획재정부를 둘로 쪼개는 안이다. 예산 편성은 국무총리 소속 기획예산처로 넘어가고 남은 부처는 재정경제부가 된다. 2008년 재정경제부와 기획예산처가 합쳐 기획재정부가 되면서 사라진 이름이 다시 살아나는 셈이다. 십수 년 전 합병을 밀어붙였던 관료 몇은 아직 같은 청사에서 일하고 있었다.\n\n기획재정부 안에서도 말이 갈렸다. 예산실 직원들은 총리실로 넘어가면 부처들 요구를 막아 낼 힘이 약해진다고 걱정했다. 세제실과 경제정책국 직원들은 예산에 묶여 못 하던 일을 이제 제대로 할 수 있다며 반겼다. 같은 층에서 일하던 사람들이 서로 다른 짐을 싸게 될 판이었다.\n\n국회도 의견이 엇갈렸다. 야당은 부처를 쪼개면 자리만 늘어난다고 했다. 여당 안에서는 한 부처가 나라 살림을 몽땅 쥔 게 애초에 문제였다는 말이 나왔다.\n\n국무회의에 배석한 기획재정부 차관은 회의 내내 자료만 넘겼다. 회의가 끝나자 그는 직원들을 모아 놓고, 어느 쪽으로 결정이 나든 이번 예산안만큼은 끝까지 같이 짜자고 했다."
 TFRKPHN_lg_286_a:0 "정진석 총리가 사의를 밝혔다. 총리실이 올린 안건이 줄줄이 밀리자 이름뿐인 책임총리는 더 못 하겠다는 뜻을 전해 왔다.\n\n총리실 직원들은 오후 회의 도중에 그 소식을 들었다. 지난 몇 달 동안 총리실 안건은 차관회의를 넘어가도 대통령실에서 멈췄다. 규제 정비안과 지방 이양안, 공공기관 통폐합안이 차례로 보류 도장을 받았다. 한 국장은 서랍 속 보류 서류를 세어 보다가 열두 건째에서 그만뒀다고 했다."
 TFRKPHN_lg_286_b:0 "대통령은 취임 때 총리에게 내각을 맡기고 자신은 큰 방향만 잡겠다고 약속했다. 그 약속이 실제로 어디까지 지켜졌는지는 지금 총리실 서랍이 말해 준다.\n\n사의 소식이 알려지자 야당은 책임총리는 처음부터 말뿐이었다고 논평했다. 여당에서도 총리실과 대통령실 사이 일이 너무 오래 곪았다는 말이 나왔다. 장관들과 임기를 함께하겠다고 대통령이 직접 약속한 것도 얼마 전 일이었다.\n\n그날 저녁 총리실 직원들은 늦게까지 퇴근하지 않았다. 총리가 떠나면 보류된 서류들도 함께 묻혀 버릴까 걱정됐기 때문이다."
 TFRKPHN_lg_287_a:0 "조현동 외교부 장관이 사의를 밝혔다. 외교부 요청이 예산과 정원에서 번번이 깎였고 대사들 사이에서도 불만이 터져 나오던 참이었다.\n\n외교부 사정은 숫자에 그대로 드러났다. 전쟁 뒤 새로 열어야 할 공관이 열 곳이 넘었는데 예산이 통과된 건 셋뿐이었다. 태평양방위조약기구 회의마다 보낼 사람이 모자라 국장이 과장 일까지 떠맡았다. 유럽의 한 대사는 본부로 보낸 전문 끝에 이 인원으로는 이 나라 몫을 지킬 수 없다고 적었다."
 TFRKPHN_lg_287_b:0 "그 전문은 외교부 안에서 돌고 돌았다. 젊은 외교관들 사이에서는 다른 일자리를 알아본다는 말까지 나왔고, 외교부 노조는 처음으로 인력 문제를 걸고 성명을 냈다.\n\n대통령실은 외교부 요청서를 다시 꺼냈다. 지난번 예산 협의 때 깎인 칸에 누가 줄을 그었느냐가 다시 도마에 올랐다. 장관들과 임기를 같이하겠다고 대통령이 직접 한 약속도 함께 거론됐다.\n\n그 주 외교부 청사 게시판에 공관 신설 계획표가 붙었다. 통과된 세 곳에는 동그라미가, 깎인 일곱 곳에는 줄이 그어져 있었다. 직원들은 출근할 때마다 그 표 앞을 지나갔지만 누구도 떼어 내자는 말은 하지 않았다."
 TFRKPHN_lg_288_a:0 "방기선 장관이 사의를 밝혔다. 다른 부처 지출 요구를 더는 막아 낼 수 없다는 게 이유였고, 예산을 다루는 직원들까지 술렁였다.\n\n예산실 사정은 이랬다. 대통령실 요구와 다른 부처 요구가 한꺼번에 밀려들었다. 깎으면 장관이 욕을 먹고 안 깎으면 나라 살림이 무너졌다. 예산실 벽에 전쟁 빚 상환 일정표가 붙어 있었는데 그 칸이 달마다 조금씩 뒤로 밀렸다.\n\n\"우리 이제 안 된다는 말을 까먹었어. 입에서 안 나와.\" 밤 열한 시에 사무실을 나서던 예산실 과장이 동료에게 말했다. 이튿날 아침 그 말이 예산실 전체에 퍼졌다."
 TFRKPHN_lg_288_b:0 "기획재정부 장관이 물러나면 내년 예산안 마지막 협의를 누가 맡을지가 문제다. 국회 예산 심사는 석 달 뒤면 시작된다. 장관들과 임기를 같이하겠다던 대통령의 약속도 이번에 시험대에 올랐다.\n\n그날 밤 예산실 불은 자정이 넘어서야 꺼졌다. 마지막으로 나서던 사무관이 벽에 붙은 빚 상환 일정표를 한참 바라봤다. 다음 달 칸은 비어 있었다. 그는 연필로 물음표를 하나 그렸다가 지우고 불을 껐다."
 TFRKPHN_lg_289_a:0 "이명수 행정안전부 장관이 사의를 밝혔다. 지방에 약속한 돈이 내려가지 않자 시장과 군수들의 항의가 모조리 장관에게 쏟아졌다.\n\n지난 한 달 동안 장관실 전화는 쉬지 않고 울렸다. 지방 교부세를 늘리겠다는 약속은 대선 공약에도 들어 있었다. 그런데 기획재정부가 전쟁 빚부터 갚아야 한다며 그 돈을 묶어 두었고, 시장과 군수들은 그 사이에서 장관만 붙잡았다.\n\n충청의 한 군수는 장관실 앞 복도에서 두 시간을 기다리다 그냥 돌아갔다. 그 군은 다리 하나 고칠 돈을 반년째 기다리고 있었다. \"장관님도 어쩔 수 없다는 거 압니다. 그래도 얼굴은 봐야 할 거 아입니까.\" 군수는 돌아가는 길에 기자들에게 말했다.\n\n지방 공무원 노조가 교부세 약속을 지키라는 성명을 냈고 시도지사 협의회도 이름을 함께 올렸다. 장관들과 임기를 같이하겠다던 대통령의 약속은 빛이 바랬다.\n\n장관실 비서가 그달 받은 항의 전화를 세어 보니 이백 통이 넘었다. 절반은 같은 다리와 같은 도로, 같은 학교 얘기였다. 지방에서 올라온 요청서가 장관실 책장 두 칸을 채웠다."
 TFRKPHN_lg_290_a:0 "김홍균 국가정보원장이 사의를 밝혔다. 국정원 권한이 하나씩 다른 기관으로 넘어가는 동안 조직을 지켜 내지 못했다는 게 그가 든 이유다.\n\n국정원 안의 공기는 무거웠다. 대공 수사권은 이미 경찰로 넘어갔고, 해외 정보 업무 일부를 국방부로 옮기는 안이 국무회의에 올라가 있었다. 오래 일한 요원들은 조직이 반토막 나는 걸 지켜봤고 몇은 퇴직 서류를 냈다.\n\n전쟁 동안 국정원은 비밀 지원의 한복판에 있었다. 그때 일을 아는 사람들이 하나둘 떠나자 정보 업계에서는 그 기억을 누가 지키느냐는 걱정이 나왔다. 한 전직 국장은 정보기관에서는 사람이 곧 장부라고 했다."
 TFRKPHN_lg_290_b:0 "안보실은 국정원장의 사의를 받을지를 놓고 따로 회의를 열었다. 북한 내부가 크게 흔들리는 지금 정보기관 수장을 바꾸면 위험하다는 의견이 많았고, 장관들과 임기를 같이하겠다던 대통령의 약속을 꺼내는 사람도 있었다.\n\n국정원 본관 기념 벽에는 전쟁 중 순직한 요원들을 기리는 이름 없는 별이 몇 개 더 새겨질 예정이었다. 원장이 사의를 밝힌 그 주에도 공사는 멈추지 않았다."
 TFRKPHN_lg_291_a:0 "신범철 국방부 장관이 사의를 밝혔다. 전쟁 때 쓴 탄약을 채울 예산이 또 밀렸고, 군 안에서는 장관이 힘이 없다는 말까지 돌았다.\n\n탄약고 사정은 장관 책상에 놓인 보고서에 그대로 적혀 있었다. 양안전쟁 때 대만과 일본에 빌려준 포탄은 아직 다 돌아오지 않았다. 그사이 우리 탄약고 재고는 기준치 절반을 조금 넘는 수준까지 떨어졌다. 경상북도의 한 탄약고에서는 빈 선반에 먼지가 쌓여 갔다.\n\n예산이 밀릴 때마다 군의 눈은 장관에게 쏠렸다. 한 사단장이 회의에서 장관이 국무회의에서 한마디만 더 해 주면 좋겠다고 했는데, 그 말은 곧 장관 귀에도 들어갔다."
 TFRKPHN_lg_291_b:0 "국방부 예산 담당자들은 기획재정부와 협의를 다시 잡았다. 들고 간 표 첫 줄에 탄약 재고율이 빨간 글씨로 적혀 있었다. 장관들과 임기를 같이하겠다던 대통령의 약속도 협의 자리에서 한 번 언급됐다.\n\n그날 저녁 국방부 장관실 불은 늦게까지 켜져 있었다. 비서관은 책상 위 탄약 재고표 숫자가 지난주보다 하나 더 줄어든 걸 봤다. 그는 그 표 옆에 따뜻한 차 한 잔을 내려놓고 조용히 나왔다."
 TFRKPHN_lg_295_a:0 "야당이 부처가 제 할 일을 못 한다며 [TFRKPHN_dept_who] 해임 건의안을 냈다. 헌법은 국회가 장관 해임을 대통령에게 건의할 수 있다고만 적었고, 대통령이 그 건의를 꼭 따라야 하는 건 아니다.\n\n건의안이 본회의에 오른 날 국회 앞에는 그 부처 정책에 반대해 온 단체들이 모였다. 본회의장에서는 표결 전 토론이 두 시간 이어졌다. 야당 의원들이 그 부처가 몇 달 동안 미뤄 온 일들을 하나씩 읽어 나가면, 여당 의원들은 왜 미뤄졌는지를 하나씩 받아쳤다."
 TFRKPHN_lg_295_b:0 "표결은 야당 뜻대로 끝났다. 건의안이 통과되는 장면을 그 부처 직원들은 사무실 텔레비전으로 지켜봤다. 장관이 바뀌면 지금 하던 일은 어떻게 되느냐고 서로 묻는 소리가 들렸다.\n\n그날 저녁 정무수석이 메모를 올렸다. 건의를 받아들였을 때와 물리쳤을 때 벌어질 일을 나란히 적었는데 두 칸에 적힌 분량이 거의 같았다.\n\n이튿날 그 부처 장관은 예정대로 출근했다. 청사 앞에 몰린 기자들 사이를 지나 그는 질문에 하나도 답하지 않고 엘리베이터에 올랐다. 그날 오후 장관실에서는 평소처럼 결재가 나갔다."
 TFRKPHN_lg_296_a:0 "국무회의가 한 시간 만에 멈췄다. 두 장관이 서로 상대 부처 탓을 하다 벌어진 일인데, 그날 저녁 회의록까지 언론에 새어 나갔다.\n\n다툼은 예산 한 줄에서 시작됐다. 자기 부처 사업 돈이 다른 부처 사업에서 깎여 나간다는 걸 회의 자료를 보고서야 안 장관이 목소리를 높였다. 상대 장관도 물러서지 않았고, 나머지 장관들은 탁자 밑으로 휴대전화 문자를 보내기 바빴다.\n\n대통령은 처음 몇 분 동안 듣기만 했다. 목소리가 더 커지자 회의를 멈추고 잠깐 쉬자고 했다. 그날 회의는 다시 열리지 않았다."
 TFRKPHN_lg_296_b:0 "저녁 뉴스에 회의록 몇 줄이 그대로 나왔다. 대통령실은 누가 흘렸는지 찾아내라고 지시했고, 국무회의에 배석했던 직원들은 그날 밤 휴대전화 통화 기록을 내야 했다.\n\n이튿날 아침 신문들은 하나같이 내각 기강을 일 면에 올렸다. 야당은 국무회의가 아니라 국무싸움이라고 비꼬는 논평을 냈다.\n\n회의록을 흘린 사람은 끝내 나오지 않았다. 대통령실은 다음 국무회의부터 배석자를 절반으로 줄였다. 회의실 벽에는 휴대전화를 꺼 달라는 안내문이 새로 붙었다."
 TFRKPHN_lg_297_a:0 "북한 곳곳에서 같은 소식이 올라온다. 배급소 앞 줄이 사라진 자리를 장마당이 차지했고, 이제는 보위원이 지나가도 사람들이 하던 말을 멈추지 않는다고 한다.\n\n국가정보원 북한 분석실 벽면 지도에 지역마다 올라온 보고가 핀으로 꽂혀 있다. 한 해 전만 해도 핀은 국경 도시 몇 곳에 몰려 있었는데 지금은 평양 둘레까지 빼곡하다. 분석관들은 핀 색을 세 가지로 나눠 놓았다. 배급이 끊긴 곳, 장마당이 커진 곳, 단속이 더는 먹히지 않는 곳이다."
 TFRKPHN_lg_297_b:0 "\"예전엔 장마당서 쌀값 묻는 것도 조심했습네다. 요샌 장군님 욕하는 사람도 있시요.\" 함경북도에서 넘어온 탈북민이 합동신문에서 말했다. 받아 적던 신문관의 펜이 잠깐 멈췄다.\n\n평양은 아직 단단하다. 군과 보위부는 그대로고 수도 배급도 끊기지 않았다. 그런데 평양 바깥의 북한은 벌써 다른 나라처럼 움직이기 시작했다. 분석실장은 보고서 끝에 균열은 아래에서 먼저 온다고 적었다.\n\n그 보고서는 그 주 금요일 대통령 책상에 올라갔다. 대통령은 지도 사진을 크게 키워서 핀 하나하나를 살폈다."
 TFRKPHN_lg_298_a:0 "평양에서 내려온 명령이 군단에서 멈췄다. 지휘관 몇이 부대를 움직이지 않는 사이 병사들은 초소를 비우고 고향 쪽으로 걸어가기 시작했다.\n\n감청 기록에 같은 문장이 여러 번 나왔다. 총참모부가 부대 이동을 지시하면 군단 사령부는 연료가 없다고 답했다. 다음 날 같은 지시가 또 내려오자 이번에는 차량이 고장 났다고 했다. 사흘째에는 아예 답이 없었다.\n\n강원도 쪽 휴전선 너머 북한군 초소 몇 곳은 밤에 불이 켜지지 않았다. 우리 감시 장비에 잡힌 열 영상에도 사람이 거의 보이지 않았다. 경계를 서던 우리 측 하사는 근무 일지에 북쪽 초소가 비었다고 적고, 화면을 다시 들여다본 다음 같은 문장을 한 번 더 적었다."
 TFRKPHN_lg_298_b:0 "병사들 대부분은 고향 쪽으로 걸어갔다. 탈영병 몇은 장마당에서 군복을 쌀과 바꿨다. 국가정보원은 명령이 멈춘 군단이 하나에서 둘로 늘었다고 보고하면서, 평양이 그 지휘관들을 어떻게 처리하느냐가 다음 신호가 될 거라고 내다봤다.\n\n그 주말 국방부는 휴전선 전 구간의 경계 태세를 한 단계 올렸다. 무너지는 군대일수록 위험하다는 걸 우리 군은 잘 알았다. 명령이 닿지 않는 부대는 누가 명령을 내리든 움직일 수 있다."
 TFRKPHN_lg_301_a:0 "자정이 되기 전에 개표가 기울었다. 화면에 당선 확실 자막이 뜨자 선거 사무소가 떠나갈 듯 그의 이름을 불렀다. 여든을 바라보는 당선인은 한동안 의자에서 일어나지 못했다. 1997년 첫 도전에서 여기까지 서른 해가 걸렸다.\n\n\"후보님, 아니 당선인님, 일어나셔야죠. 카메라 다 와 있습니다.\" \"잠깐만. 다리가 좀 풀려서 그래.\"\n\n새벽 두 시, 그는 사무소 뒤편 작은 방에서 홍준표 대통령의 전화를 받았다. 통화는 짧았다. 수화기를 내려놓은 그는 기자들 앞에 나가 소감보다 먼저 양안전쟁 때 돌아오지 못한 장병들을 위해 묵념하자고 했다.\n\n골목에는 새벽까지 지지자들이 남았다. 누가 서른 해 전 첫 출마 때 쓰던 누런 현수막을 들고 나오자 그 앞에서 사진을 찍으려는 줄이 길게 생겼다. 홍준표 정부가 시작한 개혁과 전후 동맹 질서는 이제 이 정부가 이어받는다."
 TFRKPHN_lg_303_a:0 "2027년 3월 3일, 양안전쟁이 끝나고 처음 치르는 대통령 선거 날이다. 한국이 손 놓고 지켜보는 사이 대만은 무너졌다.\n\n방관한 대가로 다음은 한국 차례라는 공포가 퍼졌고, 중립을 고른 정부는 비겁하다는 욕을 먹었다. 국민의힘은 책임을 누가 지느냐를 두고 쪼개졌다. 성난 보수층은 싸워 보지도 않고 물러선 배신자들이 나라를 망쳤다고 외친 우리공화당 조원진에게 표를 몰아줬다.\n\n선거 막판에는 대만을 빠져나온 피난민을 실은 배가 부산항에 닿는 장면이 날마다 뉴스 첫머리에 나왔다. 국민의힘 후보는 끝까지 중립은 어쩔 수 없었다고 설명했지만 유세장마다 빈 의자가 늘었다. 태극기를 든 군중은 하루가 다르게 불어났다."
 TFRKPHN_lg_303_b:0 "개표 방송은 밤새 엎치락뒤치락했다. 새벽 네 시, 영남에서 쏟아진 표가 승부를 갈랐고 조원진이 당선됐다. 강경한 반중 노선과 비상 통치, 국가 재무장을 내건 권위주의 보수 정권이 들어선다.\n\n당선이 확정된 아침 주식 시장은 장이 열리자마자 크게 출렁였다. 베이징 외교부는 짧은 논평으로 한반도 긴장을 높이는 어떤 행동에도 반대한다고 밝혔다. 여의도에서는 국민의힘 지도부가 줄줄이 사퇴 뜻을 밝혔다."
 TFRKPHN_lg_304_a:0 "2027년 3월 3일, 양안전쟁이 끝나고 처음 치르는 대통령 선거 날이다. 한국은 참전했지만 대만은 무너졌고 한국군의 희생은 헛것이 됐다.\n\n전쟁을 밀어붙인 여당은 책임을 피할 수 없었다. 반대만 하고 다른 길은 못 내놓은 제1야당도 표를 얻지 못했다. 두 당 모두에 등을 돌린 유권자들이 제3지대로 몰렸다.\n\n안철수는 선거 내내 전쟁의 상처를 정쟁으로 덮지 말자는 말을 되풀이했다. 그는 큰 유세 대신 대학 강당과 공단 식당을 돌았고, 젊은 엔지니어와 해고된 노동자가 한 식탁에 앉아 그의 말을 들었다."
 TFRKPHN_lg_304_b:0 "개표 결과는 누구의 예상과도 달랐다. 두 거대 정당 후보가 나란히 2위와 3위로 밀렸고, 과학기술과 경제를 내세운 국민의당 안철수가 당선됐다. 새 정부는 전쟁으로 주저앉은 경제를 다시 세우고 균형 외교를 편다.\n\n국회는 여전히 두 거대 정당 차지다. 안철수는 당선 소감에서 이제 싸움을 끝내고 일할 때라고 했고, 이튿날 아침 두 당 대표에게 차례로 전화를 걸었다."
 TFRKPHN_lg_305_a:0 "2027년 3월 3일, 양안전쟁이 끝나고 처음 치르는 대통령 선거 날이다. 한국은 참전하지 않았고 대만은 버텨 냈다.\n\n전쟁은 피했지만 동맹이 싸우는 동안 한국만 빠져 있었다는 꼬리표가 남았다. 미국과 일본에서 한국을 믿어도 되느냐는 말이 나왔고 보수층은 정부가 동맹을 저버렸다며 분노했다.\n\n서울의 불빛은 꺼지지 않았다. 그걸 다행으로 여기는 사람과 수치로 여기는 사람이 나라를 반으로 갈랐다. 주말마다 도심에서 동맹을 저버린 정부를 규탄하는 집회가 열렸고, 길 건너편에서는 맞불 집회가 확성기를 틀었다.\n\n\"전쟁 안 나간 게 죄냐!\" \"동맹 버린 게 자랑이냐!\" 경찰 버스 두 대를 사이에 두고 고함이 오갔다.\n\n선거 막바지 국민의힘이 둘로 쪼개지면서 보수표가 자유와혁신으로 쏠렸다. 동맹 복원과 내부의 적을 내건 자유와혁신의 황교안이 근소한 차이로 당선됐다. 새 정부는 반공과 질서를 앞세운 강경 노선으로 간다.\n\n취임식 날 광화문 일대에는 경찰 버스가 겹겹이 섰다. 새 정부는 첫 국무회의에 국가보안법 집행을 강화하는 안건을 올렸다."
 TFRKPHN_lg_312_a:0 "오늘 정부가 수사 기관 개편안을 발표했다. 경찰 국가수사본부를 떼어 내 국가수사국으로 세우고 여러 기관에 흩어진 수사 기능을 거기 하나로 모으는 게 뼈대다. 고위공직자범죄수사처는 없애고 검찰은 공소 유지에 필요한 보완 수사만 맡는다.\n\n대통령은 검사 출신이다. 2021년 가을 경선 때 공수처를 없애고 한국형 FBI를 만들겠다고 공약했다. 세계 경제가 무너진 뒤 생계형 범죄와 거리 집회가 함께 늘자 대통령은 수사 체계부터 손보라고 지시했다."
 TFRKPHN_lg_312_b:0 "야당은 곧바로 들고일어났다. 야당 지도부는 개편안을 수사 독재, 사법 독재의 서막이라고 불렀다. 공권력의 오판으로 시민이 목숨을 잃은 지난 사건들을 하나하나 꺼내며, 권한이 한곳에 몰린 수사 기관은 또 다른 피해자를 만든다고 경고했다.\n\n경찰 안의 반응은 엇갈렸다.\n\n\"인력 늘어난다잖아. 우리야 좋지.\" \"좋긴. 정권 바뀌면 제일 먼저 우리가 털려.\" \"그건 그때 일이고.\"\n\n검찰은 공식 입장을 안 냈지만 일선 검사들 사이에서는 사표 얘기가 돌았다. 법안을 통과시키려면 야당 일부의 협조가 필요해서 여당 원내대표는 다음 주부터 야당 의원들을 한 명씩 만나기로 했다. 대통령실은 법 앞에 예외는 없다는 한 줄짜리 입장만 냈다."
 TFRKPHN_lg_31_a:0 "경상북도 산골짜기에 있는 한 탄약고에서 포탄 상자가 줄지어 트럭에 실리고 있다. 휴전 뒤 칠십 년 동안 다음 전쟁을 기다리며 쌓아 둔 것들이다. 녹슨 철문에는 탄약 정비 및 재배치라고 적힌 공문 한 장이 붙어 있다.\n\n\"중사님, 이거 진짜 다 빼는 겁니까? 북한이 쳐들어오면 어떡합니까.\"\n\"위에서 다 따져 보고 하는 일이겠지. 빌려주는 거라더라.\"\n\n지금 대만과 일본이 가장 다급하게 찾는 물건이 포탄이고, 새로 찍어 내서는 때를 맞출 수 없다. 정부는 창고에 쌓인 것부터 내주고 빈자리는 공장을 돌려 메우기로 했다."
 TFRKPHN_lg_31_b:0 "트럭 행렬은 밤새 부산항까지 이어졌다. 서류에 적힌 행선지는 우방국 정비 지원이었고 품목은 대여 물자였다. 반납 기한 칸에는 아무것도 적히지 않았다.\n\n같은 주에 대만과 일본의 보급 창고에는 한글이 찍힌 탄약 상자가 쌓이기 시작했다. 부산항 하역 감독관은 그날 밤 선적 목록에 서명하기 전에 수량을 두 번 세어 봤고, 날짜 칸은 그대로 비워 둔 채 펜을 내려놓았다."
 TFRKPHN_lg_323_a:0 "기념식이 끝난 광장에 아직 사람들이 남아 있었다. 확성기 음악이 끊긴 자리에 누군가의 휴대전화에서 낡은 가요 화개장터가 흘러나왔다.\n\n처음엔 몇몇이 웃으며 흥얼거렸다. 대구에서 올라온 버스 기사가 무릎을 치며 박자를 맞추자 광주에서 온 시장 상인이 후렴을 받았다. 경상도 억양과 전라도 억양이 한 소절씩 엇갈렸고, 박자도 음정도 엉망이었지만 아무도 멈추지 않았다.\n\n\"아재, 거기 박자 틀렸어라.\" \"틀리믄 우떻노. 노래는 목청이다.\"\n\n인터넷 게시판에서 서로 날을 세우던 예비역 병장과 사회 초년생도 그 틈에 끼어 어깨를 들썩이고 있었다."
 TFRKPHN_lg_323_b:0 "섬진강 하나를 사이에 두고 닷새마다 장이 서는 곳이 있다. 오래전부터 두 고장 사람들이 모여 흥정하고 다투고 웃던 곳인데, 노래 속 그 장터가 그날 밤 서울 한복판에 잠깐 다시 섰다.\n\n자정이 가까워지자 경찰이 조심스레 해산을 권했다. 사람들은 순순히 흩어졌지만 지하철역으로 걸어가면서도 흥얼거림을 멈추지 않았다. 이튿날 신문들은 그 장면을 사진 한 장으로 실었다. 사진 설명에는 이름도 고향도 적혀 있지 않았다."
 TFRKPHN_lg_324_a:0 "도쿄 총리 관저, 밤 11시.\n\n서울에서 온 친서는 그 어느 때보다 묵직했다. 북한과 중국의 핵에 맞서 두 나라가 함께 핵억지력을 갖추자는 제안이었다.\n총리는 담배를 한 모금 빨며 말했다.\n그래서 이거 정말 가능한 것인가?\n잠시 후 한 모금을 더 빨며 말했다.\n이거 정말 이룰 수 있는 것인가?\n\n방위대신이 말했다.\n총리님, 이건 국익의 문제를 넘어선 겁니다. 힘의 균형을 다시 짤 수 있습니다.\n\n외무대신은 과거의 문제보다 지금 당장의 현실에 집중하자고 했다.\n\n이제 총리의 결단만 남았다."
 TFRKPHN_lg_325_a:0 "서울과 도쿄가 마침내 같은 문서에 서명했다. 두 나라는 연구를 나눠 맡고 완성된 억지력은 함께 지키기로 했다.\n\n협정은 연구 시설을 두 나라에 나눠 두고, 사용 결정은 두 정상이 함께 내리게 정했다. 어느 한쪽 혼자서는 버튼을 누를 수 없다. 서명식은 부산의 한 호텔에서 조용히 열렸고 회의장에는 사진 기자 두 명만 들어갔다.\n\n두 나라 외교부는 같은 시각에 짧은 보도자료를 냈다. 자료에는 핵이라는 말 대신 공동 억지라는 말이 쓰였다. 양국 의회에 비공개 보고가 이어졌고, 두 나라 야당은 하나같이 졸속 절차라며 반발했다.\n\n서명을 마친 두 정상은 호텔 창가에 서서 한동안 바다를 내려다봤다.\n\n\"저 바다 이름부터 합의하자고 했으면 서명 못 했겠지요.\" 한 수행원이 복도에서 속삭이자 다른 수행원이 웃음을 참았다. 반세기 넘게 서로 경계해 온 두 나라는 그날 처음으로 같은 문서 한 장을 나눠 들었다."
 TFRKPHN_lg_326_a:0 "방금 들어온 소식이다. 대한민국과 일본이 공동 개발한 핵탄두의 실전 배치를 공식 발표했다. 동아시아 힘의 균형이 하루아침에 뒤집혔다.\n\n두 나라 정부는 같은 시각 같은 문장으로 발표문을 냈다. 억지력은 방어용으로만 쓰고 먼저 쓰지 않는다는 원칙을 지키겠다는 내용이었다.\n\n평양과 베이징은 곧바로 거세게 반발했다. 국제원자력기구가 긴급 이사회를 소집했고, 유럽 각국은 동아시아에 새로운 핵 시대가 열렸다며 깊은 우려를 나타냈다. 서울과 도쿄 증시는 장 초반 크게 출렁였다가 오후 들어 낙폭을 줄였다."
 TFRKPHN_lg_327_a:0 "대한민국과 일본 정부가 지난주부터 동해상 어업과 선박 운항을 전면 금지한 가운데, 오늘 아침 7시쯤 동해상에서 정체를 알 수 없는 폭발이 감지됐다.\n\n강원도 해안 마을 주민들은 아침을 먹다가 창문이 짧게 떨렸다고 신고했다. 기상청은 같은 시각 인공 지진으로 보이는 진동을 관측했다고 했다가 한 시간 뒤 발표를 정정했다.\n\n\"밥 먹는데 국그릇이 흔들리더라고. 지진인 줄 알았지. 근데 텔레비전에서 아무 말도 안 해.\" 고성군의 한 어민이 마을 회관 앞에서 기자에게 말했다.\n\n양국이 공동 원자력 협정을 맺은 뒤로 전문가들은 한국의 핵무장 가능성을 꾸준히 제기해 왔다. 홍준표 대통령이 북핵과 중국 핵무기에 맞선 핵균형을 줄곧 주장해 온 터라 핵개발설은 갈수록 힘을 얻고 있다. 민주노동당과 일본 공산당은 공동 성명으로 핵개발에 반대했고, 평화주의 시민단체들은 가두행진을 준비하고 있다.\n\n한국 정부는 아직 공식 입장을 내지 않았다. 국방부 대변인은 오후 브리핑에서 확인해 줄 게 없다는 말만 세 번 되풀이하고 단상을 내려갔다."
 TFRKPHN_lg_32_a:0 "1920년 6월, 홍범도가 이끈 독립군은 만주 봉오동 골짜기로 일본군을 끌어들인 다음 사방에서 총을 쏘았다. 나라를 잃고 십 년이 지났을 때였다. 조선 청년들은 총 한 자루씩을 들고 제국의 군대와 맞섰다.\n\n이십 년 뒤 충칭에서 창설된 한국광복군은 연합국 편에 서서 싸웠다. 인도와 버마의 정글에서 영국군과 함께 일본군 방송을 엿듣고 포로를 심문했으며, 국내로 쳐들어갈 날을 준비하며 미국 OSS에게서 특수 훈련을 받았다. 정규군도 없고 나라도 없던 사람들이었다."
 TFRKPHN_lg_32_b:0 "그로부터 팔십여 년이 흘렀다.\n\n국가안보실 회의 탁자에 푸젠성 군수 시설을 찍은 위성사진과 서해에서 중국 해군이 움직인 경로, 이어도 해양과학기지 설계도가 펼쳐져 있다. 이번에도 우리 군은 공식적으로 전선에 나서지 않는다. 그 대신 광복군 선배들처럼 전선 뒤편에서 할 일을 찾기로 했다. 감청과 보급, 정보 분석처럼 이름이 남지 않는 일들이다.\n\n회의가 끝나자 안보실의 한 행정관이 광복군 감청 기록이 담긴 사료집을 서가에서 꺼내 왔다. 그 책은 몇 달 동안 그의 책상 한쪽에 펼쳐진 채 놓여 있었다."
 TFRKPHN_lg_34_a:0 "합동참모본부 지하 지휘통제실의 큰 화면에 휴전선 이북 북한군 배치도가 빽빽하게 떠 있다. 중국이 대만에 발이 묶였으니 평양이 오판하기 딱 좋은 때다. 참모들은 평양의 오판을 막으려면 먼저 겁을 줘야 한다고 봤다.\n\n\"북한이 이 틈을 노리면 망설이지 말고 응징하라는 게 대통령님 지시입니다.\"\n\n전방 부대의 경계 태세가 최고 단계로 올라갔다. 서해와 동해에서 대규모 해상 훈련이 잇달아 열렸고, 휴전선 일대의 대북 확성기는 밤낮으로 울렸다. 확성기에서는 대만 전선 소식과 함께 중국이 지금 북한을 돌볼 여유가 없다는 방송이 되풀이해 흘러나왔다."
 TFRKPHN_lg_34_b:0 "평양은 어느 때보다 조용하다. 북한 주민들은 그 조용함이 무슨 뜻인지 짐작하고 있을 것이다.\n\n그 주 국가정보원 보고서에는 평양 시내 쌀값이 올랐다는 짧은 한 줄이 들어갔다. 전방 초소 병사들은 밤마다 확성기 소리를 들으며 경계를 섰고, 한 소대장은 수첩에 오늘도 건너편 초소 불이 일찍 꺼졌다고 적었다.\n\n대통령은 아침마다 그 보고서를 가장 먼저 받아 보았다. 맨 아래 칸에는 늘 특이 동향 없음이라고 적혀 있었고, 그는 그 칸을 확인한 다음에야 다른 서류를 펼쳤다."
 TFRKPHN_lg_35_a:0 "새벽 네 시의 진해 군항. 부두에 작업복 차림의 사내들이 줄지어 서 있다. 계급장도 부대 마크도 태극기도 달려 있지 않다. 이들의 서류에는 하나같이 전역 도장이 찍혀 있고 행선지 칸에는 해외 취업이라고 적혀 있다.\n\n\"너희 이름은 자유의용군이다. 국군이 아니다. 대한민국은 이 전쟁에 참전하지 않았다. 알겠나?\"\n\"예, 알겠습니다!\"\n\n우렁차게 대답한 사람들 대부분은 며칠 전까지 같은 부대에서 같은 군복을 입고 있었다."
 TFRKPHN_lg_35_b:0 "탄약을 빌려주고 정보를 넘기고 적의 후방을 흔드는 정도로는 이 전쟁을 막을 수 없었다. 대만 해안선이 무너지면 그다음 차례는 제주와 부산, 그리고 서울이다. 누군가는 직접 그 진흙탕에 들어가야 했다.\n\n수송선은 천천히 부두를 빠져나갔고 배웅하러 나온 사람은 아무도 없었다. 서류상으로 그들은 세상에 없는 사람들이다.\n\n가족들 손에는 처음 듣는 회사 이름이 적힌 고용 계약서가 한 장씩 남았다. 월급은 꼬박꼬박 들어왔다. 어디서 일하느냐고 묻는 전화를 걸면 늘 같은 상담원이 받아 같은 대답을 했다."
 TFRKPHN_lg_36_a:0 "\"재석 287인 중 찬성 112인, 반대 171인, 기권 4인으로 대만지원법안은 부결되었음을 선포합니다.\"\n\n국회의장이 의사봉을 세 번 내리쳤다. 야당 쪽에서 박수가 터졌고 여당 쪽에서는 탄식과 고함이 뒤엉켰다. 여당 의원 몇은 자리를 박차고 본회의장을 나가 버렸다.\n\n집무실 화면으로 같은 장면을 보던 대통령은 한동안 말이 없다가 리모컨을 내려놓았다. 국회가 길을 막았으니 우리는 이 전쟁에서 공식적으로 중립을 지켜야 한다. 대만에 보낼 탄약도, 의용군도 이제 법으로는 없는 것이 되었다."
 TFRKPHN_lg_36_b:0 "그래도 손을 놓고 있을 수는 없다. 바다 건너 불길이 언제 이쪽으로 번질지 모르니, 법이 허락하는 범위에서 할 일은 오히려 늘었다.\n\n그날 밤 국방부와 외교부 실무자들은 늦게까지 남아 법이 막은 일과 막지 않은 일을 표 두 장에 나눠 적었다. 탄약 대여와 의용군은 첫 장에 들어갔다. 수출 계약, 정보 교류, 민간 조선소 수주는 둘째 장에 적혔는데, 적다 보니 둘째 장이 첫 장보다 길어졌다. 국가안보실장은 둘째 장만 대통령에게 올렸다."
 TFRKPHN_lg_37_a:0 "거제 옥포 조선소 영업팀 사무실.\n\n\"부장님, 또 들어왔습니다. 이번엔 화물선 서른 척입니다.\"\n\"발주처는?\"\n\"싱가포르 해운회사라는데 작년에 세운 회사입니다. 직원이 세 명이고요.\"\n\n부장은 아무 말 없이 계약서를 넘겼다. 지난달에는 파나마 국적 신생 해운사가 스물다섯 척을, 그 전달에는 홍콩 무역회사가 마흔 척을 주문했다. 모두 처음 듣는 회사였는데 납기는 최대한 빨리였고 선금은 한 번에 들어왔다. 그렇게 넘겨진 배들이 얼마 뒤 대만 해협과 일본 근해에서 눈에 띄었다."
 TFRKPHN_lg_37_b:0 "\"이거 괜찮은 겁니까? 중국이 알면...\"\n\"우린 배를 팔았을 뿐이야. 산 사람이 그 배로 뭘 하든 우리가 알 바 아니지.\"\n\n정부 입장도 다르지 않다. 대한민국은 중립국이고 민간 기업의 정상적인 수출 계약에는 끼어들지 않는다. 신생 해운사들이 보낸 선금이 어느 나라 계좌에서 나왔는지도 우리는 묻지 않기로 했다.\n\n배 설계도에는 화물선이라면 필요 없을 보강재가 몇 군데 들어가 있었다. 조선소는 그 까닭을 묻지 않고 그날 밤에도 용접 불꽃을 밝혔다."
 TFRKPHN_lg_40_a:0 "바르샤바의 폴란드 국방부 청사. 긴 탁자 양쪽에 앉은 두 나라 대표가 마지막 서명을 마치자 카메라 플래시가 한꺼번에 터졌다. K2 전차와 K9 자주포, FA-50 경공격기를 한데 묶은 계약으로, 우리 방위산업 역사상 가장 큰 수출이다.\n\n폴란드 국방차관이 통역을 거쳐 웃으며 말했다.\n\"솔직히 처음엔 반신반의했습니다. 아시아의 중립국이 우리한테 무기를 팔 수 있을까 싶었죠. 그런데 런던에서 한국이 하는 말을 듣고 생각이 바뀌었습니다. 전쟁을 보면서도 할 말은 하는 나라라면 믿고 거래해도 되겠다고요.\""
 TFRKPHN_lg_40_b:0 "미국이 무너진 뒤로 유럽의 무기고는 텅 비었다. 대서양 건너에서 오던 전차와 포탄은 끊겼고 동쪽 국경은 날이 갈수록 팽팽해졌다. 유럽에 필요한 건 빨리, 많이 만들어 줄 나라였다. 칠십 년 동안 전쟁에 대비해 온 우리에게 바로 그런 공장들이 있었다.\n\n그 주부터 창원의 방산 공장들은 삼교대로 돌아갔다. 대만에 총을 보내지 못하는 대신 공장은 쉬지 않는다. 서명식 날 밤 창원의 한 공장 게시판에 붙은 다음 달 근무표에는 잔업 칸이 빈틈없이 채워져 있었다."
 TFRKPHN_lg_441_a:0 "함흥 장마당에 소문이 돈다. 밤마다 벽보를 붙이고 다니는 사람들이 있는데 이름도 얼굴도 아는 이가 없다고 한다. 보위부는 벽보를 떼어 낸 사람까지 잡아갔다.\n\n벽보 내용은 짧았다. 배급은 다 어디로 갔느냐, 평양 사람들만 먹고 사느냐 같은 물음이 삐뚤빼뚤한 손글씨로 적혀 있었다. 누군가 그걸 중국 휴대전화로 찍어 국경 너머로 보냈고, 그 사진이 우리 정보기관 손에 들어왔다."
 TFRKPHN_lg_441_b:0 "보위부가 벽보를 뗀 사람까지 끌고 가자 장마당 사람들은 벽보를 보고도 못 본 척했다. 그런데 다음 날 아침이면 다른 골목에 새 벽보가 또 붙었다. 함흥 사람들은 읽는 티도 안 내고 떼지도 않은 채 그 앞을 천천히 지나갔다.\n\n\"동무, 그거 보지 말라우.\" \"내래 안 봤시요. 길이 이리로 나서 지나가는 기지.\"\n\n우리 분석관들은 글씨를 맞대 보고 적어도 다섯 사람이 썼다고 판단했다. 붙이는 쪽이 조직이라는 얘기다. 그들이 누군지는 아직 아무도 모르고, 어쩌면 그들끼리도 서로 이름을 모를 것이다.\n\n국가정보원은 벽보 사진을 대북 방송 원고 담당자에게 넘겼다. 담당자는 그 물음을 방송에 그대로 옮길지 한참 고민하다가, 맞춤법 틀린 곳까지 그대로 살려 원고에 옮겼다."
 TFRKPHN_lg_442_a:0 "청진의 한 공장 담벼락에 자유조선 마크가 나타났다. 보위원들이 새벽에 페인트로 덮었는데 덮은 자리가 오히려 더 눈에 띄었고, 출근하던 노동자들이 하나도 빠짐없이 그 앞을 지나갔다.\n\n마크는 손바닥만 했다. 별 하나와 둘레의 원 하나, 그 아래 짧은 글자. 붓 대신 손가락으로 그린 것처럼 선이 거칠었다. 보위원들이 칠한 회색 페인트는 담벼락 다른 데보다 색이 밝아서, 마크가 있던 자리를 네모나게 도드라지게 만들었다.\n\n그 주에 청진의 다른 공장 두 곳에서도 같은 마크가 나왔다. 보위부는 노동자들을 한 사람씩 불러 앉혔다.\n\n\"그린 놈 봤어, 못 봤어?\" \"못 봤습네다.\" \"매일 그 앞을 지나가지 않네?\" \"지나가디요. 근데 내래 고개를 숙이고 다닙네다. 원래 그렇게 다녀야 된다고 배웠시요.\"\n\n조사관은 더 묻지 못하고 펜을 내려놓았다. 우리 정보기관은 이 마크가 국경 너머 자유조선 조직이 쓰는 것과 같다는 걸 확인했다. 북한 안에 그 조직과 줄이 닿은 사람이 있고, 그 사람에게 동료가 여럿 있다는 뜻이다."
 TFRKPHN_lg_443_a:0 "북한 고위 간부 하나가 가족을 데리고 제3국 한국 대사관 문을 두드렸다. 가방에는 당 조직 명단이 들어 있었고, 국가정보원은 그를 서울로 데려왔다.\n\n금요일 밤 열한 시였다. 당직을 서던 젊은 외교관이 문을 열자 그는 아내와 고등학생 딸을 데리고 서 있었다. 그는 한국어로 짧게 자기 직책을 말한 뒤 가방을 열어 보이지도 않고 그대로 외교관 손에 쥐여 주었다."
 TFRKPHN_lg_443_b:0 "서울로 오는 비행기에서 그의 딸은 내내 창밖만 봤다. 국가정보원 요원은 아이가 비행기를 처음 탄다는 걸 눈치챘다. 착륙할 무렵 서울 불빛이 창 아래로 깔리자 아이가 처음 입을 열었다.\n\n\"저기 불 켜진 데가 다 집입네까?\" \"응. 다 집이야. 아파트라는 거.\" \"저렇게 많은데, 다 사람이 삽네까?\"\n\n명단에는 당 중앙 부서 이름과 간부 이름, 연락 방식이 빼곡했다. 분석관들이 다른 귀순자들 진술과 맞춰 보니 맞는 이름이 많았다. 이제 정부가 정해야 한다. 그를 기자들 앞에 세우면 북한 안의 동요가 커지고, 감춰 두면 명단을 더 오래 써먹을 수 있다."
 TFRKPHN_lg_444_a:0 "북한 공군 전투기 한 대가 서해 위로 내려왔다. 조종사가 날개를 좌우로 흔들자 우리 공군이 기체를 수원 기지로 이끌었다. 1996년에도 이철수 대위가 미그기를 몰고 같은 길로 넘어온 적이 있다.\n\n처음 레이더에 잡혔을 때 공군 작전사령부에 비상이 걸렸다. 북쪽에서 전투기 한 대가 경계선을 향해 곧장 날아오고 있었다. 우리 전투기 두 대가 바로 떠올라 따라붙자, 북한 전투기는 귀순 의사를 알리는 국제 신호대로 날개를 천천히 좌우로 흔들었다."
 TFRKPHN_lg_444_b:0 "수원 기지 활주로에 내린 조종사는 두 손을 들고 기체에서 내려왔다. 연료 게이지는 바닥이었다. 정비병이 건넨 생수 한 병을 다 비우고 나서야 그가 입을 열었다.\n\n\"이번 달에 기름 받은 거, 오늘이 처음이었시요. 그래서 나왔디요. 다음 달엔 또 언제 받을지 모르니까니.\"\n\n그가 몰고 온 기체는 낡았다. 정비 기록을 보니 몇 해째 부품을 못 바꾼 곳이 수두룩했다. 공군 정보 장교들은 북한 공군이 실제로 띄울 수 있는 전투기가 생각보다 훨씬 적을 거라고 보고했다.\n\n다음 날 아침 조종사가 처음 가족 얘기를 꺼냈다. 아내와 어린 아들이 비행장 옆 관사에 산다고 했다. 그 말을 하고 그는 오래 창밖만 봤다."
 TFRKPHN_lg_445_a:0 "신의주 장마당에 사람들이 모였다. 단속반이 한 상인의 쌀을 빼앗은 게 시작이었다. 수백 명이 인민위원회 건물 앞까지 걸어갔고 보위부가 총을 쏘고서야 흩어졌다.\n\n쌀을 뺏긴 사람은 쉰 넘은 여자 상인이었다. 그는 단속반 팔을 붙잡고 놓지 않았다. 처음엔 옆 좌판 상인 몇이 말렸다.\n\n\"아즈마이, 그만하라우. 끌려가.\" 그때 누군가 소리를 질렀다. \"그 쌀 니들이 처먹을라고 뺏는 거 아이가!\" 그 한마디에 사람들이 하나둘 모여들었다."
 TFRKPHN_lg_445_b:0 "인민위원회 건물 앞에 선 사람들은 구호를 외치지 않았다. 그냥 서 있었다. 나중에 강을 건너온 한 사람은 수백 명이 아무 말 없이 서 있는 게 더 무서웠다고 했다. 보위부가 공중으로 총을 쏘자 사람들은 흩어졌고, 몇이나 다쳤는지는 아직 확인되지 않았다.\n\n이 일은 압록강 건너 단둥 상인들을 거쳐 바깥에 알려졌다. 우리 정부는 이 소식을 북한 전역에 흘릴지 정해야 한다. 흘리면 다른 도시에서도 같은 일이 벌어질 수 있다.\n\n그날 밤 단둥의 한 조선족 상인이 신의주에서 걸려 온 전화를 받았다. \"오늘 일, 바깥에 꼭 알려 주시라요.\" 상대는 그 말만 하고 끊었다."
 TFRKPHN_lg_446_a:0 "시위를 막으러 나간 부대가 총을 쏘지 않았다는 소문이 돈다. 지휘관이 발포 명령을 따르지 않았고 병사 몇은 아예 시위대 쪽에 섰다는 얘기다. 평양이 그 부대를 해산했지만 소문은 이미 다른 군단까지 번졌다.\n\n소문은 갈래가 여럿이었다. 지휘관이 하늘에 대고 쏘라고 했다는 말도 있고, 병사들이 총을 내려놓고 시위대에게 담배를 돌렸다는 말도 있었다. 한 병사가 그 자리에서 군모를 벗어 던졌다는 얘기까지 돌았다. 어느 게 사실인지는 우리 정보기관도 확인하지 못했다."
 TFRKPHN_lg_446_b:0 "확인할 수 없으니 소문은 더 커졌다. 다른 군단 병사들은 밤마다 초소에서 그 얘기를 주고받았다.\n\n\"우리였으면 쐈갔어?\" \"쉿. 그런 말 하지 말라우.\" \"대답이나 해 보라.\" \"...모르갔다.\"\n\n평양은 그 부대 지휘관을 체포했다는 짧은 내부 통지를 내렸다. 그 통지가 도리어 소문이 사실이라고 확인해 준 꼴이 됐다. 우리 정보기관은 그 지휘관의 이름을 찾고 있다. 그 이름이 북한군 안에서 무엇이 되느냐에 따라 흐름이 바뀔 수 있다.\n\n국경 너머로 들어온 사진 한 장에 시위대 쪽에 선 병사 둘이 찍혀 있었다. 얼굴은 흐렸지만 군복은 또렷했다."
 TFRKPHN_lg_447_a:0 "북한군 병사 한 명이 판문점 군사분계선을 넘었다. 초소에서 뛰쳐나와 남쪽으로 달리는 그의 등 뒤에서 총소리가 났다. 쓰러진 그를 우리 경비대대가 끌어냈고 그는 수술 끝에 살아났다. 2017년 11월에도 북한군 병사 하나가 총을 맞으며 이곳을 넘었다.\n\n경비대대 중사 두 명이 몸을 낮춰 분계선 가까이 기어가 쓰러진 병사의 팔을 잡았다. 북쪽 초소에서는 더 이상 총소리가 나지 않았다.\n\n\"저쪽 애들도 더는 안 쏘더라고요. 쏠 수 있었는데.\" 중사 한 명이 나중에 말했다."
 TFRKPHN_lg_447_b:0 "헬기로 옮겨진 병사는 여덟 시간 동안 수술을 받았다. 외상외과 의사는 그의 몸에서 총알 다섯 개를 꺼냈다. 수술실을 나온 의사는 기자들에게 이 병사가 스무 살도 안 됐다고만 했다.\n\n깨어난 병사는 물부터 찾고, 다음엔 고향 노래를 찾았다. 간호사가 휴대전화로 노래를 틀어 주자 그는 눈을 감고 들었다. 국가정보원은 그가 몸을 추스르면 신문을 시작한다.\n\n두 중사는 그 주에 훈장을 받았다. \"저희는 팔 잡은 것밖에 없습니다. 무거웠습니다.\" 수여식 소감은 그게 다였다."
 TFRKPHN_lg_448_a:0 "혜산의 국경경비대 한 개 분대가 압록강을 건넜다. 탈북을 막던 병사들이 총을 강가에 두고 제 발로 강을 건넌 것이어서, 평양은 국경 경비 병력을 통째로 갈아 치웠다.\n\n강가에 소총 여덟 정이 가지런히 놓여 있었다. 탄창은 따로 빼서 총 옆에 두었다. 다음 날 아침 순찰을 나온 다른 분대가 그걸 찾았다.\n\n\"분대장 동지, 이거 보고해야 됩네까?\" \"...해야디. 안 하면 우리가 건넌 줄 알 거 아이가.\"\n\n그 분대는 몇 해 동안 이 강을 건너려는 사람들을 막아 왔다. 뇌물을 받고 눈감아 준 적도 있었고 잡은 사람을 보위부에 넘긴 적도 있었다. 강을 건넌 병사 하나는 나중에 중국에서 한국 영사관에 연락해, 자기가 잡았던 사람들 얼굴이 지금도 다 기억난다고 털어놓았다."
 TFRKPHN_lg_448_b:0 "평양은 혜산 경비 병력을 다른 지역 병력으로 갈아 끼웠다. 새로 온 병사들은 이 강을 처음 보는 사람들이었다. 국경 장사꾼들은 오히려 잘됐다며 웃었다. 길 모르는 경비병은 어디를 막아야 할지도 모른다.\n\n강가에 남은 소총 여덟 정 사진은 국경 너머로 퍼졌다. 그 주부터 압록강 상류 경비 초소마다 탈영 보고가 잦아졌다."
 TFRKPHN_lg_449_a:0 "유럽에 나가 있던 북한 외교관 하나가 가족과 함께 사라졌다. 며칠 뒤 서울에 나타난 그는 대사관이 외화벌이에 쓰던 계좌를 전부 넘겼다.\n\n그가 사라진 건 일요일 아침이었다. 대사관 직원 가족들이 다 같이 장 보러 가는 날인데 그의 가족만 약속 장소에 나오지 않았다. 대사관은 사흘이 지나도록 본국에 보고하지 못했다. 보고하는 순간 줄줄이 책임질 사람이 너무 많았다."
 TFRKPHN_lg_449_b:0 "그가 넘긴 계좌 목록은 길었다. 유럽 여러 나라 은행에 흩어진 계좌가 위장 회사 이름으로 열려 있었고, 평양의 외화가 그 계좌들로 오갔다. 우리 정부가 목록을 우방국들과 나누자 몇 나라는 그 주 안에 계좌를 묶었다.\n\n서울에서 열린 짧은 회견에서 그는 가족 얼굴은 가려 달라고 부탁했다.\n\n\"남은 동무들이 걱정입네다. 내가 나왔으니 그 사람들이 다 불려 갈 겁네다.\"\n\n그 동료들 가운데 몇이 벌써 다른 나라 대사관 문을 두드렸다는 소문이 돌았다. 그가 서울에 온 지 한 달 뒤, 같은 대사관의 젊은 서기관 하나가 실제로 다른 나라의 한국 대사관에 나타났다."
 TFRKPHN_lg_450_a:0 "청진에서 보위부가 통제를 잃었다. 시위대가 사흘 동안 도 인민위원회 앞을 차지하자 평양이 군을 보냈다. 장갑차가 광장에 들어간 그날 밤 청진의 전화가 모두 끊겼고, 몇 명이 죽었는지는 아무도 모른다.\n\n시위는 배급소 문이 사흘째 안 열린 날 시작됐다. 처음 광장에 모인 사람들은 대부분 공장 노동자의 아내들이었고 손에 빈 자루를 들고 있었다. 둘째 날 노동자들이 일손을 놓고 합류했다. 셋째 날에는 도 인민위원회 하급 간부 몇이 건물 밖으로 걸어 나와 그들 곁에 섰다."
 TFRKPHN_lg_450_b:0 "장갑차가 들어온 밤, 청진 둘레 마을 사람들은 시내 쪽 하늘에서 번쩍이는 불빛을 봤다. 총소리는 새벽까지 이어졌다. 이튿날 아침 광장에는 아무도 없었고 건물 벽에 총알 자국만 남았다.\n\n소식은 이레 뒤에야 바깥으로 나왔다. 두만강을 건넌 한 노동자가 중국 쪽 선교사에게 그날 밤 얘기를 했다. 그가 들고 온 휴대전화에는 광장을 찍은 흐린 사진 세 장이 남아 있었다.\n\n\"찍다가 걸리면 죽는 줄 알았시요. 그래도 누군가는 봐야 할 거 아입네까.\"\n\n우리 정부는 이 사진을 국제사회에 먼저 내밀지, 북한군 병사들 귀에 먼저 흘릴지 골라야 한다."
 TFRKPHN_lg_451_a:0 "양강도 산골에서 주민들이 무기고를 털었다. 그들은 보위부 지서를 습격한 뒤 산으로 들어갔고, 진압하러 간 부대는 사흘째 그들을 찾지 못하고 있다. 마을 사람들이 길을 알려 주지 않는다.\n\n무기고를 턴 사람은 마흔 명 남짓이었다. 대부분 산골 마을 젊은 남자들이었고 몇은 제대한 지 얼마 안 된 군인이었다. 그들은 낡은 소총과 탄약 몇 상자, 지서 창고에 쌓인 쌀을 가져갔다. 쌀은 산으로 들어가는 길에 마을마다 나눠 주었다."
 TFRKPHN_lg_451_b:0 "진압 부대가 마을에 들어갔을 때 마을 사람들은 하나같이 모른다고 했다. 어느 집 노인은 부대원들에게 밥상을 차려 주었다.\n\n\"길은 모르갔고, 밥은 먹고 가라우. 배곯고 산을 어케 타간.\"\n\n부대원들은 밥을 먹고 다음 마을로 갔다. 다음 마을에서도 똑같은 밥상이 차려졌다.\n\n국가정보원은 그들과 닿을 길을 찾았다. 국경 너머 연락책을 거치면 무전기 몇 대를 들여보낼 수 있다는 보고가 올라왔다. 무전기가 들어가면 그들은 바깥과 이어지고 우리는 북한 안에 귀를 하나 더 갖는다. 문제는 그 무전기가 보위부 손에 떨어질 때다. 그러면 산속의 마흔 명도, 우리 연락책도 함께 위험해진다."
 TFRKPHN_lg_452_a:0 "북한군 전차 한 대가 철원 군사분계선을 넘었다. 포신을 뒤로 돌린 채 넘어온 전차에서 승무원 넷이 해치를 열고 손을 들었고, 우리 군은 전차를 후방으로 옮겼다.\n\n전차가 비무장지대 안으로 들어오자 우리 전방 초소는 대전차 화기부터 겨눴다. 전차는 천천히, 아주 천천히 다가왔다. 망원경을 보던 소대장이 포신이 뒤를 향한 걸 먼저 알아챘다.\n\n\"쏘지 마! 쏘지 마라! 쏘지 말라고!\" 그는 무전기에 대고 세 번을 외쳤다."
 TFRKPHN_lg_452_b:0 "해치를 열고 나온 넷 가운데 전차장은 스물여섯 살이었다. 그는 손을 든 채 내려와 우리 소대장에게 짧게 말했다.\n\n\"기름이 요만치밖에 없어서 여기까지밖에 못 왔습네다.\"\n\n소대장은 그 말뜻을 나중에야 알았다. 그들은 처음부터 남쪽으로 올 작정으로 몇 달 동안 연료를 조금씩 빼돌려 모아 왔다.\n\n그 전차는 북한 기갑 부대가 지금 어떤 꼴인지 보여 주는 표본이 됐다. 정비 기록과 탄약 재고, 무전기 주파수까지 우리 군 손에 들어왔다. 육군 기갑학교 교관들은 전차를 분해하다가 몇 해째 안 바뀐 부품이 줄줄이 나오자 혀를 찼다."
 TFRKPHN_lg_453_a:0 "북한 해군 함정 한 척이 동해 북방한계선을 넘었다. 수병들이 함장과 정치지도원을 선실에 가두고 흰 천을 내건 채 속초로 뱃머리를 돌렸다. 우리 해군이 그 배를 항구까지 이끌었다.\n\n처음 발견한 건 우리 초계함이었다. 북방한계선을 넘는 북한 함정이 있다는 보고에 초계함은 전투 배치를 걸었다. 그런데 가까이 가 보니 돛대에 흰 천이 걸려 있었고, 갑판 위 수병들은 무기를 다 내려놓고 손을 흔들고 있었다.\n\n속초항에서 수병 스물두 명이 내렸다. 선실에서 풀려난 함장과 정치지도원은 맨 마지막에 내렸는데 수병들은 둘 쪽으로 눈길도 주지 않았다. 반란을 이끈 갑판장은 신문에서 이렇게 말했다.\n\n\"석 달 동안 배급이 반으로 줄었습네다. 그동안 정치지도원 동지는 살이 쪘시요. 배 안에서 그거 모르는 사람이 없었습네다.\"\n\n함정에는 동해 함대 작전 일지와 기지 배치도도 실려 있었다. 해군 정보 장교들이 커피를 몇 주전자씩 비우며 밤새 일지를 읽었다. 마지막 몇 쪽은 기름이 없어 출항하지 못한 날들의 기록으로 채워져 있었다."
 TFRKPHN_lg_454_a:0 "보위부가 단속 부대를 보냈지만 그 부대는 돌아오지 못했다. 장마당 상인들이 길을 막자 뒤따라온 주민들이 부대를 에워쌌다. 총소리가 한참 이어졌고 살아 나온 보위원은 없었다. 평양은 그 지역에 단속 부대를 다시 보내지 못했다.\n\n일이 벌어진 곳은 평안남도의 한 장마당이었다. 보위원들이 상인 돈을 뜯어 가기로 이름난 곳이었다. 단속 부대가 도착한 날, 상인들은 처음으로 돈을 내놓지 않고 좌판을 지켰다. 그들 뒤에 마을 사람들이 서 있었다.\n\n\"오늘은 못 내갔시요. 내일도 못 내고, 모레도 못 냅네다.\" 맨 앞에 선 늙은 상인이 말했다.\n\n그날 오후 일은 본 사람마다 말이 달랐다. 보위원이 먼저 쐈다는 사람도 있고 군중 속에서 누가 먼저 총을 들었다는 사람도 있었다. 해 질 무렵 장마당이 조용해졌다는 것만은 모두 같았다.\n\n그 뒤로 그 지역 보위원들은 밤에 혼자 다니지 않는다. 상인들은 다시 좌판을 열었고 이제 돈 뜯으러 오는 사람은 없다. 우리 정보기관은 지도에서 그 지역을 평양 손이 닿지 않는 첫 번째 곳으로 칠했다."
 TFRKPHN_lg_455_a:0 "북한에서 올라오는 보고가 하루 사이에 달라졌다. 도 당위원회들이 평양 지시에 답하지 않고, 공장은 멈췄으며, 열차는 역에 선 채 움직이지 않는다. 병사들이 부대 식량 창고를 털었다는 보고까지 올라왔는데 평양 방송은 어제와 똑같은 말만 되풀이하고 있다.\n\n국가정보원 상황실 대형 화면의 북한 지도는 하루 만에 색이 바뀌었다. 평양 지시가 닿는 곳을 칠한 초록색이 수도 둘레만 남기고 사라졌다. 분석실장은 화면 앞에 한참 서 있다가 말했다.\n\n\"오늘부터 도별로 따로 봐. 이제 저건 나라 하나가 아니야.\"\n\n국경 너머에서도 같은 신호가 왔다. 단둥과 훈춘 상인들은 북쪽에서 물건 사러 오는 사람이 뚝 끊겼다고 했다. 강을 건너려는 사람은 오히려 늘어서 중국 국경 수비대가 경계 병력을 두 배로 늘렸다.\n\n그날 밤 대통령실에서 긴급 회의가 열렸다. 북한이 무너질 때 무엇부터 해야 하는지 정리한 문서가 금고에서 나왔다. 첫 장에는 식량이, 둘째 장에는 무기고가, 셋째 장에는 핵시설이 적혀 있었다. 회의는 셋째 장에서 가장 오래 멈췄다."
 TFRKPHN_lg_456_a:0 "김정은의 형 김정철이 북한을 빠져나왔다. 권력에서 밀려나 조용히 지내던 사람이라 바깥에는 에릭 클랩튼 공연장에서 찍힌 사진 정도로만 알려져 있었다. 그런 그가 제3국 한국 대사관에 걸어 들어와 망명을 신청했는데도 평양은 아무 발표도 하지 않았다.\n\n당직 직원은 처음에 그가 누군지 몰랐다. 내민 여권의 이름을 보고서야 본국에 긴급 전문을 보냈고, 전문은 새벽 세 시에 국가정보원장의 휴대전화를 울렸다."
 TFRKPHN_lg_456_b:0 "서울의 반응은 갈렸다. 정보기관은 그가 쥐고 있을 법한 얘기에 눈독을 들였다. 백두혈통 집안사람이 평양을 등졌다는 사실 하나만으로도 북한 안에 던질 파장이 컸다. 외교부 몇몇은 그를 받아들이는 순간 평양이 마지막 남은 대화 창구마저 닫아 버릴까 걱정했다.\n\n평양의 침묵은 길어졌다. 조선중앙방송은 그의 이름을 한 번도 입에 올리지 않았고, 그 침묵이 북한 안에서 소문을 키웠다. 장마당에서는 백두혈통도 떠났다는 말이 돌았다.\n\n\"그 집안 사람도 나갔다믄, 우린 뭘 믿고 사네?\" 혜산의 한 상인이 그렇게 말했다는 보고가 그 주 국정원에 올라왔다."
 TFRKPHN_lg_457_a:0 "[TFRKPHN_nk_lost_name]에 주둔한 군단이 평양 명령을 받지 않는다. 군단 지휘부는 총정치국에서 내려온 검열단을 부대 정문에서 돌려보냈고, 병사들이 도 보위부 청사를 에워싸자 보위원들은 무기를 내려놓았다. 도 경계 초소마다 평양에서 오는 차를 막는 차단봉이 내려가 있어 평양은 그 도에 군대를 들이지 못하고 있다.\n\n군단장은 아직 성명 한 줄 내지 않았다. 남쪽에 손을 내밀지도 않았고 평양에 맞서겠다고 나서지도 않았다. 그냥 명령을 안 받을 뿐이다. 도 인민위원회는 군단 허락을 받아 배급소 문을 다시 열었고, 몇 달 만에 쌀이 나왔다."
 TFRKPHN_lg_457_b:0 "그 도 주민들은 처음엔 무슨 일이 벌어졌는지 몰랐다. 평양 방송은 여전히 같은 말을 했다. 그런데 거리에서 보위원들이 사라지고 배급소에 쌀이 나오자 사람들도 뭔가 바뀌었다는 걸 알아챘다.\n\n국가정보원은 군단장에게 닿을 길을 찾고 있다. 그가 무엇을 원하는지는 아직 아무도 모른다.\n\n그 도를 지나는 열차들은 이제 군단 허락을 받고 움직였다. \"평양서 가라 하고 군단서 서라 하면 어케 합네까?\" 한 기관사가 역장에게 물었지만 역장도 대답하지 못했다."
 TFRKPHN_lg_458_a:0 "전방 군단 지휘관들이 휴전선으로 걸어 나왔다. 흰 천을 든 부관이 앞장서고 군단장 둘과 사단장 여럿이 뒤따랐다. 그들이 가방째 넘긴 건 작전 지도와 통신 암호였고, 그 안에 평양방어군단 배치도까지 들어 있었다.\n\n그들이 나온 곳은 중부 전선의 한 통문이었다. 우리 측 대대장은 처음에 함정을 의심했다. 고위 장교 수십 명이 한꺼번에 넘어온 일은 휴전 뒤로 한 번도 없었다. 맨 앞 부관이 든 흰 천만이 그들이 왜 왔는지 말해 주었다.\n\n군단장 하나는 통문을 넘자마자 뒤를 돌아봤다. 산등성이 너머에 그가 지휘하던 부대 진지가 있었다.\n\n\"병사들한텐 아무 명령도 안 내리고 왔습네다. 기니까 내 병사들은 쏘지 마시라요. 그 아새끼들은 아무것도 모릅네다.\"\n\n대대장은 대답 대신 고개를 끄덕이고 무전병에게 사격 중지를 다시 확인하라고 했다. 가방은 그날 밤 국방부 지하 상황실로 옮겨졌다. 평양방어군단 배치도가 탁자에 펼쳐지자 장교들은 한동안 아무 말도 못 했다. 평양으로 가는 길이 그 종이 위에 고스란히 그려져 있었다."
 TFRKPHN_lg_459_a:0 "평양 한복판에서 총소리가 났다. 평양방어군단의 한 여단이 호위사령부 검문을 거부하면서 두 부대가 대동강 다리를 사이에 두고 밤새 총을 쐈다. 아침에 길에 나온 평양 시민들은 불탄 장갑차를 봤다.\n\n총소리는 자정 무렵 시작됐다. 대동강 변 아파트 주민들은 불을 끄고 창문에서 떨어져 앉았다. 군에서 제대한 사람들은 그 소리가 뭔지 알았다.\n\n\"엎드리라. 머리 들지 말고. 묻지도 말라.\" 그들은 가족들에게 그 말만 했다."
 TFRKPHN_lg_459_b:0 "아침이 되자 다리 위에 불탄 장갑차 두 대가 서 있었다. 시민들은 출근길에 그 옆을 지나갔고 사진을 찍는 사람은 없었다. 그날 오후 장마당에서는 다들 그 얘기만 했다.\n\n평양은 이 나라에서 가장 안전한 곳이어야 했다. 수도에 들어오는 사람은 모두 검문을 받았고 수도 사람은 제일 먼저 배급을 받았다. 그 평양에서 두 부대가 서로 총을 쐈다. 평양도 이미 둘로 갈라졌다.\n\n우리 정보기관은 그 여단장이 평양방어군단에서 오래 복무한 사람이라는 걸 확인했다. 다음 날 평양 방송은 아무 일 없었다는 듯 같은 노래를 틀었다."
 TFRKPHN_lg_460_a:0 "합참의장이 두꺼운 서류철을 들고 집무실에 들어왔다. 북으로 올라가는 작전계획이었다.\n\n지도에 길이 둘 그려져 있었다. 하나는 개성을 지나 평양으로 곧장 가는 길이고, 하나는 동해안에 병력을 올려 원산을 치는 길이었다.\n\n\"서부 축선은 넓고 짧습니다. 대신 놈들도 거기를 제일 두껍게 막아 놨습니다. 휴전선에서 평양까지 지뢰밭이랑 포진지가 겹겹입니다.\" 합참의장이 손가락으로 선을 그었다. \"동해안은 등 뒤를 칩니다. 문제는 바다가 날씨 따라 열렸다 닫혔다 하고, 상륙함이 모자라면 남의 배를 빌려야 한다는 겁니다.\""
 TFRKPHN_lg_460_b:0 "합참의장은 두 길의 사상자 추정치를 따로 적어 왔다. 둘 다 큰 숫자였다. 대통령은 두 숫자를 한 번씩 소리 내어 읽었다.\n\n함께 들어온 육군과 해군 참모총장은 서로 다른 길을 밀었다.\n\n\"서부로 가야 빨리 끝납니다.\" \"빨리 끝나는 게 아니라 빨리 죽는 겁니다. 동해로 돌아야 합니다.\" \"돌다가 날씨 틀어지면요?\"\n\n회의가 끝난 뒤에도 두 참모총장은 복도에서 목소리를 낮추지 않았다."
 TFRKPHN_lg_461_a:0 "예비군 동원 훈련이 끝났다. 동원사단마다 사람이 찼고 전방 창고에는 탄약과 연료가 들어갔다. 국방부 장관은 명령만 떨어지면 사흘 안에 병력을 전방에 세울 수 있다고 보고했다.\n\n훈련장에 모인 예비군 가운데 양안전쟁 때 비상소집으로 불려 나갔던 사람이 많았다. 몇 해 만에 다시 군복을 입은 그들은 소집 첫날 아침 점호에서 서로 아는 얼굴을 찾느라 줄이 흐트러졌다.\n\n\"야, 너 김 병장 아니냐? 그때 같은 참호에 있던.\" \"형님! 살 엄청 찌셨네요.\" \"너는 머리가 엄청 빠졌다.\""
 TFRKPHN_lg_461_b:0 "훈련 마지막 날, 한 예비군 소대장이 소대원들을 모아 놓고 말했다.\n\n\"집에 가면 식구들한테 말해 둬. 이번엔 진짜일 수도 있다고. 갑자기 말하면 더 놀란다.\"\n\n소대원 몇은 저녁 먹는 내내 말이 없었다.\n\n동원사단 창고는 다시 가득 찼다. 장부를 맡은 보급관은 그 창고가 얼마나 버틸지 따로 계산해 두었는데 그 숫자는 장관 보고서에 들어가지 않았다.\n\n주말에 예비군들은 각자 집으로 돌아갔다. 그 가운데 한 사람은 현관문을 열기 전에 군복 윗옷을 벗어 가방에 쑤셔 넣었다. 아이가 그걸 보면 아빠 또 가느냐고 물을 것 같았다."
 TFRKPHN_lg_462_a:0 "대통령이 전방 군단을 돌아봤다. 군단장들은 하나같이 명령만 내리시면 된다고 했다. 포병은 표적을 정해 두었고 기동군단은 도하 장비를 강가에 갖다 놓았다는 보고를 다 듣고, 대통령은 북쪽을 한참 바라보다가 차에 올랐다.\n\n돌아가기 전에 그는 예정에 없이 한 소초에 들렀다. 스무 살 남짓한 병사들이 지키는 곳이었다.\n\n\"자네들 고향이 어디야?\" \"대전입니다!\" \"광주입니다!\" \"대구입니다!\" \"부산입니다!\"\n\n마지막 병사는 대답하기 전에 잠깐 머뭇거렸다. \"...서울입니다. 할아버지는 평안도에서 내려오셨습니다.\""
 TFRKPHN_lg_462_b:0 "소댐, 정말 우리 가는 거 맞슴까?\n\n철책 너머로 북쪽 초소의 불빛이 보였다. 군은 최고 경계에 들어가 있었다. 소대장은 대답하지 않았다. 벌써 세 번째 듣는 질문이었다. 그래도 이해했다. 지금 일이 믿기지 않을 것이다.\n\n같은 시각 대통령은 합참의장의 보고를 받았다.\n예상 사망자 수가 이 정도인가? 어떻게 더 줄일 수 없겠는가?\n죄송합니다. 이게 최선입니다.\n\n창문에 그의 얼굴이 비쳤다. 민족의 과업인 통일을 이뤄 낼 영웅, 아니면 자신의 욕심으로 수십만을 죽게 할 살인자."
 TFRKPHN_lg_463_a:0 "오산과 군산 활주로에서 옛 미군 소속이던 공군 전투기들이 줄지어 떴다. 같은 시각 동해 건너에서는 일본 공군 편대가 이륙했다. 두 편대가 휴전선 남쪽 하늘에서 만나 북쪽으로 머리를 돌리자 평양의 방공 레이더가 한꺼번에 켜졌다.\n\n오산 활주로 끝에서는 정비사들이 이륙하는 기체마다 손을 흔들었다. 그중 몇은 미군이 떠나기 전 이 기지에서 같은 기체를 정비하던 사람들이다. 이제는 한국 공군 군무원이다.\n\n\"저 녀석 엔진, 내가 지난주에 갈았어. 잘 돌아와라.\" 한 정비사가 귀마개를 누르며 중얼거렸다.\n\n편대가 휴전선을 넘는 순간 공군 작전사령부 상황실이 조용해졌다. 대형 화면에 아군 기체는 초록 점으로, 북쪽 레이더 기지는 빨간 점으로 찍혀 있었고, 빨간 점이 하나씩 꺼질 때마다 누군가 참았던 숨을 내쉬었다.\n\n첫 출격에서 돌아온 조종사들은 활주로에 내리고도 한동안 조종석에서 나오지 않았다. 그날 오후 국방부에 첫 출격 결과가 올라갔다. 우리 쪽 손실은 없었지만 아직 첫날이라 상황실에서 박수 치는 사람은 없었다."
 TFRKPHN_lg_464_a:0 "사세보와 부산 부두에 함정들이 모였다. 옛 미 7함대 수병들과 제3해병원정군 장병들이 해상자위대와 대한민국 해군 함정에 올랐고, 갑판에서는 상륙 장갑차를 묶는 작업이 밤새 이어졌다. 함대는 이제 북한 해안으로 가라는 명령만 기다린다.\n\n부산 해군기지 부두에는 세 나라 말이 뒤섞였다. 영어로 명령이 오가고 일본어로 위치를 확인하고 한국어로 짐을 실었다. 처음엔 손짓이 더 많았는데 사흘째가 되자 부두 노동자들도 몇 마디씩 따라 했다.\n\n\"오케이, 오케이! 하야쿠! 빨리빨리!\" 크레인 기사가 세 나라 말을 한꺼번에 외치자 갑판에서 웃음이 터졌다."
 TFRKPHN_lg_464_b:0 "갑판에서 장갑차를 묶던 해병 하나는 미국 텍사스에서 왔다. 본국이 무너진 뒤 돌아갈 데가 없어 한국에 남았다. 그는 옆에서 같이 밧줄을 당기던 한국 해병에게 서툰 한국말로 물었다.\n\n\"이거 끝나면, 나 어디 가요?\" 한국 해병은 대답 대신 그의 어깨를 한 번 두드렸다.\n\n함대 사령관은 출항 전날 밤 함장들을 모아 마지막 회의를 열었다. 세 나라 말로 통역하느라 회의는 예정보다 두 배 길어졌다. 출항하는 날 새벽, 부산항 방파제에 나온 해군 가족들은 어둠 속에서 함정 불빛이 안 보일 때까지 손을 흔들었다."
 TFRKPHN_lg_465_a:0 "총정치국이 검열단을 내려보냈지만 검열단은 부대 안으로 한 발짝도 들어가지 못했다. 위병소 병사들이 총을 든 채 길을 막았고 지휘관은 끝내 얼굴을 내밀지 않았다.\n\n\"문 열라우! 총정치국이다!\" \"명령 없이는 못 엽네다.\" \"내가 명령이다!\" \"지휘관 동지 명령 말입네다.\"\n\n검열단장이 평양에 전화를 걸려고 하자 부대 통신병이 선을 뚝 끊어 버렸다. 검열단은 타고 온 차를 두고 걸어서 돌아갔다.\n\n원래 검열단은 북한군에서 제일 무서운 사람들이었다. 그들이 다녀가면 지휘관이 바뀌고 누군가는 사라졌다. 그런 검열단이 위병소 앞에서 한 시간을 서 있다가 걸어서 돌아갔다는 얘기는 하루 만에 다른 부대로 퍼졌다.\n\n그들이 두고 간 차는 부대 안으로 끌려 들어갔다. 이튿날 그 차는 보급 트럭으로 쓰였고, 병사들은 차 문에 붙은 총정치국 표지부터 떼어 냈다.\n\n우리 측 분석관은 보고서에 북한에서 당이 군을 다스리는 방식이 끝나 가고 있다고 적었다. 검열단장은 산길을 걸어 사흘 만에 평양에 닿았고, 그가 올린 보고서는 끝내 공개되지 않았다."
 TFRKPHN_lg_466_a:0 "이인제 대통령이 유승민 전 의원을 집무실로 불렀다. 전화를 받은 유승민은 어리둥절했다. 홍준표가 물려준 정부가 자기를 부를 까닭이 없었다. 비서관이 재벌개혁 공약집을 가져와 달라고 하자 그는 무슨 공약집이냐고 되물었고, 2017년 것이라는 답이 돌아왔다.\n\n유승민은 서류 한 묶음을 내놓았다. 공정거래위원회 전속고발권 폐지, 집단소송제와 징벌적 손해배상제 도입, 총수 일가의 개인회사 금지. 대통령은 서류를 끝까지 읽으면서 두 번 되물었는데, 둘 다 조문 번호를 짚는 질문이었다."
 TFRKPHN_lg_466_b:0 "유승민이 알던 이인제는 당을 여러 번 옮겨 철새 소리를 듣던 사람이었다. 그런 사람이 재계와 맞붙는 법안을 조문까지 읽을 줄은 몰랐다. 집무실을 나오면서 그는 자기가 사람을 별명으로만 알고 있었다고 생각했다.\n\n그날 오후 청와대 정책실 실무자들이 서류를 복사해 법제처와 공정거래위원회로 보냈다.\n\n\"이게 십 년 넘게 서랍에 있었다고요?\" \"응. 종이 누렇게 뜬 거 봐라.\" 복사기 앞에서 실무자 둘이 그렇게 주고받았다."
 TFRKPHN_lg_468_a:0 "경제 단체들이 같은 날 짧은 성명을 냈다. 기업을 죄인 취급하는 법이 이어지면 투자를 미루겠다는 내용이었다. 다음 날 주요 그룹 몇이 신규 채용 계획을 내년으로 넘겼다.\n\n소식은 대학가에 먼저 닿았다. 취업 설명회가 하나둘 취소되고, 한 대학 취업 게시판에는 하반기 공채 일정 미정이라는 공지가 줄줄이 붙었다.\n\n\"야, 이거 찍어 둬. 엄마한테 보여 주게.\" \"왜?\" \"내 탓 아니라고.\""
 TFRKPHN_lg_468_b:0 "청와대 경제수석실이 그 그룹들의 지난 몇 해 채용 숫자를 뽑아 보니, 채용은 법안과 상관없이 해마다 줄고 있었다. 수석은 그 표를 들고 대통령에게 저쪽이 법안 핑계로 원래 하려던 걸 하는 거라고 보고했다.\n\n그래도 숫자로 학생들 불안을 달랠 수는 없었다. 여당 안에서도 속도를 늦추자는 말이 나왔고, 야당은 이번만큼은 정부 법안을 지지한다고 논평했다.\n\n그 주 금요일 청와대가 경제 단체장들을 불러 점심을 함께했다. 식탁에서 법안 얘기는 안 나오고 채용 얘기만 오갔다. 돌아가는 길에 한 회장이 기자들에게 말했다. \"정부가 안 물러설 것 같습니다. 밥이 아주 짰어요.\""
 TFRKPHN_lg_469_a:0 "유승민이 청와대에 다녀갔다는 기사가 오후에 났다. 그날 저녁 홍준표 전 대통령이 페이스북에 여덟 줄짜리 글을 올렸다.\n\n첫 줄은 이인제 대통령이 누구 덕에 그 자리에 앉았느냐는 물음이었다. 홍준표는 이어서 자기가 전쟁을 치르고 물려준 정부의 집무실에 유승민이 들어갔다고 썼다.\n\n그는 옛일을 차례로 꺼냈다. 2011년 유승민이 최고위원 자리를 던지는 바람에 자기가 당 대표에서 물러났고, 2017년 대선에서는 유승민이 보수 표를 갈랐다. 이번 재벌개혁안도 그때 자기가 정의당 공약 같다고 했던 바로 그 안이라고 했다."
 TFRKPHN_lg_469_b:0 "마지막 줄은 짧았다. 사람 쓰는 건 대통령 몫이지만 유승민을 쓰려거든 자기 이름은 빼라고 했다.\n\n글은 한 시간 만에 기사 수십 건이 됐다. 여당 의원들의 전화가 밤새 비서실로 걸려 왔고, 정무수석실 전화는 자정이 넘도록 울렸다.\n\n\"대통령님이 뭐라고 답하실 건지 그것만 알려 주세요.\" \"의원님, 저도 모릅니다. 진짜로요.\"\n\n유승민은 다음 날 기자들을 만나서도 재벌개혁안 얘기만 했다."
 TFRKPHN_lg_471_a:0 "국군 선두 부대가 대동강을 건넜다. 평양 시내에는 총소리가 드물었고 김일성광장 주석단은 비어 있었다. 만수대 언덕 동상 앞에 이북5도위원회 깃발을 든 병사 몇이 서 있었다. 사람들은 아파트 창문으로 내다보기만 했고 거리로 나온 이는 드물었다.\n\n국군은 1950년 10월 19일에도 평양에 들어갔다가 그해 12월에 물러났다. 오늘 들어간 부대는 평양역에 보급소를 차리고 대동강 다리마다 초소를 세웠다."
 TFRKPHN_lg_471_b:0 "첫날 저녁, 평양역 보급소 앞에 아이를 업은 젊은 여자가 제일 먼저 나타났다. 그는 보급소 앞을 몇 번 오가다가 병사에게 다가왔다.\n\n\"쌀... 있습네까?\" \"있습니다. 몇 식구세요?\" \"넷입네다.\"\n\n병사가 쌀 한 자루를 내주자 여자는 고맙습네다를 몇 번이나 하고 돌아갔다. 다음 날 아침 보급소 앞에 줄이 생겼다.\n\n사흘째부터 평양 거리가 조금씩 움직였다. 창문으로 내다보던 사람들이 하나둘 내려와 국군 군복을 신기한 듯 구경했다. 같은 말을 쓰는 군대가 다른 깃발을 들고 있었다. 병사들은 낮에는 거리를 지키고 밤에는 초소에서 북쪽 라디오를 들었다. 방송은 아직 평양 함락을 말하지 않았다."
 TFRKPHN_lg_472_a:0 "이북5도위원회가 평양에서 마지막 회의를 열었다. 안건은 위원회가 다스리던 땅과 군대를 대한민국 정부에 넘기는 안 하나였고 반대는 없었다. 위원들은 회의록에 서명하고 깃발을 내렸다.\n\n이북5도위원회는 1949년에 생겼다. 대통령이 북쪽 다섯 도의 도지사를 임명해 두었지만 그 도지사들은 칠십 년 넘게 자기 도에 한 번도 가 보지 못했다. 오늘 임명된 도지사 다섯은 내일 아침 임지로 떠난다.\n\n회의는 평양의 옛 인민위원회 건물에서 열렸다. 위원들 가운데에는 내전 동안 자유조선군을 이끈 장교들도 있었다. 서명을 마친 그들은 한참 자리를 뜨지 않았고, 한 장교는 자기 부대 깃발을 곱게 접어 가방에 넣었다.\n\n앞마당에서 위원회 깃발이 내려가고 태극기가 올라갔다. 지켜보던 평양 주민 몇은 박수를 쳤고 몇은 그냥 지나갔다.\n\n\"할아버지, 안 가세요?\" \"좀 더 보고 갈란다. 저기 올라가는 거, 내 어릴 적에 한 번 봤다.\"\n\n다섯 도지사는 이튿날 새벽 각자 임지로 떠났다. 함경북도 도지사는 청진까지 가는 데 꼬박 하루가 걸렸다."
 TFRKPHN_lg_473_a:0 "정부가 대한민국 헌법이 한반도 전역에 시행된다고 공포했다. 이인제 대통령이 판문점에서 공포문에 서명하자 그날 오후부터 군사분계선 표지판이 뽑혀 나가기 시작했다. 1953년에 세운 표지판은 1,292개였지만 지금 남은 건 그보다 훨씬 적었다.\n\n서울역 전광판에 평양행 열차 시간표가 올라왔다. 첫 열차는 다음 달이다. 북쪽 주민등록과 화폐, 학교와 병원이 내일부터 정부 일이 되기 때문에 행정안전부는 공무원 3천 명을 먼저 올려 보내기로 했다."
 TFRKPHN_lg_473_b:0 "판문점 공포식에는 이산가족 단체 노인들이 초대받았다. 몇은 휠체어를 타고 왔다. 첫 표지판이 뽑히는 순간 한 노인이 휠체어에서 일어서려다 옆 사람 부축을 받았다.\n\n\"가만, 가만 있어 봐라. 소리 좀 듣자.\" 그는 표지판이 땅에서 빠져나오는 소리를 들으려고 귀를 기울였다.\n\n그날 밤 방송사마다 같은 장면을 되풀이해 틀었다. 뽑힌 표지판은 트럭에 실려 전쟁기념관으로 갔고, 기념관은 그중 하나를 입구에 세우기로 했다. 다음 날 아침 전국 초등학교 교실 벽에 휴전선 없는 새 지도가 걸렸다."
 TFRKPHN_lg_474_a:0 "특별수사팀이 한 그룹 재무팀에서 장부를 압수했다. 장부에는 전쟁 동안 군납 계약을 따낸 날짜와 그 앞뒤로 나간 돈이 적혀 있었고, 받은 사람 칸에는 이름 대신 머리글자만 있었다. 수사팀이 머리글자 열하나 가운데 일곱을 풀어 보니 그중 넷이 여당 현역 의원이었다.\n\n장부를 처음 찾은 건 수사팀 막내였다. 재무팀 서류함 맨 아래 칸, 낡은 회계 감사 보고서 사이에 끼어 있었다. 표지에는 비품 관리 대장이라고 적혀 있었다.\n\n\"팀장님. 팀장님! 이리 좀 와 보세요. 이거 비품 아닌데요.\""
 TFRKPHN_lg_474_b:0 "머리글자를 푸는 데 사흘이 걸렸다. 수사관들은 계약 날짜에 맞춰 국회 출입 기록과 의원 일정표를 하나씩 대조했다. 마지막 이름이 맞아떨어지자 수사팀장은 사무실 문을 잠갔다.\n\n\"전화기 다 책상 위에 올려. 오늘 밤 아무도 밖에 말 안 한다.\"\n\n검찰총장이 보고서를 들고 청와대에 갔을 때 여당 원내대표가 한 시간 먼저 와서 기다리고 있었다. 그날 오후 작은 회의실에서 세 사람이 마주 앉았다. 대통령은 두 사람 보고를 다 들은 뒤 한참 동안 장부 사본만 넘겼다."
 TFRKPHN_lg_475_a:0 "검찰이 수사 결과를 발표했다. 그룹 총수 둘과 전현직 의원 다섯이 뇌물과 배임 혐의로 재판에 넘겨졌다. 삼백 쪽이 넘는 공소장에 군납 계약서와 계좌 내역, 운전기사의 운행 일지까지 증거로 붙었다.\n\n발표 날 의원회관의 몇몇 방은 종일 문이 닫혀 있었다. 기소된 의원들 보좌진은 기자 전화를 받지 않았다. 한 방의 비서는 점심때 회관 식당에서 혼자 밥을 먹다가 옆 테이블 보좌관들이 수군거리며 쳐다보는 걸 느끼고 숟가락을 내려놓았다."
 TFRKPHN_lg_475_b:0 "경제 단체들은 그날 성명을 내지 않았다. 주요 그룹 대관 담당 임원들은 그 주에 줄줄이 자리를 옮겼다.\n\n전쟁 동안 군에 물자를 대던 중소기업들은 공소장을 다르게 읽었다. 같은 때 같은 군에 물건을 대면서 아무것도 건네지 않았던 회사들이다.\n\n\"그때 우리가 왜 계약을 못 땄는지 이제 알겠네. 견적서만 잘 쓰면 되는 줄 알았지.\" 한 부품 회사 사장이 신문을 접으며 쓴웃음을 지었다.\n\n재판 첫날 법원 앞에는 기자들이 몰렸다. 기소된 의원 하나는 법정에 들어가기 전 짧게 무죄를 주장했다."
 TFRKPHN_lg_477_a:0 "대통령은 실업과 싸우는 법을 한 번 만들어 본 사람이다. 고용보험법은 1993년 12월 27일에 만들어졌는데, 그가 노동부 장관에서 물러난 바로 그달이다.\n\n이 법은 일자리를 잃은 사람에게 실업급여를 주고, 사람을 안 내보내는 기업에 고용안정 지원금을 주고, 실업자와 재직자에게 직업훈련을 시킨다. 처음 보험료는 임금의 0.6퍼센트였고 사업주와 노동자가 절반씩 냈다. 급여는 30일에서 210일까지 나왔다."
 TFRKPHN_lg_477_b:0 "대통령은 그때부터 이 법의 한계를 알았다고 말한다. 실업급여는 다음 일터를 찾을 때까지 버티라고 주는 돈인데, 다음 일터가 없으면 끝나는 날짜만 정해진 돈이 된다.\n\n지금 구직 창구 앞에는 군복을 벗은 수십만 명이 서 있다. 급여 창구만 늘려서는 저 줄이 줄지 않는다. 대전의 한 고용센터에서는 전역증을 쥔 청년들이 번호표를 뽑고 두 시간을 기다렸다.\n\n\"다음 분! 아, 또 군인이시네. 오늘만 백 번째예요.\" 상담 창구 직원이 목을 주무르며 말했다.\n\n늙은 노인이 전쟁을 하나 더 하겠다고 발표했다. 이번 상대는 실업이다."
 TFRKPHN_lg_481_a:0 "코스닥은 1996년 7월에 문을 열었다. 미국 나스닥을 본뜬 시장으로, 공장도 담보도 없는 회사가 기술 하나 들고 돈을 구하는 곳이었다.\n\n2000년 3월 10일에 지수는 2,834까지 치솟았다. 그때 대통령은 회사 이름에 닷컴만 붙으면 사람들이 돈을 쏟아붓는 걸 지켜봤다. 2001년 말 지수는 722로 떨어졌고 2008년 10월에는 261까지 내려앉았다. 돈을 잃은 사람들은 벤처 소리만 들어도 고개를 돌렸다.\n\n거품은 꺼졌지만 그 거품 속에서 회사들이 태어났다. 지금 우리가 쓰는 검색과 게임을 만든 회사들이 그 시장에서 첫돈을 구했다."
 TFRKPHN_lg_481_b:0 "전쟁은 무인기와 인공지능 기술을 몇 해 앞당겼고, 그 기술이 지금 군 창고에 쌓여 있다. 창고 속 기술을 민간으로 풀려면 돈이 모이는 곳이 다시 있어야 한다. 관광과 의료와 문화도 같은 돈을 기다린다.\n\n거품이 무섭다고 시장 문을 닫을 수는 없으니 이번에는 장부부터 본다. 상장을 신청하는 회사는 매출 장부와 기술 출처를 함께 내야 하고, 군에서 나온 기술은 국방부 확인서를 붙여야 한다.\n\n늙은 노인이 내일 거래소에 가겠다고 발표했다."
 TFRKPHN_lg_483_a:0 "이정훈은 올해로 쉰둘이 됐다.\n\n공원 벤치에서 딸과 마주친 날로부터 다섯 해가 흘렀다. 그사이 그는 대리운전을 하고 물류센터에서 상자를 날랐고, 전쟁 중에는 탄약 공장에서 야간 검수를 했다. 명함에 부장이라고 찍힌 적은 한 번도 없었다.\n\n면접은 인천항 부두에서 봤다. 쑤저우에서 십오 년 동안 세탁기 모터를 만들다가 전쟁이 나자 설비를 뜯어 돌아온 회사였다. 야적장에 컨테이너 마흔 개가 쌓여 있었고, 공장장이 그중 하나를 열자 중국어 안내문이 그대로 붙은 기계가 나왔다."
 TFRKPHN_lg_483_b:0 "\"이정훈 씨, 공대 나오셨죠. 이 라인 돌려 본 사람이 국내에 몇 없습니다.\"\n\"공장은 어디에 세웁니까.\"\n\"아직 모릅니다. 정부가 터를 정해 주기로 했어요. 정해지면 바로 나오실 수 있습니까.\"\n\"어디든 나갑니다.\"\n\n부두를 나온 정훈은 주차장에서 바로 이제 대학생이 된 딸 서진에게 전화를 걸었다.\n\n\"아빠 취직했다.\"\n\"진짜? 어디?\"\n\"중국에서 돌아온 회사. 아빠가 옛날에 하던 일이야.\"\n\n수화기 너머에서 딸이 소리를 질렀다. 그러고는 웃으며 말했다. \"오늘 저녁은 내가 살게. 비싼 거 먹자.\""
 TFRKPHN_lg_484_a:0 "경기도 시흥, 시화공단 끝자락의 금형 공장.\n\n공장 문 앞에 낯선 사람 셋이 서 있었다. 톈진 전기차 배터리 공장에서 일하던 기술자들로, 마지막 여객선을 타고 나왔다고 했다. 그중 한 사람이 가방에서 배터리 셀 케이스 도면을 꺼냈다.\n\n\"설비는 다 두고 왔습니다. 도면하고 사람만 왔어요. 금형부터 다시 파야 합니다.\"\n\n사장 김씨가 도면을 작업대에 펴 보니 공차가 머리카락 굵기의 십분의 일이었다. 옆에서 들여다보던 박 반장이 혀를 찼다.\n\n\"사장님, 이거 우리 기계로 됩니까?\""
 TFRKPHN_lg_484_b:0 "\"되게 해야지. 이 사람들 공장 터도 아직 없대.\"\n\n톈진에서는 이 금형을 석 달 만에 받았다고 기술자 하나가 말하자 김씨는 벽 달력을 한 번 쳐다봤다.\n\n\"두 달에 해 주겠소. 대신 시험 사출 때 와서 같이 보시오.\"\n\n기술자들이 돌아가자 박 반장이 장갑을 벗었다.\n\n\"두 달이면 밤일입니다.\"\n\"삼겹살은 내가 산다.\"\n\"소주도요.\"\n\n두 달 뒤 시험 사출 날, 톈진에서 온 셋이 아침 일찍 공장에 왔다. 첫 케이스가 금형에서 빠져나오자 그들은 한동안 말없이 들여다봤고, 그중 한 사람이 박 반장 어깨를 두드렸다."
 TFRKPHN_lg_485_a:0 "외교부 청사 9층, 동북아국 중국과. 박영환 국장 책상에 전문 한 장이 올라왔다.\n\n§Y발신: 주칭다오 총영사관§!\n§Y제목: 관내 우리 기업 철수 동향§!\n\n1. 관내 조선 기자재 업체 한 곳이 오늘 재고와 인력을 싣고 출항함. 선박용 밸브와 펌프 제조사임.\n2. 이 회사 거래처였던 조선소는 지난달부터 중국 해군 함정을 건조 중임.\n3. 회사 대표는 이십 년 거래한 조선소 사장과 어제 마지막으로 통화함. 상대는 미안하다고만 함.\n4. 국방부가 이 회사에 함정용 밸브와 펌프를 맡길 예정이라는 말이 있음.\n5. 관내에 남은 우리 기업은 열한 곳임."
 TFRKPHN_lg_485_b:0 "박 국장은 전문을 덮었다. 서랍에 1992년 수교 서명식 사진이 그대로 들어 있었지만 꺼내 보지는 않았다. 그는 결재란에 서명하고 귀국 기업 터를 산업부와 협의하라는 한 줄을 적었다.\n\n\"국장님, 남은 열한 곳은 어떻게 합니까.\"\n\"돌아올 배편부터 알아봐.\"\n\n퇴근길에 박 국장은 산업부 동기에게 전화를 걸었다.\n\n\"또 나다. 열한 곳 목록 보낼게.\" \"이번 달만 네 번째다, 너.\" \"그러니까 터 좀 빨리 알아봐 줘. 배는 벌써 떠났대.\" 수화기 너머에서 동기가 한숨을 길게 쉬었다."
 TFRKPHN_lg_486_a:0 "§Y[지역신문]§! 광저우에서 돌아온 변속기 회사가 공장 터를 찾고 있다.\n\n광저우에서 자동차 변속기를 만들던 이 회사는 현지 합작사가 공장을 넘기라고 요구하자 금형만 빼내 홍콩을 거쳐 실어 왔다. 현지에서 뽑은 직원 가운데 서른 명이 회사를 따라왔다. 국방부가 이 회사에 장갑차 변속기를 맡길 계획이라, 정부는 수도권과 지방 공단을 놓고 터를 고르고 있다.\n\n후보지 가운데 한 곳은 경기도 어느 소도시 보훈회관 맞은편에 칠 년째 비어 있는 공장이다. 회관에서 만난 박정수 할아버지는 맹호부대 출신이다."
 TFRKPHN_lg_486_b:0 "\"우리 때는 장갑차가 미제였지. 변속기 나가면 부품이 배로 한 달 걸려 왔어. 여기서 만들면 좋지.\"\n\n6.25 학도병 출신인 김복동 할아버지는 창밖 빈 공장을 손가락으로 가리키며 말했다.\n\n\"공장 소리 나면 좋지. 와 다시 나는지 생각하면 안 좋고.\"\n\n기사가 나간 다음 날 보훈회관 노인회는 공장이 오면 회관 마당을 주차장으로 내주자는 안건을 올렸다. 만장일치였고 김복동 할아버지도 손을 들었다. 회관 총무는 결정을 적은 쪽지를 들고 시청까지 걸어갔다."
 TFRKPHN_lg_487_a:0 "영등포구, 정의당 중앙당 당사. 김서현은 이제 전화를 받는 대신 논평을 쓴다.\n\n§Y[논평 초안]§!\n선전에서 통신 장비를 조립하던 회사가 협력사 열두 곳과 함께 돌아온다. 환영한다. 일자리가 생긴다.\n그런데 국방부는 이 회사에 군용 통신 장비를 맡기려 한다. 올해 돌아온 공장 가운데 군수품을 만드는 곳이 벌써 여럿이다. 유럽은 징병제를 되살렸다. 이웃 나라들은 국방비를 올린다. 뉴스는 날마다 평화의 시대가 끝났다고 말한다.\n우리는 묻는다. 돌아온 일자리는 전쟁이 끝나면 어디로 가는가."
 TFRKPHN_lg_487_b:0 "사수가 초안을 읽고 물었다.\n\n\"환영한다는 말은 뺄까요?\"\n\"그건 둬요. 일자리는 일자리니까.\"\n\n서현이 저장 단추를 누르는데 전화벨이 울렸다. 이번에는 욕이 아니었다.\n\n\"저기, 그 공장 지원하려면 어디로 가야 돼요? 뉴스 보고 전화했는데요.\"\n\n그날 저녁 서현은 논평을 올리고 나서 그 번호를 다시 찾아 공장 채용 담당 연락처를 문자로 보냈다. 고맙다는 한마디가 답장으로 왔다. 서현이 휴대전화를 내밀자 사수가 들여다보고 웃었다.\n\n\"오늘은 욕 대신 이거네.\""
 TFRKPHN_lg_488_a:0 "서준은 졸업하고 두 해를 쉬었다. 형 기일에는 해마다 광화문에 나갔다.\n\n채용 공고는 짧았다. 시안에서 돌아온 반도체 후공정 회사. 신입 엔지니어. 장비 반입 전까지 교육.\n\n\"장비 들어오려면 이 년 걸립니다. 수출 통제에 걸려서 한 대도 못 가져왔어요. 그동안 빈 클린룸에서 교육만 받습니다. 괜찮겠어요?\"\n\"괜찮습니다.\"\n\"이력서에 빈 기간이 있네요. 뭐 하셨어요?\"\n\n서준은 말을 고르다가 있는 그대로 말했다.\n\n\"집회 나갔습니다. 형이 대만에서 죽었습니다.\""
 TFRKPHN_lg_488_b:0 "면접관이 펜을 내려놓았다. 그는 시안에서 같이 일하던 중국인 동료가 전쟁 나던 날 공항까지 차를 태워 줬다는 얘기를 했다.\n\n\"설비는 못 가져오고 사람만 왔어요. 공장 터는 정부가 곧 정해 준답니다.\"\n\n방진복은 생각보다 가벼웠다. 임시 교육장 바닥에는 장비가 놓일 자리마다 노란 테이프가 붙어 있었고, 서준은 그 테이프를 따라 천천히 걸었다.\n\n교육 첫날 저녁 서준은 형 사진 앞에 출입증을 올려 두었다. 사진 속 형은 군복을 입고 웃고 있었다."
 TFRKPHN_lg_489_a:0 "중국에서 철수한 기업 여섯 곳이 모두 자리를 잡았다. 세 곳은 예전에 만들던 걸 다시 만들고, 두 곳은 군수품을 만들고, 나머지 한 곳은 조선소 옆에 들어갔다. 산업부는 돌아오겠다는 문의가 스무 건 더 들어와 있다고 보고했다.\n\n돌아온 공장 기계에는 아직 중국어 안내문이 붙어 있다. 새로 뽑힌 직원들이 그 위에 한글 스티커를 하나씩 덧붙이는 중이다."
 TFRKPHN_lg_489_b:0 "산업부 장관은 그 보고서를 들고 국무회의에 들어갔다. 맨 뒷장에 여섯 회사가 새로 뽑은 직원 수가 적혀 있었다. 다 합쳐 이천 명이 조금 넘었고, 절반 가까이가 전역한 지 한 해도 안 된 청년이었다. 장관은 그 숫자를 읽고 나서 다음 스무 곳의 문의서를 꺼냈다.\n\n인천의 한 공장 식당에서는 점심마다 중국어와 한국어가 섞여 들렸다. 같이 넘어온 중국인 기술자 몇이 남아 새 직원들에게 기계를 가르쳤다.\n\n\"이거 이름이 뭐예요? 중국말로.\" \"뤄쓰다오. 한국말로는?\" \"드라이버요. 아, 이것도 원래 영어구나.\"\n\n한 기술자는 공장이 다 돌아가면 고향에 한 번 다녀오겠다고 했지만, 그게 언제가 될지는 그도 몰랐다."
 TFRKPHN_lg_493_a:0 "재벌개혁 법안 네 건이 국회를 통과한 주에 홍준표 전 대통령이 다시 글을 올렸다. 이번에는 전보다 훨씬 길었다.\n\n그는 2017년 봄 얘기부터 꺼냈다. 그해 자유한국당 경선에서 자기는 1위, 이인제는 3위였다. 이듬해 자기가 당 대표로서 이인제를 충남지사 후보로 추대했고, 그때 충청도가 낳은 큰 인물이라고 제 입으로 말했다는 대목도 빠뜨리지 않았다.\n\n홍준표는 그런 사람이 이제 유승민 공약집으로 나라를 굴린다고 쓰고, 기업을 때려서 일자리가 생긴 나라는 없다고 덧붙였다. 글은 수레의 두 바퀴 가운데 한쪽만 굴리면 그 수레가 어디로 가겠느냐는 물음으로 끝났다."
 TFRKPHN_lg_493_b:0 "글이 올라온 지 한 시간 만에 댓글이 수천 개 달렸다. 전 대통령 지지자들은 글을 퍼 나르며 배신이라는 말을 붙였고, 반대쪽은 전임자가 후임 발목을 잡는다고 했다. 아침 신문들은 두 사람 사진을 나란히 실었다.\n\n청와대 참모들은 답을 낼지 말지로 둘로 갈렸다.\n\n\"가만있으면 당이 흔들립니다.\" 정무수석이 말했다. \"답하는 순간 싸움이에요. 저 양반 싸움은 안 져요.\" 홍보수석이 받았다."
 TFRKPHN_lg_494_a:0 "장부에서 이름이 나온 여당 의원은 넷이었다. 그중 둘은 홍준표 정부에서 장관과 수석을 지낸 사람들이었다.\n\n그날 밤 대통령 휴대전화가 울렸다. 화면에 홍준표 이름이 떴다. 이인제가 취임한 뒤로 그는 글만 올렸지 전화를 건 적은 한 번도 없었다.\n\n홍준표는 자기도 검사였으니 수사를 막을 생각은 없다는 말로 시작했다. 그러면서 전쟁을 같이 치른 사람들을 포토라인에 세우는 데는 순서가 있지 않겠느냐고 했다. 통화는 그 말을 끝으로 사 분 만에 끊겼다.\n\n같은 시각 서울중앙지검 수사팀은 장부 사본을 넘기고 있었다. 수사팀장이 날짜와 금액을 계좌 기록과 하나씩 맞춰 보니 어긋나는 줄이 거의 없었다.\n\n\"부장님, 소환 순서 정해야겠습니다. 오늘 밤 안에요.\" 자정이 넘어 그가 전화를 걸었다.\n\n서울중앙지검은 그 어느 때보다 바빴다. 몇몇 의원은 이걸 배신이라 불렀고, 어디서는 마땅히 해야 할 일이라고 했다. 홍준표의 페이스북에는 글 하나가 올라와 있었다."
 TFRKPHN_lg_495_a:0 "재벌개혁 법안이 다 통과된 주말, 홍준표 전 대통령이 수행원도 없이 청와대에 왔다. 손에 막걸리 두 병이 들려 있었다.\n\n관저 식탁에 마주 앉자 홍준표는 할 말부터 했다. 유승민을 들인 건 지금도 마음에 안 들고 자기 글에 답이 늦은 것도 섭섭하다고 했다. 이인제는 잔을 채우며 듣기만 했다.\n\n관저 주방은 난리가 났다.\n\n\"두부 있어? 김치는?\" \"전 몇 장 부칠까요?\" \"빨리, 빨리! 전직 대통령이 혼자 오셨다니까!\"\n\n경호처 직원들은 문밖에서 단톡방에 이 소식을 올리기 바빴다. 그들도 전직 대통령이 혼자 찾아오는 건 처음 봤다."
 TFRKPHN_lg_495_b:0 "둘째 병을 딸 무렵 홍준표가 2018년 충남 얘기를 꺼냈다. 어려운 선거인 줄 알면서 나가 달라고 했다는 그의 말에 이인제는 알고 나갔다고 짧게 답했다.\n\n홍준표는 일어서면서 법은 통과시켰으니 지키게 하는 데까지 하라는 한마디를 남겼다. 다음 날 그의 페이스북에는 글이 올라오지 않았고, 기자들은 그 빈 하루를 두고 기사를 썼다.\n\n관저 식탁에는 빈 막걸리 병 두 개가 남았다.\n\n\"이거 버릴까요?\" \"놔둬. 창고 선반에 올려놔.\" \"빈 병을요?\" \"그래, 빈 병을.\""
 TFRKPHN_lg_496_a:0 "새 일자리가 50만 개를 넘었다는 발표가 난 날, 홍준표 전 대통령이 방송에 나왔다.\n\n진행자가 후임 정부 일자리 정책을 묻자 그는 숫자부터 따지고 들었다. 손가락으로 탁자를 두드리는 버릇도 그대로였다. 그 가운데 세금으로 만든 자리가 몇 개냐고 되물었고, 경남지사 때 자기는 빚부터 갚고 남은 돈으로 일을 벌였다고 했다. 방송이 끝날 무렵에야 그래도 전역한 아이들이 줄을 덜 선다니 그것 하나는 잘했다는 말이 나왔다.\n\n고용노동부 통계 담당자들은 그 질문을 받고 표를 다시 뽑았다. 50만 개 가운데 공공 일자리는 열에 셋 남짓이었다. 나머지는 군수 공장이 민수로 돌아서며 생긴 자리와 직업훈련을 거쳐 들어간 민간 일자리였다.\n\n\"숫자로 답하면 됩니다. 말로 하면 집니다.\" 담당 과장은 표를 대변인실로 보내며 메모를 붙였다.\n\n청와대 대변인실은 그 마지막 칭찬 한마디를 논평에 넣을지 말지로 한 시간을 회의했다. 다음 날 아침 고용노동부가 표를 그대로 보도자료로 냈고, 전 대통령 질문에 정부가 숫자로 답했다는 기사가 붙었다."
 TFRKPHN_lg_497_a:0 "북진 준비가 끝났다는 보고가 올라간 주에 홍준표 전 대통령이 청와대로 전화를 걸었다. 이번에는 비서실을 거쳐 온 전화였다.\n\n그는 양안전쟁 때 얘기를 했다. 참전을 정한 날 밤에는 한숨도 못 잤고, 전사자 어머니가 보낸 편지를 읽은 날은 일정을 다 취소했다. 전쟁은 시작하는 날보다 끝내는 날을 정하기가 훨씬 어렵다는 말도 했다.\n\n홍준표는 훈수 둘 생각은 없다고 했다. 그 자리에 앉아 본 사람이 둘뿐이라 하는 말이라고 덧붙였다."
 TFRKPHN_lg_497_b:0 "통화를 이어 준 비서관은 전화가 끝나자 대통령 일정표를 다시 열었다. 다음 날 아침 합동참모본부 보고가 잡혀 있었다. 대통령은 그 보고 안건 맨 끝에 작전이 끝나는 조건을 한 줄 더 넣으라고 했다. 그리고 안건 제목을 끝내는 날로 바꾸게 했다.\n\n이튿날 합참 보고는 예정보다 한 시간 길어졌다.\n\n첫날 말고, 마지막 날부터 말해 보세요. 대통령이 묻자 장성들이 서로 얼굴을 쳐다봤다. 그 질문에 답을 준비해 온 사람은 없었다. 보고는 다음 주로 다시 잡혔다."
 TFRKPHN_lg_500_a:0 "통일이 공포된 날 저녁, 홍준표 전 대통령이 세 줄짜리 글을 올렸다.\n\n첫 줄에서 그는 자기가 전쟁은 이겼지만 이 일은 못 했다고 썼다. 둘째 줄에는 이인제가 했다고만 적었고, 셋째 줄은 판문점 표지판 뽑는 날 자기도 불러 달라는 부탁이었다.\n\n그 글은 그날 밤 가장 많이 퍼진 글이 됐다. 늘 날 선 말을 쓰던 사람의 세 줄이라 사람들은 더 놀랐다. 한 신문은 이튿날 일 면에 그 세 줄을 그대로 옮기고, 아래에 두 사람이 2017년 경선 토론장에서 나란히 찍힌 옛 사진을 붙였다.\n\n기자들이 유승민에게도 소감을 물었다. 그는 홍준표 글에 공감을 눌렀다고만 했다. 두 사람이 서로 글에 공감을 누른 건 그날이 처음이었다.\n\n청와대 의전비서관은 그 글을 읽고 판문점 행사 좌석 배치도를 다시 꺼냈다.\n\n\"맨 앞줄에 한 자리 더 그려. 전직 대통령 자리.\" \"초청 명단엔 없었는데요.\" \"이제 있어.\"\n\n행사 당일 전직 대통령은 맨 앞줄에 앉았다. 표지판이 뽑히는 순간 그는 박수를 치지 않고 그 자리를 오래 바라봤다."
 TFRKPHN_lg_501_a:0 "대통령이 통일되는 날 한반도의 핵을 모두 내려놓겠다고 선언하자 그날 밤 홍준표 전 대통령이 글을 올렸다.\n\n홍준표는 2017년 9월 대구 거리에서 핵에는 핵으로 맞서야 한다고 했고, 전술핵을 못 들여오면 우리 손으로 만들자고까지 했다. 그 생각은 지금도 같다고 썼다.\n\n이인제는 그해 독자 핵무장에 반대하면서 독일은 핵 없이도 유럽에서 가장 강한 나라라는 논리를 폈다. 홍준표는 독일 옆에는 중국이 없다는 한 줄로 그 논리를 받아쳤다."
 TFRKPHN_lg_501_b:0 "글 끝에는 물음이 하나 달려 있었다. 내려놓겠다는 핵에 북쪽 것만 들어가는지, 우리가 가질 수도 있었던 것까지 들어가는지.\n\n외교부는 그 물음이 바깥에서 어떻게 읽힐지부터 걱정했다. 도쿄와 브뤼셀 대사관은 그날 밤 글의 번역본을 본국으로 보냈다. 국가안보실은 이튿날 아침부터 선언문 문장마다 각주를 다는 작업에 들어갔다.\n\n\"이 문장, 우리 것도 포함된다고 읽힐 수 있어요.\" \"그럼 고쳐.\" \"선언은 벌써 했는데요?\" \"그러니까 각주를 달라는 거야.\"\n\n그 주 여론조사에서 핵을 내려놓는 데 찬성한다는 답은 절반을 조금 넘었다. 반대 답은 대구와 경북에서 많이 나왔다."
 TFRKPHN_lg_503_a:0 "양안전쟁 참전용사 예우법이 공포된 날 국립서울현충원에서 기념식이 열렸다. 그 전쟁에 장병을 보낸 대통령 홍준표는 초청장을 받고도 단상에 오르지 않고 유족석 맨 뒷줄에 앉았다.\n\n유족석에는 비밀 지원에 나섰다가 숨진 선원과 정비사의 가족들도 있었다. 이 법이 생기기 전까지 사고로 숨졌다는 통지서 한 장만 받았던 사람들이다. 한 아버지는 기념식이 시작되기 한참 전부터 아들 이름이 새로 새겨진 비석 앞에 앉아 있었다."
 TFRKPHN_lg_503_b:0 "식이 끝나자 한 어머니가 그에게 다가왔다. 몇 해 전 아들이 무엇을 위해 죽었느냐고 묻는 편지를 청와대로 보낸 사람이었다. 홍준표는 자리에서 일어나 그 어머니의 두 손을 잡았다. 두 사람이 나눈 말은 기자들의 마이크에 잡히지 않았다.\n\n단상에서 그 모습을 지켜보던 이인제 대통령은 준비한 연설 마지막 문단을 읽지 않고 내려왔다.\n\n유족들은 기념식이 끝나고도 비석 앞을 떠나지 않았다. 해가 질 무렵 관리소 직원들은 정문을 닫지 않고 기다렸다.\n\n\"문 닫을까요?\" \"다 가시면. 오늘은 늦어도 돼.\"\n\n이튿날 아침 비석들 앞에 꽃이 수북이 쌓여 있었다."
 TFRKPHN_lg_504_a:0 "대통령이 통일 뒤 북쪽 사람들에게 보복하지 않겠다고 선언한 다음 날, 홍준표 전 대통령이 방송에 나왔다.\n\n그는 자기가 검사였다는 말로 시작했다. 용서와 사면은 재판이 끝난 뒤에 하는 일이라고 했다. 정치범수용소를 만들고 굴린 사람들까지 안 묻겠다는 뜻이냐고 되묻고는, 아랫사람은 살리고 윗사람은 법정에 세우는 게 순서라고 했다.\n\n진행자가 그러면 북쪽 군인들이 끝까지 싸우지 않겠느냐고 묻자 홍준표는 잠깐 말을 멈췄다. 그 걱정은 대통령이 하는 게 맞고 자기는 이제 그 걱정을 하는 자리에 있지 않다고, 조금 뒤에 답했다."
 TFRKPHN_lg_504_b:0 "방송을 본 탈북민 단체들의 반응은 갈렸다. 수용소에서 가족을 잃은 사람들은 고개를 끄덕였고, 북쪽에 남은 가족이 군에 있는 사람들은 선언이 흔들릴까 걱정했다.\n\n\"둘 다 맞는 말이니까 더 어려워요. 우리 동네 사람들끼리도 지금 말이 안 통해요.\" 한 탈북민 단체 대표가 말했다.\n\n그날 밤 통일부는 선언문 한 문장을 붙들고 늦게까지 회의했다. 다음 날 아침 고친 선언문에는 명령을 따른 사람과 명령을 만든 사람은 다르게 본다는 문장이 하나 더 들어갔다."
 TFRKPHN_lg_505_a:0 "대북 확성기가 시간 제한 없이 켜졌다. 전방 확성기는 이제 밤낮없이 방송한다. 첫 소식은 중국이 양안전쟁에서 졌다는 것이었다. 북쪽 주민들이 한 번도 제대로 들어 본 적 없는 얘기다. 그 뒤로 날씨와 장마당 쌀값, 먼저 내려온 사람들의 안부가 이어진다.\n\n풍선도 올라간다. 전에 북쪽이 내려보낸 풍선에는 오물이 들어 있었다. 남쪽이 올려 보내는 풍선에는 전단과 라디오와 쌀이 가득 들어 있고, 하룻밤에 수백 개씩 휴전선을 넘는다."
 TFRKPHN_lg_505_b:0 "지난주에는 공군 무인기 편대가 평양 방공망 가장자리까지 올라갔다가 돌아왔다. 북한군 레이더는 켜졌지만 미사일은 안 올라왔고 전투기도 뜨지 않았다. 합참은 연료가 없어서인지 명령이 없어서인지 알 수 없다고 보고했다. 어느 쪽이든 평양 사람들은 그날 밤 하늘에서 나는 소리를 들었고, 다음 날 조선중앙방송은 그 일을 한마디도 전하지 않았다.\n\n확성기 부대 병사들은 아침마다 새 원고를 받았다. 원고 끝에 먼저 내려온 사람들이 보낸 안부가 몇 줄씩 붙어 있었다.\n\n\"평안북도 정주 김옥순 씨, 아드님 철수 씨가 서울에서 잘 지냅니다. 장가도...\" 한 병사가 거기서 목이 메어 방송을 멈췄다."
 TFRKPHN_lg_507_a:0 "정부가 통일 기금에 넣을 돈으로 통일세를 걷겠다고 발표했다. 소득세와 법인세에 일정 비율을 얹는 방식이다. 통일세라는 말은 2010년 8월 15일 이명박 대통령 광복절 경축사에 처음 나왔지만 그때는 반대가 커서 세금이 되지 못했다.\n\n이번에도 반응이 빨랐다. 납세자 단체는 전쟁 때 오른 세금도 아직 그대로라는 성명을 냈고, 광화문에는 주말마다 세금 고지서를 든 사람들이 모였다. 자영업자 단체는 통일은 찬성하지만 청구서는 반대한다는 현수막을 걸었다. 시민단체들은 걷은 돈을 어디에 쓸지부터 밝히라고 요구했다."
 TFRKPHN_lg_507_b:0 "우려는 여당 안에서도 나왔다. 수도권 의원 스무 명이 원내대표를 찾아갔다.\n\n\"다음 선거를 세금 고지서 들고 치르란 말입니까? 우리 지역구 가 보세요. 인사도 안 받아 줍니다.\"\n\n기획재정부 장관은 국무회의에서 세율을 절반으로 낮춘 안도 준비해 뒀다고 보고했다. 정부는 통일 기금이 다 차면 세금도 끝난다는 조항을 넣어 통일세 기한을 법에 못 박기로 했다. 그 조항이 없으면 이 세금은 영영 남을 거라고 한 국장이 말했다. 야당은 그 조항이 지켜질지부터 의심했다."
 TFRKPHN_lg_508_a:0 "첫 재벌개혁 법안이 국회를 통과한 주에 대통령이 유승민을 다시 불렀다. 대통령은 법을 만든 사람이 법을 집행하는 게 맞다며 공정거래위원장 자리를 내밀었고, 유승민은 그 자리에서 사양했다.\n\n그는 자기가 그 자리에 앉으면 이 법이 유승민의 법이 되고, 그러면 반대하는 쪽이 법 대신 사람을 공격한다고 했다. 자기는 밖에서 조문을 봐 주는 걸로 충분하다고 했다. 집무실을 나서기 전에는 위원장으로 정치인 말고 숫자 읽을 줄 아는 사람을 앉혀 달라고 부탁했다."
 TFRKPHN_lg_508_b:0 "비서실장이 그 부탁을 받아 적었다. 대통령은 창가에서 유승민이 차에 오르는 걸 내려다봤다.\n\n그날 오후 공정거래위원회에 다음 위원장이 누구냐는 소문이 돌았다. 새 법이 통과된 지금 위원장이 누구냐에 따라 조직의 몇 해가 달라진다는 걸 직원들은 알았다.\n\n\"그 양반 있잖아, 재벌 사건만 이십 년 한 국장님.\" \"그분이 되면 우리 야근 각오해야 돼.\" \"그래도 그분이 됐으면 좋겠다.\"\n\n유승민은 금요일에 국회 앞 식당에서 기자 몇과 점심을 먹었다. 위원장 얘기가 나오자 그는 숟가락을 내려놓고 조문 얘기로 화제를 돌렸다."
 TFRKPHN_lg_509_a:0 "재계와 타협한 안이 국회를 통과한 다음 날 아침, 대통령 책상에 유승민이 보낸 메모 한 장이 올라왔다.\n\n메모는 세 줄이었다. 첫 줄은 예외 조항이 붙은 자리를 조문 번호로 짚었고, 둘째 줄에는 그 예외로 빠져나가는 그룹 수가 적혀 있었다. 셋째 줄은 한 번 붙인 예외는 다음 법안에서도 또 요구받게 된다는 경고였다.\n\n그만두겠다는 말도 화났다는 말도 없었다. \"차라리 화를 내면 낫겠습니다. 이게 더 무섭네요.\" 비서실장이 메모를 내려놓으며 말했다."
 TFRKPHN_lg_509_b:0 "비서실장은 메모를 대통령에게 올리기 전에 한 번 더 읽었다. 숫자와 조문 번호뿐인 세 줄이었지만 뜻은 분명했다.\n\n정책실 실무자들이 그 예외 조항으로 빠져나가는 그룹 수를 다시 셌다. 메모와 같았다.\n\n\"이 양반, 우리보다 먼저 세어 봤네.\" \"세 번 세어 봤을걸. 원래 그런 사람이야.\"\n\n그날 오후 경제 단체들은 통과된 법을 환영한다는 짧은 성명을 냈다. 이번 법안들 가운데 경제 단체들이 환영한 건 이 법 하나였다. 대통령은 그날 저녁 메모 옆에 짧은 답장을 적었다."
 TFRKPHN_lg_50_a:0 "도쿄와 타이베이와 시드니에서, 그리고 서울에서도 승전 폭죽이 터지고 있다. 오늘 하루만큼은 우리도 마음 놓고 기뻐하고 싶다.\n\n중국군은 끝내 대만을 삼키지 못했다. 하지만 바다 건너 중국이라는 나라는 그대로 남아 있다. 승전 보고를 받는 자리에서 대통령 혼자만 웃지 않았다.\n\n대통령은 중국이 여기서 물러설 나라가 절대 아니라고 했다. 이번 승리는 잠깐 시간을 번 데 지나지 않고, 저들이 개혁을 하든 보복을 하든 좌익이 정권을 쥐든 결국 노리는 곳은 아시아라는 것이다. 수나라와 당나라, 청나라와 시진핑은 실패했어도 다음은 다를 수 있다고도 했다. 이제 자주국방의 상대를 북한 하나로 잡아서는 안 되며 적룡은 반드시 돌아온다는 말로 그는 보고 자리를 마무리했다."
 TFRKPHN_lg_50_b:0 "보고가 끝나자 대통령은 축하연에 잠깐 얼굴만 비치고 그 길로 국군수도병원 부상병 병동을 찾았다.\n\n축하연장에서는 장관들이 잔을 부딪쳤고 군 수뇌부는 웃으며 사진을 찍었다. 대통령이 일찍 자리를 뜬 걸 알아챈 몇 사람은 슬그머니 잔을 내려놓았다. 국방부 장관은 그날 밤 합참의장에게 전화를 걸어 다음 국방 계획의 첫 장부터 다시 쓰자고 했다."
 TFRKPHN_lg_510_a:0 "경제 단체들이 성명을 낸 지 이틀 뒤 유승민이 방송 토론에 나갔다. 맞은편에는 경제 단체 상근부회장이 앉았다.\n\n\"기업을 죄인 취급하는 법이 계속되면 투자는 나라 밖으로 나갑니다.\" 부회장이 말했다.\n\n유승민이 꺼낸 건 종이 한 장이었다. 지난 십 년 동안 총수 일가 개인회사가 내부거래로 올린 매출과, 같은 기간 그 그룹의 국내 투자액을 나란히 적은 표였다. 한국개발연구원 연구원 출신인 그는 목소리 한 번 높이지 않고 숫자를 한 줄씩 읽어 내려갔다. 부회장이 출처를 묻자 그 단체가 해마다 내는 보고서라는 답이 돌아왔다."
 TFRKPHN_lg_510_b:0 "다음 날 경제 단체들은 두 번째 성명을 미뤘다.\n\n방송이 끝나자 그 표가 인터넷에 퍼졌다. 경제학과 학생들은 과제 자료로 썼고 경제 신문 몇 곳은 이튿날 아침 표를 그대로 실었다. 경제 단체가 반박 자료를 냈지만 거기에는 같은 기간 숫자가 빠져 있었다.\n\n토론을 마치고 나온 상근부회장은 주차장에서 기자들에게 붙잡혔다. \"숫자로는 할 말이 없습니다. 다음엔 제가 표를 들고 오겠습니다.\" 그 말은 그날 밤 가장 많이 인용된 한마디가 됐다."
 TFRKPHN_lg_511_a:0 "검찰이 그룹 본사를 압수수색한 날 기자들이 유승민을 둘러쌌다. 재벌개혁이 결국 재벌 손보기 아니냐는 질문이 쏟아졌다.\n\n유승민은 수사와 입법을 한데 섞으면 둘 다 망가진다고 답했다. 죄가 있으면 벌을 받아야 하지만, 법안 표결을 압수수색 날짜에 맞추는 일은 없어야 한다고 했다. 그날 저녁 그는 같은 말을 대통령에게 따로 전하고 수사가 끝날 때까지 다음 법안 상정을 미루자고 했다."
 TFRKPHN_lg_511_b:0 "그날 밤 민정수석실이 검찰과 국회 일정표를 나란히 펼쳤다. 압수수색 날짜와 법안 상정 날짜가 사흘밖에 안 떨어져 있었다.\n\n\"이거 바깥에서 보면 짜고 친 걸로 보입니다.\" \"짠 거 아니잖아.\" \"아닌 건 우리만 알죠.\"\n\n검찰은 수사는 증거 나오는 대로 간다며 일정을 바꾸지 않겠다고 했고, 법무부 장관은 그 입장을 대통령실에 그대로 전했다. 여당 원내대표는 상정을 미루면 기세를 잃는다고 걱정했다. 야당 원내대표는 오히려 미루는 게 공정해 보인다고 했다. 두 원내대표가 같은 쪽 말을 한 건 그때가 처음이었다."
 TFRKPHN_lg_513_a:0 "2021년 10월 29일, 국민의힘 경선 토론에서 홍준표와 유승민이 마주 섰다. 유승민이 경제 정책을 설명하자 홍준표가 경제부총리를 하면 안 되겠느냐고 물었다. 유승민은 자기가 대통령이 되면 홍준표를 법무부 장관에 앉힐까 싶다고 받았고 방청석에서 웃음이 터졌다.\n\n취임 닷새째, 대통령은 그 농담을 진담으로 바꿨다. 비서실장을 통해 유승민에게 경제부총리 자리를 제안한 것이다.\n\n유승민은 그날 저녁 사양했다. 공매도와 모병제, 주택 공약까지 토론에서 반대한 게 너무 많은데 그렇게 반대하던 사람이 내각에 앉으면 자기도 정부도 말이 꼬인다고 했다. 밖에서 할 말을 하는 쪽이 정부에 더 쓸모 있을 거라고도 했다.\n\n비서실장이 답을 받아 적은 메모를 올렸고 대통령은 메모를 두 번 읽었다. 경제부총리 자리는 그 주 내내 비었다.\n\n\"누가 온대?\" \"몰라. 신문 보니까 오늘은 또 다른 이름이던데.\" 기획재정부 국장들은 큰 결재를 미루고 아침마다 경제 신문부터 펼쳤다.\n\n그 주 금요일 대통령은 실무 관료 출신을 그 자리에 앉혔다."
 TFRKPHN_lg_514_a:0 "정부가 모병제 확대안을 내놓은 주에 유승민이 방송에 나와 경선 토론 때 했던 질문을 다시 꺼냈다.\n\n그때 유승민은 4년 전 징병제를 말하던 홍준표가 왜 생각을 바꿨느냐고 물었다. 홍준표는 병력 자원이 줄고 있고 모병제가 세계 흐름이라고 답하면서 해병대 지원 경쟁률이 10대 1이라는 말도 했다.\n\n유승민은 월급 보고 들어가는 군대가 되면 형편 어려운 집 아들부터 총을 들게 된다고 했다. 전쟁을 막 치른 나라에서는 그게 누가 죽느냐의 문제가 된다며, 그때 한 걱정이 지금도 그대로라고 했다."
 TFRKPHN_lg_514_b:0 "국방부는 다음 날 지원병의 출신 지역과 가구 소득을 해마다 공개하겠다고 밝혔다.\n\n그날 병무청 홈페이지 지원 안내 게시판에 월급과 복무 기간을 묻는 글이 몰렸다. 몇은 다른 걸 물었다.\n\n\"지원병으로 들어가면 다음 전쟁 나면 먼저 나가는 건가요? 저희 집은 엄마랑 저 둘밖에 없어서요.\"\n\n병무청 담당자는 그 글에 답을 달지 못하고 출력해서 과장 책상에 올려 두었다. 몇 주 뒤 국방부가 지원병 첫 기수의 출신 지역 표를 처음 공개했다."
 TFRKPHN_lg_515_a:0 "토지임대부 주택 첫 분양 공고가 난 날 유승민이 글을 올렸다.\n\n땅은 나라가 갖고 집만 파는 이 주택은 홍준표의 경선 공약이었다. 유승민은 토론 때부터 한 가지를 짚어 왔다. 10년이 지나 소유권이 넘어가면 시세 차익이 당첨자에게 통째로 간다는 것이다. 홍준표는 그때 10년을 산 사람의 소유권은 인정해야 한다고 맞섰다.\n\n유승민의 글은 첫 단지 분양가와 둘레 시세, 10년 뒤 예상 차익 같은 숫자로 빼곡했다. 그는 집을 싸게 주는 건 좋지만 그 값을 누가 치르는지는 밝혀야 한다고 썼다."
 TFRKPHN_lg_515_b:0 "국토교통부가 해명 자료를 냈지만 기자들은 해명보다 유승민의 표를 더 많이 실었다.\n\n첫 단지 청약 접수 날 모델하우스 앞에는 새벽부터 줄이 섰다. 그 표를 출력해 들고 온 사람도 있었다.\n\n\"차익이요? 십 년 뒤 얘기잖아요. 저흰 당장 다음 달에 전세가 끝나요.\" 한 신혼부부가 기자 앞에서 웃었다.\n\n청약 경쟁률은 그날 밤 이백 대 일을 넘겼다. 국토부는 그 숫자를 발표하면서 차익 환수 방안도 함께 검토하겠다고 덧붙였다."
 TFRKPHN_lg_516_a:0 "법인세 인하안이 국회를 통과한 주말, 유승민이 신문에 글을 실었다.\n\n유승민은 2015년 4월 원내대표 연설에서 증세 없는 복지는 허구라고 했다가 그 말 한마디로 청와대와 멀어졌다. 이번 글도 깎은 세금은 누군가 메워야 한다는 같은 자리에서 출발했다.\n\n그는 전쟁에 쓴 돈과 보훈에 쓸 돈을 먼저 적고 그다음에 줄어드는 법인세수를 적었다. 두 숫자 사이 빈칸은 정부가 채우라고 일부러 비워 두었다. 여당 의원들은 내부 총질이라며 발끈했고 기획재정부는 입을 다물었다."
 TFRKPHN_lg_516_b:0 "그 글이 실린 날 국회 기획재정위원회에서 법인세 인하의 세수 효과를 놓고 질의가 이어졌다. 야당 의원 하나가 신문을 들어 보였다.\n\n\"장관님, 여당 출신 경제통이 묻는 겁니다. 이 빈칸 누가 채웁니까?\" \"성장이 세수를 메울 겁니다.\" \"그러니까 얼마나요?\" \"성장이... 메울 겁니다.\"\n\n장관은 같은 답을 세 번 했다. 그날 저녁 세제실 직원들은 늦게까지 남아 빈칸에 들어갈 숫자를 다시 계산했는데 몇 번을 해도 같았다. 여당 원내대표는 그 주 의원총회에서 당 안의 쓴소리도 들어야 한다고 짧게 말했다."
 TFRKPHN_lg_517_a:0 "임기 마지막 해에 한 방송이 유승민에게 홍준표 정부 4년의 점수를 물었다.\n\n유승민은 과목을 나눠 답했다. 전쟁을 치르고도 나라가 흔들리지 않았다며 안보에는 합격점을 줬다. 경제에는 절반만 줬다. 기업을 뛰게 한 건 맞지만 재벌은 손 안 대고 넘어갔고, 그 숙제가 다음 정부로 넘어갔다는 이유였다.\n\n진행자가 경선 토론 때 농담을 꺼냈다. \"그때 경제부총리 맡으셨으면 달랐을까요?\" 유승민은 웃기만 하고 답하지 않았다. 카메라가 그 웃음을 한참 잡았다.\n\n방송이 나간 밤 대통령이 글을 올렸다. 유승민의 채점이 박하다고 쓰고, 틀린 데는 없다는 말을 덧붙였다.\n\n사람들은 놀랐다. 두 사람은 경선 때부터 서로를 날카롭게 깎아내려 왔다. 그런 상대의 채점에 틀린 데가 없다고 한 그 한 줄이 이 정부 끝자락의 가장 짧은 화해로 남았다.\n\n다음 날 아침 한 신문이 두 사람의 경선 토론 사진과 그날 밤 두 글을 채점표라는 제목 아래 나란히 실었다. 그 신문은 가판대에서 일찍 동났고, 의원회관 몇몇 방에서는 그 면을 오려 벽에 붙였다."
 TFRKPHN_lg_518_a:0 "법무부가 대통령에게 서류 한 묶음을 올렸다. 전임 정부가 준비해 두고 떠난 사형 집행 명령서였다.\n\n홍준표는 오래전부터 사형을 집행하자고 해 온 사람이다. 2017년 대선 토론에서는 사형을 안 하니 흉악범이 날뛴다고 했고, 2021년 경선에서는 사형 집행 재개를 공약으로 걸었다. 그해 7월 글에서는 해마다 사형을 집행하는 일본과 미국이 미개한 나라냐고 물었다. 형이 확정되면 여섯 달 안에 집행하라는 게 형사소송법인데 집행하지 않는 건 법무부 장관의 직무유기라고도 했다."
 TFRKPHN_lg_518_b:0 "그가 대통령이 된 뒤 법무부는 대상자 명단까지 추렸다. 그런데 곧 전쟁이 터졌고, 전쟁이 끝난 뒤에는 수습이 먼저였다. 서류는 서명란이 빈 채로 다음 정부에 넘어왔다. 대한민국은 1997년 12월 30일 23명을 집행한 뒤로 한 사람도 집행하지 않았다.\n\n법무부 보고는 간단했다. 온정주의 없는 법 집행을 내건 정부이니 서명만 하면 된다.\n\n서류를 건네고 돌아가는 길에 그가 동료에게 말했다. \"서명이 되든 안 되든 내 이름은 기록에 남아. 그게 좀 그렇다.\""
 TFRKPHN_lg_51_a:0 "국립서울현충원은 나라를 위해 목숨을 바친 사람들이 잠든 곳이다. 대통령은 승전 기념행사를 비롯해 그날 일정을 모두 미루고 이곳을 찾았다. 그는 이름이 하나하나 새겨진 벽 앞에서 고개를 들었다.\n\n김대식 1934~1952. 이환정 1951~1972.\n\n그 옆에 새로 새긴 이름들이 이어져 있다.\n\n황이준 2002~2022. 이정준 2000~2022. 박삼경 1999~2022.\n\n모두 먼 남의 땅에서 쓰러진 사람들이다. 그 가운데에는 우리가 서류를 꾸며 내보낸 이름도 섞여 있다.\n\n전쟁이 끝나자 김병주 의원은 전역 서류를 쓰고 떠난 사람들의 명단을 공개하라고 요구했다. 대통령은 국정조사를 받겠다고 답했다.\n\n참배를 마친 대통령은 유가족 몇 사람과 마주쳤는데, 어느 쪽도 먼저 말을 꺼내지 못했다. 바람이 한 차례 지나갔다.\n\n이들을 죽게 한 건 결국 내가 아닌가. 대통령은 그렇게 자기 자신에게 물었을지도 모른다. 그가 답을 찾았는지 우리는 알지 못한다. 그는 오래 서 있다가 유가족들에게 고개를 깊이 숙였고, 차에 오를 때까지 말이 없었다."
 TFRKPHN_lg_522_a:0 "두 번째 이름은 김대중이다.\n\n김대중은 목포 앞바다 하의도에서 소작농의 아들로 태어났다. 1971년 대선에서 박정희에게 95만 표 차로 졌고, 1973년 도쿄에서 중앙정보부 요원들에게 납치됐으며, 1980년에는 내란음모 혐의로 사형을 선고받았다. 대선에 네 번 나선 끝에 1997년 당선되면서 처음으로 정권이 야당에 넘어갔다. 그의 정부는 외환위기를 빠르게 넘겼고 2000년 6월 남북 정상회담을 열었다. 그는 2009년 8월 18일 세상을 떠났다."
 TFRKPHN_lg_522_b:0 "1997년 대선에서 이인제는 김대중과 맞섰지만 이듬해 그의 당인 새정치국민회의로 들어갔다.\n\n대통령이 김대중에게서 물려받기로 한 건 마주 앉는 일이다. 김대중은 전쟁을 치른 상대와 정상회담을 연 사람이다. 대통령은 북쪽 정권에는 물러서지 않겠다고 하면서도, 통일은 결국 그 사람들과 같이 사는 일이니 북쪽 주민에게 건넬 말은 따로 준비하겠다고 했다.\n\n확성기 원고를 쓰는 사람들은 그 이름이 북쪽에서 어떻게 들릴지 고민했다. 평양 방송은 오래 그를 다르게 불러 왔다.\n\n\"이름 앞에 뭘 붙이지? 전 대통령?\" \"그냥 김대중 선생님이라고 해. 거긴 그게 더 잘 들려.\""
 TFRKPHN_lg_525_a:0 "1995년 노태우 전 대통령 비자금 사건에서 수표를 바꿔치기한 돈세탁이 드러났지만 그때는 돈세탁을 벌할 법이 없었다. 정부가 1997년에 자금세탁방지법을 준비했는데도 법은 2001년에야 만들어졌고 금융정보분석원도 그해 문을 열었다.\n\n1997년 대선에 나선 이인제는 후보 등록 날 선거자금 수입과 지출을 시민단체 감시 아래 두겠다고 약속했다. 기성 정당들이 금권정치에 빠져 있다는 말도 그날 했다."
 TFRKPHN_lg_525_b:0 "그로부터 서른 해가 지났다. 전쟁은 군수 계약과 복구 사업이라는 큰돈을 만들었다. 감사원 보고에 따르면 전쟁 중 맺은 군수 계약의 절반 이상이 경쟁 없이 맺어졌다. 낙찰받은 회사들 고문 명단에는 전역한 장성과 퇴직 관료 이름이 줄줄이 있었고, 그 회사들 후원금은 여야를 가리지 않았다.\n\n대통령은 막아야 할 길목을 계약과 사람과 정치자금으로 짚었다. 한꺼번에 막을 힘은 없으니 어디부터 막을지 정해야 한다.\n\n그날 저녁 금융정보분석원 직원들은 새 지시가 내려오면 뭐부터 볼지 미리 정리했다. 전쟁 동안 군납 대금이 오간 계좌만 수만 개였다.\n\n\"이거 다 보려면 몇 년 걸려요.\" \"그러니까 순서를 정하라는 거지.\""
 TFRKPHN_lg_526_a:0 "기획재정부가 전쟁 국채 마지막 회차를 갚았다고 발표했다. 약속한 기한을 넘기지 않은 상환이었다.\n\n대한민국은 전에도 큰 빚을 일찍 갚은 적이 있다. 1997년 11월 21일 정부는 국제통화기금에 돈을 빌려 달라고 손을 벌렸고, 2001년 8월 23일 마지막 돈을 갚았다. 빌린 돈 195억 달러를 약속보다 3년쯤 일찍 다 갚았다.\n\n1997년 12월 대선에 나선 이인제는 300일 경제위기 극복대책을 내놓았다. 석 달 안에 위기에서 벗어나고 여섯 달 안에 안정을 찾아 열두 달 안에 제자리로 돌아간다는 계획이었는데, 선거에서 지는 바람에 써 보지도 못했다.\n\n서른 해 뒤 그는 다른 빚을 갚았다. 기자들 앞에 선 대통령은 길게 말하지 않고 이 빚은 세금을 낸 국민이 갚았다고만 했다.\n\n그날 국채를 갖고 있던 사람 가운데에는 전쟁 때 애국 채권이라는 이름에 끌려 저금을 털었던 노인이 많았다. 은행 창구에서 원금과 이자가 찍힌 통장을 받아 든 한 노인이 창구 직원 손을 붙잡았다.\n\n\"나라가 약속을 지켰네. 내 살다 살다.\""
 TFRKPHN_lg_527_a:0 "약속한 기한이 지났는데 전쟁 국채가 [?TFRKPHN_wd_left|0] 남았다.\n\n기획재정부가 상환 일정을 다시 짜겠다고 발표하자 야당은 대통령이 스스로 건 약속을 스스로 깼다고 몰아붙였다. 채권 시장에서는 국채 금리가 올랐다. 대통령은 변명하지 않고 남은 빚은 다음 예산에 맨 먼저 넣겠다고만 했다.\n\n숫자는 하루 만에 움직였다. 국채 금리가 오르자 은행들이 대출 금리를 따라 올렸고, 집을 사려던 신혼부부와 공장을 넓히려던 사장들이 먼저 그 숫자를 느꼈다."
 TFRKPHN_lg_527_b:0 "그날 밤 국채과 직원들이 상환 일정표를 처음부터 다시 그렸다. 지난번 일정표 마지막 칸 날짜는 이미 지나 있었고 새 일정표는 한 장이 더 길어졌다.\n\n야당은 대통령이 직접 기한을 걸었다는 걸 거듭 물고 늘어졌다. 여당 안에서는 처음부터 기한을 걸지 말았어야 했다는 말이 조용히 돌았다. 그 말을 전해 들은 대통령이 말했다.\n\n\"기한 안 걸었으면 여기까지도 못 갚았어요.\"\n\n다음 예산안 첫 장에 남은 빚 상환 계획이 실렸고 다른 사업들은 한 장씩 뒤로 밀렸다."
 TFRKPHN_lg_529_a:0 "기획재정부 장관이 보고서를 들고 왔다. 그는 표지를 넘기기도 전에 결론부터 말했다. 갚을 전쟁 국채가 하나도 남지 않았다.\n\n전쟁을 치른 나라가 빚 없이 전후를 맞는 일은 드물다. 대한민국은 1997년 11월 21일 국제통화기금에 손을 벌렸다가 2001년 8월 23일 마지막 돈을 갚았고, 그 195억 달러를 약속보다 3년쯤 일찍 갚은 걸 오래 자랑으로 삼아 온 나라다.\n\n대통령은 2년 안에 갚겠다고 써 둔 연설문부터 고치게 했다. 그리고 그 자리에서 지시를 내렸다. 빚 갚을 돈이 따로 필요 없으면 그만큼 세금에서 덜어 내라."
 TFRKPHN_lg_529_b:0 "발표 날 아침 국채과 사무실에 축하 화분 하나가 놓였다. 누가 보냈는지는 적혀 있지 않았다.\n\n\"누가 보낸 거예요?\" \"몰라. 장관실은 아니래.\" \"그럼 그냥 받아요. 우리 몇 년 고생했잖아요.\"\n\n직원들은 몇 해 동안 달마다 같은 표를 채워 왔다. 마지막 칸에 영을 적은 과장은 그 표를 찍어 부서 단톡방에 올렸다. 세금을 덜어 내라는 지시는 그날 오후 세제실로 내려갔다. 세제실장은 어느 세금부터 덜지 놓고 다음 날 아침까지 회의를 했고, 덜어 낸 첫 고지서는 그해 가을에 나갔다."
 TFRKPHN_lg_52_a:0 "자정이 넘었는데 대통령 집무실에는 아직 불이 켜져 있다. 참모들은 모두 물러 나왔고 대통령 혼자 남았다.\n\n그는 국민 앞에서 선진대국을 약속했다. 박수는 이미 그쳤고 책상에는 그 약속을 지켜야 하는 일만 쌓여 있다.\n\n문틈으로 들여다본 비서관 말로는, 대통령이 주머니를 뒤져 담배 한 개비를 꺼냈다고 한다. 끊은 지 오래된 담배였다. 불을 붙이고 고개를 들자 어두운 창유리에 그의 얼굴이 비쳤는데, 낮에 연단에 섰던 얼굴보다 훨씬 늙어 보였다.\n\n책상 한쪽에는 그날 나온 여론조사가 엎어져 있었다. 찬성과 반대가 거의 반반이었다. 대통령은 연기를 길게 내뿜으며 국민이 한데 모여야 한다고, 좌우와 남녀를 따질 때가 아니라고 혼잣말을 했다.\n\n창밖으로 광화문 불빛이 보였다. 그날 반대표를 던진 사람들도 그 불빛 아래 어딘가에서 자고 있을 터였다.\n\n그는 담배를 비벼 끄고 엎어 둔 여론조사를 뒤집어 첫 장부터 다시 읽었다. 이튿날 아침 첫 일정은 야당 대표와의 면담이었고, 그는 면담 자료 맨 위에 반대가 많이 나온 세 지역 이름을 적었다."
 TFRKPHN_lg_532_a:0 "PDTO 재무장관 회의에서 대한민국이 전쟁 비용을 나눠 지자고 요청하자 회의가 예정보다 세 시간 길어졌다.\n\n일본은 함께 싸운 전쟁이니 나눠 지는 게 맞다면서도 금액은 본국 의회와 상의해야 한다고 했다. 제일 먼저 분담에 동의한 건 중화민국이었다. 자기 땅에서 치른 전쟁이라는 이유였다. 호주는 참전 규모에 맞춰 몫을 정하자는 안을 냈다.\n\n공동 발표문에는 숫자 대신 형평에 맞는 분담이라는 말만 들어갔다. 회의장을 나온 기획재정부 장관은 기자들에게 첫 송금이 다음 달에 들어온다고 귀띔했다."
 TFRKPHN_lg_532_b:0 "회의가 끝난 밤 우리 대표단 실무자들이 호텔 방에 모여 각국 대표 발언을 다시 정리했다. 누가 어디서 머뭇거렸는지가 다음 회의의 출발점이 된다.\n\n복도에서 일본 대표단 과장이 우리 쪽 과장을 붙잡았다. \"금액, 생각보다 클 겁니다. 그것만 말씀드릴게요.\"\n\n다음 달 중화민국이 보낸 첫 송금이 한국은행 계좌에 들어왔다. 기획재정부 장관은 그 숫자를 국무회의에 보고하면서, 금액보다 먼저 들어왔다는 게 더 중요하다고 했다."
 TFRKPHN_lg_541_a:0 "일하지 않는 자는 먹지도 말라는 말은 신약성서 데살로니가후서 3장에 나온다. 바울이 일하기 싫어하는 사람들을 꾸짖으며 쓴 말인데, 천구백 년쯤 뒤 소련이 같은 문장을 1936년 헌법 12조에 옮겨 적었다. 서로 원수였던 교회와 공산당이 이 문장만은 같이 썼다.\n\n전쟁 동안 임금은 일과 따로 놀았다. 공장이 멈춘 날에도 전시 특별수당은 나갔고, 물가를 따라잡느라 붙인 수당이 해마다 기본급 위에 쌓였다. 전쟁은 끝났는데 생산은 아직 제자리를 못 찾았고 임금표는 전시 그대로다."
 TFRKPHN_lg_541_b:0 "대통령은 경제장관회의에서 그 오래된 문장을 꺼냈다. 일한 만큼 받고 만든 만큼 올린다는 원칙을 다시 세우자는 말이었다. 임금 인상은 생산성이 오른 범위 안에서만 한다는 지침이 그날 정해졌고, 전시 특별수당은 세 해에 걸쳐 없애기로 했다.\n\n수당이 빠지는 만큼 월급봉투는 얇아진다. 노동계는 전쟁을 버틴 값을 이제 와서 깎느냐고 묻는다.\n\n회의가 끝나고 회의장을 나오던 노동부의 한 국장이 중얼거렸다. \"이걸 노조 앞에서 읽으면... 계란 맞겠네.\""
 TFRKPHN_lg_543_a:0 "새벽에 합동참모본부 보고가 올라왔다. 북한군 포병이 군사분계선 가까이로 자리를 옮겼고, 서해에서는 중국 해경선이 우리 어선을 한나절이나 따라붙었다.\n\n국방부는 병력을 돌려보낸 뒤로 전방 빈자리가 눈에 띄게 늘었다고 봤다. 상대가 그 빈자리를 재 보고 있다는 게 정보 당국 판단이었고, 이대로 두면 다음엔 더 가까이 온다는 경고가 보고서 끝에 붙어 있었다.\n\n이인제는 보고서를 덮고 안보실장을 불렀다. 국방부 장관이 세 가지 안을 들고 왔다.\n\n\"항의 성명은 말뿐입니다. 병력을 다시 부르면 전쟁 끝났다는 말이 무색해지고요. 방어망을 켜 보이면 저쪽도 같은 걸 켤 겁니다. 어느 쪽이든 값이 있습니다.\"\n\n같은 새벽 서해의 한 어선 선장이 해경에 전화를 걸었다. \"그놈들 이제 갔어요. 근데 내일 또 나가야 되나 모르겠네. 기름값도 안 나오는데.\" 그는 그날 조업을 접고 항구로 돌아왔다.\n\n합참 상황실은 밤새 불이 켜져 있었다. 장관이 돌아간 뒤 대통령은 지도 위 서해의 그 해역을 손가락으로 오래 짚고 있었다."
 TFRKPHN_lg_544_a:0 "한일 공동 핵억지를 그대로 두겠다는 결정이 알려지자 주변국 항의가 쌓였다. 중국 외교부는 날마다 성명을 냈고 몇몇 나라는 원자력 협력과 수출 허가를 다시 살펴보겠다고 통보해 왔다.\n\n외교부는 이 억지력이 북핵이 사라지는 날까지만 유지된다는 걸 대통령이 직접 설명해야 한다고 건의했다. 청와대 안에서는 대꾸할수록 일이 커진다는 의견도 적지 않았다.\n\n\"대통령 말씀은 거둬들일 수가 없어요. 한 번 하시면 끝입니다.\" \"안 하시면 그 자리를 남의 나라 말이 채웁니다.\" 외교부 국장들끼리도 의견이 갈렸다.\n\n원자력 협력을 다시 보겠다고 통보한 나라 가운데 하나는 우리 원전 수출의 큰 고객이었다. 산업부는 그 나라에 보낼 설명 자료를 따로 만들었는데, 원전 안전 얘기보다 억지력 얘기가 더 길어졌다고 담당자가 투덜거렸다.\n\n대통령실 대변인은 그 주 정례 브리핑에서 이 문제로 질문을 세 번 받았고, 세 번 다 같은 문장으로 답했다. 기자들은 그 문장이 언제 바뀌나 받아 적으며 지켜봤다. 그 주 금요일 중국 외교부 성명이 처음으로 하루 걸렀다."
 TFRKPHN_lg_545_a:0 "국방부가 전후 군 재편을 마쳤다고 보고했다. 비상 대기로 부풀었던 군은 눈에 띄게 줄었고 군복을 벗은 사람들은 공장과 건설 현장 빈자리로 돌아갔다. 남은 부대는 북쪽 국경과 통일 뒤 임무에 맞게 다시 짜였다. 대통령은 보고서에 서명하면서 줄인 만큼 남은 장병 처우부터 챙기라고 덧붙였다.\n\n전역자들이 가장 많이 간 곳은 건설 현장이었다. 메가시티 공사가 한창이라 일손이 모자랐다.\n\n\"공병 출신들이 첫날부터 굴착기를 몰더라고요. 가르칠 게 없어요. 오히려 우리가 배워요.\" 한 건설사 현장 소장이 웃었다.\n\n부대가 줄어든 자리에는 빈 막사가 남았다. 몇몇 지자체가 그 막사를 청년 임대 주택이나 직업훈련 시설로 쓰게 해 달라고 국방부에 요청했고, 강원도의 한 군에서는 빈 막사가 그해 겨울 귀농 청년들 숙소가 됐다.\n\n국방부는 남은 장병들 급여와 숙소를 고치는 예산을 다음 해 예산안 맨 앞에 올렸다. 대통령은 전역자들의 첫 월급 명세서 몇 장을 모아 따로 올려 달라고 했고, 그 자료는 다음 주 국무회의에 올라왔다."
 TFRKPHN_lg_546_a:0 "국방부가 전후 군 재편을 마쳤다고 보고했다. 대만해협에서 이기고 돌아온 군대는 흩어지지 않고 편제를 거의 그대로 지킨 채 북쪽으로 돌아섰다.\n\n일손이 모자란다는 재계 불만은 여전했다. 대통령은 통일되는 날까지는 이 군대가 필요하다고 답하면서, 그날이 오면 가장 먼저 군복을 벗길 사람들 명단부터 만들어 두라고 지시했다.\n\n재계 불만은 숫자로 나왔다. 조선소와 건설 현장에 사람이 없어 공사가 밀린다는 보고가 경제 단체에서 올라왔고, 한 조선소는 외국인 노동자를 더 들이게 해 달라고 했다.\n\n군 안의 공기는 달랐다. 이긴 군대를 흩지 않는다는 결정에 장교들은 안도했다. 병사들은 달랐다.\n\n\"중대장님, 저희 언제 집에 갑니까? 전쟁 끝났잖습니까.\" \"...밥이나 먹자. 얘기 좀 해 봐.\"\n\n한 중대장은 대답 대신 병사들과 저녁을 먹으며 밤늦게까지 이야기를 들어 주었다.\n\n명단을 만들라는 지시는 그 주 인사참모부로 내려갔다. 맨 앞에는 가장 오래 복무한 사람들이 올랐고, 그해 겨울 첫 명단의 장병들이 군복을 벗었다."
 TFRKPHN_lg_547_a:0 "2017년 1월 15일 여의도 당사에서 대통령은 네 번째 대선 출마를 선언했다. 그날 그는 대통령이 되면 여섯 달 안에 헌법을 고쳐 경제와 교육, 노동, 복지 같은 내정은 내각에 넘기고 외교와 안보, 국방, 통일은 대통령이 맡겠다고 약속했다. 그해 경선에서 지는 바람에 약속은 써 보지도 못했다.\n\n헌법을 고치려면 국회 의결과 국민투표를 거쳐야 한다. 그래서 그는 개헌을 기다리지 않고 지금 헌법이 허락하는 데까지 먼저 권한을 나눴다. 총리가 장관을 제청하면 그대로 임명하고, 내정 안건을 다루는 국무회의는 총리가 주재하게 했다."
 TFRKPHN_lg_547_b:0 "열 해가 지나 대통령이 된 그는 일하는 방식부터 그렇게 바꿨다. 내정 보고는 총리실로 가고, 대통령에게는 합참과 외교부, 통일부 보고만 올라온다. 대만해협에서 이기고 돌아온 군대를 어디에 세울지도 그가 직접 정하기로 했다. 첫 지시는 군의 눈을 북쪽으로 돌리라는 것이었다.\n\n그날 합참 작전 참모들은 몇 해 동안 아무도 펴 보지 않은 북쪽 작전 지도를 꺼냈다. \"이거 언제 마지막으로 폈어?\" \"몰라. 먼지 봐라.\""
 TFRKPHN_lg_548_a:0 "2017년 3월 19일 자유한국당 경선 첫 텔레비전 토론에서 독자 핵무장에 찬성하느냐는 질문이 나왔다. 홍준표는 찬성 팻말을 들고 이제는 공포의 핵 균형으로 북핵을 막을 때라고 했다. 이인제는 반대 팻말을 들었다. 유럽 최강국 독일에는 핵이 없고, 핵 없는 한반도로 가야 한다는 게 그의 말이었다.\n\n그 뒤로 세상이 바뀌었다. 미국 핵우산은 사라졌고, 찬성 팻말을 들었던 사람이 대통령이 되어 일본과 억지력을 쌓았다. 반대 팻말을 들었던 총리는 국무회의에서 혼자 반대표를 던졌는데, 이제 대통령이 되어 그 억지력을 물려받았다.\n\n대통령은 소신은 그대로라고 했다. 그러면서도 북핵이 남아 있는 동안 전임 정부가 쌓은 걸 제 손으로 허물 수는 없다며, 북핵이 사라지는 날 함께 내려놓겠다는 단서를 발표문 끝에 달았다.\n\n발표문을 다듬던 외교부 실무자는 그 한 줄을 몇 번이나 고쳐 썼다.\n\n\"함께 내려놓겠다, 이게 바깥에선 언젠가 내려놓겠다로 읽혀요.\" \"그럼 뭐라고 써?\" \"그러니까 고민이죠. 오늘 밤도 집에 다 갔네요.\""
 TFRKPHN_lg_549_a:0 "2017년 1월 출마 선언에서 대통령은 사드를 한국과 미국이 합의한 최소한의 대응이라고 불렀다. 그 최소한의 조치에 중국이 반발하고 나라 안 여론까지 갈라지는 걸 그는 걱정했다.\n\n지금 사정은 더 나쁘다. 전쟁에서 진 중국은 다시 군비를 늘리고 북쪽 미사일은 그대로다. 국방부가 방어망을 북쪽과 서쪽으로 넓히는 계획을 올리자 대통령은 요격 포대 수와 레이더 놓일 자리를 하나하나 묻고 결재했다. 이번에도 그는 같은 말을 골랐다. 방어망은 날아오는 걸 막을 뿐이고 이번 확장도 최소한의 대응이라는 설명이 그날 주변국에 전달됐다.\n\n국방부는 레이더 들어설 자리의 주민 설명회 일정을 잡았다. 후보지 한 곳은 십 년 전 사드 때 주민들이 길을 막았던 곳과 멀지 않았다. 설명회 첫날 마을 회관 앞에 그때 현수막을 다시 꺼내 든 노인들이 서 있었다.\n\n\"그때도 최소한이라 캤다. 최소한이 와 자꾸 늘어나노.\"\n\n외교부는 같은 날 베이징 반응을 살폈다. 이번에는 대사 초치가 없었다. 석 달 뒤 첫 레이더가 자리를 잡았다."
 TFRKPHN_lg_550_a:0 "2018년 7월 27일 정부는 국방개혁 2.0을 발표했다. 61만 8천여 명이던 상비 병력을 2022년까지 50만 명으로 줄이고, 장군은 436명에서 360명으로, 육군 병사 복무 기간은 21개월에서 18개월로 줄인다는 계획이었다.\n\n그 계획은 전쟁을 겪어 보지 않은 군대를 두고 짰다. 대만해협 전쟁은 바다와 하늘에서 치렀고 우리 군은 거기서 이겼다. 다음 임무가 기다리는 곳은 북쪽의 산과 도시다."
 TFRKPHN_lg_550_b:0 "국방부가 올린 2단계 계획은 승전의 교훈을 부대 편제에 옮기는 일이다. 겹치는 사령부를 합치고, 해군과 공군에 쏠렸던 전시 예산을 산악과 시가지에서 싸울 부대로 돌린다.\n\n장군 자리가 또 줄어든다는 소식에 육군본부 복도가 한동안 조용했다. 진급을 앞둔 대령들은 서로 눈치를 봤다.\n\n\"이긴 군대가 먼저 줄어드는 건 처음 본다.\" \"이기고 나서 안 고치면 다음엔 진다. 그거 몰라?\" \"알지. 근데 왜 하필 내 차례에.\"\n\n국방부는 그 주에 개편 첫 단계로 겹치는 사령부 두 곳을 합치는 계획을 발표했다."
 TFRKPHN_lg_551_a:0 "1990년 독일은 통일을 얻는 대신 값을 치렀다. 코카서스 회동에서 통일 독일은 병력을 37만 명으로 묶고 핵을 갖지 않겠다고 약속했고, 주변국 동의는 그 약속 위에서 나왔다.\n\n대통령은 2017년 출마 선언에서 북한 체제가 본질적 변화를 피할 수 없고 통일의 결정적 기회가 다가온다고 말했다. 그날이 왔을 때 군이 무엇을 해야 하는지는 그때도 정해져 있지 않았다."
 TFRKPHN_lg_551_b:0 "국방부 새 계획이 그 빈칸을 채운다. 북한 지역 안정화를 맡을 부대와 압록강, 두만강 국경을 지킬 부대를 미리 짜 두고, 주변국이 병력과 핵을 두고 무엇을 요구할지 독일 사례를 놓고 따져 봤다. 마지막 장에는 통일 뒤 우리가 줄여야 할 것들의 목록이 붙었다.\n\n계획서를 만든 국방부 과장은 독일 통일 자료를 반년 동안 읽었다. 가장 많이 밑줄을 그은 건 동독군 장교들이 통일 뒤 어떻게 됐는지 다룬 장이었고, 그 내용은 계획서 부록으로 들어갔다. 계획서는 기밀로 묶였다. 표지에는 통일 이후라는 짧은 제목만 적혔다."
 TFRKPHN_lg_552_a:0 "2017년 1월 출마 선언에서 대통령은 통일을 경제 그 자체라고 불렀다. 통일 비용을 걱정하는 사람들에게 그는 골드만삭스 전망을 꺼내 보였다. 통일하고 서른 해에서 마흔 해가 지나면 한국 경제가 독일과 일본을 넘어설 수 있다는 내용이었다.\n\n방식도 분명히 말했다. 대한민국 헌법의 가치 위에서 국제사회와 손잡고 자주적으로 이뤄야 하고, 차별과 보복 없이 민주적 절차를 밟는 통일이라면 두려워할 까닭이 없다고 했다."
 TFRKPHN_lg_552_b:0 "대통령이 된 그는 그 말을 정부 문서로 옮기라고 지시했다. 기획재정부와 통일부가 함께 만든 보고서는 북쪽 지하자원과 철도, 항만, 북쪽 주민들이 새로 만들 시장을 항목마다 숫자로 적었다. 보고서는 첫 장부터 통일 비용을 투자라고 불렀다.\n\n실무자들은 반년 동안 탈북민 경제학자들과 같이 일했다. 그중 한 사람은 북쪽 장마당 물가를 기억만으로 적어 냈다.\n\n\"쌀 일 킬로에 얼마였는지, 그걸 어떻게 다 기억하세요?\" \"매일 셌으니까요. 안 세면 굶었어요.\"\n\n그 표는 부록으로 들어갔고, 국무회의 날 대통령은 부록부터 펼쳐 쌀값 줄을 손가락으로 짚었다."
 TFRKPHN_lg_553_a:0 "2007년 대선에서 대통령은 지분소유형 임대주택 230만 호를 약속했다. 입주자가 가진 돈만큼 지분을 사고 나머지는 임대로 살면서 지분을 늘려 가는 구상이었다. 시민단체는 택지와 자금을 어떻게 마련할지가 구체적이지 않다고 짚었다.\n\n비슷한 제도는 2020년 8월 정부 주택 공급 대책에 지분적립형 분양주택이라는 이름으로 들어갔다. 분양가의 20에서 40퍼센트를 먼저 내고 스무 해에서 서른 해에 걸쳐 나머지 지분을 사들이는 방식이었고, 서울시는 2028년까지 1만 7천 가구를 공급하겠다고 했다."
 TFRKPHN_lg_553_b:0 "정부는 이 제도를 전역 장병과 신혼부부에게 먼저 연다. 전쟁에서 돌아온 청년들에게는 목돈이 없고, 전시에 묶였던 택지는 이제 풀리는 중이다. 국토교통부는 첫 지분을 분양가의 5분의 1로 낮추고 군 복무 기간만큼 지분 사들이는 기간을 줄여 주는 안을 내놓았다.\n\n첫 단지 모집 공고가 나간 날 접수 창구 맨 앞에 군복 벗은 지 한 달 된 청년과 약혼자가 섰다. 두 사람은 첫 지분으로 넣을 돈을 봉투에 담아 왔다.\n\n\"복무 기간 공제됐습니다. 두 해 줄었어요.\" 직원이 계약서를 내밀자 청년이 웃었다. \"전선에 있던 게 처음으로 쓸모가 있네요.\""
 TFRKPHN_lg_554_a:0 "1997년 대선에서 대통령은 공무원과 공기업 여성 채용을 2002년까지 30퍼센트로 늘리고 여성 정책을 총괄할 여성처를 만들겠다고 공약했다. 그때 한 신문은 세 후보의 여성 공약이 서로 구분하기 어려울 만큼 비슷하고 예산과 실행 계획이 빠졌다고 썼다.\n\n서른 해 뒤 그 숫자는 다른 길로 채워졌다. 남자들이 전선에 있는 동안 여성들이 공장과 항만, 관제실을 돌렸다. 전쟁이 끝난 지금 그들 가운데 많은 수가 일터를 떠날지 고민한다. 아이를 맡길 곳이 없다."
 TFRKPHN_lg_554_b:0 "부산 신항의 한 크레인 기사는 전쟁 두 해 동안 밤 근무를 도맡았다. 남편은 해군에 있었고 아이는 시어머니가 봤다. 남편이 돌아오자 회사가 그에게 낮 근무로 옮기라고 했다.\n\n\"안 내려갑니다. 저 크레인 제가 이 년 몰았어요. 대신 애 맡길 데나 좀 찾아 주세요.\"\n\n정부는 국공립 보육시설을 절반 더 늘리고, 전시에 일하던 여성이 그 자리에 남을 수 있게 공공 부문부터 여성 고용 30퍼센트를 채우기로 했다. 보육 예산은 내년 예산안 맨 앞 장에 실렸다."
 TFRKPHN_lg_555_a:0 "2018년 충남지사 선거에서 대통령이 내건 핵심 공약 가운데 하나가 어르신 통합 복지카드였다. 바우처 카드에 해마다 일정 금액을 채워 주고 의료비와 교통비, 이미용비, 목욕비로 쓰게 한다는 내용이었다. 공약을 평가한 시민단체는 대상과 금액이 분명해 현실성은 있지만 쓸 곳이 좁다고 봤다. 그는 그 선거에서 졌고 카드는 한 장도 나가지 못했다.\n\n대통령이 된 그는 같은 카드를 전국으로 넓히고 쓸 곳도 늘렸다. 약국과 안경점, 동네 식당이 더해졌고 첫 카드는 자식을 전쟁터에 보냈던 세대에게 먼저 나간다. 보건복지부가 이 카드 한 장으로 합쳐지는 수당과 할인을 세어 보니 열한 가지였다."
 TFRKPHN_lg_555_b:0 "카드가 처음 나간 날, 충남의 한 시골 목욕탕 주인이 문 앞에 카드 받습니다라고 손글씨로 써 붙였다. 첫 손님은 아들을 해군에 보냈던 여든 살 노인이었다.\n\n\"이걸로 진짜 되나? 돈 안 내도?\" \"되지예. 들어가시이소. 때는 따로 밀어 드립니더.\"\n\n첫해 사용 내역을 보니 병원보다 목욕탕과 동네 이발소에서 더 많이 썼다. 복지부 담당자는 그 표를 보고 한참 웃다가 다음 해에는 동네 사진관도 넣자고 했다. 영정 사진을 미리 찍어 두려는 노인이 많았다."
 TFRKPHN_lg_567_a:0 "대아대전이 터진 날 자정이 넘어, 홍준표 전 대통령이 약속도 없이 집무실 정문에 나타났다. 경호처가 어떻게 할지 묻자 대통령은 들이라고 했다. 홍준표 정부에서 넘어온 직원들은 걸음걸이만 보고도 누군지 알아봤다.\n\n전임 대통령은 인사도 없이 지도부터 찾았다. 그는 대만해협 전쟁 때 자기가 저지른 실수를 꼽았다. 탄약을 아낀 것, 일본을 늦게 믿은 것, 국민에게 석 달이면 끝난다고 말한 것."
 TFRKPHN_lg_567_b:0 "대통령은 받아 적지 않고 듣기만 했다. 다 듣고 나서 하나만 물었다. 그때로 돌아가도 참전하겠느냐. 전임 대통령은 한다고, 더 일찍 한다고 답했다.\n\n그는 새벽 세 시에 일어섰다. 문 앞에서 돌아보지도 않고 빚은 전쟁 끝나고 걱정하라고 했다. 채무 제로를 입에 달고 살던 사람의 말이었다.\n\n두 사람은 악수하지 않았다.\n\n다음 날 아침 합참의장이 지도 위 연필 자국 세 개를 봤다. \"이건...\" 대통령이 고개를 들자 그는 더 묻지 않고 그 자리를 펜으로 다시 짚어 보고했다."
 TFRKPHN_lg_568_a:0 "2011년 당 대표가 되던 날 대통령은 치열했던 변방의 정신을 잊지 않겠다고 했다. 자기에게는 계파가 없다는 말도 그날 했다. 십 년 넘게 지나 그는 정말 계파 하나 없이 이 자리에 왔고, 덕분에 누구에게도 자리를 빚지지 않고 내각 명단을 짤 수 있었다.\n\n계파가 없으면 기댈 사람도 없다. 여의도에서 대통령을 진심으로 좋아하는 사람은 한 손으로 꼽는다. 대통령은 그걸 조금도 아쉬워하지 않는다.\n\n\"좋아해 주는 사람 많아 봐야 청탁만 늘어. 안 그래?\" 그가 비서실장에게 한 말이다."
 TFRKPHN_lg_568_b:0 "2017년 대선에서 진 뒤로 다섯 해 동안 그는 하고 싶은 말을 하고 싶은 때 하면서 여기까지 왔다. 돌려 말하지 않아서 청년들이 좋아한다는 게 선거 캠프 분석이었다. 이제 할 일은 그 말들이 정책이 되기 전에 숫자를 붙이는 것이다.\n\n책상 위에 사법시험과 모병제, 노동 유연화, 핵공유가 차례를 기다린다. 전부 그가 오래전부터 해 온 말이고, 이제 말한 대로 하면 된다.\n\n그날 저녁 비서실장이 내각 명단을 다시 읽었다. 대통령과 같은 계파는 한 명도 없었다. 애초에 대통령에게 계파가 없었다."
 TFRKPHN_lg_572_a:0 "2011년 8월 24일 서울에서 무상급식 주민투표가 치러졌다. 오세훈 시장은 이 투표에 시장직을 걸었는데 투표율이 25.7퍼센트로 개표 기준인 3분의 1에 못 미쳤다. 이틀 뒤 그는 즉각 사퇴로 책임을 다하겠다며 물러났다.\n\n그때 한나라당 대표가 홍준표였다. 그는 당과 상의 없이 투표를 밀어붙이고, 시장직을 걸고, 사퇴까지 미루지 않은 걸 두고 오 시장에게 세 번 농락당했다고 했다."
 TFRKPHN_lg_572_b:0 "십 년 넘게 지나 한 사람은 대통령이, 한 사람은 다시 서울시장이 됐다. 서울시장은 국무회의에 배석할 수 있어서 두 사람이 이제 한 방에 앉는다. 첫 회의에서 대통령은 오 시장 쪽을 보지 않았고 오 시장은 서울시 안건이 나올 때만 입을 열었다.\n\n회의가 끝나고 복도에서 두 사람 수행 비서들이 마주쳤다. 서로 고개만 까딱하고 지나갔다. 그날 저녁 의전 담당자는 다음 회의 때 서울시장 자리를 어디에 둘지 한참 고민했다.\n\n\"대통령님 정면은 안 되고, 너무 멀면 또 말 나오고...\"\n\n누가 그 옛일을 꺼내자 대통령은 약속한 대로 물러난 것 하나는 인정한다고 했다."
 TFRKPHN_lg_573_a:0 "서울시는 2021년 11월 11일 안심소득 시범사업 정부 승인을 받았다. 중위소득 85퍼센트에 못 미치는 800가구를 골라, 기준액에서 모자라는 소득의 절반을 세 해 동안 현금으로 채워 주는 사업이다.\n\n정부가 서민 대책을 내놓은 주에 오세훈 시장은 이 사업을 전국으로 넓히자고 제안했다. 모두에게 똑같이 나눠 주는 돈보다 어려운 사람에게 더 주는 돈이 보수가 할 복지라고 그는 설명했다."
 TFRKPHN_lg_573_b:0 "대통령은 2020년 6월 기본소득을 두고 사회주의 배급제를 하자는 것과 다름없다고 말한 사람이다. 안심소득은 기본소득과 다르다는 보고를 받고도 그는 현금을 쥐여 주는 일에 선뜻 찬성하지 않았다.\n\n보건복지부 실무자들이 서울의 중간 결과를 들고 왔다. 시범 가구 가운데 일을 그만둔 사람보다 일자리를 다시 찾은 사람이 더 많았다는 표였다.\n\n\"숫자가 아직 작아요.\" \"작아도 방향은 보이잖아요.\"\n\n두 수석이 엇갈렸다. 기획재정부는 서울의 세 해 결과를 보고 정하자는 의견을 올렸고, 그 표는 다음 국무회의 안건으로 올라갔다."
 TFRKPHN_lg_574_a:0 "2019년 2월 17일 자유한국당 당 대표 후보 토론에서 오세훈은 넛지 전략을 써야 한다고 말했다. 북한에 핵 폐기 기간을 주고 우리도 핵을 개발하겠다고 해야 중국도 움직이고 미국도 심각하게 생각한다는 논리였다.\n\n핵공유 협의체가 발표된 날 오 시장이 그 말을 다시 꺼냈다. 협의체는 첫걸음일 뿐이고, 협의가 막히면 우리 손으로 만들 수 있다는 걸 보여 줘야 상대가 자리에 앉는다는 글이었다."
 TFRKPHN_lg_574_b:0 "국무회의에서 혼자 반대한 총리와 정부보다 더 나가자는 서울시장 사이에서 대통령은 협의체 원안을 그대로 밀고 간다. 외교부는 오히려 오 시장 글이 협상에 쓸모 있다고 봤다. 한국 안에 더 센 목소리가 있다는 걸 상대도 읽는다.\n\n그 글이 실린 신문은 이튿날 몇몇 나라 대사관 번역 보고서에 고스란히 올라갔다.\n\n\"서울시장 글 하나가 우리 외교 문서 다섯 장보다 빨리 돌아요.\" 외교부 국장이 웃었다.\n\n대통령실은 공식 논평을 내지 않았다. 오 시장은 그 뒤로도 같은 주장을 두어 번 더 했고, 그때마다 번역 보고서 쪽수가 조금씩 늘었다."
 TFRKPHN_lg_575_a:0 "임기 마지막 해가 되자 당 안에서 다음 후보를 두고 말이 많아졌다. 총리 이인제와 서울시장 오세훈이 앞서 있는데, 둘 다 대통령과 가깝다고 하기는 어렵다.\n\n대통령이 한쪽 손만 들어 주면 끝난다는 건의가 몇 번 올라왔지만 대통령은 받지 않았다. 2011년 오 시장이 당과 상의 없이 시장직을 걸었을 때 제일 화를 낸 사람이 당 대표였던 자기였다는 것이다. 그러니 이제 와서 자기가 당원들과 상의 없이 후보를 정할 수는 없다고 했다."
 TFRKPHN_lg_575_b:0 "오세훈 시장이 출마하려면 시장직을 내려놓아야 한다. 한 번 시장직을 걸었다가 잃은 사람이 이번에는 스스로 내려놓고 나선다. 전당대회는 당원 투표와 국민 여론조사로 치르기로 했다.\n\n당 선거관리위원회는 규칙 초안을 세 번 고쳤다. 당원 투표와 여론조사 비율 하나를 두고 두 캠프가 밤새 줄다리기를 했다. 마지막 초안이 나온 새벽, 위원장은 대통령실에 이 비율로 정했다는 문자 한 통만 보냈고 답은 오지 않았다.\n\n정무수석이 그 문자를 보여 주자 대통령은 휴대전화를 돌려주며 한마디만 했다. 잘했네. 나한테 묻지 않은 거."
 TFRKPHN_lg_576_a:0 "1997년 7월 21일 신한국당 전당대회 결선에서 이인제는 이회창에게 졌다. 그는 그 자리에서 결과에 승복한다고 했고 도정에만 전념하겠다고도 했다. 그해 9월 13일 그는 당을 떠나 민심의 바다에 뛰어들겠다며 출마를 선언했다. 그 뒤로 경선 불복이라는 말이 삼십 년 동안 그의 이름 앞에 붙어 다녔다.\n\n2027년 킨텍스에서 진 사람은 오세훈이다. 그는 결과가 나오자 연단에 올라 승복한다고 말했고 선거가 끝날 때까지 유세차에 함께 올랐다. 시장직은 이미 내려놓아서 돌아갈 자리도 없었다."
 TFRKPHN_lg_576_b:0 "유세 초반에 두 캠프 사람들은 서로를 경계했다. 한 달쯤 지나자 유세차 뒤편에서 같이 도시락을 까먹는 사이가 됐다.\n\n\"그쪽 김밥 하나 줘 봐요. 우리 건 다 식었어.\" \"그쪽 후보님 연설은 언제 짧아져요?\" \"우리 후보님은 원래 길어요.\"\n\n취임 뒤 대통령은 오세훈을 따로 불러 칼국수를 같이 먹었다. 그 자리에서 대통령은 자기는 그때 그렇게 하지 못했다고 말했다. 두 사람은 한 시간 동안 식사를 했는데, 그 절반은 아무 말 없이 국수만 먹었다."
 TFRKPHN_lg_577_a:0 "2017년 3월 19일 경선 토론에서 대통령은 독자 핵무장에 반대 팻말을 들었다. 두 해 뒤인 2019년 2월 17일 오세훈은 당 대표 후보 토론에서 우리도 핵을 개발한다고 하는 넛지 전략을 써야 한다고 했다. 두 사람은 같은 당에서 가장 멀리 떨어진 자리에 서 있었다.\n\n정부가 핵 문제 방향을 내놓자 오세훈이 신문에 글을 실었다. 북쪽 핵이 사라진 게 확인될 때까지는 물려받은 억지력에 손대지 말고, 내려놓는 순서는 상대가 먼저여야 한다는 내용이었다."
 TFRKPHN_lg_577_b:0 "안보실이 그 글을 두고 회의를 열었다.\n\n\"정부 방향하고 반대되는 글이 같은 당에서 나오면 저쪽이 우릴 얕봅니다.\" \"거꾸로죠. 우리 카드가 하나 는 겁니다.\"\n\n대통령은 생각은 다르지만 협상장에 들고 갈 반대 의견으로는 쓸 만하다며 그 글을 오려 보고서 맨 뒤에 붙여 두라고 했다. 협상에 나간 외교부 차관은 실제로 그 글을 한 번 꺼내 들었다. 상대 대표는 이미 읽고 왔다며 웃었다. 번역본에는 밑줄까지 그어져 있었다."
 TFRKPHN_lg_578_a:0 "오세훈은 서울시장 때 안심소득 시범사업을 시작했다. 중위소득 85퍼센트에 못 미치는 가구에 모자라는 소득의 절반을 현금으로 채워 주는 사업으로, 2021년 11월 11일 정부 승인을 받았다.\n\n시장직을 내려놓은 그가 그 사업 결과 보고서를 들고 대통령을 찾아왔다. 대통령의 복지는 일자리가 먼저고 고용보험과 복지카드가 뒤를 받친다. 그런데 일할 수 없거나 일해도 벌이가 모자라는 사람들이 그 사이로 빠진다는 게 오세훈의 말이었다.\n\n보고서에는 시범 가구들 이야기가 몇 쪽 붙어 있었다. 아픈 남편을 돌보느라 일을 줄인 아내, 식당 일을 하며 아이 둘을 키우는 아버지. 숫자 사이에 끼운 그 몇 쪽에서 대통령은 한참 손을 떼지 못했다.\n\n대통령은 보고서를 끝까지 읽고 보건복지부에 넘겼다. 재정 당국은 전쟁 빚을 갚는 동안에는 새 현금 사업을 벌이기 어렵다고 했다.\n\n복지부는 한 달 만에 작은 규모의 시험 사업안을 만들어 서랍에 넣어 두었다. \"이거 언제 꺼내요?\" \"빚 다 갚으면. 아니면 누가 먼저 물어보면.\""
 TFRKPHN_lg_579_a:0 "오세훈이 시장이던 2007년 서울은 2010년 세계디자인수도로 뽑혔다. 한강 둔치를 손보고 동대문운동장 자리에 새 건물을 올리는 일도 그의 임기에 시작됐다. 돈을 너무 썼다는 비판과 도시가 달라졌다는 평가가 지금도 함께 따라다닌다.\n\n대통령은 그에게 북쪽 도시를 다시 짓는 일을 준비할 위원회를 맡아 달라고 했다. 통일이 오면 평양과 신의주, 원산에 상하수도와 전기와 집이 한꺼번에 필요하다. 시장직을 내려놓으며 서울에서 배운 걸 나라로 가져가겠다고 했던 사람이니 그 말을 북쪽에서 써 보라고 했다."
 TFRKPHN_lg_579_b:0 "위원회 사무실은 광화문 오래된 건물 한 층에 차려졌다. 첫날 책상 위에 평양의 낡은 지도와 위성 사진, 탈북민들이 기억으로 그린 동네 그림이 함께 펼쳐졌다. 그림 몇 장에는 우물과 공동 화장실 자리까지 적혀 있었다.\n\n\"여기 화장실이 마을에 하나예요?\" \"하나요. 아침마다 줄 서요. 그거부터 고쳐 주세요.\"\n\n오세훈은 사흘 뒤에 맡겠다고 답했다. 조건은 하나, 위원회 회의록을 모두 공개한다는 것이었다. 첫 회의록은 그 주 금요일 인터넷에 올라왔고 누가 무엇에 반대했는지까지 다 적혀 있었다."
 TFRKPHN_lg_580_a:0 "대통령은 1995년 첫 민선 경기도지사로 뽑혔다. 스물세 해 뒤 같은 자리에 앉은 사람이 지금의 더불어민주당 대표 이재명이다. 이재명 지사의 경기도는 2019년부터 만 24세 청년에게 분기마다 25만 원을 지역화폐로 주는 청년기본소득을 시작했다.\n\n이재명은 다섯 해째 당을 쥐고 있다. 그동안 그에게 맞섰던 의원들은 공천에서 차례로 떨어졌고, 지금 야당에서 그와 다른 말을 하는 사람은 손에 꼽는다."
 TFRKPHN_lg_580_b:0 "정부가 고용보험을 넓히는 안을 내놓자 이재명은 다른 안을 들고 나왔다. 일자리를 잃은 사람만 받는 보험으로는 일자리를 가져 본 적 없는 사람이 빠지니, 전쟁에서 돌아온 청년 모두에게 조건 없이 주자는 안이었다. 정부가 이 안을 안 받으면 돌아온 청년들의 불만이 고스란히 정부 몫이 된다는 걸 그도 알았다.\n\n대통령은 일해서 버는 돈이 복지의 뼈대라는 생각을 바꾸지 않았다. 그러면서도 야당 안을 상임위원회에 같이 올려 같은 날 심사하게 하라고 했다.\n\n보건복지부는 그 주에 청년들의 전역 뒤 소득 자료를 처음으로 따로 뽑았다. 전역 첫해 소득이 가장 낮은 사람들은 대부분 고향에 일자리가 없는 지역 출신이었다."
 TFRKPHN_lg_581_a:0 "이낙연은 2019년 10월 28일 재임 881일로 가장 오래 일한 국무총리가 됐고 이듬해 1월 물러났다. 2022년 대선에서는 홍준표 대통령에게 졌다.\n\n정부가 책임총리제를 내놓은 주에 한 신문이 그에게 생각을 물었다. 그는 총리가 고른 장관이 마음에 안 들 때나 총리 결정이 여론에 밀릴 때 대통령이 끼어들지 않아야 제도가 선다고 했다. 제도보다 대통령이 참는 게 먼저라고 답했다."
 TFRKPHN_lg_581_b:0 "대통령은 그 기사를 읽고 이낙연에게 전화를 걸었다. 두 사람 다 대통령 선거에서 져 본 사람이다. 통화가 끝나자 대통령은 총리를 지낸 사람들을 여야 가리지 않고 한 해에 두 번 청와대로 부르기로 했다.\n\n그 인터뷰는 총리실 직원들 사이에서 조용히 돌았다. 한 국장은 기사를 오려 책상 유리 밑에 끼워 두었다. 몇 주 뒤 총리가 고른 장관 후보 하나를 두고 대통령실에서 딴말이 나오자 그는 유리 밑 기사를 다시 읽었다.\n\n\"참으셔야 할 텐데.\" 그가 혼잣말을 했다. 다음 국무회의에서 총리가 제청한 장관 명단은 그대로 통과됐다."
 TFRKPHN_lg_582_a:0 "국회 국방위원회에서 김병주 의원이 국방부 장관을 불러 세웠다. 한미연합사 부사령관을 지낸 예비역 대장으로, 대만지원법 때 파병 조항에 반대한 사람이다.\n\n그는 세 가지를 물었다. 대만해협에서 돌아온 부대를 북쪽 산악에 맞게 다시 짜는 데 몇 해가 걸리는지, 그동안 전방 빈자리는 누가 메우는지, 북쪽 안정화 부대가 주민을 상대할 때 따를 교전 규칙은 누가 정하는지.\n\n국방부는 앞의 둘에는 숫자로 답했고 마지막 질문에는 답을 미뤘다. 보고를 받은 대통령은 교전 규칙의 뼈대를 국회에 먼저 보고하라고 지시했다. 군이 북쪽에 들어가기 전에 국회가 그 규칙을 알아야 한다는 이유였다.\n\n질의는 네 시간 이어졌고 장관은 물을 세 잔 마셨다. 끝나고 나서 국방부 정책실장이 셋째 질문을 적은 종이를 들고 장관실로 갔다.\n\n\"교전 규칙을 국회에 내놓은 적이 없습니다. 한 번도요.\" \"그러니까 이번이 처음이 되겠지.\"\n\n그날 저녁 예비역 장성 몇이 김병주 의원 질문이 옳았다는 글을 올렸다. 그 가운데에는 여당 쪽으로 분류되던 사람도 있었다."
 TFRKPHN_lg_583_a:0 "대선 다음 날 아침 이낙연이 전화를 걸어 왔다. 그는 결과를 받아들인다고 했고, 지지해 준 사람들에게 미안하다는 말부터 한 다음 당선을 축하했다.\n\n대통령은 그 전화가 어떤 건지 안다. 2017년 5월 9일 밤, 개표가 열에 하나도 안 끝났을 때 그는 선거 결과를 수용한다고 말했다. 다섯 해 전 자기가 하던 말을 이번에는 듣는 쪽이 됐다.\n\n이낙연은 2019년 10월 28일 가장 오래 일한 국무총리가 된 사람이다. 통화 끝에 그는 선거에서 진 쪽 대표를 정해진 날짜에 꼭 만나 달라고 부탁했다."
 TFRKPHN_lg_583_b:0 "괜찮으시냐는 대통령의 말에 이낙연이 웃었다.\n허허, 대통령님. 저는 괜찮습니다.\n전화 너머 목소리는 웃고 있었지만 절대 괜찮은 게 아니었다.\n\n통화가 끝나자 비서실장이 말했다.\n다음 일정은 기자회견입니다.\n\n대통령은 2017년 대선에서 떨어졌던 자신을 떠올렸다. 그때의 자신보다 이낙연은 훨씬 품격 있는 패자였다."
 TFRKPHN_lg_584_a:0 "대선에서 진 더불어민주당이 새 대표를 뽑았다. 2021년 10월 경선에서 이낙연에게 졌던 이재명이다. 진 후보를 도왔던 의원들이 당직에서 물러났고 그 자리는 한 주 만에 이재명 사람들로 채워졌다.\n\n이재명은 성남 공장에서 일하며 검정고시로 대학에 갔고, 사법시험에 붙은 뒤 인권과 노동 사건을 맡다가 성남시장과 경기도지사를 지냈다. 2021년 가을 불거진 대장동 의혹이 그를 경선에서 넘어뜨렸지만 그를 따르는 사람들을 흩어 놓지는 못했다."
 TFRKPHN_lg_584_b:0 "전당대회장 밖에는 그의 이름을 외치는 사람들이 밤늦게까지 남아 있었다. 그는 수락 연설에서 정권을 심판하겠다고 했고, 바다 건너 싸움에는 끼어들지 않는다는 걸 당 방침으로 못 박았다. 다른 목소리를 낸 의원 몇은 그날 밤 문자를 수천 통씩 받았다.\n\n\"의원님, 휴대전화가 안 꺼집니다. 배터리가 다 닳았어요.\" \"꺼 둬. 내일 아침에 켜.\"\n\n연설을 본 대통령은 저 사람은 지는 법을 한 번 배웠으니 두 번은 안 지려 들 거라고 했다. 정무수석실은 앞으로 국회에서 올라올 반대가 모두 이 사람 손을 거쳐 올 거라고 보고했다."
 TFRKPHN_lg_585_a:0 "2017년 2월 8일, 성남시장이던 이재명은 사법시험이 우리 사회에 계층 이동의 기회를 준다고 말했다. 국민 다수가 사법시험과 로스쿨이 함께 있길 바란다는 말도 했다. 같은 당 문재인 전 대표는 로스쿨을 만든 정부 사람으로서 되돌리기 어렵다는 입장이었다.\n\n정부가 사법시험 부활안을 내자 야당 안에서 반대가 먼저 나왔다. 이재명 대표는 그 반대를 당론으로 묶지 않았다. 자기가 예전에 한 말을 뒤집을 수는 없다는 이유를 댔다. 대통령실에는 고시생과 그 부모들 표를 여당에 통째로 넘겨주지 않으려는 계산으로 읽는 사람이 더 많았다."
 TFRKPHN_lg_585_b:0 "법안은 야당 의원 일부의 찬성표를 얻었다. 표결 결과를 보고받은 대통령은 정권 심판을 외치는 사람한테 표를 받을 줄은 몰랐다며 웃었다.\n\n법무부 담당자들은 야당 결정을 듣고 법안 일정을 앞당겼다. 국회 제출 자료 맨 앞에는 야당 대표가 예전에 한 말을 인용해 두었다.\n\n\"이거 너무 노골적이지 않아요?\" \"본인이 한 말인데 뭐.\"\n\n로스쿨 협의회는 같은 날 반대 성명을 냈고, 법제사법위원회는 다음 주로 심사 날짜를 잡았다."
 TFRKPHN_lg_586_a:0 "대만지원법 표결 전날 밤, 국회 본청 야당 대표실 불이 늦게까지 켜져 있었다. 대통령실이 그 방 이야기를 들은 건 한참 뒤였고, 전해 준 사람은 그날 그 방에 있었다.\n\n이재명 대표는 법안이 어느 쪽으로 가든 손해 볼 게 없다고 했다. 법이 통과되면 전사자가 나올 때마다 정부가 값을 치르고, 막히면 대만이 무너진 책임이 대통령에게 돌아간다는 계산이었다.\n\n반대 토론은 김병주 의원에게 맡겼다. 군복 입었던 사람이 말해야 반대가 겁쟁이 소리로 안 들린다는 이유였다. 김 의원이 헌법 60조를 읽겠다고 하자 대표는 좋은 생각이라고만 했다."
 TFRKPHN_lg_586_b:0 "방을 나서던 한 의원이 돌아섰다.\n\n\"대표님, 근데 대만이 진짜 무너지면 어떡합니까?\" \"내일 표결에서 이탈할 사람 이름이나 적어 와요.\"\n\n대표는 질문에 답하지 않았다. 대표실 불은 새벽 두 시가 넘어서야 꺼졌다. 이탈자 명단을 들고 온 보좌관의 종이에는 이름 두 개만 적혀 있었고, 대표는 그 종이를 접어 주머니에 넣었다.\n\n다음 날 아침 본회의장에 들어서는 야당 의원들 얼굴은 저마다 달랐다."
 TFRKPHN_lg_587_a:0 "2016년 3월 10일 정청래가 더불어민주당 공천에서 배제됐다. 마포을 재선 의원이었고 거친 말이 이유로 꼽혔다. 엿새 뒤 그는 당사 앞에서 당 지도부는 자기를 버렸지만 자기는 당을 버리지 않겠다고 말했고, 탈당하지 않은 채 다른 후보들 유세를 도왔다.\n\n이재명 대표가 당직을 갈아 치운 뒤 이낙연을 도왔던 의원들 사이에 탈당 얘기가 돌았다. 정청래 의원은 그 의원들을 한 사람씩 찾아가 말렸다. 자기는 잘려 봤는데 잘린 사람이 나가면 당은 자른 사람 것이 된다고 했다.\n\n같은 주 의원총회에서 그는 대표를 마주 보고 사람을 잘라 내서 당을 쥐려 하지 말라고 했다. 회의장은 조용했고 박수 친 사람은 없었다.\n\n정무수석실은 이 보고를 올리면서 야당이 갈라지면 정부에 이롭다고 덧붙였다. 대통령은 고개를 저었다. 야당이 한 사람 것이 되는 쪽이 나라에는 더 나쁘다고 했다.\n\n그 주 야당 의원총회 회의록은 이튿날 아침 여러 신문에 실렸다. 정부에 이롭다는 보고와 나라에 나쁘다는 대통령의 답은 물론 어디에도 실리지 않았다."
 TFRKPHN_lg_588_a:0 "정청래 의원은 2016년 공천에서 배제되고도 당에 남으면서 나라의 주인이 국민이듯 당의 주인은 당원이라고 말한 사람이다. 지금 야당에서 이재명 대표와 다른 말을 하는 몇 안 되는 의원이다.\n\n대통령이 진영 정치로 돌아가지 말자며 정치 개혁을 꺼내자 야당 지도부는 논의에 들어오지 않기로 했다. 정청래 의원만 혼자 회의장에 나왔다. 그의 손에는 공천을 당원 투표로 정하도록 못 박는 법안이 들려 있었다."
 TFRKPHN_lg_588_b:0 "그 법안이 통과되면 여당도 같은 규칙을 따라야 해서 여당 안에서도 반대가 많았다. 1997년 경선 결과를 두고 당을 떠났던 대통령은 누가 후보를 정하느냐는 물음이 얼마나 무거운지 안다. 그는 이 법안을 정부안과 함께 심사하게 하라고 했다.\n\n회의가 끝나자 정청래 의원이 웃었다. 당에 돌아가면 징계가 기다리고 있을 거라고 했다.\n\n함께 심사한다는 소식이 알려지자 여당 원내대표실에 전화가 몰렸다. 공천을 당원 투표로 정하면 현역 의원 자리가 흔들린다.\n\n\"속도 좀 늦춰 주세요. 지금 의원들 난리입니다.\" 원내대표가 그날 밤 대통령실에 전화를 걸었다."
 TFRKPHN_lg_589_a:0 "정청래 의원은 대학 시절 미 대사관저 점거 농성으로 두 해를 복역한 사람이다. 대만지원법에 반대표를 던졌고, 사람들이 바다를 건너간 뒤에도 본회의장에서 돌아오게 하라고 요구했다.\n\n전쟁이 끝난 주에 그가 전사자 합동 빈소를 찾았다.\n\n\"반대하던 사람이 여길 왜 와! 당신이 무슨 낯으로!\" 유족 하나가 소리쳤다.\n\n그는 대꾸하지 않고 영정마다 절을 한 뒤 방명록에 이름만 적고 나왔다. 따라붙은 기자들이 지금도 반대하느냐고 묻자, 보내지 말자고 한 사람도 돌아오지 못한 사람 앞에서는 고개를 숙여야 한다고 답했다.\n\n그날 저녁 대통령도 같은 빈소에 들렀다. 방명록에는 두 이름이 한 장 건너 적혀 있었다.\n\n유족 단체 대표가 다음 날 방명록을 정리하다가 그 두 이름을 찾아냈다. 그는 그 장을 사진으로 찍어 두었다.\n\n\"반대한 사람이랑 보낸 사람이 같은 날 같은 영정 앞에 섰다는 거, 그거 하나는 기억해 둬야지요.\"\n\n그 사진은 액자에 담겨 몇 해 뒤 전쟁기념관 한 전시실에 걸렸다."
 TFRKPHN_lg_58_a:0 "신용사면 발표를 하루 앞둔 밤, 대통령 책상에 우리가 올린 보고서가 놓여 있다. 신용불량자 수십만 명, 문 닫은 가게 수만 곳. 전쟁이 끝났는데도 그 숫자는 조금도 줄지 않았다.\n\n이튿날 발표 회견에서 대통령은 어머니 이야기부터 꺼냈다. 장터 구석에 좌판을 펴던 어머니가 사채 몇 푼 때문에 머리채를 잡혀 끌려가던 날 이야기였다. 그때 어머니에게 필요했던 건 좌판을 다시 펼 수 있는 하루였다고 했다."
 TFRKPHN_lg_58_b:0 "보고서 뒷장에는 장터 상인들을 만나고 온 행정관의 메모가 붙어 있었다. 빚을 안 갚으려는 게 아니고 갚을 길이 끊겼다는 상인들의 말이 그대로 적혀 있었다.\n\n사람들은 그를 서민대통령이라고 부른다. 그를 설명하는 말로 그만큼 짧은 것도 없다. 그래도 서민으로 태어났다고 해서 저절로 서민을 위한 정치를 하게 되는 건 아니라는 걸 그는 잘 알았다.\n\n눈을 뜬 대통령은 연설문 첫 장 맨 위에 직접 한 줄을 적었다. 빚 때문에 머리채를 잡히는 사람이 없는 나라. 그 아래에 오늘부터 다시 문을 여시라고, 정부가 함께 열겠다고 첫 문장을 썼다."
 TFRKPHN_lg_590_a:0 "공천 법안을 들고 정부 회의에 나간 뒤 정청래 의원은 당 윤리심판원에 넘겨졌다. 당론을 어기고 정부와 손잡았다는 게 사유였다. 당원 게시판에는 그를 내쫓으라는 글이 하루에 수천 건씩 올라왔다.\n\n심판원에 나가는 길에 기자들이 탈당할 생각이 있느냐고 물었다. 그는 2016년에 한 말을 그대로 되풀이했다. 당 지도부는 자기를 버렸지만 자기는 당을 버리지 않겠다고 했다.\n\n당은 그에게 당원 자격 정지 여섯 달을 내렸다. 결정문을 받은 그는 여섯 달 뒤에 다시 오겠다고 했고 이튿날부터 지역구 사무실로 출근했다.\n\n보고를 들은 대통령은 자기는 저 나이에 저렇게 못 했다고 했다. 1997년의 그는 당을 떠났다.\n\n그 주 지역구 사무실에 손님이 끊이지 않았다. 당원도 왔고 다른 당 지지자도 왔다. 한 노인은 문을 열고 들어와 한마디만 하고 나갔다.\n\n\"잘려도 안 나가는 사람은 오랜만에 보네. 그거 하나 보러 왔소.\"\n\n보좌관은 그 말을 사무실 칠판에 적어 두었다. 여섯 달 뒤 그는 약속대로 당사에 다시 나타났다. 기자는 몇 없었다."
 TFRKPHN_lg_591_a:0 "통일 뒤 처음 열린 더불어민주당 전당대회에 이재명 대표는 나오지 않았다. 여러 해 동안 대표가 정하던 자리를 이번에는 당원 투표로 뽑기로 했고, 그 규칙을 처음 들고 나왔던 사람이 후보로 나섰다.\n\n자격 정지가 풀린 정청래 의원이 지역구에서 올라와 출마를 선언했다. 연설은 짧았다. 나라의 주인이 국민이듯 당의 주인은 당원이라는 2016년의 말을 다시 했고, 당을 떠난 사람들에게 돌아오라고 했다.\n\n개표 결과 그가 대표로 뽑혔다. 무대에 오른 그가 두 손을 들어 보이자, 객석에 몇 해 전 당을 떠났다가 돌아온 얼굴들이 섞여 있는 게 보였다.\n\n대통령은 축하 전화를 걸어 이제 상대할 맛이 나겠다고 했다. 정무수석실이 다음 국회가 지금보다 시끄러워질 거라고 보고하자 대통령은 그게 정상이라고 답했다.\n\n그날 밤 야당 당사 앞에 오랜만에 지지자들이 모였다. 몇 해 전 탈당했다가 이번에 다시 입당 원서를 낸 사람들은 새 당원증을 들고 사진을 찍었다.\n\n\"이거 몇 번째 당원증이에요?\" \"세 번째. 이번엔 안 찢을 거야.\""
 TFRKPHN_lg_592_a:0 "개헌 논의가 시작된 지 한 달 만에 더불어민주당이 의원총회를 열어 개헌안 반대를 당론으로 정했다. 이재명 대표는 전쟁에서 이긴 정부가 그 기세로 헌법까지 고치려 든다고 했다.\n\n그는 조문을 하나하나 따지지 않았다. 지금 헌법을 고치면 고친 사람 헌법이 된다는 말만 되풀이하고, 찬성 쪽으로 기울던 의원 몇을 대표실로 불렀다. 방에서 나온 의원들은 그 뒤로 입을 닫았고, 여당이 세던 찬성표는 그날 저녁 몇 개 줄었다."
 TFRKPHN_lg_592_b:0 "당론이 정해진 날 저녁 여당 원내대표실에서 찬성표를 다시 세는 회의가 열렸다. 재적 3분의 2를 넘기려면 야당 표가 꼭 필요했다. 원내 수석부대표가 칠판에 남은 야당 의원 이름을 적고 한 사람씩 지워 나가자 마지막에는 이름 몇 개만 남았다.\n\n그날 밤 정무수석이 야당 의원 몇에게 따로 전화를 걸었다. 대부분 받지 않았다.\n\n\"수석님, 미안합니다. 지금은 당론 따를 수밖에 없어요. 지금은요.\" 받은 한 사람은 그 말만 했다.\n\n다음 날 아침 신문들은 개헌안 앞날을 어둡게 썼다. 한 신문은 일 면에 찬성표 계산표를 싣고 모자라는 칸을 빨갛게 칠했다. 대통령은 신문을 덮고 그날 오후 야당 대표에게 만나자는 연락을 넣으라고 했다."
 TFRKPHN_lg_593_a:0 "정청래 의원이 본회의 자유 발언을 신청했다. 당론은 반대였는데 그는 찬성 쪽에 이름을 올렸다.\n\n그는 1987년 헌법이 거리에서 싸운 사람들이 얻어 낸 헌법이라는 말로 시작했다. 그렇게 얻은 헌법이라 사십 해 가까이 아무도 손대지 못했지만, 손 못 대는 것과 지키는 것은 다르다고 했다. 정부안 조문에 다 찬성하는 건 아니고 논의의 문을 여는 표결에만 찬성한다는 말도 덧붙였다.\n\n발언이 끝나자 야당 의석에서 야유가 쏟아졌다. 여당 의석 몇 군데서는 박수가 나왔다가 금방 멎었다.\n\n\"그럴 거면 저쪽으로 가!\" \"배신자!\"\n\n중계를 본 대통령은 저 사람 말이 여당 누구 말보다 낫다고 했다.\n\n그날 밤 의원 여럿이 그의 방을 찾아갔다. 이튿날 아침 방 앞에는 지지자들이 보낸 화분 몇 개와 당원들이 붙인 항의 쪽지가 함께 놓여 있었고, 보좌관은 둘 다 치우지 않았다. 몇몇 야당 의원은 그 발언 영상을 자기 계정에 조용히 올렸다. 야당 의원이 당론과 다른 발언을 퍼 나른 건 그때가 처음이었다.\n\n그는 그날 저녁 지역구로 내려갔다."
 TFRKPHN_lg_594_a:0 "표가 좀처럼 늘지 않자 여당 안에서 말이 거칠어졌다. 원내 지도부 의원 하나가 방송에 나와 개헌에 반대하는 사람들을 낡은 헌법 뒤에 숨은 세력이라고 불렀다. 반대하는 의원 지역구마다 현수막을 걸자는 말까지 나왔다.\n\n대통령은 2011년 당 대표가 되던 날 자기에게는 계파가 없다고 말한 사람이라 여당이 한목소리로 야당을 몰아세우는 데 익숙하지 않았다. 그런데 그 공격 덕에 흔들리던 여당 의원 몇이 자리를 잡았다. 야당은 이게 헌법을 함께 고치자는 사람들 태도냐고 되물었다.\n\n방송 다음 날 여당 초선 의원 몇이 원내대표실을 찾아갔다.\n\n\"이런 말로는 표 안 늘어요. 오히려 빠집니다. 우리 지역구에서 벌써 전화 와요.\"\n\n원내대표는 그들 말을 다 듣고 방송에 나갔던 의원에게 전화를 걸었다. 통화는 짧았다. 야당 쪽에는 그 말을 반기는 사람도 있었다. 반대할 명분이 하나 더 생겼다.\n\n그 의원은 다음 날 방송에 다시 나와 원내대표실과 함께 고친 문장으로 짧게 사과했다. 현수막 얘기는 그 뒤로 다시 나오지 않았다."
 TFRKPHN_lg_610_a:0 "수도권 메가시티 1단계 공사가 끝났다.\n\n수도권을 30분 안에 잇는 급행 철도다. A노선은 2018년 12월 27일 첫 삽을 떴고, 남은 노선까지 이어 수도권을 한 생활권으로 묶는다. 전쟁 동안 멈췄던 터널 굴착기가 다시 돈 지 두 해 만에 마지막 구간 선로가 이어졌다.\n\n개통 첫날 새벽 다섯 시 반, 경기도 북쪽 끝 역 승강장에 첫차를 타려는 사람들이 줄을 섰다. 서울 도심 병원에서 일하는 간호사도 그 줄에 있었다. 그는 여덟 해 동안 출근길에 버스 두 번과 지하철 한 번을 갈아탔다.\n\n\"스물여섯 분이요? 진짜요?\" 그는 도착하자마자 휴대전화 시계를 다시 봤다."
 TFRKPHN_lg_610_b:0 "역마다 아침 풍경이 달라졌다. 서울로만 몰리던 사람들이 이제는 반대 방향 열차에도 탔다. 서울에 살면서 경기도 공장과 연구소로 출근하는 사람들이었다.\n\n부동산 중개소들은 새 역 근처 아파트값이 벌써 들썩인다고 했다. 국토부는 다음 노선 역 주변에는 처음부터 공공주택 부지를 떼어 두겠다고 밝혔다.\n\n개통식에 온 공사 현장 소장은 테이프를 자르는 대신 터널 안 작업자 이름이 새겨진 명판 앞에 섰다. 전쟁으로 공사가 멈춘 동안 현장을 떠나지 않고 장비를 지킨 사람들이었다.\n\n\"이 사람들 아니었으면 굴착기 다 녹슬었습니다.\""
 TFRKPHN_lg_611_a:0 "수도권 메가시티 2단계 공사가 끝났다.\n\n2018년 12월 19일 정부는 남양주와 하남, 인천에 새 도시를 짓겠다고 발표했다. 전쟁으로 멈춘 공사를 다시 돌리고 입주 날짜를 못 박았고, 이번에 첫 단지들 열쇠가 주인에게 넘어갔다.\n\n입주 첫 주말 새 도시 도로에 이삿짐 트럭이 줄지어 섰다. 사전 청약에 당첨되고도 전쟁 때문에 입주가 세 해 밀렸던 부부도 그중에 있었다. 그사이 아이는 유치원에서 초등학교로 올라갔다. 짐도 다 안 푼 빈 거실 바닥에 세 식구가 나란히 누웠다.\n\n\"아빠, 여기 진짜 우리 집이야?\" \"응. 이번엔 진짜.\""
 TFRKPHN_lg_611_b:0 "새 도시에는 아직 없는 게 많았다. 학교는 문을 열었지만 병원은 내년에야 들어서고 대형 마트는 공사 중이었다. 주민들은 첫 반상회에서 버스 노선부터 늘려 달라는 민원을 모았다.\n\n국토부 장관은 입주식에서 입주 날짜를 지킨 것만으로 절반은 했다고 말했다. 나머지 절반이 학교와 병원과 버스라는 건 주민들이 이미 알았다.\n\n상가가 비어 있으니 첫 단지 앞 공터에서 주민들이 직접 장터를 열었다. 서로 필요한 걸 바꿔 쓰자는 장터였고, 매주 토요일 열기로 했다."
 TFRKPHN_lg_612_a:0 "수도권 메가시티 3단계 공사가 끝났다.\n\n서울비전 2030은 여의도를 특구로 묶어 외국 금융기관을 불러들이겠다고 했다. 홍콩을 떠난 자본이 내릴 자리를 만드는 일이다. 이번 공사로 특구 안에 외국 금융사 전용 사무 공간과 외국인 학교, 영어로 진료하는 병원이 들어섰다.\n\n준공식은 평일 아침에 짧게 끝났다. 정작 그날 가장 바쁜 곳은 새로 문을 연 외국인 학교였다. 홍콩과 싱가포르에서 온 직원들 아이들이 첫 등교를 했고, 교문 앞에서 부모들이 영어와 광둥어와 서툰 한국어로 아이들 등을 떠밀었다."
 TFRKPHN_lg_612_b:0 "여의도의 오래된 식당가도 달라졌다. 점심때면 국밥집 앞에 정장 차림 외국인들이 줄을 섰다.\n\n\"손님, 이거 영어로 뭐라고 써요? 순대국.\" \"Sundae soup? 아니, 아이스크림 같은데...\" \"그럼 그냥 순대국이라고 쓰자.\"\n\n금융 당국은 특구에 새로 문을 연 회사가 석 달 만에 마흔 곳을 넘었다고 발표했다. 같은 날 국내 은행들은 특구 밖 영업 규제도 같이 풀어 달라는 건의서를 냈다. 특구 관리 사무소에는 국내 은행 직원들이 외국 회사로 옮기면 연봉이 얼마나 오르느냐는 문의를 넣었다."
 TFRKPHN_lg_613_a:0 "수도권 메가시티 4단계 공사가 끝났다.\n\n대통령이 시장 시절 한강 둔치를 손보던 사업이다. 강을 따라 걷는 길과 배 닿는 곳을 서해까지 잇는다.\n\n서울은 육백 년 넘게 이 나라의 수도였다. 조선의 한양에서 시작한 도시는 전쟁으로 폐허가 됐다가 다시 일어섰고, 사람들은 그 시절을 한강의 기적이라고 부른다. 정부와 큰 기업 본사가 다 여기 있다. 그렇게 모든 게 모인 도시 한가운데를 흐르는 강을, 이번에 시민이 걸어서 닿을 수 있는 곳으로 바꿨다."
 TFRKPHN_lg_613_b:0 "공사가 끝난 첫 주말 강변 길에는 자전거와 유모차가 뒤섞였다. 서해 쪽 끝 선착장에서 떠난 배가 여의도까지 올라오는 데 한 시간이 걸렸다. 배에 탄 사람 대부분은 강에서 서울을 올려다보는 게 처음이었다. 다리 위로만 다니던 사람들이다.\n\n강변 오래된 아파트 주민들은 밤늦게까지 이어지는 발소리를 걱정했고, 서울시는 밤 열한 시가 넘으면 강변 조명을 절반으로 줄이기로 했다.\n\n개장 첫날 노을 질 무렵 강변 계단에 빈자리가 없었다. 한 노인이 강 건너 불빛을 가리키며 손주에게 말했다.\n\n\"할애비가 피란 갈 때 이 강을 나룻배로 건넜다. 그땐 다리가 끊겨서.\" \"배 타고? 지금처럼?\" \"지금 배는 호텔이다, 호텔.\""
 TFRKPHN_lg_614_a:0 "수도권 메가시티 5단계 공사가 끝났다.\n\n2007년 서울시는 용산 철도 정비창 자리에 31조 원짜리 업무 지구를 짓겠다고 발표했다. 사업은 2013년에 무산됐고 땅은 그 뒤로 비어 있었다. 스무 해 만에 그 자리에 건물이 올라간다. 이번 단계에서 첫 업무 빌딩 세 동과 그 사이를 잇는 공원이 문을 열었다.\n\n그 땅을 가장 오래 지켜본 건 정비창 옆 골목 주민들이었다. 사업이 무산된 뒤로 그들은 보상도 개발도 없이 십 년 넘게 빈 땅만 보며 살았다. 준공식 날 골목에서 철물점을 하는 노인이 공원 벤치에 앉아 한참 건물을 올려다봤다.\n\n\"이번엔 진짜로 다 지은 거여? 또 멈추는 거 아니고?\" 그는 옆 사람에게 몇 번이고 물었다."
 TFRKPHN_lg_614_b:0 "첫 입주 기업 가운데 네 곳은 망명해 온 기업이다. 아시아 본부를 홍콩에서 옮겨 온 회사들로, 그 간판이 걸린 날 용산역 앞 식당가 점심 손님이 두 배로 늘었다.\n\n공원 한가운데에는 이 땅의 내력을 잊지 말자고 옛 정비창 선로 한 토막을 남겼다. 개장 한 달 뒤부터 공원에 주말 장터가 섰는데, 첫 자리는 정비창 옆 골목 주민들 몫으로 돌아갔다."
 TFRKPHN_lg_615_a:0 "충청권 메가시티 1단계 공사가 끝났다.\n\n2021년 4월 국가철도망 계획안에 대전 반석에서 세종청사를 거쳐 조치원과 오송으로 가는 철길이 들어 있었다. 대전과 세종, 청주를 한 줄로 잇는 그 철길에 첫 열차가 달렸다.\n\n첫 열차 승객 가운데 세종 정부청사로 출근하는 공무원이 많았다. 대전에 집을 두고 세종으로 다니던 사람들이다. 지금까지는 버스를 타고 막히는 길을 한 시간 가까이 달렸다.\n\n\"커피 다 마시기도 전에 내렸어요. 이거 내일도 이래요?\" 한 사무관이 개찰구를 나오며 웃었다."
 TFRKPHN_lg_615_b:0 "청주 쪽 끝 오송역은 서울로 가는 고속철도와 새 철길이 만나는 곳이 됐다. 역 앞 광장 개통식에 대전과 세종, 청주, 충남과 충북 단체장들이 나란히 섰다. 한 단체장은 충청이 처음으로 한 줄로 이어졌다고 했다.\n\n충청 신문들은 이튿날 일 면에 노선도를 크게 실었다. 그 밑에 다음 단계 공사 예산이 아직 확정되지 않았다는 기사가 작게 붙었다.\n\n첫 달 승객은 계획의 두 배를 넘었다. 철도공사는 출근 시간 열차에 한 칸씩 더 붙이기로 했고, 대전과 세종을 오가던 시외버스 회사는 노선을 반으로 줄였다."
 TFRKPHN_lg_616_a:0 "충청권 메가시티 2단계 공사가 끝났다.\n\n연구소가 모인 대덕을 다시 짠다. 담장 안에 있던 연구 시설을 기업과 대학에 연다.\n\n대전은 서울에서 영남과 호남으로 내려가는 길이 갈라지는 곳이다. 1950년 여름 보름 남짓 정부가 이곳에 머문 것도 그 자리 때문이었다. 1973년 1월 대덕이 연구 도시 후보지로 정해졌고, 스무 해 가까이 걸려 1992년 11월 단지가 준공됐다. 1998년에는 정부대전청사가 문을 열었다. 나라는 이 도시에 연구소와 관청을 차례로 내려보냈고, 이번에는 그 연구소 담장을 낮춘다."
 TFRKPHN_lg_616_b:0 "담장이 낮아진 첫날 한 연구소 정문 옆에 작은 카페가 문을 열었다. 연구원과 창업자, 대학원생이 한 탁자에 앉았다.\n\n\"선배님은 여기 몇 년 계셨어요?\" \"서른 해. 근데 옆 연구소 사람하고 커피 마시는 건 오늘이 처음이야. 담 너머로 얼굴만 알았지.\"\n\n전쟁 때 이 단지 연구소들은 레이더와 통신 장비를 고치느라 밤을 새웠다. 이제 그 기술을 들고 나가 회사를 세우겠다는 연구원이 늘었고, 특구 사무소에는 첫 달에만 창업 상담이 백 건 넘게 들어왔다."
 TFRKPHN_lg_617_a:0 "충청권 메가시티 3단계 공사가 끝났다.\n\n오송에 모인 제약과 의료 기업을 한 단지로 묶는다. 전쟁 때 모자랐던 약과 의료 물자를 여기서 만든다.\n\n전쟁 동안 이 나라는 항생제와 수액이 모자라 애를 먹었다. 수입선이 막힌 약을 구하려고 병원끼리 재고를 나눠 쓰던 때도 있었다. 그때 야간 근무를 하던 약사 하나가 이번 준공식에 초대받아 왔다. 그는 새 공장 생산 라인을 한참 내려다보다 혼잣말을 했다.\n\n\"그때 이게 있었으면. 그 애기 엄마한테 수액 못 준다고 안 했어도 됐는데.\""
 TFRKPHN_lg_617_b:0 "단지 안에 제약 공장과 함께 임상 시험 병원과 연구소가 들어섰다. 따로 떨어진 건물에 있던 사람들이 이제는 같은 마당을 지나 출근한다. 청주의 대학들은 바이오 학과 정원을 늘렸다.\n\n오송 주민들은 반기면서도 걱정했다. 공장이 늘면 물과 공기는 어떻게 되느냐는 것이다. 단지 관리 사무소는 정문 전광판에 공장 배출 측정값을 실시간으로 띄우기로 했다.\n\n준공식 날 연구소에 첫 임상 시험 참가자 모집 공고가 붙었다. 전쟁에서 다친 사람들의 재활을 돕는 약이었고, 정원은 사흘 만에 찼다."
 TFRKPHN_lg_618_a:0 "충청권 메가시티 4단계 공사가 끝났다.\n\n청주공항을 충청의 관문으로 키운다. 활주로를 늘리고 화물 터미널을 짓는다.\n\n청주공항은 오랫동안 군 비행장과 활주로를 나눠 쓰는 작은 공항이었다. 국제선은 손에 꼽을 정도라 충청 사람들도 해외 갈 때면 인천까지 올라갔다. 이번 공사로 늘린 활주로에 첫 국제 화물기가 내렸다. 첫 짐은 오송에서 만든 의약품과 대덕의 연구 장비였다."
 TFRKPHN_lg_618_b:0 "여객 터미널도 넓어졌다. 새 국제선이 생긴 첫 주 출국장에 세종과 대전에서 온 가족 여행객들이 줄을 섰다.\n\n\"인천까지 안 가도 되니까 하루 번 거지. 애들 깨워서 새벽 세 시에 나설 일도 없고.\" 한 아버지가 캐리어를 밀며 말했다.\n\n공항 둘레 마을들은 늘어난 소음 때문에 보상을 요구했다. 국토부는 야간 비행을 줄이고 마을 창문을 이중으로 바꿔 주기로 했지만, 정문 앞에는 그 약속을 지키라는 현수막이 아직 걸려 있다.\n\n개항 기념 첫 국제선 여객기에는 해외 학회에 가는 오송 바이오 단지 연구원들도 탔다. 집에서 공항까지 한 시간이 안 걸린 건 그들도 처음이었다."
 TFRKPHN_lg_619_a:0 "충청권 메가시티 5단계 공사가 끝났다.\n\n2021년 9월 28일 국회는 세종에 의사당을 둘 수 있게 국회법을 고쳤다. 미뤄 온 공사를 끝내고 상임위원회부터 옮긴다.\n\n세종의사당 첫 회의는 국토교통위원회가 열었다. 서울에서 내려온 의원들은 좌석 배치가 여의도와 똑같은 걸 보고 웃었다.\n\n\"의자는 똑같은데 창밖이 다르네.\" 한 의원이 말했다. 창밖으로 호수와 정부청사가 보였다.\n\n가장 반긴 건 공무원들이었다. 지금까지 국정감사 철이면 세종 공무원들은 서류 상자를 끌고 새벽 기차를 타고 여의도로 올라갔다. 이제는 걸어서 의사당까지 간다. 한 사무관은 부서 단톡방에 이제 KTX 첫차 안 탄다고 올렸다."
 TFRKPHN_lg_619_b:0 "여의도 국회는 그대로 남고 본회의도 여전히 서울에서 열린다. 충청 시민단체들은 다음은 본회의라고 적은 현수막을 의사당 앞에 걸었다. 대통령실 세종 집무실을 두고도 같은 말이 오가기 시작했다.\n\n첫 회의가 끝난 저녁 세종 호수공원 둘레 식당들이 국회 직원들로 꽉 찼다.\n\n\"생각보다 살 만한데? 공기도 좋고.\" \"다음 주엔 애들 데려와 볼까.\" 서울에서 내려온 보좌관 둘이 소주잔을 부딪쳤다."
 TFRKPHN_lg_620_a:0 "호남권 메가시티 1단계 공사가 끝났다.\n\n광주와 혁신도시 나주를 철길로 잇는다. 두 도시를 오가던 출퇴근길이 반으로 준다.\n\n광주는 무등산 북서쪽 기슭에 앉아 있고 광주천이 시내를 지나 영산강으로 흘러든다. 1896년 전라남도 도청이 들어선 뒤로 호남의 일은 이 도시로 모였다. 사람들은 1980년 5월 이곳에서 일어난 민주화운동을 기억한다. 1986년 11월 직할시가 됐지만 살림은 오래 상업이 맡았고, 공업단지는 자동차 공장 하나를 가운데 두고 짜였다. 이 도시에 새 일거리를 놓으려는 까닭이 거기 있다.\n\n첫 열차가 아침 일곱 시에 광주송정역을 떠났다. 나주 혁신도시 공기업으로 출근하는 젊은 직원들이 제일 많이 탔다. 대부분 광주에 집을 두고 막히는 국도를 차로 다니던 사람들이다.\n\n\"이제 퇴근하고 광주에서 친구 만나도 되겠다. 대리비 안 들고.\"\n\n나주 쪽 역 앞 상가는 아직 다 차지 않았다. 역 앞에 국밥집을 연 사장은 첫날 손님이 열 명도 안 됐는데도 웃었다. \"열차가 댕기는디 오것지라. 곧 오것지.\""
 TFRKPHN_lg_621_a:0 "호남권 메가시티 2단계 공사가 끝났다.\n\n광주는 2020년 1월 29일 인공지능 중심 도시를 선언했고 2021년 2월 데이터센터 공사를 시작했다. 정부는 그 단지를 나라의 연구 거점으로 키운다. 이번 공사로 데이터센터 옆에 연구동과 창업 공간이 들어섰다.\n\n전쟁 동안 이 데이터센터는 군 통신 자료를 나눠 맡았다. 전쟁이 끝나자 그 연산 능력이 남았다. 이제 그 서버들은 병원 영상 판독과 농가 수확 예측, 자동차 공장 품질 검사를 돌린다."
 TFRKPHN_lg_621_b:0 "단지에 처음 들어온 회사는 광주의 대학을 갓 졸업한 셋이 세운 곳이었다. 그들은 서울로 가지 않고 고향에 남았다.\n\n\"서울 안 가도 되는 이유가 생겼습니다.\" 대표가 개소식에서 말했다. 맨 뒷줄에서 그의 어머니가 휴대전화로 그 장면을 찍었다.\n\n광주시는 다음 해까지 이 단지에 일자리 천 개를 만들겠다고 했다. 지역 신문은 그 숫자를 일 면에 크게 실으면서 지난 십 년 동안 비슷한 약속이 몇 번 있었는지도 같이 적었다.\n\n연구동 꼭대기 층에는 전쟁 때 데이터센터를 지킨 군 통신병들 이름을 새긴 판이 걸렸다. 그중 둘은 전역하고 이 단지 회사에 들어왔다."
 TFRKPHN_lg_622_a:0 "호남권 메가시티 3단계 공사가 끝났다.\n\n나주의 에너지 대학은 2021년 3월 법이 통과되고 그해 6월 1일 착공했다. 그 대학 둘레에 전력과 배터리 기업을 모은다. 이번 공사로 대학 옆 산업단지에 전력 설비와 배터리 공장 여섯 곳이 들어섰다.\n\n전쟁 동안 이 나라에서 가장 약했던 게 전력망이었다. 발전소 한 곳이 멈추면 공단 전체가 숨을 죽였다. 에너지 밸리 공장들은 그때 모자랐던 변압기와 저장 장치를 만든다. 첫 출하 물량은 서해안 에너지 농장으로 실려 갔다."
 TFRKPHN_lg_622_b:0 "에너지 대학 첫 졸업생들이 이 공장들에 들어갔다. 그중 하나는 서울에서 면접을 보고 내려오는 기차 안에서 나주 공장 합격 문자를 받았다. 그는 서울 회사 결과를 기다리지 않기로 했다.\n\n나주 주민들은 일자리가 는 건 반기면서도 밤에도 불이 안 꺼지는 공장 단지를 낯설어했다.\n\n\"들판 너머 별이 다 어디 갔능가 몰라.\" \"공장 불빛이 별이여, 이제는.\" 마을 회관에서 노인들이 그렇게 주고받았다.\n\n대학 총장은 졸업생들 첫 월급날에 맞춰 공장을 돌며 저녁을 같이 먹었고, 그 자리에서 다음 해 입학 정원을 늘리겠다고 약속했다."
 TFRKPHN_lg_623_a:0 "호남권 메가시티 4단계 공사가 끝났다.\n\n여수의 석유화학과 광양의 제철을 하나로 묶어 낡은 설비를 바꾸고 수출 부두도 넓힌다. 광양만을 사이에 두고 마주 보던 두 공단이 이번에 배관과 도로로 이어졌다.\n\n전쟁 동안 두 공단은 쉬지 않고 돌았다. 여수 공장들은 연료와 화학 원료를 댔고 광양 제철소는 군함과 탄약에 들어갈 철을 댔다. 그사이 설비는 낡을 대로 낡았다. 이번 공사에서 가장 오래된 분해 시설 두 기가 멈추고 새 설비로 바뀌었다."
 TFRKPHN_lg_623_b:0 "설비가 멈추던 날, 여수의 한 공장에서 서른 해를 일한 반장이 계기판 불이 꺼지는 걸 마지막으로 지켜봤다.\n\n\"이놈하고 장가가고 애 키웠다. 수고했다, 고철아.\"\n\n새 설비 운전실에는 그가 가르친 후배들이 앉았다.\n\n넓어진 수출 부두에 첫 화물선이 들어왔다. 광양 철판과 여수 화학 제품이 같은 배에 실렸다. 부두 노동자들은 두 도시 짐을 한 배에 싣는 건 처음이라고 했다. 두 도시 시장은 공동 기자회견을 열었지만, 공단 세금을 어느 쪽이 얼마나 가져갈지는 아직 정하지 못했다."
 TFRKPHN_lg_624_a:0 "호남권 메가시티 5단계 공사가 끝났다.\n\n바다를 막아 만든 땅이 오래 비어 있었다. 항만과 공항, 공장 터를 한꺼번에 채운다. 방조제가 바다를 막은 뒤로 이 땅에 뭘 지을지 계획이 몇 번이나 바뀌었고, 그때마다 땅은 갈대밭으로 남았다.\n\n이번에는 공장이 먼저 들어왔다. 망명 기업 두 곳이 배터리 공장과 태양광 패널 공장을 지었다. 넓은 땅과 가까운 항만, 서해안 에너지 농장의 전기가 그들을 불렀다. 새 공장 지붕 위로 갈매기들이 날아다녔다."
 TFRKPHN_lg_624_b:0 "방조제가 생기기 전 이 바다에서 조개를 캐던 어민들도 준공식에 왔다. 그중 한 사람은 이 땅이 뭐가 될지 서른 해를 기다렸다고 했다. 그는 공장 정문 경비원이 됐다.\n\n\"바다 잃고 일자리 얻은 셈이지. 손해는 아니여. 그래도 조개는 그립고.\"\n\n새만금 항만에 첫 컨테이너선이 닿은 날, 군산과 김제, 부안 상인들이 항만 앞에 천막을 치고 특산물을 팔았다. 손님은 대부분 공장 직원과 항만 노동자였다. 환경 단체는 남은 갯벌만큼은 남겨 두라고 요구했고, 정부는 방조제 안쪽 일부를 습지 보호 구역으로 묶기로 했다."
 TFRKPHN_lg_625_a:0 "대구경북 메가시티 1단계 공사가 끝났다.\n\n구미에서 대구를 지나 경산까지 철길로 잇는다. 세 도시의 공단과 대학이 한 노선 위에 놓인다.\n\n대구는 팔공산을 등지고 분지 한가운데에 앉아 있고, 금호강이 북쪽을 돌아 낙동강으로 들어간다. 1601년 경상도 감영이 옮겨 온 뒤로 영남의 행정과 상업은 이곳으로 모였다. 대구에는 오래 섬유 공장이 가장 많았다. 1999년 말에도 제조업체 열 곳 가운데 네 곳 가까이가 섬유 업체였다. 그 공장들이 줄어든 뒤 이 도시가 뭘로 먹고살지는 아직 아무도 답을 내지 못했다."
 TFRKPHN_lg_625_b:0 "첫 열차에는 경산 대학으로 통학하는 구미 학생들이 많이 탔다. 지금까지는 대구에서 한 번 갈아타고 한 시간 반을 다녀야 했다.\n\n\"이제 자취방 빼도 되겠다. 월세가 얼만데.\" \"니 엄마가 좋아하겠네. 매일 집밥이다.\" \"...그건 좀 생각해 보고.\"\n\n노선 한가운데 대구역 앞에는 섬유 공장을 하다 문 닫은 사람들이 꾸린 공방 거리가 있다. 열차가 서기 시작하자 그 거리에도 사람이 늘었다. 한 공방 주인은 문 닫은 공장 재봉틀로 가방을 만들어 팔았다. 대구시는 이 철길이 섬유 다음을 찾는 첫걸음이라고 했다."
 TFRKPHN_lg_626_a:0 "대구경북 메가시티 2단계 공사가 끝났다.\n\n전자 공장이 떠난 구미 공단을 다시 채운다. 전쟁 때 늘린 방산 전자 설비가 이곳에 남는다. 비어 있던 공장 건물 열한 동에 새 회사들이 들어갔다.\n\n구미는 한때 이 나라 전자 제품의 큰 몫을 만들었다. 텔레비전과 휴대전화가 이곳에서 나왔다. 큰 공장들이 하나둘 해외로 떠나면서 공단에 빈 건물이 늘었는데, 전쟁이 그 건물들을 다시 채웠다. 레이더와 통신 장비, 드론 부품이 밤낮으로 만들어졌다."
 TFRKPHN_lg_626_b:0 "전쟁이 끝나자 그 설비를 어디에 쓸지 정해야 했다. 이번 공사로 방산 전자 설비는 그대로 두고 같은 라인에서 민간 통신 장비와 자동차 전장 부품도 함께 만들게 했다.\n\n\"보세요, 이건 군용, 다음 건 자동차용. 같은 라인에서 번갈아 나옵니다. 전쟁이 남긴 것 중에 이거 하나는 쓸 만해요.\" 한 공장장이 라인을 가리켰다.\n\n공단 둘레 원룸촌에도 다시 불이 켜졌다. 한동안 빈방이 절반 넘던 건물들이었다. 원룸 주인들은 공단 정문 앞에 방 있음 현수막을 다시 내걸었다. 구미시는 공단 재편이 끝난 날 입구에 새 표지판을 세우고, 전자의 도시라는 옛 글자 아래에 한 줄을 더 적었다."
 TFRKPHN_lg_627_a:0 "대구경북 메가시티 3단계 공사가 끝났다.\n\n제철 도시 포항에 배터리 소재 공장을 모은다. 철 다음 먹거리를 여기서 찾는다. 영일만 바닷가 공단에 양극재와 음극재 공장 다섯 곳이 문을 열었다.\n\n포항 사람들은 제철소와 함께 살아왔다. 아버지가 다니던 제철소에 아들이 들어가는 집이 많았다. 그런데 제철소 고용은 오래전부터 줄고 있었고, 전쟁 동안 잠깐 늘었던 일감도 전쟁이 끝나자 다시 줄었다."
 TFRKPHN_lg_627_b:0 "새 공장 첫 채용에 제철소에서 일했던 사람들이 많이 지원했다. 쇳물을 다루던 손이 이제 배터리 소재를 다룬다.\n\n\"고열 설비만 서른 해 했습니다. 어떤 공정 갖다 놔도 안 무섭습니다.\" 한 지원자가 면접에서 말했고, 그는 붙었다.\n\n공장 둘레에 대학과 연구소가 함께 들어섰고 포항 대학들은 배터리 학과를 새로 열었다. 시장은 준공식에서 철의 도시가 배터리의 도시가 된다고 했다. 제철소 정문 앞 국밥집 주인은 철이든 배터리든 손님만 많으면 된다고 했다. 바닷가 주민들은 폐수를 걱정했고, 시는 공장마다 폐수 처리 기록을 매달 공개하게 했다."
 TFRKPHN_lg_628_a:0 "대구경북 메가시티 4단계 공사가 끝났다.\n\n대구에 로봇과 물 산업 기업을 모아 시험장을 연다. 섬유로 컸던 도시의 업종을 바꾼다. 문 닫은 섬유 공장 부지 두 곳이 이번에 시험장과 연구동으로 바뀌었다.\n\n로봇 시험장을 가장 먼저 찾은 건 병원과 물류 회사였다. 전쟁 동안 사람이 모자라 병원 복도에서 약을 나르던 로봇이 이제 시험장에서 계단 오르는 법을 배운다. 물 산업 시험장에서는 정수 설비와 배관 기술을 시험한다. 낙동강 물을 쓰는 도시가 물 다루는 기술을 파는 도시가 되겠다는 것이다."
 TFRKPHN_lg_628_b:0 "시험장 관리 반장은 이 부지에서 섬유 공장을 다니던 사람이다. 그가 다니던 공장은 십여 년 전에 문을 닫았다.\n\n\"출근길이 하나도 안 바뀌었어요. 버스도 같고 정류장도 같고. 들어가는 문만 바뀌었네.\"\n\n시험장 둘레에 들어온 회사는 아직 열 곳 남짓이다. 시는 다음 해까지 서른 곳을 채우겠다고 했다. 대구 청년들 가운데 서울로 떠나는 사람이 조금이라도 줄어드느냐가 이 사업의 진짜 성적표다.\n\n첫해 시험장을 거쳐 간 로봇 하나는 대구의 한 요양 병원에 들어갔다. 밤마다 병실을 돌며 노인들 숨소리를 살핀다."
 TFRKPHN_lg_629_a:0 "대구경북 메가시티 5단계 공사가 끝났다.\n\n대구와 경북은 2020년 8월 새 공항 자리를 정했다. 군 공항과 민간 공항을 함께 옮겨 짓는 공항이다. 그 활주로에 첫 비행기가 내렸다.\n\n대구 옛 공항 둘레 주민들은 수십 년 동안 전투기 소음 속에서 살았다. 공항이 옮겨 가는 날 그 동네 한 노인은 처음으로 조용한 아침을 맞았다.\n\n\"할매, 이리 나와 봐라. 하늘이 조용타. 이기 무슨 일이고.\"\n\n새 공항 둘레 마을은 정반대였다. 소음과 함께 일자리와 보상금이 왔다. 공항 정문 앞에 식당과 숙박업소가 새로 문을 열었고, 마을 회관에서는 소음 보상 기준을 두고 밤늦도록 회의가 이어졌다."
 TFRKPHN_lg_629_b:0 "첫 국제선에는 구미와 포항 공장에서 일하는 외국인 기술자들이 많이 탔다. 그들은 지금까지 인천이나 김해까지 가서 비행기를 탔다. 대구 옛 공항 부지에 뭘 지을지를 두고는 벌써 계획안이 세 개나 올라왔다.\n\n공군은 새 기지로 옮긴 첫날 비행대대 전원이 활주로에 도열해 지역 주민들에게 인사했다. 같은 날 대구 시내 옛 공항 정문에는 마지막 경비병이 섰다. 그는 오후에 철문을 닫고 새 기지로 떠났다."
 TFRKPHN_lg_630_a:0 "부울경 메가시티 1단계 공사가 끝났다.\n\n부산과 울산, 창원을 한 시간 안에 잇는 철길이다. 세 도시가 한 일터가 된다. 지금까지 세 도시를 오가려면 막히는 고속도로를 한참 달리거나 열차를 여러 번 갈아타야 했다.\n\n첫 열차에 창원에 살며 울산 조선소로 출근하는 용접공이 탔다. 그는 열 해 동안 새벽 다섯 시에 집을 나서 통근 버스를 탔다. 오늘은 여섯 시에 일어났다.\n\n\"한 시간 더 잤어요. 열 해 만에. 마누라가 놀라서 깨우더라고요, 늦었다고.\"\n\n세 도시 시장은 개통식에서 같은 기차를 타고 노선 끝까지 달렸다. 기차 안에서 다음 단계 공사 순서를 두고 의견을 나눴고, 기자들은 세 사람이 처음으로 한 칸에 오래 앉아 있었다고 썼다.\n\n역마다 상가 분양 현수막이 걸렸다. 부산의 한 부동산 중개소 사장은 울산과 창원 사람들이 부산 집을 보러 오고, 거꾸로 부산 사람들은 싼 쪽으로 이사를 알아본다고 했다. 세 도시를 한 생활권으로 묶을 버스와 지하철 요금 통합은 아직 협상 중이다. 시장들은 그 얘기만 나오면 서로 창밖을 봤다."
 TFRKPHN_lg_631_a:0 "부울경 메가시티 2단계 공사가 끝났다.\n\n낡은 부두를 걷어 내고 바다를 도시에 돌려준다. 오래 끌어 온 공사를 이번에 끝낸다.\n\n부산은 이 나라 두 번째 도시이고 가장 큰 항구다. 전쟁 때는 임시 수도가 되어 전국에서 밀려온 피난민을 받아들였다. 그 뒤로 바다를 통해 나라 밖과 물건을 주고받으며 세계적인 물류 거점으로 컸다. 그 항구에서 가장 오래된 부두 자리가 이번에 시민에게 돌아갔다."
 TFRKPHN_lg_631_b:0 "개장 첫날 저녁 새 친수 공원 바닷가 계단에 사람들이 앉아 해 지는 걸 봤다. 수십 년 동안 철망과 컨테이너 뒤에 가려 있던 바다였다.\n\n\"내가 여기서 이십 년 짐을 날랐는데, 바다를 이래 본 건 처음이다.\" 하역 일을 했던 노인이 말했다.\n\n공원 한쪽에 피란 시절 이 부두에 내렸던 사람들의 사진이 걸렸다. 한 할머니는 그 앞에서 어릴 적 어머니 손을 잡고 배에서 내리던 이야기를 손주에게 들려주었다.\n\n북항 둘레 상인들은 손님이 늘 거라 기대했다. 그사이 바다가 보이는 땅값은 벌써 크게 뛰었다. 부산시는 공원 앞 땅 일부에 공공 임대 상가를 짓기로 했다."
 TFRKPHN_lg_632_a:0 "부울경 메가시티 3단계 공사가 끝났다.\n\n울산 앞바다에 풍력 단지를 띄우고 그 전기로 수소를 만든다. 조선소와 자동차 공장이 그 수소를 쓴다.\n\n울산은 이 나라가 공업을 처음 배운 곳이다. 1962년 1월 27일 특정공업지구로 지정됐고 이레 뒤 공업센터 기공식이 열렸다. 1964년 4월 첫 정유공장이 돌았고, 1972년에는 나라에서 처음으로 나프타 분해 시설을 가동했다. 그 뒤로 자동차와 조선이 들어와 주력이 됐고 1997년 광역시가 됐다. 예순 해 넘게 기름으로 큰 이 도시에 이번에는 수소 설비가 들어선다."
 TFRKPHN_lg_632_b:0 "먼바다에 뜬 풍력 발전기들은 맑은 날이면 울산 시내에서도 보였다. 첫 전기로 만든 수소가 조선소 수소 연료 선박 시험장으로 들어갔고, 그 배가 처음 물 위를 미끄러지자 기술자들이 손뼉을 쳤다.\n\n정유 공장 노동자들은 이 변화를 복잡한 마음으로 봤다.\n\n\"수소 늘면 기름 줄고, 기름 줄면 우리 자리 주는 거 아이가.\" \"그러니까 먼저 옮겨 달라 카는 기지.\"\n\n노조는 정유 공장 노동자들을 수소 설비로 먼저 옮겨 달라고 요구했고, 시는 그 요구를 받아 전환 교육 과정을 열었다. 어민들은 풍력 단지 때문에 어장이 줄었다며 보상을 요구했고 협상은 아직 끝나지 않았다."
 TFRKPHN_lg_633_a:0 "부울경 메가시티 4단계 공사가 끝났다.\n\n전쟁 동안 밤낮으로 돌던 창원 공장들을 평시 체제로 바꾼다. 남는 방산 설비로는 수출 물량을 만든다. 공단 야간 조명이 전쟁 끝나고 처음으로 꺼졌다.\n\n창원 방산 공장들은 전쟁 내내 자주포와 전차 부품, 탄약을 쉬지 않고 찍어 냈다. 노동자들은 세 교대로 일했고 공단 앞 식당들은 새벽에도 문을 열었다. 이제 그 공장들이 두 교대로 돌고, 남는 설비로 해외에 팔 전차와 자주포를 만든다."
 TFRKPHN_lg_633_b:0 "야간 교대가 없어진 첫날, 한 공장 노동자는 두 해 만에 아이들과 저녁을 먹었다. 식탁에서야 아이들이 그동안 얼마나 컸는지 알았다. 같은 날 야간 수당이 빠진 월급 명세서를 받아 든 동료들은 한숨을 쉬었다.\n\n공단 앞 식당들은 새벽 영업을 접었다.\n\n\"전쟁 때가 장사는 잘됐지. 아니, 아이다. 그런 말 하믄 안 되제. 미안타.\" 한 식당 주인이 말하다 말고 고개를 저었다.\n\n한 해 뒤 첫 수출 전차가 창원 부두에서 배에 실렸다. 그 전차를 만든 라인 노동자들이 부두에 나와 배가 안 보일 때까지 지켜봤다."
 TFRKPHN_lg_634_a:0 "부울경 메가시티 5단계 공사가 끝났다.\n\n2021년 2월 26일 국회는 가덕도에 공항을 짓는 특별법을 통과시켰다. 바다 위 활주로 공사를 끝내고 첫 비행기를 띄운다. 섬과 바다를 메워 만든 활주로에 첫 여객기가 내렸다.\n\n부산 사람들은 이 공항을 오래 기다렸다. 해외로 나가려면 인천까지 올라가야 했던 날들이 길었다. 첫 국제선 탑승구 앞에 부산과 경남에서 온 가족 여행객들이 줄을 섰다.\n\n\"이제 애들 방학마다 새벽 기차 안 타도 된다. 니 아빠가 그거 십 년 했다.\" 한 아버지가 아이 머리를 쓰다듬었다."
 TFRKPHN_lg_634_b:0 "공사 동안 가덕도 어민들은 바다를 내주었다. 그중 일부는 공항 근처 수산물 시장으로 자리를 옮겼다.\n\n\"바다는 잃었고 손님은 얻었지. 그래 쓰소.\" 개항식에서 한 어민이 기자에게 말했는데, 그 말을 할 때 그는 웃지 않았다.\n\n화물 터미널에 부울경 공장에서 만든 부품과 수산물이 첫 화물로 실렸다. 김해공항 국제선은 차례로 이곳으로 옮겨 온다. 공항 이름을 두고는 아직 말이 많다. 부산은 부산을, 경남은 경남을 넣자고 한다. 개항 첫 달 승객이 계획보다 많아서 부산시는 공항 철도 배차 간격을 줄이기로 했다."
 TFRKPHN_lg_640_a:0 "취임 이틀째, 대통령실이 첫 인선을 한꺼번에 내놓았다.\n\n비서실장은 강철원이다. 2000년 대통령이 처음 국회의원이 됐을 때부터 곁을 지킨 보좌관이다.\n대변인은 김병민이다. 스물여덟 살에 서초구의원이 됐고 서울시 정무부시장을 지냈다.\n정무수석은 오신환이다. 관악을에서 두 번 당선된 전직 의원이고 원내대표를 해 봤다.\n산업통상자원부 장관은 고동진이다. 평사원으로 들어가 삼성전자 사장까지 오른 사람이다.\n통일부 장관은 김근식이다. 진보와 보수 양쪽 정부의 대북 정책을 다 지켜본 북한학자다.\n국방부 장관은 바꾸지 않았다. 전쟁을 치른 임종득이 그대로 남아 군을 평시로 되돌린다."
 TFRKPHN_lg_640_b:0 "국무총리 자리만 비었다. 서초구청장을 두 번 지낸 조은희와 한국개발연구원 출신 경제학자 윤희숙, 두 이름을 두고 여의도에 하마평이 돌았다.\n\n발표가 끝난 오후 대통령실 복도는 명함 주고받는 소리로 시끄러웠다. 서울시청에서 넘어온 사람, 국회에서 온 사람, 기업에서 온 사람이 처음 얼굴을 익혔다.\n\n비서실장은 첫 주엔 서로 이름부터 외우라고 했다. 이름 틀리면 그 사람 서류도 틀린다는 것이었다."
 TFRKPHN_lg_641_a:0 "지방선거가 석 달 앞으로 다가왔다. 서울시청은 세 해 전 보궐선거에서 이긴 정원오 시장이 지키고 있다.\n\n여당에서는 김병민이 나선다. 스물여덟 살에 서초구의원이 됐고, 대통령이 시장이던 때 정무부시장으로 곁에 있었으며, 이 정부에서는 대변인으로 세 해 동안 대통령의 말을 전했다. 2020년 총선 때는 광진갑에 나갔다가 졌다.\n\n현직 시장을 상대하는 선거는 쉽지 않다. 그래도 대통령을 가장 세게 밀어 온 동남권 당원들이 대통령 사람이 나서자 다시 모였다."
 TFRKPHN_lg_641_b:0 "선거 사무소는 시청에서 멀지 않은 낡은 건물 이층에 차려졌다. 첫 회의에 세 해 전 보궐선거에서 졌던 캠프 실무자들이 여럿 다시 나왔다. 그들은 그때 구별 득표표를 벽에 붙이고 진 구마다 빨간 펜으로 동그라미를 쳤는데, 동그라미가 강북에 몰렸다.\n\n\"또 강북이네.\" \"그러니까 이번엔 강북부터 갑시다.\"\n\n여론조사 첫 숫자는 여당 쪽이 뒤져 있었다. 첫 유세는 대통령이 시장 시절 자주 찾던 동남권 전통시장에서 열렸고, 상인 몇은 후보를 보자 대통령 안부부터 물었다."
 TFRKPHN_lg_643_a:0 "개표가 끝났다. 여당 [GetTFRKPHNSdCand] 후보가 서울시장에 당선됐다. 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었다.\n\n구청장은 스물다섯 곳 가운데 여당이 §R[?TFRKPHN_sd_won|0]§!곳, 야당이 §B[?TFRKPHN_sd_lost|0]§!곳을 가져갔다.\n\n성동구: [GetTFRKPHNSdK13]\n서초구: [GetTFRKPHNSdK23]\n용산구: [GetTFRKPHNSdK16]\n중구: [GetTFRKPHNSdK12]\n강북구: [GetTFRKPHNSdK2]\n성북구: [GetTFRKPHNSdK5]"
 TFRKPHN_lg_643_b:0 "자정 무렵 강북 몇 개 구가 뒤집히자 개표 상황실에서 환호가 터졌다. 세 해 전 보궐선거에서 졌던 실무자 몇이 그 화면을 휴대전화로 찍었다. 그때 진 구마다 쳐 두었던 빨간 동그라미 위에 이번에는 체크 표시를 그렸다.\n\n\"선배, 이거 액자에 넣어요.\" \"넣긴 뭘 넣어. 네 해 뒤에 또 쓸 거다.\"\n\n서울은 앞으로 네 해 동안 여당 시장이 맡는다. 대통령실은 다음 날 아침 시청과 첫 정책 협의 날짜를 잡았다.\n\n상황실 한쪽 화이트보드에 구청장 당선자 이름이 하나씩 적혔다. 칸이 모자라 마지막 몇 이름은 종이에 적어 붙였다. 처음 선거에 나온 당선자도 여럿이었는데, 그들은 새벽 늦게 상황실에 들러 새 시장과 사진을 찍었다. 다음 날 아침 서울시 홈페이지 첫 화면이 바뀌었다."
 TFRKPHN_lg_644_a:0 "개표가 끝났다. 서울시장은 야당 정원오 후보에게 돌아갔다. 여당 [GetTFRKPHNSdCand] 후보는 졌고 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었다.\n\n구청장은 스물다섯 곳 가운데 여당이 §R[?TFRKPHN_sd_won|0]§!곳, 야당이 §B[?TFRKPHN_sd_lost|0]§!곳을 가져갔다.\n\n성동구: [GetTFRKPHNSdK13]\n서초구: [GetTFRKPHNSdK23]\n용산구: [GetTFRKPHNSdK16]\n중구: [GetTFRKPHNSdK12]\n강북구: [GetTFRKPHNSdK2]\n성북구: [GetTFRKPHNSdK5]"
 TFRKPHN_lg_644_b:0 "선거 사무소 불은 자정 전에 꺼졌다. 실무자들이 벽에 붙여 둔 구별 득표표를 떼어 상자에 넣었다. 빨간 동그라미는 세 해 전보다 늘어 있었다.\n\n\"이번에도 강북이었네.\" 상자를 든 실무자 하나가 짧게 말하고 나갔다.\n\n서울은 앞으로 네 해 동안 야당 시장이 맡는다. 남은 임기 동안 서울 일은 그와 마주 앉아 풀어야 한다.\n\n새벽에 낙선한 구청장 후보 몇이 서울시당 사무실에 모였다. 서로 득표율을 확인하며 한참 말이 없었다. 몇백 표 차로 진 사람도 있었다.\n\n\"네 해 동안 매주 그 동네 시장을 돌겠습니다. 장 보러 가는 것처럼.\"\n\n한 사람이 그렇게 말하자 시당 위원장이 그 말을 회의록에 적어 두라고 했다."
 TFRKPHN_lg_651_a:0 "대통령이 비우고 나온 서울시장 자리를 채울 보궐선거가 4월 7일로 잡혔다. 취임 한 달 만에 치르는 선거라 따뜻한 보수를 내건 새 정부가 받는 첫 성적표다.\n\n[GetTFRKPHNByNaPara]\n\n다른 한 사람은 [GetTFRKPHNByOther]이다. 총리 후보로 대통령 책상에 올랐던 사람이고 대통령과 오래 일했다. 이 사람이 시장이 되면 시청과 대통령실이 한 몸처럼 움직인다."
 TFRKPHN_lg_651_b:0 "시청은 넉 달째 권한대행이 이끌고 있었다. 대통령이 시장 시절 벌인 사업들은 그대로 돌아갔지만 새 결정은 하나도 나오지 않았다. 직원들은 다음 시장이 누구냐에 따라 자기 부서 사업이 살고 죽는다는 걸 알았다. 점심마다 구내식당에서는 후보 얘기만 오갔다.\n\n공천관리위원장이 대통령실에 뜻을 물었다. 대통령은 서울은 서울 사람이 고르게 하자고 하면서도, 이 선거 결과는 결국 정부 성적이라고 했다.\n\n후보 등록 마감을 열흘 앞두고 서울시당 사무실 전화가 쉬지 않고 울렸다.\n\n\"그래서 누가 나와요?\" \"아직 모릅니다.\" \"아니 그걸 왜 몰라요?\" \"저희도 모릅니다, 정말로요.\"\n\n사무처 직원들은 그 대답을 하루에 백 번 넘게 했다. 후보 등록은 다음 주 월요일 마감이다."
 TFRKPHN_lg_652_a:0 "야당이 서울시장 보궐선거 후보로 정원오를 세웠다.\n\n그는 성동구청장을 세 번 했다. 2022년 지방선거에서 여당이 한강을 낀 구를 거의 다 이겼을 때도 성동만은 그가 57.60으로 지켰다. 같은 날 같은 성동에서 오세훈 시장이 60.90을 얻었으니, 시장은 오세훈을 찍고 구청장은 정원오를 찍은 사람이 그만큼 많았다.\n\n당이 달라도 표를 받는 사람이 상대로 나왔다. 여당은 그가 대통령의 옛 지지자들을 얼마나 데려갈지 걱정해야 한다.\n\n그의 출정식은 성수동의 오래된 공장 건물에서 열렸다. 지금은 붉은 벽돌 그대로 카페와 작은 사무실이 들어선 곳이다. 출정식에 온 사람 가운데 그 거리에서 장사를 시작한 젊은 사장이 많았고 앞치마 차림으로 온 사람도 있었다.\n\n\"저 사람들 절반은 지난번에 우리 시장 찍었을 겁니다.\" 여당 캠프 실무자 하나가 영상을 보며 중얼거렸다.\n\n서울시당은 그날 밤 성동과 광진, 동대문 당원 협의회장들을 급히 불렀다. 회의는 자정을 넘겼고, 협의회장들은 지도를 펴 놓고 성동 표를 어디서 메울지 동마다 이름을 적어 나갔다."
 TFRKPHN_lg_653_a:0 "개표가 끝났다. 여당 [GetTFRKPHNSdCand] 후보가 서울시장 보궐선거에서 이겼다. 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었다.\n\n취임 한 달 만에 치른 첫 선거에서 서울이 새 정부 방향을 받아들였다. 대통령이 떠난 자리를 여당이 지켰고, 새 시장은 2030년 6월까지 남은 임기를 맡는다. 정원오 후보는 결과를 받아들인다고 했다."
 TFRKPHN_lg_653_b:0 "당선이 확정된 새벽, 넉 달 만에 시장실 불이 다시 켜지는 걸 보려고 시청 앞 광장에 사람 몇이 모였다. 권한대행을 맡았던 행정1부시장은 아침 일찍 시장실 책상을 정리했다. 서랍에 대통령이 시장 시절 남긴 메모 몇 장이 있었다. 그는 그걸 버리지 않고 새 시장에게 넘기기로 했다.\n\n대통령은 다음 날 새 시장에게 전화를 걸었다.\n\n\"서울 맡겨서 마음 놓입니다. 그 메모 봤어요? 내 글씨 못 알아보겠으면 전화해요.\"\n\n그 주말 대통령은 예정에 없이 시청 근처 식당에서 새 시장과 점심을 먹었다. 두 사람이 식당 주인과 찍은 사진은 그 주에 식당 벽에 걸렸다."
 TFRKPHN_lg_654_a:0 "개표가 끝났다. 서울시장 보궐선거는 야당 정원오 후보가 이겼다. 여당 [GetTFRKPHNSdCand] 후보는 졌고 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었다.\n\n대통령이 시장으로 일하던 시청이 취임 한 달 만에 야당으로 넘어갔다. 새 시장은 2030년 6월까지 남은 임기를 맡는다. 서울 일은 이제 야당 시장과 마주 앉아 풀어야 하고, 모두와 함께 가겠다던 약속도 시청에서부터 지켜야 한다."
 TFRKPHN_lg_654_b:0 "여당 안에서 책임론이 곧바로 터졌다. 후보를 늦게 정했다는 말, 대통령 사람을 안 세워서 졌다는 말, 거꾸로 대통령 사람을 세워서 졌다는 말이 같은 날 나왔다. 원내대표는 의원총회에서 지금은 남 탓할 때가 아니라고 했다.\n\n시청 직원들은 새 시장 맞을 준비를 했다. 대통령이 시장 시절 벌인 사업 목록을 꺼내 보고할 순서를 정했다.\n\n대통령은 다음 날 아침 새 시장에게 축하 전화를 걸었다. 통화는 삼 분 남짓이었다.\n\n\"서울시가 정부에 바라는 거, 먼저 말씀해 주세요.\" \"첫 협의 자리에서 말씀드리겠습니다. 목록이 깁니다.\""
 TFRKPHN_lg_655_a:0 "지방선거가 석 달 앞으로 다가왔다. 2027년 보궐선거에서 당선된 [GetTFRKPHNSdCand] 시장이 다시 나서겠다고 밝혔다.\n\n보궐선거로 들어온 시장은 남은 임기만 채운다. 이번은 세 해 동안 한 일을 들고 처음으로 온전한 네 해를 달라고 하는 선거다. 당 안에서 맞서겠다는 사람은 없었다. 야당에서는 정원오가 다시 나온다. 세 해 전 졌던 사람이 같은 상대와 한 번 더 붙는다."
 TFRKPHN_lg_655_b:0 "두 캠프 모두 세 해 전 선거를 다시 펼쳤다. 그때 몇 표 차로 갈렸던 구가 어디인지, 그 구에서 세 해 동안 뭐가 달라졌는지 표로 만들었다. 현직 캠프 표에는 세 해 동안 끝낸 공사 목록이, 도전자 캠프 표에는 세 해 동안 오른 월세가 적혔다.\n\n첫 여론조사에서 두 사람은 거의 붙어 있었다. 이번에도 강북에서 갈린다.\n\n현직 시장은 세 해 전 처음 찾았던 강북 경로당에서 출마를 선언했다. 그 경로당은 그사이 지붕을 새로 고쳤다. 노인들은 그날 국수를 삶아 기자들에게도 한 그릇씩 돌렸다.\n\n\"지붕이 안 새니께 표도 안 샐 거여. 많이 묵어.\" 경로당 회장이 국자를 들고 웃었다."
 TFRKPHN_lg_656_a:0 "보궐선거가 열흘 앞이다. 토론회에서 정원오 후보가 정몽준 후보에게 물었다. 마지막으로 선거를 치른 게 2014년인데 그사이 서울이 어떻게 달라졌는지 아느냐는 질문이었다.\n\n후보는 막힘없이 답했다. 그런데 다음 날 기사 제목에는 답은 없고 질문만 실렸다. 강북 젊은 유권자들 사이에서는 여당이 새 사람을 못 냈다는 말이 돌았다.\n\n토론 다음 날 아침 캠프 상황실에서 긴급 회의가 열렸다.\n\n\"후보님이 직접 원룸촌을 도셔야 합니다. 청년 주택도요.\" \"경험을 앞세워야지. 그게 우리 장점인데 왜 버려.\"\n\n젊은 실무자들과 원로 참모들은 두 시간을 싸우고도 결론을 못 냈다.\n\n그날 오후 후보는 예정에 없이 노원구의 한 청년 주택을 찾았다. 기자 몇이 숨을 헐떡이며 따라붙었고, 후보가 원룸 바닥에 앉아 청년들과 얘기하는 사진이 저녁 뉴스에 나왔다. 이름값으로 얻은 표가 강북에서 조금씩 빠지던 참이었다.\n\n그날 밤 상황실은 다음 날 일정을 다시 짰다. 원룸촌 세 곳과 대학가 두 곳이 새로 들어갔다. 투표일까지 열흘이 남았다."
 TFRKPHN_lg_658_a:0 "보궐선거에서 이긴 새 시장의 첫 결재는 재개발과 재건축 구역 지정안이었다. 선거 때 구마다 돌며 한 약속이다.\n\n서울시가 길을 트자 다른 시도도 같은 기준을 받아들였다. 묶여 있던 구역들이 한꺼번에 풀리면서 전국에서 지을 수 있는 자리가 늘었다.\n\n결재가 난 날 강북의 낡은 다세대 주택가 골목에 주민들이 모였다. 십 년 넘게 기다려 온 사람들이었다.\n\n\"이번엔 진짜여? 저번에도 된다 했잖여.\" 반지하에 사는 노인이 몇 번이고 묻자 구청 직원이 결재 서류 사본을 들어 보였다.\n\n세입자 단체는 철거가 빨라질 걸 걱정했다. 반지하 세입자 가운데에는 그 노인 같은 집주인보다 세 든 사람이 훨씬 많았다. 구역이 지정되면 집주인들이 세입자를 내보내기 시작한다. 시청 앞에서 세입자 대책도 같이 내놓으라는 작은 집회가 열렸다.\n\n도시계획국 직원들은 그 주에 밤늦게까지 남아 풀린 구역마다 심의 일정을 다시 짰다. 국장은 이번에는 약속한 날짜를 넘기지 말자고 했다. 석 달 뒤 첫 구역 착공식이 열렸고, 그 노인은 맨 앞줄에 앉아 첫 삽을 지켜봤다."
 TFRKPHN_lg_6601_a:0 "제23대 국회의원 선거가 한 달 앞으로 다가왔다. 여당은 지난 총선에서 199석을 얻었는데, 양안전쟁이 끝난 직후 치른 선거였다. 이번에는 그런 바람이 없다. 따뜻한 보수를 내건 정부가 받는 첫 성적표다.\n\n당 공천관리위원회가 대통령실에 뜻을 물어 왔다. 현역을 크게 바꿔 새 얼굴을 세우자는 쪽과 지역을 다져 온 현역을 그대로 내보내자는 쪽이 맞섰다. 물갈이 쪽은 대통령이 서울에서 같이 일한 사람들과 청년, 중도 인사를 명단에 올렸다. 현역 쪽은 전쟁 동안 지역구를 지킨 의원들을 빼면 당이 갈라진다고 버텼다."
 TFRKPHN_lg_6601_b:0 "대한민국에서 공천만큼 시끌시끌한 게 없다. 그 지역구가 당의 텃밭이면 더하다. 여기저기 기웃거려도 어디서도 공천을 못 받으면 일명 나가리다.\n\n공관위원장이 물었다.\n일단 어떻게 하실 겁니까? 현역들로 가실 겁니까, 아니면 새로운 사람들을 받아들이실 겁니까?\n\n한쪽에서는 꼭 이 사람들로 하실 거냐는 말도 나왔다. 성향, 지역, 나이에 따라 모든 게 다 변수가 된다.\n\n그날 밤 당 대표는 공천장에 찍을 당 도장을 챙겨 들고 나섰다.\n에라이 싯팔, 못 해 먹겠네. 나 찾을 거면 부산으로 오라 해라."
 TFRKPHN_lg_6603_a:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당은 지난번에 버금가는 의석을 지켰다. 전쟁 바람 없이 치른 선거에서 얻은 결과다. 출구조사가 나오자 당사에서 박수가 터졌고, 수도권 접전지 여러 곳이 자정 무렵 여당 쪽으로 넘어왔다.\n\n표를 뜯어보면 중도층이 움직였다. 스스로 중도라고 답한 유권자 절반 넘게 여당 후보를 골랐다는 출구조사가 나왔다. 상생주택 단지가 들어선 동네와 메가시티 공사가 시작된 권역에서 여당 득표율이 눈에 띄게 높았다."
 TFRKPHN_lg_6603_b:0 "야당 대표는 새벽 한 시에 패배를 인정했다. 자기들이 못해서 졌다고 했다. 그 말을 전해 들은 대통령은 참모들에게 야당이 다시 일어설 때 우리가 뭘 하고 있을지가 더 중요하다고 했다.\n\n남은 임기 동안 국회는 정부 편에 선다. 그만큼 핑계 댈 곳도 없어졌다.\n\n다음 날 국무회의에서 대통령은 선거 얘기를 꺼내지 않고 내년 주택 공급 일정을 첫 안건으로 올렸다. 장관들은 이제 그게 대통령 방식이라는 걸 알았다. 회의가 끝나고 복도에서야 그가 정무수석에게 한마디 했다.\n\n\"이길수록 낮아져야 돼요. 오늘 저녁 축하 회식 같은 거 하지 마세요.\""
 TFRKPHN_lg_6604_a:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당은 의석을 여럿 잃었지만 과반은 지켰다. 지난 총선의 199석은 전쟁 직후 숫자였고 이번이 평시 성적에 가깝다는 평가가 나왔다. 수도권에서 잃은 의석을 메가시티 사업이 진행된 권역에서 얼마간 되찾았다.\n\n서울에서는 강북 몇 개 구가 야당으로 넘어갔다. 재개발 철거가 몰린 곳들이었다. 당 안에서는 개발 속도를 늦추자는 말과 그래도 집은 지어야 한다는 말이 다시 맞붙었다."
 TFRKPHN_lg_6604_b:0 "출구조사가 나왔을 때 당사는 조용했다. 과반 언저리를 오가던 숫자가 자정을 넘겨서야 과반 위에 자리를 잡았고, 그제야 몇 사람이 손뼉을 쳤다.\n\n대통령은 다음 날 아침 낙선한 여당 후보들에게 일일이 전화를 걸었다. 통화는 점심때가 지나서야 끝났다.\n\n당 지도부는 낙선자가 많았던 강북 구들을 돌며 감사 인사를 했다. 한 낙선자가 지도부 앞에 철거 현장 사진을 내밀었다.\n\n\"우리가 진 이유, 여기 다 있습니다. 이 동네 할머니들이 제 손을 안 잡더라고요.\"\n\n지도부는 사진을 받아 들고 아무 말도 하지 못했다. 그 사진은 이튿날 당 정책위원회 회의 자료 맨 앞에 끼워졌다."
 TFRKPHN_lg_6605_a:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당이 과반을 잃었다. 지난 총선 199석에서 크게 줄었다. 서울 여러 구와 개발에서 밀려난 지역에서 표가 빠졌다. 재개발 철거가 몰린 강북, 메가시티 통합에 반대했던 군 지역에서 특히 크게 졌다.\n\n당사 불은 자정이 되기 전에 꺼졌다. 남아 있던 당직자 몇이 상황판 숫자를 지우면서 서로 말이 없었다. 낙선한 의원 몇은 그날 밤 개발을 너무 서둘렀다는 글을 올렸다."
 TFRKPHN_lg_6605_b:0 "야당은 승리를 선언하며 정부 개발 정책을 국회에서 처음부터 다시 따지겠다고 했다. 안심소득과 서울런처럼 야당도 찬성해 온 사업은 남기되 재개발 속도와 층수 규제는 손보겠다는 것이다.\n\n남은 임기 동안 예산과 법안은 야당과 마주 앉아야 통과된다. 대통령은 다음 날 야당 대표에게 먼저 만나자고 전화를 걸었다.\n\n정부 안에서도 책임론이 나왔다. 국토부 장관이 먼저 사의를 밝혔는데 대통령은 사표를 받지 않았다.\n\n\"지금 사람 바꾸면 공사가 멈춥니다. 책임은 공사 끝내는 걸로 지세요.\"\n\n언론은 그 결정을 고집이라고 썼고 대통령실은 책임이라고 답했다."
 TFRKPHN_lg_6606_a:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당 혼자 200석을 넘겼다. 국회 재적 3분의 2, 헌법을 고칠 수 있는 숫자다. 지난 총선 199석은 전쟁 직후 바람이 만든 숫자였는데 이번에는 바람 없이 그 선을 넘었다.\n\n서울 스물다섯 구가 거의 한 색으로 칠해졌고 메가시티 사업이 들어선 권역에서도 여당 후보가 잇달아 이겼다. 출구조사가 뜬 순간 당사에서는 환호보다 탄성이 먼저 터졌다.\n\n\"저거 진짜야? 기계 고장 아니야?\" 상황실 벽 지도에는 파란 칸이 하나도 안 남은 광역시와 도가 셋이었다."
 TFRKPHN_lg_6606_b:0 "대통령은 자정 무렵 당사에 들러 짧게 인사만 하고 돌아갔다. 다음 날 아침 그가 수석들에게 말했다.\n\n\"이 숫자가 오히려 무섭습니다. 이긴 쪽이 뭐든 할 수 있다고 믿는 순간 다음 선거는 집니다.\"\n\n같은 날 오후 야당 대표가 사퇴를 발표했다. 그는 마지막 회견에서 이제 견제는 국민 몫이 됐다고 했고, 그 말은 이튿날 여러 신문 사설 제목이 됐다. 개헌 얘기는 당 안에서 먼저 나왔다. 대통령실은 그 주 내내 그 말에 답하지 않았다."
 TFRKPHN_lg_6611_a:0 "재개발 구역에서 철거를 막는 농성이 시작됐다. 세입자들과 작은 가게 주인들이다. 집주인들은 조합을 꾸려 새 아파트를 받지만 세 들어 살던 사람들은 이사 비용만 받고 떠나야 한다.\n\n농성장에 이 동네에서 서른 해 장사했다는 현수막이 걸렸다. 국숫집 주인은 가게 안에 이불을 깔고 잤고 세탁소 주인은 밤마다 다리미를 켜 둔 채 문을 지켰다. 철거 용역들이 처음 온 날 동네 노인들이 골목 입구에 의자를 놓고 앉았다.\n\n\"우리 늙은이들 밟고 지나가 봐라. 어디 한번.\""
 TFRKPHN_lg_6611_b:0 "건설사는 공사가 하루 밀릴 때마다 드는 돈을 계산해 구청에 보냈다. 조합원들은 농성 때문에 분담금이 오른다며 세입자들을 원망했다. 한 동네 살던 사람들이 이제 서로 다른 쪽에 섰다.\n\n정부 재개발 사업은 다섯 구역 가운데 두 곳을 넘겼다. 남은 세 구역에서도 같은 일이 벌어진다. 국토부는 보상을 올리면 다른 구역도 같은 요구를 할 거라고 했고, 복지부는 그래도 사람을 거리로 내몰 수는 없다고 했다.\n\n농성 사흘째, 국숫집 주인이 가게 앞에 솥을 내다 걸었다.\n\n\"용역 양반들도 와서 드쇼. 배는 고플 거 아니요. 국수는 국수고 철거는 철거지.\"\n\n그는 철거 용역들에게도 농성하는 이웃들에게도 같은 국수를 말아 주었다. 그날 저녁 뉴스가 그 장면을 길게 내보냈다."
 TFRKPHN_lg_6612_a:0 "지방 시장과 도지사들이 한목소리로 성명을 냈다. 메가시티 사업이 수도권만 앞서 나간다는 것이다. 수도권은 벌써 세 단계를 올렸는데 다른 권역은 첫 삽을 겨우 떴다고 했다.\n\n성명에는 여당 소속 단체장들도 이름을 올렸다. 지방 신문들은 일제히 일 면에 수도권과 지방 사업 진행표를 나란히 실었다. 한 신문은 그 표 아래 서울에서 일하는 정부가 서울만 본다는 제목을 달았다.\n\n숫자는 정부에도 불편했다. 수도권 권역에 들어간 예산이 다른 권역을 다 합친 것보다 많았다. 국토부는 수도권은 원래 계획이 오래 준비돼 있어서 빨리 나갔을 뿐이라고 설명했다.\n\n\"그 말, 십 년째 듣습니다. 토씨 하나 안 바뀌었어요.\" 한 도지사가 받아쳤다."
 TFRKPHN_lg_6612_b:0 "부산의 한 시의원은 기자회견에서 광역철도 노선도를 찢어 보였다. 그 장면이 그날 저녁 뉴스 첫 화면에 걸렸다. 다음 해 예산안을 짜는 기획재정부 회의실에서는 지방 권역 예산을 얼마나 앞당길지 두고 늦게까지 계산기가 돌았다.\n\n충청과 호남, 영남 단체장들은 다음 달 함께 국회를 찾아가기로 날을 잡았다. 여당 소속 단체장 하나는 이름을 빼 달라는 당 연락을 받고도 성명에서 이름을 지우지 않았다."
 TFRKPHN_lg_6613_a:0 "메가시티로 묶이는 권역의 한 군에서 통합 반대 서명이 주민 절반을 넘겼다. 큰 도시에 합쳐지면 군청이 없어지고 예산도 도시 쪽으로 쏠린다는 걱정이다.\n\n군의회는 만장일치로 반대 결의안을 냈다. 광역철도 노선도에서 이 군을 지나는 역이 하나뿐이라는 것도 불만을 키웠다. 그 역마저 읍내에서 차로 이십 분 걸리는 들판 한가운데에 찍혀 있었다.\n\n군청 앞에 통합 반대 천막이 섰다. 천막을 지키는 사람은 대부분 일흔 넘은 노인들이었다.\n\n\"아들 손자 다 도시로 가삐고, 인자 군 이름까지 가져간다꼬?\"\n\n반대로 읍내 젊은 상인들 가운데에는 통합이 돼야 손님이 는다며 찬성 서명을 받는 사람도 있었다."
 TFRKPHN_lg_6613_b:0 "법은 이미 통합을 정해 두었다. 행정안전부는 주민 반대가 절반을 넘는 곳이 이 군 말고도 여럿이라고 보고했다. 한 곳에서 물러서면 다른 곳들도 같은 길을 따라온다.\n\n군수가 서울로 올라와 행정안전부 장관을 만났다.\n\n\"통합 반대 안 합니다. 군청 하나만 남겨 주이소. 노인네들 서류 떼러 도시까지 못 갑니다.\"\n\n장관은 그 자리에서 답하지 않았다. 군수가 돌아가는 기차 안에서, 천막의 노인들은 뭘 받아 왔느냐고 묻는 전화를 수십 통 걸었다."
 TFRKPHN_lg_6614_a:0 "망명 기업이 자리 잡은 동네 집값과 월세가 한 해 사이에 크게 뛰었다. 연봉 높은 직원들이 한꺼번에 집을 구했기 때문이다.\n\n원래 살던 세입자들이 재계약을 못 하고 밀려났다. 부동산 중개소 유리창에 영어 매물 안내가 붙었고, 동네 주민 모임은 구청 앞에서 집회를 열었다.\n\n\"한 번에 절반 올렸어요, 절반! 계약서 보세요.\" 한 대학원생이 계약서를 흔들었다.\n\n동네에는 다른 얼굴도 있었다. 망명 기업 직원들이 몰리면서 식당과 세탁소 매출이 늘었다. 오래된 미용실 주인은 처음으로 영어 간판을 달았다며 웃었고, 집주인들은 대부분 이 변화를 반겼다."
 TFRKPHN_lg_6614_b:0 "구청장은 같은 동네의 두 얼굴 사이에 끼었다. 공공주택을 지으려면 땅이 필요한데 그 땅값도 이미 올랐다. 국토부는 망명 기업 특별법으로 들어온 회사들에게 직원 숙소를 직접 짓게 하는 방안도 검토한다고 했다.\n\n구청 앞 집회에 망명 기업 외국인 직원 몇도 나와 섰다. 그들은 서툰 한국어로 우리도 이웃이 되고 싶어요라고 적은 종이를 들고 있었다. 주민 모임 대표가 그 종이를 받아 들고 한참 웃었다.\n\n\"맞춤법은 틀렸는데, 뭔 말인지는 알겠네.\""
 TFRKPHN_lg_6615_a:0 "강북 여러 구에서 주민들이 날마다 구청 앞에 모인다. 개발이 한강 남쪽에만 몰린다는 것이다. 강남과 강북의 격차는 정부가 출범했을 때보다 더 벌어졌다.\n\n집회에는 여당을 찍었다는 사람들도 나왔다. 한 참가자는 약자와의 동행이라는 말을 선거 때 분명히 들었다며 손팻말에 그 말을 그대로 적어 왔다.\n\n숫자도 그들 편이었다. 층수 규제를 푼 뒤 재건축 계획을 낸 단지는 대부분 강남과 한강변에 몰려 있었다. 강북 오래된 다세대 주택가에는 계획을 낼 조합조차 꾸려지지 않았다. 집을 고칠 돈이 있는 사람과 없는 사람의 차이가 그대로 동네의 차이가 됐다."
 TFRKPHN_lg_6615_b:0 "서울시 공무원 하나가 강북은 땅이 잘게 쪼개져 있어 큰 단지를 짓기 어렵다고 설명했다. 듣던 주민이 되물었다.\n\n\"그래서 모아주택이라는 거 만든 거 아니었어요? 시장님이 직접 들고 나왔던 거.\"\n\n대통령이 서울시장 때 내놓았던 사업 이름이었다. 그날 밤 대통령실 정책실은 강북 개발 예산을 따로 세우면 어디서 돈을 끌어와야 하는지 계산한 표를 올렸다. 표 맨 아래 칸에 메가시티 수도권 권역의 다음 해 예산이 적혀 있었다."
 TFRKPHN_lg_6621_a:0 "광역시 다섯 곳에서 안심소득 시범 사업이 시작됐다. 서울에서 800가구로 하던 실험이 도시마다 수천 가구로 커졌다. 받는 가구와 안 받는 가구를 나란히 놓고 일자리와 소비, 건강이 어떻게 달라지는지 지켜본다. 일하면 지원이 끊기는 지금 제도와 달리 벌이가 늘어도 지원이 조금씩만 줄어드는 게 핵심이다.\n\n대구의 한 주민센터는 첫 상담일에 줄이 건물 밖까지 늘어섰다. 맨 앞에 공사장 일용직으로 일하는 쉰 살 남자가 섰다. 일을 더 하면 지원이 끊길까 봐 일감을 일부러 줄여 왔다고 했다.\n\n\"그라믄 일 더 해도 안 끊긴다는 기지요? 진짜로?\" 상담 직원이 설명할 때마다 그는 같은 질문을 했고, 그렇게 세 번을 물었다.\n\n시범 가구는 추첨으로 뽑았다. 떨어진 가구들은 비교군이 되어 같은 설문에 답한다. 몇몇은 왜 우리는 안 주고 묻기만 하느냐며 화를 냈다. 연구진은 그 사람들 답이 있어야 이 제도가 맞는지 알 수 있다고 달랬다.\n\n첫 결과는 한 해 뒤에 나온다. 기획재정부는 그 결과를 보기 전까지 전국 확대 예산을 잡지 않기로 했다."
 TFRKPHN_lg_6622_a:0 "기준 중위소득 절반에 못 미치는 가구가 전국 어디서나 안심소득을 받게 됐다. 첫 지급일에 주민센터 창구마다 줄이 생겼다.\n\n기초생활보장 제도에서 빠져 있던 사람들이 많이 들어왔다. 재산이나 부양가족 기준에 걸려 아무 지원도 못 받던 가구들이다. 연락 끊긴 아들이 서류 위에 살아 있다는 이유로 못 받던 노인, 시골에 낡은 집 한 채 있다는 이유로 빠졌던 부부 같은 사람들이었다."
 TFRKPHN_lg_6622_b:0 "전라남도의 한 면사무소에서는 담당 공무원이 직접 마을을 돌며 신청서를 받았다. 글을 모르는 노인이 많아서 그는 마을 회관에 앉아 하루 동안 신청서 마흔 장을 대신 써 주었다.\n\n첫 지급이 이뤄진 날 밤 한 노인이 면사무소로 전화를 걸었다.\n\n\"여보시오, 통장에 돈이 들어왔는디 이거 잘못 넣은 거 아니여? 나중에 도로 가져가믄 나 못 갚어.\" \"어르신, 이제야 들어온 겁니다. 늦어서 죄송해요.\"\n\n예산 당국은 내년 예산안에서 다른 사업을 줄여야 한다는 보고서를 냈다. 그 공무원은 다음 날 아침 면사무소 게시판에 그 노인의 말을 이름 없이 적어 붙였고, 동료들은 그 쪽지를 오래 떼지 않았다."
 TFRKPHN_lg_6623_a:0 "안심소득이 기준 중위소득 85 이하 모든 가구로 넓어졌다. 서울 한 곳에서 800가구로 시작한 실험이 나라의 제도가 됐다.\n\n국회 예산 심사는 길었다. 야당은 돈이 너무 든다고 했고 여당 안에서도 같은 말이 나왔다. 논쟁을 끝낸 건 시범 사업 결과표였다. 받은 가구 근로소득은 줄지 않았고, 일자리를 새로 찾은 가구는 안 받은 가구보다 조금 많았다.\n\n표결이 끝난 날 국회 앞에 시범 사업에 참여했던 가구들이 모였다. 한 어머니는 지원금으로 아이를 학원에 보내고 자기는 야간 대학에 다녔다고 했다.\n\n\"저 이번에 졸업해요. 마흔셋에. 애가 졸업식 온대요.\" 그의 손에 졸업식 초대장이 들려 있었다."
 TFRKPHN_lg_6623_b:0 "반대도 그치지 않았다. 경제 단체들은 일할 의욕이 떨어진다는 성명을 냈고 일부 보수 언론은 결국 현금 복지라고 썼다. 정부는 해마다 결과를 다시 재서 공개하겠다고 약속했다.\n\n그날부로 주민센터 창구 안내문에서 시범 사업이라는 글자가 지워졌다. 저녁에 복지부 장관이 서울시 안심소득을 처음 설계했던 연구원들에게 전화를 걸었다.\n\n\"고맙습니다. 여러분 덕입니다.\" \"장관님, 저 은퇴했어요. 손주 보고 있습니다.\" \"그래도요.\""
 TFRKPHN_lg_6624_a:0 "생계급여와 근로장려금을 비롯해 안심소득과 겹치던 현금 지원이 하나로 묶였다. 신청 서류가 한 장으로 줄었다.\n\n지금까지는 받을 수 있는 지원이 있어도 몰라서 못 받는 사람이 많았다. 기관마다 창구가 다르고 서류와 기준이 달랐다. 지원 하나 받으려고 서류를 떼러 세 곳을 다니던 노인들이 이제는 주민센터 한 곳에서 끝낸다.\n\n제도를 합치면서 나라가 쓰는 돈도 얼마간 줄었다. 같은 사람에게 여러 기관이 따로 주던 돈이 정리됐다. 주민센터 복지 담당 공무원들은 서류 확인하던 시간에 집을 찾아다니게 됐다."
 TFRKPHN_lg_6624_b:0 "경기도의 한 복지 담당 공무원은 첫 달에 혼자 사는 노인 서른 집을 찾아갔다. 그중 두 집에서 몇 해째 아무도 안 찾아왔다는 말을 들었다.\n\n\"총각이 올해 처음 온 사람이여. 커피 한잔 하고 가.\"\n\n그는 다음 달 방문 명단 맨 위에 그 두 집을 적었다. 야당은 제도를 합치면서 지원이 준 가구가 없는지 따지겠다고 했고, 복지부는 줄어드는 가구가 한 곳도 없게 하는 경과 조항을 두었다고 답했다. 첫 달이 지나자 주민센터에서 줄이 사라졌다. 한 직원은 처음으로 점심을 제때 먹었다."
 TFRKPHN_lg_6631_a:0 "도쿄일렉트론과 우리 반도체 회사들이 장비 협력 협약을 맺었다. 반도체 공장 장비는 한 대가 멈추면 라인 전체가 선다. 전쟁 동안 우리는 부품 하나를 기다리느라 공장을 세운 적이 있다. 이제 이 회사 정비 인력이 우리 공장 가까이 머물고, 다음 세대 장비 시험도 두 나라 기술자가 한 방에서 한다.\n\n평택 반도체 공장 옆에 정비 인력 숙소가 새로 지어졌고 도쿄에서 온 엔지니어 열두 명이 가장 먼저 들어갔다. 첫 주말 그들은 공장 근처 한국 식당에서 회식을 했다.\n\n\"메뉴판 들고 삼십 분을 고민하더라고. 결국 다 시켰어, 다.\" 식당 주인이 웃었다."
 TFRKPHN_lg_6631_b:0 "공장 쪽 엔지니어들은 처음엔 조심스러웠다. 장비 속을 남의 회사 사람에게 다 보여 주는 일이었다. 그래도 전쟁 동안 장비 한 대가 멈춰 석 달 치 생산을 날린 기억이 그 조심스러움보다 컸다.\n\n협약식에서 두 회사 대표가 같은 장비 앞에서 사진을 찍었다. 두 나라 기술자들이 그 장비를 두고 말다툼을 벌이는 날도 머지않았다.\n\n\"이 밸브, 이쪽으로 돌려야 맞아요.\" \"아니, 매뉴얼엔 저쪽인데요.\" \"매뉴얼 쓴 사람이 저예요.\"\n\n반년 뒤 이 협약으로 시험한 장비가 처음 라인에 들어갔다."
 TFRKPHN_lg_6632_a:0 "도요타와 우리 자동차 회사들이 부품 규격을 맞추기로 했다. 미국 시장이 닫힌 뒤 두 나라 자동차 회사들은 줄어든 시장을 두고 싸우는 대신 비용을 줄이는 길을 골랐다. 울산에서 만든 부품이 나고야 공장으로 가고 아이치에서 만든 부품이 울산으로 온다. 부산과 규슈를 오가는 화물선이 한 주에 몇 편 늘었다.\n\n규격을 맞추는 데는 생각보다 오래 걸렸다. 볼트 하나도 두 나라 기준이 달랐다. 두 회사 엔지니어들이 반년 동안 부산과 나고야를 번갈아 오가며 표를 맞췄고, 마지막 회의에서 합의된 표는 삼백 쪽이 넘었다."
 TFRKPHN_lg_6632_b:0 "울산 부품 회사들은 일감이 늘었다. 한 회사 사장은 처음으로 일본어 통역을 정규직으로 뽑았다. 같은 부품을 만들던 몇몇 회사는 일본 쪽 부품이 더 싸게 들어오면서 주문이 줄었다. 두 나라 노조는 각자 이 협약을 지켜봤다. 부품이 오가는 만큼 일자리도 오갈 수 있다.\n\n첫 공동 규격 부품을 실은 화물선이 부산항을 떠난 날, 두 회사 엔지니어들이 부두에서 함께 저녁을 먹었다.\n\n\"다나카 상, 한 잔 더.\" \"민수 씨, 이제 그냥 다나카라고 불러요.\""
 TFRKPHN_lg_6633_a:0 "TSMC와 우리 반도체 회사들이 서로 주문을 대신 만들어 주는 약속을 맺었다. 전쟁 동안 세계는 대만 공장이 멈추면 무슨 일이 벌어지는지 봤다. 이제 한쪽 공장에 일이 생기면 다른 쪽이 그 주문을 이어받는다. 경쟁하던 두 나라 회사가 처음으로 생산 계획을 서로에게 보여 주게 됐고, 주문을 넣는 회사들은 이 약속을 반겼다.\n\n협약서에서 가장 긴 장은 비밀 유지였다. 서로 공정은 안 보여 주고 주문만 넘긴다. 넘겨받은 주문을 만드는 동안 설계도를 본 엔지니어는 다른 일을 할 수 없다. 두 회사 법무팀은 그 조항 하나로 석 달을 다퉜다."
 TFRKPHN_lg_6633_b:0 "전쟁 동안 대만 공장 전력이 끊긴 날, 세계 자동차 공장 몇 곳이 칩이 없어 멈췄다. 그때 대만 공장의 한 관리자가 한국 공장에 전화를 걸었다.\n\n\"도와줄 수 있습니까?\" \"...지금은 아무 약속이 없어서요. 미안합니다.\"\n\n이제는 그 전화에 답할 길이 생겼다. 업계의 오래된 경쟁자들이 손을 잡자 바깥 고객들은 오히려 안심했다. 첫해에 주문이 실제로 두 번 넘어갔다. 둘 다 공장에 정전이 난 날이었는데 고객들은 아무것도 눈치채지 못했다."
 TFRKPHN_lg_6634_a:0 "폭스콘이 우리나라에 조립 공장을 세우기로 했다. 대륙 공장을 전쟁으로 잃은 뒤 이 회사는 새 자리를 찾고 있었다. 공장에는 우리 회사들이 만든 화면과 반도체, 배터리가 들어간다. 배에 실어 보내던 부품이 이제 트럭으로 한나절 거리다.\n\n공장이 들어설 도시의 채용 설명회에 긴 줄이 섰다. 대학을 갓 졸업한 사람부터 쉰 넘은 사람까지 있었다. 조립 라인 일이 고되다는 건 다들 알았지만, 집 가까이 이만한 일자리가 생긴 적은 없었다.\n\n\"전쟁 때 탄약 공장 다녔습니다. 라인 일은 자신 있어요.\" 한 지원자가 면접관에게 이력서를 내밀었다."
 TFRKPHN_lg_6634_b:0 "노동계는 이 회사 대륙 공장의 긴 노동 시간과 기숙사 생활 얘기를 기억했다. 노조는 공장이 문을 열기 전에 노동 조건부터 협의하자고 요구했고, 고용노동부는 첫 근로 감독을 가동 석 달 뒤로 잡았다.\n\n공장 부지를 다지는 굴착기가 들어온 날 근처 마을 식당들은 점심 메뉴를 늘렸다. 가동 첫날, 그 도시에서 나고 자란 스무 살 청년이 조립 라인 맨 끝에서 완성된 기기를 상자에 넣었다. 엄마한테 보낼 사진을 찍으려다 반장에게 혼이 났다."
 TFRKPHN_lg_6635_a:0 "타타 그룹과 우리 회사들이 여러 건의 계약을 한꺼번에 맺었다. 우리 회사들 전산 업무 일부가 인도로 가고, 인도에 짓는 제철소와 자동차 공장에는 우리 설비가 들어간다. 인도는 사람이 많고 젊은 나라다. 우리 회사들은 중국에서 잃은 시장을 대신할 곳으로 인도를 꼽아 왔고, 뭄바이와 인천을 잇는 직항편이 늘었다.\n\n계약식이 열린 뭄바이 호텔에 우리 회사 임원 서른여 명이 갔다. 몇은 중국 공장을 정리하고 돌아온 지 얼마 안 된 사람들이었다.\n\n\"이번엔 짐 좀 오래 풀어 봤으면 좋겠네요. 이삿짐 싸는 건 이제 지겨워서.\""
 TFRKPHN_lg_6635_b:0 "우리 쪽 전산 업무 일부가 인도로 간다는 소식에 국내 개발자들은 걱정했다. 일자리가 바다를 건너가는 거 아니냐는 것이다. 회사들은 국내 인력은 안 줄이고 새로 느는 일만 나눈다고 설명했다.\n\n인천공항 출국장에 인도 출장 가는 엔지니어들이 늘었다.\n\n\"가방에 뭐 그렇게 많이 넣어?\" \"고추장. 카레는 거기 많잖아.\"\n\n계약 반년 뒤 인도 제철소 공사 현장에 포항에서 온 설비 기술자들이 상주하기 시작했다. 그들은 현지 노동자들에게 설비 다루는 법을 가르쳤다."
 TFRKPHN_lg_6636_a:0 "빈그룹과 우리 회사들이 협력 협약을 맺었다. 베트남에는 우리 회사 공장이 이미 많다. 그 공장에서 만든 물건이 이제 이 회사 매장과 온라인 장터에서 팔린다. 지금까지는 베트남에서 만들어 다른 나라에 팔았는데, 이번 협약으로 베트남 안에서도 판다.\n\n하노이의 한 대형 매장은 협약 첫 주에 한국 식품 코너를 따로 열었다. 라면과 김치, 과자가 진열대에 줄지어 섰다. 베트남 젊은이들은 한국 드라마에서 본 과자를 찾아내 사진을 찍었다."
 TFRKPHN_lg_6636_b:0 "우리 공장에서 일하는 베트남 노동자들도 그 매장을 찾았다. 자기들이 만든 냉장고와 세탁기가 진열대에 놓인 걸 처음 봤다.\n\n\"이거 내가 만든 거야. 이제 우리 엄마도 살 수 있어.\" 한 노동자가 동료 어깨를 쳤다.\n\n협약 다음 장은 물류를 다뤘다. 두 나라 항구를 오가는 컨테이너가 반쯤 비어 돌아오던 일이 줄었다. 협약 일 년 뒤 하노이 그 매장에서 가장 많이 팔린 한국 상품은 컵라면이었다. 매장 관리자는 서울 본사에 그 숫자를 보고하며 웃음 표시를 붙였다."
 TFRKPHN_lg_6637_a:0 "산미겔이 짓는 공항과 도로 공사에 우리 건설사들이 들어간다. 필리핀은 섬이 많아 다리와 항만, 공항이 늘 모자란다. 우리 건설사들은 설계와 시공을 맡고 자재 상당 부분을 우리나라에서 가져간다. 마닐라 근교 공사 현장에 우리말 안전 표지판이 섰다.\n\n현장 소장은 중동과 동남아 공사 현장을 이십 년 넘게 돈 사람이었다. 그는 첫날 현지 노동자들과 우리 기술자들을 한자리에 모아 안전 수칙을 두 나라 말로 읽었다. 통역이 모자라 손짓 발짓이 많이 오갔다.\n\n\"헬멧! 헬멧 쓰고! 이렇게, 이렇게!\""
 TFRKPHN_lg_6637_b:0 "공사 현장 둘레 마을에 마닐라에서 십 년을 산 한국인 부부가 작은 한식당을 열었다. 점심때면 우리 기술자와 필리핀 노동자들이 같은 식당 앞에 줄을 섰다.\n\n\"사장님, 김치찌개 둘, 아도보 하나!\" \"우리 집 아도보 없어요!\" \"그럼 불고기!\"\n\n건설사들은 전쟁 동안 국내 공사가 멈추면서 일감을 잃었다가 이번 계약으로 처음 큰 일감을 얻었다. 본사 해외사업부 임원은 이 공사가 끝나면 다음 섬으로 가겠다고 했다. 공사가 반쯤 진행됐을 때 현장 소장은 현지 노동자 몇을 반장으로 올렸다. 그들은 이제 한국어로 안전 수칙을 읽는다."
 TFRKPHN_lg_6638_a:0 "BHP와 우리 제철 회사들이 철광석과 구리를 여러 해 동안 정해진 물량으로 받는 계약을 맺었다. 전쟁 동안 원자재 값은 하루가 다르게 뛰었고, 값을 치르고도 배를 못 구한 때가 있었다. 이제 호주 서부 항구에서 떠난 배가 정해진 날 포항과 광양에 닿는다. 건설 현장에 들어가는 철근 값도 한결 차분해졌다.\n\n전쟁 동안 포항 제철소 원료 담당자는 매일 아침 국제 시세표와 해운 일정을 함께 들여다봤다. 철광석을 사 놓고도 배가 없어 원료 야적장 바닥이 드러난 날도 있었다. 그날 그는 용광로 하나의 불을 줄여야 했다."
 TFRKPHN_lg_6638_b:0 "이번 계약으로 원료 야적장에 다시 철광석이 산처럼 쌓였다. 계약서가 도착한 날 담당자는 처음으로 정시에 퇴근했다.\n\n\"여보, 나 오늘 일찍 왔다.\" \"어디 아파요?\"\n\n건설 업계는 철근 값이 안정되자 미뤄 둔 공사 일정을 다시 잡았다. 재개발 현장과 메가시티 공사장 공정표가 한꺼번에 당겨졌다. 계약 첫해 포항 제철소는 용광로를 한 번도 줄이지 않았다. 원료 담당자는 그 기록을 연말 보고서 맨 앞에 적고 처음으로 휴가를 냈다."
 TFRKPHN_lg_6639_a:0 "안탐과 우리 배터리 회사들이 니켈 공급 계약을 맺었다. 인도네시아는 니켈이 많이 나는 나라이고 니켈은 전기차 배터리에 들어간다. 현지에서 캐서 한 번 가공한 니켈이 배를 타고 호남권 소재 공장으로 온다. 공장은 호남권 메가시티 산업 단지 안에 섰고, 광양항에 니켈 내리는 부두가 따로 생겼다.\n\n첫 니켈 화물선이 광양항에 닿은 날 하역 노동자들은 처음 보는 화물을 다뤘다. 회색 가루가 담긴 커다란 자루들이었다. 소재 공장 엔지니어들이 부두에 직접 나와 첫 자루 성분을 검사했다."
 TFRKPHN_lg_6639_b:0 "인도네시아 정부는 니켈을 가공하지 않고는 수출 못 하게 막아 왔다. 그래서 우리 회사들은 현지에 일차 가공 공장을 함께 지었고, 거기서 인도네시아 노동자 수백 명이 일한다.\n\n환경 단체들은 니켈 광산 둘레 숲과 바다가 망가진다고 경고했다. 우리 배터리 회사들은 공급망 환경 기준을 계약서에 넣었다고 답했다.\n\n광양 소재 공장에서 처음 만든 양극재는 호남권 배터리 공장으로 실려 갔다. 니켈이 섬나라 광산에서 나와 배를 타고 공장 두 곳을 거쳐 배터리가 되기까지 석 달이 걸렸다."
 TFRKPHN_lg_6640_a:0 "CP 그룹과 우리 식품과 유통 회사들이 여러 해짜리 공급 계약을 맺었다. 전쟁 동안 바닷길이 흔들리면서 닭고기와 사료 곡물 값이 크게 뛰었다. 이 계약의 요점은 값이 올라도 물량은 안 끊기게 하는 것이다. 태국에서 떠난 냉동 컨테이너가 부산항에 들어오는 날이 달력에 박혔다.\n\n전쟁 동안 동네 치킨집 사장들은 닭값이 오를 때마다 가격표를 고쳐 썼다. 어떤 주에는 두 번 고쳤다.\n\n\"한 마리 이만 이천 원이요? 지난주엔 만 구천이었잖아요.\" \"저도 죽겠어요, 손님.\"\n\n서울의 한 치킨집 사장은 그때 가게를 접을지 고민했다."
 TFRKPHN_lg_6640_b:0 "양계 농가 걱정은 달랐다. 태국산 닭이 정해진 날짜에 들어오면 국내 닭값이 눌린다. 농림축산식품부는 계약 물량을 국내 생산이 모자라는 철에 맞춰 들여오게 조정했다. 사료 곡물도 같은 계약에 묶이자 축산 농가들은 사료 값이 정해진 범위에서 움직인다는 것만으로 한숨을 돌렸다.\n\n계약 첫해 여름, 복날을 앞두고 닭값이 오르지 않았다는 짧은 기사가 나왔다. 서울의 그 치킨집 사장은 가격표를 안 고쳐도 되는 여름이 처음이라며 매직펜을 서랍에 넣었다."
 TFRKPHN_lg_6651_a:0 "선거를 열흘 앞두고 두 후보가 방송 토론에서 마주 앉는다. 토론은 한 번뿐이고 시간은 아흔 분이다.\n\n여당 후보 [GetTFRKPHNSdCand]의 참모들은 뭘 앞세울지 밤새 다퉜다. 낡은 주거지가 많은 동북쪽은 재개발 얘기를, 서울 바깥 생활권은 교통 얘기를, 일터가 몰린 곳은 일자리 얘기를 듣고 싶어 한다.\n\n\"셋 다 말하면 아무것도 안 남습니다. 하나만 고르세요.\" 참모들 말은 한결같았다.\n\n캠프 상황실 벽에는 생활권마다 여론조사 숫자가 붙어 있었고 종이는 날마다 바뀌었다. 앞선 곳을 지킬지 뒤진 곳을 쫓을지가 토론 첫마디를 정한다."
 TFRKPHN_lg_6651_b:0 "토론 준비는 모의 토론으로 이어졌다. 상대 후보 역을 맡은 참모가 구청장 시절 자료를 들고 매섭게 몰아붙였다. 후보는 첫 모의 토론에서 세 번, 둘째에서 한 번 말이 막혔다.\n\n\"너무 세게 하는 거 아니야?\" \"실제로는 더 셉니다.\"\n\n토론 전날 밤 후보는 참모들에게 마지막으로 하나만 정해 달라고 했고, 결국 자기가 하나를 골랐다. 참모들은 밤새 원고를 다시 썼다. 토론 당일 아침 후보는 원고를 한 번만 읽고 가방에 넣었다."
 TFRKPHN_lg_6652_a:0 "정원오 후보가 [GetTFRKPHNByOppAt]에서 큰 공약을 내놓았다. 이 생활권을 지나는 철길을 땅 밑으로 넣고 그 위를 공원과 주택으로 채우겠다는 것이다. 그는 구청장 경험을 내세우며 구청에서 해 본 일을 시청에서 하겠다고 했다. 현장에는 평소 유세보다 훨씬 많은 사람이 모였다.\n\n그 생활권 주민들은 오래 철길 소음을 견뎌 왔다. 열차가 지날 때마다 창문이 떨렸고, 철길이 동네를 둘로 갈라 길 건너 학교에 가려면 한참 돌아가야 했다.\n\n\"저거 되면 우리 애 학교 오 분이면 가.\" 공약 발표를 듣던 주민 몇이 웅성거렸다. 여당 캠프는 그날 저녁 대책 회의를 열었다."
 TFRKPHN_lg_6652_b:0 "캠프 정책 담당자가 계산기를 두드렸다.\n\n\"몇조 원짜립니다. 시장 혼자 감당 못 해요.\" \"그래도 주민들 마음은 벌써 움직였어요. 숫자로는 못 돌립니다.\" 홍보 담당자가 받았다.\n\n대책 회의는 자정을 넘겼다. 다음 날 아침 캠프 회의실 화이트보드에 두 가지 안이 적혀 있었다. 같은 곳에서 맞불을 놓는 안, 아무 대응 없이 우리 공약만 밀고 가는 안. 후보는 두 안을 한참 보다가 결정은 오후에 하자고 했다."
 TFRKPHN_lg_6653_a:0 "저녁 여덟 시에 투표가 끝났다. 투표함이 구마다 체육관으로 옮겨졌고 개표가 시작됐다.\n\n한강 북쪽 표가 먼저 열렸다. 앞 숫자가 여당 후보, 뒤 숫자가 상대 후보다.\n\n도심  §R[?TFRKPHN_by_z1|1]§! 대 §B[?TFRKPHN_by_zo1|1]§!\n서북  §R[?TFRKPHN_by_z2|1]§! 대 §B[?TFRKPHN_by_zo2|1]§!\n동북1  §R[?TFRKPHN_by_z3|1]§! 대 §B[?TFRKPHN_by_zo3|1]§!\n동북2  §R[?TFRKPHN_by_z4|1]§! 대 §B[?TFRKPHN_by_zo4|1]§!"
 TFRKPHN_lg_6653_b:0 "캠프 상황실에서는 숫자가 하나 뜰 때마다 누군가 화이트보드에 받아 적었다. 이번 선거 승부처로 꼽혀 온 동북쪽 숫자가 뜨자 상황실이 잠깐 조용해졌다.\n\n개표소 참관인들은 표 묶음이 넘어갈 때마다 눈을 떼지 않았다. 한 체육관에서는 무효표 한 장을 두고 양쪽 참관인이 십 분 넘게 다퉜다. 선관위원이 그 표를 불빛에 비춰 보고서야 판정을 내렸다.\n\n아직 한강 남쪽 표가 남아 있고 자정까지 세 시간이 남았다. 개표 사무원들은 첫 휴식 시간에 체육관 밖에서 컵라면을 먹었다. 몇은 처음 개표 아르바이트를 해 보는 대학생이었다.\n\n\"야, 방송에 내가 센 표 나왔어!\" \"그게 네 건지 어떻게 알아?\" \"느낌이 와.\""
 TFRKPHN_lg_6654_a:0 "자정이 가까워졌다. 개표소 탁자마다 표 묶음이 쌓이고 참관인들이 넘어가는 표를 한 장씩 지켜본다.\n\n한강 남쪽 서편 표가 열렸다.\n\n서남1  §R[?TFRKPHN_by_z5|1]§! 대 §B[?TFRKPHN_by_zo5|1]§!\n서남2  §R[?TFRKPHN_by_z6|1]§! 대 §B[?TFRKPHN_by_zo6|1]§!\n서남3  §R[?TFRKPHN_by_z7|1]§! 대 §B[?TFRKPHN_by_zo7|1]§!\n\n두 캠프 상황실이 같은 방송을 틀어 놓고 있었다. 출구조사와 실제 개표 차이가 자정을 넘기며 좁혀졌다. 여당 캠프 실무자 하나는 휴대전화 계산기로 남은 표를 몇 번이고 다시 더했다."
 TFRKPHN_lg_6654_b:0 "서남쪽 공단 지역은 늘 표가 늦게 열렸다. 일하는 사람들이 퇴근길에 투표해서 마감 직전에 들어온 표가 많았다. 개표 사무원들은 커피를 몇 잔째 비웠다.\n\n후보는 상황실 뒤편 작은 방에서 혼자 화면을 봤다. 참모들은 그 방 문을 두드리지 않았다.\n\n자정을 넘겨도 방송사들은 당선 유력이라는 말을 쓰지 못했다. 앵커가 남은 표가 승부를 가를 거라는 말을 세 번째로 되풀이했다.\n\n\"알아, 안다고! 그만 좀 해!\" 상황실 실무자 하나가 화면에 대고 소리쳤다. 커피 자판기 앞에 줄이 길게 섰다."
 TFRKPHN_lg_6655_a:0 "새벽이 됐다. 남은 건 동남쪽 두 생활권 표다.\n\n동남1  §R[?TFRKPHN_by_z8|1]§! 대 §B[?TFRKPHN_by_zo8|1]§!\n동남2  §R[?TFRKPHN_by_z9|1]§! 대 §B[?TFRKPHN_by_zo9|1]§!\n\n스물다섯 구를 모두 더했다.\n여당 후보 §R[?TFRKPHN_sd_avg|1]§! 대 상대 후보 §B[?TFRKPHN_by_opp|1]§!\n\n마지막 투표함이 열리는 동안 캠프 상황실에서는 아무도 앉지 않았다. 동남쪽은 대통령이 시장 시절 가장 큰 표를 몰아준 곳이다. 그곳 숫자가 이번에도 그대로일지가 마지막 물음이었다."
 TFRKPHN_lg_6655_b:0 "개표소 밖으로 해가 뜨기 시작했다. 밤을 새운 개표 사무원들이 체육관 문을 열고 나와 기지개를 켰다.\n\n\"이번 선거 진짜 길다. 허리 끊어지겠네.\" 마지막 표 묶음에 도장을 찍은 사무원 하나가 혼잣말을 했다.\n\n상황실 화이트보드에 마지막 숫자가 적혔다. 후보가 작은 방에서 나와 상황실로 들어오자 기자들의 카메라가 일제히 그를 향했다. 그는 화이트보드의 마지막 숫자를 확인하고 마이크 앞에 섰다."
 TFRKPHN_lg_6701_a:0 "정부는 내각과 당직 문을 가운데 쪽으로 열었다. 전쟁 동안 거리를 두었던 사람들에게도 자리를 권했다. 첫 명단에 홍준표 정부의 대만 지원을 공개적으로 비판했던 경제학자와, 지난 총선에서 야당 공천을 받았다가 떨어진 전직 구청장 이름이 함께 올랐다.\n\n홍준표 정부는 전쟁을 치르는 동안 반대편을 밀어붙이며 일했다. 그 방식으로 전쟁은 이겼지만 나라는 반으로 갈렸다. 새 정부는 그 방식을 물려받지 않기로 했다.\n\n대통령은 2019년 2월 7일 당 대표 선거에 나서며 박 전 대통령을 극복할 수 있어야 보수정치가 부활한다고 말한 사람이다. 그해 선거에서 그는 졌다. 그때 진 말이 지금 다시 책상 위에 올라왔다."
 TFRKPHN_lg_6701_b:0 "당 안에서 벌써 불만이 나왔다. 전쟁을 같이 치른 사람들을 두고 왜 밖에서 사람을 찾느냐는 것이다.\n\n\"자리 내주면 표도 내주는 겁니다. 그거 모르십니까?\" 한 중진 의원이 의원총회에서 목소리를 높였다.\n\n그날 밤 인사비서관은 명단의 이름 몇 개 옆에 연필로 물음표를 그렸다가 다음 날 아침 지우개로 지웠다. 첫 명단이 발표된 날 야당 원내대표는 사람을 데려가기보다 말을 들어 주는 게 먼저라고 짧게 논평했다."
 TFRKPHN_lg_6702_a:0 "정부는 가장 크게 갈린 쟁점을 국민투표에 부치기로 했다. 국회에서 몇 달째 풀리지 않던 문제다. 여야가 같은 법안을 세 번 올렸다가 세 번 다 본회의 문턱에서 멈췄다.\n\n대통령에게 투표함은 쓰라린 기억이다. 2011년 8월 그는 무상급식을 주민투표에 부치고 시장직을 걸었다. 투표율이 개표 기준에 못 미쳤고 그는 물러났다. 그날 밤 시청을 나서던 사진은 열 해 동안 그를 따라다녔다.\n\n\"이번에도 직을 거십니까?\" 참모 하나가 조심스럽게 물었다.\n\n대통령은 걸지 않는다고 답했다. 결과가 어느 쪽으로 나오든 임기는 그대로 간다. 그 대신 결과를 그대로 따르겠다는 문장을 담화문에 직접 써 넣었다."
 TFRKPHN_lg_6702_b:0 "야당은 국회를 건너뛰는 정치라고 비판했고 여당 안에서도 지면 어떡하느냐는 걱정이 나왔다. 선거관리위원회는 투표소 일만 사천 곳을 다시 꾸릴 준비에 들어갔다.\n\n\"그때 그 양반 시청 나가는 거 내가 여기서 봤어. 이번엔 끝까지 보고 싶네.\" 시청 앞에서 만난 노인이 기자에게 말했다.\n\n투표는 석 달 뒤로 잡혔다. 그사이 여야는 방송 토론을 열두 번 열기로 합의했다. 국회에서 몇 달째 못 하던 합의를 선거를 앞두고 처음 해낸 셈이었다."
 TFRKPHN_lg_6703_a:0 "양안전쟁 동안 홍준표 정부가 걸어 두었던 비상 조치가 오늘부터 풀린다. 여론조사 공표 금지가 풀렸고 비상 대기로 붙들려 있던 장병들에게 귀가 명령이 내려갔다. 야간 통행을 막던 해안 초소 차단기도 하나씩 올라갔다.\n\n신문들은 오랜만에 정당 지지율 조사를 일 면에 실었다. 정치부 기자들은 몇 해 만에 보는 숫자를 몇 번이고 다시 읽었다. 부대 정문 앞에는 새벽부터 가족들이 차를 대고 기다렸다. 아이를 무등 태운 아버지도, 휴대전화로 영상을 찍는 어머니도 있었다.\n\n\"아빠다! 아빠!\""
 TFRKPHN_lg_6703_b:0 "통제를 푸는 순서를 두고 안에서 말이 많았다. 한꺼번에 풀면 중국을 자극한다는 걱정과 끝난 전쟁의 비상 조치를 더 끌 까닭이 없다는 말이 맞섰다. 국가안보실은 해안과 항만을 맨 마지막에 풀기로 했다.\n\n첫날 저녁 동해안의 한 포구에서 두 해 동안 묶여 있던 어선들이 한꺼번에 시동을 걸었다. 선장들은 바다에 나가기 전 서로 담배를 나눠 피웠다.\n\n\"이 년 만이다. 고기들이 우리 얼굴 까먹었겠다.\"\n\n그날 밤 뉴스 첫 소식은 고속도로 정체였다. 두 해 만에 고향 가는 차들이 한꺼번에 몰렸다. 앵커는 오랜만에 반가운 정체라고 했다."
 TFRKPHN_lg_6704_a:0 "양안전쟁 때 비밀 지원에 나섰다가 숨진 사람들의 명단이 처음 공개됐다. 군인과 선원, 조종사 이름과 숨진 날짜가 한 줄씩 적혔다. 명단은 국립서울현충원 새 벽에 새겨졌고 이름 옆에는 숨진 바다와 하늘의 좌표가 함께 적혔다.\n\n대한민국은 서류상 중립국이었고 이 이름들은 그동안 작전 보안을 이유로 묶여 있었다. 유족들은 사고로 숨졌다는 통지서 한 장만 받고 기다려 왔다. 보상 기준도 법으로 정했다. 같은 전투에서 숨진 사람의 유족이 서로 다른 금액을 받는 일이 다시 없게 하려는 것이다."
 TFRKPHN_lg_6704_b:0 "대통령은 명단이 걸린 벽 앞에서 묵념했다. 몇몇 유족은 끝내 벽 앞에 서지 못했다. 사고였다는 말만 믿고 몇 해를 보낸 사람들이었다. 한 어머니는 아들 이름을 손가락으로 짚어 보고 나서야 그동안 받은 통지서를 가방에서 꺼내 찢었다.\n\n\"사고라더니. 이 거짓말쟁이들.\"\n\n베이징은 한국이 스스로 참전을 인정했다고 짧게 논평했고 외교부는 답하지 않았다. 명단 공개 다음 날 현충원을 찾은 사람은 평소의 열 배가 넘었다. 이름을 모르는 사람들도 벽 앞에 꽃 한 송이씩을 놓고 갔다. 관리소는 꽃을 치우지 않고 사흘 동안 그대로 두었다."
 TFRKPHN_lg_6705_a:0 "정부가 주택 공급 계획을 발표했다. 2021년 4월 서울시장 선거 때 대통령은 다섯 해 동안 36만 가구를 약속했는데, 그때 방식을 나라 전체로 넓힌다. 전쟁 동안 멈춘 공사 현장만 전국에 수백 곳이고 그사이 전월세 값은 해마다 올랐다.\n\n핵심은 인허가 시간을 줄이는 것이다. 지금은 구역 지정에서 착공까지 여러 해가 걸린다. 도시계획, 건축, 교통, 환경 심의가 따로 열리고 한 곳에서 막히면 처음부터 다시 줄을 선다. 정부는 따로 열리던 심의를 한 번에 묶어 그 시간을 크게 줄이기로 했다."
 TFRKPHN_lg_6705_b:0 "건설사들은 반겼고 세입자 단체는 철거부터 빨라질 거라며 걱정했다. 서울 변두리의 한 재개발 구역에서는 발표 다음 날부터 이삿짐 트럭이 늘었다.\n\n\"빨리 짓는다는 말이 나한텐 빨리 나가라는 말로 들려.\" 그곳에서 서른 해 철물점을 한 주인이 말했다.\n\n국토부는 철거와 착공 사이에 머물 임시 주택을 함께 짓겠다는 보완책을 다음 주에 내기로 했다. 발표 뒤 첫 달에 인허가 창구로 들어온 신청은 작년 한 해 치보다 많았고 담당 공무원들은 저녁마다 도시락을 시켰다."
 TFRKPHN_lg_6706_a:0 "아파트 높이를 35층으로 묶어 두었던 규제를 풀었다. 낮게 잡혀 있던 용적률도 함께 고쳤다. 십 년 넘게 서울 하늘선을 정해 온 숫자 하나가 사라졌다.\n\n같은 땅에 더 많은 집을 지을 수 있게 됐다. 한강을 따라 선 낡은 단지들이 가장 먼저 재건축 계획을 냈는데 조감도에 쉰 층 넘는 건물이 그려져 있었다. 조합 사무실마다 설명회 현수막이 걸렸고 부동산 중개소 전화는 종일 울렸다.\n\n강변 하늘선이 달라진다는 말에 반기는 사람과 눈살 찌푸리는 사람이 반반이었다. 건축가 단체는 높이만 풀고 길과 공원을 함께 그리지 않으면 강이 담장 뒤로 숨는다고 경고했다. 뒤 단지 주민들은 햇빛이 가려진다며 구청에 의견서를 냈다.\n\n서울시는 높이를 풀어 주는 대신 단지 앞 강변에 누구나 걸을 수 있는 길을 내라는 조건을 붙였다. 첫 심의는 다음 달이다.\n\n발표 다음 날 강남의 한 재건축 단지에서 주민 총회가 열렸다.\n\n\"쉰 층!\" \"마흔다섯!\" \"그냥 예순으로 하지 뭘!\"\n\n몇 층으로 올릴지 두고 밤 열한 시까지 표결이 세 번 이어졌다."
 TFRKPHN_lg_6707_a:0 "상생주택 첫 단지가 입주를 시작했다. 민간 땅을 빌려 공공이 짓는 장기전세주택이다. 2007년 서울에서 시작한 시프트의 두 번째 판이기도 하다.\n\n땅 주인은 땅을 팔지 않고 임대료를 받고, 나라는 땅값 없이 집을 짓는다. 입주자는 주변 시세보다 낮은 보증금으로 오래 산다. 첫 단지 땅은 서울 외곽의 오래된 주차장 부지였다. 땅 주인 노부부는 자식들에게 팔지 말고 물려주라는 말을 들었다며 계약서에 도장을 찍었다."
 TFRKPHN_lg_6707_b:0 "첫 단지에 모집 가구의 수십 배가 몰렸다. 입주 첫날 아이 둘을 둔 부부가 열쇠를 받고 현관 앞에 한참 서 있었다. 전세 계약이 끝날 때마다 이사를 다닌 지 여덟 해 만이었다.\n\n\"이번엔 애들 학교 안 옮겨도 돼. 그게 제일 좋아.\" 아내가 먼저 말했다.\n\n추첨에서 떨어진 사람들은 다음 단지는 언제냐고 물었다. 국토부는 다음 해 착공할 땅을 아직 다 못 구했다.\n\n첫 단지 입구에 작은 표지판이 섰다. 이 땅은 팔리지 않았다. 땅 주인 노부부가 넣어 달라고 한 문장이었다. 입주자들은 그 앞을 지날 때마다 표지판을 한 번씩 올려다봤다."
 TFRKPHN_lg_6708_a:0 "정부는 복지 정책 이름을 약자와의 동행으로 정했다. 대통령이 서울시장 때 시정 맨 앞에 두었던 말이고 따뜻한 보수의 첫 장이기도 하다.\n\n2021년 9월 15일 그는 서울비전 2030을 내놓으며 계층 이동 사다리를 복원하겠다고 했다. 정부 복지의 목표도 거기에 둔다. 가난한 집 아이가 공부할 길, 일자리를 잃은 사람이 다시 설 길, 집 없는 사람이 집을 가질 길. 돈을 나눠 주는 데서 멈추지 않고 사다리 칸을 하나씩 놓아 그 길을 잇는 게 이 정책의 뼈대다."
 TFRKPHN_lg_6708_b:0 "예산 당국은 전쟁 빚부터 갚아야 한다는 의견을 붙였다.\n\n\"사다리 놓을 나무가 아직 모자랍니다.\" 기획재정부 국장이 말했다. \"전쟁 때 무너진 집들이 지금 그 사다리를 기다리고 있어요.\" 복지부가 맞섰다.\n\n대통령은 두 부처 보고서를 다 읽고, 첫해에는 칸을 적게 놓더라도 놓은 칸은 끝까지 지키라고 했다. 그 지시는 다음 날 국무회의 자료 맨 첫 장에 적혔다.\n\n첫해 예산이 확정된 날 복지부 장관이 국회 앞에서 기다리던 장애인 단체 대표들을 만났다. 그들은 칸이 몇 개냐보다 그 칸에 경사로로 올라갈 수 있으면 좋겠다고 했다. 장관은 그 말을 수첩에 그대로 적었다."
 TFRKPHN_lg_6709_a:0 "형편이 어려운 집 아이들에게 온라인 강의를 무료로 열어 주던 서울의 사업이 전국으로 넓어졌다. 서울에서 몇 해 해 온 일을 나라가 받아 이어 간다.\n\n민간 교육 회사 강의를 나라가 사서 아이들에게 나눠 준다. 섬과 산골 학생들이 대도시 학원가 강의를 집에서 듣게 됐다. 전라남도의 한 섬에서는 학교 컴퓨터가 모자라 면사무소가 저녁마다 회의실을 아이들에게 내주었다."
 TFRKPHN_lg_6709_b:0 "교사 단체는 학교 수업이 밀려난다고 걱정했고 학원 업계는 값을 너무 깎는다고 불평했다. 교육부는 강의를 듣는 아이마다 담임이 한 달에 한 번 진도를 확인하게 했다. 화면 속 강사와 교실의 교사가 같은 아이를 함께 보게 하려는 것이다.\n\n첫 달 가입 학생 절반 가까이가 읍과 면에 사는 아이들이었다.\n\n\"서울 애들도 이거 듣는 거죠? 그럼 저도 똑같은 거 듣는 거네요.\" 강원도 산골의 한 중학생이 첫 강의를 듣고 말했다.\n\n반년 뒤 첫 모의고사 성적이 나왔다. 읍면 학생들 평균이 조금 올랐다. 숫자는 작았지만 교육부 담당 과장은 그 표를 사무실 벽에 붙였다."
 TFRKPHN_lg_6710_a:0 "청년취업사관학교가 전국에서 문을 열었다. 기업이 바라는 기술을 가르쳐 곧바로 일자리로 잇는 학교로, 서울에서는 열 곳을 약속했던 사업이다.\n\n첫 기수 자리는 전쟁에서 돌아온 청년들에게 먼저 돌아갔다. 군복 벗은 지 한 달도 안 된 사람들이 교실에 앉아 프로그래밍을 배운다. 짧게 깎은 머리가 아직 자라지 않은 학생들이 맨 앞줄을 채웠다.\n\n\"여기선 아무도 계급 없습니다. 병장도 이병도 다 똑같이 버그 잡는 겁니다.\" 강사가 첫 수업에서 말했다."
 TFRKPHN_lg_6710_b:0 "수료생을 뽑겠다고 약속한 회사 명단이 학교 벽에 붙었다. 대기업 몇 곳과 망명 기업 몇 곳, 전쟁 중에 생긴 드론 회사들이었다. 접수 첫날 정원의 몇 배가 넘는 지원서가 들어왔다.\n\n떨어진 사람들을 어떻게 할지가 다음 숙제가 됐다. 고용노동부는 다음 학기 정원을 두 배로 늘리겠다고 했지만 가르칠 사람이 모자랐다. 첫 기수 강사 셋은 전쟁 때 군에서 통신을 맡았던 예비역이었다.\n\n첫 기수 수료식 날, 맨 앞줄에 앉았던 학생이 졸업 작품으로 전역자들 일자리를 이어 주는 앱을 내놓았다. 그 앱은 다음 기수 모집 안내에 그대로 쓰였다."
 TFRKPHN_lg_6711_a:0 "정부가 서울을 세계 5대 도시로 올리겠다는 목표를 나라 계획으로 발표했다. 대통령이 서울비전 2030에 적었던 목표다. 그때는 한 도시의 꿈이었는데 지금은 나라의 계획이 됐다.\n\n전쟁은 뜻밖의 기회를 남겼다. 홍콩과 상하이에 있던 회사들이 새 주소를 찾고 미대륙을 떠난 회사들도 자리를 구한다. 정부는 세금과 비자, 영어로 되는 행정을 묶어 내놓았고, 외국인 직원 아이가 다닐 학교와 가족이 받을 진료까지 한 창구에서 안내하게 했다."
 TFRKPHN_lg_6711_b:0 "경쟁 도시는 도쿄와 싱가포르다. 두 도시는 이미 같은 회사들에게 같은 조건을 내밀고 있다. 외국 경제지들은 서울 사무실 임대료가 벌써 오르기 시작했다고 썼고, 종로의 오래된 빌딩 몇 곳은 리모델링 공사에 들어갔다.\n\n서울 사람들 걱정도 커졌다. 회사가 오면 집값도 따라 오르지 않느냐는 것이다. 시민 단체는 세계 5대 도시가 서울 사람이 못 사는 도시가 돼선 안 된다는 성명을 냈다.\n\n석 달 뒤 첫 성적이 나왔다. 아시아 본부를 서울로 옮기겠다는 외국 회사가 열한 곳이었다. 도쿄와 싱가포르는 각각 그보다 많았지만 서울이 그 둘과 같은 표에 오른 건 처음이었다."
 TFRKPHN_lg_6712_a:0 "여의도가 디지털금융특구로 지정됐다. 서울에 있는 해외 금융기관을 250곳까지 늘리는 게 서울시 때부터의 계획이다. 지정 첫날 여의도 빈 사무실 몇 층에 임대 문의가 몰렸다.\n\n특구에서는 외국 금융사가 들어와 영업을 시작하기까지 절차가 크게 준다. 여러 기관을 돌던 인가 서류를 한 곳에서 받고 외국어 서류도 그대로 낼 수 있다. 첫 손님은 홍콩을 떠난 자본이 될 것으로 보인다.\n\n\"서울 사무실 창밖으로 강이 보여요. 홍콩에선 옆 빌딩 벽만 봤거든요.\" 홍콩에서 온 한 자산운용사 대표가 웃었다."
 TFRKPHN_lg_6712_b:0 "국내 은행들은 같은 조건을 달라고 요구했다. 외국 회사에만 문을 넓혀 주면 안방을 내주는 꼴이라는 것이다. 금융 당국은 특구 밖으로 위험이 번지지 않게 칸막이를 치겠다고 답했다.\n\n밤 열 시가 넘어도 불이 안 꺼지는 빌딩이 하나둘 늘었고 여의도 식당들은 영어 메뉴판을 새로 찍었다.\n\n석 달 뒤 특구에 처음 문을 연 외국 은행 개업식에 홍콩에서 함께 건너온 직원 가족들이 왔다. 아이들은 여의도 공원을 뛰어다녔다. 부모들은 이 도시에서 몇 해를 살게 될지 서로 묻고 있었다."
 TFRKPHN_lg_6713_a:0 "정부가 수출 상품 디자인을 돕는 사업을 시작했다. 물건은 잘 만드는데 겉모습에서 진다는 말을 중소기업들은 오래 들어 왔다.\n\n2007년 10월 서울은 2010년 세계디자인수도로 뽑혔다. 그때 서울시장이 지금 대통령이다. 그때 도시 모습에 들였던 공을 이번에는 나라 밖으로 팔려 나가는 물건에 들인다.\n\n중소기업이 만든 가전과 화장품, 식품의 포장과 모양을 전문가들이 다시 그린다. 경기도의 한 밥솥 회사는 스무 해 동안 안 바꾼 손잡이를 처음 바꿨다.\n\n\"손잡이 하나 바꾸는 데 스무 해 걸렸습니다. 우리 마누라가 그동안 손 데었다고 그렇게 말했는데.\" 사장이 머리를 긁었다.\n\n첫해 지원을 받은 회사 몇 곳이 나라 밖 디자인 상을 받았다. 한 회사 전기 주전자는 유럽의 한 백화점 진열장 맨 앞에 놓였다. 수출 실적은 아직 크지 않았지만 상을 받은 회사들은 다음 해 지원에 다시 줄을 섰다.\n\n지원을 받은 회사 사장들은 해마다 연말에 동대문 디자인 플라자에서 모였다. 그 건물도 대통령이 시장 때 짓기 시작했다. 모임 이름은 손잡이 모임이 됐다."
 TFRKPHN_lg_6714_a:0 "망명 기업 특별법이 국회를 통과했다. 혜택의 기준과 기한을 법에 적었고 표결은 찬성이 반대의 세 배를 넘었다.\n\n땅값을 깎아 주는 폭, 세금을 미뤄 주는 햇수, 외국인 직원 비자 조건이 조문으로 정해졌다. 그동안은 회사마다 정부와 따로 협상했고 누가 얼마를 받았는지 공개되지 않았다. 협상 내용이 새어 나갈 때마다 특혜 논란이 일었다.\n\n같은 권역 국내 기업도 같은 조건을 신청할 수 있다는 조항이 야당의 끈질긴 요구로 마지막 협상에서 들어갔다. 경제 단체들은 이 조항을 반겼다.\n\n\"이제 옆 공장 외국 회사랑 같은 줄에 서는 기라. 고지서 들고 기자 부를 일도 없고.\" 지방의 한 부품 회사 사장이 말했다."
 TFRKPHN_lg_6714_b:0 "법이 생기면서 회사마다 따로 하던 협상은 끝났다. 산업부 협상 담당 과장은 그날 사무실 단톡방에 이제 칼퇴한다고 올렸다.\n\n법 시행 첫 달, 특별법으로 들어온 외국 회사는 서른 곳이 넘었고 같은 조건을 신청한 국내 회사도 스무 곳을 넘었다. 산업부는 누구에게나 같은 기준을 적용한다는 걸 보여 주려고 두 숫자를 나란히 적은 보도자료를 냈다."
 TFRKPHN_lg_6715_a:0 "정부가 2050년 탄소중립을 나라의 목표로 다시 확인했다. 서울은 2030년까지 온실가스를 40퍼센트 줄이고 2050년에 순배출을 없앤다는 일정을 세워 두었다.\n\n전쟁 동안 발전소와 공장은 가릴 것 없이 돌았고 배출량은 크게 늘었다. 석탄 발전소 몇 곳은 닫기로 한 날짜를 넘겨 다시 불을 땠다. 산업계는 재건이 먼저라고 했다. 무너진 걸 다시 짓는 데 드는 쇠와 시멘트가 전부 탄소라는 것이다."
 TFRKPHN_lg_6715_b:0 "정부는 재건에 들어가는 설비부터 새 기준에 맞추기로 했다. 지금 새로 짓는 공장이 앞으로 서른 해를 돈다. 그 일은 메가시티 권역마다 들어서는 에너지 농장에서 시작된다.\n\n첫 에너지 농장이 들어설 서해안 간척지에서 주민 설명회가 세 번 열렸다. 땅을 내주는 대가로 전기를 싸게 쓰게 해 달라는 요구가 가장 많았고, 환경부는 그 요구를 계획서에 넣었다.\n\n그해 겨울 처음으로 에너지 농장 전기가 메가시티 권역의 한 공장에 들어갔다. 공장장은 전기 요금 고지서를 액자에 넣어 사무실에 걸었다.\n\n\"금액 말고 맨 아래 보세요. 발전원 이름. 그게 마음에 들어서요.\""
 TFRKPHN_lg_6716_a:0 "동네 하천을 걷고 쉬는 곳으로 바꾸는 사업이 시작됐다. 한강에서 하던 일을 지천으로 가져갔다. 대통령이 서울에서 처음 해 본 일을 이번에는 전국 작은 물길로 넓힌다.\n\n콘크리트 둑을 걷어 내고 물가에 길과 의자를 놓는다. 덮어 두었던 복개 구간을 다시 열어 햇빛이 물에 닿게 하는 곳도 있다. 첫 구간이 열린 날 저녁 동네 사람들이 돗자리를 들고 나왔다. 아이들은 신발을 벗고 얕은 물에 발을 담갔고 노인들은 새 의자에 나란히 앉았다.\n\n\"여기 덮기 전엔 내가 여기서 멱 감았어. 육십 년 만이네.\""
 TFRKPHN_lg_6716_b:0 "하천 둘레 가게들은 영업시간을 늘렸다. 문 닫으려던 동네 빵집 하나는 물가 쪽으로 창을 새로 냈다. 큰비가 오면 어떻게 되느냐는 질문에는 물이 차는 구간과 대피로를 표시한 지도로 답했다.\n\n환경 단체는 콘크리트를 걷어 낸 건 반기면서도 물가 길에 조명을 너무 많이 달지 말라고 했다. 밤에 물새가 쉴 자리가 없어진다는 것이다. 구청은 조명 절반을 낮게 달기로 했다.\n\n첫 여름 장마가 지나간 뒤 구청 직원들이 물가 길을 처음부터 끝까지 걸으며 쓸려 간 의자 다섯 개를 확인했다. 그들은 다음 날 다섯 개를 다시 놓았다."
 TFRKPHN_lg_671_a:0 "경부고속선 보강 공사가 끝났다. 2004년 4월 1일 첫 고속열차가 달린 선로가 서울에서 부산까지 전 구간 최고 등급이 됐다.\n\n대전에는 물류 거점이 들어섰다. 경부선과 호남선이 갈라지는 도시라 남쪽으로 내려가는 물자가 여기서 영남과 호남으로 나뉜다.\n\n보강 공사는 전쟁 중에도 멈추지 않았다. 군수 물자를 실은 화물열차가 밤낮으로 달렸기 때문이다. 작업자들은 열차가 지나가는 짧은 틈마다 공구를 들고 선로로 뛰어들었다.\n\n\"두 해 동안 집에 간 날? 손가락으로 세면 됩니다. 한 손으로요.\" 한 선로 반장이 말했다.\n\n개통 첫날 서울역을 떠난 첫 열차에 그 작업자들이 초대받아 탔다. 대전을 지날 때 한 작업자가 창밖의 새 물류 창고를 가리켰다. \"저기 원래 우리 자재 쌓아 두던 데야. 침목 냄새 나던 자리.\"\n\n부산역에 내린 그들은 역 앞에서 돼지국밥을 한 그릇씩 먹고 다음 열차로 돌아갔다. 반장은 돌아오며 이음매 소리로 자기가 고친 자리를 맞혀 보았다. 개통 한 달 뒤 대전 물류 거점을 거쳐 나간 화물은 개통 전 석 달 치보다 많았다."
 TFRKPHN_lg_6720_a:0 "정부가 다섯 해 국정 계획을 발표했다. 주택과 복지, 산업을 한 권에 묶고 표지에 따뜻한 보수라는 말을 적었다. 계획서는 삼백 쪽이 넘었고 첫 장은 대통령이 직접 썼다.\n\n홍준표 정부는 전쟁의 불길이 이 땅에 번지지 않게 막았다. 그 나라를 살 만한 곳으로 만드는 게 이번 정부 몫이다. 계획서의 뼈대는 대통령이 서울에서 해 본 일들이다. 집은 빨리 짓고, 복지는 사다리를 놓는 데 쓰고, 산업은 사람과 돈이 모이는 도시를 만드는 데서 시작한다."
 TFRKPHN_lg_6720_b:0 "계획서 마지막 장에 다섯 해 뒤 확인할 숫자들이 표로 적혔다. 지은 집 수, 사다리에 올라선 사람 수, 새로 들어온 회사 수. 숫자를 적어 두면 못 지킬 때 그대로 드러난다는 반대도 있었지만 대통령은 표를 빼지 않았다.\n\n\"못 지키면 어떡하시겠습니까?\" 발표장에서 한 기자가 물었다. \"임기 끝에 성적표 내겠습니다. 그 표 그대로요.\"\n\n그날 저녁 그 표가 대통령실 복도 게시판에 붙었다. 직원들은 출근길마다 그 앞에서 멈춰 섰고, 누군가는 칸 옆에 작은 연필 표시를 하나씩 더해 갔다."
 TFRKPHN_lg_6721_a:0 "임기 마지막 해가 저물고 있다. 취임하던 날 대통령은 승리는 지키고 국정은 바꾸겠다고 약속했다. 그 약속을 적은 종이가 다섯 해 동안 집무실 벽에 붙어 있었고 이제 귀퉁이가 누렇게 바랬다.\n\n2011년 대통령은 서울시장 임기를 못 채우고 떠났다. 그 뒤 열 해 동안 선거에서 여러 번 졌다. 이번에는 끝까지 일했다. 마지막 국무회의에서 그는 장관들에게 맡은 일 가운데 끝내지 못한 걸 하나씩 말해 달라고 했다.\n\n\"하나만요? 저는 셋인데요.\" \"그럼 셋 다 말해요.\"\n\n회의는 예정보다 한 시간 길어졌다."
 TFRKPHN_lg_6721_b:0 "퇴임 날 아침, 대통령은 마지막 연설을 서울시장 시절 얘기로 시작했다. 2011년에는 임기를 다 채우지 못하고 떠났지만 이번에는 끝까지 왔다고 했다. 객석에서 웃음과 박수가 함께 터졌다.\n\n그는 다섯 해 동안 지킨 승리 위에서 이제 나라가 세계와 함께 걸어야 한다고 했다. 강대국들이 제 몫만 챙기는 세상이라도, 가난과 질병과 기후처럼 모두가 함께 짊어진 숙제에 한국이 힘을 보태야 한다는 것이었다. 연설은 김구가 1947년에 쓴 나의 소원 한 구절로 끝났다.\n\n\"나는 우리나라가 남의 것을 모방하는 나라가 되지 말고, 이러한 높고 새로운 문화의 근원이 되고, 목표가 되고, 모범이 되기를 원한다.\"\n\n연단을 내려온 그는 다섯 해를 처음부터 끝까지 함께한 직원 열 명과 사진을 찍었다. 그날 커뮤니티에는 오세훈 첫 완주라는 글이 올라왔다."
 TFRKPHN_lg_6723_a:0 "국정 연설 뒤 처음 연 국무회의 안건은 세 가지였다. 홍준표 정부가 걸어 둔 비상 조치, 비밀 지원의 뒷정리, 다섯 해 동안 얼어붙은 여야 관계.\n\n모두 홍준표 정부가 대만을 뒤에서 돕느라 미뤄 둔 일이다. 새 정부는 서류 위 중립과 실제로 한 일 사이의 틈부터 메우기로 했다. 비상 조치는 중국을 자극하지 않는 순서로 풀어야 한다. 베이징은 비밀 지원 증거를 쥐고 있다는 말을 흘리며 우리 기업 통관 심사를 늦추기 시작했다."
 TFRKPHN_lg_6723_b:0 "비밀 지원에 나섰다가 숨진 사람들 이름을 찾아 적는 일과 야당 대표를 대통령실로 부르는 일도 같은 표에 올랐다.\n\n\"이름 공개하면 중국이 그걸 증거로 씁니다.\" 국방부 장관이 말했다. \"그래도 유족을 더 기다리게 할 수는 없습니다.\" 보훈부 장관이 받았다.\n\n대통령은 이 세 가지가 끝나야 다음 일을 시작할 수 있다고 했다. 회의가 끝나자 정무수석이 야당 대표실에 전화를 걸었다. 대통령실이 야당 대표실에 전화한 건 다섯 해 만이었다. 수화기 너머 야당 대표는 껄껄 웃더니 날짜나 정하자고 했다. 회담은 열흘 뒤로 잡혔다."
 TFRKPHN_lg_672_a:0 "호남고속선 공사가 끝났다. 2015년 4월 2일 광주송정까지 열린 고속선이 이제 목포 쪽까지 같은 수준으로 이어진다.\n\n광주에 물류 거점이 들어섰고, 본선에서 광주로 들어가는 지선도 함께 놓였다. 호남으로 내려가는 물자는 광주에 모였다가 목포와 순천 쪽으로 흩어진다.\n\n목포역에는 첫 열차를 보려는 사람들이 이른 아침부터 모였다. 서울에서 목포까지 걸리는 시간이 한 시간 가까이 줄었다.\n\n\"서울 병원 댕기는 디 하루가 꼬박 걸렸는디, 인자 아침에 가서 저녁에 오것네.\" 목포에 사는 한 노인이 승차권을 들여다봤다.\n\n광주 물류 거점에는 호남권 메가시티 공장에서 나온 물건들이 쌓이기 시작했다. 에너지 밸리 배터리와 인공지능 단지 서버 장비가 같은 창고를 거쳐 나갔다. 목포항 상인들은 고속열차가 바다까지 닿았다며 반겼고, 홍어 가게 주인은 서울 손님 받을 포장 상자부터 새로 맞췄다. 섬으로 가는 배를 타려는 여행객이 늘 것이다.\n\n개통 반년 뒤 목포역 하루 승객은 두 배 가까이 늘었고, 역 앞 식당 주인들은 메뉴판을 새로 찍었다."
 TFRKPHN_lg_6731_a:0 "2030년 6월 전국동시지방선거까지 두 달이 남았다. 시장과 도지사 [?TFRKPHN_le_total|0]자리가 한꺼번에 걸린 선거이고 임기 네 해째를 맞은 정부에는 중간평가나 다름없다. 메가시티가 올라간 권역과 못 올라간 권역의 민심은 벌써 다르게 움직인다. 당은 후보를 모두 확정했다. 참모들은 대통령이 지역을 얼마나 찾아도 되는지 두고 의견이 갈렸다. 대통령은 선거에서 중립을 지켜야 하는 자리다. 선거 상황실은 오늘부터 날마다 판세를 올린다."
 TFRKPHN_lg_6731_b:0 "당사 상황실에 시도별 여론조사 표가 붙었다. 칸마다 빨강과 파랑이 섞여 있었다. 상황실장이 메가시티 사업이 앞선 권역과 늦은 권역을 형광펜으로 나눠 칠하자 형광펜 색이 여론조사 색과 거의 겹쳤다.\n\n대통령 일정표는 아직 비어 있었다. 지역마다 와 달라는 요청은 벌써 수십 건이었다.\n\n\"대통령이 가는 데마다 표가 갈립니다.\" \"안 가는 데선 표가 빠지고요.\" \"그럼 어쩌자는 겁니까?\" \"그러니까 내일 다시 모이자고요.\"\n\n참모들은 그 칸을 뭘로 채울지 다음 날 아침 다시 모이기로 했다. 상황실장은 밤새 형광펜으로 칠한 표를 다시 다듬었다."
 TFRKPHN_lg_6734_a:0 "투표가 끝나자 방송사 출구조사가 일제히 나왔다. 시도마다 예측 결과가 지도 위에 차례로 칠해지고, 당사 상황실에서는 지역 이름이 불릴 때마다 박수와 탄식이 엇갈렸다. 경합으로 분류된 곳은 자정을 넘겨야 윤곽이 잡힐 것 같았다.\n\n당사 상황실 대형 화면에 시도 지도가 떠 있었다. 결과가 하나씩 칠해질 때마다 공기가 달라졌고, 수도권이 경합으로 뜨자 몇 사람이 의자에서 벌떡 일어났다.\n\n대통령실 상황실은 더 조용했다. 텔레비전 소리만 낮게 깔렸다. 대통령은 소파에 앉아 화면을 보다가 이따금 메모지에 지역 이름을 적었다. 내일 전화를 걸 당선인이 있는 지역이었다. 비서실장은 그 메모지를 받아 들고 밤새 연락처를 찾았다.\n\n자정이 넘어도 경합 지역 숫자는 좀처럼 굳지 않았다. 당사 실무자 하나가 지역 사무소에 전화를 돌렸다.\n\n\"거기 어때?\" \"몰라요. 백 표 왔다 갔다 해요.\" \"그쪽은?\" \"여기도 몰라요. 아무도 몰라요.\"\n\n커피 주전자가 두 번째로 비었고 누군가 세 번째 물을 올리며 오늘 밤은 길겠다고 중얼거렸다."
 TFRKPHN_lg_6735_a:0 "개표 결과 여당이 시도지사 [?TFRKPHN_le_total|0]자리 가운데 [?TFRKPHN_le_wins|0]곳에서 이겼다. 언론은 정부가 중간평가를 넉넉히 통과했다고 썼다. 당 안에서는 강경 노선을 접고 재건과 민생을 앞세운 선택이 지역에서 받아들여졌다는 말이 나왔다. 대통령은 이긴 곳과 진 곳 가리지 않고 당선인을 모두 만나겠다고 했다.\n\n새벽에 당사에서 오랜만에 긴 박수가 터졌다. 대통령실 축하 논평은 짧았다. 비서실장은 직원들에게 이긴 곳보다 진 곳 당선인에게 먼저 연락하라고 했다."
 TFRKPHN_lg_6735_b:0 "야당 지도부는 패배를 인정하면서도 정부 개발 정책 견제는 이어 가겠다고 했다. 그 말을 전해 들은 대통령은 당연하다고 했다. 새 시장과 도지사들은 7월 1일 일을 시작한다.\n\n당선인 전화 명단이 그날 아침 대통령 책상에 올라왔다. 이긴 곳과 진 곳이 섞여 있었고 진 곳 당선인 이름이 맨 위에 있었다. 대통령은 그 순서대로 전화를 걸었다.\n\n\"대통령님이 직접요? 저 야당인데요.\" \"압니다. 축하드려요. 일 같이 합시다.\"\n\n점심 무렵 통화가 끝났다. 비서실장은 명단 마지막 줄에 끝이라고 적었다."
 TFRKPHN_lg_6736_a:0 "개표 결과 여당이 시도지사 [?TFRKPHN_le_total|0]자리 가운데 [?TFRKPHN_le_wins|0]곳에서 이겼다. 어느 쪽도 크게 웃지 못할 숫자다. 여당은 텃밭을 지켰지만 경합 지역 여러 곳을 내줬고, 야당은 심판론이 절반만 통했다고 자평했다. 남은 임기 지역 사업은 야당 단체장들과 협의해서 풀어야 한다. 사업이 더딘 권역에서 표가 빠졌다는 분석이 당 보고서에 올랐다.\n\n당 보고서는 이긴 곳과 진 곳을 메가시티 사업 진척도와 나란히 놓았다. 사업이 앞선 권역은 대부분 지켰고 늦은 권역은 대부분 내줬다. 보고서를 쓴 실무자는 마지막 줄에 개발 속도가 곧 표의 속도였다고 적었다."
 TFRKPHN_lg_6736_b:0 "야당 단체장들은 당선 소감에서 하나같이 지역 사업을 이어 가겠다고 했다. 누구 이름으로 이어 갈지는 말하지 않았다.\n\n다음 날 아침 대통령은 이긴 단체장과 진 단체장을 가리지 않고 한자리에 부르자는 안을 냈다.\n\n\"야당 쪽이 올까요?\" 정무수석이 걱정했다. \"안 오면 우리가 찾아가면 되죠.\"\n\n모임은 7월 첫째 주로 잡혔고 초청장은 야당 단체장들에게 먼저 나갔다. 협의 자리에 처음으로 여야가 절반씩 앉게 됐다."
 TFRKPHN_lg_6737_a:0 "방송사 개표 화면에 여당 참패라는 자막이 걸렸다. 여당은 시도지사 [?TFRKPHN_le_total|0]자리 가운데 [?TFRKPHN_le_wins|0]곳에서 이기는 데 그쳤고 야당은 정권 심판이 끝났다고 선언했다.\n\n여당 지도부는 개표가 끝나기도 전에 물러나겠다고 밝혔다. 당 안에서는 2024년 4월 11일 총선에 진 뒤 한동훈 당시 비상대책위원장이 물러나며 남긴 말이 다시 돌았다. \"민심은 언제나 옳다.\" 여섯 해 만에 같은 장면을 본다는 말도 나왔다."
 TFRKPHN_lg_6737_b:0 "개표가 이어질수록 대통령은 초조해졌다. 야당 후보들의 득표가 하나씩 오를 때마다 패배는 분명해졌고, 결국 받아들일 수밖에 없었다.\n\n선거를 이끌었던 당 대표가 말했다.\n대통령님, 이건 저희 실수입니다.\n\n말은 저렇게 해도 모든 책임이 자기에게 있다는 것을 대통령은 알고 있었다.\n아니네. 이 모든 건 내 책임이네. 오랜만에 소주나 한잔하지.\n\n그날 밤 대통령은 SNS에 당선된 시도지사들에게 축하한다는 짧은 글 하나만 남겼다."
 TFRKPHN_lg_673_a:0 "전라선 공사가 끝났다. 2011년 전 구간이 복선이 된 뒤에도 굽은 구간이 많아 고속열차가 제 속도를 못 내던 선로다. 오늘부터 익산에서 여수까지 열차가 전보다 빠르게 달린다. 순천과 여수에서 나오는 화물도 광주 물류 거점과 한 줄로 이어졌다.\n\n굽은 구간을 펴는 공사는 산을 뚫고 다리를 놓는 일이었다. 남원과 곡성 사이 산골 마을 몇 곳은 공사 동안 소음과 먼지를 견뎠다. 개통식에 그 마을 이장들이 초대받았다.\n\n\"아따, 우리 마을 위로 기차가 날아가네. 저것이 다리여, 하늘이여.\"\n\n여수 석유화학 공단 화물도 이제 이 선로를 탄다. 지금까지는 대부분 트럭으로 고속도로를 달렸다. 공단 물류 담당자는 트럭 운전사가 모자라 애먹던 일이 줄 거라며, 고속도로 휴게소에서 운전사를 붙잡고 사정하던 날들을 떠올렸다.\n\n여수 엑스포역에는 주말마다 관광객을 실은 열차가 늘었고 바닷가 식당들은 예약 전화를 받느라 정신이 없었다. 개통 석 달 뒤 여수 공단 물류 담당자는 철도로 보낸 화물 비율이 처음으로 트럭을 넘었다고 보고했다."
 TFRKPHN_lg_674_a:0 "동해선 보강 공사가 끝났다. 부산에서 울산과 포항을 지나 강릉까지 동해안을 따라 올라가는 선로다. 1920년대 말 처음 계획이 나왔고 2025년 1월 1일에야 한 선로로 이어진 길이다.\n\n포항에 물류 거점이 들어섰다. 동해안 항구와 공단에서 나오는 화물이 철길을 타고 남북으로 오간다.\n\n동해안 사람들은 이 선로를 오래 기다렸다. 지금까지 영덕이나 울진에서 서울에 가려면 버스로 몇 시간을 달려야 했다.\n\n\"서울 가는 기차가 이 동네에 다 생기고. 내 살다 보이 별일이 다 있네.\" 울진역에서 첫 열차를 탄 할머니가 창밖 바다를 보며 말했다.\n\n포항 물류 거점에서 이차전지 단지 소재가 실려 나갔고, 울산 조선소로 가는 철판도 같은 선로를 탔다. 동해안 공단들이 처음으로 한 줄로 이어졌다. 어촌 사람들은 철길이 바다 풍경을 가린다고 걱정했고, 철도공사는 해안 구간 방음벽을 투명한 판으로 바꾸기로 했다.\n\n개통 첫 달 포항 물류 거점을 거친 화물은 예상의 두 배였다. 철도공사는 화물열차를 하루 두 편 더 늘렸다."
 TFRKPHN_lg_6753_a:0 "대통령의 지역 방문이 잦아지자 야당이 선거 개입이라고 공세를 폈다. 대통령이 가는 곳마다 지역 사업 얘기가 따라붙는다며 선거관리위원회에 조사를 요구했다. 여당 안에서도 대통령이 앞에 서면 선거가 정권 심판 구도로 흐를 수 있다는 걱정이 나왔다. 남은 기간 대통령 일정을 어떻게 짤지 정해야 한다.\n\n선관위는 대통령 최근 일정 자료를 요청했고 대통령실은 자료를 그대로 냈다. 지역 방문 가운데 몇은 선거 공고 전부터 잡혀 있던 사업 현장이었다. 그런데 언론은 날짜보다 사진을 먼저 실었다. 사진 속 대통령 옆에 여당 후보가 서 있었다.\n\n\"하필 그 사람이 거기 왜 서 있었어?\" \"후보가 자기 지역 행사에 온 걸 어떻게 막습니까.\"\n\n정무수석은 남은 일정표를 펴 놓고 지역마다 동그라미와 가위표를 그렸다. 동그라미는 점점 줄었다. 선관위는 투표 닷새 전에 대통령 일정이 선거법을 어기지 않았다고 판단하면서, 공정성을 해칠 오해를 받지 않게 조심하라는 권고를 붙였다. 야당은 권고를 크게 인용했고 여당은 앞의 판단을 크게 인용했다."
 TFRKPHN_lg_6754_a:0 "투표가 끝나자 방송사 출구조사가 일제히 나왔다. 시도마다 예측 결과가 지도 위에 차례로 칠해졌고, 당사 상황실에서는 지역 이름이 불릴 때마다 박수와 탄식이 엇갈렸다. 경합으로 분류된 곳은 자정을 넘겨야 윤곽이 잡힐 것 같았다.\n\n임기 마지막 해 선거라 상황실 분위기는 처음부터 무거웠다. 결과가 하나씩 칠해질 때마다 다음 대선을 준비하는 사람들 얼굴이 먼저 화면 앞에 모였다.\n\n대통령은 참모 몇과 작은 방에서 개표를 봤다. 방에는 소파 하나와 낡은 텔레비전 하나뿐이었다. 이번 선거에서 그는 거의 앞에 나서지 않았다. 화면 속 후보 이름을 하나씩 읽다가 다섯 해 전 자기 선거를 도왔던 사람 이름이 나오자 잠깐 멈췄다.\n\n\"저 친구, 그때 우리 캠프 막내였는데. 머리가 다 셌네.\"\n\n자정이 넘어도 경합 지역 숫자는 좀처럼 굳지 않았다. 개표가 반쯤 끝났을 때 대통령이 먼저 일어났다. 결과는 내일 아침에 보겠다고 했다. 비서실장은 그가 나간 뒤에도 화면을 끄지 않았고, 새벽 세 시에 결과를 메모해 대통령 책상에 올려 두었다."
 TFRKPHN_lg_6755_a:0 "개표 결과 여당이 시도지사 [?TFRKPHN_l6_total|0]자리 가운데 [?TFRKPHN_l6_wins|0]곳을 가져갔다. 임기 마지막 해 선거에서 이만큼 이긴 건 드문 일이다. 여당은 다음 대선을 앞두고 지방 조직을 든든히 다졌고 야당 지도부는 책임론에 휩싸였다. 새 시장과 도지사들은 7월 1일 일을 시작한다.\n\n새벽 당사에서 박수가 터졌다. 다음 대선을 준비하던 여당 인사 몇은 당선인들과 사진을 찍으려고 자리를 옮겼다. 대통령실은 달랐다. 대통령은 짧은 축하 메시지만 남기고, 이번 승리는 지방에서 일할 사람들 몫이라고 했다."
 TFRKPHN_lg_6755_b:0 "야당 지도부는 새벽에 사퇴를 발표했다. 다음 대선까지 남은 시간은 한 해가 채 안 됐다.\n\n다음 날 아침 여당 대선 주자들은 하나같이 당선인 사무실을 찾아 사진을 찍었다. 대통령은 당선인들에게 짧은 축하 전화를 돌린 뒤, 남은 임기 동안 마무리할 사업 목록을 국무회의에 올리라고 했다.\n\n국무조정실 실무자들이 밤새 그 목록을 정리했다. 맨 앞에 아직 안 끝난 메가시티 공사 현장이 적혔다.\n\n\"임기는 끝나도 공사는 안 끝나네.\" 목록을 마무리한 실무자 하나가 혼잣말을 했다."
 TFRKPHN_lg_6757_a:0 "개표 결과 여당은 시도지사 [?TFRKPHN_l6_total|0]자리 가운데 [?TFRKPHN_l6_wins|0]곳에서 이기는 데 그쳤다. 유권자들은 임기 마지막 해 정부에 차가운 성적표를 건넸다. 야당은 정권 심판이 시작됐다고 선언했고 여당 안에서는 다음 대선 후보를 두고 목소리가 커졌다. 새 시장과 도지사들은 7월 1일 일을 시작한다.\n\n당사 상황실은 자정 전에 비었다. 낙선한 후보들 사무실에서 짐 싸는 소리가 들렸다. 다음 대선을 준비하는 여당 인사들은 개표가 끝나기도 전에 각자 성명을 냈는데, 대통령 이름을 넣은 성명은 거의 없었다."
 TFRKPHN_lg_6757_b:0 "다음 날 청와대는 낙선자들에게 전화를 하나씩 돌리기 시작했다. 하지만 몇 명은 받지도 않았다. 받은 사람들은 이랬다.\n\n대통령님, 여기 상황 아십니까?\n대통령님, 지금은 전화하지 마십시오. 저흰 다 같이 청와대 앞에서 삭발하겠습니다.\n\n대통령은 미안하다고만 답할 수밖에 없었다. TV를 트니 한 낙선자가 대놓고 대통령은 하야하라고 외치고 있었다. 몇몇 낙선자의 지지자들은 커뮤니티에 탄핵 청원 링크를 퍼 날랐다."
 TFRKPHN_lg_675_a:0 "강릉선 보강 공사가 끝났다. 2017년 12월 22일 평창 동계올림픽을 앞두고 열린 선로이고, 이번 공사로 서울에서 강원으로 넘어가는 구간이 최고 등급이 됐다. 춘천에는 물류 거점이 들어섰고 본선에서 춘천으로 들어가는 지선도 함께 놓였다.\n\n강원도 공단들이 이 소식을 제일 반겼다. 한강 수계 댐에서 넉넉해진 전기가 들어오면서 강원에도 공장이 늘고 있었는데 물건 실어 낼 길이 모자랐다. 고갯길 넘는 트럭은 겨울마다 눈에 막혔다.\n\n개통 첫 주말 서울역에서 강릉 가는 열차는 빈자리가 없었다. 경포 해변 숙박업소들은 주말 예약이 한 달 치 찼다고 했고, 평창의 스키장 주인은 벌써 겨울을 기다렸다.\n\n\"서울 통학이 한 시간 줄었어.\" \"좋겠다. 우리 하숙집 아줌마는 울상이던데.\" 춘천 대학생들이 학교 앞에서 주고받았다.\n\n그해 겨울 첫눈 오는 날 고갯길이 막혔다. 강원도 공장들은 멈추지 않았다. 화물열차가 눈을 뚫고 달렸고, 한 공장장은 처음으로 겨울 걱정 없이 출근했다. 그는 창문 밖 눈 덮인 고갯길을 보며 커피를 천천히 마셨다."
 TFRKPHN_lg_6761_a:0 "오세훈 전 시장이 경선에 나서며 비운 서울시장 자리를 채울 보궐선거가 4월 7일로 잡혔다. 시청은 지난 12월부터 권한대행이 지켜 왔고, 이인제 대통령 취임 한 달 만에 치르는 선거라 새 정부가 받는 첫 성적표다.\n\n당 안에서 두 이름이 나왔다. 정몽준은 당이 불러낸 원로다. 1988년 국회에 들어와 일곱 번 당선됐고 당 대표를 지냈다. 2014년 6월 4일 서울시장 선거에 나가 43.02를 얻고 졌는데, 그 뒤로 열세 해가 지났다. 이름 모르는 유권자는 없지만 시청에 들어간 뒤 대통령 말을 들을 사람은 아니다."
 TFRKPHN_lg_6761_b:0 "다른 한 사람은 조은희다. 서울시 첫 여성 정무부시장을 지냈고, 2018년 서울 스물다섯 구 가운데 여당이 이긴 단 한 곳 서초에서 구청장에 다시 뽑혔다. 경선에서 진 오 전 시장 쪽 사람들이 그를 민다.\n\n서울시당 사무실에 여론조사 결과가 매일 아침 올라왔다. 이름은 다 아는데 찍겠다는 사람은 그보다 적은 후보, 이름 아는 사람은 적어도 찍겠다는 비율은 높은 후보가 표 한 장 위에 나란히 있었다.\n\n공천관리위원장이 대통령실에 뜻을 물었다. 대통령은 서울은 서울 사람이 고르게 하라고 하면서도 결과는 정부가 진다고 했다."
 TFRKPHN_lg_6762_a:0 "더불어민주당이 서울시장 보궐선거 후보로 정원오 전 성동구청장을 확정했다. 지난해 6월 지방선거에서 오세훈 시장에게 1퍼센트포인트도 안 되는 차이로 진 지 열 달 만의 재도전이다.\n\n그는 지난해 2월 8일 문래동 북콘서트에서 \"서울시장에 출마하려고 한다\"며 처음 도전을 알렸고 \"세금이 아깝지 않은 서울\"을 내걸었다. 개표가 끝난 6월 4일 아침에는 \"시민 여러분의 선택을 무겁고 겸허히 받들겠습니다. 제가 부족했습니다\"라고 말했다.\n\n성동구청장을 세 번 하며 성수동을 바꾼 이력이 그의 가장 큰 무기다. 이번에는 현직 시장 없이 치르는 맞대결이다.\n\n야당 캠프는 낡은 공장 건물이 카페와 사무실로 바뀐 성수동 거리에서 출정식을 열기로 했다. 여당 서울시당은 그 장소를 고른 뜻을 금방 알아채고 혀를 찼다. 구청장 열두 해 성적표를 거리째 보여 주겠다는 것이다.\n\n여당 상황실에서는 지난 지방선거 구별 득표표가 다시 펼쳐졌다. 실무자들은 그때 차이가 이번엔 어느 구에서 뒤집힐지 밤늦도록 빨간 색연필을 들고 따졌다."
 TFRKPHN_lg_6763_a:0 "국민의힘 조은희 후보가 7일 치러진 서울시장 보궐선거에서 정원오 후보를 꺾고 당선됐다. 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었다. 서울시 첫 여성 정무부시장을 지낸 그는 이번에 첫 여성 서울시장이 됐다.\n\n2018년 지방선거 뒤 서울 구청장 스물다섯 명 가운데 스물네 명이 다른 당이던 때, 그는 \"더 낮아지고 넓어져서\" 일하겠다고 했고 \"엄마의 마음으로 구석구석을 따뜻하고 꼼꼼하게 살피겠다\"고 말했다. 이번에는 시청에서 그 약속을 지켜야 한다."
 TFRKPHN_lg_6763_b:0 "대선 한 달 만에 치른 첫 선거에서 여당이 서울을 지켰다. 넉 달 비어 있던 시장실에 새 주인이 들어가고, 새 시장은 2030년 6월까지 남은 임기를 맡는다.\n\n개표가 끝난 밤 서초 선거 사무소 앞에 구청장 시절 직원 몇이 찾아왔다. 꽃 대신 구청 민원 처리 통계가 적힌 종이 한 장을 액자에 넣어 왔다.\n\n\"구청장님, 이게 제일 자랑스러우셨잖아요.\" \"어머, 이걸 다 기억하네.\"\n\n다음 날 아침 시청 앞에는 첫 여성 시장의 출근을 보겠다며 사람들이 일찍부터 모였다. 대통령실은 짧은 축하 논평을 냈고, 정무수석은 시청에 전화를 걸어 첫 협의 날짜를 잡았다."
 TFRKPHN_lg_6764_a:0 "더불어민주당 정원오 후보가 7일 치러진 서울시장 보궐선거에서 당선됐다. 여당 [GetTFRKPHNSdCand] 후보는 졌고 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었다. 지난해 6월 오세훈 시장에게 1퍼센트포인트도 안 되는 차이로 진 지 열 달 만에 같은 자리를 차지했다.\n\n정 당선인은 지난해 출마를 알리며 \"세금이 아깝지 않은 서울\"을 내걸었고 \"행정은 시민들의 삶의 요구에서부터 시작해야 한다\"고 말했다. 성동구청장 시절 성수동에서 해 온 방식을 서울 전체로 넓히겠다는 것이다."
 TFRKPHN_lg_6764_b:0 "오세훈 전 시장이 다섯 번 이긴 시청이 그가 떠난 지 넉 달 만에 야당으로 넘어갔다. 새 시장은 2030년 6월까지 남은 임기를 맡는다. 정부는 이제 야당 시장과 마주 앉아 서울 일을 풀어야 한다.\n\n대선을 이긴 지 한 달밖에 안 됐는데 여당 상황실 분위기는 무거웠다.\n\n\"후보를 잘못 골랐어.\" \"서울이 원래 그래. 누가 나가도 졌어.\" \"그럼 다음 총선은?\"\n\n서울 여당 의원들은 벌써 다음 총선을 걱정했다. 대통령은 다음 날 아침 당선인에게 축하 전화를 걸었고, 통화는 오 분 남짓이었다."
 TFRKPHN_lg_6766_a:0 "2014년 5월 26일 밤 여의도 MBC. 서울시장 선거를 아흐레 앞두고 박원순 시장과 정몽준 후보가 마주 앉았다. 일주일 전 토론에서 정 후보는 \"서울에서 사람은 빠져나가고, 장사는 안 되고, 범죄는 늘어나는 등 서울이 가라앉고 있다\"고 몰아붙였다. 이날 용산 개발을 두고 그가 \"단군 이래 최대 사업인데, 이 정도의 우여곡절은 있을 수 있다\"고 하자 박 시장은 \"이제 우리는 낡은 개발 시대와 결별해야 한다\"고 받았다. 정 후보는 43.02를 얻고 졌다.\n\n열세 해 뒤 보궐선거 토론회에서 정원오 후보가 그해를 꺼냈다. 마지막으로 선거를 치른 게 2014년인데 그사이 서울이 어떻게 달라졌는지 아느냐는 질문이었다. 다음 날 기사 제목에는 답 대신 질문만 실렸다.\n\n캠프 젊은 실무자들이 토론 영상을 몇 번이고 돌려 봤다.\n\n\"여기, 이 질문 나온 대목에서 시청률이 제일 높이 솟았어요.\" \"하필이면.\"\n\n다음 토론 준비 회의는 새벽 두 시까지 이어졌다. 이름값으로 얻은 표가 강북에서 조금씩 빠지고 있었다."
 TFRKPHN_lg_6767_a:0 "국민의힘 정몽준 후보가 7일 치러진 서울시장 보궐선거에서 정원오 후보를 꺾고 당선됐다. 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었다. 2014년 박원순 시장에게 진 지 열세 해 만이다.\n\n그해 6월 5일 새벽 그는 \"시민들의 선택을 겸허하게 받아들이겠다\"며 물러섰고, 선거 기간 받은 사랑을 \"항상 감사하게 생각하고 마음속에 오랫동안 간직하겠다\"고 말했다. 일곱 번 국회에 들어간 원로가 이번에는 시청으로 간다."
 TFRKPHN_lg_6767_b:0 "대선 한 달 만에 치른 첫 선거에서 여당이 서울을 지켰다. 그래도 당 안에서는 새 시장이 대통령 말을 그대로 따르지는 않을 거라는 말이 나왔다. 남은 임기는 2030년 6월까지다.\n\n개표가 끝난 새벽 선거 사무소에 열세 해 전 캠프에서 일했던 사람들이 몇 다시 모였다. 그때 막내였던 사람이 이제 상황실장이었다. 그는 열세 해 전 낙선 소감문을 출력해 벽에 붙여 두었다가 당선이 확정되자 떼어 냈다.\n\n\"그거 왜 붙여 놨었어?\" \"부적이요. 이제 필요 없잖아요.\"\n\n정무수석은 다음 날 아침 시청으로 가는 길에 기자들에게 수도권 철도 예산부터 협의하겠다고 했다."
 TFRKPHN_lg_6768_a:0 "[TFRKPHN_allyfac_st.GetName]에 새 공장이 문을 열었다. 시장과 도지사가 정부와 손발을 맞춘 덕에 부지 확보와 인허가가 예상보다 빨리 끝났다. 준공식에 지역 주민과 협력 업체 사람들이 함께 왔고, 단체장은 일자리가 늘 거라고 했다.\n\n준공식이 끝나자 공장 정문 앞에 채용 공고판이 섰다. 첫 공고에 지원한 사람 가운데 서울로 떠났다가 돌아온 젊은이가 많았다.\n\n\"이력서 주소 칸에 고향 집 주소를 다시 쓰니까 기분이 묘하네요.\" 한 지원자가 웃었다."
 TFRKPHN_lg_6768_b:0 "협력 업체들이 공장 둘레에 작은 사무실을 차렸다. 동네 식당과 숙박업소는 오랜만에 손님이 늘었다. 단체장은 다음 해 예산안 첫 줄에 공장 진입로 확장을 올렸다.\n\n공장이 문을 연 첫 달 지역 신문은 일 면에 첫 출근 사진을 실었다. 사진 속 직원 상당수는 몇 해 전 이 도시를 떠났던 사람들이었고, 신문은 그 아래 돌아온 사람들이라는 짧은 제목을 달았다.\n\n그 주부터 공장 앞 도로에 출근 버스가 다녔다. 첫 버스 운전기사는 그 공장 협력 업체에 다니는 아들을 둔 사람이었다. 아들이 타자 그는 괜히 경적을 한 번 울렸다."
 TFRKPHN_lg_6769_a:0 "[TFRKPHN_allyfac_st.GetName]에 새 업무지구가 들어섰다. 시장과 도지사가 정부와 함께 기업 본사와 연구소를 불러 모았고 첫 입주 업체들이 벌써 사무실을 꾸리고 있다. 단체장은 젊은 사람들이 서울로 안 떠나도 되는 일자리라고 했다.\n\n첫 입주 업체 가운데 하나는 서울에서 옮겨 온 연구소였다. 연구원 대부분이 처음엔 내려오기를 망설였는데, 회사가 집과 학교를 같이 알아봐 주자 마음을 바꾼 사람이 늘었다.\n\n\"출퇴근이 한 시간 줄었어요. 애랑 저녁 먹는 날이 생겼습니다. 애가 아빠 누구냐고 안 해요, 이제.\""
 TFRKPHN_lg_6769_b:0 "업무지구 둘레 오래된 상가에도 카페와 식당이 새로 들어섰다. 지역 대학 졸업생들은 첫 채용 설명회에 줄을 섰다. 단체장은 다음 입주 업체를 부르러 서울로 올라갔다.\n\n업무지구 한가운데에 작은 공원이 함께 생겼다. 점심때면 직원들이 벤치에 앉아 도시락을 먹었다. 공원 이름을 정하는 투표에 주민과 직원이 함께 참여했는데, 가장 많은 표를 받은 이름은 그 땅이 예전에 불리던 옛 마을 이름이었다. 공원 표지판은 그해 가을에 섰다."
 TFRKPHN_lg_676_a:0 "서울에서 평양까지 선로가 다시 이어졌다.\n\n1906년 4월 용산에서 신의주까지 열렸던 경의선은 1950년 6월 25일 문산과 개성 사이에서 끊겼다. 2007년 시험 열차와 그 뒤 잠깐 오간 화물열차를 빼면 일흔 해 넘게 정기 열차가 다니지 못한 구간이다.\n\n오늘 서울역을 떠난 첫 열차가 개성과 사리원을 지나 평양역에 닿았다. 개성에는 물류 거점이 들어섰다."
 TFRKPHN_lg_676_b:0 "첫 열차 맨 앞 칸에 실향민 노인 마흔 명이 탔다. 대부분 아흔을 넘긴 사람들이었다. 열차가 임진강 철교를 건널 때 한 노인이 창문에 이마를 대고 한참 움직이지 않았다. 어릴 적 사리원에서 이 선로를 따라 걸어서 피란을 내려왔다고 했다.\n\n평양역 승강장에 그쪽 주민들이 나와 있었다. 서로 무슨 말을 해야 할지 몰라 한동안 손만 흔들었다.\n\n\"고향이 어디요?\" \"사리원이오. 거기 우물 아직 있소?\" \"있지요, 있습네다!\"\n\n그 한마디가 승강장 전체로 번졌다. 그날 밤 서울역 대합실 전광판에 처음으로 평양행 다음 열차 시간이 떴다."
 TFRKPHN_lg_6770_a:0 "조은희 서울시장이 취임 뒤 처음으로 구청장 스물다섯 명을 시청으로 불렀다. 당이 다른 구청장도 모두 나왔다. 회의실 탁자는 스물다섯 자리가 꽉 찼고 시장 자리는 따로 높이 두지 않았다.\n\n서초구청장 시절 둘레 구청장 대부분이 다른 당이던 때를 지나 온 그는 첫 회의에서 구마다 숙원 사업을 하나씩 들고 오라고 했다.\n\n구청장들은 작고 구체적인 사업 목록을 들고 왔다. 금천구는 공단 옆 골목 주차장, 강북구는 낡은 경로당 지붕, 마포구는 하수관 교체였다. 큰 다리나 큰 건물을 짓겠다는 구는 없었다. 시청 실무자들이 목록을 엑셀 한 장에 모아 금액을 더해 보니 다 합쳐도 대형 사업 하나 값이 안 됐다.\n\n회의를 마치고 주차장으로 가던 야당 구청장 하나가 같은 당 동료에게 말했다.\n\n\"이번 시장은 받아 적는 사람이네.\" \"칭찬이야, 욕이야?\" \"글쎄. 두고 봐야지.\"\n\n서울시는 그 사업들에 들어갈 돈 절반을 정부가 대 달라고 요청했다. 기획재정부는 서울만 따로 챙기면 다른 시도에서도 같은 요구가 나온다는 의견을 붙였다."
 TFRKPHN_lg_6771_a:0 "구청장 협의회에서 나온 숙원 사업들이 하나둘 끝나고 있다. 골목 주차장, 구립 어린이집, 오래된 하수관 같은 작은 공사들이다.\n\n조은희 시장은 준공식마다 그 구 구청장을 앞에 세웠다. 당이 다른 구청장도 똑같이 세웠다. 시청 안에서는 생색은 구청장이 내고 일은 시가 한다는 농담이 돌았다.\n\n강북구 경로당 지붕 공사가 끝난 날, 여든 살 경로당 회장이 새 지붕 아래에서 첫 점심을 차렸다.\n\n\"지난 장마 땐 양동이 받쳐 놓고 살았어. 양동이가 세 개였어, 세 개.\"\n\n그는 그 얘기를 몇 번이나 되풀이했다. 구청 직원들은 국수를 두 그릇씩 먹고 돌아갔다."
 TFRKPHN_lg_6771_b:0 "금천구 골목 주차장이 열린 뒤로 밤마다 이어지던 주차 시비가 줄었다. 동네 파출소는 신고 전화가 반으로 줄었다고 구청에 알려 왔고, 그 숫자는 구청 소식지 맨 앞에 실렸다.\n\n여론조사에서 서울의 정부 지지도가 조금 올랐다. 시청 정책실은 작은 공사 스무 곳이 큰 공사 하나보다 표에 낫다는 보고서를 냈다.\n\n그해 가을 시청 로비에 스물다섯 구 준공 사진이 나란히 걸렸다. 사진마다 그 구 구청장이 맨 앞에 서 있었고 시장은 어느 사진에서도 맨 뒷줄이었다."
 TFRKPHN_lg_6772_a:0 "정몽준 서울시장이 정부 수도권 정책을 두고 다른 목소리를 냈다. 일곱 번 국회의원을 지내고 2002년에는 대선에도 나섰던 그는 서울시 몫을 분명히 하겠다며 물러서지 않았다.\n\n대통령과 시장은 수도권 광역철도 비용을 두고 맞섰다. 정부는 서울이 더 내라고 했고 시는 경기와 인천이 더 많이 쓰는 노선이라고 맞받았다. 시청 교통 실무자들이 노선마다 서울 시민이 타는 비율을 표로 만들어 국토부에 보내자, 국토부는 다른 표로 답했다.\n\n같은 당 시장과 대통령이 공개적으로 엇갈리자 여당 안에서 부담스럽다는 말이 나왔다. 야당은 여당이 서울시장 하나 못 다룬다고 꼬집었다."
 TFRKPHN_lg_6772_b:0 "정무수석실 행정관 하나가 하루에 세 번씩 시청과 대통령실을 오갔다. 그는 저녁마다 양쪽 표를 나란히 놓고 숫자가 안 맞는 칸에 형광펜을 칠했다. 칠한 칸은 날마다 조금씩 줄었지만 끝내 다 지워지지는 않았다.\n\n\"이 칸은 왜 또 남았어?\" \"시청은 승차 기준, 국토부는 하차 기준이랍니다.\" \"...미치겠네.\"\n\n대통령은 시장을 따로 만나 풀지, 시장 말로 두고 넘길지 정해야 한다. 그 주 금요일 시장의 정례 브리핑은 예정보다 길어졌고, 기자들은 거의 다 대통령과의 관계만 물었다."
 TFRKPHN_lg_6774_a:0 "정원오 서울시장이 취임 뒤 첫 추가경정예산안을 내놓았다. 열두 해 동안 성동구청장을 지낸 그는 구에서 해 온 생활 행정을 서울 전체로 넓히겠다고 했다.\n\n예산안 맨 앞 장에 큰 건물은 없었다. 공공 화장실과 골목 조명, 노인들이 쉬어 갈 버스 정류장 의자 같은 항목이 줄지어 있었다.\n\n\"구청 예산을 서울 크기로 키운 거네요.\" 시의회 여당 의원이 비꼬자 야당 의원이 받았다. \"그게 시민이 바라는 예산입니다.\""
 TFRKPHN_lg_6774_b:0 "남은 문제는 정부가 대야 할 몫이다. 야당 시장 공약 사업에 국비를 얼마나 줄지를 두고 여당 안에서도 생각이 엇갈렸다. 서울을 내준 마당에 시장 공을 키워 줄 까닭이 없다는 쪽과 국비를 끊으면 피해는 시민이 본다는 쪽이다.\n\n기획재정부 예산실 회의실에서 서울시 요청서를 두고 사흘째 회의가 이어졌다.\n\n\"다른 광역시 요청서도 같은 무게로 봐야죠.\" \"서울 예산 늦어지면 수도권 공사가 줄줄이 밀립니다.\"\n\n같은 주에 서울 몫을 지켜 달라는 서울 여당 국회의원들의 건의서도 대통령실에 올라왔다. 대부분 다음 총선을 서울에서 치러야 하는 사람들이었다."
 TFRKPHN_lg_6776_a:0 "오세훈 대통령이 취임 뒤 처음 연 경제 장관 회의에서 개발을 정부 첫째 과제로 못 박았다. 전쟁 특수가 끝나 가는 경제를 계속 돌리려면 공사 현장부터 열어야 한다는 것이다.\n\n그는 서울시장 선거를 치르던 2026년 5월 11일 토론회에서 \"공급, 닥치고 공급이 가장 근본적인 해법\"이라고 말했다. 같은 달 주택 공약을 내놓으면서는 \"31만 호를 압도적인 속도로 공급해 시민들의 주거 불안을 근본부터 해소하겠다\"고 했다. 이제 그 말을 나라 전체로 옮기려 한다."
 TFRKPHN_lg_6776_b:0 "장관들 의견은 인허가를 한꺼번에 풀자는 쪽과 단계를 밟자는 쪽으로 갈렸다.\n\n회의가 끝나고 국토교통부 실무자들이 묶여 있는 인허가 목록을 뽑아 보니 수백 쪽이었다. 한꺼번에 풀면 공사 현장이 한 해 만에 두 배가 되는데 감독할 사람은 그대로다. 단계를 밟으면 안전하지만 경기가 식는다. 실무자들은 두 안의 장단점을 종이 한 장에 나란히 적었다.\n\n\"서울에서 해 본 거랑 나라 전체에서 하는 건 다르다는 거, 압니다.\" 대통령이 그 종이를 받아 들고 말했다.\n\n회의는 결론 없이 끝났고 다음 회의는 이틀 뒤로 잡혔다."
 TFRKPHN_lg_6777_a:0 "전국 착공 물량이 한 해 사이 눈에 띄게 늘었다. 서울 재개발 구역마다 타워크레인이 올라가고 멈춰 있던 재건축 단지들도 철거를 시작했다.\n\n남은 걱정은 집값이다. 개발 소식이 도는 동네마다 호가가 먼저 뛰었다. 금융 당국은 대출을 조여 열기를 식히자고 했고 대통령실 참모들은 공급을 더 밀어 값을 누르자고 했다. 대통령은 시장 시절부터 공급이 답이라고 해 왔지만 총선을 앞둔 여당은 집값 기사 하나에도 예민했다.\n\n\"이번 주에만 호가가 세 번 올랐어요. 매물은 없고 전화만 와요.\" 강남의 한 부동산 중개소 사장이 말했다.\n\n지방의 한 신도시에는 미분양 현수막이 아직 걸려 있었다. 한 나라 안에서 시장 두 개가 따로 움직였고, 신문들은 같은 날 집값 폭등과 미분양 기사를 실었다.\n\n금융 당국과 대통령실 참모들 회의는 사흘째 이어졌다. 한쪽은 돈줄을 안 죄면 거품이 커진다고 했고 다른 쪽은 돈줄을 죄면 공사 현장이 멈춘다고 했다. 대통령은 두 보고서를 다 읽고도 바로 정하지 않았다. 그 주 금요일 그는 두 보고서 가운데 하나를 골랐다."
 TFRKPHN_lg_6778_a:0 "재개발 구역에서 밀려나는 세입자 문제가 커졌다. 철거 일정에 맞춰 옮길 곳을 못 찾은 사람들이 구청 앞에 모였다.\n\n오 대통령은 2022년 7월 1일 서울시장 취임사에서 약자와의 동행을 두고 \"제가 서울시장으로서 존재하는 이유이자, 제 평생의 과업\"이라고 말했다. 야당은 그 말을 그대로 돌려주며 공세를 폈다. 여당 안에서는 동행 예산을 늘리자는 쪽과 속도를 늦추면 다 놓친다는 쪽이 맞섰다."
 TFRKPHN_lg_6778_b:0 "구청 앞에 모인 세입자 가운데 서른 해 동안 같은 동네에서 산 노인이 있었다. 재개발이 끝나면 새 아파트에 들어갈 수 없다는 건 그도 알았다.\n\n\"새 아파트 바라는 거 아니여. 이 근처에 방 한 칸만. 병원이 여기 있어서 그려.\"\n\n구청 직원은 받아 적었지만 그런 방이 근처에 남아 있는지는 장담하지 못했다. 대통령실 정책실은 그 주에 세입자 이주 대책 예산을 다시 계산했고 숫자는 생각보다 컸다.\n\n그날 저녁 구청 앞 사람들은 하나둘 흩어졌다. 노인은 마지막까지 남아 구청 문이 닫히는 걸 봤고, 다음 날 아침 다시 그 자리에 섰다."
 TFRKPHN_lg_6779_a:0 "총선이 끝났다. 대통령실은 남은 임기 동안 개발을 어디까지 밀지 다시 정해야 한다.\n\n첫 삽을 뜬 현장들은 대부분 아직 공사 중이다. 건설업계는 지금 멈추면 반쯤 지은 단지만 남는다고 했고, 경제 부처는 금리와 공사비가 부담이라고 맞섰다. 2030년 지방선거까지는 두 해가 남았다.\n\n대통령실 회의실에 전국 공사 현장을 찍은 지도가 펼쳐졌다. 첫 삽을 뜬 곳은 빨간 점, 반쯤 올라간 곳은 노란 점, 끝난 곳은 초록 점이었다. 초록 점은 아직 몇 개뿐이라 지도는 온통 빨갛고 노랬다.\n\n\"지금 멈추면 반쯤 지은 단지가 흉물이 됩니다. 십 년 갑니다, 그 흉물.\" 건설업계 대표가 말했다.\n\n\"금리를 보면 지금 숨 고르는 게 맞습니다.\" 경제 부처가 맞섰다.\n\n정무수석은 지방선거까지 두 해 남았다는 걸 회의 자료 맨 아래에 적어 두었다. 대통령은 지도의 노란 점을 하나씩 셌다. 회의가 끝나자 그는 지도를 접지 말고 회의실 벽에 그대로 붙여 두라고 했다. 다음 회의 때 노란 점이 몇 개나 초록으로 바뀌었는지 보겠다는 것이다."
 TFRKPHN_lg_677_a:0 "서울에서 원산까지 선로가 다시 이어졌다.\n\n1914년 8월 열린 경원선은 1945년 8월 24일 삼팔선에서 연결 운행이 끊겼다. 남쪽 열차는 2012년부터 백마고지역에서 멈췄고 그 너머는 여든 해 넘게 비어 있었다. 오늘 그 구간에 열차가 들어갔다. 서울을 떠난 열차가 이제 동해 바다가 보이는 원산까지 간다.\n\n백마고지역 역무원은 오랫동안 선로 끝을 지켜 왔다. 역 뒤편 녹슨 선로가 철망 너머로 이어져 있었다. 첫 열차가 철망 걷힌 자리를 지나갈 때 그는 승강장 끝에서 경례를 붙였다."
 TFRKPHN_lg_677_b:0 "철원 평야를 지나 북쪽으로 올라가는 동안 승객들은 휴대전화를 들고 창밖을 찍었다. 분단 뒤로 사람 손이 닿지 않은 들판에 갈대와 철새가 가득했다.\n\n원산역에 내린 승객들은 맨 먼저 바다 쪽으로 걸어갔다. 서울에서 온 한 할아버지가 신발을 벗고 바닷물에 발을 담갔다. 어릴 적 아버지 손을 잡고 이 바다를 마지막으로 본 지 여든 해가 넘었다.\n\n\"얘야, 사진 한 장 찍어 다오. 할애비 발 나오게.\"\n\n돌아오는 열차에서 그는 손녀에게 그 사진을 몇 번이나 다시 보여 달라고 했다."
 TFRKPHN_lg_6780_a:0 "지방 재개발 조합원들이 버스를 나눠 타고 서울로 올라왔다. 여의도에 모인 이들은 재개발 지원 대책을 내놓으라는 손팻말을 들고 구호를 외쳤다. 같은 날 지방 시도지사들도 공동 성명을 냈다. 정부 개발 예산과 인허가가 수도권에 몰린다는 내용이었다.\n\n성명에는 크레인은 서울에 서고 지방엔 빈집만 는다는 대목이 들어갔다. 여당 소속 단체장도 여럿 이름을 올렸다. 대통령실 안에서는 서울이 먼저 살아야 지방에도 돈이 돈다는 쪽과 이대로면 총선에서 지방 의석을 잃는다는 쪽이 맞섰다.\n\n여의도에 모인 조합원 가운데 부산과 대구에서 새벽 버스를 타고 온 노인이 많았다. 한 노인은 손팻말 대신 지붕이 내려앉은 낡은 집 사진을 들고 왔다.\n\n\"서울 크레인 구경하러 온 거 아이다. 우리 동네 크레인 받으러 왔다.\"\n\n그날 저녁 국토교통부가 지방 권역 재개발 신청 현황을 다시 뽑았다. 신청은 서울보다 적었는데 기다린 시간은 훨씬 길었다. 노인의 사진은 다음 날 몇몇 신문 일 면에 크게 실렸고 사진 설명은 한 줄뿐이었다."
 TFRKPHN_lg_678_a:0 "동해안을 따라 북쪽 끝까지 가는 선로가 놓였다. 첫 구간은 1937년 열렸다가 분단으로 끊긴 동해북부선이다. 2007년 5월 17일 금강산에서 제진까지 시험 열차가 한 번 달린 뒤로 멈춰 있던 길이다.\n\n이제 열차는 강원 동해안에서 원산과 함흥, 청진을 차례로 지난다. 남쪽 동해선과 맞닿아 부산에서 함경도까지 한 줄로 이어진다.\n\n부산역에서 청진행 첫 열차가 떠나던 날, 승강장에 함경도가 고향인 실향민의 자식과 손주들이 모였다. 부모 세대는 대부분 세상을 떠났다. 그들은 부모가 남긴 주소 쪽지를 들고 열차에 올랐다.\n\n열차는 꼬박 하루를 달렸고 동해 바다가 거의 내내 창밖에 있었다. 함흥을 지날 때 한 승객이 창밖을 가리켰다.\n\n\"아버지가 맨날 말하던 바닷가 마을, 저기쯤일 거야. 집 앞에 명태 말리던.\"\n\n청진 물류 창고에 남쪽에서 실어 온 쌀과 시멘트가 쌓이기 시작했다. 청진역 앞에서는 남쪽에서 온 사람들과 그곳 주민들 사이에 작은 장이 섰다. 남쪽 사람들은 과자를, 그곳 주민들은 말린 생선을 내밀었다."
 TFRKPHN_lg_6793_a:0 "기업가치 1조 원을 넘은 비상장 스타트업이 쉰 곳을 채웠다. 서울시가 2023년 성수동 창업허브 계획을 내놓으며 내건 숫자를 나라 전체가 먼저 넘었다.\n\n쉰 번째 회사는 지방 메가시티 권역에서 나왔다. 대통령은 축하 자리에서 창업자들에게 다음 쉰 개는 서울 밖에서 나오게 해 달라고 했다. 성수동 창업허브의 밤은 여전히 밝았고, 옆 골목 작은 사무실들에서는 다음 유니콘을 꿈꾸는 사람들이 밤을 새웠다.\n\n쉰 번째 회사 창업자들은 지방 대학 같은 연구실 출신이었다. 서울로 가자는 투자자들 권유를 몇 번이나 거절했다.\n\n\"서울 가면 집값 내다가 회사 망해요. 여기선 월세가 삼분의 일이에요.\"\n\n그 도시 시장은 축하 자리에서 그 얘기를 꺼내며 이 도시에 남아 줘서 고맙다고 했다. 중소벤처기업부는 그 주에 지방 창업 지원 예산을 늘리는 안을 올렸다.\n\n회사 사무실은 지방 도시의 오래된 은행 건물 이층이었다. 축하 자리가 끝나자 창업자들은 다시 컴퓨터 앞에 앉았다. 다음 달 투자 설명회 날짜가 달력에 빨갛게 표시돼 있었다."
 TFRKPHN_lg_6794_a:0 "서울런 수강생이 50만 명을 넘었다. 2021년 8월 서울에서 시작한 해 가입자는 9천 명 남짓이었고 2026년 5월에야 4만 명을 넘었다. 전국으로 문을 연 뒤 몇 해 만에 열 배 넘게 늘었다.\n\n서울에서 이미 성과가 있었다. 서울런으로 공부해 대학에 붙은 학생이 2023학년도 462명에서 2026학년도 914명으로 늘었다. 올해 합격자 명단에는 섬마을과 산골 학교 이름이 처음으로 여럿 올랐다.\n\n대통령은 축하 자리에서 학원 갈 형편이 안 되는 아이도 같은 강의를 듣게 하는 게 약자와의 동행이라고 했다.\n\n합격자 가운데 한 학생은 전라남도 작은 섬에서 자랐다. 섬 학교 둘레에는 학원이 하나도 없어서 그는 저녁마다 면사무소 회의실 컴퓨터로 강의를 들었다. 합격 소식이 온 날 면사무소 직원들이 회의실 문에 축하 종이를 붙였다.\n\n\"우리 회의실에서 대학생 나왔다! 이장님, 현수막 걸까요?\"\n\n교육부는 다음 해부터 섬과 산골 학교에 강의 들을 공부방을 따로 짓기로 했다. 첫 공부방은 그 섬 학교에 생겼고 공사는 이듬해 봄에 시작됐다."
 TFRKPHN_lg_679_a:0 "평양에서 신의주까지 선로 공사가 끝났다. 경의선 북쪽 절반으로, 북한에서는 평의선이라 부르던 구간이다. 신의주에서 압록강을 건너면 바로 중국 단둥이다. 평양에서 국경까지 최고 등급 선로가 놓이면서 우리 열차가 한반도 서북쪽 끝에 닿는다.\n\n공사는 북쪽의 낡은 선로를 거의 다 걷어 내는 일이었다. 오래된 침목은 손으로 들면 부서질 만큼 삭아 있었다. 남쪽 철도 기술자와 북쪽 철도 노동자들이 함께 들어갔는데, 처음엔 쓰는 말이 달라 연장 이름 하나 맞추는 데도 한참 걸렸다.\n\n\"스패너 좀.\" \"뭐이요?\" \"저거, 나사 돌리는 거.\" \"아, 나사틀개!\""
 TFRKPHN_lg_679_b:0 "신의주역에 첫 열차가 닿은 날, 역 앞으로 압록강 철교가 보였다. 강 건너 단둥 건물들이 손에 잡힐 듯했다.\n\n\"서울에서 떠난 기차가 여기까지 왔다고요? 이거 꿈 아니죠?\" 열차에서 내린 철도 기술자 하나가 동료 팔을 꼬집었다.\n\n이제 강을 건너는 일이 남았고, 그건 외교로 풀어야 한다. 신의주역 대합실에 개통 기념으로 서울에서 신의주까지 노선도가 걸렸다. 노선은 압록강에서 멈춰 있었고 그 너머는 하얗게 비어 있었다."
 TFRKPHN_lg_6811_a:0 "애플 설계 조직이 수도권에 자리를 잡았다. 쿠퍼티노에서 두 해를 버티다 떠나온 사람들이다. 이 회사 전화기에 들어가는 화면과 반도체는 오래전부터 우리 회사들이 만들어 왔다. 설계하는 사람과 부품 만드는 사람이 처음으로 같은 나라에서 일하게 됐다.\n\n처음 몇 주 동안 설계자들은 우리 부품 회사 공장들을 돌았다. 자기들이 그린 부품이 실제로 만들어지는 곳을 처음 봤다. 화면 공장의 한 반장은 미국에서 온 설계자가 라인 앞에 한참 서 있었다고 했다.\n\n\"이렇게 어렵게 만드는 줄 몰랐습니다. 우리가 그린 선 하나가 여기선 사흘이네요.\" 설계자가 통역을 거쳐 남긴 말이었다.\n\n부품 회사들도 달라졌다. 바다 건너 사양서만 받아 만들던 그들이 이제는 설계 단계부터 회의실에 함께 앉는다.\n\n\"처음으로 이렇게 말해 봤어요. 이거 이렇게 바꾸면 더 싸고 튼튼하다고.\" 한 부품 회사 엔지니어가 웃었다.\n\n그해 수도권 디자인 학교들은 입학 설명회에 이 회사 설계자들을 강사로 불렀다. 반년 뒤 이 조직이 설계하고 우리 회사들이 만든 첫 기기가 시장에 나왔다."
 TFRKPHN_lg_6812_a:0 "인텔 이름을 단 연구소와 시험 생산 시설이 충청권에 문을 열었다. 미국 공장을 두 해 동안 지키다 떠나온 공정 기술자들이 주축이다. 장비는 못 가져왔다. 그들이 가져온 건 공정을 다루는 손과 머리였고, 우리 반도체 회사들이 가장 먼저 그들을 찾아왔다.\n\n시험 생산 시설 장비는 우리 장비 회사들이 채웠다. 처음 들여온 장비는 기술자들이 미국에서 쓰던 것과 달랐다. 그들은 석 달 동안 장비 회사 엔지니어들과 설정값을 하나하나 다시 잡았다. 그러는 동안 우리 엔지니어들은 책으로만 보던 공정을 손으로 배웠다.\n\n기술자 하나는 미국 공장이 문 닫던 마지막 날까지 남아 있었다. 공장 전원을 마지막으로 내린 사람도 그였다. 충청 새 시설에서 첫 웨이퍼가 나오던 날 그는 그 웨이퍼를 불빛에 비춰 봤다.\n\n\"마지막으로 끈 사람이 처음으로 켜네요. 운이 좋은 거죠, 이건.\"\n\n우리 반도체 회사들은 그들을 데려가려고 연봉 경쟁을 벌였다. 정부는 망명 기업과 국내 기업이 사람을 두고 지나치게 다투지 않도록 공동 연구 과제를 만들기로 했다."
 TFRKPHN_lg_681_a:0 "오픈AI 이름을 단 연구소가 수도권에 문을 열었다. 샌프란시스코 본사는 이제 없다. 내전을 피해 건너온 연구자들이 이곳에서 일을 이어 간다. 같은 이름을 쓰는 조직이 다른 나라에도 남아 있지만 서로 지시를 주고받지는 않는다.\n\n첫 출근 날 로비에 두 가지 말로 된 안내판이 섰다. 미국에서 건너온 연구자들은 대부분 가방 하나와 노트북 하나만 들고 왔다. 집과 차, 여러 해 쌓은 서버는 두고 왔다.\n\n\"우리가 가져온 건 머릿속에 든 것뿐입니다. 서버는 여러분 걸 써야 해요.\" 한 연구자가 첫 회의에서 말했다.\n\n우리 쪽에서 뽑힌 연구원들은 대부분 서른 안팎이었다. 그중 하나는 몇 해 전 미국 연구소 입사 면접에서 떨어진 적이 있는데, 그때 자기를 면접한 사람과 같은 층에서 일하게 됐다.\n\n\"그때 왜 떨어뜨리셨어요?\" \"기억 안 나요. 미안해요. 지금은 붙었잖아요.\"\n\n연구소가 들어선 동네 원룸과 오피스텔은 한 달 만에 거의 다 찼다. 근처 식당들은 메뉴판에 영어를 넣었고 밤늦게까지 여는 카페도 부쩍 늘었다."
 TFRKPHN_lg_682_a:0 "구글 한국 조직이 충청권에 연구소와 데이터 센터를 열었다. 대전 연구 단지와 세종 정부 청사 사이에 자리를 잡았다.\n\n마운틴뷰에서 내려오던 지시는 끊긴 지 오래다. 서버와 사람, 우리말로 쌓인 자료가 이 땅에 남았고 이제 우리 법에 따라 움직인다. 새 업무 지구에는 협력사들도 따라 들어오고 있다.\n\n데이터 센터가 처음 전원을 켠 주에 충청 대학 몇 곳이 졸업생 취업 설명회를 열었다. 지금까지 이 지역 공대 졸업생은 대부분 서울이나 판교로 떠났다.\n\n\"설명회장이 꽉 찬 건 처음 봅니다. 의자가 모자라서 옆 강의실 걸 빌렸어요.\" 한 대학 취업 담당 교수가 웃었다."
 TFRKPHN_lg_682_b:0 "정부는 그 서버에 쌓인 자료를 누가 어떻게 들여다볼 수 있는지 법으로 정하는 일에 들어갔다. 지금까지 그 자료는 다른 나라 법을 따랐다.\n\n\"집주인이 바뀐 금고 열쇠를 새로 깎는 일이죠. 문제는 안에 뭐가 들었는지 우리도 다 모른다는 거고요.\" 개인정보보호위원회 국장이 말했다.\n\n세종 공무원들 사이에서는 그 연구소 구내식당이 맛있다는 소문이 돌았다. 그해 겨울 첫 인턴 기수 절반이 충청 지역 대학 출신이었다."
 TFRKPHN_lg_683_a:0 "테슬라 이름을 단 조립 공장이 호남권에 섰다. 미국 공장들이 멈춘 뒤 건너온 기술자들이 생산 설비를 다시 짰고, 광주 자동차 부품 회사들이 첫 납품 계약을 맺었다. 호남권 메가시티 에너지 농장 전기가 이 공장으로 간다. 광주와 전남에 오랜만에 큰 생산직 채용 공고가 났다.\n\n공고가 나간 날 광주 고용센터에 아침부터 사람이 몰렸다. 서울에서 일하다 고향으로 돌아온 사람이 많았다.\n\n\"십 년 동안 명절에만 내려왔어요. 이번엔 가방 풀려고요. 엄마가 방 치워 놨대요.\"\n\n첫 조립 라인은 미국에서 온 기술자와 광주 숙련공이 함께 짰다. 말이 안 통하면 손으로 그림을 그렸다. 화이트보드에 나사와 볼트 그림이 쌓였고 나중엔 그림만 보고도 서로 알아들었다. 석 달 뒤 첫 차가 라인을 빠져나왔는데, 문짝 안쪽에 두 나라 기술자들 서명이 작게 적혀 있었다.\n\n부품 회사 사장들은 납품 단가를 두고 공장과 실랑이했지만 일감이 생긴 것부터 반겼다. 한 사장은 십 년 만에 야간 조명을 켰다. 첫 출근 날 아침 공장 정문 앞에 작은 국밥집이 문을 열었다."
 TFRKPHN_lg_684_a:0 "엔비디아 설계 조직이 대구경북에 센터를 열었다. 구미 전자 산업 단지와 대구의 대학들이 가깝다는 게 이유였다. 샌타클래라 본사는 문을 닫았고 설계 자산은 설계자들이 흩어진 나라마다 나뉘었다. 우리 몫으로 남은 설계는 우리 반도체 회사 공장에서 생산한다.\n\n센터가 들어선 건물은 몇 해 전 문 닫은 섬유 회사 본사였다. 건물을 고치던 인부들이 지하 창고에서 옛 직물 견본 상자를 찾아냈다. 직원들은 그 상자를 버리지 않고 로비 한쪽에 전시했다. 이 도시가 뭘로 컸는지 잊지 말자는 뜻이었다.\n\n대구의 대학들은 반도체 설계 학과 정원을 늘렸다. 첫해 신입생 가운데 서울 대학에 붙고도 대구에 남은 학생이 몇 있었다.\n\n\"집에서 다닐 수 있는 데에 이런 회사가 생길 줄 몰랐죠. 엄마 밥도 먹고.\"\n\n설계도가 우리 공장으로 넘어가는 첫날 구미 반도체 공장 직원들은 처음 보는 회로도를 펴 놓고 밤늦게까지 회의했고, 컵라면 용기가 탁자 한쪽에 수북이 쌓였다. 첫 설계도가 완성된 날 센터 직원들은 섬유 견본 상자 앞에서 단체 사진을 찍었다."
 TFRKPHN_lg_685_a:0 "보잉 이름을 단 조립과 정비 공장이 경남에 문을 열었다. 사천에 모인 우리 항공기 회사들이 부품을 대기로 했다.\n\n시애틀 조립 공장은 멈춘 지 오래다. 세계 항공사들은 가까운 나라에 남은 거점에 정비를 맡기는데 동아시아에서는 이 공장이 그 일을 한다. 전쟁 동안 정비를 미뤄 둔 우리 군용기들도 이곳에서 손을 본다.\n\n격납고에 처음 들어온 비행기는 동남아 항공사 여객기였다. 두 해 동안 정비를 못 받아 엔진 덮개가 녹슬어 있었다. 정비사들은 석 달 동안 그 비행기를 붙들고 있었고, 다시 하늘로 떠나던 날 활주로 끝에 나와 손을 흔들었다."
 TFRKPHN_lg_685_b:0 "사천 부품 회사들은 오랜만에 주문이 밀렸다. 한 회사 사장은 직원을 서른 명 더 뽑겠다고 했는데, 그중 열 명은 공군에서 정비를 하다 전역한 사람들이었다.\n\n\"군에서 하던 거 그대로 하면 됩니다. 월급은 두 배고요.\" \"진짜 두 배예요?\" \"...한 배 반.\"\n\n진주와 사천 고등학교에 항공 정비 과정을 늘려 달라는 요청이 들어왔다. 사천 시내 원룸 빨랫줄마다 정비사들 작업복이 걸렸다."
 TFRKPHN_lg_686_a:0 "골드만삭스 서울 지점이 독립 법인이 되어 수도권 새 업무 지구로 옮겼다. 뉴욕 본사와의 결산은 내전이 터진 뒤 한 번도 이뤄지지 못했다. 다른 나라 지점들도 같은 길을 가고 있다. 한 회사였던 조직이 나라마다 하나씩 따로 금융사로 남았고, 원화로 거래되는 채권과 주식 양이 눈에 띄게 늘었다.\n\n독립 법인 첫 이사회는 영어와 한국어로 동시에 열렸다. 의장 자리에는 오래 서울 지점을 이끌어 온 한국인 대표가 앉았다.\n\n\"이제 우리 결산은 서울에서 끝납니다. 뉴욕에 전화 안 해도 돼요.\" 그가 첫 회의에서 말했다.\n\n금융 당국은 이 회사가 나라 안 위험을 키우지 않도록 감독 규정을 새로 짰다. 외국 금융사 서울 지점이 국내 금융사로 바뀐 전례가 없어서 금융감독원 국장은 규정집을 처음부터 다시 읽었다.\n\n여의도 젊은 금융인들 사이에서는 이 회사 채용 공고가 가장 큰 화제였고, 지원자는 한 주 만에 만 명을 넘었다. 원화로 결산한 첫 분기 실적은 예상보다 좋았다. 서울 금융사들은 그 실적을 보고 채용 계획을 늘렸다."
 TFRKPHN_lg_687_a:0 "망명 기업에 주는 혜택을 두고 국내 기업들 불만이 터졌다. 땅값을 깎아 주고 세금을 미뤄 주는 조건이 우리 회사들에는 없다는 것이다.\n\n경제 단체들이 같은 날 성명을 냈다. 외국 회사를 부르는 데는 반대하지 않지만 같은 권역에 먼저 들어와 있던 회사들이 더 비싼 값을 치른다는 내용이었다. 국회에서도 여야 가리지 않고 질의가 이어졌고 산업부 차관은 사흘 내리 불려 나갔다.\n\n불만이 가장 큰 건 중소기업이었다. 창원의 한 부품 회사 사장은 망명 기업이 들어선 산업단지 바로 옆에서 이십 년째 공장을 돌린다. 그가 기자에게 고지서 두 장을 내밀었다. 자기 공장 것과 옆 망명 기업 것이었다.\n\n\"같은 평수요. 숫자 좀 보소. 세 배요, 세 배. 내가 이십 년 세금 낸 기 죄요?\"\n\n산업부는 망명 기업에 혜택을 준 건 그들이 가져올 기술과 일자리 때문이라고 설명했지만, 그 설명이 옆 공장 고지서를 줄여 주지는 못했다. 여야 산업위원들은 드물게 한목소리로 정부를 몰아세웠다. 그들은 우리 회사는 언제 같은 대우를 받느냐고 물었다."
 TFRKPHN_lg_688_a:0 "미대륙을 떠난 회사들이 우리 땅에 자리 잡은 지 두 해가 지났다. 그 대륙으로 돌아가자는 말은 이제 어느 이사회에서도 안 나온다.\n\n한때 한 회사였던 조직들은 나라마다 따로 살아남았다. 이름과 상표는 같은데 주인도 따르는 법도 다르다. 본사가 남긴 특허와 설계는 그게 놓여 있던 나라 것이 됐다. 우리 몫으로 남은 조직들이 다른 나라의 형제 회사들과 어떻게 지낼지 정해야 한다."
 TFRKPHN_lg_688_b:0 "같은 이름 회사들끼리 벌써 부딪친다. 일본에 남은 조직과 우리 쪽 조직이 같은 상표로 같은 시장에 물건을 내놓았다. 유럽의 한 법원은 어느 쪽이 진짜인지 가려 달라는 소송을 받았고, 판사는 판결문 첫 줄에 이 사건은 선례가 없다고 적었다.\n\n손잡자는 제안도 들어온다. 대만에 남은 조직은 설계와 생산을 나누자고 했고 호주에 남은 조직은 특허를 서로 쓰게 하자고 했다. 산업부는 그 제안들을 표로 정리해 대통령실에 올렸다.\n\n\"나누면 커지고, 지키면 우리 몫이 남고. 둘 다 맞는 말이라 문제예요.\" 표를 만든 사무관이 한숨을 쉬었다."
 TFRKPHN_lg_691_a:0 "마이크로소프트 한국 조직이 호남권에 데이터 센터와 개발 조직을 열었다. 호남권 메가시티 에너지 농장에서 나오는 전기를 통째로 사들이는 계약도 함께 맺었다. 레드먼드가 멈춘 뒤로 우리 관공서와 회사 자료는 주인 없는 서버에 얹혀 있었는데, 이제 그 서버를 우리 땅 회사가 책임진다.\n\n데이터 센터는 영광 바닷가에 들어섰다. 근처 마을 사람들은 처음엔 이 거대한 건물이 뭘 하는지 몰랐다. 창문 하나 없는 회색 건물에서 밤낮으로 냉각 팬 소리가 들렸다. 마을 이장이 견학을 요청하자 회사는 주민들을 버스로 불러 서버실을 보여 주었다.\n\n\"저 기계들이 우리 동네 바람으로 만든 전기를 묵고 산다고? 허허, 그 바람은 원래 굴비 말리는 데나 쓰던 것인디.\" 견학을 마친 노인이 웃었다.\n\n관공서 전산 담당자들은 그 주에 큰 숨을 내쉬었다. 몇 해 동안 누가 관리하는지도 모르던 서버 계약서에 마침내 서명할 사람이 생겼다. 한 전산 주무관은 계약서 사본을 자기 서랍에도 넣었다. 데이터 센터 첫 신입 사원 가운데 셋은 영광 출신이었다."
 TFRKPHN_lg_692_a:0 "화이자 이름을 단 연구소와 생산 시설이 충청권에 문을 열었다. 오송 바이오 단지 안, 보건 당국 청사에서 멀지 않은 자리다. 뉴욕 본사가 사라진 뒤 약 허가와 제조 기술은 공장이 있는 나라마다 따로 남았다. 우리 몫으로 남은 품목은 이곳에서 만든다.\n\n첫 생산 품목은 전쟁 동안 가장 모자랐던 항생제였다. 라인이 돌기 시작한 날 식품의약품안전처 심사관들이 공장에 상주하며 첫 묶음을 검사했다. 서류가 다른 나라 기준으로 쓰여 있었다.\n\n\"이거 단위부터 다 다르네. 밤새야겠다.\" 심사관들은 그걸 우리 기준으로 다시 맞추느라 사흘 밤을 새웠다."
 TFRKPHN_lg_692_b:0 "병원 약제부들이 그 소식을 반겼다. 전쟁 동안 수입선이 막혀 전국 병원이 같은 약을 서로 나눠 쓰던 때가 있었다. 서울의 한 대학 병원 약제부장은 첫 납품 트럭이 들어온 날 창고 앞에 나와 상자를 하나하나 셌다.\n\n\"백스물, 백스물하나... 됐다. 이제 다른 병원에 전화 안 돌려도 된다.\"\n\n오송 연구소에는 우리 약학 대학 대학원생들이 하나둘 들어왔다. 그해 가을 이 공장 항생제가 처음으로 다른 나라에 수출됐다."
 TFRKPHN_lg_693_a:0 "록히드마틴 이름을 단 생산과 정비 시설이 대구경북에 문을 열었다. 구미와 그 둘레 우리 방산 업체들이 협력사로 들어갔다. 본사 생산 라인이 멈춘 뒤 이 회사 기체를 쓰는 나라들은 부품을 스스로 만들어야 했다. 우리도 그중 하나였는데 이제 그 부품 상당수가 우리 땅에서 나온다.\n\n가장 먼저 들어온 건 우리 공군 전투기였다. 전쟁 동안 부품이 모자라 다른 기체에서 떼어 붙이며 버틴 기체였다.\n\n\"동류 전환이라고 하죠. 한 대 살리려고 한 대를 뜯는 거. 이제 그 말 안 써도 되겠네요.\" 공군 정비사가 새 부품 상자를 뜯으며 말했다."
 TFRKPHN_lg_693_b:0 "구미 방산 업체 사장들은 처음엔 이 시설을 경계했다. 큰 회사가 들어오면 일감을 다 가져갈 거라고 생각했다. 막상 문을 열자 부품 주문이 그들에게 쏟아졌다.\n\n\"석 달 만에 직원이 두 배요. 내가 사람 뽑느라 면접만 보고 있다니까.\" 한 회사 사장이 투덜거리듯 자랑했다.\n\n다른 나라 공군들도 정비를 맡기겠다는 문의를 보내왔다. 국방부는 그 문의를 받을지 외교부와 협의에 들어갔다. 첫 정비를 마친 전투기는 대구 기지로 돌아가 바로 비행 훈련에 들어갔다."
 TFRKPHN_lg_694_a:0 "아마존 동아시아 물류 조직이 부울경에 본부를 열었다. 부산 항만 배후 단지에 창고가 들어섰고 그 옆으로 배송 회사들이 따라 들어오고 있다. 시애틀이 짜던 물류망은 대륙마다 잘려 그 나라 몫이 됐다. 우리 중소 업체 물건이 이 창고를 거쳐 나라 밖으로 나가기 시작했다.\n\n창고에 처음 들어온 짐 가운데 경남 한 마을에서 만든 유자청이 있었다. 그 마을 협동조합은 지금까지 국내 택배로만 팔았는데, 입점 석 달 만에 일본과 대만, 호주에서 주문이 들어왔다.\n\n\"야야, 이거 뭐라 써 있노? 영어라 하나도 모르겠다.\" \"할아버지, 호주에서 백 병 시켰대요.\" \"호주 사람들이 유자를 아나?\"\n\n창고는 밤에도 불이 꺼지지 않았다. 야간 근무자 가운데 부산 대학생과 퇴직 항만 노동자가 많았다. 한 퇴직자는 삼십 년 동안 배에서 내린 짐을 옮겼는데 이제는 배에 실을 짐을 싼다고 했다. 부산 택배 노조는 노동 조건을 두고 회사와 첫 교섭에 들어갔고,, 유자청 조합은 다음 해 수확철에 마을 청년 둘을 새로 뽑았다."
 TFRKPHN_lg_695_a:0 "샘 알트만이 서울에 정착했다. 수도권에 문을 연 연구소 책임자 자리를 맡았다.\n\n그는 1985년 시카고에서 태어나 세인트루이스 교외에서 자랐다. 스탠퍼드에서 컴퓨터과학을 공부하다 두 해 만에 그만두고 2005년 루프트라는 회사를 세웠다. 2014년부터 2019년까지 창업 지원 기관 와이콤비네이터 사장을 지냈고, 2015년 오픈AI를 함께 세운 뒤 2019년 최고경영자가 됐다.\n\n연구소 쪽은 그가 장기 체류 자격을 신청했다고 밝혔다. 돌아갈 날짜는 정해 두지 않았다."
 TFRKPHN_lg_695_b:0 "법무부 출입국 사무소는 신청서를 받은 날 짧은 보도자료를 냈다. 이름 대신 미국 국적 연구소 책임자라고만 적었지만 기자들은 금방 알아챘고, 그날 오후 연구소 앞에 카메라가 몰렸다.\n\n한국인 연구원들 사이에서는 두 가지 말이 함께 돌았다. 세계에서 가장 이름난 연구소장이 우리 층에 온다는 설렘, 그만큼 바깥 눈이 이 연구소에 쏠린다는 부담.\n\n\"요즘 지하철에서 출입증 꼭 가방에 넣어. 누가 알아보고 말 걸더라.\" \"뭐라고?\" \"취직 어떻게 했냐고.\"\n\n정부는 그가 가져올 연구 방향을 두고 관계 부처 회의를 열었다."
 TFRKPHN_lg_696_a:0 "젠슨 황이 대구경북 설계 센터에 합류했다. 샌타클래라 본사가 문을 닫은 뒤의 일이다.\n\n그는 1963년 대만 타이난에서 태어나 1972년 미국으로 건너갔다. 오리건 주립대에서 전기공학을 공부했고 1992년 스탠퍼드에서 석사 학위를 받았다. AMD와 LSI 로직에서 일한 뒤 1993년 크리스 말라초프스키, 커티스 프리엠과 함께 엔비디아를 세웠고 그때부터 줄곧 최고경영자였다."
 TFRKPHN_lg_696_b:0 "그가 맡은 일은 세 나라를 잇는 것이다. 태평양 방위 조약기구가 회원국 사이 기술 이전과 인력 이동을 보장하면서 길이 열렸다. 설계는 한국이, 생산은 전쟁을 버텨 낸 대만 공장이, 소재와 장비는 일본이 맡는다. 그는 셋 가운데 하나만 빠져도 칩은 안 나온다고 했다.\n\n센터의 한국인 설계자들은 첫 전체 회의 날 아침 일찍 나왔다. 회의실 의자가 모자라 몇은 벽에 기대 섰다.\n\n\"가죽 재킷 진짜 입고 오네.\" \"쉿, 들린다.\"\n\n대구 지역 신문은 그날 일 면에 대구로 온 칩이라는 제목과 센터 건물 사진을 크게 실었다. 첫 달 대구 대학원생들은 실습 자리를 두고 줄을 섰다."
 TFRKPHN_lg_6970_a:0 "국방부 앞에 검은 옷을 입은 사람들이 모였다. 맨 앞 어머니가 든 팻말에 우리 아들 살려내라는 글씨가 삐뚤게 적혀 있었다. 훈련 중 사고로 숨졌다는 통지서를 받은 장병들의 유족이었다.\n\n그들의 아들들은 대만해협에서 숨졌다. 사람들은 오래전부터 알음알음 알고 있었다. 부산항에서 밤마다 떠나는 화물선과 국적 표시를 지운 수송기, 휴가 나와서도 어디 다녀왔는지 말 못 하는 장병들 얘기가 술자리마다 돌았다. 그러다 외신이 대만 남부 해안에 떨어진 우리 수송기 잔해 사진을 실었고, 다들 짐작만 하던 일이 뉴스 첫머리에 올랐다. 서류상 중립국인 나라가 실제로는 군대를 보냈다는 사실이 처음으로 큰 논란이 됐다."
 TFRKPHN_lg_6970_b:0 "여론은 둘로 갈렸다. 대만을 지킨 건 잘한 일이라는 사람도 많았지만, 다 알던 일을 왜 끝까지 숨겼느냐는 물음에는 정부도 여당도 답하지 못했다. 여당 지지율이 조금 내려갔다.\n\n그날 오후 유족들은 해가 질 때까지 국방부 청사 앞을 떠나지 않았다. 국방부 국장 하나가 나와 얘기를 듣겠다고 했다.\n\n\"국장 말고 장관 나오라 그래! 우리 애를 보낸 사람이 나와야지!\"\n\n장관은 끝내 나오지 않았다. 그 장면이 저녁 뉴스 첫 화면에 걸렸다."
 TFRKPHN_lg_6971_a:0 "유족들이 국가를 상대로 손해배상 소송을 내려다 벽에 부딪혔다. 헌법 제29조 제2항은 군인과 경찰 등이 전투나 훈련 같은 직무 중에 입은 손해에 대해서는 법률이 정한 보상 말고는 국가에 배상을 청구할 수 없게 막고 있다. 1967년 국가배상법을 고치면서 처음 들어온 이 규정을 사람들은 이중배상 금지라고 부른다.\n\n유족들은 거짓 통지서로 진실을 가린 나라가 보상금 몇 푼으로 끝내려 한다며 이 조항을 없애라고 요구했다. 헌법 조항이라 법률만 고쳐서는 없앨 수 없다. 개헌안에 넣자는 쪽, 특별법으로 보상을 크게 늘리자는 쪽, 나라 재정과 군의 형평을 생각하면 그대로 둬야 한다는 쪽이 맞섰다.\n\n유족 단체 변호사들은 그 주에 헌법재판소에 낼 의견서를 쓰기 시작했다.\n\n\"이 조항 생긴 지 쉰 해가 넘었는데, 그 앞에서 멈춘 유족이 몇이나 되는지 세어 본 사람이 없어요. 우리가 처음 세 보려고요.\"\n\n다음 달 국회 헌법개정특별위원회가 이 조항을 논의 목록에 올렸다. 유족들은 그 회의를 방청석에서 지켜보기로 했다."
 TFRKPHN_lg_6975_a:0 "착공 물량이 31만 호를 넘었다. 오세훈이 2026년 5월 서울시장 선거에서 내건 숫자를 대통령이 되어 나라 전체에서 채웠다.\n\n재개발 구역마다 타워크레인이 섰고 모아주택과 상생주택 입주 추첨에는 매번 사람이 몰렸다. 속도를 낸 만큼 밀려난 세입자 이야기도 함께 쌓였다. 국토교통부는 첫 입주가 시작되는 두 해 뒤부터 집값이 본격적으로 안정될 거라고 보고했다.\n\n첫 입주 단지 모델하우스에 그 주말 수만 명이 몰렸다. 밀려난 세입자 몇은 그 줄에 서지 못했다. 그들은 그 단지 공공 임대 몫을 기다렸다. 국토교통부는 그 몫의 첫 추첨 날짜를 다음 달로 잡았다."
 TFRKPHN_lg_6975_b:0 "국토교통부 주택 담당 국장은 그 숫자를 보고서에 적으며 한 줄을 덧붙였다. 숫자가 크다고 다 끝난 건 아니다. 착공과 입주 사이에는 두 해가 있고 그사이 공사비와 금리와 사람 마음이 바뀔 수 있다.\n\n대통령은 보고를 받은 날 저녁 첫 입주 예정 단지 공사 현장을 찾았다.\n\n\"첫 열쇠는 누가 받습니까?\" 현장 소장이 물었다. \"밀려났던 세입자 가운데 한 분이 받으셨으면 좋겠네요.\""
 TFRKPHN_lg_6976_a:0 "장마 전선이 수도권에 걸려 하루에 한 달 치 비가 쏟아졌다. 강남역 일대 땅 밑 빗물터널이 처음으로 제 몫을 했다. 도로 몇 곳이 잠깐 잠겼지만 물은 몇 시간 만에 빠졌고, 반지하에서 옮겨 간 사람들 집은 젖지 않았다.\n\n재난 문자는 비가 쏟아지기 한 시간 전에 나갔고 다음 날 아침 출근길은 평소와 다르지 않았다.\n\n빗물터널 상황실 근무자들은 밤새 모니터 앞을 떠나지 않았다. 새벽 세 시, 터널 수위가 칠 할까지 차올랐다.\n\n\"버틴다. 이번엔 버틴다.\" 근무자 하나가 화면을 노려보며 중얼거렸다. 해가 뜰 무렵 수위가 내려가기 시작했다."
 TFRKPHN_lg_6976_b:0 "몇 해 전 같은 비에 반지하가 잠겼던 동네 주민들은 이번 비를 다른 곳에서 맞았다. 반지하에서 옮겨 간 공공 임대 주택 창문으로 그들은 빗줄기를 내려다봤다.\n\n\"비 오는 밤에 잠을 다 자 보네. 맨날 물 퍼낼 양동이 옆에 두고 잤는데.\"\n\n서울시는 장마가 끝나면 빗물터널 두 곳을 더 짓는 계획을 앞당기기로 했고, 시의회에서는 공사비를 두고 다시 말이 오갈 참이었다. 그날 오후 강남역 사거리의 한 상인이 몇 해 전 물에 잠겼던 가게 벽 자국을 손으로 쓸어 봤다. 이번에는 그 위로 물이 오르지 않았다."
 TFRKPHN_lg_6977_a:0 "큰 태풍이 남해안에 올라왔다. 사흘 전부터 어선들이 항구로 돌아왔고 해안가 주민들은 미리 대피소로 옮겼다. 바람에 간판 몇 개가 떨어지고 잠깐 정전이 이어졌지만 크게 다친 사람은 없었다. 지자체들은 매뉴얼 순서대로 움직였고 복구는 이틀 만에 끝났다.\n\n매뉴얼은 얇았다. 마을마다 한 장짜리 표가 붙어 있었다. 누가 누구에게 전화를 걸고 누가 어느 집 노인을 데리고 나오는지 이름과 함께 적혀 있었다. 통영의 한 마을에서는 이장이 그 표를 들고 집집마다 문을 두드렸다.\n\n\"할매! 나오이소! 표에 내가 할매 담당이라 돼 있다!\""
 TFRKPHN_lg_6977_b:0 "대피소에서는 하룻밤 사이 작은 잔치가 벌어졌다. 주민들이 가져온 반찬을 한데 모아 저녁을 먹었고 소방관 하나는 아이들에게 소방차를 구경시켜 줬다.\n\n태풍이 지나간 다음 날 아침 어민들은 서둘러 바다로 나갔다. 부서진 그물을 손보는 손이 바빴다. 정부는 피해 조사를 하루 만에 끝내고 보상금을 일주일 안에 주기로 했다. 지난번 태풍 때는 같은 일에 석 달이 걸렸다.\n\n행정안전부는 그 마을의 한 장짜리 표를 다른 지자체에도 그대로 보내기로 했다. 표 맨 아래에는 이장 전화번호가 적혀 있었다."
 TFRKPHN_lg_6979_a:0 "장마 전선이 수도권에 걸려 하루에 한 달 치 비가 쏟아졌다. 저지대 도로가 잠기고 차들이 물에 떠다녔다. 반지하 집에 물이 허리까지 찼고 몇몇 집에서는 사람들이 창문으로 겨우 빠져나왔다.\n\n재난 문자는 물이 이미 들어찬 뒤에야 나갔다. 야당은 매뉴얼은 어디 있었느냐고 따졌다.\n\n관악구의 한 반지하 집에서는 이웃 청년이 창살을 뜯어 노부부를 끌어냈다.\n\n\"할아버지, 손! 손 주세요! 짐은 놔두고요!\"\n\n청년은 다음 날 뉴스에 나왔지만 이름을 밝히지 않았다. 노부부 살림은 거의 다 물에 잠겼다. 할머니는 젖은 사진첩을 햇볕에 한 장씩 말렸다."
 TFRKPHN_lg_6979_b:0 "구청 상황실은 그날 밤 전화가 끊이지 않았다. 어느 기관이 어느 도로를 막아야 하는지 두고 경찰과 구청이 서로 전화만 돌렸다. 그사이 차 몇 대가 물이 찬 지하 차도로 들어갔다.\n\n비가 그치자 정부는 몇 해 전에도 내놓았던 반지하 주택 감축 계획을 다시 꺼냈다. 주민들은 이번엔 진짜냐고 물었다.\n\n젖은 사진첩을 말리던 할머니 사진이 다음 날 여러 신문 일 면에 실렸다. 그 아래 몇 해 전에도 같은 동네에서 같은 일이 있었다는 기사가 붙었다."
 TFRKPHN_lg_6980_a:0 "큰 태풍이 남해안에 올라왔다. 대피 명령이 늦게 나가는 바람에 해안가 마을 몇 곳이 고립됐다. 지하 주차장에 물이 차서 차를 빼러 내려간 주민들이 위험에 빠졌다가 가까스로 구조됐다. 어느 기관이 뭘 해야 했는지 두고 책임 공방이 이어졌다.\n\n고립된 마을 한 곳은 이틀 동안 전기와 물이 끊겼다. 노인들이 마을 회관에 모여 촛불을 켜고 버텼다. 구조대는 사흘째 아침에야 닿았다.\n\n\"전화 끊기고 나서는 아무도 우리가 여기 있는 줄 몰랐소. 아무도.\" 이장이 구조대원 손을 붙잡고 말했다."
 TFRKPHN_lg_6980_b:0 "지하 주차장 사고가 난 아파트 주민들이 관리 사무소에 항의했다. 관리 사무소는 구청에서 아무 연락도 못 받았다고 했고 구청은 문자를 보냈다고 했다. 그 문자는 태풍 상륙 한 시간 뒤에 나간 것으로 드러났다.\n\n태풍이 지나간 뒤 국회가 재난 대응 청문회를 열었다.\n\n\"매뉴얼은 있었습니다. 지켜지지 않았을 뿐입니다.\" 행정안전부 장관이 답하자 야당 의원이 되물었다. \"그럼 매뉴얼이 없는 거랑 뭐가 다릅니까?\"\n\n청문회가 끝난 날 저녁, 고립됐던 마을 이장은 마을 회관 벽에 비상 연락처를 손으로 적어 붙였다."
 TFRKPHN_lg_6981_a:0 "디딤돌소득을 받는 가구가 60만을 넘었다. 서울에서 500가구로 시작한 제도다.\n\n2025년 5월 토론회에서 서울시가 내놓은 수치는 탈수급 8.6퍼센트, 근로소득이 늘어난 가구 31.1퍼센트였다. 오세훈은 그 자리에서 이렇게 말했다.\n\n\"이미 효과가 입증된 디딤돌소득과 서울런의 전국화는 우리사회 양극화 해소에 결정적인 변혁을 가지고 올 것\"\n\n대통령이 된 그는 그 말을 전국에서 시험했다. 보건복지부는 이번 달 통계에서 처음으로 상대적 빈곤율이 한 해 사이 눈에 띄게 내려갔다고 보고했다. 야당은 재정 부담을 따졌고 정부는 다음 예산안에서 답하겠다고 했다.\n\n받은 가구 가운데에는 처음으로 수급에서 벗어난 집도 있었다. 대전의 한 어머니는 그 돈으로 미용 자격증을 따고 이제 동네 미용실에서 가위를 잡는다.\n\n\"계단 하나였어요, 이 돈이. 딱 한 칸. 근데 그 한 칸이 없으면 못 올라가요.\"\n\n동네 미용실 단골들은 그 사연을 처음부터 다 알았다. 그들은 머리를 맡기며 그 계단 얘기를 몇 번이고 다시 물었다."
 TFRKPHN_lg_6982_a:0 "취임 넉 달째 되는 주 목요일, 오세훈 대통령이 여당 의원 전원을 대통령실로 불렀다. 대통령이 의원 전원과 마주 앉은 건 이번 정부 들어 처음이다. 의원들이 타고 온 버스 석 대가 대통령실 앞마당에 줄지어 섰다.\n\n그는 지난 대선 결과부터 꺼냈다. 국민은 전쟁을 이긴 정당을 다시 골랐지만 그 정당 목소리가 계속 커지길 바란 건 아니라고 했다. 표를 준 사람 절반이 이번만 찍었다고 답한 출구조사도 함께 내밀었다."
 TFRKPHN_lg_6982_b:0 "대통령은 당 강령과 공천 방식을 바꾸자고 했다. 전쟁 시기에 들어간 비상 대응 조항을 강령에서 빼고 다음 총선부터 지역구 공천 절반을 국민 여론조사로 정하자는 안이었다.\n\n회의장에 한동안 말이 없었다. 회의가 끝나고 한 초선 의원이 기자들에게 대통령이 당을 다시 짓자고 했다고 전했다. 원내대표는 의원총회에서 다시 논의하겠다고만 했다.\n\n돌아가는 버스 안은 조용하지 않았다. 앞자리 중진들은 창밖만 봤고 뒷자리 초선들은 휴대전화로 지역구 당원들에게 문자를 보냈다.\n\n\"야, 벌써 기사 떴다.\" \"우리 아직 국회 도착도 안 했는데?\""
 TFRKPHN_lg_6983_a:0 "당 개혁안 초안이 공개되고 사흘 만에 여당 의원 스물한 명이 성명을 냈다. 대부분 전쟁 시기에 국방위와 정보위에서 일한 의원들이다.\n\n성명은 전쟁을 이긴 원칙을 버리면 다음 위기에 나라를 못 지킨다고 적었다. 이름을 밝히지 않은 한 중진은 대통령이 야당 표를 얻으려고 당을 내준다고 기자들에게 말했다.\n\n그날 저녁 보수 성향 유튜브 채널 몇 곳이 대통령을 배신자라고 불렀다. 같은 날 발표된 여론조사에서는 당 개혁 찬성이 열에 여섯이었다. 당원만 따로 물은 조사에서는 숫자가 거꾸로 나왔다."
 TFRKPHN_lg_6983_b:0 "지역구 분위기도 갈렸다. 대구의 한 당원 협의회는 개혁안 반대 결의문을, 경기도의 한 협의회는 찬성 결의문을 냈다. 같은 당의 두 결의문이 같은 날 같은 신문 같은 면에 나란히 실렸다.\n\n대통령실은 성명에 직접 답하지 않았다. 비서실장은 그날 저녁 여당 원내대표와 두 시간 동안 만났다. 다음 총선 공천 규칙은 아직 정해지지 않았다.\n\n그 주 금요일, 성명에 이름을 올린 의원 둘이 지역구 당원들 전화를 받고는 조용히 이름을 빼 달라고 했다."
 TFRKPHN_lg_6984_a:0 "여당이 전당대회를 열고 새 강령을 통과시켰다. 첫 줄에 따뜻한 보수가, 둘째 줄에 약자와의 동행이 들어갔다.\n\n전쟁 시기에 들어간 비상 대응 조항은 부칙으로 옮겨졌다. 대의원 열에 셋이 반대했다. 강경파 의원들은 표결 직전 자리를 떴지만 탈당한 사람은 없었다. 개혁안을 처음부터 지지해 온 한동훈은 표결이 끝난 뒤 대통령과 나란히 연단에 올라 새 강령을 들어 보였다.\n\n전당대회장 밖에서는 전쟁 유족 모임 회원 몇이 조용히 팻말을 들고 서 있었다. 팻말에는 잊지 말아 달라는 한 문장만 적혀 있었다. 새 강령은 부칙에 전쟁 희생자를 기억하는 조항을 따로 두었다."
 TFRKPHN_lg_6984_b:0 "여론조사에서 여당 지지율이 한 달 사이 4퍼센트포인트 올랐다. 오른 몫은 대부분 스스로 중도라고 답한 사람들에게서 나왔다. 대통령은 전당대회 축사에서 이제 보수가 지키는 건 사람이라고 했다.\n\n대의원들이 빠져나간 체육관에서 당직자들이 의자를 접었다. 한 당직자가 접은 의자 위에 놓인 옛 강령 책자를 주워 가방에 넣었다.\n\n\"그건 왜 챙겨?\" \"나중에 애들한테 보여 주려고. 이런 때도 있었다고.\"\n\n그날 밤 당 홈페이지 첫 화면이 바뀌었다. 새 강령 첫 두 줄만 크게 적혀 있었다."
 TFRKPHN_lg_6985_a:0 "한강버스가 출근 시간에도 빈자리 없이 오가기 시작했다. 2025년 9월 첫 운항 직후에는 잦은 고장으로 운항을 멈추고 시장이 사과한 일도 있었다. 그 뒤 배를 손보고 선착장을 늘린 끝에 이제는 수도권 물길을 잇는 교통수단이 됐다.\n\n강변 낡은 주차장 자리에 일터와 공원이 들어섰다. 땅 밑에서는 빗물터널이 완공돼 첫 장마를 무사히 넘겼고 강남역 사거리는 그해 여름 한 번도 물에 잠기지 않았다.\n\n아침 일곱 시 반 잠실 선착장에 출근하는 사람들이 줄을 섰다. 배 안에서 매일 신문을 읽는 노인도 있었다. 처음 배가 고장 났을 때 다시는 안 탄다고 했던 사람이다.\n\n\"선장, 오늘도 안 서고 가지?\" \"어르신, 그 얘기 그만하세요. 일 년째 안 섰어요.\"\n\n강변 새 공원에서는 주말마다 장터가 열렸고 낡은 주차장 자리를 아이들이 뛰어다녔다. 공원 한쪽에 처음 고장 난 한강버스 사진과 시장이 사과한 날짜를 적은 작은 안내판이 섰다. 실패도 기록으로 남기자는 뜻이었다. 국토교통부는 한강 방식을 낙동강과 금강에도 적용하는 계획을 내놓았다."
 TFRKPHN_lg_6986_a:0 "북한강과 남한강, 팔당, 임진강 댐들이 한 상황실에서 함께 움직이기 시작했다. 큰비가 예보되면 소양강댐과 충주댐이 미리 물을 빼고 팔당은 하류 수위를 보며 문을 연다. 임진강에서는 군남홍수조절지와 한탄강댐이 북쪽에서 내려오는 물을 받아 낸다.\n\n댐마다 새 발전 설비가 돌면서 강원과 충청 공업 지대에도 전기가 넉넉해졌다. 환경부는 올여름 한강 수계에 홍수 특보가 내려진 날이 지난해의 절반이었다고 밝혔다."
 TFRKPHN_lg_6986_b:0 "통합 상황실은 과천의 한 건물 지하에 차려졌다. 벽 한 면을 가득 채운 화면에 한강 수계 댐과 수위 관측소가 점으로 찍혀 있다. 큰비 오는 밤이면 근무자 여섯 명이 그 점들 색이 바뀌는 걸 지켜본다.\n\n임진강 쪽 근무자들은 따로 맡은 일이 있다. 북쪽 댐이 예고 없이 물을 내려보낼 때를 대비하는 것이다. 연천의 한 마을 이장은 몇 해 전 북쪽에서 갑자기 내려온 물에 이웃을 잃었다. 그는 이제 상황실 문자를 휴대전화 첫 화면에 띄워 둔다.\n\n\"문자 오면 바로 마을 방송 틀어. 그때처럼은 안 당해.\"\n\n물을 다스리는 일은 전기를 만드는 일이기도 했다. 강원도 공단 몇 곳은 그해 처음으로 정전 없이 여름을 났다."
 TFRKPHN_lg_698_a:0 "미국 내전이 끝날 기미를 보이지 않는다. 곧 끝나리라 믿고 버티던 사람들이 두 해 만에 짐을 싸기 시작했다.\n\n처음 건너온 이들은 본사가 무너진 회사 사람들이었다. 이번에는 공장과 연구실을 끝까지 지키던 기술자와 교수, 그 가족들이다. 인천공항 입국장에 영어 안내판이 새로 걸렸고 먼저 온 회사들이 마중을 나왔다. 대륙에 남아 있던 큰 회사 두 곳도 우리 정부에 자리를 물어 왔다."
 TFRKPHN_lg_698_b:0 "입국장에서 가장 많이 보인 건 아이들이었다. 두 해 동안 학교를 제대로 못 다닌 아이들이 부모 손을 잡고 낯선 안내판을 올려다봤다. 교육부는 외국인 학교 정원을 늘리고 공립 학교에 영어로 수업을 도울 교사를 보내기로 했다.\n\n먼저 건너와 자리 잡은 사람들이 새로 온 사람들 집과 학교를 찾아 주었다. 판교의 한 아파트 단지에는 미국에서 온 가족이 스무 집 넘게 모였고, 놀이터에서 한국어와 영어가 섞인 아이들 말소리가 들렸다.\n\n\"너 이거 뭔지 알아? 미끄럼틀.\" \"Slide!\" \"미, 끄, 럼, 틀.\"\n\n모두가 반긴 건 아니다. 집값과 학교 자리를 걱정하는 목소리도 함께 커졌다."
 TFRKPHN_lg_6992_a:0 "여당 의원 열네 명이 한꺼번에 탈당계를 냈다. 맨 앞에서 서류를 낸 사람은 장동혁 의원이었다. 그는 국회 소통관에서 이 당에서는 더는 전쟁을 이긴 당의 얼굴을 찾을 수 없다고 말했다.\n\n일주일 뒤 이들은 모두 우리공화당에 입당했다. 원외에 머물던 우리공화당이 하루아침에 국회 의석 열네 개를 가진 정당이 됐고, 당사 앞에 초록 깃발이 걸렸다.\n\n여당 당사 분위기는 무거웠다. 탈당한 의원들 방에서 보좌진이 짐을 쌌다. 의원을 따라가지 않고 남겠다는 보좌관도 몇 있었다.\n\n\"형, 잘 가요.\" \"너는... 그래, 여기 있어라. 밥 한번 먹자.\"\n\n같은 방에서 여러 해 일한 사람들이 복도에서 어색하게 작별했다."
 TFRKPHN_lg_6992_b:0 "대통령실은 하루 종일 말을 아꼈다. 여당은 과반을 지켰지만 표결마다 셈이 복잡해졌다. 여당 지지율은 한 주 사이 3퍼센트포인트 내려갔고 개혁안은 멈추지 않았다.\n\n그날 밤 방송사들은 국회 의석 그래픽을 새로 그렸다. 지금까지 한 색이던 여당 의석이 두 색으로 갈라졌다.\n\n우리공화당 첫 의원총회는 당사 근처 작은 회의실에서 열렸다. 의자가 모자라 몇은 서서 회의를 했다."
 TFRKPHN_lg_6996_a:0 "방금 서울에서 들어온 소식에 따르면, 2027년 대한민국 제21대 대통령 선거에서 여당인 국민의힘 오세훈 후보가 당선됐다. 오래 서울시장을 지낸 그가 이번에는 나라 전체를 맡는다.\n\n같은 당 후보였지만 그가 내건 말은 전임 정부와 결이 달랐다. 약자와의 동행과 따뜻한 보수를 앞세운 그는 강경 노선에 지친 중도층 표를 크게 끌어왔다. 출구조사에서는 스스로 중도라고 답한 유권자 절반 넘게 그를 찍었다.\n\n개표가 끝난 새벽 서울시청 앞 광장에 시청 직원 몇이 나와 떠나는 시장을 배웅했다. 그는 건물을 한 번 돌아보고 차에 올랐다.\n\n외신들은 그의 당선을 같은 당 안의 방향 전환으로 봤다. 양안전쟁을 치른 정당에 다시 표를 주면서 국민이 한결 부드러운 얼굴을 골랐다는 분석이었다. 도쿄와 베이징은 새 정부 대외 정책을 지켜보겠다고 했다.\n\n당선이 확정된 날 아침 서울의 몇몇 외국 대사관이 새 대통령의 서울시장 시절 정책을 정리한 보고서를 본국에 보냈다. 한 대사관 보고서 첫 장에는 약자와의 동행이라는 말이 한국어 그대로 적혀 있었다."
 TFRKPHN_lg_6997_a:0 "대통령과 야당 대표가 마주 앉은 다음 날 아침, 여당 의원총회는 예정보다 한 시간 늦게 끝났다. 회의장 문밖까지 고성이 새어 나왔고 문 앞 기자들은 안에서 오가는 말을 받아 적느라 바빴다.\n\n강경파 맨 앞에 장동혁 의원이 섰다. 그는 회담 합의문의 한 줄을 문제 삼았다. 전쟁 시기에 만든 비상 입법 몇 개를 여야가 함께 다시 살펴보자는 내용이었다. 장 의원은 마이크도 없이 소리쳤다. 이럴 거면 국민의힘을 탈당하고 민주당으로 가라는 말이었다.\n\n몇몇 의원이 박수를 쳤다. 그 한마디가 그날 저녁 모든 방송 첫 화면에 걸렸다."
 TFRKPHN_lg_6997_b:0 "국회는 그 어느 때보다 시끄러웠다. 장동혁 의원을 앞세운 강경파 쪽에서는 그럴 거면 탈당하라고 고함쳤고, 대통령 편에서는 욕설로 맞받았다.\n\n야당에서도 말이 나왔다. 계속 이럴 거면 왜 함께하자고 한 거냐?\n\n그에게 중대한 결정이 다가왔다. 어느 쪽을 고르든 누군가는 등을 돌릴 거다. 야당과 함께 갈 것인가, 여당을 달랠 것인가."
 TFRKPHN_lg_6998_a:0 "안심소득 전면 시행 첫해 예산이 국회 예산결산특별위원회에 올라왔다. 정부는 기존 현금 복지 일곱 가지를 하나로 묶어 늘어나는 돈을 줄였다고 설명했다.\n\n여당 강경파 의원 열여섯 명이 표결 전날 장동혁 의원 방에 모였다. 장 의원은 민주당 공약을 우리 정부가 대신 해 주는 꼴이라며 수정안을 앞장서 냈다. 시행 지역을 수도권과 일부 광역시로 줄이고 나머지는 3년 뒤에 다시 논의하자는 안이었다."
 TFRKPHN_lg_6998_b:0 "수정안이 통과되면 정부안은 반쪽이 된다. 정부안을 그대로 밀면 여당 표가 갈려서 야당 표를 빌려야 한다. 야당은 안심소득 자체에는 찬성한다고 밝혀 왔다. 예결위 간사들이 밤늦게까지 남은 표를 셌지만 몇 표 차라 어느 쪽도 장담할 수 없었다.\n\n표결은 금요일 오후 두 시였다. 국회 앞에 시범 사업에 참여한 가구 몇십 명이 피켓을 들고 섰다. 한 어머니는 지원금으로 낸 아이 학원비 영수증을 코팅해 들고 왔다.\n\n표결 전날 밤 정무수석이 여당 의원 방을 차례로 돌았다. 마지막 방 의원은 문을 열어 주지 않았다.\n\n\"의원님, 계신 거 압니다. 이것만 두고 갈게요.\"\n\n수석은 문 앞에 시범 사업 가구들이 보낸 편지 묶음을 놓고 돌아갔다."
 TFRKPHN_lg_6999_a:0 "정부가 비상 태세를 풀겠다고 발표하고 열흘 만에 국회 국방위원회가 긴급 현안 질의를 열었다. 이번 질의는 여당 의원들이 요구했다.\n\n여당 국방위원 다섯이 국방부 장관을 상대로 네 시간 동안 질문을 이어 갔다. 북쪽 국경 경계 병력, 예비군 동원 기간, 해상 초계 횟수가 모두 주는 게 맞는지 하나씩 따졌다.\n\n\"민주당 정부도 이렇게 빨리는 안 풀었을 겁니다, 장관님.\" 한 의원이 쏘아붙였다."
 TFRKPHN_lg_6999_b:0 "예비역 장성 모임은 같은 날 성명을 내고 단계적 해제를 요구했다. 국방부는 해제 일정을 이미 각 부대에 내려보낸 뒤였다. 몇몇 부대에서는 벌써 전역 버스가 위병소 앞에 줄을 서 있었다. 일정을 다시 늦추면 그 버스들을 돌려보내야 한다.\n\n질의가 끝나자 장관은 곧장 대통령실로 올라왔다. 그가 든 서류철에 부대별 해제 날짜가 빼곡했고, 맨 앞 장에 가족들이 부대에 보낸 편지 몇 통이 끼워져 있었다.\n\n그중 한 통은 어느 예비역 하사의 아내가 쓴 편지였다. 남편이 두 해째 집에 못 와서 아이가 아빠 얼굴을 사진으로만 안다고 했다. 장관은 그 편지를 맨 위에 올려 두었다."
 TFRKPHN_lg_7000_a:0 "정부가 2050 탄소중립 이행 계획을 내놓자 공업 지역에 지역구를 둔 여당 의원들이 먼저 들고일어났다. 계획에는 석탄 발전소 열한 곳을 앞당겨 닫고 제철과 석유화학 공장에 탄소 배출 한도를 두는 내용이 들어 있었다.\n\n의원 열네 명이 연판장을 돌렸다. 화력 발전소가 있는 충남 보령이 지역구인 장동혁 의원이 맨 앞에 이름을 올렸다. 전쟁 때 탄약과 군함을 만든 공장들이 이제 겨우 숨을 돌리는데 문을 닫으라는 말이냐고 적었다. 장 의원은 기자들 앞에서 이건 민주당이 십 년 전에 내놓은 공약을 그대로 베낀 거라고 말했다."
 TFRKPHN_lg_7000_b:0 "울산과 포항 노조도 같은 주에 집회를 열었다. 노조는 탄소중립 자체보다 일자리 전환 지원이 빠진 걸 문제 삼았다.\n\n\"발전소 닫히면 우리 애들은 이 도시에서 뭐 하고 사노. 다 서울 가라 카나?\" 한 제철소 노동자가 확성기에 대고 외쳤다.\n\n같은 날 환경부와 산업부 장관이 서로 다른 보고서를 들고 대통령실 문을 두드렸다. 환경부 보고서에는 석탄 발전소를 안 닫으면 2030년 목표를 못 지킨다는 표가 있었다. 산업부 보고서에는 발전소가 닫히면 일자리를 잃는 사람 수가 지역별로 적혀 있었다. 두 표의 숫자는 둘 다 맞았다."
 TFRKPHN_lg_7001_a:0 "총선 개표가 끝나자 우리공화당은 아홉 석을 얻었다. 지역구 다섯, 비례대표 넷이다. 지난번 탈당한 의원 열네 명 가운데 국회로 돌아온 사람은 절반이 안 됐다.\n\n그래도 당선자 명단에서 가장 눈길을 끈 이름은 따로 있었다. 조원진 대표가 대구에서 지역구를 되찾았고 비례대표 1번에는 황교안 전 국무총리가 이름을 올렸다. 지난 대선에서 오세훈에게 밀려난 두 사람이 나란히 국회로 돌아왔다."
 TFRKPHN_lg_7001_b:0 "당사 앞 개표 상황실에서 초록 깃발이 밤늦게까지 흔들렸다. 보수표가 둘로 갈린 지역에서는 민주당 후보가 어부지리로 이긴 곳도 여럿 나왔다.\n\n\"보수가 또 두 개야. 이거 몇 번째냐.\" 정치권에서 그런 말이 돌았다. 여당 지도부는 논평을 다음 날로 미뤘고, 다음 날 아침 원내 지도부가 의석 계산표를 새로 그렸다.\n\n우리공화당 당선자 아홉 명은 다음 날 아침 국회 소통관에 함께 서서 사진을 찍었다. 그 가운데 몇은 몇 해 만에 국회 출입증을 다시 받았고, 사진 속 그들은 모두 초록 넥타이를 매고 있었다."
 TFRKPHN_lg_7004_a:0 "헤이그 국제형사재판소 첫 공판이 오전 아홉 시 반에 열렸다. 한국 정부가 로마 규정 당사국으로서 사태를 회부한 지 다섯 달 만이었다. 법정 경위들이 방탄유리 문을 닫자 장내가 조용해졌다.\n\n서아프리카 출신 수석 검사가 검사석에 섰다. 그는 낮고 고른 목소리로 공소장을 한 시간 넘게 읽었고 한 번도 원고에서 눈을 떼지 않았다. 정치범 수용소, 민간인 거주지에 쏟아진 포격, 항복한 포로의 처형. 죄목이 하나 넘어갈 때마다 방청석의 탈북민 증인들이 고개를 숙였다."
 TFRKPHN_lg_7004_b:0 "발언 기회를 얻은 피고인은 이 법정에 자기를 재판할 권한이 없다고 했다. 재판장은 그 주장을 기록에 남기겠다고만 답했다. 재판소가 지정한 변호인 셋은 관할 문제를 서면으로 다시 내겠다고 했다.\n\n서울 시각으로 저녁 다섯 시 반, 모든 방송이 공판을 생중계했다. 국회 몇몇 의원은 그래도 우리 법정에 세웠어야 했다고 다시 말했다. 판결까지는 몇 해가 걸리고 사형은 없다. 국제 재판의 가장 무거운 형은 종신형이다.\n\n그날 밤 헤이그 주재 한국 대사관 직원이 증인들을 호텔까지 데려다주었다. 버스 안에서 한 증인이 창밖 운하를 바라봤다.\n\n\"수용소에 있을 때, 이런 데 앉아 있는 걸 생각해 본 적이 없시요. 한 번도.\""
 TFRKPHN_lg_7005_a:0 "서울중앙지방법원 417호 대법정. 이 나라 전직 대통령들이 섰던 그 자리에 오늘은 평양의 마지막 세습자가 섰다. 방청권 추첨에 일만 명 넘게 몰렸다.\n\n공소장 죄목은 세 가지였다. 전쟁 도발, 민간인 학살, 포로 처형. 피고인은 대한민국 법원을 인정하지 않는다는 말만 남겼다. 사건을 맡겠다는 변호사가 끝내 나서지 않아 법원이 국선변호인을 지정했다. 경력 열다섯 해의 그는 첫 공판 내내 담담하게 절차만 짚었다."
 TFRKPHN_lg_7005_b:0 "맨 앞줄에 유가족이 앉았다. 개전 첫날 포격에 아들을 잃은 노인이 증인석에 섰다가 끝내 말을 잇지 못하고 내려왔다. 재판장은 한참 증인석 쪽을 보다가 십 분간 휴정을 알렸다.\n\n법원 밖에서는 사형을 구하라는 쪽과 사형만은 안 된다는 쪽이 길 하나를 사이에 두고 맞섰다. 이 나라는 1997년 겨울 이후 사형을 집행한 적이 없다. 브뤼셀은 사형 구형을 우려한다는 서한을 보내왔고, 검찰은 구형을 앞두고 대통령실의 뜻을 물었다.\n\n공판이 끝난 저녁 국선변호인은 법원 뒷문으로 나갔다. 기자들 질문에는 답하지 않고 지하철역으로 걸어갔다. 그날 밤 그의 사무실 전화는 새벽까지 울렸다."
 TFRKPHN_lg_7006_a:0 "김정은이 생포된 지 이레, 강계로 물러난 북한 잔존 정권에서 새 소식이 들어왔다. 동생 김여정이 당과 군 직책을 모두 넘겨받고 최고 영도자 자리에 올랐다는 첩보다.\n\n조선중앙방송은 오빠의 생포를 끝내 인정하지 않았다. 방송은 그를 원쑤들에게 납치된 수령이라 부르며 그가 돌아올 때까지 동생이 대신 나라를 지킨다고 했다. 같은 내용을 하루에 열두 번 되풀이했다."
 TFRKPHN_lg_7006_b:0 "정보기관 판단은 달랐다. 수도는 이미 무너졌고 남은 부대는 산골짜기에 흩어져 있다. 강계 둘레 부대 몇은 보급이 끊겨 민가 곡식을 털고 있다는 보고가 올라왔다. 투항하는 병사들은 하나같이 새 지도자 이름을 처음 듣는 사람처럼 굴었다.\n\n국가정보원 분석관은 보고서 끝에 남은 정권이 몇 주밖에 못 버틴다는 짧은 한 줄을 붙였다. 지도자를 산 채로 내준 정권에서 백두혈통의 마지막 이름이 붙잡을 게 많지 않다는 판단이었다.\n\n그 주에 압록강 쪽 산길에서 투항한 소대장 하나가 심문관에게 말했다.\n\n\"새 지도자 동지 사진이요? 아직 한 장도 못 받았시요. 얼굴도 모르는 사람을 위해 어케 싸웁네까.\""
 TFRKPHN_lg_7007_a:0 "아시아 전황을 뒤흔든 생포 소식에 이어 또 하나의 소식이 전해졌다. 한국군에 생포된 김정은 국무위원장의 동생 김여정 부부장이 북한에 남은 모든 권력을 넘겨받았다는 사실이 확인됐다.\n\n김여정은 조선중앙방송으로 낸 첫 성명에서 오빠가 적에게 납치됐을 뿐이라고 주장하고 전 인민에게 마지막 한 사람까지 싸우라고 명령했다.\n\n군사 전문가들은 그 명령을 따를 군대가 남아 있지 않다고 본다. 평양은 이미 함락됐고 북한군 지휘 체계는 사실상 무너졌다. 전선 곳곳에서 식량과 보급이 끊긴 부대들이 잇따라 투항하고 있다. 압록강 건너 중국 국경 도시들에는 피란민 행렬이 날마다 늘고 있다는 보도도 나왔다.\n\n지도자를 산 채로 적에게 내준 정권이 다시 일어설 수 있을지 의심하는 목소리가 많다. EADI도 무너지는 독재 정권을 도울 힘이 없어 보인다. 서울 외교가에서는 이제 전쟁의 끝보다 그 뒤를 어떻게 정리할지가 더 큰 관심사가 됐다.\n\n평양 방송 전파는 그 주말부터 끊겼다 이어지기를 되풀이했고 마지막 방송은 같은 노래로 끝났다."
 TFRKPHN_lg_7008_a:0 "제23대 국회의원 선거가 한 달 앞으로 다가왔다. 양안전쟁 승리가 막 전해진 뒤에 치른 지난 총선에서 여당은 199석을 얻었다. 이번에는 그 바람이 잦아들었고 선거는 이인제 정부 첫해 성적표가 된다.\n\n당 공천관리위원회 앞에 두 갈래 길이 놓였다. 하나는 전쟁에서 돌아온 장교와 전역 장병, 복구 현장 사람들을 앞세우는 길이다. 현역 의원 여럿이 밀려나고, 그들은 벌써 무소속 출마를 입에 올린다. 다른 하나는 현역을 지키는 길이다. 당은 조용하겠지만 얼굴은 안 바뀐다. 야당은 벌써 낡은 정당이라는 구호를 내걸었다."
 TFRKPHN_lg_7008_b:0 "공천 신청자 명단에 낯선 이름이 많았다. 해병대에서 소대를 이끌다 다리를 다친 대위, 부서진 부두를 석 달 만에 다시 세운 항만 기술자, 피란민 학교를 연 교사. 면접장에 들어선 대위는 지팡이부터 책상에 올려놓았다.\n\n\"이거 보시면 아실 겁니다. 제가 뭘 하다 왔는지.\"\n\n대통령은 당을 여러 번 옮기며 살아남은 사람이다. 밀려난 사람이 어디로 가는지 누구보다 잘 안다. 그는 공천관리위원장에게 낙천자에게는 발표 전에 직접 전화를 걸라고만 일렀다."
 TFRKPHN_lg_7009_a:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당은 전쟁 바람 없이도 지난번에 버금가는 의석을 지켰다. 충청 지역구가 거의 한 색으로 칠해졌고 수도권 접전지도 자정 무렵 여당 쪽으로 넘어왔다.\n\n당사에서 개표 방송을 보던 대통령은 한참 말이 없다가 일어나 당직자들 손을 하나씩 잡았다. 1997년 겨울 그는 492만 표를 얻고도 3위에 그쳤다. 서른 해 남짓 지난 이 밤은 그때와 달랐다."
 TFRKPHN_lg_7009_b:0 "출구조사를 뜯어보니 노동개혁 때문에 등을 돌릴 것 같던 공단 지역에서도 표가 크게 빠지지 않았다. 좋은 일자리 사업으로 새 공장이 들어선 동네가 오히려 여당을 밀었다. 울산의 한 개표소 참관인들은 서로 놀란 얼굴로 집계표를 다시 셌다.\n\n야당 대표는 새벽에 짧게 패배를 인정했다. 정부 일자리 정책을 이번만큼은 국민이 믿어 줬다고 했다. 남은 네 해 동안 정부 법안은 국회 문턱에서 멈추지 않는다. 그만큼 핑계 댈 곳도 없어졌다.\n\n충청의 한 개표소 앞에서는 지지자들이 새벽까지 자리를 지켰다.\n\n\"우리 생전에 충청 대통령이 이렇게 이길 줄 누가 알았슈. 이제 죽어도 여한이 없어.\""
 TFRKPHN_lg_7010_a:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당은 의석을 여럿 잃었지만 과반은 지켰다. 지난 총선 199석은 전쟁 직후 숫자였고 이번이 평시 성적에 가깝다는 말이 나왔다. 수도권에서 잃은 자리를 충청과 영남이 메웠다.\n\n수도권 몇몇 지역구는 몇백 표 차로 갈렸고 세 곳에서 재검표를 요구했다. 개표장 한쪽에서 밤을 새운 여당 후보 하나는 해 뜰 무렵 이백 표 차로 진 걸 확인하고 상대 후보에게 먼저 전화를 걸었다."
 TFRKPHN_lg_7010_b:0 "당 안에서는 노동개혁 속도를 늦춰야 한다는 말과 이 정도면 국민이 개혁을 받아들인 거라는 말이 함께 나왔다. 원내대표는 다음 주 의원총회에서 하반기 입법 순서를 다시 짜자고 했다.\n\n대통령은 결과를 담담하게 받았다. 이긴 선거보다 진 선거를 더 많이 치러 본 사람이다. 다음 날 아침 국무회의는 예정대로 열렸다.\n\n그날 오후 대통령은 재검표에서 진 후보들을 불러 점심을 함께했다.\n\n\"몇백 표 차이가 얼마나 무거운지 내가 누구보다 압니다. 자, 국밥 식기 전에 드세요.\" 식탁에 충청 국밥이 올라왔다."
 TFRKPHN_lg_7011_a:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당이 과반을 잃었다. 지난 총선 199석에서 크게 줄었다. 개혁에 지친 공단 지역과 수도권에서 표가 빠졌고 당사 불은 자정 전에 꺼졌다.\n\n울산과 창원, 거제 공단 지역구가 한꺼번에 넘어갔다. 노동개혁 첫해에 임금 체계가 바뀐 곳들이었다.\n\n\"일자리 반대한 사람 아무도 없소. 속도가 너무 빨랐다 이 말이지.\" 한 조선소 앞 개표 참관인이 기자에게 말했다."
 TFRKPHN_lg_7011_b:0 "언론은 피닉제라는 별명을 다시 꺼내며 이번에도 일어설 수 있겠느냐고 물었다. 남은 임기 동안 예산과 법안은 야당과 마주 앉아 풀어야 한다.\n\n다음 날 아침 대통령실 회의실에 노동개혁 일정표가 펼쳐졌다. 지난주까지 굵게 칠해져 있던 칸 몇 개에 연필로 물음표가 그려져 있었다. 정무수석은 야당 원내대표에게 만나자는 전화를 걸었다.\n\n그날 밤 직원들은 늦게까지 퇴근하지 않았다. 자정이 넘어 집무실 불을 끄던 대통령이 한마디 했다.\n\n넘어진 적이야 전에도 있었지요. 여러 번.\n\n다음 날 아침 그 한마디가 신문 제목으로 걸렸다."
 TFRKPHN_lg_7012_a:0 "임기를 몇 달 남긴 어느 봄날, 대통령은 일정에 없던 길을 나섰다. 행선지는 그가 태어난 충남 논산이었다. 경호처는 전날 밤에야 동선을 받았다.\n\n충청은 오래 대통령을 꿈꿨지만 큰 이름들이 하나같이 문턱에서 멈췄다. 그 자신도 그랬다. 1997년에는 492만 표를 얻고도 3위에 그쳤고 2007년에는 1퍼센트도 못 얻었다. 사람들은 불사조와 그의 이름을 합쳐 피닉제라 불렀다. 넘어질 때마다 다시 일어섰기 때문이다."
 TFRKPHN_lg_7012_b:0 "차가 읍내를 지나자 장터 상인 몇이 알아보고 손을 흔들었다.\n\n\"저 양반이 진짜 대통령을 했네. 내 살다 살다.\" 손을 흔들던 상인 하나가 옆 사람에게 중얼거렸다.\n\n들판 가장자리 작은 정자에서 마을 노인들이 그를 맞았다. 누구는 손을 잡았고 누구는 고개만 끄덕였다. 대통령은 연설하지 않았다. 들판 쪽을 보며 혼잣말처럼 말했다.\n\n이제는 내려앉아도 되겠네.\n\n따라온 지역 기자가 그 말을 받아 적었고, 이튿날 지역 신문 1면 제목이 됐다."
 TFRKPHN_lg_7013_a:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당 혼자 200석을 넘겼다. 국회 재적 3분의 2, 헌법을 고칠 수 있는 숫자다. 지난 총선 199석은 전쟁 직후 바람이 만든 숫자였는데 이번에는 바람 없이 그 선을 넘었다.\n\n출구조사가 화면에 뜨자 당사가 한동안 조용했다. 당 지도부가 예상한 숫자와 크게 달랐다. 야당 대표는 자정을 넘겨 짧게 패배를 인정했다."
 TFRKPHN_lg_7013_b:0 "대통령은 그날 밤 당선자들에게 개헌 얘기는 함부로 꺼내지 말라고 일렀다. 오래 내걸어 온 책임총리제를 헌법에 적는 일이 이제 손에 닿는 곳에 있었다. 그래서 더 조심해야 했다.\n\n그래도 이튿날 아침 신문들은 하나같이 개헌을 일 면에 올렸다. 법학자들은 방송에 나와 200석이 할 수 있는 일과 해선 안 되는 일을 나눠 설명했고, 시민 단체 몇 곳은 견제가 사라진 국회를 걱정하는 성명을 냈다.\n\n\"이렇게 많이 이기면 뭘 해도 우리 책임이에요. 무섭네요.\" 당선자 대회장 뒤편에서 한 초선 당선자가 기자에게 말했다.\n\n그 말을 전해 들은 대통령은 그 당선자 이름을 수첩에 적었다."
 TFRKPHN_lg_7014_a:0 "정부는 국민투표 대신 국회를 택했다. 여야 원내대표와 정부가 한 테이블에 앉는 여야정 협의체가 국회 본청에서 첫 회의를 열었다. 안건은 전쟁 때 만든 비상 입법 열한 개다. 무엇을 남기고 무엇을 거둘지 석 달 안에 답을 내기로 했다.\n\n첫 회의는 네 시간 만에 끝났다. 야당은 언론 통제 조항부터 없애자고 했고 정부는 징발과 동원 조항부터 정리하자고 했다. 양쪽은 다음 회의 날짜만 합의했다. 회의록을 맡은 국회 사무처 직원은 네 시간 동안 같은 문장이 열두 번 나왔다고 적었다."
 TFRKPHN_lg_7014_b:0 "회의장 밖 복도에서 장동혁 의원이 기다리고 있었다. 그는 기자들에게 협의체가 야당에 칼자루를 쥐여 준 꼴이라고 했다. 당 지도부가 이 협의체를 끝까지 지켜 줄지는 아직 모른다.\n\n2011년이었다면 투표함으로 갔을 대통령이 이번에는 국회의 느린 시계를 따르기로 했다.\n\n정부 대표로 들어갔던 법무부 차관은 대통령실에 짧게 보고했다. 석 달은 짧고 열한 개는 많다. 대통령은 그 보고서에 한 줄을 적어 돌려보냈다.\n\n\"열한 개 가운데 하나라도 먼저 합의해 보세요. 하나면 됩니다.\""
 TFRKPHN_lg_7015_a:0 "헤이그 국제형사재판소가 판결을 내렸다. 첫 공판에서 한 해 남짓, 재판부는 공소장 죄목 거의 전부를 유죄로 인정했다. 정치범 수용소 운영, 민간인 거주지 포격, 포로 처형. 재판부는 종신형을 선고했다.\n\n예순을 넘긴 남미 출신 판사가 재판장이었다. 그는 주문을 읽다가 증언 한 대목에서 잠시 안경을 벗었고 다시 쓰고서야 끝까지 읽었다. 방청석 탈북민 증인 몇은 서로 손을 잡았다. 판결문은 수천 쪽이었는데 재판부는 그 대부분을 증언을 옮겨 적는 데 썼다."
 TFRKPHN_lg_7015_b:0 "서울의 반응은 갈렸다. 정부는 세계가 함께 내린 판결이라고 했고, 사형 없는 법정에 그를 넘긴 게 옳았느냐는 물음도 다시 나왔다. 유가족 단체는 이제 누구도 그날을 지울 수 없다는 짧은 성명을 냈다.\n\n판결문 한국어 번역본은 석 달 뒤 국립도서관에 들어갔다. 첫 주에 빌려 간 사람 가운데 고등학생도 있었다. 사서는 대출 기록을 보고 한참 그 이름을 들여다봤다.\n\n판결 다음 날 아침 서울 신문들은 헤이그 법정의 빈 피고인석 사진으로 일 면을 채웠다."
 TFRKPHN_lg_75_a:0 "전쟁 승리를 선언하고 이틀이 지났다. 대통령 집무실 옆 소회의실 화이트보드에 우리가 마커로 다섯 줄을 적었다. 헌법, 입시와 사법시험, 병역과 안보, 노동, 방송. 줄마다 물음표와 함께 반대 예상이라는 메모가 달렸다.\n\n모두 전쟁 전에 손대다가 전쟁 때문에 멈춘 일이다. 헌법이 그중 가장 어렵다. 국회 재적 3분의 2가 찬성해야 하고 국민투표까지 거쳐야 한다.\n\n\"다들 한숨 돌리는 지금 아니면 못 합니다. 지지율은 시간이 갈수록 빠집니다.\"\n\"지금 밀어붙이면 승리에 취해서 오만해졌다는 소리 들을 겁니다.\""
 TFRKPHN_lg_75_b:0 "두 비서관의 말다툼이 길어졌다. 누군가 마커 뚜껑을 딸깍 닫았다. \"어차피 어느 쪽이든 욕먹습니다. 순서나 정합시다.\"\n\n그날 저녁 맨 윗줄에 동그라미가 쳐졌다. 개헌이 먼저라는 말은 이튿날 아침 신문에 그대로 실렸다. 누가 흘렸는지는 아무도 묻지 않았다. 신문들은 국민투표를 치를 수 있는 가장 빠른 날짜에서 거꾸로 여야 협상과 개헌위원회, 국회 표결 일정을 세어 그래픽으로 그렸는데, 달력 칸이 금세 모자랐다."
 TFRKPHN_lg_81_a:0 "미국이 무너지면서 핵우산도 같이 흔들렸다. 북한은 핵을 가졌고 우리는 갖지 못했다. 그 틈을 무엇으로 메우느냐가 이 정부가 처음 받아 든 안보 숙제였다.\n\n길은 두 갈래로 거론된다. 독자 핵무장은 제재와 비확산 체제라는 벽에 막혀 있다. 다른 하나는 핵을 가진 우방과 운용을 나누는 길로, 대통령이 2021년 경선 때부터 나토식 핵공유라는 이름으로 주장해 온 방안이다. 우리는 그나마 현실에 가까운 이 두 번째 길로 초안을 만들었다."
 TFRKPHN_lg_81_b:0 "합동참모본부 지하, 보안 점검을 마친 회의실. 탁자에 표지에 제목 한 줄 없는 서류철이 놓여 있다. 안에는 핵을 가진 우방과 공동 운용 협의체를 꾸리는 구상이 들어 있다.\n\n\"협의만 해도 중국이 한마디 할 겁니다.\"\n\"안 하면 우리 손에 아무것도 없다고 인정하는 셈이 됩니다.\"\n\n참석자들은 휴대전화를 모두 문밖 보관함에 넣고 들어왔다. 회의록에는 누가 왔는지 적지 않기로 했다. 서류철 첫 장을 넘긴 사람은 국방부에서 온 차관이었다.\n\n세 시간 뒤 회의가 끝났고, 참석자들은 들어올 때처럼 한 사람씩 시간 차를 두고 나갔다."
 TFRKPHN_lg_85_a:0 "대만해협의 포성이 서울까지 들려오기 시작한 날, 우리는 중앙선거여론조사심의위원회에 공문을 보냈다. \"전시에 여론은 무기가 됩니다. 적은 우리 숫자를 보고 우리가 흔들리는지 읽습니다.\" 공문 첫 줄이었다.\n\n전쟁이 끝날 때까지 정당 지지율과 국정 지지도 조사는 공표할 수 없다. 평시에는 선거 엿새 전부터만 막던 것을 전쟁 기간 내내로 늘린 조치다. 방송사들은 매주 내보내던 지지율 그래프를 내렸다. 야당은 숫자가 무서운 정부라며 거세게 반발했다."
 TFRKPHN_lg_85_b:0 "법을 고친 게 아니고 공문 한 장으로 밀어붙인 일이라 야당은 그날로 헌법소원을 냈다. 대통령은 조사까지 막지는 않겠다고 했다. 전쟁이 끝나는 날 그동안 쌓인 숫자를 한꺼번에 공개하고, 헌법재판소가 위헌이라고 하면 그날로 거두겠다고도 약속했다.\n\n거리의 시민들은 지지율보다 내일 뉴스를 더 걱정했다. 방송사 보도국은 그 주부터 지지율 그래프 자리에 전선 지도를 띄웠다. 여론조사 회사들은 조사를 멈추지 않았고, 공개하지 못한 숫자가 매주 금고에 쌓였다. 그 숫자가 한꺼번에 나오는 날을 두고 기자들 사이에 벌써 내기가 붙었다."
 TFRKPHN_lg_90_a:0 "\"...기호 1번, 이인제 후보입니다!\"\n\n객석 절반이 한꺼번에 일어섰다. 연단으로 걸어 나온 이인제가 오세훈의 손을 잡아 높이 들었고, 오세훈은 웃으며 패배를 받아들였다.\n\n당사 밖에서는 지지자들이 태극기를 흔들었다. 오세훈 쪽 대의원석에서도 박수가 나왔다. 경선 내내 서로 날을 세웠던 두 캠프 사람들이 모처럼 같은 쪽을 보고 서 있었고, 당 대표는 이번 대선은 쪼개지지 않고 치르겠다며 안도했다. 여론조사 회사들은 그날 밤 바로 첫 양자 대결 조사에 들어갔다.\n\n국민들은 홍준표 정부 다섯 해에 후한 점수를 줬다. 정부 지지율이 절반을 넘자 대통령실은 키를 바꾸지 말라는 뜻으로 받아들였다.\n\n이인제는 수락 연설에서 오늘 자신을 뽑아 준 건 지난 다섯 해를 보고 한 선택이라며, 그 다섯 해를 이어 가겠다고 했다. 진충보국 네 글자는 이제 자기 것이기도 하다는 말로 연설을 맺었다.\n\n청와대에서 중계를 보던 대통령은 아무 말 없이 책상 맨 아래 서랍을 한 번 열었다가 닫았다. 큰 이변만 없다면 다음 대통령은 이인제다."
 TFRKPHN_lg_91_a:0 "\"...기호 2번, 오세훈 후보입니다!\"\n\n객석 절반이 한꺼번에 일어섰다. 연단으로 나온 오세훈이 이인제의 손을 잡아 들어 올렸고, 이인제는 담담하게 고개를 끄덕였다.\n\n당사 밖 지지자들은 서울시장 시절 구호를 다시 외쳤다. 이인제 쪽 대의원들은 박수를 치면서도 얼굴이 굳어 있었고, 몇몇은 선대위에 들어갈지 말지 다음 날 아침에 정하겠다고 했다.\n\n국민들은 전쟁에 지쳤다. 정부 지지율은 절반에 못 미쳤다. 이긴 건 고맙지만 이제 다른 길로 가고 싶다는 뜻이었다."
 TFRKPHN_lg_91_b:0 "오세훈은 수락 연설에서 전쟁을 이긴 홍준표 대통령에게 감사한다고 했다. 그 승리는 지키되 국정은 바꾸겠다고, 이제 대한민국은 전쟁 뒤의 길을 가야 한다고 했다.\n\n청와대에서 그 장면을 보던 대통령은 피식 웃었다. 말싸움은 질리도록 했어도 잘하긴 할 거라고, 서울시장 먼저 해 본 사람 아니냐고 중얼거렸다.\n\n그날 밤 대통령의 페이스북에 짧은 글이 올라왔다. 2011년에 서울시장 던지고 큰 꿈 꾸던 사람이 이제야 제 자리를 찾았다. 이번에는 당 덕 보지 말고 본인 힘으로 한번 해 보라. 기자들은 축하인지 견제인지를 두고 밤새 기사를 썼다. 큰 이변만 없다면 다음 대통령은 오세훈이다."
 TFRKPHN_lij_category_desc:0 "\n\n\n\n\n\n\n\n\n\n\n\n대통령은 쉬지 않습니다. 디시전을 하나 쓸 때마다 §R과로§!가 §Y4§!, 중점을 하나 끝낼 때마다 §Y6§! 오릅니다. 일주일마다 §G1§!씩 내려가고, 2주 동안 디시전도 중점도 끝내지 않으면 일주일마다 §G4§!씩 내려갑니다.\n\n과로: §Y[?TFRKPHN_lij_fatigue|0]§! / 100\n쓰러진 횟수: §R[?TFRKPHN_lij_collapse|0]§! / 3\n\n과로가 100이 되면 대통령이 쓰러집니다. §R세 번째로 쓰러지면 대통령은 일어나지 못합니다.§!"
 TFRKPHN_mega_p1_5_d:0 "£GFX_TFRKPHN_mega_th_1_5\n§Y5단계 사업: 용산국제업무지구§!\n2007년 서울시는 용산 철도 정비창 자리에 31조 원짜리 업무 지구를 짓겠다고 발표했습니다. 사업은 2013년에 무산되었고 땅은 그 뒤로 비어 있었습니다. 스무 해 만에 그 자리에 건물이 올라갑니다."
 TFRKPHN_mega_up_tt:0 "이 권역이 §G한 단계§! 올라가고, 권역 안 모든 지역의 §Y지역 등급§!이 한 단계 오릅니다.\n1단계: 광역 교통망 (기반 시설)\n2단계: 산업 단지와 에너지 농장\n3단계: 업무 지구\n4단계: 산업 단지, 에너지 농장, 기반 시설\n5단계: 업무 지구와 산업 단지, 안정도 §G+1§!\n\n단계가 오를 때마다 §Y메가시티 경제권§! 변동치가 커집니다: 기업 가치 §G+0.2§!, 소득 성장 §G+0.2§!, 건설 속도 §G+0.4§!, 소비재 공장 §G-0.6§! (모두 백분율)\n\n권역이 §Y5단계§!에 닿으면 권역마다 다른 보상이 있습니다.\n수도권: 기업 가치 / 충청권: 연구 속도 / 호남권: 에너지 농장 / 대구경북: 군수 공장 / 부울경: 조선소"
 TFRKPHN_mil_b_border_tt:0 "§Y통일 대비 부대를 만든다§!\n북한 지역의 안정화와 압록강, 두만강 국경 방어를 맡을 부대를 미리 짜 둡니다.\n\n비용: £pol_power §Y30§!\n억지력 §G+10§!\n\n§g1번까지 쓸 수 있습니다.§!\n§R중점 §Y통일 대비 군 개편§!§R을 끝내야 합니다.§!"
 TFRKPHN_mil_b_conv_tt:0 "§Y재래식 전력을 보강한다§!\n핵을 내려놓을 날에 대비해 정밀 타격 전력과 방공 전력을 늘립니다.\n\n비용: £pol_power §Y20§!\n억지력 §G+6§!\n공장 생산량 §R-1%§!\n\n§g한 번 쓰면 90일 동안 다시 쓸 수 없습니다.§!\n§g3번까지 쓸 수 있습니다.§!"
 TFRKPHN_mil_b_declare_tt:0 "§Y비핵 선언을 알린다§!\n통일의 날 핵을 내려놓겠다는 선언을 들고 주변국을 돕니다.\n\n비용: £pol_power §Y15§!\n안정도 §G+1%§!\n정치력 §G+25§!\n\n§g한 번 쓰면 120일 동안 다시 쓸 수 없습니다.§!\n§g2번까지 쓸 수 있습니다.§!"
 TFRKPHN_mil_b_demob_tt:0 "§Y동원을 해제한다§!\n전시에 불러 모은 병력을 집과 일터로 돌려보냅니다.\n\n비용: £pol_power §Y15§!\n병력 §Y-10§!\n억지력 §R-6§!\n공장 생산량 §G+2%§!\n사단 조직력 §R-2%§!\n\n§g한 번 쓰면 60일 동안 다시 쓸 수 없습니다.§!\n§g병력이 40까지 내려가면 더 줄일 수 없습니다.§!"
 TFRKPHN_mil_b_md_tt:0 "§Y미사일 방어망을 넓힌다§!\n방어망을 북쪽과 서쪽으로 넓힙니다. 핵억지를 물려받은 경우에는 주변국이 더 반발합니다.\n\n비용: £pol_power §Y25§!\n억지력 §G+8§!\n§g물려받은 핵억지를 골랐다면§! 주변국 압력 §R+5§!\n\n§g한 번 쓰면 120일 동안 다시 쓸 수 없습니다.§!\n§g3번까지 쓸 수 있습니다.§!\n§R중점 §Y최소한의 대응조치§!§R를 끝내야 합니다.§!"
 TFRKPHN_mil_b_merge_tt:0 "§Y부대를 합치고 줄인다§!\n승전의 교훈대로 겹치는 부대를 합칩니다. 사람은 줄어도 싸우는 힘은 덜 깎입니다.\n\n비용: £pol_power §Y25§!\n병력 §Y-10§!\n억지력 §R-2§!\n공장 생산량 §G+2%§!\n육군 경험치 §G+15§!\n\n§g한 번 쓰면 90일 동안 다시 쓸 수 없습니다.§!\n§g2번까지 쓸 수 있습니다.§!\n§R중점 §Y국방개혁 2단계§!§R를 끝내야 합니다.§!"
 TFRKPHN_mil_b_recall_tt:0 "§Y전방 병력을 늘린다§!\n돌려보낸 병력을 다시 불러 북쪽을 겨눈 부대를 채웁니다.\n\n비용: £pol_power §Y20§!\n병력 §Y+10§!\n억지력 §G+6§!\n공장 생산량 §R-2%§!\n사단 조직력 §G+2%§!\n\n§g한 번 쓰면 60일 동안 다시 쓸 수 없습니다.§!\n§g병력이 100이면 더 늘릴 수 없습니다.§!"
 TFRKPHN_mnd_kddx_desc:0 "순양함급 차기 전투함 KDDX의 설계안을 확정하고 건조에 들어갑니다. 개선된 순양함 선체 연구가 끝나고, 함선 무장 연구가 빨라집니다. 180일 뒤 KDDX 4척이 절반쯤 지어진 상태로 도크에 올라갑니다.\n\n§YK-VLS, CIWS-II, 함대공 유도탄-II 개발을 모두 마쳐야§! 사업을 확정할 수 있습니다."
 TFRKPHN_nak_ms_category_desc:0 "유동성으로 추가경정예산을 편성하거나 정치력을 써서 민생 게이지를 채웁니다. 게이지가 25%를 넘을 때마다 국민정신 민생이 한 단계 오릅니다.\n정부 지지율 §Y[?TFRKPHN_nak_gov|0]%§!   민생 지지율 §Y[?TFRKPHN_nak_ms|0]%§!   지금 §Y[?TFRKPHN_nak_ms_lv|0]단계§!"
 TFRKPHN_nak_ms_state:0 "지금 §Y[?TFRKPHN_nak_ms_lv|0]단계§!  (민생 §Y[?TFRKPHN_nak_ms|0]%§!)\n정치력 획득 §G+[?TFRKPHN_nak_ms_pp|%0]§!   안정도 §G+[?TFRKPHN_nak_ms_st|%0]§!   소비재 공장 §R+[?TFRKPHN_nak_ms_cg|%1]§!"
 TFRKPHN_nk_bop_captain_tt:0 "§Y함장에게 선을 댄다§!\n고른 기지의 함장들에게 넘어오면 신변을 지켜 주겠다고\n약속합니다.\n\n비용: £pol_power §Y10§!\n고른 기지의 동요 §G+25§!\n§g같은 기지에는 20일 동안 다시 쓸 수 없습니다. 다른 기지에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_bop_fuel_tt:0 "§Y연료 실상을 흘린다§!\n항공유가 간부들의 차로 빠진다는 소식을 고른 비행장에\n퍼뜨립니다.\n\n비용: £pol_power §Y8§!\n고른 비행장의 동요 §G+18§!\n§g같은 비행장에는 20일 동안 다시 쓸 수 없습니다. 다른 비행장에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_bop_route_tt:0 "§Y귀순 뱃길을 알린다§!\n북방한계선 남쪽에서 받아 줄 자리를 고른 기지의 수병들에게\n알립니다.\n\n비용: £pol_power §Y8§!\n고른 기지의 동요 §G+18§!\n§g같은 기지에는 20일 동안 다시 쓸 수 없습니다. 다른 기지에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_mop_speaker_tt:0 "§Y전선 확성기를 튼다§!\n휴전선의 확성기로 바깥 소식을 들려줍니다. 전방 군단에만\n닿습니다.\n\n비용: £pol_power §Y13§!\n고른 군단 동요 §G+6§!\n§g같은 군단에는 20일 동안 다시 쓸 수 없습니다. 다른 군단에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_op_leaflet_tt:0 "§Y전단과 저장 장치를 보낸다§!\n바깥 소식을 담은 전단과 저장 장치를 들여보냅니다. 물건은\n장마당을 타고 이웃 지역으로 퍼집니다.\n\n비용: £pol_power §Y10§!\n고른 지역 이반도 §G+5§!\n이웃 지역 이반도 §G+2§!\n§g같은 지역에는 20일 동안 다시 쓸 수 없습니다. 다른 지역에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_op_market_tt:0 "§Y장마당에 돈줄을 댄다§!\n장마당 상인들에게 돈과 물건을 댑니다. 배급에 기대지 않는\n사람이 늘어납니다.\n\n비용: £pol_power §Y20§!\n고른 지역 이반도 §G+10§!\n§g같은 지역에는 20일 동안 다시 쓸 수 없습니다. 다른 지역에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_op_route_tt:0 "§Y탈북 길목을 넓힌다§!\n강을 건너는 사람들을 돕습니다. 중국, 러시아와 맞닿은\n지역에서만 할 수 있습니다.\n\n비용: £pol_power §Y23§!\n고른 지역 이반도 §G+12§!\n§g같은 지역에는 20일 동안 다시 쓸 수 없습니다. 다른 지역에는 바로 쓸 수 있습니다.§!"
 TFRKPHN_nk_tt_hb:0 "§Y함경북도§!\n이반도 [?TFRKPHN_nk_d_hb|0]\n\n도 소재지는 청진입니다. 두만강을 사이에 두고 중국, 러시아와\n맞닿아 있습니다. 탈북민 가운데 이곳 출신이 가장 많습니다.\n\n§R주둔: 9군단§!\n§g단속 때 이반도가 더 내려갑니다.§!\n\n§g국경 지역: 탈북 길목을 넓힐 수 있습니다.§!"
 TFRKPHN_nk_tt_py:0 "§Y평양§!\n이반도 [?TFRKPHN_nk_d_py|0]\n\n수도입니다. 출신 성분을 가려 뽑은 사람만 살 수 있습니다.\n가장 흔들기 어려운 곳입니다.\n\n§R주둔: 평양방어군단§!\n§g단속 때 이반도가 더 내려갑니다.§!\n\n§g평양은 모든 작전의 효과가 절반입니다.§!"
 TFRKPHN_nk_tt_yg:0 "§Y양강도§!\n이반도 [?TFRKPHN_nk_d_yg|0]\n\n도 소재지는 혜산입니다. 압록강 건너가 중국이고, 백두산이 이\n도에 있습니다.\n\n§R주둔: 12군단§!\n§g단속 때 이반도가 더 내려갑니다.§!\n\n§g국경 지역: 탈북 길목을 넓힐 수 있습니다.§!"
 TFRKPHN_nsp_category_desc:0 "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n동남아시아는 중국이 이끄는 진영과 태평양 방위 조약기구가 서로 끌어당기는 곳입니다. 일본이 벌이는 영향력 경쟁에 우리도 힘을 보탭니다. 어느 진영에도 들지 않은 나라에 협력 사업을 벌이면 그 나라에서 우리 진영의 영향력이 오릅니다. 영향력이 충분히 쌓인 나라는 일본이 조약기구로 부를 수 있습니다."
 TFRKPHN_oh_ansim_category_desc:0 "기준에 모자라는 소득의 절반을 나라가 채워 주는 제도입니다. 서울에서 800가구로 하던 시범 사업을 단계를 밟아 나라 전체로 넓힙니다. 단계가 오를수록 빈곤이 줄고 소비재에 드는 공장이 늘어납니다.\n\n지금 단계: §Y[?TFRKPHN_an_stage|0]§! / 4"
 TFRKPHN_oh_byelec_category_desc:0 "대통령이 떠난 서울시장 자리를 두고 2027년 4월 7일에 보궐선거가 열립니다. 스물다섯 구의 여당 지지도 평균이 50을 넘으면 여당 후보가 이깁니다. 서울의 스물다섯 구를 아홉 생활권으로 묶었습니다. 지도에서 생활권의 이름을 누르면 후보가 그곳으로 가고, 투표함 양옆의 단추로 그 생활권의 표를 모읍니다. 단추와 결정은 하나를 쓰면 사흘 뒤에 다시 쓸 수 있습니다. 상대 후보도 사흘마다 한 곳을 돌며 표를 가져갑니다."
 TFRKPHN_oh_exile_category_desc:0 "제2차 미국 내전으로 미대륙은 초토화됐고, 그곳에 본사를 두었던 회사들은 대륙을 포기했습니다. 세계 곳곳에 남은 지사와 공장, 연구소는 본사 없이 그 나라에 남았고 사실상 나라마다 나눠 가진 셈이 됐습니다. 우리 땅에 남은 몫과 건너온 사람들을 메가시티 권역에 정식으로 앉힙니다. 회사마다 갈 권역이 다르고, 그 권역이 충분히 자라 있어야 합니다.\n\n지금까지 유치한 회사: §Y[?TFRKPHN_ex_n|0]§!곳\n국내 기업의 불만: §R[?TFRKPHN_ex_gripe|0]§! (3에 닿으면 역차별 논란이 벌어집니다)"
 TFRKPHN_oh_kyung_hoon_EM_desc:0 "출생: 대한민국\n\n이력: 대한민국의 기획재정부 장관\n오경훈은 2003년 재보궐선거에서 한나라당 후보로 서울 양천구 을에 나서 당선되었습니다. 뒤에 우리공화당에 들어가 사무총장으로 당 살림을 맡았습니다.\n\n당의 돈을 관리하던 사람이 나라의 돈을 맡았습니다. 달러와 원자재를 누구에게 얼마나 줄지 적는 배정표가 그의 책상에서 만들어집니다."
 TFRKPHN_oh_mega_category_desc:0 "모든 것이 서울로 몰리는 나라에서 지방은 줄어들기만 했습니다. 수도권에 맞설 만한 덩치를 지방에도 만드는 것이 이 사업입니다.\n\n권역을 고르면 공사가 60일 동안 이어지고, 끝나면 그 권역이 한 단계 올라갑니다. 단계가 오를 때마다 그 지역의 등급이 오르고 길과 공장, 업무 지구가 들어섭니다. 다섯 권역을 모두 5단계까지 올리면 공사가 끝납니다."
 TFRKPHN_oh_pdto_category_desc:0 "태평양 방위 조약기구는 함께 싸운 나라들의 모임입니다. 전쟁이 끝난 뒤에는 회원국 회사들이 서로의 공장과 시장을 쓰는 길이 됐습니다. 지도에서 나라의 이름표를 누르면 그 나라 회사와 할 수 있는 협력이 아래에 나옵니다. 우리와 같은 진영에 있는 회원국하고만 협력할 수 있습니다."
 TFRKPHN_oh_seoul_category_desc:0 "서울은 스물다섯 개 구로 나뉘어 있고 구마다 사정이 다릅니다. 지도의 색은 그 구에서 여당이 얼마나 지지를 받는지를 보여 줍니다. 붉을수록 여당이, 푸를수록 야당이 앞섭니다.\n\n한강 남쪽 동남권에만 돈을 쓰면 건물은 빨리 올라가지만 강북과의 격차가 벌어집니다. 격차가 커지면 나라 전체의 안정도가 내려가고, 좁히면 올라갑니다."
 TFRKPHN_parl_category_desc:0 "새 헌법 아래의 국회입니다. 4년마다 총선으로 의석이 정해지고, 과반 151석을 모은 당들이 정부를 세웁니다.\n\n정당마다 §Y지지도§!가 있습니다. 지지도 80% 이상이면 의석 전부, 60% 이상이면 절반이 정부 편에 섭니다. 이를 더한 것이 §Y국회 지지§!입니다. 국회 지지가 석 달 넘게 50% 아래면 불신임안이 올라옵니다.\n\n흰 테두리가 있는 점이 연정에 든 당입니다."
 TFRKPHN_pdto_bombing_desc:0 "김정은이 쓰러진 그날 밤부터 폭격이 시작되었습니다. PDTO 연합국은 공식적으로 어떤 작전도 인정하지 않습니다. 평양과 원산, 함흥의 군수공장과 지휘시설은 그래도 매일 밤 불타고 있습니다. 낡은 방공망은 하늘을 지키지 못했고 공장 기계는 멈춰 섰습니다. 보급과 명령이 끊긴 전선 부대들도 흔들립니다.\n\n평양의 권력자들은 서로 싸우느라 하늘을 막을 여력이 없습니다. 폭격이 길어질수록 내전의 승자가 물려받을 공장은 줄어듭니다."
 TFRKPHN_peoples_liberation_war_desc:0 "북한은 70년 넘게 6.25 전쟁을 조국해방전쟁이라 불러 왔습니다. 그 전쟁이 북녘에 남긴 건 김씨 일가의 세습 독재와 굶주림과 수용소였습니다. 김정은이 죽자 사람들이 자유조선의 깃발 아래 모여들었고, 이들은 이번 싸움이야말로 진짜 조국해방전쟁이라고 외칩니다.\n\n공장 노동자와 협동농장 농민이 총을 들었습니다. 탈영한 인민군 병사들도 전선으로 향합니다. 해방된 마을에서는 김씨 일가의 초상화를 떼어 내는 일부터 합니다. 마을 회관에 모인 사람들은 생전 처음 자유선거와 시장과 통일을 입에 올립니다."
 TFRKPHN_rail_d1_desc:0 "경부선은 1905년에 열렸습니다. 고속철도는 1992년 6월 천안아산역 자리에서 첫 삽을 떴고, 열두 해 가까이 지난 2004년 4월 1일에 개통했습니다. 2010년 11월에는 대구에서 부산까지 가는 2단계 구간도 고속선으로 이어졌습니다. 서울에서 대전과 대구를 지나 부산에 닿는 이 선로를 한 번 더 보강하고 대전에 물류 거점을 세웁니다."
 TFRKPHN_rail_d3_desc:0 "전라선은 익산에서 전주와 순천을 지나 여수까지 갑니다. 2001년에 시작한 복선 전철화 공사가 2011년에 마지막 단선 구간인 여수와 덕양 사이까지 끝나면서 전 구간이 복선이 됐습니다. 그래도 굽은 구간이 많아 고속열차가 제 속도를 내지 못합니다. 선로를 곧게 펴고 광주의 물류 거점과 잇습니다."
 TFRKPHN_rail_d4_desc:0 "부산진에서 동해안을 따라 함경도 안변까지 잇겠다는 계획은 1920년대 말에 처음 나왔습니다. 부산에서 울산을 지나 포항까지 가는 남쪽 구간은 2021년에 새 선로로 열렸습니다. 2009년에 공사를 시작한 포항과 삼척 사이 166킬로미터는 2025년 1월 1일에 개통했고, 처음 계획이 나온 지 백 년 가까이 지나서야 부산과 강릉이 한 선로로 이어졌습니다. 이 선로를 보강하고 포항에 물류 거점을 세웁니다."
 TFRKPHN_rail_d6_desc:0 "경의선은 1906년 4월에 용산에서 신의주까지 전 구간이 이어졌습니다. 1950년 6월 25일에 문산과 개성 사이 운행이 멈췄고 그 뒤로 반세기 넘게 끊겨 있었습니다. 2007년 5월 17일에 문산에서 개성까지 시험 열차가 한 번 달렸고, 이후 문산과 봉동 사이를 화물열차가 제한적으로 오갔습니다. 이제 서울에서 개성과 사리원을 지나 평양까지 선로를 다시 놓고 개성에 물류 거점을 세웁니다."
 TFRKPHN_rail_d7_desc:0 "경원선은 1914년 8월에 용산에서 원산까지 이어졌습니다. 1945년 8월 24일 삼팔선에서 연결 운행이 끊겼고, 전쟁 뒤 남쪽 열차는 신탄리에서 멈췄습니다. 2012년 11월에 백마고지역까지 한 정거장이 늘어난 것이 그 뒤의 전부입니다. 서울에서 원산까지 선로를 다시 잇습니다."
 TFRKPHN_rail_d8_desc:0 "동해북부선은 1937년에 열렸다가 분단으로 끊겼습니다. 2002년 9월에 다시 잇는 공사를 시작했고, 2007년 5월 17일 금강산에서 제진까지 시험 열차가 한 번 달린 뒤로는 진전이 없었습니다. 강원 동해안에서 원산과 함흥, 청진을 지나 북쪽 끝까지 선로를 놓습니다."
 TFRKPHN_rb_category_desc:0 "앞 정부가 붙들고 있던 네 기둥을 넘겨받았습니다. 이제 다시 세울 차례입니다.\n기둥은 100까지 올릴 수 있습니다. 평균이 50을 넘는 만큼 안정도와 정치력 획득이 오르고 밑돌면 내려갑니다.\n네 기둥이 모두 §Y80§!에 닿으면 안정도 §G+5%§!와 정치력 §G+100§!을 얻습니다."
 TFRKPHN_rok_army_support_desc:0 "남녘의 대한민국 정부가 군대를 보냈습니다. 국군은 이북5도위원회와 함께 싸우고 있습니다. 휴전선을 넘어온 장병들은 북녘 동포들과 같은 참호를 지키고, 무기와 보급과 정보를 나눕니다.\n\n실향민들은 70년 넘게 북녘을 두고 온 고향이라 불렀습니다. 그 실향민의 손자들이 지금 국군 군복을 입고 할아버지의 고향으로 올라갑니다."
 TFRKPHN_sejong_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_sejong_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§92012년 7월 연기군 자리에 세종특별자치시가 문을 열었습니다. 행정수도를 옮기자는 계획이 헌법재판소에서 막힌 뒤 행정중심복합도시로 방향을 틀어 세운 도시입니다. 조치원 복숭아밭 옆으로 정부세종청사가 길게 늘어섰습니다.\n\n반듯하게 그은 도로와 똑같은 모양의 아파트 단지가 끝없이 이어집니다. 출산율은 전국에서 가장 높고, 주민 평균 나이는 가장 젊습니다. 금요일 저녁이면 서울로 가는 통근버스 앞에 공무원들이 줄을 섭니다. 장관과 국회는 여전히 서울에 있는 날이 많아서, 과장들은 오송역과 서울을 오가며 보고서를 들고 다닙니다. 저녁 8시가 넘으면 상가 1층 가게 절반이 불을 끕니다. 대통령 집무실과 국회 분원을 짓는다는 소식이 나올 때마다 이곳 부동산 시세가 들썩입니다.§!\n\n§7지도 위에 자를 대고 그은 선명한 직선 속에, 사람의 냄새와 오래된 기억마저 도려낸 창백한 인공 낙원.§![GetTFRKPHNGov_sejong]"
 TFRKPHN_sf_category_desc:0 "2010년과 2011년 여름 서울이 물에 잠기자 사람들은 그를 바다의 신에 빗대 오세이돈이라고 불렀습니다. 2011년 7월 우면산 산사태 뒤에는 폭우를 내다보고 대비하지 못했다며 직접 사과했습니다. 이제 그 별명을 대비로 지웁니다.\n\n재난은 미리 갖춘 만큼 덜 아픕니다. 결정으로 대비 점수를 쌓아 두면 장마와 태풍 때 피해가 줄어듭니다.\n\n지금 대비 점수: §Y[?TFRKPHN_sf|0]§! / 100 (§Y60§!을 넘으면 재난을 잘 막아 냅니다)\n점수마다 §G안정도 0.05퍼센트§!가 오릅니다."
 TFRKPHN_shin_beom_chul_TM_desc:0 "출생: 1970년 대한민국 대전광역시\n\n이력: 대한민국의 국방부 장관\n신범철은 대전에서 태어나 천안에서 자랐습니다. 1995년 한국국방연구원에 들어가 북한군사연구실장을 지냈습니다. 2009년 국방부 장관 정책보좌관, 2013년 외교부 정책기획관을 맡았습니다. 국립외교원 교수와 아산정책연구원 안보통일센터장을 거쳤습니다. 제21대 총선에서는 천안갑에 출마해 1,328표 차이로 졌습니다. 2022년 5월 국방부 차관에 임명되어 이듬해 10월까지 일했습니다.\n\n군복을 입어 본 적 없는 국방부 장관입니다. 이인제 대통령은 통일 이후의 군을 설계할 사람을 찾다가, 연구원 시절 십수 년 북한군을 들여다본 그를 골랐습니다."
 TFRKPHN_sim_jang_hye_young_HM_desc:0 "출생: 1987년 대한민국\n\n이력: 대한민국의 국무총리\n장혜영은 2011년 동생을 돌보려고 대학을 그만두었습니다. 발달장애가 있는 동생과 함께 사는 이야기를 담은 다큐멘터리를 2018년에 내놓아 이름이 알려졌습니다. 2020년 정의당 비례대표로 제21대 국회의원이 되었습니다.\n\n심상정 대통령은 서른 줄의 총리를 세웠습니다. 진보 정당의 다음 세대를 앞에 내놓겠다는 뜻입니다. 관료들은 총리보다 나이가 많고, 총리는 그 사실을 신경 쓰지 않습니다."
 TFRKPHN_sim_kang_eun_mi_EM_desc:0 "출생: 대한민국\n\n이력: 대한민국의 기획재정부 장관\n강은미는 광주에서 지방의원을 지냈습니다. 2020년 정의당 비례대표로 제21대 국회의원이 되었습니다. 정의당 원내대표를 맡았습니다.\n\n기획재정부는 진보 정당 장관을 처음 맞았습니다. 그는 세금을 더 걷어 복지에 쓰는 예산안을 들고 왔습니다. 예산실 관료들은 숫자가 맞지 않는다고 말하고, 그는 숫자를 맞춰 오라고 답합니다."
 TFRKPHN_sim_kim_jong_dae_TM_desc:0 "출생: 대한민국\n\n이력: 대한민국의 국방부 장관\n김종대는 안보와 국방을 오래 다뤄 온 전문가입니다. 2016년 정의당 비례대표로 제20대 국회의원이 되었습니다.\n\n군복을 입어 본 적 없는 사람이 국방부를 맡았습니다. 그는 장군 수를 줄이고 병사 월급을 올리자고 오래 말해 왔습니다. 이제 그 말을 직접 실행할 자리에 앉았습니다."
 TFRKPHN_sim_kwon_young_gook_IM_desc:0 "출생: 1963년 대한민국 강원도 태백\n\n이력: 대한민국의 행정안전부 장관\n권영국은 광부의 아들로 태어나 서울대학교 금속공학과를 나왔습니다. 방위산업체에서 노동조합을 만들다 해고되었고 복직 투쟁을 하며 옥살이를 했습니다. 1999년 사법시험에 합격해 변호사가 되었습니다. 민주노총 법률원장과 민주사회를 위한 변호사 모임 노동위원장을 지냈고 뒤에 정의당 대표를 맡았습니다.\n\n거리에서 경찰과 맞서던 변호사가 경찰을 거느리는 장관이 되었습니다. 그는 집회 현장에 경찰 버스를 세우는 관행부터 없애려 합니다."
 TFRKPHN_sim_lee_dong_soo_IntelM_desc:0 "출생: 대한민국 전라북도 임실\n\n이력: 대한민국의 국가정보원장\n이동수는 성균관대학교 행정학과를 나와 국가정보원에 들어갔습니다. 국가안전보장회의 행정관으로 일했고 국가정보원 해외정보국 단장을 지냈습니다. 정당에 몸담은 적이 없습니다.\n\n심상정 대통령은 국가정보원장 자리에 당 사람을 앉히지 않았습니다. 해외 정보를 다루던 직원 출신을 골라 정보기관을 정치에서 떼어 놓겠다는 약속을 지켰습니다. 그는 국내 정보 수집을 줄이고 인력을 해외와 대북 분야로 돌리는 일을 맡았습니다."
 TFRKPHN_sim_lee_jeong_mi_FM_desc:0 "출생: 1966년 대한민국 부산\n\n이력: 대한민국의 외교부 장관\n이정미는 노동운동을 하다 진보 정당에 들어왔습니다. 2016년 정의당 비례대표로 제20대 국회의원이 되었습니다. 2017년과 2022년 두 차례 정의당 대표로 뽑혔습니다.\n\n당 대표를 지낸 사람이 외교를 맡았습니다. 그는 PDTO 회원국들에게 진보 정부가 동맹을 깨지 않는다고 설명해야 합니다. 당 안에서는 그 설명 자체를 못마땅해하는 사람도 있습니다."
 TFRKPHN_sim_people_category_desc:0 "§R개혁의 원동력인 민중의 지지는 절대적이지 않습니다.§!\n이들은 정부의 개혁이 너무 느려지거나 급진적일 때 개혁 정책에 대한 지지를 철회할 것입니다.\n\n민중 지지도 §Y[?TFRKPHN_sim_people|0]§! / 100\n마지막 개혁 통과 뒤 §Y[?TFRKPHN_sim_rf_last|0]§!일\n[TFRKPHN_sim_pace_state]\n\n개혁이 §Y180일§! 넘게 통과하지 못하면 다달이 지지도가 §R5§! 떨어집니다.\n개혁을 §Y90일§! 안에 잇달아 통과시키면 지지도가 §R10§! 떨어집니다."
 TFRKPHN_sk_category_desc:0 "신민당을 함께 세운 김부겸과 김동연이 누가 당의 단일 후보로 나설지 협상하고 있습니다. 두 사람이 따로 나서면 헌정회복연대의 김무성이 이깁니다.\n\n협상 진척도: §Y[?TFRKPHN_sk_uni|0]§! / 100\n\n시한이 끝날 때 진척도가 §Y50§! 이상이면 단일화가 성사되어 두 사람 가운데 한 명을 후보로 고릅니다. 50에 못 미치면 두 사람이 각자 출마하고 §R김무성§!이 당선됩니다."
 TFRKPHN_sk_kbg_im_jong_seok_HM_desc:0 "출생: 1966년 대한민국 전라남도 장흥\n\n이력: 대한민국의 국무총리\n임종석은 한양대학교 총학생회장으로 학생운동을 이끌었습니다. 1989년에는 전국 대학생 대표 조직의 의장을 맡았습니다. 2000년 서울 성동에서 제16대 국회의원이 되었고 한 번 더 당선되었습니다. 서울특별시 정무부시장을 지냈고 2017년부터 2019년 초까지 대통령 비서실장을 맡았습니다.\n\n김부겸 대통령은 청와대를 운영해 본 사람을 총리로 골랐습니다. 신민당이 이끄는 연립 정부에서 민주당 몫으로 들어온 자리이기도 합니다."
 TFRKPHN_sk_kbg_kang_kyung_hwa_FM_desc:0 "출생: 1955년 대한민국 서울특별시\n\n이력: 대한민국의 외교부 장관\n강경화는 방송국 영어 방송 프로듀서로 일하다 외교부에 특채되었습니다. 국제연합으로 옮겨 인권 부고등판무관과 인도지원조정실 사무차장보, 사무총장 정책특보를 지냈습니다. 2017년 여성으로는 처음 외교부 장관이 되어 네 해 가까이 일했습니다.\n\n그는 이 자리를 한 번 맡아 본 사람입니다. 국제기구에서 쌓은 인맥은 포격을 겪은 나라가 신뢰를 되찾는 데 쓰입니다."
 TFRKPHN_sk_kbg_kim_byung_joo_TM_desc:0 "출생: 1962년 대한민국 경상북도 예천\n\n이력: 대한민국의 국방부 장관\n김병주는 육군사관학교 40기로 임관했습니다. 사단장과 미사일사령관을 거쳐 대장으로 진급했고 2017년 한미연합군사령부 부사령관이 되었습니다. 2019년 전역한 뒤 이듬해 제21대 국회의원이 되었습니다.\n\n연합 작전을 지휘해 본 예비역 대장입니다. 그는 PDTO 회원국 군대와 함께 움직이는 법을 압니다. 군이 다시는 국회로 향하지 않게 지휘 체계를 고치는 일이 그에게 왔습니다."
 TFRKPHN_sk_kbg_kim_dong_yeon_EM_desc:0 "출생: 1957년 대한민국 충청북도 음성\n\n이력: 대한민국의 기획재정부 장관\n김동연은 상업고등학교를 나와 은행에 다니며 야간 대학을 마쳤고 행정고시와 입법고시에 합격했습니다. 기획재정부 제2차관과 국무조정실장, 아주대학교 총장을 지냈습니다. 2017년 경제부총리가 되었고 2022년 경기도지사에 당선되었습니다.\n\n세 김씨 가운데 한 사람이 다른 김씨의 정부에서 경제를 맡았습니다. 김부겸 대통령은 정치를, 그는 살림을 맡는다는 약속이 두 사람 사이에 있습니다."
 TFRKPHN_sk_kbg_kim_gyeong_soo_IM_desc:0 "출생: 1967년 대한민국 경상남도 고성\n\n이력: 대한민국의 행정안전부 장관\n김경수는 1994년 국회의원 보좌진으로 정치를 시작했습니다. 2002년 노무현 후보의 선거 캠프에 들어간 뒤 줄곧 그의 곁에서 일했습니다. 2016년 김해에서 제20대 국회의원에 당선되었고 2018년 경상남도지사가 되었습니다.\n\n도정을 맡아 본 경험으로 지방 행정을 다시 세우는 일을 맡았습니다. 미뤄졌던 지방선거를 치르는 것이 첫 과제입니다."
 TFRKPHN_sk_kbg_park_sun_won_IntelM_desc:0 "출생: 1963년 대한민국\n\n이력: 대한민국의 국가정보원장\n박선원은 노무현 정부 청와대에서 통일외교안보전략비서관으로 일했습니다. 상하이 총영사를 지냈고 국가정보원장 특보를 거쳐 2020년 국가정보원 기획조정실장이 되었습니다.\n\n국가정보원의 안살림을 맡아 본 사람입니다. 그는 지난 정권에서 정보기관이 야당 정치인에게 한 일의 기록을 찾아내야 합니다."
 TFRKPHN_sk_kdy_hong_nam_gi_EM_desc:0 "출생: 1960년 대한민국 강원도 춘천\n\n이력: 대한민국의 기획재정부 장관\n홍남기는 경제 부처에서 예산과 정책 조정을 맡아 온 관료입니다. 미래창조과학부 제1차관과 국무조정실장을 지냈습니다. 2018년 경제부총리가 되어 세 해 넘게 일했고, 이 자리를 가장 오래 맡은 사람으로 남았습니다.\n\n김동연 대통령의 뒤를 이어 경제부총리를 했던 사람이 다시 그의 정부에서 곳간을 맡았습니다. 두 사람은 같은 부처에서 자랐고 숫자를 읽는 방식이 같습니다."
 TFRKPHN_sk_kdy_kim_bu_gyeom_HM_desc:0 "출생: 1958년 대한민국 경상북도 상주\n\n이력: 대한민국의 국무총리\n김부겸은 서울대학교 정치학과를 나와 재야에서 민주화 운동을 했습니다. 경기도 군포에서 세 번 국회의원에 당선된 뒤 대구로 내려가 여러 번 떨어졌고 2016년 수성구 갑에서 당선되었습니다. 2017년 행정안전부 장관, 2021년 국무총리를 지냈습니다.\n\n세 김씨 가운데 한 사람이 다른 김씨의 정부에서 총리를 맡았습니다. 김동연 대통령은 경제를, 그는 국회를 맡는다는 약속이 두 사람 사이에 있습니다."
 TFRKPHN_sk_kdy_lee_jong_seok_IntelM_desc:0 "출생: 1958년 대한민국\n\n이력: 대한민국의 국가정보원장\n이종석은 세종연구소에서 북한을 연구한 학자입니다. 노무현 정부에서 국가안전보장회의 사무차장으로 일했고 2006년 통일부 장관을 지냈습니다.\n\n북쪽을 평생 들여다본 학자가 정보기관을 맡았습니다. 김동연 대통령은 공작보다 분석을 앞세우는 국가정보원을 원합니다."
 TFRKPHN_sk_kdy_lee_won_ook_IM_desc:0 "출생: 대한민국 충청남도 보령\n\n이력: 대한민국의 행정안전부 장관\n이원욱은 경기도 화성에서 세 번 국회의원에 당선되었습니다. 국회 과학기술정보방송통신위원장을 지냈습니다. 2024년 더불어민주당을 떠나 개혁신당에 합류했습니다.\n\n그는 큰 당을 박차고 나와 제3지대를 만들려던 사람입니다. 김동연 대통령의 연립 정부에서 그 경력은 흠이 되지 않습니다. 양쪽 당에 모두 아는 사람이 있기 때문입니다."
 TFRKPHN_sk_kdy_suh_wook_TM_desc:0 "출생: 1963년 대한민국 광주광역시\n\n이력: 대한민국의 국방부 장관\n서욱은 육군사관학교를 나왔습니다. 합동참모본부 작전본부장을 거쳐 2019년 육군참모총장이 되었습니다. 2020년 국방부 장관에 올랐습니다.\n\n작전통으로 불리던 예비역 대장입니다. 그는 이 부처를 한 번 맡아 본 사람이고, 김동연 대통령은 그 점을 보고 그를 불렀습니다."
 TFRKPHN_sk_kdy_wi_sung_lac_FM_desc:0 "출생: 1954년 대한민국\n\n이력: 대한민국의 외교부 장관\n위성락은 1979년 외무고시에 합격해 외교관이 되었습니다. 북미국장을 지냈고 2009년부터 한반도평화교섭본부장으로 북핵 협상의 수석대표를 맡았습니다. 2011년부터 네 해 동안 주러시아 대사를 지냈습니다.\n\n협상 탁자에 오래 앉아 본 직업 외교관입니다. 김동연 대통령은 정치인 대신 그를 골랐습니다. 북쪽과 러시아를 함께 아는 사람이 지금 외교부에 필요합니다."
 TFRKPHN_sk_kms_cho_tae_yeol_FM_desc:0 "출생: 1955년 대한민국 경상북도 영양\n\n이력: 대한민국의 외교부 장관\n조태열은 1979년 외교부에 들어갔습니다. 세계무역기구의 분쟁 패널 의장을 맡았고 주스페인 대사와 외교부 제2차관을 지냈습니다. 2016년부터 국제연합 주재 대사를 맡았습니다. 시인 조지훈의 아들입니다.\n\n통상과 국제기구를 두루 거친 직업 외교관입니다. 전쟁 뒤 끊긴 교역로를 다시 잇는 일이 그에게 왔습니다."
 TFRKPHN_sk_kms_choi_sang_mok_EM_desc:0 "출생: 1963년 대한민국 서울특별시\n\n이력: 대한민국의 기획재정부 장관\n최상목은 서울대학교 법과대학을 나와 1985년 행정고시에 합격했습니다. 재정경제부와 금융위원회에서 금융 정책을 맡았고 코넬 대학교에서 경제학 박사 학위를 받았습니다. 2016년 기획재정부 제1차관이 되었습니다.\n\n김무성 대통령은 금융을 아는 관료에게 경제를 맡겼습니다. 전쟁 빚을 어떻게 굴릴지가 이 정부의 가장 큰 숙제이기 때문입니다."
 TFRKPHN_sk_kms_ha_tae_keung_IntelM_desc:0 "출생: 1968년 대한민국 부산\n\n이력: 대한민국의 국가정보원장\n하태경은 대학 시절 학생운동을 하다 옥살이를 했습니다. 뒤에 북한 인권 운동으로 방향을 틀었습니다. 2012년 부산 해운대에서 제19대 국회의원에 당선된 뒤 내리 세 번 당선되었습니다.\n\n북한 인권 운동을 하던 사람이 정보기관의 장이 되었습니다. 그는 북쪽에서 나오는 소식을 오래 들여다본 사람입니다."
 TFRKPHN_sk_kms_han_ki_ho_TM_desc:0 "출생: 1952년 대한민국 경상남도 밀양\n\n이력: 대한민국의 국방부 장관\n한기호는 전쟁 중 피난지에서 태어났습니다. 육군사관학교 31기로 임관해 제2사단장과 철원을 맡는 제5군단장, 육군 교육사령관을 지내고 2010년 중장으로 전역했습니다. 그해 재보궐선거로 국회에 들어온 뒤 강원도 접경 지역에서 네 번 당선되었습니다.\n\n휴전선 바로 아래에서 군단을 지휘했고 그곳에서 표를 얻은 사람입니다. 김무성 대통령은 북쪽을 가장 가까이서 본 장군에게 군을 맡겼습니다."
 TFRKPHN_sk_kms_kwon_young_se_HM_desc:0 "출생: 1959년 대한민국 서울특별시\n\n이력: 대한민국의 국무총리\n권영세는 서울대학교 법과대학을 나와 검사로 일했습니다. 2002년 서울 영등포구 을 재보궐선거에서 당선된 뒤 세 번 내리 당선되었습니다. 2013년부터 주중국 대사를 지냈고 2020년 서울 용산에서 다시 국회의원이 되었습니다.\n\n김무성 대통령은 당 살림과 선거를 여러 번 맡아 본 사람을 총리로 골랐습니다. 헌정회복연대가 이끄는 정부에서 그는 연립에 들어온 당들의 요구를 조율합니다."
 TFRKPHN_sk_kms_won_hee_ryong_IM_desc:0 "출생: 1964년 대한민국 제주도 서귀포\n\n이력: 대한민국의 행정안전부 장관\n원희룡은 대학 입학 시험과 사법시험에서 모두 수석을 했습니다. 검사로 일하다 2000년 서울 양천구 갑에서 제16대 국회의원에 당선되었고 세 번 내리 당선되었습니다. 2014년 제주특별자치도지사가 되어 두 번 도정을 맡았습니다.\n\n도지사를 두 번 지낸 경험으로 지방 행정을 맡았습니다. 김무성 대통령은 그에게 미뤄진 지방선거를 탈 없이 치르라고 주문했습니다."
 TFRKPHN_sl_category_desc:0 "서울런은 2021년 8월 서울시가 형편이 어려운 학생들에게 온라인 강의를 무료로 열어 준 사업입니다. 2026년 5월 가입자가 4만 명을 넘었습니다. 이제 그 문을 나라 전체로 넓힙니다.\n\n지금 수강생: §Y[?TFRKPHN_sl|0]만 명§! / 50만 명\n수강생 만 명마다 §G연구 속도§!가 0.1퍼센트 오르고, §G빈곤 개선§!과 §G사회 발전§!이 달마다 조금씩 빨라집니다. 지금 연구 속도 §G[?TFRKPHN_sl_rspct|1]퍼센트§! (졸업식 몫 포함)"
 TFRKPHN_tae_yeongho_char_desc:0 "태영호는 북한 외교관 출신 정치인입니다. 주영국 북한대사관 공사로 일하다 2016년 가족과 함께 대한민국으로 망명했습니다. 망명 뒤에는 북한 체제의 실상을 알리는 데 앞장섰습니다. 2020년 서울 강남구 갑에서 국회의원에 당선되었습니다. 탈북민 출신 첫 지역구 국회의원입니다.\n\n평양의 권력층을 가까이서 지켜본 그가 이제 이북5도위원회를 이끌고 북으로 올라갑니다. 2016년 런던을 떠날 때만 해도 다시 평양 땅을 밟을 날이 올 줄은 몰랐습니다."
 TFRKPHN_ulsan_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_ulsan_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§91962년 정부가 이곳을 특정공업지구로 지정하면서 작은 바닷가 고을이 공업 도시로 바뀌었습니다. 조선소와 자동차 공장, 석유화학 단지가 차례로 들어섰습니다. 한때는 지나가는 개도 만 원짜리를 물고 다닌다는 말이 돌 만큼 돈이 돌았습니다.\n\n반구천 바위에는 수천 년 전 사람들이 새긴 고래가 남아 있습니다. 그 바다에 지금은 수십만 톤짜리 배가 떠 있습니다. 태화강은 한때 물고기가 떼죽음하던 강이었는데 이제 십리대숲과 국가정원이 들어섰습니다. 도시 살림이 몇몇 대기업 실적에 달려 있다는 게 울산의 오랜 걱정입니다. 조선 경기가 꺾이던 해에는 동구 원룸촌이 통째로 비었습니다. 퇴직한 숙련공들이 고향으로 내려가면서 일손을 구하기도 어려워졌습니다. 공장 굴뚝 사이로 수소차와 배터리 공장이 새로 올라가고 있습니다.§!\n\n§g고래의 무덤 위에 세워진 거대한 철의 성, 풍요의 횃불이 내일의 숨결을 태우는 모순의 제국.§![GetTFRKPHNGov_ulsan]"
 TFRKPHN_uni_category_desc:0 "\n\n\n\n\n\n\n\n\n\n\n\n서울은 2021년 서울비전 2030에서 유니콘 기업 40개를, 2023년 성수동 창업허브 계획에서 50개를 목표로 내걸었습니다. 이제 그 목표를 나라 전체에서 채웁니다.\n\n지금 유니콘 기업: §Y[?TFRKPHN_uni|0]§! / 50\n유니콘 하나마다 §G연구 속도 0.2퍼센트§!, §G민수공장 건설 속도 0.2퍼센트§!씩 빨라집니다. 지금 §G[?TFRKPHN_uni_pct|1]퍼센트§!"
 TFRKPHN_wd_b_ally_tt:0 "§Y동맹국에 전쟁 비용 분담을 요청한다§!\n함께 싸운 PDTO 회원국들에 전쟁 비용의 일부를 나눠 지자고 요청합니다. 한 번만 꺼낼 수 있는 말입니다.\n\n비용: £pol_power §Y30§!\n전쟁 국채 §G-25§!\n국가 부채 §G-25십억§!\n\n§g1번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_b_biz_tt:0 "§Y재계가 국채를 사 준다§!\n주요 그룹이 국채를 사들입니다. 빚의 주인이 바뀔 뿐이고, 재계는 그만큼 할 말이 많아집니다.\n\n비용: £pol_power §Y15§!\n전쟁 국채 §G-20§!\n§g국가 부채는 줄지 않습니다.§!\n재계의 저항 §R+10§!\n\n§g1번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_b_bond_tt:0 "§Y승전 채권을 발행한다§!\n국민에게 채권을 팔아 외국에 진 빚부터 갚습니다. 기한이 120일 늘어납니다.\n\n비용: £pol_power §Y15§!\n전쟁 국채 §G-15§!\n§g국가 부채는 줄지 않습니다.§!\n안정도 §R-2%§!\n기한 §G+120일§!\n\n§g1번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_b_cut_tt:0 "§Y복구 사업을 미룬다§!\n급하지 않은 복구 사업을 뒤로 미루고 그 돈으로 빚을 갚습니다.\n\n비용: £pol_power §Y10§!\n전쟁 국채 §G-15§!\n국가 부채 §G-15십억§!\n안정도 §R-1%§!\n\n§g한 번 쓰면 60일 동안 다시 쓸 수 없습니다.§!\n§g2번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_b_export_tt:0 "§Y방산 수출 대금으로 갚는다§!\n전쟁에서 성능을 보인 무기를 사겠다는 나라가 줄을 섰습니다. 그 대금을 국채 상환에 돌립니다.\n\n비용: £pol_power §Y10§!\n전쟁 국채 §G-15§!\n국가 부채 §G-15십억§!\n\n§g한 번 쓰면 120일 동안 다시 쓸 수 없습니다.§!\n§g2번까지 쓸 수 있습니다.§!"
 TFRKPHN_wd_b_seize_tt:0 "§Y정경유착 추징금을 국고에 넣는다§!\n정경유착 수사로 기소된 사람들에게서 거둔 추징금을 국채 상환에 씁니다.\n\n비용: 없음\n전쟁 국채 §G-15§!\n국가 부채 §G-15십억§!\n\n§g1번까지 쓸 수 있습니다.§!\n§R재벌 개혁 탭의 정경유착 수사를 기소까지 끝내야 합니다.§!"
 TFRKPHN_wd_b_surplus_tt:0 "§Y남은 군수 재고를 판다§!\n전쟁이 끝나고 남은 탄약과 장비를 우방에 팝니다. 군은 반기지 않습니다.\n\n비용: £pol_power §Y10§!\n전쟁 국채 §G-20§!\n국가 부채 §G-20십억§!\n전쟁 지지도 §R-2%§!\n\n§g한 번 쓰면 90일 동안 다시 쓸 수 없습니다.§!\n§g2번까지 쓸 수 있습니다.§!"
 TFRKPHN_woo_arc_b1_tt:0 "§Y참전 결정 국무회의록§!\n양안전쟁에 끼어들기로 한 날의 국무회의 기록입니다. 누가 찬성했고 누가 말이 없었는지 적혀 있습니다.\n\n누르면 이 문서를 공개합니다.\n정치력 §R-20§!  개방 §G+5§!  안정도 §R-1%§!\n한 번 공개한 문서는 다시 덮을 수 없습니다."
 TFRKPHN_woo_arc_b2_tt:0 "§Y돌아오지 못한 사람들의 명단§!\n비밀 지원에 나갔다가 숨진 군인과 선원의 이름입니다. 가족들도 받지 못한 명단입니다.\n\n누르면 이 문서를 공개합니다.\n정치력 §R-20§!  개방 §G+5§!  안정도 §R-1%§!\n한 번 공개한 문서는 다시 덮을 수 없습니다."
 TFRKPHN_woo_arc_b4_tt:0 "§Y여의도의 사흘 통신 기록§!\n전차가 국회 앞에 서 있던 사흘 동안의 지휘 통신입니다. 명령을 내린 사람과 따르지 않은 사람이 나옵니다.\n\n누르면 이 문서를 공개합니다.\n정치력 §R-20§!  개방 §G+5§!  안정도 §R-1%§!\n한 번 공개한 문서는 다시 덮을 수 없습니다."
 TFRKPHN_woo_category_desc:0 "낡은 질서를 새로 짜는 일은 빠를수록 좋지만, 너무 빠르면 나라가 따라오지 못합니다.\n\n§Y개방§!: [?TFRKPHN_woo_open|0] / 100\n\n§Y23대 총선§!(2028년 4월)에서 개방이 §Y50§! 이상이고 안정도가 §Y45%§! 이상이며 §Y여의도 협약§!을 맺었다면 이행은 성공합니다. 개방이 §R60§!을 넘었는데 안정도가 §R45%§!보다 낮으면 위기가 옵니다."
 TFRKPHN_woo_chung_sye_kyun_HM_desc:0 "출생: 1950년 대한민국 전라북도 진안\n\n이력: 대한민국의 국무총리\n정세균은 쌍용그룹에서 상무까지 지낸 뒤 1996년 제15대 국회의원에 당선되었습니다. 고향에서 네 번, 서울 종로에서 두 번 당선되었습니다. 2006년 산업자원부 장관을 지냈고 2016년부터 두 해 동안 국회의장을 맡았습니다. 2020년에는 국무총리가 되었습니다.\n\n국회의장을 지낸 대통령이 국회의장을 지낸 사람을 총리로 불렀습니다. 그는 여야 누구와도 밥을 먹을 수 있는 사람입니다. 포격 뒤의 국회를 다시 한자리에 앉히는 일이 그의 몫입니다."
 TFRKPHN_woo_con_b7_tt:0 "§Y부칙§! 이 헌법을 공포할 때의 대통령은 다음 국회의원 총선거일에 물러난다.\n\n찬성 §Y200석§! 이상일 때 누르면 이 조문을 확정합니다.\n정치력 §R-30§!  안정도 §G+3%§!\n확정하면 찬성 의석이 §R6석§! 빠집니다.\n앞의 여섯 조문을 모두 확정해야 합니다. 대통령이 직접 넣자고 한 조항입니다.\n일곱 장을 모두 확정하면 안정도 §G+5%§!"
 TFRKPHN_woo_ind_b1_tt:0 "§Y홍범도§!  1868 ~ 1943\n\n\n\n\n\n£GFX_TFRKPHN_woo_ind_card_1_texticon\n\n\n\n\n\n\n§H생애§!\n평안도에서 태어났습니다.\n1907년 포수들을 모아 의병을 일으켰습니다.\n1937년 카자흐스탄 크즐오르다로 강제 이주를 당했습니다.\n극장 수위로 일하다 그곳에서 눈을 감았습니다.\n\n§H업적§!\n1919년 대한독립군을 만들었습니다.\n1920년 6월 봉오동에서 일본군을 크게 이겼습니다.\n같은 해 10월 청산리에서도 싸웠습니다.\n2021년 광복절에 유해가 돌아와 대전현충원에 묻혔습니다.\n건국훈장 대한민국장을 받았습니다.\n\n누르면 이 이름을 새긴 동판을 사관학교와 부대 정문에 겁니다.\n정치력 §R-25§!  전쟁 지지도 §G+1%§!  군사 발전도 §G+0.02§!\n여섯 장을 모두 걸면 안정도 §G+3%§!"
 TFRKPHN_woo_ind_b2_tt:0 "§Y김좌진§!  1889 ~ 1930\n\n\n\n\n\n£GFX_TFRKPHN_woo_ind_card_2_texticon\n\n\n\n\n\n\n§H생애§!\n충청남도 홍성에서 태어났습니다.\n만주로 건너가 독립군을 이끌었습니다.\n1930년 1월 정미소에서 총에 맞아 숨졌습니다.\n\n§H업적§!\n북로군정서 사령관을 맡았습니다.\n1920년 10월 청산리에서 일본군과 싸워 이겼습니다.\n1925년 신민부의 총사령관이 되었습니다.\n1929년 한족총연합회 주석을 맡았습니다.\n건국훈장 대한민국장을 받았습니다.\n\n누르면 이 이름을 새긴 동판을 사관학교와 부대 정문에 겁니다.\n정치력 §R-25§!  전쟁 지지도 §G+1%§!  군사 발전도 §G+0.02§!\n여섯 장을 모두 걸면 안정도 §G+3%§!"
 TFRKPHN_woo_ind_b3_tt:0 "§Y지청천§!  1888 ~ 1957\n\n\n\n\n\n£GFX_TFRKPHN_woo_ind_card_3_texticon\n\n\n\n\n\n\n§H생애§!\n서울에서 태어났습니다.\n일본 육군사관학교를 나와 일본군 장교가 되었습니다.\n1919년 부대를 빠져나와 만주로 망명했습니다.\n\n§H업적§!\n신흥무관학교에서 독립군을 길렀습니다.\n1940년 한국광복군이 만들어질 때 총사령관을 맡았습니다.\n광복 뒤 제헌 국회의원과 첫 무임소 장관을 지냈습니다.\n건국훈장 대통령장을 받았습니다.\n\n누르면 이 이름을 새긴 동판을 사관학교와 부대 정문에 겁니다.\n정치력 §R-25§!  전쟁 지지도 §G+1%§!  군사 발전도 §G+0.02§!\n여섯 장을 모두 걸면 안정도 §G+3%§!"
 TFRKPHN_woo_ind_b4_tt:0 "§Y이범석§!  1900 ~ 1972\n\n\n\n\n\n£GFX_TFRKPHN_woo_ind_card_4_texticon\n\n\n\n\n\n\n§H생애§!\n서울에서 태어났습니다.\n중국 운남강무학교를 수석으로 나왔습니다.\n북로군정서에서 교관으로 일했습니다.\n\n§H업적§!\n1920년 10월 청산리에서 부대를 지휘했습니다.\n1945년 한국광복군 참모장이 되었습니다.\n1948년 첫 국무총리와 국방부 장관을 함께 맡았습니다.\n건국훈장 대통령장을 받았습니다.\n\n누르면 이 이름을 새긴 동판을 사관학교와 부대 정문에 겁니다.\n정치력 §R-25§!  전쟁 지지도 §G+1%§!  군사 발전도 §G+0.02§!\n여섯 장을 모두 걸면 안정도 §G+3%§!"
 TFRKPHN_woo_ind_b5_tt:0 "§Y이회영§!  1867 ~ 1932\n\n\n\n\n\n£GFX_TFRKPHN_woo_ind_card_5_texticon\n\n\n\n\n\n\n§H생애§!\n서울의 이름난 집안에서 태어났습니다.\n1910년 나라를 빼앗기자 여섯 형제가 재산을 모두 팔았습니다.\n온 집안이 만주로 건너갔습니다.\n1932년 일본 경찰에 붙잡혀 심문을 받다 숨졌습니다.\n\n§H업적§!\n만주에 신흥강습소를 세웠습니다.\n이 학교가 신흥무관학교로 자라 독립군 간부를 길러 냈습니다.\n청산리에서 싸운 지휘관 여럿이 이 학교에서 나왔습니다.\n\n누르면 이 이름을 새긴 동판을 사관학교와 부대 정문에 겁니다.\n정치력 §R-25§!  전쟁 지지도 §G+1%§!  군사 발전도 §G+0.02§!\n여섯 장을 모두 걸면 안정도 §G+3%§!"
 TFRKPHN_woo_ind_b6_tt:0 "§Y안중근§!  1879 ~ 1910\n\n\n\n\n\n£GFX_TFRKPHN_woo_ind_card_6_texticon\n\n\n\n\n\n\n§H생애§!\n황해도 해주에서 태어났습니다.\n삼흥학교를 세우고 돈의학교를 맡아 아이들을 가르쳤습니다.\n나라가 기울자 연해주로 건너가 의병이 되었습니다.\n1910년 3월 26일 뤼순 감옥에서 순국했습니다.\n\n§H업적§!\n대한의군 참모중장으로 의병을 이끌었습니다.\n1909년 동지 열두 명과 손가락을 끊어 맹세했습니다.\n1909년 10월 26일 하얼빈에서 이토 히로부미를 쏘았습니다.\n건국훈장 대한민국장을 받았습니다.\n\n누르면 이 이름을 새긴 동판을 사관학교와 부대 정문에 겁니다.\n정치력 §R-25§!  전쟁 지지도 §G+1%§!  군사 발전도 §G+0.02§!\n여섯 장을 모두 걸면 안정도 §G+3%§!"
 TFRKPHN_woo_kim_bu_gyeom_IM_desc:0 "출생: 1958년 대한민국 경상북도 상주\n\n이력: 대한민국의 행정안전부 장관\n김부겸은 서울대학교 정치학과를 나와 재야에서 민주화 운동을 했습니다. 경기도 군포에서 세 번 국회의원에 당선된 뒤 대구로 내려가 여러 번 떨어졌고 2016년 수성구 갑에서 당선되었습니다. 2017년 행정안전부 장관, 2021년 국무총리를 지냈습니다.\n\n그는 이 부처를 한 번 맡아 본 사람입니다. 미뤄진 지방선거를 다시 치르고 경찰을 제자리에 돌려놓는 일이 그에게 왔습니다. 대구에서 표를 얻어 본 민주당 사람이라는 점도 대통령이 그를 고른 까닭입니다."
 TFRKPHN_woo_kim_dong_yeon_EM_desc:0 "출생: 1957년 대한민국 충청북도 음성\n\n이력: 대한민국의 기획재정부 장관\n김동연은 상업고등학교를 나와 은행에 다니며 야간 대학을 마쳤고 행정고시와 입법고시에 합격했습니다. 기획재정부 제2차관과 국무조정실장, 아주대학교 총장을 지냈습니다. 2017년 경제부총리가 되었고 2022년 경기도지사에 당선되었습니다.\n\n전쟁과 포격을 거치며 나라 살림은 구멍이 났습니다. 우원식 대통령은 정당 색이 옅은 관료 출신에게 곳간을 맡겼습니다. 그는 예산 숫자를 직접 고치는 장관으로 알려져 있습니다."
 TFRKPHN_woo_kim_yong_woo_TM_desc:0 "출생: 1961년 대한민국 전라남도 장성\n\n이력: 대한민국의 국방부 장관\n김용우는 육군사관학교 39기로 임관했습니다. 합동참모본부 전략기획본부장을 지냈고 2017년 육군참모총장에 올라 2019년까지 육군을 이끌었습니다. 총장 시절 병사 개인 장비를 바꾸는 사업을 밀었습니다.\n\n국회 앞에 전차가 섰던 군을 다시 세워야 합니다. 우원식 대통령은 포격 때 현역이 아니었던 예비역 대장을 불렀습니다. 그는 누가 명령을 내렸고 누가 따랐는지부터 가려야 합니다."
 TFRKPHN_woo_park_jin_FM_desc:0 "출생: 1956년 대한민국 서울특별시\n\n이력: 대한민국의 외교부 장관\n박진은 1977년 외무고시에 합격했고 옥스퍼드 대학교에서 정치학 박사 학위를 받았습니다. 김영삼 정부 청와대에서 비서관으로 다섯 해를 일했습니다. 서울 종로에서 세 번, 강남에서 한 번 국회의원에 당선되었고 제18대 국회에서 외교통상통일위원장을 맡았습니다.\n\n우원식 대통령은 보수 정당 사람인 그에게 외교를 맡겼습니다. 과도 정부가 한쪽 진영의 정부로 보이지 않게 하려는 뜻입니다. 그는 PDTO 회원국들에게 한국의 헌정이 돌아왔다고 알리는 일부터 시작합니다."
 TFRKPHN_woo_suh_hoon_IntelM_desc:0 "출생: 1954년 대한민국\n\n이력: 대한민국의 국가정보원장\n서훈은 국가정보원에서 스물여덟 해를 일한 정보관입니다. 대북 협상을 오래 맡았고 두 차례 남북 정상회담의 실무를 했습니다. 2006년 제3차장에 올랐고 2017년 국가정보원장이 되었으며 2020년 국가안보실장으로 옮겼습니다.\n\n우원식 대통령은 정보기관을 정보기관 사람에게 돌려주었습니다. 그는 문서고에 잠긴 전쟁 기록이 어디에 있는지 아는 몇 안 되는 사람입니다."
 TFRKPHN_yoon_hee_sook_HM_desc:0 "출생: 1970년 대한민국 서울특별시\n\n이력: 대한민국의 국무총리\n서울대학교 경제학과와 같은 대학원을 나와 미국 컬럼비아대학교에서 경제학 박사 학위를 받은 윤희숙은 한국개발연구원에서 재정과 복지 정책 연구부장을 지냈습니다. 최저임금위원회 공익위원과 국민경제자문회의 위원으로도 일했습니다. 2020년 총선에서 서울 서초갑에 당선됐고, 그해 7월 30일 국회 본회의 5분 발언으로 널리 알려졌습니다. 2021년 8월 25일 부친의 농지법 위반 의혹에 책임을 지겠다며 의원직 사퇴를 선언했습니다. 오세훈 대통령은 그를 첫 국무총리로 지명했습니다."
 TFRKPHN_yoon_sang_hyeon_FM_desc:0 "출생: 1962년 대한민국 충청남도 청양\n\n이력: 대한민국의 외교부 장관\n윤상현은 서울대학교 경제학과를 나와 조지워싱턴 대학교에서 국제정치학 박사 학위를 받았습니다. 2008년 제18대 국회의원에 당선된 뒤 인천에서 다섯 번 내리 당선되었습니다. 2018년부터 두 해 동안 국회 외교통일위원장을 맡았습니다.\n\n그는 당을 떠나 조원진 정부에 합류했습니다. 이 정부에서 외국 정상과 통화해 본 사람은 그가 거의 유일합니다. PDTO 회원국들은 국회에 전차를 보낸 정부의 외교부 장관을 쉽게 만나 주지 않습니다."
 TFRKP_HN_354desc_hong:0 "어제 국민의힘과 국민의당 양당이 합당을 공식적으로 선언했습니다. 제20대 대통령 선거에서 홍준표 후보가 승리해 국민의힘이 정권교체를 이루고 집권여당이 되면서 합당 논의가 급물살을 타고 추진된 것으로 확인됩니다.\n\n국민의힘과 국민의당이 공식적으로 합당을 선언하면서 20대 대통령 선거 기간 내내 서로 불편한 관계를 지냈던 이준석 국민의힘 대표와 안철수 국민의당 대표가 서로 손을 마주잡고 악수하는 모습을 보였습니다. 합당 합의문에서는 나온 합당 방식은 당 대 당으로 통합이며, 당명은 국민의힘으로 쓰기로 했습니다.\n\n양당은 최고위원회에도 국민의당 몫으로 2명을 임명하기로 했으며 국민의당 출신 후보가 공천을 신청한 지역에 대해 기존의 당원투표 50% + 여론조사 50% 방식에서 여론조사 100% 방식으로 경선을 실시하기로 했습니다.\n\n이번 합당에 동의를 표한 안철수 의원은 2012년 정계에 입문한 이후 2014년 새정치민주연합당에 합류했으나 이후 탈당하여 국민의당을 창당, 제3지대에서 활동했습니다. 이후 2018년 바른정당과 합당하여 바른미래당 소속 정치인으로 활동했다가 2020년 바른미래당을 탈당하고 다시 국민의당 소속 정치인으로 활동하였습니다. 그렇게 안철수 의원은 7년간의 제3지대 활동과 10년간의 정치 표류를 종료하고 국민의힘 소속 보수 정치인이 되었습니다."
 TFRKP_HN_354desc_orig:0 "어제 국민의힘과 국민의당 양당이 합당을 공식적으로 선언했습니다. 제20대 대통령 선거에서 윤석열-안철수 후보 단일화를 통해 국민의힘이 정권교체를 이루고 집권여당이 되면서 합당 논의가 급물살을 타고 추진된 것으로 확인됩니다.\n\n국민의힘과 국민의당이 공식적으로 합당을 선언하면서 20대 대통령 선거 기간 내내 서로 불편한 관계를 지냈던 이준석 국민의힘 대표와 안철수 국민의당 대표가 서로 손을 마주잡고 악수하는 모습을 보였습니다. 합당 합의문에서는 나온 합당 방식은 당 대 당으로 통합이며, 당명은 국민의힘으로 쓰기로 했습니다.\n\n양당은 최고위원회에도 국민의당 몫으로 2명을 임명하기로 했으며 국민의당 출신 후보가 공천을 신청한 지역에 대해 기존의 당원투표 50% + 여론조사 50% 방식에서 여론조사 100% 방식으로 경선을 실시하기로 했습니다.\n\n이번 합당에 동의를 표한 안철수 의원은 2012년 정계에 입문한 이후 2014년 새정치민주연합당에 합류했으나 이후 탈당하여 국민의당을 창당, 제3지대에서 활동했습니다. 이후 2018년 바른정당과 합당하여 바른미래당 소속 정치인으로 활동했다가 2020년 바른미래당을 탈당하고 다시 국민의당 소속 정치인으로 활동하였습니다. 그렇게 안철수 의원은 7년간의 제3지대 활동과 10년간의 정치 표류를 종료하고 국민의힘 소속 보수 정치인이 되었습니다."
 TFRKP_HN_52desc_hong:0 "미국 내전의 발발로 전 세계가 거대한 혼란에 빠진 상황에서, 대한민국 제20대 대통령 선거가 치러졌습니다.\n\n문재인 정부 5년 동안, 부동산 가격 폭등과 코로나19 팬데믹, 그리고 임기 말 발생한 미국 내전 여파의 경제 위기까지 정말 많은 일들이 있었습니다. 이 타오르는 불길 속에서 치러진 이번 선거는 정권 재창출론과 정권 교체론이 정면으로 대립했습니다. 더불어민주당에서는 행정 경험을 강조한 이재명 후보가, 국민의힘에서는 서민 대통령을 내건 홍준표 후보가 출마하여 접전을 펼쳤습니다.\n\n투표 마감 이후 전국 개표소에서 개표가 본격화되자, 출구조사의 결과대로 극심한 초박빙 양상이 나타났습니다. 밤늦도록 두 후보의 득표율 격차는 1%p 미만에 머물렀으며, 새벽녘까지 승패를 가늠하기 힘든 상황이 이어졌습니다.\n\n전 국민의 시선이 개표 방송에 집중된 가운데, 대한민국의 앞으로의 5년을 책임질 새로운 대통령은..."
 TFRKP_HN_52desc_hong_nak:0 "미국 내전의 발발로 전 세계가 거대한 혼란에 빠진 상황에서, 대한민국 제20대 대통령 선거가 치러졌습니다.\n\n문재인 정부 5년 동안, 부동산 가격 폭등과 코로나19 팬데믹, 그리고 임기 말 발생한 미국 내전 여파의 경제 위기까지 정말 많은 일들이 있었습니다. 이 타오르는 불길 속에서 치러진 이번 선거는 정권 재창출론과 정권 교체론이 정면으로 대립했습니다. 더불어민주당에서는 국무총리와 당 대표를 지낸 이낙연 후보가, 국민의힘에서는 서민 대통령을 내건 홍준표 후보가 출마하여 접전을 펼쳤습니다.\n\n투표 마감 이후 전국 개표소에서 개표가 본격화되자, 출구조사의 결과대로 극심한 초박빙 양상이 나타났습니다. 밤늦도록 두 후보의 득표율 격차는 1%p 미만에 머물렀으며, 새벽녘까지 승패를 가늠하기 힘든 상황이 이어졌습니다.\n\n전 국민의 시선이 개표 방송에 집중된 가운데, 대한민국의 앞으로의 5년을 책임질 새로운 대통령은..."
 TFRKP_HN_52desc_nak:0 "미국 내전의 발발로 전 세계가 거대한 혼란에 빠진 상황에서, 대한민국 제20대 대통령 선거가 치러졌습니다.\n\n문재인 정부 5년 동안, 부동산 가격 폭등과 코로나19 팬데믹, 그리고 임기 말 발생한 미국 내전 여파의 경제 위기까지 정말 많은 일들이 있었습니다. 이 타오르는 불길 속에서 치러진 이번 선거는 정권 재창출론과 정권 교체론이 정면으로 대립했습니다. 더불어민주당에서는 국무총리와 당 대표를 지낸 이낙연 후보가, 국민의힘에서는 정권 심판을 내건 윤석열 후보가 출마하여 접전을 펼쳤습니다.\n\n투표 마감 이후 전국 개표소에서 개표가 본격화되자, 출구조사의 결과대로 극심한 초박빙 양상이 나타났습니다. 밤늦도록 두 후보의 득표율 격차는 1%p 미만에 머물렀으며, 새벽녘까지 승패를 가늠하기 힘든 상황이 이어졌습니다.\n\n전 국민의 시선이 개표 방송에 집중된 가운데, 대한민국의 앞으로의 5년을 책임질 새로운 대통령은..."
