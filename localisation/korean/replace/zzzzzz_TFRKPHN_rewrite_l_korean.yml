 TFRKPHN_le_bio_o11:0 "£GFX_KOR_DemocraticParty_texticon §Y신용한§!  도전\n§Y출생:§! 1969년, 충청북도 청주\n§Y이력:§!\n창업투자회사 대표를 지냈습니다. 박근혜 정부에서 대통령직속 청년위원장을\n맡았습니다. 바른미래당 후보로 충북도지사 선거에 나섰다가 낙선했습니다.\n \n§Y이 세계에서는:§!\n야당의 충북도지사 후보입니다."
