 TFRKPHN_by_para_na:0 "당 안에서는 세 이름이 나온다. 정몽준은 일곱 번 당선된 원로이고, 2014년 서울시장 선거에 나갔다가 졌다. 나경원은 동작을이 지역구인 5선 의원인데, 2021년 보궐선거 경선에서 오세훈에게 밀린 사람이다. 둘 다 이름값은 크지만 시청에 들어간 뒤에 대통령의 말을 들을 사람은 아니다."
 TFRKPHN_by_para_two:0 "당 안에서는 두 이름이 나온다. 정몽준은 당이 불러낸 원로다. 1988년에 국회에 들어와 일곱 번 당선됐고 당 대표를 지냈다. 2014년 6월 4일 서울시장 선거에 나가 43.02를 얻고 졌는데, 그 뒤로 열세 해가 지났다. 이름을 모르는 유권자가 없지만, 시청에 들어간 뒤에 대통령의 말을 들을 사람은 아니다."
