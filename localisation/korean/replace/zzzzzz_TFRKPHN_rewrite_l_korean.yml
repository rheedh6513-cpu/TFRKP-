 TFRKPHN_le_bio_g8:0 "£GFX_KOR_PPP_texticon §Y최민호§!  현직\n§Y출생:§! 1956년\n§Y이력:§!\n1980년 행정고시에 합격했고 1985년 해병대 중위로 전역했습니다.\n1995년 충청남도청 기획담당관과 지역경제국장, 2000년\n안면도국제꽃박람회 조직위원회 사무차장을 지냈습니다. 2006년 충청남도\n행정부지사, 2008년 행정안전부 인사실장, 2009년 소청심사위원회\n위원장을 맡았습니다. 2011년 행정중심복합도시건설청장, 2015년\n국무총리 비서실장을 지냈습니다.\n§Y눈에 띄는 일:§!\n2002년 홍조근정훈장을 받았습니다.\n \n§Y이 세계에서는:§!\n2022년에 당선된 현직입니다."
