 TFRKPHN_le_bio_g12:0 "£GFX_KOR_PPP_texticon §Y김태흠§!  현직\n§Y출생:§! 1962년 2월 4일, 충청남도 보령\n§Y이력:§!\n1996년 자유민주연합 원내행정실에서 일했고 1998년부터\n국무총리비서실에서 행정관과 공보비서관, 총무담당 비서관을 지냈습니다.\n2004년 한나라당 충청남도당 대변인, 2006년 충청남도 정무부지사를\n맡았습니다. 2012년 보령시 서천군에서 제19대 국회의원에 당선됐고\n2016년과 2020년에도 당선돼 3선이 됐습니다. 2017년 자유한국당\n최고위원을 지냈습니다.\n \n§Y이 세계에서는:§!\n2022년에 당선된 현직입니다."
