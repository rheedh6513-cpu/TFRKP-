 TFRKPHN_gwangju_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_gwangju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9무등산 아래 빛고을. 1980년 5월 이 도시 사람들은 계엄군에 맞섰고 수많은 시민이 목숨을 잃었습니다. 금남로 옛 도청 앞에 서면 지금도 그날 이야기를 하는 어르신을 만날 수 있습니다. 민주 성지라는 이름은 광주의 자부심입니다. 5월이 오면 망월동 묘역으로 가는 길이 참배객으로 막힙니다. 광주 사람들은 그 이름이 무겁다는 말도 가끔 합니다.\n\n그 이름만으로 먹고살 수는 없었습니다. 산업화 시기 공장과 도로는 영남으로 먼저 갔고, 광주에는 기아 공장 하나가 오래 버팀목이었습니다. 광주형 일자리로 세운 자동차 공장이 캐스퍼를 찍어 내기 시작했지만 청년들은 여전히 서울행 KTX를 탑니다. 예향이라는 별명답게 비엔날레도 열리고 음식 맛도 소문났지만, 충장로 상인들은 요즘 손님 절반이 외지 사람이라고 합니다.§!\n\n§t사랑도 명예도 이름도 남김없이\n한평생 나가자던 뜨거운 맹세\n동지는 간데없고 깃발만 나부껴\n새날이 올 때까지 흔들리지 말자§![GetTFRKPHNGov_gwangju]"
 TFRKPHN_hg_b_bukhan_tt:0 "§Y북한강 댐 연계 운영§!\n1973년 춘천에 들어선 소양강댐을 중심으로 화천, 춘천, 의암, 청평으로 이어지는 북한강의 댐들을 하나로 묶어 운영합니다. 휴전선 가까이에는 1989년 1단계를 마친 화천 평화의댐이 있습니다.\n\n완공되면 §Y강원§!에 건물 칸 §G+1§!, §Y발전소§! §G1개§!, 지역 변동치 §Y댐§!(건설 속도 §G+10퍼센트§!, 보급 §G+20퍼센트§!)\n§Y오세이돈§! 재난 대비 점수 §G+10§!\n\n누르면 §Y정치력 75§!을 내고 §Y120일§! 뒤 완공됩니다.\n아래 막대가 §Y노랑§!이면 짓는 중, §G초록§!이면 완공입니다."
 TFRKPHN_hg_b_bus_tt:0 "§Y한강버스를 늘린다§!\n2025년 9월 마곡과 잠실 사이 28.9킬로미터에서 처음 뜬 한강버스를 늘리고 수도권과 금강 물길로 넓힙니다.\n\n완공되면 수도권과 충청에 §Y기반 시설§! §G+1§!\n\n누르면 §Y정치력 50§!을 내고 §Y90일§! 뒤 완공됩니다.\n아래 막대가 §Y노랑§!이면 짓는 중, §G초록§!이면 완공입니다."
 TFRKPHN_hg_b_imjin_tt:0 "§Y임진강 홍수 조절§!\n북쪽에서 예고 없이 내려오는 물을 막으려고 2013년 연천에 군남홍수조절지를, 2016년 포천과 연천에 한탄강댐을 지었습니다. 두 시설을 키우고 경보망을 넓힙니다.\n\n완공되면 §Y서울과 경기§!에 건물 칸 §G+1§!, §Y발전소§! §G1개§!, 지역 변동치 §Y댐§!(건설 속도 §G+10퍼센트§!, 보급 §G+20퍼센트§!)\n§Y오세이돈§! 재난 대비 점수 §G+15§!\n\n누르면 §Y정치력 60§!을 내고 §Y90일§! 뒤 완공됩니다.\n아래 막대가 §Y노랑§!이면 짓는 중, §G초록§!이면 완공입니다."
 TFRKPHN_hg_b_namhan_tt:0 "§Y남한강 수계 정비§!\n1985년 충주댐과 2000년 횡성댐, 여주의 세 보를 잇는 남한강 물길을 손봅니다.\n\n완공되면 §Y충청§!에 건물 칸 §G+1§!, §Y발전소§! §G1개§!, 지역 변동치 §Y댐§!(건설 속도 §G+10퍼센트§!, 보급 §G+20퍼센트§!)\n§Y오세이돈§! 재난 대비 점수 §G+10§!\n\n누르면 §Y정치력 75§!을 내고 §Y120일§! 뒤 완공됩니다.\n아래 막대가 §Y노랑§!이면 짓는 중, §G초록§!이면 완공입니다."
 TFRKPHN_hg_b_paldang_tt:0 "§Y팔당 상수원 보강§!\n북한강과 남한강이 만나는 팔당은 수도권 이천만 명이 마시는 물의 시작입니다. 댐과 취수장을 보강합니다.\n\n완공되면 §Y서울과 경기§!에 건물 칸 §G+1§!, §Y발전소§! §G1개§!, 지역 변동치 §Y댐§!(건설 속도 §G+10퍼센트§!, 보급 §G+20퍼센트§!)\n§Y오세이돈§! 재난 대비 점수 §G+5§!\n\n누르면 §Y정치력 60§!을 내고 §Y90일§! 뒤 완공됩니다.\n아래 막대가 §Y노랑§!이면 짓는 중, §G초록§!이면 완공입니다."
 TFRKPHN_hg_category_desc:0 "서울시장 시절 한강에서 벌인 일들을 나라 전체의 사업으로 키웁니다. 지도에서 §Y한강버스§!와 북한강, 남한강, 팔당, 임진강의 §Y댐§!을 눌러 지을 수 있습니다. 댐을 지으면 그 지역에 발전소와 §Y댐§! 변동치가 생깁니다.\n\n한강버스, 수변 개발, 빗물터널을 모두 마치면 사건이 일어나고, 네 유역의 댐을 모두 마치면 또 하나의 사건이 일어납니다."
 TFRKPHN_hmj_desc:0 "출생: 1955년 대한민국 경기도 양주\n\n이력: 대한민국의 국무총리, 대통령 권한대행\n홍문종은 1996년 의정부에서 제15대 국회의원에 당선되었고, 재보궐선거를 포함해 모두 네 번 당선되었습니다. 새누리당 사무총장을 지냈습니다. 2019년 당을 떠나 조원진과 함께 우리공화당 공동대표가 되었습니다.\n\n조원진 대통령의 첫 국무총리입니다. 국회가 탄핵소추안을 가결하자 대통령의 직무가 멈췄고, 헌법에 따라 총리인 그가 권한대행을 맡았습니다. 그는 대통령실에 들어가지 않고 총리 집무실에서 일합니다. 헌법재판소가 결정을 내릴 때까지 새 정책을 내지 않겠다고 밝혔습니다."
 TFRKPHN_hng_desc:0 "§Y장부를 맞춘 사람§!\n\n홍남기는 김동연 정부에서 나라 살림을 맡았던 사람입니다.\n\n1960년 강원도 춘천에서 태어났습니다. 경제 부처에서 예산과 정책 조정을 맡아 온 관료입니다. 2016년 미래창조과학부 제1차관, 2017년 국무조정실장이 됐습니다.\n\n2018년 12월 경제부총리에 올라 2022년 5월까지 일했습니다. 이 자리를 가장 오래 맡은 사람으로 남았습니다.\n\n그는 김동연 대통령과 함께 나라 빚 장부의 마지막 줄을 맞췄습니다. 두 사람은 같은 부처에서 자랐고 숫자를 읽는 방식이 같습니다. 신민당은 그 장부를 이어 갈 사람으로 그를 내세웠습니다.\n\n그는 말수가 적은 관료로 알려져 왔습니다. 경제부총리 시절에는 재난지원금의 크기를 두고 여당과 여러 번 맞섰고, 그때마다 나라 빚의 숫자를 들고 나왔습니다.\n\n선거 운동 기간에 그는 하루에 공장 두 곳과 시장 한 곳을 돌았습니다. 상인들과 이야기할 때도 그는 수첩에 숫자를 적었습니다.\n\n김동연 정부에서 그는 해마다 예산안을 국회에 들고 가서 항목마다 직접 설명했습니다. 그는 유세장에서도 연설문보다 표를 먼저 꺼냈습니다. 그의 공약집에는 약속마다 들어갈 돈과 그 돈이 나올 곳이 함께 적혀 있습니다.\n\n그를 반대하는 사람들은 그가 사람보다 숫자를 먼저 본다고 말합니다. 그는 그 말에 반박하지 않았습니다."
 TFRKPHN_hong_b04_01_desc:0 "1987년 헌법은 민주화를 뿌리내리게 했지만, 40년 가까이 지나며 낡은 조항들이 국정의 발목을 잡고 있습니다. 역대 정부는 개헌을 약속하고도 집권하면 미뤄 왔습니다. 전쟁에서 이긴 지금이 '87년 체제'를 넘어설 마지막 기회입니다. 개헌안을 국회에 올리고, 300일 안에 찬성 200석을 모아야 합니다."
 TFRKPHN_hong_b05_09_desc:0 "총선을 준비합니다."
 TFRKPHN_hong_b05_10_desc:0 "패전과 탄핵을 거치며 이 나라 정치를 수십 년 동안 나눠 가졌던 두 거대 정당이 함께 무너지고 있습니다. 빈자리를 두고 안철수와 심상정이 제3지대 연합을 저울질하고, 오른쪽 끝에서는 조원진의 우리공화당이 거리의 분노를 모아 몸집을 키우고 있습니다. 제3지대가 하나로 나서면 연합이, 갈라지면 우리공화당이 이길 것입니다."
 TFRKPHN_hong_moon_jong_HM_desc:0 "출생: 1955년 대한민국 경기도 양주\n\n이력: 대한민국의 국무총리\n홍문종은 하버드 대학교에서 공부했습니다. 1996년 의정부에서 제15대 국회의원에 당선되었고, 재보궐선거를 포함해 모두 네 번 당선되었습니다. 새누리당 사무총장을 지냈습니다. 2019년 당을 떠나 조원진과 함께 우리공화당 공동대표가 되었습니다.\n\n조원진 대통령과 함께 광화문 천막을 지킨 사람입니다. 대통령은 첫 총리 자리를 그에게 맡겼습니다. 국회에 정부 편이 몇 없으니 총리가 할 수 있는 일은 많지 않습니다."
 TFRKPHN_hs_category_desc:0 "오세훈은 2026년 5월 서울시장 선거 공약에서 31만 호를 압도적인 속도로 공급하겠다고 했습니다. 이제 그 숫자를 대통령의 목표로 삼습니다.\n\n지금 착공: §Y[?TFRKPHN_hs|0]만 호§! / 31만 호\n만 호마다 §G안정도 0.1퍼센트§!, §G건설 속도 0.2퍼센트§!가 오릅니다. 지금 건설 속도 §G[?TFRKPHN_hs_pct|1]퍼센트§!\n빠르게 밀어붙이는 결정은 §R개발 반발§!을 키웁니다(2028 총선에 영향)."
 TFRKPHN_hwang_jeong_yeop_char_desc:0 "박현준, 그를 정의하는 것은 무엇일까요? 남한의 간첩? 북한의 구원자? 불법 월북자? 자유의 수호자? 극단적 반공주의자?\n\n박현준, 그는 2002년 대한민국 평창의 다소 유복한 집안에서 태어났습니다. 그는 평범한 삶을 살 운명이었습니다.\n\"2010년, 연평도에서의 일이 있기 전까지는요.\"\n\n연평도 포격전 당시 연평도를 여행 중이던 어린 그는 북한의 잔혹함을 눈으로 보았습니다. 그의 삶은 뒤틀리기 시작하였습니다.\n\n그의 학창 시절은 좋지 못했습니다. 친구들과 어울리지 못했고, 더 나아가 따돌림을 받으며 살아왔습니다. 그의 정신은 점차 피폐해져 갔고, 그 피폐는 2020년, 미국 내전과 코로나19로 가정이 파탄 나며 절정을 찍었습니다.\n\n벼랑 끝까지 몰린 그는 어릴 적 기억과 오랫동안 담아 온 공산주의에 대한 증오를 떠올렸습니다. 그는 자살을 원하였고, 자살을 하더라도 그것이 헛되지는 않았으면 했습니다.\n\n그는 결국 월북을 했습니다. 북한에서 민주화 투쟁을 하다 죽겠다고. 그러나 막상 북한에 도착했을 때의 풍경은 그의 상상보다 더욱 참혹했습니다.\n\n그는 마음을 고쳐먹었습니다. 공산주의에 대한 증오를 더욱 불태우기로, 더 나아가 아시아에서 공산주의를 축출한다는 원대한 꿈을 가지기 시작했습니다.\n\n여러 고난이 찾아왔지만 그는 이겨냈고, 소망은 이루어졌습니다. 북한은 마침내 내전에 돌입했습니다. 그에게 봉기의 시간이 찾아왔습니다. 공산주의에 대한 증오를 표출할 시간 말입니다.\n\n§Y\"북녘 동포여 일어나라! 멸공의 횃불 아래 목숨을 걸자!\"§!"
 TFRKPHN_hwangbo_seung_hee_IntelM_desc:0 "출생: 대한민국 부산\n\n이력: 대한민국의 국가정보원장\n황보승희는 부산 영도에서 정치를 시작했습니다. 영도구의원에 세 번, 부산시의원에 두 번 당선되며 지방의회에서 열다섯 해를 보냈습니다. 2020년 부산 중구와 영도구에서 제21대 국회의원에 당선되었습니다.\n\n그는 당을 떠나 조원진 정부에 합류했습니다. 정보기관에 몸담은 적이 없는 사람이 국가정보원을 맡았습니다. 대통령은 정보기관 출신보다 자기 사람을 원했습니다."
 TFRKPHN_ibuk5do_tt:0 "§Y자유조선군§!이 §Y이북5도위원회§!가 되어 §Y대한민국의 괴뢰국§!이 됩니다.\n지도자: §Y태영호§! (집권: §Y권위주의 민주§!)\n국민정신 §Y대한민국 국군의 지원§!: 사단 공격 §G+20%§!, 방어 §G+20%§!, 조직력 §G+10%§!\n§R북한§!은 §R중국의 괴뢰국§!이 됩니다."
 TFRKPHN_impeach_category_desc:0 "\n\n\n\n\n\n\n\n\n\n\n\n패전의 책임을 대통령에게 묻는 목소리가 국회에서 탄핵소추로 모이고 있습니다. 소추안이 가결되려면 재적 의원 3분의 2인 §Y200명§!의 찬성이 필요합니다.\n\n탄핵 찬성 예상: §R[?TFRKPHN_imp_yes|0]§!명 / 200명\n  처음부터 찬성하는 야당(민주당계, 진보정당): [?TFRKPHN_imp_opp|0]명\n  탄핵파(여당 이탈, 강경 보수, 무소속): §R[?TFRKPHN_imp_def|0]§!명\n\n탄핵파는 §Y14일§!마다 §R6명§!씩 늘어납니다. §Y책임회피§!나 §Y역공시도§! 중점을 마친 뒤 찬성이 §Y200명§!을 넘으면 소추안이 가결되고 §Y이인제 국무총리§!가 대통령 권한대행이 됩니다.\n\n---- §Y국회 원내 구성§! ----\n§3민주당계§!: [?KOR_NatAsm_DP_seats|0]석\n§A보수정당§!: [?KOR_NatAsm_PPP_seats|0]석\n§d진보정당§!: [?KOR_NatAsm_JP_seats|0]석\n§O제3지대§!: [?KOR_NatAsm_PP_seats|0]석\n§g무소속§!: [?KOR_NatAsm_Ind_seats|0]석\n§W우익 정당§!: [?KOR_NatAsm_ORP_seats|0]석"
 TFRKPHN_incheon_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_incheon_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§91883년 제물포가 개항하자 외국 배와 사람이 가장 먼저 이 항구로 들어왔습니다. 차이나타운의 짜장면도, 붉은 벽돌 창고도 그때부터 이어진 것입니다. 전쟁 때는 상륙작전이 있었고, 산업화 시기에는 부평과 주안 공단이 밤낮으로 돌았습니다.\n\n지금 인천은 두 도시처럼 보입니다. 갯벌을 메운 송도와 청라에는 유리 빌딩이 올라갔고, 동구와 중구 원도심 골목에서는 빈집이 늘어 갑니다. 송도에 사는 사람이 배다리 헌책방 골목을 한 번도 안 가 봤다는 이야기도 흔합니다. 공항과 항만을 오가는 화물차가 하루 종일 도로를 메웁니다. 서울로 출근하는 사람이 많아 인천 사람들은 우리 도시가 서울의 베드타운 취급을 받는다고 투덜댑니다. 그러면서도 야구 시즌이면 문학경기장을 가득 채웁니다.§!\n\n§3떠나는 이들의 설렘과 남겨진 이들의 애환이 공존하는, 영원한 경계의 도시.§![GetTFRKPHNGov_incheon]"
 TFRKPHN_jeju_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_jeju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9봄이면 유채꽃이 피고 겨울이면 동백이 집니다. 한 해 천만 명 넘는 관광객이 이 섬을 찾습니다. 1948년 4월 3일부터 몇 해 동안 수많은 섬사람이 목숨을 잃었고, 제주 사람들은 동백꽃 배지를 달아 그 일을 기억합니다. 중산간 마을 곳곳에 아직 그때의 무덤과 비석이 남아 있습니다.\n\n관광객이 늘면서 땅값이 뛰었습니다. 곶자왈과 해안가에 리조트와 카페가 들어섰고 여름이면 쓰레기와 하수 처리가 감당이 안 됩니다. 젊은 제주 사람들은 집값 때문에 고향에서 집을 못 구한다고 합니다. 할머니들이 쓰던 제주어는 유네스코 소멸위기 언어 목록에 올랐습니다. 손주들은 할머니 말을 반쯤밖에 못 알아듣습니다. 바다에 나가는 해녀는 해마다 줄고, 남은 해녀 대부분이 일흔을 넘겼습니다.§!\n\n§O비극의 핏빛 역사와 탐욕스러운 개발의 상처를 아름다운 풍광으로 애써 덮어둔, 위태로운 낙원의 이중주.§![GetTFRKPHNGov_jeju]"
 TFRKPHN_jeonnam_gwangju_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_gwangju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9무등산 아래 빛고을. 1980년 5월 이 도시 사람들은 계엄군에 맞섰고 수많은 시민이 목숨을 잃었습니다. 금남로 옛 도청 앞에 서면 지금도 그날 이야기를 하는 어르신을 만날 수 있습니다. 민주 성지라는 이름은 광주의 자부심입니다. 5월이 오면 망월동 묘역으로 가는 길이 참배객으로 막힙니다. 광주 사람들은 그 이름이 무겁다는 말도 가끔 합니다.\n\n그 이름만으로 먹고살 수는 없었습니다. 산업화 시기 공장과 도로는 영남으로 먼저 갔고, 광주에는 기아 공장 하나가 오래 버팀목이었습니다. 광주형 일자리로 세운 자동차 공장이 캐스퍼를 찍어 내기 시작했지만 청년들은 여전히 서울행 KTX를 탑니다. 예향이라는 별명답게 비엔날레도 열리고 음식 맛도 소문났지만, 충장로 상인들은 요즘 손님 절반이 외지 사람이라고 합니다.§!\n\n§t사랑도 명예도 이름도 남김없이\n한평생 나가자던 뜨거운 맹세\n동지는 간데없고 깃발만 나부껴\n새날이 올 때까지 흔들리지 말자§![GetTFRKPHNGov_jg]"
 TFRKPHN_job_tt_gov:0 "§Y정부§!\n노선을 고르기 전: 결정 비용 §Y20§!, 일자리 x1.0\n하르츠식 대타협: 결정 비용 §Y25§!, 일자리 §Gx1.2§!\n국회 입법으로 돌파: 결정 비용 §Y15§!, 일자리 §Rx0.8§!\n\n노사정 합의문에 서명하면 여기에 다시 §Gx1.5§!를 곱합니다.\n\n§g[TFRKPHN_mof] 신임이 70 이상이면 배수 +0.1, 30 이하면 -0.1§!"
 TFRKPHN_job_tt_logo_biz:0 "§Y경제 5단체§!\n경영계를 대표하는 다섯 단체를 묶어 부르는 말입니다.\n\n§Y대한상공회의소§!\n1884년 한성상업회의소를 뿌리로 삼습니다. 1952년\n상공회의소법으로 법정 단체가 됐습니다.\n\n§Y한국경제인협회§!\n1961년 같은 이름으로 출발했습니다. 1968년\n전국경제인연합회가 됐다가 2023년 옛 이름으로 돌아왔습니다.\n대기업이 중심입니다.\n\n§Y한국무역협회§!\n수출입 기업의 단체입니다.\n\n§Y중소기업중앙회§!\n1962년 중소기업협동조합중앙회로 출발했습니다. 2006년\n지금 이름이 됐습니다.\n\n§Y한국경영자총협회§!\n1970년에 생겼습니다. 노사 문제에서 경영계를 대표하고,\n2015년 노사정 대타협 합의문에도 서명했습니다."
 TFRKPHN_job_tt_logo_lab:0 "§Y한국노동조합총연맹 (한국노총)§!\n민주노총과 함께 양대 노총으로 불리는 노동조합 총연합\n단체입니다.\n\n§Y역사§!\n1946년 3월 10일 대한독립촉성노동총연맹으로 출발했습니다.\n1961년 8월 한국노동조합총연맹으로 다시 결성됐습니다.\n2015년 9월 노사정 대타협 합의문에 노동계 대표로\n서명했습니다."
 TFRKPHN_kb_category_desc:0 "김문수 정부는 큰 공사를 한꺼번에 벌입니다. 돈은 국채를 찍어 댑니다.\n\n나랏빚 §Y[?TFRKPHN_kb_debt|0]§!\n\n공사가 끝날 때마다 건물이 서고 나랏빚이 쌓입니다. 나랏빚이 쌓인 만큼 소비재 공장이 더 들어갑니다. 나랏빚이 §R60§!을 넘으면 환율이 흔들립니다."
 TFRKPHN_kim_han_sol_char_desc:0 "김한솔은 김정은의 이복형 김정남의 아들입니다.\n\n어릴 때 북한을 떠나 마카오 등지에서 자랐고, 2011년 보스니아 헤르체고비나의 유나이티드월드칼리지 모스타르에 입학했습니다. 2012년 핀란드 방송과의 인터뷰에서는 북한 주민의 생활이 나아지도록 돕고 싶다고 말했습니다.\n\n2017년 2월 아버지가 쿠알라룸푸르 공항에서 숨진 뒤, 3월 8일 천리마민방위가 올린 영상에 나와 무사히 피신했다고 밝혔습니다. 천리마민방위는 뒤에 자유조선으로 이름을 바꾸었습니다. 그 뒤 그의 행방은 확인되지 않았습니다."
 TFRKPHN_kim_hong_kyun_IntelM_desc:0 "출생: 1961년 대한민국 부산광역시\n\n이력: 대한민국의 국가정보원장\n김홍균은 1984년 제18회 외무고시에 합격했습니다. 2009년 평화외교기획단장을 맡았습니다. 2014년에는 국가안보실 정책조정비서관으로 국가안전보장회의 사무차장을 겸했습니다. 2016년 한반도평화교섭본부장이 되어 북핵 문제를 맡았습니다. 2022년 주독일 대사, 2024년 외교부 제1차관을 지냈습니다.\n\n정보기관 출신은 아닙니다. 이인제 대통령은 정보를 모으는 사람보다 정보를 받아 쓰던 사람을 원장에 앉혔습니다. 김홍균은 북한 문제를 협상장과 안보실 양쪽에서 다뤘습니다."
 TFRKPHN_kim_jin_tae_IM_desc:0 "출생: 1964년 대한민국 강원도 춘천\n\n이력: 대한민국의 내무부 장관\n김진태는 서울대학교 법과대학을 나와 검사가 되었고 원주지청장을 지냈습니다. 2012년 고향 춘천에서 제19대 국회의원에 당선되었고 한 번 더 당선되었습니다. 2022년에는 강원도지사에 당선되었습니다.\n\n그는 도지사 자리를 내놓고 조원진 정부에 들어왔습니다. 경찰과 지방 행정이 그의 손에 있습니다. 검사 시절의 버릇대로 그는 무슨 일이든 법 조문부터 찾습니다."
 TFRKPHN_kim_yong_hyeon_TM_desc:0 "출생: 1959년 대한민국 경상남도 마산\n\n이력: 대한민국의 국방부 장관\n김용현은 육군사관학교 38기로 임관했습니다. 보병 제17사단장을 지냈고 2013년 중장으로 진급했습니다. 합동참모본부 작전본부장을 끝으로 2017년 전역했습니다.\n\n합동참모본부에서 작전을 짜던 장군입니다. 조원진 대통령은 여의도로 전차를 보낼 때 그의 이름으로 명령을 내렸습니다. 군 안에서는 그 명령을 두고 아직도 말이 갈립니다."
 TFRKPHN_kj_nuke_category_desc:0 "북한의 핵과 중국의 위협이 눈앞에 있습니다. 대한민국과 일본은 오랜 앙금을 접고 공동 핵억지력을 갖추기로 했습니다.\n\n두 나라가 모두 협정에 서명하면 공동 사업이 시작됩니다. 이후 단계는 두 나라 중 어느 쪽이든 맡아 끝내면 양국 모두 다음 단계로 넘어갑니다.\n\n§Y천연우라늄 -> 옐로 케이크§!에서 길은 둘로 나뉩니다.\n§Y플루토늄의 길§!: 핵연료봉 -> 원자로 -> 폐연료봉 -> 재처리 공장 -> 플루토늄 -> 핵탄두\n§Y우라늄의 길§!: 원심분리기 -> 고농축 우라늄 -> 핵탄두\n\n어느 길이든 핵탄두가 완성되면 양국 모두 핵폭탄을 받습니다."
 TFRKPHN_kj_p6_tt:0 "§Y플루토늄 핵탄두§!\n정치력 §R-50§!, 60일, 가동 중 §R민간 공장 3개§! 사용\n선행: §Y플루토늄 추출§! 완료\n§G대한민국과 일본§!이 각각 §R핵폭탄 2기§!\n세계 긴장도 §R+5§!, 북한과 중국의 반감\n§g우리나라가 다른 시설을 가동 중이거나, 이 길을 상대국이 맡았으면 누를 수 없습니다.§!"
 TFRKPHN_kj_u3_tt:0 "§Y우라늄 핵탄두§!\n정치력 §R-50§!, 60일, 가동 중 §R민간 공장 3개§! 사용\n선행: §Y고농축 우라늄§! 완료\n§G대한민국과 일본§!이 각각 §R핵폭탄 2기§!\n세계 긴장도 §R+5§!, 북한과 중국의 반감\n§g우리나라가 다른 시설을 가동 중이거나, 이 길을 상대국이 맡았으면 누를 수 없습니다.§!"
 TFRKPHN_kjt_desc:0 "§Y법대로§!\n\n김진태는 조원진 대통령의 뒤를 이은 사람입니다.\n\n1964년 강원도 춘천에서 태어났습니다. 1983년 서울대학교 법과대학에 들어갔고 1986년 사법시험에 합격했습니다. 1992년 검사가 되어 대검찰청 조직범죄과장을 지냈고, 2009년 원주지청장을 끝으로 검찰을 떠나 변호사가 됐습니다.\n\n2012년 고향 춘천에서 제19대 국회의원에 당선됐고 2016년에 한 번 더 당선됐습니다. 2020년 선거에서는 졌습니다. 2022년 강원도지사에 당선돼 다시 일어섰습니다.\n\n그는 도지사 자리를 내놓고 조원진 정부의 내무부 장관이 됐습니다. 일 년 반 사이 총리가 세 번 바뀌었고 그가 네 번째로 지명됐습니다. 대통령이 임기를 남기고 물러나면서 그는 권한대행 자리를 넘겨받았습니다.\n\n내무부 장관 시절 경찰은 야당 집회의 신고서를 조문을 들어 돌려보냈습니다. 그는 법이 허락하는 만큼만 했다고 말했습니다. 대통령의 측근들은 그를 믿지 않았지만, 그가 맡은 일을 끝내는 속도는 믿었습니다. 총리 후보 명단에 그의 이름이 오른 것도 그 속도 때문이었습니다. 권한대행이 된 첫날 그는 국무회의를 헌법 조문을 읽는 것으로 열었습니다.\n\n지명될 때 그의 이름을 아는 국민은 많지 않았습니다. 그는 무슨 일이든 법 조문부터 찾습니다. 국세청과 검찰과 방송이 차례로 그의 손에 들어오고 있습니다. 벽의 숫자판은 그가 원하는 숫자를 보여 줍니다."
 TFRKPHN_kmu_desc:0 "§Y투표함의 대통령§!\n\n김문수는 대한민국의 대통령입니다.\n\n그는 서울대학교에서 두 번 제적되었고, 미싱 공장에 위장 취업해 노동 운동을 시작했습니다. 1970년대와 80년대에 그는 공단의 노조를 이끌었고, 두 번 감옥에 갔습니다. 붙잡혀 있는 동안 구타와 전기 고문을 받았지만 동지들의 이름을 대지 않았습니다.\n\n1994년 그는 보수 정당에 들어갔습니다. 옛 동지들은 그를 등 돌린 사람으로 기억했습니다. 그는 보수의 불모지라던 부천에서 국회의원을 세 번 지냈고, 경기도지사를 두 번 지냈습니다. 도지사 시절에는 수도권 땅속에 급행철도를 놓자는 계획을 내놓았습니다.\n\n도지사에서 물러난 뒤 그는 선거에서 잇달아 졌고, 광화문 집회의 연단에 서는 날이 늘었습니다. 조원진은 그 연단에서 그를 다시 만났고, 자기 정부의 마지막 총리로 불렀습니다. 조원진이 물러나자 그는 권한대행이 되었고 조기 선거에서 압승했습니다. 공단의 노동자들과 탄핵 이후 오른쪽으로 돌아선 청년들이 함께 그의 이름을 적었습니다.\n\n대통령이 된 뒤에도 그는 한 달에 한 번 새벽에 공단 정문에 섭니다. 노조 위원장들은 약속 없이 그의 집무실에 들어갈 수 있는 몇 안 되는 사람들입니다. 그의 정부에 반대하는 사람들은 그 위원장들이 먼저 등을 돌리는 날을 기다립니다.\n\n그는 선거에서 이기면 나라를 바꿀 수 있다고 믿습니다. 그래서 투표함에는 손대지 않고, 판사와 신문과 선거구부터 하나씩 손봅니다."
 TFRKPHN_koh_dong_jin_EM_desc:0 "이력: 대한민국의 산업통상자원부 장관\n1984년 평사원으로 삼성전자에 입사한 고동진은 2015년 12월 무선사업부장에 올랐고, 사장 겸 IM부문장으로 회사의 휴대전화 사업을 이끌었습니다. 오세훈 대통령은 정치 경험이 없는 그를 기업에서 영입해 산업통상자원부 장관으로 지명했습니다."
 TFRKPHN_kp_b4_tt:0 "§Y응답을 더한다§!\n지역별 숫자를 한 번 더 더합니다. 숫자는 백을 넘어갈 수 있습니다.\n\n정치력 §R-25§!  발표 지지율 §G+12§!\n§R실제 민심은 숫자판과 반대로 움직입니다.§!\n발표 지지율이 §Y88§! 이상일 때 누를 수 있습니다.\n다시 누르려면 §Y60일§!을 기다려야 합니다."
 TFRKPHN_kp_category_desc:0 "청와대 본관 벽에 숫자판이 걸려 있습니다. 월요일 아침마다 새 숫자가 올라갑니다. 아래 그림을 누르면 숫자가 오르고, 숫자가 높을수록 안정도와 정치력이 따라옵니다.\n숫자판이 보여 주지 않는 숫자가 하나 더 있습니다. 두 숫자가 멀어질수록 나라는 소리 없이 흔들립니다."
 TFRKPHN_kuk_center_tt:0 "§Y국 - 나라 국§!\n\n여섯 도의 삼각형을 모두 채우면 누를 수 있습니다.\n누르면 국민정신 §Y대한민국 6도 균형발전§!을 얻습니다.\n\n,  건물 건설 속도 §G+15%§!\n,  기반시설 건설 속도 §G+20%§!\n,  개인 가치 변동치 §G+10%§!\n,  사업 가치 변동치 §G+10%§!\n,  기타 비용 §G-15%§!"
 TFRKPHN_kuk_tt_bohae:0 "§Y보해양조§! (전라도 향토기업)\n§g설립 1950년 / 전남 목포§!\n목포에서 시작한 호남 대표 주류 회사로, 소주 '잎새주'를 만듭니다.\n\n전라도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n전북, 전남 지지도 §G+5%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_tt_daemyung:0 "§Y대명건설§! (강원도 건설사)\n§g설립 2023년 / 강원 동해§!\n동해시에 본사를 둔 강원 지역 1위 종합건설사입니다.\n\n강원도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n강원 지지도 §G+3%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_tt_douzone:0 "§Y더존비즈온§! (강원도 향토기업)\n§g설립 1991년 / 강원 춘천§!\n회계, 전사적자원관리(ERP) 소프트웨어 회사로, 본사를 춘천 강촌으로 옮겼습니다.\n\n강원도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n강원 지지도 §G+5%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_tt_hshwasung:0 "§YHS화성§! (경상도 건설사)\n§g설립 1958년 / 대구§!\n옛 화성산업. 대구, 경북을 대표하는 건설사로, 아파트 브랜드 '파크드림'으로 알려져 있습니다.\n\n경상도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n경북, 경남 지지도 §G+3%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_tt_jpdc:0 "§Y제주개발공사§! (제주도 향토기업)\n§g설립 1995년 / 제주§!\n제주특별자치도가 세운 공기업으로, 생수 '제주삼다수'를 만듭니다.\n\n제주도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n제주 지지도 §G+5%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_tt_kyeryong:0 "§Y계룡건설산업§! (충청도 건설사)\n§g설립 1970년 / 대전§!\n대전, 충청을 대표하는 건설사로, 아파트 브랜드 '엘리프'로 알려져 있습니다.\n\n충청도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n충청 지지도 §G+3%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_tt_mackis:0 "§Y맥키스컴퍼니§! (충청도 향토기업)\n§g설립 1973년 / 대전§!\n옛 선양주조. 대전, 충남의 향토 소주와 계족산 황톳길로 알려진 회사입니다.\n\n충청도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n충청 지지도 §G+5%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_tt_muhak:0 "§Y무학§! (경상도 향토기업)\n§g설립 1929년 / 경남 창원§!\n마산에서 시작한 경남 대표 주류 회사로, 소주 '좋은데이'를 만듭니다.\n\n경상도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n경북, 경남 지지도 §G+5%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_tt_ottogi:0 "§Y오뚜기§! (경기도 향토기업)\n§g설립 1969년 / 경기 안양§!\n카레와 라면으로 이름난 식품 회사입니다. 안양 공장에서 출발했습니다.\n\n경기도에 §Y민간 공장§! 또는 §Y오피스 단지§! 중 §Y무작위 1개§! 건설 (건물 칸 +1)\n경기 지지도 §G+5%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_tt_raon:0 "§Y라온건설§! (제주도 건설사)\n§g설립 1986년 / 제주 한경면§!\n제주를 기반으로 한 건설사로, 아파트 브랜드 '라온프라이빗'을 짓습니다.\n\n제주도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n제주 지지도 §G+3%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_tt_seohee:0 "§Y서희건설§! (경기도 건설사)\n§g설립 1982년 / 경기 하남§!\n수도권을 중심으로 아파트와 지역주택조합 사업을 펼쳐 온 건설사입니다.\n\n경기도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n경기 지지도 §G+3%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kuk_tt_woomi:0 "§Y우미건설§! (전라도 건설사)\n§g설립 1991년 / 광주§!\n광주에서 출발한 주택 건설사로, 아파트 브랜드 '린(Lynn)'을 내세웁니다.\n\n전라도의 §Y건설 칸 +2§!, §Y지역 등급 한 단계 발전§!, §Y기반시설 +1§!\n전북, 전남 지지도 §G+3%§!\n\n누르면 아래에 이 회사의 결정만 보입니다."
 TFRKPHN_kv_category_desc:0 "김문수 정부는 선거에서 이기는 것으로 버팁니다. 표는 공단에서 나옵니다.\n\n노동자 지지 §Y[?TFRKPHN_kv_labor|0]§!퍼센트\n예상 득표율 §Y[?TFRKPHN_kv_vote|1]§!퍼센트\n\n현장을 찾으면 노동자 지지가 오릅니다. 선거 결정은 득표율을 올리고, 노동자 지지가 높을수록 더 많이 올립니다. 노동자 지지는 달마다 §R1§!씩 내려가고, 50보다 낮으면 득표율도 달마다 따라 내려갑니다.\n국민투표 날 예상 득표율이 §Y50퍼센트§!를 넘어야 정권이 버팁니다."
 TFRKPHN_kys_desc:0 "§Y연대의 실무자§!\n\n권영세는 헌정회복연대를 이끄는 사람입니다.\n\n1959년 서울 용산에서 태어났습니다. 서울대학교 법과대학을 나와 1983년 사법시험에 합격했고 검사로 일했습니다.\n\n2002년 서울 영등포구 을 재보궐선거에서 당선된 뒤 세 번을 내리 이겼습니다. 그 뒤 두 번을 졌습니다. 2013년부터 두 해 가까이 주중국 대사를 지냈고, 2020년 고향 용산에서 다시 국회의원이 됐습니다.\n\n헌정회복연대에서 그는 김무성의 개헌안을 실무에서 이끈 사람이었습니다. 조문을 고치고 표를 세는 일이 그의 몫이었습니다. 김무성이 물러난 뒤 연대는 그를 앞에 세웠습니다.\n\n신민당의 두 사람이 함께 대통령 선거에 나서면서 표가 갈렸습니다. 그 틈으로 그가 당선됐습니다. 그를 찍은 사람은 열 명 가운데 넷이 채 되지 않았습니다. 그는 당선 소감에서 자신이 과반의 지지를 받은 대통령이 아니라는 것부터 인정했습니다. 취임식은 국회 앞마당에서 짧게 끝났습니다.\n\n연대는 김무성 정부가 세운 국회 중심의 나라를 지키겠다는 사람들의 모임입니다. 그는 그 약속을 이어받았지만 국회의 다수는 신민당의 두 갈래가 쥐고 있습니다. 그는 법안 하나를 낼 때마다 두 갈래의 의원들을 따로 만나 조문을 고칩니다.\n\n그는 큰 연설보다 조문 한 줄을 고치는 일에 시간을 씁니다. 그를 뽑지 않은 사람이 더 많은 나라에서 그는 그 일을 하루도 거르지 않습니다."
 TFRKPHN_l6_bio_g1:0 "£GFX_KOR_PPP_texticon §Y오세훈§!  현직\n§Y출생:§! 1961년, 서울 성수동\n§Y학력:§!\n대일고등학교, 고려대학교 법학\n§Y이력:§!\n1984년 사법시험에 합격해 변호사가 됐습니다. 2000년 서울\n강남을에서 제16대 국회의원에 당선됐습니다. 2006년 서울시장에\n당선됐고 2010년 재선했습니다. 2011년 무상급식 주민투표가 투표율\n미달로 끝나자 시장직에서 물러났습니다. 2021년 4월 보궐선거에서 다시\n서울시장에 당선됐습니다.\n§Y눈에 띄는 일:§!\n1990년대 아파트 일조권 소송에서 주민 쪽을 변호해 이름을 알렸습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 서울시장 후보입니다. 지금 이 자리를 맡고 있습니다."
 TFRKPHN_l6_bio_g10:0 "£GFX_KOR_PPP_texticon §Y김진태§!  현직\n§Y출생:§! 1964년 10월 13일, 강원도 춘천\n§Y학력:§!\n성수고등학교, 서울대학교 법과대학\n§Y이력:§!\n1992년 검사로 임관해 부산, 의성, 춘천, 서울의 검찰청에서\n일했습니다. 2008년 춘천지방검찰청 원주지청장을 지낸 뒤 2009년\n춘천에서 변호사가 됐습니다. 2012년 춘천에서 제19대 국회의원에\n당선됐고 2016년 재선했습니다. 2017년 대통령 선거 출마를 선언했고\n2020년 총선에서 낙선했습니다.\n§Y눈에 띄는 일:§!\n아버지는 군인, 어머니는 교사였습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 강원특별자치도지사 후보입니다. 지금 이 자리를 맡고 있습니다."
 TFRKPHN_l6_bio_g11:0 "£GFX_KOR_PPP_texticon §Y김영환§!  현직\n§Y출생:§! 1955년 5월 27일, 충청북도 청주\n§Y학력:§!\n연세대학교 치과대학\n§Y이력:§!\n1989년 치과의사로 개업했습니다. 1996년 안산에서 제15대\n국회의원에 당선됐고 2001년 과학기술부 장관을 지냈습니다. 2004년과\n2008년 총선에서 낙선했다가 2009년 재보궐선거로 국회에 돌아왔고\n2012년 4선이 됐습니다. 2016년 총선, 2018년 경기도지사\n선거, 2020년 총선에서 낙선했습니다.\n§Y눈에 띄는 일:§!\n1987년 시집에 실린 시 한 편이 훗날 민중가요로 만들어졌습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 충북도지사 후보입니다. 지금 이 자리를 맡고 있습니다."
 TFRKPHN_l6_bio_g12:0 "£GFX_KOR_PPP_texticon §Y김태흠§!  현직\n§Y출생:§! 1962년 2월 4일, 충청남도 보령\n§Y이력:§!\n1996년 자유민주연합 원내행정실에서 일했고 1998년부터\n국무총리비서실에서 행정관과 공보비서관, 총무담당 비서관을 지냈습니다.\n2004년 한나라당 충청남도당 대변인, 2006년 충청남도 정무부지사를\n맡았습니다. 2012년 보령시 서천군에서 제19대 국회의원에 당선됐고\n2016년과 2020년에도 당선돼 3선이 됐습니다. 2017년 자유한국당\n최고위원을 지냈습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 충남도지사 후보입니다. 지금 이 자리를 맡고 있습니다."
 TFRKPHN_l6_bio_g13:0 "£GFX_KOR_PPP_texticon §Y양정무§!  도전\n§Y출생:§! 전라북도 순창군 구림면\n§Y학력:§!\n전주영생고등학교, 전주대학교 행정학과\n§Y이력:§!\n1991년 골프채를 만드는 랭스필드를 세웠고 Y랭스필드 회장을 맡고\n있습니다. 랭스필드 골프채는 1993년 대전엑스포와 2005년 부산\nAPEC 정상회의의 공식 브랜드로 쓰였습니다.\n§Y눈에 띄는 일:§!\n경기도 포천의 회사 안에 고조선역사박물관을 세웠습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 전북특별자치도지사 후보입니다."
 TFRKPHN_l6_bio_g14:0 "£GFX_KOR_PPP_texticon §Y이정현§!  새 후보\n§Y출생:§! 1958년 10월 13일, 전라남도 곡성\n§Y학력:§!\n광주 살레시오고등학교, 동국대학교 정치외교학과\n§Y이력:§!\n1984년 민주정의당에 들어가 정치를 시작했습니다. 2008년 한나라당\n비례대표로 제18대 국회의원이 됐습니다. 2012년 광주 서구 을\n총선에서 낙선했습니다. 2013년 청와대 정무수석과 홍보수석을\n지냈습니다. 2014년 순천시 곡성군 재보궐선거에서 당선됐고 2016년\n순천에서 다시 당선됐습니다. 2016년 8월 새누리당 대표에 올랐다가\n그해 12월 물러났습니다. 2020년 총선에서 낙선했습니다.\n§Y눈에 띄는 일:§!\n제17대 대통령 선거 후보 경선 때 박근혜 후보의 대변인을 맡았습니다.\n보수 정당 후보로 호남 지역구에서 두 번 당선됐습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 전남광주통합특별시장 후보입니다."
 TFRKPHN_l6_bio_g15:0 "£GFX_KOR_PPP_texticon §Y이철우§!  현직\n§Y출생:§! 1955년\n§Y학력:§!\n경북대학교 사범대학\n§Y이력:§!\n수학 교사로 일하다 1985년 국가안전기획부에 들어갔고 2005년\n국가정보원에서 물러났습니다. 경북 김천에서 국회의원에 세 번\n당선됐습니다. 2018년 경상북도지사에 당선됐습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 경북도지사 후보입니다. 지금 이 자리를 맡고 있습니다."
 TFRKPHN_l6_bio_g16:0 "£GFX_KOR_PPP_texticon §Y박완수§!  현직\n§Y출생:§! 1955년 8월 10일, 경상남도 통영시 도산면\n§Y학력:§!\n마산공업고등학교, 경남대학교 행정학과, 경남대학교 행정학 박사\n§Y이력:§!\n1979년 행정고시에 합격해 합천군수와 김해부시장 등을 지냈습니다.\n2004년 재보궐선거로 창원시장이 됐고 2006년과 2010년에도 당선돼\n2014년까지 시장을 지냈습니다. 2012년과 2014년 경남도지사 후보\n경선에서 홍준표에게 졌습니다. 2014년 인천국제공항공사 사장을\n맡았습니다. 2016년 창원 의창구에서 제20대 국회의원에 당선됐고\n2020년 재선했습니다.\n§Y눈에 띄는 일:§!\n공업고등학교를 나왔고 방송통신대학교와 경남대학교에서 행정학을\n공부했습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 경남도지사 후보입니다. 지금 이 자리를 맡고 있습니다."
 TFRKPHN_l6_bio_g17:0 "£GFX_KOR_PPP_texticon §Y문성유§!  도전\n§Y출생:§! 확인하지 못함\n§Y이력:§!\n기획재정부를 비롯한 중앙정부에서 서른 해 가까이 경제, 산업, 예산 일을\n했습니다. 기획재정부 기획관리실장과 미래창조과학부 기획조정실장을 지냈고,\n한국자산관리공사 사장을 맡았습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 제주도지사 후보입니다."
 TFRKPHN_l6_bio_g2:0 "£GFX_KOR_PPP_texticon §Y박형준§!  현직\n§Y출생:§! 1960년 1월 19일, 부산 동구 초량동\n§Y학력:§!\n대일고등학교, 고려대학교 사회학과, 같은 대학원 사회학 박사\n§Y이력:§!\n중앙일보 기자와 동아대학교 교수로 일했습니다. 2004년 부산 수영구에서\n제17대 국회의원에 당선됐습니다. 이명박 정부에서 청와대 정무수석비서관을\n맡았고, 2014년부터 2016년까지 국회사무총장을 지냈습니다.\n2021년 4월 부산시장 보궐선거에서 당선됐습니다.\n§Y눈에 띄는 일:§!\n사회학 교수로 출발해 국회와 청와대, 국회사무처를 두루 거쳤습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 부산시장 후보입니다. 지금 이 자리를 맡고 있습니다."
 TFRKPHN_l6_bio_g3:0 "£GFX_KOR_PPP_texticon §Y추경호§!  현직\n§Y출생:§! 1960년, 경상북도 달성군 다사면\n§Y학력:§!\n계성고등학교, 고려대학교 경영학과, 미국 오리건대학교 경제학 석사\n§Y이력:§!\n1981년 행정고시에 합격했습니다. 경제기획원과 재정경제원에서 일했고\n1999년 세계은행 시니어 이코노미스트, 2006년 OECD 한국대표부\n공사참사관을 지냈습니다. 2010년 대통령실 경제금융비서관, 2011년\n금융위원회 부위원장, 2013년 기획재정부 제1차관, 2014년\n국무조정실장을 맡았습니다. 2016년 대구 달성군에서 제20대 국회의원에\n당선됐고 2020년 재선했습니다.\n§Y눈에 띄는 일:§!\n2005년 재정경제부 직원들이 뽑은 가장 닮고 싶은 상사에 꼽혔습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 대구시장 후보입니다. 지금 이 자리를 맡고 있습니다."
 TFRKPHN_l6_bio_g4:0 "£GFX_KOR_PPP_texticon §Y유정복§!  현직\n§Y출생:§! 1957년 6월 16일, 인천 동구 송림동\n§Y학력:§!\n제물포고등학교, 연세대학교 정치외교학과\n§Y이력:§!\n1979년 행정고시에 합격했고 1981년 육군 학사사관 1기로\n임관했습니다. 1994년 김포군수, 1995년 인천 서구청장, 1998년\n김포시장을 지냈습니다. 2004년부터 김포에서 제17, 18, 19대\n국회의원을 지냈고 2005년 박근혜 한나라당 대표의 비서실장을\n맡았습니다. 2010년 농림수산식품부 장관, 2013년 안전행정부 장관을\n거쳐 2014년 인천광역시장에 취임했습니다.\n§Y눈에 띄는 일:§!\n김포군수에 취임할 때 서른여덟 살로 당시 전국에서 가장 젊은\n군수였습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 인천시장 후보입니다. 지금 이 자리를 맡고 있습니다."
 TFRKPHN_l6_bio_g6:0 "£GFX_KOR_PPP_texticon §Y이장우§!  현직\n§Y출생:§! 1965년 2월 10일\n§Y학력:§!\n대전대학교\n§Y이력:§!\n1987년 대전대학교 총학생회장을 지냈습니다. 1997년 국회의원\n비서관과 보좌관으로 일을 시작했고 2005년 한나라당 대전시당 대변인을\n맡았습니다. 2006년부터 2010년까지 대전 동구청장을 지냈습니다.\n2012년 대전 동구에서 제19대 국회의원에 당선됐고 2016년\n재선했습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 대전시장 후보입니다. 지금 이 자리를 맡고 있습니다."
 TFRKPHN_l6_bio_g7:0 "£GFX_KOR_PPP_texticon §Y김두겸§!  현직\n§Y출생:§! 1958년 1월 25일\n§Y이력:§!\n1995년 울산시의회 의원이 됐고 1997년부터 울산 남구의회 의원을\n지냈습니다. 1998년 남구의회 부의장, 2002년부터 2006년까지\n남구의회 의장을 맡았습니다. 2006년부터 2014년까지 울산 남구청장을\n지냈습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 울산시장 후보입니다. 지금 이 자리를 맡고 있습니다."
 TFRKPHN_l6_bio_g8:0 "£GFX_KOR_PPP_texticon §Y최민호§!  현직\n§Y출생:§! 1956년\n§Y이력:§!\n1980년 행정고시에 합격했고 1985년 해병대 중위로 전역했습니다.\n1995년 충청남도청 기획담당관과 지역경제국장, 2000년\n안면도국제꽃박람회 조직위원회 사무차장을 지냈습니다. 2006년 충청남도\n행정부지사, 2008년 행정안전부 인사실장, 2009년 소청심사위원회\n위원장을 맡았습니다. 2011년 행정중심복합도시건설청장, 2015년\n국무총리 비서실장을 지냈습니다.\n§Y눈에 띄는 일:§!\n2002년 홍조근정훈장을 받았습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 세종시장 후보입니다. 지금 이 자리를 맡고 있습니다."
 TFRKPHN_l6_bio_g9:0 "£GFX_KOR_PPP_texticon §Y양향자§!  도전\n§Y출생:§! 전라남도 화순\n§Y학력:§!\n광주여자상업고등학교\n§Y이력:§!\n1985년 삼성전자 반도체 메모리설계실 연구보조원으로 들어갔습니다.\n1993년 SRAM설계팀 책임연구원, 2007년 DRAM설계팀\n수석연구원, 2011년 플래시설계팀 부장을 거쳐 2014년 상무에\n올랐습니다. 2016년 1월 더불어민주당에 영입됐습니다.\n§Y눈에 띄는 일:§!\n삼성전자에서 처음 나온 호남 출신 고졸 여성 임원으로 소개됐습니다.\n \n§Y이 세계에서는:§!\n국민의힘의 경기도지사 후보입니다."
 TFRKPHN_l6_bio_o1:0 "£GFX_KOR_DemocraticParty_texticon §Y정원오§!  도전\n§Y출생:§! 1968년 8월 12일, 전라남도 여천군(지금의 여수시)\n§Y학력:§!\n서울시립대학교 경제학과, 한양대학교 공공정책대학원 석사\n§Y이력:§!\n국회의원 보좌관과 성동구 도시관리공단 상임이사를 지냈습니다. 2014년\n서울 성동구청장에 당선됐고 2018년 재선했습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 서울시장 후보입니다."
 TFRKPHN_l6_bio_o10:0 "£GFX_KOR_DemocraticParty_texticon §Y우상호§!  도전\n§Y출생:§! 1962년 12월 12일\n§Y학력:§!\n연세대학교 국어국문학과\n§Y이력:§!\n1987년 연세대학교 총학생회장을 지냈습니다. 2000년 서울 서대문구\n갑 총선에서 낙선했고 2004년 같은 곳에서 제17대 국회의원에\n당선됐습니다. 열린우리당과 민주당의 대변인을 지냈습니다. 2012년과\n2016년에 당선됐고 2016년 더불어민주당 원내대표를 맡았습니다.\n2020년 4선에 올랐고 2021년 서울시장 후보 경선에 나섰다가\n졌습니다.\n§Y눈에 띄는 일:§!\n1987년 6월 항쟁 때 숨진 후배 이한열의 장례식에서 집행위원장을\n맡았습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 강원특별자치도지사 후보입니다."
 TFRKPHN_l6_bio_o11:0 "£GFX_KOR_DemocraticParty_texticon §Y신용한§!  도전\n§Y출생:§! 1969년, 충청북도 청주\n§Y이력:§!\n창업투자회사 대표를 지냈습니다. 박근혜 정부에서 대통령직속 청년위원장을\n맡았습니다. 바른미래당 후보로 충북도지사 선거에 나섰다가 낙선했습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 충북도지사 후보입니다."
 TFRKPHN_l6_bio_o12:0 "£GFX_KOR_DemocraticParty_texticon §Y박수현§!  도전\n§Y출생:§! 1964년 8월 14일, 충청남도 공주\n§Y학력:§!\n공주대학교 사범대학 부설고등학교, 한국방송통신대학교 행정학과, 연세대학교\n대학원 행정학 석사\n§Y이력:§!\n1992년부터 국회의원 보좌관으로 일했습니다. 2010년 충청남도\n정책특별보좌관을 지냈고 2012년 충남 공주에서 제19대 국회의원에\n당선됐습니다. 2014년 새정치민주연합 대변인을 맡았습니다. 2016년\n총선에서 근소한 차이로 낙선했습니다. 2017년 청와대 대변인이 됐고\n2018년부터 국회의장 비서실장을 지냈습니다.\n§Y눈에 띄는 일:§!\n서울대학교 서양사학과를 다니다 그만뒀습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 충남도지사 후보입니다."
 TFRKPHN_l6_bio_o13:0 "£GFX_KOR_DemocraticParty_texticon §Y이원택§!  도전\n§Y출생:§! 전라북도 김제\n§Y학력:§!\n남성고등학교, 전북대학교 화학공학과\n§Y이력:§!\n청와대 행정관과 전라북도 정무부지사를 지냈습니다. 2020년 제21대\n총선에서 국회의원에 당선됐습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 전북특별자치도지사 후보입니다."
 TFRKPHN_l6_bio_o14:0 "£GFX_KOR_DemocraticParty_texticon §Y민형배§!  새 후보\n§Y출생:§! 1961년 6월 15일, 전라남도 해남군 마산면\n§Y학력:§!\n전남대학교 사회학과\n§Y이력:§!\n1988년 전남일보 창간 때 기자로 들어갔고 1999년 논설위원이\n됐습니다. 2002년 시민단체 참여자치21 대표를 맡았습니다.\n2006년부터 노무현 정부 청와대에서 인사관리행정관과 사회조정비서관을\n지냈습니다. 2010년 광주 광산구청장에 당선됐고 2014년\n재선했습니다. 2018년부터 문재인 정부 청와대 자치발전비서관과\n사회정책비서관을 지냈고 2020년 광주 광산구 을에서 제21대 국회의원에\n당선됐습니다.\n§Y눈에 띄는 일:§!\n2011년 광산구청에서 공공부문 비정규직 일흔네 명을 모두 정규직으로\n바꿨습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 전남광주통합특별시장 후보입니다."
 TFRKPHN_l6_bio_o15:0 "£GFX_KOR_DemocraticParty_texticon §Y오중기§!  도전\n§Y출생:§! 1967년 7월 23일, 경상북도 포항\n§Y학력:§!\n대동고등학교, 영남대학교 철학과\n§Y이력:§!\n1995년부터 한국일보, 2002년부터 동아일보에서 일했습니다.\n2007년 보건복지부 장관 특별보좌관을 지냈고 2008년부터 민주당\n포항시 북구 지역위원장을 맡았습니다. 2012년 민주통합당\n경북도당위원장이 됐고 2012년과 2017년 대통령 선거에서 문재인\n후보의 경북 선거대책위원회 상임위원장을 맡았습니다. 2017년 청와대\n균형발전비서관실 선임행정관을 지냈고 2018년 경북도지사 선거에 나섰다가\n낙선했습니다.\n§Y눈에 띄는 일:§!\n포항 죽도시장에서 과일과 해산물 도매를 하던 상인의 아들입니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 경북도지사 후보입니다."
 TFRKPHN_l6_bio_o16:0 "£GFX_KOR_DemocraticParty_texticon §Y김경수§!  도전\n§Y출생:§! 1967년, 경상남도 고성군 개천면\n§Y학력:§!\n진주동명고등학교, 서울대학교 인류학과\n§Y이력:§!\n2002년 노무현 후보 선거대책위원회에서 일했고 2007년 대통령비서실\n연설기획비서관을 지냈습니다. 2009년 봉하재단 사무국장을 맡았습니다.\n2012년 김해 을 총선과 2014년 경남도지사 선거에서 낙선했습니다.\n2016년 김해 을에서 제20대 국회의원에 당선됐고 2018년\n경상남도지사에 당선됐습니다. 2021년 7월 대법원 판결로 지사직을\n잃었습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 경남도지사 후보입니다."
 TFRKPHN_l6_bio_o17:0 "£GFX_KOR_DemocraticParty_texticon §Y위성곤§!  도전\n§Y출생:§! 1968년 1월 20일, 전라남도 장흥\n§Y이력:§!\n제주대학교 총학생회장을 지냈습니다. 2006년부터 2015년까지\n제주도의회 의원으로 일했습니다. 2016년 서귀포시에서 제20대\n국회의원에 당선됐고 2020년 재선했습니다. 더불어민주당 전국농어민위원회\n위원장을 지냈습니다.\n§Y눈에 띄는 일:§!\n여덟 살 때 부모를 따라 외가가 있는 서귀포로 옮겨 왔습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 제주도지사 후보입니다."
 TFRKPHN_l6_bio_o2:0 "£GFX_KOR_DemocraticParty_texticon §Y전재수§!  도전\n§Y출생:§! 1971년 4월 20일, 경상남도 의령\n§Y학력:§!\n동국대학교 역사교육과\n§Y이력:§!\n2000년 국회 환경노동위원회 입법보좌관으로 일을 시작했습니다.\n2002년 대통령직인수위원회 행정관, 2003년 재정경제부 장관\n정책보좌관, 2004년 청와대 경제수석실 행정관을 거쳐 2006년 청와대\n제2부속실장이 됐습니다. 2006년 부산 북구청장 선거와 2008년,\n2012년 총선에서 낙선했습니다. 2016년 부산 북구강서구 갑에서\n제20대 국회의원에 당선됐고 2020년 재선했습니다.\n§Y눈에 띄는 일:§!\n여덟 살 무렵 부산 북구 만덕동으로 옮겨 와 그곳에서 자랐습니다. 세 번\n떨어진 뒤 네 번째 도전에서 당선됐습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 부산시장 후보입니다."
 TFRKPHN_l6_bio_o3:0 "£GFX_KOR_DemocraticParty_texticon §Y김부겸§!  도전\n§Y출생:§! 1958년 1월 21일, 경상북도 상주\n§Y학력:§!\n경북고등학교, 서울대학교 정치학과\n§Y이력:§!\n1988년 한겨레민주당 후보로 처음 총선에 나섰습니다. 2000년\n한나라당 후보로 경기 군포에서 제16대 국회의원에 당선됐습니다.\n2004년에는 열린우리당, 2008년에는 통합민주당 후보로 군포에서 다시\n당선됐습니다. 2012년 대구 수성구 갑 총선과 2014년 대구시장\n선거에서 낙선했습니다. 2016년 대구 수성구 갑에서 당선돼 4선이\n됐습니다. 2017년 행정안전부 장관, 2021년 5월 국무총리에\n올랐습니다.\n§Y눈에 띄는 일:§!\n1978년 긴급조치 9호 위반으로 징역형을 받아 복역했습니다. 대구에서\n두 번 떨어진 뒤 세 번째에 당선됐습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 대구시장 후보입니다."
 TFRKPHN_l6_bio_o4:0 "£GFX_KOR_DemocraticParty_texticon §Y박찬대§!  도전\n§Y출생:§! 1967년 5월 10일, 인천 미추홀구\n§Y학력:§!\n동인천고등학교, 인하대학교 경영학과, 서울대학교 대학원 경영학 석사\n§Y이력:§!\n공인회계사입니다. 1997년 세동회계법인, 1999년 삼일회계법인,\n2001년 금융감독원에서 일했고 2003년부터 2015년까지 한미회계법인\n경인본부장과 부대표를 지냈습니다. 2009년 민주당에 입당했습니다.\n2016년 인천 연수구 갑에서 제20대 국회의원에 당선됐고 2019년\n더불어민주당 원내대변인을 맡았습니다. 2020년 재선했습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 인천시장 후보입니다."
 TFRKPHN_l6_bio_o6:0 "£GFX_KOR_DemocraticParty_texticon §Y허태정§!  도전\n§Y출생:§! 1965년 9월 12일, 충청남도 예산군 대술면\n§Y학력:§!\n대전대성고등학교, 충남대학교 철학과\n§Y이력:§!\n노무현 정부 청와대에서 인사 행정관과 사회 행정관을 지냈고 과학기술부\n장관 정책보좌관으로 일했습니다. 2010년 대전 유성구청장에 당선됐고\n2014년 재선했습니다. 2018년 대전광역시장에 당선됐습니다.\n§Y눈에 띄는 일:§!\n여섯 남매의 막내입니다. 충남대학교에 다닐 때 학생운동을 했습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 대전시장 후보입니다."
 TFRKPHN_l6_bio_o7:0 "£GFX_KOR_DemocraticParty_texticon §Y김상욱§!  도전\n§Y출생:§! 1980년 1월 1일, 경상북도 의성\n§Y학력:§!\n영진고등학교, 고려대학교 법학과, 부산대학교 법학전문대학원 1기\n§Y이력:§!\n2006년부터 현대해상화재와 우리은행에서 일했습니다. 2012년 제1회\n변호사시험에 합격해 울산에서 변호사가 됐습니다. 2014년 법률사무소를\n열었고 2017년 법무법인을 세웠습니다. 2015년 울산 남구청\n법률고문변호사, 2018년 울산광역시 지방토지수용위원을 맡았습니다.\n§Y눈에 띄는 일:§!\n울산 동구 새납마을 철거 사건에서 성공 보수를 포기하고 주민과 땅 주인을\n설득해 임대차 관계로 풀었습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 울산시장 후보입니다."
 TFRKPHN_l6_bio_o8:0 "£GFX_KOR_DemocraticParty_texticon §Y조상호§!  도전\n§Y출생:§! 서울\n§Y학력:§!\n건국대학교 행정학과, 고려대학교 대학원 정치외교학 석사 과정 수료\n§Y이력:§!\n국회의원 비서관으로 정계에 들어왔습니다. 2012년 이해찬 전 국무총리를\n만났고, 세종시 경제부시장을 지냈습니다.\n \n§Y이 세계에서는:§!\n더불어민주당의 세종시장 후보입니다."
