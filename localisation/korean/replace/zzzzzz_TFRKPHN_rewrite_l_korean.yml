 TFRKPHN_le_bio_o13:0 "£GFX_KOR_DemocraticParty_texticon §Y김관영§!  현직\n§Y출생:§! 1969년 11월 15일, 전라북도 군산\n§Y학력:§!\n성균관대학교 경영학과\n§Y이력:§!\n1990년 청운회계법인에서 공인회계사로 일을 시작했습니다. 1992년\n행정고시에 합격해 재정경제부 행정사무관을 지냈고 1999년 사법시험에\n합격했습니다. 2002년부터 2011년까지 김앤장에서 변호사로\n일했습니다. 2012년 군산에서 제19대 국회의원에 당선됐고 2016년\n국민의당 후보로 재선했습니다. 2017년 국민의당 사무총장, 2018년\n바른미래당 원내대표를 맡았습니다.\n§Y눈에 띄는 일:§!\n공인회계사 시험, 행정고시, 사법시험에 모두 합격했습니다.\n \n§Y이 세계에서는:§!\n2022년에 당선된 현직입니다."
 TFRKPHN_le_bio_o13v1:0 "£GFX_KOR_DemocraticParty_texticon §Y김관영§!  도전\n§Y출생:§! 1969년 11월 15일, 전라북도 군산\n§Y학력:§!\n성균관대학교 경영학과\n§Y이력:§!\n1990년 청운회계법인에서 공인회계사로 일을 시작했습니다. 1992년\n행정고시에 합격해 재정경제부 행정사무관을 지냈고 1999년 사법시험에\n합격했습니다. 2002년부터 2011년까지 김앤장에서 변호사로\n일했습니다. 2012년 군산에서 제19대 국회의원에 당선됐고 2016년\n국민의당 후보로 재선했습니다. 2017년 국민의당 사무총장, 2018년\n바른미래당 원내대표를 맡았습니다.\n§Y눈에 띄는 일:§!\n공인회계사 시험, 행정고시, 사법시험에 모두 합격했습니다.\n \n§Y이 세계에서는:§!\n야당의 전북특별자치도지사 후보입니다."
 TFRKPHN_le_bio_o13v2:0 "£GFX_KOR_DemocraticParty_texticon §Y이원택§!  현직\n§Y출생:§! 전라북도 김제\n§Y학력:§!\n남성고등학교, 전북대학교 화학공학과\n§Y이력:§!\n청와대 행정관과 전라북도 정무부지사를 지냈습니다. 2020년 제21대\n총선에서 국회의원에 당선됐습니다.\n \n§Y이 세계에서는:§!\n야당의 전북특별자치도지사 후보입니다. 2026년 지방선거에서 당선돼 지금\n이 자리를 맡고 있습니다."
 TFRKPHN_le_bio_o14:0 "£GFX_KOR_DemocraticParty_texticon §Y민형배§!  새 후보\n§Y출생:§! 1961년 6월 15일, 전라남도 해남군 마산면\n§Y학력:§!\n전남대학교 사회학과\n§Y이력:§!\n1988년 전남일보 창간 때 기자로 들어갔고 1999년 논설위원이\n됐습니다. 2002년 시민단체 참여자치21 대표를 맡았습니다.\n2006년부터 노무현 정부 청와대에서 인사관리행정관과 사회조정비서관을\n지냈습니다. 2010년 광주 광산구청장에 당선됐고 2014년\n재선했습니다. 2018년부터 문재인 정부 청와대 자치발전비서관과\n사회정책비서관을 지냈고 2020년 광주 광산구 을에서 제21대 국회의원에\n당선됐습니다.\n§Y눈에 띄는 일:§!\n2011년 광산구청에서 공공부문 비정규직 일흔네 명을 모두 정규직으로\n바꿨습니다.\n \n§Y이 세계에서는:§!\n야당의 전남광주통합특별시장 후보입니다."
 TFRKPHN_le_bio_o14v1:0 "£GFX_KOR_DemocraticParty_texticon §Y민형배§!  새 후보\n§Y출생:§! 1961년 6월 15일, 전라남도 해남군 마산면\n§Y학력:§!\n전남대학교 사회학과\n§Y이력:§!\n1988년 전남일보 창간 때 기자로 들어갔고 1999년 논설위원이\n됐습니다. 2002년 시민단체 참여자치21 대표를 맡았습니다.\n2006년부터 노무현 정부 청와대에서 인사관리행정관과 사회조정비서관을\n지냈습니다. 2010년 광주 광산구청장에 당선됐고 2014년\n재선했습니다. 2018년부터 문재인 정부 청와대 자치발전비서관과\n사회정책비서관을 지냈고 2020년 광주 광산구 을에서 제21대 국회의원에\n당선됐습니다.\n§Y눈에 띄는 일:§!\n2011년 광산구청에서 공공부문 비정규직 일흔네 명을 모두 정규직으로\n바꿨습니다.\n \n§Y이 세계에서는:§!\n야당의 전남광주통합특별시장 후보입니다. 2026년 지방선거에서 졌고 다시\n도전합니다."
