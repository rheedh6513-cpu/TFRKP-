 TFRKP_HN_x_KOR_democratic_party_desc_orig:0 "민주당의 대내외적 잘못으로 인해 국민들이 실망한 것은 분명합니다. 하지만 그렇기에, 우리는 전 정부의 잘못을 타산지석 삼아 국민들에게 더 가까이 다가가야 합니다. 진정으로 민주주의를 위해, 자유를 위해 함께 나아갑시다. 그리고 그런 당신의 꿈을 위해, 이재명의 왼쪽 손을 잡아야 합니다."
 TFRKP_HN_x_KOR_election_attack_ppp_desc_orig:0 "대한민국의 국가원수인 대통령은 어떤 공직자보다 모범이 되어야 함에도 불구하고 이재명 대통령 후보는 여러 전과가 있는 데다, 패륜적 발언을 입에 담았던 적이 있습니다. 어떻게 최소한의 인간 도리도 하지 못하는 이에게 표를 줄 수 있겠습니까? 저런 사람에게는 단 한 표조차 아깝습니다!"
 TFRKP_HN_x_korea_116_desc_orig:0 "이재명 후보는 선거유세에서 민생과 경제 회복을 약속했으며, 윤석열 후보와 달리 자신은 행정업무와 정계에서의 경험이 있으며, 위기에 강한 대통령 후보라며 자신을 어필했습니다. 그의 메시지는 많은 시민들의 공감을 얻었고, 현장의 분위기는 뜨거웠습니다. 이재명 지지자들은 더욱 결집하여 여론이 빠르게 요동치고 있습니다."
 TFRKP_HN_x_korea_122_desc_orig:0 "\"후보님, 반갑습니다. 오늘도 참 좋은 하루 아닙니까?\"\n\n평소에 그를 탐탁지 않아 하던 윤 후보였지만, 경선에서 승리한 지 이틀밖에 지나지 않아 기분이 한껏 올라 있던 날이었다.\n\n\"하하, 우리 이 대표 덕이 크지요. 이 대표가 젊은 친구들의 마음을 잘 돌려주었습니다.\"\n\"후보님, 말씀 마침 잘 하셨습니다, 혹시 젊은 세대에 대한 복잡한 지원 제도를 일원화하는 것에 대해 생각해 보셨습니까? 사회가 운영되는 체계에서 너무 많은 법과 제도가 존재하면 혼란만 가중되고...\"\n\"거..\"\n\"중국 한나라의 고조 유방이 진나라를 무너뜨리고 나서 가장 먼저 했던 일 중 하나는 법가에 따라 그물코처럼 오밀조밀 짜이고 지나치게 가혹했던 진나라의 법령을...\"\n\n그 뒤로 한동안 윤 후보는 조용히 이 대표의 말을 듣고만 있었다.\n\n\"\"...While you sleep, you will work until you die.\" 세계적인 투자자, 워렌 버핏의 말입니다. 자는 동안에도 돈을 버는 것이 아니라면 죽을 때까지 일을 그만두지 못할 것이라는 문장인데, 자산 형성을 위한 투자의 중요성을 이야기하고 있는...\"\n\"이 대표님, 잘 알겠습니다. 거... 근데 도시락이 참 맛있지 않습니까?\"\n\n둘은 잠시 서로의 얼굴을 바라보고는 말없이 도시락을 먹기 시작했다.\n\n\"후보님. 저는 광주에 일정이 있어 먼저 가 보도록 하겠습니다. 만나 주셔서 감사합니다.\""
 TFRKP_HN_x_korea_123_desc_orig:0 "\"위기의 대한민국을 다시 살리고 무너진 정의와 공정을 되찾아주실 대통령 후보, 윤석열을 연호해 주십시오!\"\n\n\"윤석열! 윤석열!\"\n\n\"안녕하십니까, 오늘 정말 오랜만에 이... 순천을 와 보니...\"\n\n\"...자유민주주의 정신에 따라서 하는 민주화 운동이 아니고 어디 외국에서 수입해온 그런 이념에 사로잡혀서...\"\n\n\"저도 이 정권을 교체해야 되겠고, 민주당에는 들어갈 수가 없기 때문에 제가 부득이 이 국민의힘을 선택했습니다만...\""
 TFRKP_HN_x_korea_124_desc_orig:0 "\"윤석열 후보님, 최근에 선제타격론을 몇 차례 말씀하셨어요... 그러니까 우리를 공격하면 북한도 파멸할 수밖에 없다는 것을 인식하게 하는 게 억지력이거든요?\"\n\n\"그렇습니다.\"\n\n\"그 킬 체인보다 3축 중에 우리의 보복 능력에 중점을 둬야 된다는 게 저의 생각이고.\"\n\n\"아니, 핵 맞고 나서 보복하면 뭐 합니까?\"\n\n\"그, 보복 능력은 우리한테 완벽하게 갖춰져 있습니다. 그런데 제가 드리고 싶은 말씀이 뭐냐? 선제타격은 전쟁으로 가는 거거든요... 그런데 선제타격 운운하는 것 자체가 저는 전쟁하겠다는 선전포고 같은 거에요.\"\n\n\"아니, 그거는 우리 심 후보님이 잘 모르고 하시는 소리 같습니다.\""
 TFRKP_HN_x_korea_281_d_orig:0 "                                             £GFX_The_JoongAng \n\n                  44년 소년공 절친  \"재명이는 역시 다르다는 걸 보여주길\"\n\n심정운 씨는 이재명 후보의 소년공 시절 죽마고우다.\n이 후보 스스로도 심 씨를 \"나의 가장 친한 친구\"라며 \"(어릴 적) 가슴이 터질 것 같이 답답할 때 내 속마음을 털어놓을 유일한 대상\"이라고 표현했다. 이 후보은 같은 책에서 \"나에게 정운이는 너무나 절실한 존재였다\"고도 했다. 낮에는 함께 일하고 밤에는 함께 공부하며 대학 진학의 꿈도 같이 이룬 둘도 없는 친구다. \n\nQ. 소년공 이재명과 정치인 이재명은 어떻게 다른가요.\nA. \"소년공 시절에는 자기 자신만 책임지면 됐잖아요. 하지만 정치인은 자신뿐 아니라 사회 전체를 이끌어야 하는 책임이 뒤따른다고 생각해요. 이재명과 같은 리더의 역할이 참 중요하죠.\"\n\nQ. 소년공 시절의 경험이 대통령 역할을 수행하는 데 어떤 영향을 줄까요.\nA. \"소년공 시절 겪은 프레스 기계 사고, 관리자의 횡포를 견뎌낸 경험은 약자에 대한 공감 능력과 정책 개발에 큰 도움이 될 거라고 봐요. 그런 어려움을 극복한 경험 자체도 리더로서 강한 추진력과 결단력을 발휘하는 데 큰 자산이 될 겁니다.\" \n\nQ. 이 후보가 5년 뒤 어떤 대통령으로 기억되길 바라시나요.\nA. \"단기적인 성과도 중요하지만, 국민의 한 사람으로서 인구소멸, 기후위기, 고령화 등 국가가 직면한 장기 과제를 해결할 수 있는 국가 로드맵을 마련해 지속 가능하고 성장 가능한 국가를 만들어주길 바라요. 그래서 국민도 \"이재명은 역시 다르구먼\"이라고 말할 수 있는, 그런 대통령이 되길 바랍니다.\""
 TFRKP_HN_x_korea_282_d_orig:0 "\"기호 1번 이재명!\" \"이재명 대통령!\"\n\"대한민국의 중심, 경기도의 중심, 이 곳 안양에 이재명 대통령 후보님이 도착하셨습니다. 큰 박수로 마주해 주시길 바랍니다 여러분!\" \n\"유능한!\" \"대통령!\" \"유능한!\" \"이재명!\"\n\"대통령!\" \"이재명!\"\n\n\"네, 여러분 반갑습니다. 이재명입니다. 여러분 준비되셨습니까?\"\n\"네!!\"\n\n\"...세상에 혜택을 줬다고 특혜를 줬다고 비난을 하다니, 그런 마인드로 경제를 살리겠습니까, 죽이겠습니까?\"\n\"죽습니다!\"\n\n\"경제를 살리고 싶으면 누구를 선택하겠습니까?\"\n\"이재명!\" \"이재명!\"\n\n\"경제가 망하는 걸 보려면, 민주주의가 후퇴하는 걸 보려면 누구를 선택합니까?\"\n\"이재명!\" \"이재명!\"\n\n\"...\""
 TFRKP_HN_x_korea_283_d_orig:0 "                                                     £GFX_Chosun_Ilbo \n\n                     야 여성위원회 \"이재명 아들 성매매 의혹 수사해야\"\n\n국민의힘 중앙여성위원회가 17일 이재명 더불어민주당 대선 후보의 아들 성매매 의혹에 대해 \"즉시 수사에 착수해야 한다\"고 했다. \"이 후보 아들이 온라인 커뮤니티에 마사지업소를 방문한 뒤 후기들을 올린 것으로 확인됐다\"는 것이다.\n\n국민의힘 중앙여성위원회는 이날 '이재명 후보 아들의 성매매 의혹, 수사를 개시하라'는 제목의 입장문에서 \"이 후보 측은 이 후보의 아들이 해당 글을 쓴 것은 맞지만, 성매매를 한 적은 없다고 한다. 갔는데 안 한 것인지, 아예 안 간 것인지는 확인이 안 된다'고 했다\"면서 이렇게 주장했다.\n\n이들은 \"대통령 투표일까지 80여일밖에 남지 않은 중요한 시기에 대한민국의 미래를 위한 정책과 거대담론 대신 역대 대통령 후보에 없었던 전과 4범의 후보자와 온 국민을 분노케 한 대장동 개발비리 의혹 사건(이 있다)\"고 했다. 이어 \"그 (대장동 의혹의) 핵심 관계자의 의문스러운 죽음에 이어 이제 후보 아들의 불법도박 사실까지 접하고 있다\"고도 했다.\n\n그러면서 \"이 후보의 아들이 불법도박을 했을 뿐 아니라, 불법적 마사지업소에 출입하고 심지어 성매매 의혹까지 대두되는 것은 가히 충격적\"이라며 \"대통령을 선출하는 선거인 만큼 후보자에 대한 검증은 더욱 엄격해야 할 것\"이라며..."
 TFRKP_HN_x_korea_284_d_orig:0 "                                                        £GFX_hankyoreh \n\n                  \"지킬 약속만 한다\"던 이재명, 기본소득 공약까지 후퇴 시사\n\n이재명 더불어민주당 대선 후보가 2일 자신의 대표 공약인 기본소득에 대해 \"국민을 설득하고 토론하되 국민의 의사에 반해서 강행하지는 않겠다\"고 밝혔다. 전 국민 재난지원금 철회와 국토보유세 도입 유보 시사에 이어 핵심 정책의제로 내세운 기본소득까지 '후퇴 의사'를 내비친 것이다. '독선, 독주 이미지'에서 벗어나 중도층을 공략하겠다는 전략이지만, 표 계산에 따라 주요 공약까지 뒤집는 것은 무책임한 정치라는 비판도 나온다.\n\n이 후보는 이날 서울 여의도 당사에서 기자들과 만나 '기본소득 철회 의사가 있나'라는 물음에 \"철회한 것이 아니다. 이 정책에 대해 확신하고 미래 사회에 필요하다고 생각하지만 국민들이 오해하는 것도 있다\"며..."
 TFRKP_HN_x_korea_285_d_orig:0 "정의당 심상정 후보가 대선 막바지에 접어들며 더불어민주당 이재명 후보의 지지를 선언, 대선 후보에서 사퇴하기로 밝혔습니다.\n\n심상정 후보는 오늘 정의당 당사에서 진행된 기자회견에서 \"이재명 후보가 되면 왜 안 된다고 생각하세요? (그러면) 윤석열 후보가 되는 건 괜찮아요?\" 라고 언급하며 \"정의당은 오늘 대통령 선거란 레이스를 멈추게 되었지만, 진보 정치의 실현을 향한 기나긴 마라톤은 멈추지 않겠다\"고 밝혔습니다.\n\n이재명 후보는 \"심 후보의 용기 있는 결단에 존경과 감사의 말씀을 드린다\"며 \"오늘 공동 선언의 의미를 깊이 새기며, 정치교체와 사회개혁을 위해, 위대한 국민과 함께 압도적 대선 승리를 반드시 이뤄내겠다\"고 다짐했습니다.\n\n진보당 김재연 후보와 노동당 이백윤 후보는 입장문을 통해 유감과 아쉬움을 표명하며, \"기득권 양당과 경쟁해야 할 진보 대통령 후보로서 책임을 다하겠다\"고 완주 의지를 밝혔습니다."
 TFRKP_HN_x_korea_286_d_orig:0 "최근의 이슈들로 유세 현장의 열기가 그 어느 때보다 뜨거워지는 가운데, 이재명 대통령 후보의 연설이 있었습니다.\n\n이재명은 전국을 돌아 경기도지사 시절 그를 대권주자로 도약시킨 요인 중 하나인 계곡의 불법 설치물 철거와, 코로나 정국 당시 방역을 방해한 경기도 내 신천지 단체의 처리 등등의 성과를 홍보하며 대대적으로 유세 운동을 벌이는 한편, 윤석열 후보가 했던 '경제에 대한 이해력 부족'이 다소 의심되는 여러 실언들을 언급하여 국민들에게 자신이 지금 정세에서 '윤석열보다 더 나은' 사람이라는 인식을 심고 있습니다.\n\n이런 그에게도 불리한 요소가 없는 것은 아닙니다. 과거의 전과가 발목을 잡아 도덕성에 흠집이 가게 하고 있으며 또한 그동안 그가 보인 페미니즘에 우호적인 태도, 그리고 이번에 여성 유권자들의 표심을 모으려는 시도는, 양극화 시대 속에 외려 여가부 폐지를 주장하는 윤석열에게로 남성 유권자들의 표가 몰리게 하는 요인이 되기도 합니다."
 TFRKP_HN_x_korea_287_d_orig:0 "인천광역시 서구, 청라 롯데마트점 앞에서 이재명의 선거 유세가 벌어지고 있었다. 오후 5시부터 시작된 유세는 어느 새 계양구로 향할 시간은 6시 30분을 다해가고 있었다. 이재명은 사람들에게 마지막 말을 건넸다.\n\n\"제가 지금껏 선거 유세를 하면서 그동안 생각했던 것들이 변화하고 있는 것이 느껴집니다. 저는 이전까지 정치를 사실에 대한 것. 그러니까, 사실을 얘기하고 그것을 바탕으로 논리를 전개해야 한다고 생각하고 있습니다. 하지만 그것은 절대로 아닙니다! 오히려 정치를 더욱 위험에 빠뜨릴 크나큰 오해였습니다! 정치란 '사실'이 아니라 '사실의 인식'으로부터 비롯되는 것이 바로 정치인 것을 깨달은 것입니다!\"\n\n이재명은 격해진 감정을 추스르기 위해 잠깐 숨을 골랐다. 그 사이 동안 군중에서 응원 풍선 두드리는 소리, 환호하는 소리, 작은 박수 소리가 나고 있었다. 이재명은 다시 말을 이어나갔다.\n\n\"사람들 사이에서 정치적 극단주의 여론에 대한 경계심이 꽤 높아진 것을 선거 활동마다 꾸준히 느끼고 있습니다. 그런 분들이 과연 저를 지지하는 분만 그럴까요? 아니요! 저를 지지하지 않는 분 역시 그런 생각을 가지고 계십니다! 제 말의 요지는, 세상을 바라보는 측면이 달라도 결국엔 모두가 민주주의를 적극 수호하고자 하는 생각을 공유하고 있다는 것입니다! 저는 그것에 큰 기쁨을 느끼고 있습니다! 여기 계신 분들이 자신과 다른 측면으로 세상을 바라보는 사람들을 포용할 수 있는 역량을 가지고 계신다는 뜻이니까요! 그리고 바로 이것이 2016년 박근혜를 탄핵할 수 있었던 촛불정신이었습니다!\"\n\n이재명의 말에 사람들이 환호했다. 이재명은 군중의 환호를 들으며 4초간 숨을 깊게 들이마셨고 다시 4초간 숨을 천천히 내쉬었다. 이재명은 손에 쥔 마이크를 세게 움켜쥐며 다시 군중에게 마지막 말을 전했다.\n\n\"현재 중위 투표자 정리를 무너뜨릴 정도로 양극화가 진행된 세상에서, 이 나라의 민주주의를 생각해 주신 분들께 감사 인사드립니다! 제가 얘기했던, 다른 측면으로 세상을 바라보는 것에 대해 지적받지 않길 원하시는 분이 계신다면, 저 이재명을 지지해 주시기 바랍니다! 들어주셔서 정말 고맙습니다, 여러분!\""
 TFRKP_HN_x_korea_288_d_orig:0 "\"5년 전 전북 익산 유세 때 지지자들이 이재명을 연호하는데 종교 단체 같았어요. 그런 것을 원하시나요?\"\n\n\"원한다기보단 정치인들은 지지를 먹고 살죠. 위축이 될 때에 누가 막 이렇게 해 주면 갑자기 자신감이 생기고 주름이 쫙 펴지는 거에요.\"\n\n\"그래서 우리 존경하는 박근혜 전 대통령께서도 대통령하다 힘드실 때 대구 서문시장을 갔다는 것 아닌가...\""
 TFRKP_HN_x_korea_289_d_orig:0 "\"...분양가의 90% 정도를 대출해 준다는 것이고요. DSR은 규모 수십 평 짜리가 아니고 한 20평 정도면 2-3억, 3억 대 되겠죠.\"\n\n\"어느 지역에 2-3억 짜리가 있습니까? 20평 짜리가?\"\n\n\"김포나 이런 데는 충분히 가능합니다.\"\n\n\"김포에 20평 짜리가 있습니까? 20평 짜리가 3억입니까?\"\n\n\"자, 그러지 마시고요...\""
 TFRKP_HN_x_korea_81_desc_orig:0 "삼성생명에서 과장으로 일하고 있는 김정훈은 오늘 하루가 정말 즐겁게 느껴졌다. 자신이 바랐던 대로 윤석열이 국민의힘 대선 후보로 선출되었기 때문이다. 그는 직장에서 일을 하며 라이브 영상을 머리 속에서 꾸준히 되새김질하며 생각했다.\n\n'운동권 쓰레기들이 더럽힌 사회의 가치들을 원상복구시킬 때가 왔구나!'\n\n의무경찰 복무시절 광우뻥 시위를 겪고 난 후, 보수주의가 정체성으로 강하게 각인된 그에게 있어 문재인 정부는 그야말로 지옥이었다. 평창 올림픽 폐막식에서 김영철이 방남했다는 소식, 조국 법무부장관이 청문회에서 김진태 의원의 질문에 사회주의 정책이 필요하다고 발언했다는 사실, 조국 다음으로 자리에 앉은 추미애 법무부장관의 윤석열 검찰총장과의 갈등과 검찰총장 직위 해제, 월성원전 경제성 조작 소식은 운동권의 종북주의 야욕이 차근차근 실현되고 있는 걸로 보였다.\n\n그러던 도중 윤석열 검찰총장이 국민의힘에 입당해 정치활동을 펼치기 시작하더니 자연스럽게 그에게 관심을 가지게 되었다. 물론 주변에서 그는 정계는 물론 행정 경력도 없는 인물이라지만 그게 무슨 상관인가. 그가 추구해 온 정의로운 법치주의 관점을 생각하면 분명 모든 게 잘 될 것이다."
 jeju_desc:0 "----\n§9제주는 우리나라에서 가장 큰 섬입니다. 한가운데 한라산이 있고 그 둘레로 오름이 삼백 개 넘게 흩어져 있습니다. 한라산과 성산일출봉, 거문오름 용암동굴은 2007년 유네스코 세계자연유산이 됐습니다.\n\n2006년 특별자치도가 된 뒤로 제주는 스스로 정할 수 있는 일이 많아졌습니다. 해마다 천만 명 넘는 사람이 이 섬을 찾습니다. 돌담 너머로 귤밭이 이어지고, 바닷가에서는 물질을 마친 해녀가 숨을 내쉬는 휘파람 소리가 들립니다. 육지 사람들은 쉬러 오고, 섬사람들은 그 손님을 받아 먹고삽니다. 겨울이면 귤 따는 일손이 모자라 동네 할머니들까지 밭에 나가고, 봄에는 유채꽃 길에 렌터카가 줄을 섭니다.§!\n\n§p혼저 옵서예§!"
 korean_neoconservatism_desc:0 "\n\n\n\n£GFX_ideology_korean_neoconservatism_conservative_banner\n\n\n\n\n\n§Y한국식 신보수주의§!는 폐허 위에서 태어났습니다. 2017년 대통령이 탄핵당하고 대선에서도 진 뒤, 자유한국당 혁신위원회는 당을 '신보수주의'에 기초한 가치 중심의 정당으로 바꾸겠다는 선언문을 내놓았습니다. 긍정적 역사관과 대의제 민주주의, 법치, 그리고 서민중심경제가 그 내용이었고 그때의 당 대표가 홍준표였습니다.\n\n부자에게는 자유를, 서민에게는 기회를 주겠다는 말은 그럴듯했습니다. 하지만 그것이 이승만의 것인지 박정희의 것인지 김영삼의 것인지는 선언문도 답하지 못했고, 그 문서를 끝까지 읽은 사람이 당 안에 몇이나 되었는지도 알 수 없습니다. 결국 이 이념의 빈칸은 한 사람의 성격이 채웠습니다.\n\n가난한 집 아들, 모래시계 검사, 계파 없는 독고다이. 그의 신보수주의는 강성 노조와 싸우고, 사법시험과 정시로 사다리를 다시 놓으며, 힘으로 평화를 지키겠다고 말합니다. 서민의 편이라는 말과 스트롱맨이라는 별명이 한 사람 안에서 어떻게 함께 사는지는 지켜볼 일입니다. 그의 국무총리 이인제가 이 노선을 물려받았고, 미국의 신보수주의와는 이름 말고 닮은 데가 없습니다."
 korean_warm_conservatism_desc:0 "\n\n\n\n£GFX_ideology_korean_warm_conservatism_conservative_banner\n\n\n\n\n\n§Y따뜻한 보수주의§!라는 말은 2015년 4월 국회 본회의장에서 나왔습니다. 새누리당 원내대표 유승민은 자기가 꿈꾸는 보수를 정의롭고 공정하며 따뜻한 공동체를 만들려고 땀 흘리는 보수라고 불렀습니다. 증세 없는 복지는 허구라고 했고, 중부담 중복지를 내걸었으며, 재벌도 개혁에 동참해야 한다고 했습니다. 야당에서 명연설이라는 말이 나왔고 여당에서는 좌클릭이라는 말이 나왔습니다. 석 달 뒤 그는 원내대표 자리에서 물러나야 했습니다.\n\n오세훈은 다른 길을 돌아 같은 자리에 닿았습니다. 2011년 그는 모든 학생에게 급식을 주는 데 반대하며 시장직을 걸었다가 물러났고, 보수는 서울을 열 해 동안 잃었습니다. 그 열 해가 그에게 가르친 것은 중도의 마음을 얻어야 한다는 것이었습니다. 돌아온 그의 손에는 소득이 모자란 집일수록 더 채워 주는 안심소득과 계층 이동의 사다리를 다시 놓겠다는 약속이 들려 있었습니다.\n\n두 사람의 따뜻한 보수는 같은 말일까요? 한 사람은 세금을 더 걷자고 했고 다른 한 사람은 가려서 주자고 했습니다. 닮은 점은 시장과 안보에서는 보수의 길을 가되 뒤처진 사람을 두고 가지 않겠다는 것, 그리고 둘 다 자리를 한 번씩 내놓아 본 사람이라는 것입니다. 전쟁을 이긴 정부의 뒤에서 이 노선이 보수의 새 얼굴이 될지 표를 얻기 위한 수식어로 끝날지는, 서울시청보다 훨씬 큰 집무실에서 판가름 날 것입니다."
 sejong_desc:0 "----\n§9세종은 정부 부처를 옮기려고 새로 지은 도시입니다. 2002년 대선의 행정수도 공약에서 시작했습니다. 2004년 헌법재판소가 수도 이전을 위헌으로 결정하자 행정중심복합도시로 계획을 바꿨고, 2007년 첫 삽을 뜬 지 다섯 해 만인 2012년 7월 세종특별자치시로 문을 열었습니다.\n\n지금은 국무총리실과 중앙 부처 대부분이 이곳에 있습니다. 금강을 끼고 시가지가 고리 모양으로 돌아가고, 그 안쪽으로 정부세종청사가 길게 늘어서 있습니다. 호수공원 둘레에는 젊은 부부들이 유모차를 밀고 다닙니다. 주민 평균 나이가 전국에서 가장 젊고, 금요일 저녁이면 서울로 가는 통근버스 앞에 공무원들이 줄을 섭니다.§!\n\n§p행정중심복합도시§!"
 tfrkphn.120.kp:0 "대통령이 말하는 선진대국이 무엇인지 우리는 한 번 정리해 둘 필요가 있다. 선진국은 통계표 위의 숫자만으로 완성되지 않는다. 국내총생산이 아무리 커도 그 부가 소수의 손에만 머무는 나라는 큰 나라일 수는 있어도 앞선 나라는 못 된다. 경제의 힘과 사회의 신뢰, 시민의 의식, 도덕의 무게라는 네 기둥이 함께 자라야 지붕이 선다.\n\n§Y첫째, 강한 경제가 모두의 삶으로 이어지는 나라§!\n1인당 국민소득이 4만 달러를 바라본다 해도 중산층이 무너지고 서민의 하루가 버거운 나라는 선진대국이 못 된다. 성장의 열매가 고르게 나뉘고 출발선이 공정해야 한다. 국민이 내일을 두려워하지 않을 때 경제는 비로소 국력이 된다.\n\n§Y둘째, 서로를 믿을 수 있는 나라§!\n법과 제도가 제자리를 지키고 부정과 부패가 설 자리를 잃어야 한다. 국제 비교에서 우리 사회의 신뢰 수준은 여전히 선진국 평균에 크게 못 미친다. 국민이 정부를 믿고 기업을 믿고, 무엇보다 서로를 믿을 때 사회는 힘을 얻는다."
 tfrkphn.120.kp2:0 "§Y셋째, 시민의 품격이 살아 있는 나라§!\n아무도 보지 않는 신호등 앞에서도 멈춰 서는 사회, 낯선 이를 배려하는 일이 습관으로 굳은 사회, 가진 사람이 나눔을 책임으로 여기는 사회다. 이런 작은 의식들이 쌓여 나라의 품격이 된다.\n\n§Y넷째, 윗물이 맑은 나라§!\n나라의 얼굴은 결국 그 나라 사람들이고 그 얼굴의 맨 앞에는 지도층이 선다. 지도자가 먼저 모범을 보이고 정치가 깨끗해야 한다. 사람을 재는 기준이 학연과 지연과 혈연에서 실력과 공정함으로 바뀔 때 사회는 앞으로 나아간다.\n\n§Y맺으며§!\n국민이 잘사는 나라, 깨끗한 나라, 경제가 강한 나라 가운데 하나만 고를 수는 없다. 그리고 그 모든 것의 출발점은 가장 높은 자리에 앉은 사람의 청렴이다. 지금 이 나라에서 성공으로 가는 길은 여전히 인맥이라는 좁은 문을 지나는 경우가 많다. 그 문은 몇 사람에게는 지름길이 되지만 나라 전체를 조금씩 갉아먹는다.\n\n우리의 첫걸음은 장부에서 시작해야 한다. 전쟁이 끝난 나라의 곳간은 비어 있고 수출 통계는 매달 붉게 물들고 있다."
 tfrkphn.121.kp:0 "새벽 여섯 시, 청와대 본관 집무실이다. 책상 위에는 우리가 밤새 정리한 기획재정부와 산업통상자원부의 보고서가 나란히 놓였다. 대통령은 안경을 고쳐 쓰고 첫 장을 넘겼다. 대중국 수출, 전년 대비 큰 폭 감소.\n\n다음 장도 마찬가지다. 반도체와 석유화학, 화장품, 자동차 부품처럼 한때 이 나라를 먹여 살리던 품목들이 줄줄이 붉은 화살표를 달고 있다. 전쟁은 끝났지만 바다 건너 가장 큰 시장의 문은 다시 열리지 않았다. 중국은 EADI 회원국과 손을 잡았고 우리 상품에는 보이지 않는 벽이 둘러쳐졌다. 마지막 장은 성장률 전망인데, 소수점 앞자리가 0이다.\n\n대통령은 보고서를 덮고 의자에 등을 기댔다.\n\n\"전쟁에서 이기고, 장사에서 지는구나.\""
 tfrkphn.121.kp2:0 "대통령은 경남도지사 시절을 떠올렸을 것이다. 빚더미에 앉은 도 살림을 넘겨받던 날 도청 공무원들은 갚을 수 없다며 고개를 저었다. 그는 하나씩 줄이고 하나씩 갚았고 결국 빚은 0이 되었다. 나라는 도보다 크지만 그는 그때 하던 대로 새는 곳부터 막기로 했다.\n\n그날 오전 9시, 비서실장에게 짧은 지시가 내려왔다.\n\n오늘부터 비상경제위원회를 매주 엽니다. 위원장은 내가 맡습니다. 장관들은 보고서 말고 대안을 들고 오라고 하세요.\n\n첫 회의는 그날 오후에 열렸고 대통령은 자리에 앉자마자 말했다.\n\n중국 하나에 목을 매던 시절은 끝났습니다. 동남아로, 인도로, 중동으로, 유럽으로. 팔 곳을 새로 찾겠습니다. 그리고 안에서도 돈이 돌게 하겠습니다. 규제는 풀고, 기업은 붙잡고, 나랏빚은 줄이겠습니다.\n\n그날 회의는 밤 열한 시가 넘어서야 끝났다."
 tfrkphn.122.kp:0 "비상경제위원회가 끝난 뒤의 브리핑을 경기도 시흥, 시화공단 끝자락의 한 금형 공장 사장도 보고 있었다. 오후 세 시, 사장 김씨는 사무실 소파에 앉아 휴대폰으로 뉴스를 틀었다.\n\n\"앞으로 법에서 하지 말라고 한 것만 빼고, 나머지는 다 해도 됩니다. 되는 걸 찾아오라고 하지 않겠습니다. 안 되는 걸 저희가 증명하겠습니다.\"\n\n규제 네거티브 전환이라는 자막이 지나갔다. 지금까지는 법에 해도 된다고 적힌 일만 할 수 있었는데, 앞으로는 하지 말라고 적힌 일만 빼고 다 할 수 있게 바꾸겠다는 뜻이다.\n\n김씨는 책상 서랍에서 누렇게 바랜 서류 봉투를 꺼냈다. 3년 전 새 설비를 들이려다 접은 서류다. 인허가 담당자는 전례가 없다, 근거 조항이 없다는 말만 되풀이했고 그는 세 번 고쳐 네 번을 다시 냈다. 그 사이 거래처 둘이 베트남으로 공장을 옮겼다.\n\n\"정말이면 좋겠네.\""
 tfrkphn.122.kp2:0 "믿기에는 속은 적이 많았다. 정권이 바뀔 때마다 규제 혁파라는 말은 나왔지만 현장에는 늘 서류 한 장이 더 붙은 양식이 내려왔다. 그래도 이번에는 말투가 다르다고 김씨는 생각했다.\n\n창밖으로 프레스 소리가 났다. 작업복을 입은 직원은 열한 명이고 그중 셋은 이십 년을 같이 버틴 사람들이다. 코로나 때 월급을 두 달 미뤘을 때도 아무도 나가지 않았고, 그 뒤로 회식은 한 번도 못 했다. 김씨는 서류 봉투를 책상 위에 올려놓고 공장 문을 열었다.\n\n\"박 반장! 오늘 기계 여섯 시에 끄라고 해.\"\n\"무슨 일 있습니까, 사장님?\"\n\"일은 무슨. 회식하자고. 삼겹살로.\"\n\n박 반장이 장갑을 벗다 말고 김씨를 봤다. 오 년 만의 회식이다.\n\n\"이제 좀 살맛 나려나 봐.\"\n\n이 이야기는 며칠 뒤 김씨가 청와대 홈페이지에 올린 글로 우리에게 전해졌다."
 tfrkphn.123.kp:0 "우리가 법인세 최고세율 인하를 발표한 날, 여의도 증권가 뒷골목의 한 순댓국집이다. 점심시간을 조금 넘긴 시각에 벽에 걸린 TV에서 속보 자막이 흘렀다. '정부, 법인세 최고세율 인하 발표.'\n\n화면이 바뀌자 광화문 앞에 붉은 머리띠를 두른 노동조합원들이 서 있었다. \"재벌 감세 철회하라!\" 확성기 소리가 순댓국집 안까지 울렸다. 다음 화면에서는 기자 하나가 마이크를 들고 열을 올렸다.\n\n\"결국 세금 부담은 노동자와 서민에게 돌아간다는 비판이 나오고 있습니다. 대기업만 배를 불리는 낙수효과는 이미 실패한 정책이라는...\"\n\n다시 화면이 바뀌고 대통령이 단상에서 말했다.\n\n\"기업이 떠나면 일자리도 떠납니다. 기업이 이 땅에 남을 이유를 하나라도 더 만들어 주자는 겁니다.\""
 tfrkphn.123.kp2:0 "구석 자리의 박 씨는 국밥에 깍두기를 얹으며 화면을 힐끗 보았다. 쉰둘이고 동네에서 철물점을 한다. 오늘은 거래처 수금 때문에 여의도까지 나왔고, 옆 테이블의 넥타이 두 사람이 목소리를 높였다.\n\n\"이건 진짜 잘한 거야. 법인세 내리면 투자 들어오고, 주가 오르고.\"\n\"웃기지 마. 그 돈 다 사내유보로 쌓아 두고 끝이야. 우리 월급은 그대로고.\"\n\n박 씨는 아무 말도 하지 않았다. 대통령 말도 노조 말도 기자 말도 그럴듯해서, 다 맞는 말 같기도 하고 다 틀린 말 같기도 했다. 그는 휴대폰을 꺼내 증권 앱을 열었고, 아침에 산 건설주가 3퍼센트 올라 있었다.\n\n\"뭐, 누가 맞든.\"\n\"돈만 좀 돌면 되지.\"\n\n계산을 하고 나서며 그는 거래처 사장이 오늘은 웬일로 수금을 미루지 않았다는 것을 떠올렸다. 그것이 법인세 덕인지는 알 수 없어도 일단은 나쁘지 않은 하루였다."
 tfrkphn.124.kp:0 "청와대 세종실의 국무회의 탁자 위에 두꺼운 보고서가 한 권씩 놓였다. 표지에는 '7대 미래산업 육성 전략'이라고 적혀 있다. 산업부 장관이 화면을 넘기자 AI, 바이오, 메모리 반도체, 모빌리티, 우주, 수소와 원전, 콘텐츠라는 일곱 단어가 차례로 떠올랐다.\n\n\"5년간 연구개발에만 최소 50조 원을 넣습니다. 소형모듈원전은 상용화를 3년 앞당기고, 2030년까지 달에 우리 착륙선을 내리겠습니다.\"\n\n기재부 쪽에서 누군가 펜을 내려놓았다. 숫자가 크다는 뜻이다. 대통령은 보고서를 덮고 양복 안주머니에서 접힌 종이 한 장을 꺼냈다.\n\n\"어제 청와대 홈페이지에 글이 하나 올라왔어요. 시흥에서 금형공장 하는 사장님이. 3년 묵힌 설비 인허가가 한 달 만에 났대요. 그래서 직원들이랑 5년 만에 삼겹살 회식을 했답니다. 규제는 풀었어요. 풀었으면 이제 뭘 키울지 정해야지.\"\n\n\"대구 얘기 하나 할게요. 내가 학교 다닌 동네입니다. 대구는 30년을 섬유로 먹고살았어요. 섬유가 무너지고 나서도 30년을 섬유 생각만 했어요. 다시 살아날 거라고. 안 살아났지. 그 사이에 젊은 애들은 다 서울로 갔고.\""
 tfrkphn.124.kp2:0 "\"나라도 똑같아요. 반도체 하나로 30년 먹었어요. 그게 언제까지 갈 거라고 생각합니까. 중국이 따라오고, 공장은 인건비 싼 데 찾아서 다 빠져나가요. 우리 기업들이 베트남, 인도네시아 가서 공장 짓는 거, 그거 박수 칠 일 아닙니다. 여기서 짓게 만들어야지.\"\n\"정부가 다 하겠다는 거 아니에요. 정부는 길만 깔아요. 규제는 아까 다 걷었고. 돈은 민간이 대고, 위험한 기초연구는 국가가 받아요. 그게 민관 경제부흥 5개년 계획입니다.\"\n\n기재부 장관이 조심스럽게 입을 열었다.\n\n\"재원이 문제입니다, 대통령님.\"\n\"알아요. 그래서 다음 안건이 펀드잖아요.\"\n\n회의실에 짧은 웃음이 돌았지만 대통령은 웃지 않았고, 그는 일곱 단어가 떠 있는 화면을 한참 바라보았다.\n\n\"우리 아버지 세대는 가발 팔고, 합판 팔고, 신발 팔아서 이 나라 만들었어요. 그 사람들은 다음 산업이 뭔지 몰랐어. 그래도 했어요. 우리는 알잖아요. 알면서 안 하면, 그건 죄입니다.\""
 tfrkphn.125.kp:0 "우리가 미래펀드를 발표하던 날, 서울 노원구의 한 시중은행 지점이다. 예순두 살 최씨는 번호표를 쥐고 대기석에 앉아 있었다. 정기예금 만기가 오늘이다. 공무원 퇴직금에 30년 동안 모은 돈을 더하면 2억이 조금 넘고, 그 돈은 지난 10년 동안 예금에서 예금으로만 옮겨 다녔다.\n\n주식은 무서웠다. 2000년에 친구 따라 샀다가 반 토막이 났기 때문이다. 집을 한 채 더 사자니 세금이 무서웠고 코인은 아들이 말렸다. 예금 이자는 물가를 못 따라갔지만 적어도 줄어들지는 않았다.\n\n대기석 위 TV에서 대통령이 말하고 있었다.\n\n\"지금 우리나라에 갈 데 없이 떠도는 돈이 3,500조 원입니다. 역대 최대예요. 그 돈이 다 은행에 잠자거나 아파트값 올리는 데 들어가요. 그 돈을 일하게 만들겠습니다.\"\n\n화면 아래로 자막이 흘렀다. 선진대한민국 미래펀드, 100조 원 규모, 민관 공동 조성, 7대 미래산업 집중 투자.\n\n\"정부가 혼자 다 대겠다는 거 아닙니다. 정부가 먼저 넣고, 손실 나면 정부가 먼저 맞습니다. 그래야 국민들이 믿고 들어오지.\""
 tfrkphn.125.kp2:0 "옆자리 남자가 혀를 찼다. 동네에서 철물점을 하는 박씨다. 최씨가 못 하나 사러 가면 늘 덤으로 하나 더 얹어 주던 사람이다.\n\n\"또 펀드야. 뉴딜펀드는 어디 갔대.\"\n\"뭐, 법인세 깎는다고 할 때도 다들 욕했는데, 그때 건설주 사 둔 건 재미 좀 봤지.\"\n\n최씨는 대꾸하지 않았다. 정권마다 펀드는 있었고 이름만 바뀌었다는 말도 맞았다. 번호가 불리자 창구 직원이 만기 서류를 내밀었다.\n\n\"재예치하시겠어요, 고객님? 금리는 지난번보다 조금 내려갔습니다.\"\n\n최씨는 펜을 든 채 잠시 멈췄고, 손녀가 다니는 대학의 반도체공학과가 떠올랐다. 졸업하면 일할 데가 있어야 할 텐데 하는 생각이었다.\n\n\"그 미래펀드인가 하는 거, 여기서도 들 수 있어요?\"\n\"아직 출시 전인데요, 안내 나오면 바로 연락드릴까요?\"\n\"그래요. 반만. 반은 그냥 예금으로 두고.\"\n\n은행을 나서며 최씨는 생각했다. 내 돈이 공장 하나 짓는 데 벽돌 한 장쯤은 되겠지, 손해 보면 그만이고, 적어도 이번에는 어디 쓰이는지는 알고 넣는 것이라고 말이다."
 tfrkphn.152.desc:0 "심상정.\n대한민국 국민이라면 누구나 한 번쯤 들어 본 이름.\n노회찬 이후 유일무이한 대중 진보정치인이자, 서울대생의 타이틀을 포기하고 광야의 길이었던 노동운동과 진보정치의 길에 뛰어든 사람.\n\n이번 20대 대선에도 세 번째 출사표를 낸 그녀였지만, 대한민국의 대선 후보라면 가장 열심히 선거운동에 매진해야 할 지금, 그녀는 자신의 자택 안에서 쏟아지는 수많은 연락들을 애써 무시하며 스마트폰 전원을 꺼 놓고 있었다.\n\n안철수가 박스권 지지율을 뚫고 10%대 지지율에 안착하고, 허경영에게마저 지지율이 역전당할 동안 심상정 그녀의 지지율은 3~4%대를 벗어나지 못했다.\n\n홍준표가 강경한 발언을 이어 갈수록 여권 진보 시민들은 현실적인 대항마로 이낙연을 택했고, 정치에 질려 버린 사람들은 안철수나 허경영을 택했다.\n심상정 그녀에게는 어떠한 돌파구도, 기회도 남아 있지 않은 듯 보였다.\n\n그녀가 칩거에 들어간 지 2일째,\n심상정은 조용히 눈을 감고 자신의 과거를 되돌아보기 시작했다.\n\n남성 중심 문화가 강하던 대학 시절,\n운동권 최초로 여성 운동 연합회를 만들었고, 열악한 노동환경을 개선하기 위해 수십 년을 노동운동에 바쳤다.\n\n정계에 입문한 뒤에는\n우리 사회에서 소외받는 성소수자, 여성, 장애인, 노동자들의 곁에서 이들의 목소리를 대변했다.\n\n그랬던 그녀였지만, 가장 표를 많이 받은 한 사람만 당선되는 한국 대선에서 제3지대 심상정과 정의당이 설 자리는 없었다.\n후보 사퇴나 이낙연과의 단일화도 생각하지 않았던 건 아니었다.\n\n그리고 그녀는 오랜 침묵 끝에 나지막이 읊조렸다.\n\n§Y나마저 포기하면 우리 사회의 약자들은 누구를 보고 대선을 맞아야 하나.§!"
 tfrkphn.20.kp:0 "2022년 5월 10일, 국회의사당 앞마당이다. 봄바람에 태극기가 펄럭였지만 취임식장을 메운 사람들의 얼굴이 마냥 밝지는 않았다.\n\n얼마 전까지 세계의 경찰을 자처하던 미국은 내전의 수렁에 빠져 산산조각이 났다. 그 여파로 세계 경제는 바닥을 알 수 없는 곳으로 떨어지고 있고, 수출로 먹고사는 우리에게 그것은 목이 조여 오는 일과 다르지 않다. 코로나의 폭풍도 아직 다 지나가지 않았다. 텅 빈 상가와 셔터를 내린 식당, 지칠 대로 지친 사람들이 우리가 물려받은 나라의 모습이다."
 tfrkphn.20.kp2:0 "단상에 오른 홍준표 대통령은 잠시 객석을 내려다보았다. 수십 년을 정치판에서 굴러 온 사람이지만 이번만큼은 어깨를 누르는 무게가 달랐을 것이다.\n\n취임 선서가 끝나기가 무섭게 대통령은 새 내각의 명단을 발표했고, 맨 윗줄에 적힌 이름은 국무총리 이인제였다. 2017년 경선에서 대통령과 맞붙었던 사람이고, 노동부 장관과 경기도지사를 거쳐 국회의원을 여섯 번 지냈다. 일흔셋의 총리를 두고 여의도가 수군거렸지만 대통령은 따로 설명하지 않았다. 기다려 줄 시간이 없다는 말만 했다.\n\n식이 끝나고 청와대로 가는 차 안에서 대통령은 비서실장에게 한마디만 했다.\n\n\"내일 아침 7시에 첫 국무회의 잡아라.\""
 tfrkphn.200.kp:0 "대구와 광주의 시장이 나란히 선 연단인데, 대통령은 우리가 준비한 원고를 내려다보다가 그대로 접어 안주머니에 넣었다. 그가 원고 없이 한 말을 그대로 옮긴다.\n\n\"서로를 미워해서 우리가 얻은 것이 무엇입니까.\n\n미움에 사로잡히면 상대의 옆모습만 보입니다. 누가 앞섰는지 곁눈질하느라, 그 사람이 어떤 길을 바라보며 걷는지는 끝내 보지 못합니다.\n\n미움이 지역과 지역 사이로 번지면 높은 벽만 남습니다.\n\n그 벽을 한 장씩 걷어 내면, 벽이 있던 자리에 그 땅에서만 피는 꽃들이 보일 겁니다.\n\n저 달빛은 이 고장과 저 고장을 가리지 않습니다. 같은 밤을 똑같이 비춥니다.\n\n하나가 되자고 모두 같아질 필요는 없습니다. 다른 채로 같은 달빛을 받으면 됩니다.\n\n이제 고개를 돌려, 서로의 얼굴을 정면으로 마주합시다.\n\n화해는 거기서부터입니다.\""
 tfrkphn.201.kp:0 "우리가 문을 연 청년 제안 창구 '청년의 꿈'이 첫 달을 넘겼다. 들어온 글을 뽑아 출력한 상자 하나를 대통령 앞에 올리면서 비서관이 조심스럽게 말했다.\n\n\"좋은 말은 별로 없습니다. 거의 다... 화가 나 있습니다.\"\n\n대통령은 맨 위의 한 장을 집어 들었다.\n\n'집은 평생 못 살 것 같고, 결혼은 사치고, 아이는 꿈도 안 꿉니다. 그런데 어른들은 왜 노력을 안 하냐고 묻습니다.'\n\n다음 장은 남자가 썼고, 군대에서 보낸 이 년이 아무것도 아닌 시간이 되었다고 했다. 그다음 장은 여자가 썼고, 같은 회사에 들어와도 출발선이 다르다고 했다. 두 사람은 서로를 탓하고 있었는데 나란히 놓고 보니 같은 말을 하고 있었다. 우리는 손해 보고 있고 아무도 우리 편이 없다는 것이다.\n\n이튿날 국무회의에서 대통령은 두 장을 나란히 소리 내어 읽었다. 그러고는 이제 남과 여를 따질 때가 아니라고 했다."
 tfrkphn.201.kp2:0 "그날 밤 대통령은 예고 없이 서울의 한 대학가 분식집에 들렀다. 경호원들이 당황했고 아르바이트생은 국자를 떨어뜨렸다. 구석 자리의 청년 몇이 휴대폰을 들어 올렸다.\n\n\"대통령님, 진짜 우리 얘기 읽긴 하세요?\"\n\"읽었습니다. 다는 못 읽었고, 오늘 오백 장쯤 읽었습니다.\"\n\n테이블 위로 웃음인지 한숨인지 모를 소리가 흘렀다.\n\n\"나는 여러분 나이 때 남의 땅 부쳐 먹던 집 아들이었습니다. 그때는 가난해도 열심히 하면 올라갈 사다리가 있었어요. 지금 여러분한테는 그 사다리가 없습니다. 그게 여러분 잘못이 아니라는 거, 압니다.\"\n\"그 사다리, 다시 놓겠습니다. 대신 하나만 부탁합시다. 서로 싸우지 말고 나한테 따지세요. 남자든 여자든, 서울이든 지방이든. 화는 나한테 내고, 답은 같이 찾읍시다.\"\n\n다음 날 아침 '청년의 꿈'에는 처음으로 제안보다 질문이 더 많이 올라왔다. 대부분 대통령이 정말 답을 하느냐고 물었다. 그날부터 우리는 매주 금요일마다 대통령이 직접 쓴 답장을 올리고 있다."
 tfrkphn.202.kp:0 "종전 기념식이 열린 광장에 영남과 호남의 시장이 나란히 섰다. 그 사이에는 청년 대표 둘이 섰다. 한 사람은 예비역 병장이고 한 사람은 사회 초년생인데, 얼마 전까지 '청년의 꿈' 게시판에서 서로에게 날을 세우던 사이다.\n\n기념식이 끝나고 대통령은 짧게 말했다.\n\n이 나라는 이름 없이 제자리를 지킨 여러분이 지켰습니다.\n\n그날 밤 광장에는 사람들이 늦게까지 남았다. 누가 먼저랄 것 없이 노래가 시작됐고, 게시판에서 싸우던 예비역 병장과 사회 초년생도 어깨를 걸고 따라 불렀다.\n\n남은 힘을 다 쏟겠다고 다짐한 그 밤에서 많은 시간이 흘렀다. 나라는 아직 다 낫지 않았지만, 광장의 노래는 자정이 넘도록 끝나지 않았다."
 tfrkphn.203.kp:0 "대전 유성의 국방과학연구소 본관 1층에는 낡은 전시실이 하나 있고, 대통령은 연구원들의 안내를 받으며 그 안을 천천히 걸었다.\n\n벽에 걸린 첫 사진은 흑백이다. 맨발의 아이들이 미군 트럭 뒤를 따라 달리고 있다. 지난 80년 동안 이 나라는 그렇게 시작했고, 총도 공장도 쌀도 남의 손을 빌려야 하는 찢어지게 가난한 나라였다.\n\n다음 사진은 울산의 텅 빈 모래사장이다.\n\n\"조선소도 없이 배부터 팔러 다닌 사람이 있었지요.\"\n\n대통령이 혼잣말처럼 말했다. 정주영은 거북선이 그려진 오백 원짜리 지폐 한 장을 들고 영국 은행을 찾아가 우리는 400년 전에 이미 철갑선을 만든 민족이라고 했다. 그렇게 돈을 빌렸고, 모래사장 위에 조선소를 짓는 동시에 그 조선소에서 배를 만들었다."
 tfrkphn.203.kp2:0 "그 옆에는 포항 영일만의 사진이 있고, 박태준은 일본에서 받은 청구권 자금으로 제철소를 지으며 직원들에게 말했다. 조상의 피 값으로 짓는 것이니 실패하면 모두 우향우해서 영일만 바다에 빠져 죽자고 말이다. 1973년 6월에 첫 쇳물이 흘러나왔다.\n\n그리고 1997년에 나라가 부도났다. 사람들은 장롱 깊숙이 넣어 둔 돌반지와 결혼반지를 들고 은행 앞에 줄을 섰다. 아무도 시키지 않았는데도 사람들이 모였다.\n\n전시실의 마지막 칸에는 1978년 충남 안흥 바닷가의 사진이 있다. 얼마 전 대통령이 현무 발사를 지켜본 바로 그 시험장이다. 사진 속에서는 백곰 미사일이 하늘로 솟아오르고 있다. 1970년에 문을 연 이 연구소가 8년 만에 만들어 낸 이 나라 최초의 탄도미사일이다."
 tfrkphn.203.kp3:0 "대통령은 그 사진을 다 보고 나서 연구원들을 돌아보았다.\n\n\"가난한 나라가 배를 만들고, 쇠를 녹이고, 미사일을 쏘아 올렸습니다. 누가 기술을 줘서 한 게 아닙니다. 해 보자고 덤빈 사람들이 있었기 때문입니다.\n\n이제는 여러분 차례입니다. 무기를 사 오는 나라에서 만들어 파는 나라로. 사람이 들어가지 않아도 싸우는 무인 체계, 적보다 먼저 보고 먼저 판단하는 인공지능. 지금 이 방에 있는 여러분이 다음 사진을 만들게 될 겁니다.\"\n\n한 젊은 연구원이 손을 들었다.\n\n\"예산은... 정말 그대로 나옵니까?\"\n\n대통령은 웃었다.\n\n\"정주영 회장은 지폐 한 장으로 조선소를 지었습니다. 여러분은 그보다는 많이 드리겠습니다.\"\n\n그날 이후 전시실 마지막 칸 옆에는 빈 액자 하나가 걸렸다. 아래에는 짧은 글귀가 붙어 있다. '다음 사진은 여기에.'"
 tfrkphn.204.kp:0 "1999년 12월 헌법재판소는 제대군인 가산점 제도가 헌법에 어긋난다고 결정했다. 2년 넘게 군복을 입은 사람에게 공무원 시험에서 만점의 5퍼센트 안쪽을 더 얹어 주던 제도였다. 그날 이후 가산점은 사라졌다. 누군가는 차별이 끝났다고 했고 누군가는 국가가 약속을 저버렸다고 했다.\n\n오랜 세월이 흘렀다. 서울 노량진의 한 독서실에서 전역한 지 넉 달 된 이준호는 9급 공무원 기출문제집을 덮고 휴대폰을 켰다. 대통령의 담화가 생중계되고 있었다.\n\n\"현대전은 사병의 수가 아니라 사병의 질이 국방력을 좌우합니다. 좋은 사람이 군에 오게 하려면, 군에 다녀온 사람이 손해 보지 않게 해야 합니다.\n\n군 가산점제를 부활시키겠습니다.\n\n다만 1999년의 그 제도를 그대로 되살리지는 않겠습니다. 성별을 떠나 군 복무를 마친 사람이라면 누구나 혜택을 받습니다. 가산점의 규모도 합리적으로 조정하겠습니다. 다른 수험생의 기회를 빼앗지 않는 선에서 도입하겠습니다. 헌법재판소가 지적한 근거는 법률로 분명히 마련하겠습니다.\""
 tfrkphn.204.kp2:0 "독서실 옆자리에서 휴가 나온 일병 하나가 고개를 들었다. 군복 가슴의 명찰에는 '김지원'이라고 적혀 있었다. 그녀도 화면을 보고 있었다.\n\n\"성별 상관없다는데요.\"\n\"그러네요.\"\n\"저 지금 일반병으로 복무 중이거든요. 그럼 저도 받는 거네요.\"\n\n이준호는 잠깐 말을 잃었다가 웃었다.\n\n반응은 갈렸다. 여성단체들은 군 복무를 마칠 기회 자체가 고르지 않다며 반대 성명을 냈고, 장애인 단체도 군에 갈 수 없는 사람에게는 또 다른 벽이라고 했다. 제대군인 단체들은 늦었지만 환영한다고 했다. 국회 국방위원회의 한 의원은 이렇게 말했다.\n\n\"그동안 우리는 군대 간 사람과 안 간 사람을 서로 싸우게 만들었습니다. 이번에는 다를 수 있을지, 법안을 만드는 우리 손에 달렸습니다.\"\n\n그날 밤 노량진 독서실의 불은 평소보다 조금 늦게 꺼졌다."
 tfrkphn.205.desc:0 "계룡대 연병장, 오전 10시.\n\n장병들이 군별로 줄지어 섰다. 육군, 해군, 공군, 해병특수작전군, 그리고 맨 끝에 새로 창설된 우주사령부. 3축 5군 체제가 출범하는 날이었다.\n\n대형 화면에서 현무-5 공개 영상이 돌았다. 연병장 한편에는 L-SAM 발사대가 위장막을 벗은 채 서 있었다. 대통령이 단상에 오르자 군악대가 연주를 멈췄다.\n\n\"국기에 대하여 경례.\"\n\n수천 명의 손이 한꺼번에 올라갔다. 깃발이 바람에 펄럭였고 사회자의 목소리가 연병장을 넘어갔다.\n\n§Y\"나는 자랑스러운 태극기 앞에 자유롭고 정의로운 대한민국의 무궁한 영광을 위하여 충성을 다할 것을 굳게 다짐합니다.\"§!\n\n\"바로.\"\n\n구령이 떨어진 뒤에도 대통령은 한동안 깃발을 올려다보고 있었다.\n\n행사가 끝나자 그는 사열대를 내려와 대열 사이를 걸었다. 육군 대열 끝에 앳된 얼굴의 일병이 서 있었다. 명찰에 김지원이라고 적혀 있었다.\n\n\"힘들지 않나?\"\n\"똑같이 받으려고 왔습니다.\"\n\n대통령은 피식 웃으며 그녀의 어깨를 두드렸다.\n\n돌아가는 차 안에서 비서실장이 휴대전화를 내밀었다. 대전 국방과학연구소에서 방금 보내온 사진이었다. 전시실 마지막 칸 옆, 몇 년째 비어 있던 액자에 오늘 아침 공개된 현무-5 사진이 걸려 있었다.\n\n\"연구소 사람들이 아침부터 걸었답니다.\"\n\n대통령은 대답 대신 창밖을 봤다. 당정협의 탁자에서 줄이 그어졌다가 다시 동그라미가 쳐진 예산이 떠올랐다. 도쿄로 보낸 친서도, 판문점에 울린 경고사격도 떠올랐다.\n\n'당에 충성한 게 서른 해였지.'\n\n차가 고속도로에 올라서자 그는 눈을 감았다."
 tfrkphn.205.kp:0 "계룡대 연병장에 장병들이 줄지어 섰다. 육군과 해군, 공군, 해병특수작전군, 그리고 새로 창설된 우주사령부다. 우리가 여러 해 준비한 3축 5군 체제가 오늘 출범한다.\n\n대형 화면에는 현무-5의 공개 영상이 흘렀고 연병장 한편에는 L-SAM 발사대가 위장막을 벗은 채 서 있었다. 대통령이 단상에 오르자 군악대의 연주가 멎었다.\n\n\"국기에 대하여 경례.\"\n\n수천 명의 손이 한꺼번에 올라갔고, 바람에 펄럭이는 태극기 아래로 사회자의 목소리가 연병장에 울렸다.\n\n§Y\"나는 자랑스러운 태극기 앞에 자유롭고 정의로운 대한민국의 무궁한 영광을 위하여 충성을 다할 것을 굳게 다짐합니다.\"§!\n\n\"바로.\""
 tfrkphn.205.kp2:0 "구령이 떨어진 뒤에도 대통령은 한동안 깃발에서 눈을 떼지 않았다. 행사가 끝나자 그는 사열대를 내려와 장병들 사이를 걸었다. 육군 대열 끝에 앳된 얼굴의 일병 하나가 서 있었고 명찰에는 '김지원'이라고 적혀 있었다.\n\n\"힘들지 않나?\"\n\"똑같이 받으려고 왔습니다.\"\n\n대통령은 웃으며 그녀의 어깨를 두드렸다.\n\n잠시 후 누가 찍었는지 모를 영상 하나가 커뮤니티에 올라왔다. 제목은 실시간 대한민국 군대 근황이었다. 영상은 금방 바이럴됐고 댓글이 줄줄이 달렸다.\n\n아니 뭐 한다고 여자가 군대 감\n그보다 왜 하필 가더라도 병사로 감? 나라면 차라리 장교로 가겠음\n똑같이 받으려고 왔다잖아. 너보다 낫네"
 tfrkphn.206.kp:0 "폴란드 북부 그디니아 항구다. 잿빛 발트해 위로 거대한 화물선 한 척이 들어왔고 갑판 위에는 위장막을 씌운 전차들이 줄지어 실려 있었다. 우리가 보낸 K2 전차다. 크레인이 첫 번째 전차를 부두에 내려놓자 기다리던 폴란드 군인들 사이에서 박수가 터졌다.\n\n부두 끝에서 그 광경을 지켜보던 노인이 있었는데, 일흔을 훌쩍 넘긴 전직 조선소 용접공 얀 코발스키다. 그는 낡은 모자를 벗어 손에 쥐었다. 이 항구에서 차로 20분 거리에 그단스크 조선소가 있고, 1980년 8월에 얀은 그곳에 있었다.\n\n공산 정권이 고기값을 올리고 동료 노동자를 해고하자 조선소 노동자들이 일손을 놓았다. 그때 해고당했던 전기공 하나가 조선소 담장을 넘어 들어왔다. 콧수염을 기른 키 작은 사내 레흐 바웬사였고, 그는 상자 위에 올라서서 파업을 이끌었다."
 tfrkphn.206.kp2:0 "그렇게 자유노조 연대, 솔리다르노시치가 태어났다. 공산권에서 처음으로 정권의 허락 없이 생겨난 노동조합이었고 한때 조합원이 천만 명에 가까웠다. 정권은 계엄령을 선포하고 지도자들을 잡아들였지만 조합원들은 지하로 내려가 버텼다.\n\n1989년 6월 폴란드에서 반쯤 자유로운 선거가 열렸고 연대가 압승했다. 그해 가을 그 바람은 국경을 넘었다. 헝가리가 국경 철조망을 걷었고 베를린 장벽이 무너졌으며 프라하의 광장에는 열쇠 꾸러미 흔드는 소리가 가득했다. 1년도 안 되어 동유럽 전체가 자유를 되찾았다. 조선소 담장 하나를 넘은 사내에게서 시작된 일이다.\n\n얀은 그 시절 신문에서 한국이라는 나라를 처음 읽었고, 1987년에 그 먼 나라에서도 학생과 노동자들이 거리로 나와 독재를 끝냈다는 기사였다. 세상 반대편에도 우리 같은 사람들이 있구나 하고 그는 생각했다.\n\n유럽은 그보다 더 오래전에 우리를 위해 피를 흘렸고, 1950년 영국은 5만 명이 넘는 군인을 한반도에 보냈다. 1951년 봄 임진강에서 글로스터 대대는 몇 배나 되는 중공군에 포위된 채 사흘을 버텼고, 그들이 시간을 버는 동안 서울은 다시 떨어지지 않았다."
 tfrkphn.206.kp3:0 "프랑스의 몽클라르 장군은 한국에 가겠다며 중장 계급장을 떼고 스스로 중령이 되었다. 그가 이끈 프랑스 대대는 지평리에서 미군과 함께 중공군의 파상공세를 막아 냈고 전쟁의 흐름이 거기서 바뀌었다. 네덜란드와 벨기에, 룩셈부르크, 그리스, 튀르키예가 군대를 보냈고 스웨덴과 덴마크, 노르웨이, 이탈리아가 병원과 의료진을 보냈다.\n\n70여 년이 흘러 미국이 무너지고 우리가 대만해협에서 싸울 때 유럽은 다시 우리 편에 섰다. 런던과 파리는 규탄 성명을 냈고 바르샤바는 탄약을 실어 보냈다. 그래서 우리는 전차와 자주포, 전투기를 파는 데서 그치지 않기로 했고, 기술을 넘기고 폴란드 땅에 공장을 함께 짓는다.\n\n크레인이 두 번째 전차를 내려놓았고, 얀은 모자를 다시 쓰고 옆에 선 젊은 한국인 기술자에게 서툰 영어로 말했다.\n\n\"1987년에 신문에서 당신네 나라를 읽었소. 그때는 이런 걸 받게 될 줄 몰랐지.\""
 tfrkphn.207.kp:0 "6월 25일 아침, 경기도 어느 소도시의 보훈회관이다. 강당에 접이식 의자 서른 개가 놓였다. 해마다 채워지는 의자가 줄어 올해는 스물두 개가 찼다.\n\n맨 앞줄에 김복동 할아버지가 앉아 있고, 아흔다섯인 그는 열여덟 살에 학도병으로 낙동강 전선에 나갔다. 같이 나간 반 친구 열한 명 중에 돌아온 사람은 셋이었고, 이제 그 셋 중에 남은 사람은 그 혼자다.\n\n그 옆자리에는 여든둘의 박정수 할아버지가 앉았고, 1960년대 말 스물두 살에 맹호부대원으로 베트남 정글에 갔다. 우기에는 군화가 마를 날이 없었고 밤이면 어둠 속의 작은 소리에도 총을 움켜쥐었다. 돌아와서 몇 해 동안은 비 오는 밤에 잠을 이루지 못했다.\n\n두 사람은 이 회관에서 만난 지 20년이 넘었고, 박 할아버지는 김 할아버지를 늘 형님이라고 부른다.\n\n\"형님, 올해도 오셨네요.\"\n\"내가 안 오면 의자 하나 또 빠질 거 아이가.\"\n\n국민의례가 시작되어 애국가가 울리자 스물두 명이 의자를 짚고 하나둘 일어섰다. 김 할아버지는 지팡이를 짚고도 한참이 걸렸고 박 할아버지가 팔꿈치를 받쳤다. 모두가 오른손을 들어 경례했고, 손끝은 떨렸지만 손바닥의 각도는 젊은 날 훈련소에서 배운 그대로였다."
 tfrkphn.207.kp2:0 "행사가 끝나고 우리 보훈부 직원이 새 명패를 들고 갔다. '국가유공자의 집'이라고 적힌 명패다. 오늘부터 달라지는 것들을 적은 안내문도 함께 드렸다. 참전명예수당 인상, 보훈병원 진료비 전액 지원, 거동이 불편한 참전용사를 위한 방문 간호, 그리고 국립묘지 안장을 기다리는 유가족을 위한 전담 창구다.\n\n박 할아버지가 안내문을 천천히 읽었고, 김 할아버지는 돋보기를 놓고 와서 명패만 쓰다듬었다.\n\n\"이제야 알아주는 갑다.\"\n\"늦었어도 고맙지요, 형님.\"\n\n김 할아버지는 명패를 가슴에 안고 말했다.\n\n\"우리 반 아이들 이름은 아무도 몰라. 낙동강에서 죽은 아이들. 그 아이들 몫까지 받는 기라, 이건.\"\n\n회관 밖으로 나오자 6월의 햇살이 따가웠다. 손자뻘 되는 젊은 군인 하나가 지나가다 두 노인을 보고 걸음을 멈추더니 군모를 고쳐 쓰고 경례했다. 두 노인도 천천히 손을 들어 경례를 받았다."
 tfrkphn.208.kp:0 "결초보은은 풀을 맺어 은혜를 갚는다는 말인데, 2,600년 전 진나라의 위과는 아버지가 맑은 정신일 때 남긴 말을 따라 한 여인을 살렸다. 몇 해 뒤 전장에서 그 여인의 죽은 아비가 들판의 풀을 엮어 적장의 발을 걸었다. 산 사람이 베푼 은혜를 죽은 사람이 갚은 것이다.\n\n이 이야기에서 풀을 묶은 사람은 노인이다. 그러나 그 풀은 위과가 먼저 심었고, 위과가 먼저 베풀지 않았다면 풀을 묶을 사람도 없었다. 우리가 걸어온 길도 그러했다.\n\n1950년에 이름도 모르던 나라를 지키러 스물두 나라가 왔다. 임진강의 영국군이 사흘을 버텼고 몽클라르는 별을 떼고 중령이 되어 지평리를 지켰다. 필리핀과 태국의 젊은이들은 아시아에서 가장 먼저 배에 올랐고, 그들 중 2천여 명은 지금도 부산의 묘역에 잠들어 있다. 그들이 풀을 묶었다.\n\n그 풀 위에서 대한민국은 일어섰다. 낙동강의 학도병이 살아남아 아흔이 넘도록 의자 하나를 지켰고, 베트남의 정글에서 돌아온 청년이 그 옆자리를 지켰다. 그들도 풀을 묶었다."
 tfrkphn.208.kp2:0 "그리고 적룡이 바다를 건넜다. 금문의 바위섬에 다시 포탄이 떨어졌을 때 대만은 혼자일 줄 알았다. 우리는 30여 년 전 명동에서 하룻밤 사이에 문을 닫게 하고 돌아섰던 나라다. 그러나 이번에는 떠나지 않았다. 태극기를 단 구축함이 해협으로 들어갔고 광화문에는 청천백일기가 다시 올랐다. 70년 전에 받은 은혜를 우리는 다른 나라를 지키는 것으로 갚았다.\n\n그 뒤로 친구가 늘었다. 도쿄와 타이베이와 캔버라가 한 편이 되었고, 부산과 요코하마, 가오슝과 시드니의 탱크에 같은 기름이 채워졌다. 오디샤의 크롬이 서쪽에서 왔고 그디니아 부두에는 K2가 내렸다. 그단스크의 담장을 넘었던 사람들이 서울의 광장에 섰던 사람들에게 손을 내밀었다.\n\n갚을 보에는 뜻이 하나 더 있다. 적룡은 씨앗을 뿌렸다. 바다를 건너 포를 쏘았고 섬들을 불태웠고 젊은이들을 바다에 묻었다. 뿌린 것은 거두게 되니 그것이 인과응보다.\n\n위과의 이야기에서 눈여겨볼 대목은 풀매듭보다 그 앞이다. 그는 아버지의 맑은 말을 따랐다. 순장의 풍습을 따랐다 해도 탓할 사람은 없었는데, 그 선택이 몇 해 뒤 그를 살렸다.\n\n금문 초소의 린웨이 상등병은 지금도 한국어 무전을 처음 들은 날을 이야기한다고 한다."
 tfrkphn.209.kp:0 "청와대 춘추관에서 부동산 대책을 발표하는 자리인데, 대통령의 첫 문장부터 우리 원고에 없던 말이었고, 옆에 선 국토부 장관이 서류를 고쳐 잡았다.\n\n\"이 나라는 대한민국이 아니라 서울공화국입니다.\"\n\"국토의 12퍼센트에 인구 절반이 몰려 삽니다. 돈도, 회사도, 대학도, 병원도 다 서울로 갑니다. 지방 애들은 서울 가려고 공부하고, 서울 가서는 집 못 사서 결혼을 안 해요. 서울은 집값 때문에 숨이 막히고, 지방은 사람이 없어서 숨이 끊어집니다. 이게 정상입니까.\"\n\n\"그래서 토지임대부 주택을 하겠습니다. 땅은 국가가 갖고, 집은 국민이 갖습니다. 땅값을 빼면 집값은 반으로 떨어집니다. 이걸 서울에만 짓지 않겠습니다. 지방 거점도시마다, 일자리가 생기는 곳마다 짓겠습니다. 청년이 서울 안 가도 집 사고 결혼할 수 있게.\"\n\"빚 갚으면서 무슨 집을 짓느냐고들 하십니다. 경남에서도 빚 갚으면서 산단 세 개를 유치했습니다. 줄일 건 줄이고, 지을 건 짓습니다.\"\n\n기자들의 노트북 자판 소리가 빨라졌고, 반나절 뒤 서울시청 브리핑룸에서 오세훈 서울시장이 연단에 섰다. 표정은 차분했지만 첫마디는 날이 서 있었다."
 tfrkphn.209.kp2:0 "\"토지임대부 주택, 좋은 정책입니다. 잘 압니다. 서울이 먼저 했으니까요. 고덕강일 3단지, 사전청약 경쟁률이 40대 1이었습니다. 서울시민이 이미 검증한 정책을 이제 와서 새 정책처럼 발표하시는 건 좀 의아합니다.\"\n\n\"그런데 서울공화국이라는 말은 받아들이기 어렵습니다. 서울은 천만 시민이 사는 도시고, 대한민국이 세계와 경쟁하는 최전선입니다. 서울이 벌어서 지방교부세로 나라 전체를 먹여 살리고 있습니다. 서울을 깎아내린다고 지방이 살아나지 않습니다. 하향평준화일 뿐입니다.\"\n\"지방이 살려면 지방에 기업이 가야 합니다. 서울 집값을 탓하기 전에, 왜 청년들이 서울로 오는지부터 보셔야 합니다.\"\n\n그날 밤 관저에서 비서실장이 오 시장의 브리핑 영상을 틀었고, 대통령은 끝까지 보고 나서 리모컨을 내려놓았다.\n\n\"맞는 말이네. 지방에 기업이 가야지.\"\n\n비서실장이 의외라는 얼굴로 그를 봤다.\n\n\"그러니까 하는 거야. 기업 내려보내고, 집 지어주고. 서울시장은 서울 걱정하면 되고, 대통령은 나라 걱정하면 되고. 둘 다 자기 일 하는 거지.\"\n\"근데 서울이 먼저 했다는 건 맞아. 그건 인정해줘. 잘한 건 잘한 거니까.\"\n\n우리는 다음 날 보도자료에 서울시의 선례를 한 줄 넣었다."
 tfrkphn.210.kp:0 "부산 기장군 장안읍, 고리원자력본부다. 바닷바람이 거센 방파제 위에서 대통령 일행은 회색 돔 네 개를 바라보고 있다. 맨 왼쪽의 가장 낡은 건물 앞에는 철거용 가설 울타리가 둘러쳐져 있다. 안내는 일흔이 넘은 퇴직 운전원이 맡았다. 한수원이 특별히 모셔 온 분이다.\n\n\"저게 고리 1호기입니다. 이 나라 첫 원전이지요.\"\n\"1971년에 첫 삽을 떴습니다. 그때 우리나라 1인당 국민소득이 300달러도 안 됐어요. 원전 하나 짓는 돈이 그해 나라 예산의 4분의 1이었다고 합니다. 다들 미쳤다고 했지요. 설계도 외국 거, 기계도 외국 거, 운전도 외국 기술자들이 했습니다. 우리는 옆에서 받아 적었어요.\""
 tfrkphn.210.kp2:0 "\"1978년 4월에 상업운전을 시작했습니다. 그날 제가 제어실에 있었습니다. 스물셋이었어요. 계기판 바늘이 올라가는데 손이 떨려서 펜을 못 잡았습니다.\"\n\"그 뒤로 2호기, 3호기, 4호기가 들어섰습니다. 80년대엔 우리 손으로 반쯤 지었고, 90년대엔 다 우리 손으로 지었습니다. 받아 적던 나라가 수출하는 나라가 됐어요. 저 1호기가 학교였던 셈입니다.\"\n\n\"2017년 6월에 1호기가 멈췄습니다. 마흔 살이었지요. 그날 텔레비전에서는 탈원전을 선언했습니다. 저는 집에서 그걸 봤습니다. 이상하게 눈물이 나더군요. 늙어서 은퇴하는 건 괜찮은데, 다시는 안 짓겠다는 말이 서러웠습니다.\"\n\n대통령은 한동안 말이 없었다. 바람에 넥타이가 날렸다.\n\n\"2호기도 마흔 넘었지요?\"\n\"예. 겨우 계속운전 허가를 받았습니다. 2033년까지입니다. 그다음엔 저것도 1호기처럼 멈춥니다.\"\n\"멈추면 그 자리는요?\"\n\"지금까지는 그냥 비워두는 거였습니다.\""
 tfrkphn.210.kp3:0 "대통령이 산업부 장관을 돌아보자 장관이 먼저 입을 열었다.\n\n\"용인이랑 평택에 올라가는 반도체 공장들, AI 데이터센터들이 다 전기 먹는 하마입니다. 7대 미래산업 계획대로 가면 10년 안에 지금 전력으로는 모자랍니다.\"\n\n대통령이 고개를 끄덕였다.\n\n\"이제 그렇게 안 합니다. 하나가 은퇴하면, 그 자리에 새 거 하나 짓습니다. 송전탑도 있고, 바닷물도 있고, 주민들도 원전 옆에서 50년을 살았어요. 여기만큼 원전 지을 준비가 된 땅이 어디 있습니까. 1호기 해체 끝나면 그 자리에 소형모듈원전 들어갑니다. 2호기 멈추면 그 자리에도. 늙은 원전은 은퇴시키고, 젊은 원전으로 바꾸는 겁니다. 그게 원전 강국이에요.\"\n\n노인은 대통령을 바라보다가 1호기 쪽으로 고개를 돌렸다.\n\n\"그럼 저 녀석도 자식을 보는 거네요.\""
 tfrkphn.211.kp:0 "청와대 영빈관이다. 대통령의 책상 위에 정상회의 초청장 한 장이 놓였다. 발신처는 주요 선진국 정상회의 의장국이고, 회원국 자격의 정식 초청이다. 대통령은 초청장을 한참 들여다보았다.\n\n몇 해 전 그는 여의도의 작은 사무실에서 출마를 선언했다. 잘못된 길로 가는 이 나라를 바로잡아 정상 국가로 만들고 G7 선진국 시대를 열겠다고 했다. 그때 기자들은 대선 후보들이 늘 하는 말이라며 웃었다.\n\n그 뒤에 세상이 무너졌고, 세계의 경찰을 자처하던 미국이 내전에 빠져 제 몸 하나 가누지 못하고 산산조각 났다. 70년 동안 이 나라를 받쳐 주던 기둥이 하루아침에 사라졌다. 핵우산이 흔들렸고 통화스와프를 맺어 줄 상대가 없어졌고 수출길이 막혔다. 환율이 치솟던 밤 경제부총리는 대통령 앞에서 말을 잇지 못했다. 사람들은 IMF 때보다 나쁘다고 했고 그 말은 틀리지 않았다."
 tfrkphn.211.kp2:0 "그래도 우리는 버텼다. 규제를 걷어 냈고 세금을 낮췄고 잠자던 돈을 깨워 공장으로 보냈다. 늙은 원전 자리에 새 원전을 세웠고 반도체 다음에 먹고살 씨앗 일곱 개를 심었다. 땅은 국가가 갖고 집은 국민이 갖게 했다. 미국이 지켜 주지 않는 나라를 스스로 지킬 수 있게 군을 다시 세웠다.\n\n쉬운 길은 하나도 없었다. 노조는 거리로 나왔고 야당은 매일 퇴진을 외쳤고 서울시장과는 방송으로 말싸움을 했다. 중산층 비율이 65퍼센트를 넘었다는 통계청 보고서가 올라온 날, 대통령은 아무 말 없이 그 보고서를 두 번 읽었다.\n\n\"수락 회신 보내겠습니다.\"\n\"그래요.\"\n\n대통령은 초청장을 내려놓고 창밖을 봤다."
 tfrkphn.211.kp3:0 "\"미국이 있을 때 우리는 미국 덕에 컸다는 소리를 들었어요. 이제 미국이 없는데도 컸어요. 그러니까 이제는 아무도 그 소리 못 합니다.\"\n\"세상이 무너지는 동안 우리는 안 무너졌어요. 그래서 부른 겁니다. 여기서 멈추면 안 돼요. 미국이 비운 자리는 우리가 채웁니다.\"\n\n같은 날 오후 경기도 시흥의 금형공장에서는 김 사장이 새로 뽑은 직원 아홉 명의 이름표를 붙이고 있었다. 박 반장은 이제 공장장이다. 서울 노원구의 은행 창구에서는 최씨가 미래펀드 수익률이 적힌 안내문을 받아 들었다. 손녀는 졸업 전에 반도체 회사에 붙었고 근무지는 대구 공장이다.\n\n여의도 순댓국집 TV에서 정상회의 초청 속보가 흘러나왔고, 철물점 박씨는 깍두기를 얹으며 화면을 힐끗 보았다.\n\n\"뭐, 누가 잘해서든.\"\n\"나라가 잘되면 됐지.\""
 tfrkphn.220.busan:0 "부산 사하구, 감천항.\n\n새벽 안개 속에서 세관 직원이 컨테이너 하나의 봉인을 끊었다. 서류에는 냉동 수산물이라고 적혀 있었다. 냉동 상자를 뜯자 얼음 사이로 은박 포장된 필로폰 덩어리들이 나왔다.\n\n그 컨테이너를 받기로 한 자들은 부두 밖 횟집 2층에서 기다리고 있었다. 부두 하역과 유흥가, 불법 오락실, 바다 건너 들어오는 물건까지 수십 년 동안 항구의 밤을 쥐고 있던 조직이었다.\n\n해경과 경찰이 동시에 들이닥쳤다. 행동대장은 횟집 수족관 뒤의 비밀 문으로 달아났다. 부두 끝에서 바다에 뛰어들었다가 해경 고무보트에 건져 올려졌다.\n\n압수한 장부에는 지난 10년의 거래가 날짜별로 적혀 있었다. 그 장부 한 권으로 영도와 서면과 해운대의 조직원 마흔두 명이 줄줄이 엮였다.\n\n상황판의 부산 위에 붉은 도장이 찍혔다. 소탕 완료."
 tfrkphn.220.daegu:0 "대구 중구, 동성로.\n\n불 꺼진 상가 건물 지하. 하룻밤 판돈이 억 단위로 오가는 불법 도박장의 간판 없는 철문 너머에서 화투짝 넘기는 소리와 담배 연기가 새어 나왔다. 같은 조직이 인터넷 도박 사이트 서버를 해외에 두고 운영하고 있었다.\n\n잠복 3주째, 형사들은 판이 가장 커지는 금요일 밤을 골랐다. 철문을 절단기로 끊고 들어가자 테이블 위의 현금이 바닥으로 쏟아졌다. 도박꾼들이 비상구로 몰렸지만 그 문 밖에도 형사들이 서 있었다.\n\n조직의 돈줄을 쫓던 수사팀은 사이버수사대와 함께 해외 서버의 계좌까지 따라갔다. 세탁된 돈은 수성구의 상가 건물 세 채가 되어 있었다. 그 건물들도 전부 몰수되었다.\n\n동성로 상인회장이 지구대에 떡 한 상자를 보내왔다. 상자 위 쪽지에는 삐뚤빼뚤한 글씨로 이제 밤에 가게 문 열어도 되겠심더, 라고 적혀 있었다.\n\n상황판의 대구 위에 붉은 도장이 찍혔다. 소탕 완료."
 tfrkphn.220.daejeon:0 "대전 유성구, 한 부동산 사무실.\n\n전세 계약서 수백 장이 압수 상자에 담겨 나왔다. 계약서 속 집주인은 하나같이 이름만 빌려준 바지 집주인들이었다. 그 뒤에는 무등록 대부업과 전세사기를 함께 굴리던 조직이 있었다.\n\n피해자는 대부분 사회 초년생과 신혼부부였다. 대학을 갓 졸업하고 연구단지에 취직한 청년, 첫아이를 기다리던 부부. 그들이 전 재산을 넣은 보증금은 조직의 계좌를 거쳐 사라졌다. 돈을 갚지 못한 사람들에게는 밤마다 협박 문자가 왔다.\n\n수사팀은 계좌 추적에만 넉 달을 썼다. 그리고 하루 만에 공인중개사와 바지 집주인, 추심 행동대원까지 쉰여섯 명을 한꺼번에 잡아들였다.\n\n피해자 대책위원회 대표는 스물아홉 살 연구원이었다. 그는 기자들 앞에서 짧게 말했다.\n\n\"돈이 다 돌아오진 않겠죠. 그래도 이제 다음 사람은 안 당하잖아요.\"\n\n상황판의 대전 위에 붉은 도장이 찍혔다. 소탕 완료."
 tfrkphn.220.gwangju:0 "광주 서구, 한 원룸 건물.\n\n수사는 보이스피싱 피해를 본 일흔셋 할머니가 경찰서를 찾아오면서 시작됐다. 아들이 사고를 쳤다는 전화를 받고 평생 모은 돈 3천만 원을 건넸다고 했다. 할머니는 진술서를 쓰다가 몇 번이나 펜을 놓았다.\n\n\"내 새끼 목소리랑 똑같았당께요.\"\n\n돈을 받아 간 수거책을 쫓자 원룸 하나가 나왔다. 그 원룸에서 대포통장 수백 개와 대포폰이 쏟아졌다. 뒤를 캐 보니 지역 폭력조직이 해외 콜센터와 손잡고 국내 수거와 자금 세탁을 맡아 왔다.\n\n경찰은 국제 공조로 동남아의 콜센터를 덮쳤고, 총책을 국내로 송환했다. 공항 입국장에서 고개를 숙인 총책의 얼굴 위로 카메라 플래시가 터졌다. 광주 조직원들은 그보다 하루 먼저 잡혀 들어갔다.\n\n몰수한 범죄수익에서 할머니의 3천만 원이 돌아갔다. 할머니는 민원실 의자에 앉아 한참을 울었다.\n\n상황판의 광주 위에 붉은 도장이 찍혔다. 소탕 완료."
 tfrkphn.220.seoul:0 "서울 강남구, 새벽 4시 50분.\n\n테헤란로 뒷골목의 한 오피스텔 앞에 승합차 여섯 대가 소리 없이 멈췄다. 방탄조끼를 입은 형사들이 계단을 뛰어올랐다. 문이 부서지는 소리와 함께 불이 켜졌다.\n\n강남 유흥가에 마약을 대던 조직의 물류 창고였다. 방 안에는 저울과 비닐 봉투, 휴대폰 서른 대가 쌓여 있었다. 같은 시각 압구정과 청담과 이태원의 일곱 곳에서 동시에 문이 열렸다.\n\n두목은 한강이 내려다보이는 펜트하우스에서 잡혔다. 그는 수갑을 차면서도 웃었다.\n\n\"변호사 불러. 내일이면 나간다.\"\n\n수사팀장이 펜트하우스와 외제차, 차명 계좌까지 모두 몰수한다는 범죄수익 몰수 영장을 한 장 더 꺼내 보였다.\n\n\"이번엔 안 나가. 나가도 돌아갈 데가 없을 거고.\"\n\n해가 뜰 무렵, 상황판의 서울 위에 붉은 도장이 찍혔다. 소탕 완료."
 tfrkphn.220.ulsan:0 "울산 남구, 석유화학단지 옆 건설 현장.\n\n현장 소장은 매달 봉투를 건넸다. 레미콘 차량이 들어오려면 통행료를 내야 했다. 자재를 내리려면 하역비를, 공사를 계속하려면 보호비를 내야 했다. 안 내면 다음 날 현장 입구에 덤프트럭이 가로로 서 있었다. 이 조직은 이 일대 건설 현장을 쥐고 흔들었다.\n\n소장이 처음으로 녹음기를 들고 경찰서를 찾아왔다. 다른 현장 소장들도 하나둘 따라왔다. 다른 도시에서 정부가 끝까지 가는 걸 봤다고 했다.\n\n경찰은 녹음 파일과 장부를 들고 조직 사무실을 덮쳤다. 사무실 금고에는 현금과 함께 현장 소장들의 이름과 매달 받은 액수가 적힌 공책이 있었다. 두목은 체포되면서 소리쳤다.\n\n\"우리 없으면 현장이 돌아갈 것 같아?\"\n\n다음 날 아침, 그 현장에는 덤프트럭 대신 레미콘 차량이 줄지어 들어왔다. 공사는 멈추지 않았다.\n\n상황판의 울산 위에 붉은 도장이 찍혔다. 소탕 완료."
 tfrkphn.221.story:0 "정부서울청사 브리핑룸.\n\n대통령이 직접 연단에 섰다. 뒤쪽 화면에 여섯 도시의 범죄율 그래프가 떠 있었다. 서울, 부산, 대구, 광주, 대전, 울산. 여섯 개의 선이 모두 바닥에 닿아 있었다.\n\n\"범죄와의 전쟁을 선포했습니다. 오늘 여섯 도시의 조직폭력배를 모두 소탕했다는 보고를 받았습니다. 체포된 조직원은 2천 명이 넘습니다. 몰수한 범죄수익은 피해자들에게 돌려드리겠습니다.\"\n\n같은 시각, 서울중앙지법 앞.\n\n호송 버스에서 수갑을 찬 사내들이 줄지어 내렸다. 몇몇은 고개를 숙였고, 몇몇은 카메라를 노려보았다. 그 모습을 지켜보던 노인 하나가 혼잣말을 했다.\n\n\"60년도 더 됐네.\"\n\n1961년 5월, 서울 거리에 깡패들의 행진이 있었다. 동대문 일대를 주름잡던 이정재와 그 수하들이 줄지어 끌려 나왔다. 그들의 목에는 팻말이 걸려 있었다.\n\n'나는 깡패입니다. 국민의 심판을 받겠습니다.'\n\n새로 들어선 군사정권이 보여 주려고 연 행진이었다. 깡패를 잡겠다던 정권은 법보다 팻말을 먼저 걸었고, 그 뒤로도 깡패는 사라지지 않았다. 정치와 손잡거나 이름만 바꾼 깡패들이 그 자리를 이어받았다.\n\n이번에는 팻말도 행진도 없이 영장과 장부와 증거만 있었다. 깡패들은 호송 버스에서 내려 곧장 법정으로 들어갔다.\n\n브리핑이 끝나고 한 기자가 물었다.\n\n\"대통령님, 모래시계 검사 시절이 생각나십니까?\"\n\n대통령은 잠시 말을 멈췄다.\n\n\"그때도 지금도 같습니다. 끝까지 가는 겁니다. 팻말 거는 건 하루면 됩니다. 다시는 거리에 못 나오게 하는 데 몇 년이 걸리죠.\"\n\n그날 저녁, 여섯 도시의 상황판이 모두 붉은 도장으로 덮였다. 범죄와의 전쟁은 끝났다."
 tfrkphn.230.desc:0 "대만해협의 포성이 멎고 며칠이 지났다. 중앙선거여론조사심의위원회가 전시 여론조사 공표 금지를 풀었다.\n\n여론조사 회사 콜센터에 그날 아침부터 불이 들어왔다. 전쟁 통에 묻어 두었던 물가와 일자리, 집값 이야기가 다시 숫자가 되어 쏟아졌다.\n\n\"대통령 잘하고 있다고 보십니까? 1번 매우 잘한다, 2번...\"\n\n자동응답 목소리가 수십만 가구의 전화기에서 돌았다. 다음 주 수요일이면 첫 결과가 나온다."
 tfrkphn.241.desc:0 "개정 헌법 제70조에 따라 치른 첫 중임 대선이 끝났다.\n\n4년 전과 다른 점이 하나 있었다. 투표용지에 현직 대통령 [Root.GetLeader]의 이름이 다시 올랐다. 유권자들은 사실상 지난 4년에 점수를 매기러 투표소에 갔고, 한 번 더 맡겨 보기로 했다.\n\n개표가 끝난 새벽, 당선 확정 소식이 나왔다. 캠프 사무실에서 누군가 박수를 치다 말고 중얼거렸다.\n\n\"이제 진짜 마지막 4년이네.\"\n\n다음 대선에는 다시 나설 수 없다."
 tfrkphn.245.desc:0 "현직 대통령 [Root.GetLeader]는 헌법에 따라 이번 대선에 나설 수 없었다.\n\n보수 진영의 깃발은 이인제가 넘겨받았다. 홍준표가 걸어온 길을 같이 가겠다던 사람이 다시 맨 앞에 섰다. 그는 선거 내내 지난 정부의 성과를 지키고 잇겠다는 말을 되풀이했다.\n\n개표가 끝난 새벽, 이인제의 당선이 확정됐다. 논산 생가 앞마당에 모인 동네 어르신들이 막걸리 잔을 들었다.\n\n\"그 양반 일곱 번 넘어지고 여덟 번 일어났구먼.\""
 tfrkphn.246.desc:0 "현직 대통령 [Root.GetLeader]는 헌법에 따라 이번 대선에 나설 수 없었다. 누가 보수 진영의 깃발을 이어받을지를 두고 여당은 반년 넘게 시끄러웠다.\n\n경선은 처음부터 두 갈래로 나뉘었다. 한쪽은 지난 다섯 해의 강경 노선을 그대로 이어 가자고 했고, 다른 한쪽에 오세훈이 섰다. 그는 첫 연설에서 전쟁을 이긴 힘으로 이제 사람을 돌봐야 한다고 말했다. 당원 투표에서는 밀렸지만 국민 여론조사에서 크게 앞서며 후보 자리를 가져갔다.\n\n본선에서 그는 서울시장 시절의 일을 하나씩 꺼냈다. 유세 차량마다 안심소득과 서울런을 적은 현수막이 걸렸다. 상대 후보는 그를 여당 안의 야당이라고 불렀다. 그 말을 들은 중도층 유권자들이 오히려 고개를 돌려 그를 쳐다봤다."
 tfrkphn.25.kp:0 "청와대 지하 벙커, 국가위기관리센터다.\n\n\"대통령님, 비상경제대책회의 준비 끝났습니다.\"\n\n두꺼운 철문이 닫히자 바깥의 소음이 거짓말처럼 사라졌고, 이 방에 비상경제상황실이 다시 차려진 것은 십수 년 만이다.\n\n2008년 가을 리먼 브라더스가 파산하고 세계 경제가 무너져 내렸을 때, 이명박 정부는 바로 이곳에 상황실을 차리고 매주 대책회의를 열었다. 미국과 300억 달러 규모의 통화스와프를 맺어 외환시장을 진정시켰고 과감한 재정 투입으로 일자리를 지켰다. 서민의 내 집 마련을 위해 값싼 보금자리주택을 내놓았고 얼어붙은 부동산 시장도 되살렸다. 대한민국은 OECD 국가 가운데 가장 빨리 위기를 벗어난 나라로 꼽혔다. 그때 여당 원내대표로 그 과정을 함께한 사람이 지금의 대통령이다."
 tfrkphn.25.kp2:0 "\"그때랑은 다릅니다. 통화스와프를 맺어 줄 미국이 없습니다.\"\n\n경제수석의 보고에 회의실이 무겁게 가라앉았다. 장바구니 물가는 치솟고 일자리는 줄고, 끼니를 걱정하는 가정은 늘고 있다.\n\n회의에서는 기업 규제 문제도 거론되었고, 대통령은 후보 시절부터 이 점을 지적해 왔다.\n\n\"국가는 기업이 활동하는 데 창의력을 발휘하도록 지원해주면 되는데, 문재인 정부는 걸핏하면 세무조사하고 공정거래위원회를 동원해 갑질을 한다\"\n\n우리 정부는 그 반대로 가겠다는 것이 대통령의 뜻이다.\n\n대통령은 그때의 교훈을 살리되 이번에는 우리 힘으로 버텨야 한다고 말했다. 서민 생계 지원과 집값 안정, 일자리 지키기에 나라의 모든 힘을 모으라는 지시가 뒤따랐다. 보수는 가진 사람만을 위한 정치라는 말을 우리는 이번에야말로 끊어 내려 한다."
 tfrkphn.251.desc:0 "오늘 새벽 조선중앙통신이 특별 방송을 내보냈습니다. 북한 최고지도자 김정은 국무위원장이 \"원쑤들의 비렬한 습격으로 서거하였다\"는 발표였습니다. 조선중앙통신은 사건의 장소와 시각, 습격의 주체를 밝히지 않았습니다. 조선중앙텔레비전은 부고 방송을 하루 종일 되풀이했습니다. 검은 상복의 리춘히 아나운서는 몇 번이나 말을 멈추며 부고를 읽었습니다.\n\n부고가 나간 지 몇 시간 만에 평양 시내 곳곳에서 총성이 들렸다는 증언이 잇따랐습니다. 정보 당국은 쿠데타 시도의 정황을 포착했다고 밝혔습니다. 박정천 당 중앙군사위원회 부위원장이 이끄는 일부 군부가 김여정 부부장과 최룡해 상임위원장 등을 제거하려 했다는 것입니다. 쿠데타는 실패로 끝난 것으로 보이며, 박정천의 생사는 확인되지 않고 있습니다.\n\n혼란은 지방으로 번졌습니다. 자강도와 함경도에서는 지역 부대가 평양의 명령을 거부했다는 소식이 들어왔습니다. 황해도와 강원도에서는 주민들이 무기고를 습격해 무장했다는 보도가 이어집니다. 평양 한복판에서도 시민들과 일부 수도방위 부대가 거리로 나섰다는 미확인 보도가 나옵니다. \n\n경계가 무너진 비무장지대를 넘어 탈북민이 하루에도 수백 명씩 내려오고 있습니다. 군 당국은 접경 지역에 임시 수용시설을 긴급히 설치하고 있습니다. 강을 건너 중국으로 향하는 행렬도 끊이지 않습니다. 단둥과 연길 일대의 국경 검문소는 사실상 마비되었습니다.\n\n이인제 대통령은 국가안전보장회의를 마친 뒤 직접 기자회견장에 나섰습니다. 대통령은 \"김영삼 정부 때부터 고대해 온 북한 정권 붕괴의 시작\"이라고 발표했습니다. 사건에 정부가 관여했느냐는 질문에는 끝내 답하지 않았습니다. 같은 시각 휴전선 일대의 국군이 북진을 시작했다는 보도가 일각에서 나왔습니다. 국방부는 \"확인해 줄 수 없다\"는 입장만 되풀이하고 있습니다.\n\n평양과 원산 일대에서는 정체불명의 폭발음이 잇따랐다는 목격담이 나옵니다. PDTO 연합국 공군이 군수공장과 지휘시설을 폭격하기 시작했다는 소문도 퍼지고 있습니다. PDTO 측은 이에 대해 어떠한 공식 입장도 내놓지 않았습니다.\n\n중국 외교부는 \"조선의 안정과 주권을 지지한다\"는 짧은 성명을 냈습니다. 국경 경비도 대폭 강화했습니다. 평양은 아직 후계자를 발표하지 않았습니다."
 tfrkphn.252.desc:0 "북한 내전이 시작된 지 사흘. 평양에 맞선 자유조선군이 스스로를 이북5도위원회의 이름 아래 두겠다고 선언했습니다.\n\n이북5도위원회는 대한민국의 정부 기구입니다. 헌법이 대한민국 영토로 정한 황해, 평안남북, 함경남북 다섯 도를 맡아 왔습니다. 70년 넘게 서울 구기동 사무실에만 있던 도지사 자리에 처음으로 다스릴 땅이 생겼습니다. 위원회의 수장으로는 북한 외교관 출신의 태영호가 추대되었습니다.\n\n같은 날, 중국은 평양 정권을 사실상 보호국으로 삼았습니다."
 tfrkphn.253.desc:0 "한반도의 내전이 마침내 대한민국과 중화인민공화국의 정면충돌로 번졌습니다.\n\n북한의 두 정권 뒤에 선 서울과 베이징이 서로에게 총구를 겨누었습니다. 일본과 태평양방위조약기구 회원국들이 전쟁에 뛰어들고 있습니다. 중국이 이끄는 동아시아방위구상 회원국들도 뒤를 따릅니다."
 tfrkphn.254.desc:0 "경애하는 지도자가 쓰러진 지 이레. 평양은 끝내 하나로 뭉치지 못했습니다.\n\n당 조직을 쥔 김여정이 평양에서 정통 정부를 선포했습니다. 군부를 장악한 최룡해는 동북부의 부대를 이끌고 평양의 명령을 거부했습니다. 서북부에서는 체제에 등을 돌린 장교와 주민들이 자유조선군의 깃발을 올렸습니다. 평양 한복판에서는 시민과 일부 군인이 인민봉기위원회를 세웠습니다.\n\n조선은 넷으로 갈라졌고, 네 쪽 모두 상대가 먼저 무너지기만 기다리고 있습니다."
 tfrkphn.255.desc:0 "김정은의 죽음 이후 조선은 세 갈래로 찢어졌습니다. 평양에서는 김여정이 백두혈통의 이름으로 당과 정부를 붙잡고 있습니다. 최룡해는 조선인민군 군사위원회를 앞세워 군부를 장악했습니다. 그리고 남조선의 지원을 받는 이북5도위원회가 북쪽으로 진격하고 있습니다.\n\n압록강 너머의 혼란은 더 이상 남의 일이 아닙니다. 조선이 남조선과 일본의 손에 넘어간다면 우리의 완충지대는 사라집니다. 중앙은 결단을 내려야 합니다. 백두혈통의 정통성을 지킬 것인가, 아니면 총을 쥔 군부와 손을 잡을 것인가?"
 tfrkphn.256.desc:0 "자유조선군이 이북5도위원회로 거듭나 대한민국 정부와 손을 잡았습니다. 그다음 날, 자유조선군이 지켜 온 개성에 국군이 들어섰습니다. 고려의 옛 수도 개성은 6.25 전까지 대한민국 땅이었습니다. 국군이 1950년 겨울 후퇴한 뒤 70여 년 만에 다시 밟는 땅입니다.\n\n장병들은 개성공단의 빈 공장 앞에서 태극기를 흔들었습니다. 그 모습이 전국에 생중계되자 실향민들은 TV 앞에서 눈물을 쏟았습니다. 국방부는 개성을 대한민국 영토로 선포하고 행정 절차에 들어갔다고 밝혔습니다.\n\n국군은 개성 북쪽에 다음 진지를 파고 있습니다."
 tfrkphn.258.desc:0 "평양 인민봉기위원회가 이북5도위원회에 합쳐졌습니다. 봉기를 이끌던 박현준은 휴전선을 넘어 대한민국으로 귀순했습니다. 오래전 제 발로 북녘에 건너갔던 청년이 평양 봉기를 이끈 투사가 되어 돌아온 것입니다.\n\n통일부는 그의 귀순 사실을 확인하고 관계기관 합동신문 절차에 들어갔다고 밝혔습니다. 합동신문을 맡은 한 요원은 첫날 조사를 마치고 나와 담배를 물었습니다. \"이 친구, 아직 전쟁 중입니다.\""
 tfrkphn.26.kp:0 "미국의 정보 지원이 끊긴 뒤로 우리의 대북 정보망은 눈에 띄게 약해졌다. 전방에서는 북한이 도발했을 때 어디까지 대응해도 되는지를 두고 혼선이 있다는 보고가 올라왔다. 대통령은 김관진 전 국방부 장관 때의 원칙으로 돌아가라고 지시했고, 국가안보실은 오늘 아래의 지침을 내려보냈다.\n\n수신: 대한민국 합동참모본부, 국가정보원\n발신: 대통령실 국가안보실\n제목: 대북 도발 대응 지침 및 정보 역량 재건 지시\n\n1. 배경\n2010년 연평도 포격 직후 국방부 장관에 오른 김관진은 일선 부대에 북한이 도발하면 위에 묻지 말고 먼저 대응한 뒤 보고하라는 '선조치 후보고' 원칙을 내렸음. 아울러 도발의 원점은 물론 이를 지원하고 지휘한 세력까지 응징하라는 지침을 함께 하달하였음.\n2015년 북한의 목함지뢰 도발로 우리 장병이 중상을 입었을 당시, 국가안보실장이던 김관진은 11년간 중단되었던 대북 확성기 방송을 재개하였고, 결국 북한으로부터 유감 표명을 받아 냄."
 tfrkphn.26.kp2:0 "2. 지시 사항\n가. 전방 부대에 '선조치 후보고' 권한을 즉시 복원할 것.\n나. 북한의 도발 발생 시 대북 확성기 방송을 즉각 재개할 것.\n다. 도발 원점, 지원 세력, 지휘 세력에 대한 응징 계획을 재정비할 것.\n라. 미국의 정보 지원 중단에 따라, 약화된 대북 정보망을 처음부터 재건할 것.\n\n3. 비고\n정보기관은 정치에 휘둘리지 않고 오직 국가 안보에만 전념할 것."
 tfrkphn.260.kp:0 "임기 첫날 0시에 전화벨이 울렸다. 합동참모의장이 이 시각부로 국군 통수권이 넘어왔다고 보고했고, 이인제 대통령은 짧게 답한 뒤 수화기를 내려놓았다. 대통령으로서 받은 첫 보고다. 30년을 기다린 전화라 잠은 오지 않았을 것이다.\n\n우리가 모시게 된 사람의 이력은 길다. 논산의 소작농 집에서 태어났고 월사금이 없어 초등학교를 한 해 늦게 들어갔다. 판사가 되었다가 3년 만에 법복을 벗고, 다치고 쫓겨난 노동자들의 변호사가 되었다.\n\n1987년에 김영삼의 당에 들어갔고 마흔넷에 내각에서 가장 젊은 장관이 되었다. 이태 뒤에는 첫 민선 경기도지사가 되었고, 그 무렵 신문은 그를 차세대 지도자라고 썼다.\n\n1997년 경선에서 지고 승복하지 않았다. 당을 나와 새 당을 만들었고 492만 표를 얻어 3위를 했다. 그날부터 그의 이름 앞에는 경선 불복이라는 네 글자가 붙어 다녔다. 2002년에는 노무현의 바람에 밀렸고, 2007년에는 일자리 만드는 대통령이 되겠다고 했다가 0.68퍼센트를 얻었다."
 tfrkphn.260.kp2:0 "당은 열 번이 넘게 바뀌었다. 통일민주당, 민주자유당, 국민신당, 새천년민주당, 자유민주연합, 무소속, 자유선진당, 새누리당. 사람들은 세다가 그만두었다. 그래도 유권자들은 안양에서 두 번, 논산에서 네 번 그를 국회로 보냈다. 2016년 일곱 번째 도전은 1,038표가 모자랐다.\n\n2017년 경선에서는 북한 체제를 바꾸겠다고 했다가 홍준표에게 졌고, 2018년에는 충남지사 선거에서 졌다. 사람들은 그를 피닉제라고 불렀다. 놀리는 말이었는데 오래 듣다 보니 싫지 않았다고 그는 말한다.\n\n첫날 아침, 대통령은 복도로 나섰다. 평생 걷고 싶던 길이었다. 잠시 후 집무실에 닿았다. 평생 앉고 싶던 자리였다.\n\n하지만 이날만큼은 그 길이 너무 멀었고 그 자리가 불편했다. 세계는 점점 더 혼란스러워지고 있었다.\n\n대통령님, 괜찮으십니까?\n비서관이 서류 두 개를 건넸다. 하나는 일자리, 하나는 군사 문제였다.\n지금은 우리 국민이 먼저네. 이건 나중에 보지."
 tfrkphn.260.story_a:0 "그리고 물 한 잔만 갖다주게."
 tfrkphn.261.kp:0 "취임 첫 주말, 대통령은 첫 지방 일정으로 논산 재래시장을 찾았다. 일정표에는 논산과 광주, 대구 세 도시가 적혀 있었고 순서는 대통령이 직접 정했다.\n\n시장 입구부터 사람들이 길을 메웠다. 생선 가게 주인이 장갑을 벗고 손을 내밀었고 떡집 할머니는 대통령의 팔을 붙잡고 놓지 않았다.\n\n충청은 오래 대통령을 꿈꿨고, 김종필, 이회창, 반기문, 안희정이 차례로 기대를 모았지만 아무도 끝까지 가지 못했다. 이인제도 그 명단에 있었는데, 2001년 충청의 여론조사에서 1위였다가 이듬해 경선에서 졌다.\n\n영남과 호남이 맞서는 동안 충청은 승부를 가르는 표였고, 충청에서 이기면 본선에서 이긴다고들 했는데 정작 이긴 사람은 번번이 다른 지역 출신이었다. 국밥집 앞에서 한 노인이 대통령을 불러 세웠다."
 tfrkphn.261.kp2:0 "\"평생을 기다렸어. 이제 우리 차례여.\"\n\n둘러선 사람들이 웃으며 손뼉을 쳤고 대통령도 웃었다. 그는 노인의 손을 두 손으로 잡았다.\n\n어르신, 고맙습니다. 그런데 우리 차례라는 말은 오늘로 끝내야겠습니다.\n\n박수가 잦아들었다.\n\n영남 차례, 호남 차례 하다가 나라가 둘로 갈라졌습니다. 충청 차례까지 생기면 셋으로 갈라집니다. 저는 그 차례를 없애려고 대통령이 됐습니다.\n\n노인이 대통령의 손등을 툭툭 두드렸다.\n\n\"그려. 그 말 하려고 여기부터 온 거구먼.\"\n\n차에 오르며 대통령이 말했다.\n\n다음은 광주네. 같은 말을 하러 가세."
 tfrkphn.262.kp:0 "고용 창출 전략회의의 첫 회의 날 아침인데, 우리가 올린 자료 맨 위에는 숫자 하나가 적혀 있다. 전역하고도 일터를 찾지 못한 장병의 수인데, 대통령은 그 숫자를 오래 보았다. 34년 전에도 그는 숫자 앞에 앉아 있었다.\n\n1993년 2월 그는 김영삼 정부의 첫 노동부 장관이 되었다. 마흔넷으로 내각에서 가장 젊었고, 얼마 전까지 해고된 노동자들의 변호사였다.\n\n그해 여름 현대 계열사의 노사분규가 번졌고, 장관은 파업한 노동자에게도 식비와 가족수당 같은 생계비는 줘야 한다고 했다. 근거는 대법원 판례였고 사람들은 그것을 무노동 부분임금이라고 불렀다. 재계가 들고일어났고 경제기획원과 상공자원부가 철회를 요구했다. 여당은 무노동 무임금을 지키겠다고 했다."
 tfrkphn.262.kp2:0 "6월 21일에 세 부처가 함께 기자회견을 열었다. 기자들은 장관이 물러설 것이라고 예상했지만 그는 노동법의 해석은 노동부의 일이라며 입장이 달라지지 않았다고 말했다.\n\n같은 해 그는 고용보험 도입을 이끌었다. 일터를 잃은 사람이 다음 일터를 찾을 때까지 버티게 하는 제도다. 장관 자리에는 열 달을 있었고, 떠날 때 남은 생각은 단순했다. 임금이든 보험이든 일자리가 있어야 따질 수 있다는 것이다.\n\n비서실장이 문을 두드렸다.\n\n\"위원들이 다 모였습니다.\"\n\n대통령은 자료를 덮고 일어섰다가 회의실 문 앞에서 걸음을 멈췄다.\n\n\"오늘은 길게 말 안 하겠네.\"\n\"준비하신 원고는 어떻게 할까요?\"\n\"두게. 일자리부터 만들자는 말만 하면 되네. 34년 전에도 그 말을 하고 싶었네.\""
 tfrkphn.263.kp:0 "§Y책임총리제란§!\n대통령과 국무총리가 일을 나누는 방식이다. 대통령은 외교와 안보, 국방, 통일을 맡고 총리는 경제와 복지, 교육 같은 내치를 맡는다.\n\n§Y왜 필요한가§!\n총리에게는 장관을 제청할 권한이 있다. 그러나 그 권한은 오래 종이 위에만 있었다. 장관은 대통령이 골랐고 총리는 서명만 했다. 사람들은 그런 총리를 대독 총리라고 불렀다.\n\n대통령은 1997년 대선에서 책임총리제를 공약했고 2017년 출마 선언에서도 같은 말을 했다. 대통령은 밖을 맡고 내치는 실질적인 제청권을 가진 총리에게 맡긴다는 구상이며, 20년 동안 바뀌지 않았다. 그는 홍준표 정부에서 다섯 해 가까이 국무총리를 지냈다."
 tfrkphn.263.kp2:0 "§Y어떻게 운영하는가§!\n첫째, 총리가 장관 후보를 고르고 대통령은 그 명단을 받아들인다.\n둘째, 내치 안건은 총리가 조정하고 결정한다.\n셋째, 내치의 결과는 총리가 국회에 나가 책임진다.\n\n§Y무엇이 걱정인가§!\n전쟁이 끝난 지 오래되지 않았다. 지휘가 둘로 갈리면 결정이 늦어진다. 대통령과 총리가 부딪칠 때 누가 물러서는지도 정해야 한다.\n\n§Y우리의 답§!\n대통령은 북쪽의 일에 시간을 쓴다. 일자리와 물가는 총리가 매일 챙긴다. 두 사람은 매주 한 번 마주 앉아 서로의 일을 맞춘다."
 tfrkphn.264.kp:0 "밤 열한 시, 청와대 집무실이다. 책상 위에는 우리가 올린 원고 한 부가 놓여 있다. 제목은 책임총리제 시행에 관한 대국민 담화이고 발표는 내일 아침이다. 대통령은 마지막 문단을 고치고 있었다.\n\n1997년부터 해 온 말이다. 대통령은 밖을 맡고 총리는 안을 맡는다는 그 말을 30년 만에 지킬 차례였다. 그때 문이 열리고 국가안보실장이 서류 봉투를 들고 들어왔다.\n\n\"늦은 시간에 죄송합니다. 오늘 들어온 사진입니다.\"\n\n그는 사진 석 장을 원고 옆에 놓았다. 첫 장은 선대마다 선체가 올라가 있는 중국의 조선소였다. 둘째 장은 굴뚝마다 연기가 나는 군수 공장이었고, 셋째 장은 새 함정이 줄지어 선 항구였다."
 tfrkphn.264.kp2:0 "졌다고 멈춘 게 아닙니다. 잃은 함대를 다시 짓고 있습니다.\n언제쯤 다 짓나?\n이 속도면 몇 해 걸리지 않습니다.\n\n안보실장은 각국의 국방 예산을 적은 표 한 장을 더 꺼냈다. 줄어든 나라는 없었고, 미국이 사라진 뒤로 숫자는 해마다 늘었다.\n\n전쟁이 끝난 줄 알았더니, 다들 다음 전쟁을 준비하고 있구먼.\n\n안보실장이 조심스럽게 물었다.\n내일 담화는 예정대로 하십니까?\n\n대통령은 고개를 저었다.\n버리는 게 아니네. 미뤄 두는 걸세. 지금은 나눌 때가 아니야. 내일 아침 안보 회의와 경제 회의를 내가 다 주재하겠네. 장관들한테 직접 보고하라고 전하게.\n\n이튿날 아침 담화가 미뤄졌다는 속보가 떴다. 야당은 30년 묵은 약속이 하룻밤 사이에 뒤집혔다고 논평했다."
 tfrkphn.265.kp:0 "새벽 한 시, 청와대 집무실이다. 책상 위에는 우리가 정리한 내각 명단이 놓여 있다. 칸마다 이름이 적혀 있고 노동부 장관 자리 한 칸만 비어 있다. 빈칸 옆에는 이력서 두 장이 있다.\n\n왼쪽은 20년을 함께한 사람이다. 당을 옮길 때마다 따라왔고 선거에서 질 때마다 곁에 남았다. 이번 선거도 그가 맨 앞에서 뛰었다.\n\n오른쪽은 대통령이 처음 보는 사람인데, 노동 현장에서 30년을 일했고 노동계도 경영계도 그의 말은 듣는다. 선거 때는 상대 후보 쪽에 있었다.\n\n다른 대통령이라면 고민할 일이 없다. 먼저 동지를 앉히고, 안 되면 1년 뒤에 바꾼다. 그는 장관 자리를 그렇게 썼다. 그러나 이 대통령은 그럴 수 없다. 장관은 대통령과 임기를 함께한다는 것이 1997년에 한 약속이어서, 한번 적은 이름은 임기가 끝나는 날까지 지울 수 없다."
 tfrkphn.265.kp2:0 "대통령은 1993년을 떠올렸을 것인데, 그도 노동부 장관이었고 열 달 만에 자리에서 물러났다. 벌여 놓은 일은 책상 위에 그대로 남았고 그 책상에는 다음 장관이 앉았다. 열 달로는 아무것도 끝낼 수 없다는 것을 그는 겪어서 안다.\n\n왼쪽 이력서의 주인에게는 고맙고 미안했다. 그래도 대통령은 빈칸에 오른쪽 이력서의 이름을 적었다. 임기 끝까지 같이 갈 사람이니 편한 사람보다 일할 사람을 골라야 했다.\n\n왼쪽 사람에게는 날이 밝으면 직접 전화를 걸겠다고 했다."
 tfrkphn.266.kp:0 "오전 열 시 청와대 본관에서 새 장관들의 임명식이 열렸다. 장관들이 한 줄로 서고 가족들은 뒤편에 앉았다. 대통령은 한 사람씩 이름을 부르고 임명장을 직접 건넸다.\n\n여느 임명식과 다른 점이 하나 있었다. 임명장 끝에 임기는 대통령의 임기와 같다는 문장이 한 줄 더 적혀 있었다.\n\n노동부 장관은 선거 때 상대 후보 쪽에 있던 사람이다. 그는 임명장을 받고도 손을 놓지 못한 채 자기를 왜 불렀는지 아직도 모르겠다고 말했다. 대통령은 자기도 그 자리에 열 달 앉아 봤다고 답했다. 열 달로는 아무것도 끝내지 못하니 이번에는 끝까지 있다가 자기가 나가는 날 같이 나가자는 말도 했다."
 tfrkphn.266.kp2:0 "마지막 임명장을 건넨 뒤 대통령은 줄 앞에 서서 장관들의 사표는 받지 않겠다는 한 가지만 말했다. 지지율이 떨어져도, 야당이 물러나라고 해도 받지 않을 것이니 일이 틀어지면 고쳐서 다시 하라고 했다. 사표는 가장 쉬운 길이라 막아 두겠다는 말에 장관들이 서로를 보았다.\n\n대통령은 자기도 장관들을 바꾸지 않겠다고 약속했다. 뒤편에서 누군가 먼저 손뼉을 쳤는데 한 장관의 어린 손자였다. 웃음이 번지고 박수가 이어졌다.\n\n우리는 기념사진을 찍었고 대통령은 가운데에 섰다. 임기가 끝나는 날 같은 자리에서 같은 사람들과 한 장을 더 찍기로 했다."
 tfrkphn.27.kp:0 "새벽 3시, 청와대 관저의 전화벨이 울렸다.\n\n\"대통령님, 중국군이 대만 해협 일대에서 대규모 상륙 훈련을 시작했습니다. 규모가 지난번과는 비교도 안 됩니다.\"\n\n수화기 너머 국가안보실장의 목소리는 평소보다 한 톤 낮았고, 대통령은 곧바로 옷을 걸쳤다.\n\n집무실의 화면에는 쉴 새 없이 보고가 올라왔다. 대만 해협을 가득 메운 중국 함정들과 대만 언론의 긴급 특보, 평화헌법을 고치겠다는 일본 정부의 담화가 차례로 떴고, 그 틈을 노린 북한은 또다시 동해로 탄도미사일을 쏘아 올렸다. 미국이 무너진 자리에 생긴 커다란 공백 위로 동북아의 모든 나라가 저마다 불을 지피고 있다."
 tfrkphn.27.kp2:0 "\"이 불이 대만에서 멈출까요?\"\n\n누군가 혼잣말처럼 물었다. 바다 건너 대만과 이 땅 사이의 거리는 우리가 생각하던 것보다 가깝다.\n\n대통령은 지도에서 눈을 들어 국방부 장관을 찾았다.\n\n아침 6시까지 대만 교민 철수 계획 가져오라 하소."
 tfrkphn.283.d:0 "청와대 집무실, 밤 아홉 시.\n\n책상에 놓인 통계청 보고서의 첫 장에는 숫자가 하나 있었다. 취임 뒤 새로 생긴 일자리가 100만 개를 넘었다는 숫자였는데, 이인제는 안경을 벗고 그 숫자를 다시 읽었다.\n\n그는 1993년 6월의 울산을 떠올렸다. 김영삼 정부의 노동부 장관이던 그는 마흔넷으로 내각에서 가장 젊었고, 현대 계열사의 분규가 번지자 직접 울산으로 내려갔다. 밤에는 현대정공 노조 사무실에 앉아 간부들의 말을 들었고, 이튿날 아침에는 현대자동차 노조를 찾은 다음 오전에 사장단과 임원 스물여섯 명과 마주 앉았다. 장관이 분규 현장에 내려온 것은 정부가 생긴 뒤 처음이라고 신문이 썼다.\n\n그 이틀 동안 그는 양쪽에서 같은 것을 보았다. 노조도 사장들도 결국 공장이 돌아가야 할 수 있는 이야기를 하고 있었다.\n\n그해 12월에 고용보험법이 만들어졌고 그는 그달에 장관에서 물러났다. 법이 1995년 7월에 시행되는 것을 그는 장관실 밖에서 지켜보았다.\n\n대통령이 되던 날 그는 일자리부터 만들겠다고 말했다. 전쟁에서 돌아온 장병들이 구직 창구 앞에 줄을 서 있던 때였는데, 보고서 둘째 장에는 그 줄이 지난달에 없어졌다고 적혀 있었다.\n\n그는 보고서를 덮고 비서실장을 불렀다.\n\n\"내일 일정에 울산을 넣게.\"\n\n\"잡혀 있는 행사가 없습니다.\"\n\n\"행사는 필요 없네. 공장 식당에서 점심이나 먹고 오세.\""
 tfrkphn.285.d:0 "정부조직법 개정안이 국무회의에 올라왔습니다.\n\n기획재정부를 둘로 나누는 안으로, 예산 편성은 국무총리 소속 기획예산처로 넘어가고 남은 부처는 재정경제부가 됩니다.\n\n재정경제부라는 이름은 2008년에 재정경제부와 기획예산처가 합쳐져 기획재정부가 되면서 사라졌는데, 이번 안은 그 합병을 되돌리는 것입니다."
 tfrkphn.29.kp:0 "(속보) 중국군, 대만 본섬 상륙 개시\n타이베이를 비롯한 대만 전 지역이 불바다에 휩싸이고 있다. 새벽부터 이어진 미사일 공격으로 타이베이 도심 곳곳에서 거대한 불길이 치솟았고, 가오슝과 타이중 항구에는 중국군 상륙함들이 줄지어 접근하고 있다. 대만 정부는 전 국민에게 대피령을 내렸다.\n\n우리는 그날 아침 대만지원법을 국회에 냈다. 무기와 물자를 지원하고, 필요하다면 우리 군의 파견까지 열어 두는 법안이다. 문제는 의석이다. 지금의 국회는 2020년 총선으로 짜인 그대로라 과반을 야당이 쥐고 있다. 우리가 할 수 있는 일은 여당 의원 전원을 본회의장에 앉히는 데까지다.\n\n여당 안에서도 표가 흔들렸다. 계파를 거느린 대통령이라면 중진 몇에게 전화를 돌리면 끝날 일이다. 우리 대통령에게는 그런 중진이 없어서 그는 전날 밤 의원 한 사람 한 사람에게 직접 전화를 걸었다. 마지막 통화는 새벽 두 시를 넘겨 끝났다."
 tfrkphn.29.kp2:0 "같은 시각 여의도 국회의사당, 본회의장의 공기는 팽팽하게 얼어붙어 있다.\n\n\"대만이 무너지면 다음은 우리입니다! 지금 손을 놓고 있으면 역사가 우리를 용서하지 않을 겁니다!\"\n\"이건 전쟁에 뛰어들겠다는 선언입니다! 국민을 사지로 몰아넣을 셈입니까!\"\n\n야당의 김병주 의원이 반대 토론에 나섰다. 한미연합사 부사령관을 지내고 대장으로 전역한 그는 목소리를 높이지 않았다. 물자 지원에는 찬성하지만 파병 조항이 붙어 있는 한 표를 줄 수 없다는 것, 그리고 국군을 외국에 보내려면 국회의 동의를 받아야 한다는 헌법 60조를 지켜 달라는 것이 그가 한 말의 전부였다.\n\n여당 의원들은 일제히 찬성 표결을 마쳤고 공은 야당으로 넘어갔다. 의원총회를 마친 야당 의원들이 하나둘 본회의장으로 들어서고 있지만 그 표정에서는 아무것도 읽을 수 없다.\n\n청와대 집무실의 대통령은 국회 중계 화면에서 눈을 떼지 못하고 있다. 전광판에 숫자가 하나씩 올라가기 시작했다."
 tfrkphn.30.kp:0 "국방부 브리핑룸, 오전 10시다.\n\n\"대한민국은 이번 양안 간 무력 충돌에 대해 중립의 입장을 유지하고 있으며, 우리 군이 전투에 참여하는 일은 없을 것입니다. 이번 대만지원법에 따른 조치는 어디까지나 인도적 지원과 방어 물자 제공에 한정됩니다.\"\n\n국방부 대변인은 준비된 원고를 또박또박 읽어 내려갔고, 기자들의 질문이 쏟아졌지만 대답은 끝까지 같았다. 중립, 인도적 지원, 방어 물자.\n\n법은 통과되었어도 우리는 선전포고를 하지 않았다. 중국은 여전히 우리의 가장 큰 교역 상대이고 서해 건너에는 중국 해군의 함대가 있다. 공식적으로 참전국이 되는 순간 그 함대가 움직일 명분이 생긴다. 그래서 우리는 서류와 현실을 따로 두는 길을 골랐다."
 tfrkphn.30.kp2:0 "그 시각 부산항에서는 '농기계'와 '의료 장비'라고 적힌 컨테이너들이 대만행 화물선에 실리고 있었다. 성남 서울공항에서는 국적 표시를 지운 수송기가 남쪽 하늘로 날아올랐고, 며칠 전 '개인 사유'로 전역 신청서를 낸 공군 조종사 수십 명은 오키나와행 민항기에 몸을 실었다. 대만 해협 너머 전장에서는 한국어로 된 무전이 심심치 않게 잡히기 시작했다.\n\n베이징은 곧바로 강한 항의 성명을 냈고 우리의 대답은 이번에도 같았다. 대한민국은 중립국이며 어떠한 전투에도 참여하지 않는다는 것이다.\n\n그날 밤 국방부 출입기자 단체방에는 오키나와 공항에서 찍힌 사진 한 장이 돌았다. 아무도 기사로 쓰지 않았다."
 tfrkphn.301.desc:0 "2027년 3월 3일, 양안전쟁이 끝나고 처음 치르는 대통령 선거의 날이 밝았습니다.\n\n5년 단임제에 묶인 홍준표는 출마할 수 없었고, 국민의힘은 승전 정부를 잇겠다는 뜻으로 당의 원로 이인제를 후보로 세웠습니다. 전쟁에서 이긴 정부의 지지율은 선거 날까지 내려가지 않았습니다.\n\n이인제는 아침 일찍 투표를 마치고 돌아와 오래된 글 하나를 다시 꺼내 읽었습니다. 5년 전 3월 9일, 그때도 대선 날 아침에 쓴 글이었습니다. 주권자인 국민이 결단할 시간이 왔고 국민에게는 두려울 것이 없다고 적은 글인데, 맨 끝에 그는 모두 함께 \"새로운 출발선에 서자\"고 써 두었습니다. 그날은 다른 사람의 당선을 바라며 쓴 글이었습니다.\n\n개표는 자정을 넘기기 전에 기울었습니다. 당선이 확실하다는 자막이 뜨자 선거 사무소에 모인 사람들이 그의 이름을 불렀지만, 여든을 바라보는 당선인은 한동안 자리에서 일어나지 않았습니다. 1997년에 처음 도전한 뒤로 30년이 걸린 일이었습니다.\n\n홍준표 정부가 시작한 개혁과 전후의 동맹 질서는 이제 그의 정부가 이어받습니다."
 tfrkphn.301.kp:0 "2027년 3월 3일, 양안전쟁이 끝나고 처음 치르는 대통령 선거의 날이 밝았다.\n\n5년 단임제에 묶인 홍준표 대통령은 출마할 수 없다. 국민의힘은 승전 정부를 잇겠다는 뜻으로 그 정부의 국무총리 이인제를 후보로 세웠고, 전쟁에서 이긴 정부의 지지율은 선거 날까지 내려가지 않았다.\n\n후보는 아침 일찍 투표를 마치고 돌아와 오래된 글 하나를 다시 꺼내 읽었다. 5년 전 3월 9일, 그때도 대선 날 아침에 쓴 글이다. 주권자인 국민이 결단할 시간이 왔고 국민에게는 두려울 것이 없다고 적은 글인데, 맨 끝에 그는 모두 함께 \"새로운 출발선에 서자\"고 써 두었다. 그는 그날 다른 사람의 당선을 바라며 그 글을 썼다."
 tfrkphn.302.desc:0 "- 2027년 3월 3일, 양안전쟁 종전 후 첫 대선이 치러짐.\n- 홍준표 대통령은 5년 단임제로 출마하지 못함.\n- 대만은 버텨 냈고 전쟁 특수로 살림도 나아졌으나, 강경 정치와 끝없는 정쟁에 민심이 지침.\n- 국민의힘은 홍준표와 거리를 둔 서울시장 오세훈을 후보로 세움.\n- '승리는 지키고 국정은 바꾸겠다'를 내세움.\n- 오세훈이 당선됨. 모두를 품는 따뜻한 보수를 내걸고 전후 재건과 민생을 앞에 둠."
 tfrkphn.302.kp:0 "2027년 3월 3일, 양안전쟁이 끝나고 처음 치르는 대통령 선거가 열렸다. 5년 단임제에 묶인 홍준표 대통령은 출마하지 못했다. 투표소 앞에 줄을 선 사람들의 마음은 어느 때보다 복잡했다.\n\n국민은 전쟁을 이기게 한 보수 정당을 버리지 않았다. 서류 위로는 중립을 지키면서 뒤에서 대만을 도와 전쟁을 이기게 했고, 미국이 떠난 빈자리를 우리 힘으로 메웠다는 자부심은 컸다. 그 자부심 밑에는 불안도 깔려 있었다. 중국이 대만 다음에 어디를 노릴지는 정부도 예측하지 못했다. 다음 정부도 보수 정당에 맡기겠다는 응답은 선거 내내 절반을 넘었다.\n\n그래도 사람들은 지쳐 있었다. 범죄와의 전쟁으로 시작한 다섯 해는 대만지원법을 둘러싼 극한 정쟁과 비밀 지원 의혹으로 이어졌고, 거리에는 검문이, 뉴스에는 엄포가 끊이지 않았다. 전쟁 특수로 살림은 나아졌지만, 사람들은 이제 늘 싸우는 정치보다 숨 돌릴 틈을 원했다."
 tfrkphn.302.kp2:0 "국민의힘은 당원 투표와 국민 여론조사를 합친 전당대회에서 오세훈을 후보로 뽑았다. 서울시장 자리를 스스로 내려놓고 나선 그는 홍준표 대통령과 줄곧 거리를 두어 온 사람이었다. 2011년 무상급식 주민투표에 시장직을 걸었다가 잃은 일도, 다시 돌아와 약자와의 동행을 시정의 첫머리에 둔 일도 유권자들은 기억하고 있었다.\n\n그는 유세 내내 승리는 지키고 국정은 바꾸겠다고 말했다. 전쟁을 이끈 정부를 부정하지 않으면서 그 정부의 거친 손은 거두겠다는 약속이었다. 야당 지지자 가운데에도 이번에는 오세훈을 찍겠다는 사람이 적지 않았다.\n\n개표 결과 오세훈이 당선되었다. 국민은 보수 정당에 다시 나라를 맡기면서, 그 보수가 한결 부드러워지기를 바랐다. 새 정부는 모두를 품는 따뜻한 보수를 내걸고 전후 재건과 민생을 앞에 둔다."
 tfrkphn.303.desc:0 "- 2027년 3월 3일, 양안전쟁 종전 후 첫 대선이 치러짐.\n- 참전했으나 대만이 무너짐. 한국군의 희생이 헛된 것이 됨.\n- 책임론으로 국민의힘이 분열함.\n- 분노한 보수층이 \"배신자들이 나라를 망쳤다\"는 우리공화당 조원진에게 표를 몰아줌.\n- 조원진이 당선됨. 강경 반중, 비상 통치, 국가 재무장을 내세우는 권위주의 보수 정권이 들어섬."
 tfrkphn.304.desc:0 "- 2027년 3월 3일, 양안전쟁 종전 후 첫 대선이 치러짐.\n- 한국은 참전하지 않았고 대만은 버팀.\n- 전쟁을 피하고도 결과가 나쁘지 않았다는 점이 실용, 중도에 힘을 실어 줌.\n- 거대 양당이 전쟁 논쟁으로 상처 입은 사이 제3지대가 부상함.\n- 국민의당 안철수가 과학기술과 경제를 내세워 당선됨.\n- 첨단 산업 육성과 균형 외교를 추진함."
 tfrkphn.305.desc:0 "- 2027년 3월 3일, 양안전쟁 종전 후 첫 대선이 치러짐.\n- 한국이 지켜보는 동안 대만이 무너짐.\n- \"방관한 대가로 다음 차례는 한국\"이라는 공포가 퍼짐.\n- 중립을 택한 정부는 비겁했다는 비난을 받음.\n- 자유와혁신 황교안이 안보 위기와 내부의 적을 내세워 당선됨.\n- 반공과 질서를 앞세운 강경 노선으로 감."
 tfrkphn.307.desc:0 "대한민국 서울특별시 영등포구 국회대로 70길 7, 정의당 중앙당 당사는 울려 대는 전화벨 소리로 가득 차 있었다.\n신입 사무처 당직자 김서현이 서류 업무에 적응하기도 전에 전화 업무로 배정된 이유도 그 때문이었다.\n\n띠리링, 띠리링.\n\"홍준표 그 새끼한테 나라 넘기니까 좋냐? 안철수처럼 단일화를 하든지!\"\n뚝.\n\n띠리링, 띠리링.\n\"심상정이 다 망쳤다, 왜 단일화 안 했어? 어! 대가리가 달려 있으면 알 거 아냐! 니들은 안 된다고!\"\n\n\"민원인님, 말씀하신...\"\n\n뚝.\n\n걸려 오는 전화 100통 중 90통은 거의 그런 내용이었다. 민주당의 선거 패배 책임을 심상정과 정의당에게 묻는, 그런 내용이었다.\n떨리는 목소리로 눈을 고정한 채 매뉴얼을 다급히 따라 읽는 서현과 달리, 민원팀 선배들은 너무나 태연하게 전화에 대응하고 있었다.\n\n몇 시간의 업무가 끝난 뒤, 멍한 표정의 그녀는 사수에게 악성 민원은 왜 이렇게 많은 것이냐고, 소수정당 정치인은 출마도 못 하는 것이냐고, 눈가가 붉어진 억울한 얼굴로 나지막이 물었다.\n\n사수가 입을 떼려는 몇 초 사이, 사무총장이 허심탄회하게 웃으며 말문을 열었다.\n\"우린 이때까지 선거만 끝나면 늘 이랬지. 진보신당 때도, 통진당 때도, 매번 선거 끝나면 민원으로 2~3일은 사무처가 멈추는 게 관례 아니었나?\"\n사수는 능글맞게 맞장구치며 서현의 어깨를 두드렸다.\n\n\"서현 동지, 너무 기죽지 말아요. 오히려 이렇게 욕을 많이 먹는 건 우리가 그만큼 열심히 했다는 거죠. 세상에 지지 맙시다. 우리는 더 나은 세상을 그리니까요. 그렇죠?\""
 tfrkphn.309.desc:0 "올해로 대학교 4학년인 서준은 난생처음으로 '대만 파병 반대 시민대행진'이라는 집회에 참가했습니다.\n\n지나가는 어르신들 눈에는 '영락없는 빨갱이'로 보였겠지만, 서준 자신은 불과 몇 달 전까지 열성적인 홍카... 아니, 홍준표의 지지자였습니다.\n\n그러나 이 모든 운명을 바꿔 놓은 건 바로 자기 자신이었습니다.\n자신이 만든 대통령 홍준표는 양안전쟁에 파병을 결정했고, 전문하사였던 형은 이역만리 낯선 땅에서 쓸쓸히 죽어 가야만 했습니다.\n\n주위를 둘러보니 자신이 그렇게 혐오했던 민주노총과 각종 노조부터 정의당, 진보당 같은 진보정당들, 그 뒤로는 처음 듣는 이름의 수많은 정당과 시민단체의 깃발이 나부끼고 있었습니다.\n\n집회 주최 측으로 보이는 사람에게 말을 걸기도 전에, 그는 구호가 적힌 코팅 종이와 작은 방석 하나를 내밀고는 쌩 지나가 버렸습니다.\n\n뭐 어떻게 하라고? 깔고 앉으라고?\n얼떨결에 4차선 아스팔트 도로에 방석을 깔고 앉으니, 앞 전광판에서는 고막이 터질 듯한 음량으로 각종 '운동권' 노래가 흘러나오고 있었습니다. 평소라면 지나쳐 버렸을 노래들이었지만 왠지 모르게 오늘은 싫지 않았습니다. 그의 심장은 노랫소리에 맞춰 떨리고 있었습니다.\n\n유족들과 활동가들의 연설이 끝나고, 사회자가 구호를 외치기 시작했습니다.\n\"함께 외칩시다! 대만 파병 중단하라!\"\n\n\"중단하라! 중단하라! 중단하라! 투쟁!\"\n\n둘러보면 사람들은 모두 저마다의 신념을 위해, 목적의식을 품고 열의에 차 구호를 외치고 있었습니다.\n그러나 서준의 목소리는 어딘가 분노에 차 있었습니다.\n자신의 형과 수많은 동료 시민들을 죽음의 구렁텅이로 몰아넣은 정부를 향해."
 tfrkphn.309.kp:0 "올해 대학교 4학년인 서준은 난생처음으로 집회에 나갔다. '대만 파병 반대 시민대행진'이다.\n\n지나가는 어르신들 눈에는 '영락없는 빨갱이'로 보였겠지만, 서준은 불과 몇 달 전까지 열성적인 홍카... 아니, 홍준표 지지자였다.\n\n그가 찍은 대통령은 양안전쟁에 파병을 결정했고, 전문하사였던 형은 이역만리 낯선 땅에서 돌아오지 못했다. 서준은 이 모든 일을 자기 손으로 만들었다고 생각한다.\n\n주위에는 그가 그렇게 싫어하던 민주노총과 각종 노조, 정의당과 진보당 같은 진보정당들, 그 뒤로는 처음 듣는 이름의 정당과 시민단체의 깃발이 나부끼고 있었다.\n\n주최 측으로 보이는 사람은 서준이 말을 걸기도 전에 구호가 적힌 코팅 종이와 작은 방석 하나를 내밀고는 쌩 지나가 버렸다.\n\n뭐 어떻게 하라고? 깔고 앉으라고?"
 tfrkphn.309.kp2:0 "얼떨결에 4차선 아스팔트 도로에 방석을 깔고 앉으니, 앞 전광판에서는 고막이 터질 듯한 음량으로 '운동권' 노래가 흘러나왔다. 평소라면 지나쳐 버렸을 노래들인데 오늘은 왠지 싫지 않았고, 그의 심장은 노랫소리에 맞춰 떨리고 있었다.\n\n유족들과 활동가들의 연설이 끝나고 사회자가 구호를 외치기 시작했다.\n\n\"함께 외칩시다! 대만 파병 중단하라!\"\n\"중단하라! 중단하라! 중단하라! 투쟁!\"\n\n둘러보면 사람들은 저마다의 신념을 품고 열의에 차 구호를 외치고 있었다. 서준의 목소리에만 다른 것이 섞여 있었는데, 형과 수많은 사람들을 죽음으로 몰아넣은 정부를 향한 분노였다.\n\n집회가 끝나고 지하철역으로 걸어가면서 서준은 형에게 마지막으로 보낸 카톡을 다시 열었다. 읽음 표시는 끝내 사라지지 않았다."
 tfrkphn.310.desc:0 "'대통령님, 우리 아들은 무얼 위해 죽은 겁니까?' 수요일 아침 청와대로 날아온 편지의 첫 문구였다. 홍준표는 이 첫 문구를 읽고 그날 일정을 전부 취소했다.\n이제는 그도 그 질문에 답할 수 없었다. 국익을 위해서. 중국의 패권 확장을 막기 위해서. 대한 건아로서 영광스럽게 남기 위해서. 말은 좋았다. 어쩌면 최소한 이기기라도 했더라면 변명할 말이 조금은 남았을지도 몰랐다.\n'친애하는 김진우 군의 어머님.' 이 첫 문장은 거의 두 시간 전에 쓰인 것이었다. 그 뒤로 어떤 글자도 이 무거운 종이에 무게를 더하지 못했다. 시계는 벌써 열한 시를 넘어가고 있었다. 째깍, 째깍.\n\n그에게 이런 편지쯤은 아무것도 아니었다. 죄송하다, 드릴 말씀이 없다, 유가족들에겐 최대한의 지원을 하겠다. 그 정도 문장이면 족하다고 정치인 홍준표의 감각이 말하고 있었다.\n인간 홍준표는 아니었다. 과연 그에게 이 편지에 답장할 자격이 있을까? 그의 결단으로 사람이 죽었다. 대한 건아가 죽었다. 인생의 가장 아름다운 시기를 살아가던 청년들이 벚꽃처럼 떨어졌다.\n그리고 그 청년들을 죽음으로 내몬 대한민국은 아무것도 얻지 못했다. 그들은 만리타향에서 이름도 알리지 못한 채 땅에 묻혔다. 잊혔다.\n\n그는 철의 심장을 가지고 있었지만 지금 그의 속은 자기혐오와 죄책감으로 끓고 있었다. 딱히 끄고 싶은 마음도 들지 않았다.\n미국이 웃으며 자신의 관자놀이에 총구를 갖다 댄 채 마지막 손가락을 놀렸다. 중국은 미국 내전의 영향에서 벗어나기도 전에 대만 침공이라는 도박수를 걸었다. 그래서 그는 참전을 결심했다.\n예전에 어떤 빨갱이 두목은 한 사람의 죽음은 비극이지만 수만 명의 죽음은 통계라고 했다. 인간 홍준표는 그 말에 동의하지 않았다. 그에게는 숫자 하나하나가 비극이었고, 남은 인생 동안 평생 안고 가야 할 원죄였다. 그는 제발 신이 자신을 데려가길 바랐다. 목을 맬 자신도 들지 않았다.\n\n대통령은 철의 심장을 가져야 했지만 오늘은 그러지 못했다. 홍준표는 비서에게 오늘 온 연락은 전부 돌려보내라고 했다. 비서는 홍준표의 얼굴을 빤히 보더니 건성으로 대답하고 방을 나갔다. 홍준표는 의아해하다가 곧 깨달았다. 비서의 남동생이 파병 명단에 있었다. 또 자기혐오의 불이 타오르기 시작했다.\n\n그는 잠시 화장실로 가서 거울을 보았다. 그리고 보자마자 눈을 돌리며 빠져나왔다.\n\n그의 얼굴은, 세상에서 가장 혐오스러운 얼굴이었다."
 tfrkphn.311.desc:0 "'대통령님, 우리 아들은 무얼 위해 죽은 겁니까?' 수요일 아침 청와대로 날아온 편지의 첫 문구였다. 홍준표는 이 첫 문구를 읽고 그날 일정을 전부 취소했다.\n답은 이미 정해져 있었다. 국익을 위해서. 중국의 패권 확장을 막기 위해서. 대한 건아로서 영광스럽게 남기 위해서. 그리고 대한민국은 이겼다. 신문은 승전을 말했고, 광장에는 태극기가 넘실댔다. 답할 말은 차고 넘쳤다.\n'친애하는 김진우 군의 어머님.' 이 첫 문장은 거의 두 시간 전에 쓰인 것이었다. 그 뒤로 어떤 글자도 이 무거운 종이에 무게를 더하지 못했다. 시계는 벌써 열한 시를 넘어가고 있었다. 째깍, 째깍.\n\n그에게 이런 편지쯤은 아무것도 아니었다. 아드님은 조국을 지킨 영웅이다, 그 희생으로 대한민국이 이겼다, 국가가 끝까지 기억하겠다. 그 정도 문장이면 족하다고 정치인 홍준표의 감각이 말하고 있었다.\n인간 홍준표는 아니었다. 승리라는 말이 한 어머니의 아들을 돌려줄 수 있을까? 그의 결단으로 사람이 죽었다. 대한 건아가 죽었다. 인생의 가장 아름다운 시기를 살아가던 청년들이 벚꽃처럼 떨어졌다.\n그리고 그 청년들 위에서 대한민국은 승리를 얻었다. 그들의 이름은 기념비에 새겨질 것이다. 그러나 기념비는 아무도 안아 주지 않는다.\n\n그는 철의 심장을 가지고 있었지만 지금 그의 내면에서는 새로운 용광로가 돌아가고 있었다. 승리가 데워 놓은 쇳물 아래에서 죄책감이 조용히 끓고 있었다. 곁에 있는 사람들은 그것을 알아채지 못했다.\n미국이 웃으며 자신의 관자놀이에 총구를 갖다 댄 채 마지막 손가락을 놀렸다. 중국은 미국 내전의 영향에서 벗어나기도 전에 대만 침공이라는 도박수를 걸었다. 그래서 그는 참전을 결심했고, 그 도박에서 이겼다.\n예전에 어떤 빨갱이 두목은 한 사람의 죽음은 비극이지만 수만 명의 죽음은 통계라고 했다. 세상은 그 말대로 그를 대했다. 전사자 수는 승전 보고서의 한 줄이 되었고, 지지율 그래프는 위로 솟았다. 인간 홍준표는 숫자 하나하나를 비극으로 여겼기 때문에 그 말에 동의하지 않았다.\n\n대통령은 철의 심장을 가져야 했지만 오늘은 그러지 못했다. 홍준표는 비서에게 오늘 온 연락은 전부 돌려보내라고 했다. 비서는 환하게 웃으며 축하 화환이 또 들어왔다고 전하고 방을 나갔다. 비서의 남동생은 파병 명단에 있었고, 살아서 돌아왔다. 그 웃음이 홍준표의 가슴을 찔렀다.\n\n그는 잠시 화장실로 가서 거울을 보았다. 그리고 보자마자 눈을 돌리며 빠져나왔다.\n\n그의 얼굴은, 세상에서 가장 사랑받는 얼굴이었다."
 tfrkphn.312.desc:0 "- 정부가 수사 기관 개편안을 발표함.\n- 경찰의 국가수사본부를 떼어 내 국가수사국을 세우고 수사 기능을 한곳에 모음.\n- 공수처는 없애고 검찰은 공소 유지에 필요한 보완 수사만 맡음.\n- 야당은 \"수사권 장악 시도\"라며 반발함.\n- 정부는 \"법 앞에 예외는 없다\"는 입장을 굽히지 않음."
 tfrkphn.313.desc:0 "- 취임 석 달째, 대통령의 기자간담회가 생중계됨.\n- 민감한 질문이 이어지자 대통령의 말투가 거칠어짐.\n- 질문한 기자를 면박 주는 장면이 그대로 전파를 탐.\n- 영상은 반나절 만에 조회수 수백만을 넘김.\n- 야당은 \"국민을 대하는 태도가 저렇다\"며 공세에 나섬."
 tfrkphn.313.news:0 "§Y'취임 석 달째 대통령, 이래도 되는 건가'... 국민의힘 아닌 '욕설의 힘'?§!\n\n대통령의 기자간담회가 생중계되고 있었다. 기자의 민감한 질문이 이어지자 대통령의 말투가 거칠어졌다. 질문한 기자에게 면박을 주는 장면까지 그대로 전파를 탔다.\n\n영상은 반나절 만에 조회수 수백만 회를 기록했다. 야당은 \"국민을 대하는 태도가 저렇다\"라며 거센 공세에 나섰다."
 tfrkphn.314.news:0 "새벽에 대통령의 개인 SNS에 글 한 줄이 올라왔다. 글에는 야당 대표를 향한 날 선 표현들이 담겨 있었다. 참모진이 급히 글을 내렸지만, 캡처본은 벌써 인터넷 곳곳에 퍼진 뒤였다.\n\n지지층에서는 \"속이 시원하다\"라는 반응이 나왔다. 중도층에서는 \"대통령으로서의 품격이 의심된다\"라는 말이 나오기 시작했다."
 tfrkphn.315.desc:0 "- 시원한 직설로 사랑받던 '홍카콜라' 화법이 도마에 오름.\n- 연이은 설화로 여당 안에서도 우려가 나옴.\n- 한 중진 의원은 \"대통령의 입이 정부의 가장 큰 리스크\"라고 말함.\n- 지지율은 취임 초의 기세를 잃고 내리막을 탐.\n- 대통령은 어떤 화법을 이어 갈지 선택해야 함."
 tfrkphn.315.news:0 "§Y[뉴스] 취임 석 달, 대통령의 '입'이 정부를 흔든다§!\n\n홍준표 대통령은 거침없고 시원한 화법으로 '홍카콜라'라는 별명을 얻었다. 대통령이 된 뒤에도 그 말투는 그대로였고, 이제는 정부 전체가 그 말투를 떠안고 있다.\n\n어제 기자간담회는 생중계되었다. 민감한 질문이 이어지자 대통령의 목소리가 눈에 띄게 거칠어졌다. 기자에게 면박을 주는 장면이 편집 없이 전파를 탔다. 영상은 반나절 만에 조회수 수백만 회를 넘겼다. 야당은 \"국민을 대하는 태도가 바로 저것\"이라며 공세에 나섰다.\n\n논란은 하루 만에 다시 번졌다. 오늘 새벽 대통령 개인 SNS에 야당 대표를 겨냥한 날 선 글 한 줄이 올라왔다. 참모진이 급히 글을 내렸지만, 캡처 화면은 이미 온라인 곳곳으로 퍼진 뒤였다.\n\n여당 안에서도 우려가 터져 나왔다. \"지금 이 정부의 가장 큰 리스크는 대통령의 입.\" 국민의힘 한 중진 의원의 말이다.\n\n반응은 둘로 갈렸다. 지지층은 \"속이 다 시원하다\"고 환호했다. 반면 중도층은 대통령의 품격을 묻기 시작했다. 취임 때 높았던 지지율은 석 달째 내리막이다.\n\n청와대는 오늘 대통령의 공개 일정을 모두 비웠다."
 tfrkphn.320.desc:0 "이정훈은 올해로 마흔일곱 살의 회사원이었다.\n어려서부터 수학을 잘했고, 장점을 살려 공대에 진학해 기술을 배워 좋은 직장에 취직했다.\n\n그는 이름만 들으면 누구나 아는 대기업의 최연소 부장이었고, 사랑하는 아내와 딸, 가족관계도 원만한, 동창들 모두가 부러워하는 그런 사람이었다.\n\n그러나 그날부터 이 행복한 일상이 깨졌다.\n\n\"이 부장? 잠시만 따라와 봐.\n요즘 업무 성과도 떨어지고... 의욕도 잘 안 생기는 거 같고... 아무래도 우리 회사랑 잘 안 맞는 거 같아.\n새로운 일을 알아보는 건 어때?\"\n\n\"네? 그게 무슨...\"\n\n정훈은 자존심을 다 내려놓고 본인의 성과부터 가족과 딸까지, 자신이 할 수 있는 최대한의 언변으로 해고를 거부하려 했다.\n\n그럴 때마다 회사는 능글맞게 이건 해고가 아니고 명예퇴직 권유라고 몇 번이나 되풀이했다. 하지만 회사는 그가 상상한 것보다 훨씬 악랄하게 굴었다.\n\n'직무 교육'이라는 명목으로 정훈을 지방의 교육원으로 보내 '이력서 쓰는 법', '잡초 뽑기', 심지어는 '명상 교육'까지 시켰고, 정훈은 그 모든 일을 가족을 생각하며 버텨냈다.\n\n지옥 같은 한 달이 지나고 회사에 복귀하자, 정훈의 자리는 책상만 남겨둔 채 전부 치워져 있었다.\n\n\"아, 이 부장. 일은 없으니까 자리에 앉아 있게.\"\n\n한 시간, 두 시간. 열심히 일하는 동료들 사이에서 아무것도 하지 않고 허공만 쳐다보고 있는 건 '명상 교육'보다 백 배는 괴로웠다.\n그리고 잠시 탕비실에서 믹스커피 하나를 집어 든 순간, 선임과 눈이 딱 마주쳤다.\n\n\"어, 이 부장. 내가 자리에 가만히 앉아 있으라고 했을 텐데? 이건 내가 따로 책임을 묻겠네.\"\n\n결국 정훈은 며칠 지나지 않아 회사에 사표를 제출할 수밖에 없었다.\n\n늘 '자유시간'을 꿈꿔 왔지만 이런 자유시간을 바란 적은 없었다.\n\n정신을 차려 보니 정훈은 공원 벤치에 앉아 있었다.\n\n'하... 가족들한테는 뭐라고 해야 하나.\n당장 다음 달 학원비부터...'\n\n\"아빠?\"\n\n\"이서진...? 네가 왜 여기...\"\n\n\"아니, 아빠야말로 회사에 있을 시간 아니야?\""
 tfrkphn.321.desc:0 "'막말 홍준표 복당 결사반대'\n\n꼬박 1년 3개월의 방황을 끝마치고 어렵사리 돌아온 나에게 되돌아온 반응이었다. 브리핑을 마친 수석 비서에게 눈짓으로 나가 있으라 하고, 나는 집무실 소파에 털썩 주저앉아 미간을 꾹 눌렀다.\n\n2016년 박근혜 전 대통령 탄핵 뒤로 다들 배에서 뛰어내릴 때 키를 잡은 게 누구였나. 내 자리보다 당을 먼저 살리겠다고 몸을 던졌다는 것, 그 자부심 하나로 버텼다. 그런데 그때 같이 버티던 동지들이 이제 제일 앞에서 내 복당을 막고 있었다. 그게 제일 쓰렸다. 정치 신인 시절의 대쪽 같던 '모래시계 검사'는, 어느새 존재 자체만으로 당을 나락으로 빠뜨리는 '막말준표'로 바뀌어 있었다.\n\n나이도 이제 일흔을 넘겼다. 다가오는 대선이 내가 나설 수 있는 마지막 판이다. 당원과 시민들이 다시 내 손을 잡아 줄지는 나도 모른다. 그래도 요즘 유튜브와 인스타그램에서 2017년 대선 때 내가 한 말들이 다시 돈다. 거기 몰려드는 2030들을 제대로 끌어안으면 이번 싸움은 해 볼 만하다. 나는 휴대전화를 켜고 그 영상들 댓글을 하나씩 읽어 내려갔다."
 tfrkphn.322.desc:0 "경상남도 창녕의 작은 시골. 소년은 남의 땅을 부쳐 먹던 집에서 자랐다. 아버지는 하루 몇백 원을 받는 경비원이었고, 어머니는 장터에 좌판을 펴고 가발을 팔았다.\n\n소년은 그 장터에서 평생 잊지 못할 장면을 봤다. 고리 사채 몇 푼 때문에 사채업자가 어머니 머리채를 잡고 길바닥으로 끌고 갔다. 사람들은 고개를 돌렸고 아무도 나서지 않았다. 소년은 주먹만 쥔 채 서 있었다.\n\n가난을 벗어날 길은 공부뿐이었다. 소년은 이를 악물었고 마침내 사관학교 합격 통지서를 받았다. 군복을 입으면 아무도 자기를 무시하지 못할 줄 알았다.\n\n그해 아버지가 누명을 썼다. 하지도 않은 일로 경찰에 불려 다녔다. 그 모습을 보던 어느 날 동네 어른들이 혀를 찼다.\n\n\"야, 군인보다 센 직업이 뭔지 아나?\"\n\"니 그것도 모르나. 군인도 검사 앞에선 꼼짝 못 한다.\"\n\n그 말이 소년의 길을 바꿨다. 그는 사관학교 대신 다시 책상 앞에 앉았다. 힘없는 사람이 억울하게 끌려가지 않는 세상을 만들 수 있는 사람이 되고 싶었다. 몇 년 뒤 그는 정말 검사가 됐다.\n\n남쪽 도시 강력부에서 그는 조직폭력배를 하나씩 잡아들였다. 서울로 올라와서는 도박 업계 뒤에 숨은 권력과 마주했다. 수사가 깊어질수록 얼굴들이 드러났다. 이름만 대면 알 만한 실세들, 같은 검찰의 선배들이었다.\n\n\"홍 검사, 당신 지금 실수하는 거요.\"\n\n수화기 너머 목소리는 낮고 차가웠다. 그는 수화기를 내려놓고 다음 서류를 펼쳤다. 그해 그는 실세들에게 수갑을 채웠고, 세상은 그를 모래시계 검사라 불렀다.\n\n조직은 길들지 않는 검사를 반기지 않았다. 그는 한직을 돌다가 결국 검사복을 벗었다. 평온은 오지 않았다. 그가 감옥에 보낸 깡패들이 하나둘 출소해 그와 가족 곁을 서성였다. 한밤중에 전화가 울렸고 집 앞에 낯선 그림자가 맴돌았다.\n\n그때 집권당이 손을 내밀었다. 함께 정치를 해 보자고. 그는 훗날 거창한 나라와 민족 때문이 아니었다고, 가족을 지키려고 정치에 들어왔다고 털어놓았다.\n\n장터에서 주먹을 쥐고 서 있던 소년은 그렇게 더 큰 싸움터로 걸어 들어갔다."
 tfrkphn.322.kp:0 "범죄와의 전쟁을 지휘하는 사람이 어떤 길을 걸어왔는지 우리는 여러 번 들었다. 대통령은 경상남도 창녕의 작은 시골, 남의 땅을 부쳐 먹던 집에서 자랐다. 아버지는 하루 몇백 원을 받는 경비원이었고 어머니는 장터에 좌판을 펴고 가발을 팔았다.\n\n그 장터에서 소년은 평생 잊지 못할 장면을 보았다. 고리 사채 몇 푼 때문에 사채업자가 어머니의 머리채를 잡고 길바닥으로 끌고 간 것이다. 사람들은 고개를 돌리고 지나갔다. 소년은 주먹만 쥔 채 서 있었다.\n\n가난을 벗어나려면 공부를 해야 했다. 이를 악문 소년은 마침내 사관학교 합격 통지서를 받았고, 군복을 입으면 아무도 자기를 무시하지 못하리라 믿었다.\n\n그해 아버지가 누명을 썼다. 하지도 않은 일로 경찰에 불려 다니는 모습을 지켜보던 어느 날, 동네 어른들이 혀를 찼다.\n\n\"야, 군인보다 센 직업이 뭔지 아나?\"\n\"니 그것도 모르나. 군인도 검사 앞에선 꼼짝 못 한다.\"\n\n그 말이 소년의 길을 바꿨고, 그는 사관학교에 가는 대신 다시 책상 앞에 앉았다. 힘없는 사람이 억울하게 끌려가지 않는 세상을 만들 수 있는 사람이 되겠다는 생각이었고, 몇 해 뒤 그는 정말 검사가 되었다."
 tfrkphn.322.kp2:0 "남쪽 도시의 강력부에서 그는 조직폭력배를 하나씩 잡아들였고, 서울로 올라와서는 도박 업계 뒤에 숨은 권력과 마주했다. 수사가 깊어질수록 이름만 대면 알 만한 실세들과 같은 검찰 선배들의 얼굴이 드러났다.\n\n\"홍 검사, 당신 지금 실수하는 거요.\"\n\n수화기 너머의 목소리는 낮고 차가웠다. 그는 수화기를 내려놓고 다음 서류를 펼쳤고, 그해 실세들에게 수갑을 채웠다. 세상은 그를 '모래시계 검사'라 불렀다.\n\n조직은 길들지 않는 검사를 반기지 않았고, 그는 한직을 돌다가 결국 검사복을 벗었다. 그래도 평온은 오지 않았다. 그가 감옥에 보낸 깡패들이 하나둘 출소해 그와 가족 곁을 서성였고, 한밤중의 전화와 집 앞을 맴도는 낯선 그림자가 이어졌다.\n\n그때 집권당이 함께 정치를 해 보자고 손을 내밀었다. 그는 훗날 솔직하게 털어놓았다. 나라와 민족 같은 거창한 이유는 없었고 가족을 지키려고 정치에 들어왔다고 말이다.\n\n장터에서 주먹을 쥐고 서 있던 소년은 그렇게 더 큰 싸움터로 걸어 들어갔다."
 tfrkphn.323.desc:0 "기념식이 끝난 광장에 아직 사람들이 남아 있었다. 확성기 음악이 끊긴 자리에 누군가의 휴대전화에서 낡은 가요 화개장터가 흘러나왔다.\n\n처음엔 몇몇이 웃으며 흥얼거렸다. 대구에서 올라온 버스 기사가 무릎을 치며 박자를 맞추자 광주에서 온 시장 상인이 후렴을 받았다. 경상도 억양과 전라도 억양이 한 소절씩 엇갈렸다. 박자도 음정도 엉망이었지만 아무도 탓하지 않았다.\n\n\"아재, 거기 박자 틀렸어라.\" \"틀리믄 우떻노. 노래는 목청이다.\"\n\n인터넷 게시판에서 서로 날을 세우던 예비역 병장과 사회 초년생도 그 틈에 있었다. 둘은 어느새 같은 쪽을 보고 서 있었고, 누가 먼저 어깨를 들썩였는지는 아무도 기억하지 못했다.\n\n섬진강 하나를 사이에 두고 닷새마다 장이 서는 곳이 있다. 오래전부터 두 고장 사람들이 모여 흥정하고 다투고 웃던 그 장터가 그날 밤 서울 한복판에 잠깐 다시 섰다."
 tfrkphn.324.a:0 "서울에 연락해라."
 tfrkphn.324.desc:0 "도쿄 총리 관저, 밤 11시.\n\n서울에서 온 친서는 그 어느 때보다 묵직했다. 북한과 중국의 핵에 맞서 두 나라가 함께 핵억지력을 갖추자는 제안이었다.\n총리는 담배를 한 모금 빨며 말했다.\n그래서 이거 정말 가능한 것인가?\n잠시 후 한 모금을 더 빨며 말했다.\n이거 정말 이룰 수 있는 것인가?\n\n방위대신이 말했다.\n총리님, 이건 국익의 문제를 넘어선 겁니다. 힘의 균형을 다시 짤 수 있습니다.\n\n외무대신은 과거의 문제보다 지금 당장의 현실에 집중하자고 했다.\n\n이제 총리의 결단만 남았다."
 tfrkphn.327.desc:0 "대한민국 정부와 일본 정부가 지난주부터 동해상에서의 어업 및 선박 운항 전면 금지를 선언한 가운데, 오늘 아침 7시쯤 동해상에서 정체를 알 수 없는 폭발이 감지됐습니다.\n\n양국이 공동 원자력 협정을 맺은 뒤로 전문가들은 한국의 핵무장 가능성을 꾸준히 거론해 왔습니다.\n\n홍준표 대통령이 북핵과 중국의 핵무기에 대한 강경 대응과 핵균형을 줄곧 주장해 온 만큼, 핵개발설에 무게가 실리고 있습니다.\n\n민주노동당과 일본 공산당은 공동 성명을 내고 핵개발 반대 입장을 밝혔으며, 각종 평화주의 시민단체들은 가두행진을 조직하고 있습니다.\n\n한국 정부는 아직 공식 입장을 내지 않았습니다. 기상청 지진계에 찍힌 파형을 본 한 지질학 교수는 취재진에게 이렇게 말했습니다. \"자연 지진에서는 이런 모양이 안 나옵니다.\""
 tfrkphn.33.kp:0 "청와대 춘추관 브리핑룸, 오후 2시다. 플래시 세례 속에서 대통령이 단상에 올랐고 브리핑룸은 국내외 기자들로 발 디딜 틈이 없었다.\n\n바다 건너 대만에서 전쟁이 터진 지 열흘째다. 마트의 생필품 진열대는 텅 비었고 주식시장은 연일 곤두박질치고 있다. 우리는 대통령이 직접 나서야 한다고 건의했고, 대통령은 원고 없이 하겠다고 했다.\n\n짧은 모두발언이 끝나자마자 질문이 쏟아졌다."
 tfrkphn.33.kp2:0 "\"대통령님, 우리 장병들이 대만 전선에 투입될 가능성은 정말 없습니까?\"\n\"중국이 우리를 표적으로 삼으면 정부 대책은 무엇입니까?\"\n\"사재기가 벌어지고 있는데, 국민들은 지금 무엇을 준비해야 합니까?\"\n\n대통령은 질문 하나하나에 거침없이 답했다. 우리 장병이 대만 전선에 투입되는 일은 없고, 생필품과 에너지는 충분히 비축되어 있으며, 정부는 국민의 일상을 끝까지 지킨다는 답이었다.\n\n마지막 질문은 맨 앞줄의 젊은 기자에게서 나왔다.\n\n\"그래도 불안해하는 국민들에게, 딱 한마디만 해 주신다면요?\"\n\n대통령은 잠시 기자를 바라보더니 씩 웃으며 마이크를 다시 잡았다."
 tfrkphn.346.desc:0 "개표가 끝난 새벽, 오세훈의 당선이 확정되었다. 그는 수도권과 충청에서 고르게 이겼고, 스스로 중도라고 답한 유권자의 표가 승부를 갈랐다. 여당 지도부는 축하 성명을 냈지만 강경파 의원 몇몇은 그날 국회에 나오지 않았다.\n\n취임식 날, 그는 국회 앞마당에서 오른손을 들고 헌법 선서를 했다. 그는 가장 약한 사람들의 이야기로 취임사를 시작했다. 서울시장 시절부터 써 온 말들이 이번에는 나라 전체를 향했다.\n\n같은 당에서 나온 대통령이었지만, 그는 취임 첫 주에 전임자가 걸어 둔 비상 조치부터 하나씩 풀기 시작했다."
 tfrkphn.38.kp:0 "대만지원법이 부결된 뒤로 우리가 대놓고 할 수 있는 일은 줄었다. 국가정보원이 요즘 무슨 일을 하는지에 대해 우리는 확인도 부인도 하지 않는다. 그런데 서울 신촌의 한 PC방에서 새벽 1시에 있었다는 일 하나가 우리 귀에까지 들어왔다.\n\n\"야, 너 이거 봤냐? 요즘 커뮤니티마다 '중국 위협론' 글이 미친 듯이 올라오잖아.\"\n\"그게 왜?\"\n\"이상하지 않냐? 글 쓴 계정들 가입일이 다 지난달이야. 말투도 다 똑같고. 이거 국정원 댓글부대라니까. 부결돼서 대놓고 못 도우니까 여론부터 만지는 거지.\"\n\"에이, 또 그 소리. 너는 맨날 음모론이야.\"\n\"진짜라니까? 아무튼 우리 삼촌이 국정원에서 일하는데, 삼촌한테 물어보면...\"\n\n그 순간 PC방 유리문 밖으로 빨간 마티즈 한 대가 천천히 멈춰 섰다. 운전석 창문이 스르륵 내려가더니 선글라스를 낀 중년 남자가 두 사람을 향해 손을 흔들었다.\n\n\"어이, 조카. 늦었는데 삼촌이 집까지 태워 줄까?\"\n\n두 사람은 한동안 아무 말도 하지 못했다."
 tfrkphn.39.kp:0 "런던, 국제 안보 총회장이다. 우리 외교부 장관이 단상에 올라 공동성명을 읽어 내려갔고, 그 뒤로 일본과 호주, 뉴질랜드, 동남아 몇몇 나라의 대표들이 나란히 섰다.\n\n\"우리 아시아의 민주주의 국가들은 중화인민공화국의 대만 침공을 강력히 규탄한다. 무력에 의한 현상 변경은 결코 용납될 수 없으며, 국제사회는 즉각적인 휴전과 침략군의 철수를 요구한다.\"\n\n성명이 끝나자 박수가 이어졌다. 회의장 한쪽 중국 대표단석의 외교관들은 박수 대신 귀엣말을 주고받으며 피식 웃었고, 성명이 끝나기도 전에 서류를 챙겨 일어났다. 종이 위의 규탄으로는 해협을 건너는 상륙함 한 척도 멈출 수 없다는 것을 그들은 누구보다 잘 안다."
 tfrkphn.39.kp2:0 "미국 대표단석은 반쯤 비어 있었는데, 자리를 지킨 외교관 몇 명은 성명서를 받아 들고도 말이 없었다. 본국이 내전으로 갈라진 지금 그들은 자기가 누구를 대표하는지조차 확신하지 못한다. 한때 이런 자리에서 가장 먼저, 가장 크게 목소리를 내던 나라였다.\n\n총회가 끝난 뒤 독일과 프랑스, 영국의 대표들이 우리 대표단을 찾아왔다. 영국 대표는 악수를 하며 다음 달 런던에서 따로 만나자고 했다."
 tfrkphn.41.kp:0 "국방부 군수지원과의 연말 재고 조사 보고서가 올라왔다.\n\n\"제3탄약창 소화기탄 재고, 장부상 수량과 실재고 차이 약 40만 발. 사유: 노후 탄약 폐기 처분.\"\n\"제7탄약창 105mm 포탄, 차이 약 2만 발. 사유: 훈련 소모.\"\n\"제2보급창 지원 장비, 차이 약 500세트. 사유: 정비 중 분실.\"\n\n보고서를 넘기던 국방부 장관은 한숨도 쉬지 않고 결재란에 서명했다. 이 보고서가 국회 국방위원회에 올라가면 야당은 분명 난리를 칠 것이다. 하지만 야당 의원들도 안다. 사라진 탄약이 어디로 갔는지 캐묻는 순간 모두가 곤란해진다는 것을."
 tfrkphn.41.kp2:0 "보고서는 결국 대통령의 책상에도 올라갔고, 검사 시절의 대통령은 장부 속의 거짓을 가장 먼저 읽어 내던 사람이다. 그는 훗날 이렇게 회고했다.\n\n\"1993년 4월 동화은행 비자금 사건 때 함승희 주임 검사의 요청으로 20분 만에 김종인 전 경제수석의 뇌물 사건을 자백받았다\"\n\n그런 사람이 이번만큼은 숫자가 맞지 않는 장부를 두고 아무것도 묻지 않았다.\n\n같은 시각 공해상의 어느 해역에서는 국적 표시가 없는 화물선 한 척이 대만 해군 함정 옆에 조용히 멈춰 섰고, 크레인이 움직이기 시작했다.\n\n국회는 대만지원법을 부결했고 대한민국은 중립국이다. 그리고 군대에서 탄약이 조금 사라지는 일은 원래 흔하다."
 tfrkphn.415.desc:0 "[GetDateText], 청와대에서 임명식이 열렸다. 공군중장 김형수가 공군작전사령관에 임명되었다.\n\n대통령은 임명장을 건네며 말했다.\n\n\"적기가 뜨면 몇 분 안에 결정해야 하는 자리입니다. 평소에 판단 기준을 세워 두세요.\"\n\n김형수 중장은 경례로 답했다."
 tfrkphn.421.desc:0 "육군참모총장 자리를 맡길 사람을 정해야 한다.\n\n임명식은 청와대에서 열린다. 대통령이 신임 총장의 삼정검에 직접 수치를 달아 준다. 삼정검은 장군으로 진급할 때 받는 칼로, 호국과 통일과 번영을 뜻한다. 수치에는 직책과 계급, 이름, 그리고 대통령의 이름이 새겨진다.\n\n대통령은 당부할 말을 이미 정해 두었다. 경계는 빈틈없이 하고, 월급 적다고 떠나는 초급 간부들을 붙잡아 달라고.\n\n§Y누구를 육군참모총장으로 임명하시겠습니까?§!"
 tfrkphn.422.desc:0 "해군참모총장 자리를 맡길 사람을 정해야 한다.\n\n임명식은 청와대에서 열린다. 대통령이 신임 총장의 삼정검에 직접 수치를 달아 준다. 삼정검은 장군으로 진급할 때 받는 칼로, 호국과 통일과 번영을 뜻한다. 수치에는 직책과 계급, 이름, 그리고 대통령의 이름이 새겨진다.\n\n대통령은 당부할 말을 이미 정해 두었다. 경계는 빈틈없이 하고, 월급 적다고 떠나는 초급 간부들을 붙잡아 달라고.\n\n§Y누구를 해군참모총장으로 임명하시겠습니까?§!"
 tfrkphn.423.desc:0 "공군참모총장 자리를 맡길 사람을 정해야 한다.\n\n임명식은 청와대에서 열린다. 대통령이 신임 총장의 삼정검에 직접 수치를 달아 준다. 삼정검은 장군으로 진급할 때 받는 칼로, 호국과 통일과 번영을 뜻한다. 수치에는 직책과 계급, 이름, 그리고 대통령의 이름이 새겨진다.\n\n대통령은 당부할 말을 이미 정해 두었다. 경계는 빈틈없이 하고, 월급 적다고 떠나는 초급 간부들을 붙잡아 달라고.\n\n§Y누구를 공군참모총장으로 임명하시겠습니까?§!"
 tfrkphn.431.desc:0 "진해 해군기지 회의실. 순양함급 차기 전투함 KDDX의 최종 설계안에 마지막 서명이 들어갔다. 선체부터 전투체계까지 국내 기술로 채운 첫 대형 수상전투함이다.\n\n통합마스트 안에 다기능 위상배열 레이더를 넣어 상부 구조물을 줄였다. 갑판 아래에는 K-VLS가 들어갔다. 거기서 함대공 유도탄-II가 올라가고, 마지막 방어선은 CIWS-II가 맡는다. 5인치 함포와 어뢰, 예인 소나도 함께 실렸다. 레이더 반사 면적을 줄인 선형 덕분에 멀리서는 작은 배처럼 잡힌다.\n\n해군참모총장이 설계도를 가리키며 말했다.\n\n§Y\"발사대도, 미사일도, 근접방어도 우리 것입니다. 이제 4척을 올립니다.\"§!\n\n그날 오후 도크에서 첫 강재를 자르는 불꽃이 튀었다."
 tfrkphn.447.d:0 "북한군 병사 한 명이 판문점 군사분계선을 넘었습니다.\n\n초소에서 뛰어나와 남쪽으로 달리는 그의 뒤에서 총소리가 났습니다. 쓰러진 그를 우리 경비대대가 끌어냈고, 그는 수술 끝에 목숨을 건졌습니다. 2017년 11월에도 북한군 병사 한 명이 총을 맞으며 이곳을 넘은 일이 있습니다."
 tfrkphn.455.d:0 "북한에서 올라오는 보고가 하루 사이에 달라졌습니다.\n\n도 당위원회는 평양의 지시에 답하지 않고, 공장은 멈췄으며 열차는 역에 선 채 움직이지 않습니다. 군부대의 식량 창고를 병사들이 털었다는 보고까지 올라오는데도 평양의 방송은 어제와 같은 말만 되풀이하고 있습니다."
 tfrkphn.457.d:0 "[TFRKPHN_nk_lost_name]에 주둔한 군단이 평양의 명령을 받지 않습니다.\n\n군단 지휘부는 총정치국에서 내려온 검열단을 부대 정문에서 돌려보냈고, 병사들이 도 보위부 청사를 에워싸자 보위원들은 무기를 내려놓았습니다. 도 경계의 초소마다 평양에서 오는 차를 막는 차단봉이 내려가 있어서, 평양은 그 도에 군대를 들여보내지 못하고 있습니다."
 tfrkphn.460.d:0 "합참의장이 두꺼운 서류철을 들고 집무실에 들어왔는데, 북으로 올라가는 작전계획이었습니다.\n\n지도에는 길이 둘 그려져 있었습니다. 하나는 개성을 지나 평양으로 가는 길이고, 다른 하나는 동해안에 병력을 올려 원산을 치는 길입니다. 합참의장은 어느 쪽에 무게를 둘 것인지 물었습니다."
 tfrkphn.465.d:0 "총정치국이 검열단을 내려보냈지만, 검열단은 부대 안으로 들어가지 못했습니다.\n\n위병소의 병사들이 총을 든 채 길을 막았고 지휘관은 끝내 나오지 않았습니다. 검열단장이 평양에 전화를 걸려고 하자 부대의 통신병이 선을 끊어 버려서, 검열단은 타고 온 차를 두고 걸어서 돌아갔습니다."
 tfrkphn.466.d:0 "이인제 대통령이 유승민 전 의원을 집무실로 불렀습니다.\n\n전화를 받은 유승민은 놀랐습니다. 홍준표가 물려준 정부가 자신을 부를 까닭이 없다고 생각했기 때문입니다. 비서관이 재벌개혁 공약집을 가져와 달라고 하자 그는 무슨 공약집이냐고 되물었고, 2017년 것이라는 답이 돌아왔습니다.\n\n유승민이 내놓은 것은 서류 한 묶음이었습니다. 공정거래위원회의 전속고발권을 없애고, 집단소송제와 징벌적 손해배상제를 들이고, 총수 일가의 개인회사를 막는 안이었습니다. 대통령은 그 서류를 끝까지 읽으면서 중간에 두 번 되물었는데, 두 번 다 조문 번호를 짚은 질문이었습니다.\n\n유승민이 알던 이인제는 당을 여러 번 옮겨 사람들에게 철새라고 불리던 사람이었습니다. 그런 사람이 재계와 맞서는 법안을 끝까지 읽으리라고는 기대하지 않았던 터라, 집무실을 나오면서 그는 자신이 사람을 별명으로만 알고 있었다고 생각했습니다."
 tfrkphn.467.d0:0 "여의도, 국회 본회의장 방청석.\n\n마지막 법안의 표결 결과가 전광판에 떴을 때 유승민은 방청석 맨 뒷줄에 앉아 있었다. 의원 배지를 뗀 지도 여러 해였다. 아래층 의석에서 박수가 나왔지만 그는 박수를 치는 대신 찬성 숫자를 끝까지 읽고 나서야 자리에서 일어났다.\n\n복도는 조용했다. 네 번의 임기 동안 걸었던 복도였고, 2015년 봄에는 원내대표로 저 아래 연단에 서기도 했다. 그날 그는 증세 없는 복지는 허구라고 말했고 재벌도 개혁에 동참해야 한다고 말했는데, 석 달 뒤에는 원내대표에서 물러나야 했다.\n\n2017년 2월에는 기자들 앞에서 재벌개혁 공약을 읽었다. 전속고발권 폐지, 집단소송제, 징벌적 손해배상, 총수 일가의 개인회사 금지. 석 달 뒤에 받은 표는 6.8퍼센트였고, 공약집은 서재 책장 맨 아래 칸으로 내려갔다. 그 뒤로 당이 여러 번 바뀌는 동안에도 공약집은 그 자리에 그대로 있었다.\n\n그는 경제학자로 한국개발연구원에서 13년을 일했다. 숫자가 맞아야 정책이 선다고 배운 사람이었는데, 정치에 와서는 맞는 숫자를 들고도 표를 얻지 못한 일이 여러 번이었다. 이인제 대통령이 집무실로 불렀을 때 그가 가방에 넣고 간 것이 바로 그 공약집이었고, 대통령은 그 서류를 끝까지 읽었다.\n\n오늘 통과된 여덟 법안은 그 공약집과 뼈대가 같았고, 재계와 타협해 고친 줄은 하나도 없었다. 경제 단체들이 세 번 성명을 냈지만 표결은 세 번 다 예정대로 열렸다.\n\n주차장에서 그는 휴대폰을 꺼내 그때 공약집을 같이 썼던 사람에게 문자를 보냈다. 답은 금방 왔다. 오래 걸렸네요.\n\n그는 휴대폰을 주머니에 넣고 시동을 걸었다."
 tfrkphn.467.d1:0 "여의도, 국회 본회의장 방청석.\n\n마지막 법안의 표결 결과가 전광판에 떴을 때 유승민은 방청석 맨 뒷줄에 앉아 있었다. 의원 배지를 뗀 지도 여러 해였다. 아래층 의석에서 박수가 나왔지만 그는 박수를 치는 대신 찬성 숫자를 끝까지 읽고 나서야 자리에서 일어났다.\n\n복도는 조용했다. 네 번의 임기 동안 걸었던 복도였고, 2015년 봄에는 원내대표로 저 아래 연단에 서기도 했다. 그날 그는 증세 없는 복지는 허구라고 말했고 재벌도 개혁에 동참해야 한다고 말했는데, 석 달 뒤에는 원내대표에서 물러나야 했다.\n\n2017년 2월에는 기자들 앞에서 재벌개혁 공약을 읽었다. 전속고발권 폐지, 집단소송제, 징벌적 손해배상, 총수 일가의 개인회사 금지. 석 달 뒤에 받은 표는 6.8퍼센트였고, 공약집은 서재 책장 맨 아래 칸으로 내려갔다. 그 뒤로 당이 여러 번 바뀌는 동안에도 공약집은 그 자리에 그대로 있었다.\n\n그는 경제학자로 한국개발연구원에서 13년을 일했다. 숫자가 맞아야 정책이 선다고 배운 사람이었는데, 정치에 와서는 맞는 숫자를 들고도 표를 얻지 못한 일이 여러 번이었다. 이인제 대통령이 집무실로 불렀을 때 그가 가방에 넣고 간 것이 바로 그 공약집이었고, 대통령은 그 서류를 끝까지 읽었다.\n\n법안 몇 개에는 예외 조항이 붙었다. 재계와 마주 앉아 고친 줄이었는데, 그는 그 조항을 한 줄씩 읽어 보고 뼈대는 남았다고 판단해 받아들였다. 빠진 데가 있어도 통과되는 쪽이 낫다고 그는 생각했다.\n\n주차장에서 그는 휴대폰을 꺼내 그때 공약집을 같이 썼던 사람에게 거의 됐다고 문자를 보냈다. 답은 금방 왔다. 거의면 됐다.\n\n그는 휴대폰을 주머니에 넣고 시동을 걸었다."
