 TFRKPHN_le_bio_o17v2:0 "£GFX_KOR_DemocraticParty_texticon §Y위성곤§!  현직\n§Y출생:§! 1968년 1월 20일, 전라남도 장흥\n§Y이력:§!\n제주대학교 총학생회장을 지냈습니다. 2006년부터 2015년까지\n제주도의회 의원으로 일했습니다. 2016년 서귀포시에서 제20대\n국회의원에 당선됐고 2020년 재선했습니다. 더불어민주당 전국농어민위원회\n위원장을 지냈습니다.\n§Y눈에 띄는 일:§!\n여덟 살 때 부모를 따라 외가가 있는 서귀포로 옮겨 왔습니다.\n \n§Y이 세계에서는:§!\n야당의 제주도지사 후보입니다. 2026년 지방선거에서 당선돼 지금 이\n자리를 맡고 있습니다."
 TFRKPHN_le_bio_o2:0 "£GFX_KOR_DemocraticParty_texticon §Y전재수§!  도전\n§Y출생:§! 1971년 4월 20일, 경상남도 의령\n§Y학력:§!\n동국대학교 역사교육과\n§Y이력:§!\n2000년 국회 환경노동위원회 입법보좌관으로 일을 시작했습니다.\n2002년 대통령직인수위원회 행정관, 2003년 재정경제부 장관\n정책보좌관, 2004년 청와대 경제수석실 행정관을 거쳐 2006년 청와대\n제2부속실장이 됐습니다. 2006년 부산 북구청장 선거와 2008년,\n2012년 총선에서 낙선했습니다. 2016년 부산 북구강서구 갑에서\n제20대 국회의원에 당선됐고 2020년 재선했습니다.\n§Y눈에 띄는 일:§!\n여덟 살 무렵 부산 북구 만덕동으로 옮겨 와 그곳에서 자랐습니다. 세 번\n떨어진 뒤 네 번째 도전에서 당선됐습니다.\n \n§Y이 세계에서는:§!\n야당의 부산시장 후보입니다."
