 TFRKPHN_daegu_city:0 "대구광역시"
 TFRKPHN_daegu_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_daegu_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9팔공산이 병풍처럼 둘러친 거대한 분지는 한여름의 끓어오르는 폭염보다 더 뜨거웠던 근대화의 영광을 품고도, 이제는 식어버린 열기를 밖으로 토해내지 못해 안으로만 삭히고 있습니다. 한때 전국의 옷감을 짜내던 방직기계의 힘찬 굉음과 붉게 익어가던 사과의 낭만은 시대의 저편으로 사라졌고, 수십 년째 제자리걸음인 경제 지표의 그늘만이 도시를 무겁게 짓누르고 있습니다.\n\n'보수의 심장'이라는 견고한 성벽은 외부의 풍파를 막아주는 방패인 동시에 스스로를 고립시키는 높은 담장이 되어, 변화의 바람조차 넘지 못한 그 벽 너머로 청년들이 떠난 자리는 빠르게 늙어가고 있습니다. 닫힌 지형만큼이나 완고한 고집과 배타성 속에 갇혀, 찬란했던 과거의 자존심 하나로 쇠락해가는 오늘을 힘겹게 버텨내는 애증의 땅입니다.§!\n\n§7능금꽃 향기로운 내 고향땅은\n팔공산 바라보는 해뜨는 거리\n그대와 나 여기서 꿈을 꾸었네\n아름답고 정다운 꿈을 꾸었네\n둘이서 걸어가는 희망의 거리\n능금꽃 피고 지는 사랑의 거리\n대구는 내 고향 정다운 내 고향§![GetTFRKPHNGov_daegu]"
