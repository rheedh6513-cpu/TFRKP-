 TFRKPHN_gov_daejeon_i:0 "\n\n\n§Y대전광역시장:§!\n\n\n\n\n\n\n\n\n\n£GFX_TFRKPHN_gvp_lee_jang_woo\n\n\n\n\n\n\n\n§W         이장우§!\n\n\n§Y집권 정당: £GFX_KOR_PPP_texticon §A국민의힘§!"
 KOR_daejeon_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_daejeon_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9갑천의 유유한 물결 위로 엑스포 다리의 아치가 미래를 그리듯 솟아있지만, 그 화려한 과학 도시의 불빛 아래에는 '한밭'이라 불리던 시절의 넉넉한 인심 대신 삭막한 이성의 냉기만이 감돕니다. 전국의 철길이 교차하며 수많은 타인의 발자국을 받아낸 교통의 요충지였으나, 정작 그 길은 사람들을 이곳에 뿌리내리게 하기보다 스쳐 지나가는 정거장의 쓸쓸한 운명을 안겨주었습니다.\n\n연구단지의 높은 담벼락 안에 갇힌 지식은 원도심의 쇠락과 섞이지 못한 채 섬처럼 떠다니고, '노잼 도시'라는 자조 섞인 농담 뒤에는 뚜렷한 색채 없이 무채색으로 평준화된 도시의 권태와 정체성 부재가 깊게 깔려 있습니다. 대한민국의 중심이라는 자부심과 어디에도 속하지 못한 주변인의 정서가 기묘하게 동거하는 이곳은, 너무나 반듯해서 오히려 공허한 바람이 부는 회색빛 계획도시입니다.§!\n\n§2모든 길이 통하지만 정작 누구도 머물지 않는, 화려한 과학의 외투를 입은 무채색의 환승역.§![GetTFRKPHNGov_daejeon]"
 TFRKPHN_gov_ulsan_g:0 "\n\n\n§Y울산광역시장:§!\n\n\n\n\n\n\n\n\n\n£GFX_TFRKPHN_gvp_kim_doo_gyeom\n\n\n\n\n\n\n\n§W         김두겸§!\n\n\n§Y집권 정당: £GFX_KOR_PPP_texticon §A국민의힘§!"
