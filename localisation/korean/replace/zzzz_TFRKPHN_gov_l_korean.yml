 TFRKPHN_gov_incheon_i:0 "\n\n\n\n\n\n                    §Y인천광역시장§!\n\n\n                    §Y집권 정당§!\n£GFX_TFRKPHN_gvp_yoo_jeong_bok\n                    £GFX_KOR_PPP_texticon §A국민의힘§!\n\n\n\n\n§W      유정복§!"
 TFRKPHN_gov_incheon_p0:0 "\n\n\n\n\n\n                    §Y인천광역시장§!\n\n\n                    §Y집권 정당§!\n£GFX_TFRKPHN_gvp_park_nam_choon\n                    £GFX_KOR_DemocraticParty_texticon §P더불어민주당§!\n\n\n\n\n§W      박남춘§!"
 TFRKPHN_incheon_city:0 "인천광역시"
 TFRKPHN_incheon_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_incheon_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9해무가 자욱하게 내려앉은 갯벌 위로 붉은 낙조가 스며들면, 이 도시는 비로소 격동의 시간을 내려놓고 거친 숨을 고릅니다. 낯선 이방인들에게 빗장을 풀며 근대의 파도를 가장 먼저 맞이했던 개항의 낭만 이면에는, 침탈의 아픔과 치열했던 산업화의 땀방울이 붉은 벽돌마다 깊이 박혀 있습니다.\n\n바다를 메워 올린 유리 마천루가 화려한 미래를 뽐낼 때 그 그늘에 가려진 원도심의 낡은 골목은 더욱 깊은 소외감에 잠기고, 끊임없이 오가는 거대한 트럭과 비행기의 굉음 속에서 도시는 언제나 누군가를 떠나보내는 정거장의 쓸쓸함을 감내합니다. 화려한 비상과 쇠락해가는 뒷모습이 위태롭게 엉켜있는 이곳은, 개발의 욕망과 남겨진 것들의 한숨이 파도 소리에 섞여 흐르는 땅입니다.§!\n\n§3떠나는 이들의 설렘과 남겨진 이들의 애환이 공존하는, 영원한 경계의 도시.§![GetTFRKPHNGov_incheon]"
