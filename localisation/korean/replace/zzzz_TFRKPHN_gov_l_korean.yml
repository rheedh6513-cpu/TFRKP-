 TFRKPHN_gov_ulsan_i:0 "\n\n\n§Y울산광역시장:§!\n\n\n\n\n\n\n\n\n\n£GFX_TFRKPHN_gvp_kim_doo_gyeom\n\n\n\n\n\n\n\n§W         김두겸§!\n\n\n§Y집권 정당: £GFX_KOR_PPP_texticon §A국민의힘§!"
 KOR_ulsan_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_ulsan_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9태화강 십리대숲을 스치는 바람이 과거의 오명을 씻어내려 애쓰지만, 도시의 새벽을 깨우는 것은 여전히 거대한 조선소의 망치 소리와 공단의 묵직한 기계음입니다. 전설 속 고래가 유영하던 푸른 바다는 쇠로 만든 거대한 레비아탄들이 점령했고, '지나가는 개도 만 원짜리를 물고 다닌다'던 산업 수도의 전설은 기름 젖은 작업복을 입은 노동자들의 피로 위에 위태롭게 세워져 있습니다.\n\n밤새 꺼지지 않는 석유화학 단지의 화려한 불야성 뒤편에는 격렬한 노사 분규의 함성과 특정 재벌 기업의 흥망에 도시 전체의 명운이 볼모로 잡힌 '기업 도시'의 구조적 불안이 짙은 그림자를 드리웁니다. 성장의 대가로 하늘과 바다를 내어주었던 이곳은, 둔탁해진 제조업의 엔진 소리와 함께 저물어가는 호황의 끝자락에서 녹슬어가는 크레인을 바라보며 깊은 고민에 잠겨 있습니다.§!\n\n§g고래의 무덤 위에 세워진 거대한 철의 성, 풍요의 횃불이 내일의 숨결을 태우는 모순의 제국.§![GetTFRKPHNGov_ulsan]"
 TFRKPHN_gov_sejong_g:0 "\n\n\n§Y세종특별자치시장:§!\n\n\n\n\n\n\n\n\n\n£GFX_TFRKPHN_gvp_choi_min_ho\n\n\n\n\n\n\n\n§W         최민호§!\n\n\n§Y집권 정당: £GFX_KOR_PPP_texticon §A국민의힘§!"
