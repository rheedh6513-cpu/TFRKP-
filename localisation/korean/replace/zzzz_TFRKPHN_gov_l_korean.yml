 TFRKPHN_gov_sejong_i:0 "\n\n\n§Y세종특별자치시장:§!\n\n\n\n\n\n\n\n\n\n£GFX_TFRKPHN_gvp_choi_min_ho\n\n\n\n\n\n\n\n§W         최민호§!\n\n\n§Y집권 정당: £GFX_KOR_PPP_texticon §A국민의힘§!"
 KOR_sejong_special_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_sejong_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9금강의 물안개가 걷히면 드러나는 것은, 자와 컴퍼스로 정교하게 재단된 거대한 계획도시의 차가운 완벽함입니다. 복숭아꽃 흐드러지던 연기군의 부드러운 흙길은 아스팔트와 콘크리트 밑으로 영원히 수장되었고, 균형 발전이라는 거창한 명분 아래 세워진 청사들의 위용은 오히려 이 땅의 오래된 기억을 난폭하게 지워버렸습니다.\n\n밤이 되면 정부종합청사의 불빛만 외로운 섬처럼 부유할 뿐, 서울로 향하는 버스에 몸을 싣는 이방인들의 행렬 뒤로 남겨진 거리는 인공적으로 이식된 심장이 제대로 뛰지 못하는 부정맥처럼 공허하게 고동칩니다. 똑같은 모양의 아파트 숲속에서 다양성은 질식하고, 서울을 흉내 냈으나 서울이 되지 못한 채 영혼 없는 행정의 회색빛 논리만이 도시를 지배하는 미완의 수도입니다.§!\n\n§7지도 위에 자를 대고 그은 선명한 직선 속에, 사람의 냄새와 오래된 기억마저 도려낸 창백한 인공 낙원.§![GetTFRKPHNGov_sejong]"
