 TFRKPHN_jeju_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_jeju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9검은 현무암 틈새마다 거친 파도가 부서지고 한라산의 넉넉한 품 아래 노란 유채꽃이 흐드러지면, 이 섬은 태초의 신비를 간직한 지상낙원처럼 눈부시게 빛납니다. 하지만 뚝뚝 떨어진 붉은 동백꽃 송이마다 서려 있는 4.3의 비극적인 통곡은 여전히 오름 깊은 곳에 묻혀 있어, 겉으로 보이는 평화로운 풍광은 때로 시리도록 슬픈 역설이 되어 가슴을 찌릅니다.\n\n육지 사람들의 낭만과 '힐링'을 위해 무분별하게 파헤쳐진 곶자왈과 해안가는 난개발의 신음소리를 내고, 넘쳐나는 쓰레기와 오폐수는 청정했던 바다의 푸른 숨통을 서서히 조여오고 있습니다. 자본이 점령한 해안 도로는 화려한 '핫플레이스'로 채워졌지만 정작 삶의 터전을 잃은 원주민들은 소외되고, 이국의 환상이라는 포장지 아래 섬은 고유의 언어와 영혼을 잃어가며 앓고 있습니다.§!\n\n§O비극의 핏빛 역사와 탐욕스러운 개발의 상처를 아름다운 풍광으로 애써 덮어둔, 위태로운 낙원의 이중주.§![GetTFRKPHNGov_jeju]"
 TFRKPHN_jeonnam_gwangju_city:0 "전남광주통합특별시"
 TFRKPHN_jeonnam_gwangju_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_gwangju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9무등산의 완만한 능선이 어머니의 품처럼 도시를 감싸 안으면, '빛고을'이라는 이름처럼 찬란했던 오월의 붉은 기억이 아스팔트 위로 뜨겁게 피어오릅니다. 피와 눈물로 민주주의를 쟁취해낸 숭고한 역사는 도시의 영혼이 되었지만, 역설적으로 '민주 성지'라는 거룩한 명패는 도시를 과거의 시간에 가두는 무거운 족쇄가 되기도 했습니다.\n\n오랜 차별과 정치적 고립 속에 산업화의 열매를 온전히 누리지 못한 도시는 화려한 예향의 자부심 뒤로 청년들이 떠나는 쇠락의 그림자를 감추고 있으며, 정의를 외치던 뜨거운 함성은 이제 먹고사는 현실의 냉정함 앞에서 갈 길을 잃고 부딪힙니다. 시대의 어둠을 가장 먼저 불살랐으나 정작 자신은 발전의 변방에 머물러야 했던 이곳은, 자랑스러운 투쟁의 역사와 멈춰버린 현실 사이에서 여전히 아린 가슴을 쓸어내리는 땅입니다.§!\n\n§t사랑도 명예도 이름도 남김없이\n한평생 나가자던 뜨거운 맹세\n동지는 간데없고 깃발만 나부껴\n새날이 올 때까지 흔들리지 말자§![GetTFRKPHNGov_jg]"
 TFRKPHN_gov_jg_wait:0 "\n\n\n§Y전남광주통합특별시장:§!\n§W첫 시장은 2030년 6월 지방선거에서 뽑습니다.§!"
