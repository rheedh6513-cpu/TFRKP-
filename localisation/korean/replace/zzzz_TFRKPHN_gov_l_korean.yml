 KOR_daegu_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_daegu_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9팔공산이 병풍처럼 둘러친 거대한 분지는 한여름의 끓어오르는 폭염보다 더 뜨거웠던 근대화의 영광을 품고도, 이제는 식어버린 열기를 밖으로 토해내지 못해 안으로만 삭히고 있습니다. 한때 전국의 옷감을 짜내던 방직기계의 힘찬 굉음과 붉게 익어가던 사과의 낭만은 시대의 저편으로 사라졌고, 수십 년째 제자리걸음인 경제 지표의 그늘만이 도시를 무겁게 짓누르고 있습니다.\n\n'보수의 심장'이라는 견고한 성벽은 외부의 풍파를 막아주는 방패인 동시에 스스로를 고립시키는 높은 담장이 되어, 변화의 바람조차 넘지 못한 그 벽 너머로 청년들이 떠난 자리는 빠르게 늙어가고 있습니다. 닫힌 지형만큼이나 완고한 고집과 배타성 속에 갇혀, 찬란했던 과거의 자존심 하나로 쇠락해가는 오늘을 힘겹게 버텨내는 애증의 땅입니다.§!\n\n§7능금꽃 향기로운 내 고향땅은\n팔공산 바라보는 해뜨는 거리\n그대와 나 여기서 꿈을 꾸었네\n아름답고 정다운 꿈을 꾸었네\n둘이서 걸어가는 희망의 거리\n능금꽃 피고 지는 사랑의 거리\n대구는 내 고향 정다운 내 고향§![GetTFRKPHNGov_daegu]"
 TFRKPHN_gov_incheon_g:0 "\n\n\n§Y인천광역시장:§!\n\n\n\n\n\n\n\n\n\n£GFX_TFRKPHN_gvp_yoo_jeong_bok\n\n\n\n\n\n\n\n§W         유정복§!\n\n\n§Y집권 정당: £GFX_KOR_PPP_texticon §A국민의힘§!"
 TFRKPHN_gov_incheon_o:0 "\n\n\n§Y인천광역시장:§!\n\n\n\n\n\n\n\n\n\n£GFX_TFRKPHN_gvp_KOR_park_chan_dae\n\n\n\n\n\n\n\n§W         박찬대§!\n\n\n§Y집권 정당: £GFX_KOR_DemocraticParty_texticon §P더불어민주당§!"
 TFRKPHN_gov_incheon_i:0 "\n\n\n§Y인천광역시장:§!\n\n\n\n\n\n\n\n\n\n£GFX_TFRKPHN_gvp_yoo_jeong_bok\n\n\n\n\n\n\n\n§W         유정복§!\n\n\n§Y집권 정당: £GFX_KOR_PPP_texticon §A국민의힘§!"
 KOR_incheon_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_incheon_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9해무가 자욱하게 내려앉은 갯벌 위로 붉은 낙조가 스며들면, 이 도시는 비로소 격동의 시간을 내려놓고 거친 숨을 고릅니다. 낯선 이방인들에게 빗장을 풀며 근대의 파도를 가장 먼저 맞이했던 개항의 낭만 이면에는, 침탈의 아픔과 치열했던 산업화의 땀방울이 붉은 벽돌마다 깊이 박혀 있습니다.\n\n바다를 메워 올린 유리 마천루가 화려한 미래를 뽐낼 때 그 그늘에 가려진 원도심의 낡은 골목은 더욱 깊은 소외감에 잠기고, 끊임없이 오가는 거대한 트럭과 비행기의 굉음 속에서 도시는 언제나 누군가를 떠나보내는 정거장의 쓸쓸함을 감내합니다. 화려한 비상과 쇠락해가는 뒷모습이 위태롭게 엉켜있는 이곳은, 개발의 욕망과 남겨진 것들의 한숨이 파도 소리에 섞여 흐르는 땅입니다.§!\n\n§3떠나는 이들의 설렘과 남겨진 이들의 애환이 공존하는, 영원한 경계의 도시.§![GetTFRKPHNGov_incheon]"
 TFRKPHN_gov_gwangju_g:0 "\n\n\n§Y전남광주통합특별시장:§!\n\n\n\n\n\n\n\n\n\n£GFX_TFRKPHN_gvp_lee_jung_hyun\n\n\n\n\n\n\n\n§W         이정현§!\n\n\n§Y집권 정당: £GFX_KOR_PPP_texticon §A국민의힘§!"
