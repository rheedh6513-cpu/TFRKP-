 TFRKPHN_gov_gwangju_p0:0 "\n\n\n\n\n\n                    §Y광주광역시장§!\n\n\n                    §Y집권 정당§!\n£GFX_TFRKPHN_gvp_lee_yong_sup\n                    £GFX_KOR_DemocraticParty_texticon §P더불어민주당§!\n\n\n\n\n§W      이용섭§!"
 TFRKPHN_gwangju_city:0 "광주광역시"
 TFRKPHN_gwangju_city_desc:0 "\n\n\n\n\n\n\n\n\n£GFX_KOR_gwangju_state_modifier_banner\n\n\n\n\n\n\n\n\n\n§9무등산의 완만한 능선이 어머니의 품처럼 도시를 감싸 안으면, '빛고을'이라는 이름처럼 찬란했던 오월의 붉은 기억이 아스팔트 위로 뜨겁게 피어오릅니다. 피와 눈물로 민주주의를 쟁취해낸 숭고한 역사는 도시의 영혼이 되었지만, 역설적으로 '민주 성지'라는 거룩한 명패는 도시를 과거의 시간에 가두는 무거운 족쇄가 되기도 했습니다.\n\n오랜 차별과 정치적 고립 속에 산업화의 열매를 온전히 누리지 못한 도시는 화려한 예향의 자부심 뒤로 청년들이 떠나는 쇠락의 그림자를 감추고 있으며, 정의를 외치던 뜨거운 함성은 이제 먹고사는 현실의 냉정함 앞에서 갈 길을 잃고 부딪힙니다. 시대의 어둠을 가장 먼저 불살랐으나 정작 자신은 발전의 변방에 머물러야 했던 이곳은, 자랑스러운 투쟁의 역사와 멈춰버린 현실 사이에서 여전히 아린 가슴을 쓸어내리는 땅입니다.§!\n\n§t사랑도 명예도 이름도 남김없이\n한평생 나가자던 뜨거운 맹세\n동지는 간데없고 깃발만 나부껴\n새날이 올 때까지 흔들리지 말자§![GetTFRKPHNGov_gwangju]"
