 tfrkphn.6741.t:0 "강원특별자치도 출범"
 tfrkphn.6741.a:0 "새 이름으로 출발합니다."
 tfrkphn.6741.a_tt:0 "§Y강원도§! 칸이 §Y강원특별자치도§! 칸으로 바뀝니다. 효과는 같습니다."
 tfrkphn.6742.t:0 "전북특별자치도 출범"
 tfrkphn.6742.a:0 "새 이름으로 출발합니다."
 tfrkphn.6742.a_tt:0 "§Y전라북도§! 칸이 §Y전북특별자치도§! 칸으로 바뀝니다. 효과는 같습니다."
 tfrkphn.6743.a_tt:0 "§Y경상남도§! 칸에 §Y하병필 경상남도지사 권한대행§!이 나옵니다."
 tfrkphn.6744.a_tt:0 "§Y제주특별자치도§! 칸에 §Y구만섭 제주특별자치도지사 권한대행§!이 나옵니다."
 tfrkphn.6745.a_tt:0 "§Y경기도§! 칸에 §Y오병권 경기도지사 권한대행§!이 나옵니다."
 tfrkphn.6743.t:0 "김경수 경남지사 징역 2년 확정, 지사직 상실"
 tfrkphn.6743.a:0 "도정은 멈출 수 없다."
 tfrkphn.6743.d:0 "대법원은 21일 이른바 드루킹 댓글 조작에 공모한 혐의로 기소된 김경수 경남도지사에게 징역 2년을 선고한 원심을 확정했습니다. 선거를 도운 대가로 일본 센다이 총영사 자리를 제안했다는 공직선거법 위반 혐의는 무죄가 유지됐습니다.\n\n김 지사는 이날로 지사직을 잃었습니다. 그는 경남도청에서 '안타깝지만, 법정을 통한 진실 찾기는 더는 진행할 방법이 없어졌다'며 '대법원이 내린 판결에 따라 제가 감내해야 할 몫은 온전히 감당하겠다'고 밝혔습니다. 이어 '특히 지난 3년간 도정을 적극 도와준 도민께 진심으로 송구하고 감사하다'고 말했습니다.\n\n도정은 하병필 행정부지사가 권한대행으로 이끌게 됩니다. 보궐선거를 치를지는 경남도 선거관리위원회가 다음 주에 정할 예정입니다."
 tfrkphn.6744.t:0 "원희룡 제주지사 사퇴, 국민의힘 대선 경선으로"
 tfrkphn.6744.a:0 "선출직 지사 없이 열한 달을 보내야 한다."
 tfrkphn.6744.d:0 "원희룡 제주특별자치도지사가 지사직을 내려놓았습니다. 원 지사는 지난 1일 제주도청에서 기자회견을 열고 '정권교체를 위해 대통령 선거에 출마하기로 했다'며 사퇴 의사를 밝혔습니다.\n\n그는 '임기를 다하지 못하고 퇴임하는 것에 대해 제주도민에게 죄송하다'면서도 '도지사가 대선을 위해 행정자원을 쓰는 것은 공직윤리로 문제가 있다고 생각한다'고 사퇴 이유를 설명했습니다. 원 지사는 다음 날 도의회에 사임 통지문을 보냈고, 그 뒤 열흘 동안 코로나19 방역 같은 현안을 구만섭 행정부지사에게 넘겼습니다.\n\n사퇴는 12일 0시부터 효력을 얻었습니다. 구 부지사는 내년 6월 30일까지 약 11개월 동안 제주지사 권한대행을 맡습니다."
 tfrkphn.6745.t:0 "이재명 경기지사 사퇴, 대선 본선으로"
 tfrkphn.6745.a:0 "경기도 살림은 부지사에게 넘어갔다."
 tfrkphn.6745.d:0 "더불어민주당 대통령 후보로 확정된 이재명 경기도지사가 25일 지사직에서 물러났습니다. 후보로 확정된 지 보름 만입니다.\n\n이 지사는 이날 오전 수원 경기도청에서 기자회견을 열고 '경기도지사직에서 물러나 20대 대통령 선거 더불어민주당 후보로 나서고자 합니다'라고 밝혔습니다. 그는 '경기도의 주인이시며 주권자이신 1,380만 도민께 드린 약속과 공직자로서의 책임을 다 하기 위해 오늘까지 최선을 다했습니다'라며 '도민 여러분의 큰 사랑에 다시 한 번 감사드립니다'라고 말했습니다.\n\n도정은 오병권 행정1부지사가 권한대행으로 맡습니다. 경기도가 부지사 권한대행 체제로 운영되는 것은 24년 만입니다."
 tfrkphn.6741.d:0 "2023년 6월 11일 0시, 강원도가 강원특별자치도로 새로 출발했습니다. 628년 동안 써 온 이름이 바뀌었고, 제주와 세종에 이어 세 번째 특별자치 시도가 됐습니다. 특별법은 지난해 5월 국회를 통과했고, 출범을 앞둔 올해 5월에는 국회가 법을 고쳐 환경, 국방, 산림, 농지 네 분야의 규제 권한 일부를 도에 넘겼습니다. 이제 도는 군사시설 보호구역을 조정해 달라고 건의할 수 있고, 산림과 농지를 개발에 쓸 길도 넓어졌습니다. 반도체와 수소 산업을 키울 첨단과학단지도 만들 수 있게 됐습니다. 도청에서는 새 이름을 단 공문이 나가기 시작했고, 영문 이름도 Gangwon State로 바뀌었습니다."
 tfrkphn.6742.d:0 "2024년 1월 18일, 전라북도가 전북특별자치도로 새로 출발했습니다. 1896년 전라도가 남북으로 나뉘며 생긴 이름을 128년 만에 내려놓은 것입니다. 출범식은 전주 한국소리문화의전당에서 열립니다. 전날 도청에서 열린 전야제에서 김관영 지사는 '128년간 사용했던 전라북도를 떠나보내고 이제 전북특별자치도를 맞이하게 됐다'고 말했습니다. 국회는 지난해 12월 8일 131개 조문에 333개 특례를 담은 전부개정안을 통과시켰고, 이 특례들은 올해 12월 27일부터 시행됩니다. 그 가운데에는 외국인의 비자 발급 절차와 체류 기간을 달리 정할 수 있는 이민 특례도 있습니다."
