l_korean:
 # [안내] optfix_build.py가 만든다. 본문 끝말을 되풀이하던 선택지.
 tfrkphn.570.a:0 "브리핑은 여기까지다."
 tfrkphn.51.a:0 "고개를 숙인다."
 tfrkphn.82.a:0 "현장의 목소리를 적어 둔다."
 tfrkphn.55.a:0 "국밥이 식어 간다."
 tfrkphn.557.a:0 "다음 장부를 펼친다"
 tfrkphn.207.story_a:0 "모두가 자리에서 일어났다."
 tfrkphn.6720.a:0 "약속을 벽에 붙인다."
 tfrkphn.6706.a:0 "층수 규제를 푼다."
 tfrkphn.582.a:0 "규칙을 문서로 남긴다"
 tfrkphn.555.a:0 "창구를 하나로 줄인다"
 tfrkphn.6702.a:0 "투표 날짜를 공고하다."
 tfrkphn.579.a:0 "조건을 받아들인다"
 tfrkphn.523.a:0 "새 장을 연다"
 tfrkphn.30.a:0 "\"우리는 아무것도 보내지 않았습니다.\""
 tfrkphn.6721.a:0 "서류철을 닫는다."
 tfrkphn.6785.a:0 "마지막 날의 불을 끈다."
 tfrkphn.548.a:0 "지금은 손대지 않는다"
 tfrkphn.496.b:0 "논평 없이 넘긴다"
 tfrkphn.568.a:0 "곧바로 착수한다"
 tfrkphn.538.a:0 "독일식 합의를 시험한다"
 tfrkphn.491.a:0 "경계를 이어 간다"
 tfrkphn.32.a:0 "보이지 않는 곳에서 싸운다."
 tfrkphn.470.a:0 "입찰 서류를 받는다"
 tfrkphn.80.a:0 "두 사람의 말을 모두 적어 둔다."
 tfrkphn.56.a:0 "노동 개혁에 착수한다."
 tfrkphn.546.a:0 "군을 그대로 유지한다"
 tfrkphn.6731.a:0 "첫 보고를 받는다."
 tfrkphn.6723.a:0 "첫 지시를 내린다."
 tfrkphn.558.a:0 "손을 맞잡는다"
 tfrkphn.544.a:0 "대통령이 마이크 앞에 선다"
 tfrkphn.507.b:0 "고지서 금액을 반으로 줄인다"
 tfrkphn.6971.b:0 "법을 따로 만들어 챙긴다."
 tfrkphn.6776.a:0 "한 번에 걷어 낸다."
 tfrkphn.6776.b:0 "차례로 하나씩 연다."
 tfrkphn.6778.a:0 "약자 쪽에 돈을 더 붙인다."
 tfrkphn.6601.a:0 "공천 물갈이에 나선다."
 tfrkphn.6777.a:0 "돈줄을 죈다."
 tfrkphn.6774.b:0 "서울 몫을 깎는다."
 tfrkphn.6780.b:0 "서울에 먼저 힘을 싣는다."
 tfrkphn.6772.a:0 "시청으로 직접 찾아간다."
 tfrkphn.6772.b:0 "대꾸하지 않는다."
 tfrkphn.6993.a:0 "헤이그로 보낸다."
 tfrkphn.6993.b:0 "서울에서 재판한다."
 tfrkphn.6770.a:0 "국고를 연다."
