 KOR_democratic_party_desc:0 "[TFRKP_HN_x_KOR_democratic_party_desc]"
 TFRKP_HN_x_KOR_democratic_party_desc_orig:0 "민주당의 대내외적 잘못으로 인해 국민들이 실망한 것은 분명합니다. 하지만 그렇기에, 우리는 전 정부의 잘못을 타산지석 삼아 국민들에게 더 가까이 다가가야 합니다. 진정으로 민주주의를 위해, 자유를 위해 함께 나아갑시다. 그리고 그런 당신의 꿈을 위해, 이재명의 왼쪽 손을 잡아야 합니다."
 TFRKP_HN_x_KOR_democratic_party_desc_tmp:0 "민주당의 대선 후보 이낙연의 곁에서 정권 재창출을 위해 뛰어야 합니다.\n\n(임시 문구입니다. 나중에 새로 쓸 예정입니다.)"
 KOR_election_economy_dp_desc:0 "[TFRKP_HN_x_KOR_election_economy_dp_desc]"
 TFRKP_HN_x_KOR_election_economy_dp_desc_orig:0 "세계적 초공황을 극복할 청사진을 선보여야 하는 중대한 상황에도 윤석열 대통령 후보는 대선 토론회 내내 이재명 대표의 도덕성 이슈에만 집중하는 모습만 보이고 있습니다. 최소한의 미래 비전조차 보여줄 수 없는 후보에겐 단 한 표도 줄 수 없고, 주어서도 안 됩니다!"
 TFRKP_HN_x_KOR_election_economy_dp_desc_tmp:0 "위기의 시대에는 경제를 살릴 청사진이 필요합니다. [TFRKP_HN_dpk_name] 후보가 그 답을 내놓아야 합니다.\n\n(임시 문구입니다. 나중에 새로 쓸 예정입니다.)"
 KOR_election_our_ppp_desc:0 "[TFRKP_HN_x_KOR_election_our_ppp_desc]"
 TFRKP_HN_x_KOR_election_our_ppp_desc_orig:0 "윤석열 후보는 조국 사태 이후 급부상한 대권 후보로, 문재인 정권의 대항마기는 하지만 정계에 익숙지 않습니다. 강남, 영남, 그리고 전통적인 보수 지지층들이 이탈하지 않도록 만들어야 선거에서 이길 수 있습니다."
 TFRKP_HN_x_KOR_election_our_ppp_desc_tmp:0 "홍준표 후보를 중심으로 전통적인 보수 지지층을 결집시켜야 선거에서 이길 수 있습니다.\n\n(임시 문구입니다. 나중에 새로 쓸 예정입니다.)"
 KOR_election_attack_ppp_desc:0 "[TFRKP_HN_x_KOR_election_attack_ppp_desc]"
 TFRKP_HN_x_KOR_election_attack_ppp_desc_orig:0 "대한민국의 국가원수인 대통령은 어떤 공직자보다 모범이 되어야 함에도 불구하고 이재명 대통령 후보는 여러 전과가 있는 데다, 패륜적 발언을 입에 담았던 적이 있습니다. 어떻게 최소한의 인간 도리도 하지 못하는 이에게 표를 줄 수 있겠습니까? 저런 사람에게는 단 한 표조차 아깝습니다!"
 TFRKP_HN_x_KOR_election_attack_ppp_desc_tmp:0 "상대 진영 후보에 대한 검증 공세를 펼칩니다.\n\n(임시 문구입니다. 나중에 새로 쓸 예정입니다.)"
