 # 4년 중임제 개헌: 헌법 제128조 제2항에 따라 다음 정권부터 적용 (원래 문구는 TFRKP_HN_l_korean.yml)
 TFRKPHN_const_term_new:0 "§G헌법 70조§! : 대통령 임기 4년, 1차에 한해 중임 (다음 정권부터)"
 TFRKPHN_const_term_weak:0 "§O헌법 70조§! : 임기 4년 중임 (타협안, 다음 정권부터)"
 TFRKPHN_const_term_tt:0 "헌법 조문이 바뀝니다: §Y헌법 70조§! -> 대통령 임기 4년, 1차에 한해 중임\n§Y다음 정권부터 적용됩니다.§! 근거: §Y헌법 제128조 제2항§! \"대통령의 임기연장 또는 중임변경을 위한 헌법개정은 그 헌법개정 제안 당시의 대통령에 대하여는 효력이 없다.\"\n(타협 §R4회§! 이상이면 §O타협안§!)"
 TFRKPHN_amend_d_term_desc:0 "5년 단임제는 장기 집권을 막으려고 만든 장치였지만, 임기 후반마다 레임덕을 불렀습니다. 대통령 임기를 4년으로 줄이고 한 번 더 국민의 평가를 받게 하면, 정책은 이어지고 책임은 분명해집니다.\n\n다만 §Y헌법 제128조 제2항§!에 따라 이 개헌은 제안 당시의 대통령에게는 효력이 없습니다. 4년 중임제는 §Y다음 정권부터§! 적용됩니다."
 tfrkphn.76.desc:0 "국회 헌법개정특별위원회, 회의실 화면에 비교표가 떠 있다.\n\n현행 헌법 제70조는 대통령의 임기를 5년으로 하고 중임할 수 없다고 정한다. 정부안은 임기를 4년으로 줄이되 한 차례 다시 출마할 수 있게 하는 것이었다. 일을 잘한 대통령에게는 한 번 더 기회를, 못한 대통령은 4년 만에 투표로 끝낸다는 논리였다.\n\n\"임기 후반만 되면 아무도 대통령 말을 안 듣잖아요. 5년 단임은 그게 문제예요.\"\n\"재선이 가능해지면 현직이 선거에 국정을 쓴다는 얘기가 나오겠죠. 그리고 이 개헌, 누구한테 이득입니까?\"\n\n질문이 나오자 회의실이 잠시 조용해졌다. 국회 입법조사처의 연구관이 헌법 조문집을 펼쳤다.\n\n\"헌법 제128조 제2항입니다. '대통령의 임기연장 또는 중임변경을 위한 헌법개정은 그 헌법개정 제안 당시의 대통령에 대하여는 효력이 없다.' 이번 개헌이 통과되더라도 지금 대통령께는 적용되지 않습니다. 4년 중임제는 다음 정권부터입니다.\"\n\n헌법 개정은 국회 재적의원 3분의 2의 찬성을 얻은 뒤 국민투표를 통과해야 한다. 어느 쪽이든 결국 국민 앞에 설 수밖에 없는 일이었다.\n\n정부안은 국회로 넘어갔다."
 # TFR 원본 북한 3분할 내전 이벤트 (원본은 한국어 번역이 없음)
 nk.3.t:0 "최룡해, 권력 장악"
 nk.3.d:0 "당이 비상 대회를 열기도 전에 최룡해가 사실상 권력을 손에 넣었다. 그는 누구의 권력 찬탈도 막으려면 비상 권한이 필요하다고 말했다. 그리고 진정한 후계자가 나올 때까지 조선 인민을 충실히 이끌겠다고 주장한다."
 nk.3.a:0 "그 말을 누가 믿겠는가..."
 nk.11.t:0 "김여정, 정통 정부 선포"
 nk.11.d:0 "김여정이 자신이 이끄는 정부야말로 조선의 정통 정부라고 선포했다. 군부는 평양에 등을 돌렸고, 북한은 셋으로 갈라졌다."
 nk.11.a:0 "경애하는 지도자께서 바라셨을 일이다."
 nk.13.t:0 "김여정과 최룡해, 끝내 물러서지 않다"
 nk.13.d:0 "마지막 협상마저 결렬되었다. 평양과 군부, 그리고 갈라져 나온 세력이 서로에게 총구를 겨눈다. 북한 내전이 시작되었다."
 nk.13.a:0 "무력 충돌만이 유일한 해법이다."
 KOR_copreation_of_chaebols_desc:0 "\n\n\n\n£GFX_banner_TFRKPHN_chb_coop\n\n\n\n\n\n재벌은 이제 우리의 통제 아래에 있습니다. 그들은 더 이상 자기들 멋대로 독주하지 않을 것이며, 교활한 술책을 일삼으며 주주권을 행사하지도 않을 것입니다. 이제 우리 사회의 일원으로서 공정한 경쟁을 통해 건전한 성장을 이뤄나갈 것입니다. 대한민국도, 그들 자신도."
