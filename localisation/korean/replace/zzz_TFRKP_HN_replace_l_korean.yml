 TFRKP_HN_x_korea_124_t_tmp:0 "(임시) 안보 토론"
 korea.124.desc:0 "[TFRKP_HN_x_korea_124_desc]"
 TFRKP_HN_x_korea_124_desc_orig:0 "\"윤석열 후보님, 최근에 선제타격론을 몇 차례 말씀하셨어요... 그러니까 우리를 공격하면 북한도 파멸할 수밖에 없다는 것을 인식하게 하는 게 억지력이거든요?\"\n\n\"그렇습니다.\"\n\n\"그 킬 체인보다 3축 중에 우리의 보복 능력에 중점을 둬야 된다는 게 저의 생각이고.\"\n\n\"아니, 핵 맞고 나서 보복하면 뭐 합니까?\"\n\n\"그, 보복 능력은 우리한테 완벽하게 갖춰져 있습니다. 그런데 제가 드리고 싶은 말씀이 뭐냐? 선제타격은 전쟁으로 가는 거거든요... 그런데 선제타격 운운하는 것 자체가 저는 전쟁하겠다는 선전포고 같은 거에요.\"\n\n\"아니, 그거는 우리 심 후보님이 잘 모르고 하시는 소리 같습니다.\""
 TFRKP_HN_x_korea_124_desc_tmp:0 "홍준표 후보가 TV 토론에서 안보 정책을 두고 공방을 벌였다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
