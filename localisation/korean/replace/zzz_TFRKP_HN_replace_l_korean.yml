 korea.123.desc:0 "[TFRKP_HN_x_korea_123_desc]"
 TFRKP_HN_x_korea_123_desc_orig:0 "\"위기의 대한민국을 다시 살리고 무너진 정의와 공정을 되찾아주실 대통령 후보, 윤석열을 연호해 주십시오!\"\n\n\"윤석열! 윤석열!\"\n\n\"안녕하십니까, 오늘 정말 오랜만에 이... 순천을 와 보니...\"\n\n\"...자유민주주의 정신에 따라서 하는 민주화 운동이 아니고 어디 외국에서 수입해온 그런 이념에 사로잡혀서...\"\n\n\"저도 이 정권을 교체해야 되겠고, 민주당에는 들어갈 수가 없기 때문에 제가 부득이 이 국민의힘을 선택했습니다만...\""
 TFRKP_HN_x_korea_123_desc_tmp:0 "홍준표 후보가 전국을 돌며 유세를 이어 가고 있다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
