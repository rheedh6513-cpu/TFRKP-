 korea.122.desc:0 "[TFRKP_HN_x_korea_122_desc]"
 TFRKP_HN_x_korea_122_desc_orig:0 "\"후보님, 반갑습니다. 오늘도 참 좋은 하루 아닙니까?\"\n\n평소에 그를 탐탁지 않아 하던 윤 후보였지만, 경선에서 승리한 지 이틀밖에 지나지 않아 기분이 한껏 올라 있던 날이었다.\n\n\"하하, 우리 이 대표 덕이 크지요. 이 대표가 젊은 친구들의 마음을 잘 돌려주었습니다.\"\n\"후보님, 말씀 마침 잘 하셨습니다, 혹시 젊은 세대에 대한 복잡한 지원 제도를 일원화하는 것에 대해 생각해 보셨습니까? 사회가 운영되는 체계에서 너무 많은 법과 제도가 존재하면 혼란만 가중되고...\"\n\"거..\"\n\"중국 한나라의 고조 유방이 진나라를 무너뜨리고 나서 가장 먼저 했던 일 중 하나는 법가에 따라 그물코처럼 오밀조밀 짜이고 지나치게 가혹했던 진나라의 법령을...\"\n\n그 뒤로 한동안 윤 후보는 조용히 이 대표의 말을 듣고만 있었다.\n\n\"\"...While you sleep, you will work until you die.\" 세계적인 투자자, 워렌 버핏의 말입니다. 자는 동안에도 돈을 버는 것이 아니라면 죽을 때까지 일을 그만두지 못할 것이라는 문장인데, 자산 형성을 위한 투자의 중요성을 이야기하고 있는...\"\n\"이 대표님, 잘 알겠습니다. 거... 근데 도시락이 참 맛있지 않습니까?\"\n\n둘은 잠시 서로의 얼굴을 바라보고는 말없이 도시락을 먹기 시작했다.\n\n\"후보님. 저는 광주에 일정이 있어 먼저 가 보도록 하겠습니다. 만나 주셔서 감사합니다.\""
 TFRKP_HN_x_korea_122_desc_tmp:0 "홍준표 후보가 당 대표와 만나 선거 전략을 논의했다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
 korea.122.a:0 "[TFRKP_HN_x_korea_122_a]"
 TFRKP_HN_x_korea_122_a_orig:0 "그는 그저 허망하게 도시락만 바라보았다."
 TFRKP_HN_x_korea_122_a_tmp:0 "확인"
