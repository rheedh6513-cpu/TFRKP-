 korea.116.t:0 "[TFRKP_HN_x_korea_116_t]"
 TFRKP_HN_x_korea_116_t_orig:0 "이재명 후보의 선거운동"
 TFRKP_HN_x_korea_116_t_tmp:0 "(임시) 상대 후보의 선거운동"
 korea.116.desc:0 "[TFRKP_HN_x_korea_116_desc]"
 TFRKP_HN_x_korea_116_desc_orig:0 "이재명 후보는 선거유세에서 민생과 경제 회복을 약속했으며, 윤석열 후보와 달리 자신은 행정업무와 정계에서의 경험이 있으며, 위기에 강한 대통령 후보라며 자신을 어필했습니다. 그의 메시지는 많은 시민들의 공감을 얻었고, 현장의 분위기는 뜨거웠습니다. 이재명 지지자들은 더욱 결집하여 여론이 빠르게 요동치고 있습니다."
 TFRKP_HN_x_korea_116_desc_tmp:0 "[TFRKP_HN_dpk_name] 후보 측이 전국 유세를 벌이며 [TFRKP_HN_ppp_name] 후보를 견제하고 있습니다. 여론이 요동치고 있습니다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
