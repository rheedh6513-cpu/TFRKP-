 korea.282.t:0 "[TFRKP_HN_x_korea_282_t]"
 TFRKP_HN_x_korea_282_t_orig:0 "민주주의가 후퇴하는 걸 보려면"
 TFRKP_HN_x_korea_282_t_tmp:0 "(임시) 유세 현장"
 korea.282.d:0 "[TFRKP_HN_x_korea_282_d]"
 TFRKP_HN_x_korea_282_d_orig:0 "\"기호 1번 이재명!\" \"이재명 대통령!\"\n\"대한민국의 중심, 경기도의 중심, 이 곳 안양에 이재명 대통령 후보님이 도착하셨습니다. 큰 박수로 마주해 주시길 바랍니다 여러분!\" \n\"유능한!\" \"대통령!\" \"유능한!\" \"이재명!\"\n\"대통령!\" \"이재명!\"\n\n\"네, 여러분 반갑습니다. 이재명입니다. 여러분 준비되셨습니까?\"\n\"네!!\"\n\n\"...세상에 혜택을 줬다고 특혜를 줬다고 비난을 하다니, 그런 마인드로 경제를 살리겠습니까, 죽이겠습니까?\"\n\"죽습니다!\"\n\n\"경제를 살리고 싶으면 누구를 선택하겠습니까?\"\n\"이재명!\" \"이재명!\"\n\n\"경제가 망하는 걸 보려면, 민주주의가 후퇴하는 걸 보려면 누구를 선택합니까?\"\n\"이재명!\" \"이재명!\"\n\n\"...\""
 TFRKP_HN_x_korea_282_d_tmp:0 "이낙연 후보가 수도권 유세에서 지지자들에게 인사했다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
 korea.282.a:0 "[TFRKP_HN_x_korea_282_a]"
 TFRKP_HN_x_korea_282_a_orig:0 "\"이재명 아니고요...\""
 TFRKP_HN_x_korea_282_a_tmp:0 "확인"
 korea.283.t:0 "[TFRKP_HN_x_korea_283_t]"
 TFRKP_HN_x_korea_283_t_orig:0 "이동호 상습 도박 및 성매매 의혹"
 TFRKP_HN_x_korea_283_t_tmp:0 "(임시) 검증 공세"
 korea.283.d:0 "[TFRKP_HN_x_korea_283_d]"
 TFRKP_HN_x_korea_283_d_orig:0 "                                                     £GFX_Chosun_Ilbo \n\n                     야 여성위원회 \"이재명 아들 성매매 의혹 수사해야\"\n\n국민의힘 중앙여성위원회가 17일 이재명 더불어민주당 대선 후보의 아들 성매매 의혹에 대해 \"즉시 수사에 착수해야 한다\"고 했다. \"이 후보 아들이 온라인 커뮤니티에 마사지업소를 방문한 뒤 후기들을 올린 것으로 확인됐다\"는 것이다.\n\n국민의힘 중앙여성위원회는 이날 '이재명 후보 아들의 성매매 의혹, 수사를 개시하라'는 제목의 입장문에서 \"이 후보 측은 이 후보의 아들이 해당 글을 쓴 것은 맞지만, 성매매를 한 적은 없다고 한다. 갔는데 안 한 것인지, 아예 안 간 것인지는 확인이 안 된다'고 했다\"면서 이렇게 주장했다.\n\n이들은 \"대통령 투표일까지 80여일밖에 남지 않은 중요한 시기에 대한민국의 미래를 위한 정책과 거대담론 대신 역대 대통령 후보에 없었던 전과 4범의 후보자와 온 국민을 분노케 한 대장동 개발비리 의혹 사건(이 있다)\"고 했다. 이어 \"그 (대장동 의혹의) 핵심 관계자의 의문스러운 죽음에 이어 이제 후보 아들의 불법도박 사실까지 접하고 있다\"고도 했다.\n\n그러면서 \"이 후보의 아들이 불법도박을 했을 뿐 아니라, 불법적 마사지업소에 출입하고 심지어 성매매 의혹까지 대두되는 것은 가히 충격적\"이라며 \"대통령을 선출하는 선거인 만큼 후보자에 대한 검증은 더욱 엄격해야 할 것\"이라며..."
 TFRKP_HN_x_korea_283_d_tmp:0 "선거 막바지, 상대 진영의 검증 공세가 이어지고 있다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
 korea.283.a:0 "[TFRKP_HN_x_korea_283_a]"
 TFRKP_HN_x_korea_283_a_orig:0 "이게 정말인가?"
 TFRKP_HN_x_korea_283_a_tmp:0 "확인"
 korea.284.t:0 "[TFRKP_HN_x_korea_284_t]"
 TFRKP_HN_x_korea_284_t_orig:0 "이재명 후보의 일부 공약 유화"
 TFRKP_HN_x_korea_284_t_tmp:0 "(임시) 공약 발표"
 korea.284.d:0 "[TFRKP_HN_x_korea_284_d]"
 TFRKP_HN_x_korea_284_d_orig:0 "                                                        £GFX_hankyoreh \n\n                  \"지킬 약속만 한다\"던 이재명, 기본소득 공약까지 후퇴 시사\n\n이재명 더불어민주당 대선 후보가 2일 자신의 대표 공약인 기본소득에 대해 \"국민을 설득하고 토론하되 국민의 의사에 반해서 강행하지는 않겠다\"고 밝혔다. 전 국민 재난지원금 철회와 국토보유세 도입 유보 시사에 이어 핵심 정책의제로 내세운 기본소득까지 '후퇴 의사'를 내비친 것이다. '독선, 독주 이미지'에서 벗어나 중도층을 공략하겠다는 전략이지만, 표 계산에 따라 주요 공약까지 뒤집는 것은 무책임한 정치라는 비판도 나온다.\n\n이 후보는 이날 서울 여의도 당사에서 기자들과 만나 '기본소득 철회 의사가 있나'라는 물음에 \"철회한 것이 아니다. 이 정책에 대해 확신하고 미래 사회에 필요하다고 생각하지만 국민들이 오해하는 것도 있다\"며..."
 TFRKP_HN_x_korea_284_d_tmp:0 "이낙연 후보가 중도층을 겨냥한 공약을 발표했다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
 korea.284.a:0 "[TFRKP_HN_x_korea_284_a]"
 TFRKP_HN_x_korea_284_a_orig:0 "그도 결국 또 다른 문재인인가?"
 TFRKP_HN_x_korea_284_a_tmp:0 "확인"
 korea.285.t:0 "[TFRKP_HN_x_korea_285_t]"
 TFRKP_HN_x_korea_285_t_orig:0 "심상정 후보의 단일화 선언"
 TFRKP_HN_x_korea_285_t_tmp:0 "(임시) 군소 후보 단일화"
 korea.285.d:0 "[TFRKP_HN_x_korea_285_d]"
 TFRKP_HN_x_korea_285_d_orig:0 "정의당 심상정 후보가 대선 막바지에 접어들며 더불어민주당 이재명 후보의 지지를 선언, 대선 후보에서 사퇴하기로 밝혔습니다.\n\n심상정 후보는 오늘 정의당 당사에서 진행된 기자회견에서 \"이재명 후보가 되면 왜 안 된다고 생각하세요? (그러면) 윤석열 후보가 되는 건 괜찮아요?\" 라고 언급하며 \"정의당은 오늘 대통령 선거란 레이스를 멈추게 되었지만, 진보 정치의 실현을 향한 기나긴 마라톤은 멈추지 않겠다\"고 밝혔습니다.\n\n이재명 후보는 \"심 후보의 용기 있는 결단에 존경과 감사의 말씀을 드린다\"며 \"오늘 공동 선언의 의미를 깊이 새기며, 정치교체와 사회개혁을 위해, 위대한 국민과 함께 압도적 대선 승리를 반드시 이뤄내겠다\"고 다짐했습니다.\n\n진보당 김재연 후보와 노동당 이백윤 후보는 입장문을 통해 유감과 아쉬움을 표명하며, \"기득권 양당과 경쟁해야 할 진보 대통령 후보로서 책임을 다하겠다\"고 완주 의지를 밝혔습니다."
 TFRKP_HN_x_korea_285_d_tmp:0 "대선 막바지, 군소 후보의 단일화 소식이 전해졌다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
 korea.285.a:0 "[TFRKP_HN_x_korea_285_a]"
 TFRKP_HN_x_korea_285_a_orig:0 "그녀의 용단에 압도적 찬사를!"
 TFRKP_HN_x_korea_285_a_tmp:0 "확인"
 korea.286.t:0 "[TFRKP_HN_x_korea_286_t]"
 TFRKP_HN_x_korea_286_t_orig:0 "유능한 경제대통령"
 TFRKP_HN_x_korea_286_t_tmp:0 "(임시) 경제 유세"
 korea.286.d:0 "[TFRKP_HN_x_korea_286_d]"
 TFRKP_HN_x_korea_286_d_orig:0 "최근의 이슈들로 유세 현장의 열기가 그 어느 때보다 뜨거워지는 가운데, 이재명 대통령 후보의 연설이 있었습니다.\n\n이재명은 전국을 돌아 경기도지사 시절 그를 대권주자로 도약시킨 요인 중 하나인 계곡의 불법 설치물 철거와, 코로나 정국 당시 방역을 방해한 경기도 내 신천지 단체의 처리 등등의 성과를 홍보하며 대대적으로 유세 운동을 벌이는 한편, 윤석열 후보가 했던 '경제에 대한 이해력 부족'이 다소 의심되는 여러 실언들을 언급하여 국민들에게 자신이 지금 정세에서 '윤석열보다 더 나은' 사람이라는 인식을 심고 있습니다.\n\n이런 그에게도 불리한 요소가 없는 것은 아닙니다. 과거의 전과가 발목을 잡아 도덕성에 흠집이 가게 하고 있으며 또한 그동안 그가 보인 페미니즘에 우호적인 태도, 그리고 이번에 여성 유권자들의 표심을 모으려는 시도는, 양극화 시대 속에 외려 여가부 폐지를 주장하는 윤석열에게로 남성 유권자들의 표가 몰리게 하는 요인이 되기도 합니다."
 TFRKP_HN_x_korea_286_d_tmp:0 "[TFRKP_HN_dpk_name] 후보가 경제 회복을 내세워 [TFRKP_HN_ppp_name] 후보와 경쟁하고 있다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
 korea.286.a:0 "[TFRKP_HN_x_korea_286_a]"
 TFRKP_HN_x_korea_286_a_orig:0 "새로운 대한민국, 이재명은 합니다!"
 TFRKP_HN_x_korea_286_a_tmp:0 "확인"
 korea.287.t:0 "[TFRKP_HN_x_korea_287_t]"
 TFRKP_HN_x_korea_287_t_orig:0 "촛불 정신 수호"
 TFRKP_HN_x_korea_287_t_tmp:0 "(임시) 마지막 유세"
 korea.287.d:0 "[TFRKP_HN_x_korea_287_d]"
 TFRKP_HN_x_korea_287_d_orig:0 "인천광역시 서구, 청라 롯데마트점 앞에서 이재명의 선거 유세가 벌어지고 있었다. 오후 5시부터 시작된 유세는 어느 새 계양구로 향할 시간은 6시 30분을 다해가고 있었다. 이재명은 사람들에게 마지막 말을 건넸다.\n\n\"제가 지금껏 선거 유세를 하면서 그동안 생각했던 것들이 변화하고 있는 것이 느껴집니다. 저는 이전까지 정치를 사실에 대한 것. 그러니까, 사실을 얘기하고 그것을 바탕으로 논리를 전개해야 한다고 생각하고 있습니다. 하지만 그것은 절대로 아닙니다! 오히려 정치를 더욱 위험에 빠뜨릴 크나큰 오해였습니다! 정치란 '사실'이 아니라 '사실의 인식'으로부터 비롯되는 것이 바로 정치인 것을 깨달은 것입니다!\"\n\n이재명은 격해진 감정을 추스르기 위해 잠깐 숨을 골랐다. 그 사이 동안 군중에서 응원 풍선 두드리는 소리, 환호하는 소리, 작은 박수 소리가 나고 있었다. 이재명은 다시 말을 이어나갔다.\n\n\"사람들 사이에서 정치적 극단주의 여론에 대한 경계심이 꽤 높아진 것을 선거 활동마다 꾸준히 느끼고 있습니다. 그런 분들이 과연 저를 지지하는 분만 그럴까요? 아니요! 저를 지지하지 않는 분 역시 그런 생각을 가지고 계십니다! 제 말의 요지는, 세상을 바라보는 측면이 달라도 결국엔 모두가 민주주의를 적극 수호하고자 하는 생각을 공유하고 있다는 것입니다! 저는 그것에 큰 기쁨을 느끼고 있습니다! 여기 계신 분들이 자신과 다른 측면으로 세상을 바라보는 사람들을 포용할 수 있는 역량을 가지고 계신다는 뜻이니까요! 그리고 바로 이것이 2016년 박근혜를 탄핵할 수 있었던 촛불정신이었습니다!\"\n\n이재명의 말에 사람들이 환호했다. 이재명은 군중의 환호를 들으며 4초간 숨을 깊게 들이마셨고 다시 4초간 숨을 천천히 내쉬었다. 이재명은 손에 쥔 마이크를 세게 움켜쥐며 다시 군중에게 마지막 말을 전했다.\n\n\"현재 중위 투표자 정리를 무너뜨릴 정도로 양극화가 진행된 세상에서, 이 나라의 민주주의를 생각해 주신 분들께 감사 인사드립니다! 제가 얘기했던, 다른 측면으로 세상을 바라보는 것에 대해 지적받지 않길 원하시는 분이 계신다면, 저 이재명을 지지해 주시기 바랍니다! 들어주셔서 정말 고맙습니다, 여러분!\""
 TFRKP_HN_x_korea_287_d_tmp:0 "이낙연 후보가 마지막 유세에서 지지자들에게 인사했다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
 korea.287.a:0 "[TFRKP_HN_x_korea_287_a]"
 TFRKP_HN_x_korea_287_a_orig:0 "군중의 열성적인 환호 속에, 이재명은 군중에게 깍듯이 인사했다."
 TFRKP_HN_x_korea_287_a_tmp:0 "확인"
 korea.288.t:0 "[TFRKP_HN_x_korea_288_t]"
 TFRKP_HN_x_korea_288_t_orig:0 "존경하는 박근혜 전 대통령"
 TFRKP_HN_x_korea_288_t_tmp:0 "(임시) 토론 공방"
 korea.288.d:0 "[TFRKP_HN_x_korea_288_d]"
 TFRKP_HN_x_korea_288_d_orig:0 "\"5년 전 전북 익산 유세 때 지지자들이 이재명을 연호하는데 종교 단체 같았어요. 그런 것을 원하시나요?\"\n\n\"원한다기보단 정치인들은 지지를 먹고 살죠. 위축이 될 때에 누가 막 이렇게 해 주면 갑자기 자신감이 생기고 주름이 쫙 펴지는 거에요.\"\n\n\"그래서 우리 존경하는 박근혜 전 대통령께서도 대통령하다 힘드실 때 대구 서문시장을 갔다는 것 아닌가...\""
 TFRKP_HN_x_korea_288_d_tmp:0 "TV 토론에서 후보들이 날 선 공방을 벌였다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
 korea.288.a:0 "[TFRKP_HN_x_korea_288_a]"
 TFRKP_HN_x_korea_288_a_orig:0 "\"진짜 존경하는 줄 알더라.\""
 TFRKP_HN_x_korea_288_a_tmp:0 "확인"
 korea.289.t:0 "[TFRKP_HN_x_korea_289_t]"
 TFRKP_HN_x_korea_289_t_orig:0 "김포"
 TFRKP_HN_x_korea_289_t_tmp:0 "(임시) 부동산 토론"
 korea.289.d:0 "[TFRKP_HN_x_korea_289_d]"
 TFRKP_HN_x_korea_289_d_orig:0 "\"...분양가의 90% 정도를 대출해 준다는 것이고요. DSR은 규모 수십 평 짜리가 아니고 한 20평 정도면 2-3억, 3억 대 되겠죠.\"\n\n\"어느 지역에 2-3억 짜리가 있습니까? 20평 짜리가?\"\n\n\"김포나 이런 데는 충분히 가능합니다.\"\n\n\"김포에 20평 짜리가 있습니까? 20평 짜리가 3억입니까?\"\n\n\"자, 그러지 마시고요...\""
 TFRKP_HN_x_korea_289_d_tmp:0 "후보들이 부동산 정책을 두고 토론을 벌였다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
 korea.289.a:0 "[TFRKP_HN_x_korea_289_a]"
 TFRKP_HN_x_korea_289_a_orig:0 "..."
 TFRKP_HN_x_korea_289_a_tmp:0 "확인"
 korea.290.t:0 "[TFRKP_HN_x_korea_290_t]"
 TFRKP_HN_x_korea_290_t_orig:0 "원전 증설"
 TFRKP_HN_x_korea_290_t_tmp:0 "(임시) 에너지 토론"
 korea.290.d:0 "[TFRKP_HN_x_korea_290_d]"
 TFRKP_HN_x_korea_290_d_orig:0 "\"원전을 추가 설치한다고 했는데, 그건 어디에 설치할 것입니까?\"\n\n\"원전은 짓고 있는 건 다 짓겠다고 했지, 추가로 새 지역에 넣겠다고는 말씀을 안 드렸습니다.\"\n\n\"4기 추가 건설한다고 하지 않았습니까?\"\n\n\"안 했습니다.\""
 TFRKP_HN_x_korea_290_d_tmp:0 "후보들이 에너지 정책을 두고 토론을 벌였다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
 korea.290.a:0 "[TFRKP_HN_x_korea_290_a]"
