 TFRKP_HN_52a_yoon:0 "윤석열이 대한민국 20대 대통령으로 당선되었다."
 TFRKP_HN_52a_hong:0 "홍준표가 대한민국 20대 대통령으로 당선되었다."
 TFRKP_HN_52b_lee:0 "이재명이 대한민국 20대 대통령으로 당선되었다."
 TFRKP_HN_52b_nak:0 "이낙연이 대한민국 20대 대통령으로 당선되었다."
 TFRKP_HN_52desc_orig:0 "미국 내전의 발발로 전 세계가 거대한 혼란에 빠진 상황에서, 대한민국 제20대 대통령 선거가 치러졌습니다.\n\n문재인 정부 5년 동안, 부동산 가격 폭등과 코로나19 팬데믹, 그리고 임기 말 발생한 미국 내전 여파의 경제 위기까지 정말 많은 일들이 있었습니다. 이 타오르는 불길 속에서 치러진 이번 선거는 정권 재창출론과 정권 교체론이 정면으로 대립했습니다. 더불어민주당에서는 행정 경험을 강조한 이재명 후보가, 국민의힘에서는 정권 심판을 내건 윤석열 후보가 출마하여 접전을 펼쳤습니다.\n\n투표 마감 이후 전국 개표소에서 개표가 본격화되자, 출구조사의 결과대로 극심한 초박빙 양상이 나타났습니다. 밤늦도록 두 후보의 득표율 격차는 1%p 미만에 머물렀으며, 새벽녘까지 승패를 가늠하기 힘든 상황이 이어졌습니다.\n\n전 국민의 시선이 개표 방송에 집중된 가운데, 대한민국의 앞으로의 5년을 책임질 새로운 대통령은..."
 TFRKP_HN_52desc_hong:0 "미국 내전의 발발로 전 세계가 거대한 혼란에 빠진 상황에서, 대한민국 제20대 대통령 선거가 치러졌습니다.\n\n문재인 정부 5년 동안, 부동산 가격 폭등과 코로나19 팬데믹, 그리고 임기 말 발생한 미국 내전 여파의 경제 위기까지 정말 많은 일들이 있었습니다. 이 타오르는 불길 속에서 치러진 이번 선거는 정권 재창출론과 정권 교체론이 정면으로 대립했습니다. 더불어민주당에서는 행정 경험을 강조한 이재명 후보가, 국민의힘에서는 서민 대통령을 내건 홍준표 후보가 출마하여 접전을 펼쳤습니다.\n\n투표 마감 이후 전국 개표소에서 개표가 본격화되자, 출구조사의 결과대로 극심한 초박빙 양상이 나타났습니다. 밤늦도록 두 후보의 득표율 격차는 1%p 미만에 머물렀으며, 새벽녘까지 승패를 가늠하기 힘든 상황이 이어졌습니다.\n\n전 국민의 시선이 개표 방송에 집중된 가운데, 대한민국의 앞으로의 5년을 책임질 새로운 대통령은..."
 TFRKP_HN_52desc_nak:0 "미국 내전의 발발로 전 세계가 거대한 혼란에 빠진 상황에서, 대한민국 제20대 대통령 선거가 치러졌습니다.\n\n문재인 정부 5년 동안, 부동산 가격 폭등과 코로나19 팬데믹, 그리고 임기 말 발생한 미국 내전 여파의 경제 위기까지 정말 많은 일들이 있었습니다. 이 타오르는 불길 속에서 치러진 이번 선거는 정권 재창출론과 정권 교체론이 정면으로 대립했습니다. 더불어민주당에서는 국무총리와 당 대표를 지낸 이낙연 후보가, 국민의힘에서는 정권 심판을 내건 윤석열 후보가 출마하여 접전을 펼쳤습니다.\n\n투표 마감 이후 전국 개표소에서 개표가 본격화되자, 출구조사의 결과대로 극심한 초박빙 양상이 나타났습니다. 밤늦도록 두 후보의 득표율 격차는 1%p 미만에 머물렀으며, 새벽녘까지 승패를 가늠하기 힘든 상황이 이어졌습니다.\n\n전 국민의 시선이 개표 방송에 집중된 가운데, 대한민국의 앞으로의 5년을 책임질 새로운 대통령은..."
 TFRKP_HN_52desc_hong_nak:0 "미국 내전의 발발로 전 세계가 거대한 혼란에 빠진 상황에서, 대한민국 제20대 대통령 선거가 치러졌습니다.\n\n문재인 정부 5년 동안, 부동산 가격 폭등과 코로나19 팬데믹, 그리고 임기 말 발생한 미국 내전 여파의 경제 위기까지 정말 많은 일들이 있었습니다. 이 타오르는 불길 속에서 치러진 이번 선거는 정권 재창출론과 정권 교체론이 정면으로 대립했습니다. 더불어민주당에서는 국무총리와 당 대표를 지낸 이낙연 후보가, 국민의힘에서는 서민 대통령을 내건 홍준표 후보가 출마하여 접전을 펼쳤습니다.\n\n투표 마감 이후 전국 개표소에서 개표가 본격화되자, 출구조사의 결과대로 극심한 초박빙 양상이 나타났습니다. 밤늦도록 두 후보의 득표율 격차는 1%p 미만에 머물렀으며, 새벽녘까지 승패를 가늠하기 힘든 상황이 이어졌습니다.\n\n전 국민의 시선이 개표 방송에 집중된 가운데, 대한민국의 앞으로의 5년을 책임질 새로운 대통령은..."
 korea.354.desc:0 "[TFRKP_HN_354desc]"
 TFRKP_HN_354desc_orig:0 "어제 국민의힘과 국민의당 양당이 합당을 공식적으로 선언했습니다. 제20대 대통령 선거에서 윤석열-안철수 후보 단일화를 통해 국민의힘이 정권교체를 이루고 집권여당이 되면서 합당 논의가 급물살을 타고 추진된 것으로 확인됩니다.\n\n국민의힘과 국민의당이 공식적으로 합당을 선언하면서 20대 대통령 선거 기간 내내 서로 불편한 관계를 지냈던 이준석 국민의힘 대표와 안철수 국민의당 대표가 서로 손을 마주잡고 악수하는 모습을 보였습니다. 합당 합의문에서는 나온 합당 방식은 당 대 당으로 통합이며, 당명은 국민의힘으로 쓰기로 했습니다.\n\n양당은 최고위원회에도 국민의당 몫으로 2명을 임명하기로 했으며 국민의당 출신 후보가 공천을 신청한 지역에 대해 기존의 당원투표 50% + 여론조사 50% 방식에서 여론조사 100% 방식으로 경선을 실시하기로 했습니다.\n\n이번 합당에 동의를 표한 안철수 의원은 2012년 정계에 입문한 이후 2014년 새정치민주연합당에 합류했으나 이후 탈당하여 국민의당을 창당, 제3지대에서 활동했습니다. 이후 2018년 바른정당과 합당하여 바른미래당 소속 정치인으로 활동했다가 2020년 바른미래당을 탈당하고 다시 국민의당 소속 정치인으로 활동하였습니다. 그렇게 안철수 의원은 7년간의 제3지대 활동과 10년간의 정치 표류를 종료하고 국민의힘 소속 보수 정치인이 되었습니다."
 TFRKP_HN_354desc_hong:0 "어제 국민의힘과 국민의당 양당이 합당을 공식적으로 선언했습니다. 제20대 대통령 선거에서 홍준표 후보가 승리해 국민의힘이 정권교체를 이루고 집권여당이 되면서 합당 논의가 급물살을 타고 추진된 것으로 확인됩니다.\n\n국민의힘과 국민의당이 공식적으로 합당을 선언하면서 20대 대통령 선거 기간 내내 서로 불편한 관계를 지냈던 이준석 국민의힘 대표와 안철수 국민의당 대표가 서로 손을 마주잡고 악수하는 모습을 보였습니다. 합당 합의문에서는 나온 합당 방식은 당 대 당으로 통합이며, 당명은 국민의힘으로 쓰기로 했습니다.\n\n양당은 최고위원회에도 국민의당 몫으로 2명을 임명하기로 했으며 국민의당 출신 후보가 공천을 신청한 지역에 대해 기존의 당원투표 50% + 여론조사 50% 방식에서 여론조사 100% 방식으로 경선을 실시하기로 했습니다.\n\n이번 합당에 동의를 표한 안철수 의원은 2012년 정계에 입문한 이후 2014년 새정치민주연합당에 합류했으나 이후 탈당하여 국민의당을 창당, 제3지대에서 활동했습니다. 이후 2018년 바른정당과 합당하여 바른미래당 소속 정치인으로 활동했다가 2020년 바른미래당을 탈당하고 다시 국민의당 소속 정치인으로 활동하였습니다. 그렇게 안철수 의원은 7년간의 제3지대 활동과 10년간의 정치 표류를 종료하고 국민의힘 소속 보수 정치인이 되었습니다."
 korea.81.t:0 "[TFRKP_HN_x_korea_81_t]"
 TFRKP_HN_x_korea_81_t_orig:0 "다크호스"
 TFRKP_HN_x_korea_81_t_tmp:0 "경선 승리"
 korea.81.desc:0 "[TFRKP_HN_x_korea_81_desc]"
 TFRKP_HN_x_korea_81_desc_orig:0 "삼성생명에서 과장으로 일하고 있는 김정훈은 오늘 하루가 정말 즐겁게 느껴졌다. 자신이 바랐던 대로 윤석열이 국민의힘 대선 후보로 선출되었기 때문이다. 그는 직장에서 일을 하며 라이브 영상을 머리 속에서 꾸준히 되새김질하며 생각했다.\n\n'운동권 쓰레기들이 더럽힌 사회의 가치들을 원상복구시킬 때가 왔구나!'\n\n의무경찰 복무시절 광우뻥 시위를 겪고 난 후, 보수주의가 정체성으로 강하게 각인된 그에게 있어 문재인 정부는 그야말로 지옥이었다. 평창 올림픽 폐막식에서 김영철이 방남했다는 소식, 조국 법무부장관이 청문회에서 김진태 의원의 질문에 사회주의 정책이 필요하다고 발언했다는 사실, 조국 다음으로 자리에 앉은 추미애 법무부장관의 윤석열 검찰총장과의 갈등과 검찰총장 직위 해제, 월성원전 경제성 조작 소식은 운동권의 종북주의 야욕이 차근차근 실현되고 있는 걸로 보였다.\n\n그러던 도중 윤석열 검찰총장이 국민의힘에 입당해 정치활동을 펼치기 시작하더니 자연스럽게 그에게 관심을 가지게 되었다. 물론 주변에서 그는 정계는 물론 행정 경력도 없는 인물이라지만 그게 무슨 상관인가. 그가 추구해 온 정의로운 법치주의 관점을 생각하면 분명 모든 게 잘 될 것이다."
 TFRKP_HN_x_korea_81_desc_tmp:0 "삼성생명에서 과장으로 일하는 김정훈은 개표 결과가 대형 화면에 뜨는 순간 자기도 모르게 주먹을 쥐었다. 당원 투표에서는 밀릴 것이라는 전망이 우세했다. 그러나 홍준표는 그 전망을 뒤집고 국민의힘 대선 후보가 되었다.\n\n경선 내내 그는 같은 말을 되풀이했다. 당내 세력에 기대지 않겠다는 말이었다.\n\n\"제가 당내 당대표 경선 3번, 도지사 경선, 대선 후보 경선 등 참 많이 해봤다. 그 때마다 당협위원장이나 국회의원들을 줄세우기 하지도 않았다\"\n\n또 하나는 상대 후보를 겨냥한 말이었다. 대통령은 경험이 있어야 한다는 것이다.\n\n\"우리나라 대선 구도를 보면 초보자가 나와서 된 적도 없고 초보자가 나와서는 나라 경영하기가 어렵다\"\n\n김정훈은 휴대폰으로 가족 단체방에 짧게 적었다. 이번에는 정말 바뀔지도 모른다고."
