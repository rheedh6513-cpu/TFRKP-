 korea.281.t:0 "[TFRKP_HN_x_korea_281_t]"
 TFRKP_HN_x_korea_281_t_orig:0 "소년공"
 TFRKP_HN_x_korea_281_t_tmp:0 "(임시) 후보 소개"
 korea.281.d:0 "[TFRKP_HN_x_korea_281_d]"
 TFRKP_HN_x_korea_281_d_orig:0 "                                             £GFX_The_JoongAng \n\n                  44년 소년공 절친  \"재명이는 역시 다르다는 걸 보여주길\"\n\n심정운 씨는 이재명 후보의 소년공 시절 죽마고우다.\n이 후보 스스로도 심 씨를 \"나의 가장 친한 친구\"라며 \"(어릴 적) 가슴이 터질 것 같이 답답할 때 내 속마음을 털어놓을 유일한 대상\"이라고 표현했다. 이 후보은 같은 책에서 \"나에게 정운이는 너무나 절실한 존재였다\"고도 했다. 낮에는 함께 일하고 밤에는 함께 공부하며 대학 진학의 꿈도 같이 이룬 둘도 없는 친구다. \n\nQ. 소년공 이재명과 정치인 이재명은 어떻게 다른가요.\nA. \"소년공 시절에는 자기 자신만 책임지면 됐잖아요. 하지만 정치인은 자신뿐 아니라 사회 전체를 이끌어야 하는 책임이 뒤따른다고 생각해요. 이재명과 같은 리더의 역할이 참 중요하죠.\"\n\nQ. 소년공 시절의 경험이 대통령 역할을 수행하는 데 어떤 영향을 줄까요.\nA. \"소년공 시절 겪은 프레스 기계 사고, 관리자의 횡포를 견뎌낸 경험은 약자에 대한 공감 능력과 정책 개발에 큰 도움이 될 거라고 봐요. 그런 어려움을 극복한 경험 자체도 리더로서 강한 추진력과 결단력을 발휘하는 데 큰 자산이 될 겁니다.\" \n\nQ. 이 후보가 5년 뒤 어떤 대통령으로 기억되길 바라시나요.\nA. \"단기적인 성과도 중요하지만, 국민의 한 사람으로서 인구소멸, 기후위기, 고령화 등 국가가 직면한 장기 과제를 해결할 수 있는 국가 로드맵을 마련해 지속 가능하고 성장 가능한 국가를 만들어주길 바라요. 그래서 국민도 \"이재명은 역시 다르구먼\"이라고 말할 수 있는, 그런 대통령이 되길 바랍니다.\""
 TFRKP_HN_x_korea_281_d_tmp:0 "이낙연 후보를 소개하는 기사가 연일 보도되고 있다.\n\n(임시 이벤트입니다. 나중에 새로 쓸 예정입니다.)"
