l_korean:
 # [안내] 1-3-2-1 엔딩 중점과 사건의 글. ending_1321.py가 만든다.
 TFRKPHN_kbg_g0:0 "전쟁이 끝난 날"
 TFRKPHN_kbg_g0_desc:0 "대아대전이 끝났습니다. 대통령은 기념식을 열지 않고 전사자 명단부터 읽습니다."
 tfrkphn.7248.t:0 "전쟁이 끝난 날"
 tfrkphn.7248.d:0 "대아대전이 태평양방위조약기구의 승리로 끝났다. 평양 외곽의 마지막 저항이 멎었다는 보고는 새벽에 들어왔다. 김부겸은 관저에서 전화를 받았고, 날이 밝기 전에 국가안전보장회의를 열었다. 장관들은 넥타이를 매지 못한 채 들어왔다. 밖은 아직 어두웠다.\n\n회의실의 분위기는 들떠 있었다. 한 참모는 광화문에서 기념식을 열자고 했다. 다른 참모는 이참에 국방 예산을 늘리자고 했다. 예비역 단체는 군의 위상을 되찾을 때라는 성명을 아침 일찍 냈다.\n\n대통령은 기념식을 열지 않기로 했다. 이 나라는 몇 해 전 다른 전쟁에서 진 나라였다. 그때 전쟁을 끝까지 해야 했다고 외치던 사람들이 조원진을 대통령으로 만들었다. 그는 이긴 전쟁의 열기가 같은 길로 흐르는 것을 경계했다.\n\n그는 국방부 장관에게 두 가지를 지시했다. 북쪽에 들어간 부대는 주민의 집과 재산에 손대지 말고, 작전의 모든 과정을 국회에 보고하라는 것이었다. 그날 오후 대통령은 전사자 명단을 받았다. 그는 명단을 끝까지 읽었고, 유족에게 보낼 편지의 초안을 직접 고쳤다."
 tfrkphn.7248.a:0 "편지에 서명한다."
 TFRKPHN_kbg_e1:0 "장군의 청문회"
 TFRKPHN_kbg_e1_desc:0 "대장으로 진급하는 사람은 국회의 청문을 거치게 합니다. 대통령이 쥐고 있던 권한을 절반 내놓습니다."
 tfrkphn.7233.t:0 "장군의 청문회"
 tfrkphn.7233.d:0 "김부겸은 임기 마지막 해에 군 인사법 개정안을 국회에 냈다. 대장으로 진급하는 사람은 국회 국방위원회의 청문을 거친다는 내용이었다. 대통령이 혼자 쥐고 있던 권한을 절반 내놓는 법이었다. 그 권한은 정부가 선 뒤로 한 번도 국회와 나눈 적이 없었다.\n\n국방부는 조용히 반대했다. 청문회가 열리면 장군들이 의원들 눈치를 보게 된다는 이유였다. 예비역 단체는 군을 정치판에 끌어들인다는 성명을 냈다. 여당 안에서도 다음 대통령의 손을 묶는다는 말이 나왔다.\n\n대통령은 합동참모본부 회의에 직접 갔다. 그는 여의도에 전차가 들어온 날 그 명령서에 서명한 사람도 대통령이 고른 장군이었다고 말했다. 회의실은 한동안 조용했다. 그는 법안을 거두지 않겠다는 말만 하고 일어섰다.\n\n법안은 석 달 뒤 통과됐다. 첫 청문회에 나온 대장 후보자는 일곱 시간 동안 질문을 받았다. 그는 헌법에 어긋나는 명령을 받으면 따르지 않겠다고 속기록에 남겼다. 청문회는 방송으로 나갔고 병사들은 생활관에서 그것을 보았다. 그는 열한 표 차이로 인준됐다."
 tfrkphn.7233.a:0 "속기록이 인쇄된다."
 TFRKPHN_kbg_e2:0 "추천 위원회"
 TFRKPHN_kbg_e2_desc:0 "헌법재판관을 대통령이 혼자 고르지 않고 추천 위원회가 올린 사람 가운데서 지명합니다."
 tfrkphn.7234.t:0 "추천 위원회"
 tfrkphn.7234.d:0 "헌법재판관 세 명의 임기가 같은 달에 끝났다. 세 자리 모두 대통령이 지명할 수 있었다. 참모들은 개혁을 지킬 사람을 앉힐 마지막 기회라고 보고했다. 세 사람이 바뀌면 재판소의 과반이 바뀐다.\n\n김부겸은 명단을 받지 않았다. 그는 판사와 변호사, 법학 교수와 시민 대표가 섞인 추천 위원회를 꾸리고, 위원회가 올린 사람 가운데서만 고르겠다고 발표했다. 위원회의 회의는 방송으로 내보냈다. 추천 위원 열한 명 가운데 대통령이 고른 사람은 한 명도 없었다. 회의는 아홉 번 열렸다.\n\n위원회가 올린 여섯 명 가운데에는 정부의 사정 수사를 비판하는 글을 쓴 판사가 있었다. 민정수석은 그 이름만은 빼자고 했다. 대통령은 그 판사를 세 사람 가운데 첫째로 지명했다. 나머지 두 자리도 위원회가 매긴 순서대로 채웠다.\n\n여당 지지자들의 항의 전화가 대통령실에 종일 걸려 왔다. 새 재판관은 취임 넉 달 뒤 정부가 낸 법률 하나에 위헌 의견을 냈다. 대통령실은 판결을 존중한다는 한 줄짜리 논평을 냈다. 그 법률은 그가 선거에서 약속한 것이었다."
 tfrkphn.7234.a:0 "논평은 한 줄이다."
 TFRKPHN_kbg_e3:0 "하루에 두 도시"
 TFRKPHN_kbg_e3_desc:0 "임기 마지막 가을에 광주와 대구를 하루에 다녀옵니다."
 tfrkphn.7235.t:0 "하루에 두 도시"
 tfrkphn.7235.d:0 "김부겸은 임기 마지막 가을에 광주와 대구를 하루에 다녀오는 일정을 잡았다. 아침에는 광주의 묘역에 가고 저녁에는 대구의 시장에 가는 일정이었다. 수행원은 열 명으로 줄였다.\n\n그는 대구에서 여러 번 출마했고 한 번 이겼다. 떨어질 때마다 당을 바꾸라는 말을 들었다. 두 도시를 잇는 철도는 그의 임기에 착공됐고 아직 절반이 남아 있었다.\n\n광주의 묘역에서 그는 방명록에 이름만 적었다. 방명록의 앞 장에는 다섯 해 전 그가 적은 이름이 남아 있었다. 대구의 시장에서는 상인 한 사람이 어묵 값을 받지 않겠다고 했고, 그는 끝내 돈을 냈다. 시장 입구에는 그를 반대하는 현수막과 환영하는 현수막이 나란히 걸려 있었다. 현수막은 둘 다 그대로 두라고 그는 말했다.\n\n돌아오는 기차에서 수행 기자가 지역 구도가 깨졌다고 보느냐고 물었다. 그는 지난 총선의 지역별 득표율 표를 꺼내 보여 주었다. 표의 숫자는 다섯 해 전보다 조금 움직여 있었다. 그는 표를 접어 윗옷 안주머니에 넣었고, 기차는 밤 열한 시에 서울역에 닿았다."
 tfrkphn.7235.a:0 "기차에서 내린다."
 TFRKPHN_kbg_e4:0 "떠난 사람들"
 TFRKPHN_kbg_e4_desc:0 "개혁은 대통령 곁의 사람들도 법정에 세웠습니다. 대통령은 수사에 관해 보고를 받지 않습니다."
 tfrkphn.7236.t:0 "떠난 사람들"
 tfrkphn.7236.d:0 "개혁이 다섯 해째에 이르자 대통령 곁에는 처음 시작한 사람이 몇 남지 않았다. 사정 수사는 여당 의원 넷을 법정에 세웠고, 그 가운데 둘은 대통령의 선거를 도왔던 사람이었다. 나머지는 장관을 그만두었거나 스스로 떠났다.\n\n한 사람은 재판을 받으러 가는 길에 기자들 앞에서 대통령을 원망했다. 다른 한 사람의 부인은 대통령 부인에게 긴 편지를 보냈다. 김부겸은 그 편지를 읽었고 답장을 쓰지 않았다. 편지에는 삼십 년 전 함께 찍은 사진이 들어 있었다.\n\n지지율은 취임 때의 절반이 됐다. 재계 단체는 정권이 바뀌기만 기다린다는 말을 숨기지 않았다. 군에서 밀려난 장군들은 회고록을 준비했다. 여당 원내대표는 다음 총선을 걱정하는 의원들의 연판장을 들고 왔다.\n\n민정수석은 남은 수사 가운데 몇 건을 다음 정부로 넘기자고 건의했다. 대통령은 수사에 관해 보고를 받지 않겠다고 다시 말했다. 검찰은 그 주에 여당 중진 한 사람을 더 불렀고, 대통령은 그 소식을 저녁 뉴스에서 처음 들었다. 그는 텔레비전을 끄지 않았다."
 tfrkphn.7236.a:0 "뉴스를 끝까지 본다."
 TFRKPHN_kbg_e5:0 "세 사람의 점심"
 TFRKPHN_kbg_e5_desc:0 "김동연과 김무성을 불러 고친 것과 고치지 못한 것을 함께 봅니다."
 tfrkphn.7237.t:0 "세 사람의 점심"
 tfrkphn.7237.d:0 "임기가 반년 남았을 때 김부겸은 김동연과 김무성을 대통령실로 불러 점심을 먹었다. 세 사람이 한 상에 앉은 것은 대통령 선거 뒤 처음이었다. 반찬은 세 사람의 고향에서 하나씩 올렸다.\n\n대통령은 서류 봉투 세 개를 준비해 두었다. 봉투에는 국회와 법원, 언론과 군의 상태를 적은 보고서가 들어 있었다. 우원식 정부가 넘겨준 인계 문서와 같은 차례로 쓴 것이었다. 고친 것과 고치지 못한 것이 한 쪽씩 마주 보게 적혀 있었다. 보고서는 스무 쪽이었다.\n\n김무성은 고치지 못한 쪽이 더 길다고 말하며 웃었다. 김동연은 숫자가 틀린 곳 두 군데를 그 자리에서 짚었다. 대통령은 두 사람의 말을 받아 적었다. 김무성은 국회 쪽에 한 줄을 보탰고 김동연은 예산 표를 하나 그려 넣었다.\n\n식사는 두 시간 동안 이어졌다. 다음 선거에서 누가 나설지는 아무도 꺼내지 않았다. 헤어질 때 세 사람은 봉투를 하나씩 들고 나갔고, 대통령은 자기 몫의 봉투를 책상 맨 위 서랍에 넣었다. 봉투의 겉에는 아무것도 적혀 있지 않았다. 점심값은 대통령이 냈다."
 tfrkphn.7237.a:0 "서랍을 닫는다."
 TFRKPHN_kbg_g9:0 "칼을 내려놓다"
 TFRKPHN_kbg_g9_desc:0 "남은 임기 동안 새 개혁 법안을 내지 않습니다. 법이 지켜지는지는 국회와 법원이 지켜봅니다."
 tfrkphn.7249.t:0 "칼을 내려놓다"
 tfrkphn.7249.d:0 "전쟁이 끝난 뒤의 첫 정기 국회가 열렸다. 김부겸은 시정 연설에서 남은 임기 동안 새 개혁 법안을 내지 않겠다고 말했다. 본회의장이 잠시 술렁였다. 연설문의 그 대목은 그가 전날 밤 직접 고쳐 쓴 것이었다.\n\n그는 이유를 설명했다. 군 인사와 재판관 추천, 수사의 독립은 이제 법에 적혀 있다. 대통령이 더 밀어붙이면 그 법들은 한 사람의 뜻으로 남는다. 다음 대통령이 그 법을 지키는지 지켜보는 것은 국회와 법원의 일이라고 그는 말했다.\n\n야당 대표는 대통령이 힘이 빠지니 물러서는 것이라고 논평했다. 여당의 젊은 의원들은 아직 할 일이 남았다며 서운해했다. 개혁에 밀려났던 사람들은 조용히 다음 선거를 기다렸다. 재계는 논평을 내지 않았다.\n\n연설을 마친 대통령은 의장석 쪽으로 돌아서서 허리를 숙였다. 그 의장석은 우원식이 긴급명령 무효 결의안의 가결을 선포한 자리였다. 본회의장 뒤편의 방청석에는 견학 온 중학생들이 앉아 있었고, 한 학생이 옆자리 친구에게 저 사람이 대통령이냐고 물었다. 인솔 교사가 그렇다고 답했다."
 tfrkphn.7249.a:0 "본회의장을 나선다."
 TFRKPHN_kdy_g0:0 "포성이 멎은 아침"
 TFRKPHN_kdy_g0_desc:0 "대아대전이 끝났습니다. 전후 특수를 잡되 빚은 다시 내지 않습니다."
 tfrkphn.7250.t:0 "포성이 멎은 아침"
 tfrkphn.7250.d:0 "대아대전이 태평양방위조약기구의 승리로 끝났다. 소식이 들어온 아침에 김동연은 외환 시장이 열리기를 기다리고 있었다. 환율은 개장 십 분 만에 크게 내렸고 주가는 올랐다. 그는 화면을 한 시간 동안 지켜보았다.\n\n경제 부처는 바빠졌다. 전쟁이 끝나면 항로가 다시 열리고 북쪽의 복구 사업이 시작된다. 건설 회사와 제철소의 주가는 상한가를 쳤다. 여당은 추가 예산을 짜서 전후 특수를 잡자고 요구했다. 빚을 다시 내자는 말이었다.\n\n대통령은 수첩을 폈다. 이 나라는 지난 전쟁의 빚을 갚는 데 다섯 해를 썼고, 이번 전쟁을 치르느라 다시 빚을 졌다. 지난번에도 사람들은 전쟁이 끝나면 다 갚는다고 말했다. 수첩의 첫 장에는 그때 진 빚의 액수가 적혀 있었다.\n\n그는 추가 예산을 짜되 빚은 내지 않겠다고 발표했다. 세금이 더 걷히는 만큼만 쓰고, 기업이 복구 사업을 따내면 정부는 보증만 서겠다는 것이었다. 건설 회사들의 주가는 이튿날 조금 내렸다. 기획재정부의 한 과장은 대통령이 잔치에 장부를 들고 왔다고 동료에게 말했다."
 tfrkphn.7250.a:0 "장부를 편다."
 TFRKPHN_kdy_e1:0 "상환 영수증"
 TFRKPHN_kdy_e1_desc:0 "전쟁 때 발행한 국채의 마지막 회차를 갚습니다."
 tfrkphn.7238.t:0 "상환 영수증"
 tfrkphn.7238.d:0 "전쟁 때 발행한 국채의 마지막 회차가 만기를 맞았다. 기획재정부는 상환 자금을 석 달 전에 따로 떼어 두었다. 김동연은 상환하는 날 한국은행 전산실에 직접 갔다. 방문은 일정표에 없었다. 수행원은 비서관 한 명이었다.\n\n담당 과장이 화면의 단추를 눌렀다. 숫자가 영으로 바뀌는 데는 사 초가 걸렸다. 전산실 직원 열두 명이 박수를 쳤고, 대통령은 과장에게 영수증을 한 장 뽑아 달라고 했다. 박수는 오래가지 않았다. 영수증에는 상환 금액과 시각이 초 단위까지 찍혀 있었다.\n\n그 빚은 그가 일으키지 않은 전쟁에서 생긴 것이었다. 다섯 해 동안 예산의 여섯에 하나가 이자로 나갔다. 그 돈이면 지방 병원 서른 곳을 지을 수 있었다는 계산을 그는 수첩에 적어 두고 있었다. 그는 그 계산을 임기 첫 주에 했다.\n\n외신은 패전국이 빚을 기한 안에 다 갚았다고 짧게 전했다. 국채 금리는 그날 오후 조금 내렸다. 대통령은 영수증을 접어 수첩 사이에 끼우고, 다음 일정인 예산 회의에 십 분 늦게 들어갔다. 회의 안건은 내년에 새로 빌릴 돈이었다."
 tfrkphn.7238.a:0 "회의를 시작한다."
 TFRKPHN_kdy_e2:0 "공개된 장부"
 TFRKPHN_kdy_e2_desc:0 "나라 살림의 지출 내역을 날마다 공개합니다. 기자들이 정부의 숫자를 직접 봅니다."
 tfrkphn.7239.t:0 "공개된 장부"
 tfrkphn.7239.d:0 "정부는 나라 살림의 지출 내역을 날마다 인터넷에 올리기 시작했다. 어느 부처가 어디에 얼마를 썼는지 누구나 찾아볼 수 있었다. 김동연이 우원식 정부에서 경제를 맡았을 때부터 밀던 일이었다. 자료는 내려받아 표로 만들 수 있는 형식이었다.\n\n장관들은 반기지 않았다. 공개 첫 주에 한 신문은 어느 부처의 회식비를 찾아내 일 면에 실었다. 다음 주에는 대통령실의 꽃값이 기사가 됐다. 비서실장은 공개 범위를 줄이자고 건의했다. 장관 둘은 국무회의에서 공개를 멈추자고 발언했다.\n\n대통령은 범위를 줄이지 않았다. 그는 기자들이 숫자를 직접 볼 수 있어야 정부의 발표를 받아쓰지 않는다고 말했다. 대통령실은 꽃값을 절반으로 줄였다.\n\n석 달 뒤 한 지방 신문의 기자가 장부에서 이상한 계약 한 건을 찾아냈다. 감사원이 조사에 들어갔고 국장 한 사람이 물러났다. 감사원장은 장부가 없었다면 찾지 못했을 계약이라고 국회에 보고했다. 그 기자는 그해 언론상을 받았고, 수상 소감에서 정부가 준 자료로 정부를 고발했다고 말했다."
 tfrkphn.7239.a:0 "장부는 오늘도 올라간다."
 TFRKPHN_kdy_e3:0 "다시 켠 용광로"
 TFRKPHN_kdy_e3_desc:0 "수출길이 끊겨 문을 닫았던 제철소가 다시 고로에 불을 넣습니다."
 tfrkphn.7240.t:0 "다시 켠 용광로"
 tfrkphn.7240.d:0 "전쟁으로 수출길이 끊긴 뒤 문을 닫았던 제철소가 여섯 해 만에 고로에 불을 넣었다. 김동연은 화입식에 참석했다. 고로 앞에는 다시 고용된 노동자 이천 명이 서 있었다. 제철소 굴뚝에서 연기가 오르는 것을 보려고 시민들이 방파제에 모였다.\n\n그 가운데 절반은 그사이 다른 일을 했다. 택배를 나른 사람이 있었고 식당을 열었다가 닫은 사람도 있었다. 회사를 떠난 지 여섯 해 만에 작업복을 다시 입은 사람들이었다. 돌아오지 않은 사람은 삼천 명이었다. 회사는 그 자리를 다 채우지 못했다.\n\n대통령은 준비한 연설문을 읽지 않았다. 그는 자기도 열일곱 살에 은행에 들어가 낮에는 일하고 밤에는 학교에 다녔다고 말했다. 연설은 이 분 만에 끝났다. 노동자들은 박수를 치지 않고 고개를 끄덕였다.\n\n불씨는 가장 오래 일한 노동자가 넣었다. 쇳물이 처음 나온 것은 이틀 뒤였다. 첫 쇳물로 만든 강판은 다시 열린 항구에서 배에 실렸고, 그 배의 목적지는 여섯 해 전에 거래가 끊긴 나라였다. 항구의 크레인 기사도 그해 봄에 다시 고용된 사람이었다."
 tfrkphn.7240.a:0 "배가 항구를 떠난다."
 TFRKPHN_kdy_e4:0 "깎인 것들"
 TFRKPHN_kdy_e4_desc:0 "빚을 갚느라 깎은 것의 목록을 예산서 옆에 나란히 공개합니다."
 tfrkphn.7241.t:0 "깎인 것들"
 tfrkphn.7241.d:0 "빚을 갚는 다섯 해 동안 정부는 많은 것을 깎았다. 공무원 임금은 세 해 동안 오르지 않았다. 지방 도로 공사 사백 건이 미뤄졌고 공기업 여섯 곳이 팔렸다. 대학 연구비와 군 장병의 급식비도 줄었다.\n\n김동연은 임기 마지막 해에 깎은 것의 목록을 따로 만들게 했다. 목록은 예산서와 같은 두께가 됐다. 그는 그 목록을 예산서 옆에 나란히 공개했다. 참모들은 선거를 앞두고 그럴 필요가 있느냐고 물었다. 대통령은 숨기면 다음 정부가 같은 것을 다시 깎는다고 답했다.\n\n목록의 맨 앞에는 노인 요양 시설의 인력 감축이 있었다. 한 시설의 원장은 방송에 나와 빚은 갚았지만 그동안 돌보지 못한 사람이 있다고 말했다. 야당은 그 방송을 선거 광고에 썼다. 그 시설에서는 요양 보호사 한 사람이 노인 열두 명을 맡고 있었다.\n\n대통령은 그 시설을 찾아갔다. 그는 원장의 말을 한 시간 동안 들었고 변명하지 않았다. 이듬해 예산안에는 깎았던 요양 인력이 먼저 되돌아왔다. 도로 공사는 여전히 목록에 남았다. 목록의 둘째 줄은 지방 병원이었다."
 tfrkphn.7241.a:0 "목록은 남는다."
 TFRKPHN_kdy_e5:0 "숫자 뒤의 이름"
 TFRKPHN_kdy_e5_desc:0 "다음 정부에 넘길 보고서에 숫자를 만든 사람의 이름을 함께 적습니다."
 tfrkphn.7242.t:0 "숫자 뒤의 이름"
 tfrkphn.7242.d:0 "임기가 끝나 가자 김동연은 다음 정부에 넘길 보고서를 직접 고쳤다. 보고서는 숫자로 가득했다. 나라 빚과 외환 보유고, 실업률과 수출액이 다섯 해 치 표로 실렸다. 초안은 기획재정부가 썼고 사백 쪽이었다. 그는 사흘 밤을 썼다.\n\n그는 표 옆에 칸을 하나 더 만들게 했다. 그 숫자를 만든 사람의 이름을 적는 칸이었다. 항구를 다시 연 과장과 채권단을 설득한 국장의 이름이 들어갔다. 공장 문을 다시 연 노동조합 위원장의 이름도 들어갔다. 이름을 넣어도 되느냐고 물으면 당사자들은 대개 망설였다.\n\n비서관은 관례에 없는 일이라고 했다. 대통령은 다음 사람이 숫자가 흔들릴 때 누구에게 전화해야 하는지 알아야 한다고 답했다. 이름은 모두 삼백여 개가 됐다. 전화번호는 적지 않았지만 소속과 직책은 적었다.\n\n보고서의 마지막 표는 비어 있었다. 제목은 아직 하지 못한 일이었고, 그는 거기에 다섯 줄을 손으로 적었다. 첫 줄은 지방의 일자리였다. 둘째 줄은 요양 시설이었고 셋째 줄은 지방 병원이었다. 인쇄소는 그 손글씨를 그대로 찍었다."
 tfrkphn.7242.a:0 "보고서를 넘긴다."
 TFRKPHN_kdy_g9:0 "다음 장부"
 TFRKPHN_kdy_g9_desc:0 "북쪽으로 가는 복구 물자를 실은 첫 배가 떠납니다. 대통령은 복구가 끝난 뒤에 무엇을 팔지를 묻습니다."
 tfrkphn.7251.t:0 "다음 장부"
 tfrkphn.7251.d:0 "전쟁이 끝난 이듬해 봄에 김동연은 인천항에 갔다. 북쪽의 남포항으로 가는 복구 물자를 실은 첫 배가 떠나는 날이었다. 부두에는 강판과 시멘트, 변압기가 쌓여 있었다.\n\n그 물자를 만든 공장들 가운데 여럿은 여섯 해 전에 문을 닫았던 곳이었다. 다시 켠 용광로에서 나온 강판이 맨 앞줄에 있었다. 수출 대금은 외상이 아니었다. 정부는 이번에는 물건값을 떼이지 않도록 계약서를 직접 검토했다.\n\n항만 노동자 대표는 대통령에게 일감이 얼마나 갈 것 같으냐고 물었다. 그는 세 해라고 답했다. 복구가 끝나면 주문은 줄어든다. 그 뒤에 무엇을 팔지는 지금 정해야 한다고 그는 말했다. 노동자 대표는 고개를 끄덕이며 수첩에 그 숫자를 적었다.\n\n배가 떠난 뒤 대통령은 부두의 컨테이너 번호를 한참 보았다. 수행 비서관이 무엇을 보느냐고 묻자, 그는 돌아올 때 빈 채로 오는 상자가 몇 개인지 센다고 답했다. 비서관은 그 말을 받아 적었다. 돌아오는 차 안에서 대통령은 산업부 장관에게 전화를 걸어 다음 주 회의의 안건을 바꿨다."
 tfrkphn.7251.a:0 "안건을 바꾼다."
 TFRKPHN_kms_g0:0 "종전 소식"
 TFRKPHN_kms_g0_desc:0 "대아대전이 끝났습니다. 북쪽을 다스릴 방식과 전쟁 뒤의 일은 국회와 함께 정합니다."
 tfrkphn.7252.t:0 "종전 소식"
 tfrkphn.7252.d:0 "대아대전이 태평양방위조약기구의 승리로 끝났다. 소식이 들어온 날 김무성은 여야 대표를 모두 관저로 불렀다. 일곱 정당의 대표가 한 방에 앉았다. 그 방에 일곱이 다 모인 것은 처음이었다.\n\n그는 전쟁 뒤의 일을 대통령 혼자 정하지 않겠다고 말했다. 전후 회담에 보낼 대표단을 국회가 함께 꾸리고, 북쪽을 다스릴 방식과 회담에서 맺는 약속은 모두 국회의 동의를 받겠다는 것이었다. 외교부 장관은 협상에서 손이 묶인다며 반대했다. 여당 대표도 처음 듣는 이야기라는 얼굴이었다.\n\n대통령은 지난 전쟁을 꺼냈다. 그때 전쟁의 중요한 결정은 대통령실 안에서 내려졌다. 졌을 때 책임을 나눠 질 사람이 없었고, 그 빈자리에 조원진이 들어섰다. 방 안의 누구도 그 말에 토를 달지 않았다.\n\n대표들은 그 자리에서 대표단의 구성에 합의했다. 여당 둘, 야당 셋, 정부 둘이었다. 진보 정당의 대표는 대통령과 처음으로 악수했다. 회의는 사십 분 만에 끝났고, 대통령은 대표들에게 저녁을 먹고 가라고 붙잡았다. 일곱 가운데 다섯이 남았다."
 tfrkphn.7252.a:0 "상을 차리게 한다."
 TFRKPHN_kms_e1:0 "대통령에게 묻는다"
 TFRKPHN_kms_e1_desc:0 "대통령이 달마다 국회 본회의에 나가 의원들의 질문을 직접 받습니다."
 tfrkphn.7243.t:0 "대통령에게 묻는다"
 tfrkphn.7243.d:0 "김무성은 임기 마지막 해에 국회 본회의에 달마다 한 번씩 나가기로 했다. 대통령이 의원들의 질문을 직접 받는 자리였다. 헌법에는 그럴 의무가 없었다. 날짜는 매달 첫 수요일로 정했다.\n\n첫날 야당 의원 열두 명이 질문에 나섰다. 질문은 네 시간 동안 이어졌고 절반은 대통령을 몰아세우는 것이었다. 한 초선 의원은 개헌이 대통령 자신의 자리를 늘리려는 것 아니냐고 물었다. 그는 임기가 끝나면 집에 간다고 답했다. 여당 의원 몇은 대통령을 감싸는 질문을 준비했다가 그에게 꾸중을 들었다.\n\n비서진은 두 번째부터는 총리를 대신 보내자고 했다. 대통령은 내각제를 하자는 사람이 국회에서 도망치면 누가 그 말을 믿겠느냐고 했다. 그는 다음 달에도 나갔다. 총리는 그 옆자리에 앉아 답변 자료를 넘겨 주었다.\n\n여섯 번째 되는 달에 본회의장 방청석은 가득 찼다. 방송사들은 그 시간을 생중계로 잡았다. 의원들의 질문은 처음보다 짧아졌고, 숫자를 들고 나오는 의원이 늘었다. 대통령의 답도 처음보다 짧아졌다. 속기록은 그날 밤 공개됐다."
 tfrkphn.7243.a:0 "다음 달에도 나간다."
 TFRKPHN_kms_e2:0 "쓰지 않은 거부권"
 TFRKPHN_kms_e2_desc:0 "국회가 대통령의 뜻과 다른 법을 통과시킵니다. 대통령은 거부권을 쓰지 않습니다."
 tfrkphn.7244.t:0 "쓰지 않은 거부권"
 tfrkphn.7244.d:0 "국회가 대통령의 뜻과 다른 법안을 통과시켰다. 대기업의 지주 회사 규제를 강하게 묶는 법이었다. 여당 일부가 야당과 손잡고 찬성표를 던졌다. 표결은 백육십 대 백이십이었다.\n\n재계는 거부권을 요청했다. 경제 부처 장관 셋도 같은 의견을 올렸다. 김무성 자신도 그 법이 지나치다고 보았다. 성장을 앞세운 그의 다섯 해와 맞지 않는 법이었다. 법이 시행되면 큰 회사 다섯 곳이 지분을 정리해야 했다. 주가는 사흘 동안 내렸다.\n\n그는 거부권 행사 시한 전날 밤까지 서류를 책상에 두었다. 조원진은 국회가 보낸 법안마다 거부권을 썼다. 그 끝이 어디였는지는 온 나라가 기억했다. 거부권 서류의 초안은 이미 결재판에 끼워져 있었다. 그는 밤 열한 시에 비서실장을 불러 초안을 돌려보냈다.\n\n대통령은 법안에 서명했다. 그는 서명한 뒤 국회에 보완 입법을 요청하는 글을 따로 보냈다. 재계 단체의 회장은 실망했다는 말을 전해 왔다. 석 달 뒤 국회는 그 법의 조항 둘을 스스로 고쳤다. 고친 조항은 대통령이 글에서 짚은 것과 같은 곳이었다."
 tfrkphn.7244.a:0 "서명한 펜을 내려놓는다."
 TFRKPHN_kms_e3:0 "사랑방"
 TFRKPHN_kms_e3_desc:0 "관저에서 여야 의원들과 저녁을 먹습니다. 참석자와 오간 이야기는 이튿날 공개합니다."
 tfrkphn.7245.t:0 "사랑방"
 tfrkphn.7245.d:0 "대통령 관저의 응접실은 임기 내내 저녁마다 손님이 있었다. 김무성은 여야 의원들을 열 명씩 불러 밥을 먹었다. 그는 그 방을 사랑방이라고 불렀다. 식사는 저녁 일곱 시에 시작해 아홉 시 전에 끝났다.\n\n처음에는 여당 의원만 왔다. 야당은 들러리가 되지 않겠다며 거절했다. 대통령은 야당 원내대표의 지역구 행사에 예고 없이 찾아가 막걸리를 한 잔 받았다. 그다음 달부터 야당 의원들도 관저에 왔다. 원내대표는 그 자리에서 다음 주 저녁 날짜를 물었다.\n\n사랑방에서 법안이 여럿 풀렸다. 넉 달 동안 묶여 있던 추가 예산이 그 방에서 합의됐다. 기자들은 밀실 정치가 돌아왔다고 썼다. 대통령은 그 뒤로 저녁 식사의 참석자 명단과 오간 이야기의 요지를 이튿날 공개하게 했다. 요지는 한 쪽을 넘지 않았다.\n\n임기 마지막 달에 그는 세어 보았다. 관저에서 밥을 먹은 의원은 재적 삼백 명 가운데 이백팔십일 명이었다. 오지 않은 열아홉 명에게는 따로 편지를 보냈다. 편지의 내용은 모두 달랐고 그는 초안을 직접 썼다. 답장은 일곱 통이 왔다."
 tfrkphn.7245.a:0 "편지에 우표를 붙인다."
 TFRKPHN_kms_e4:0 "지명하지 않는다"
 TFRKPHN_kms_e4_desc:0 "여당의 다음 후보를 대통령이 고르지 않습니다. 경선에 맡깁니다."
 tfrkphn.7246.t:0 "지명하지 않는다"
 tfrkphn.7246.d:0 "여당은 다음 대통령 선거의 후보를 정해야 했다. 중진 의원 셋이 나서겠다고 했고, 세 사람 모두 대통령의 뜻을 물으러 관저에 왔다. 셋 가운데 둘은 그가 처음 공천을 준 사람이었다.\n\n김무성은 오랫동안 다른 사람을 후보로 세우는 일을 했다. 당 사람들은 이번에도 그가 한 사람을 찍어 줄 것으로 믿었다. 그는 그 일을 잘했고 그 일로 원망도 많이 들었다.\n\n그는 세 사람에게 같은 말을 했다. 당원과 국민이 뽑는 대로 따르겠다는 말이었다. 한 의원은 서운한 얼굴로 돌아갔다. 다른 의원은 대통령의 측근들을 따로 만나고 다녔다. 세 번째 의원은 아무 말 없이 차만 마시고 갔다.\n\n대통령은 측근들을 불러 경선에 끼어들면 인연을 끊겠다고 일렀다. 여당 사무총장은 경선 규칙을 대통령실에 묻지 않고 정했다. 경선은 석 달 동안 이어졌고 세 후보는 방송 토론을 여덟 번 했다. 그는 토론을 관저에서 혼자 보았다. 결과가 나온 날 그는 당선자에게 축하 전화를 걸었고, 통화는 일 분이 걸리지 않았다. 떨어진 두 사람에게는 그가 먼저 저녁을 청했다."
 tfrkphn.7246.a:0 "전화를 끊는다."
 TFRKPHN_kms_e5:0 "마지막 한 수"
 TFRKPHN_kms_e5_desc:0 "관저 서재의 바둑판 앞에서 다섯 해를 복기합니다."
 tfrkphn.7247.t:0 "마지막 한 수"
 tfrkphn.7247.d:0 "임기 마지막 겨울에 김무성은 관저 서재의 바둑판을 꺼냈다. 그는 바둑을 잘 두지 못했다. 판 위에 돌을 놓으며 생각을 정리하는 버릇이 있을 뿐이었다. 바둑판은 관저에 전부터 있던 것이었다.\n\n그는 검은 돌 네 개를 네 귀에 놓았다. 국회와 법원, 언론과 군이었다. 넘겨받을 때 그 돌들은 모두 끊어질 자리에 있었다. 그는 다섯 해 동안 국회라는 돌 하나를 살리는 데 가장 많은 수를 썼다. 흰 돌은 놓지 않았다.\n\n나머지 세 귀는 다른 사람들이 이어 주었다. 김부겸은 군과 법원의 일로 여러 번 자문에 응했다. 김동연은 예산 장부를 여는 법을 알려 주었다. 세 사람은 선거에서 싸웠지만 그 뒤로는 서로의 전화를 받았다. 언론의 일은 세 사람 누구도 다 풀지 못했다고 그는 생각했다.\n\n그는 돌을 하나씩 통에 담았다. 검은 돌 넷은 다른 돌과 섞이지 않게 따로 넣었다. 판은 다음 사람이 처음부터 다시 놓게 된다. 그는 서재의 불을 끄고 나오면서 비서에게 바둑판을 관저에 두고 가겠다고 말했다. 비서는 바둑판을 닦아 제자리에 놓았다."
 tfrkphn.7247.a:0 "서재의 문을 닫는다."
 TFRKPHN_kms_g9:0 "판을 넘기다"
 TFRKPHN_kms_g9_desc:0 "전후 회담의 결과를 국회가 따져 묻고 비준합니다. 대통령은 방청석에서 듣습니다."
 tfrkphn.7253.t:0 "판을 넘기다"
 tfrkphn.7253.d:0 "전후 회담에서 돌아온 대표단이 국회에 보고했다. 김무성은 본회의장의 대통령석이 아닌 방청석에 앉아 보고를 들었다. 경호원들은 그 자리를 말렸지만 그는 듣지 않았다. 방청석의 의자는 좁고 딱딱했다.\n\n보고는 야당 의원이 맡았다. 회담은 북쪽의 군정을 언제 끝내고 선거를 언제 치를지를 정했다. 대표단은 군정 기간을 한 해로 줄여 왔다. 그 약속에는 일곱 정당의 서명이 모두 들어 있었다. 정권이 바뀌어도 뒤집을 사람이 없는 약속이었다.\n\n질의는 세 시간 동안 이어졌다. 여당 의원이 야당 출신 대표를 몰아세웠고 야당 의원이 정부 대표를 몰아세웠다. 의장은 한 번도 정회를 선포하지 않았다. 비준 동의안은 이백사십 표로 통과됐다.\n\n표결이 끝나자 몇몇 의원이 방청석을 올려다보았다. 대통령은 이미 자리를 뜬 뒤였다. 그는 복도에서 만난 국회 직원에게 구내식당이 어디냐고 물었고, 그날 점심을 거기서 먹었다. 식판을 든 대통령을 알아본 직원들이 자리를 비켜 주려 하자 그는 손을 저었다. 그는 창가의 빈자리에 혼자 앉았다."
 tfrkphn.7253.a:0 "식판을 반납한다."
