 # [안내] sim_tabs_build.py가 만든다.
 TFRKPHN_sim_people_category:0 "민중 지지도"
 TFRKPHN_sim_people_category_desc:0 "§R개혁의 원동력인 민중의 지지는 절대적이지 않습니다.§!\n이들은 정부의 개혁이 너무 느려지거나 급진적일 때 개혁 정책에 대한 지지를 철회할 것입니다.\n\n민중 지지도 §Y[?TFRKPHN_sim_people|0]§! / 100\n마지막 개혁 통과 뒤 §Y[?TFRKPHN_sim_rf_last|0]§!일\n[TFRKPHN_sim_pace_state]\n\n개혁이 §Y180일§! 넘게 통과하지 못하면 다달이 지지도가 §R5§! 떨어집니다.\n개혁을 §Y90일§! 안에 잇달아 통과시키면 지지도가 §R10§! 떨어집니다."
 TFRKPHN_sim_people_top:0 "민중 지지도   §Y[?TFRKPHN_sim_people|0]§! / 100"
 TFRKPHN_sim_dem_category:0 "민주당과의 협력도"
 TFRKPHN_sim_dem_category_desc:0 "§R여소야대 국회의 특성상, 개혁 법안 통과를 위해서 타 정당들과의 연대는 필수적입니다.§!\n\n민주당 협력도 §Y[?TFRKPHN_sim_dem|0]§! / 100\n확보 의석은 정의당 의석에 민주당 의석 가운데 협력도만큼을 더한 수입니다."
 TFRKPHN_sim_dem_top:0 "민주당과의 협력도   §Y[?TFRKPHN_sim_dem|0]§! / 100"
 TFRKPHN_sim_seat_text:0 "확보 의석 §G[?TFRKPHN_sim_seats|0]§! / 300석   (빨간 줄: 과반 151석)"
 TFRKPHN_sim_pace_slow:0 "§R개혁이 멈췄다는 실망이 커지고 있습니다.§!"
 TFRKPHN_sim_pace_fast:0 "§R개혁이 너무 급하다는 불안이 퍼져 있습니다.§!"
 TFRKPHN_sim_pace_ok:0 "§G개혁의 속도에 대한 불만은 아직 크지 않습니다.§!"
 TFRKPHN_sim_pw_people:0 "촛불 광장에 선다"
 TFRKPHN_sim_pw_people_desc:0 "대통령이 주말 광장에 나가 시민들 앞에서 개혁안을 직접 설명합니다."
 TFRKPHN_sim_pp_union:0 "노동조합과 함께 거리로"
 TFRKPHN_sim_pp_union_desc:0 "양대 노총의 집회에 대통령이 함께 섭니다. 지지는 크게 모이지만 재계와 보수 언론은 거세게 반발합니다."
 TFRKPHN_sim_pp_forum:0 "국민 공개 토론회"
 TFRKPHN_sim_pp_forum_desc:0 "다음 개혁안을 놓고 전국을 돌며 공개 토론회를 엽니다. 개혁이 늦어지는 까닭을 직접 설명할 자리입니다."
 TFRKPHN_sim_pp_pace:0 "개혁의 속도를 설명한다"
 TFRKPHN_sim_pp_pace_desc:0 "너무 서두른다는 걱정에 답하는 담화를 냅니다. 다음 개혁까지의 일정과 보완책을 함께 내놓습니다."
 TFRKPHN_sim_pw_dem:0 "민주당 지도부와 만난다"
 TFRKPHN_sim_pw_dem_desc:0 "민주당 지도부를 만나 개혁 법안의 표결 협조를 구합니다."
 TFRKPHN_sim_dm_prog:0 "민주당 진보파 의원 설득"
 TFRKPHN_sim_dm_prog_desc:0 "민주당 안의 진보 성향 의원들을 따로 만나 개혁 법안의 공동 지지를 부탁합니다."
 TFRKPHN_sim_dm_bill:0 "법안 공동 발의"
 TFRKPHN_sim_dm_bill_desc:0 "다음 개혁 법안을 민주당과 함께 발의합니다. 표는 모이지만 정의당이 민주당 2중대가 됐다는 비판이 나옵니다."
 TFRKPHN_sim_dm_council:0 "여야 정책 협의체 구성"
 TFRKPHN_sim_dm_council_desc:0 "정의당과 민주당이 정기적으로 만나는 정책 협의체를 꾸립니다. 한 번만 할 수 있습니다."
 TFRKPHN_sim_add_people15_tt:0 "민중 지지도 §G+15§!"
 TFRKPHN_sim_add_people5_tt:0 "민중 지지도 §G+5§!"
 TFRKPHN_sim_add_people8_tt:0 "민중 지지도 §G+8§!\n'개혁이 너무 급하다'는 불안이 가라앉습니다."
 TFRKPHN_sim_sub_people5_tt:0 "민중 지지도 §R-5§!"
 TFRKPHN_sim_add_dem8_tt:0 "민주당 협력도 §G+8§!"
 TFRKPHN_sim_add_dem15_tt:0 "민주당 협력도 §G+15§!"
 TFRKPHN_sim_add_dem20_tt:0 "민주당 협력도 §G+20§!"
 TFRKPHN_sim_forum_tt:0 "§Y90일§! 동안 개혁이 늦어져도 민중 지지도가 떨어지지 않습니다."
 TFRKPHN_sim_council_tt:0 "정의당과 민주당의 정책 협의체가 생깁니다."
 TFRKPHN_sim_need_fast_tt:0 "'개혁이 너무 급하다'는 불안이 퍼져 있어야 합니다."
 TFRKPHN_sim_once_tt:0 "아직 협의체를 만들지 않았습니다."
 TFRKPHN_sim_pace_tt:0 "앞선 개혁이 통과한 지 §Y90일§!이 안 됐으면 민중 지지도가 §R10§! 떨어집니다."
