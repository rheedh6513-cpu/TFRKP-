 # 2027년 대선 303, 304, 305의 바뀐 글. ge2027_text_fix.py가 만든다.
 tfrkphn.303.w:0 "2027년 3월 3일, 양안전쟁이 끝나고 처음 치르는 대통령 선거가 열렸습니다. 한국이 지켜보는 동안 대만은 무너졌습니다.\n\n방관한 대가로 다음 차례는 한국이라는 공포가 퍼졌고, 중립을 택한 정부는 비겁했다는 비난을 받았습니다. 국민의힘은 책임을 누가 지느냐를 두고 갈라졌습니다. 분노한 보수층은 싸워 보지도 않고 물러선 배신자들이 나라를 망쳤다고 외친 우리공화당 조원진에게 표를 몰아주었습니다.\n\n개표 결과 조원진이 당선되었습니다. 강경한 반중 노선과 비상 통치, 국가 재무장을 내세우는 권위주의 보수 정권이 들어섭니다."
 tfrkphn.304.w:0 "2027년 3월 3일, 양안전쟁이 끝나고 처음 치르는 대통령 선거가 열렸습니다. 한국은 참전했지만 대만은 무너졌고, 한국군의 희생은 헛된 것이 되었습니다.\n\n전쟁을 밀어붙인 여당은 책임을 피할 수 없었습니다. 반대만 하고 다른 길을 내놓지 못한 제1야당도 표를 얻지 못했습니다. 두 당에 모두 등을 돌린 유권자들이 제3지대로 몰렸습니다.\n\n과학기술과 경제를 내세운 국민의당 안철수가 당선되었습니다. 새 정부는 전쟁으로 주저앉은 경제를 다시 세우고 균형 외교를 추진합니다."
 tfrkphn.305.w:0 "2027년 3월 3일, 양안전쟁이 끝나고 처음 치르는 대통령 선거가 열렸습니다. 한국은 참전하지 않았고 대만은 버텨 냈습니다.\n\n전쟁은 피했지만 동맹이 싸우는 동안 한국만 빠져 있었다는 사실이 남았습니다. 미국과 일본에서는 한국을 믿어도 되느냐는 말이 나왔고, 보수층은 정부가 동맹을 저버렸다고 분노했습니다.\n\n동맹 복원과 내부의 적을 내세운 자유와혁신의 황교안이 당선되었습니다. 새 정부는 반공과 질서를 앞세운 강경 노선으로 갑니다."
