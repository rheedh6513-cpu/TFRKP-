l_korean:
 gwangju:0 "광주"
 incheon:0 "인천"
 jeju:0 "제주"
 ulsan:0 "울산"
 daejeon:0 "대전"
 daegu:0 "대구"
 sejong:0 "세종"
 gwangju_desc:0 "----\n§9호남 최대의 도시 광주는 무등산의 품에 안겨 예술과 민주주의의 정신을 함께 키워 온 도시입니다. 1896년 전라남도 도청이 놓인 이래 호남의 행정과 상업, 교육의 중심지로 성장했으며, 1980년 5월 시민들이 일으킨 민주화운동은 대한민국 민주주의의 역사에 지워지지 않는 발자취를 남겼습니다.\n\n오늘날 광주는 자동차 산업을 기반으로 인공지능이라는 새로운 성장 동력을 찾아 나선 도시입니다. 2020년 인공지능 중심 도시를 선언한 뒤 연구 단지와 데이터센터가 들어서고 있으며, 금남로와 충장로의 오래된 거리, 국립아시아문화전당의 현대적인 공간이 어우러져 있습니다. 광주는 아픈 기억을 자부심으로 바꾸어 낸 시민들의 힘으로 내일을 향해 나아가는 곳입니다.§!\n\n§p빛고을 광주§!"
 incheon_desc:0 "----\n§9대한민국의 관문 인천은 바다와 하늘을 통해 세계와 만나는 역동적인 국제도시입니다. 1883년 개항과 함께 서양 문물이 가장 먼저 들어온 이곳에는 차이나타운과 자유공원이 그 시절의 흔적으로 남아 있습니다. 1950년 9월 15일 유엔군의 인천상륙작전은 전쟁의 흐름을 뒤바꾼 결정적인 순간이었습니다.\n\n오늘날 인천은 2001년 문을 연 인천국제공항과 인천항을 양 날개로 삼아 사람과 물자가 끊임없이 오가는 동북아시아의 허브로 자리 잡았습니다. 바다 위를 가로지르는 인천대교와 송도국제도시의 미래적인 스카이라인, 개항장의 고풍스러운 골목이 한 도시 안에 공존합니다. 인천은 가장 먼저 문을 열었던 도시답게 언제나 새로운 것을 받아들이며 성장하는 곳입니다.§!\n\n§p하늘과 바다의 문§!"
 jeju_desc:0 "----\n§9한반도 남쪽 바다에 떠 있는 제주는 화산이 빚어낸 천혜의 자연을 간직한 대한민국 최대의 섬입니다. 섬 한가운데 우뚝 솟은 한라산과 그 둘레에 흩어진 수많은 오름, 땅속 깊이 이어진 용암 동굴은 2007년 유네스코 세계자연유산에 등재되며 그 가치를 세계에 알렸습니다.\n\n오늘날 제주는 2006년 특별자치도로 출범한 이래 폭넓은 자치 권한을 바탕으로 국제적인 관광 휴양지로 발돋움했습니다. 성산일출봉의 장엄한 일출과 에메랄드빛 바다, 검은 돌담 사이로 펼쳐진 감귤밭, 그리고 거친 물살을 가르는 해녀들의 숨비소리는 제주만의 독특한 풍경을 이룹니다. 돌과 바람, 그리고 사람이 함께 만들어 온 제주는 누구에게나 쉼이 되어 주는 섬입니다.§!\n\n§p혼저 옵서예§!"
 ulsan_desc:0 "----\n§9대한민국 산업화의 심장 울산은 동남쪽 해안에서 쉼 없이 돌아가는 공장의 불빛으로 나라 경제를 이끌어 온 도시입니다. 1962년 특정공업지구로 지정되며 공업센터의 첫 삽을 뜬 이곳은 1964년 첫 정유공장 가동을 시작으로 한적한 어촌에서 세계적인 공업 도시로 탈바꿈했습니다.\n\n오늘날 울산은 석유화학과 자동차, 조선이라는 세 기둥을 갖춘 대한민국 최대의 산업 도시입니다. 1997년 광역시로 승격한 뒤에도 해안을 따라 늘어선 거대한 공장과 도크, 수출 부두를 가득 메운 자동차는 이 도시의 저력을 보여 줍니다. 도심을 가로지르는 태화강과 새해 첫 해를 맞는 간절곶은 산업 도시의 또 다른 얼굴입니다. 울산은 땀과 기술로 내일을 만들어 가는 곳입니다.§!\n\n§p산업수도 울산§!"
 daejeon_desc:0 "----\n§9국토의 중심에 자리한 대전은 사통팔달의 교통과 첨단 과학이 만나는 대한민국의 과학 수도입니다. 서울에서 영남과 호남으로 향하는 길이 갈라지는 이곳은 한국 전쟁 당시 잠시 임시 수도 역할을 맡았으며, 1973년 대덕이 연구 도시의 터전으로 정해지면서 새로운 운명을 맞이했습니다.\n\n오늘날 대전은 1992년 준공된 대덕연구단지와 2005년 지정된 연구개발특구를 중심으로 수많은 연구소와 대학, 벤처 기업이 모여 있는 혁신의 요람입니다. 1998년 정부대전청사가 문을 열며 행정 기능까지 더해졌고, 갑천을 따라 펼쳐진 연구 단지는 대한민국 과학 기술의 오늘을 보여 줍니다. 대전은 조용하지만 꾸준하게 나라의 미래를 설계하는 곳입니다.§!\n\n§p한밭 대전§!"
 daegu_desc:0 "----\n§9영남 내륙의 중심 대구는 팔공산과 비슬산이 감싸 안은 분지 위에서 사백 년 넘게 영남의 수부 역할을 해 온 유서 깊은 도시입니다. 1601년 경상도 감영이 옮겨 온 이래 행정과 상업의 중심지로 번성했으며, 근대에 들어서는 섬유 산업을 앞세워 대한민국 산업화의 한 축을 맡았습니다.\n\n오늘날 대구는 섬유의 도시라는 오랜 이름 위에 기계와 자동차 부품, 로봇과 같은 새로운 산업을 더해 가고 있습니다. 1995년 광역시가 된 이 도시에는 활기 넘치는 서문시장과 젊음의 거리 동성로, 도심을 굽어보는 팔공산의 풍광이 어우러져 있습니다. 뜨거운 여름만큼이나 열정적인 사람들이 살아가는 대구는 전통과 변화가 함께 숨 쉬는 곳입니다.§!\n\n§p달구벌 대구§!"
 sejong_desc:0 "----\n§9대한민국의 행정 중심 세종은 국토의 균형 발전이라는 꿈을 안고 새롭게 세워진 계획도시입니다. 2002년 행정수도 공약에서 출발한 이 도시는 2004년 헌법재판소의 위헌 결정이라는 고비를 넘어 행정중심복합도시로 다시 태어났고, 2007년 첫 삽을 뜬 지 다섯 해 만인 2012년 세종특별자치시로 출범했습니다.\n\n오늘날 세종은 국무총리실을 비롯한 중앙 부처들이 자리한 대한민국 행정의 중심입니다. 금강을 끼고 고리 모양으로 펼쳐진 시가지와 길게 이어진 정부세종청사, 도심 한가운데의 세종호수공원은 이 도시만의 독특한 풍경을 만들어 냅니다. 세종은 허허벌판 위에서 시작해 나라의 내일을 준비하는 가장 젊은 도시입니다.§!\n\n§p행정중심복합도시§!"
 chuncheon:0 "춘천"
 chuncheon_desc:0 "----\n§9소양강과 북한강이 만나는 물가에 자리한 춘천은 아침마다 물안개가 내려앉는 호반의 도시입니다. 맥국의 옛 터로 전해지는 이곳은 오래전부터 강원 영서의 중심지였으며, 강원도의 도청이 자리한 행정의 고장으로 이어져 왔습니다. 소양강댐이 품은 거대한 호수는 수도권의 물을 지키는 든든한 둑이기도 합니다.\n\n오늘날 춘천은 서울에서 전철과 고속열차로 한 시간 남짓이면 닿는 가까운 도시가 되었습니다. 주말이면 기차가 젊은이들을 내려놓고, 명동 골목에는 닭갈비 굽는 연기와 막국수 삶는 김이 피어오릅니다. 의암호를 따라 달리는 자전거 길과 호수 위의 섬들은 도시의 쉼터가 되어 줍니다. 춘천은 물과 함께 숨 쉬며 사람을 맞이하는 곳입니다.§!\n\n§p호반의 도시§!"
 gangneung:0 "강릉"
 gangneung_desc:0 "----\n§9대관령을 넘어서면 바다 냄새가 먼저 마중을 나오는 강릉은 영동 지방의 오랜 중심지입니다. 오죽헌과 선교장이 남아 있는 이곳은 율곡과 신사임당을 길러 낸 선비의 고장이며, 해마다 단오가 되면 천 년 넘게 이어져 온 단오제의 북소리가 남대천을 따라 울려 퍼집니다. 경포 호수에는 달이 다섯 개 뜬다는 옛말이 전해집니다.\n\n오늘날 강릉은 동계 올림픽의 빙상 경기를 치러 낸 도시이자, 서울에서 고속열차로 두 시간이면 닿는 동해안의 관문이 되었습니다. 안목 바닷가의 커피 거리에는 사계절 볶은 원두 향이 흐르고, 초당 마을의 순두부와 정동진의 해돋이는 여행자들을 불러 모읍니다. 강릉은 산과 바다, 옛것과 새것이 함께 머무는 곳입니다.§!\n\n§p솔향 강릉§!"
 pohang:0 "포항"
 pohang_desc:0 "----\n§9영일만을 끼고 자리한 포항은 이 나라의 쇠를 녹여 온 철강의 도시입니다. 작은 어촌이던 바닷가 모래밭 위에 제철소의 첫 용광로가 불을 밝힌 뒤로, 포항에서 쏟아진 쇳물은 배와 자동차, 다리와 빌딩이 되어 대한민국 산업화의 뼈대를 이루었습니다. 새벽이면 영일만의 하늘이 용광로 불빛으로 붉게 물듭니다.\n\n오늘날 포항은 철강을 넘어 이차전지 소재와 신소재 연구로 새로운 미래를 준비하고 있습니다. 연구 중심 대학과 가속기 연구소가 들어선 이 도시는 과학 기술의 거점으로도 자리를 잡았습니다. 호미곶 바다에 솟은 상생의 손은 해마다 가장 먼저 새해 해를 맞고, 겨울이면 덕장마다 과메기가 바닷바람에 걸려 마릅니다. 포항은 불과 바다가 함께 빚어 온 곳입니다.§!\n\n§p영일만의 불빛§!"
 mungyeong:0 "문경"
 mungyeong_desc:0 "----\n§9소백산맥의 험준한 산줄기 아래 자리한 문경은 영남과 한양을 잇던 길목의 고장입니다. 새도 넘기 힘들다는 문경새재에는 과거를 보러 가던 선비들이 걷던 옛 돌길과 세 개의 관문이 아직 남아 있으며, 고개마다 그들이 남긴 이야기가 전해집니다. 근대에 들어서는 석탄을 캐는 탄광 도시로 나라의 겨울을 데웠습니다.\n\n오늘날 문경은 탄광이 문을 닫은 자리에 석탄박물관과 철로자전거를 들이며 관광의 도시로 새롭게 태어났습니다. 새재 길은 사계절 걷는 이들로 붐비고, 오래된 가마에서는 지금도 장작불로 찻사발을 구워 냅니다. 사과밭과 오미자 밭이 펼쳐진 산골 마을은 고요한 정취를 간직하고 있습니다. 문경은 옛길 위에서 오늘을 걸어가는 곳입니다.§!\n\n§p옛길의 고장§!"
 changwon:0 "창원"
 changwon_desc:0 "----\n§9남해를 마주한 창원은 처음부터 계획하여 세운 대한민국의 대표적인 기계 공업 도시입니다. 바둑판처럼 반듯하게 그어진 길과 넓은 녹지 위로 국가 산업 단지가 들어서면서, 이곳의 공장들은 기계와 방위 산업, 원전 설비를 만들어 나라의 산업을 받쳐 왔습니다. 이웃한 마산과 진해는 오랜 항구와 군항의 역사를 지니고 있습니다.\n\n오늘날 창원은 마산, 진해와 하나로 합쳐져 경상남도 최대의 도시가 되었습니다. 출근 시간이면 공단으로 향하는 행렬이 길게 이어지고, 마산 어시장에는 남해의 싱싱한 해산물이 가득합니다. 봄이면 진해의 거리마다 벚꽃이 흐드러져 온 나라 사람들을 불러 모읍니다. 창원은 땀 흘려 만든 기계와 꽃이 함께 피는 곳입니다.§!\n\n§p기계 공업의 요람§!"
 jinju:0 "진주"
 jinju_desc:0 "----\n§9남강이 굽이쳐 흐르는 진주는 천 년 넘게 경상 서부의 중심이었던 유서 깊은 고장입니다. 강가 벼랑 위에 선 진주성과 촉석루는 큰 전쟁 때 성을 지키다 쓰러진 사람들의 넋을 품고 있으며, 적장을 안고 강물에 몸을 던진 의기 논개의 이야기는 지금도 의암 바위와 함께 전해집니다. 진주는 예로부터 충절과 풍류의 고장이었습니다.\n\n오늘날 진주는 공공 기관들이 옮겨 온 혁신 도시와 항공 우주 산업, 여러 대학을 품은 교육 도시로 성장하고 있습니다. 가을밤이면 남강 위로 수많은 유등이 떠올라 오래된 성벽을 강물에 비추고, 골목마다 진주비빔밥과 냉면을 찾는 발길이 이어집니다. 진주는 옛 정신을 등불처럼 밝혀 두고 내일로 나아가는 곳입니다.§!\n\n§p남강의 유등§!"
 dangjin:0 "당진"
 dangjin_desc:0 "----\n§9서해의 바닷바람을 마주한 당진은 너른 들판과 바다를 함께 품은 충청 서해안의 고장입니다. 예로부터 기름진 평야에서 거둔 쌀로 이름이 높았으며, 바닷길을 통해 중국과 교류하던 포구가 있던 곳이기도 합니다. 한때 조용한 농어촌이던 당진은 바닷가에 철강 공장이 들어서면서 전혀 다른 얼굴을 갖게 되었습니다.\n\n오늘날 당진은 거대한 고로가 밤낮없이 쇳물을 쏟아내는 철강의 도시이자, 수도권에 전기를 보내는 발전소가 늘어선 에너지의 고장입니다. 서해대교가 놓이면서 수도권과 가까워진 이곳에는 공장과 아파트가 빠르게 들어서고 있습니다. 왜목 마을에서는 서해에서 드물게 바다 위로 떠오르는 해를 볼 수 있습니다. 당진은 쌀과 철을 함께 키우는 곳입니다.§!\n\n§p쌀과 철의 고장§!"
 mokpo:0 "목포"
 mokpo_desc:0 "----\n§9영산강이 바다와 만나는 하구에 자리한 목포는 다도해로 열린 서남해안의 항구 도시입니다. 일찍이 항구를 연 이곳은 호남의 쌀과 목화를 바다 건너로 실어 나르며 크게 번성했고, 원도심의 골목에는 그 시절 붉은 벽돌 건물과 낡은 창고들이 지금도 남아 있습니다. 목포의 눈물이라는 노래처럼 이 도시는 오랫동안 이별과 그리움의 항구였습니다.\n\n오늘날 목포는 바다 위를 가로지르는 해상 케이블카와 다리들로 섬과 뭍을 이으며 새롭게 단장하고 있습니다. 유달산 바위 위에 서면 다도해의 섬들이 바다 위에 점점이 흩어져 있고, 항구의 식당마다 낙지와 민어, 홍어가 상에 오릅니다. 목포는 바다의 맛과 옛 거리의 정취가 함께 남아 있는 곳입니다.§!\n\n§p다도해의 관문§!"
 suncheon:0 "순천"
 suncheon_desc:0 "----\n§9남해의 깊은 만을 품은 순천은 자연과 사람이 함께 살아온 생태의 도시입니다. 끝없이 펼쳐진 순천만의 갯벌과 갈대밭은 세계적으로 손꼽히는 연안 습지로, 겨울이면 흑두루미 떼가 그 위를 낮게 날아 내려앉습니다. 송광사와 선암사 같은 오래된 절과 낙안읍성의 초가 마을은 이 고장의 깊은 역사를 보여 줍니다.\n\n오늘날 순천은 갯벌을 지켜 낸 노력을 바탕으로 국가 정원을 품은 정원의 도시가 되었습니다. 해마다 수많은 사람들이 정원과 습지를 찾아오고, 이웃한 광양과 여수의 산업 단지를 잇는 전남 동부의 중심 도시로 성장하고 있습니다. 해 질 녘 용산 전망대에서 내려다보는 갯벌의 물길은 붉게 빛납니다. 순천은 자연을 지켜 내일을 가꾸는 곳입니다.§!\n\n§p대한민국 생태 수도§!"
