l_korean:
 # 홍준표 루트: 유승민 이야기. yoo_hong_build.py가 만든다.
 tfrkphn.513.t:0 "경제부총리"
 tfrkphn.513.d:0 "2021년 10월 29일, 국민의힘 경선 토론에서 홍준표와 유승민이 마주 섰습니다. 유승민이 경제 정책을 설명하자 홍준표는 경제부총리를 하면 안 되겠느냐고 물었습니다. 유승민은 자신이 대통령이 되면 홍준표를 법무부장관에 임명할까 싶다고 받았습니다. 방청석이 웃었습니다.\n\n취임 닷새째 되는 날, 대통령은 그 농담을 진담으로 바꿨습니다. 비서실장을 통해 유승민에게 경제부총리 자리를 제안했습니다.\n\n답은 그날 저녁에 왔습니다. 유승민은 사양했습니다. 공매도와 모병제, 주택 공약까지 토론에서 반대한 것이 너무 많다고 했습니다. 반대하던 사람이 내각에 앉으면 자신도 정부도 말이 꼬인다고 했습니다. 밖에서 할 말을 하는 쪽이 정부에 더 쓸모가 있을 것이라고 했습니다."
 tfrkphn.513.a:0 "쓴소리는 듣겠다"
 tfrkphn.513.b:0 "그 자리는 실무자로 채운다"
 tfrkphn.514.t:0 "누가 군대에 가는가"
 tfrkphn.514.d:0 "정부가 모병제 확대안을 내놓은 주에 유승민이 방송에 나왔습니다.\n\n그는 경선 토론에서 했던 질문을 다시 꺼냈습니다. 그때 유승민은 4년 전 징병제를 말하던 홍준표가 왜 생각을 바꿨느냐고 물었습니다. 홍준표는 병력 자원이 줄고 있고 모병제가 세계의 흐름이라고 답했습니다. 해병대 지원 경쟁률이 10대 1이라는 말도 했습니다.\n\n유승민은 걱정이 그대로라고 말했습니다. 월급을 보고 입대하는 군대가 되면 형편이 어려운 집 아들부터 총을 들게 된다고 했습니다. 전쟁을 막 치른 나라에서는 그 차이가 목숨의 차이가 된다고 했습니다.\n\n국방부는 다음 날 지원병의 출신 지역과 가구 소득을 해마다 공개하겠다고 밝혔습니다."
 tfrkphn.514.a:0 "복무 보상을 함께 올린다"
 tfrkphn.514.b:0 "정예군이 답이다"
 tfrkphn.515.t:0 "10년 뒤의 집값"
 tfrkphn.515.d:0 "토지임대부 주택의 첫 분양 공고가 난 날, 유승민이 글을 올렸습니다.\n\n땅은 나라가 갖고 집만 파는 이 주택은 홍준표의 경선 공약이었습니다. 유승민은 토론 때부터 한 가지를 짚었습니다. 10년이 지나 소유권이 넘어가면 시세와의 차익이 당첨된 사람에게 통째로 간다는 것이었습니다. 홍준표는 10년을 산 사람의 소유권은 인정해야 한다고 맞섰습니다.\n\n유승민의 글은 숫자로 채워져 있었습니다. 첫 단지의 분양가와 둘레 시세, 그리고 10년 뒤의 예상 차익이었습니다. 그는 집을 싸게 주는 것은 좋지만 그 값을 누가 치르는지는 밝혀야 한다고 썼습니다.\n\n국토교통부는 해명 자료를 냈습니다. 기자들은 해명 자료보다 유승민의 표를 더 많이 실었습니다."
 tfrkphn.515.a:0 "되팔 때는 나라에 팔게 한다"
 tfrkphn.515.b:0 "10년을 산 사람의 집이다"
 tfrkphn.516.t:0 "깎은 세금"
 tfrkphn.516.d:0 "법인세 인하안이 국회를 통과한 주말에 유승민이 신문에 글을 실었습니다.\n\n유승민은 2015년 4월 원내대표 연설에서 증세 없는 복지는 허구라고 말했습니다. 그 말로 그는 당시 청와대와 멀어졌습니다. 이번 글도 같은 자리에서 출발했습니다. 깎은 세금은 누군가 메워야 한다는 것이었습니다.\n\n그는 전쟁에 쓴 돈과 보훈에 쓸 돈을 먼저 적었습니다. 그다음에 줄어드는 법인세수를 적었습니다. 두 숫자 사이의 빈칸은 비워 두었습니다. 정부가 채워야 할 칸이라고 했습니다.\n\n여당 의원들은 내부 총질이라고 했습니다. 기획재정부는 말이 없었습니다."
 tfrkphn.516.a:0 "성장이 세수를 메운다"
 tfrkphn.516.b:0 "감면에 투자 조건을 붙인다"
 tfrkphn.517.t:0 "유승민의 채점표"
 tfrkphn.517.d:0 "임기 마지막 해에 한 방송이 유승민에게 홍준표 정부 4년의 점수를 물었습니다.\n\n유승민은 과목을 나눠 답했습니다. 안보에는 합격점을 줬습니다. 전쟁을 치르고도 나라가 흔들리지 않았다고 했습니다. 경제에는 절반을 줬습니다. 기업이 뛰게 한 것은 맞지만 재벌은 손대지 않고 넘어갔다고 했습니다. 그 숙제는 다음 정부로 넘어갔다고 했습니다.\n\n진행자는 경선 토론의 농담을 꺼냈습니다. 경제부총리를 맡았다면 달랐겠느냐는 물음이었습니다. 유승민은 웃고 답하지 않았습니다.\n\n방송이 나간 밤에 대통령이 글을 올렸습니다. 유승민의 채점이 박하다고 썼습니다. 틀린 데는 없다는 말도 덧붙였습니다."
 tfrkphn.517.a:0 "남은 숙제는 다음 사람에게"
