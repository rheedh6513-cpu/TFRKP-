l_korean:
 # 홍준표 루트: 야당의 얼굴. opp_hong_build.py가 만든다.
 tfrkphn.583.t:0 "패자의 전화"
 tfrkphn.583.d:0 "대선 다음 날 아침 이낙연이 전화를 걸어 왔습니다. 그는 결과를 받아들인다고 했고, 지지해 준 사람들에게 미안하다는 말을 먼저 한 다음 당선을 축하했다고 합니다.\n\n대통령은 그 전화가 어떤 것인지 압니다. 2017년 5월 9일 밤 개표가 열에 하나도 끝나지 않았을 때 그는 선거 결과를 수용한다고 말했습니다. 다섯 해 전에 자기가 하던 말을 이번에는 듣는 쪽이 되었습니다.\n\n이낙연은 2019년 10월 28일에 가장 오래 일한 국무총리가 된 사람입니다. 통화 끝에 그는 한 가지를 부탁했다고 합니다. 선거에서 진 쪽의 대표를 정해진 날짜에 만나 달라는 것이었습니다.\n\n대통령은 그러겠다고 답했습니다. 우리는 달력에 석 달에 한 번씩 표시를 해 두었습니다."
 tfrkphn.583.a:0 "정해진 날에 만난다"
 tfrkphn.583.b:0 "필요할 때 만난다"
 tfrkphn.584.t:0 "당권"
 tfrkphn.584.d:0 "대선에서 진 더불어민주당이 새 대표를 뽑았습니다. 2021년 10월 경선에서 이낙연에게 졌던 이재명입니다. 진 후보를 도왔던 의원들은 당직에서 물러났고, 그 자리는 한 주 만에 이재명의 사람들로 채워졌습니다.\n\n이재명은 성남의 공장에서 일하며 검정고시로 대학에 갔고, 사법시험에 붙은 뒤 인권과 노동 사건을 맡다가 성남시장과 경기도지사를 지냈습니다. 2021년 가을에 불거진 대장동 의혹은 그를 경선에서 넘어뜨렸지만 그를 따르는 사람들을 흩어 놓지는 못했습니다.\n\n전당대회장 밖에는 그의 이름을 외치는 사람들이 늦게까지 남아 있었다고 합니다. 그는 수락 연설에서 정권을 심판하겠다고 했고, 바다 건너의 싸움에는 끼어들지 않겠다는 것을 당의 방침으로 못 박았습니다. 다른 목소리를 낸 의원 몇은 그날 밤 문자를 수천 통씩 받았습니다.\n\n대통령은 연설을 보고 나서 저 사람은 지는 법을 한 번 배웠으니 두 번은 지지 않으려 들 것이라고 했다고 합니다. 우리는 앞으로 국회에서 올라올 반대가 모두 이 사람의 손을 거쳐 올 것이라고 보고했습니다."
 tfrkphn.584.a:0 "야당 대표로 대한다"
 tfrkphn.584.b:0 "상대는 분명해졌다"
 tfrkphn.585.t:0 "뜻밖의 찬성"
 tfrkphn.585.d:0 "2017년 2월 8일 성남시장이던 이재명은 사법시험이 우리 사회에 계층 이동의 기회를 부여한다고 말했습니다. 국민 다수가 사법시험과 로스쿨이 함께 있기를 바란다는 말도 했습니다. 같은 당의 문재인 전 대표는 로스쿨을 만든 정부 사람으로서 되돌리기 어렵다는 입장이었습니다.\n\n정부가 사법시험 부활안을 내자 야당 안에서는 반대가 먼저 나왔습니다. 이재명 대표는 그 반대를 당론으로 묶지 않았다고 합니다. 자기가 예전에 한 말을 뒤집을 수는 없다는 것이 내놓은 이유였습니다. 우리 가운데에는 고시생과 그 부모들의 표를 여당에 통째로 넘겨주지 않으려는 계산으로 읽는 사람이 더 많습니다.\n\n법안은 야당 의원 일부의 찬성표를 얻었습니다. 표결 결과를 보고받은 대통령은 정권 심판을 외치는 사람에게서 표를 받을 줄은 몰랐다고 했다고 합니다."
 tfrkphn.585.a:0 "고마운 일은 고맙다고 한다"
 tfrkphn.585.b:0 "그래도 싸움은 계속된다"
 tfrkphn.586.t:0 "표결 전날 밤"
 tfrkphn.586.d:0 "대만지원법 표결 전날 밤 국회 본청의 야당 대표실에는 불이 늦게까지 켜져 있었습니다. 우리가 이 이야기를 들은 것은 한참 뒤의 일이고, 전해 준 사람은 그날 그 방에 있었다고 합니다.\n\n이재명 대표는 법안이 어느 쪽으로 가든 손해 볼 것이 없다고 말했다고 합니다. 법이 통과되면 전사자가 나올 때마다 정부가 값을 치르고, 막히면 대만이 무너진 책임이 대통령에게 돌아간다는 계산이었습니다.\n\n반대 토론은 김병주 의원에게 맡겼습니다. 군복을 입었던 사람이 말해야 반대가 겁쟁이의 말로 들리지 않는다는 이유였다고 합니다. 김 의원이 헌법 60조를 읽겠다고 하자 대표는 좋은 생각이라고만 했습니다.\n\n방을 나서던 한 의원이 대만이 정말로 무너지면 어떻게 하느냐고 물었습니다. 대표는 대답 대신 내일 표결에서 이탈하는 사람의 이름을 적어 오라고 했다고 합니다."
 tfrkphn.586.a:0 "날이 밝았다"
