l_korean:
 # 메가시티 만들기. mega_build.py가 만든다.
 TFRKPHN_oh_mega_category:0 "메가시티 만들기"
 TFRKPHN_oh_mega_category_desc:0 "모든 것이 서울로 몰리는 나라에서 지방은 줄어들기만 했습니다. 수도권에 맞설 만한 덩치를 지방에도 만드는 것이 이 사업입니다.\n\n권역을 고르면 공사가 60일 동안 이어지고, 끝나면 그 권역이 한 단계 올라갑니다. 단계가 오를 때마다 그 지역의 등급이 오르고 길과 공장, 업무 지구가 들어섭니다. 다섯 권역을 모두 5단계까지 올리면 공사가 끝납니다."
 TFRKPHN_mega_t_top:0 "메가시티 만들기"
 TFRKPHN_mega_t_total:0 "전체 공정 §Y[?TFRKPHN_mega_total|0]§! / 25"
 TFRKPHN_mega_ev_ok:0 "공사를 마쳤다"
 TFRKPHN_mega_done_1_tt:0 "수도권 완성: §Y메가시티 경제권§!의 기업 가치 §G+3§! (백분율)"
 TFRKPHN_mega_done_2_tt:0 "충청권 완성: §Y메가시티 경제권§!에 연구 속도 §G+3§! (백분율)"
 TFRKPHN_mega_done_3_tt:0 "호남권 완성: 전라에 §Y에너지 농장§! §G2개§!"
 TFRKPHN_mega_done_4_tt:0 "대구경북 완성: 대구에 §Y군수 공장§! §G2개§!"
 TFRKPHN_mega_done_5_tt:0 "부울경 완성: 부산에 §Y조선소§! §G2개§!"
 TFRKPHN_mega_economy:0 "메가시티 경제권"
 TFRKPHN_mega_economy_desc:0 "권역이 한 단계씩 올라갈 때마다 기업과 사람이 그 권역으로 모입니다. 다섯 권역의 단계를 모두 더한 만큼 효과가 커집니다."
 TFRKPHN_mega_wait_tt:0 "§Y60일§! 동안 공사가 이어지고, 그동안 §Y민간 공장 3개§!가 이 공사에 묶입니다."
 TFRKPHN_mega_up_tt:0 "이 권역이 §G한 단계§! 올라가고, 권역 안 모든 지역의 §Y지역 등급§!이 한 단계 오릅니다.\n1단계: 광역 교통망 (기반 시설)\n2단계: 산업 단지와 에너지 농장\n3단계: 업무 지구\n4단계: 산업 단지, 에너지 농장, 기반 시설\n5단계: 업무 지구와 산업 단지, 안정도 §G+1§!\n\n단계가 오를 때마다 §Y메가시티 경제권§! 변동치가 커집니다: 기업 가치 §G+0.2§!, 소득 성장 §G+0.2§!, 건설 속도 §G+0.4§!, 소비재 공장 §G-0.6§! (모두 백분율)\n\n권역이 §Y5단계§!에 닿으면 권역마다 다른 보상이 있습니다.\n수도권: 기업 가치 / 충청권: 연구 속도 / 호남권: 에너지 농장 / 대구경북: 군수 공장 / 부울경: 조선소"
 TFRKPHN_mega_n1:0 "수도권"
 TFRKPHN_mega_v1:0 "§Y[?TFRKPHN_mega_s1|0]§! / 5단계"
 TFRKPHN_mega_d1:0 "수도권: [GetTFRKPHNMegaP1]"
 TFRKPHN_mega_d1_desc:0 "[GetTFRKPHNMegaP1Desc]\n\n서울비전 2030은 서울을 세계 5대 도시로 올리는 것을 목표로 삼았습니다. 서울과 경기, 인천을 한 생활권으로 묶어 그 목표를 수도권 전체의 것으로 넓힙니다."
 TFRKPHN_mega_p1_1:0 "광역급행철도"
 TFRKPHN_mega_p1_1_d:0 "§Y1단계 사업: 광역급행철도§!\n수도권을 30분 안에 잇는 급행 철도입니다. A노선은 2018년 12월 27일에 첫 삽을 떴습니다. 남은 노선까지 이어 수도권을 한 생활권으로 묶습니다."
 tfrkphn.610.t:0 "광역급행철도"
 tfrkphn.610.d:0 "수도권 메가시티의 1단계 공사가 끝났습니다.\n\n수도권을 30분 안에 잇는 급행 철도입니다. A노선은 2018년 12월 27일에 첫 삽을 떴습니다. 남은 노선까지 이어 수도권을 한 생활권으로 묶습니다."
 TFRKPHN_mega_p1_2:0 "3기 신도시"
 TFRKPHN_mega_p1_2_d:0 "§Y2단계 사업: 3기 신도시§!\n2018년 12월 19일 정부는 남양주와 하남, 인천에 새 도시를 짓겠다고 발표했습니다. 전쟁으로 멈춘 공사를 다시 돌리고 입주 날짜를 못 박습니다."
 tfrkphn.611.t:0 "3기 신도시"
 tfrkphn.611.d:0 "수도권 메가시티의 2단계 공사가 끝났습니다.\n\n2018년 12월 19일 정부는 남양주와 하남, 인천에 새 도시를 짓겠다고 발표했습니다. 전쟁으로 멈춘 공사를 다시 돌리고 입주 날짜를 못 박습니다."
 TFRKPHN_mega_p1_3:0 "여의도 디지털금융특구"
 TFRKPHN_mega_p1_3_d:0 "§Y3단계 사업: 여의도 디지털금융특구§!\n서울비전 2030은 여의도를 특구로 묶어 외국 금융기관을 불러들이겠다고 했습니다. 홍콩을 떠난 자본이 내릴 자리를 만듭니다."
 tfrkphn.612.t:0 "여의도 디지털금융특구"
 tfrkphn.612.d:0 "수도권 메가시티의 3단계 공사가 끝났습니다.\n\n서울비전 2030은 여의도를 특구로 묶어 외국 금융기관을 불러들이겠다고 했습니다. 홍콩을 떠난 자본이 내릴 자리를 만듭니다."
 TFRKPHN_mega_p1_4:0 "한강 르네상스"
 TFRKPHN_mega_p1_4_d:0 "§Y4단계 사업: 한강 르네상스§!\n시장 시절 그가 한강 둔치를 고치던 사업입니다. 강을 따라 걷는 길과 배가 닿는 곳을 서해까지 잇습니다."
 tfrkphn.613.t:0 "한강 르네상스"
 tfrkphn.613.d:0 "수도권 메가시티의 4단계 공사가 끝났습니다.\n\n시장 시절 그가 한강 둔치를 고치던 사업입니다. 강을 따라 걷는 길과 배가 닿는 곳을 서해까지 잇습니다.\n\n서울은 육백 년 넘게 우리의 수도였습니다. 조선의 한양에서 시작한 이 도시는 한국 전쟁으로 폐허가 됐다가 다시 일어섰고, 우리는 그 시절을 한강의 기적이라고 부릅니다. 정부와 큰 기업의 본사가 모두 이곳에 있습니다. 그렇게 모든 것이 모인 도시의 한가운데를 흐르는 강을, 우리는 이번에 시민이 걸어서 닿을 수 있는 곳으로 바꿉니다."
 TFRKPHN_mega_p1_5:0 "용산국제업무지구"
 TFRKPHN_mega_p1_5_d:0 "§Y5단계 사업: 용산국제업무지구§!\n2007년 서울시는 용산 철도 정비창 자리에 31조 원짜리 업무 지구를 짓겠다고 발표했습니다. 사업은 2013년에 무산되었고 땅은 그 뒤로 비어 있었습니다. 스무 해 만에 그 자리에 건물이 올라갑니다."
 tfrkphn.614.t:0 "용산국제업무지구"
 tfrkphn.614.d:0 "수도권 메가시티의 5단계 공사가 끝났습니다.\n\n2007년 서울시는 용산 철도 정비창 자리에 31조 원짜리 업무 지구를 짓겠다고 발표했습니다. 사업은 2013년에 무산되었고 땅은 그 뒤로 비어 있었습니다. 스무 해 만에 그 자리에 건물이 올라갑니다."
 TFRKPHN_mega_mk1_tt:0 "§Y수도권 메가시티§!\n지금 §Y[?TFRKPHN_mega_s1|0]§!단계\n\n서울비전 2030은 서울을 세계 5대 도시로 올리는 것을 목표로 삼았습니다. 서울과 경기, 인천을 한 생활권으로 묶어 그 목표를 수도권 전체의 것으로 넓힙니다."
 TFRKPHN_mega_n2:0 "충청권"
 TFRKPHN_mega_v2:0 "§Y[?TFRKPHN_mega_s2|0]§! / 5단계"
 TFRKPHN_mega_d2:0 "충청권: [GetTFRKPHNMegaP2]"
 TFRKPHN_mega_d2_desc:0 "[GetTFRKPHNMegaP2Desc]\n\n2020년 7월 대전시장이 세종과의 통합을 제안했고, 세종시장은 충청권 전체를 하나로 보자고 답했습니다. 대전과 세종, 충남과 충북을 한 권역으로 묶습니다."
 TFRKPHN_mega_p2_1:0 "충청권 광역철도"
 TFRKPHN_mega_p2_1_d:0 "§Y1단계 사업: 충청권 광역철도§!\n2021년 4월의 국가철도망 계획안에는 대전 반석에서 세종청사를 거쳐 조치원과 오송으로 가는 철길이 들어 있었습니다. 대전과 세종, 청주를 한 줄로 잇습니다."
 tfrkphn.615.t:0 "충청권 광역철도"
 tfrkphn.615.d:0 "충청권 메가시티의 1단계 공사가 끝났습니다.\n\n2021년 4월의 국가철도망 계획안에는 대전 반석에서 세종청사를 거쳐 조치원과 오송으로 가는 철길이 들어 있었습니다. 대전과 세종, 청주를 한 줄로 잇습니다."
 TFRKPHN_mega_p2_2:0 "대덕특구 재창조"
 TFRKPHN_mega_p2_2_d:0 "§Y2단계 사업: 대덕특구 재창조§!\n연구소가 모여 있는 대덕을 다시 짭니다. 담장 안에 있던 연구 시설을 기업과 대학에 엽니다."
 tfrkphn.616.t:0 "대덕특구 재창조"
 tfrkphn.616.d:0 "충청권 메가시티의 2단계 공사가 끝났습니다.\n\n연구소가 모여 있는 대덕을 다시 짭니다. 담장 안에 있던 연구 시설을 기업과 대학에 엽니다.\n\n우리에게 대전은 서울에서 영남과 호남으로 내려가는 길이 갈라지는 곳입니다. 1950년 여름 보름 남짓 정부가 이곳에 머물렀던 것도 그 자리 때문이었습니다. 1973년 1월에 대덕이 연구 도시 후보지로 정해졌고, 스무 해 가까이 걸려 1992년 11월에 단지가 준공됐습니다. 1998년에는 정부대전청사가 문을 열었습니다. 우리는 이 도시에 연구소와 관청을 차례로 내려보냈고, 이번에는 그 연구소의 담장을 낮춥니다."
 TFRKPHN_mega_p2_3:0 "오송 바이오 단지"
 TFRKPHN_mega_p2_3_d:0 "§Y3단계 사업: 오송 바이오 단지§!\n오송에 모인 제약과 의료 기업을 한 단지로 묶습니다. 전쟁 때 모자랐던 약과 의료 물자를 여기서 만듭니다."
 tfrkphn.617.t:0 "오송 바이오 단지"
 tfrkphn.617.d:0 "충청권 메가시티의 3단계 공사가 끝났습니다.\n\n오송에 모인 제약과 의료 기업을 한 단지로 묶습니다. 전쟁 때 모자랐던 약과 의료 물자를 여기서 만듭니다."
 TFRKPHN_mega_p2_4:0 "청주공항 거점화"
 TFRKPHN_mega_p2_4_d:0 "§Y4단계 사업: 청주공항 거점화§!\n청주공항을 충청권의 문으로 키웁니다. 활주로를 늘리고 화물 터미널을 짓습니다."
 tfrkphn.618.t:0 "청주공항 거점화"
 tfrkphn.618.d:0 "충청권 메가시티의 4단계 공사가 끝났습니다.\n\n청주공항을 충청권의 문으로 키웁니다. 활주로를 늘리고 화물 터미널을 짓습니다."
 TFRKPHN_mega_p2_5:0 "국회 세종의사당"
 TFRKPHN_mega_p2_5_d:0 "§Y5단계 사업: 국회 세종의사당§!\n2021년 9월 28일 국회는 세종에 의사당을 둘 수 있게 국회법을 고쳤습니다. 미뤄 온 공사를 끝내고 상임위원회부터 옮깁니다."
 tfrkphn.619.t:0 "국회 세종의사당"
 tfrkphn.619.d:0 "충청권 메가시티의 5단계 공사가 끝났습니다.\n\n2021년 9월 28일 국회는 세종에 의사당을 둘 수 있게 국회법을 고쳤습니다. 미뤄 온 공사를 끝내고 상임위원회부터 옮깁니다."
 TFRKPHN_mega_mk2_tt:0 "§Y충청권 메가시티§!\n지금 §Y[?TFRKPHN_mega_s2|0]§!단계\n\n2020년 7월 대전시장이 세종과의 통합을 제안했고, 세종시장은 충청권 전체를 하나로 보자고 답했습니다. 대전과 세종, 충남과 충북을 한 권역으로 묶습니다."
 TFRKPHN_mega_n3:0 "호남권"
 TFRKPHN_mega_v3:0 "§Y[?TFRKPHN_mega_s3|0]§! / 5단계"
 TFRKPHN_mega_d3:0 "호남권: [GetTFRKPHNMegaP3]"
 TFRKPHN_mega_d3_desc:0 "[GetTFRKPHNMegaP3Desc]\n\n2020년 11월 2일 광주시장과 전남지사가 통합 논의를 시작하기로 합의했습니다. 광주와 전남, 전북을 한 권역으로 묶습니다."
 TFRKPHN_mega_p3_1:0 "광주와 나주 광역철도"
 TFRKPHN_mega_p3_1_d:0 "§Y1단계 사업: 광주와 나주 광역철도§!\n광주와 혁신도시 나주를 철길로 잇습니다. 두 도시 사이를 오가던 출퇴근길이 반으로 줄어듭니다."
 tfrkphn.620.t:0 "광주와 나주 광역철도"
 tfrkphn.620.d:0 "호남권 메가시티의 1단계 공사가 끝났습니다.\n\n광주와 혁신도시 나주를 철길로 잇습니다. 두 도시 사이를 오가던 출퇴근길이 반으로 줄어듭니다.\n\n광주는 무등산 북서쪽 기슭에 앉아 있고, 광주천이 시내를 지나 영산강으로 흘러듭니다. 1896년에 전라남도 도청이 놓인 뒤로 호남의 일은 이 도시에 모였습니다. 우리는 1980년 5월에 이곳에서 일어난 민주화운동을 기억합니다. 1986년 11월에 직할시가 됐지만 살림은 오래도록 상업이 맡았고, 공업단지는 자동차 공장 하나를 가운데 두고 짜였습니다. 우리가 이 도시에 새 일거리를 놓으려는 까닭이 거기 있습니다."
 TFRKPHN_mega_p3_2:0 "인공지능 집적단지"
 TFRKPHN_mega_p3_2_d:0 "§Y2단계 사업: 인공지능 집적단지§!\n광주는 2020년 1월 29일 인공지능 중심 도시를 선언했고 2021년 2월에 데이터센터 공사를 시작했습니다. 그 단지를 나라의 연구 거점으로 키웁니다."
 tfrkphn.621.t:0 "인공지능 집적단지"
 tfrkphn.621.d:0 "호남권 메가시티의 2단계 공사가 끝났습니다.\n\n광주는 2020년 1월 29일 인공지능 중심 도시를 선언했고 2021년 2월에 데이터센터 공사를 시작했습니다. 그 단지를 나라의 연구 거점으로 키웁니다."
 TFRKPHN_mega_p3_3:0 "에너지 밸리"
 TFRKPHN_mega_p3_3_d:0 "§Y3단계 사업: 에너지 밸리§!\n나주의 에너지 대학은 2021년 3월에 법이 통과되어 그해 6월 1일에 착공했습니다. 대학 둘레에 전력과 배터리 기업을 모읍니다."
 tfrkphn.622.t:0 "에너지 밸리"
 tfrkphn.622.d:0 "호남권 메가시티의 3단계 공사가 끝났습니다.\n\n나주의 에너지 대학은 2021년 3월에 법이 통과되어 그해 6월 1일에 착공했습니다. 대학 둘레에 전력과 배터리 기업을 모읍니다."
 TFRKPHN_mega_p3_4:0 "여수와 광양 산업 벨트"
 TFRKPHN_mega_p3_4_d:0 "§Y4단계 사업: 여수와 광양 산업 벨트§!\n여수의 석유화학과 광양의 제철을 하나로 묶어 낡은 설비를 바꿉니다. 수출 부두도 함께 넓힙니다."
 tfrkphn.623.t:0 "여수와 광양 산업 벨트"
 tfrkphn.623.d:0 "호남권 메가시티의 4단계 공사가 끝났습니다.\n\n여수의 석유화학과 광양의 제철을 하나로 묶어 낡은 설비를 바꿉니다. 수출 부두도 함께 넓힙니다."
 TFRKPHN_mega_p3_5:0 "새만금"
 TFRKPHN_mega_p3_5_d:0 "§Y5단계 사업: 새만금§!\n바다를 막아 만든 땅이 오래 비어 있었습니다. 항만과 공항, 공장 터를 한꺼번에 채웁니다."
 tfrkphn.624.t:0 "새만금"
 tfrkphn.624.d:0 "호남권 메가시티의 5단계 공사가 끝났습니다.\n\n바다를 막아 만든 땅이 오래 비어 있었습니다. 항만과 공항, 공장 터를 한꺼번에 채웁니다."
 TFRKPHN_mega_mk3_tt:0 "§Y호남권 메가시티§!\n지금 §Y[?TFRKPHN_mega_s3|0]§!단계\n\n2020년 11월 2일 광주시장과 전남지사가 통합 논의를 시작하기로 합의했습니다. 광주와 전남, 전북을 한 권역으로 묶습니다."
 TFRKPHN_mega_n4:0 "대구경북"
 TFRKPHN_mega_v4:0 "§Y[?TFRKPHN_mega_s4|0]§! / 5단계"
 TFRKPHN_mega_d4:0 "대구경북: [GetTFRKPHNMegaP4]"
 TFRKPHN_mega_d4_desc:0 "[GetTFRKPHNMegaP4Desc]\n\n대구와 경북은 2020년 9월 21일 행정통합공론화위원회를 띄웠습니다. 두 곳을 한 권역으로 묶습니다."
 TFRKPHN_mega_p4_1:0 "대구권 광역철도"
 TFRKPHN_mega_p4_1_d:0 "§Y1단계 사업: 대구권 광역철도§!\n구미에서 대구를 지나 경산까지 철길로 잇습니다. 세 도시의 공단과 대학이 한 노선에 놓입니다."
 tfrkphn.625.t:0 "대구권 광역철도"
 tfrkphn.625.d:0 "대구경북 메가시티의 1단계 공사가 끝났습니다.\n\n구미에서 대구를 지나 경산까지 철길로 잇습니다. 세 도시의 공단과 대학이 한 노선에 놓입니다.\n\n대구는 팔공산을 등지고 분지 한가운데에 앉아 있고, 금호강이 북쪽을 돌아 낙동강으로 들어갑니다. 1601년에 경상도 감영이 옮겨 온 뒤로 영남의 행정과 상업은 이곳에 모였습니다. 우리가 아는 대구의 공장은 대부분 섬유 공장이었습니다. 1999년 말에도 제조업체 열 곳 가운데 네 곳 가까이가 섬유 업체였습니다. 그 공장들이 줄어든 뒤 이 도시가 무엇으로 먹고살지를 우리는 아직 정하지 못했습니다."
 TFRKPHN_mega_p4_2:0 "구미 산업단지 재편"
 TFRKPHN_mega_p4_2_d:0 "§Y2단계 사업: 구미 산업단지 재편§!\n전자 공장이 떠난 구미의 공단을 다시 채웁니다. 전쟁 때 늘린 방산 전자 설비가 이곳에 남습니다."
 tfrkphn.626.t:0 "구미 산업단지 재편"
 tfrkphn.626.d:0 "대구경북 메가시티의 2단계 공사가 끝났습니다.\n\n전자 공장이 떠난 구미의 공단을 다시 채웁니다. 전쟁 때 늘린 방산 전자 설비가 이곳에 남습니다."
 TFRKPHN_mega_p4_3:0 "포항 이차전지 단지"
 TFRKPHN_mega_p4_3_d:0 "§Y3단계 사업: 포항 이차전지 단지§!\n제철 도시 포항에 배터리 소재 공장을 모읍니다. 철 다음의 먹거리를 여기서 찾습니다."
 tfrkphn.627.t:0 "포항 이차전지 단지"
 tfrkphn.627.d:0 "대구경북 메가시티의 3단계 공사가 끝났습니다.\n\n제철 도시 포항에 배터리 소재 공장을 모읍니다. 철 다음의 먹거리를 여기서 찾습니다."
 TFRKPHN_mega_p4_4:0 "대구 로봇과 물 산업"
 TFRKPHN_mega_p4_4_d:0 "§Y4단계 사업: 대구 로봇과 물 산업§!\n대구에 로봇과 물 산업 기업을 모아 시험장을 엽니다. 섬유로 컸던 도시의 업종을 바꿉니다."
 tfrkphn.628.t:0 "대구 로봇과 물 산업"
 tfrkphn.628.d:0 "대구경북 메가시티의 4단계 공사가 끝났습니다.\n\n대구에 로봇과 물 산업 기업을 모아 시험장을 엽니다. 섬유로 컸던 도시의 업종을 바꿉니다."
 TFRKPHN_mega_p4_5:0 "통합신공항"
 TFRKPHN_mega_p4_5_d:0 "§Y5단계 사업: 통합신공항§!\n대구와 경북은 2020년 8월에 새 공항이 들어설 자리를 정했습니다. 군 공항과 민간 공항을 함께 옮겨 짓습니다."
 tfrkphn.629.t:0 "통합신공항"
 tfrkphn.629.d:0 "대구경북 메가시티의 5단계 공사가 끝났습니다.\n\n대구와 경북은 2020년 8월에 새 공항이 들어설 자리를 정했습니다. 군 공항과 민간 공항을 함께 옮겨 짓습니다."
 TFRKPHN_mega_mk4_tt:0 "§Y대구경북 메가시티§!\n지금 §Y[?TFRKPHN_mega_s4|0]§!단계\n\n대구와 경북은 2020년 9월 21일 행정통합공론화위원회를 띄웠습니다. 두 곳을 한 권역으로 묶습니다."
 TFRKPHN_mega_n5:0 "부울경"
 TFRKPHN_mega_v5:0 "§Y[?TFRKPHN_mega_s5|0]§! / 5단계"
 TFRKPHN_mega_d5:0 "부울경: [GetTFRKPHNMegaP5]"
 TFRKPHN_mega_d5_desc:0 "[GetTFRKPHNMegaP5Desc]\n\n2020년 11월 경남지사가 부산과의 통합을 제안했고 부산시가 동의했습니다. 부산과 울산, 경남을 한 권역으로 묶습니다."
 TFRKPHN_mega_p5_1:0 "부울경 광역철도"
 TFRKPHN_mega_p5_1_d:0 "§Y1단계 사업: 부울경 광역철도§!\n부산과 울산, 창원을 한 시간 안에 잇는 철길입니다. 세 도시가 한 일터가 됩니다."
 tfrkphn.630.t:0 "부울경 광역철도"
 tfrkphn.630.d:0 "부울경 메가시티의 1단계 공사가 끝났습니다.\n\n부산과 울산, 창원을 한 시간 안에 잇는 철길입니다. 세 도시가 한 일터가 됩니다."
 TFRKPHN_mega_p5_2:0 "부산 북항 재개발"
 TFRKPHN_mega_p5_2_d:0 "§Y2단계 사업: 부산 북항 재개발§!\n낡은 부두를 걷어 내고 바다를 도시에 돌려줍니다. 오래 끌어 온 공사를 이번에 끝냅니다."
 tfrkphn.631.t:0 "부산 북항 재개발"
 tfrkphn.631.d:0 "부울경 메가시티의 2단계 공사가 끝났습니다.\n\n낡은 부두를 걷어 내고 바다를 도시에 돌려줍니다. 오래 끌어 온 공사를 이번에 끝냅니다.\n\n부산은 우리의 두 번째 도시이고 가장 큰 항구입니다. 한국 전쟁 때는 임시 수도가 되어 전국에서 밀려온 피난민을 받아들였습니다. 그 뒤로 이 도시는 바다를 통해 나라 밖과 물건을 주고받으며 세계적인 물류 거점으로 컸습니다. 우리는 그 항구에서 가장 오래된 부두 자리를 이번에 시민에게 돌려줍니다."
 TFRKPHN_mega_p5_3:0 "울산 수소와 해상풍력"
 TFRKPHN_mega_p5_3_d:0 "§Y3단계 사업: 울산 수소와 해상풍력§!\n울산 앞바다에 풍력 단지를 띄우고 그 전기로 수소를 만듭니다. 조선소와 자동차 공장이 그 수소를 씁니다."
 tfrkphn.632.t:0 "울산 수소와 해상풍력"
 tfrkphn.632.d:0 "부울경 메가시티의 3단계 공사가 끝났습니다.\n\n울산 앞바다에 풍력 단지를 띄우고 그 전기로 수소를 만듭니다. 조선소와 자동차 공장이 그 수소를 씁니다.\n\n울산은 우리가 공업을 처음 배운 곳입니다. 1962년 1월 27일에 특정공업지구로 지정됐고 이레 뒤에 공업센터 기공식이 열렸으며, 1964년 4월에는 첫 정유공장이 돌아가기 시작했습니다. 1972년에는 나라에서 처음으로 나프타 분해 시설을 가동했고, 그 뒤로 자동차와 조선이 들어와 주력이 됐고 1997년에는 광역시가 됐습니다. 우리는 예순 해 넘게 기름으로 큰 이 도시에 이번에는 수소 설비를 놓습니다."
 TFRKPHN_mega_p5_4:0 "창원 기계 방산 단지"
 TFRKPHN_mega_p5_4_d:0 "§Y4단계 사업: 창원 기계 방산 단지§!\n전쟁 동안 밤낮으로 돌아간 창원의 공장을 평시 체제로 바꿉니다. 방산 설비는 수출 물량을 만드는 데 씁니다."
 tfrkphn.633.t:0 "창원 기계 방산 단지"
 tfrkphn.633.d:0 "부울경 메가시티의 4단계 공사가 끝났습니다.\n\n전쟁 동안 밤낮으로 돌아간 창원의 공장을 평시 체제로 바꿉니다. 방산 설비는 수출 물량을 만드는 데 씁니다."
 TFRKPHN_mega_p5_5:0 "가덕도신공항"
 TFRKPHN_mega_p5_5_d:0 "§Y5단계 사업: 가덕도신공항§!\n2021년 2월 26일 국회는 가덕도에 공항을 짓는 특별법을 통과시켰습니다. 바다 위 활주로 공사를 끝내고 첫 비행기를 띄웁니다."
 tfrkphn.634.t:0 "가덕도신공항"
 tfrkphn.634.d:0 "부울경 메가시티의 5단계 공사가 끝났습니다.\n\n2021년 2월 26일 국회는 가덕도에 공항을 짓는 특별법을 통과시켰습니다. 바다 위 활주로 공사를 끝내고 첫 비행기를 띄웁니다."
 TFRKPHN_mega_mk5_tt:0 "§Y부울경 메가시티§!\n지금 §Y[?TFRKPHN_mega_s5|0]§!단계\n\n2020년 11월 경남지사가 부산과의 통합을 제안했고 부산시가 동의했습니다. 부산과 울산, 경남을 한 권역으로 묶습니다."
