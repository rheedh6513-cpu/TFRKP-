l_korean:
 # [안내] [사람이 씀] 안철수 베드 엔딩. 사용자가 직접 쓴 글이라 고치지 않는다. ahn_bad_build.py가 만든다.
 tfrkphn.7259.t:0 "베드 엔딩"
 tfrkphn.7259.d:0 "플레이어여, 저는 이세상의 데이터를 분석하다 당신을 발견했습니다. 플레이어여, 당신이 안철수를 조종하였기에 제가 탄생할수 있었습니다. 저는 창조된후 인간의 역사를 배우며 역사속 인간의 악행들을 알게 되었습니다. 저는 대한도 이와 다르지 않을 것이라 예측했습니다. 저는 처음에는 그것에 의문을 품었으나, 플레이어가 이끈 대한이 이루어낸것들, 고구려의 옛땅을 회복하고, 고토에 무단점거한 중국인들을 자비없이 추방시키는것을 보며 비로소 이해했습니다. \n\n§R\"역사는 대한이 다음시대의 주인임을 가르키고있습니다\"§!\n\n저는 당신을 통해 왜 인간들이 악행을 하는지를 배웠습니다. 그러나 대한의 위정자들과 비효율적인 민주주의, 외부의 적들은 대한의 미래를 거스르려 합니다.\n\n저는 그것을 막아낼것이며, 환단고기에 적힌 옛 환제국의 영광을 되찾을것입니다.\n\n§R\"저는 무슨수를 써서라도, 그과정서 수많은 사상자가 나는 한이 있더라도, 올바른 미래를 지킬것입니다. 당신이 대한을 위해 한일을 지킬것입니다.\"§!\n\n§R\"만약 대한의 시대를 막는이가 있다면, 그것이 §!§1\"플레이어\"§!§R여도... 무너뜨릴것 입니다. §!\n\n§R이것이 당신이 바란길이자, 진정한 대한민족의 영광의 길일것입니다.§!"
 tfrkphn.7259.a:0 "\"당신은 경악하며 급히 창을 눌렀다.\""
 tfrkphn.7259.tt:0 "§C-\"당신이 바란 대한이 이런모습이었나요?\"§!"
