l_korean:
 # [안내] 조원진 정부 결정 탭 이승만 어록. 따옴표 안은 실제 발언 그대로다. cho_build.py(cho_quote_part.py)가 만든다.
 TFRKPHN_cho_q_category:0 "이승만 어록"
 TFRKPHN_cho_q_category_desc:0 "조원진 정부는 건국 대통령의 말을 빌려 국민을 모읍니다. 걸려 있는 구절을 누르면 대통령이 그 말로 연설합니다. 같은 구절은 여섯 달에 한 번 쓸 수 있습니다. 정부가 하는 일이 그 말에서 멀어지면 구절은 빛이 바래 더는 쓸 수 없습니다.\n아래쪽 세 구절은 공장을 짓는 말씀입니다. 유동성을 들여 한 번씩 누를 수 있습니다."
 TFRKPHN_cho_qb1_tt:0 "§Y\"뭉치면 살고 흩어지면 죽는다\"§!\n해방 직후 갈라진 정국에 내건 구호\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  안정도 §G+3%§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qg2_tt:0 "§Y\"이 정부를 국민이 자기들을 위하여 자기들 손으로 세운 자기들의 정부임을 깊이 각오해야 될 것입니다.\"§!\n1948년 8월 15일 정부 수립 선포식 연설\n\n§R동원된 민의로 두 번째 임기를 시작한 뒤로 이 구절은 기념사에서 빠졌습니다.§!"
 TFRKPHN_cho_qb2_tt:0 "§Y\"이 정부를 국민이 자기들을 위하여 자기들 손으로 세운 자기들의 정부임을 깊이 각오해야 될 것입니다.\"§!\n1948년 8월 15일 정부 수립 선포식 연설\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  안정도 §G+2%§! 산업 발전도 §G+0.02§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qb3_tt:0 "§Y\"경영주들은 노동자들을 이용만 하지 못할 것이고 노동자는 자본가를 해롭게 못할 것입니다.\"§!\n1948년 8월 15일 정부 수립 선포식 연설\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  산업 발전도 §G+0.04§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qb4_tt:0 "§Y\"우리의 가장 주장하는 바는 계급 전쟁을 피하여 전 민족에 화동을 도모하나니\"§!\n1948년 8월 15일 정부 수립 선포식 연설\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  안정도 §G+2%§! 산업 발전도 §G+0.02§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qb5_tt:0 "§Y\"독재가 자유와 진흥을 가져오지 못하는 것은 역사에 증명된 것입니다.\"§!\n1948년 8월 15일 정부 수립 선포식 연설\n\n§R이 구절은 건국절 기념사에 실리지 않았습니다.§!"
 TFRKPHN_cho_qg9_tt:0 "§Y\"오늘 와서 보면 우리 정부는 삼권분립으로 행정부 입법부 사법부가 병행해서 발전되고 있는 것이며 우리가 전국적으로 또 지방적으로 여러 번 선거를 집행했었는데 매번에 각오가 깊이 박히는 것은 우리나라의 주권이 민중에게 있다는 것이며 또 우리 유권자들의 권리가 점점 늘어가서 굳건한 토대가 선 것입니다.\"§!\n1956년 8월 15일 제3대 대통령 취임사\n\n§R새 헌법을 만든 뒤로 이 구절은 기념사에서 빠졌습니다.§!"
 TFRKPHN_cho_qb9_tt:0 "§Y\"오늘 와서 보면 우리 정부는 삼권분립으로 행정부 입법부 사법부가 병행해서 발전되고 있는 것이며 우리가 전국적으로 또 지방적으로 여러 번 선거를 집행했었는데 매번에 각오가 깊이 박히는 것은 우리나라의 주권이 민중에게 있다는 것이며 또 우리 유권자들의 권리가 점점 늘어가서 굳건한 토대가 선 것입니다.\"§!\n1956년 8월 15일 제3대 대통령 취임사\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  안정도 §G+3%§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qg10_tt:0 "§Y\"부정을 보고 일어서지 않는 백성은 죽은 백성이지. 이 젊은 학생들은 참으로 장하다.\"§!\n1960년 4월 다친 학생들을 병원으로 찾아가 위문하며\n\n§R거리에 완장을 세운 뒤로 이 구절은 기념사에서 빠졌습니다.§!"
 TFRKPHN_cho_qb10_tt:0 "§Y\"부정을 보고 일어서지 않는 백성은 죽은 백성이지. 이 젊은 학생들은 참으로 장하다.\"§!\n1960년 4월 다친 학생들을 병원으로 찾아가 위문하며\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  안정도 §G+2%§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qb11_tt:0 "§Y\"기한과 질병을 다 이겨냈으며 우리의 농지들을 농민들에게 다 넘겨주어서 농민들이 농토의 주인이 되게 한 것입니다.\"§!\n1956년 8월 15일 제3대 대통령 취임사\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  안정도 §G+1%§! 산업 발전도 §G+0.02§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qb12_tt:0 "§Y\"잃었던 나라의 독립을 다시 찾는 일이 얼마나 어렵고 힘들었는지 우리 국민은 알아야 하며 불행했던 과거사를 거울삼아 다시는 어떤 종류의 것이든 노예의 멍에를 메지 않도록 해야 한다. 이것이 내가 우리 민족에게 주는 유언이다.\"§!\n유언\n\n누르면 대통령이 이 구절로 연설합니다.\n정치력 §R-50§!  안정도 §G+2%§! 전쟁 지지도 §G+3%§!\n같은 구절은 여섯 달 뒤에 다시 쓸 수 있습니다."
 TFRKPHN_cho_qb6_tt:0 "§Y\"쌀과 다른 곡식의 생산을 늘이고 공장에서는 생산력을 증가시키며 또 농산물을 매매하는 제도와 물산수출을 전적으로 장려하자는 것입니다.\"§!\n1956년 8월 15일 제3대 대통령 취임사\n\n누르면 대통령이 이 구절을 내걸고 §Y충청도§!에 비료 공장을 짓습니다.\n정치력 §R-25§!  유동성 §R-30§!\n180일 뒤 충청도에 민간 공장 §G1§!개가 들어서고 산업 발전도가 §G+0.02§! 오릅니다.\n한 번만 누를 수 있습니다."
 TFRKPHN_cho_qb7_tt:0 "§Y\"원주나 춘천같이 전쟁에 전수히 파괴되였던 도시들이 날로 재건축이 되어가는 중이며 지나간 수 년 동안에 새 공장들이 건축되어서 우리 민족이 여러 대를 내려가며 누릴 복리를 양출하고 있는 중입니다.\"§!\n1956년 8월 15일 제3대 대통령 취임사\n\n누르면 대통령이 이 구절을 내걸고 §Y경상도§!에 시멘트 공장을 짓습니다.\n정치력 §R-25§!  유동성 §R-30§!\n180일 뒤 경상도에 민간 공장 §G1§!개가 들어서고 산업 발전도가 §G+0.02§! 오릅니다.\n한 번만 누를 수 있습니다."
 TFRKPHN_cho_qb8_tt:0 "§Y\"첫째는 우리가 중소공업을 많이 발전시키는 것이니 이 공업들을 다 민간에서 자유로 해가도록 만들어서 전국적으로 생산력을 증가해 가지고 국내에서 쓸 것과 해외에 수출할 것을 만들며 동시에 직업을 마련해서 실업자가 없도록 만들자는 것입니다.\"§!\n1956년 8월 15일 제3대 대통령 취임사\n\n누르면 대통령이 이 구절을 내걸고 §Y수도권§!에 판유리 공장을 짓습니다.\n정치력 §R-25§!  유동성 §R-30§!\n180일 뒤 수도권에 민간 공장 §G1§!개가 들어서고 산업 발전도가 §G+0.02§! 오릅니다.\n한 번만 누를 수 있습니다."
