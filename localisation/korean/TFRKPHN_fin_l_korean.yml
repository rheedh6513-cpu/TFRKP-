 # 이인제 정부 북진 통일 마무리. fin_build.py가 만든다.
 tfrkphn.471.t:0 "평양 입성"
 tfrkphn.471.d:0 "국군 선두 부대가 대동강을 건넜습니다.\n\n평양 시내에는 총소리가 드물었습니다. 김일성광장의 주석단은 비어 있었습니다. 만수대 언덕의 동상 앞에는 이북5도위원회 깃발을 든 병사 몇이 서 있었습니다. 아파트 창문마다 사람들이 내다보았습니다. 거리로 나온 사람은 적었습니다.\n\n국군은 1950년 10월 19일에도 평양에 들어갔습니다. 그해 12월에 물러났습니다. 오늘 들어간 부대는 평양역에 보급소를 차리고 대동강 다리마다 초소를 세웠습니다."
 tfrkphn.471.a:0 "대동강을 건넜다"
 tfrkphn.472.t:0 "이북5도위원회의 마지막 회의"
 tfrkphn.472.d:0 "이북5도위원회가 평양에서 마지막 회의를 열었습니다.\n\n안건은 하나였습니다. 위원회가 다스리던 땅과 군대를 대한민국 정부에 넘기는 안이었습니다. 반대는 없었습니다. 위원들은 회의록에 서명하고 깃발을 내렸습니다.\n\n이북5도위원회는 1949년에 생겼습니다. 대통령이 북쪽 다섯 도의 도지사를 임명해 두는 기구였습니다. 도지사들은 70년 넘게 자기 도에 가 보지 못했습니다. 오늘 임명된 도지사 다섯은 내일 아침 임지로 떠납니다."
 tfrkphn.472.a:0 "대한민국이 넘겨받는다"
 tfrkphn.472.tt:0 "§Y이북5도위원회§!의 땅과 군대가 §Y대한민국§!으로 넘어옵니다.\n넘어온 땅은 대한민국의 §Y핵심주§!가 됩니다."
 tfrkphn.473.t:0 "하나의 헌법"
 tfrkphn.473.d:0 "정부가 대한민국 헌법이 한반도 전역에 시행된다고 공포했습니다.\n\n이인제 대통령은 판문점에서 공포문에 서명했습니다. 군사분계선 표지판은 그날 오후부터 뽑혔습니다. 1953년에 세운 표지판은 1,292개였습니다. 남아 있는 것은 그보다 훨씬 적었습니다.\n\n서울역 전광판에 평양행 열차 시간표가 올라왔습니다. 첫 열차는 다음 달로 잡혔습니다. 북쪽의 주민등록, 화폐, 학교, 병원은 내일부터 정부의 일입니다. 행정안전부는 공무원 3천 명을 먼저 올려 보내기로 했습니다."
 tfrkphn.473.a:0 "통일되었다"
 tfrkphn.473.tax_tt:0 "§g통일세로 쌓아 둔 기금이 북쪽의 첫 겨울을 버티게 합니다.§!"
 tfrkphn.491.t:0 "탄약 지급"
 tfrkphn.491.story:0 "강원도 철원, 전방 사단의 탄약고 앞. 새벽 네 시.\n\n김지원 하사는 분대원 아홉 명을 한 줄로 세웠다. 그녀는 일병 때 계룡대 연병장에서 대통령의 사열을 받았다. 전역할 날짜가 지났지만 군복을 벗지 않았다. 지난봄에 하사 계급장을 달았다.\n\n탄약고 문이 열렸다. 병사들 앞에 실탄 상자가 하나씩 놓였다. 훈련 때는 탄피 개수를 세어 반납했다. 오늘은 반납 장부가 없었다.\n\n\"분대장님, 이거 진짜 나가는 겁니까.\"\n\n\"모른다. 준비하라는 명령만 받았다.\"\n\n옆 막사에는 동원된 예비군이 찼다. 마흔 가까운 사람들이 군복 단추를 잠그며 휴대폰으로 아이 사진을 보고 있었다. 그 가운데 하나가 지원에게 물었다.\n\n\"하사님은 왜 안 나가고 남았습니까. 안 와도 되는 군대인데.\"\n\n지원은 탄창에 탄을 끼우며 대답했다.\n\n\"똑같이 받으려고 왔습니다. 받을 때만 똑같으면 안 되잖습니까.\"\n\n날이 밝자 북쪽 능선이 드러났다. 능선 너머는 조용했다. 분대원들은 능선을 보지 않고 탄창을 채웠다."
 tfrkphn.491.a:0 "탄창을 채운다"
 tfrkphn.490.t:0 "압록강 수통"
 tfrkphn.490.story:0 "평안북도 초산, 압록강변.\n\n오후 두 시가 조금 지나 선두 분대가 강가에 닿았다. 분대장은 김지원 하사였다. 강은 생각보다 좁았다. 건너편 둑에 중국군 초소가 보였다.\n\n1950년 10월 26일 오후 2시 15분에도 국군은 이 강에 닿았다. 6사단 7연대 1대대 1중대였다. 중대장은 수통에 강물을 담았다. 이승만 대통령에게 보낼 물이었다. 이틀 뒤 그 부대는 후퇴 명령을 받았다.\n\n대대장이 무전으로 물었다.\n\n\"강물 떴나.\"\n\n\"아직입니다.\"\n\n\"떠라. 수통 하나는 청와대로 보낸다.\"\n\n지원은 군화를 벗지 않고 물가로 내려갔다. 수통을 물에 눕혔다. 물은 차가웠고 흙냄새가 났다. 수통이 차자 그녀는 마개를 잠그고 겉에 날짜를 적었다.\n\n옆에서 지켜보던 상병이 물었다.\n\n\"분대장님, 이번에는 이틀 뒤에 안 물러납니까.\"\n\n지원은 건너편 초소를 보았다. 초소의 병사도 이쪽을 보고 있었다. 양쪽 다 총을 들지 않았다.\n\n\"모른다. 그래서 수통을 두 개 떴다. 하나는 내가 가진다.\""
 tfrkphn.490.a:0 "강물이 서울로 간다"
 tfrkphn.492.t:0 "발령지"
 tfrkphn.492.story:0 "정부서울청사 별관, 북부 행정요원 발대식.\n\n강당에 삼천 명이 앉았다. 북쪽 읍면동에 먼저 올라갈 공무원들이었다. 절반은 현직이었고 절반은 이번에 뽑힌 사람들이었다. 제대군인은 가산점을 받았다.\n\n김지원은 지난달에 전역했다. 군복 대신 받은 것은 회색 점퍼와 발령장 한 장이었다. 발령지 칸에는 평안북도 초산군이라고 적혀 있었다.\n\n\"초산이면 압록강 바로 옆인데. 괜찮겠어요?\"\n\n옆자리 남자가 발령장을 넘겨다보며 말했다. 팀장 명찰을 달고 있었다. 지원은 그 얼굴을 한참 보았다.\n\n\"혹시 노량진 독서실 다니셨습니까.\"\n\n남자가 눈을 크게 떴다. 이준호였다. 그는 그해 9급에 붙었고 지금은 7급이었다.\n\n\"그때 그 일병. 가산점 받는다고 좋아하던.\"\n\n\"받았습니다. 이번에.\"\n\n\"나도 그걸로 붙었어요. 초산은 우리 팀입니다.\"\n\n버스는 다음 날 새벽에 떠났다. 지원의 배낭 옆주머니에는 수통이 하나 들어 있었다. 마개 옆에 날짜가 적혀 있었다. 초산 읍사무소에 닿으면 그녀는 그 물을 강에 도로 부을 생각이었다."
 tfrkphn.492.a:0 "초산행 버스가 떠난다"
