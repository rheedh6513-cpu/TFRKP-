 TFRKPHN_redev:0 "재개발 ([?TFRKPHN_redev_n]/5)"
 TFRKPHN_redev_desc:0 "낡은 주택가와 비어 가는 공장 터를 묶어서 다시 짓는다. 새 땅을 찾기 어려운 나라에서는 이미 쓰고 있는 땅을 더 촘촘하게 쓰는 길밖에 없다. 허가에 걸리는 시간을 줄이고 정부가 기반 시설을 먼저 놓아 주면, 그 자리에 공장과 사무실이 들어설 수 있다."
 TFRKPHN_redev_wait_tt:0 "§Y60일§! 동안 공사가 이어지고, 그동안 §Y민간 공장 2개§!가 이 공사에 묶인다."
 TFRKPHN_redev_tt:0 "우리가 가진 §Y모든 지역§!의 건물 칸이 §G1§!씩 늘어난다.\n다섯 번까지 할 수 있다."
