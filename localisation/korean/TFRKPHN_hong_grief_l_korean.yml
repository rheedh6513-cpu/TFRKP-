 tfrkphn.6970.t:0 "우리 아들 살려내라"
 tfrkphn.6970.d:0 "국방부 앞에 검은 옷을 입은 사람들이 모였습니다. 맨 앞의 어머니가 든 팻말에는 우리 아들 살려내라는 글씨가 삐뚤게 적혀 있었습니다. 훈련 중 사고로 숨졌다는 통지서를 받은 장병들의 유족이었습니다.\n\n그들의 아들들은 대만해협에서 숨졌습니다. 사실 사람들은 오래전부터 알음알음 알고 있었습니다. 부산항에서 밤마다 떠나는 화물선과 국적 표시를 지운 수송기, 휴가 나와서도 어디에 다녀왔는지 말하지 못하는 장병들의 이야기가 술자리마다 돌았습니다. 그러다 외신이 대만 남부 해안에 떨어진 우리 수송기 잔해 사진을 실었고, 모두가 짐작만 하던 일이 뉴스 첫머리에 올랐습니다. 서류 위로는 중립국인 나라가 실제로는 군대를 보냈다는 사실이 처음으로 큰 논란이 되었습니다.\n\n여론은 둘로 갈렸습니다. 대만을 지킨 것은 잘한 일이라는 사람도 많았지만, 다 알던 일을 왜 끝까지 숨겼느냐는 물음에는 누구도 답하지 못했습니다. 여당 지지율이 조금 내려갔습니다."
 tfrkphn.6970.a:0 "사실을 인정하고 유족에게 사과한다."
 tfrkphn.6970.b:0 "작전 보안이라 더는 말할 수 없다."
 tfrkphn.6971.t:0 "이중배상 금지 논란"
 tfrkphn.6971.d:0 "유족들이 국가를 상대로 손해배상 소송을 내려다 벽에 부딪혔습니다. 헌법 제29조 제2항은 군인과 경찰 등이 전투나 훈련 같은 직무 중에 입은 손해에 대해서는 법률이 정한 보상 말고는 국가에 배상을 청구할 수 없게 막고 있습니다. 1967년 국가배상법을 고치면서 처음 들어온 이 규정을 사람들은 이중배상 금지라고 부릅니다.\n\n유족들은 거짓 통지서로 진실을 가린 나라가 보상금 몇 푼으로 끝내려 한다며 이 조항을 없애라고 요구합니다. 헌법에 적힌 조항이라 법률만 고쳐서는 없앨 수 없습니다. 개헌안에 넣자는 쪽과, 특별법으로 보상을 크게 늘리면 된다는 쪽, 나라 재정과 군의 형평을 생각하면 그대로 둬야 한다는 쪽이 맞섰습니다."
 tfrkphn.6971.a:0 "개헌안에 이중배상 금지 폐지를 넣는다."
 tfrkphn.6971.b:0 "특별법으로 보상을 크게 늘린다."
 tfrkphn.6971.c:0 "헌법은 그대로 둔다."
