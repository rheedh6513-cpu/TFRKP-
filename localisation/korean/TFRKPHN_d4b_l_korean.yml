 # 이인제 정부: 무노동 부분임금. d4b_build.py가 만든다.
 tfrkphn.542.t:0 "무노동 부분임금"
 tfrkphn.542.story:0 "1993년 5월 18일, 노동부 장관 이인제는 파업 기간에도 가족수당과 식대, 교통비처럼 생활을 보장하는 성격의 임금은 주도록 행정지도를 하겠다고 발표했다. 무노동 무임금 원칙이 임금을 둘로 나누어 본 대법원 판례와 어긋난다는 것이 그의 논리였다.\n\n재계는 정면으로 반발했다. 지난해 분규를 겪은 회사의 97퍼센트가 무노동 무임금을 지켰고 미국과 서구도 그렇게 한다는 것, 파업 중에 임금을 주면 파업을 부추긴다는 것이 재계의 주장이었다. 경제기획원과 상공부도 반대했고 당정회의는 제도를 미루는 쪽으로 기울었다. 한 신문은 사설 제목에 장관의 노정관이 너무 튄다고 적었다.\n\n6월 9일 노동부는 방침을 거두었다. 이인제는 기자들에게 무노동 무임금 원칙의 현실성과 타당성을 논쟁으로 검증한 것만으로도 성과가 있었다고 말했다. 그러고도 열이틀 뒤 3부 장관 합동회견에서 그는 이 문제가 노동관계법령을 대법원 판례와 맞추려는 과정에서 생긴 일이라고 다시 설명했다.\n\n서른 해가 넘게 지나 그는 그때 거둔 지침을 다시 꺼냈다. 전쟁 내내 파업을 참은 노동자들이 먼저 요구해 온 것이기도 하다. 파업을 해도 밥값과 가족수당은 끊기지 않으며, 일하지 않은 시간의 기본급은 여전히 나가지 않는다. 이번에는 법에 적어 두기로 했다."
 tfrkphn.542.a:0 "그때 거둔 지침을 다시 꺼낸다"
