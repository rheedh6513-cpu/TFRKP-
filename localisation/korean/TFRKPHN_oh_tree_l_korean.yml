l_korean:
 # 오세훈 중점 계통도. oh_tree_build.py가 만든다. 뿌리(b01_01)의 이름과 설명은 TFRKP_HN_ge2027_l_korean.yml에 이미 있어 여기서는 덮지 않는다.
 TFRKPHN_oh_se_hoon_a1:0 "나라 바로세우기"
 TFRKPHN_oh_se_hoon_a1_desc:0 "전쟁에서 이긴 정부를 이어받았지만 전시의 방식까지 이어받지는 않습니다. 물가와 징집, 희생자 문제부터 다시 봅니다."
 TFRKPHN_oh_se_hoon_a2:0 "중도로 넓힌다"
 TFRKPHN_oh_se_hoon_a2_desc:0 "2019년 2월 7일 당 대표 선거에 나서며 그는 박 전 대통령을 극복할 수 있어야 보수정치는 부활할 수 있다고 말했습니다. 보수의 울타리를 가운데로 넓히는 길입니다."
 TFRKPHN_oh_se_hoon_a2b:0 "지지층부터 다진다"
 TFRKPHN_oh_se_hoon_a2b_desc:0 "전쟁을 함께 치른 지지층이 흩어지지 않게 먼저 붙듭니다. 넓히는 일은 그다음입니다."
 TFRKPHN_oh_se_hoon_a3:0 "야당과 마주 앉는다"
 TFRKPHN_oh_se_hoon_a3_desc:0 "2021년 그는 야당이 압도적으로 많은 시의회를 상대로 시정을 꾸렸습니다. 그때 익힌 방식대로 야당 대표와 예산부터 마주 앉습니다."
 TFRKPHN_oh_se_hoon_a4:0 "국민에게 묻는다"
 TFRKPHN_oh_se_hoon_a4_desc:0 "2011년 8월 그는 무상급식을 주민투표에 부치고 시장직을 걸었다가 물러났습니다. 이번에는 직을 걸지 않고 묻습니다."
 TFRKPHN_oh_se_hoon_a4b:0 "국회에서 푼다"
 TFRKPHN_oh_se_hoon_a4b_desc:0 "투표함까지 가지 않고 국회 안에서 답을 찾습니다. 2011년에 치른 값을 다시 치르지 않겠다는 선택입니다."
 TFRKPHN_oh_se_hoon_a5:0 "전시 통제를 걷는다"
 TFRKPHN_oh_se_hoon_a5_desc:0 "전쟁 동안 묶어 둔 것들을 풉니다. 여론조사 공표 금지를 거두고 전시 편제로 붙들어 둔 사람들을 집으로 돌려보냅니다."
 TFRKPHN_oh_se_hoon_a6:0 "돌아오지 못한 이들의 이름"
 TFRKPHN_oh_se_hoon_a6_desc:0 "전사자와 유족을 나라가 끝까지 책임집니다. 명단을 빠짐없이 공개하고 보상의 기준을 법으로 정합니다."
 TFRKPHN_oh_se_hoon_b1:0 "스피드 주택공급"
 TFRKPHN_oh_se_hoon_b1_desc:0 "2021년 4월 서울시장 선거에서 그는 다섯 해 동안 36만 가구를 공급하겠다고 약속했습니다. 그 방식을 나라 전체로 넓힙니다."
 TFRKPHN_oh_se_hoon_b2:0 "재개발과 재건축 정상화"
 TFRKPHN_oh_se_hoon_b2_desc:0 "묶여 있던 재개발과 재건축을 다시 굴립니다. 서울에서 약속한 물량은 18만 5천 가구였습니다."
 TFRKPHN_oh_se_hoon_b3:0 "서른다섯 층의 벽"
 TFRKPHN_oh_se_hoon_b3_desc:0 "아파트 높이를 35층으로 묶어 둔 규제와 낮게 잡힌 용적률을 고칩니다. 같은 땅에 더 많은 집이 들어섭니다."
 TFRKPHN_oh_se_hoon_b5:0 "모아주택"
 TFRKPHN_oh_se_hoon_b5_desc:0 "낡은 저층 주거지의 필지를 모아 작은 단지로 다시 짓습니다. 서울에서 약속한 물량은 3만 가구였습니다."
 TFRKPHN_oh_se_hoon_b6:0 "상생주택"
 TFRKPHN_oh_se_hoon_b6_desc:0 "민간의 땅을 빌려 공공이 짓는 장기전세주택입니다. 2007년 서울에서 시작한 시프트의 두 번째 판으로, 약속한 물량은 7만 가구였습니다."
 TFRKPHN_oh_se_hoon_b7:0 "신도시의 삼분의 일"
 TFRKPHN_oh_se_hoon_b7_desc:0 "2020년 12월 그는 3기 신도시의 3분의 1은 시세의 70에서 80퍼센트에 분양하고, 3분의 1은 토지임대부로, 나머지는 장기전세로 공급하자고 말했습니다. 새 택지에 그 비율을 적용합니다."
 TFRKPHN_oh_se_hoon_b4:0 "값을 낮춰 짓는다"
 TFRKPHN_oh_se_hoon_b4_desc:0 "2020년 12월 그는 정책으로 가격을 조절할 수 있다는 것은 큰 착각이라고 말했습니다. 시세보다 20에서 30퍼센트만 낮춰 공급해도 시장이 가라앉는다는 것이 그의 생각이었습니다."
 TFRKPHN_oh_se_hoon_b8:0 "한 해 팔만 호"
 TFRKPHN_oh_se_hoon_b8_desc:0 "2021년 9월 서울비전 2030은 한 해 평균 8만 호의 새 집을 약속했습니다. 인허가와 착공 숫자를 달마다 공개합니다."
 TFRKPHN_oh_se_hoon_c1:0 "약자와의 동행"
 TFRKPHN_oh_se_hoon_c1_desc:0 "약자와의 동행은 그가 시정의 맨 앞에 두었던 말입니다. 2021년 9월 15일 그는 서울비전 2030을 내놓으며 계층 이동 사다리를 복원하겠다고 말했습니다. 복지의 목표를 거기에 둡니다."
 TFRKPHN_oh_se_hoon_c2:0 "안심소득 시범"
 TFRKPHN_oh_se_hoon_c2_desc:0 "기준에 모자라는 소득의 절반을 채워 주는 제도입니다. 서울에서 세 해 동안 해 본 결과를 들고 시범 지역을 전국으로 넓힙니다."
 TFRKPHN_oh_se_hoon_c3:0 "서울런을 전국으로"
 TFRKPHN_oh_se_hoon_c3_desc:0 "형편이 어려운 집 아이들에게 온라인 강의를 무료로 열어 주던 서울의 사업입니다. 이름을 바꿔 전국의 학생에게 엽니다."
 TFRKPHN_oh_se_hoon_c5:0 "안심소득 전면 시행"
 TFRKPHN_oh_se_hoon_c5_desc:0 "서울비전 2030은 2027년을 전면 시행의 해로 잡았습니다. 대통령이 된 해가 바로 그해입니다."
 TFRKPHN_oh_se_hoon_c6:0 "청년취업사관학교"
 TFRKPHN_oh_se_hoon_c6_desc:0 "기업이 바라는 기술을 가르쳐 일자리로 잇는 학교입니다. 서울에서는 열 곳을 약속했고, 전쟁에서 돌아온 청년이 먼저 들어갑니다."
 TFRKPHN_oh_se_hoon_c7:0 "쉰 살부터의 일자리"
 TFRKPHN_oh_se_hoon_c7_desc:0 "서울은 중장년에게 사회공헌 일자리를 한 해 1만 개씩 만들겠다고 했습니다. 군복을 벗은 예비역 간부들에게도 같은 길을 엽니다."
 TFRKPHN_oh_se_hoon_c8:0 "골목경제 부활"
 TFRKPHN_oh_se_hoon_c8_desc:0 "전쟁 동안 문을 닫은 동네 가게를 다시 엽니다. 골목마다 무엇이 비었는지 지도를 만들고 빈자리부터 채웁니다."
 TFRKPHN_oh_se_hoon_c4:0 "평생 배우는 나라"
 TFRKPHN_oh_se_hoon_c4_desc:0 "서울런은 2023년까지 시민 누구나 쓰는 평생교육 플랫폼으로 넓히는 것이 계획이었습니다. 학생에게 열었던 문을 일하는 사람과 노인에게도 엽니다."
 TFRKPHN_oh_se_hoon_d1:0 "글로벌 TOP5"
 TFRKPHN_oh_se_hoon_d1_desc:0 "서울비전 2030의 목표는 서울을 세계 5대 도시로 올리는 것이었습니다. 전쟁에서 이긴 나라의 수도에 돈과 사람이 다시 모이게 합니다."
 TFRKPHN_oh_se_hoon_d2:0 "여의도 디지털금융특구"
 TFRKPHN_oh_se_hoon_d2_desc:0 "여의도를 디지털금융특구로 만들고 서울에 있는 해외 금융기관을 250곳까지 늘리는 것이 서울의 계획이었습니다. 홍콩을 떠나는 자본이 첫 손님입니다."
 TFRKPHN_oh_se_hoon_d2b:0 "유니콘 마흔 개"
 TFRKPHN_oh_se_hoon_d2b_desc:0 "서울은 2030년까지 유니콘 기업 40개와 10조 원 규모의 스케일업 펀드를 약속했습니다. 금융보다 창업에 먼저 힘을 싣습니다."
 TFRKPHN_oh_se_hoon_d3:0 "대한민국투자청"
 TFRKPHN_oh_se_hoon_d3_desc:0 "서울투자청은 외국 기업의 투자를 한 창구에서 받으려고 만든 기구입니다. 같은 창구를 나라 단위로 세웁니다."
 TFRKPHN_oh_se_hoon_d4:0 "뷰티 산업 허브"
 TFRKPHN_oh_se_hoon_d4_desc:0 "화장품과 패션, 미용을 한데 묶어 수출 산업으로 키웁니다. 동대문을 세계적인 뷰티 산업 허브로 만들겠다던 서울의 계획이 본보기입니다."
 TFRKPHN_oh_se_hoon_d4b:0 "관광객 이천만"
 TFRKPHN_oh_se_hoon_d4b_desc:0 "서울은 2030년에 외국 관광객 2천만 명을 맞겠다고 했습니다. 전쟁으로 끊긴 하늘길부터 다시 잇습니다."
 TFRKPHN_oh_se_hoon_d5:0 "하늘과 땅의 교통"
 TFRKPHN_oh_se_hoon_d5_desc:0 "도심 항공 교통 같은 새 교통수단을 갈아타는 모빌리티 허브입니다. 서울의 계획은 2030년까지 서른두 곳이었습니다."
 TFRKPHN_oh_se_hoon_d6:0 "자부심을 디자인하다"
 TFRKPHN_oh_se_hoon_d6_desc:0 "2007년 10월 서울은 2010년 세계디자인수도로 뽑혔습니다. 그때 도시의 모습에 들였던 공을 이번에는 수출 상품에 들입니다."
 TFRKPHN_oh_se_hoon_m1:0 "망명 기업에 문을 연다"
 TFRKPHN_oh_se_hoon_m1_desc:0 "내전으로 초토화된 미대륙을 회사들은 포기했습니다. 세계에 남은 지사와 공장은 그 나라에 남았고, 우리 땅에도 그 몫이 있습니다. 이 조직들을 정식으로 앉힐 창구를 엽니다."
 TFRKPHN_oh_se_hoon_m2:0 "규제 자유 특구"
 TFRKPHN_oh_se_hoon_m2_desc:0 "망명 기업이 들어갈 자리를 특구로 묶습니다. 인허가를 한 창구에서 끝내고 외국인 연구자의 비자를 빠르게 내줍니다."
 TFRKPHN_oh_se_hoon_m3:0 "망명 기업 특별법"
 TFRKPHN_oh_se_hoon_m3_desc:0 "혜택의 기준과 기한을 법으로 정합니다. 같은 권역의 국내 기업도 같은 조건을 신청할 수 있게 해서 역차별이라는 말이 나오지 않게 합니다."
 TFRKPHN_oh_se_hoon_m4:0 "이 땅에 뿌리내리다"
 TFRKPHN_oh_se_hoon_m4_desc:0 "우리 땅에 남은 조직을 한국 회사로 등기합니다. 이곳에 놓여 있던 특허와 설계, 상표도 함께 우리 법 아래로 들어옵니다."
 TFRKPHN_oh_se_hoon_e1:0 "매뉴얼로 지키는 안전"
 TFRKPHN_oh_se_hoon_e1_desc:0 "서울은 서른 해에 한 번 올 기상이변을 견디도록 방재 시설을 고치고 매뉴얼 안전도시를 만들겠다고 했습니다. 재난마다 누가 무엇을 하는지 책으로 정해 둡니다."
 TFRKPHN_oh_se_hoon_e2:0 "스마트 헬스케어"
 TFRKPHN_oh_se_hoon_e2_desc:0 "서울은 2023년까지 스마트 헬스케어 시스템을 갖추기로 했습니다. 전쟁에서 다친 사람들의 재활부터 여기에 싣습니다."
 TFRKPHN_oh_se_hoon_e3:0 "이천오십 탄소중립"
 TFRKPHN_oh_se_hoon_e3_desc:0 "서울의 약속은 2030년까지 온실가스를 40퍼센트 줄이고 2050년에 순배출을 없애는 것이었습니다. 그 일정을 나라의 일정으로 삼습니다."
 TFRKPHN_oh_se_hoon_e4:0 "지천 르네상스"
 TFRKPHN_oh_se_hoon_e4_desc:0 "한강에서 하던 일을 동네 하천으로 가져갑니다. 물길 둘레를 걷고 쉬는 곳으로 바꿉니다."
 TFRKPHN_oh_se_hoon_e5:0 "메타버스 행정"
 TFRKPHN_oh_se_hoon_e5_desc:0 "민원 창구를 가상 공간에 엽니다. 서울은 2023년에 틀을 만들고 2030년에 모든 분야로 넓히기로 했습니다."
 TFRKPHN_oh_se_hoon_e6:0 "이천 년의 수도"
 TFRKPHN_oh_se_hoon_e6_desc:0 "백제 때부터 지금까지 서울에 쌓인 역사를 되살리는 사업입니다. 전쟁으로 미뤄 둔 발굴과 복원을 다시 시작합니다."
 TFRKPHN_oh_se_hoon_h1:0 "넛지"
 TFRKPHN_oh_se_hoon_h1_desc:0 "2019년 2월 17일 그는 북한에 핵 폐기 기간을 주고 우리도 핵을 개발한다고 하는 넛지 전략을 써야 한다고 말했습니다. 이제 그 말을 할 자리에 앉았습니다."
 TFRKPHN_oh_se_hoon_h2:0 "나토식 핵 배치"
 TFRKPHN_oh_se_hoon_h2_desc:0 "2020년 6월 19일 그는 방송에서 전술핵을 다시 들여오는 길과 나토식 핵공유를 선택지로 꼽았습니다. 협의를 넘어 배치를 요구합니다."
 TFRKPHN_oh_se_hoon_h2b:0 "협의체를 잇는다"
 TFRKPHN_oh_se_hoon_h2b_desc:0 "홍준표 정부가 만든 핵공유 협의체를 그대로 이어 갑니다. 더 나가자는 것이 자기 생각이었지만 동맹이 받아들일 속도에 맞춥니다."
 TFRKPHN_oh_se_hoon_h3:0 "삼불은 없다"
 TFRKPHN_oh_se_hoon_h3_desc:0 "2017년 문재인 정부는 사드를 더 들이지 않고, 미국의 미사일 방어에 들어가지 않고, 한미일 군사 동맹으로 가지 않는다는 입장을 밝혔습니다. 우리 정부는 그 입장을 이어받지 않는다고 문서로 못 박습니다."
 TFRKPHN_oh_se_hoon_h4:0 "동맹 안의 자리"
 TFRKPHN_oh_se_hoon_h4_desc:0 "전쟁을 함께 치른 나라들 사이에서 한국이 맡을 몫을 정합니다. 군사보다 물자와 재건에서 앞에 섭니다."
 TFRKPHN_oh_se_hoon_h5:0 "전시 편제를 푼다"
 TFRKPHN_oh_se_hoon_h5_desc:0 "전쟁 때 부풀린 군을 평시 규모로 되돌립니다. 전역하는 사람들은 청년취업사관학교와 중장년 일자리로 이어집니다."
 TFRKPHN_oh_se_hoon_h6:0 "참전용사의 집"
 TFRKPHN_oh_se_hoon_h6_desc:0 "돌아온 사람들에게 상생주택과 값을 낮춘 집을 먼저 줍니다. 보훈을 연금 한 가지로 끝내지 않습니다."
 TFRKPHN_oh_se_hoon_fin:0 "길을 떠나 다시 배우다"
 TFRKPHN_oh_se_hoon_fin_desc:0 "주택과 복지, 산업을 하나로 묶어 다섯 해의 계획으로 내놓습니다. 시장 시절에 서울 한 곳에서 해 본 일들입니다."
 TFRKPHN_oh_se_hoon_fin2:0 "다시 성장하는 대한민국"
 TFRKPHN_oh_se_hoon_fin2_desc:0 "서울의 계획을 나라의 계획으로 바꿉니다. 숫자는 커졌고 책임도 그만큼 커졌습니다."
 TFRKPHN_oh_se_hoon_g1:0 "다섯 해의 성적표"
 TFRKPHN_oh_se_hoon_g1_desc:0 "임기 끝에 약속과 결과를 나란히 적어 공개합니다. 지킨 것과 지키지 못한 것을 같은 크기의 글씨로 씁니다."
 TFRKPHN_oh_se_hoon_g2:0 "미래"
 TFRKPHN_oh_se_hoon_g2_desc:0 "2011년에 그는 임기를 채우지 못하고 떠났습니다. 이번에는 끝까지 일하고 다음 사람에게 넘깁니다."
