l_korean:
 tfrkphn.6900.t:0 "서울런이란"
 tfrkphn.6900.d:0 "서울런은 서울시가 2021년 8월에 시작한 교육 사업이다. 학원에 다니기 어려운 형편의 학생들에게 이름난 강사들의 온라인 강의를 무료로 열어 주는 것이 처음 목표였다.\n\n강의만 주는 데서 그치지 않았다. 대학생 멘토가 공부 계획을 함께 짜 주고, 자격증과 어학, 독서 강좌까지 차례로 늘었다. 2026년 5월에는 가입자가 4만 명을 넘었고, 서울런으로 공부해 대학에 붙은 학생은 2023학년도 462명에서 2026학년도 914명으로 늘었다.\n\n이 나라에서 서울런은 이제 서울만의 사업이 아니다. 탭 아래의 결정으로 수강생을 늘리면 연구가 빨라지고 빈곤이 줄어든다."
 tfrkphn.6900.a:0 "알겠다."
 tfrkphn.6901.t:0 "서울런 연습 문제 1"
 tfrkphn.6901.d:0 "방정식 2x + 3 = 11 에서 x의 값은 무엇일까요?"
 tfrkphn.6901.o0:0 "3"
 tfrkphn.6901.o1:0 "4"
 tfrkphn.6901.o2:0 "5"
 tfrkphn.6901.o3:0 "7"
 tfrkphn.6931.d:0 "정답이다.\n\n양변에서 3을 빼면 2x = 8이고, 양변을 2로 나누면 x = 4이다."
 tfrkphn.6951.d:0 "아쉽다. 정답은 4이다.\n\n양변에서 3을 빼면 2x = 8이고, 양변을 2로 나누면 x = 4이다."
 tfrkphn.6902.t:0 "서울런 연습 문제 2"
 tfrkphn.6902.d:0 "맞춤법이 바른 문장은 무엇일까요?"
 tfrkphn.6902.o0:0 "내일 다시 와도 되요."
 tfrkphn.6902.o1:0 "내일 다시 와도 돼요."
 tfrkphn.6902.o2:0 "내일 다시 와도 됬어요."
 tfrkphn.6932.d:0 "정답이다.\n\n돼요는 되어요를 줄인 말이다. 되어로 바꿔 말이 되면 돼를 쓴다."
 tfrkphn.6952.d:0 "아쉽다. 정답은 내일 다시 와도 돼요.이다.\n\n돼요는 되어요를 줄인 말이다. 되어로 바꿔 말이 되면 돼를 쓴다."
 tfrkphn.6903.t:0 "서울런 연습 문제 3"
 tfrkphn.6903.d:0 "세종이 훈민정음을 반포한 해는 언제일까요?"
 tfrkphn.6903.o0:0 "1392년"
 tfrkphn.6903.o1:0 "1446년"
 tfrkphn.6903.o2:0 "1592년"
 tfrkphn.6903.o3:0 "1897년"
 tfrkphn.6933.d:0 "정답이다.\n\n훈민정음은 1443년에 만들어지고 1446년에 반포되었다. 1392년은 조선 건국, 1592년은 임진왜란이 일어난 해다."
 tfrkphn.6953.d:0 "아쉽다. 정답은 1446년이다.\n\n훈민정음은 1443년에 만들어지고 1446년에 반포되었다. 1392년은 조선 건국, 1592년은 임진왜란이 일어난 해다."
 tfrkphn.6904.t:0 "서울런 연습 문제 4"
 tfrkphn.6904.d:0 "1기압에서 물이 끓는 온도는 섭씨 몇 도일까요?"
 tfrkphn.6904.o0:0 "0도"
 tfrkphn.6904.o1:0 "50도"
 tfrkphn.6904.o2:0 "100도"
 tfrkphn.6904.o3:0 "212도"
 tfrkphn.6934.d:0 "정답이다.\n\n1기압에서 물은 섭씨 100도에서 끓는다. 212는 화씨로 나타낸 끓는점이다."
 tfrkphn.6954.d:0 "아쉽다. 정답은 100도다.\n\n1기압에서 물은 섭씨 100도에서 끓는다. 212는 화씨로 나타낸 끓는점이다."
 tfrkphn.6905.t:0 "서울런 연습 문제 5"
 tfrkphn.6905.d:0 "영어 단어 ancient와 뜻이 반대인 말은 무엇일까요?"
 tfrkphn.6905.o0:0 "old"
 tfrkphn.6905.o1:0 "modern"
 tfrkphn.6905.o2:0 "early"
 tfrkphn.6905.o3:0 "past"
 tfrkphn.6935.d:0 "정답이다.\n\nancient는 아주 오래된이라는 뜻이고, 반대말은 현대의라는 뜻의 modern이다."
 tfrkphn.6955.d:0 "아쉽다. 정답은 modern이다.\n\nancient는 아주 오래된이라는 뜻이고, 반대말은 현대의라는 뜻의 modern이다."
 tfrkphn.6906.t:0 "서울런 연습 문제 6 (중3)"
 tfrkphn.6906.d:0 "이차방정식 x제곱 - 5x + 6 = 0 의 두 근의 합은 얼마일까요?"
 tfrkphn.6906.o0:0 "1"
 tfrkphn.6906.o1:0 "5"
 tfrkphn.6906.o2:0 "6"
 tfrkphn.6906.o3:0 "-5"
 tfrkphn.6936.d:0 "정답이다.\n\nx제곱 - 5x + 6 = (x - 2)(x - 3)이므로 두 근은 2와 3이고, 합은 5이다."
 tfrkphn.6956.d:0 "아쉽다. 정답은 5이다.\n\nx제곱 - 5x + 6 = (x - 2)(x - 3)이므로 두 근은 2와 3이고, 합은 5이다."
 tfrkphn.6907.t:0 "서울런 연습 문제 7 (중3)"
 tfrkphn.6907.d:0 "구리를 나타내는 원소 기호는 무엇일까요?"
 tfrkphn.6907.o0:0 "C"
 tfrkphn.6907.o1:0 "Co"
 tfrkphn.6907.o2:0 "Cu"
 tfrkphn.6907.o3:0 "Cr"
 tfrkphn.6937.d:0 "정답이다.\n\n구리는 라틴어 이름 쿠프룸에서 온 Cu로 쓴다. C는 탄소, Co는 코발트, Cr은 크로뮴이다."
 tfrkphn.6957.d:0 "아쉽다. 정답은 Cu이다.\n\n구리는 라틴어 이름 쿠프룸에서 온 Cu로 쓴다. C는 탄소, Co는 코발트, Cr은 크로뮴이다."
 tfrkphn.6908.t:0 "서울런 연습 문제 8 (중3)"
 tfrkphn.6908.d:0 "삼권 분립에서 법을 만드는 일을 맡은 기관은 어디일까요?"
 tfrkphn.6908.o0:0 "국회"
 tfrkphn.6908.o1:0 "정부"
 tfrkphn.6908.o2:0 "법원"
 tfrkphn.6908.o3:0 "헌법재판소"
 tfrkphn.6938.d:0 "정답이다.\n\n법은 국회가 만들고, 정부가 집행하며, 법원이 법에 따라 재판한다."
 tfrkphn.6958.d:0 "아쉽다. 정답은 국회다.\n\n법은 국회가 만들고, 정부가 집행하며, 법원이 법에 따라 재판한다."
 tfrkphn.6909.t:0 "서울런 연습 문제 9 (중3)"
 tfrkphn.6909.d:0 "빈칸에 알맞은 말은 무엇일까요? I ___ in Seoul since 2020."
 tfrkphn.6909.o0:0 "live"
 tfrkphn.6909.o1:0 "lived"
 tfrkphn.6909.o2:0 "have lived"
 tfrkphn.6909.o3:0 "am live"
 tfrkphn.6939.d:0 "정답이다.\n\nsince와 함께 과거부터 지금까지 이어지는 일을 말할 때는 현재완료 have lived를 쓴다."
 tfrkphn.6959.d:0 "아쉽다. 정답은 have lived이다.\n\nsince와 함께 과거부터 지금까지 이어지는 일을 말할 때는 현재완료 have lived를 쓴다."
 tfrkphn.6910.t:0 "정답"
 tfrkphn.6910.d:0 "허수 단위 i를 제곱하면 얼마일까요?"
 tfrkphn.6910.o0:0 "1"
 tfrkphn.6910.o1:0 "-1"
 tfrkphn.6910.o2:0 "i"
 tfrkphn.6910.o3:0 "0"
 tfrkphn.6940.d:0 "정답이다.\n\n허수 단위 i는 제곱하면 -1이 되는 수로 정한 것이다."
 tfrkphn.6960.d:0 "아쉽다. 정답은 -1이다.\n\n허수 단위 i는 제곱하면 -1이 되는 수로 정한 것이다."
 tfrkphn.6911.t:0 "서울런 연습 문제 11 (고1)"
 tfrkphn.6911.d:0 "지구의 대기에서 가장 많은 기체는 무엇일까요?"
 tfrkphn.6911.o0:0 "산소"
 tfrkphn.6911.o1:0 "이산화탄소"
 tfrkphn.6911.o2:0 "질소"
 tfrkphn.6911.o3:0 "아르곤"
 tfrkphn.6941.d:0 "정답이다.\n\n지구 대기의 약 78퍼센트가 질소이고, 산소는 약 21퍼센트다."
 tfrkphn.6961.d:0 "아쉽다. 정답은 질소다.\n\n지구 대기의 약 78퍼센트가 질소이고, 산소는 약 21퍼센트다."
 tfrkphn.6912.t:0 "서울런 연습 문제 12 (고1)"
 tfrkphn.6912.d:0 "갑오개혁이 시작된 해는 언제일까요?"
 tfrkphn.6912.o0:0 "1876년"
 tfrkphn.6912.o1:0 "1884년"
 tfrkphn.6912.o2:0 "1894년"
 tfrkphn.6912.o3:0 "1910년"
 tfrkphn.6942.d:0 "정답이다.\n\n갑오개혁은 1894년에 시작되었다. 1876년은 강화도 조약, 1884년은 갑신정변, 1910년은 국권 피탈이 일어난 해다."
 tfrkphn.6962.d:0 "아쉽다. 정답은 1894년이다.\n\n갑오개혁은 1894년에 시작되었다. 1876년은 강화도 조약, 1884년은 갑신정변, 1910년은 국권 피탈이 일어난 해다."
 tfrkphn.6913.t:0 "서울런 연습 문제 13 (고1)"
 tfrkphn.6913.d:0 "철수가 밥을 먹었다에서 밥을은 어떤 문장 성분일까요?"
 tfrkphn.6913.o0:0 "주어"
 tfrkphn.6913.o1:0 "목적어"
 tfrkphn.6913.o2:0 "서술어"
 tfrkphn.6913.o3:0 "부사어"
 tfrkphn.6943.d:0 "정답이다.\n\n먹었다의 대상이 되는 밥을은 목적어다. 철수가는 주어, 먹었다는 서술어다."
 tfrkphn.6963.d:0 "아쉽다. 정답은 목적어다.\n\n먹었다의 대상이 되는 밥을은 목적어다. 철수가는 주어, 먹었다는 서술어다."
 tfrkphn.6914.t:0 "서울런 연습 문제 14 (고2)"
 tfrkphn.6914.d:0 "로그 log 2 8 (밑이 2인 8의 로그)의 값은 얼마일까요?"
 tfrkphn.6914.o0:0 "2"
 tfrkphn.6914.o1:0 "3"
 tfrkphn.6914.o2:0 "4"
 tfrkphn.6914.o3:0 "8"
 tfrkphn.6944.d:0 "정답이다.\n\n2를 세 번 곱하면 8이 되므로 밑이 2인 8의 로그는 3이다."
 tfrkphn.6964.d:0 "아쉽다. 정답은 3이다.\n\n2를 세 번 곱하면 8이 되므로 밑이 2인 8의 로그는 3이다."
 tfrkphn.6915.t:0 "서울런 연습 문제 15 (고2)"
 tfrkphn.6915.d:0 "뉴턴의 운동 제2법칙을 나타낸 식은 무엇일까요?"
 tfrkphn.6915.o0:0 "F = mv"
 tfrkphn.6915.o1:0 "F = ma"
 tfrkphn.6915.o2:0 "F = mgh"
 tfrkphn.6915.o3:0 "F = mv제곱/2"
 tfrkphn.6945.d:0 "정답이다.\n\n힘은 질량과 가속도의 곱이다. mv는 운동량, mgh는 위치 에너지, mv제곱/2는 운동 에너지다."
 tfrkphn.6965.d:0 "아쉽다. 정답은 F = ma이다.\n\n힘은 질량과 가속도의 곱이다. mv는 운동량, mgh는 위치 에너지, mv제곱/2는 운동 에너지다."
 tfrkphn.6916.t:0 "서울런 연습 문제 16 (고2)"
 tfrkphn.6916.d:0 "25도에서 pH가 7보다 작은 수용액은 어떤 성질일까요?"
 tfrkphn.6916.o0:0 "산성"
 tfrkphn.6916.o1:0 "중성"
 tfrkphn.6916.o2:0 "염기성"
 tfrkphn.6916.o3:0 "알 수 없다"
 tfrkphn.6946.d:0 "정답이다.\n\n25도에서 pH 7은 중성이고, 7보다 작으면 산성, 크면 염기성이다."
 tfrkphn.6966.d:0 "아쉽다. 정답은 산성이다.\n\n25도에서 pH 7은 중성이고, 7보다 작으면 산성, 크면 염기성이다."
 tfrkphn.6917.t:0 "서울런 연습 문제 17 (고2)"
 tfrkphn.6917.d:0 "빈칸에 알맞은 말은 무엇일까요? If I ___ a bird, I could fly."
 tfrkphn.6917.o0:0 "am"
 tfrkphn.6917.o1:0 "were"
 tfrkphn.6917.o2:0 "have been"
 tfrkphn.6917.o3:0 "will be"
 tfrkphn.6947.d:0 "정답이다.\n\n지금 사실과 반대되는 일을 가정하는 가정법 과거에서는 be동사로 were를 쓴다."
 tfrkphn.6967.d:0 "아쉽다. 정답은 were이다.\n\n지금 사실과 반대되는 일을 가정하는 가정법 과거에서는 be동사로 were를 쓴다."
 tfrkphn.6910.a:0 "다음에도 풀어 본다."
 tfrkphn.6920.t:0 "오답"
 tfrkphn.6920.a:0 "다시 공부한다."
 tfrkphn.6929.t:0 "서울런 성장 기록"
 tfrkphn.6929.d:0 "지금 서울런 수강생은 §Y[?TFRKPHN_sl|0]만 명§!이다. 목표는 50만 명이다.\n\nSLU 졸업식은 지금까지 §Y[?TFRKPHN_sl_claim|0]§!번 열었다. 다음 졸업식은 수강생이 §Y[?TFRKPHN_sl_next|0]만 명§!을 넘으면 열 수 있다.\n\n서울런 덕분에 연구 속도가 §G[?TFRKPHN_sl_rspct|1]퍼센트§! 빨라졌다. 빈곤 개선과 사회 발전도 달마다 조금씩 나아지고 있다."
 tfrkphn.6929.a:0 "계속 넓힌다."
