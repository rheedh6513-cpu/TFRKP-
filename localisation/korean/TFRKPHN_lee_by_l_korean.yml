l_korean:
 tfrkphn.6762.t:0 "정원오, 다시 서울시장 도전"
 tfrkphn.6766.t:0 "열세 해 전의 토론장"
 tfrkphn.6764.t:0 "정원오, 서울시장 보궐선거 당선"
 tfrkphn.6763.t:0 "조은희, 서울시장 보궐선거 당선"
 tfrkphn.6767.t:0 "정몽준, 열세 해 만에 서울시장 당선"
 tfrkphn.6766.d:0 "2014년 5월 26일 밤, 여의도 MBC. 서울시장 선거를 아흐레 앞두고 박원순 시장과 정몽준 후보가 마주 앉았다. 일주일 전 토론에서 정 후보는 '서울에서 사람은 빠져나가고, 장사는 안 되고, 범죄는 늘어나는 등 서울이 가라앉고 있다'고 몰아붙였다. 이날 용산 개발을 두고 그가 '단군 이래 최대 사업인데, 이 정도의 우여곡절은 있을 수 있다'고 하자, 박 시장은 '이제 우리는 낡은 개발 시대와 결별해야 한다'고 받았다. 정 후보는 43.02를 얻고 졌다.\n\n열세 해 뒤 보궐선거 토론회에서 정원오 후보가 그해를 꺼냈다. 마지막으로 선거를 치른 것이 2014년인데 그 사이 서울이 어떻게 달라졌는지 아느냐는 질문이었다. 다음 날 기사 제목에는 답 대신 질문만 실렸다.\n\n이름값으로 얻은 표가 강북에서 조금씩 빠지고 있다."
 tfrkphn.6762.d:0 "더불어민주당이 서울시장 보궐선거 후보로 정원오 전 성동구청장을 확정했다. 지난해 6월 지방선거에서 오세훈 시장에게 1퍼센트포인트도 안 되는 차이로 진 지 열 달 만의 재도전이다.\n\n그는 지난해 2월 8일 문래동 북콘서트에서 '서울시장에 출마하려고 한다'며 처음 도전을 알렸고, '세금이 아깝지 않은 서울'을 내걸었다. 개표가 끝난 6월 4일 아침에는 '시민 여러분의 선택을 무겁고 겸허히 받들겠습니다. 제가 부족했습니다'라고 말했다.\n\n성동구청장을 세 번 하며 성수동을 바꾼 이력이 그의 가장 큰 무기다. 이번에는 현직 시장 없이 치르는 맞대결이다."
 tfrkphn.6761.d:0 "오세훈 전 시장이 경선에 나서며 비운 서울시장 자리를 채울 보궐선거가 4월 7일로 잡혔다. 시청은 지난 12월부터 권한대행이 지켜 왔고, 이인제 대통령 취임 한 달 만에 치르는 선거라 새 정부가 받는 첫 성적표가 된다.\n\n당 안에서는 두 이름이 나온다. 정몽준은 당이 불러낸 원로다. 1988년에 국회에 들어와 일곱 번 당선됐고 당 대표를 지냈다. 2014년 6월 4일 서울시장 선거에 나가 43.02를 얻고 졌는데, 그 뒤로 열세 해가 지났다. 이름을 모르는 유권자가 없지만, 시청에 들어간 뒤에 대통령의 말을 들을 사람은 아니다.\n\n다른 한 사람은 조은희다. 서울시 첫 여성 정무부시장을 지냈고, 2018년에는 서울 스물다섯 구 가운데 우리 당이 이긴 단 한 곳 서초에서 구청장에 다시 뽑혔다. 경선에서 진 오 전 시장 쪽 사람들이 그를 밀고 있다."
 tfrkphn.6763.d:0 "국민의힘 조은희 후보가 7일 치러진 서울시장 보궐선거에서 정원오 후보를 꺾고 당선됐다. 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었다. 서울시 첫 여성 정무부시장을 지낸 그는 이번에 첫 여성 서울시장이 됐다.\n\n2018년 지방선거 뒤 서울 구청장 스물다섯 명 가운데 스물네 명이 다른 당이던 때, 그는 '더 낮아지고 넓어져서' 일하겠다고 했고 '엄마의 마음으로 구석구석을 따뜻하고 꼼꼼하게 살피겠다'고 말했다. 이번에는 시청에서 그 약속을 지켜야 한다.\n\n대선 한 달 만에 치른 첫 선거에서 여당이 서울을 지켰다. 넉 달 동안 비어 있던 시장실에 새 주인이 들어가고, 새 시장은 2030년 6월까지 남은 임기를 맡는다."
 tfrkphn.6767.d:0 "국민의힘 정몽준 후보가 7일 치러진 서울시장 보궐선거에서 정원오 후보를 꺾고 당선됐다. 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었다. 2014년 박원순 시장에게 진 지 열세 해 만이다.\n\n그해 6월 5일 새벽 그는 '시민들의 선택을 겸허하게 받아들이겠다'며 물러섰고, 선거 기간 받은 사랑을 '항상 감사하게 생각하고 마음속에 오랫동안 간직하겠다'고 말했다. 일곱 번 국회에 들어간 원로가 이번에는 시청으로 간다.\n\n대선 한 달 만에 치른 첫 선거에서 여당이 서울을 지켰다. 다만 새 시장은 대통령의 말을 그대로 따를 사람은 아니라는 말이 당 안에서 나온다. 남은 임기는 2030년 6월까지다."
 tfrkphn.6764.d:0 "더불어민주당 정원오 후보가 7일 치러진 서울시장 보궐선거에서 당선됐다. 우리 당 [GetTFRKPHNSdCand] 후보는 졌고, 스물다섯 구의 여당 지지도 평균은 [?TFRKPHN_sd_avg|1]이었다. 지난해 6월 오세훈 시장에게 1퍼센트포인트도 안 되는 차이로 진 지 열 달 만에 같은 자리를 차지했다.\n\n정 당선인은 지난해 출마를 알리며 '세금이 아깝지 않은 서울'을 내걸었고, '행정은 시민들의 삶의 요구에서부터 시작해야 한다'고 말했다. 성동구청장 시절 성수동에서 해 온 방식을 서울 전체로 넓히겠다는 것이다.\n\n오세훈 전 시장이 다섯 번 이긴 시청이 그가 떠난 지 넉 달 만에 야당으로 넘어갔다. 새 시장은 2030년 6월까지 남은 임기를 맡는다. 정부는 이제 야당 시장과 마주 앉아 서울의 일을 풀어야 한다."
