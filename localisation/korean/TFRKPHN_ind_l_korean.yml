l_korean:
 # [안내] 공장을 주는 1회용 결정 탭의 글. ind_build.py가 만든다.
 TFRKPHN_ind_cho_category:0 "수출 입국 사업"
 TFRKPHN_ind_cho_category_desc:0 "조원진 정부는 공단을 다시 돌려 수출로 나라를 세우겠다고 약속했습니다. 정부가 땅과 돈을 대고 기업이 공장을 짓습니다. 사업마다 한 번씩 벌일 수 있습니다."
 TFRKPHN_ind_cho_1:0 "구미 전자 공단 재가동"
 TFRKPHN_ind_cho_1_desc:0 "구미 공단의 빈 공장에 다시 전기를 넣습니다. 정부가 임대료를 대신 내고 전자 부품 업체를 불러들입니다."
 TFRKPHN_ind_cho_2:0 "창원 기계 공단 증설"
 TFRKPHN_ind_cho_2_desc:0 "창원의 기계 공장들에 포신과 장갑판 주문을 넣습니다. 방위 산업을 수출 품목으로 키우는 사업입니다."
 TFRKPHN_ind_cho_3:0 "포항 제철소 증설"
 TFRKPHN_ind_cho_3_desc:0 "포항 제철소에 고로를 하나 더 올리고 항구까지 철길을 새로 놓습니다."
 TFRKPHN_ind_cho_4:0 "울산 조선소 독 증설"
 TFRKPHN_ind_cho_4_desc:0 "울산 조선소에 독을 더 팝니다. 정부가 첫 배의 주문을 보증합니다."
 TFRKPHN_ind_cho_5:0 "대구 섬유 공단 정비"
 TFRKPHN_ind_cho_5_desc:0 "대구의 낡은 섬유 공장을 헐고 새 설비를 들입니다. 문 닫은 공장의 직공들이 다시 출근합니다."
 TFRKPHN_ind_woo_category:0 "재건 사업"
 TFRKPHN_ind_woo_category_desc:0 "우원식 정부는 무너진 살림을 작은 공장과 일자리부터 다시 세우려 합니다. 정부가 설비 값을 빌려주고 노동자와 업주가 함께 운영합니다. 사업마다 한 번씩 벌일 수 있습니다."
 TFRKPHN_ind_woo_1:0 "을지로 공구 상가 재건"
 TFRKPHN_ind_woo_1_desc:0 "을지로의 공구 상가와 금속 가공 골목에 설비 자금을 댑니다. 골목 하나가 통째로 작은 공장이 됩니다."
 TFRKPHN_ind_woo_2:0 "반월 시화 공단 지원"
 TFRKPHN_ind_woo_2_desc:0 "반월과 시화의 하청 공장들에 정부 주문을 직접 넣습니다. 원청을 거치지 않고 대금을 줍니다."
 TFRKPHN_ind_woo_3:0 "새만금 태양광 단지"
 TFRKPHN_ind_woo_3_desc:0 "새만금 간척지에 태양광 발전 단지를 놓습니다. 수익의 일부는 주민 조합이 가져갑니다."
 TFRKPHN_ind_woo_4:0 "광주 상생 일자리 공장"
 TFRKPHN_ind_woo_4_desc:0 "광주에 노동자와 회사와 시가 함께 임금을 정하는 자동차 공장을 세웁니다."
 TFRKPHN_ind_woo_5:0 "태백 폐광 지역 전환"
 TFRKPHN_ind_woo_5_desc:0 "문 닫은 탄광 자리에 공장을 들이고 끊긴 철길을 다시 잇습니다."
 TFRKPHN_ind_skm_category:0 "지역 균형 사업"
 TFRKPHN_ind_skm_category_desc:0 "세 사람은 공장을 서울 밖으로 고르게 나누겠다고 함께 약속했습니다. 지역마다 산업 하나씩을 정해 정부가 터를 닦습니다. 사업마다 한 번씩 벌일 수 있습니다."
 TFRKPHN_ind_skm_1:0 "대구 산업 단지 재생"
 TFRKPHN_ind_skm_1_desc:0 "대구의 오래된 산업 단지를 다시 짓습니다. 낡은 공장 터에 부품 업체들이 들어옵니다."
 TFRKPHN_ind_skm_2:0 "충청 반도체 단지"
 TFRKPHN_ind_skm_2_desc:0 "충청도에 반도체 공장 터를 닦고 물과 전기를 끌어옵니다."
 TFRKPHN_ind_skm_3:0 "부산 항만 배후 단지"
 TFRKPHN_ind_skm_3_desc:0 "부산 신항 뒤편에 조립 공장과 수리 조선소를 함께 들입니다."
 TFRKPHN_ind_skm_4:0 "여수 석유화학 단지 증설"
 TFRKPHN_ind_skm_4_desc:0 "여수의 석유화학 단지에 새 설비를 올립니다. 정부가 부두와 배관을 맡습니다."
 TFRKPHN_ind_skm_5:0 "원주 의료 기기 단지"
 TFRKPHN_ind_skm_5_desc:0 "원주에 의료 기기 공장을 모으고 서울로 가는 길을 넓힙니다."
