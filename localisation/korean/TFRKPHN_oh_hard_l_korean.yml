l_korean:
 TFRKPHN_hd_a_tt:0 "당 개혁 탭이 열려 있으면 개혁 지지 §G+5§!, 강경파 반발 §R+12§!"
 TFRKPHN_hd_b_tt:0 "당 개혁 탭이 열려 있으면 개혁 지지 §R-5§!, 강경파 반발 §G-8§!"
 TFRKPHN_hd_c_tt:0 "개혁 지지가 60을 넘어 당이 대통령 편에 섭니다. 개혁 지지 §G+3§!, 강경파 반발 §R+3§!"
 tfrkphn.6997.t:0 "영수회담 다음 날"
 tfrkphn.6997.d:0 "대통령과 야당 대표가 마주 앉은 다음 날 아침, 여당 의원총회는 예정보다 한 시간 늦게 끝났습니다. 회의장 문 밖까지 고성이 들렸습니다.\n\n강경파의 맨 앞에는 장동혁 의원이 섰습니다. 그는 회담에서 나온 합의문을 문제 삼았습니다. 전쟁 시기에 만든 비상 입법 몇 개를 여야가 함께 다시 살펴보자는 한 줄이었습니다. 장 의원은 마이크도 없이 소리쳤습니다. 이럴 거면 국민의힘을 탈당하고 민주당으로 가라는 말이었습니다. 몇몇 의원이 박수를 쳤습니다. 그 한마디는 그날 저녁 모든 방송의 첫 화면에 걸렸습니다.\n\n원내대표는 합의문의 후속 협의를 당분간 미루자는 의견을 대통령실에 전했습니다. 같은 날 오후 야당 대변인은 여당이 하루 만에 말을 바꾸려 한다고 논평했습니다.\n\n대통령실 회의에서 정무수석은 어느 쪽을 골라도 누군가는 등을 돌릴 것이라고 보고했습니다."
 tfrkphn.6997.a:0 "합의는 합의입니다. 협의체를 띄웁니다."
 tfrkphn.6997.b:0 "비상 입법은 빼고 민생부터 갑니다."
 tfrkphn.6997.c:0 "당 지도부가 먼저 합의문을 받칩니다."
 tfrkphn.6998.t:0 "안심소득 예산 표결"
 tfrkphn.6998.d:0 "안심소득 전면 시행에 드는 첫해 예산이 국회 예산결산특별위원회에 올라왔습니다. 정부는 기존 현금 복지 일곱 가지를 하나로 묶어 늘어나는 돈을 줄였다고 설명했습니다.\n\n여당 강경파 의원 열여섯 명은 표결 전날 장동혁 의원의 방에 모였습니다. 장 의원은 민주당 공약을 우리 정부가 대신 해 주는 꼴이라며 수정안을 앞장서 냈습니다. 시행 지역을 수도권과 일부 광역시로 줄이고, 나머지는 3년 뒤에 다시 논의하자는 내용입니다.\n\n수정안이 통과되면 정부안은 반쪽이 됩니다. 반대로 정부안을 그대로 밀면 여당 표가 갈리고, 야당 표를 빌려야 합니다. 야당은 안심소득 자체에는 찬성한다고 밝혀 왔습니다.\n\n표결은 금요일 오후 두 시로 잡혔습니다. 국회 앞에는 시범 사업에 참여한 가구 몇십 명이 나와 피켓을 들었습니다."
 tfrkphn.6998.a:0 "정부안 그대로, 야당 표를 빌려서라도 통과시킵니다."
 tfrkphn.6998.b:0 "수정안을 받습니다. 나머지는 3년 뒤에."
 tfrkphn.6998.c:0 "여당이 한목소리로 정부안을 냅니다."
 tfrkphn.6999.t:0 "국방위의 경고"
 tfrkphn.6999.d:0 "정부가 비상 태세를 풀겠다고 발표한 지 열흘 만에 국회 국방위원회가 긴급 현안 질의를 열었습니다. 질의를 요구한 쪽은 야당이 아니라 여당 의원들이었습니다.\n\n여당 국방위원 다섯 명은 국방부 장관을 상대로 네 시간 동안 질문을 이어 갔습니다. 북쪽 국경의 경계 병력, 예비군 동원 기간, 해상 초계 횟수가 모두 줄어드는 것이 맞는지 하나씩 따졌습니다. 한 의원은 민주당 정부도 이렇게 빨리 풀지는 않았을 거라고 말했습니다.\n\n예비역 장성 모임은 같은 날 성명을 내고 단계적 해제를 요구했습니다. 국방부는 해제 일정을 이미 각 부대에 내려보낸 상태였습니다.\n\n장관은 질의가 끝나자 곧장 대통령실로 올라왔습니다. 그가 든 서류철에는 부대별 해제 날짜가 빼곡하게 적혀 있었습니다."
 tfrkphn.6999.a:0 "일정대로 풉니다. 전쟁은 끝났습니다."
 tfrkphn.6999.b:0 "속도를 늦춥니다. 국경 쪽은 한 해 더 둡니다."
 tfrkphn.6999.c:0 "당이 국방위를 설득합니다."
 tfrkphn.7000.t:0 "공장 지대의 반발"
 tfrkphn.7000.d:0 "정부가 이천오십 탄소중립 이행 계획을 내놓자 공업 지역에 지역구를 둔 여당 의원들이 먼저 들고일어났습니다. 계획에는 석탄 발전소 열한 곳을 앞당겨 닫고, 제철과 석유화학 공장에 탄소 배출 한도를 두는 내용이 들어 있었습니다.\n\n의원 열네 명은 연판장을 돌렸습니다. 맨 앞에 이름을 올린 사람은 화력 발전소가 있는 충남 보령이 지역구인 장동혁 의원이었습니다. 전쟁 때 탄약과 군함을 만든 공장들이 이제 겨우 숨을 돌리는데 문을 닫으라는 말이냐고 적었습니다. 장 의원은 기자들 앞에서 이건 민주당이 십 년 전에 내놓은 공약을 그대로 베낀 것이라고 말했습니다.\n\n울산과 포항의 노조도 같은 주에 집회를 열었습니다. 다만 노조는 탄소중립 자체보다 일자리 전환 지원이 빠진 것을 문제 삼았습니다.\n\n같은 날 환경부와 산업부 장관은 서로 다른 보고서를 들고 대통령실 문을 두드렸습니다."
 tfrkphn.7000.a:0 "일정대로 갑니다. 전환 지원은 따로 붙입니다."
 tfrkphn.7000.b:0 "공업 지역은 시한을 다섯 해 늦춥니다."
 tfrkphn.7000.c:0 "당이 지역구 의원들과 전환 계획을 같이 짭니다."
