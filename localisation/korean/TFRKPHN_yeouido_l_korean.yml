 # [안내] 여의도 민주주의 국가정신. woo_cab_build.py가 만든다.
 TFRKPHN_yeouido_idea:0 "여의도 민주주의"
 TFRKPHN_yeouido_idea_desc:0 "\n\n\n\n£GFX_banner_KOR_candlelight_idea\n\n\n\n\n\n§Y여의도 민주주의§!는 긴급명령과 전차의 사흘 동안 국회를 지켜 낸 사람들에게서 나왔습니다. 시민들은 비를 맞으며 여의도의 바리케이드를 지켰고, 국회의원들은 담을 넘어 본회의장으로 들어갔습니다. 광장의 함성이 대통령을 세우고 끌어내리던 시대를 지나, 나라의 일은 다시 국회 본회의장에서 정해져야 한다는 믿음이 그 사흘에서 태어났습니다.\n\n여의도 민주주의는 어느 한 정당의 것이 아닙니다. 보수에서 사회민주주의까지 헌법을 되살린다는 한 가지 약속으로 모였고, 대통령은 국회 위에 서지 않고 국회와 함께 일합니다. 그 약속이 언제까지 지켜질지는 아무도 장담하지 못하지만, 국회 앞 아스팔트에 남은 바퀴 자국 한 줄이 그날을 기억하게 합니다."
