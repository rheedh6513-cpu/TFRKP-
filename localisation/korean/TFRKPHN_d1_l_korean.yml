 # 이인제 정부: 누군가는 해야 할 일. d1_build.py가 만든다.
 tfrkphn.537.t:0 "누군가는 해야 할 일"
 tfrkphn.537.story:0 "\"무분별한 세습 경영이 우리 기업들을 다 망치고 있습니다. 세습, 뭐 좋다 이거예요. 그런데 이 나라는 도가 넘었습니다. 유럽 보세요. 유럽에서 한국처럼 하면 회사가 망합니다. 심지어 그 중국도 그 정도로는 안 해요.\"\n\n집무실 텔레비전에서 토론에 나온 누군가가 말하고 있었다.\n\n맞는 말이다. 대통령이 되기 전부터 그는 기업의 횡포를 보아 왔다.\n\n기업은 이 나라에 꼭 필요하다. 하지만 물은 이미 고일 대로 고였고, 새로 들어오는 물은 번번이 바깥으로 떨어진다. 내부거래와 기술 약탈, 이 모든 것이 제 나라 기업을 상대로 하는 짓이다.\n\n고여 있기는 일터도 마찬가지다. 한번 들어간 사람은 나오지 않고 밖에 선 사람은 들어가지 못하는 것이, 그가 노동부 장관이던 때와 달라진 데가 없다.\n\n누군가는 해야 한다. 욕을 먹더라도 해야 한다.\n\n고인 물은 흘려보내야 썩지 않는다."
 tfrkphn.537.a:0 "욕을 먹더라도 한다"
