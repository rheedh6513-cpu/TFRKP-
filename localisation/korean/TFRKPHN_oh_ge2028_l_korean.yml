l_korean:
 # 오세훈 정부: 2028년 총선과 개발 반발 사건. oh_ge2028_build.py가 만든다.
 tfrkphn.6611.t:0 "철거에 맞서는 사람들"
 tfrkphn.6611.d:0 "재개발 구역에서 철거를 막는 농성이 시작됐다. 세입자들과 작은 가게 주인들이다. 집주인들은 조합을 만들어 새 아파트를 받지만, 세 들어 살던 사람들은 이사 비용만 받고 떠나야 한다.\n\n농성장에는 이 동네에서 서른 해 장사를 했다는 현수막이 걸렸다. 건설사는 공사 일정이 하루 밀릴 때마다 드는 돈을 계산해 구청에 보냈다. 우리 재개발 사업은 이제 다섯 구역 가운데 두 곳을 넘겼다."
 tfrkphn.6611.a:0 "세입자 보상을 올리고 공사를 잇는다."
 tfrkphn.6611.a_tt:0 "총선 때 여당 의석 §G+2§!\n서울 강북권 14개 구의 여당 지지도 §G+1§!"
 tfrkphn.6611.b:0 "일정대로 철거한다."
 tfrkphn.6611.b_tt:0 "총선 때 여당 의석 §R-3§!\n서울 강북권 14개 구의 여당 지지도 §R-2§!"
 tfrkphn.6612.t:0 "수도권만 커진다"
 tfrkphn.6612.d:0 "지방의 시장과 도지사들이 한목소리로 성명을 냈다. 메가시티 사업이 수도권부터 앞서 나가고 있다는 것이다. 수도권은 벌써 세 단계를 올렸는데 다른 권역은 첫 삽을 겨우 떴다고 그들은 말한다.\n\n성명에는 여당 소속 단체장들도 이름을 올렸다. 지방 신문들은 일제히 1면에 수도권과 지방의 사업 진행표를 나란히 실었다."
 tfrkphn.6612.a:0 "다음 예산은 지방 권역에 먼저 쓴다."
 tfrkphn.6612.a_tt:0 "총선 때 여당 의석 §G+3§!"
 tfrkphn.6612.b:0 "계획한 순서대로 간다."
 tfrkphn.6612.b_tt:0 "총선 때 여당 의석 §R-4§!"
 tfrkphn.6613.t:0 "통합에 반대하는 군"
 tfrkphn.6613.d:0 "메가시티로 묶이는 권역의 한 군에서 통합 반대 서명이 주민 절반을 넘겼다. 큰 도시에 합쳐지면 군청이 없어지고 예산도 도시 쪽으로 쏠린다는 걱정이다.\n\n군의회는 만장일치로 반대 결의안을 냈다. 권역의 광역철도 노선도에서 이 군을 지나는 역이 하나뿐이라는 점도 불만을 키웠다."
 tfrkphn.6613.a:0 "주민투표에 부치고 결과를 따른다."
 tfrkphn.6613.a_tt:0 "총선 때 여당 의석 §G+2§!"
 tfrkphn.6613.b:0 "법으로 정한 대로 통합한다."
 tfrkphn.6613.b_tt:0 "총선 때 여당 의석 §R-3§!"
 tfrkphn.6614.t:0 "망명 기업 옆 동네의 집값"
 tfrkphn.6614.d:0 "망명 기업이 자리 잡은 동네의 집값과 월세가 한 해 사이에 크게 올랐다. 높은 연봉을 받는 직원들이 한꺼번에 집을 구했기 때문이다.\n\n원래 살던 세입자들이 재계약을 하지 못하고 밀려나고 있다. 부동산 중개소 유리창에는 영어로 쓴 매물 안내가 붙었고, 동네 주민 모임은 구청 앞에서 집회를 열었다."
 tfrkphn.6614.a:0 "그 동네에 공공주택을 먼저 짓는다."
 tfrkphn.6614.a_tt:0 "총선 때 여당 의석 §G+2§!\n서울 서남권 7개 구의 여당 지지도 §G+1§!"
 tfrkphn.6614.b:0 "시장에 맡긴다."
 tfrkphn.6614.b_tt:0 "총선 때 여당 의석 §R-2§!\n강남과 강북의 격차 §R+1§!"
 tfrkphn.6615.t:0 "강북의 외침"
 tfrkphn.6615.d:0 "강북의 여러 구에서 주민들이 날마다 구청 앞에 모이고 있다. 개발이 한강 남쪽에만 몰린다는 것이다. 강남과 강북의 격차는 우리가 취임했을 때보다 더 벌어졌다.\n\n집회에는 여당을 찍었다는 사람들도 나왔다. 한 참가자는 약자와의 동행이라는 말을 선거 때 분명히 들었다고 말했다."
 tfrkphn.6615.a:0 "강북 개발 예산을 따로 세운다."
 tfrkphn.6615.a_tt:0 "총선 때 여당 의석 §G+3§!\n강남과 강북의 격차 §G-1§!\n서울 강북권 14개 구의 여당 지지도 §G+2§!"
 tfrkphn.6615.b:0 "지금 계획으로 충분하다고 설명한다."
 tfrkphn.6615.b_tt:0 "총선 때 여당 의석 §R-4§!\n서울 강북권 14개 구의 여당 지지도 §R-2§!"
 tfrkphn.6601.t:0 "공천"
 tfrkphn.6601.d:0 "제23대 국회의원 선거가 한 달 앞으로 다가왔다. 여당은 지난 총선에서 199석을 얻었다. 양안전쟁이 끝난 직후에 치른 선거였고, 이번에는 그 바람이 없다.\n\n당 공천관리위원회가 대통령실에 뜻을 물어 왔다. 현역 의원을 크게 바꿔 새 얼굴을 세우자는 쪽과, 지역을 다져 온 현역을 그대로 내보내자는 쪽이 맞서 있다."
 tfrkphn.6601.a:0 "현역을 크게 바꾼다."
 tfrkphn.6601.a_tt:0 "총선 때 여당 의석 §G+6§!"
 tfrkphn.6601.b:0 "현역 중심으로 간다."
 tfrkphn.6603.t:0 "제23대 총선: 여당 압승"
 tfrkphn.6603.d:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당은 지난번에 버금가는 의석을 지켰다. 전쟁의 바람 없이 치른 선거에서 얻은 결과다. 출구조사가 나온 순간 당사에서는 박수가 터졌고, 수도권의 접전지 여러 곳이 자정 무렵 여당 쪽으로 넘어왔다. 남은 임기 동안 국회는 정부의 편에 선다."
 tfrkphn.6603.a:0 "남은 네 해도 이렇게 간다."
 tfrkphn.6604.t:0 "제23대 총선: 과반을 지키다"
 tfrkphn.6604.d:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당은 의석을 여럿 잃었지만 과반은 지켰다. 지난 총선의 199석은 전쟁 직후의 숫자였고, 이번이 평시의 성적에 가깝다는 평가가 나온다. 수도권에서 잃은 의석을 메가시티 사업이 진행된 권역에서 얼마간 되찾았다."
 tfrkphn.6604.a:0 "과반이면 일할 수 있다."
 tfrkphn.6605.t:0 "제23대 총선: 과반을 잃다"
 tfrkphn.6605.d:0 "개표가 끝났다. 국민의힘 §Y[?KOR_NatAsm_PPP_seats|0]§!석, 더불어민주당 §Y[?KOR_NatAsm_DP_seats|0]§!석, 그 밖의 정당과 무소속 §Y12§!석이다.\n\n여당이 과반을 잃었다. 지난 총선의 199석에서 크게 줄었다. 서울의 여러 구와 개발에서 밀려난 지역에서 표가 빠졌다. 당사에는 자정이 되기 전에 불이 꺼졌다. 남은 임기 동안 예산과 법안은 야당과 마주 앉아야 통과된다."
 tfrkphn.6605.a:0 "결과를 받아들인다."
