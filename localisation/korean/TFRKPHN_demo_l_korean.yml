 # 민주주의 묘사로 새로 쓴 글. demo_build.py가 만든다. 원문은 TFRKP_HN_l_korean.yml에 그대로 있다.
 tfrkphn.133.kp:0 "헌법재판소 대심판정에서 마지막 선고가 끝났습니다. 재판관들은 결정문을 읽은 뒤 조용히 법정을 떠났습니다. 헌법재판 권한은 대법원 헌법재판부로 넘어가고, 늘어난 대법관 네 명이 그 자리를 채웁니다. 정당 해산과 탄핵 심판도 이제 대법원이 맡습니다. 1987년 헌법이 낳은 기관 하나가 그렇게 문을 닫았습니다.\n\n이 조문은 국회 재적 의원 3분의 2의 찬성과 국민투표를 거쳐 바뀌었습니다. 야당 의원 가운데 몇은 끝까지 반대표를 던졌고, 마지막 선고가 있던 날에는 방청석에 앉아 있었습니다.\n\n헌법재판소는 1988년에 문을 연 뒤로 정부가 진 사건을 적지 않게 남겼습니다. 대법원이 그 일을 이어받아 정부를 지게 할 수 있겠느냐는 물음이 우리에게도 왔습니다. 대통령은 지게 하라고 만든 자리라고 답했다고 합니다.\n\n법조계의 반응은 엇갈립니다. 법률 판단과 헌법 판단이 한곳에서 내려지니 일관성이 생긴다는 쪽과 대법원에 너무 큰 힘이 몰린다는 쪽이 맞서 있습니다."
 tfrkphn.136.kp:0 "중앙선거관리위원회 개편안이 확정되었습니다. 선관위는 국가 선거와 정당 사무만 맡게 되고, 그동안 넓혀 온 위탁 선거 업무는 내려놓습니다. 감사원과 특별감찰관의 외부 감사가 정례화되고 투표와 개표의 모든 과정이 공개됩니다.\n\n개편안은 위원을 뽑는 방식에는 손대지 않았습니다. 대통령과 국회, 대법원장이 세 사람씩 정하는 지금의 틀은 그대로 남습니다. 감사가 정부의 손이 되어서는 안 된다는 야당의 요구도 받아들여, 감사 결과는 국회에 먼저 보고하게 했습니다.\n\n채용 비리로 얼룩졌던 조직에 처음으로 바깥의 눈이 들어갑니다. 선거 결과를 두고 되풀이되던 논란도 줄어들 것으로 보입니다."
