l_korean:
 # 오세훈 중점 사건. oh_focus_ev_build.py가 만든다.
 tfrkphn.6701.t:0 "중도로 넓힌다"
 tfrkphn.6701.d:0 "우리는 내각과 당직의 문을 가운데 쪽으로 열었습니다. 전쟁 동안 우리와 거리를 두었던 사람들에게도 자리를 권했습니다.\n\n홍준표 정부는 전쟁을 치르는 동안 반대편을 밀어붙이는 방식으로 일했습니다. 우리는 그 방식을 물려받지 않기로 했습니다. 대통령은 2019년 2월 7일 당 대표 선거에 나서며 박 전 대통령을 극복할 수 있어야 보수정치는 부활할 수 있다고 말한 사람입니다. 그해 선거에서 그는 졌습니다. 당 안에서는 벌써 불만이 나옵니다. 전쟁을 함께 치른 사람들을 두고 왜 밖에서 사람을 찾느냐는 것입니다."
 tfrkphn.6701.a:0 "문은 열어 둔다."
 tfrkphn.6702.t:0 "국민에게 묻는다"
 tfrkphn.6702.d:0 "우리는 가장 크게 갈린 쟁점을 국민투표에 부치기로 했습니다. 국회에서 몇 달째 풀리지 않던 문제입니다.\n\n대통령에게 투표함은 쓰라린 기억입니다. 2011년 8월 그는 무상급식을 주민투표에 부치고 시장직을 걸었습니다. 투표율은 개표 기준에 못 미쳤고 그는 물러났습니다. 참모들은 이번에도 직을 걸 것이냐고 물었고, 대통령은 걸지 않는다고 답했습니다. 결과가 어느 쪽으로 나오든 임기는 그대로 간다는 뜻입니다."
 tfrkphn.6702.a:0 "이번에는 직을 걸지 않는다."
 tfrkphn.6703.t:0 "비상 조치를 걷는다"
 tfrkphn.6703.d:0 "양안전쟁 동안 홍준표 정부가 걸어 두었던 비상 조치를 오늘부터 풉니다. 여론조사 공표 금지가 풀렸고, 비상 대기로 붙들려 있던 장병들에게 귀가 명령이 내려갔습니다.\n\n신문들은 오랜만에 정당 지지율 조사를 1면에 실었습니다. 부대 정문 앞에는 가족들이 새벽부터 차를 대고 기다렸습니다. 통제를 푸는 순서를 두고는 안에서 말이 많았습니다. 한꺼번에 풀면 중국을 자극한다는 걱정과, 끝난 전쟁의 비상 조치를 더 끌 까닭이 없다는 말이 맞섰습니다."
 tfrkphn.6703.a:0 "평시로 돌아간다."
 tfrkphn.6704.t:0 "돌아오지 못한 이들의 이름"
 tfrkphn.6704.d:0 "양안전쟁 때 비밀 지원에 나섰다가 숨진 사람들의 명단이 처음 공개됐습니다. 군인과 선원, 조종사의 이름과 숨진 날짜가 한 줄씩 적혔습니다.\n\n대한민국은 서류 위로는 중립국이었고, 이 이름들은 그동안 작전 보안을 이유로 묶여 있었습니다. 유족들은 사고로 숨졌다는 통지서 한 장만 받고 기다려 왔습니다. 보상의 기준도 법으로 정했습니다. 같은 전투에서 숨진 사람의 유족이 서로 다른 금액을 받는 일이 다시 없게 하려는 것입니다. 대통령은 명단이 걸린 벽 앞에서 한참 서 있었습니다. 몇몇 유족은 끝내 벽 앞에 서지 못했습니다. 사고였다는 말만 믿고 몇 해를 보낸 사람들이었습니다."
 tfrkphn.6704.a:0 "한 사람도 빠뜨리지 않는다."
 tfrkphn.6705.t:0 "스피드 주택공급"
 tfrkphn.6705.d:0 "주택 공급 계획을 발표했습니다. 2021년 4월 서울시장 선거에서 대통령은 다섯 해 동안 36만 가구를 약속했습니다. 그때의 방식을 나라 전체로 넓힙니다.\n\n핵심은 인허가에 걸리는 시간을 줄이는 것입니다. 지금은 구역 지정에서 착공까지 여러 해가 걸립니다. 따로 열리던 심의를 한 번에 묶어 그 시간을 크게 줄이기로 했습니다. 건설사들은 반겼고, 세입자 단체는 철거부터 빨라질 것이라고 걱정했습니다."
 tfrkphn.6705.a:0 "빨리 짓는다."
 tfrkphn.6706.t:0 "서른다섯 층의 벽"
 tfrkphn.6706.d:0 "아파트 높이를 35층으로 묶어 두었던 규제를 풀었습니다. 낮게 잡혀 있던 용적률도 함께 고쳤습니다.\n\n같은 땅에 더 많은 집을 지을 수 있게 됐습니다. 한강을 따라 선 낡은 단지들이 가장 먼저 재건축 계획을 냈고, 조감도에는 쉰 층이 넘는 건물이 그려져 있습니다. 강변의 하늘선이 달라진다는 말에 반기는 사람과 눈살을 찌푸리는 사람이 반씩입니다. 뒤 단지의 주민들은 햇빛이 가려진다며 구청에 의견서를 냈습니다."
 tfrkphn.6706.a:0 "하늘선이 달라진다."
 tfrkphn.6707.t:0 "상생주택"
 tfrkphn.6707.d:0 "상생주택의 첫 단지가 입주를 시작했습니다. 민간의 땅을 빌려 공공이 짓는 장기전세주택입니다. 2007년 서울에서 시작한 시프트의 두 번째 판이기도 합니다.\n\n땅 주인은 땅을 팔지 않고 임대료를 받고, 나라는 땅값을 들이지 않고 집을 짓습니다. 입주자는 주변 시세보다 낮은 보증금으로 길게 삽니다. 첫 단지의 경쟁률은 수십 대 일이었습니다. 추첨에서 떨어진 사람들이 다음 단지는 언제냐고 묻고 있습니다."
 tfrkphn.6707.a:0 "다음 단지를 서두른다."
 tfrkphn.6708.t:0 "약자와의 동행"
 tfrkphn.6708.d:0 "복지 정책의 이름을 약자와의 동행으로 정했습니다. 대통령이 서울시장 때 시정의 맨 앞에 두었던 말이고, 우리가 내건 따뜻한 보수의 첫 장이기도 합니다.\n\n2021년 9월 15일 그는 서울비전 2030을 내놓으며 계층 이동 사다리를 복원하겠다고 말했습니다. 우리 복지의 목표도 거기에 둡니다. 가난한 집 아이가 공부할 길, 일자리를 잃은 사람이 다시 설 길, 집 없는 사람이 집을 가질 길을 하나씩 놓겠다는 것입니다. 예산 당국은 전쟁 빚부터 갚아야 한다는 의견을 붙였습니다."
 tfrkphn.6708.a:0 "사다리를 다시 놓는다."
 tfrkphn.6709.t:0 "서울런을 전국으로"
 tfrkphn.6709.d:0 "형편이 어려운 집 아이들에게 온라인 강의를 무료로 열어 주던 서울의 사업이 전국으로 넓어졌습니다.\n\n민간 교육 회사의 강의를 나라가 사서 아이들에게 나눠 주는 방식입니다. 섬과 산골의 학생들이 대도시 학원가의 강의를 집에서 듣게 됐습니다. 교사 단체는 학교 수업이 밀려난다고 걱정했고, 학원 업계는 값을 너무 깎는다고 불평했습니다. 첫 달에 가입한 학생의 절반 가까이가 읍과 면에 사는 아이들이었습니다."
 tfrkphn.6709.a:0 "어디서나 같은 강의를 듣는다."
 tfrkphn.6710.t:0 "청년취업사관학교"
 tfrkphn.6710.d:0 "청년취업사관학교가 전국에서 문을 열었습니다. 기업이 바라는 기술을 가르쳐 곧바로 일자리로 잇는 학교입니다. 서울에서는 열 곳을 약속했던 사업입니다.\n\n첫 기수의 자리는 전쟁에서 돌아온 청년들에게 먼저 돌아갔습니다. 군복을 벗은 지 한 달이 안 된 사람들이 교실에 앉아 프로그래밍을 배웁니다. 수료생을 뽑겠다고 약속한 회사의 명단이 학교 벽에 붙었습니다. 접수 첫날 정원의 몇 배가 넘는 지원서가 들어왔습니다."
 tfrkphn.6710.a:0 "교실 문을 연다."
 tfrkphn.6711.t:0 "글로벌 TOP5"
 tfrkphn.6711.d:0 "서울을 세계 5대 도시로 올리겠다는 목표를 나라의 계획으로 발표했습니다. 대통령이 서울비전 2030에 적었던 목표입니다.\n\n전쟁은 뜻밖의 기회를 남겼습니다. 홍콩과 상하이에 있던 회사들이 새 주소를 찾고 있고, 미대륙을 떠난 회사들도 자리를 구합니다. 우리는 세금과 비자, 영어로 되는 행정을 묶어 내놓았습니다. 경쟁 도시는 도쿄와 싱가포르입니다. 외국 경제지들은 서울의 사무실 임대료가 벌써 오르기 시작했다고 썼습니다."
 tfrkphn.6711.a:0 "서울로 오게 한다."
 tfrkphn.6712.t:0 "여의도 디지털금융특구"
 tfrkphn.6712.d:0 "여의도가 디지털금융특구로 지정됐습니다. 서울에 있는 해외 금융기관을 250곳까지 늘리는 것이 서울시 때부터의 계획입니다.\n\n특구 안에서는 외국 금융사가 들어와 영업을 시작하기까지의 절차가 크게 줄어듭니다. 홍콩을 떠난 자본이 첫 손님이 될 것으로 보입니다. 국내 은행들은 같은 조건을 달라고 요구했습니다. 금융 당국은 특구 밖으로 위험이 번지지 않게 칸막이를 치겠다고 답했습니다."
 tfrkphn.6712.a:0 "여의도에 불이 켜진다."
 tfrkphn.6713.t:0 "자부심을 디자인하다"
 tfrkphn.6713.d:0 "수출 상품의 디자인을 나라가 돕는 사업을 시작했습니다.\n\n2007년 10월 서울은 2010년 세계디자인수도로 뽑혔습니다. 그때 서울시장이 지금의 대통령입니다. 그때 도시의 모습에 들였던 공을 이번에는 나라 밖으로 팔려 나가는 물건에 들입니다. 중소기업이 만든 가전과 화장품, 식품의 포장과 모양을 전문가들이 다시 그립니다. 첫 해 지원을 받은 회사 가운데 몇 곳이 나라 밖의 디자인 상을 받았습니다."
 tfrkphn.6713.a:0 "물건으로 보여 준다."
 tfrkphn.6714.t:0 "망명 기업 특별법"
 tfrkphn.6714.d:0 "망명 기업 특별법이 국회를 통과했습니다. 혜택의 기준과 기한을 법에 적었습니다.\n\n땅값을 깎아 주는 폭, 세금을 미뤄 주는 햇수, 외국인 직원의 비자 조건이 조문으로 정해졌습니다. 같은 권역에 있는 국내 기업도 같은 조건을 신청할 수 있다는 조항이 마지막 협상에서 들어갔습니다. 경제 단체들은 이 조항을 반겼습니다. 법이 생기면서 회사마다 따로 하던 협상은 끝났습니다."
 tfrkphn.6714.a:0 "기준은 법에 있다."
 tfrkphn.6715.t:0 "이천오십 탄소중립"
 tfrkphn.6715.d:0 "2050년 탄소중립을 나라의 목표로 다시 확인했습니다. 서울이 세웠던 일정은 2030년까지 온실가스를 40퍼센트 줄이고 2050년에 순배출을 없애는 것이었습니다.\n\n전쟁 동안 발전소와 공장은 가릴 것 없이 돌았고 그 사이 배출량은 크게 늘었습니다. 산업계는 재건이 먼저라고 말합니다. 우리는 재건에 들어가는 설비부터 새 기준에 맞추기로 했습니다. 메가시티 권역마다 들어서는 에너지 농장에서 그 일이 시작됩니다."
 tfrkphn.6715.a:0 "일정을 지킨다."
 tfrkphn.6716.t:0 "지천 르네상스"
 tfrkphn.6716.d:0 "동네 하천을 걷고 쉬는 곳으로 바꾸는 사업이 시작됐습니다. 한강에서 하던 일을 지천으로 가져간 것입니다.\n\n콘크리트 둑을 걷어 내고 물가에 길과 의자를 놓습니다. 첫 구간이 열린 날 저녁, 동네 사람들이 돗자리를 들고 나왔습니다. 하천 둘레의 가게들은 영업 시간을 늘렸습니다. 큰비가 오면 어떻게 되느냐는 질문에는 물이 차는 구간과 대피로를 표시한 지도로 답했습니다."
 tfrkphn.6716.a:0 "물가에 길을 낸다."
 tfrkphn.6717.t:0 "넛지"
 tfrkphn.6717.d:0 "대통령의 첫 안보 연설문은 일곱 번 고쳐졌다. 마지막까지 남은 쟁점은 한 단어였다. 기한이라는 말을 넣을지 뺄지를 두고 안보실 비서관과 외교부 차관이 새벽까지 다퉜다. 기한을 넣으면 북한에 시계를 들이미는 셈이고, 빼면 연설은 지난 정부들의 말과 다를 것이 없었다.\n\n결국 대통령이 직접 펜을 들었다. 북한에 핵을 없앨 기한을 주고, 그 기한이 지나면 우리도 핵을 개발한다는 문장이 그대로 남았다. 2019년 2월 17일 당 대표 후보 토론회에서 그는 이것을 넛지 전략이라고 불렀다. 그때는 후보의 말이었고 지금은 대통령의 말이다."
 tfrkphn.6717.next:0 "이어서 본다"
 tfrkphn.6817.d:0 "연설이 끝나고 한 시간 만에 동맹국 대사 셋이 외교부에 설명을 요청했다. 그들이 묻는 것은 하나였다. 정말로 만들 생각이냐는 것이었다. 차관은 준비해 둔 답을 읽었다. 홍준표 정부가 만든 핵공유 협의체는 그대로 두고, 그 위에 한 걸음을 더 얹는 것뿐이라는 답이었다.\n\n여론조사에서는 연설에 찬성한다는 응답이 열에 여섯을 넘었다. 전쟁을 치른 나라의 사람들은 더 이상 핵이라는 말에 놀라지 않았다. 다만 대학가 몇 곳에는 핵 없는 한반도를 외치는 대자보가 붙었고, 그 앞에서도 사람들이 걸음을 멈추고 읽었다.\n\n그날 밤 안보실 비서관은 연설문 원본을 금고에 넣기 전에 기한이라는 단어 밑에 붉은 줄을 그어 두었다. 언젠가 그 기한이 돌아올 날을 위해서였다."
 tfrkphn.6717.a:0 "기한을 준다."
 tfrkphn.6718.t:0 "삼불은 없다"
 tfrkphn.6718.d:0 "[GetTFRKPHNOhH3Open]\n\n2017년 문재인 정부는 중국에 세 가지 입장을 밝혔다. 사드를 더 들이지 않고, 미국의 미사일 방어 체계에 들어가지 않으며, 한미일 군사 동맹으로 가지 않는다는 것이었다. 사람들은 이것을 삼불이라 불렀다. 그 뒤 어느 정부도 이 입장을 공식으로 거둔 적이 없었다.\n\n외교부가 만든 문서는 한 장짜리였다. 우리 정부는 그 입장을 이어받지 않으며, 안보에 관한 결정은 우리가 내린다는 내용이었다. 미국이 무너진 지금, 미사일 방어를 함께할 상대도 군사 협력의 상대도 그때와는 다른 나라들이었다. 문서는 그 이름들을 일부러 적지 않았다."
 tfrkphn.6718.next:0 "이어서 본다"
 tfrkphn.6818.d:0 "발표 다음 날 태평양방위조약기구 회원국들은 환영 성명을 냈다. 베이징 외교부 대변인은 정례 브리핑에서 한국이 스스로 약속을 깼다고 했다. 서울의 중국 대사관 앞에서는 작은 집회가 두 번 열렸고, 두 번 모두 경찰보다 기자가 많았다.\n\n방공포병 사령부는 그 주부터 새 포대를 둘 자리를 고르기 시작했다. 지도 위에 찍힌 후보지 가운데 셋은 십 년 전 사드 배치를 두고 주민들이 길을 막았던 곳과 멀지 않았다. 담당 영관 장교는 그 지명들 옆에 작은 물음표를 그려 넣었다."
 tfrkphn.6718.a:0 "결정은 우리가 내린다."
 tfrkphn.6719.t:0 "비상 태세를 푼다"
 tfrkphn.6719.d:0 "양안전쟁 동안 비상 대기로 늘려 둔 병력을 평시 규모로 되돌리는 명령이 내려갔다. 가장 먼저 군복을 벗은 것은 비상소집으로 불려 왔던 예비역들이었다. 그들 가운데 많은 수가 두 해 가까이 집에 가지 못했다.\n\n강원도의 한 대대에서 전역식은 연병장 한쪽 천막 아래에서 치러졌다. 대대장은 준비한 원고를 반쯤 읽다가 접었다. 훈장을 받은 사람도 아무것도 받지 못한 사람도 같은 버스를 탔다. 버스가 위병소를 지날 때 남는 병사들이 경례를 했고, 몇 사람은 창문을 열고 손을 흔들었다."
 tfrkphn.6719.next:0 "이어서 본다"
 tfrkphn.6819.d:0 "서른두 살 박 병장은 버스 안에서 봉투 두 개를 받았다. 하나는 전역증이었고, 다른 하나는 청년취업사관학교와 중장년 일자리 안내문이었다. 그가 입대 전에 다니던 물류 회사는 전쟁 중에 문을 닫았다. 그는 안내문의 첫 장을 끝까지 읽은 다음 접어서 가슴 주머니에 넣었다.\n\n모두가 반긴 것은 아니었다. 여당 국방위원 몇은 국경 쪽 병력까지 줄이는 것은 이르다고 했고, 예비역 장성 모임은 단계적 해제를 요구하는 성명을 냈다. 군은 줄어든 병력으로 지킬 수 있는 선을 지도 위에 다시 그었다. 비워지는 초소마다 감시 장비가 대신 들어갔다.\n\n박 병장이 탄 버스는 저녁 무렵 터미널에 닿았다. 그는 내리자마자 집이 아니라 근처 편의점으로 가서 이력서 용지를 한 묶음 샀다."
 tfrkphn.6719.a:0 "수고했다."
 tfrkphn.6720.t:0 "다시 성장하는 대한민국"
 tfrkphn.6720.d:0 "다섯 해의 국정 계획을 발표했습니다. 주택과 복지, 산업을 한 권에 묶었고 표지에는 따뜻한 보수라는 말을 적었습니다.\n\n홍준표 정부는 전쟁의 불길이 이 땅에 번지지 않게 막았습니다. 그 나라를 살 만한 곳으로 만드는 일이 이번 정부의 몫입니다. 계획서의 뼈대는 대통령이 서울에서 해 본 일들입니다. 집은 빨리 짓고, 복지는 사다리를 놓는 데 쓰고, 산업은 사람과 돈이 모이는 도시를 만드는 데서 시작합니다. 발표장에서 한 기자가 지키지 못하면 어떻게 하겠느냐고 물었고, 대통령은 임기 끝에 성적표를 내겠다고 답했습니다."
 tfrkphn.6720.a:0 "임기 끝에 성적표를 낸다."
 tfrkphn.6721.t:0 "미래"
 tfrkphn.6721.d:0 "임기의 마지막 해가 저물고 있습니다. 취임하던 날 우리는 승리는 지키고 국정은 바꾸겠다고 약속했습니다.\n\n2011년에 대통령은 서울시장 임기를 채우지 못하고 떠났습니다. 그 뒤 열 해 동안 그는 선거에서 여러 번 졌습니다. 이번에는 끝까지 일했습니다. 집무실 책상에는 다음 정부에 넘길 서류가 쌓여 있고, 지킨 약속과 지키지 못한 약속이 같은 크기의 글씨로 적혀 있습니다. 우리는 이 서류를 다음 사람에게 건넵니다."
 tfrkphn.6721.a:0 "다음 사람에게 넘긴다."
 tfrkphn.6722.t:0 "따뜻한 보수"
 tfrkphn.6722.d:0 "연설문의 마지막 장을 넘기기 전에 오세훈 대통령은 잠시 원고에서 눈을 뗐다. 본회의장의 의석은 반으로 갈라져 있었고, 다섯 해 내내 대만지원법과 비밀 지원을 두고 싸운 여야 의원들이 서로 눈을 마주치지 않고 앉아 있었다. 양안전쟁이 끝나고 처음 서는 대통령의 자리였다.\n\n그가 말하려는 따뜻한 보수는 새로 지어낸 말이 아니었다. 그는 오래전부터 보수가 가장 앞에 두어야 할 것은 사람이라고 생각해 왔다. 시장이 돌아가게 두되, 그 시장에서 넘어진 사람을 일으켜 세우는 일까지 보수가 맡아야 한다는 것이었다. 모두에게 똑같이 나눠 주는 돈 대신 어려운 사람에게 더 주는 돈, 안심소득이 그 생각에서 나왔다.\n\n서울시장으로 돌아온 이듬해인 2022년 7월 1일, 그는 취임사에서 약자와의 동행을 두고 '제가 서울시장으로서 존재하는 이유이자, 제 평생의 과업'이라고 했다. 2026년 5월 28일, 다섯 번째 서울시장 선거를 엿새 앞두고는 '서울마저 내어준다면 이 땅에 합리적이고 건강한 보수를 다시 일으켜 세울 최소한의 바탕마저 소멸하는 것'이라고 말했다."
 tfrkphn.6722.next:0 "이어서 본다"
 tfrkphn.6822.d:0 "그 말을 하던 때를 그는 떠올렸다. 그때는 보수가 무너질까 걱정했고, 지금은 이긴 보수가 사람들을 지치게 할까 걱정한다. 홍준표 정부의 다섯 해는 범죄와의 전쟁으로 시작해 양안전쟁으로 끝났다. 그 싸움을 이긴 것은 맞지만, 국민은 이제 큰소리에 질려 있었다. 해협 건너에서는 중국이 여전히 우리를 노려보고 있었고, 비밀 지원에 나섰다가 돌아오지 못한 사람들의 이름은 아직 공개조차 되지 않았다.\n\n대통령은 원고로 눈을 돌려 마지막 대목을 읽었다. 승리는 지키겠다고 했고, 이긴 사람과 진 사람, 지지한 사람과 반대한 사람 모두와 함께 가겠다고 했다. 연설문에는 따뜻한 보수라는 말이 세 번 나온다. 세 번째로 그 말을 했을 때 야당 의석에서도 박수가 나왔다.\n\n연단을 내려오며 그는 2011년 8월을 생각했다. 그때 그는 시장직을 걸고 혼자 싸웠고, 졌다. 이번에는 혼자 싸우지 않겠다고 그는 속으로 다짐했다."
 tfrkphn.6722.a:0 "함께 간다."
 tfrkphn.6723.t:0 "나라 바로세우기"
 tfrkphn.6723.d:0 "국정 연설 뒤에 처음 연 국무회의의 안건은 세 가지였습니다. 홍준표 정부가 걸어 둔 비상 조치와 비밀 지원의 뒷정리, 그리고 다섯 해 동안 얼어붙은 여야 관계입니다.\n\n모두 홍준표 정부가 대만을 뒤에서 돕느라 미뤄 둔 일입니다. 우리는 서류 위의 중립과 실제로 한 일 사이의 틈부터 메우기로 했습니다. 비상 조치는 중국을 자극하지 않는 순서로 풀어야 합니다. 베이징은 비밀 지원의 증거를 쥐고 있다는 말을 흘리며 우리 기업의 통관 심사를 늦추기 시작했습니다. 비밀 지원에 나섰다가 숨진 사람들의 이름을 찾아 적는 일과 야당 대표를 대통령실로 부르는 일도 같은 표에 올랐습니다. 대통령은 이 세 가지가 끝나야 다음 일을 시작할 수 있다고 말했습니다."
 tfrkphn.6723.a:0 "이 세 가지부터 한다."
 tfrkphn.6724.b:0 "서명은 미룬다. 조건을 더 받아낸다."
 TFRKPHN_ohf_h2a_tt:0 "당 개혁 탭이 열려 있으면 강경파 반발 §G-5§!"
 TFRKPHN_ohf_h2b_tt:0 "당 개혁 탭이 열려 있으면 강경파 반발 §R+5§!"
 tfrkphn.6724.t:0 "나토식 핵 배치"
 tfrkphn.6724.d:0 "협상단의 막내는 외교부의 서른여섯 살 과장이었다. 그는 석 달 동안 우방의 수도와 서울을 열한 번 오갔다. 마지막 회의가 끝난 밤, 그는 호텔 방에서 합의문 초안의 한 줄을 몇 번이고 다시 읽었다. 핵무기의 열쇠는 우방이 쥐고, 그것을 실어 나를 전투기와 조종사는 한국이 맡는다는 문장이었다.\n\n대통령이 이 길을 처음 입에 올린 것은 2020년 6월의 방송에서였다. 그는 전술핵 재배치와 나토식 핵공유를 선택지로 꼽았고, 그때는 아무 자리에도 있지 않은 사람의 말이었다. 홍준표 정부는 그 말을 협의체라는 이름으로 책상 위에 올려 두었다. 이번 정부는 책상 위의 서류를 땅 위로 옮기려 하고 있다."
 tfrkphn.6724.next:0 "이어서 본다"
 tfrkphn.6824.d:0 "배치 후보지가 평택의 오산 공군기지라는 보도가 나온 날, 기지 앞 철망에는 아침부터 사람들이 모였다. 미군이 떠나며 비워 두고 간 기지였다. 송탄에서 평생 양복점을 해 온 일흔 살 노인은 미군이 떠날 때 장사가 끝나는 줄만 알았지 이런 것이 들어올 줄은 몰랐다고 기자에게 말했다. 그 옆에서 젊은 부부는 북한은 핵을 가졌는데 우리만 맨손이냐는 피켓을 들었다.\n\n베이징은 그날 오후 우리 대사를 불렀다. 서해에서는 중국 해군의 훈련 공지가 사흘 앞당겨졌다. 국회 국방위원회에서 야당 의원이 이것이 평화냐고 묻자 국방부 장관은 들여오는 것은 무기가 아니라 시간이라고 답했다. 우리가 스스로 설 때까지 버틸 시간이라는 뜻이었다.\n\n서울로 돌아오는 비행기에서 과장은 합의문 마지막 장의 빈 서명란을 내려다보았다. 그 칸을 채우는 것은 그의 일이 아니었다."
 tfrkphn.6724.a:0 "오산에 들인다. 억지는 배치에서 나온다."
 tfrkphn.6725.t:0 "협의체를 잇는다"
 tfrkphn.6725.d:0 "핵공유 협의체의 첫 회의를 앞두고 국방부 장관이 대통령실로 올라왔다. 그가 들고 온 것은 두 가지 안이었다. 하나는 협의를 넘어 배치를 요구하는 안, 다른 하나는 홍준표 정부가 만든 협의체를 그대로 잇는 안이었다.\n\n대통령의 생각은 원래 첫 번째 안에 가까웠다. 그는 오래전부터 나토식 핵공유를 주장해 왔고, 전술핵을 다시 들여오는 길도 닫지 않았다. 그러나 장관이 펼친 전문에는 우방들의 사정이 적혀 있었다. 한 나라는 이듬해 봄 총선을 앞두고 있었고, 다른 나라는 전쟁 빚을 갚느라 국방 예산을 깎는 중이었다. 지금 배치를 꺼내면 협의체부터 흔들린다는 것이 실무진의 판단이었다."
 tfrkphn.6725.next:0 "이어서 본다"
 tfrkphn.6825.d:0 "대통령은 말없이 전문을 넘기다가 두 번째 안에 서명했다. 이름도 회의 주기도 의장국의 순서도 바꾸지 않기로 했다. 그는 장관에게 동맹은 한 나라의 속도로 가지 않는다고 말했다고 한다.\n\n반발은 당 안에서 먼저 나왔다. 강경파 의원들은 의원총회에서 홍준표 정부보다 물러선 정부라는 말을 꺼냈고, 보수 유튜브 채널들은 그 장면을 며칠씩 틀었다. 야당은 드물게 정부의 판단을 반겼다. 민주당 대변인이 정부를 칭찬하는 논평을 낸 것은 그해 처음이었다.\n\n반년 뒤 도쿄에서 열린 회의에서 우리 대표단은 전과 같은 자리에 앉았다. 회의가 끝나자 우방의 대표 한 사람이 우리 대사에게 다가와 짧게 고맙다고 했다. 어느 서류에도 남지 않는 말이었다."
 tfrkphn.6725.a:0 "동맹의 속도에 맞춘다."
 tfrkphn.6726.t:0 "동맹 안의 자리"
 tfrkphn.6726.d:0 "태평양방위조약기구의 정상회의가 열렸다. 전쟁이 끝난 뒤 처음으로 회원국 정상이 한 탁자에 앉았고, 의제는 하나였다. 전쟁이 남긴 일을 누가 맡느냐는 것이었다.\n\n큰 나라들은 함대와 기지를 내놓았다. 어느 나라는 항공모함 한 척을 남중국해에 상주시키겠다고 했고, 어느 나라는 해병대 기지를 새로 열겠다고 했다. 우리 차례가 오자 대통령은 군대 이야기를 꺼내지 않았다. 대신 무너진 항만과 철도를 다시 짓는 일, 탄약과 부품을 대는 일, 피란민이 들어갈 집을 짓는 일을 한국이 맡겠다고 했다. 조선소와 건설사, 방산 공장이 그 일을 나눠 지겠다는 제안이었다."
 tfrkphn.6726.next:0 "이어서 본다"
 tfrkphn.6826.d:0 "회의장 밖에서 외신 기자들은 한국이 군대 대신 크레인을 보낸다고 썼다. 칭찬으로 읽는 사람도, 비꼬는 말로 읽는 사람도 있었다. 국방부 안에서는 동맹에서 목소리를 키우려면 군을 더 보내야 한다는 불만이 나왔다. 전쟁에서 피를 흘린 나라가 끝나고 나서 공사판을 맡는 꼴이라는 말이었다.\n\n그 주에 거제의 조선소로 수주 소식이 들어왔다. 전쟁 때 군함을 고치느라 석 달 동안 집에 들어가지 못했던 용접공은, 이번에는 남의 나라 항구를 고칠 배를 만든다는 말을 듣고 웃었다. 어느 쪽이든 일감은 일감이라고 했다.\n\n귀국하는 전용기 안에서 대통령은 기자들에게 다음 전쟁을 막는 것은 다시 지은 도시라고 말했다. 그 도시는 누가 지키느냐는 물음이 나오자 그는 대답 대신 창밖을 가리켰다. 구름 아래로 남해의 조선소들이 지나가고 있었다."
 tfrkphn.6726.a:0 "크레인으로 동맹을 지킨다."
 tfrkphn.6727.t:0 "참전용사의 집"
 tfrkphn.6727.d:0 "김 하사는 양안전쟁이 끝나기 두 달 전 대만 해협의 이름 없는 섬에서 오른쪽 다리를 잃었다. 서류 위로 대한민국은 그 전쟁에 없던 나라였고, 그가 탄 수송선도 없던 배였다. 그래서 그는 오랫동안 참전용사가 아니었다.\n\n그가 참전용사가 된 것은 법이 바뀌고 나서였다. 정부는 비밀 지원에 나섰던 군인과 선원, 정비사를 참전용사로 인정하는 법부터 고쳤다. 그다음이 집이었다. 상생주택과 값을 낮춘 집의 일부를 참전용사 몫으로 떼어 두고, 다친 사람과 가족을 잃은 사람에게 먼저 열쇠를 주기로 했다."
 tfrkphn.6727.next:0 "이어서 본다"
 tfrkphn.6827.d:0 "첫 집은 경기도의 한 마을에 지은 작은 단독 주택이었다. 준공식 날 김 하사는 맨 앞줄 의자에 앉았고, 양옆에는 지난 전쟁의 노병 두 사람이 앉았다. 사진을 찍는 동안 노병 한 사람이 다리는 어디서 그랬느냐고 물었다. 김 하사가 섬 이름을 대지 못하자 노인은 고개를 끄덕였다. 자기도 평생 말하지 못한 곳이 있었다고 했다.\n\n열쇠를 받아 든 김 하사의 어깨를 노병이 두드렸다. 박수가 그친 뒤에도 그는 집 안으로 들어가지 않고 현관 앞 계단에 앉아 있었다. 문턱이 없는 집이었다. 휠체어가 드나들 수 있게 일부러 그렇게 지었다고 시공사 직원이 일러 주었다.\n\n보훈을 연금 한 줄로 끝내지 않겠다는 약속은 그렇게 첫 집 한 채로 시작됐다. 대기 명단에는 아직 사천 명이 넘는 이름이 남아 있다."
 tfrkphn.6727.a:0 "돌아온 사람이 먼저다."
 tfrkphn.6728.t:0 "대한민국투자청"
 tfrkphn.6728.d:0 "대한민국투자청이 문을 열었다. 외국 기업이 이 나라에 돈을 넣으려면 지금까지 부처 예닐곱 곳을 따로 돌아야 했다. 땅은 지자체에, 세금은 국세청에, 비자는 법무부에, 공장 허가는 또 다른 곳에 물어야 했다. 이제는 투자청 한 곳에서 답을 받는다.\n\n대통령은 서울시장 때 서울투자청을 만들어 같은 일을 해 보았다. 그때 창구에 앉았던 직원 몇이 이번에도 첫 상담 창구에 앉았다. 그들은 외국 회사들이 가장 많이 묻는 것이 세금이 아니라 얼마나 기다려야 하느냐는 것이라고 했다."
 tfrkphn.6728.next:0 "이어서 본다"
 tfrkphn.6828.d:0 "첫 주에 가장 먼저 찾아온 손님은 홍콩에서 옮겨 온 반도체 장비 회사였다. 그 회사의 부사장은 상담을 마치고 나서, 도쿄에서는 같은 답을 듣는 데 석 달이 걸렸다고 말했다. 상담 기록은 그날 저녁 투자청장의 책상에 올라갔다.\n\n부처들은 반기지 않았다. 권한을 내주는 일이기 때문이다. 한 부처의 국장은 회의에서 창구를 하나로 모으면 잘못도 하나로 모인다고 말했다. 투자청은 그 말을 받아, 창구에서 내준 답이 틀리면 투자청이 책임진다는 문장을 운영 규정 첫 줄에 적었다."
 tfrkphn.6728.a:0 "창구는 하나다."
 tfrkphn.6729.t:0 "하늘과 땅의 교통"
 tfrkphn.6729.d:0 "서울 도심에 첫 모빌리티 허브가 문을 열었다. 지하에는 지하철이, 지상에는 버스와 공유 자전거가, 옥상에는 도심 항공기가 내리는 정류장이다. 서울의 계획은 2030년까지 이런 허브를 서른두 곳 짓는 것이었고, 이번에는 그 계획을 다른 큰 도시들로 넓힌다.\n\n첫 비행은 아침 일곱 시에 있었다. 네 사람이 타는 작은 기체가 옥상을 떠나 김포공항까지 날았다. 차로 한 시간이 걸리던 길이 십오 분으로 줄었다. 첫 승객 가운데 한 사람은 출근길 회사원이었고, 그는 내리자마자 휴대전화로 사진을 찍어 가족에게 보냈다.\n\n값은 아직 비쌌다. 한 번 타는 값이 택시의 몇 배였다. 시민 단체는 하늘길이 부자들의 지름길이 될 것이라고 했다. 국토부는 허브의 아래층 버스와 자전거 요금을 한 장의 교통카드로 묶어, 하늘을 타지 않는 사람도 허브를 쓰게 만들겠다고 답했다.\n\n허브가 들어선 동네의 주민들은 소음을 걱정했다. 시험 비행 동안 구청은 옥상 둘레의 아파트 여섯 곳에 소음 측정기를 달았다. 측정값은 매일 구청 홈페이지에 그대로 올라갔다."
 tfrkphn.6729.a:0 "하늘길도 교통카드로 탄다."
 tfrkphn.6730.t:0 "메타버스 행정"
 tfrkphn.6730.d:0 "민원 창구가 가상 공간에 열렸다. 주민등록 서류를 떼거나 세금을 묻거나 복지 상담을 받으러 관공서에 가지 않아도, 집에서 화면 속 창구 앞에 앉으면 된다. 서울은 2023년에 그 틀을 만들고 2030년에 모든 분야로 넓히기로 했다. 이번에는 그 계획을 나라 전체로 가져간다.\n\n첫 달에 가장 많이 들어온 민원은 뜻밖에도 전쟁 때 흩어진 가족의 행방을 묻는 것이었다. 피란 기록과 주소 이전 기록을 한꺼번에 볼 수 있게 되자 사람들이 몰렸다. 상담 직원 한 사람은 하루에 이산가족 열네 집과 마주 앉았다고 했다."
 tfrkphn.6730.next:0 "이어서 본다"
 tfrkphn.6830.d:0 "노인들에게는 화면이 낯설었다. 동사무소마다 가상 창구 사용법을 알려 주는 도우미가 배치됐고, 그 자리의 상당수는 전쟁에서 돌아온 청년들이 맡았다. 할머니가 화면 속 창구 직원에게 고개를 숙여 인사하는 영상이 그 주에 가장 많이 퍼졌다.\n\n야당은 사람 대신 화면을 앉힌다고 비판했다. 행정안전부는 가상 창구를 열면서 실제 창구를 하나도 닫지 않았다는 표를 국회에 냈다. 두 창구를 함께 두는 데 드는 돈은 다음 해 예산의 숙제로 남았다."
 tfrkphn.6730.a:0 "실제 창구는 닫지 않는다."
 tfrkphn.7017.t:0 "서해의 그림자"
 tfrkphn.7017.d:0 "오산에 우방의 핵이 들어온 지 두 달, 서해가 먼저 움직였다. 중국 해군은 백령도 서쪽 공해에서 실탄 훈련을 열흘 동안 이어 갔고, 우리 어선들은 조업 구역을 비워야 했다. 연평도 어민들은 꽃게 철을 그대로 놓쳤다.\n\n항구에서는 다른 일이 벌어졌다. 칭다오와 다롄의 세관이 한국산 화장품과 반도체 부품의 통관을 이유 없이 늦추기 시작했다. 공식 발표는 없었다. 서류가 돌아오지 않을 뿐이었다. 산업부는 한 달 손실을 수천억 원으로 어림했다.\n\n인천의 한 화장품 수출 회사는 컨테이너 마흔 개가 칭다오 부두에 묶였다. 사장은 직원들에게 이번 달 월급은 준다고 했지만 다음 달은 약속하지 못했다. 전쟁 중에도 하루도 공장을 세우지 않았던 회사였다."
 tfrkphn.7017.next:0 "이어서 본다"
 tfrkphn.7117.d:0 "국무회의는 둘로 갈렸다. 외교부 장관은 우방과 함께 맞서면 베이징도 오래 버티지 못한다고 했다. 산업부 장관은 중소 협력사들이 석 달을 버티지 못한다고 했다. 경제 단체들은 대통령실에 면담을 요청했고, 여당 강경파는 여기서 물러서면 핵을 들인 의미가 없다는 성명을 냈다.\n\n연평도의 한 선주는 기자에게 배를 묶어 둔 지 열하루째라고 했다. 바다 건너에서 무엇이 들어오든 자기 그물에는 아무것도 들어오지 않는다고 했다.\n\n대통령은 저녁 늦게까지 집무실에 남아 두 장관의 보고서를 나란히 펴 놓았다."
 tfrkphn.7017.a:0 "물러서지 않는다. 우방과 함께 버틴다."
 tfrkphn.7017.b:0 "협상 창구를 연다. 배치는 두고 서해부터 식힌다."
 TFRKPHN_ohf_sea_a_tt:0 "당 개혁 탭이 열려 있으면 강경파 반발 §G-3§!"
 TFRKPHN_ohf_sea_b_tt:0 "당 개혁 탭이 열려 있으면 강경파 반발 §R+5§!"
 TFRKPHN_oh_h3_osan:0 "오산의 격납고에 우방의 핵이 들어온 지 석 달이 지났다. 베이징의 항의는 아직 그치지 않았고, 정부는 그 항의에 문서로 답하기로 했다."
 TFRKPHN_oh_h3_wait:0 "오산의 격납고는 아직 비어 있다. 서명을 미룬 채 협상을 이어 가는 동안 정부는 먼저 다른 문서 하나를 정리하기로 했다."
 TFRKPHN_oh_h3_keep:0 "핵공유 협의체는 예전 속도 그대로 돌아가고 있다. 그사이 정부는 오래 미뤄 둔 문서 하나를 꺼냈다."
