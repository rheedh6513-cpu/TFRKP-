l_korean:
 # 오세훈 중점 사건. oh_focus_ev_build.py가 만든다.
 tfrkphn.6701.t:0 "중도로 넓힌다"
 tfrkphn.6701.d:0 "우리는 내각과 당직의 문을 가운데 쪽으로 열었다. 전쟁 동안 우리와 거리를 두었던 사람들에게도 자리를 권했다.\n\n홍준표 정부는 전쟁을 치르는 동안 반대편을 밀어붙이는 방식으로 일했다. 우리는 그 방식을 물려받지 않기로 했다. 대통령은 2019년 2월 7일 당 대표 선거에 나서며 박 전 대통령을 극복할 수 있어야 보수정치는 부활할 수 있다고 말한 사람이다. 그해 선거에서 그는 졌다. 당 안에서는 벌써 불만이 나온다. 전쟁을 함께 치른 사람들을 두고 왜 밖에서 사람을 찾느냐는 것이다."
 tfrkphn.6701.a:0 "문은 열어 둔다."
 tfrkphn.6702.t:0 "국민에게 묻는다"
 tfrkphn.6702.d:0 "우리는 가장 크게 갈린 쟁점을 국민투표에 부치기로 했다. 국회에서 몇 달째 풀리지 않던 문제다.\n\n대통령에게 투표함은 쓰라린 기억이다. 2011년 8월 그는 무상급식을 주민투표에 부치고 시장직을 걸었다. 투표율은 개표 기준에 못 미쳤고 그는 물러났다. 참모들은 이번에도 직을 걸 것이냐고 물었고, 대통령은 걸지 않는다고 답했다. 결과가 어느 쪽으로 나오든 임기는 그대로 간다는 뜻이다."
 tfrkphn.6702.a:0 "이번에는 직을 걸지 않는다."
 tfrkphn.6703.t:0 "비상 조치를 걷는다"
 tfrkphn.6703.d:0 "양안전쟁 동안 홍준표 정부가 걸어 두었던 비상 조치를 오늘부터 푼다. 여론조사 공표 금지가 풀렸고, 비상 대기로 붙들려 있던 장병들에게 귀가 명령이 내려갔다.\n\n신문들은 오랜만에 정당 지지율 조사를 1면에 실었다. 부대 정문 앞에는 가족들이 새벽부터 차를 대고 기다렸다. 통제를 푸는 순서를 두고는 안에서 말이 많았다. 한꺼번에 풀면 중국을 자극한다는 걱정과, 끝난 전쟁의 비상 조치를 더 끌 까닭이 없다는 말이 맞섰다."
 tfrkphn.6703.a:0 "평시로 돌아간다."
 tfrkphn.6704.t:0 "돌아오지 못한 이들의 이름"
 tfrkphn.6704.d:0 "양안전쟁 때 비밀 지원에 나섰다가 숨진 사람들의 명단이 처음 공개됐다. 군인과 선원, 조종사의 이름과 숨진 날짜가 한 줄씩 적혔다.\n\n대한민국은 서류 위로는 중립국이었고, 이 이름들은 그동안 작전 보안을 이유로 묶여 있었다. 유족들은 사고로 숨졌다는 통지서 한 장만 받고 기다려 왔다. 보상의 기준도 법으로 정했다. 같은 전투에서 숨진 사람의 유족이 서로 다른 금액을 받는 일이 다시 없게 하려는 것이다. 대통령은 명단이 걸린 벽 앞에서 한참 서 있었다. 몇몇 유족은 끝내 벽 앞에 서지 못했다. 사고였다는 말만 믿고 몇 해를 보낸 사람들이었다."
 tfrkphn.6704.a:0 "한 사람도 빠뜨리지 않는다."
 tfrkphn.6705.t:0 "스피드 주택공급"
 tfrkphn.6705.d:0 "주택 공급 계획을 발표했다. 2021년 4월 서울시장 선거에서 대통령은 다섯 해 동안 36만 가구를 약속했다. 그때의 방식을 나라 전체로 넓힌다.\n\n핵심은 인허가에 걸리는 시간을 줄이는 것이다. 지금은 구역 지정에서 착공까지 여러 해가 걸린다. 따로 열리던 심의를 한 번에 묶어 그 시간을 크게 줄이기로 했다. 건설사들은 반겼고, 세입자 단체는 철거부터 빨라질 것이라고 걱정했다."
 tfrkphn.6705.a:0 "빨리 짓는다."
 tfrkphn.6706.t:0 "서른다섯 층의 벽"
 tfrkphn.6706.d:0 "아파트 높이를 35층으로 묶어 두었던 규제를 풀었다. 낮게 잡혀 있던 용적률도 함께 고쳤다.\n\n같은 땅에 더 많은 집을 지을 수 있게 됐다. 한강을 따라 선 낡은 단지들이 가장 먼저 재건축 계획을 냈고, 조감도에는 쉰 층이 넘는 건물이 그려져 있다. 강변의 하늘선이 달라진다는 말에 반기는 사람과 눈살을 찌푸리는 사람이 반씩이다. 뒤 단지의 주민들은 햇빛이 가려진다며 구청에 의견서를 냈다."
 tfrkphn.6706.a:0 "하늘선이 달라진다."
 tfrkphn.6707.t:0 "상생주택"
 tfrkphn.6707.d:0 "상생주택의 첫 단지가 입주를 시작했다. 민간의 땅을 빌려 공공이 짓는 장기전세주택이다. 2007년 서울에서 시작한 시프트의 두 번째 판이기도 한다.\n\n땅 주인은 땅을 팔지 않고 임대료를 받고, 나라는 땅값을 들이지 않고 집을 짓는다. 입주자는 주변 시세보다 낮은 보증금으로 길게 산다. 첫 단지의 경쟁률은 수십 대 일이었다. 추첨에서 떨어진 사람들이 다음 단지는 언제냐고 묻고 있다."
 tfrkphn.6707.a:0 "다음 단지를 서두른다."
 tfrkphn.6708.t:0 "약자와의 동행"
 tfrkphn.6708.d:0 "복지 정책의 이름을 약자와의 동행으로 정했다. 대통령이 서울시장 때 시정의 맨 앞에 두었던 말이고, 우리가 내건 따뜻한 보수의 첫 장이기도 한다.\n\n2021년 9월 15일 그는 서울비전 2030을 내놓으며 계층 이동 사다리를 복원하겠다고 말했다. 우리 복지의 목표도 거기에 둔다. 가난한 집 아이가 공부할 길, 일자리를 잃은 사람이 다시 설 길, 집 없는 사람이 집을 가질 길을 하나씩 놓겠다는 것이다. 예산 당국은 전쟁 빚부터 갚아야 한다는 의견을 붙였다."
 tfrkphn.6708.a:0 "사다리를 다시 놓는다."
 tfrkphn.6709.t:0 "서울런을 전국으로"
 tfrkphn.6709.d:0 "형편이 어려운 집 아이들에게 온라인 강의를 무료로 열어 주던 서울의 사업이 전국으로 넓어졌다.\n\n민간 교육 회사의 강의를 나라가 사서 아이들에게 나눠 주는 방식이다. 섬과 산골의 학생들이 대도시 학원가의 강의를 집에서 듣게 됐다. 교사 단체는 학교 수업이 밀려난다고 걱정했고, 학원 업계는 값을 너무 깎는다고 불평했다. 첫 달에 가입한 학생의 절반 가까이가 읍과 면에 사는 아이들이었다."
 tfrkphn.6709.a:0 "어디서나 같은 강의를 듣는다."
 tfrkphn.6710.t:0 "청년취업사관학교"
 tfrkphn.6710.d:0 "청년취업사관학교가 전국에서 문을 열었다. 기업이 바라는 기술을 가르쳐 곧바로 일자리로 잇는 학교다. 서울에서는 열 곳을 약속했던 사업이다.\n\n첫 기수의 자리는 전쟁에서 돌아온 청년들에게 먼저 돌아갔다. 군복을 벗은 지 한 달이 안 된 사람들이 교실에 앉아 프로그래밍을 배운다. 수료생을 뽑겠다고 약속한 회사의 명단이 학교 벽에 붙었다. 접수 첫날 정원의 몇 배가 넘는 지원서가 들어왔다."
 tfrkphn.6710.a:0 "교실 문을 연다."
 tfrkphn.6711.t:0 "글로벌 TOP5"
 tfrkphn.6711.d:0 "서울을 세계 5대 도시로 올리겠다는 목표를 나라의 계획으로 발표했다. 대통령이 서울비전 2030에 적었던 목표다.\n\n전쟁은 뜻밖의 기회를 남겼다. 홍콩과 상하이에 있던 회사들이 새 주소를 찾고 있고, 미대륙을 떠난 회사들도 자리를 구한다. 우리는 세금과 비자, 영어로 되는 행정을 묶어 내놓았다. 경쟁 도시는 도쿄와 싱가포르다. 외국 경제지들은 서울의 사무실 임대료가 벌써 오르기 시작했다고 썼다."
 tfrkphn.6711.a:0 "서울로 오게 한다."
 tfrkphn.6712.t:0 "여의도 디지털금융특구"
 tfrkphn.6712.d:0 "여의도가 디지털금융특구로 지정됐다. 서울에 있는 해외 금융기관을 250곳까지 늘리는 것이 서울시 때부터의 계획이다.\n\n특구 안에서는 외국 금융사가 들어와 영업을 시작하기까지의 절차가 크게 줄어든다. 홍콩을 떠난 자본이 첫 손님이 될 것으로 보인다. 국내 은행들은 같은 조건을 달라고 요구했다. 금융 당국은 특구 밖으로 위험이 번지지 않게 칸막이를 치겠다고 답했다."
 tfrkphn.6712.a:0 "여의도에 불이 켜진다."
 tfrkphn.6713.t:0 "자부심을 디자인하다"
 tfrkphn.6713.d:0 "수출 상품의 디자인을 나라가 돕는 사업을 시작했다.\n\n2007년 10월 서울은 2010년 세계디자인수도로 뽑혔다. 그때 서울시장이 지금의 대통령이다. 그때 도시의 모습에 들였던 공을 이번에는 나라 밖으로 팔려 나가는 물건에 들인다. 중소기업이 만든 가전과 화장품, 식품의 포장과 모양을 전문가들이 다시 그린다. 첫 해 지원을 받은 회사 가운데 몇 곳이 나라 밖의 디자인 상을 받았다."
 tfrkphn.6713.a:0 "물건으로 보여 준다."
 tfrkphn.6714.t:0 "망명 기업 특별법"
 tfrkphn.6714.d:0 "망명 기업 특별법이 국회를 통과했다. 혜택의 기준과 기한을 법에 적었다.\n\n땅값을 깎아 주는 폭, 세금을 미뤄 주는 햇수, 외국인 직원의 비자 조건이 조문으로 정해졌다. 같은 권역에 있는 국내 기업도 같은 조건을 신청할 수 있다는 조항이 마지막 협상에서 들어갔다. 경제 단체들은 이 조항을 반겼다. 법이 생기면서 회사마다 따로 하던 협상은 끝났다."
 tfrkphn.6714.a:0 "기준은 법에 있다."
 tfrkphn.6715.t:0 "이천오십 탄소중립"
 tfrkphn.6715.d:0 "2050년 탄소중립을 나라의 목표로 다시 확인했다. 서울이 세웠던 일정은 2030년까지 온실가스를 40퍼센트 줄이고 2050년에 순배출을 없애는 것이었다.\n\n전쟁 동안 발전소와 공장은 가릴 것 없이 돌았고 그 사이 배출량은 크게 늘었다. 산업계는 재건이 먼저라고 말한다. 우리는 재건에 들어가는 설비부터 새 기준에 맞추기로 했다. 메가시티 권역마다 들어서는 에너지 농장에서 그 일이 시작된다."
 tfrkphn.6715.a:0 "일정을 지킨다."
 tfrkphn.6716.t:0 "지천 르네상스"
 tfrkphn.6716.d:0 "동네 하천을 걷고 쉬는 곳으로 바꾸는 사업이 시작됐다. 한강에서 하던 일을 지천으로 가져간 것이다.\n\n콘크리트 둑을 걷어 내고 물가에 길과 의자를 놓는다. 첫 구간이 열린 날 저녁, 동네 사람들이 돗자리를 들고 나왔다. 하천 둘레의 가게들은 영업 시간을 늘렸다. 큰비가 오면 어떻게 되느냐는 질문에는 물이 차는 구간과 대피로를 표시한 지도로 답했다."
 tfrkphn.6716.a:0 "물가에 길을 낸다."
 tfrkphn.6717.t:0 "넛지"
 tfrkphn.6717.d:0 "대통령이 북핵 문제에 관한 새 방침을 밝혔다. 북한에 핵을 없앨 기한을 주고, 그 기한이 지나면 우리도 핵을 개발한다는 것이다.\n\n2019년 2월 17일 그는 이것을 넛지 전략이라고 불렀다. 그때는 당 대표 후보의 말이었고 지금은 대통령의 말이다. 홍준표 정부가 만든 핵공유 협의체는 그대로 둔 채 한 걸음 더 나간 셈이다. 나라 안의 일은 부드럽게 풀어도 안보에서는 물러서지 않겠다는 뜻이다. 동맹국들은 같은 날 우리 대사에게 설명을 요청했다."
 tfrkphn.6717.a:0 "기한을 준다."
 tfrkphn.6718.t:0 "삼불은 없다"
 tfrkphn.6718.d:0 "사드 추가 배치와 미사일 방어 참여, 한미일 군사 협력을 하지 않겠다던 약속이 없음을 문서로 밝혔다.\n\n2017년 문재인 정부가 밝혔던 세 가지 입장이다. 문서는 짧다. 우리 정부는 그 입장을 이어받지 않으며 안보에 관한 결정은 우리가 내린다는 내용이다. 태평양 방위 조약기구의 회원국들은 환영 성명을 냈다. 방공 부대를 더 둘 자리를 고르는 일이 곧바로 시작됐다."
 tfrkphn.6718.a:0 "결정은 우리가 내린다."
 tfrkphn.6719.t:0 "비상 태세를 푼다"
 tfrkphn.6719.d:0 "양안전쟁 동안 비상 대기로 늘려 둔 병력을 평시 규모로 되돌리기 시작했다. 비상소집으로 불려 온 예비역들이 가장 먼저 군복을 벗었다.\n\n전역식은 부대마다 조촐하게 치렀다. 훈장을 받은 사람도, 아무것도 받지 못한 사람도 같은 버스를 타고 역으로 갔다. 돌아간 사람들에게는 청년취업사관학교와 중장년 일자리의 안내문이 함께 갔다. 군은 줄어든 병력으로 지킬 수 있는 선을 다시 긋고 있다."
 tfrkphn.6719.a:0 "수고했다."
 tfrkphn.6720.t:0 "다시 성장하는 대한민국"
 tfrkphn.6720.d:0 "다섯 해의 국정 계획을 발표했다. 주택과 복지, 산업을 한 권에 묶었고 표지에는 따뜻한 보수라는 말을 적었다.\n\n홍준표 정부는 전쟁의 불길이 이 땅에 번지지 않게 막았다. 그 나라를 살 만한 곳으로 만드는 일이 이번 정부의 몫이다. 계획서의 뼈대는 대통령이 서울에서 해 본 일들이다. 집은 빨리 짓고, 복지는 사다리를 놓는 데 쓰고, 산업은 사람과 돈이 모이는 도시를 만드는 데서 시작한다. 발표장에서 한 기자가 지키지 못하면 어떻게 하겠느냐고 물었고, 대통령은 임기 끝에 성적표를 내겠다고 답했다."
 tfrkphn.6720.a:0 "임기 끝에 성적표를 낸다."
 tfrkphn.6721.t:0 "미래"
 tfrkphn.6721.d:0 "임기의 마지막 해가 저물고 있다. 취임하던 날 우리는 승리는 지키고 국정은 바꾸겠다고 약속했다.\n\n2011년에 대통령은 서울시장 임기를 채우지 못하고 떠났다. 그 뒤 열 해 동안 그는 선거에서 여러 번 졌다. 이번에는 끝까지 일했다. 집무실 책상에는 다음 정부에 넘길 서류가 쌓여 있고, 지킨 약속과 지키지 못한 약속이 같은 크기의 글씨로 적혀 있다. 우리는 이 서류를 다음 사람에게 건넨다."
 tfrkphn.6721.a:0 "다음 사람에게 넘긴다."
 tfrkphn.6722.t:0 "따뜻한 보수"
 tfrkphn.6722.d:0 "연설문의 마지막 장을 넘기기 전에 오세훈 대통령은 잠시 원고에서 눈을 뗐다. 본회의장의 의석은 반으로 갈라져 있었고, 다섯 해 내내 대만지원법과 비밀 지원을 두고 싸운 여야 의원들이 서로 눈을 마주치지 않고 앉아 있었다. 양안전쟁이 끝나고 처음 서는 대통령의 자리였다.\n\n그가 말하려는 따뜻한 보수는 새로 지어낸 말이 아니었다. 그는 오래전부터 보수가 가장 앞에 두어야 할 것은 사람이라고 생각해 왔다. 시장이 돌아가게 두되, 그 시장에서 넘어진 사람을 일으켜 세우는 일까지 보수가 맡아야 한다는 것이었다. 모두에게 똑같이 나눠 주는 돈 대신 어려운 사람에게 더 주는 돈, 안심소득이 그 생각에서 나왔다.\n\n서울시장으로 돌아온 이듬해인 2022년 7월 1일, 그는 취임사에서 약자와의 동행을 두고 '제가 서울시장으로서 존재하는 이유이자, 제 평생의 과업'이라고 했다. 2026년 5월 28일, 다섯 번째 서울시장 선거를 엿새 앞두고는 '서울마저 내어준다면 이 땅에 합리적이고 건강한 보수를 다시 일으켜 세울 최소한의 바탕마저 소멸하는 것'이라고 말했다."
 tfrkphn.6722.next:0 "이어서 본다"
 tfrkphn.6822.d:0 "그 말을 하던 때를 그는 떠올렸다. 그때는 보수가 무너질까 걱정했고, 지금은 이긴 보수가 사람들을 지치게 할까 걱정한다. 홍준표 정부의 다섯 해는 범죄와의 전쟁으로 시작해 양안전쟁으로 끝났다. 그 싸움을 이긴 것은 맞지만, 국민은 이제 큰소리에 질려 있었다. 해협 건너에서는 중국이 여전히 우리를 노려보고 있었고, 비밀 지원에 나섰다가 돌아오지 못한 사람들의 이름은 아직 공개조차 되지 않았다.\n\n대통령은 원고로 눈을 돌려 마지막 대목을 읽었다. 승리는 지키겠다고 했고, 이긴 사람과 진 사람, 지지한 사람과 반대한 사람 모두와 함께 가겠다고 했다. 연설문에는 따뜻한 보수라는 말이 세 번 나온다. 세 번째로 그 말을 했을 때 야당 의석에서도 박수가 나왔다.\n\n연단을 내려오며 그는 2011년 8월을 생각했다. 그때 그는 시장직을 걸고 혼자 싸웠고, 졌다. 이번에는 혼자 싸우지 않겠다고 그는 속으로 다짐했다."
 tfrkphn.6722.a:0 "함께 간다."
 tfrkphn.6723.t:0 "나라 바로세우기"
 tfrkphn.6723.d:0 "국정 연설 뒤에 처음 연 국무회의의 안건은 세 가지였다. 홍준표 정부가 걸어 둔 비상 조치와 비밀 지원의 뒷정리, 그리고 다섯 해 동안 얼어붙은 여야 관계다.\n\n모두 홍준표 정부가 대만을 뒤에서 돕느라 미뤄 둔 일이다. 우리는 서류 위의 중립과 실제로 한 일 사이의 틈부터 메우기로 했다. 비상 조치는 중국을 자극하지 않는 순서로 풀어야 한다. 베이징은 비밀 지원의 증거를 쥐고 있다는 말을 흘리며 우리 기업의 통관 심사를 늦추기 시작했다. 비밀 지원에 나섰다가 숨진 사람들의 이름을 찾아 적는 일과 야당 대표를 대통령실로 부르는 일도 같은 표에 올랐다. 대통령은 이 세 가지가 끝나야 다음 일을 시작할 수 있다고 말했다."
 tfrkphn.6723.a:0 "이 세 가지부터 한다."
