l_korean:
 # 대아대전 승전 엔딩 중점. gawend_build.py가 만든다.
 TFRKPHN_lee_in_je_g1:0 "결승선을 마주보며"
 TFRKPHN_lee_in_je_g1_desc:0 "노인의 완주는 끝이 났습니다. 숨을 고르며 그는 이제 다음 주자를 기다리기 시작합니다.\n\n한때 가장 젊은 대권 주자였던 그는 여러 번 출발선에 섰고, 그때마다 결승선은 다른 사람의 것이었습니다. 사람들이 그의 이름을 지난 시대의 것으로 여기게 된 뒤에도 그는 달리기를 그만두지 않았습니다.\n\n가장 늙은 대통령이 되었을 때 노인은 마지막 힘을 냈습니다. 전쟁으로 나라가 혼란에 빠지고, 아시아가 다시 짜이고, 공산 독재가 무너지기 시작하는 동안 그는 한 번도 걸음을 늦추지 않았습니다.\n\n결승선을 마주 보고 선 지금, 노인은 젊은 시절의 자신을 돌아봅니다. 젊은 날의 그는 가장 위대한 사람이 되고 싶었습니다. 그 소원을 그는 가장 늙은 나이에 이루었습니다."
 TFRKPHN_lee_in_je_g2a:0 "전선에서 일터까지"
 TFRKPHN_lee_in_je_g2a_desc:0 "전선에서 돌아온 사람들을 일터와 집으로 돌려보낸다. 부서진 공장과 항만을 다시 세우는 일도 그들의 손으로 한다."
 TFRKPHN_lee_in_je_g2b:0 "낙동강에서 압록강까지"
 TFRKPHN_lee_in_je_g2b_desc:0 "한때 낙동강까지 밀렸던 나라가 압록강에 닿았다. 휴전선이 사라진 자리에 행정과 치안을 세우고, 북쪽 주민을 차별도 보복도 없이 국민으로 맞는다."
 TFRKPHN_lee_in_je_g2c:0 "아시아의 새 질서"
 TFRKPHN_lee_in_je_g2c_desc:0 "함께 싸운 나라들과 전쟁 뒤의 아시아를 다시 짠다. 패전한 중국을 어떻게 대할지, 누가 무엇을 지킬지를 조약으로 적는다."
 TFRKPHN_lee_in_je_g3a:0 "돌아온 자"
 TFRKPHN_lee_in_je_g3a_desc:0 "전쟁에서 살아 돌아온 사람들에게 나라가 할 일을 한다. 일자리와 집, 치료를 약속대로 내주고, 고향을 찾아 북으로 가는 실향민의 길도 연다."
 TFRKPHN_lee_in_je_g3b:0 "돌아오지 못한 자"
 TFRKPHN_lee_in_je_g3b_desc:0 "눈보라가 휘날리는 바람 찬 흥남 부두에\n목을 놓아 불러봤다 찾아를 봤다\n금순아 어디를 가고 길을 잃고 헤매었더냐\n피눈물을 흘리면서 일사 이후 나 홀로 왔다\n\n일가친척 없는 몸이 지금은 무엇을 하나\n이 내 몸은 국제시장 장사치기다\n금순아 보고 싶구나 고향 꿈도 그리워진다\n영도다리 난간 위에 초생달만 외로이 떴다\n\n철의 장막 모진 설움 받고서 살아를 간들\n천지 간에 너와 난데 변함 있으랴\n금순아 굳세어다오 북진통일 그날이 되면\n손을 잡고 울어 보자 얼싸 안고 춤도 추어 보자\n\n현인의 곡, 굳세어라 금순아."
 TFRKPHN_lee_in_je_g4:0 "백두에서 한라를 걷네"
 TFRKPHN_lee_in_je_g4_desc:0 "출발선에서 한 약속을 결승선에서 돌아본다. 전쟁은 끝났고 나라는 하나가 되었다. 다음 출발선은 다음 사람의 몫이다."
 TFRKPHN_gawend_eac_tt:0 "§YPDTO§!가 §Y동아시아 공동체§!로 이름을 바꿉니다. 세계에 그 소식이 전해집니다."
 tfrkphn.556.t:0 "낙동강에서 압록강까지"
 tfrkphn.556.d:0 "1950년 여름의 낙동강 방어선은 대한민국의 마지막 보루였습니다. 이 선이 뚫렸다면 부산과 함께 대한민국도 지도에서 사라졌을 것입니다. 그때 세계는 자유민주주의를 위해 이름도 모르던 나라에 와서 피를 흘렸습니다.\n\n이름 없던 그 나라는 폐허에서 일어나 이제 세계 10위 안에 드는 선진국이 되었습니다. 그 과정에 위기가 많았지만 한국인은 그때마다 이겨 냈습니다. 총탄이 날아오는 길에서는 가장 먼저 앞장섰고, 다음 세대를 위해 공장을 지었으며, 자유로운 세대를 위해 스스로 피를 흘렸습니다.\n\n오늘의 대한민국이 완벽한 나라는 아닙니다. 고쳐야 할 것도, 아직 아물지 않은 상처도 남아 있습니다. 그래도 한국인은 그 어느 때보다 강인합니다.\n\n한국전쟁 때 압록강에서 떠 온 수통의 물은 이 격동의 세월을 견뎌 냈습니다. 그 물을 떴던 강가에 한국군이 다시 섰습니다. 이제 그 물로 상처를 닦아 낼 때입니다."
 tfrkphn.556.a:0 "수통을 하나 더 푼다"
 tfrkphn.557.t:0 "평양의 장부"
 tfrkphn.557.d:0 "한 주무관은 여군 부사관으로 대만해협 전쟁과 대아대전을 모두 치렀습니다. 전역한 뒤 홍준표 정부가 되살린 군 가산점을 받아 9급 시험에 붙었고, 첫 발령지로 평양을 받았습니다.\n\n평양은 부서져 있습니다. 몇 달 전 그녀가 소총을 들고 지나간 거리가 이제 그녀의 관할입니다. 대동강의 다리는 절반이 끊겼고, 전기는 하루에 몇 시간만 들어오며, 임시 구청은 유리창 자리에 비닐을 친 학교 건물입니다. 오전에는 무너진 집의 잔해를 치울 순서를 정하고 배급 줄을 정리합니다.\n\n오후에는 명단을 씁니다. 대아대전으로 죽은 사람들의 이름을 동네마다 돌며 받아 적는 일인데, 군인과 민간인, 남쪽 사람과 북쪽 사람을 가리지 않고 한 장부에 올립니다. 이름을 불러 준 노인들은 글자가 틀리지 않았는지 장부를 몇 번씩 들여다봅니다. 장부의 앞쪽에는 그녀가 직접 적어 넣은 분대원 두 사람의 이름도 있습니다.\n\n그녀는 할아버지에게서 전쟁 뒤의 서울 이야기를 들으며 자랐습니다. 다리가 끊기고 건물이 주저앉은 그 도시를 사람들은 벽돌 한 장씩 다시 쌓았습니다. 서울이 그렇게 이겨 냈으니 평양도 이겨 낼 것이라고, 한 주무관은 장부를 덮으며 생각합니다."
 tfrkphn.557.a:0 "평양도 이겨 낼 것이다"
 tfrkphn.558.t:0 "아시아의 새 질서"
 tfrkphn.558.d:0 "한국과 일본은 예로부터 좋은 사이가 아니었습니다. 식민 지배의 기억은 한 세기가 지나도록 지워지지 않았고, 1965년에 국교를 다시 연 뒤에도 두 나라는 가까워졌다가 멀어지기를 되풀이했습니다.\n\n그런 두 나라에도 공통점이 있었습니다. 민주주의와 자유였습니다. 대만해협에서 민주주의가 위협받자 두 나라는 그 대의 앞에서 처음으로 하나가 되었고, 같은 바다에서 같은 적과 싸웠습니다.\n\n자유가 다시 위협받았을 때에도 그들은 물러서지 않았습니다. 대아대전에서 두 나라의 군대는 서로의 옆을 맡아 자유를 위해 싸웠고, 전쟁이 끝난 지금은 아시아의 새 질서를 짜는 자리에 나란히 앉아 있습니다.\n\n두 나라의 사이가 다 회복된 것은 아닙니다. 풀지 못한 과거사는 그대로 남아 있고, 서로에게 아직 하지 못한 말도 많습니다. 그래도 오늘 두 나라는 대의 앞에서 새로운 희망을 향해 나아갑니다."
 tfrkphn.558.a:0 "대의 앞에서 함께 간다"
 tfrkphn.559.t:0 "돌아온 자"
 tfrkphn.559.d:0 "우리 열차는 잠시 후 마지막 역인 서울, 서울역에 도착하겠습니다. 두고 내리는 물건이 없도록 다시 한번 살펴보시기 바랍니다. 오늘도 빠르고 편안한 KTX를 이용해 주셔서 감사합니다. 안녕히 가십시오.\n\n안내 방송이 끝나자 그는 선반에서 더플백을 내렸다. 해군 소속이던 그가 고향 서울에 온 것은 전쟁이 시작된 뒤로 처음이었다.\n\n전쟁이 끝난 서울은 분위기가 달라져 있었다. 역 광장의 전광판에는 귀환 열차 시간표가 떠 있었고, 여의도를 지나는 버스 창밖으로 보이는 국회의사당의 한쪽 벽에는 이산가족을 찾는다는 종이가 빼곡히 붙어 있었다. 그 맞은편에서는 사람들이 돌아온 이들을 꽃과 박수로 축복하고 있었다.\n\n집에 돌아온 그는 돌아온 자였다. 어머니는 그가 좋아하던 반찬을 상에 다 올렸고, 아버지는 말없이 그의 밥그릇에 고기를 얹었다. 오랜만에 부모님과 함께 밥을 먹었지만 이야기는 길게 이어지지 않았다. 오래 지쳐 있던 그는 오늘이야말로 푹 자고 싶었다."
 tfrkphn.559.a:0 "오늘은 푹 잔다"
 tfrkphn.560.t:0 "돌아오지 못한 자"
 tfrkphn.560.d:0 "부산 영도다리는 1934년 11월에 놓인 우리나라의 첫 연륙교이자 도개교입니다. 하루 일곱 번씩 다리가 하늘로 들리는 모습은 그 시절 부산의 구경거리였습니다.\n\n한국전쟁 때 이 다리는 다른 뜻을 얻었습니다. 피란길에 흩어진 사람들은 헤어진 가족을 만나려고 다리 밑으로 모여들었고, 그곳은 기다리는 사람들의 자리가 되었습니다. 가족의 생사만이라도 알고 싶은 사람들이 찾아오면서 다리 밑에는 점집이 줄지어 들어섰습니다.\n\n기다린 사람이 모두 만난 것은 아닙니다. 다리는 1966년에 들리기를 멈추었다가 2013년에야 47년 만에 다시 들렸는데, 그 긴 세월이 지나도록 끝내 돌아오지 못한 사람이 많았습니다.\n\n대아대전이 끝난 지금, 영도다리에는 다시 기다리는 사람들이 모여듭니다. 다리 난간과 여의도 국회의사당의 벽에는 이산가족을 찾는다는 종이가 빼곡히 붙어 있고, 사람들은 사진 한 장과 이름 석 자를 붙여 놓고 날마다 다시 찾아옵니다. 정부는 그 종이를 한 장씩 옮겨 적어 전사자와 실종자, 북쪽에서 소식이 끊긴 사람들의 명단과 맞추어 보기 시작했습니다."
 tfrkphn.560.a:0 "돌아와요 부산항에"
 tfrkphn.561.t:0 "백두에서 한라를 걷네"
 tfrkphn.561.d:0 "마침내 포연이 걷혔습니다. 대만해협에서 시작해 압록강에서 끝난 두 번의 전쟁에서 대한민국과 그 동맹은 승리했고, 한반도는 하나의 나라가 되었습니다.\n\n플레이어여, 당신은 두 사람의 대통령과 함께 이 길을 걸었습니다. 검사 출신의 대통령과 함께 대만의 자유를 지켰고 미국이 거두어 간 핵우산의 빈자리를 메웠으며, 가장 늙은 대통령과 함께 전쟁 빚을 갚고 재벌을 고치고 북녘의 동포를 맞았습니다. 한라에서 출발한 걸음은 백두에 닿았습니다.\n\n오늘 백두산 천지에는 두 사람이 나란히 서 있습니다. 이인제 대통령의 초청을 받은 홍준표 전 대통령은 천지를 한참 내려다보다가, 자신이 시작한 일을 끝까지 해 주어 고맙다고 말했다고 합니다. 이인제는 출발선을 그어 준 사람이 있었기에 결승선까지 올 수 있었다고 답했다고 전해집니다. 두 사람은 수행원을 물리고 호숫가를 따라 한동안 걸었습니다.\n\n이제 서울에서 떠난 열차는 평양과 신의주를 지나 대륙으로 달리고, 백두에서 한라까지는 누구나 걸어서 갈 수 있는 길이 되었습니다. 영도다리에서 기다리던 사람들도, 평양에서 장부를 쓰던 주무관도 저마다의 집으로 돌아갑니다.\n\n수고하셨습니다. 당신이 맡은 길은 여기까지입니다. 노인은 완주를 마쳤고, 다음 출발선에는 다음 세대가 서 있습니다."
 tfrkphn.561.a:0 "다음 주자에게 바통을 넘긴다"
