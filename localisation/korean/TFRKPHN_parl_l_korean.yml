l_korean:
 # [안내] 의원내각제 국회. parl_build.py가 만든다.
 tfrkphn.7133.t:0 "첫 번째 총선"
 tfrkphn.7133.d:0 "새 헌법 아래 첫 총선이 치러졌다. 대통령 선거는 이제 없었다. 이긴 당 하나가 아니라 과반을 모은 당들이 정부를 만든다는 안내문이 투표소마다 붙었다. 노인들은 기표소 앞에서 그 안내문을 한 번 더 읽었다. 투표율은 어느 때보다 높았다.\n\n김무성은 출마하지 않았다. 그는 선거 전날 당사에 들러 젊은 후보들의 어깨를 한 번씩 두드리고 나왔다. 기자들이 소감을 묻자 웃기만 했다. 평생 바라던 헌법이었지만, 그 헌법 아래 첫 선거에 그의 이름은 없었다. 개표 방송은 집 거실에서 끝까지 보았다고 했다.\n\n개표 방송은 밤새 반원 하나를 그렸다. 의석이 하나씩 정해질 때마다 화면 속 점들이 색을 바꿨고, 앵커는 몇 번이고 과반선을 가리켰다. 자정을 넘기자 진행자들은 누가 이겼느냐는 말 대신 누가 누구와 손잡을 수 있느냐를 이야기하기 시작했다.\n\n새벽 네 시, 마지막 의석이 정해졌다. 어느 당사에서도 만세 소리는 나지 않았다. 사람들은 반원이 그려진 조간신문을 펼쳐 놓고 색깔별로 의석을 세었다. 이제부터는 숫자를 더하는 시간이었다."
 tfrkphn.7134.t:0 "총선"
 tfrkphn.7134.d:0 "국회의 임기가 끝났다. 총리는 마지막 국무회의를 마치고 국회로 가서 의원들에게 인사를 건넸다. 새 헌법 아래에서 선거는 한 사람을 고르는 일이 아니라 의회의 모양을 고르는 일이었다. 사람들도 이제 그 차이에 익숙해져 있었다. 투표소 앞 줄은 지난번보다 길었다.\n\n선거 운동은 짧고 조용했다. 큰 유세장 대신 골목의 작은 간담회가 늘었다. 후보들은 상대 당을 거칠게 몰아붙이지 않았다. 선거가 끝나면 그 당과 한 탁자에 앉아야 할지도 몰랐기 때문이다. 대신 그들은 숫자를 이야기했다. 우리가 몇 석이면 무엇을 할 수 있는지.\n\n개표 방송은 다시 반원을 그렸다. 지난번보다 화면은 세련되어졌고, 해설자들은 계산이 빨라졌다. 자정 무렵 몇몇 당사에서는 박수가 터졌고, 몇몇 당사에서는 불이 일찍 꺼졌다. 낙선한 중진 몇이 조용히 짐을 쌌다. 그 짐 속에는 오래된 명함이 많았다.\n\n아침이 되자 여의도의 전화기들이 다시 울리기 시작했다. 반원은 그려졌지만, 그 반원을 누가 이끌지는 아직 아무도 몰랐다. 협상단 명단이 하나둘 언론에 흘러나왔다."
 tfrkphn.7135.t:0 "연정 협상"
 tfrkphn.7135.d:0 "총선 다음 날부터 국회 사랑재의 작은 방들이 바빠졌다. 각 당 협상단은 서로 다른 문으로 들어가 같은 탁자에 앉았다. 탁자 위에는 정책 목록보다 숫자가 먼저 올라왔다. 백오십일. 그 숫자를 넘기지 못하면 아무것도 시작할 수 없었다.\n\n장관 자리와 예산의 순서, 첫 해에 처리할 법안이 하나씩 저울에 올랐다. 작은 당의 협상단은 의석보다 큰 목소리를 냈고, 큰 당의 협상단은 그 목소리를 들어주는 척하며 시계를 보았다. 밤마다 협상문 초안이 고쳐졌고, 아침마다 누군가 그것을 언론에 흘렸다.\n\n사흘째 밤, 제1당 대표는 협상단을 모두 돌려보내고 혼자 남았다. 탁자 위에는 서로 다른 명단 몇 장이 놓여 있었다. 어느 명단을 고르든 누군가는 실망할 것이었고, 실망한 사람들은 다음 선거까지 그것을 잊지 않을 것이었다.\n\n그는 펜을 두 번 돌렸다가 내려놓았다. 그리고 명단 한 장을 집어 들고 비서관을 불렀다. 내일 아침 발표하겠다고 했다. 발표문에는 정당 이름이 몇 개 적혀 있었고, 그 순서를 두고도 한참을 다퉜다."
 tfrkphn.7136.t:0 "불신임안"
 tfrkphn.7136.d:0 "국회 본회의장에 정부 불신임안이 올라왔다. 연정의 표가 흩어진 지 몇 달째였다. 법안은 상임위원회에서 멈췄고, 예산안은 두 번 돌아왔다. 야당은 더 이상 기다리지 않겠다고 했고, 연정 안에서도 몇몇 의원이 표결에 나서겠다고 밝혔다.\n\n총리는 표결 전날 밤 연정 대표들을 한 사람씩 불렀다. 어떤 이는 조건을 내밀었고, 어떤 이는 전화를 받지 않았다. 새벽까지 이어진 통화 끝에 총리실 비서관은 계산기를 내려놓았다. 숫자가 맞지 않았다. 총리는 창문을 열고 담배를 찾다가 그만두었다.\n\n표결 당일 아침, 국회 앞에는 기자들이 줄지어 섰다. 의원들은 아무 말 없이 본회의장으로 들어갔다. 전광판의 숫자가 하나씩 바뀌는 동안 회의장은 기침 소리 하나 없이 조용했다. 방청석의 기자들은 펜을 쥔 채 숨을 죽였다.\n\n의장이 의사봉을 들었다. 총리는 끝까지 자리에서 일어나지 않았다. 그는 마지막 연설을 하지 않았다. 이제 남은 길은 둘이었다. 물러나거나, 국민에게 다시 묻거나. 국회 사무처는 이미 선거 일정표를 꺼내 두었다."
 tfrkphn.7137.t:0 "가운데가 비어 간다"
 tfrkphn.7137.d:0 "패전의 계산서는 해마다 다시 날아왔다. 바다 건너에서 돌아오지 못한 사람들의 이름은 동네 게시판에서 지워지지 않았고, 다친 채 돌아온 사람들은 보훈 창구 앞에서 몇 달씩 기다렸다. 전쟁을 결정한 사람들은 대부분 물러났지만, 그 값은 아래로 내려와 쌓였다.\n\n민주당이 해산된 뒤 그 표들은 갈 곳을 잃었다. 신민당은 너무 점잖았고, 헌정회복연대는 너무 넓었다. 대학가에서는 반전 모임이 다시 학생회관을 채웠고, 공단에서는 전쟁 특수가 끝난 뒤 잘린 사람들이 작은 진보 정당들의 사무실로 몰려들었다. 그들은 이제 타협을 말하는 사람을 믿지 않았다.\n\n반대편 끝도 자랐다. 패전을 배신 탓으로 돌리는 집회가 광화문에서 다시 열렸고, 우리공화당의 깃발은 줄지 않았다. 지방의 소도시에서는 두 집회가 같은 날 같은 광장을 두고 다투는 일도 생겼다. 양쪽은 서로를 보며 더 커졌다.\n\n여론조사 기관들은 가운데가 비어 간다고 적었다. 새 헌법 아래의 첫 총선을 앞두고, 정치부 기자들은 처음으로 반원의 양쪽 끝부터 세기 시작했다."
 tfrkphn.7133.a:0 "반원이 그려졌다."
 tfrkphn.7134.a:0 "다시 숫자를 더한다."
