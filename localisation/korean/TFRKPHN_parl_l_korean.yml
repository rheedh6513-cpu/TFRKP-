l_korean:
 # [안내] 의원내각제 국회. parl_build.py가 만든다.
 tfrkphn.7133.t:0 "첫 번째 총선"
 tfrkphn.7133.d:0 "새 헌법에 따른 첫 총선이 치러졌다. 투표소마다 과반 의석을 모은 정당들이 함께 정부를 꾸린다는 안내문이 붙었고, 노인들은 기표소 앞에서 그 안내문을 한 번 더 읽었다. 투표율은 지난 어느 선거보다 높았다.\n\n김무성은 이 선거에 출마하지 않았다. 그는 선거 전날 당사에 들러 젊은 후보들의 어깨를 한 번씩 두드렸고, 소감을 묻는 기자들에게는 웃기만 했다. 그는 평생 주장해 온 내각제의 첫 선거를 집 거실에서 개표 방송으로 끝까지 지켜봤다. 당사 벽에는 그가 처음 내각제를 주장했을 때의 신문 기사가 붙어 있었다.\n\n개표 방송은 밤새 의석을 점으로 찍은 반원 그림을 내보냈다. 의석이 정해질 때마다 점의 색이 바뀌었고 앵커는 과반선을 여러 번 가리켰다. 자정이 넘자 진행자들은 어느 당이 어느 당과 연정을 꾸릴 수 있는지를 따지기 시작했다.\n\n마지막 의석은 새벽 네 시에 정해졌고 만세를 부른 당사는 한 곳도 없었다. 사람들은 조간신문에 실린 반원 그림을 펴 놓고 색깔별로 의석을 세었고, 각 당은 아침부터 협상단을 꾸렸다."
 tfrkphn.7134.t:0 "총선"
 tfrkphn.7134.d:0 "국회의 임기가 끝나 총리는 마지막 국무회의를 마치고 국회에 가서 의원들에게 인사했다. 유권자들은 이제 총선이 정부를 꾸릴 의석 분포를 정하는 선거라는 데 익숙해졌고, 투표소 앞의 줄은 지난번보다 길었다.\n\n선거 운동은 짧고 조용했다. 큰 유세가 줄고 골목의 작은 간담회가 늘었으며, 후보들은 선거 뒤에 연정 협상에서 마주 앉을 수도 있는 상대 당을 거칠게 공격하지 않았다. 후보들은 자기 당이 몇 석을 얻으면 무엇을 할 수 있는지를 주로 설명했다.\n\n개표 방송은 이번에도 반원 그림을 내보냈다. 자정 무렵 박수가 나온 당사도 있었고 일찍 불을 끈 당사도 있었다. 낙선한 중진 의원 몇 사람은 의원회관에서 오래된 명함이 가득 든 짐을 쌌다. 방송사들은 예상 의석으로 만들 수 있는 연정 조합을 표로 보여 줬다.\n\n아침이 되자 여의도의 전화가 다시 바빠졌다. 의석은 정해졌지만 어느 당이 정부를 이끌지는 정해지지 않았고, 각 당 협상단의 명단이 하나둘 언론에 흘러나왔다. 제1당 대표는 아침 일곱 시에 첫 전화를 받았다."
 tfrkphn.7135.t:0 "연정 협상"
 tfrkphn.7135.d:0 "총선 다음 날부터 각 당 협상단이 국회 사랑재의 작은 방에 모였다. 협상단은 정책보다 먼저 의석수를 따졌는데, 백오십일 석을 채우지 못하면 정부를 꾸릴 수 없기 때문이었다. 사랑재 앞에는 방마다 다른 당의 협상단 이름표가 붙었다.\n\n장관 자리와 예산의 우선순위, 첫 해에 처리할 법안이 차례로 협상에 올랐다. 작은 당의 협상단은 의석에 비해 많은 것을 요구했고 큰 당의 협상단은 듣는 시늉을 하며 시계를 봤다. 협상문 초안은 밤마다 고쳐졌고 아침이면 누군가 그 초안을 언론에 흘렸다. 기자들은 마당에서 밤을 새웠다.\n\n사흘째 밤 제1당 대표는 협상단을 돌려보내고 혼자 남아 탁자 위의 명단 몇 장을 들여다봤다. 어느 명단을 골라도 연정에서 빠지는 당이 생기고, 빠진 당은 다음 선거 때까지 이 일을 잊지 않는다.\n\n그는 펜을 두 번 돌리다가 내려놓고 명단 한 장을 집어 비서관을 불렀고, 내일 아침에 발표하겠다고 말했다. 발표문에 정당 이름을 적는 순서를 정하는 데에도 한참이 걸렸다. 비서관은 그 명단을 받아 밤사이 발표문을 만들었다."
 tfrkphn.7136.t:0 "불신임안"
 tfrkphn.7136.d:0 "정부 불신임안이 국회 본회의에 올라왔다. 연정의 표가 흩어진 지 몇 달이 지나 법안은 상임위원회에 묶여 있었고 예산안은 두 번 되돌아왔다. 야당은 더 기다리지 않겠다고 선언했고 연정 소속 의원 몇 사람도 불신임에 찬성하겠다고 밝혔다. 본회의는 오전 열 시에 열렸다.\n\n총리는 표결 전날 밤 연정에 참여한 당의 대표들을 한 사람씩 불렀다. 조건을 내건 대표도 있었고 전화를 받지 않은 대표도 있었다. 새벽까지 통화한 끝에 총리실 비서관은 표가 모자란다고 보고했고, 총리는 창문을 열고 담배를 찾다가 그만두었다.\n\n표결 날 아침 국회 앞에는 기자들이 줄지어 섰고 의원들은 말없이 본회의장으로 들어갔다. 전광판의 숫자가 바뀌는 동안 회의장에서는 아무도 말하지 않았다. 방청석의 기자들은 펜을 쥔 채 전광판만 올려다봤다.\n\n의장이 의사봉을 들 때까지 총리는 자리에서 일어나지 않았고 마지막 연설도 하지 않았다. 불신임안이 통과되면 총리는 물러나거나 국회를 해산하고 총선을 다시 치러야 한다. 국회 사무처는 선거 일정표를 미리 꺼내 두었다."
 tfrkphn.7137.t:0 "가운데가 비어 간다"
 tfrkphn.7137.d:0 "패전의 비용은 해마다 다시 청구됐다. 전사자들의 이름은 동네 게시판에 그대로 붙어 있었고 다쳐서 돌아온 사람들은 보훈 창구 앞에서 몇 달씩 기다렸다. 전쟁을 결정한 사람들은 대부분 자리에서 물러났지만 그 부담은 평범한 사람들에게 남았다.\n\n민주당이 해산된 뒤 그 지지자들은 지지할 당을 찾지 못했다. 그들은 신민당이 너무 온건하고 헌정회복연대는 성향이 너무 넓다고 여겼다. 대학가에서는 반전 모임이 학생회관을 채웠고, 전쟁 특수가 끝나 해고된 공단 노동자들은 작은 진보 정당들의 사무실로 모여들어 타협을 말하는 정치인을 믿지 않게 됐다.\n\n반대쪽 끝의 세력도 커졌다. 광화문에서는 패전이 배신 때문이라고 주장하는 집회가 다시 열렸고 우리공화당의 깃발은 줄지 않았다. 지방 소도시에서는 양쪽 집회가 같은 날 같은 광장을 두고 다투기도 했다.\n\n여론조사 기관들은 중도 정당의 지지율이 계속 내려간다고 발표했다. 새 헌법에 따른 첫 총선을 앞두고 정치부 기자들은 의석 전망을 양쪽 끝 정당부터 계산하기 시작했다."
 tfrkphn.7133.a:0 "반원이 그려졌다."
 tfrkphn.7134.a:0 "다시 숫자를 더한다."
