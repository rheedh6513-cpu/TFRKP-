 KOR_TFRKPHN_kys_char:0 "권영세"
 TFRKPHN_kys_desc:0 "권영세는 서울대학교 법과대학을 나와 서울 영등포을과 용산에서 국회의원을 지냈고, 주중대사로 일했습니다.\n\n헌정회복연대에서 그는 김무성의 개헌안을 실무에서 이끈 사람이었습니다. 김무성이 물러난 뒤 연대는 그를 첫 총리 후보로 내세웠습니다."
