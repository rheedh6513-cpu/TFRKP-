l_korean:
 # [안내] 우원식 초기 중점. woo_init_build.py가 만든다.
 TFRKPHN_woo_init_01:0 "헌정회복연대 출범"
 TFRKPHN_woo_init_01_desc:0 "보수에서 사회민주주의까지 네 진영이 하나의 약속에 서명합니다. 헌법을 되살리기 전까지는 누구도 연정을 떠나지 않는다는 약속입니다."
 TFRKPHN_woo_init_02:0 "국회 재개원"
 TFRKPHN_woo_init_02_desc:0 "포탄 자국이 남은 본회의장 대신 의원회관 대회의실에서 국회가 다시 문을 엽니다. 의석은 모자라도 회의는 열립니다."
 TFRKPHN_woo_init_03:0 "여의도 복구"
 TFRKPHN_woo_init_03_desc:0 "무너진 본회의장 지붕과 깨진 유리창을 고칩니다. 국회 정문 앞 바퀴 자국 한 줄만은 메우지 않고 남겨 둡니다."
 TFRKPHN_woo_init_04:0 "청년 애국단 해산"
 TFRKPHN_woo_init_04_desc:0 "노란 완장을 모두 거둬들입니다. 단원들에게는 처벌 대신 일자리와 학교를 내밀지만, 모두가 그 손을 잡지는 않습니다."
 TFRKPHN_woo_init_05:0 "청산 위원회 폐지"
 TFRKPHN_woo_init_05_desc:0 "대통령령으로 만들어졌던 기득권 청산 위원회를 없앱니다. 위원회가 만든 명단은 불태우지 않고 봉인해 기록으로 남깁니다."
 TFRKPHN_woo_init_06:0 "원대 복귀"
 TFRKPHN_woo_init_06_desc:0 "여의도에 들어왔던 부대들을 원래 주둔지로 돌려보냅니다. 전차가 수도를 떠나는 날, 연도에는 박수도 야유도 없었습니다."
 TFRKPHN_woo_init_07:0 "물러난 장군들"
 TFRKPHN_woo_init_07_desc:0 "지휘부 교체 때 옷을 벗거나 자리를 잃은 지휘관들을 다시 부릅니다. 끝까지 부대 정문을 열지 않았던 여단장도 그 명단에 있습니다."
 TFRKPHN_woo_init_08:0 "군의 정치 개입 금지법"
 TFRKPHN_woo_init_08_desc:0 "군이 다시는 정치에 끼어들지 못하도록 법으로 막습니다. 법안이 본회의에 오르는 날, 군 안의 모든 사람이 그 표결을 지켜볼 것입니다."
 TFRKPHN_woo_init_08_tt:0 "§Y군의 정치 개입 금지법§!이 본회의 표결을 기다립니다."
 TFRKPHN_woo_init_tree_tt:0 "§Y우원식 초기 중점§!으로 바뀝니다. §Y120일§! 뒤에는 본 중점 트리로 넘어갑니다."
