l_korean:
 # 이인제 루트: 야당의 얼굴. opp_lee_build.py가 만든다.
 tfrkphn.580.t:0 "두 경기지사"
 tfrkphn.580.d:0 "대통령은 1995년 첫 민선 경기도지사였습니다. 그로부터 스물세 해 뒤 같은 자리에 앉은 사람이 지금의 더불어민주당 대표 이재명입니다. 이재명 지사의 경기도는 2019년부터 만 24세 청년에게 분기마다 25만 원을 지역화폐로 주는 청년기본소득을 시작했습니다.\n\n이재명은 다섯 해째 당을 쥐고 있습니다. 그사이 그에게 맞섰던 의원들은 공천에서 차례로 떨어졌고, 지금 야당에서 그와 다른 말을 하는 사람은 손에 꼽습니다.\n\n정부가 고용보험을 넓히는 안을 내놓자 그는 다른 안을 들고 나왔습니다. 일자리를 잃은 사람만 받는 보험으로는 일자리를 가져 본 적 없는 사람이 빠지니, 전쟁에서 돌아온 청년 모두에게 조건 없이 주자는 것이었습니다. 정부가 이 안을 받지 않으면 돌아온 청년들의 불만이 고스란히 정부 몫이 된다는 것을 그도 알고 있습니다.\n\n대통령은 일해서 버는 돈이 복지의 뼈대라는 생각을 바꾸지 않았습니다. 그러면서도 야당 안을 국회 상임위원회에 함께 올려 같은 날 심사하게 하라고 했습니다."
 tfrkphn.580.a:0 "보험이 먼저다"
 tfrkphn.580.b:0 "돌아온 청년에게는 시범으로 해 본다"
 tfrkphn.581.t:0 "가장 오래 한 총리"
 tfrkphn.581.d:0 "이낙연은 2019년 10월 28일 재임 881일로 가장 오래 일한 국무총리가 되었고 이듬해 1월에 물러났습니다. 2022년 대선에서는 홍준표 대통령에게 졌습니다.\n\n정부가 책임총리제를 내놓은 주에 한 신문이 그에게 생각을 물었습니다. 그는 제도보다 대통령이 참는 것이 먼저라고 답했습니다. 총리가 고른 장관이 마음에 들지 않을 때, 총리의 결정이 여론에 밀릴 때 대통령이 끼어들지 않아야 제도가 선다는 것이었습니다.\n\n대통령은 그 기사를 읽고 이낙연에게 전화를 걸었습니다. 두 사람 모두 대통령 선거에서 져 본 사람입니다. 통화가 끝난 뒤 대통령은 총리를 지낸 사람들을 여야 가리지 않고 한 해에 두 번 청와대로 부르기로 했습니다."
 tfrkphn.581.a:0 "쓴소리를 들을 자리를 만든다"
 tfrkphn.581.b:0 "제도는 제도대로 간다"
 tfrkphn.582.t:0 "대장의 질문"
 tfrkphn.582.d:0 "국회 국방위원회에서 김병주 의원이 국방부 장관을 불러 세웠습니다. 그는 한미연합사 부사령관을 지낸 예비역 대장이고, 대만지원법 때는 파병 조항에 반대한 사람입니다.\n\n질문은 세 가지였습니다. 대만해협에서 돌아온 부대를 북쪽 산악에 맞게 다시 짜는 데 몇 해가 걸리는지, 그동안 전방의 빈자리는 누가 메우는지, 북쪽 안정화 부대가 주민을 상대할 때 따를 교전 규칙은 누가 정하는지였습니다.\n\n국방부는 앞의 둘에는 숫자로 답했고 마지막 질문에는 답을 미뤘습니다. 보고를 받은 대통령은 교전 규칙의 뼈대를 국회에 먼저 보고하라고 지시했습니다. 군이 북쪽에 들어가기 전에 국회가 그 규칙을 알고 있어야 한다는 이유였습니다."
 tfrkphn.582.a:0 "국회에 먼저 보고한다"
 tfrkphn.582.b:0 "작전 사항은 군이 정한다"
