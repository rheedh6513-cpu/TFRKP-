l_korean:
 # [안내] 삼김 루트. samkim_build.py가 만든다.
 TFRKPHN_kdy_char:0 "김동연"
 TFRKPHN_kms_char:0 "김무성"
 TFRKPHN_kbg_char:0 "김부겸"
 tfrkphn.7061.a:0 "세 사람이 나섰다."
 tfrkphn.7061.t:0 "새 기수"
 tfrkphn.7061.d:0 "우원식 대통령은 다음 대통령 선거에 나서지 않겠다고 밝혔다. 헌법을 되살리는 일까지가 자신의 몫이라고 했다. 여의도의 사람들은 곧바로 다음 이름을 세기 시작했다. 연정을 이끌 다음 사람은 이제 국민이 직접 뽑는다.\n\n가장 먼저 출마를 밝힌 사람은 김부겸이었다. 대구에서 몇 번을 떨어지고도 다시 나섰던 사람, 지역의 벽을 넘는 데 정치 인생을 건 사람이었다. 그는 낡은 판을 깬 자리에 새 판을 짤 사람이 필요하다고 했다.\n\n이틀 뒤 김동연이 나섰다. 경제부총리를 지낸 관료 출신으로, 우원식 정부에서도 경제를 맡았던 사람이었다. 그는 패전의 빚을 갚는 일이 정치보다 먼저라고 했다. 두 사람은 연정을 떠나 신민당을 함께 세우고, 한 당 안에서 후보 자리를 다투기로 했다.\n\n두 사람은 여의도의 사흘 동안 같은 편에 서 있었고, 국무회의에서도 나란히 앉았던 사이였다. 이제 그 두 사람이 같은 자리를 두고 서로를 마주 보게 됐다.\n\n헌정회복연대에 남은 쪽에서는 보수 원로 김무성이 출마를 밝혔다. 그는 연정에 남은 의원들을 다시 불러 모았다."
 tfrkphn.7082.a:0 "새 당의 깃발이 올랐다."
 tfrkphn.7082.t:0 "신민당 창당"
 tfrkphn.7082.d:0 "두 사람이 연정을 떠난다는 소식에 여의도가 술렁였다. 김부겸을 따르는 옛 민주당 사람들과 김동연을 따르는 제3지대의 의원들이 각자 짐을 쌌다.\n\n옛 민주당 사람들에게는 돌아갈 당이 없었다. 조원진 정부가 낸 해산 심판 끝에 민주당은 강제로 해산되었고, 법은 해산된 당의 이름을 다시 쓰는 것도, 같은 강령으로 당을 다시 세우는 것도 막았다. 헌정이 돌아온 뒤에도 그 결정은 지워지지 않았다. 당사 간판이 내려지던 날을 기억하는 의원들은 새 당 이야기가 나올 때마다 말이 없어졌다.\n\n두 세력은 처음에 따로 당을 만들려 했다. 그러다 한 원로가 두 사무실을 차례로 찾아가 둘로 나가면 둘 다 진다고 했다. 일주일 뒤 두 준비위원회는 하나로 합쳤다.\n\n당 이름은 신민당으로 정했다. 새로운 국민의 당이라는 뜻이었다. 오래된 기자들은 그 이름을 듣고 잠시 펜을 멈췄다. 창당대회 날, 두 김씨는 단상 양쪽 끝에 앉아 박수를 쳤다.\n\n그날 밤 김무성은 중계를 끝까지 지켜보고, 남은 의원들에게 전화를 돌리기 시작했다."
 tfrkphn.7062.a:0 "결선이 멈췄다."
 tfrkphn.7062.t:0 "뒤집힌 셈"
 tfrkphn.7062.d:0 "신민당의 후보 지명 전당대회가 열렸다. 대의원들이 체육관을 가득 메웠다. 1차 투표에서 앞선 쪽은 김부겸이었다. 그러나 과반에는 몇십 표가 모자랐다. 투표함에서는 이름을 적지 않은 백지표가 적지 않게 나왔다.\n\n결선을 앞둔 밤, 김동연 캠프는 3위를 한 중진 의원을 찾아갔다. 그가 내민 것은 자리가 아니라 계산서였다. 패전의 빚을 어떻게 갚을지, 누가 얼마를 부담할지가 적힌 문서였다. 새벽에 중진 의원의 대의원들이 김동연 쪽으로 옮겨 간다는 말이 돌았다.\n\n김부겸 캠프는 결선을 미루자고 했다. 김동연 캠프는 그대로 치르자고 했다. 체육관 복도에서 두 캠프의 대의원들이 고성을 주고받았고, 당 지도부는 결선을 무기한 미룬다고 발표했다.\n\n그날 밤 체육관 앞에는 두 캠프의 버스가 나란히 서 있었다. 같은 버스를 타고 올라왔던 대의원들이 서로 다른 버스에 나눠 타고 돌아갔다. 몇 달 전 함께 당을 세운 사람들이었다.\n\n셈은 단순했다. 두 사람의 표를 더하면 김무성을 크게 앞섰다. 따로 나서면 어느 쪽도 김무성을 넘지 못했다."
 tfrkphn.7063.a:0 "협상 테이블을 지킨다."
 tfrkphn.7063.t:0 "단일화 협상"
 tfrkphn.7063.d:0 "결선이 멈춘 뒤 신민당의 원로 의원들이 두 후보에게 공개 서한을 보냈다. 세운 지 몇 달 되지 않은 당을 둘로 쪼개지 말라는 내용이었다. 두 캠프는 결선 대신 협상으로 후보를 정하기로 했다.\n\n첫 협상은 국회 의원회관의 작은 회의실에서 열렸다. 김부겸 쪽은 여론조사로 후보를 정하자고 했다. 김동연 쪽은 정책부터 맞추자고 했다. 회의는 네 시간 이어졌고 다음 날짜만 정한 채 끝났다.\n\n두 캠프의 지지자들은 서로를 향해 날이 서 있었다. 한쪽은 지역의 벽을 넘은 사람이 먼저라고 했고, 다른 쪽은 나라의 빚을 아는 사람이 먼저라고 했다. 신문들은 두 김씨가 끝내 갈라설지를 놓고 매일 다른 전망을 내놓았다.\n\n우원식 대통령은 어느 쪽 손도 들지 않았다. 다만 대통령실은 협상에 필요한 자리와 여론조사 기관을 마련하겠다고 했다. 두 사람이 갈라서면 쌓은 것도 무너진다는 것을 대통령실도 알았다.\n\n후보 등록까지 남은 날은 다섯 주였다. 그 안에 하나가 되지 못하면 표는 갈린다. 김무성 캠프는 협상 소식이 나올 때마다 조용히 여론조사를 돌렸다."
 tfrkphn.7064.a:0 "김부겸이 나선다."
 tfrkphn.7064.b:0 "김동연이 나선다."
 tfrkphn.7064.t:0 "하나의 이름"
 tfrkphn.7064.d:0 "협상은 다섯 주 만에 타결됐다. 두 사람이 함께 기자회견장에 섰다. 공동 정부를 꾸리고, 경제와 개혁을 나누어 맡는다는 합의문이었다. 남은 것은 누구의 이름을 투표용지에 올리느냐였다.\n\n여론조사는 두 사람의 차이가 오차 범위 안이라고 했다. 정책 합의문의 마지막 줄은 비어 있었다. 후보는 두 사람이 마지막 회동에서 직접 정하기로 했기 때문이다.\n\n회동은 자정을 넘겨 끝났다. 회의실을 먼저 나온 것은 두 사람의 비서실장들이었다. 그들은 기자들의 질문에 아무 답도 하지 않았다. 한 시간 뒤 두 사람이 함께 문을 열고 나왔다.\n\n두 사람은 회견장의 단상 앞에 나란히 섰다. 누가 마이크를 먼저 잡을지 잠시 서로를 바라보았다. 지지자들은 숨을 죽였다. 그날 사진에는 두 사람의 손이 함께 높이 들려 있었다.\n\n김무성 캠프의 상황실에서는 그날 밤 아무도 퇴근하지 않았다. 연정에 남은 표만으로는 하나가 된 신민당을 넘을 수 없다는 것을 모두가 알고 있었다. 선거는 이제 사실상 두 김씨 가운데 누가 나서느냐의 문제였다."
 tfrkphn.7065.a:0 "개혁의 칼을 든다."
 tfrkphn.7065.t:0 "대구에서 온 대통령"
 tfrkphn.7065.d:0 "개표가 끝났다. 단일 후보 김부겸이 김무성을 넉넉하게 앞섰다. 대구와 광주에서 고르게 표가 나왔다. 지역의 벽을 넘겠다던 사람이 그 벽 위에서 당선됐다.\n\n김동연은 개표 방송이 끝나기 전에 김부겸의 캠프를 찾았다. 두 사람은 함께 지지자들 앞에 섰다. 김동연은 단상에서 김부겸의 손을 잡아 높이 들어 올렸다. 합의대로 그는 경제를 책임지는 부총리를 맡기로 했다.\n\n김무성은 패배를 인정하는 짧은 회견을 열었다. 그는 연정이 다시 일어설 길을 찾겠다고 했다. 그의 곁에 선 의원들은 생각보다 많았다.\n\n취임식은 국회 앞마당에서 열렸다. 국회 정문 앞 아스팔트에는 전차가 남긴 바퀴 자국 한 줄이 그대로 남아 있었다. 새 대통령은 선서를 마치고 그 자국 앞에 잠시 서 있었다. 대구에서 올라온 지지자들과 광주에서 올라온 지지자들이 같은 줄에 섰다.\n\n새 대통령의 첫 지시는 군이었다. 여의도의 사흘 동안 명령을 내린 사람들, 그 명령을 따른 사람들이 아직 군 안에 남아 있었다. 그는 개혁은 빨리, 한 번에 해야 한다고 믿는 사람이었다."
 tfrkphn.7066.a:0 "빚부터 갚는다."
 tfrkphn.7066.t:0 "계산서를 든 대통령"
 tfrkphn.7066.d:0 "개표가 끝났다. 단일 후보 김동연이 김무성을 넉넉하게 앞섰다. 공장 지대와 항구 도시들에서 표가 많이 나왔다. 패전의 빚을 갚겠다는 사람에게 빚을 가장 크게 진 곳들이 표를 던졌다.\n\n김부겸은 개표 방송이 끝나기 전에 김동연의 캠프를 찾았다. 두 사람은 함께 지지자들 앞에 섰다. 김부겸은 단상에서 김동연의 손을 잡아 높이 들어 올렸다. 합의대로 그는 국무총리를 맡기로 했다.\n\n김무성은 패배를 인정하는 짧은 회견을 열었다. 그는 연정이 다시 일어설 길을 찾겠다고 했다. 그의 곁에 선 의원들은 생각보다 많았다.\n\n취임식은 국회 앞마당에서 열렸다. 새 대통령의 취임사에는 숫자가 많았다. 갚아야 할 빚과 다시 열어야 할 항구, 되살려야 할 일자리의 수였다. 사람들은 처음으로 대통령에게서 연설이 아니라 계획을 들었다고 했다.\n\n새 대통령의 첫 지시는 계산서였다. 패전의 빚을 갚는 순서와 세금을 걷는 순서를 한 장에 정리하라는 것이었다. 경제 부처의 불은 그 주 내내 꺼지지 않았다. 그는 재건은 느려도 확실해야 한다고 믿는 사람이었다."
 tfrkphn.7067.a:0 "어부지리."
 tfrkphn.7067.t:0 "갈라진 두 김씨"
 tfrkphn.7067.d:0 "협상은 끝내 깨졌다. 김동연을 따르는 의원들이 신민당을 떠나 새 당을 차렸다. 후보 등록 마감일에 두 사람은 같은 날 따로 서류를 냈고, 지지자들은 서로를 배신자라고 불렀다.\n\n선거운동 내내 두 사람은 김무성보다 서로를 더 많이 공격했다. 마지막 주의 여론조사는 세 사람이 모두 오차 범위 안이라고 했다.\n\n개표가 끝났을 때 1위는 김무성이었다. 두 김씨의 표를 더하면 그를 크게 넘었지만, 투표용지에는 두 이름이 따로 적혀 있었다. 김무성 쪽 표는 처음부터 끝까지 한 사람에게 모여 있었다.\n\n개표 방송을 보던 신민당 의원들은 하나둘 자리를 떴다. 몇 달 전 함께 세운 당이 그렇게 둘로 갈라졌다. 오래된 기자들은 이 장면을 어디선가 본 적이 있다고 했다. 그 장면의 끝을 아는 사람들은 아무 말도 하지 않았다.\n\n두 김씨는 그날 밤 서로에게 전화하지 않았다. 신문들은 두 사람이 합쳤다면, 이라는 말을 다시 꺼냈다. 새 대통령은 당선 소감에서 두 사람에게 함께 일하자고 했다. 판을 쥔 사람은 그렇게 판의 한가운데에 앉았다."
 TFRKPHN_sk_policy:0 "정책 연대 협약"
 TFRKPHN_sk_policy_desc:0 "개혁과 재건의 순서를 두 캠프가 함께 정합니다."
 TFRKPHN_sk_poll:0 "경선 방식 합의"
 TFRKPHN_sk_poll_desc:0 "여론조사로 후보를 정하는 방식을 두 캠프가 받아들이게 합니다."
 TFRKPHN_sk_gov:0 "공동 정부 구상"
 TFRKPHN_sk_gov_desc:0 "이긴 쪽이 대통령, 진 쪽이 국무총리나 부총리를 맡는 공동 정부 구상을 내놓습니다."
 TFRKPHN_sk_meet:0 "실무진 회동"
 TFRKPHN_sk_meet_desc:0 "두 캠프의 실무진이 매일 밤 따로 만나 이견을 좁힙니다."
 TFRKPHN_sk_category:0 "두 김씨의 단일화"
 TFRKPHN_sk_category_desc:0 "함께 신민당을 세운 김부겸과 김동연이 당의 단일 후보를 놓고 협상하고 있습니다. 둘로 갈라지면 헌정회복연대의 김무성이 이깁니다.\n\n협상 진척도: §Y[?TFRKPHN_sk_uni|0]§! / 100\n\n시한이 끝날 때 §Y50§! 이상이면 단일화가 성사되고 두 사람 가운데 한 사람을 후보로 고릅니다. 모자라면 두 사람이 각자 출마하고, 갈라진 표 사이로 §R김무성§!이 이깁니다."
 TFRKPHN_sk_deadline:0 "후보 등록 마감"
 TFRKPHN_sk_deadline_desc:0 "후보 등록 마감까지 남은 시간입니다."
 TFRKPHN_sk_deadline_tt:0 "협상 진척도가 §Y50§! 이상이면 단일화가 성사되고, 모자라면 두 사람이 따로 출마합니다."
 TFRKPHN_kms_ref_tt:0 "다음 날 개표 결과가 나옵니다. 안정도가 §Y50%§!를 넘으면 개헌안이 §G통과§!되고, 아니면 §R부결§!됩니다. 바둑판에서 이겼다면 §Y40%§!만 넘어도 통과하고, 졌다면 국회 문턱을 넘지 못해 §R부결§!됩니다."
 TFRKPHN_sk_up15_tt:0 "협상 진척도 §G+15§!"
 TFRKPHN_sk_up10_tt:0 "협상 진척도 §G+10§!"
 TFRKPHN_sk_uni_tt:0 "§Y두 김씨의 단일화§! 결정이 열립니다. 협상 진척도는 §Y30§!에서 시작하고, §Y35일§! 안에 §Y50§!을 넘겨야 합니다."
 tfrkphn.7083.a:0 "칼은 한 번에 뽑는다."
 tfrkphn.7083.t:0 "별이 떨어진 아침"
 tfrkphn.7083.d:0 "권력은 총구에서 나온다고 믿던 시대가 있었다. 그 시대의 마지막 흔적은 여의도의 사흘이 지나고도 군복 속에 남아 있었다.\n\n취임 열하루째 아침, 국방부 청사 앞에 검은 승용차들이 줄지어 섰다. 장성들은 여느 날처럼 경례를 받으며 계단을 올랐다. 여덟 시 정각, 그들의 책상 위에 하얀 봉투가 한 장씩 놓였다. 오늘 날짜로 전역을 명한다. 한 줄이었다. 운전병들은 차에서 내리지 않고 기다렸다.\n\n\"이게... 무슨 뜻입니까.\" 한 소장이 봉투를 든 채 물었다. 비서관은 대답하지 않았다. 창문 너머로 청사 앞에 몰려든 방송 차량들이 보였다.\n\n같은 시각, 대통령은 담화도 회견도 열지 않았다. 부총리 김동연은 아침 회의를 미루고 환율 화면 앞을 지켰고, 야당의 김무성은 짧은 논평 하나만 냈다. 연정의 원로들은 전화를 받지 않았다.\n\n그날 하루 군복을 벗은 별은 마흔 개가 넘었다. 이 나라의 군이 다시 정치의 문턱을 넘지 않게 된 것은 그날 아침부터였다. 그러나 떨어진 별들의 그림자가 얼마나 길게 남을지는, 그때 아무도 알지 못했다."
 tfrkphn.7084.a:0 "이름 없는 돈은 없다."
 tfrkphn.7084.t:0 "밤 여덟 시"
 tfrkphn.7084.d:0 "돈에는 이름이 없었다. 적어도 그날 밤까지는 그랬다.\n\n저녁 일곱 시 반, 방송사들에 대통령실의 통보가 들어왔다. 여덟 시에 대통령 특별 담화가 있다. 주제는 알려 주지 않았다. 보도국마다 정규 방송을 끊을 준비로 부산했다.\n\n여덟 시 정각, 대통령이 화면에 나타났다. 담화는 짧았다. 내일 아침부터 모든 금융 거래는 실제 이름으로만 할 수 있다. 남의 이름을 빌린 계좌는 두 달 안에 바꾸지 않으면 묶인다. 담화는 사 분이 채 걸리지 않았다.\n\n같은 시각, 강남의 한 사무실은 밤새 불이 꺼지지 않았다. \"지금 바꾸면 다 드러납니다.\" \"안 바꾸면 다 묶입니다.\" 전화기 너머의 목소리가 점점 높아졌다.\n\n부총리 김동연은 그날 밤 은행장들을 불러 모았다. 그는 내일 아침 창구가 멈추면 안 된다고만 했다. 다음 날 은행 문이 열리기도 전에 창구 앞에는 긴 줄이 섰다. 은행원들은 그날 밤 집에 가지 못했다.\n\n숨어 있던 돈이 그렇게 하나둘 이름을 얻기 시작했다. 그 이름들 가운데 몇이 정치인의 것인지는, 아직 아무도 몰랐다."
 tfrkphn.7085.a:0 "기록되지 않은 밤."
 tfrkphn.7085.t:0 "세 사람의 저녁"
 tfrkphn.7085.d:0 "세 사람이 한 상에 앉은 것은 선거 뒤 처음이었다. 장소는 여의도 뒷골목의 오래된 한정식집이었다. 기자들은 아무도 몰랐다. 대통령실 일정표에는 그 저녁이 비어 있었다.\n\n대통령이 먼저 와서 기다렸다. 부총리 김동연이 그다음에 왔고, 김무성은 약속 시간을 조금 넘겨 들어왔다. 주인이 술을 내왔지만 아무도 먼저 잔을 들지 않았다. 방에는 상 하나와 방석 셋이 있었다.\n\n이야기는 재산 공개에서 시작됐다. 대통령은 자기 재산 목록부터 내놓았다고 했다. 김무성은 웃으며 잔을 들었고, 김동연은 숫자 몇 개를 짚었다. 대화는 자정을 넘겨서야 정치로 넘어갔다. 술병은 세 번 바뀌었다.\n\n문밖의 수행 비서들은 서로 담배를 나눠 피웠다. \"무슨 얘기가 오가는 걸까요.\" \"모르는 게 낫지.\" 방 안에서는 가끔 웃음소리가 났고, 가끔은 오래 조용했다.\n\n새벽 한 시, 세 사람은 차례로 다른 문으로 나갔다. 그날 밤 무엇이 합의됐는지는 어디에도 기록되지 않았다. 다만 그 주의 국회는 이상하리만치 조용했다. 이튿날 세 사람은 아무 일 없던 듯 움직였다."
 tfrkphn.7086.a:0 "벽은 넘으라고 있다."
 tfrkphn.7086.t:0 "대구로 가는 열차"
 tfrkphn.7086.d:0 "대구는 그에게 고향이자 상처였다. 그는 그 도시에서 몇 번을 떨어졌고, 그때마다 다시 짐을 쌌다.\n\n대통령이 된 뒤 처음 대구로 가는 날, 그는 전용기를 마다하고 열차를 탔다. 경호원들이 말렸지만 그는 듣지 않았다. 객차의 승객들은 처음엔 알아보지 못하다가 하나둘 고개를 돌렸다. 그는 창가에 앉아 지나가는 들판을 오래 바라보았다.\n\n대구역 광장에는 사람들이 모여 있었다. 환영 현수막도 있었고, 그를 끝내 찍지 않았던 사람들의 팻말도 있었다. 대통령은 그 둘 사이를 천천히 걸었다. 누구도 그를 막아서지 않았다.\n\n그날 오후 대구시장과 광주시장이 한 단상에 섰다. 두 도시의 시장이 한자리에서 손을 잡은 것은 오랜만의 일이었다. 셔터 소리가 이어지는 동안 대통령은 단상 아래 맨 앞줄에 앉아 있었다. 다리 하나를 놓는 데 이렇게 오래 걸렸다.\n\n\"떨어질 때마다 다시 오셨다면서요.\" 돌아오는 열차에서 한 기자가 물었다. 대통령 대신 비서관이 웃으며 대답했다. \"그래서 오늘은 이긴 겁니다.\" 창밖으로 대구의 불빛이 멀어졌다."
 tfrkphn.7087.a:0 "속도를 늦춘다."
 tfrkphn.7087.b:0 "끝까지 간다."
 tfrkphn.7087.t:0 "개혁의 역풍"
 tfrkphn.7087.d:0 "개혁에는 계산서가 따라온다. 그 계산서는 대개 가장 늦게, 가장 크게 도착한다.\n\n숨은 돈이 드러나자 돈줄이 막힌 기업들이 투자를 멈췄다. 사정의 바람이 공직 사회를 휩쓸자 관료들은 서류에 서명하기를 망설였다. 별을 뗀 장성들은 퇴역 군인 단체의 이름으로 다시 거리에 나섰다. 시장에는 다음은 누구냐는 말이 돌았다.\n\n부총리 김동연이 대통령실을 찾았다. 그는 성장률 전망표를 책상 위에 펼쳐 놓았다. 숫자는 석 달째 내려가 있었다. 그는 속도를 조금 늦추자고 했다. 목소리는 낮았지만 물러서지 않았다.\n\n같은 날 오후, 김무성은 국회에서 기자회견을 열었다. 그는 개혁의 속도가 나라가 견딜 수 있는 것보다 빠르다고 했다. 연정에 남은 의원들 사이에서도 고개를 끄덕이는 사람이 늘었다. 신문 사설은 하루 사이에 논조를 바꾸었다.\n\n그날 밤 대통령은 집무실에 혼자 오래 앉아 있었다. 칼을 거둘 것인가, 끝까지 벨 것인가. 이 정부의 이름이 그 밤의 결정에 달려 있었다. 창밖으로 국회의사당의 불빛이 보였다. 그는 새벽까지 그 불빛을 보고 있었다."
 tfrkphn.7099.a:0 "덮지 않고 따진다."
 tfrkphn.7099.t:0 "법정의 하루"
 tfrkphn.7099.d:0 "별이 떨어진 아침으로부터 일 년이 지났다. 그날 봉투를 받은 장성들 가운데 몇이 이제 법정의 피고인석에 앉았다.\n\n공판은 아침 열 시에 시작됐다. 긴급명령과 포격의 명령 계통이 한 줄씩 낭독됐다. 누가 누구에게 무엇을 지시했는지, 그 지시가 어디서 멈추지 않았는지. 방청석은 새벽부터 줄을 선 사람들로 가득 찼다. 그 가운데에는 여의도의 사흘 동안 바리케이드를 지켰던 시민들도 있었다.\n\n\"명령에 따랐을 뿐입니다.\" 한 피고인이 말했다. 재판장은 고개를 들지 않았다. \"그 명령이 헌법에 맞는지 묻지 않았습니까.\" 법정 안이 잠시 조용해졌다.\n\n같은 시각, 대통령은 집무실에서 공판 중계를 켜 두지 않았다. 비서관이 보고서를 올리자 그는 결론만 물었다. 그는 판결은 법원의 몫이라고만 했다. 부총리 김동연은 그날 국무회의에서 재판 이야기를 꺼내지 않았다.\n\n그날 저녁 신문들은 피고인석의 사진을 일 면에 실었다. 덮지 않고 따진다는 것이 어떤 것인지, 사람들은 그날 처음으로 눈으로 보았다. 재판은 그 뒤로도 일 년을 더 이어졌다."
 tfrkphn.7100.a:0 "잔을 든다."
 tfrkphn.7100.b:0 "부총리의 보고를 먼저 듣는다."
 tfrkphn.7100.t:0 "축배"
 tfrkphn.7100.d:0 "패전국이 잘사는 나라들의 클럽에 들어가기까지 걸린 시간을 신문들은 앞다투어 셌다. 그날 밤 여의도의 호텔 연회장에서는 샴페인이 터졌다.\n\n대통령은 단상에 올라 짧게 말했다. 밤 여덟 시의 담화에서 시작된 일이 여기까지 왔다고 했다. 박수가 길게 이어졌다. 기업인들은 잔을 부딪쳤고, 장관들은 서로의 어깨를 두드렸다. 야당의 김무성도 그날만큼은 축하 화환을 보냈다.\n\n연회장 구석에서 부총리 김동연은 잔을 들지 않았다. 그는 수첩에 적어 온 숫자를 다시 보고 있었다. 나라 밖에서 빌려 온 단기 외채가 석 달째 늘고 있었다.\n\n\"오늘 같은 날 그 얘기는 좀...\" 옆에 선 차관이 웃으며 말렸다. 김동연은 수첩을 덮었다. 그는 다음 날 아침 대통령에게 따로 보고하겠다고만 했다. 차관은 그 말을 오래 잊지 못했다.\n\n연회는 자정을 넘겨 끝났다. 거리에는 축하 현수막이 걸렸다. 그 축배가 조금 일렀다는 것을, 그날 밤 연회장의 누구도 알지 못했다. 단 한 사람, 잔을 들지 않은 사람만이 그것을 셈하고 있었다."
 tfrkphn.7101.a:0 "칼을 내려놓는다."
 tfrkphn.7101.t:0 "칼을 내려놓는 날"
 tfrkphn.7101.d:0 "개혁의 칼은 임기 내내 한 번도 칼집에 들어가지 않았다. 그 칼을 내려놓는 날이 왔다.\n\n임기 마지막 국무회의는 짧았다. 대통령은 장관들에게 고맙다는 말만 하고 회의를 끝냈다. 부총리 김동연은 마지막으로 경제 지표를 보고했다. 빚은 줄었고, 군은 막사로 돌아갔고, 지역의 벽은 낮아졌다.\n\n대통령은 마지막 날 아침 혼자 대통령실 마당을 걸었다. 경호원들은 멀찍이 따라갔다. 그는 국회 쪽을 오래 바라보았다. 전차가 남긴 바퀴 자국 한 줄은 아직 그 자리에 있었다. 그는 취임식 날에도 그 자국 앞에 서 있었다.\n\n\"다음 선거에는 부총리님이 나서신다는 말이 돕니다.\" 비서실장이 조심스럽게 말했다. 대통령은 대답하지 않았다. 신민당의 다음 이름은 이미 여의도에서 오르내리고 있었다. 야당의 김무성은 그 이름을 두고 아직 아무 말도 하지 않았다.\n\n사람들은 그의 임기를 두고 오래 다퉜다. 너무 빨랐다는 사람도, 그래서 할 수 있었다는 사람도 있었다. 다만 그 칼이 다시는 군복 쪽으로 향할 일이 없게 되었다는 데에는 누구도 이의를 달지 않았다."
 tfrkphn.7114.a:0 "방 하나는 남긴다."
 tfrkphn.7114.t:0 "남은 방 하나"
 tfrkphn.7114.d:0 "남산 아래 그 건물은 이름이 몇 번 바뀌었다. 그러나 사람들은 바뀐 이름으로 그 건물을 부르지 않았다.\n\n청산 위원회가 쓰던 회색 청사는 여의도의 사흘 동안 불이 꺼지지 않았던 곳이었다. 지하에는 창문 없는 방이 여럿 있었다. 철거를 앞두고 대통령은 그 건물을 시민들에게 하루 동안 열었다. 아침부터 언덕길에 줄이 늘어섰다.\n\n\"여기, 이 방이었어요.\" 한 중년 남자가 지하 복도 끝에서 걸음을 멈췄다. 그는 문틀을 손으로 쓸어 보았다. 함께 온 딸은 아무것도 묻지 않았다. 방 안에는 철제 책상 하나만 남아 있었다.\n\n남겨 두자는 쪽은 기억하려면 건물이 있어야 한다고 했고, 허물자는 쪽은 다시는 그런 방이 없어야 한다고 했다. 대통령은 두 쪽의 이야기를 다 듣고 허무는 쪽을 골랐다. 다만 지하의 그 방 하나만은 그대로 떼어 옮겨 두라고 했다.\n\n이튿날 아침 굴착기가 들어왔다. 언덕 아래에서 사람들이 오래 그 모습을 지켜보았다. 사람들은 훗날 그 자리에 들어선 작은 공원을 지날 때마다 걸음을 조금 늦추었다."
 tfrkphn.7088.a:0 "함께 갚는다."
 tfrkphn.7088.t:0 "은행 앞의 줄"
 tfrkphn.7088.d:0 "나라가 빚을 졌을 때, 그 빚을 갚겠다고 줄을 선 것은 은행이 아니라 사람들이었다.\n\n운동이 시작된 첫 주 월요일 아침, 시청 앞 은행 지점 앞에 줄이 섰다. 사람들은 손수건에 싼 금반지와 아이의 돌반지, 오래된 저금통을 들고 있었다. 문을 열기 한 시간 전부터 줄은 길모퉁이를 돌았다.\n\n\"이거, 시어머니가 물려주신 건데요.\" 한 여자가 창구 직원에게 작은 금비녀를 내밀었다. 직원은 무게를 달다 말고 잠시 손을 멈췄다. 뒤에 선 사람들은 아무 말 없이 기다렸다.\n\n같은 시각, 대통령은 장부를 펼쳐 놓고 있었다. 모인 금이 얼마인지, 그것으로 갚을 수 있는 빚이 얼마인지가 매일 아침 그의 책상에 올라왔다. 그는 숫자 옆에 날짜를 적어 두었다.\n\n국무총리 김부겸은 그 줄을 보러 직접 나갔다. 야당의 김무성은 운동의 취지에는 반대하지 않는다고 했다.\n\n그 겨울 모인 금은 나라 빚의 작은 부분에 지나지 않았다. 그러나 사람들은 그 줄을 오래 기억했다. 빚은 숫자로 갚았지만, 다시 일어설 수 있다는 믿음은 그 줄에서 나왔다."
 tfrkphn.7089.a:0 "같은 숫자를 본다."
 tfrkphn.7089.t:0 "한 테이블"
 tfrkphn.7089.d:0 "노동자와 기업과 정부가 한 테이블에 앉는다는 것은, 이 나라에서 한 번도 쉬운 일이 아니었다.\n\n첫 회의는 저녁 일곱 시에 시작했다. 노동계 대표는 해고부터 막아야 한다고 했고, 경영계 대표는 임금부터 묶어야 한다고 했다. 정부 쪽 자리에는 대통령이 직접 보낸 계산서가 놓여 있었다.\n\n자정이 지나자 회의실에 도시락이 들어왔다. 아무도 먼저 젓가락을 들지 않았다. \"오늘 안에 안 끝나면, 다음 달 월급날이 없는 회사가 백 곳이 넘습니다.\" 정부 쪽 차관이 낮게 말했다.\n\n새벽 세 시, 노동계 대표가 잠시 밖으로 나갔다. 복도 끝 자판기 앞에서 경영계 대표와 마주쳤다. 두 사람은 커피를 한 잔씩 뽑아 들고 한동안 아무 말도 하지 않았다.\n\n새벽 다섯 시 반, 세 주체가 합의문에 서명했다. 일자리를 지키는 대신 임금을 함께 참는다. 대통령은 그 시각 이미 깨어 보고를 기다리고 있었다.\n\n그날 아침 신문들은 합의문 전문을 실었다. 그 합의가 지켜질지는 아무도 장담하지 못했다. 다만 그 밤, 처음으로 셋이 같은 숫자를 보았다."
 tfrkphn.7090.a:0 "기록되지 않은 밤."
 tfrkphn.7090.t:0 "세 사람의 저녁"
 tfrkphn.7090.d:0 "세 사람이 한 상에 앉은 것은 선거 뒤 처음이었다. 장소는 마포의 오래된 갈빗집 이층이었다. 기자들은 아무도 몰랐다. 대통령실 일정표에는 그 저녁이 비어 있었다.\n\n대통령은 늦게 왔다. 국무총리 김부겸이 먼저 와서 고기를 굽고 있었고, 김무성은 그 맞은편에서 소주잔을 만지작거렸다. 대통령은 앉자마자 수첩부터 꺼냈다. 두 사람이 웃었다.\n\n이야기는 실업 급여에서 시작했다. 대통령은 숫자를 하나씩 짚었고, 김무성은 그 돈이 어디서 나오느냐고 물었다. 김부겸은 두 사람 사이에서 잔을 채웠다. 자정이 지나서야 수첩이 덮였다.\n\n이층 계단 아래의 수행 비서들은 주인이 내준 김치찌개를 나눠 먹었다. \"총리님이 오늘은 말이 없으시네.\" \"원래 저런 자리에서는 듣는 쪽이시잖아.\" 위층에서는 가끔 웃음소리가 내려왔다.\n\n새벽 한 시, 세 사람은 차례로 다른 계단으로 내려갔다. 그날 밤의 이야기는 어디에도 기록되지 않았다. 다만 그 주 국회는 사회 안전망 예산을 큰 다툼 없이 넘겼다. 이튿날 세 사람은 아무 일 없던 듯 움직였다."
 tfrkphn.7091.a:0 "그 교실을 잊지 않는다."
 tfrkphn.7091.t:0 "야간대학의 교실"
 tfrkphn.7091.d:0 "대통령은 상업고등학교를 마치고 열일곱에 은행 창구에 앉았다. 낮에는 돈을 세고, 밤에는 야간대학의 교실에서 책을 폈다. 고시에 붙은 것은 그 교실에서였다.\n\n기초생활 보장법이 국회를 통과한 다음 날, 대통령은 예고 없이 그 대학을 찾았다. 저녁 일곱 시, 야간 강의가 막 시작될 무렵이었다. 경호원들은 강의실 뒷문 밖에 섰다. 학생들은 처음엔 아무도 알아보지 못했다.\n\n맨 뒷줄에 앉은 학생들은 대부분 작업복 차림이었다. 퇴근길에 곧장 온 사람들이었다. 대통령은 맨 뒷자리 빈 의자에 앉아 강의를 끝까지 들었다. 교수는 대통령을 보고도 강의를 멈추지 않았다.\n\n\"저분, 여기 다니셨대요.\" 쉬는 시간에 한 학생이 옆자리에 속삭였다. \"그래서 뭐가 달라지는데.\" 다른 학생이 대답했다. 대통령은 그 말을 들었지만 아무 말도 하지 않았다.\n\n강의가 끝나고 그는 학생들에게 짧게 인사만 했다. 돌아가는 차 안에서 그는 창밖을 오래 보았다. 다음 날 아침, 야간 과정 장학금 예산이 두 배로 늘었다. 그 교실의 의자는 예전 그대로였다."
 tfrkphn.7092.a:0 "계산서를 접는다."
 tfrkphn.7092.t:0 "빚을 다 갚은 날"
 tfrkphn.7092.d:0 "정부가 패전 이후 진 나라 빚을 모두 갚았다고 발표했습니다. 경제부처는 마지막 상환을 오늘 오전 마쳤다고 밝혔습니다. 패전 이후 빚을 다 갚기까지 걸린 시간은 예상보다 크게 짧았습니다.\n\n대통령은 오전 열 시 춘추관에서 직접 발표했습니다. 대통령은 이 빚을 갚은 것은 정부가 아니라 국민이라고 말했습니다. 발표는 오 분 남짓이었고, 대통령은 마지막 상환 확인서를 들어 보였습니다.\n\n국무총리 김부겸은 국회에서 감사 인사를 했습니다. 야당 김무성 대표도 오늘만큼은 축하한다는 논평을 냈습니다. 국회는 오후 본회의를 잠시 멈추고 박수를 쳤습니다.\n\n시청 앞 광장에는 금 모으기 운동 때 줄을 섰던 시민들이 다시 모였습니다. 일부 시민들은 그때 받은 확인증을 들고 나왔습니다. 증시는 개장과 함께 크게 올랐고, 원화 가치도 패전 이후 가장 높은 수준을 기록했습니다.\n\n경제 전문가들은 빚을 갚았다고 위기가 끝난 것은 아니라고 지적했습니다. 다만 오늘 하루만큼은, 나라 전체가 계산서를 접었습니다. 증권가에서는 이날을 두고 오래 이야기했습니다."
 tfrkphn.7102.a:0 "선 위에 길을 낸다."
 tfrkphn.7102.t:0 "선이 깔리는 밤"
 tfrkphn.7102.d:0 "빚을 갚는 나라에 새 길을 낸 것은 도로가 아니라 회선이었다.\n\n공사는 주로 밤에 했다. 낮에는 차가 다니는 길을 밤마다 파고 광케이블을 묻었다. 공장이 무너진 도시의 골목마다 주황색 조끼를 입은 인부들이 땅을 팠다. 주민들은 밤새 울리는 굴착기 소리에 처음엔 항의했다. 대통령은 공사 현장을 두 번 직접 찾았다.\n\n석 달 뒤, 동네마다 새 간판이 걸렸다. 컴퓨터 수십 대를 들여놓은 게임방이었다. 일자리를 잃은 젊은이들이 그곳에서 밤을 새웠다. 어떤 이는 게임을 했고, 어떤 이는 회사를 차렸다. 새벽 네 시에도 간판의 불은 꺼지지 않았다.\n\n\"사장님, 이번 달 회선 요금이 반으로 줄었어요.\" 한 게임방 아르바이트생이 말했다. \"정부가 깔아 줬으니까.\" 주인이 대답했다. 계산대 옆 벽에는 대통령의 정책 홍보 포스터가 반쯤 찢겨 붙어 있었다.\n\n국무총리 김부겸은 국회에서 회선 예산을 지켜 냈다. 야당의 김무성은 그 돈으로 공장을 짓는 게 낫다고 했다. 몇 해 뒤, 그 회선 위에서 자란 회사 몇 곳이 수출 순위에 이름을 올렸다."
 tfrkphn.7103.a:0 "강을 건넌다."
 tfrkphn.7103.t:0 "얼어붙은 강"
 tfrkphn.7103.d:0 "패전 뒤로 그 나라와 이 나라 사이에는 얼어붙은 강이 흘렀다. 그 강을 먼저 건너겠다고 한 사람은 아무도 없었다.\n\n대통령을 태운 비행기가 이른 아침 활주로를 떠났다. 기내에서 그는 연설문을 세 번 고쳤다. 볕이 드는 문을 연 지 두 해, 문 너머의 사람을 직접 마주하는 날이었다.\n\n공항에는 상대국 정상이 직접 나와 있었다. 예정에 없던 일이었다. 두 사람은 활주로 위에서 오래 손을 맞잡았다. 사진 기자들의 셔터 소리가 바람 소리를 덮었다. 생중계를 보던 서울의 사무실들에서 일손이 멈췄다. 시장의 상인들도 라디오를 켰다.\n\n\"정말 저렇게 손을 잡네.\" 한 방송국 보도국에서 누군가 중얼거렸다. 누구도 대답하지 않았다. 화면 아래로 속보 자막이 끊임없이 흘렀다. 그날 저녁 뉴스는 다른 기사를 거의 내보내지 않았다.\n\n국무총리 김부겸은 그날 국회에서 야당의 질문을 받았다. 김무성은 서두르지 말라고 했지만, 회담이 성과를 내기를 바란다고 덧붙였다. 강은 하루아침에 녹지 않았다. 다만 그날, 처음으로 누군가 그 위를 걸었다."
 tfrkphn.7104.a:0 "계산서를 넘긴다."
 tfrkphn.7104.t:0 "다시 선 나라"
 tfrkphn.7104.d:0 "빚으로 시작한 임기였다. 그 임기의 마지막 계산서가 대통령의 책상에 올라왔다.\n\n임기 마지막 국무회의에서 대통령은 수첩을 펼쳤다. 갚은 빚, 다시 연 항구, 되살린 일자리의 수가 적혀 있었다. 그는 숫자를 하나씩 읽었다. 장관들은 끝까지 조용히 들었다. 낭독은 이십 분이 걸렸다. 누구도 시계를 보지 않았다.\n\n국무총리 김부겸이 마지막으로 일어섰다. 그는 대통령에게 고맙다고 했다. 단일화 협상으로 신민당이 둘로 갈라질 뻔했던 그 다섯 주를 기억하는 사람들은, 두 사람이 한 회의실에 앉아 있는 모습을 오래 바라보았다.\n\n\"마지막 날까지 숫자만 보시네요.\" 비서관이 웃으며 말했다. 대통령은 수첩을 덮고 오랜만에 웃었다. 그는 다음 대통령에게 넘길 인수 문서에도 숫자부터 적어 두었다. 야당의 김무성은 그날 짧은 덕담을 보냈다.\n\n그가 남긴 나라는 부자가 되지는 않았다. 그러나 빚은 없었고, 넘어져도 다시 설 줄 아는 나라가 되어 있었다. 그것이 그가 남긴 가장 큰 숫자였다. 사람들은 훗날 그 시절을 계산서의 시대라고 불렀다."
 tfrkphn.7108.a:0 "명단대로 정리한다."
 tfrkphn.7108.b:0 "명단을 줄이고 시간을 준다."
 tfrkphn.7108.t:0 "문 닫는 공장"
 tfrkphn.7108.d:0 "계산서를 펼치면 누군가의 이름이 지워진다. 그 이름은 대개 숫자가 아니라 공장이었다.\n\n경제부처가 올린 명단에는 쉰다섯 개 기업이 적혀 있었다. 한 테이블에서 일자리를 지키겠다고 서명한 지 석 달 만이었다. 명단이 나온 날 아침, 남쪽 공단의 한 조선소 정문 앞에 작업복 차림의 사람들이 모였다. 아무도 출근 카드를 찍지 않았다.\n\n\"스물두 해를 다녔습니다. 이번 달 월급이 나오느냐고 묻는 겁니다.\" 노조 위원장이 확성기를 잡았다. 정문 위 크레인은 멈춰 있었고, 방송 차량이 공단 길로 들어섰다.\n\n대통령은 그날 오후 명단을 다시 펼쳤다. 그는 회사마다 남은 빚과 일자리 수를 나란히 적게 했다. 국무총리 김부겸이 찾아와 몇 곳은 시간을 더 주자고 했다. 대통령은 오래 듣고, 짧게 되물었다. 시간을 주면 그 빚은 누가 갚느냐고.\n\n그날 밤 대통령실의 불은 늦게까지 켜져 있었다. 회사 하나를 살리면 은행 하나가 흔들렸고, 은행 하나를 지키면 공장 몇 곳의 불이 꺼졌다. 어느 쪽을 골라도, 누군가는 내일 아침 일터를 잃을 것이었다."
 tfrkphn.7093.a:0 "두 김씨가 손을 잡는다."
 tfrkphn.7093.b:0 "두 김씨가 손을 뿌리친다."
 tfrkphn.7093.t:0 "내민 손"
 tfrkphn.7093.d:0 "판을 가르던 사람은 평생 남의 손을 잡아 주는 쪽이었다. 이제 그가 손을 내밀 차례였다.\n\n취임 한 달째, 대통령은 신민당의 두 김씨에게 각각 편지를 보냈다. 내각의 자리를 비워 두겠다는 내용이었다. 편지는 비서관이 직접 들고 갔다. 답장은 오지 않았다. 대통령실은 편지의 내용을 묻는 기자들에게 아무것도 확인해 주지 않았다.\n\n김부겸은 당사 회의실에서 편지를 오래 읽었다. 김동연은 편지를 받고 그날 저녁 약속을 모두 취소했다. 두 사람은 그 주 내내 서로 연락하지 않았다. 신민당의 의원들은 편지의 내용을 신문으로 먼저 알았다.\n\n\"받으면 들러리라는 소리를 듣고, 안 받으면 발목 잡는다는 소리를 듣습니다.\" 신민당의 한 중진이 기자들에게 털어놓았다. \"어느 쪽이든 손해죠. 그게 저 양반 정치입니다.\"\n\n대통령은 기다렸다. 그는 젊은 날 상도동의 사랑방에서 사람이 오기를 기다리는 법을 배운 사람이었다. 열흘째 되는 날 밤, 대통령실의 전화가 울렸다. 수화기를 든 비서관은 잠시 말없이 듣다가, 대통령의 방문을 두드렸다."
 tfrkphn.7094.a:0 "판은 다시 짜인다."
 tfrkphn.7094.t:0 "세 사람의 저녁"
 tfrkphn.7094.d:0 "세 사람이 한 상에 앉은 것은 선거 뒤 처음이었다. 갈라선 뒤로 두 김씨가 한자리에 앉은 것도 처음이었다. 장소는 부산 출신 의원이 소개한 남산 아래 복집이었다.\n\n대통령이 먼저 와서 기다렸다. 김부겸과 김동연은 오 분 간격으로 들어왔다. 두 사람은 서로 눈인사만 했다. 대통령은 웃으며 두 사람 잔에 먼저 술을 따랐다. 누구도 거절하지 않았다. 창밖으로 남산의 불빛이 보였다.\n\n이야기는 선거구에서 시작했다. 대통령은 한 지역구에서 여러 명을 뽑자고 했다. 김동연은 계산부터 해 보자고 했고, 김부겸은 지역의 벽이 낮아진다면 생각해 보겠다고 했다. 대통령은 총리 자리를 꺼내지 않았다.\n\n문밖의 수행 비서들은 서로를 흘끔거렸다. \"저 두 분이 한 상에 앉는 걸 볼 줄은 몰랐네.\" \"판을 깔 줄 아는 사람이니까.\" 방 안에서는 한동안 아무 소리도 나지 않았다.\n\n새벽 한 시, 세 사람은 차례로 다른 문으로 나갔다. 그날 밤 무엇이 합의됐는지는 기록되지 않았다. 다만 한 달 뒤, 신민당 출신 의원 한 명이 국무총리 후보로 지명됐다."
 tfrkphn.7095.a:0 "도장을 찍는다."
 tfrkphn.7095.t:0 "도장"
 tfrkphn.7095.d:0 "그는 도장 하나로 판을 뒤집어 본 사람이었다. 당 대표 시절, 그는 공천장에 도장을 찍지 않고 부산으로 내려간 적이 있었다. 여의도는 그 며칠을 오래 기억했다. 그 도장에 여러 사람의 정치가 걸려 있었다.\n\n개헌안을 국회에 내는 날 아침, 대통령의 책상 위에 서류 한 묶음과 국새가 놓였다. 대통령이 서명하고 국새를 찍으면, 개헌안은 그날 오후 국회로 넘어간다. 기자들은 아침부터 대통령실 앞에서 기다리고 있었다.\n\n대통령은 서류를 한 장씩 넘겼다. 대통령의 권한을 국회와 나눈다는 조항 앞에서 그의 손이 멈췄다. 자기 손으로 자기 자리의 힘을 덜어 내는 문서였다. 평생 권력의 무게를 재어 온 사람에게 그 한 줄은 가볍지 않았다.\n\n\"찍으시면 됩니다, 각하.\" 비서실장이 낮게 말했다가 곧 고쳐 말했다. \"대통령님.\" 대통령은 웃지 않았다. 창밖으로 남산의 잎들이 바람에 흔들렸다.\n\n열한 시 사 분, 대통령은 국새를 들었다. 그리고 오래 망설이지 않고 찍었다. 도장을 찍지 않아 판을 뒤집었던 사람이, 이번에는 도장을 찍어 판을 바꾸었다."
 tfrkphn.7096.a:0 "새 헌법을 받든다."
 tfrkphn.7096.t:0 "개헌안 통과"
 tfrkphn.7096.d:0 "의원내각제 개헌안이 국민투표에서 통과됐습니다. 중앙선거관리위원회는 오늘 새벽 개표를 마치고, 찬성이 과반을 넘었다고 발표했습니다. 투표율은 높았습니다. 찬성과 반대의 차이는 크지 않았습니다. 개표 막바지까지 결과를 몰랐습니다.\n\n새 헌법에 따라 다음 총선부터 나라의 행정은 국회가 뽑는 총리가 이끌게 됩니다. 대통령은 국가를 대표하는 자리로 남습니다. 대통령은 오전 담화에서 국민의 결정을 받들겠다고 밝혔습니다.\n\n신민당은 결과를 존중한다는 논평을 냈습니다. 김부겸 의원과 김동연 의원은 함께 기자회견을 열고, 다음 총선에 모든 것을 걸겠다고 밝혔습니다. 정치권에서는 벌써 첫 총리가 누가 될지를 두고 셈이 시작됐습니다.\n\n헌법학자들은 이번 개헌이 패전과 포격을 겪은 나라가 권력을 한 사람에게 맡기지 않기로 한 결정이라고 평가했습니다. 반면 정치가 국회 안의 거래로 흘러갈 것이라는 우려도 나왔습니다.\n\n대통령은 그날 저녁 일찍 관저로 돌아갔습니다. 관저의 불은 평소보다 일찍 꺼졌습니다. 대통령실은 다음 날 일정을 모두 비웠다고 밝혔습니다."
 tfrkphn.7098.a:0 "국민의 뜻을 받든다."
 tfrkphn.7098.t:0 "개헌안 부결"
 tfrkphn.7098.d:0 "의원내각제 개헌안이 국민투표에서 부결됐습니다. 중앙선거관리위원회는 오늘 새벽 개표를 마치고, 반대가 과반을 넘었다고 발표했습니다. 대통령이 임기를 걸고 추진한 개헌이 끝내 좌절됐습니다.\n\n대통령은 오전 담화에서 국민의 뜻을 겸허히 받아들인다고 밝혔습니다. 대통령은 남은 임기 동안 개헌을 다시 추진하지 않겠다고 말했습니다. 담화는 이 분이 채 되지 않았습니다. 대통령실 앞은 하루 종일 조용했습니다.\n\n신민당은 국민이 권력 나눠 먹기를 거부한 것이라는 논평을 냈습니다. 김부겸 의원과 김동연 의원은 각자 따로 입장을 냈습니다. 연정 안에서도 대통령의 책임을 묻는 목소리가 나오기 시작했습니다.\n\n정치권에서는 대통령이 사실상 정치적 힘을 잃었다는 분석이 나왔습니다. 여의도에서는 벌써 다음 대통령 선거를 두고 셈이 시작됐습니다. 연정의 원로들은 대통령실의 전화를 받지 않았습니다.\n\n대통령은 그날 저녁 아무 일정도 잡지 않았습니다. 관저의 불은 새벽까지 꺼지지 않았습니다. 판을 쥐었던 사람이 처음으로 판 밖에서 밤을 보냈습니다."
 tfrkphn.7097.a:0 "해는 질 때 가장 붉다."
 tfrkphn.7097.t:0 "서쪽 하늘"
 tfrkphn.7097.d:0 "해는 질 때 가장 붉다고들 했다. 그 말이 그만큼 어울리는 사람도 드물었다. 그는 오래 무대 뒤에 있었고, 마지막에야 무대의 한가운데에 섰다.\n\n임기의 마지막 가을, 대통령은 부산에 내려갔다. 영도 앞바다가 보이는 언덕에서 그는 오래 서 있었다. 그가 마지막으로 국회의원에 당선된 곳이었다. 멀리서 뱃고동이 울렸다.\n\n그는 평생 남을 세우는 쪽이었다. 젊은 날에는 상도동의 사랑방에서 손님을 맞았고, 당 대표가 되어서는 누구를 세울지 고르는 자리에 앉았다. 이 자리에 스스로 앉을 줄은 그 자신도 몰랐다.\n\n\"이제 서울로 올라가시죠.\" 비서관이 조심스럽게 말했다. 대통령은 고개를 끄덕였지만 움직이지 않았다. 해가 바다 위로 내려앉고 있었다. 나이 든 운전기사가 혼잣말처럼 옛 시 한 구절을 읊었다. \"붉은 해는 서산마루에 걸리었다.\" 김소월의 초혼이었다.\n\n그날 저녁 서쪽 하늘은 유난히 붉었다. 사람들은 훗날 그 시절을 판을 쥔 사람의 시대라고 불렀다. 그가 남긴 판 위에서, 다음 사람들의 셈이 이미 시작되고 있었다."
 tfrkphn.7105.a:0 "한 지붕 아래 모은다."
 tfrkphn.7105.t:0 "한 지붕"
 tfrkphn.7105.d:0 "흩어진 꽃잎도 봄바람 한 줄기에 다시 모인다고들 했다. 보수는 패전과 포격 뒤로 뿔뿔이 흩어졌다. 그 꽃잎을 다시 모으는 일이, 판을 가를 줄 아는 사람에게 맡겨졌다.\n\n대통령은 취임 넉 달 만에 보수 원로들을 관저로 불렀다. 영남의 원로, 충청의 원로, 젊은 소장파 의원들이 한 방에 앉았다. 몇몇은 서로 십 년 넘게 말을 섞지 않은 사이였다. 관저의 식탁에는 부산에서 올라온 생선회가 놓였다. 젓가락이 오가는 동안에도 말은 오가지 않았다.\n\n대통령은 먼저 말하지 않았다. 그는 사람들이 서로에게 불만을 털어놓는 것을 끝까지 들었다. 자정이 가까워지자 방 안의 목소리가 조금씩 낮아졌다. 대통령은 그제야 술병을 들었다.\n\n\"결국은 저 양반 판에 다 들어간 거네.\" 관저를 나서며 한 소장파 의원이 투덜거렸다. \"들어가 보니 따뜻하잖아.\" 옆에 선 원로가 웃었다.\n\n한 달 뒤 보수 대연합이 발표됐다. 거리의 극우는 끝내 그 지붕 아래 들어오지 못했다. 신민당의 두 김씨는 그날 따로 논평을 냈다. 그해 봄, 판은 그렇게 한 겹 더 단단해졌다."
 tfrkphn.7106.a:0 "계획표를 따른다."
 tfrkphn.7106.t:0 "계획표"
 tfrkphn.7106.d:0 "계획표는 숫자로 쓴 시와 같다고, 그는 젊은 날 곁에서 정치를 배운 사람들에게서 들었다.\n\n경제 부처의 대회의실 벽에 사람 키보다 큰 계획표가 걸렸다. 다섯 해 동안 지을 공단과 항만, 도로가 연도별로 칸을 채웠다. 대통령은 계획표 앞에 오래 서 있다가 한 칸을 손가락으로 짚었다.\n\n\"이 항만은 두 해 앞당기시죠.\" 대통령의 말에 실무자들의 얼굴이 굳었다. 예산도, 부지도 정해지지 않은 칸이었다. 장관이 무언가 말하려다 그만두었다. 그날 저녁 경제 부처의 불은 늦게까지 켜져 있었다.\n\n신민당은 계획표가 옛날 방식이라고 비판했다. 김동연은 숫자가 맞지 않는다고 했고, 김부겸은 지역이 한쪽으로 쏠렸다고 했다. 대통령은 두 사람의 지적을 받아 계획표의 두 칸을 고쳤다. 신민당은 그 수정을 두고 오래 말이 없었다.\n\n그 계획표는 끝내 다 채워지지 않았다. 그러나 그 몇 해 동안 공단의 불은 꺼지지 않았다. 사람들은 훗날 그 계획표를 두고, 옛날 방식이었지만 옛날 방식이라서 됐다고 말했다. 빛바랜 계획표는 지금도 그 회의실 벽에 걸려 있다."
 tfrkphn.7107.a:0 "셈은 끝났다."
 tfrkphn.7107.t:0 "둘로 나뉜 거리"
 tfrkphn.7107.d:0 "개헌안이 국회를 넘은 날부터 거리는 둘로 나뉘었다. 같은 광장에서 찬성과 반대의 깃발이 번갈아 올랐다.\n\n찬성 쪽은 다시는 한 사람에게 모든 힘을 맡기지 말자고 했다. 반대 쪽은 국회의원들끼리 나라를 나눠 먹으려 한다고 했다. 텔레비전 토론은 매일 밤 자정을 넘겼다. 가족들의 저녁 식탁에서도 같은 다툼이 벌어졌다.\n\n신민당은 반대 운동의 맨 앞에 섰다. 김부겸과 김동연은 갈라선 뒤 처음으로 공개 연단에 나란히 섰다. 판을 쥔 사람이 개헌을 내밀자, 갈라졌던 두 사람이 다시 손을 잡은 셈이었다.\n\n\"이번엔 진짜 모르겠습니다.\" 한 여론조사 기관의 연구원이 기자에게 말했다. \"찬반 차이가 매일 뒤집혀요.\" 마지막 주의 조사는 오차 범위 안이었다. 투표율이 결과를 가를 것이라는 말이 돌았다.\n\n대통령은 운동 기간 내내 연단에 서지 않았다. 원로와 학자들이 그 자리를 대신했다. 기자들은 대통령의 침묵을 두고 매일 다르게 해석했다. 투표 전날 밤 그는 관저에서 혼자 개표 시나리오를 읽었다. 그가 평생 해 온 셈 가운데 가장 큰 셈이었다."
 tfrkphn.7109.a:0 "내려놓았을 뿐이다."
 tfrkphn.7109.t:0 "멈춘 칼"
 tfrkphn.7109.d:0 "칼을 거두면 상처는 아문다. 다만 베다 만 자리에는 새살 대신 굳은살이 돋는다.\n\n속도를 늦춘 지 석 달, 시장은 다시 숨을 쉬었다. 멈췄던 투자가 돌아오고 성장률 전망표의 숫자도 조금씩 올라갔다. 부총리 김동연은 국무회의에서 처음으로 짧게 웃었다. 그러나 사정의 바람이 잦아든 자리에서, 숨죽였던 사람들이 하나둘 고개를 들었다.\n\n\"수사가 다 끝난 겁니까.\" 한 기자가 검찰청 앞에서 물었다. 대변인은 대답 대신 시계를 보았다. 그 주에만 세 명의 피의자가 무혐의로 풀려났다.\n\n대통령은 보고서를 끝까지 읽고 한동안 말이 없었다. 그는 칼을 거둔 것이 아니라 잠시 내려놓은 것이라고 참모들에게 말했다. 참모들은 고개를 끄덕였지만, 다시 들 날이 언제냐고 묻는 사람은 없었다. 김무성은 늦었지만 옳은 결정이라고 논평했다.\n\n개혁을 바라던 사람들은 실망했고, 개혁을 두려워하던 사람들은 안도했다. 그해 겨울, 대통령의 지지율은 처음으로 절반을 밑돌았다. 그것이 이 정부가 치른 첫 번째 값이었다. 그리고 마지막 값도 아니었다."
 tfrkphn.7110.a:0 "칼끝은 휘지 않는다."
 tfrkphn.7110.t:0 "베인 자리"
 tfrkphn.7110.d:0 "끝까지 벤 칼은 날이 서 있었다. 그러나 칼을 쥔 손에도 피가 맺혔다.\n\n대통령은 속도를 늦추지 않았다. 사정은 재벌의 회장실과 장관의 집무실까지 닿았다. 한 달 사이에 장관 둘이 물러났고, 연정의 의원 셋이 소환됐다. 신문들은 매일 아침 새 이름을 일 면에 실었다. 시민들은 박수를 쳤고, 시장은 얼어붙었다.\n\n\"이번 분기 신규 채용은 없습니다.\" 한 대기업 인사팀장이 회의에서 말했다. 공단의 하청 업체들은 대금 결제를 두 달씩 미뤘다. 대학가의 게시판에서는 채용 공고가 하나둘 사라졌다.\n\n부총리 김동연은 다시 대통령실을 찾지 않았다. 그는 성장률 전망표를 서랍에 넣고, 대신 실업 대책 예산안을 올렸다. 그는 그 숫자 하나하나가 누군가의 일터라는 것을 알았다. 대통령은 그 예산안에 바로 서명했다. 김무성은 국회에서 속도를 다시 생각해 달라고 했다.\n\n그해 겨울 숨은 돈의 절반이 이름을 얻었다. 그리고 일자리 열에 하나가 사라졌다. 사람들은 훗날 그 겨울을 두고 오래 다퉜다. 그래도 칼끝은 끝내 휘지 않았다."
 tfrkphn.7111.a:0 "부총리에게 맡긴다."
 tfrkphn.7111.t:0 "새벽의 전화"
 tfrkphn.7111.d:0 "축배를 든 지 두 달, 그 잔이 너무 일렀다는 것을 알리는 전화는 새벽에 왔다.\n\n새벽 네 시, 부총리 김동연이 대통령 관저에 전화를 걸었다. 나라 밖에서 빌린 단기 외채의 만기가 한꺼번에 돌아오고 있었다. 외국 은행들이 만기 연장을 거절했다. 곳간에 남은 외화로는 석 주를 버티기 어려웠다. 그날 아침 환율 화면은 장이 열리자마자 붉게 물들었다.\n\n\"축배 날 그 수첩, 그거였습니까.\" 비서실장이 낮게 물었다. 부총리는 대답하지 않았다. 그는 서류 가방에서 두 달 전의 그 수첩을 꺼내 책상 위에 펼쳤다. 책장 귀퉁이가 접혀 있었다.\n\n대통령은 긴급 경제 회의를 소집했다. 그는 회의 내내 거의 말하지 않았다. 회의가 끝날 무렵 그는 부총리에게 모든 권한을 맡기겠다고 했다. 야당의 김무성은 그날 오후 정쟁을 멈추고 돕겠다고 했다.\n\n그 겨울, 은행 앞에는 예금을 찾으려는 사람들의 줄이 길게 늘어섰다. 잔을 들지 않았던 사람은 이제 그 잔의 값을 치르는 일을 맡았다. 대통령은 그 겨울 내내 축배 이야기를 하지 않았다."
 tfrkphn.7112.a:0 "조용한 겨울로 남긴다."
 tfrkphn.7112.t:0 "조용한 겨울"
 tfrkphn.7112.d:0 "위기는 오지 않았다. 그래서 그 겨울은 신문에 거의 실리지 않았다.\n\n축배 다음 날 아침, 대통령은 부총리의 보고를 끝까지 들었다. 단기 외채가 석 달째 늘고 있다는 숫자 앞에서 그는 오래 말이 없었다. 그날 오후부터 부총리는 은행장들을 하나씩 불렀다. 만기가 짧은 빚을 긴 빚으로 바꾸고, 곳간에 외화를 조금씩 더 쌓았다.\n\n\"축하 분위기에 찬물을 끼얹는다고 말이 많습니다.\" 차관이 신문을 내밀었다. 사설은 정부가 지나치게 몸을 사린다고 했다. 부총리는 신문을 접어 서랍에 넣었다.\n\n두 달 뒤, 이웃 나라들의 환율이 차례로 무너졌다. 외국 은행들은 바다 건너에서 앞다투어 돈을 거둬들였다. 이 나라의 환율 화면도 며칠 흔들렸지만 곳간은 버텼다. 수출 기업들은 그 주에 계약을 한 건도 잃지 않았다. 김무성은 국회에서 정부가 미리 대비한 것을 인정한다고 했다.\n\n그 겨울을 기억하는 사람은 많지 않다. 위기를 막은 일은 위기만큼 이야깃거리가 되지 못하는 법이었다. 다만 축배 날 잔을 들지 않았던 사람만은, 그 겨울을 오래 기억했다."
 tfrkphn.7113.a:0 "숫자를 기다린다."
 tfrkphn.7113.t:0 "개표의 밤"
 tfrkphn.7113.d:0 "평생 남의 개표를 셈해 온 사람이, 이번에는 자기 꿈의 개표를 기다렸다.\n\n투표가 끝난 저녁 여섯 시, 방송사들은 일제히 개표 방송을 시작했다. 찬성과 반대의 막대그래프가 화면 양쪽에서 엎치락뒤치락했다. 영남과 충청에서는 찬성이, 수도권과 호남에서는 반대가 앞섰다. 신민당 당사에서도, 헌정회복연대 당사에서도 자리를 뜨는 사람은 없었다.\n\n\"아직 모릅니다. 서울이 다 열려야 압니다.\" 개표 상황실의 한 연구원이 전화기에 대고 말했다. 그의 책상에는 식은 커피 잔이 세 개 놓여 있었다.\n\n대통령은 관저에서 텔레비전을 끄고 있었다. 비서관이 삼십 분마다 숫자를 적은 쪽지를 들고 들어왔다. 그는 쪽지를 한 번 보고 접어서 탁자에 쌓았다. 자정 무렵 쪽지는 열 장이 넘었다. 그는 그 쪽지들을 한 번도 다시 펼치지 않았다.\n\n새벽 한 시, 마지막 개표함이 열렸다. 방송사의 앵커가 잠시 숨을 골랐다. 이 나라가 어떤 나라가 될지가 그 숫자 하나에 달려 있었다. 관저의 비서관이 마지막 쪽지를 들고 천천히 복도를 걸어왔다."
 tfrkphn.7115.a:0 "막이 내린다."
 tfrkphn.7115.t:0 "문을 나서는 날"
 tfrkphn.7115.d:0 "세 사람은 같은 시대에 태어나 같은 무대에서 늙었다. 그 무대의 막이 내리는 날이었다.\n\n임기 마지막 날 아침, 대통령은 집무실의 짐을 직접 쌌다. 대구에서 낙선하던 날의 사진, 여의도의 사흘 동안 쓴 수첩, 별이 떨어진 아침의 명령서 사본이 상자에 들어갔다. 그는 그 사진을 오래 들여다보다가 맨 위에 올렸다.\n\n같은 시각, 부총리 김동연은 마지막 장부를 정리하고 있었고, 야당의 김무성은 부산행 기차에 있었다. 오후에 원로 모임의 편지 한 통이 세 사람 앞으로 똑같이 도착했다.\n\n\"판을 가르던 손으로, 이제는 다음 사람들의 등을 밀어 주시오.\" 편지를 쓴 것은 아흔을 넘긴 원로 의원이었다. 세 사람이 서로 다투던 세월보다 함께 버틴 세월이 더 길었다고 적혀 있었다.\n\n해 질 무렵 대통령은 청사 문을 나섰다. 모인 사람들 가운데 누군가 김소월의 진달래꽃을 나직이 읊었다. \"말없이 고이 보내 드리우리다.\" 대통령은 손을 한 번 들어 보였다. 사람들은 훗날 그 시절을 세 사람의 시대라고 불렀다. 그 뒤로 다시는 그런 시대가 오지 않았다.[TFRKPHN_end_7115_mech][TFRKPHN_end_7115_prom][TFRKPHN_end_7115_hong]"
 tfrkphn.7116.a:0 "막이 내린다."
 tfrkphn.7116.t:0 "마지막 장부"
 tfrkphn.7116.d:0 "세 사람은 같은 시대에 태어나 같은 무대에서 늙었다. 그 무대의 막이 내리는 날이었다.\n\n임기 마지막 날 새벽, 대통령은 여느 날처럼 다섯 시에 일어났다. 그는 마지막으로 환율과 외환 보유고 숫자를 확인했다. 열일곱에 은행 창구에 처음 앉던 때부터 그는 하루를 숫자로 열었다. 숫자는 조용했다.\n\n국무총리 김부겸은 대구로 내려가는 기차표를 이미 끊어 두었다. 야당의 김무성은 부산의 바닷가에 있었다. 오후에 원로 모임의 편지 한 통이 세 사람 앞으로 똑같이 도착했다.\n\n\"셈은 그대들이 잘했으니, 이제 셈 밖의 것을 다음 사람들에게 가르치시오.\" 편지를 쓴 것은 아흔을 넘긴 원로 의원이었다. 세 사람이 서로 다투던 세월보다 함께 버틴 세월이 더 길었다고 적혀 있었다.\n\n해 질 무렵 대통령은 수첩 한 권만 들고 청사를 나섰다. 길가 가게의 라디오에서 한용운의 님의 침묵이 흘러나왔다. \"아아, 님은 갔지마는 나는 님을 보내지 아니하였습니다.\" 사람들은 훗날 그 시절을 세 사람의 시대라고 불렀다. 그 뒤로 다시는 그런 시대가 오지 않았다.[TFRKPHN_end_7116_mech][TFRKPHN_end_7116_prom][TFRKPHN_end_7116_hong]"
 tfrkphn.7118.a:0 "막이 내린다."
 tfrkphn.7118.t:0 "노을 뒤"
 tfrkphn.7118.d:0 "세 사람은 같은 시대에 태어나 같은 무대에서 늙었다. 그 무대의 막이 내리는 날이었다.\n\n임기 마지막 날, 대통령은 관저 마당에 서 있었다. 그는 감나무 끝의 마지막 감 하나를 오래 올려다보았다.\n\n신민당의 두 김씨가 관저를 찾았다. 갈라선 뒤 셋이 한 마당에 선 것은 처음이자 마지막이었다. 무슨 이야기가 오갔는지는 기록되지 않았다.\n\n저녁에 원로 모임의 편지가 도착했다. \"판을 짜던 사람들이 판을 떠나니, 이제 판은 국민이 짤 것이오.\" 세 사람이 다투던 세월보다 함께 버틴 세월이 더 길었다고 적혀 있었다. 편지 끝에는 길재의 시조 한 구절이 적혀 있었다. \"산천은 의구하되 인걸은 간 데 없다.\"\n\n해가 진 뒤 대통령은 관저를 나섰다. 배웅하던 직원이 나직이 읊었다. \"십 년을 경영하여 초려삼간 지어내니, 나 한 칸 달 한 칸에 청풍 한 칸 맡겨 두고, 강산은 들일 데 없으니 둘러 두고 보리라.\" 대통령은 멈춰 서서 들었다. 사람들은 훗날 그 시절을 세 사람의 시대라고 불렀다. 그 뒤로 다시는 그런 시대가 오지 않았다.[TFRKPHN_end_7118_mech][TFRKPHN_end_7118_hong]"
 TFRKPHN_kbg_t_01:0 "대구에서 온 대통령"
 TFRKPHN_kbg_t_01_desc:0 "지역의 벽을 넘겠다던 사람이 그 벽 위에서 당선됐습니다. 새 대통령은 개혁은 빨리, 한 번에 해야 한다고 믿습니다."
 TFRKPHN_kbg_t_02:0 "군 사조직 해체"
 TFRKPHN_kbg_t_02_desc:0 "여의도의 사흘 동안 명령을 주고받은 군 안의 사조직을 하루아침에 해체합니다. 취임 열하루째 되는 날 아침, 명단에 오른 장성들은 출근하자마자 전역 통지서를 받습니다."
 TFRKPHN_kbg_t_03:0 "별을 떼는 날"
 TFRKPHN_kbg_t_03_desc:0 "사조직에 몸담았던 장군들의 별을 모두 뗍니다. 군복을 벗은 장군의 수가 하루에 이렇게 많았던 적은 없었습니다."
 TFRKPHN_kbg_t_04:0 "문민의 군대"
 TFRKPHN_kbg_t_04_desc:0 "군의 인사와 예산을 국회가 감시하는 법을 만듭니다. 다시는 전차가 여의도로 들어오지 못하게 합니다."
 TFRKPHN_kbg_t_13:0 "역사 바로 세우기"
 TFRKPHN_kbg_t_13_desc:0 "긴급명령과 포격의 명령 계통에 있던 사람들을 모두 법정에 세웁니다. 대통령을 지낸 사람도 예외가 아닙니다. 덮지 않고 따지는 것이 이 정부의 방식입니다."
 TFRKPHN_kbg_t_16:0 "낡은 청사를 허물다"
 TFRKPHN_kbg_t_16_desc:0 "청산 위원회가 쓰던 건물을 허뭅니다. 남겨 두자는 사람과 허물자는 사람이 오래 다퉜지만, 대통령은 허무는 쪽을 골랐습니다. 자리에는 작은 공원이 들어섭니다."
 TFRKPHN_kbg_t_05:0 "금융 실명 개혁"
 TFRKPHN_kbg_t_05_desc:0 "밤 여덟 시, 대통령이 예고 없이 특별 담화를 엽니다. 내일부터 모든 금융 거래는 실제 이름으로만 할 수 있습니다. 패전 동안 숨어 있던 돈이 하나둘 드러나기 시작합니다."
 TFRKPHN_kbg_t_06:0 "숨은 돈 수사"
 TFRKPHN_kbg_t_06_desc:0 "패전 책임자들과 재벌이 빼돌린 돈을 끝까지 추적합니다. 검찰과 국세청이 같은 명단을 들고 움직입니다."
 TFRKPHN_kbg_t_07:0 "공직자 재산 공개"
 TFRKPHN_kbg_t_07_desc:0 "대통령부터 장관, 국회의원까지 모든 고위 공직자의 재산을 공개합니다. 대통령이 가장 먼저 자기 재산 목록을 내놓습니다."
 TFRKPHN_kbg_t_18:0 "사정의 바람"
 TFRKPHN_kbg_t_18_desc:0 "공직 사회 전체에 사정의 바람이 붑니다. 장관과 국회의원, 장성들이 줄줄이 조사를 받습니다. 정치권 누구도 안전하지 않습니다."
 TFRKPHN_kbg_t_08:0 "영호남 화해"
 TFRKPHN_kbg_t_08_desc:0 "대구와 광주의 시장이 서로의 도시를 찾아 같은 날 같은 자리에서 손을 잡습니다. 대통령은 두 도시 사이에 놓을 다리를 약속합니다."
 TFRKPHN_kbg_t_09:0 "지역주의 타파 선거법"
 TFRKPHN_kbg_t_09_desc:0 "한 지역을 한 정당이 독차지하지 못하도록 선거법을 고칩니다. 지역 이름이 아니라 정책으로 표를 얻어야 하는 선거가 시작됩니다."
 TFRKPHN_kbg_t_15:0 "지방자치 전면 실시"
 TFRKPHN_kbg_t_15_desc:0 "시장과 도지사, 군수까지 모두 주민이 직접 뽑게 합니다. 중앙이 임명하던 자리를 지역에 돌려줍니다."
 TFRKPHN_kbg_t_14:0 "칼국수 오찬"
 TFRKPHN_kbg_t_14_desc:0 "대통령실 오찬 상에는 칼국수 한 그릇만 오릅니다. 봉투와 접대를 끊겠다는 대통령의 신호를 정치권 모두가 알아듣습니다."
 TFRKPHN_kbg_t_10:0 "개혁의 역풍"
 TFRKPHN_kbg_t_10_desc:0 "빠른 개혁에는 값이 따릅니다. 돈줄이 막힌 기업들이 투자를 멈추고, 군과 관료 사회에 불만이 쌓입니다. 대통령은 속도를 늦추지 않기로 합니다."
 TFRKPHN_kbg_t_11:0 "세계로"
 TFRKPHN_kbg_t_11_desc:0 "닫혔던 항구와 시장을 다시 엽니다. 패전국이라는 이름 대신 개혁한 나라라는 이름으로 세계에 나섭니다."
 TFRKPHN_kbg_t_17:0 "선진국 클럽 가입"
 TFRKPHN_kbg_t_17_desc:0 "잘사는 나라들의 경제 협의체에 가입합니다. 패전국에서 선진국 클럽 회원국이 되기까지 걸린 시간을 신문들이 앞다투어 셉니다."
 TFRKPHN_kbg_t_12:0 "개혁의 완성"
 TFRKPHN_kbg_t_12_desc:0 "군과 돈과 지역, 세 개의 벽을 넘었습니다. 다음 대통령은 이 나라를 물려받을 것입니다."
 TFRKPHN_kdy_t_01:0 "계산서를 든 대통령"
 TFRKPHN_kdy_t_01_desc:0 "긴 겨울을 견디며 올라온 사람이 대통령이 됐습니다. 상업고등학교와 야간대학을 거친 관료가 이제 패전의 빚을 갚는 나라의 맨 앞에 섭니다. 그는 재건은 느려도 확실해야 한다고 믿습니다."
 TFRKPHN_kdy_t_02:0 "계산서를 펼치다"
 TFRKPHN_kdy_t_02_desc:0 "나라가 진 빚을 모두 한 장에 정리해 국민에게 공개합니다. 숫자는 무겁지만, 숫자를 아는 것이 갚는 일의 시작입니다."
 TFRKPHN_kdy_t_03:0 "나라 빚 갚기 운동"
 TFRKPHN_kdy_t_03_desc:0 "시민들이 장롱 속 금붙이와 저금통을 들고 은행 앞에 줄을 섭니다. 정부는 모인 돈을 한 푼도 다른 데 쓰지 않겠다고 약속합니다."
 TFRKPHN_kdy_t_14:0 "외환 보유고 회복"
 TFRKPHN_kdy_t_14_desc:0 "바닥났던 나라 곳간에 다시 외화가 쌓이기 시작합니다. 대통령은 매달 그 숫자를 직접 발표합니다."
 TFRKPHN_kdy_t_04:0 "빚을 다 갚은 날"
 TFRKPHN_kdy_t_04_desc:0 "패전의 빚 마지막 한 장이 상환됩니다. 대통령은 그날 계산서를 접어 국회 도서관에 보냅니다."
 TFRKPHN_kdy_t_05:0 "노사정 대타협"
 TFRKPHN_kdy_t_05_desc:0 "노동계와 경영계, 정부가 한 테이블에 앉습니다. 일자리를 지키는 대신 임금을 함께 참기로 합니다."
 TFRKPHN_kdy_t_06:0 "부실 기업 정리"
 TFRKPHN_kdy_t_06_desc:0 "패전으로 무너진 기업들 가운데 살릴 곳과 정리할 곳을 나눕니다. 아픈 결정이지만 미루면 더 아픕니다."
 TFRKPHN_kdy_t_07:0 "사회 안전망 확대"
 TFRKPHN_kdy_t_07_desc:0 "일자리를 잃은 사람들이 다시 일어설 때까지 받칠 그물을 넓힙니다. 실업 급여와 직업 훈련을 함께 늘립니다."
 TFRKPHN_kdy_t_15:0 "기초생활 보장"
 TFRKPHN_kdy_t_15_desc:0 "일할 수 없는 사람에게도 최소한의 생활을 나라가 보장합니다. 시혜가 아니라 권리라고 법에 적습니다."
 TFRKPHN_kdy_t_16:0 "국가인권위원회"
 TFRKPHN_kdy_t_16_desc:0 "국가 권력이 사람을 함부로 다루지 못하도록 독립된 인권 기구를 세웁니다. 여의도의 사흘을 겪은 나라에 필요한 기구입니다."
 TFRKPHN_kdy_t_08:0 "벤처 특별법"
 TFRKPHN_kdy_t_08_desc:0 "젊은 기업들이 빚 걱정 없이 시작할 수 있도록 세금과 규제를 덜어 줍니다. 끊긴 수출의 빈자리를 새 산업으로 채웁니다."
 TFRKPHN_kdy_t_09:0 "새 산업 지도"
 TFRKPHN_kdy_t_09_desc:0 "반도체와 배터리, 조선의 지도를 다시 그립니다. 패전으로 잃은 공장 대신 새 공장이 들어설 자리를 정합니다."
 TFRKPHN_kdy_t_13:0 "초고속 통신망"
 TFRKPHN_kdy_t_13_desc:0 "전국에 초고속 통신망을 깝니다. 공장이 무너진 자리에 회선이 들어가고, 젊은이들은 그 회선 위에서 새 회사를 차립니다."
 TFRKPHN_kdy_t_17:0 "전자 정부"
 TFRKPHN_kdy_t_17_desc:0 "민원과 세금, 행정을 모두 회선 위로 옮깁니다. 관청에 가지 않아도 되는 나라가 시작됩니다."
 TFRKPHN_kdy_t_10:0 "볕이 드는 문"
 TFRKPHN_kdy_t_10_desc:0 "패전의 상대였던 나라에 얼어붙은 문을 엽니다. 바람으로 외투를 벗기지 못한다면 볕으로 벗기겠다는 것이 대통령의 셈입니다. 원한보다 시장이 먼저입니다."
 TFRKPHN_kdy_t_18:0 "정상회담"
 TFRKPHN_kdy_t_18_desc:0 "얼어붙었던 이웃 나라의 정상과 마주 앉습니다. 두 정상이 손을 맞잡는 사진이 세계로 퍼집니다."
 TFRKPHN_kdy_t_11:0 "무역의 다리"
 TFRKPHN_kdy_t_11_desc:0 "닫혔던 항구가 다시 열리고, 수출선이 바다로 나갑니다. 무역의 다리가 다시 놓입니다."
 TFRKPHN_kdy_t_12:0 "다시 선 나라"
 TFRKPHN_kdy_t_12_desc:0 "빚을 갚고 공장을 다시 세웠습니다. 다음 대통령은 빚 없는 나라를 물려받을 것입니다."
 TFRKPHN_kms_t_01:0 "판을 쥔 사람"
 TFRKPHN_kms_t_01_desc:0 "갈라진 두 김씨 사이로 보수 원로가 대통령이 됐습니다. 판을 가르던 사람이 이제 판의 한가운데에 섰습니다."
 TFRKPHN_kms_t_02:0 "보수의 재건"
 TFRKPHN_kms_t_02_desc:0 "무너졌던 보수 정당들을 다시 한 지붕 아래로 모읍니다. 거리의 극우와는 선을 긋습니다."
 TFRKPHN_kms_t_11:0 "보수 대연합"
 TFRKPHN_kms_t_11_desc:0 "흩어진 보수 세력들을 하나의 연합으로 묶습니다. 원로와 소장파, 영남과 충청을 한 지붕 아래 앉힙니다."
 TFRKPHN_kms_t_03:0 "안보 우선"
 TFRKPHN_kms_t_03_desc:0 "패전 뒤 흔들린 국방을 다시 세웁니다. 군을 정상으로 돌리되, 다시는 정치에 쓰지 않습니다."
 TFRKPHN_kms_t_16:0 "국방 개혁"
 TFRKPHN_kms_t_16_desc:0 "패전에서 배운 것을 군에 새깁니다. 병력보다 장비와 훈련을, 규모보다 쓸모를 앞세웁니다."
 TFRKPHN_kms_t_06:0 "두 김씨에게 내민 손"
 TFRKPHN_kms_t_06_desc:0 "패배한 두 김씨에게 함께 일하자고 손을 내밉니다. 평생 누구를 세우느냐로 판을 가르던 사람이 이제는 손을 내미는 자리에 섰습니다. 받아들이든 거절하든, 그 손을 내민 사람은 대통령입니다."
 TFRKPHN_kms_t_12:0 "총리 지명 정치"
 TFRKPHN_kms_t_12_desc:0 "총리 자리를 연정의 다른 정당에 내줍니다. 대통령은 자리를 나눠 주는 것으로 국회를 움직입니다."
 TFRKPHN_kms_t_13:0 "연정 협의회"
 TFRKPHN_kms_t_13_desc:0 "대통령과 연정 정당 대표들이 매주 한 테이블에 앉는 협의회를 만듭니다. 큰 결정은 모두 그 테이블을 거칩니다."
 TFRKPHN_kms_t_07:0 "국회의 힘"
 TFRKPHN_kms_t_07_desc:0 "대통령 한 사람에게 힘이 몰려 포성까지 갔다고 봅니다. 대통령의 권한을 국회와 나누는 개헌안을 준비합니다."
 TFRKPHN_kms_t_14:0 "중대선거구제"
 TFRKPHN_kms_t_14_desc:0 "한 지역구에서 여러 명을 뽑는 선거제를 도입합니다. 작은 정당들이 국회에 들어올 문이 넓어집니다."
 TFRKPHN_kms_t_04:0 "성장 우선"
 TFRKPHN_kms_t_04_desc:0 "빚을 갚는 것보다 경제를 키우는 것이 먼저라고 봅니다. 기업의 세금을 낮추고 투자를 부릅니다."
 TFRKPHN_kms_t_05:0 "규제 완화"
 TFRKPHN_kms_t_05_desc:0 "기업의 발목을 잡던 규제를 한꺼번에 풉니다. 빠른 성장과 함께 불평등도 커집니다."
 TFRKPHN_kms_t_15:0 "성장 5개년 계획"
 TFRKPHN_kms_t_15_desc:0 "다섯 해 동안의 성장 목표와 투자 순서를 한 장의 계획표에 담습니다. 공단과 항만, 도로가 그 계획표를 따라 들어섭니다."
 TFRKPHN_kms_t_17:0 "개헌 공론화"
 TFRKPHN_kms_t_17_desc:0 "전국을 돌며 권력 구조 개편을 놓고 토론회를 엽니다. 대통령은 직접 마이크를 잡지 않고, 원로와 학자들을 앞에 세웁니다."
 TFRKPHN_kms_t_08:0 "내각제 개헌안"
 TFRKPHN_kms_t_08_desc:0 "의원내각제 개헌안을 국회에 냅니다. 대통령은 상징으로 남고, 나라는 국회가 뽑은 총리가 이끌게 됩니다."
 TFRKPHN_kms_t_18:0 "국민투표 운동"
 TFRKPHN_kms_t_18_desc:0 "개헌안 찬성 운동이 전국에서 시작됩니다. 반대 쪽도 똑같이 움직입니다. 나라가 다시 둘로 나뉘어 투표일을 기다립니다."
 TFRKPHN_kms_t_09:0 "개헌 국민투표"
 TFRKPHN_kms_t_09_desc:0 "내각제 개헌안이 국민투표에 부쳐집니다. 대통령은 모든 것을 이 한 번의 투표에 걸었습니다."
 TFRKPHN_kms_t_10:0 "마지막 셈"
 TFRKPHN_kms_t_10_desc:0 "판을 쥐었던 사람의 마지막 셈입니다. 지는 해가 서쪽 하늘을 붉게 물들이듯, 그는 마지막까지 판의 한가운데에 남았습니다. 그가 남긴 나라의 모습은 국민투표의 결과가 정합니다."
 TFRKPHN_woo_desc:0 "우원식은 학생운동과 재야를 거쳐 정치에 들어선 사람입니다. 서울 노원에서 다섯 번 국회의원에 당선됐고, 가게 주인과 하청 노동자처럼 힘이 약한 쪽의 편에 서겠다며 당 안에 을지로위원회를 만들어 처음으로 이끌었습니다. 원내대표를 지냈고, 22대 국회 전반기에 국회의장이 됐습니다.\n\n국회의장은 당적을 가질 수 없습니다. 그래서 그는 양당이 무너진 나라에서 어느 편도 아닌 사람으로 남았습니다. 포성이 멎은 뒤 그는 무너진 본회의장을 다시 열고 의원들을 불러 모았습니다. 무소속 대통령이 된 그의 약속은 하나입니다. 헌법을 지키는 일부터 다시 시작하는 것입니다."
 TFRKPHN_kbg_desc:0 "김부겸은 경북 출신으로, 민주화운동을 거쳐 정치에 들어섰습니다. 경기 군포에서 세 번 국회의원에 당선된 뒤, 안정된 지역구를 두고 대구로 내려갔습니다. 대구에서 여러 번 떨어지고도 다시 나서 끝내 당선됐고, 행정안전부 장관과 국무총리를 지냈습니다.\n\n지역의 벽을 넘는 데 정치 인생을 건 사람이라는 말을 들어 왔습니다. 패전과 탄핵, 전차의 사흘을 지나온 국회에서 그는 갈라진 정당들을 다시 한자리에 모을 수 있는 사람으로 꼽힙니다. 판을 깨는 일보다 판을 다시 짜는 일이 그의 몫입니다."
 TFRKPHN_kdy_desc:0 "김동연은 충북에서 나고 자랐습니다. 집안이 어려워 상업고등학교를 졸업하고 은행에 들어갔고, 일하면서 야간대학을 다녀 고시에 합격했습니다. 경제 부처에서 오래 일했고, 경제부총리 겸 기획재정부 장관을 지냈습니다.\n\n관료로 일한 뒤 그는 새로운물결을 만들어 양당의 기득권을 깨겠다며 제3지대로 나섰습니다. 패전이 남긴 빚과 무너진 수출을 다시 세우는 일에서 그만큼 숫자를 잘 아는 정치인은 드뭅니다. 그는 자리보다 계산서를 먼저 내미는 사람입니다."
 TFRKPHN_kms_desc:0 "김무성은 부산의 보수 정치를 대표해 온 원로입니다. 젊은 날 상도동계에서 정치를 배웠고, 부산에서 여섯 번 국회의원에 당선됐습니다. 한나라당 사무총장과 새누리당 대표를 지냈으며, 당을 떠나 새 당을 만들었다가 다시 돌아오기도 했습니다.\n\n한동안 정치 일선에서 물러나 있던 그는 다당제 국회가 열리자 다시 불려 나왔습니다. 직접 자리에 나서기보다 누구의 손을 잡느냐로 판을 가르는 사람, 여의도에서 그의 사무실 앞에는 늘 두 캠프의 사람들이 번갈아 찾아옵니다."
 TFRKPHN_cho_desc:0 "조원진은 한국외국어대학교 정치외교학과를 졸업하고 대우그룹에서 중국 사업을 맡았습니다. 1987년 통일민주당 창당에 발기인으로 참여했고, 국회의원 보좌관을 거쳐 한동안 중국에서 재중국한국인회 부회장으로 일했습니다.\n\n2008년 대구 달서병에서 처음 국회의원에 당선된 뒤 같은 지역구에서 내리 세 번 당선됐습니다. 한나라당 원내부대표, 새누리당 전략기획본부장과 원내수석부대표, 대구시당 위원장을 지냈고, 2016년에는 당 최고위원에 올랐습니다.\n\n2017년 봄, 그는 탄핵된 대통령을 끝까지 지지하며 자유한국당을 떠났습니다. 그해 대통령 선거에 새누리당 후보로 나섰고, 여름에는 대한애국당 창당에 참여해 대표가 됐습니다. 당은 뒤에 우리공화당으로 이름을 바꿨고, 그는 2020년 국회를 떠난 뒤에도 당을 이끌며 광장의 집회를 지켰습니다.\n\n패전과 탄핵을 거치며 거대 양당이 함께 무너지자, 광장의 분노는 그의 당으로 모였습니다. 국민의힘을 떠난 의원들이 합류했고, 갈라진 제3지대 사이로 그는 대통령이 됐습니다. 그러나 국회의 의석은 서른 석이 채 되지 않습니다. 광장의 대통령에게 국회는 여전히 넘어야 할 벽입니다."
 TFRKPHN_snd_party:0 "신민당"
 TFRKPHN_snd_party_long:0 "신민당"
 TFRKPHN_samkim_a_tt:0 "단일 후보는 §Y김부겸§!입니다. 김동연은 경제부총리를 맡습니다."
 TFRKPHN_samkim_b_tt:0 "단일 후보는 §Y김동연§!입니다. 김부겸은 국무총리를 맡습니다."
 TFRKPHN_samkim_bu_tt:0 "§Y신민당§! §Y김부겸§!이 대통령이 됩니다. §Y김부겸 중점 트리§!로 바뀝니다."
 TFRKPHN_samkim_dong_tt:0 "§Y신민당§! §Y김동연§!이 대통령이 됩니다. §Y김동연 중점 트리§!로 바뀝니다."
 TFRKPHN_samkim_mu_tt:0 "§Y헌정회복연대§! §R김무성§!이 대통령이 됩니다. 갈라진 §Y신민당§!은 야당이 됩니다. §Y김무성 중점 트리§!로 바뀝니다."
