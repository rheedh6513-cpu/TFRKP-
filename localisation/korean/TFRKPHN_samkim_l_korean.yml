l_korean:
 # [안내] 삼김 루트. samkim_build.py가 만든다.
 KOR_TFRKPHN_kdy_char:0 "김동연"
 KOR_TFRKPHN_kms_char:0 "김무성"
 KOR_TFRKPHN_kbg_char:0 "김부겸"
 tfrkphn.7061.a:0 "세 사람이 나섰다."
 tfrkphn.7061.t:0 "새 기수"
 tfrkphn.7061.d:0 "우원식이 물러난 뒤 새 헌법에 따른 첫 대통령 선거 날짜가 공고됐다. 우원식은 헌법을 되살리는 일까지가 자기 몫이라며 출마하지 않겠다고 일찍 밝혀 두었고, 여의도 사람들은 곧바로 다음 후보의 이름을 꼽기 시작했다.[TFRKPHN_sk_start]\n\n김부겸이 가장 먼저 출마를 밝혔다. 그는 대구에서 몇 번을 떨어지고도 다시 출마했고 지역의 벽을 넘는 데 정치 인생을 걸어 왔다. 그는 낡은 판을 깬 자리에 새 판을 짤 사람이 필요하다고 했다.\n\n이틀 뒤 김동연이 나섰다. 그는 오랫동안 예산을 다루다 경제부총리를 지낸 관료 출신이고 우원식 정부에서도 경제를 맡았다. 그는 패전의 빚을 갚는 일이 정치보다 먼저라고 했다. 두 사람은 연정을 떠나 신민당을 함께 세우고, 한 당 안에서 후보 자리를 다투기로 했다.\n\n여의도의 사흘 동안 같은 편에 섰고 국무회의에서도 나란히 앉았던 두 사람이 이제 대통령 후보 자리를 두고 서로 경쟁하게 됐다.\n\n헌정회복연대에 남은 쪽에서는 보수 원로 김무성이 출마를 밝혔다. 그는 연정에 남은 의원들을 다시 불러 모았다."
 tfrkphn.7082.a:0 "새 당의 깃발이 올랐다."
 tfrkphn.7082.t:0 "신민당 창당"
 tfrkphn.7082.d:0 "두 사람이 연정을 떠난다는 소식에 여의도가 술렁였다. 김부겸을 따르는 옛 민주당 사람들과 김동연을 따르는 제3지대의 의원들이 각자 짐을 쌌다.\n\n옛 민주당 사람들에게는 돌아갈 당이 없었다. 조원진 정부가 낸 해산 심판 끝에 민주당은 강제로 해산되었고, 법은 해산된 당의 이름을 다시 쓰는 것도, 같은 강령으로 당을 다시 세우는 것도 막았다. 헌정이 돌아온 뒤에도 그 결정은 그대로 남았다.\n\n두 세력은 처음에 창당준비위원회를 따로 꾸렸다. 야당이 둘로 나가면 헌정회복연대를 이길 수 없다는 여론조사가 나오자 양쪽 대표 네 사람이 사흘 동안 만나 합당에 합의했다.\n\n준비위원회는 오래전 두 야당이 합쳐 만들었던 통합 야당의 이름을 따서 당 이름을 신민당으로 정했다. 당 대표는 두 김씨 어느 쪽에도 속하지 않은 원로 헌법학자가 맡았고, 대통령 후보는 전당대회에서 대의원 투표로 뽑기로 했다. 창당대회 날 두 김씨는 단상 양쪽 끝에 앉아 박수를 쳤다.\n\n그날 밤 김무성은 중계를 끝까지 지켜보고, 남은 의원들에게 전화를 돌리기 시작했다."
 tfrkphn.7062.a:0 "결선이 멈췄다."
 tfrkphn.7062.t:0 "뒤집힌 셈"
 tfrkphn.7062.d:0 "신민당의 후보 지명 전당대회가 열렸다. 대의원들이 체육관을 가득 메웠다. 1차 투표에서는 김부겸이 김동연을 앞섰지만 과반에는 몇십 표가 모자랐다. 투표함에서는 이름을 적지 않은 백지표가 적지 않게 나왔다.\n\n결선을 앞둔 밤, 김동연 캠프는 3위를 한 중진 의원을 찾아갔다. 캠프는 자리를 약속하는 대신 패전의 빚을 어떻게 갚고 누가 얼마를 부담할지를 적은 계산서를 그에게 내밀었다. 새벽에 중진 의원의 대의원들이 김동연 쪽으로 옮겨 간다는 말이 돌았다.\n\n김부겸 캠프는 결선을 미루자고 했다. 김동연 캠프는 그대로 치르자고 했다. 체육관 복도에서 두 캠프의 대의원들이 고성을 주고받았고, 당 지도부는 새벽 회의 끝에 결선을 무기한 미룬다고 발표했다.\n\n그날 밤 체육관 앞에는 두 캠프의 버스가 나란히 서 있었다. 몇 달 전 함께 당을 세우고 같은 버스로 올라왔던 대의원들이 서로 다른 버스에 나눠 타고 돌아갔다.\n\n여론조사에서 두 사람의 표를 더하면 김무성을 크게 앞섰지만, 따로 나서면 어느 쪽도 김무성을 넘지 못했다."
 tfrkphn.7063.a:0 "협상 테이블을 지킨다."
 tfrkphn.7063.t:0 "단일화 협상"
 tfrkphn.7063.d:0 "결선이 멈추자 신민당의 원로들은 후보를 지명할 권한을 당 대표에게 맡기라고 두 사람에게 요구했다. 두 사람은 대의원이 뽑지 않은 후보로는 선거를 치를 수 없다며 거절했고, 결선 대신 협상으로 후보를 정하기로 했다.\n\n첫 협상은 국회 의원회관의 작은 회의실에서 열렸다. 김부겸 쪽은 여론조사로 후보를 정하자고 했다. 김동연 쪽은 정책부터 맞추자고 했다. 회의는 네 시간 이어졌고 다음 날짜만 정한 채 끝났다.\n\n두 캠프의 지지자들 가운데 한쪽은 지역의 벽을 넘은 사람이 먼저라고 했고, 다른 쪽은 나라의 빚을 아는 사람이 먼저라고 했다. 신문들은 두 김씨가 끝내 갈라설지를 놓고 매일 다른 전망을 내놓았다.\n\n퇴임한 우원식은 두 사람이 차례로 찾아와도 어느 쪽 손도 들어 주지 않았고, 후보는 두 사람이 직접 정해야 한다고만 말했다. 신민당 원로들은 두 사람이 갈라서면 당이 무너진다고 걱정했다.\n\n후보 등록까지는 다섯 주가 남았고, 그 안에 후보를 정하지 못하면 표가 갈린다. 김무성 캠프는 협상 소식이 나올 때마다 조용히 여론조사를 돌렸다."
 tfrkphn.7064.a:0 "김부겸이 나선다."
 tfrkphn.7064.b:0 "김동연이 나선다."
 tfrkphn.7064.t:0 "하나의 이름"
 tfrkphn.7064.d:0 "협상은 다섯 주 만에 타결됐다. 두 사람이 함께 기자회견장에 섰다. 두 사람은 공동 정부를 꾸리고 경제와 개혁을 나누어 맡는다는 합의문을 읽었다. 누구의 이름을 투표용지에 올릴지는 아직 정하지 못했다.\n\n여론조사는 두 사람의 차이가 오차 범위 안이라고 했다. 정책 합의문의 마지막 줄은 비어 있었다. 후보는 두 사람이 마지막 회동에서 직접 정하기로 했기 때문이다.\n\n회동은 자정을 넘겨 끝났다. 두 사람의 비서실장들이 먼저 회의실을 나왔지만 기자들의 질문에 아무 답도 하지 않았다. 한 시간 뒤 두 사람이 함께 문을 열고 나왔다.\n\n두 사람은 회견장의 단상 앞에 나란히 섰다. 누가 마이크를 먼저 잡을지 잠시 서로를 바라보았다. 지지자들은 숨을 죽였다. 그날 사진에는 두 사람의 손이 함께 높이 들려 있었다.\n\n김무성 캠프의 상황실에서는 그날 밤 아무도 퇴근하지 않았다. 연정에 남은 표만으로는 하나가 된 신민당을 넘을 수 없다는 것을 모두가 알고 있었다. 이제 선거 결과는 두 김씨 가운데 누가 나서느냐에 달려 있었다."
 tfrkphn.7065.a:0 "개혁의 칼을 든다."
 tfrkphn.7065.t:0 "대구에서 온 대통령"
 tfrkphn.7065.d:0 "개표가 끝났다. 단일 후보 김부겸이 김무성을 넉넉하게 앞섰다. 대구와 광주에서 고르게 표가 나왔다. 두 도시의 득표율은 비슷했다.\n\n선거 기간 내내 지방 유세를 대신 돌았던 김동연은 개표 방송이 끝나기 전에 김부겸의 캠프를 찾았다. 김동연은 지지자들 앞 단상에서 김부겸의 손을 잡아 높이 들어 올렸다. 합의대로 그는 경제를 책임지는 부총리를 맡기로 했다.\n\n김무성은 패배를 인정하는 짧은 회견을 열었다. 그는 연정이 다시 일어설 길을 찾겠다고 했다. 그의 곁에 선 의원들은 생각보다 많았다.\n\n취임식은 국회 앞마당에서 열렸다. 국회 정문 앞 아스팔트에는 전차가 남긴 바퀴 자국 한 줄이 그대로 남아 있었다. 새 대통령은 선서를 마치고 그 자국 앞에 잠시 서 있었다. 대구에서 올라온 지지자들과 광주에서 올라온 지지자들이 같은 줄에 섰다.\n\n새 대통령은 첫 지시로 군 인사 자료를 가져오게 했다. 여의도의 사흘 동안 명령을 내린 사람들과 그 명령을 따른 사람들이 아직 군 안에 남아 있었고, 그는 개혁을 빨리 한 번에 해야 한다고 믿었다."
 tfrkphn.7066.a:0 "빚부터 갚는다."
 tfrkphn.7066.t:0 "계산서를 든 대통령"
 tfrkphn.7066.d:0 "개표가 끝났다. 단일 후보 김동연이 김무성을 넉넉하게 앞섰다. 공장 지대와 항구 도시들에서 표가 많이 나왔다. 패전의 빚을 갚겠다는 사람에게 빚을 가장 크게 진 곳들이 표를 던졌다.\n\n선거 기간 내내 지방 유세를 대신 돌았던 김부겸은 개표 방송이 끝나기 전에 김동연의 캠프를 찾았다. 김부겸은 지지자들 앞 단상에서 김동연의 손을 잡아 높이 들어 올렸다. 합의대로 그는 국무총리를 맡기로 했다.\n\n김무성은 패배를 인정하는 짧은 회견을 열었다. 그는 연정이 다시 일어설 길을 찾겠다고 했다. 그의 곁에 선 의원들은 생각보다 많았다.\n\n취임식은 국회 앞마당에서 열렸다. 새 대통령은 취임사에서 갚아야 할 빚과 다시 열어야 할 항구, 되살려야 할 일자리의 수를 하나씩 읽었다. 사람들은 대통령 취임사에서 계획을 들은 것이 처음이라고 말했다.\n\n새 대통령은 첫 지시로 패전의 빚을 갚는 순서와 세금을 걷는 순서를 한 장에 정리해 오라고 했다. 경제 부처 직원들은 그 주 내내 밤늦게까지 일했다. 그는 재건이 느리더라도 확실해야 한다고 믿었다."
 tfrkphn.7067.a:0 "어부지리."
 tfrkphn.7067.t:0 "갈라진 두 김씨"
 tfrkphn.7067.d:0 "협상은 끝내 깨졌다. 김동연을 따르는 의원들이 신민당을 떠나 새 당을 차렸다. 후보 등록 마감일에 두 사람은 같은 날 따로 서류를 냈고, 지지자들은 서로를 배신자라고 불렀다.\n\n선거운동 내내 두 사람은 김무성보다 서로를 더 많이 공격했다. 마지막 주의 여론조사는 세 사람이 모두 오차 범위 안이라고 했다.\n\n개표 결과 김무성이 1위를 했다. 두 김씨의 표를 더하면 그를 크게 넘었지만 두 사람은 투표용지에 따로 이름을 올렸다. 김무성 쪽 표는 처음부터 끝까지 한 사람에게 모여 있었다.\n\n개표 방송을 보던 신민당 의원들은 하나둘 자리를 떴다. 몇 달 전 함께 세운 당이 그렇게 둘로 갈라졌다. 오래된 기자들은 이 장면을 어디선가 본 적이 있다고 했다. 그 장면의 끝을 아는 사람들은 아무 말도 하지 않았다.\n\n두 김씨는 그날 밤 서로에게 전화하지 않았다. 신문들은 두 사람이 합쳤다면, 이라는 말을 다시 꺼냈다. 새 대통령은 당선 소감에서 두 사람에게 함께 일하자고 했다. 그는 소감을 마치고 캠프 사람들과 차례로 악수했다."
 TFRKPHN_sk_policy:0 "정책 연대 협약"
 TFRKPHN_sk_policy_desc:0 "개혁과 재건의 순서를 두 캠프가 함께 정합니다."
 TFRKPHN_sk_poll:0 "경선 방식 합의"
 TFRKPHN_sk_poll_desc:0 "여론조사로 후보를 정하는 방식을 두 캠프가 받아들이게 합니다."
 TFRKPHN_sk_gov:0 "공동 정부 구상"
 TFRKPHN_sk_gov_desc:0 "이긴 쪽이 대통령, 진 쪽이 국무총리나 부총리를 맡는 공동 정부 구상을 내놓습니다."
 TFRKPHN_sk_meet:0 "실무진 회동"
 TFRKPHN_sk_meet_desc:0 "두 캠프의 실무진이 매일 밤 따로 만나 이견을 좁힙니다."
 TFRKPHN_sk_category:0 "두 김씨의 단일화"
 TFRKPHN_sk_category_desc:0 "함께 신민당을 세운 김부겸과 김동연이 당의 단일 후보를 놓고 협상하고 있습니다. 둘로 갈라지면 헌정회복연대의 김무성이 이깁니다.\n\n협상 진척도: §Y[?TFRKPHN_sk_uni|0]§! / 100\n\n시한이 끝날 때 §Y50§! 이상이면 단일화가 성사되고 두 사람 가운데 한 사람을 후보로 고릅니다. 모자라면 두 사람이 각자 출마하고, 갈라진 표 사이로 §R김무성§!이 이깁니다."
 TFRKPHN_sk_deadline:0 "후보 등록 마감"
 TFRKPHN_sk_deadline_desc:0 "후보 등록 마감까지 남은 시간입니다."
 TFRKPHN_sk_deadline_tt:0 "협상 진척도가 §Y50§! 이상이면 단일화가 성사되고, 모자라면 두 사람이 따로 출마합니다."
 TFRKPHN_kms_ref_tt:0 "다음 날 개표 결과가 나옵니다. 안정도가 §Y50%§!를 넘으면 개헌안이 §G통과§!되고, 아니면 §R부결§!됩니다. 바둑판에서 이겼다면 §Y40%§!만 넘어도 통과하고, 졌다면 국회 문턱을 넘지 못해 §R부결§!됩니다."
 TFRKPHN_sk_up15_tt:0 "협상 진척도 §G+15§!"
 TFRKPHN_sk_up10_tt:0 "협상 진척도 §G+10§!"
 TFRKPHN_sk_uni_tt:0 "§Y두 김씨의 단일화§! 결정이 열립니다. 협상 진척도는 §Y30§!에서 시작하고, §Y35일§! 안에 §Y50§!을 넘겨야 합니다."
 tfrkphn.7083.a:0 "칼은 한 번에 뽑는다."
 tfrkphn.7083.t:0 "별이 떨어진 아침"
 tfrkphn.7083.d:0 "여의도의 사흘 동안 전차를 움직였던 장성들은 정권이 두 번 바뀐 뒤에도 군에 남아 있었다. 김부겸은 취임 열하루째 되는 날 이들을 한꺼번에 내보내기로 했다.\n\n그날 아침 장성들은 여느 날처럼 검은 승용차에서 내려 경례를 받으며 국방부 청사 계단을 올랐다. 여덟 시 정각에 비서관들이 그들의 책상마다 오늘 날짜로 전역을 명한다는 한 줄짜리 명령서를 흰 봉투에 넣어 올려놓았다. 운전병들은 차에서 내리지 않고 기다렸다.\n\n\"이게 무슨 뜻입니까.\" 한 소장이 봉투를 든 채 물었지만 비서관은 대답하지 않았다. 청사 앞에는 벌써 방송 차량들이 몰려와 있었다.\n\n대통령은 그날 담화도 회견도 열지 않았다. 부총리 김동연은 아침 회의를 미루고 환율 화면을 지켜봤고, 야당의 김무성은 짧은 논평 하나를 냈다. 연정의 원로들은 기자들의 전화를 받지 않았다. 국방부 대변인은 기자들에게 정기 인사를 앞당긴 것이라고만 설명했다.\n\n그날 하루 동안 장성 마흔 명 남짓이 군복을 벗었다. 퇴역 군인 단체는 이튿날 국방부 앞에서 항의 집회를 열겠다고 신고했다."
 tfrkphn.7084.a:0 "이름 없는 돈은 없다."
 tfrkphn.7084.t:0 "밤 여덟 시"
 tfrkphn.7084.d:0 "저녁 일곱 시 반에 대통령실은 방송사들에 여덟 시 특별 담화를 통보하면서 주제를 알려 주지 않았다. 보도국들은 정규 방송을 끊을 준비를 했다. 은행 연합회에는 같은 시각 전 지점 책임자를 대기시키라는 공문이 내려갔다.\n\n여덟 시 정각에 화면에 나온 대통령은 내일 아침부터 모든 금융 거래를 실제 이름으로만 할 수 있고, 남의 이름을 빌린 계좌는 두 달 안에 바꾸지 않으면 묶인다고 발표했다. 담화는 사 분이 채 걸리지 않았다.\n\n강남의 한 사무실에서는 그 시각부터 전화가 끊이지 않았다. \"지금 바꾸면 다 드러납니다.\" \"안 바꾸면 다 묶입니다.\" 전화기 너머의 목소리가 점점 높아졌다.\n\n부총리 김동연은 그날 밤 은행장들을 불러 내일 아침 창구가 멈추면 안 된다고 당부했다. 은행원들은 집에 가지 못하고 전산을 고쳤고, 다음 날에는 은행 문이 열리기도 전에 창구 앞에 긴 줄이 섰다.\n\n차명 계좌의 주인들은 그 주부터 하나둘 은행에 나와 이름을 바꿨다. 국세청은 바뀐 계좌의 명단을 넘겨받아 정치인과 공직자의 이름부터 대조하기 시작했다."
 tfrkphn.7085.a:0 "기록되지 않은 밤."
 tfrkphn.7085.t:0 "세 사람의 저녁"
 tfrkphn.7085.d:0 "선거가 끝나고 처음으로 세 사람이 여의도 뒷골목의 오래된 한정식집에서 저녁을 함께 먹었다. 대통령실은 그날 저녁 일정표를 비워 두었고 기자들은 이 자리를 알지 못했다.\n\n대통령이 먼저 와서 기다렸고 부총리 김동연이 그다음에, 김무성이 약속 시간을 조금 넘겨 들어왔다. 주인이 술을 내왔지만 세 사람은 한동안 잔을 들지 않았다. 방에는 상 하나와 방석 세 개가 놓여 있었다.\n\n이야기는 공직자 재산 공개에서 시작됐다. 대통령이 자기 재산 목록부터 내놓았다고 하자 김무성은 웃으며 잔을 들었고 김동연은 목록에서 숫자 몇 개를 짚었다. 세 사람은 자정이 넘어서야 국회 일정으로 화제를 옮겼고 그사이 술병이 세 번 바뀌었다.\n\n문밖의 수행 비서들은 담배를 나눠 피웠다. \"무슨 얘기가 오가는 걸까요.\" \"모르는 게 낫지.\" 방 안에서는 웃음소리가 나다가도 한참씩 조용해졌다.\n\n세 사람은 새벽 한 시에 서로 다른 문으로 나갔고, 이 자리에서 합의한 내용을 아무도 기록하지 않았다. 그 주 국회는 재산 공개 법안을 큰 다툼 없이 처리했다."
 tfrkphn.7086.a:0 "벽은 넘으라고 있다."
 tfrkphn.7086.t:0 "대구로 가는 열차"
 tfrkphn.7086.d:0 "김부겸은 대구에서 여러 번 낙선했고 그때마다 다시 출마했다. 대통령이 되어 처음 대구에 가는 날 그는 경호원들이 말리는데도 전용기를 마다하고 열차를 탔다.\n\n객차의 승객들은 처음에는 그를 알아보지 못하다가 하나둘 고개를 돌렸다. 그는 창가에 앉아 들판을 바라보며 대구까지 갔다. 옆자리의 노인이 귤 하나를 건네자 그는 받아서 껍질을 깠고, 노인은 선거 때 그를 찍지 않았다고 말했다.\n\n대구역 광장에는 환영 현수막을 든 사람들과 그를 끝내 찍지 않았다는 팻말을 든 사람들이 함께 나와 있었다. 대통령은 양쪽 사이를 천천히 걸어 지나갔고 그를 막아서는 사람은 없었다.\n\n그날 오후에는 대구시장과 광주시장이 한 단상에 올라 두 도시를 잇는 철도 협약에 서명하고 손을 잡았다. 대통령은 단상에 오르지 않고 맨 앞줄에 앉아 그 장면을 지켜봤다.\n\n\"떨어질 때마다 다시 오셨다면서요.\" 돌아오는 열차에서 한 기자가 물었다. 비서관이 대통령 대신 웃으며 대답했다. \"그래서 오늘은 이긴 겁니다.\" 대통령은 그 말을 듣고도 창밖에서 눈을 떼지 않았다."
 tfrkphn.7087.a:0 "속도를 늦춘다."
 tfrkphn.7087.b:0 "끝까지 간다."
 tfrkphn.7087.t:0 "개혁의 역풍"
 tfrkphn.7087.d:0 "금융실명제로 차명 계좌가 드러나자 돈줄이 막힌 기업들이 투자를 멈췄다. 사정이 공직 사회로 번지면서 관료들은 서류에 서명하기를 꺼렸고, 전역한 장성들은 퇴역 군인 단체를 앞세워 거리로 나왔다.\n\n부총리 김동연은 대통령실을 찾아와 석 달째 내려간 성장률 전망표를 책상 위에 펼쳐 놓았다. 그는 낮은 목소리로 개혁의 속도를 조금 늦추자고 했고, 대통령이 대답하지 않아도 같은 말을 되풀이했다. 대통령은 전망표를 한참 들여다봤다.\n\n같은 날 오후 김무성은 국회에서 기자회견을 열어 개혁의 속도가 나라가 견딜 수 있는 것보다 빠르다고 주장했다. 연정에 남은 의원들 가운데에도 그 말에 동의하는 사람이 늘었고, 신문 사설들은 하루 사이에 논조를 바꾸었다.\n\n대통령은 그날 밤 집무실에 혼자 남아 사정 대상자 명단과 성장률 전망표를 번갈아 들여다봤다. 속도를 늦추면 수사가 흐지부지되고 그대로 가면 일자리가 줄어든다는 보고가 둘 다 올라와 있었다. 비서실장은 새벽 두 시에 내일 아침 담화 시간을 비워 두겠다고 보고하고 물러났다."
 tfrkphn.7099.a:0 "덮지 않고 따진다."
 tfrkphn.7099.t:0 "법정의 하루"
 tfrkphn.7099.d:0 "전역 명령서를 받은 장성들 가운데 몇 사람이 일 년 뒤 법정 피고인석에 앉았다. 검찰은 여의도의 사흘 동안 포격 준비 명령을 전달한 지휘관들을 내란 혐의로 재판에 넘겼다.\n\n공판은 아침 열 시에 시작됐고 검사는 긴급명령과 포격 명령이 누구에게서 누구에게로 내려갔는지를 한 줄씩 읽었다. 방청석은 새벽부터 줄을 선 사람들로 가득 찼는데, 여의도의 사흘 동안 바리케이드를 지켰던 시민들도 그 안에 있었다.\n\n\"명령에 따랐을 뿐입니다.\" 한 피고인이 말했다. 재판장은 서류에서 눈을 떼지 않고 물었다. \"그 명령이 헌법에 맞는지 묻지 않았습니까.\" 피고인은 대답하지 못했다.\n\n대통령은 집무실에서 공판 중계를 켜 두지 않았다. 비서관이 보고서를 올리자 그는 결론만 묻고는 판결은 법원이 내릴 일이라고 말했다. 부총리 김동연도 그날 국무회의에서 재판 이야기를 꺼내지 않았다.\n\n그날 저녁 신문들은 피고인석 사진을 일 면에 실었다. 재판은 그 뒤로 일 년을 더 끌었고, 방청권을 받으려는 줄은 선고 날까지 한 번도 줄지 않았다."
 tfrkphn.7100.a:0 "잔을 든다."
 tfrkphn.7100.b:0 "부총리의 보고를 먼저 듣는다."
 tfrkphn.7100.t:0 "축배"
 tfrkphn.7100.d:0 "선진국 경제 기구가 한국의 가입을 승인한 날 밤 여의도의 호텔 연회장에서 축하연이 열렸다. 신문들은 패전국이 가입하기까지 몇 해가 걸렸는지를 세어 일 면에 실었다.\n\n대통령은 단상에 올라 밤 여덟 시의 담화에서 시작한 일이 여기까지 왔다고 짧게 말했다. 박수가 길게 이어졌고 기업인들은 잔을 부딪쳤으며 야당의 김무성도 축하 화환을 보냈다. 장관들은 서로 어깨를 두드렸고 연회장 벽의 화면에는 가입 승인 소식을 전하는 외신 속보가 계속 나왔다.\n\n부총리 김동연은 연회장 구석에서 잔을 들지 않고 수첩을 들여다보고 있었다. 수첩에는 나라 밖에서 빌린 단기 외채가 석 달째 늘고 있다는 숫자가 적혀 있었다.\n\n\"오늘 같은 날 그 얘기는 좀...\" 옆에 선 차관이 웃으며 말렸다. 김동연은 수첩을 덮고 내일 아침 대통령에게 따로 보고하겠다고 했다.\n\n연회는 자정을 넘겨 끝났고 거리에는 축하 현수막이 걸렸다. 김동연은 연회장을 나서자마자 차 안에서 외환 담당 국장에게 전화를 걸어 만기별 외채 명세를 아침까지 가져오라고 지시했다."
 tfrkphn.7101.a:0 "칼을 내려놓는다."
 tfrkphn.7101.t:0 "칼을 내려놓는 날"
 tfrkphn.7101.d:0 "김부겸은 임기 내내 개혁을 멈추지 않았고 그 임기가 끝나는 날이 왔다.\n\n마지막 국무회의에서 대통령은 장관들에게 고맙다는 말만 하고 회의를 끝냈다. 부총리 김동연은 마지막 경제 지표를 보고하면서 나라 빚이 줄었다고 했고, 국방부 장관은 군이 다섯 해 동안 한 번도 부대 밖으로 나오지 않았다고 보고했다. 회의는 십오 분 만에 끝났다.\n\n대통령은 그날 아침 대통령실 마당을 혼자 걷다가 국회 정문 쪽에서 걸음을 멈췄다. 정문 앞 아스팔트에는 전차가 남긴 바퀴 자국 한 줄이 그대로 남아 있었고, 그는 취임식 날에도 그 자국 앞에 서 있었다.\n\n\"다음 선거에는 부총리님이 나서신다는 말이 돕니다.\" 비서실장이 조심스럽게 말했지만 대통령은 대답하지 않았다. 여의도에서는 신민당의 다음 후보 이름이 이미 오르내렸고, 야당의 김무성은 그 이름에 대해 말을 아꼈다.\n\n그의 임기를 두고 개혁이 너무 빨랐다고 비판하는 사람과 빨랐기 때문에 해냈다고 평가하는 사람이 오래 다퉜다. 군을 정치에서 떼어 놓은 일만은 양쪽 모두 그의 업적으로 인정했다."
 tfrkphn.7114.a:0 "방 하나는 남긴다."
 tfrkphn.7114.t:0 "남은 방 하나"
 tfrkphn.7114.d:0 "남산 아래의 회색 청사는 조원진 정부 때 청산 위원회가 쓰던 건물이다. 지하에는 창문 없는 방이 여럿 있었고, 여의도의 사흘 동안에도 이 건물은 밤새 불을 켜 두었다.\n\n대통령은 철거를 앞두고 이 건물을 하루 동안 시민들에게 열었다. 아침 일찍부터 언덕길에 긴 줄이 늘어섰다. 대통령실은 방문객에게 지하층까지 모두 볼 수 있게 했다.\n\n\"여기, 이 방이었어요.\" 한 중년 남자가 지하 복도 끝에서 걸음을 멈추고 문틀을 손으로 쓸어 보았다. 함께 온 딸은 아무것도 묻지 않았다. 방 안에는 철제 책상 하나가 남아 있었다.\n\n건물을 남기자는 사람들은 기억하려면 건물이 있어야 한다고 했고, 허물자는 사람들은 그런 방이 다시는 없어야 한다고 했다. 대통령은 양쪽 이야기를 듣고 건물을 허물기로 하면서 지하의 방 하나는 그대로 떼어 옮겨 보존하라고 지시했다.\n\n이튿날 아침 굴착기가 들어왔고 사람들은 언덕 아래에서 철거를 지켜봤다. 그 자리에는 이듬해 작은 공원이 들어섰고, 떼어 낸 방은 공원 한쪽에 옮겨져 일반에 공개됐다."
 tfrkphn.7088.a:0 "함께 갚는다."
 tfrkphn.7088.t:0 "은행 앞의 줄"
 tfrkphn.7088.d:0 "금 모으기 운동이 시작된 첫 주 월요일 아침 시청 앞 은행 지점에는 문을 열기 한 시간 전부터 줄이 길모퉁이를 돌았다. 사람들은 손수건에 싼 금반지와 아이의 돌반지, 오래된 저금통을 들고 서 있었다.\n\n\"이거, 시어머니가 물려주신 건데요.\" 한 여자가 창구 직원에게 작은 금비녀를 내밀었다. 직원은 무게를 달다가 잠시 손을 멈췄고, 뒤에 선 사람들은 말없이 차례를 기다렸다.\n\n대통령의 책상에는 그날 모인 금의 양과 그것으로 갚을 수 있는 빚의 액수가 매일 아침 올라왔다. 그는 숫자 옆에 날짜를 적어 장부에 붙여 두었다. 첫 주에 모인 금은 예상의 세 배였고, 은행들은 금을 달 저울이 모자라 금은방에서 빌려 왔다.\n\n국무총리 김부겸은 직접 은행에 나가 줄 선 사람들과 한 사람씩 인사했고, 야당의 김무성은 운동의 취지에 반대하지 않는다는 논평을 냈다.\n\n그 겨울에 모인 금으로 갚은 빚은 전체의 작은 부분에 그쳤다. 그래도 외국 신문들이 줄 선 사람들의 사진을 일 면에 실은 뒤로 한국 국채를 사겠다는 주문이 조금씩 늘었다."
 tfrkphn.7089.a:0 "같은 숫자를 본다."
 tfrkphn.7089.t:0 "한 테이블"
 tfrkphn.7089.d:0 "노동계와 경영계, 정부 대표가 저녁 일곱 시에 한 회의실에 모였다. 노동계 대표는 해고부터 막아야 한다고 했고 경영계 대표는 임금부터 묶어야 한다고 맞섰다. 정부 쪽 자리에는 대통령이 보낸 계산서가 놓여 있었다.\n\n자정이 지나 도시락이 들어왔지만 먼저 젓가락을 드는 사람이 없었다. \"오늘 안에 안 끝나면, 다음 달 월급날이 없는 회사가 백 곳이 넘습니다.\" 정부 쪽 차관이 낮게 말했다.\n\n새벽 세 시에 잠시 밖으로 나간 노동계 대표는 복도 끝 자판기 앞에서 경영계 대표와 마주쳤다. 두 사람은 커피를 한 잔씩 뽑아 들고 한동안 말없이 서 있다가 회의실로 함께 돌아왔다.\n\n새벽 다섯 시 반에 세 대표는 일자리를 지키는 대신 임금 인상을 함께 미룬다는 합의문에 서명했다. 대통령은 그 시각에 이미 일어나 보고를 기다리고 있었다.\n\n그날 아침 신문들은 합의문 전문을 실었다. 노동계 대표는 조합원 총회에서 합의문을 설명하다가 야유를 받았고, 경영계 대표도 회원사들의 항의 전화를 종일 받았다. 합의문은 그 주 국회에 보고됐다."
 tfrkphn.7090.a:0 "기록되지 않은 밤."
 tfrkphn.7090.t:0 "세 사람의 저녁"
 tfrkphn.7090.d:0 "선거가 끝나고 처음으로 세 사람이 마포의 오래된 갈빗집 이층에서 저녁을 함께 먹었다. 대통령실은 그날 저녁 일정표를 비워 두었고 기자들은 이 자리를 알지 못했다.\n\n국무총리 김부겸이 먼저 와서 고기를 굽고 있었고 김무성은 맞은편에서 소주잔을 만지작거렸다. 늦게 온 대통령이 앉자마자 수첩부터 꺼내자 두 사람이 웃었다. 주인은 이층에 다른 손님을 받지 않았다.\n\n이야기는 실업 급여에서 시작했다. 대통령이 숫자를 하나씩 짚자 김무성은 그 돈이 어디서 나오느냐고 물었고, 김부겸은 두 사람의 잔을 채워 가며 듣고 있었다. 대통령은 자정이 지나서야 수첩을 덮었다.\n\n계단 아래의 수행 비서들은 주인이 내준 김치찌개를 나눠 먹었다. \"총리님이 오늘은 말이 없으시네.\" \"원래 저런 자리에서는 듣는 쪽이시잖아.\" 위층에서는 이따금 웃음소리가 계단을 타고 내려왔다.\n\n세 사람은 새벽 한 시에 서로 다른 계단으로 내려갔고, 이 자리에서 나눈 이야기를 아무도 기록하지 않았다. 그 주 국회는 사회 안전망 예산을 큰 다툼 없이 통과시켰다."
 tfrkphn.7091.a:0 "그 교실을 잊지 않는다."
 tfrkphn.7091.t:0 "야간대학의 교실"
 tfrkphn.7091.d:0 "대통령은 상업고등학교를 마치고 열일곱 살에 은행 창구에서 일을 시작했다. 그는 낮에는 은행에서 일하고 밤에는 야간대학에 다니면서 고시에 합격했다.\n\n기초생활 보장법이 국회를 통과한 다음 날 저녁 일곱 시, 대통령은 예고 없이 그 대학의 야간 강의실을 찾았다. 경호원들은 뒷문 밖에 섰고 학생들은 처음에는 그를 알아보지 못했다.\n\n뒷줄에는 퇴근길에 곧장 온 작업복 차림의 학생들이 앉아 있었다. 대통령은 맨 뒷자리 빈 의자에 앉아 강의를 끝까지 들었고 교수도 강의를 멈추지 않았다. 그날 강의는 회계 원리였고 교수는 칠판에 분개 문제를 풀고 있었다.\n\n\"저분, 여기 다니셨대요.\" 쉬는 시간에 한 학생이 옆자리에 속삭였다. \"그래서 뭐가 달라지는데.\" 다른 학생이 대답했다. 대통령은 그 말을 들었지만 돌아보지 않았다.\n\n강의가 끝나자 그는 학생들에게 짧게 인사하고 강의실을 나왔다. 대통령실은 다음 날 아침 야간 과정 장학금 예산을 두 배로 늘리는 안을 국회에 보냈다. 학교는 그가 앉았던 뒷자리 의자를 치우지 않고 그대로 쓰게 했다."
 tfrkphn.7092.a:0 "계산서를 접는다."
 tfrkphn.7092.t:0 "빚을 다 갚은 날"
 tfrkphn.7092.d:0 "정부가 패전 이후 진 나라 빚을 모두 갚았다고 발표했습니다. 경제부처는 오늘 오전 마지막 상환을 마쳤으며, 상환에 걸린 기간이 처음 예상보다 크게 짧았다고 밝혔습니다.\n\n대통령은 오전 열 시 춘추관에서 마지막 상환 확인서를 들어 보이며 이 빚은 국민이 갚은 것이라고 말했습니다. 발표는 오 분 남짓 걸렸습니다. 대통령은 상환에 참여한 은행과 기업, 금을 낸 시민들의 수를 차례로 읽었습니다.\n\n국무총리 김부겸은 국회에서 감사 인사를 했고, 야당 김무성 대표도 축하 논평을 냈습니다. 국회는 오후 본회의를 잠시 멈추고 박수를 쳤습니다. 본회의장 방청석에서도 박수가 나왔습니다.\n\n시청 앞 광장에는 금 모으기 운동 때 줄을 섰던 시민들이 그때 받은 확인증을 들고 다시 모였습니다. 증시는 개장과 함께 크게 올랐고 원화 가치도 패전 이후 가장 높은 수준을 기록했습니다.\n\n경제 전문가들은 빚을 다 갚았어도 수출과 일자리가 패전 이전 수준으로 돌아오려면 시간이 더 걸린다고 지적했습니다. 정부는 내일 다음 다섯 해의 재정 계획을 발표할 예정입니다."
 tfrkphn.7102.a:0 "선 위에 길을 낸다."
 tfrkphn.7102.t:0 "선이 깔리는 밤"
 tfrkphn.7102.d:0 "정부는 공장이 문을 닫은 도시들에 초고속 통신망을 깔기로 했다. 낮에는 차가 다녀야 해서 인부들은 밤마다 골목을 파고 광케이블을 묻었고, 주민들은 밤새 울리는 굴착기 소리에 항의했다. 대통령은 공사 현장을 두 번 찾았다. 그는 인부들에게 공사가 언제 끝나는지를 묻고 일정표를 받아 갔다.\n\n석 달 뒤 동네마다 컴퓨터 수십 대를 들여놓은 게임방이 문을 열었다. 일자리를 잃은 젊은이들이 그곳에서 밤을 새웠는데, 게임을 하는 사람도 있었고 그 자리에서 회사를 차린 사람도 있었다. 게임방들은 새벽 네 시에도 간판 불을 끄지 않았다.\n\n\"사장님, 이번 달 회선 요금이 반으로 줄었어요.\" 한 게임방 아르바이트생이 말했다. \"정부가 깔아 줬으니까.\" 주인이 대답했다. 계산대 옆 벽에는 정부의 정책 홍보 포스터가 반쯤 찢긴 채 붙어 있었다.\n\n국무총리 김부겸은 국회에서 통신망 예산을 지켜 냈고, 야당의 김무성은 그 돈으로 공장을 짓는 편이 낫다고 반대했다. 몇 해 뒤 이 통신망으로 사업을 시작한 회사 몇 곳이 수출 순위에 올랐다."
 tfrkphn.7103.a:0 "강을 건넌다."
 tfrkphn.7103.t:0 "얼어붙은 강"
 tfrkphn.7103.d:0 "패전 뒤로 두 나라는 정상 회담을 한 번도 열지 않았다. 대통령은 대화 정책을 시작한 지 두 해 만에 그 나라를 방문하기로 했고, 이른 아침 비행기 안에서 연설문을 세 번 고쳤다.\n\n공항에는 예정에 없이 상대국 정상이 직접 나와 있었다. 두 사람은 활주로 위에서 오래 손을 맞잡았고 사진 기자들이 셔터를 계속 눌렀다. 생중계를 보던 서울의 사무실에서는 직원들이 일손을 멈췄고 시장 상인들도 라디오를 켰다.\n\n\"정말 저렇게 손을 잡네.\" 한 방송국 보도국에서 누군가 중얼거렸지만 대답하는 사람은 없었다. 그날 저녁 뉴스는 회담 말고는 다른 기사를 거의 내보내지 않았다.\n\n국무총리 김부겸은 그날 국회에서 야당의 질문에 답했다. 김무성은 서두르지 말라고 하면서도 회담이 성과를 내기를 바란다고 말했다.\n\n두 정상은 이틀 동안 회담하고 이산가족 상봉과 철도 연결에 합의했다. 합의문에 군사 문제는 들어가지 않았고, 실무 회담 날짜는 다음 달로 잡혔다. 대통령은 돌아오는 비행기에서 합의문 사본에 날짜를 적어 수첩에 끼워 넣었다."
 tfrkphn.7104.a:0 "계산서를 넘긴다."
 tfrkphn.7104.t:0 "다시 선 나라"
 tfrkphn.7104.d:0 "임기 마지막 국무회의에서 대통령은 수첩을 펴고 다섯 해 동안 갚은 빚과 다시 연 항구, 되살린 일자리의 수를 하나씩 읽었다. 낭독은 이십 분이 걸렸고 장관들은 끝까지 조용히 들었다. 그는 숫자마다 그 일을 맡았던 장관의 이름을 함께 불렀다.\n\n국무총리 김부겸이 마지막으로 일어나 대통령에게 고맙다고 인사했다. 단일화 협상 때 신민당이 둘로 갈라질 뻔했던 다섯 주를 기억하는 장관들은 두 사람이 악수하는 모습을 한참 바라봤다.\n\n\"마지막 날까지 숫자만 보시네요.\" 비서관이 웃으며 말하자 대통령도 수첩을 덮으며 웃었다. 그는 다음 대통령에게 넘길 인수 문서의 첫 장에도 남은 과제를 숫자로 적어 두었다. 야당의 김무성은 그날 수고했다는 짧은 덕담을 보내왔다.\n\n그의 임기 동안 나라가 부유해지지는 않았다. 정부는 빚을 모두 갚았고 실업 급여와 기초생활 보장 제도를 새로 만들었다. 신문들은 이튿날 그의 임기를 계산서의 시대라는 제목으로 정리했다. 대통령은 퇴임 뒤에 쓸 사무실을 따로 마련하지 않고 살던 집으로 돌아갔다."
 tfrkphn.7108.a:0 "명단대로 정리한다."
 tfrkphn.7108.b:0 "명단을 줄이고 시간을 준다."
 tfrkphn.7108.t:0 "문 닫는 공장"
 tfrkphn.7108.d:0 "경제부처는 노사정 합의문에 서명한 지 석 달 만에 정리 대상 기업 쉰다섯 곳의 명단을 대통령에게 올렸다. 명단이 알려진 날 아침 남쪽 공단의 한 조선소 정문 앞에 작업복 차림의 노동자들이 모였고, 출근 카드를 찍는 사람은 없었다.\n\n\"스물두 해를 다녔습니다. 이번 달 월급이 나오느냐고 묻는 겁니다.\" 노조 위원장이 확성기를 잡았다. 정문 위의 크레인은 멈춰 있었고 방송 차량이 공단 길로 들어왔다.\n\n대통령은 그날 오후 명단을 다시 펴고 회사마다 남은 빚과 일자리 수를 나란히 적게 했다. 국무총리 김부겸이 찾아와 몇 곳에는 시간을 더 주자고 하자, 대통령은 끝까지 듣고 나서 시간을 주면 그 빚을 누가 갚느냐고 되물었다.\n\n대통령실은 그날 밤늦게까지 불을 끄지 못했다. 회사를 살리려고 돈을 넣으면 돈을 빌려준 은행이 위험해졌고, 은행을 지키려고 돈을 거두면 공장이 문을 닫아야 했다. 대통령은 자정이 넘도록 명단의 어느 줄에도 표시하지 못했다. 김부겸은 총리실로 돌아가 조선소 노조에 면담을 요청했다."
 tfrkphn.7093.a:0 "두 김씨가 손을 잡는다."
 tfrkphn.7093.b:0 "두 김씨가 손을 뿌리친다."
 tfrkphn.7093.t:0 "내민 손"
 tfrkphn.7093.d:0 "취임 한 달째에 대통령은 신민당의 두 김씨에게 내각의 자리를 비워 두겠다는 편지를 한 통씩 보냈다. 편지는 비서관이 봉투째 직접 들고 갔고, 대통령실은 기자들이 편지 내용을 물어도 확인해 주지 않았다.\n\n김부겸은 당사 회의실에서 편지를 여러 번 읽었고 김동연은 편지를 받은 날 저녁 약속을 모두 취소했다. 두 사람은 그 주 내내 서로 연락하지 않았고, 신민당 의원들은 편지 내용을 신문을 보고 알았다.\n\n\"받으면 들러리라는 소리를 듣고, 안 받으면 발목 잡는다는 소리를 듣습니다.\" 신민당의 한 중진이 기자들에게 털어놓았다. \"어느 쪽이든 손해죠. 그게 저 양반 정치입니다.\"\n\n대통령은 답장을 재촉하지 않고 기다렸다. 그는 젊은 시절 상도동의 사랑방에서 손님을 맞으며 정치를 배웠고, 그때부터 상대가 먼저 찾아올 때까지 기다리는 데 익숙했다.\n\n열흘째 되는 날 밤 대통령실로 전화가 왔다. 전화를 받은 비서관은 한참 듣기만 하다가 수화기를 내려놓고 대통령의 방문을 두드렸다. 대통령은 그때까지 집무실에 남아 있었다."
 tfrkphn.7094.a:0 "판은 다시 짜인다."
 tfrkphn.7094.t:0 "세 사람의 저녁"
 tfrkphn.7094.d:0 "선거가 끝나고 처음으로 세 사람이 남산 아래 복집에서 저녁을 함께 먹었다. 갈라선 두 김씨가 한자리에 앉은 것도 선거 뒤로 처음이어서, 대통령은 부산 출신 의원에게 부탁해 조용한 집을 골랐다.\n\n대통령이 먼저 와서 기다렸고 김부겸과 김동연은 오 분 간격으로 들어와 서로 눈인사만 했다. 대통령이 웃으며 두 사람의 잔에 먼저 술을 따르자 두 사람 모두 잔을 받았다.\n\n이야기는 선거구에서 시작했다. 대통령이 한 지역구에서 여러 명을 뽑자고 하자 김동연은 계산부터 해 보자고 했고, 김부겸은 지역의 벽이 낮아진다면 생각해 보겠다고 했다. 대통령은 그날 총리 자리 이야기를 꺼내지 않았다.\n\n문밖의 수행 비서들은 서로를 흘끔거렸다. \"저 두 분이 한 상에 앉는 걸 볼 줄은 몰랐네.\" \"판을 깔 줄 아는 사람이니까.\" 방 안에서는 한동안 말소리가 들리지 않았다.\n\n세 사람은 새벽 한 시에 서로 다른 문으로 나갔고, 이 자리에서 합의한 내용을 아무도 기록하지 않았다. 한 달 뒤 대통령은 신민당 출신 의원 한 명을 국무총리 후보로 지명했다."
 tfrkphn.7095.a:0 "도장을 찍는다."
 tfrkphn.7095.t:0 "도장"
 tfrkphn.7095.d:0 "김무성은 당 대표 시절 공천장에 도장을 찍지 않고 부산으로 내려가 버린 적이 있다. 여의도 사람들은 그 며칠 동안 그의 도장 하나에 여러 후보의 공천이 묶여 있었던 일을 지금도 기억한다.\n\n개헌안을 국회에 내는 날 아침 대통령의 책상에는 서류 한 묶음과 국새가 놓였다. 대통령이 서명하고 국새를 찍으면 개헌안은 그날 오후 국회로 넘어가게 되어 있었고, 기자들은 아침부터 대통령실 앞에서 기다렸다.\n\n서류를 한 장씩 넘기던 대통령은 대통령의 권한을 국회와 나눈다는 조항에서 손을 멈췄다. 그는 자기가 앉은 자리의 권한을 줄이는 조항을 한참 들여다봤다. 비서실장은 재촉하지 않고 책상 옆에 서서 기다렸다.\n\n\"찍으시면 됩니다, 각하.\" 비서실장이 낮게 말했다가 곧 고쳐 말했다. \"대통령님.\" 대통령은 웃지 않았다.\n\n열한 시 사 분에 대통령은 국새를 들어 서류에 찍었다. 비서실장은 서류를 받아 들고 곧바로 국회로 가는 차에 올랐고, 대통령실 대변인은 십 분 뒤 개헌안 제출을 발표했다. 국회의장실은 서류를 접수하고 본회의 보고 일정을 잡았다."
 tfrkphn.7096.a:0 "새 헌법을 받든다."
 tfrkphn.7096.t:0 "개헌안 통과"
 tfrkphn.7096.d:0 "의원내각제 개헌안이 국민투표에서 통과됐습니다. 중앙선거관리위원회는 오늘 새벽 개표를 마치고, 찬성이 과반을 넘었다고 발표했습니다. 투표율은 높았습니다. 찬성과 반대의 차이는 크지 않았습니다. 개표 막바지까지 결과를 몰랐습니다.\n\n새 헌법에 따라 다음 총선부터 나라의 행정은 국회가 뽑는 총리가 이끌게 됩니다. 대통령은 국가를 대표하는 자리로 남습니다. 대통령은 오전 담화에서 국민의 결정을 받들겠다고 밝혔습니다.\n\n신민당은 결과를 존중한다는 논평을 냈습니다. 김부겸 의원과 김동연 의원은 함께 기자회견을 열고, 다음 총선에 모든 것을 걸겠다고 밝혔습니다. 정치권에서는 벌써 첫 총리가 누가 될지를 두고 셈이 시작됐습니다.\n\n헌법학자들은 이번 개헌이 패전과 포격을 겪은 나라가 권력을 한 사람에게 맡기지 않기로 한 결정이라고 평가했습니다. 반면 정치가 국회 안의 거래로 흘러갈 것이라는 우려도 나왔습니다.\n\n대통령은 그날 저녁 일찍 관저로 돌아갔습니다. 관저의 불은 평소보다 일찍 꺼졌습니다. 대통령실은 다음 날 일정을 모두 비웠다고 밝혔습니다."
 tfrkphn.7098.a:0 "국민의 뜻을 받든다."
 tfrkphn.7098.t:0 "개헌안 부결"
 tfrkphn.7098.d:0 "의원내각제 개헌안이 국민투표에서 부결됐습니다. 중앙선거관리위원회는 오늘 새벽 개표를 마치고, 반대가 과반을 넘었다고 발표했습니다. 대통령이 임기를 걸고 추진한 개헌이 끝내 좌절됐습니다.\n\n대통령은 오전 담화에서 국민의 뜻을 겸허히 받아들인다고 밝혔습니다. 대통령은 남은 임기 동안 개헌을 다시 추진하지 않겠다고 말했습니다. 담화는 이 분이 채 되지 않았습니다. 대통령실 앞은 하루 종일 조용했습니다.\n\n신민당은 국민이 권력 나눠 먹기를 거부한 것이라는 논평을 냈습니다. 김부겸 의원과 김동연 의원은 각자 따로 입장을 냈습니다. 연정 안에서도 대통령의 책임을 묻는 목소리가 나오기 시작했습니다.\n\n정치권에서는 대통령이 사실상 정치적 힘을 잃었다는 분석이 나왔습니다. 여의도에서는 벌써 다음 대통령 선거를 두고 셈이 시작됐습니다. 연정의 원로들은 대통령실의 전화를 받지 않았습니다.\n\n대통령은 그날 저녁 아무 일정도 잡지 않았습니다. 관저의 불은 새벽까지 꺼지지 않았습니다. 판을 쥐었던 사람이 처음으로 판 밖에서 밤을 보냈습니다."
 tfrkphn.7097.a:0 "해는 질 때 가장 붉다."
 tfrkphn.7097.t:0 "서쪽 하늘"
 tfrkphn.7097.d:0 "임기의 마지막 가을에 대통령은 부산에 내려가 영도 앞바다가 보이는 언덕에 올랐다. 영도는 그가 마지막으로 국회의원에 당선된 지역구다. 그는 수행원들을 언덕 아래에 두고 혼자 올라갔다.\n\n그는 젊은 시절 상도동의 사랑방에서 손님을 맞았고 당 대표가 된 뒤에는 다른 사람을 후보로 세우는 일을 했다. 그런 자신이 대통령 자리에 앉게 될 줄은 그도 예상하지 못했다.\n\n\"이제 서울로 올라가시죠.\" 비서관이 조심스럽게 말했다. 대통령은 고개를 끄덕이고도 움직이지 않았다. 해가 바다 위로 내려가고 멀리서 뱃고동이 울렸다. 언덕 아래 부두에서는 어선들이 그물을 싣고 있었다.\n\n차 옆에서 기다리던 나이 든 운전기사가 김소월의 초혼 한 구절을 혼잣말처럼 읊었다. \"붉은 해는 서산마루에 걸리었다.\"\n\n대통령은 해가 다 진 뒤에야 차에 올랐다. 서울에서는 그가 떠난 뒤의 당권을 두고 헌정회복연대 의원들이 벌써 모임을 갖고 있었고, 신민당도 다음 선거 준비를 시작했다. 신문들은 그의 임기를 판을 쥔 사람의 시대라는 제목으로 정리했다."
 tfrkphn.7105.a:0 "한 지붕 아래 모은다."
 tfrkphn.7105.t:0 "한 지붕"
 tfrkphn.7105.d:0 "보수 정치인들은 패전과 국회 포격 사건을 거치며 여러 갈래로 흩어졌다. 대통령은 취임 넉 달 만에 영남과 충청의 원로들, 젊은 소장파 의원들을 관저로 불러 한 방에 앉혔다.\n\n그 가운데 몇 사람은 십 년 넘게 서로 말을 하지 않은 사이여서, 부산에서 올라온 생선회가 식탁에 놓이고 젓가락이 오가는 동안에도 대화가 없었다. 한 원로는 옆자리 의원이 따라 주는 술을 받지 않았다.\n\n대통령은 먼저 말을 꺼내지 않고 사람들이 서로에게 쌓인 불만을 털어놓는 것을 끝까지 들었다. 자정이 가까워져 목소리들이 낮아지자 그는 술병을 들고 한 사람씩 잔을 채웠다.\n\n\"결국은 저 양반 판에 다 들어간 거네.\" 관저를 나서며 한 소장파 의원이 투덜거렸다. \"들어가 보니 따뜻하잖아.\" 옆에 선 원로가 웃었다.\n\n한 달 뒤 대통령은 보수 대연합을 발표했다. 거리에서 집회를 이어 가던 극우 단체들은 연합에 들어오지 못했고, 신민당의 두 김씨는 그날 따로 논평을 냈다. 연합에 들어온 의원들은 이튿날부터 헌정회복연대의 이름으로 원내 회의를 함께 열었다."
 tfrkphn.7106.a:0 "계획표를 따른다."
 tfrkphn.7106.t:0 "계획표"
 tfrkphn.7106.d:0 "경제 부처 대회의실 벽에 사람 키보다 큰 계획표가 걸렸다. 계획표에는 다섯 해 동안 지을 공단과 항만, 도로가 연도별로 적혀 있었다. 대통령은 계획표 앞에 한참 서 있다가 한 칸을 손가락으로 짚었다. 기자들은 그 장면을 사진으로 찍었다.\n\n\"이 항만은 두 해 앞당기시죠.\" 대통령이 짚은 항만은 예산도 부지도 정해지지 않은 사업이어서 실무자들의 얼굴이 굳었다. 장관은 무언가 말하려다 그만두었고, 경제 부처 직원들은 그날 밤늦게까지 일정을 다시 짰다.\n\n신민당은 계획표가 옛날 방식이라고 비판했다. 김동연은 숫자가 맞지 않는다고 지적했고 김부겸은 사업이 한 지역에 쏠렸다고 지적했다. 대통령이 두 사람의 지적대로 계획표의 두 칸을 고치자 신민당은 그 뒤로는 더 비판하지 않았다.\n\n계획표의 사업을 정부가 모두 끝내지는 못했다. 그래도 그 다섯 해 동안 공단들은 주문이 끊기지 않아 밤에도 공장을 돌렸다. 항만은 계획보다 한 해 늦게, 원래 일정보다는 한 해 일찍 문을 열었다. 계획표는 지금도 그 회의실 벽에 걸려 있다."
 tfrkphn.7107.a:0 "셈은 끝났다."
 tfrkphn.7107.t:0 "둘로 나뉜 거리"
 tfrkphn.7107.d:0 "개헌안이 국회를 통과한 날부터 광장에서는 찬성 집회와 반대 집회가 번갈아 열렸다. 찬성하는 사람들은 다시는 한 사람에게 모든 권력을 맡기지 말자고 했고, 반대하는 사람들은 국회의원들이 나라를 나눠 가지려 한다고 했다. 텔레비전 토론은 매일 자정을 넘겼다. 저녁 식탁에서 찬반을 두고 다투는 집도 많았다.\n\n신민당은 반대 운동에 앞장섰다. 갈라선 김부겸과 김동연이 선거 뒤 처음으로 같은 연단에 올라 개헌 반대 연설을 했다. 두 사람은 연설을 마치고 악수했지만 서로 다른 차를 타고 돌아갔다.\n\n\"이번엔 진짜 모르겠습니다.\" 한 여론조사 기관의 연구원이 기자에게 말했다. \"찬반 차이가 매일 뒤집혀요.\" 마지막 주 조사에서도 찬반은 오차 범위 안에 있었고, 기관들은 투표율이 결과를 가른다고 내다봤다.\n\n대통령은 운동 기간 내내 연단에 서지 않고 원로와 학자들에게 찬성 연설을 맡겼다. 기자들은 대통령이 나서지 않는 이유를 날마다 다르게 해석했다. 대통령은 투표 전날 밤 관저에서 지역별 예상 득표를 적은 개표 시나리오를 혼자 읽었다."
 tfrkphn.7109.a:0 "내려놓았을 뿐이다."
 tfrkphn.7109.t:0 "멈춘 칼"
 tfrkphn.7109.d:0 "대통령이 개혁의 속도를 늦춘 지 석 달이 지나자 멈췄던 투자가 돌아왔고 성장률 전망도 조금씩 올라갔다. 부총리 김동연은 국무회의에서 처음으로 웃었다.\n\n사정이 느슨해지자 수사를 받던 사람들이 다시 공개 석상에 나오기 시작했다. \"수사가 다 끝난 겁니까.\" 한 기자가 검찰청 앞에서 물었지만 대변인은 대답하지 않고 시계를 봤다. 그 주에만 피의자 세 명이 무혐의로 풀려났다.\n\n대통령은 그 보고서를 끝까지 읽고 참모들에게 때가 되면 수사를 다시 시작하겠다고 말했다. 참모들은 고개를 끄덕였지만 그때가 언제냐고 묻는 사람은 없었다. 김무성은 늦었지만 옳은 결정이라는 논평을 냈다.\n\n개혁을 바라던 사람들은 실망했고 대통령의 지지율은 그해 겨울 처음으로 절반 아래로 내려갔다. 신민당의 젊은 의원 몇 사람은 당사 앞에서 수사를 다시 시작하라는 성명을 읽었다. 무혐의로 풀려난 전직 장관 한 사람은 그 주말 방송에 나와 수사가 처음부터 무리였다고 주장했다. 검찰 수사팀의 검사 두 명은 인사 발령을 받고 지방으로 내려갔다."
 tfrkphn.7110.a:0 "칼끝은 휘지 않는다."
 tfrkphn.7110.t:0 "베인 자리"
 tfrkphn.7110.d:0 "대통령은 속도를 늦추지 않았고 사정은 재벌 회장실과 장관 집무실까지 올라갔다. 한 달 사이에 장관 두 명이 물러났고 연정 의원 세 명이 검찰에 소환됐다.\n\n신문들은 매일 아침 새 이름을 일 면에 실었다. 시민들은 박수를 쳤지만 기업들은 투자를 미뤘다. \"이번 분기 신규 채용은 없습니다.\" 한 대기업 인사팀장이 회의에서 말했다. 공단의 하청 업체들은 대금 결제를 두 달씩 늦췄고 대학가 게시판에서는 채용 공고가 사라졌다.\n\n부총리 김동연은 속도를 늦추자는 말을 다시 꺼내지 않고 실업 대책 예산안을 만들어 올렸다. 대통령은 그 예산안에 바로 서명했고, 김무성은 국회에서 개혁의 속도를 다시 생각해 달라고 요구했다.\n\n그해 겨울까지 차명 계좌의 절반이 실명으로 바뀌었고 일자리는 열 개에 하나꼴로 사라졌다. 대통령은 연말 회견에서 일자리를 잃은 사람들에게 사과했지만 수사를 멈추겠다는 말은 하지 않았다. 검찰은 이듬해 봄까지 전직 장관 두 명과 재벌 회장 세 명을 재판에 넘겼고, 실업 급여 창구 앞의 줄은 그때까지 줄지 않았다."
 tfrkphn.7111.a:0 "부총리에게 맡긴다."
 tfrkphn.7111.t:0 "새벽의 전화"
 tfrkphn.7111.d:0 "축하연을 연 지 두 달 뒤 새벽 네 시에 부총리 김동연이 대통령 관저로 전화를 걸었다. 나라 밖에서 빌린 단기 외채의 만기가 한꺼번에 돌아왔는데 외국 은행들이 연장을 거절했고, 남은 외화로는 석 주를 버티기 어렵다는 보고였다. 그날 환율은 장이 열리자마자 치솟았다.\n\n\"축배 날 그 수첩, 그거였습니까.\" 비서실장이 낮게 물었다. 부총리는 대답하지 않고 서류 가방에서 두 달 전의 수첩을 꺼내 귀퉁이를 접어 둔 쪽을 펼쳤다.\n\n대통령은 긴급 경제 회의를 소집했지만 회의 내내 거의 말하지 않았다. 그는 회의를 마치면서 외환 위기 대응의 모든 권한을 부총리에게 맡긴다고 지시했다. 야당의 김무성은 그날 오후 정쟁을 멈추고 정부를 돕겠다고 발표했다.\n\n그 겨울 은행 앞에는 예금을 찾으려는 사람들이 길게 줄을 섰다. 김동연은 외국 은행들을 차례로 찾아가 만기 연장을 협상했고, 대통령은 겨울이 끝날 때까지 축하연 이야기를 입에 올리지 않았다. 정부는 그 주에 은행 두 곳의 영업을 정지시키고 예금 지급을 보증한다고 발표했다."
 tfrkphn.7112.a:0 "조용한 겨울로 남긴다."
 tfrkphn.7112.t:0 "조용한 겨울"
 tfrkphn.7112.d:0 "축하연 다음 날 아침 대통령은 단기 외채가 석 달째 늘고 있다는 부총리의 보고를 끝까지 들었다. 부총리는 그날 오후부터 은행장들을 한 사람씩 불러 만기가 짧은 빚을 긴 빚으로 바꾸게 했고 외화 보유액도 조금씩 늘렸다. 대통령은 보고가 끝나자 필요한 조치를 바로 시작하라고 지시했다.\n\n\"축하 분위기에 찬물을 끼얹는다고 말이 많습니다.\" 차관이 신문을 내밀었다. 사설은 정부가 지나치게 몸을 사린다고 비판했지만 부총리는 신문을 접어 서랍에 넣었다.\n\n두 달 뒤 이웃 나라들의 환율이 차례로 폭락했고 외국 은행들은 그 나라들에서 앞다투어 돈을 빼 갔다. 한국의 환율도 며칠 흔들렸지만 외화 보유액이 넉넉해서 수출 기업들은 그 주에 계약을 한 건도 잃지 않았다. 부총리는 그 며칠 동안 외환 시장이 닫힐 때까지 사무실을 떠나지 않았다.\n\n김무성은 국회에서 정부가 미리 대비한 것을 인정한다고 말했다. 위기가 오지 않았기 때문에 신문들은 그 겨울을 거의 다루지 않았다. 부총리는 사설을 넣어 둔 서랍을 임기가 끝날 때까지 비우지 않았다."
 tfrkphn.7113.a:0 "숫자를 기다린다."
 tfrkphn.7113.t:0 "개표의 밤"
 tfrkphn.7113.d:0 "투표가 끝난 저녁 여섯 시에 방송사들이 개표 방송을 시작했다. 찬성과 반대의 막대그래프는 밤새 엎치락뒤치락했는데, 영남과 충청에서는 찬성이 앞섰고 수도권과 호남에서는 반대가 앞섰다. 신민당 당사에서도 헌정회복연대 당사에서도 자리를 뜨는 사람이 없었다.\n\n\"아직 모릅니다. 서울이 다 열려야 압니다.\" 개표 상황실의 한 연구원이 전화기에 대고 말했다. 그의 책상에는 식은 커피 잔이 세 개 놓여 있었다. 그는 지역별 개표율을 적은 표를 십 분마다 새로 뽑았다.\n\n대통령은 관저에서 텔레비전을 꺼 두고 있었다. 비서관이 삼십 분마다 숫자를 적은 쪽지를 들고 들어오면 그는 한 번 보고 접어서 탁자에 쌓았다. 자정 무렵에는 쪽지가 열 장을 넘었지만 그는 쌓아 둔 쪽지를 다시 펴 보지 않았다.\n\n새벽 한 시에 마지막 개표함이 열렸다. 방송사 앵커는 최종 집계가 곧 나온다고 알리고 화면을 중앙선거관리위원회로 넘겼다. 관저에서는 비서관이 마지막 쪽지를 들고 대통령의 방으로 걸어갔다. 광장에서 개표를 지켜보던 사람들도 조용해졌다."
 tfrkphn.7115.a:0 "막이 내린다."
 tfrkphn.7115.t:0 "문을 나서는 날"
 tfrkphn.7115.d:0 "찌직, 찌이익. 청테이프 뜯기는 소리가 집무실을 울렸다. 비서실장은 소파에 멀뚱히 앉아 있었다. 앉을 수는 없다며 거절했지만 김부겸이 고집을 부린 탓에 어쩔 수 없이 앉은 참이었다. 서랍 네 칸을 다 털었는데도 종이상자 하나가 채 안 찼다. 돋보기 두 개와 먹다 남은 위장약 위로 누렇게 구겨진 봉투 하나가 얹혔다. 김동연이 던지고 간 사표였다.\n\n\"그건 파쇄기로 넘길까요?\" 이때다 싶어 비서실장이 벌떡 일어서며 물었다. \"뭘 버려요. 부적 같은 건데.\" 김부겸이 짧게 웃으며 봉투를 상자 맨 밑으로 밀어 넣었다. 비서실장은 더 묻지 않았다. 대신 책상 구석에 따로 묶어 둔 서류 뭉치를 집어 들었다. \"이쪽은 말씀하신 대로 처리하겠습니다.\" \"재도 남기지 말고.\" \"예.\"\n\n비서실장이 두툼한 한지 봉투 하나를 책상 모서리에 내려놓았다. 이낙연 전 총리 명의였다. \"아침에 부총리실하고 김무성 대표 쪽으로도 똑같은 게 갔답니다.\" 김부겸이 봉투를 뜯어 알맹이를 훑었다. 세 사람이 다투던 세월보다 함께 버틴 세월이 더 길었다는 문장이 한가운데 박혀 있었다. 피식 웃음이 새어 나왔다. 프린터로 뽑은 본문 위에 수신인 이름 석 자만 먹물로 채워 넣은 복사본이었다. 김부겸 이름 세 자를 만져 보니 오돌토돌하지 않고 평평한 게 그 조차도 아니었다. 이름 석 자도 프린터 출신이었다.\n\n함께 버텼다는 말부터가 코미디였다. 당 간판 하나 걸기까지 다섯 주 동안 밀실에서 대의원 머릿수를 두고 피를 말렸다. 예산철마다 김무성은 내각제 청구서를 들이밀었다. 대구에 내려간 홍준표도 잊을 만하면 마이크를 잡고 속을 긁었다. 김부겸은 편지를 도로 접어 파쇄함 위에 툭 던졌다. \"당사 쪽은 어떻답니까?\" \"부총리님 캠프랑 총리님 쪽 사람들이 아침부터 기자실 앞자리를 두고 신경전입니다.\"\n\n\"내일부터는 내 알 바 아니지. 한 우산을 쓰든 우산 들고 싸우든 알아서들 하라 그래요.\" 김부겸이 상자 날개를 접고 테이프를 길게 당겨 이음매를 붙였다. 비서실장이 손을 내밀었으나 김부겸은 상자를 직접 옆구리에 끼웠다. 가볍지만 무거웠다, 대구에서 낙선했던 그 날들 처럼. 문고리를 잡은 등 뒤로 비서실장이 책상 위에 엎어진 편지를 가리키며 물었다. \"저건 안 챙기십니까?\" 김부겸이 문을 밀며 답했다. \"같이 태워요.\"\n\n재도 남기지 말고."
 tfrkphn.7116.a:0 "막이 내린다."
 tfrkphn.7116.t:0 "마지막 장부"
 tfrkphn.7116.d:0 "임기 마지막 날에도 대통령은 여느 날처럼 새벽 다섯 시에 일어나 환율과 외환 보유액부터 확인했다. 그는 열일곱 살에 은행 창구에서 일을 시작한 뒤로 날마다 숫자를 확인하고 하루를 시작했다. 그날 숫자에는 특별한 변동이 없었다.\n\n국무총리 김부겸은 대구로 내려가는 기차표를 미리 끊어 두었고 야당의 김무성은 부산의 바닷가에 내려가 있었다. 오후에는 정계를 떠나 있던 이낙연 전 국무총리가 세 사람에게 똑같은 편지를 한 통씩 보냈다.\n\n이낙연은 편지에서 셈은 세 사람이 잘했으니 이제 셈 밖의 것을 다음 사람들에게 가르쳐 달라고 부탁했다. 편지에는 세 사람이 서로 다툰 세월보다 함께 버틴 세월이 더 길었다는 말도 적혀 있었다.\n\n해 질 무렵 대통령은 수첩 한 권을 들고 청사를 나섰다. 그는 걸음을 멈추지 않고 차까지 걸어갔다. 길가 가게의 라디오에서는 한용운의 님의 침묵이 흘러나왔다. \"아아, 님은 갔지마는 나는 님을 보내지 아니하였습니다.\" 신문들은 이튿날 세 사람이 함께 정치를 한 세월을 세 사람의 시대라는 제목으로 정리했다.[TFRKPHN_end_7116_mech][TFRKPHN_end_7116_prom][TFRKPHN_end_7116_hong]"
 tfrkphn.7118.a:0 "막이 내린다."
 tfrkphn.7118.t:0 "노을 뒤"
 tfrkphn.7118.d:0 "유비, 관우, 장비. 복숭아 나무 아래에서...\n\n나이가 먹어서 그런가, 두 김씨를 기다리는 김무성의 머릿속에는 유치한 노래 가사가 흘러나오고 있었다. 비록 복숭아 나무도 아니고 술잔을 나누는 것도 아니지만, 감나무 밑에서 차 한잔씩 하는 것도 꽤 운치있는 광경이 아닌가? 그것도 세 명의 김씨가 말이다.\n\n먼저 도착한 김부겸과 뒤늦게 마당에 들어선 김동연의 표정이 동시에 굳었다. 둘 다 단둘이 보는 자리인 줄 알고 온 얼굴이었다. 김무성만 태연하게 주전자를 기울여 세 번째 잔을 채웠다.\n\n\"방 놔두고 왜 찬 바람 부는 데서 부르십니까.\" 김동연이 외투 깃을 여미며 김무성의 반대편으로 의자를 당겨 앉았다. \"안에는 짐 빼느라 먼지가 날려서 그래. 거 앉아요.\" 김부겸이 마주 앉은 두 사람을 번갈아 보더니 입을 열었다. \"...5년 전이 생각나네요. 그 동안 불러주시지도 않다가 이제 와서 왜 이러십니까.\" \"당연하지. 임기 중에 둘을 같이 불렀으면 단가가 네 배로 뛰었을 텐데 내가 미쳤다고 같이 부르나.\"\n\n다과 접시 밑에 깔린 흰 봉투 모서리가 바람에 팔락거렸다. 이낙연 전 총리의 낯익은 필체였다. 김부겸이 눈짓으로 접시 밑을 가리켰다. \"저 양반 부지런하기도 하시네. 여기도 왔습니까?\" \"왔지. 동연 씨도 받았을 거 아냐.\" 김동연은 대답 대신 찻물만 한 모금 축였다.\n\n\"고생은 하셨습니다.\" 침묵이 길어지자 김부겸이 예의상 한마디를 건넸다. 김무성이 귤껍질을 까며 껄껄 웃었다. \"고생은.\" 김동연의 미간이 미세하게 구겨졌다. 츄웁 소리를 내며 차 한 잔을 들이킨 김무성이 말을 이었다. \"내가 이 지붕 밑에 들어오고 삼일 만에 후회했어요, 삼일. 뭘 그렇게 후회했는지 압니까?\" \"뭡니까.\" 또다시 김부겸이 예의상 되물었다.\n\n\"자네 둘이 싸우는 걸 못 말린거야 내가. 내가 조금 더 열심히 말려서 단일화가 됐으면은, 이 지옥같은 삶도 겪을 필요가 없었을 거 아냐?\"\n김부겸은 못 들은 척 빈 나뭇가지만 올려다보았다. 김동연은 놀란듯 김무성의 눈만 쳐다보고 있었다. \"덕분에 평생 해 볼 셈은 원 없이 다 해 보고 나갑니다.\"\n\n창문 너머로 인부들이 마지막 소파를 들어내는 모습이 스쳤다. 김부겸이 바지에 붙은 마른 잎을 털며 먼저 일어서다가, 김동연이 차 한 잔을 더 따르기 시작하는 모습을 보고 털썩 주저앉았다. 잠시 뒤, 빈 찻잔 세 개를 포개 들던 김무성이 두 사람의 등을 향해 툭 던졌다.\n\n이번엔 싸우지들 말고."
 TFRKPHN_kbg_t_01:0 "대구에서 온 대통령"
 TFRKPHN_kbg_t_01_desc:0 "지역의 벽을 넘겠다던 사람이 그 벽 위에서 당선됐습니다. 새 대통령은 개혁은 빨리, 한 번에 해야 한다고 믿습니다."
 TFRKPHN_kbg_t_02:0 "군 사조직 해체"
 TFRKPHN_kbg_t_02_desc:0 "여의도의 사흘 동안 명령을 주고받은 군 안의 사조직을 하루아침에 해체합니다. 취임 열하루째 되는 날 아침, 명단에 오른 장성들은 출근하자마자 전역 통지서를 받습니다."
 TFRKPHN_kbg_t_03:0 "별을 떼는 날"
 TFRKPHN_kbg_t_03_desc:0 "사조직에 몸담았던 장군들의 별을 모두 뗍니다. 군복을 벗은 장군의 수가 하루에 이렇게 많았던 적은 없었습니다."
 TFRKPHN_kbg_t_04:0 "문민의 군대"
 TFRKPHN_kbg_t_04_desc:0 "군의 인사와 예산을 국회가 감시하는 법을 만듭니다. 다시는 전차가 여의도로 들어오지 못하게 합니다."
 TFRKPHN_kbg_t_13:0 "역사 바로 세우기"
 TFRKPHN_kbg_t_13_desc:0 "긴급명령과 포격의 명령 계통에 있던 사람들을 모두 법정에 세웁니다. 대통령을 지낸 사람도 예외가 아닙니다. 덮지 않고 따지는 것이 이 정부의 방식입니다."
 TFRKPHN_kbg_t_16:0 "낡은 청사를 허물다"
 TFRKPHN_kbg_t_16_desc:0 "청산 위원회가 쓰던 건물을 허뭅니다. 남겨 두자는 사람과 허물자는 사람이 오래 다퉜지만, 대통령은 허무는 쪽을 골랐습니다. 자리에는 작은 공원이 들어섭니다."
 TFRKPHN_kbg_t_05:0 "금융 실명 개혁"
 TFRKPHN_kbg_t_05_desc:0 "밤 여덟 시, 대통령이 예고 없이 특별 담화를 엽니다. 내일부터 모든 금융 거래는 실제 이름으로만 할 수 있습니다. 패전 동안 숨어 있던 돈이 하나둘 드러나기 시작합니다."
 TFRKPHN_kbg_t_06:0 "숨은 돈 수사"
 TFRKPHN_kbg_t_06_desc:0 "패전 책임자들과 재벌이 빼돌린 돈을 끝까지 추적합니다. 검찰과 국세청이 같은 명단을 들고 움직입니다."
 TFRKPHN_kbg_t_07:0 "공직자 재산 공개"
 TFRKPHN_kbg_t_07_desc:0 "대통령부터 장관, 국회의원까지 모든 고위 공직자의 재산을 공개합니다. 대통령이 가장 먼저 자기 재산 목록을 내놓습니다."
 TFRKPHN_kbg_t_18:0 "사정의 바람"
 TFRKPHN_kbg_t_18_desc:0 "공직 사회 전체에 사정의 바람이 붑니다. 장관과 국회의원, 장성들이 줄줄이 조사를 받습니다. 정치권 누구도 안전하지 않습니다."
 TFRKPHN_kbg_t_08:0 "영호남 화해"
 TFRKPHN_kbg_t_08_desc:0 "대구와 광주의 시장이 서로의 도시를 찾아 같은 날 같은 자리에서 손을 잡습니다. 대통령은 두 도시 사이에 놓을 다리를 약속합니다."
 TFRKPHN_kbg_t_09:0 "지역주의 타파 선거법"
 TFRKPHN_kbg_t_09_desc:0 "한 지역을 한 정당이 독차지하지 못하도록 선거법을 고칩니다. 정책으로 표를 얻어야 하는 선거가 시작됩니다."
 TFRKPHN_kbg_t_15:0 "지방자치 전면 실시"
 TFRKPHN_kbg_t_15_desc:0 "시장과 도지사, 군수까지 모두 주민이 직접 뽑게 합니다. 중앙이 임명하던 자리를 지역에 돌려줍니다."
 TFRKPHN_kbg_t_14:0 "칼국수 오찬"
 TFRKPHN_kbg_t_14_desc:0 "대통령실 오찬 상에는 칼국수 한 그릇만 오릅니다. 봉투와 접대를 끊겠다는 대통령의 신호를 정치권 모두가 알아듣습니다."
 TFRKPHN_kbg_t_10:0 "개혁의 역풍"
 TFRKPHN_kbg_t_10_desc:0 "빠른 개혁에는 값이 따릅니다. 돈줄이 막힌 기업들이 투자를 멈추고, 군과 관료 사회에 불만이 쌓입니다. 대통령은 속도를 늦추지 않기로 합니다."
 TFRKPHN_kbg_t_11:0 "세계로"
 TFRKPHN_kbg_t_11_desc:0 "닫혔던 항구와 시장을 다시 엽니다. 패전국이라는 이름 대신 개혁한 나라라는 이름으로 세계에 나섭니다."
 TFRKPHN_kbg_t_17:0 "선진국 클럽 가입"
 TFRKPHN_kbg_t_17_desc:0 "잘사는 나라들의 경제 협의체에 가입합니다. 패전국에서 선진국 클럽 회원국이 되기까지 걸린 시간을 신문들이 앞다투어 셉니다."
 TFRKPHN_kbg_t_12:0 "개혁의 완성"
 TFRKPHN_kbg_t_12_desc:0 "군과 돈과 지역, 세 개의 벽을 넘었습니다. 다음 대통령은 이 나라를 물려받을 것입니다."
 TFRKPHN_kdy_t_01:0 "계산서를 든 대통령"
 TFRKPHN_kdy_t_01_desc:0 "긴 겨울을 견디며 올라온 사람이 대통령이 됐습니다. 상업고등학교와 야간대학을 거친 관료가 이제 패전의 빚을 갚는 나라의 맨 앞에 섭니다. 그는 재건은 느려도 확실해야 한다고 믿습니다."
 TFRKPHN_kdy_t_02:0 "계산서를 펼치다"
 TFRKPHN_kdy_t_02_desc:0 "나라가 진 빚을 모두 한 장에 정리해 국민에게 공개합니다. 숫자는 무겁지만, 숫자를 아는 것이 갚는 일의 시작입니다."
 TFRKPHN_kdy_t_03:0 "나라 빚 갚기 운동"
 TFRKPHN_kdy_t_03_desc:0 "시민들이 장롱 속 금붙이와 저금통을 들고 은행 앞에 줄을 섭니다. 정부는 모인 돈을 한 푼도 다른 데 쓰지 않겠다고 약속합니다."
 TFRKPHN_kdy_t_14:0 "외환 보유고 회복"
 TFRKPHN_kdy_t_14_desc:0 "바닥났던 나라 곳간에 다시 외화가 쌓이기 시작합니다. 대통령은 매달 그 숫자를 직접 발표합니다."
 TFRKPHN_kdy_t_04:0 "빚을 다 갚은 날"
 TFRKPHN_kdy_t_04_desc:0 "패전의 빚 마지막 한 장이 상환됩니다. 대통령은 그날 계산서를 접어 국회 도서관에 보냅니다."
 TFRKPHN_kdy_t_05:0 "노사정 대타협"
 TFRKPHN_kdy_t_05_desc:0 "노동계와 경영계, 정부가 한 테이블에 앉습니다. 일자리를 지키는 대신 임금을 함께 참기로 합니다."
 TFRKPHN_kdy_t_06:0 "부실 기업 정리"
 TFRKPHN_kdy_t_06_desc:0 "패전으로 무너진 기업들 가운데 살릴 곳과 정리할 곳을 나눕니다. 아픈 결정이지만 미루면 더 아픕니다."
 TFRKPHN_kdy_t_07:0 "사회 안전망 확대"
 TFRKPHN_kdy_t_07_desc:0 "일자리를 잃은 사람들이 다시 일어설 때까지 받칠 그물을 넓힙니다. 실업 급여와 직업 훈련을 함께 늘립니다."
 TFRKPHN_kdy_t_15:0 "기초생활 보장"
 TFRKPHN_kdy_t_15_desc:0 "일할 수 없는 사람에게도 최소한의 생활을 나라가 보장합니다. 이 보장을 국민의 권리로 법에 적습니다."
 TFRKPHN_kdy_t_16:0 "국가인권위원회"
 TFRKPHN_kdy_t_16_desc:0 "국가 권력이 사람을 함부로 다루지 못하도록 독립된 인권 기구를 세웁니다. 여의도의 사흘을 겪은 나라에 필요한 기구입니다."
 TFRKPHN_kdy_t_08:0 "벤처 특별법"
 TFRKPHN_kdy_t_08_desc:0 "젊은 기업들이 빚 걱정 없이 시작할 수 있도록 세금과 규제를 덜어 줍니다. 끊긴 수출의 빈자리를 새 산업으로 채웁니다."
 TFRKPHN_kdy_t_09:0 "새 산업 지도"
 TFRKPHN_kdy_t_09_desc:0 "반도체와 배터리, 조선의 지도를 다시 그립니다. 패전으로 잃은 공장 대신 새 공장이 들어설 자리를 정합니다."
 TFRKPHN_kdy_t_13:0 "초고속 통신망"
 TFRKPHN_kdy_t_13_desc:0 "전국에 초고속 통신망을 깝니다. 공장이 무너진 자리에 회선이 들어가고, 젊은이들은 그 회선 위에서 새 회사를 차립니다."
 TFRKPHN_kdy_t_17:0 "전자 정부"
 TFRKPHN_kdy_t_17_desc:0 "민원과 세금, 행정을 모두 회선 위로 옮깁니다. 관청에 가지 않아도 되는 나라가 시작됩니다."
 TFRKPHN_kdy_t_10:0 "볕이 드는 문"
 TFRKPHN_kdy_t_10_desc:0 "패전의 상대였던 나라에 얼어붙은 문을 엽니다. 바람으로 외투를 벗기지 못한다면 볕으로 벗기겠다는 것이 대통령의 셈입니다. 원한보다 시장이 먼저입니다."
 TFRKPHN_kdy_t_18:0 "정상회담"
 TFRKPHN_kdy_t_18_desc:0 "얼어붙었던 이웃 나라의 정상과 마주 앉습니다. 두 정상이 손을 맞잡는 사진이 세계로 퍼집니다."
 TFRKPHN_kdy_t_11:0 "무역의 다리"
 TFRKPHN_kdy_t_11_desc:0 "닫혔던 항구가 다시 열리고, 수출선이 바다로 나갑니다. 무역의 다리가 다시 놓입니다."
 TFRKPHN_kdy_t_12:0 "다시 선 나라"
 TFRKPHN_kdy_t_12_desc:0 "빚을 갚고 공장을 다시 세웠습니다. 다음 대통령은 빚 없는 나라를 물려받을 것입니다."
 TFRKPHN_kms_t_01:0 "판을 쥔 사람"
 TFRKPHN_kms_t_01_desc:0 "갈라진 두 김씨 사이로 보수 원로가 대통령이 됐습니다. 판을 가르던 사람이 이제 판의 한가운데에 섰습니다."
 TFRKPHN_kms_t_02:0 "보수의 재건"
 TFRKPHN_kms_t_02_desc:0 "무너졌던 보수 정당들을 다시 한 지붕 아래로 모읍니다. 거리의 극우와는 선을 긋습니다."
 TFRKPHN_kms_t_11:0 "보수 대연합"
 TFRKPHN_kms_t_11_desc:0 "흩어진 보수 세력들을 하나의 연합으로 묶습니다. 원로와 소장파, 영남과 충청을 한 지붕 아래 앉힙니다."
 TFRKPHN_kms_t_03:0 "안보 우선"
 TFRKPHN_kms_t_03_desc:0 "패전 뒤 흔들린 국방을 다시 세웁니다. 군을 정상으로 돌리되, 다시는 정치에 쓰지 않습니다."
 TFRKPHN_kms_t_16:0 "국방 개혁"
 TFRKPHN_kms_t_16_desc:0 "패전에서 배운 것을 군에 새깁니다. 병력보다 장비와 훈련을, 규모보다 쓸모를 앞세웁니다."
 TFRKPHN_kms_t_06:0 "두 김씨에게 내민 손"
 TFRKPHN_kms_t_06_desc:0 "패배한 두 김씨에게 함께 일하자고 손을 내밉니다. 평생 누구를 세우느냐로 판을 가르던 사람이 이제는 손을 내미는 자리에 섰습니다. 받아들이든 거절하든, 그 손을 내민 사람은 대통령입니다."
 TFRKPHN_kms_t_12:0 "총리 지명 정치"
 TFRKPHN_kms_t_12_desc:0 "총리 자리를 연정의 다른 정당에 내줍니다. 대통령은 자리를 나눠 주는 것으로 국회를 움직입니다."
 TFRKPHN_kms_t_13:0 "연정 협의회"
 TFRKPHN_kms_t_13_desc:0 "대통령과 연정 정당 대표들이 매주 한 테이블에 앉는 협의회를 만듭니다. 큰 결정은 모두 그 테이블을 거칩니다."
 TFRKPHN_kms_t_07:0 "국회의 힘"
 TFRKPHN_kms_t_07_desc:0 "대통령 한 사람에게 힘이 몰려 포성까지 갔다고 봅니다. 대통령의 권한을 국회와 나누는 개헌안을 준비합니다."
 TFRKPHN_kms_t_14:0 "중대선거구제"
 TFRKPHN_kms_t_14_desc:0 "한 지역구에서 여러 명을 뽑는 선거제를 도입합니다. 작은 정당들이 국회에 들어올 문이 넓어집니다."
 TFRKPHN_kms_t_04:0 "성장 우선"
 TFRKPHN_kms_t_04_desc:0 "빚을 갚는 것보다 경제를 키우는 것이 먼저라고 봅니다. 기업의 세금을 낮추고 투자를 부릅니다."
 TFRKPHN_kms_t_05:0 "규제 완화"
 TFRKPHN_kms_t_05_desc:0 "기업의 발목을 잡던 규제를 한꺼번에 풉니다. 빠른 성장과 함께 불평등도 커집니다."
 TFRKPHN_kms_t_15:0 "성장 5개년 계획"
 TFRKPHN_kms_t_15_desc:0 "다섯 해 동안의 성장 목표와 투자 순서를 한 장의 계획표에 담습니다. 공단과 항만, 도로가 그 계획표를 따라 들어섭니다."
 TFRKPHN_kms_t_17:0 "개헌 공론화"
 TFRKPHN_kms_t_17_desc:0 "전국을 돌며 권력 구조 개편을 놓고 토론회를 엽니다. 대통령은 직접 마이크를 잡지 않고, 원로와 학자들을 앞에 세웁니다."
 TFRKPHN_kms_t_08:0 "내각제 개헌안"
 TFRKPHN_kms_t_08_desc:0 "의원내각제 개헌안을 국회에 냅니다. 대통령은 상징으로 남고, 나라는 국회가 뽑은 총리가 이끌게 됩니다."
 TFRKPHN_kms_t_18:0 "국민투표 운동"
 TFRKPHN_kms_t_18_desc:0 "개헌안 찬성 운동이 전국에서 시작됩니다. 반대 쪽도 똑같이 움직입니다. 나라가 다시 둘로 나뉘어 투표일을 기다립니다."
 TFRKPHN_kms_t_09:0 "개헌 국민투표"
 TFRKPHN_kms_t_09_desc:0 "내각제 개헌안이 국민투표에 부쳐집니다. 대통령은 모든 것을 이 한 번의 투표에 걸었습니다."
 TFRKPHN_kms_t_10:0 "마지막 셈"
 TFRKPHN_kms_t_10_desc:0 "판을 쥐었던 사람의 마지막 셈입니다. 지는 해가 서쪽 하늘을 붉게 물들이듯, 그는 마지막까지 판의 한가운데에 남았습니다. 그가 남긴 나라의 모습은 국민투표의 결과가 정합니다."
 TFRKPHN_woo_desc:0 "§Y전차에서 내려온 대통령§!\n\n우원식은 대한민국의 제22대 대통령입니다.\n\n1957년 서울에서 태어났습니다. 연세대학교에서 토목공학을 공부했습니다. 1981년 군사 정권의 퇴진을 요구하는 시위에 나섰다가 붙잡혀 징역 삼 년을 선고받았고 1984년에 풀려났습니다.\n\n1995년 지방의원에 당선되며 정치를 시작했습니다. 2004년 서울 노원에서 제17대 국회의원이 됐고, 2008년에 한 번 떨어진 뒤 2012년부터 네 번을 내리 당선돼 다섯 번 국회에 들어갔습니다. 2013년 가게 주인과 하청 노동자의 편에 서겠다며 당 안에 을지로위원회를 만들어 줄곧 이끌었습니다. 2017년 원내대표를 지냈고 2024년 6월 국회의장에 뽑혔습니다.\n\n국회의장은 당적을 가질 수 없습니다. 그래서 그는 양당이 무너진 나라에서 어느 편도 아닌 사람으로 남았습니다. 대통령이 국회로 전차를 보낸 날 그는 그 전차 위에 올라섰습니다.\n\n그의 정부는 네 기둥으로 하루를 셉니다. 국회와 법원, 언론과 군이 얼마나 버티고 있는지를 적은 표가 아침마다 집무실 책상에 올라옵니다.\n\n포성이 멎은 뒤 그는 무너진 본회의장을 다시 열고 의원들을 불러 모았습니다. 대통령 선거에 나선 후보는 그 한 사람뿐이었습니다. 그는 새 나라를 짓겠다고 약속하지 않았습니다. 국회와 법원, 언론과 군이 더 무너지지 않게 붙들고 있다가 다음 총선 때 물러나겠다고 했습니다. 다시 짓는 일은 그다음 사람들의 몫으로 남겨 두었습니다."
 TFRKPHN_kbg_desc:0 "§Y개혁의 칼§!\n\n김부겸은 대한민국의 제23대 대통령입니다.\n\n1958년 경상북도 상주에서 태어났습니다. 서울대학교 정치학과를 나와 재야에서 민주화 운동을 했습니다.\n\n2000년 경기도 군포에서 국회의원에 당선된 뒤 같은 곳에서 세 번을 내리 이겼습니다. 그는 그 지역구를 두고 대구로 내려갔습니다. 대구에서 떨어지고 또 떨어졌고, 2016년 수성구 갑에서 끝내 당선됐습니다. 2017년 행정안전부 장관, 2021년 국무총리를 지냈습니다.\n\n지역의 벽을 넘는 데 정치 인생을 건 사람이라는 말을 들어 왔습니다. 패전과 탄핵, 전차의 사흘을 지나온 뒤 그는 김동연과 함께 신민당을 세웠습니다. 두 사람은 누가 나설지를 대의원 투표에 맡겼고, 진 쪽이 지방 유세를 대신 돌았습니다.\n\n그는 대구에서 떨어진 날들을 자주 이야기합니다. 상대 당의 텃밭에서 두 번 떨어지고 세 번째에 붙은 사람은 지는 법을 압니다. 그는 개혁에 반대하는 사람들의 집 앞에 먼저 찾아갑니다. 문이 열리지 않으면 다음 주에 다시 갑니다.\n\n우원식 정부가 붙들고 있던 기둥들을 넘겨받은 그는 군과 법원부터 다시 세우려 합니다. 그는 미뤄 온 개혁을 한꺼번에 꺼내 들었습니다. 군의 인사부터 차명 계좌까지 칼이 닿지 않는 곳이 없습니다. 칼을 든 손이 떨리지 않는 것이 그의 힘이고, 칼이 어디까지 가야 하는지 묻는 사람이 늘어나는 것이 그의 짐입니다."
 TFRKPHN_kdy_desc:0 "§Y빚을 갚는 대통령§!\n\n김동연은 대한민국의 제23대 대통령입니다.\n\n1957년 충청북도 음성에서 태어났습니다. 집안이 어려워 상업고등학교를 마치고 은행에 들어갔습니다. 낮에는 창구에서 일하고 밤에는 야간 대학에 다녔고, 1982년 행정고시와 입법고시에 함께 합격했습니다.\n\n경제 부처에서 예산을 오래 다뤘습니다. 기획재정부 제2차관을 거쳐 2013년 국무조정실장이 됐고, 그 뒤 아주대학교 총장으로 두 해를 일했습니다. 2017년 경제부총리에 올랐고 2022년 경기도지사에 당선됐습니다.\n\n관료로 일한 뒤 그는 양당의 기득권을 깨겠다며 제3지대로 나섰습니다. 패전과 탄핵, 전차의 사흘을 지나온 뒤에는 김부겸과 함께 신민당을 세웠습니다.\n\n그는 지금도 은행 창구에서 일하던 시절 이야기를 먼저 꺼냅니다. 야간 대학의 강의실과 창구의 계산기가 자기를 키웠다고 말합니다. 장관들은 그가 보고서의 표를 직접 다시 더해 본다는 것을 알기 때문에 계산을 두 번씩 합니다. 회의는 늘 그 숫자로 시작합니다. 신민당 사람들은 그를 숫자의 사람이라고 부릅니다.\n\n우원식 정부가 넘겨준 나라는 서 있기는 했지만 살림이 비어 있었습니다. 전쟁이 남긴 빚과 무너진 수출이 그의 책상에 올라와 있습니다. 그는 숫자를 직접 고치는 대통령입니다. 장부의 마지막 줄이 맞을 때까지 그는 자리보다 계산서를 먼저 내밉니다."
 TFRKPHN_kms_desc:0 "§Y내각제의 꿈§!\n\n김무성은 대한민국의 제23대 대통령입니다.\n\n1951년 부산에서 태어났습니다. 서울에서 고등학교를 다녔고 1976년 한양대학교 경영학과를 졸업했습니다. 젊은 날 상도동계에서 정치를 배웠습니다.\n\n1996년 부산 남구에서 처음 국회의원에 당선된 뒤 네 번을 내리 이겼습니다. 2008년에는 공천에서 떨어지자 무소속으로 나서 당선됐습니다. 2012년 다시 공천에서 밀려 국회를 떠났다가 이듬해 영도 재보궐선거로 돌아왔고, 2016년 여섯 번째로 당선됐습니다. 2014년부터 두 해 가까이 새누리당 대표를 맡았습니다.\n\n2016년 가을 그는 대통령 선거에 나설 뜻을 접고 탄핵에 힘을 보탰습니다. 당을 떠나 새 당을 만들었다가 이듬해 돌아왔고, 2020년 국회를 떠났습니다.\n\n대통령이 된 그는 국무회의 탁자를 둥글게 바꾸었습니다. 의석 순서대로 정당 대표들을 불러 앉혔고, 그 자리에는 그를 뽑지 않은 당의 대표도 있었습니다. 그는 개헌안이 통과되는 날 자신도 물러나겠다고 말했습니다.\n\n물러나 있던 그를 다당제 국회가 다시 불러냈습니다. 신민당의 두 김씨가 과반을 얻지 못하자 보수의 원로인 그가 대통령이 됐습니다. 우원식 정부가 지켜서 넘겨준 국회를 그는 나라의 중심으로 다시 세우려 합니다. 그는 한 사람에게 모든 권력이 쏠리는 제도를 끝내고 싶어 합니다. 그 일은 자기 자리를 스스로 없애는 일이기도 합니다."
 TFRKPHN_cho_desc:0 "§Y광화문의 대통령§!\n\n조원진은 대한민국의 제21대 대통령입니다.\n\n한국외국어대학교 정치외교학과를 졸업하고 대우그룹에서 중국 사업을 맡았습니다. 1987년 통일민주당 창당에 발기인으로 참여했고, 국회의원 보좌관을 거쳐 한동안 중국에서 재중국한국인회 부회장으로 일했습니다.\n\n2008년 대구 달서병에서 처음 국회의원에 당선된 뒤 같은 지역구에서 내리 세 번 당선됐습니다. 한나라당 원내부대표, 새누리당 전략기획본부장과 원내수석부대표, 대구시당 위원장을 지냈고, 2016년에는 당 최고위원에 올랐습니다.\n\n2017년 봄, 그는 탄핵된 대통령을 끝까지 지지하며 자유한국당을 떠났습니다. 그해 대통령 선거에 새누리당 후보로 나섰고, 여름에는 대한애국당 창당에 참여해 대표가 됐습니다. 당은 뒤에 우리공화당으로 이름을 바꿨고, 그는 2020년 국회를 떠난 뒤에도 당을 이끌며 광장의 집회를 지켰습니다.\n\n그는 대통령이 된 뒤에도 토요일마다 광화문 연단에 섭니다. 태극기를 든 노인들 사이로 처음 보는 청년들이 늘었고, 그는 그 얼굴들을 보고 놀랐다고 말한 적이 있습니다.\n\n패전과 탄핵을 거치며 거대 양당이 함께 무너지자, 광장의 분노는 그의 당으로 모였습니다. 국민의힘을 떠난 의원들이 합류했고, 갈라진 제3지대 사이로 그는 대통령이 됐습니다. 그러나 국회의 의석은 서른 석이 채 되지 않습니다. 광장의 대통령에게 국회는 여전히 넘어야 할 벽입니다."
 TFRKPHN_snd_party:0 "신민당"
 TFRKPHN_snd_party_long:0 "신민당"
 TFRKPHN_samkim_a_tt:0 "단일 후보는 §Y김부겸§!입니다. 김동연은 경제부총리를 맡습니다."
 TFRKPHN_samkim_b_tt:0 "단일 후보는 §Y김동연§!입니다. 김부겸은 국무총리를 맡습니다."
 TFRKPHN_samkim_bu_tt:0 "§Y신민당§! §Y김부겸§!이 대통령이 됩니다. §Y김부겸 중점 트리§!로 바뀝니다."
 TFRKPHN_samkim_dong_tt:0 "§Y신민당§! §Y김동연§!이 대통령이 됩니다. §Y김동연 중점 트리§!로 바뀝니다."
 TFRKPHN_samkim_mu_tt:0 "§Y헌정회복연대§! §R김무성§!이 대통령이 됩니다. 갈라진 §Y신민당§!은 야당이 됩니다. §Y김무성 중점 트리§!로 바뀝니다."
