l_korean:
 # [안내] 삼김 루트. samkim_build.py가 만든다.
 TFRKPHN_kdy_char:0 "김동연"
 TFRKPHN_kms_char:0 "김무성"
 TFRKPHN_kbg_char:0 "김부겸"
 tfrkphn.7061.a:0 "두 사람이 나섰다."
 tfrkphn.7061.t:0 "새 기수"
 tfrkphn.7061.d:0 "대통령이 떠난 여의도에서 사람들은 다음 이름을 셌다. 새 헌법 아래 나라를 이끌 사람은 국회가 뽑는 국무총리다. 일곱 개의 정당 어디에도 과반은 없었다. 연정을 꾸릴 수 있는 사람만이 그 자리에 앉을 수 있다.\n\n가장 먼저 이름이 오른 사람은 김부겸이었다. 대구에서 몇 번을 떨어지고도 다시 나섰던 사람, 지역의 벽을 넘는 데 정치 인생을 건 사람이었다. 그는 낡은 판을 깬 자리에 이제 새 판을 짤 사람이 필요하다며 출마를 밝혔다.\n\n이틀 뒤 김동연이 나섰다. 경제부총리를 지낸 관료 출신으로, 몇 해 전 양당의 기득권을 깨겠다며 제3지대로 나섰던 사람이었다. 그는 패전의 빚을 갚는 일이 정치보다 먼저라고 했다.\n\n두 사람은 그 사흘 동안 여의도에서 같은 편에 서 있었다. 이제는 같은 자리를 두고 서로를 마주 보았다. 신문들은 두 김씨라는 말을 처음 꺼냈다.\n\n기자들은 세 사무실을 번갈아 지켰다.\n\n그리고 한 사람이 더 있었다. 보수 원로 김무성은 출마하지 않았다. 대신 그의 사무실 앞에는 날마다 두 캠프의 사람들이 번갈아 찾아왔다."
 tfrkphn.7062.a:0 "셈이 뒤집혔다."
 tfrkphn.7062.t:0 "뒤집힌 셈"
 tfrkphn.7062.d:0 "첫 연정 협상 결과가 나왔다. 앞선 쪽은 김부겸이었다. 무너진 양당의 온건파 의원들이 그의 이름 아래 줄을 섰다. 기자들은 사실상 승부가 끝났다고 썼다.\n\n그러나 김동연은 물러서지 않았다. 그는 그날 밤 제3지대 연합과 정의당의 대표들을 차례로 찾아갔다. 그가 내민 것은 자리가 아니라 계산서였다. 패전의 빚을 어떻게 갚을지, 누가 얼마를 부담할지가 적힌 문서였다.\n\n다음 주 두 번째 협상에서 숫자가 뒤집혔다. 작은 정당들이 하나둘 김동연 쪽으로 옮겨 갔다. 김부겸 캠프는 밤새 불이 꺼지지 않았다. 앞서던 사람이 쫓기는 사람이 되는 데에는 일주일이면 충분했다.\n\n두 사람 모두 과반에는 닿지 못했다. 국회의 셈법은 이제 단 한 사람에게 달려 있었다. 보수 원로 김무성이 거느린 의원들의 표였다.\n\n그날 밤 두 캠프의 상황실에는 같은 이름이 적힌 쪽지가 붙었다. 김무성이었다.\n\n여의도의 한 식당에서 김무성은 두 캠프의 사람을 같은 날 따로 만났다. 점심과 저녁이었다. 그는 두 번 모두 오래 듣고 짧게 답했다고 한다."
 tfrkphn.7063.a:0 "김부겸과 손잡는다."
 tfrkphn.7063.b:0 "김동연과 손잡는다."
 tfrkphn.7063.c:0 "두 김씨가 손잡는다."
 tfrkphn.7063.d:0 "누구도 물러서지 않는다."
 tfrkphn.7063.t:0 "세 번째 김씨"
 tfrkphn.7063.d:0 "국회의 총리 선출 투표를 사흘 앞두고, 김무성이 기자들 앞에 섰다. 그가 거느린 의원들의 표가 어느 쪽으로 가느냐에 따라 첫 연정 총리가 정해진다. 그는 아직 누구의 손도 잡지 않았다고만 말했다.\n\n김부겸 쪽에서는 오랜 인연을 내밀었다. 두 사람은 한때 같은 당에서 의원 생활을 했다. 김동연 쪽에서는 정책을 내밀었다. 경제 재건과 국방 개혁을 보수의 원칙에 맞게 나누어 맡자는 제안이었다.\n\n그 사이 두 김씨가 직접 만나 손을 잡을 수도 있다는 말도 돌았다. 한 사람이 먼저 하고 다른 사람이 뒤를 잇는 약속이었다. 반대로 두 사람이 끝까지 물러서지 않으면 표는 셋으로 갈린다.\n\n여의도의 셈법은 이제 대통령실이 아니라 국회의 복도에서 정해졌다. 투표 전날 밤, 세 사람의 사무실은 모두 늦게까지 불이 켜져 있었다.\n\n국회 사무처는 투표가 여러 번 무산될 경우에 대비해 본회의 일정을 일주일 뒤까지 잡아 두었다.\n\n다음 날 아침 신문의 1면에는 세 사람의 사진이 나란히 실렸다. 제목은 짧았다. 누가 누구의 손을 잡는가."
 tfrkphn.7064.a:0 "굴에 들어갔다."
 tfrkphn.7064.t:0 "호랑이 굴"
 tfrkphn.7064.d:0 "김부겸과 김무성이 함께 기자회견장에 섰다. 중도와 보수의 연합이었다. 김부겸의 정당과 김무성이 거느린 의원들이 하나의 연정으로 묶였다. 총리 선출 투표에서 김부겸은 과반을 넘겼다.\n\n김부겸의 지지자들 가운데에는 등을 돌린 사람도 있었다. 평생 맞서 온 쪽과 손을 잡았다는 것이었다. 그는 담화에서 호랑이를 잡으려면 호랑이 굴에 들어가야 한다는 옛말을 꺼냈다. 바깥에서 비판만 해서는 나라를 바꿀 수 없다는 뜻이었다.\n\n김동연은 결과를 받아들였다. 그는 다음 날 야당 대표로서 첫 질의를 준비했다. 패전의 빚을 누가 갚을 것이냐는 질문이었다.\n\n새 총리는 첫 국무회의에서 군과 정보기관 개혁을 마무리하겠다고 했다. 보수 쪽 장관들이 그 안건에 함께 서명했다. 바깥에서 보기엔 어울리지 않는 조합이었다.\n\n그 주 여론조사에서 연정 지지율은 절반을 넘겼다. 다만 김부겸의 오랜 지지층 가운데 상당수는 응답하지 않았다.\n\n그날 밤 김무성은 짧게 말했다. 판을 바꾼 것은 자신이 아니라 시대라고. 그는 연정 협의회의 한 자리만 맡았다."
 tfrkphn.7065.a:0 "두 사람이 손을 잡았다."
 tfrkphn.7065.t:0 "두 사람의 연합"
 tfrkphn.7065.d:0 "김동연과 김무성이 함께 기자회견장에 섰다. 경제를 다시 세우겠다는 관료 출신과 보수 원로의 연합이었다. 두 사람은 경제와 재정은 총리가, 국방과 외교 원칙은 연정 협의회가 함께 정한다는 합의문을 공개했다.\n\n총리 선출 투표에서 김동연은 과반을 넘겼다. 제3지대 연합과 정의당, 그리고 김무성이 거느린 의원들의 표가 한 이름 아래 모였다.\n\n김부겸은 결과를 받아들였다. 그는 다음 날 국회 본회의장에서 새 총리에게 먼저 다가가 악수를 청했다. 두 사람의 사진은 그날 저녁 뉴스의 첫 화면이 됐다.\n\n새 총리의 첫 지시는 패전의 계산서를 다시 펴는 일이었다. 빚을 갚는 순서와 세금을 걷는 순서를 한 장에 정리하라는 것이었다. 경제 부처의 불은 그 주 내내 꺼지지 않았다.\n\n첫 연정 회의는 경제 부처 회의실에서 열렸다. 두 사람이 나란히 앉은 탁자 위에는 패전의 계산서가 놓여 있었다. 회의는 그 첫 장에서 시작됐다.\n\n김무성은 연정 협의회 의장을 맡았다. 그는 총리 자리에는 앉지 않았지만, 모든 큰 결정은 그의 테이블을 거쳐야 했다."
 tfrkphn.7066.a:0 "함께 간다."
 tfrkphn.7066.t:0 "먼저 가는 사람"
 tfrkphn.7066.d:0 "회동은 밤늦게 끝났다. 김부겸과 김동연이 함께 기자들 앞에 섰다. 먼저 총리를 맡는 쪽은 김부겸이었고, 김동연은 경제를 책임지는 부총리로 연정에 들어가기로 했다.\n\n기자들은 다음 차례를 물었다. 두 사람 모두 웃기만 했다. 합의문의 마지막 장에 무엇이 적혀 있는지는 끝내 공개되지 않았다.\n\n김무성은 연정에 들어오지 않았다. 그는 야당의 자리에서 두 사람을 지켜보겠다고 밝혔다. 그의 사무실 앞을 찾던 발길은 그날로 끊겼다. 셈법이 필요 없어진 것이다.\n\n총리 선출 투표에서 김부겸은 넉넉하게 과반을 넘겼다. 두 김씨가 한쪽에 서자 다른 쪽에 설 사람이 거의 남지 않았다. 몇 해 전까지 서로 다른 당에 있던 의원들이 같은 쪽 의석에서 함께 일어나 박수를 쳤다.\n\n그날 밤 두 사람은 같은 식당에서 늦은 저녁을 먹었다. 함께 전차 앞의 사흘을 지나온 사람들이었다. 다음 날 아침 연정 명단이 국회에 제출됐다.\n\n옛 정치를 기억하는 사람들은 두 김씨라는 말을 다시 꺼냈다. 이번에는 둘이 갈라서지 않았다는 것이 그때와 달랐다."
 tfrkphn.7067.a:0 "어부지리."
 tfrkphn.7067.t:0 "갈라진 두 김씨"
 tfrkphn.7067.d:0 "협상은 사흘 만에 깨졌다. 두 사람은 같은 날 따로 연정 구상을 발표했고, 정당들은 둘로 나뉘어 줄을 섰다. 어느 쪽도 과반을 모으지 못했다.\n\n국회의 총리 선출 투표는 세 번이나 무산됐다. 첫 번째에는 김부겸이, 두 번째에는 김동연이 앞섰지만 둘 다 과반에 몇 표씩 모자랐다. 세 번째 투표가 끝난 밤, 국회 복도에서 두 캠프의 사람들이 서로 언성을 높였다.\n\n네 번째 투표에서 총리가 된 사람은 두 김씨 가운데 누구도 아니었다. 김무성이었다. 그가 거느린 보수 의원들에 두 캠프에서 지친 의원들이 더해졌다. 그는 끝까지 출마하지 않겠다고 했지만, 마지막 날 국회가 그를 불러냈다.\n\n두 김씨는 그날 본회의장에서 서로를 보지 않았다. 신문들은 두 사람이 합쳤다면, 이라는 말을 다시 꺼냈다.\n\n오래된 기자들은 그날 밤 같은 말을 되풀이했다. 이 장면을 어디선가 본 적이 있다는 것이었다.\n\n새 총리는 첫 국무회의에서 두 사람에게 장관 자리를 하나씩 제안했다. 두 사람 모두 받지 않았다. 판을 쥔 사람은 그렇게 판의 한가운데에 앉았다."
 tfrkphn.7068.a:0 "약속이 지켜졌다."
 tfrkphn.7068.t:0 "두 번째 김씨"
 tfrkphn.7068.d:0 "총리실의 짐이 옮겨졌다. 김부겸은 약속대로 자리를 내려놓았고, 다음 총리로 김동연이 국회에서 선출됐다. 두 사람은 이임식과 취임식을 같은 날 같은 자리에서 치렀다.\n\n그 사이 두 해가 지났다. 김부겸의 연정은 군과 정보기관 개혁을 마무리했고, 부총리 김동연은 패전의 빚 가운데 절반을 갚았다. 두 사람이 다툰 적이 없는 것은 아니었다. 다만 그 다툼은 회의실 안에서 끝났다.\n\n합의문의 마지막 장은 그날 처음 공개됐다. 두 해 뒤 자리를 넘긴다는 한 줄과 두 사람의 서명이었다. 기자들은 그 한 장을 사진으로 찍어 1면에 실었다.\n\n같은 사람들이 번갈아 권력을 쥐던 시대가 끝나고, 약속한 사람에게 권력을 넘기는 시대가 왔다. 김부겸은 총리실을 나서며 한 번 뒤를 돌아보았다. 국회의사당 앞 표지석에는 그날도 꽃이 놓여 있었다.\n\n이임식이 끝나고 두 사람은 함께 총리실 계단을 내려왔다. 기다리던 사진기자들 앞에서 둘은 잠시 멈춰 섰다. 그 사진에는 두 사람만 찍혀 있었다.\n\n새 총리의 첫 지시는 남은 빚의 상환 일정표를 다시 펴는 일이었다."
 TFRKPHN_woo_desc:0 "우원식은 학생운동과 재야를 거쳐 정치에 들어선 사람입니다. 서울 노원에서 다섯 번 국회의원에 당선됐고, 가게 주인과 하청 노동자처럼 힘이 약한 쪽의 편에 서겠다며 당 안에 을지로위원회를 만들어 처음으로 이끌었습니다. 원내대표를 지냈고, 22대 국회 전반기에 국회의장이 됐습니다.\n\n국회의장은 당적을 가질 수 없습니다. 그래서 그는 양당이 무너진 나라에서 어느 편도 아닌 사람으로 남았습니다. 포성이 멎은 뒤 그는 무너진 본회의장을 다시 열고 의원들을 불러 모았습니다. 무소속 대통령이 된 그의 약속은 하나입니다. 헌법을 지키는 일부터 다시 시작하는 것입니다."
 TFRKPHN_kbg_desc:0 "김부겸은 경북 출신으로, 민주화운동을 거쳐 정치에 들어섰습니다. 경기 군포에서 세 번 국회의원에 당선된 뒤, 안정된 지역구를 두고 대구로 내려갔습니다. 대구에서 여러 번 떨어지고도 다시 나서 끝내 당선됐고, 행정안전부 장관과 국무총리를 지냈습니다.\n\n지역의 벽을 넘는 데 정치 인생을 건 사람이라는 말을 들어 왔습니다. 패전과 탄핵, 전차의 사흘을 지나온 국회에서 그는 갈라진 정당들을 다시 한자리에 모을 수 있는 사람으로 꼽힙니다. 판을 깨는 일보다 판을 다시 짜는 일이 그의 몫입니다."
 TFRKPHN_kdy_desc:0 "김동연은 충북에서 나고 자랐습니다. 집안이 어려워 상업고등학교를 졸업하고 은행에 들어갔고, 일하면서 야간대학을 다녀 고시에 합격했습니다. 경제 부처에서 오래 일했고, 경제부총리 겸 기획재정부 장관을 지냈습니다.\n\n관료로 일한 뒤 그는 새로운물결을 만들어 양당의 기득권을 깨겠다며 제3지대로 나섰습니다. 패전이 남긴 빚과 무너진 수출을 다시 세우는 일에서 그만큼 숫자를 잘 아는 정치인은 드뭅니다. 그는 자리보다 계산서를 먼저 내미는 사람입니다."
 TFRKPHN_kms_desc:0 "김무성은 부산의 보수 정치를 대표해 온 원로입니다. 젊은 날 상도동계에서 정치를 배웠고, 부산에서 여섯 번 국회의원에 당선됐습니다. 한나라당 사무총장과 새누리당 대표를 지냈으며, 당을 떠나 새 당을 만들었다가 다시 돌아오기도 했습니다.\n\n한동안 정치 일선에서 물러나 있던 그는 다당제 국회가 열리자 다시 불려 나왔습니다. 직접 자리에 나서기보다 누구의 손을 잡느냐로 판을 가르는 사람, 여의도에서 그의 사무실 앞에는 늘 두 캠프의 사람들이 번갈아 찾아옵니다."
 TFRKPHN_cho_desc:0 "조원진은 한국외국어대학교 정치외교학과를 졸업하고 대우그룹에서 중국 사업을 맡았습니다. 1987년 통일민주당 창당에 발기인으로 참여했고, 국회의원 보좌관을 거쳐 한동안 중국에서 재중국한국인회 부회장으로 일했습니다.\n\n2008년 대구 달서병에서 처음 국회의원에 당선된 뒤 같은 지역구에서 내리 세 번 당선됐습니다. 한나라당 원내부대표, 새누리당 전략기획본부장과 원내수석부대표, 대구시당 위원장을 지냈고, 2016년에는 당 최고위원에 올랐습니다.\n\n2017년 봄, 그는 탄핵된 대통령을 끝까지 지지하며 자유한국당을 떠났습니다. 그해 대통령 선거에 새누리당 후보로 나섰고, 여름에는 대한애국당 창당에 참여해 대표가 됐습니다. 당은 뒤에 우리공화당으로 이름을 바꿨고, 그는 2020년 국회를 떠난 뒤에도 당을 이끌며 광장의 집회를 지켰습니다.\n\n패전과 탄핵을 거치며 거대 양당이 함께 무너지자, 광장의 분노는 그의 당으로 모였습니다. 국민의힘을 떠난 의원들이 합류했고, 갈라진 제3지대 사이로 그는 대통령이 됐습니다. 그러나 국회의 의석은 서른 석이 채 되지 않습니다. 광장의 대통령에게 국회는 여전히 넘어야 할 벽입니다."
 TFRKPHN_samkim_a_tt:0 "김무성이 §Y김부겸§!과 손잡습니다. §Y김부겸§!이 총리가 됩니다."
