l_korean:
 TFRKPHN_dd_category:0 "디딤돌소득"
 TFRKPHN_dd_category_desc:0 "기준 중위소득 85퍼센트에 모자라는 소득의 절반을 나라가 채워 줍니다. 서울이 2022년 7월 첫 지급을 시작해 2024년 9월 서울디딤돌소득으로 이름을 바꾼 제도를 이제 전국으로 넓힙니다.\n\n받는 가구: §Y[?TFRKPHN_dd|0]만 가구§! / 60만 가구\n만 가구마다 §G빈곤 개선§!과 §G안정도§!가 오르고, 나라 살림의 §R소비재 부담§!도 늘어납니다.\n지금 안정도 §G+[?TFRKPHN_dd_stpct|1]퍼센트§!, 소비재 §R+[?TFRKPHN_dd_cgpct|1]퍼센트§!"
 TFRKPHN_dd_region:0 "시범 지역 넓히기"
 TFRKPHN_dd_region_desc:0 "광역시와 도마다 시범 구역을 하나씩 더 엽니다."
 TFRKPHN_dd_region_tt:0 "60일 뒤 받는 가구 §G+5만§!"
 TFRKPHN_dd_work:0 "일할수록 더 받게"
 TFRKPHN_dd_work_desc:0 "번 돈이 늘어도 지원이 한꺼번에 끊기지 않게 설계를 다듬습니다. 한 번만 할 수 있습니다."
 TFRKPHN_dd_work_tt:0 "90일 뒤 받는 가구 §G+3만§!, 앞으로 §Y소비재 부담이 절반§!으로 줄어듭니다."
 TFRKPHN_dd_data:0 "추적 조사 공개"
 TFRKPHN_dd_data_desc:0 "받은 가구와 받지 않은 가구를 나란히 비교한 결과를 공개합니다. 받는 가구가 §Y10만§!을 넘어야 합니다. 한 번만 할 수 있습니다."
 TFRKPHN_dd_data_tt:0 "30일 뒤 §G안정도 +2퍼센트§!, §G정치력 +50§!, 받는 가구 §G+4만§!"
 TFRKPHN_dd_merge:0 "복지 제도 정비"
 TFRKPHN_dd_merge_desc:0 "여러 갈래의 현금 지원을 디딤돌소득 하나로 묶어 빈틈을 줄입니다. 받는 가구가 §Y15만§!을 넘어야 합니다. 120일 동안 §Y민수공장 1개§!가 묶입니다."
 TFRKPHN_dd_merge_tt:0 "120일 뒤 받는 가구 §G+12만§!"
 TFRKPHN_dd_nation:0 "전국 시행"
 TFRKPHN_dd_nation_desc:0 "중점 §Y안심소득 전면 시행§!을 마쳐야 합니다. 150일 동안 §Y민수공장 1개§!가 묶입니다."
 TFRKPHN_dd_nation_tt:0 "150일 뒤 받는 가구 §G+20만§!"
 TFRKPHN_didim:0 "디딤돌소득"
 TFRKPHN_didim_desc:0 "모자라는 소득의 절반을 채워 받는 가구가 늘수록 빈곤이 줄고 민심이 안정됩니다. 그만큼 나라 살림은 무거워집니다."
 TFRKPHN_oh_c2_dd_tt:0 "결정 탭 §Y디딤돌소득§!이 열립니다 (받는 가구 §G2만§!부터)."
 TFRKPHN_oh_c5_dd_tt:0 "§Y디딤돌소득§! 받는 가구 §G+8만§!"
 tfrkphn.6981.t:0 "디딤돌을 놓다"
 tfrkphn.6981.d:0 "디딤돌소득을 받는 가구가 60만을 넘었습니다. 서울에서 500가구로 시작한 제도입니다.\n\n2025년 5월 토론회에서 서울시가 내놓은 수치는 탈수급 8.6퍼센트, 근로소득이 늘어난 가구 31.1퍼센트였습니다. 오세훈은 그 자리에서 이렇게 말했습니다.\n\n\"이미 효과가 입증된 디딤돌소득과 서울런의 전국화는 우리사회 양극화 해소에 결정적인 변혁을 가지고 올 것\"\n\n대통령이 된 그는 그 말을 전국에서 시험했습니다. 보건복지부는 이번 달 통계에서 처음으로 상대적 빈곤율이 한 해 사이 눈에 띄게 내려갔다고 보고했습니다. 야당은 재정 부담을 따졌고, 정부는 다음 예산안에서 답하겠다고 했습니다."
 tfrkphn.6981.a:0 "다음 계단을 놓는다."
