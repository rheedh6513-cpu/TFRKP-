l_korean:
 # [안내] PDTO 확정 가입과 사건 7254. gaw_sure.py가 만든다.
 TFRKPHN_pdto_sure_tt:0 "§Y태평양방위조약기구§!에 가입합니다. 이미 회원국이면 그대로입니다.\n§g대아대전이 일어나면 대한민국은 회원국으로 참전합니다.§!"
 tfrkphn.7254.t:0 "참전"
 tfrkphn.7254.d:0 "§R[속보]§! 북한군, 휴전선에서 남하 중. 국군 대응 조치 시작. 전군 데프콘 1 발령.\n\n대아대전이 한반도에 닿았다. 새벽에 휴전선 너머에서 포격이 시작됐고, 북한군은 세 방향으로 내려왔다. 합동참모본부는 십오 분 뒤 대통령에게 첫 보고를 올렸다. 대통령은 관저에서 곧바로 지하 벙커로 내려갔다.\n\n대한민국은 태평양방위조약기구의 회원국이다. 조약에 따라 회원국들은 같은 날 오전에 한국을 돕겠다고 통보해 왔다. 도쿄의 연합 사령부는 한국군과 작전 계획을 맞추기 시작했다. 중국은 북한과 한편에 섰다.\n\n대통령은 벙커에서 국무회의를 열었다. 국회의장과 여야 대표에게는 회의 전에 직접 전화를 걸었다. 국회는 그날 오후 본회의를 열어 방어 전쟁을 승인하는 결의안을 통과시켰다. 반대표는 없었다.\n\n서울의 지하철역은 대피소가 됐다. 예비군 동원령이 방송으로 나갔고, 동원 첫날의 응소율은 구십 퍼센트를 넘었다. 부대 정문 앞에는 군복을 꺼내 입은 사람들이 새벽부터 줄을 섰다. 이번 전쟁은 남의 바다가 아닌 이 나라의 땅에서 벌어지고 있었다."
 tfrkphn.7254.a:0 "방어 전쟁을 지휘한다."
