 tfrkphn.7320.t:0 "수성구의 두 사람"
 tfrkphn.7320.d:0 "대구 신공항 기공식 날, 대통령은 단상 아래 내빈석에서 김부겸을 찾았다. 전직 국무총리이자 야당의 원로였다. 두 사람은 한때 수성구의 이웃한 두 지역구에서 의원을 지냈고, 같은 도시에서 늘 반대편에 섰다.\n\n행사가 끝나자 대통령은 사진 기자들을 불러 김부겸과 나란히 섰다. 같은 도시의 두 정치인이 한 사진에 담긴 것은 오랜만이었다. 둘 다 웃었지만 오간 말은 길지 않았다. 대통령은 국민통합위원회를 맡아 달라고 했고, 김부겸은 당과 먼저 이야기해 보겠다고 답했다. 대답은 정중했고 약속은 없었다.\n\n이튿날 아침 그 사진이 대구 신문들의 1면에 실렸다. 여당 강경파는 야당 사람에게 자리를 주는 것은 지지층을 배신하는 일이라고 했고, 야당 지도부는 사진으로 하는 정치라고 깎아내렸다. 시장 상인들의 말은 달랐다. 두 사람이 같이 웃는 사진은 처음 본다고 했다. 서문시장의 한 상인은 그 신문을 가게 벽에 붙였다.\n\n대통령실은 일주일 동안 답을 기다리기로 했다. 비서실장은 그사이 위원회 사무실을 비워 두라고 지시했다."
 tfrkphn.7320.a:0 "위원장 자리를 비워 둔다."
 tfrkphn.7320.b:0 "사진 한 장으로 끝낸다."
 tfrkphn.7321.t:0 "옆자리"
 tfrkphn.7321.d:0 "권한대행 이인제가 김무성을 총리 공관으로 불렀다. 탄핵안이 가결된 지 이레째였다. 두 사람은 십여 년 전 같은 당 지도부에 나란히 앉았고, 본회의장에서도 귓속말을 나누던 사이였다. 그때는 김무성이 대표였고 이인제는 최고위원이었다.\n\n김무성은 자리에 앉자마자 출마할 생각이 있느냐고 물었다. 이인제는 웃기만 하고 대답하지 않았다. 대신 선거까지 남은 날짜를 손가락으로 셌다. 권한대행이 선거에 나가면 선거를 관리할 사람이 없어진다고 김무성이 말했다. 이인제는 대통령 선거에 여러 번 나가 본 사람이 그걸 모르겠느냐고 되물었다.\n\n이야기는 한 시간 넘게 이어졌다. 김무성은 흩어진 의원들을 다시 모아 헌정을 바로 세우는 연대를 꾸리겠다고 했고, 그 연대가 권한대행을 공격하지 않겠다고 약속했다. 그 대가로 선거를 관리하는 내각에서 당적을 가진 장관을 모두 빼 달라고 했다.\n\n공관을 나서는 김무성에게 기자들이 무슨 이야기를 나눴느냐고 물었다. 그는 옛날이야기를 했다고만 답했다. 그날 밤 권한대행 비서실은 장관 세 사람의 사표를 받아 두었다."
 tfrkphn.7321.a:0 "당적 있는 장관들을 내보낸다."
 tfrkphn.7321.b:0 "대답을 미룬다."
