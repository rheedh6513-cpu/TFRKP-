l_korean:
 # PDTO 협력 탭. pdto_build.py가 만든다.
 TFRKPHN_oh_pdto_category:0 "PDTO 협력"
 TFRKPHN_oh_pdto_category_desc:0 "태평양 방위 조약기구는 함께 싸운 나라들의 모임입니다. 전쟁이 끝난 뒤에는 회원국 회사들이 서로의 공장과 시장을 쓰는 길이 됐습니다. 지도에서 나라의 이름표를 누르면 그 나라 회사와 할 수 있는 협력이 아래에 나옵니다. 우리와 같은 진영에 있는 회원국하고만 협력할 수 있습니다."
 TFRKPHN_pd_t_top:0 "PDTO 협력"
 TFRKPHN_pd_t_sel:0 "[GetTFRKPHNPdSel]"
 TFRKPHN_pd_t_help:0 "§B파랑§!: PDTO 회원국   §Y금빛§!: 협력을 마친 나라   §R빨강§!: EADI 회원국"
 TFRKPHN_pd_sel0:0 "나라의 이름표를 눌러 고르세요."
 TFRKPHN_pd_need_tt:0 "이 나라가 우리와 같은 진영(태평양 방위 조약기구)에 있음"
 TFRKPHN_pd_wait_tt:0 "§Y45일§! 동안 협상이 이어집니다."
 TFRKPHN_pdto_coop:0 "PDTO 기업 협력"
 TFRKPHN_pdto_coop_desc:0 "태평양 방위 조약기구 회원국의 회사들과 맺은 협력입니다."
 TFRKPHN_pd_sel1_y:0 "고른 나라: §Y일본§! (§G회원국§!)"
 TFRKPHN_pd_sel1_n:0 "고른 나라: §Y일본§! (§R회원국이 아닙니다§!)"
 TFRKPHN_pd_b1_tt:0 "§Y일본§!\n협력할 수 있는 회사: 도쿄일렉트론, 도요타\n\n누르면 이 나라의 협력 결정이 아래에 나옵니다."
 tfrkphn.6631.t:0 "도쿄일렉트론과 장비 협력"
 tfrkphn.6631.d:0 "도쿄일렉트론과 우리 반도체 회사들이 장비 협력 협약을 맺었습니다. 반도체 공장의 장비는 한 대가 멈추면 라인 전체가 섭니다. 전쟁 동안 우리는 부품 하나를 기다리느라 공장을 세운 적이 있습니다.\n\n이제 이 회사의 정비 인력이 우리 공장 가까이에 머뭅니다. 다음 세대 장비의 시험도 두 나라 기술자가 한 방에서 합니다."
 TFRKPHN_pd_d1_1:0 "일본: 도쿄일렉트론"
 TFRKPHN_pd_d1_1_desc:0 "반도체를 만드는 장비를 만드는 일본 회사입니다. 우리 반도체 공장에 들어가는 장비의 납품과 정비를 한 창구로 묶고, 다음 세대 장비를 함께 시험합니다."
 TFRKPHN_pd_d1_1_tt:0 "§YPDTO 기업 협력§! 변동치: 연구 속도 §G+2§!\n일본의 우리에 대한 관계 §G+15§!"
 tfrkphn.6632.t:0 "도요타와 부품을 나눠 쓰다"
 tfrkphn.6632.d:0 "도요타와 우리 자동차 회사들이 부품 규격을 맞추기로 했습니다. 미국 시장이 닫힌 뒤 두 나라의 자동차 회사들은 줄어든 시장을 두고 다투는 대신 비용을 줄이는 길을 골랐습니다.\n\n울산에서 만든 부품이 나고야의 공장으로 가고, 아이치에서 만든 부품이 울산으로 옵니다. 부산과 규슈를 오가는 화물선이 한 주에 몇 편 더 늘었습니다."
 TFRKPHN_pd_d1_2:0 "일본: 도요타"
 TFRKPHN_pd_d1_2_desc:0 "일본의 자동차 회사입니다. 미국 시장이 닫힌 뒤 두 나라의 자동차 회사들은 같은 처지에 놓였습니다. 부품 규격을 맞추고 서로의 공장에서 부품을 받아 쓰기로 합니다."
 TFRKPHN_pd_d1_2_tt:0 "§YPDTO 기업 협력§! 변동치: 기업 가치 §G+2§!\n일본의 우리에 대한 관계 §G+15§!"
 TFRKPHN_pd_sel2_y:0 "고른 나라: §Y대만§! (§G회원국§!)"
 TFRKPHN_pd_sel2_n:0 "고른 나라: §Y대만§! (§R회원국이 아닙니다§!)"
 TFRKPHN_pd_b2_tt:0 "§Y대만§!\n협력할 수 있는 회사: TSMC, 폭스콘\n\n누르면 이 나라의 협력 결정이 아래에 나옵니다."
 tfrkphn.6633.t:0 "TSMC와 맺은 약속"
 tfrkphn.6633.d:0 "TSMC와 우리 반도체 회사들이 서로의 주문을 대신 만들어 주는 약속을 맺었습니다. 전쟁 동안 세계는 대만의 공장이 멈추면 무슨 일이 벌어지는지 보았습니다.\n\n한쪽 공장에 일이 생기면 다른 쪽이 그 주문을 이어받습니다. 경쟁하던 두 나라 회사가 처음으로 생산 계획을 서로에게 보여 주게 됐습니다. 주문을 넣는 회사들은 이 약속을 반겼습니다."
 TFRKPHN_pd_d2_1:0 "대만: TSMC"
 TFRKPHN_pd_d2_1_desc:0 "남이 설계한 반도체를 대신 만들어 주는 대만 회사입니다. 전쟁을 버텨 낸 이 회사의 공장과 우리 공장이 주문을 나눠 받고, 한쪽이 멈추면 다른 쪽이 대신 만들기로 약속합니다."
 TFRKPHN_pd_d2_1_tt:0 "§YPDTO 기업 협력§! 변동치: 기업 가치 §G+3§!\n대만의 우리에 대한 관계 §G+15§!"
 tfrkphn.6634.t:0 "폭스콘의 새 조립 공장"
 tfrkphn.6634.d:0 "폭스콘이 우리나라에 조립 공장을 세우기로 했습니다. 대륙에 있던 공장을 전쟁으로 잃은 뒤 이 회사는 새 자리를 찾고 있었습니다.\n\n공장에는 우리 회사들이 만든 화면과 반도체, 배터리가 들어갑니다. 부품을 배에 실어 보내던 일이 트럭으로 한나절 거리가 됐습니다. 공장이 들어설 도시에서는 채용 설명회에 긴 줄이 섰습니다."
 TFRKPHN_pd_d2_2:0 "대만: 폭스콘"
 TFRKPHN_pd_d2_2_desc:0 "전자 제품을 대신 조립해 주는 대만 회사입니다. 대륙에 있던 조립 공장을 잃은 이 회사가 새 공장 자리를 찾고 있습니다. 우리 부품을 쓰는 조립 라인을 함께 꾸립니다."
 TFRKPHN_pd_d2_2_tt:0 "§YPDTO 기업 협력§! 변동치: 소비재 공장 §G-2§!\n대만의 우리에 대한 관계 §G+15§!"
 TFRKPHN_pd_sel3_y:0 "고른 나라: §Y인도§! (§G회원국§!)"
 TFRKPHN_pd_sel3_n:0 "고른 나라: §Y인도§! (§R회원국이 아닙니다§!)"
 TFRKPHN_pd_b3_tt:0 "§Y인도§!\n협력할 수 있는 회사: 타타 그룹\n\n누르면 이 나라의 협력 결정이 아래에 나옵니다."
 tfrkphn.6635.t:0 "타타 그룹과 손잡다"
 tfrkphn.6635.d:0 "타타 그룹과 우리 회사들이 여러 건의 계약을 한꺼번에 맺었습니다. 우리 회사들의 전산 업무 일부가 인도로 가고, 인도에 짓는 제철소와 자동차 공장에는 우리 설비가 들어갑니다.\n\n인도는 사람이 많고 젊은 나라입니다. 우리 회사들은 중국에서 잃은 시장을 대신할 곳으로 인도를 꼽아 왔습니다. 뭄바이와 인천을 오가는 직항편이 늘었습니다."
 TFRKPHN_pd_d3_1:0 "인도: 타타 그룹"
 TFRKPHN_pd_d3_1_desc:0 "제철과 자동차, 정보 기술 서비스를 아우르는 인도의 기업 집단입니다. 우리 회사들의 전산 업무를 맡기고, 인도에 짓는 공장에는 우리 설비를 넣습니다."
 TFRKPHN_pd_d3_1_tt:0 "§YPDTO 기업 협력§! 변동치: 소득 성장 §G+2§!\n인도의 우리에 대한 관계 §G+15§!"
 TFRKPHN_pd_sel4_y:0 "고른 나라: §Y베트남§! (§G회원국§!)"
 TFRKPHN_pd_sel4_n:0 "고른 나라: §Y베트남§! (§R회원국이 아닙니다§!)"
 TFRKPHN_pd_b4_tt:0 "§Y베트남§!\n협력할 수 있는 회사: 빈그룹\n\n누르면 이 나라의 협력 결정이 아래에 나옵니다."
 tfrkphn.6636.t:0 "빈그룹의 유통망에 오르다"
 tfrkphn.6636.d:0 "빈그룹과 우리 회사들이 협력 협약을 맺었습니다. 베트남에는 우리 회사들의 공장이 이미 많습니다. 그 공장에서 만든 물건이 이제 이 회사의 매장과 온라인 장터에서 팔립니다.\n\n지금까지는 베트남에서 만들어 다른 나라에 팔았습니다. 이번 협약으로 베트남 안에서도 팝니다. 하노이와 호찌민의 매장 진열대에 우리 상표가 늘었습니다."
 TFRKPHN_pd_d4_1:0 "베트남: 빈그룹"
 TFRKPHN_pd_d4_1_desc:0 "부동산에서 시작해 자동차까지 만드는 베트남의 기업 집단입니다. 우리 회사들의 베트남 공장과 이 회사의 유통망을 잇습니다."
 TFRKPHN_pd_d4_1_tt:0 "§YPDTO 기업 협력§! 변동치: 소비재 공장 §G-2§!\n베트남의 우리에 대한 관계 §G+15§!"
 TFRKPHN_pd_sel5_y:0 "고른 나라: §Y필리핀§! (§G회원국§!)"
 TFRKPHN_pd_sel5_n:0 "고른 나라: §Y필리핀§! (§R회원국이 아닙니다§!)"
 TFRKPHN_pd_b5_tt:0 "§Y필리핀§!\n협력할 수 있는 회사: 산미겔\n\n누르면 이 나라의 협력 결정이 아래에 나옵니다."
 tfrkphn.6637.t:0 "산미겔의 공사 현장에서"
 tfrkphn.6637.d:0 "산미겔이 짓는 공항과 도로 공사에 우리 건설사들이 들어갑니다. 필리핀은 섬이 많아 다리와 항만, 공항이 늘 모자랍니다.\n\n우리 건설사들은 설계와 시공을 맡고 자재의 상당 부분을 우리나라에서 가져갑니다. 마닐라 근교의 공사 현장에 우리말로 쓴 안전 표지판이 섰습니다."
 TFRKPHN_pd_d5_1:0 "필리핀: 산미겔"
 TFRKPHN_pd_d5_1_desc:0 "맥주로 시작해 식품과 전력, 도로까지 넓힌 필리핀의 기업 집단입니다. 이 회사가 짓는 공항과 도로 공사에 우리 건설사들이 함께 들어갑니다."
 TFRKPHN_pd_d5_1_tt:0 "§YPDTO 기업 협력§! 변동치: 개인 가치 §G+1§!\n필리핀의 우리에 대한 관계 §G+15§!"
 TFRKPHN_pd_sel6_y:0 "고른 나라: §Y호주§! (§G회원국§!)"
 TFRKPHN_pd_sel6_n:0 "고른 나라: §Y호주§! (§R회원국이 아닙니다§!)"
 TFRKPHN_pd_b6_tt:0 "§Y호주§!\n협력할 수 있는 회사: BHP\n\n누르면 이 나라의 협력 결정이 아래에 나옵니다."
 tfrkphn.6638.t:0 "BHP와 여러 해짜리 계약"
 tfrkphn.6638.d:0 "BHP와 우리 제철 회사들이 철광석과 구리를 여러 해 동안 정해진 물량으로 받는 계약을 맺었습니다. 전쟁 동안 원자재 값은 하루가 다르게 뛰었고, 값을 치르고도 배를 구하지 못한 때가 있었습니다.\n\n호주 서부의 항구에서 떠난 배가 정해진 날짜에 포항과 광양에 닿습니다. 건설 현장에 들어가는 철근 값이 한결 차분해졌습니다."
 TFRKPHN_pd_d6_1:0 "호주: BHP"
 TFRKPHN_pd_d6_1_desc:0 "철광석과 구리를 캐는 호주의 광산 회사입니다. 값이 출렁여도 물량이 끊기지 않도록 여러 해짜리 공급 계약을 맺습니다."
 TFRKPHN_pd_d6_1_tt:0 "§YPDTO 기업 협력§! 변동치: 건설 속도 §G+3§!\n호주의 우리에 대한 관계 §G+15§!"
 TFRKPHN_pd_sel7_y:0 "고른 나라: §Y인도네시아§! (§G회원국§!)"
 TFRKPHN_pd_sel7_n:0 "고른 나라: §Y인도네시아§! (§R회원국이 아닙니다§!)"
 TFRKPHN_pd_b7_tt:0 "§Y인도네시아§!\n협력할 수 있는 회사: 안탐\n\n누르면 이 나라의 협력 결정이 아래에 나옵니다."
 tfrkphn.6639.t:0 "안탐의 니켈, 호남의 공장"
 tfrkphn.6639.d:0 "안탐과 우리 배터리 회사들이 니켈 공급 계약을 맺었습니다. 인도네시아는 니켈이 많이 나는 나라이고, 니켈은 전기차 배터리에 들어갑니다.\n\n현지에서 캐고 한 번 가공한 니켈이 배에 실려 호남권의 소재 공장으로 옵니다. 공장은 호남권 메가시티의 산업 단지 안에 섰습니다. 광양항에 니켈을 내리는 부두가 따로 생겼습니다."
 TFRKPHN_pd_d7_1:0 "인도네시아: 안탐"
 TFRKPHN_pd_d7_1_desc:0 "니켈을 캐는 인도네시아의 국영 광산 회사입니다. 니켈은 배터리에 들어갑니다. 현지에서 캔 니켈을 호남권의 배터리 소재 공장으로 가져옵니다."
 TFRKPHN_pd_d7_1_tt:0 "§YPDTO 기업 협력§! 변동치: 기업 가치 §G+1§!\n전라에 §Y산업 단지§! §G1개§!와 건물 칸\n인도네시아의 우리에 대한 관계 §G+15§!"
 TFRKPHN_pd_sel8_y:0 "고른 나라: §Y태국§! (§G회원국§!)"
 TFRKPHN_pd_sel8_n:0 "고른 나라: §Y태국§! (§R회원국이 아닙니다§!)"
 TFRKPHN_pd_b8_tt:0 "§Y태국§!\n협력할 수 있는 회사: CP 그룹\n\n누르면 이 나라의 협력 결정이 아래에 나옵니다."
 tfrkphn.6640.t:0 "CP 그룹과 먹거리 계약"
 tfrkphn.6640.d:0 "CP 그룹과 우리 식품과 유통 회사들이 여러 해짜리 공급 계약을 맺었습니다. 전쟁 동안 바닷길이 흔들리면서 닭고기와 사료 곡물 값이 크게 올랐던 일이 있습니다.\n\n값이 올라도 물량은 끊기지 않게 하는 것이 이 계약의 요점입니다. 태국에서 떠난 냉동 컨테이너가 부산항에 들어오는 날짜가 달력에 고정됐습니다."
 TFRKPHN_pd_d8_1:0 "태국: CP 그룹"
 TFRKPHN_pd_d8_1_desc:0 "식품과 유통을 하는 태국의 기업 집단입니다. 전쟁으로 흔들린 먹거리 수입선을 여러 해짜리 계약으로 붙들어 둡니다."
 TFRKPHN_pd_d8_1_tt:0 "§YPDTO 기업 협력§! 변동치: 소비재 공장 §G-2§!\n태국의 우리에 대한 관계 §G+15§!"
 TFRKPHN_pd_partner:0 "기업 협력"
 TFRKPHN_pd_ok:0 "함께 갑니다."
