 tfrkphn.467.a:0 "양바퀴가 다 돌아간다"
 tfrkphn.467.tt:0 "§Y일자리 대타협§! 탭의 일자리가 §G+[?TFRKPHN_chb_reward|0]만 개§! 됩니다.\n§g타협한 개혁: [?TFRKPHN_chb_nc|0]개§!"
 tfrkphn.470.t:0 "시화공단의 견적서"
 tfrkphn.470.story:0 "경기도 시흥, 시화공단 끝자락의 금형 공장.\n\n오전 열 시. 사장 김씨의 휴대폰이 울렸다. 모르는 번호였다. 대기업 구매팀 과장이라고 했다.\n\n김씨는 삼십 년 동안 그런 전화를 받아 본 적이 없었다. 늘 사이에 회사가 하나 끼어 있었다. 회장 조카가 차린 회사였다. 직원은 넷이었고 기계는 없었다. 그 회사가 일감을 받아 김씨에게 넘겼다. 단가의 이 할이 거기서 빠졌다.\n\n\"입찰 공고 보셨습니까. 이번부터는 직접 받습니다.\"\n\n그 회사는 지난달에 문을 닫았다. 총수 일가가 개인회사를 세우지 못하게 한 법이 시행된 달이었다.\n\n김씨는 전화를 끊고 서랍을 열었다. 누렇게 바랜 서류 봉투가 그대로 있었다. 몇 해 전 새 설비를 들일 때 냈던 서류였다. 김씨는 그 옆에 견적서 양식을 꺼내 놓았다. 단가 칸에 처음으로 자기 숫자를 적었다. 이 할을 빼지 않은 숫자였다.\n\n창밖으로 프레스 소리가 났다. 직원은 열일곱 명이 됐다. 박 반장은 정년을 두 해 넘기고도 나와 있었다.\n\n\"박 반장! 사람 둘 더 뽑아야겠어.\"\n\n\"일감이 그만큼 됩니까, 사장님?\"\n\n\"되게 써냈어. 떨어지면 내가 삼겹살 사고, 붙으면 자네가 사.\"\n\n박 반장이 장갑을 벗으며 웃었다.\n\n\"어느 쪽이든 삼겹살이네요.\"\n\n김씨는 견적서를 봉투에 넣고 겉에 날짜를 적었다. 입찰 마감은 금요일이었다."
 tfrkphn.470.a:0 "금요일이 마감이다"
 tfrkphn.474.t:0 "장부에 여당 의원의 이름이 있다"
 tfrkphn.474.d:0 "특별수사팀이 한 그룹의 재무팀에서 장부를 압수했습니다.\n\n장부에는 전쟁 동안 군납 계약을 따낸 날짜와 그 전후로 나간 돈이 적혀 있었습니다. 받은 사람 칸에는 이름 대신 머리글자가 있었습니다. 수사팀은 머리글자 열하나 가운데 일곱을 풀었습니다. 그 가운데 넷이 여당 현역 의원이었습니다.\n\n검찰총장이 보고서를 들고 청와대에 왔습니다. 여당 원내대표는 그보다 한 시간 먼저 와 있었습니다."
 tfrkphn.474.a:0 "성역은 없다. 그대로 수사하라"
 tfrkphn.474.b:0 "여당 쪽은 다음으로 미룬다"
 tfrkphn.474.a_tt:0 "노동계의 신뢰 §G+5§!"
 tfrkphn.474.b_tt:0 "정경유착 수사가 §R한 단계 뒤로§! 갑니다.\n노동계의 신뢰 §R-5§!"
 tfrkphn.475.t:0 "기소"
 tfrkphn.475.d:0 "검찰이 수사 결과를 발표했습니다.\n\n그룹 총수 둘과 전현직 의원 다섯이 재판에 넘겨졌습니다. 혐의는 뇌물과 배임이었습니다. 공소장은 삼백 쪽이 넘었습니다. 군납 계약서, 계좌 내역, 운전기사의 운행 일지가 증거로 붙었습니다.\n\n경제 단체들은 그날 성명을 내지 않았습니다. 주요 그룹의 대관 담당 임원들이 그 주에 줄줄이 자리를 옮겼습니다."
 tfrkphn.475.a:0 "재판은 법원의 일이다"
 tfrkphn.475.tt:0 "원안으로 통과시키는 개혁의 재계의 저항 증가가 §G+15에서 +10§!으로 줄어듭니다."
 tfrkphn.468.t:0 "재계의 반격"
 tfrkphn.468.d:0 "경제 단체들이 같은 날 성명을 냈습니다.\n\n성명은 짧았습니다. 기업을 죄인으로 모는 법이 이어지면 투자를 미루겠다고 했습니다. 다음 날 주요 그룹 몇이 신규 채용 계획을 내년으로 넘겼습니다."
 tfrkphn.468.a:0 "저항부터 가라앉혀야 한다"
 tfrkphn.468.tt:0 "경영계의 신뢰 §R-5§!\n§g재계의 저항이 60 아래로 내려가야 다음 개혁을 할 수 있습니다.§!"
 TFRKPHN_chb_focus_tt:0 "이벤트 §Y유승민과의 만남§!이 일어납니다. 그 뒤 §Y재벌 개혁§! 탭이 열립니다."
