 # 이인제 정부 재벌 개혁. chaebol_build.py가 만든다.
 TFRKPHN_chb_card_tt:0 "§Y유승민§!\n\n§Y이력§!\n1958년 1월 7일 대구 출생\n서울대학교 경제학과 졸업, 1987년 위스콘신 대학교 경제학 박사\n1987년부터 2000년까지 한국개발연구원(KDI) 연구위원, 선임연구위원\n2000년부터 2003년까지 한나라당 여의도연구소장\n2004년 제17대 국회의원 (비례대표)\n2005년 박근혜 대표 비서실장, 대구 동구 을 보궐선거 당선\n2008년, 2012년, 2016년 대구 동구 을 당선 (4선)\n2012년부터 2014년까지 국회 국방위원장\n2015년 새누리당 원내대표\n2017년 바른정당 창당, 대통령 후보 (득표율 6.8%)\n2018년 바른미래당 공동대표\n2020년 새로운보수당 창당\n2021년 국민의힘 대선 경선 3위\n\n§Y성향§!\n개혁보수로 분류됩니다.\n원내대표 시절 증세론과 재벌 개혁 등 진보적인 경제관을 보였습니다.\n안보에서는 사드 배치와 전술핵 재배치 등 강경 노선을 취했습니다.\n\n§Y2015년 원내대표 연설에서§!\n\"'증세 없는 복지'는 허구임이 입증되고 있습니다.\"\n\"재벌도 개혁에 동참해야 한다\"\n\"그러나 국가안보 만큼은 정통보수의 길을 확실하게 가겠습니다.\"\n\n§Y2017년 2월 토론회에서§!\n\"경제권력이 정치권력에 영향을 미치고 심지어 언론에도 영향을 미치는 그런 사회에선\n민주주의 시장경제가 제대로 발전할 수 없다\"\n\n§Y홍준표와의 관계§!\n2007년 경선에서 홍준표는 이명박 쪽, 유승민은 박근혜 쪽에 섰습니다.\n2011년 12월 유승민이 최고위원에서 물러났고 홍준표 대표도 물러났습니다.\n2017년 대선에 홍준표는 자유한국당, 유승민은 바른정당 후보로 나왔습니다.\n\n§Y2017년 4월 13일 토론에서§!\n홍준표: \"시중에는 '유 후보가 정책적으로 배신했다. 강남좌파가 됐다'는 주장이 나온다\"\n유승민: \"좌파는 아니고, 새로운 보수가 나갈 방향\"\n\n§Y2021년 9월 23일 경선 토론에서§!\n홍준표: \"아픈 질문을 하겠다. '배신자 프레임'을 어떻게 풀어나갈 것인가\"\n유승민: \"제가 배신자면 최순실은 충신이라는 것인가\""
 TFRKPHN_chb_t_prog:0 "§Y재벌 개혁§!   [?TFRKPHN_chb_n|0] / 8"
 TFRKPHN_chb_t_res:0 "§Y재계의 저항§!   [?TFRKPHN_chb_res|0]"
 TFRKPHN_chb_t_g:0 "경영계 §Y[?TFRKPHN_job_biz|0]§!     노동계 §Y[?TFRKPHN_job_lab|0]§!"
 TFRKPHN_chb_kn_ftc:0 "전속고발권 폐지"
 TFRKPHN_chb_kc_ftc:0 "£pol_power §Y25§!"
 TFRKPHN_chb_k_ftc_tt:0 "§Y공정위 전속고발권 폐지§!\n공정거래위원회만 고발할 수 있던 권한을 없앱니다.\n피해자가 공정위를 거치지 않고 법원에 바로 갑니다.\n\n비용: £pol_power §Y25§!\n경영계의 신뢰 §R-6§!\n노동계의 신뢰 §G+4§!\n안정도 §G+2%§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-3§!\n노동계의 신뢰 §G+2§!\n안정도 §G+1%§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_kn_class:0 "집단소송제"
 TFRKPHN_chb_kc_class:0 "£pol_power §Y20§!"
 TFRKPHN_chb_k_class_tt:0 "§Y집단소송제 도입§!\n피해자 한 사람이 이기면 같은 피해를 본 사람 모두가\n배상을 받습니다. 공정거래 관련 법률 전반에 들입니다.\n\n비용: £pol_power §Y20§!\n경영계의 신뢰 §R-5§!\n노동계의 신뢰 §G+5§!\n안정도 §G+2%§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-2§!\n노동계의 신뢰 §G+2§!\n안정도 §G+1%§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_kn_punitive:0 "징벌적 손해배상"
 TFRKPHN_chb_kc_punitive:0 "£pol_power §Y20§!"
 TFRKPHN_chb_k_punitive_tt:0 "§Y징벌적 손해배상제 도입§!\n일부러 저지른 불공정 행위에는 손해액보다 훨씬 많은\n배상을 물립니다.\n\n비용: £pol_power §Y20§!\n경영계의 신뢰 §R-5§!\n노동계의 신뢰 §G+5§!\n정치력 §G+30§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-2§!\n노동계의 신뢰 §G+2§!\n정치력 §G+15§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_kn_private:0 "총수 개인회사 금지"
 TFRKPHN_chb_kc_private:0 "£pol_power §Y25§!"
 TFRKPHN_chb_k_private_tt:0 "§Y총수 일가 개인회사 설립 금지§!\n총수 일가가 개인회사를 세워 계열사 일감을 몰아받는\n일을 막습니다. 2017년 공약 때 \"서미경법\"으로\n불렸습니다.\n\n유승민: \"총수 일가의 개인회사가 아니라 계열사를\n만들어 거래하면 된다\"\n\n비용: £pol_power §Y25§!\n경영계의 신뢰 §R-6§!\n소비재 공장 §G-2%§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-3§!\n소비재 공장 §G-1%§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_kn_internal:0 "내부거래 금지"
 TFRKPHN_chb_kc_internal:0 "£pol_power §Y25§!"
 TFRKPHN_chb_k_internal_tt:0 "§Y총수 일가 회사와의 내부거래 금지§!\n총수 일가의 개인회사와 그룹 계열사 사이의 거래를\n금지합니다. 그 일감이 중소기업으로 갑니다.\n\n비용: £pol_power §Y25§!\n경영계의 신뢰 §R-6§!\n공장 산출량 §G+3%§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-3§!\n공장 산출량 §G+1.5%§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_kn_inherit:0 "편법 상속 차단"
 TFRKPHN_chb_kc_inherit:0 "£pol_power §Y20§!"
 TFRKPHN_chb_k_inherit_tt:0 "§Y편법 상속과 증여 차단§!\n총수 일가가 헐값에 지분을 넘겨받는 길을 감시하고\n막습니다.\n\n비용: £pol_power §Y20§!\n경영계의 신뢰 §R-5§!\n노동계의 신뢰 §G+4§!\n안정도 §G+2%§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-2§!\n노동계의 신뢰 §G+2§!\n안정도 §G+1%§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_kn_pardon:0 "총수 사면 금지"
 TFRKPHN_chb_kc_pardon:0 "£pol_power §Y20§!"
 TFRKPHN_chb_k_pardon_tt:0 "§Y비리 총수 사면과 복권 금지§!\n비리를 저지른 재벌 총수 일가와 경영진을 사면하거나\n복권하지 않습니다.\n\n비용: £pol_power §Y20§!\n경영계의 신뢰 §R-5§!\n노동계의 신뢰 §G+4§!\n안정도 §G+2%§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-2§!\n노동계의 신뢰 §G+2§!\n안정도 §G+1%§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_kn_ban:0 "경영 복귀 제한"
 TFRKPHN_chb_kc_ban:0 "£pol_power §Y20§!"
 TFRKPHN_chb_k_ban_tt:0 "§Y처벌받은 기업인의 경영 복귀 제한§!\n일정 수준 이상의 형사처벌을 받은 기업인은 경영에\n참여하지 못하게 법을 고칩니다.\n\n비용: £pol_power §Y20§!\n경영계의 신뢰 §R-5§!\n노동계의 신뢰 §G+3§!\n정치력 §G+20§!\n재계의 저항 §R+15§! §g(정경유착 수사를 끝냈으면 +10)§!\n\n§Y타협안으로 통과시키면§!\n경영계의 신뢰 §R-2§!\n노동계의 신뢰 §G+1§!\n정치력 §G+10§!\n재계의 저항 §R+5§!\n\n§g원안은 재계의 저항이 60 이상이면 할 수 없습니다. 타협안은 할 수 있습니다.§!"
 TFRKPHN_chb_mode_off:0 "타협: 꺼짐"
 TFRKPHN_chb_mode_on:0 "§G타협: 켜짐§!"
 TFRKPHN_chb_mode_tt:0 "§Y타협안§!\n켜 두고 개혁 카드를 누르면 재계와 타협한 안으로 통과시킵니다.\n\n재계의 저항이 §Y+5§!만 오릅니다. (원안은 +15)\n재계의 저항이 60 이상이어도 통과됩니다.\n경영계의 신뢰가 절반만 내려갑니다.\n§R노동계의 신뢰와 개혁의 효과도 절반입니다.§!\n§R타협한 개혁 하나마다 마지막 보상의 일자리가 1만 개 줄어듭니다.§!\n§R한 번이라도 타협하면 마지막에 중소기업의 약진을 얻지 못합니다.§!\n§R타협한 개혁이 4개 이상이면 재벌의 협력 대신 재벌과의 타협이 붙습니다.§!\n\n§g타협은 게임 설정입니다.§!"
 TFRKPHN_chb_mode_note:0 "§g켜고 카드를 누르면 타협안§!"
 TFRKPHN_chb_a_opinion:0 "여론전"
 TFRKPHN_chb_a_opinion_tt:0 "§Y여론에 호소한다§!\n대통령이 방송에 나와 재벌개혁이 왜 필요한지\n설명합니다.\n\n비용: £pol_power §Y10§!\n재계의 저항 §G-12§!\n노동계의 신뢰 §G+2§!\n§g한 번 쓰면 30일 동안 다시 쓸 수 없습니다.§!"
 TFRKPHN_chb_a_talk:0 "재계 간담회"
 TFRKPHN_chb_a_talk_tt:0 "§Y재계와 마주 앉는다§!\n경제 단체장들을 불러 소유권은 지키겠다고 약속합니다.\n\n비용: £pol_power §Y8§!\n재계의 저항 §G-8§!\n경영계의 신뢰 §G+5§!\n§g한 번 쓰면 30일 동안 다시 쓸 수 없습니다.§!"
 TFRKPHN_chb_a_probe:0 "공정위 직권조사"
 TFRKPHN_chb_a_probe_tt:0 "§Y공정위가 직권조사에 나선다§!\n공정거래위원회가 부당 내부거래를 직접 조사합니다.\n재계는 반발하고 노동계는 반깁니다.\n\n비용: £pol_power §Y13§!\n재계의 저항 §R+5§!\n경영계의 신뢰 §R-3§!\n노동계의 신뢰 §G+6§!\n§g한 번 쓰면 45일 동안 다시 쓸 수 없습니다.§!"
 TFRKPHN_chb_t_inv:0 "§Y정경유착 수사§!   [?TFRKPHN_chb_inv|0] / 4"
 TFRKPHN_chb_inv_go:0 "수사 지시"
 TFRKPHN_chb_inv_go_tt:0 "§Y정경유착 수사§!\n전쟁 동안 재벌과 정치권 사이에 오간 돈을 검찰이 수사합니다.\n\n1단계: 내사 착수\n2단계: 압수수색\n3단계: 총수와 정치인 소환\n4단계: 기소\n\n비용: £pol_power §Y15§!\n재계의 저항 §G-10§!\n경영계의 신뢰 §R-3§!\n안정도 §G+1%§!\n\n§G네 단계를 다 마치면 원안 개혁의 재계의 저항 증가가 +15에서 +10으로 줄어듭니다.§!\n§g한 번 지시하면 30일 동안 다시 지시할 수 없습니다.§!\n§g수사는 게임 설정입니다.§!"
 TFRKPHN_chb_hint:0 "§g카드를 눌러 개혁을 통과시킵니다. 재계의 저항이 60에 닿으면 아래 단추로 가라앉히거나 타협안으로 넘깁니다.\n개혁 항목은 유승민이 2017년 2월 13일에 내놓은 재벌개혁 공약입니다.§!"
 TFRKPHN_lee_chaebol_category:0 "재벌 개혁"
 TFRKPHN_lee_chaebol_category_desc:0 "전쟁 특수로 몸집을 불린 재벌을 바로잡습니다. 개혁 하나를 통과시킬 때마다 경영계의 신뢰가 내려가고 재계의 저항이 오릅니다. 저항이 60에 닿으면 여론전이나 간담회로 먼저 가라앉혀야 다음 개혁을 할 수 있습니다. 타협 단추를 켜면 저항이 높아도 통과시킬 수 있지만 효과가 절반입니다. 정경유착 수사를 지시하면 재계의 저항이 내려갑니다."
 tfrkphn.466.t:0 "유승민과의 만남"
 tfrkphn.466.d:0 "이인제 대통령이 유승민 전 의원을 집무실로 불렀습니다.\n\n유승민은 전화를 받고 놀랐습니다. 홍준표가 물려준 정부였습니다. 그 정부가 자신을 부를 까닭이 없다고 생각했습니다. 비서관은 재벌개혁 공약집을 가져와 달라고 했습니다. 유승민은 무슨 공약집이냐고 되물었습니다. 2017년 것이라는 답이 돌아왔습니다.\n\n유승민은 서류 한 묶음을 내놓았습니다. 공정거래위원회의 전속고발권을 없애고, 집단소송제와 징벌적 손해배상제를 들이고, 총수 일가의 개인회사를 막는 안이었습니다. 대통령은 서류를 끝까지 읽었습니다. 중간에 두 번 되물었습니다. 두 번 다 조문 번호를 짚은 질문이었습니다.\n\n유승민이 알던 이인제는 당을 여러 번 옮긴 사람이었습니다. 사람들은 그를 철새라고 불렀습니다. 유승민은 그런 사람이 재계와 맞서는 법안을 끝까지 읽으리라고 기대하지 않았습니다. 집무실을 나오면서 그는 자신이 사람을 별명으로 알고 있었다고 생각했습니다."
 tfrkphn.466.a:0 "이 안대로 갑시다"
 tfrkphn.466.b:0 "재계와 먼저 이야기하겠소"
 tfrkphn.466.open_tt:0 "결정 창에 §Y재벌 개혁§! 탭이 열립니다."
 tfrkphn.466.a_tt:0 "노동계의 신뢰 §G+5§!"
 tfrkphn.466.b_tt:0 "경영계의 신뢰 §G+5§!"
 tfrkphn.469.t:0 "누구 덕분에 대통령이 됐는데"
 tfrkphn.469.d:0 "유승민이 청와대에 다녀갔다는 기사가 오후에 났습니다. 그날 저녁 홍준표 전 대통령이 페이스북에 글을 올렸습니다.\n\n글은 여덟 줄이었습니다. 첫 줄은 이인제 대통령이 누구 덕분에 그 자리에 앉았느냐는 물음이었습니다. 홍준표는 자신이 전쟁을 치르고 물려준 정부라고 썼습니다. 그 정부의 집무실에 유승민이 들어갔다고 썼습니다.\n\n홍준표는 옛일을 차례로 꺼냈습니다. 2011년에 유승민이 최고위원 자리를 던져 자신이 당 대표에서 물러났다고 했습니다. 2017년 대선에서는 유승민이 보수 표를 갈랐다고 했습니다. 이번 재벌개혁안은 그때 정의당 공약과 비슷하다고 했던 그 안이라고 했습니다.\n\n마지막 줄은 짧았습니다. 사람을 쓰는 일은 대통령의 몫이지만 은혜를 잊는 일은 다르다고 했습니다. 유승민을 쓰려거든 자기 이름은 빼라고 했습니다.\n\n글은 한 시간 만에 기사 수십 건이 됐습니다. 여당 의원들의 전화가 밤새 비서실로 걸려 왔습니다. 유승민은 다음 날 기자들에게 재벌개혁안 이야기만 했습니다."
 tfrkphn.469.a:0 "전임 대통령을 찾아가 설명하겠소"
 tfrkphn.469.b:0 "인사는 대통령이 하는 일이오"
 TFRKPHN_chb_half:0 "재벌과의 타협"
 TFRKPHN_chb_half_desc:0 "\n\n\n\n£GFX_banner_TFRKPHN_chb_half\n\n\n\n\n\n재벌개혁 법안 여덟 개가 모두 국회를 통과했습니다. 그 가운데 절반 이상은 재계와 마주 앉아 고친 안이었습니다. 타협한 법안에는 예외 조항이 붙었습니다. 적용 대상은 자산 규모가 큰 몇 개 그룹으로 좁혀졌습니다. 시행일은 대부분 몇 해 뒤로 밀렸습니다.\n\n총수 일가의 개인회사는 이름을 바꾸고 지분을 쪼개 남았습니다. 경제 단체들은 투자를 미루겠다던 성명을 거뒀습니다. 정부는 재계와 찍은 간담회 사진을 내고 대타협이라고 발표했습니다. 노동계는 그 사진에 노조가 없다고 논평했습니다. 재벌은 예전보다 조심스러워졌고, 그 이상 달라진 것은 많지 않습니다."
 TFRKPHN_chb_sme:0 "중소기업의 약진"
 TFRKPHN_chb_sme_desc:0 "\n\n\n\n£GFX_banner_TFRKPHN_chb_sme\n\n\n\n\n\n재벌개혁 법안 여덟 개가 한 줄도 고쳐지지 않고 국회를 통과했습니다. 총수 일가의 개인회사는 문을 닫았습니다. 그 회사들이 수의계약으로 받던 일감이 공개 입찰에 나왔습니다. 첫 해에 입찰을 따낸 곳의 절반이 직원 쉰 명이 안 되는 회사였습니다.\n\n납품 단가를 깎인 업체는 이제 공정위를 거치지 않고 법원에 갑니다. 한 사람이 이기면 같은 피해를 본 업체가 모두 배상을 받습니다. 대기업 구매 담당자들은 계약서를 다시 쓰기 시작했습니다. 공단의 작은 공장들이 십 년 만에 설비를 새로 들이고 사람을 뽑습니다."
 tfrkphn.467.idea_tt:0 "국민정신 §Y재벌의 독주§!가 사라집니다.\n타협한 개혁이 하나도 없으면 §Y중소기업의 약진§!, §Y4개§! 이상이면 §Y재벌과의 타협§!, 그 사이면 §Y재벌의 협력§!이 붙습니다.\n§g타협한 개혁: [?TFRKPHN_chb_nc|0]개§!"
 tfrkphn.467.t:0 "수레가 굴러간다"
 tfrkphn.467.d0:0 "여의도, 국회 본회의장 방청석.\n\n마지막 법안의 표결 결과가 전광판에 떴다. 유승민은 방청석 맨 뒷줄에 앉아 있었다. 의원 배지를 뗀 지 여러 해였다. 아래층 의석에서 박수가 나왔다. 그는 박수를 치지 않고 찬성 숫자를 끝까지 읽었다. 그리고 자리에서 일어났다.\n\n복도는 조용했다. 그는 이 복도를 네 번의 임기 동안 걸었다. 2015년 봄에는 원내대표로 저 아래 연단에 섰다. 그날 그는 증세 없는 복지는 허구라고 말했고 재벌도 개혁에 동참해야 한다고 말했다. 석 달 뒤 그는 원내대표에서 물러났다.\n\n2017년 2월에는 기자들 앞에서 재벌개혁 공약을 읽었다. 전속고발권 폐지, 집단소송제, 징벌적 손해배상, 총수 일가의 개인회사 금지. 석 달 뒤 받은 표는 6.8퍼센트였다. 공약집은 서재 책장 맨 아래 칸으로 내려갔다. 그 뒤로 당이 여러 번 바뀌었고 공약집은 그 자리에 있었다.\n\n그는 한국개발연구원에서 13년을 일한 경제학자였다. 숫자가 틀리면 정책이 틀린다고 배웠다. 정치에 와서는 숫자가 맞아도 표가 되지 않는 일을 여러 번 겪었다. 이인제 대통령이 집무실로 불렀을 때 그는 그 공약집을 가방에 넣고 갔다. 대통령은 서류를 끝까지 읽었다.\n\n오늘 통과된 여덟 법안은 그 공약집과 뼈대가 같았다. 재계와 타협해 고친 줄은 하나도 없었다. 경제 단체들은 세 번 성명을 냈고 세 번 다 표결은 예정대로 열렸다.\n\n그는 주차장에서 휴대폰을 꺼냈다. 그때 공약집을 같이 썼던 사람에게 문자를 보냈다. 답은 금방 왔다. 오래 걸렸네요.\n\n그는 휴대폰을 주머니에 넣고 시동을 걸었다."
 tfrkphn.467.d1:0 "여의도, 국회 본회의장 방청석.\n\n마지막 법안의 표결 결과가 전광판에 떴다. 유승민은 방청석 맨 뒷줄에 앉아 있었다. 의원 배지를 뗀 지 여러 해였다. 아래층 의석에서 박수가 나왔다. 그는 박수를 치지 않고 찬성 숫자를 끝까지 읽었다. 그리고 자리에서 일어났다.\n\n복도는 조용했다. 그는 이 복도를 네 번의 임기 동안 걸었다. 2015년 봄에는 원내대표로 저 아래 연단에 섰다. 그날 그는 증세 없는 복지는 허구라고 말했고 재벌도 개혁에 동참해야 한다고 말했다. 석 달 뒤 그는 원내대표에서 물러났다.\n\n2017년 2월에는 기자들 앞에서 재벌개혁 공약을 읽었다. 전속고발권 폐지, 집단소송제, 징벌적 손해배상, 총수 일가의 개인회사 금지. 석 달 뒤 받은 표는 6.8퍼센트였다. 공약집은 서재 책장 맨 아래 칸으로 내려갔다. 그 뒤로 당이 여러 번 바뀌었고 공약집은 그 자리에 있었다.\n\n그는 한국개발연구원에서 13년을 일한 경제학자였다. 숫자가 틀리면 정책이 틀린다고 배웠다. 정치에 와서는 숫자가 맞아도 표가 되지 않는 일을 여러 번 겪었다. 이인제 대통령이 집무실로 불렀을 때 그는 그 공약집을 가방에 넣고 갔다. 대통령은 서류를 끝까지 읽었다.\n\n법안 몇 개에는 예외 조항이 붙었다. 재계와 마주 앉아 고친 줄이었다. 그는 그 조항을 한 줄씩 읽고 받아들였다. 뼈대는 남았다고 판단했다. 경제학자는 완전한 안보다 통과되는 안을 고르는 법도 배운다.\n\n그는 주차장에서 휴대폰을 꺼냈다. 그때 공약집을 같이 썼던 사람에게 문자를 보냈다. 거의 됐다고 썼다. 답은 금방 왔다. 거의면 됐습니다.\n\n그는 휴대폰을 주머니에 넣고 시동을 걸었다."
