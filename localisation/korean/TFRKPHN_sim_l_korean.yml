 TFRKPHN_sim_01:0 "진보대통령 심상정"
 TFRKPHN_sim_01_desc:0 "대한민국 헌정사상 첫 진보 대통령 심상정은 항상 세상에 도전하는 삶을 살아왔습니다. 서울대 학벌을 버리고 가시밭길 운동권에 뛰어들었고, 편한 양당을 포기하고 소수정당에 몸담았습니다. 결국 그녀는 아무도 오르지 못할 것이라 여겼던 대한민국 대통령의 자리까지 올랐습니다. 그리고 그녀는 또다시 세상에 도전할 것입니다."
 tfrkphn.7119.t:0 "꿈의 시작"
 tfrkphn.7119.d:0 "존경하는 국민 여러분, 재외동포 여러분, 국내에 체류 중인 외국인 여러분, 그리고 우리 사회에서 소외받는 모든 약자 여러분. 대통령 심상정입니다.\n\n저는 자유민주주의와 공정한 시장경제 체제를 기반으로 정의롭고 평등한 나라를 세우고, 기후 악당 국가에서 국제사회의 일원으로서 책임지는 국가를 만들겠습니다.\n\n지금 우리 사회의 불평등과 양극화는 매우 극심합니다. 서민과 부자의 빈부격차는 따라잡기 어렵고, 자신의 정체성이나 신체적 장애 때문에 기본권도 보장받지 못하는 시민들이 우리 곁에 있습니다.\n\n대한민국 안에서 그 누구도 자신의 다름으로 인해 차별받거나 불이익을 받는 일이 없도록 하겠습니다.\n\n하나, 차별금지법 제정으로 차별과 혐오를 종식하겠습니다. 둘, 전 국민에게 기본권을 보장하여 누구도 존엄을 잃지 않는 나라를 만들겠습니다. 셋, 낡은 양당 정치를 바꿔 작은 목소리도 국회에 닿게 하겠습니다.\n\n하나 된 우리 국민은 위기 앞에서 항상 이겨 왔습니다. 우리 다시 손을 잡고 차별 없는 평등한 나라를 향해 나아갑시다!"
 tfrkphn.7119.a:0 "시지프스의 바위는 또다시 굴러가기 시작한다."
