 TFRKPHN_sim_rf01:0 "차별금지법 제정"
 TFRKPHN_sim_rf01_desc:0 "성별과 장애, 성적 지향을 이유로 한 차별을 법으로 금지합니다. 국회에서 여러 번 발의되고도 본회의에 오르지 못한 법입니다."
 TFRKPHN_sim_rf02:0 "선거제도 개혁"
 TFRKPHN_sim_rf02_desc:0 "비례대표 의석을 늘리고 교섭단체 요건을 낮춥니다. 작은 정당의 표가 의석으로 이어지게 합니다."
 TFRKPHN_sim_rf03:0 "주4일제 도입"
 TFRKPHN_sim_rf03_desc:0 "공공기관부터 주4일 근무를 시작하고 민간 기업으로 넓힙니다. 임금은 줄이지 않습니다."
 TFRKPHN_sim_rf04:0 "기본권 보장법"
 TFRKPHN_sim_rf04_desc:0 "주거와 의료, 돌봄을 국가가 책임지는 기본권으로 법에 적습니다."
 TFRKPHN_sim_rf05:0 "학벌사회 철폐"
 TFRKPHN_sim_rf05_desc:0 "공공 부문 채용에서 출신 학교를 가리고 국립대를 하나의 연합으로 묶습니다."
 TFRKPHN_sim_rf06:0 "노동 존중 사회"
 TFRKPHN_sim_rf06_desc:0 "다섯 명이 안 되는 사업장에도 근로기준법을 적용하고 노동조합 활동을 넓게 보장합니다."
 TFRKPHN_sim_rf07:0 "전국민 기본소득"
 TFRKPHN_sim_rf07_desc:0 "농어촌에서 시작한 기본소득을 모든 국민에게 넓힙니다."
 TFRKPHN_sim_rf08:0 "재벌개혁"
 TFRKPHN_sim_rf08_desc:0 "총수 일가의 지배 구조를 고치고 하청 업체와의 거래를 공정하게 바꿉니다."
 TFRKPHN_sim_rf09:0 "정의로운 전환"
 TFRKPHN_sim_rf09_desc:0 "석탄 발전소를 차례로 닫고 그곳에서 일하던 노동자의 일자리를 정부가 마련합니다."
 TFRKPHN_sim_rf10:0 "국방개혁"
 TFRKPHN_sim_rf10_desc:0 "병사 처우를 끌어올리고 군 사법 제도를 민간 법원으로 넘깁니다."
 TFRKPHN_sim_pw_people:0 "거리에서 시민을 만난다"
 TFRKPHN_sim_pw_people_desc:0 "대통령이 광장과 일터를 찾아 개혁안을 직접 설명합니다."
 TFRKPHN_sim_pw_dem:0 "민주당 지도부와 만난다"
 TFRKPHN_sim_pw_dem_desc:0 "민주당 지도부를 만나 개혁 법안의 표결 협조를 구합니다."
 TFRKPHN_sim_02_tt:0 "결정 탭 §Y시지프스의 바위 굴리기§!, §Y심상정의 개혁 정책§!, §Y민중 지지도와 민주당과의 협력§!이 열립니다.\n개혁 정책이 하나 통과할 때마다 시지프스의 바위가 한 칸 굴러 올라갑니다."
 TFRKPHN_sim_rock_category:0 "시지프스의 바위 굴리기"
 TFRKPHN_sim_rock_category_desc:0 "개혁 정책이 하나 통과할 때마다 바위가 한 칸 올라갑니다. 열 칸을 모두 오르면 꼭대기에 닿습니다."
 TFRKPHN_sim_rock_top:0 "시지프스의 바위 굴리기   §Y[?TFRKPHN_sim_rock|0]§! / 10"
 TFRKPHN_sim_reform_category:0 "심상정의 개혁 정책"
 TFRKPHN_sim_reform_category_desc:0 "심상정 정부의 10대 개혁입니다. 한 번에 하나씩 국회에 올립니다.\n민중 지지도 §Y[?TFRKPHN_sim_people|0]§!   민주당 협력도 §Y[?TFRKPHN_sim_dem|0]§!"
 TFRKPHN_sim_power_category:0 "민중 지지도와 민주당과의 협력"
 TFRKPHN_sim_power_category_desc:0 "정의당 의석만으로는 법안을 통과시킬 수 없습니다. 개혁 정책 하나를 올리려면 민중 지지도와 민주당 협력도가 각각 40을 넘어야 합니다.\n민중 지지도 §Y[?TFRKPHN_sim_people|0]§!   민주당 협력도 §Y[?TFRKPHN_sim_dem|0]§!"
 TFRKPHN_sim_need_people_tt:0 "민중 지지도 §Y40§! 이상 (지금 §Y[?TFRKPHN_sim_people|0]§!)"
 TFRKPHN_sim_need_dem_tt:0 "민주당 협력도 §Y40§! 이상 (지금 §Y[?TFRKPHN_sim_dem|0]§!)"
 TFRKPHN_sim_one_at_a_time_tt:0 "국회에 올라가 있는 다른 개혁 정책이 없습니다."
 TFRKPHN_sim_rf_spend_tt:0 "민중 지지도 §R-20§!, 민주당 협력도 §R-20§!"
 TFRKPHN_sim_rock_up_tt:0 "법안이 국회를 통과합니다. §Y시지프스의 바위§!가 한 칸 굴러 올라갑니다."
 TFRKPHN_sim_add_people_tt:0 "민중 지지도 §G+10§!"
 TFRKPHN_sim_add_dem_tt:0 "민주당 협력도 §G+10§!"
 TFRKPHN_sim_max_tt:0 "아직 100에 닿지 않았습니다."
