l_korean:
 # [안내] [사람이 씀] 이낙연 루트 사건 7312, 7313. 사용자가 직접 쓴 글이라 고치지 않는다. nak_tree2.py가 만든다.
 tfrkphn.7312.t:0 "좋소"
 tfrkphn.7312.d:0 "충범은 어느 때와 다름 없이 회사로 출근했다. 적성을 살리지는 못했지만 붙은 회사가 여기 밖에 없었다. 이직또한 쉽지 않았다. 그렇게 회사에 대한 불만을 생각하며 들어왔는데 뭔가 이상했다. 늘 있던 사장님이 없었다.\n\"충범씨 얘기 들었어요? 정부가 중소 기업 지원한데요. 우리회사도 선정됐다던데. 그래서 지금 사장님 지금 없으신거에요.\"\n옆 자리 대리가 건조한 말투로 말했다.하지만 표정 아래에는 기쁨이 숨겨져 있는 것 같았다.\n\"아...네!\"\n충범은 대리의 건조한 말투에 떨떠름한 표정으로 답했다. 하지만 그도 마음 속에서는 기대가 가득 찼다. 뭘 지원해주는 지는 몰라도 아무튼 지원이라니깐 좋은 것이 틀림없었다."
 tfrkphn.7312.a:0 "'월급 10만원은 오르겠지?'"
 tfrkphn.7313.t:0 "이상은 사라지지않았다."
 tfrkphn.7313.d:0 "김경수는 문 앞에서 생각했다.\n'대통령님은 왜 나를 국무총리로 지명하셨을까?'\n그도 전쟁 전 특사로 석방되고 복권까지 된 건 그럴 수도 있다고 생각했다. 같은 당이니깐 하지만 국무총리는 다르다.무게감부터 청문회까지 말이다. 그렇게 생각해 몰두해있던 중 문이 열렸다.\n\"여기 앉으시죠\"\n이낙연은 신사답게 의자를 가리키며 말했다.\n김경수는 엉거주춤 의자에 앉았다. 그리고 마음 속에 담았던 질문을 꺼냈다.\n\"왜 대통령님은 저를 국무총리로 지명하신 겁니까?\"\n이낙연은 알 수 없는 미소로 답하기 시작했다.\n\"그의 이상을 가장 가까이에서 그리고 가장 마지막까지 지켜봐오신 분 아닙니까?\"\n김경수는 입술을 깨물며 말했다.\n\"하지만 저는 정치인으로서 하면 안되는 짓을 저질렀습니다. 제가 반성한다고 해도 그 죄는 영원히 낙인으로 남을 겁니다.\"\n이낙연은 예상했다는 듯이 대답했다.\n\"그래서 선택한겁니다. 그는 이상을 남겼지만 실현시키지 못했지요.이상의 밝은 면만 보여주고 가셨습니다.반대로 어두운 면은 보여주지 못하셨습니다.당신은 그 어두운 면까지 경험하신 분 아닙니까?\""
 tfrkphn.7313.a:0 "\"어둠 속에 있던 사람이 어둠을 가장 이해하는 법이니까요\""
 TFRKPHN_nak_united_party:0 "통합된 당"
