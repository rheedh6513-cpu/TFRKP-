 # [안내] 우원식 정부 결정 탭 을지로, 일곱 사람의 헌법. woo_tabs_build.py가 만든다.
 TFRKPHN_woo_eul_b1_tt:0 "§Y편의점§!\n본사가 정한 영업시간과 폐기 비용을 두고 점주들과 본사를 마주 앉힙니다.\n\n정치력 §R-30§!  안정도 §G+1%§!  사회 발전도 §G+0.02§!\n같은 현장은 넉 달 뒤에 다시 찾을 수 있습니다."
 TFRKPHN_woo_eul_b2_tt:0 "§Y택배 상하차장§!\n분류 작업을 누가 맡을지를 두고 기사들과 택배 회사를 마주 앉힙니다.\n\n정치력 §R-30§!  안정도 §G+1%§!  사회 발전도 §G+0.02§!\n같은 현장은 넉 달 뒤에 다시 찾을 수 있습니다."
 TFRKPHN_woo_eul_b3_tt:0 "§Y하청 공장§!\n전쟁 뒤 깎인 납품 단가를 두고 하청 공장과 원청 회사를 마주 앉힙니다.\n\n정치력 §R-30§!  산업 발전도 §G+0.03§!\n같은 현장은 넉 달 뒤에 다시 찾을 수 있습니다."
 TFRKPHN_woo_eul_b4_tt:0 "§Y청소 노동자 휴게실§!\n계단 밑에 있는 휴게실을 고치는 문제로 용역 회사와 건물 주인을 부릅니다.\n\n정치력 §R-30§!  사회 발전도 §G+0.03§!\n같은 현장은 넉 달 뒤에 다시 찾을 수 있습니다."
 TFRKPHN_woo_eul_b5_tt:0 "§Y대리점 창고§!\n본사가 떠넘긴 물량을 두고 대리점 주인들과 본사를 마주 앉힙니다.\n\n정치력 §R-30§!  안정도 §G+1%§!  산업 발전도 §G+0.02§!\n같은 현장은 넉 달 뒤에 다시 찾을 수 있습니다."
 TFRKPHN_woo_eul_b6_tt:0 "§Y건설 현장§!\n밀린 임금을 두고 일용직 노동자들과 건설 회사를 마주 앉힙니다.\n\n정치력 §R-30§!  안정도 §G+2%§!\n같은 현장은 넉 달 뒤에 다시 찾을 수 있습니다."
 TFRKPHN_woo_eul_category:0 "을지로"
 TFRKPHN_woo_eul_category_desc:0 "대통령은 국회의원 시절 갑과 을의 다툼을 찾아다니며 양쪽을 마주 앉히던 사람입니다. 사진을 누르면 대통령이 그 현장을 찾아갑니다."
 TFRKPHN_woo_con_b1_tt:0 "§Y제1조§! 대통령의 긴급명령은 마흔여덟 시간 안에 국회의 동의를 받아야 한다.\n\n찬성 §Y200석§! 이상일 때 누르면 이 조문을 확정합니다.\n정치력 §R-30§!  안정도 §G+2%§!\n확정하면 찬성 의석이 §R6석§! 빠집니다."
 TFRKPHN_woo_con_b2_tt:0 "§Y제2조§! 군인은 정치에 관여할 수 없고 국회와 정당에 병력을 보낼 수 없다.\n\n찬성 §Y200석§! 이상일 때 누르면 이 조문을 확정합니다.\n정치력 §R-30§!  안정도 §G+2%§!\n확정하면 찬성 의석이 §R6석§! 빠집니다."
 TFRKPHN_woo_con_b3_tt:0 "§Y제3조§! 국무회의의 회의록은 공개한다.\n\n찬성 §Y200석§! 이상일 때 누르면 이 조문을 확정합니다.\n정치력 §R-30§!  정치력 §G+40§!\n확정하면 찬성 의석이 §R6석§! 빠집니다."
 TFRKPHN_woo_con_b4_tt:0 "§Y제4조§! 정보기관의 예산과 활동은 국회가 감독한다.\n\n찬성 §Y200석§! 이상일 때 누르면 이 조문을 확정합니다.\n정치력 §R-30§!  안정도 §G+1%§!  정치력 §G+20§!\n확정하면 찬성 의석이 §R6석§! 빠집니다."
 TFRKPHN_woo_con_b5_tt:0 "§Y제5조§! 국회의 의석은 정당이 얻은 표에 비례하여 나눈다.\n\n찬성 §Y200석§! 이상일 때 누르면 이 조문을 확정합니다.\n정치력 §R-30§!  사회 발전도 §G+0.03§!\n확정하면 찬성 의석이 §R6석§! 빠집니다."
 TFRKPHN_woo_con_b6_tt:0 "§Y제6조§! 지방의 일은 지방 의회가 정한다.\n\n찬성 §Y200석§! 이상일 때 누르면 이 조문을 확정합니다.\n정치력 §R-30§!  안정도 §G+1%§!  사회 발전도 §G+0.02§!\n확정하면 찬성 의석이 §R6석§! 빠집니다."
 TFRKPHN_woo_con_b7_tt:0 "§Y부칙§! 이 헌법을 공포할 때의 대통령은 다음 국회의원 총선거일에 물러난다.\n\n찬성 §Y200석§! 이상일 때 누르면 이 조문을 확정합니다.\n정치력 §R-30§!  안정도 §G+3%§!\n확정하면 찬성 의석이 §R6석§! 빠집니다.\n앞의 여섯 조문을 모두 확정해야 합니다. 대통령이 직접 넣자고 한 조항입니다.\n일곱 장을 모두 확정하면 안정도 §G+5%§!"
 TFRKPHN_woo_con_category:0 "일곱 사람의 헌법"
 TFRKPHN_woo_con_category_desc:0 "일곱 사람이 쓴 초안을 국회에서 한 조문씩 확정합니다. 찬성이 200석을 넘어야 조문을 확정할 수 있고, 하나를 확정할 때마다 찬성 의석이 조금씩 빠집니다. 아래 결정으로 찬성 의석을 다시 모읍니다."
 TFRKPHN_woo_con_top:0 "찬성 §Y[?TFRKPHN_wc_yes|0]§!석 / 필요 200석     확정한 조문 §Y[?TFRKPHN_wc_cnt|0]§! / 7"
 TFRKPHN_wc_open_tt:0 "결정 탭 §Y일곱 사람의 헌법§!이 열립니다. 찬성 §Y186석§!에서 시작합니다."
 TFRKPHN_woo_con_persuade:0 "반대 의원 설득"
 TFRKPHN_woo_con_persuade_desc:0 "반대표를 던지려는 의원들을 한 명씩 만나 설득합니다."
 TFRKPHN_woo_con_persuade_tt:0 "찬성 의석 §G+2~4§!"
 TFRKPHN_woo_con_coalition:0 "연정 대표 회동"
 TFRKPHN_woo_con_coalition_desc:0 "헌정회복연대에 든 당의 대표들을 모아 표 단속을 부탁합니다."
 TFRKPHN_woo_con_coalition_tt:0 "찬성 의석 §G+1~3§!"
 TFRKPHN_woo_con_concede:0 "야당에 양보"
 TFRKPHN_woo_con_concede_desc:0 "우리공화당과 진보 정당의 요구를 초안에 일부 받아들입니다."
 TFRKPHN_woo_con_concede_tt:0 "찬성 의석 §G+4~7§!"
 TFRKPHN_woo_arc_b1_tt:0 "§Y참전 결정 국무회의록§!\n양안전쟁에 끼어들기로 한 날의 국무회의 기록입니다. 누가 찬성했고 누가 말이 없었는지 적혀 있습니다.\n\n누르면 이 문서를 공개합니다.\n정치력 §R-20§!  개방 §G+5§!  안정도 §R-1%§!\n한 번 공개한 문서는 다시 덮을 수 없습니다."
 TFRKPHN_woo_arc_b2_tt:0 "§Y돌아오지 못한 사람들의 명단§!\n비밀 지원에 나갔다가 숨진 군인과 선원의 이름입니다. 가족들도 받지 못한 명단입니다.\n\n누르면 이 문서를 공개합니다.\n정치력 §R-20§!  개방 §G+5§!  안정도 §R-1%§!\n한 번 공개한 문서는 다시 덮을 수 없습니다."
 TFRKPHN_woo_arc_b3_tt:0 "§Y긴급명령 기안 문서§!\n긴급명령의 초안과 고친 흔적입니다. 어느 문장이 누구 손에서 들어갔는지 보입니다.\n\n누르면 이 문서를 공개합니다.\n정치력 §R-20§!  개방 §G+5§!  안정도 §R-1%§!\n한 번 공개한 문서는 다시 덮을 수 없습니다."
 TFRKPHN_woo_arc_b4_tt:0 "§Y여의도의 사흘 통신 기록§!\n전차가 국회 앞에 서 있던 사흘 동안의 지휘 통신입니다. 명령을 내린 사람과 따르지 않은 사람이 나옵니다.\n\n누르면 이 문서를 공개합니다.\n정치력 §R-20§!  개방 §G+5§!  안정도 §R-1%§!\n한 번 공개한 문서는 다시 덮을 수 없습니다."
 TFRKPHN_woo_arc_b5_tt:0 "§Y전쟁 국채 장부§!\n전쟁 동안 찍은 국채와 그 돈이 간 곳을 적은 장부입니다.\n\n누르면 이 문서를 공개합니다.\n정치력 §R-20§!  개방 §G+5§!  안정도 §R-1%§!\n한 번 공개한 문서는 다시 덮을 수 없습니다."
 TFRKPHN_woo_arc_b6_tt:0 "§Y정당 해산 청구 내부 문건§!\n민주당 해산 청구서를 쓰던 때 법무부 안에서 오간 보고서입니다.\n\n누르면 이 문서를 공개합니다.\n정치력 §R-20§!  개방 §G+5§!  안정도 §R-1%§!\n한 번 공개한 문서는 다시 덮을 수 없습니다."
 TFRKPHN_woo_arc_category:0 "패전 문서고"
 TFRKPHN_woo_arc_category_desc:0 "전쟁과 긴급명령에 관한 문서가 문서고에 잠겨 있습니다. 서류철을 누르면 그 문서를 공개합니다. 공개할수록 나라는 열리지만 거리는 시끄러워집니다."
 TFRKPHN_woo_arc_top:0 "개방 §Y[?TFRKPHN_woo_open|0]§! / 100"
 TFRKPHN_woo_ind_b1_tt:0 "§Y홍범도§!  1868 ~ 1943\n\n\n\n\n\n£GFX_TFRKPHN_woo_ind_card_1_texticon\n\n\n\n\n\n\n§H생애§!\n평안도에서 태어났습니다.\n1907년 포수들을 모아 의병을 일으켰습니다.\n1937년 카자흐스탄 크즐오르다로 강제 이주를 당했습니다.\n극장 수위로 일하다 그곳에서 눈을 감았습니다.\n\n§H업적§!\n1919년 대한독립군을 만들었습니다.\n1920년 6월 봉오동에서 일본군을 크게 이겼습니다.\n같은 해 10월 청산리에서도 싸웠습니다.\n2021년 광복절에 유해가 돌아와 대전현충원에 묻혔습니다.\n건국훈장 대한민국장을 받았습니다.\n\n누르면 이 이름을 새긴 동판을 사관학교와 부대 정문에 겁니다.\n정치력 §R-25§!  전쟁 지지도 §G+1%§!  군사 발전도 §G+0.02§!\n여섯 장을 모두 걸면 안정도 §G+3%§!"
 TFRKPHN_woo_ind_b2_tt:0 "§Y김좌진§!  1889 ~ 1930\n\n\n\n\n\n£GFX_TFRKPHN_woo_ind_card_2_texticon\n\n\n\n\n\n\n§H생애§!\n충청남도 홍성에서 태어났습니다.\n만주로 건너가 독립군을 이끌었습니다.\n1930년 1월 정미소에서 총에 맞아 숨졌습니다.\n\n§H업적§!\n북로군정서 사령관을 맡았습니다.\n1920년 10월 청산리에서 일본군과 싸워 이겼습니다.\n1925년 신민부의 총사령관이 되었습니다.\n1929년 한족총연합회 주석을 맡았습니다.\n건국훈장 대한민국장을 받았습니다.\n\n누르면 이 이름을 새긴 동판을 사관학교와 부대 정문에 겁니다.\n정치력 §R-25§!  전쟁 지지도 §G+1%§!  군사 발전도 §G+0.02§!\n여섯 장을 모두 걸면 안정도 §G+3%§!"
 TFRKPHN_woo_ind_b3_tt:0 "§Y지청천§!  1888 ~ 1957\n\n\n\n\n\n£GFX_TFRKPHN_woo_ind_card_3_texticon\n\n\n\n\n\n\n§H생애§!\n서울에서 태어났습니다.\n일본 육군사관학교를 나와 일본군 장교가 되었습니다.\n1919년 부대를 빠져나와 만주로 망명했습니다.\n\n§H업적§!\n신흥무관학교에서 독립군을 길렀습니다.\n1940년 한국광복군이 만들어질 때 총사령관을 맡았습니다.\n광복 뒤 제헌 국회의원과 첫 무임소 장관을 지냈습니다.\n건국훈장 대통령장을 받았습니다.\n\n누르면 이 이름을 새긴 동판을 사관학교와 부대 정문에 겁니다.\n정치력 §R-25§!  전쟁 지지도 §G+1%§!  군사 발전도 §G+0.02§!\n여섯 장을 모두 걸면 안정도 §G+3%§!"
 TFRKPHN_woo_ind_b4_tt:0 "§Y이범석§!  1900 ~ 1972\n\n\n\n\n\n£GFX_TFRKPHN_woo_ind_card_4_texticon\n\n\n\n\n\n\n§H생애§!\n서울에서 태어났습니다.\n중국 운남강무학교를 수석으로 나왔습니다.\n북로군정서에서 교관으로 일했습니다.\n\n§H업적§!\n1920년 10월 청산리에서 부대를 지휘했습니다.\n1945년 한국광복군 참모장이 되었습니다.\n1948년 첫 국무총리와 국방부 장관을 함께 맡았습니다.\n건국훈장 대통령장을 받았습니다.\n\n누르면 이 이름을 새긴 동판을 사관학교와 부대 정문에 겁니다.\n정치력 §R-25§!  전쟁 지지도 §G+1%§!  군사 발전도 §G+0.02§!\n여섯 장을 모두 걸면 안정도 §G+3%§!"
 TFRKPHN_woo_ind_b5_tt:0 "§Y이회영§!  1867 ~ 1932\n\n\n\n\n\n£GFX_TFRKPHN_woo_ind_card_5_texticon\n\n\n\n\n\n\n§H생애§!\n서울의 이름난 집안에서 태어났습니다.\n1910년 나라를 빼앗기자 여섯 형제가 재산을 모두 팔았습니다.\n온 집안이 만주로 건너갔습니다.\n1932년 일본 경찰에 붙잡혀 심문을 받다 숨졌습니다.\n\n§H업적§!\n만주에 신흥강습소를 세웠습니다.\n이 학교가 신흥무관학교로 자라 독립군 간부를 길러 냈습니다.\n청산리에서 싸운 지휘관 여럿이 이 학교에서 나왔습니다.\n\n누르면 이 이름을 새긴 동판을 사관학교와 부대 정문에 겁니다.\n정치력 §R-25§!  전쟁 지지도 §G+1%§!  군사 발전도 §G+0.02§!\n여섯 장을 모두 걸면 안정도 §G+3%§!"
 TFRKPHN_woo_ind_b6_tt:0 "§Y안중근§!  1879 ~ 1910\n\n\n\n\n\n£GFX_TFRKPHN_woo_ind_card_6_texticon\n\n\n\n\n\n\n§H생애§!\n황해도 해주에서 태어났습니다.\n삼흥학교를 세우고 돈의학교를 맡아 아이들을 가르쳤습니다.\n나라가 기울자 연해주로 건너가 의병이 되었습니다.\n1910년 3월 26일 뤼순 감옥에서 순국했습니다.\n\n§H업적§!\n대한의군 참모중장으로 의병을 이끌었습니다.\n1909년 동지 열두 명과 손가락을 끊어 맹세했습니다.\n1909년 10월 26일 하얼빈에서 이토 히로부미를 쏘았습니다.\n건국훈장 대한민국장을 받았습니다.\n\n누르면 이 이름을 새긴 동판을 사관학교와 부대 정문에 겁니다.\n정치력 §R-25§!  전쟁 지지도 §G+1%§!  군사 발전도 §G+0.02§!\n여섯 장을 모두 걸면 안정도 §G+3%§!"
 TFRKPHN_woo_ind_category:0 "독립군의 이름"
 TFRKPHN_woo_ind_category_desc:0 "전차가 국회 앞에 섰던 군을 다시 세우려면 군이 어디서 왔는지부터 물어야 합니다. 대통령은 독립군 지휘관들을 기리는 일을 오래 맡아 온 사람입니다. 동판을 누르면 그 이름을 군에 겁니다."
