 TFRKPHN_le_bio_g6:0 "£GFX_KOR_PPP_texticon §Y이장우§!  현직\n§Y출생:§! 1965년 2월 10일\n§Y학력:§!\n대전대학교\n§Y이력:§!\n1987년 대전대학교 총학생회장을 지냈습니다. 1997년 국회의원\n비서관과 보좌관으로 일을 시작했고 2005년 한나라당 대전시당 대변인을\n맡았습니다. 2006년부터 2010년까지 대전 동구청장을 지냈습니다.\n2012년 대전 동구에서 제19대 국회의원에 당선됐고 2016년\n재선했습니다.\n \n§Y이 세계에서는:§!\n2022년에 당선된 현직입니다."
 TFRKPHN_le_bio_o6:0 "£GFX_KOR_DemocraticParty_texticon §Y허태정§!  도전\n§Y출생:§! 1965년 9월 12일, 충청남도 예산군 대술면\n§Y학력:§!\n대전대성고등학교, 충남대학교 철학과\n§Y이력:§!\n노무현 정부 청와대에서 인사 행정관과 사회 행정관을 지냈고 과학기술부\n장관 정책보좌관으로 일했습니다. 2010년 대전 유성구청장에 당선됐고\n2014년 재선했습니다. 2018년 대전광역시장에 당선됐습니다.\n§Y눈에 띄는 일:§!\n여섯 남매의 막내입니다. 충남대학교에 다닐 때 학생운동을 했습니다.\n \n§Y이 세계에서는:§!\n시장 자리를 되찾으려는 야당 후보입니다."
