 TFRKPHN_le_bio_g13:0 "£GFX_KOR_PPP_texticon §Y조배숙§!  도전\n§Y출생:§! 1956년 9월 10일, 전라북도 익산\n§Y학력:§!\n서울대학교 법학과\n§Y이력:§!\n1980년 사법시험에 합격했습니다(사법연수원 12기). 1982년\n서울지방검찰청 검사가 됐고 1986년부터 판사로 일했습니다. 1995년\n변호사로 개업했습니다. 2001년 비례대표로 제16대 국회의원이 됐고\n2004년과 2008년 익산시 을에서 당선됐습니다. 2012년 낙선했다가\n2016년 국민의당 후보로 익산시 을에서 다시 당선됐습니다. 2018년\n민주평화당 초대 대표를 맡았습니다.\n§Y눈에 띄는 일:§!\n1982년 검사로 임용될 때 우리나라 첫 여성 검사 가운데 한\n사람이었습니다.\n \n§Y이 세계에서는:§!\n여당의 전북도지사 후보입니다."
 TFRKPHN_le_bio_o13:0 "£GFX_KOR_DemocraticParty_texticon §Y김관영§!  현직\n§Y출생:§! 1969년 11월 15일, 전라북도 군산\n§Y학력:§!\n성균관대학교 경영학과\n§Y이력:§!\n1990년 청운회계법인에서 공인회계사로 일을 시작했습니다. 1992년\n행정고시에 합격해 재정경제부 행정사무관을 지냈고 1999년 사법시험에\n합격했습니다. 2002년부터 2011년까지 김앤장에서 변호사로\n일했습니다. 2012년 군산에서 제19대 국회의원에 당선됐고 2016년\n국민의당 후보로 재선했습니다. 2017년 국민의당 사무총장, 2018년\n바른미래당 원내대표를 맡았습니다.\n§Y눈에 띄는 일:§!\n공인회계사 시험, 행정고시, 사법시험에 모두 합격했습니다.\n \n§Y이 세계에서는:§!\n2022년에 당선된 현직입니다."
 TFRKPHN_le_bio_g13v1:0 "£GFX_KOR_PPP_texticon §Y양정무§!  현직\n§Y출생:§! 전라북도 순창군 구림면\n§Y학력:§!\n전주영생고등학교, 전주대학교 행정학과\n§Y이력:§!\n1991년 골프채를 만드는 랭스필드를 세웠고 Y랭스필드 회장을 맡고\n있습니다. 랭스필드 골프채는 1993년 대전엑스포와 2005년 부산\nAPEC 정상회의의 공식 브랜드로 쓰였습니다.\n§Y눈에 띄는 일:§!\n경기도 포천의 회사 안에 고조선역사박물관을 세웠습니다.\n \n§Y이 세계에서는:§!\n여당의 전북특별자치도지사 후보입니다. 2026년 지방선거에서 당선돼 지금\n이 자리를 맡고 있습니다."
