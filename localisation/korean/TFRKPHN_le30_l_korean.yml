 TFRKPHN_le_bio_o13v2:0 "£GFX_KOR_DemocraticParty_texticon §Y이원택§!  현직\n§Y출생:§! 전라북도 김제\n§Y학력:§!\n남성고등학교, 전북대학교 화학공학과\n§Y이력:§!\n청와대 행정관과 전라북도 정무부지사를 지냈습니다. 2020년 제21대\n총선에서 국회의원에 당선됐습니다.\n \n§Y이 세계에서는:§!\n야당의 전북특별자치도지사 후보입니다. 2026년 지방선거에서 당선돼 지금\n이 자리를 맡고 있습니다."
 TFRKPHN_le_bio_g14:0 "£GFX_KOR_PPP_texticon §Y이정현§!  새 후보\n§Y출생:§! 1958년 10월 13일, 전라남도 곡성\n§Y학력:§!\n광주 살레시오고등학교, 동국대학교 정치외교학과\n§Y이력:§!\n1984년 민주정의당에 들어가 정치를 시작했습니다. 2008년 한나라당\n비례대표로 제18대 국회의원이 됐습니다. 2012년 광주 서구 을\n총선에서 낙선했습니다. 2013년 청와대 정무수석과 홍보수석을\n지냈습니다. 2014년 순천시 곡성군 재보궐선거에서 당선됐고 2016년\n순천에서 다시 당선됐습니다. 2016년 8월 새누리당 대표에 올랐다가\n그해 12월 물러났습니다. 2020년 총선에서 낙선했습니다.\n§Y눈에 띄는 일:§!\n제17대 대통령 선거 후보 경선 때 박근혜 후보의 대변인을 맡았습니다.\n보수 정당 후보로 호남 지역구에서 두 번 당선됐습니다.\n \n§Y이 세계에서는:§!\n여당의 전남광주통합특별시장 후보입니다."
 TFRKPHN_le_bio_o14:0 "£GFX_KOR_DemocraticParty_texticon §Y민형배§!  새 후보\n§Y출생:§! 1961년 6월 15일, 전라남도 해남군 마산면\n§Y학력:§!\n전남대학교 사회학과\n§Y이력:§!\n1988년 전남일보 창간 때 기자로 들어갔고 1999년 논설위원이\n됐습니다. 2002년 시민단체 참여자치21 대표를 맡았습니다.\n2006년부터 노무현 정부 청와대에서 인사관리행정관과 사회조정비서관을\n지냈습니다. 2010년 광주 광산구청장에 당선됐고 2014년\n재선했습니다. 2018년부터 문재인 정부 청와대 자치발전비서관과\n사회정책비서관을 지냈고 2020년 광주 광산구 을에서 제21대 국회의원에\n당선됐습니다.\n§Y눈에 띄는 일:§!\n2011년 광산구청에서 공공부문 비정규직 일흔네 명을 모두 정규직으로\n바꿨습니다.\n \n§Y이 세계에서는:§!\n야당의 전남광주통합특별시장 후보입니다."
 TFRKPHN_le_bio_g14v1:0 "£GFX_KOR_PPP_texticon §Y이정현§!  현직\n§Y출생:§! 1958년 10월 13일, 전라남도 곡성\n§Y학력:§!\n광주 살레시오고등학교, 동국대학교 정치외교학과\n§Y이력:§!\n1984년 민주정의당에 들어가 정치를 시작했습니다. 2008년 한나라당\n비례대표로 제18대 국회의원이 됐습니다. 2012년 광주 서구 을\n총선에서 낙선했습니다. 2013년 청와대 정무수석과 홍보수석을\n지냈습니다. 2014년 순천시 곡성군 재보궐선거에서 당선됐고 2016년\n순천에서 다시 당선됐습니다. 2016년 8월 새누리당 대표에 올랐다가\n그해 12월 물러났습니다. 2020년 총선에서 낙선했습니다.\n§Y눈에 띄는 일:§!\n제17대 대통령 선거 후보 경선 때 박근혜 후보의 대변인을 맡았습니다.\n보수 정당 후보로 호남 지역구에서 두 번 당선됐습니다.\n \n§Y이 세계에서는:§!\n여당의 전남광주통합특별시장 후보입니다. 2026년 지방선거에서 당선돼\n지금 이 자리를 맡고 있습니다."
