 TFRKPHN_le_bio_g17:0 "£GFX_KOR_PPP_texticon §Y허향진§!  도전\n§Y출생:§! 1955년 1월 24일\n§Y이력:§!\n제주대학교 관광경영학 교수로 일했고 경상대학 학장과 경영대학원 원장을\n지냈습니다. 2010년부터 2018년까지 제8, 9대 제주대학교 총장을\n맡았습니다. 제주발전연구원 원장과 한국대학교육협의회 회장을 지냈습니다.\n \n§Y이 세계에서는:§!\n여당의 제주도지사 후보입니다."
 TFRKPHN_le_bio_o17:0 "£GFX_KOR_DemocraticParty_texticon §Y오영훈§!  현직\n§Y출생:§! 1968년 12월 14일, 제주 서귀포시 남원읍\n§Y학력:§!\n제주대학교 경영학과\n§Y이력:§!\n1993년 제주대학교 총학생회장을 지냈습니다. 2004년부터 국회의원\n보좌관으로 일했습니다. 2006년 제주도의회 의원에 당선됐고 2010년\n재선했습니다. 2016년 제주시 을에서 제20대 국회의원에 당선됐고\n2017년 대통령 선거에서 문재인 후보 공보단 대변인을 맡았습니다.\n2020년 재선했고 2020년부터 2021년까지 이낙연 당대표 비서실장을\n지냈습니다.\n§Y눈에 띄는 일:§!\n제주 4.3 때 증조부와 할아버지를 잃은 집안에서 태어났습니다.\n \n§Y이 세계에서는:§!\n2022년에 당선된 현직입니다."
 TFRKPHN_le_bio_g17v1:0 "£GFX_KOR_PPP_texticon §Y문성유§!  현직\n§Y출생:§! 확인하지 못함\n§Y이력:§!\n기획재정부를 비롯한 중앙정부에서 서른 해 가까이 경제, 산업, 예산 일을\n했습니다. 기획재정부 기획관리실장과 미래창조과학부 기획조정실장을 지냈고,\n한국자산관리공사 사장을 맡았습니다.\n \n§Y이 세계에서는:§!\n여당의 제주도지사 후보입니다. 2026년 지방선거에서 당선돼 지금 이\n자리를 맡고 있습니다."
