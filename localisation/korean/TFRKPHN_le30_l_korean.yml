 TFRKPHN_le_bio_g11:0 "£GFX_KOR_PPP_texticon §Y김영환§!  현직\n§Y출생:§! 1955년 5월 27일, 충청북도 청주\n§Y학력:§!\n연세대학교 치과대학\n§Y이력:§!\n1989년 치과의사로 개업했습니다. 1996년 안산에서 제15대\n국회의원에 당선됐고 2001년 과학기술부 장관을 지냈습니다. 2004년과\n2008년 총선에서 낙선했다가 2009년 재보궐선거로 국회에 돌아왔고\n2012년 4선이 됐습니다. 2016년 총선, 2018년 경기도지사\n선거, 2020년 총선에서 낙선했습니다.\n§Y눈에 띄는 일:§!\n1987년 시집에 실린 시 한 편이 훗날 민중가요로 만들어졌습니다.\n \n§Y이 세계에서는:§!\n2022년에 당선된 현직입니다."
