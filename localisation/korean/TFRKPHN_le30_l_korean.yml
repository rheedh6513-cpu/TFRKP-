 TFRKPHN_le_bio_g4:0 "£GFX_KOR_PPP_texticon §Y유정복§!  현직\n§Y출생:§! 1957년 6월 16일, 인천 동구 송림동\n§Y학력:§!\n제물포고등학교, 연세대학교 정치외교학과\n§Y이력:§!\n1979년 행정고시에 합격했고 1981년 육군 학사사관 1기로\n임관했습니다. 1994년 김포군수, 1995년 인천 서구청장, 1998년\n김포시장을 지냈습니다. 2004년부터 김포에서 제17, 18, 19대\n국회의원을 지냈고 2005년 박근혜 한나라당 대표의 비서실장을\n맡았습니다. 2010년 농림수산식품부 장관, 2013년 안전행정부 장관을\n거쳐 2014년 인천광역시장에 취임했습니다.\n§Y눈에 띄는 일:§!\n김포군수에 취임할 때 서른여덟 살로 당시 전국에서 가장 젊은\n군수였습니다.\n \n§Y이 세계에서는:§!\n2022년에 시장으로 돌아온 현직입니다."
 TFRKPHN_le_bio_o4:0 "£GFX_KOR_DemocraticParty_texticon §Y박찬대§!  도전\n§Y출생:§! 1967년 5월 10일, 인천 미추홀구\n§Y학력:§!\n동인천고등학교, 인하대학교 경영학과, 서울대학교 대학원 경영학 석사\n§Y이력:§!\n공인회계사입니다. 1997년 세동회계법인, 1999년 삼일회계법인,\n2001년 금융감독원에서 일했고 2003년부터 2015년까지 한미회계법인\n경인본부장과 부대표를 지냈습니다. 2009년 민주당에 입당했습니다.\n2016년 인천 연수구 갑에서 제20대 국회의원에 당선됐고 2019년\n더불어민주당 원내대변인을 맡았습니다. 2020년 재선했습니다.\n \n§Y이 세계에서는:§!\n야당의 인천시장 후보입니다."
 TFRKPHN_le_bio_g4v1:0 "£GFX_KOR_PPP_texticon §Y유정복§!  현직\n§Y출생:§! 1957년 6월 16일, 인천 동구 송림동\n§Y학력:§!\n제물포고등학교, 연세대학교 정치외교학과\n§Y이력:§!\n1979년 행정고시에 합격했고 1981년 육군 학사사관 1기로\n임관했습니다. 1994년 김포군수, 1995년 인천 서구청장, 1998년\n김포시장을 지냈습니다. 2004년부터 김포에서 제17, 18, 19대\n국회의원을 지냈고 2005년 박근혜 한나라당 대표의 비서실장을\n맡았습니다. 2010년 농림수산식품부 장관, 2013년 안전행정부 장관을\n거쳐 2014년 인천광역시장에 취임했습니다.\n§Y눈에 띄는 일:§!\n김포군수에 취임할 때 서른여덟 살로 당시 전국에서 가장 젊은\n군수였습니다.\n \n§Y이 세계에서는:§!\n여당의 인천시장 후보입니다. 2026년 지방선거에서 당선돼 지금 이\n자리를 맡고 있습니다."
 TFRKPHN_le_bio_o4v1:0 "£GFX_KOR_DemocraticParty_texticon §Y박찬대§!  도전\n§Y출생:§! 1967년 5월 10일, 인천 미추홀구\n§Y학력:§!\n동인천고등학교, 인하대학교 경영학과, 서울대학교 대학원 경영학 석사\n§Y이력:§!\n공인회계사입니다. 1997년 세동회계법인, 1999년 삼일회계법인,\n2001년 금융감독원에서 일했고 2003년부터 2015년까지 한미회계법인\n경인본부장과 부대표를 지냈습니다. 2009년 민주당에 입당했습니다.\n2016년 인천 연수구 갑에서 제20대 국회의원에 당선됐고 2019년\n더불어민주당 원내대변인을 맡았습니다. 2020년 재선했습니다.\n \n§Y이 세계에서는:§!\n야당의 인천시장 후보입니다. 2026년 지방선거에서 졌고 다시\n도전합니다."
