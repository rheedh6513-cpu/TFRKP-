 TFRKPHN_le_bio_g9:0 "£GFX_KOR_PPP_texticon §Y김은혜§!  도전\n§Y출생:§! 1971년 1월 6일\n§Y이력:§!\n1993년 MBC 공채 기자로 입사해 사회부, 경제부, 정치부를 거쳐\n뉴스 앵커를 지냈습니다. 2008년 이명박 정부 대통령실 외신담당\n제1부대변인, 2009년 제2대변인을 맡았습니다. 2010년 KT 전무,\n2015년 MBN 특임이사가 됐습니다. 2020년 성남 분당구 갑에서\n제21대 국회의원에 당선됐고 국민의힘 비상대책위원회 대변인을 지냈습니다.\n \n§Y이 세계에서는:§!\n경기도지사 자리를 노리는 여당의 도전자입니다."
 TFRKPHN_le_bio_o9:0 "£GFX_KOR_DemocraticParty_texticon §Y김동연§!  현직\n§Y출생:§! 1957년 1월 28일, 충청북도 음성\n§Y학력:§!\n덕수상업고등학교, 국제대학(현 서경대학교), 서울대학교 행정대학원, 미국\n미시간대학교 정책학 박사\n§Y이력:§!\n1983년 경제기획원에서 공직을 시작했습니다. 2002년 세계은행\n선임정책관, 2008년 대통령비서실 경제금융비서관, 2010년 기획재정부\n예산실장, 2012년 기획재정부 제2차관을 지냈습니다. 2013년 초대\n국무조정실장, 2015년 아주대학교 총장을 맡았고 2017년 경제부총리\n겸 기획재정부 장관이 됐습니다. 2021년 9월 대통령 선거 출마를\n선언했습니다.\n§Y눈에 띄는 일:§!\n아버지를 일찍 여의고 청계천 판잣집과 천막촌에서 자랐습니다.\n상업고등학교를 졸업하기 전에 취업했고 야간대학을 다녔습니다.\n \n§Y이 세계에서는:§!\n2022년에 당선된 현직입니다."
 TFRKPHN_le_bio_g9v1:0 "£GFX_KOR_PPP_texticon §Y양향자§!  현직\n§Y출생:§! 전라남도 화순\n§Y학력:§!\n광주여자상업고등학교\n§Y이력:§!\n1985년 삼성전자 반도체 메모리설계실 연구보조원으로 들어갔습니다.\n1993년 SRAM설계팀 책임연구원, 2007년 DRAM설계팀\n수석연구원, 2011년 플래시설계팀 부장을 거쳐 2014년 상무에\n올랐습니다. 2016년 1월 더불어민주당에 영입됐습니다.\n§Y눈에 띄는 일:§!\n삼성전자에서 처음 나온 호남 출신 고졸 여성 임원으로 소개됐습니다.\n \n§Y이 세계에서는:§!\n여당의 경기도지사 후보입니다. 2026년 지방선거에서 당선돼 지금 이\n자리를 맡고 있습니다."
