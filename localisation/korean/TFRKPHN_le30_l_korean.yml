 TFRKPHN_le_bio_g7:0 "£GFX_KOR_PPP_texticon §Y김두겸§!  현직\n§Y출생:§! 1958년 1월 25일\n§Y이력:§!\n1995년 울산시의회 의원이 됐고 1997년부터 울산 남구의회 의원을\n지냈습니다. 1998년 남구의회 부의장, 2002년부터 2006년까지\n남구의회 의장을 맡았습니다. 2006년부터 2014년까지 울산 남구청장을\n지냈습니다.\n \n§Y이 세계에서는:§!\n2022년에 당선된 현직입니다."
 TFRKPHN_le_bio_o7:0 "£GFX_KOR_DemocraticParty_texticon §Y김상욱§!  도전\n§Y출생:§! 1980년 1월 1일, 경상북도 의성\n§Y학력:§!\n영진고등학교, 고려대학교 법학과, 부산대학교 법학전문대학원 1기\n§Y이력:§!\n2006년부터 현대해상화재와 우리은행에서 일했습니다. 2012년 제1회\n변호사시험에 합격해 울산에서 변호사가 됐습니다. 2014년 법률사무소를\n열었고 2017년 법무법인을 세웠습니다. 2015년 울산 남구청\n법률고문변호사, 2018년 울산광역시 지방토지수용위원을 맡았습니다.\n§Y눈에 띄는 일:§!\n울산 동구 새납마을 철거 사건에서 성공 보수를 포기하고 주민과 땅 주인을\n설득해 임대차 관계로 풀었습니다.\n \n§Y이 세계에서는:§!\n야당의 울산시장 후보입니다."
