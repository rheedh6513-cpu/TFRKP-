 tfrkphn.6733.d_oh:0 "대통령의 지역 방문이 잦아지자 야당이 선거 개입이라고 공세를 폅니다. 야당은 대통령이 가는 곳마다 지역 사업 이야기가 따라붙는다며 선거관리위원회에 조사를 요구했습니다.\n\n논란이 커지자 오세훈 대통령이 기자들 앞에서 고개를 깊이 숙였습니다. 서울시장이던 2011년 8월 21일, 무상급식 주민투표를 앞두고 무릎을 꿇은 채 '이번 주민투표 결과에 시장직을 걸어 그 책임을 다하겠다'고 했던 장면을 떠올리는 사람이 많습니다. 그때 투표는 개표 기준에 못 미쳐 무산됐고, 그는 닷새 뒤 시장직을 내려놓았습니다.\n\n남은 기간 대통령의 일정을 어떻게 짤지 정해야 합니다."
