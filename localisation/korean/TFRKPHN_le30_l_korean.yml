 TFRKPHN_le_bio_g3:0 "£GFX_KOR_PPP_texticon §Y추경호§!  현직\n§Y출생:§! 1960년, 경상북도 달성군 다사면\n§Y학력:§!\n계성고등학교, 고려대학교 경영학과, 미국 오리건대학교 경제학 석사\n§Y이력:§!\n1981년 행정고시에 합격했습니다. 경제기획원과 재정경제원에서 일했고\n1999년 세계은행 시니어 이코노미스트, 2006년 OECD 한국대표부\n공사참사관을 지냈습니다. 2010년 대통령실 경제금융비서관, 2011년\n금융위원회 부위원장, 2013년 기획재정부 제1차관, 2014년\n국무조정실장을 맡았습니다. 2016년 대구 달성군에서 제20대 국회의원에\n당선됐고 2020년 재선했습니다.\n§Y눈에 띄는 일:§!\n2005년 재정경제부 직원들이 뽑은 가장 닮고 싶은 상사에 꼽혔습니다.\n \n§Y이 세계에서는:§!\n홍준표가 대통령이 된 뒤 대구시장을 맡은 현직입니다."
 TFRKPHN_le_bio_o3:0 "£GFX_KOR_DemocraticParty_texticon §Y김부겸§!  도전\n§Y출생:§! 1958년 1월 21일, 경상북도 상주\n§Y학력:§!\n경북고등학교, 서울대학교 정치학과\n§Y이력:§!\n1988년 한겨레민주당 후보로 처음 총선에 나섰습니다. 2000년\n한나라당 후보로 경기 군포에서 제16대 국회의원에 당선됐습니다.\n2004년에는 열린우리당, 2008년에는 통합민주당 후보로 군포에서 다시\n당선됐습니다. 2012년 대구 수성구 갑 총선과 2014년 대구시장\n선거에서 낙선했습니다. 2016년 대구 수성구 갑에서 당선돼 4선이\n됐습니다. 2017년 행정안전부 장관, 2021년 5월 국무총리에\n올랐습니다.\n§Y눈에 띄는 일:§!\n1978년 긴급조치 9호 위반으로 징역형을 받아 복역했습니다. 대구에서\n두 번 떨어진 뒤 세 번째에 당선됐습니다.\n \n§Y이 세계에서는:§!\n야당의 대구시장 후보입니다."
