l_korean:
 TFRKPHN_oh_le30_category:0 "지방선거"
 TFRKPHN_oh_le30_category_desc:0 "2030년 6월 전국동시지방선거를 준비합니다. 상황실은 따로 큰 창으로 뜹니다."
 TFRKPHN_le_open:0 "선거 상황실을 연다"
 TFRKPHN_le_open_desc:0 "시도지사 열일곱 자리의 판세를 지도로 봅니다."
 TFRKPHN_le_open_tt:0 "지방선거 상황실 창이 열립니다."
 TFRKPHN_le_shut:0 "선거 상황실을 닫는다"
 TFRKPHN_le_shut_desc:0 "창을 닫아 둡니다. 판세는 그대로 흘러갑니다."
 TFRKPHN_le_shut_tt:0 "지방선거 상황실 창이 닫힙니다."
 TFRKPHN_le_days:0 "[?TFRKPHN_le_days|0]"
 TFRKPHN_le_cr:0 "[?TFRKPHN_le_cr|0]"
 TFRKPHN_le_cg:0 "[?TFRKPHN_le_cg|0]"
 TFRKPHN_le_cb:0 "[?TFRKPHN_le_cb|0]"
 TFRKPHN_le_sv:0 "£GFX_KOR_PPP_texticon  [?TFRKPHN_le_sv|0]"
 TFRKPHN_le_so:0 "[?TFRKPHN_le_so|0]  £GFX_KOR_DemocraticParty_texticon"
 TFRKPHN_le_g:0 "[?TFRKPHN_le_gsel|0]"
 TFRKPHN_le_med:0 "[?TFRKPHN_le_med|0]"
 TFRKPHN_le_prom:0 "[?TFRKPHN_le_prom|0]"
 TFRKPHN_le_act1_tt:0 "§Y대통령 민생 방문§!\n정치력 §Y15§!\n고른 자리의 지지 §G+2§!\n선거 개입 논란 §R+1§!\n논란이 넷이 되면 야당이 문제를 삼습니다."
 TFRKPHN_le_act2_tt:0 "§Y지역 사업 약속§!\n정치력 §Y30§!\n고른 자리의 지지 §G+3§!\n자리마다 한 번만 할 수 있습니다.\n선거가 끝나면 약속 하나에 정치력 §R-10§!"
 TFRKPHN_le_act3_tt:0 "§Y권역 순회§!\n정치력 §Y20§!\n고른 자리와 같은 권역의 자리 모두 지지 §G+1§!\n서울은 빠집니다."
 TFRKPHN_le_act4_tt:0 "§Y당 지도부 파견§!\n정치력 §Y10§!\n고른 자리의 지지 §G+1§!"
 TFRKPHN_le_act5_tt:0 "§Y방송 토론 준비§!\n정치력 §Y20§!\n고른 자리의 지지 §G+2§!\n지지가 48에서 52 사이인 경합 자리에서만 할 수 있습니다."
 TFRKPHN_le_act6_tt:0 "§Y상대 후보 검증§!\n정치력 §Y25§!\n열에 일곱은 고른 자리의 지지 §G+3§!\n열에 셋은 역풍이 불어 지지 §R-2§!"
 TFRKPHN_le_prom_tt:0 "지역 사업 약속을 지키는 데 약속 하나에 정치력 §R-10§!"
 tfrkphn.6731.t:0 "지방선거 두 달 전"
 tfrkphn.6731.d:0 "2030년 6월 전국동시지방선거까지 두 달이 남았습니다. 시장과 도지사 [?TFRKPHN_le_total|0]자리가 한꺼번에 걸린 선거이고, 임기 네 해째를 맞은 우리 정부에는 중간평가나 다름없습니다. 메가시티가 올라간 권역과 그렇지 못한 권역의 민심은 벌써 다르게 움직입니다. 당은 후보를 모두 확정했고, 참모들은 대통령이 지역을 얼마나 찾아도 되는지를 두고 의견이 갈립니다. 대통령은 선거에서 중립을 지켜야 하는 자리이기 때문입니다. 선거 상황실은 오늘부터 날마다 판세를 올립니다."
 tfrkphn.6731.a:0 "상황실을 엽니다."
 tfrkphn.6731.a_tt:0 "§Y지방선거 상황실§! 창이 열립니다. 닫은 뒤에는 결정 탭의 §Y지방선거§!에서 다시 열 수 있습니다."
 tfrkphn.6733.t:0 "선거 개입 논란"
 tfrkphn.6733.d:0 "대통령의 지역 방문이 잦아지자 야당이 선거 개입이라고 공세를 폅니다. 야당은 대통령이 가는 곳마다 지역 사업 이야기가 따라붙는다며 선거관리위원회에 조사를 요구했습니다. 여당 안에서도 대통령이 앞에 서면 선거가 정권 심판 구도로 흐를 수 있다는 걱정이 나옵니다. 남은 기간 대통령의 일정을 어떻게 짤지 정해야 합니다."
 tfrkphn.6733.a:0 "지역 방문을 멈춥니다."
 tfrkphn.6733.a_tt:0 "선거가 끝날 때까지 §Y대통령 민생 방문§!을 할 수 없습니다."
 tfrkphn.6733.b:0 "일정을 그대로 갑니다."
 tfrkphn.6733.b_tt:0 "서울을 뺀 모든 자리의 지지 §R-1§!\n§Y대통령 민생 방문§!은 계속 할 수 있습니다."
 tfrkphn.6734.t:0 "개표 방송"
 tfrkphn.6734.d:0 "투표가 끝나자 방송사 출구조사가 일제히 나옵니다. 시도마다 예측 결과가 지도 위에 차례로 칠해지고, 당사 상황실에서는 지역 이름이 불릴 때마다 박수와 탄식이 엇갈립니다. 경합으로 분류된 곳은 자정을 넘겨야 윤곽이 잡힐 것으로 보입니다. 대통령은 참모 몇 사람과 함께 개표를 지켜보고 있습니다."
 tfrkphn.6734.a:0 "결과를 기다립니다."
 TFRKPHN_le_vm:0 "[?TFRKPHN_le_v14|0]"
 TFRKPHN_le_chipm_tt:0 "§Y전남광주통합특별시장§!\n광주와 전남이 합쳐져 한 사람을 뽑습니다.\n£GFX_KOR_PPP_texticon 이정현  대  £GFX_KOR_DemocraticParty_texticon 민형배\n여당 후보 지지 [?TFRKPHN_le_v14|0]\n누르면 이 자리를 고릅니다."
 tfrkphn.6738.t:0 "광주와 전남, 다시 하나로"
 tfrkphn.6738.d:0 "광주와 전남을 하나로 묶는 특별법이 1일 국회 본회의를 통과했습니다. 재석 175명 가운데 159명이 찬성했습니다. 광주가 1986년 직할시가 되며 전남에서 떨어져 나간 지 40년 만입니다.\n\n신정훈 국회 행정안전위원장은 법안을 설명하며 '통합은 선택이 아닌 생존 전략'이라고 말했습니다. 김영록 전남지사는 '1 더하기 1이 2에 그치지 않고, 3 이상이 돼' 지역이 다시 일어서게 하자고 했습니다.\n\n전남광주통합특별시는 6월 3일 지방선거에서 첫 통합시장을 뽑고 7월 1일 인구 약 320만 명으로 출범합니다. 정부는 네 해 동안 해마다 5조 원씩 모두 20조 원을 지원합니다. 청사는 광주, 무안, 전남동부 세 곳을 함께 쓰지만, 본청을 어디에 둘지는 지역마다 말이 엇갈립니다."
 tfrkphn.6738.d2:0 "광주와 전남을 하나로 묶는 특별법이 1일 국회 본회의를 통과했습니다. 재석 175명 가운데 159명이 찬성했습니다. 광주가 1986년 직할시가 되며 전남에서 떨어져 나간 지 40년 만입니다.\n\n신정훈 국회 행정안전위원장은 법안을 설명하며 '통합은 선택이 아닌 생존 전략'이라고 말했습니다. 김영록 전남지사는 '1 더하기 1이 2에 그치지 않고, 3 이상이 돼' 지역이 다시 일어서게 하자고 했습니다.\n\n전남광주통합특별시는 6월 3일 지방선거에서 첫 통합시장을 뽑고 7월 1일 인구 약 320만 명으로 출범합니다. 정부는 네 해 동안 해마다 5조 원씩 모두 20조 원을 지원합니다. 청사는 광주, 무안, 전남동부 세 곳을 함께 쓰지만, 본청을 어디에 둘지는 지역마다 말이 엇갈립니다."
 tfrkphn.6738.a:0 "두 지역이 다시 한 살림을 차립니다."
 tfrkphn.6738.a_tt:0 "2026년 지방선거에서 §Y광주시장§!과 §Y전남도지사§! 자리가 §Y전남광주통합특별시장§! 한 자리로 합쳐집니다.\n7월 1일부터 지역 칸이 §Y전남광주통합특별시§!로 바뀝니다."
 tfrkphn.6735.t:0 "열 곳을 넘기다"
 tfrkphn.6735.d:0 "개표 결과 여당이 시도지사 [?TFRKPHN_le_total|0]자리 가운데 [?TFRKPHN_le_wins|0]곳에서 이겼습니다. 언론은 정부가 중간평가를 넉넉히 통과했다고 씁니다. 당 안에서는 강경한 노선을 접고 재건과 민생을 앞세운 선택이 지역에서 받아들여졌다는 말이 나옵니다. 대통령은 이긴 곳과 진 곳을 가리지 않고 당선인을 모두 만나겠다는 뜻을 전했습니다."
 tfrkphn.6735.a:0 "지역과 함께 갑니다."
 tfrkphn.6736.t:0 "절반의 승리"
 tfrkphn.6736.d:0 "개표 결과 여당이 시도지사 [?TFRKPHN_le_total|0]자리 가운데 [?TFRKPHN_le_wins|0]곳에서 이겼습니다. 어느 쪽도 크게 웃지 못한 숫자입니다. 여당은 텃밭을 지켰지만 경합 지역 여러 곳을 내줬고, 야당은 심판론이 절반만 통했다고 자평합니다. 사업이 더딘 권역에서 표가 빠졌다는 분석이 당 보고서에 올랐습니다. 남은 임기의 지역 사업은 야당 단체장들과 협의해서 풀어야 합니다."
 tfrkphn.6736.a:0 "협의할 자리를 만듭니다."
 tfrkphn.6737.t:0 "등 돌린 지역"
 tfrkphn.6737.d:0 "방송사 개표 화면에 여당 참패라는 자막이 걸렸습니다. 여당은 시도지사 [?TFRKPHN_le_total|0]자리 가운데 [?TFRKPHN_le_wins|0]곳에서 이기는 데 그쳤고, 야당은 정권 심판이 끝났다고 선언했습니다.\n\n여당 지도부는 개표가 끝나기도 전에 물러나겠다고 밝혔습니다. 당 안에서는 2024년 4월 11일 총선에 진 뒤 한동훈 당시 비상대책위원장이 물러나며 남긴 '민심은 언제나 옳다'는 말이 다시 돌았습니다. 여섯 해 만에 같은 장면을 본다는 말도 나옵니다.\n\n다음 대선을 준비하려는 사람들은 벌써 대통령과 거리를 두기 시작했습니다. 남은 임기 동안 국회와 지방정부 어느 쪽에서도 협조를 얻기 어려워졌습니다."
 tfrkphn.6737.a:0 "결과를 받아들입니다."
 TFRKPHN_le_bio_g2:0 "£GFX_KOR_PPP_texticon §Y한동훈§!  새 후보\n§Y출생:§! 1973년, 서울\n§Y학력:§!\n현대고등학교, 서울대학교 법과대학, 미국 컬럼비아대학교 로스쿨\n§Y이력:§!\n1995년 사법시험에 합격했습니다(사법연수원 27기). 공군 법무관을\n마치고 서울, 천안, 부산의 검찰청에서 검사로 일했고 대검찰청 중앙수사부\n검찰연구관을 지냈습니다. 2019년 대검찰청 반부패강력부장에 올랐습니다.\n§Y눈에 띄는 일:§!\n2019년 검사장이 됐을 때 역대 가장 젊은 검사장이었습니다.\n \n§Y이 세계에서는:§!\n3선 제한으로 물러나는 박형준 시장의 뒤를 잇는 여당의 새 후보입니다."
 TFRKPHN_le_bio_o2:0 "£GFX_KOR_DemocraticParty_texticon §Y전재수§!  도전\n§Y출생:§! 1971년 4월 20일, 경상남도 의령\n§Y학력:§!\n동국대학교 역사교육과\n§Y이력:§!\n2000년 국회 환경노동위원회 입법보좌관으로 일을 시작했습니다.\n2002년 대통령직인수위원회 행정관, 2003년 재정경제부 장관\n정책보좌관, 2004년 청와대 경제수석실 행정관을 거쳐 2006년 청와대\n제2부속실장이 됐습니다. 2006년 부산 북구청장 선거와 2008년,\n2012년 총선에서 낙선했습니다. 2016년 부산 북구강서구 갑에서\n제20대 국회의원에 당선됐고 2020년 재선했습니다.\n§Y눈에 띄는 일:§!\n여덟 살 무렵 부산 북구 만덕동으로 옮겨 와 그곳에서 자랐습니다. 세 번\n떨어진 뒤 네 번째 도전에서 당선됐습니다.\n \n§Y이 세계에서는:§!\n야당의 부산시장 후보입니다."
 TFRKPHN_le_bio_g2v1:0 "£GFX_KOR_PPP_texticon §Y한동훈§!  새 후보\n§Y출생:§! 1973년, 서울\n§Y학력:§!\n현대고등학교, 서울대학교 법과대학, 미국 컬럼비아대학교 로스쿨\n§Y이력:§!\n1995년 사법시험에 합격했습니다(사법연수원 27기). 공군 법무관을\n마치고 서울, 천안, 부산의 검찰청에서 검사로 일했고 대검찰청 중앙수사부\n검찰연구관을 지냈습니다. 2019년 대검찰청 반부패강력부장에 올랐습니다.\n§Y눈에 띄는 일:§!\n2019년 검사장이 됐을 때 역대 가장 젊은 검사장이었습니다.\n \n§Y이 세계에서는:§!\n여당의 부산시장 후보입니다."
 TFRKPHN_le_bio_o2v1:0 "£GFX_KOR_DemocraticParty_texticon §Y전재수§!  도전\n§Y출생:§! 1971년 4월 20일, 경상남도 의령\n§Y학력:§!\n동국대학교 역사교육과\n§Y이력:§!\n2000년 국회 환경노동위원회 입법보좌관으로 일을 시작했습니다.\n2002년 대통령직인수위원회 행정관, 2003년 재정경제부 장관\n정책보좌관, 2004년 청와대 경제수석실 행정관을 거쳐 2006년 청와대\n제2부속실장이 됐습니다. 2006년 부산 북구청장 선거와 2008년,\n2012년 총선에서 낙선했습니다. 2016년 부산 북구강서구 갑에서\n제20대 국회의원에 당선됐고 2020년 재선했습니다.\n§Y눈에 띄는 일:§!\n여덟 살 무렵 부산 북구 만덕동으로 옮겨 와 그곳에서 자랐습니다. 세 번\n떨어진 뒤 네 번째 도전에서 당선됐습니다.\n \n§Y이 세계에서는:§!\n야당의 부산시장 후보입니다. 2026년 지방선거에서 졌고 다시\n도전합니다."
 TFRKPHN_le_bio_g2v2:0 "£GFX_KOR_PPP_texticon §Y한동훈§!  새 후보\n§Y출생:§! 1973년, 서울\n§Y학력:§!\n현대고등학교, 서울대학교 법과대학, 미국 컬럼비아대학교 로스쿨\n§Y이력:§!\n1995년 사법시험에 합격했습니다(사법연수원 27기). 공군 법무관을\n마치고 서울, 천안, 부산의 검찰청에서 검사로 일했고 대검찰청 중앙수사부\n검찰연구관을 지냈습니다. 2019년 대검찰청 반부패강력부장에 올랐습니다.\n§Y눈에 띄는 일:§!\n2019년 검사장이 됐을 때 역대 가장 젊은 검사장이었습니다.\n \n§Y이 세계에서는:§!\n여당의 부산시장 후보입니다."
