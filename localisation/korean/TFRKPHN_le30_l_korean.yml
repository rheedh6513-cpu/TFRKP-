 TFRKPHN_le_bio_o9v2:0 "£GFX_KOR_DemocraticParty_texticon §Y추미애§!  현직\n§Y출생:§! 1958년 10월 23일, 경상북도 달성군 다사면\n§Y학력:§!\n한양대학교 법학과, 연세대학교 경제대학원 경제학 석사\n§Y이력:§!\n춘천지방법원과 광주고등법원 등에서 판사로 일했습니다. 1996년 제15대\n총선에서 처음 국회의원에 당선됐고 2016년까지 다섯 번 당선됐습니다.\n더불어민주당 대표를 지냈고, 문재인 정부에서 제67대 법무부 장관을\n맡았습니다.\n \n§Y이 세계에서는:§!\n야당의 경기도지사 후보입니다. 2026년 지방선거에서 당선돼 지금 이\n자리를 맡고 있습니다."
 TFRKPHN_le_bio_g10:0 "£GFX_KOR_PPP_texticon §Y김진태§!  현직\n§Y출생:§! 1964년 10월 13일, 강원도 춘천\n§Y학력:§!\n성수고등학교, 서울대학교 법과대학\n§Y이력:§!\n1992년 검사로 임관해 부산, 의성, 춘천, 서울의 검찰청에서\n일했습니다. 2008년 춘천지방검찰청 원주지청장을 지낸 뒤 2009년\n춘천에서 변호사가 됐습니다. 2012년 춘천에서 제19대 국회의원에\n당선됐고 2016년 재선했습니다. 2017년 대통령 선거 출마를 선언했고\n2020년 총선에서 낙선했습니다.\n§Y눈에 띄는 일:§!\n아버지는 군인, 어머니는 교사였습니다.\n \n§Y이 세계에서는:§!\n2022년에 당선된 현직입니다."
 TFRKPHN_le_bio_o10:0 "£GFX_KOR_DemocraticParty_texticon §Y우상호§!  도전\n§Y출생:§! 1962년 12월 12일\n§Y학력:§!\n연세대학교 국어국문학과\n§Y이력:§!\n1987년 연세대학교 총학생회장을 지냈습니다. 2000년 서울 서대문구\n갑 총선에서 낙선했고 2004년 같은 곳에서 제17대 국회의원에\n당선됐습니다. 열린우리당과 민주당의 대변인을 지냈습니다. 2012년과\n2016년에 당선됐고 2016년 더불어민주당 원내대표를 맡았습니다.\n2020년 4선에 올랐고 2021년 서울시장 후보 경선에 나섰다가\n졌습니다.\n§Y눈에 띄는 일:§!\n1987년 6월 항쟁 때 숨진 후배 이한열의 장례식에서 집행위원장을\n맡았습니다.\n \n§Y이 세계에서는:§!\n야당의 강원도지사 후보입니다."
