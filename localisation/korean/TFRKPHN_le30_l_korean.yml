 TFRKPHN_le_bio_g16:0 "£GFX_KOR_PPP_texticon §Y박완수§!  현직\n§Y출생:§! 1955년 8월 10일, 경상남도 통영시 도산면\n§Y학력:§!\n마산공업고등학교, 경남대학교 행정학과, 경남대학교 행정학 박사\n§Y이력:§!\n1979년 행정고시에 합격해 합천군수와 김해부시장 등을 지냈습니다.\n2004년 재보궐선거로 창원시장이 됐고 2006년과 2010년에도 당선돼\n2014년까지 시장을 지냈습니다. 2012년과 2014년 경남도지사 후보\n경선에서 홍준표에게 졌습니다. 2014년 인천국제공항공사 사장을\n맡았습니다. 2016년 창원 의창구에서 제20대 국회의원에 당선됐고\n2020년 재선했습니다.\n§Y눈에 띄는 일:§!\n공업고등학교를 나왔고 방송통신대학교와 경남대학교에서 행정학을\n공부했습니다.\n \n§Y이 세계에서는:§!\n2022년에 당선된 현직입니다."
 TFRKPHN_le_bio_o16:0 "£GFX_KOR_DemocraticParty_texticon §Y김경수§!  도전\n§Y출생:§! 1967년, 경상남도 고성군 개천면\n§Y학력:§!\n진주동명고등학교, 서울대학교 인류학과\n§Y이력:§!\n2002년 노무현 후보 선거대책위원회에서 일했고 2007년 대통령비서실\n연설기획비서관을 지냈습니다. 2009년 봉하재단 사무국장을 맡았습니다.\n2012년 김해 을 총선과 2014년 경남도지사 선거에서 낙선했습니다.\n2016년 김해 을에서 제20대 국회의원에 당선됐고 2018년\n경상남도지사에 당선됐습니다. 2021년 7월 대법원 판결로 지사직을\n잃었습니다.\n \n§Y이 세계에서는:§!\n피선거권을 되찾고 다시 경남도지사에 도전합니다."
