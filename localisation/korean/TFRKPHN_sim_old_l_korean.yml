l_korean:
 # [안내] [사람이 씀] 사건 7218. 사용자가 직접 쓴 글이라 고치지 않는다. sim_old_build.py가 만든다.
 tfrkphn.7218.t:0 "어느 한 노인"
 tfrkphn.7218.d:0 "출구조사 예측 1위!\n정의당 심상정 후보! 35.7%를 득표할 것으로 예상됐습니다. \n다음으로 국민의당 안철수 후보 28.3%를 득표하면서 2위에 예상됐습니다.....\n\n21대 대선의 출구조사가 발표되고 개표가 진행될수록 어느 음습한 사무실... 아니. 꽤 많은 길거리와 가정집, 그리고 각종 시민단체와 노조, 진보정당 당사는 고함소리와 축제분위기에 휩싸여 있었다. \n\n그리고 이 열기는 정의당 개표상황실에 앉아있는 점잖은 의원님들에게도 다를바 없이 찾아왔다.\n심상정! 대통령! 심상정! 대통령! 심상정!대통령! 와아아! 만세!\n누군가는 눈물을 흘렸고, 누군가는 소리를 질렀다. 누군가는 구호를 외쳤고, 누군가는 자리에서 일어나 심상정을 껴앉았다. \n\n그리고 어느 한 노인이 있었다.\n그는 출구조사의 찍힌 숫자를 보며 무언가 골돌히 생각에 잠겨있는듯했다.\n\n자신이 결코 넘지 못했던 100만표의 벽, 그녀는 PD와 NL, 과거에 민주노동당을 뛰어넘어 100만표의 벽을 깨고 당선이라는 도저히 손에 잡히지 않을것만 같던 트로피를 거머쥐었다.\n\n그리고 그는 자리에서 일어나 심상정에게 다가갔다. \n\n심의원님 고생하셨습니다. 저대신 진보집권의 꿈을 이뤄주셨군요. 감사드립니다.\n그는 주변에서 건내주는 손수건을 보고서야 자신의 얼굴에서 흐르는 뜨거운 눈물의 존재를 알아차렸다."
 tfrkphn.7218.a:0 "다음날 아침이 되어서야, 사무실 불이 꺼졌다."
