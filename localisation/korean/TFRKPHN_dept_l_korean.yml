l_korean:
 # 이인제 정부 「임기를 함께하는 내각」. dept_build.py가 만든다. 내용은 dept_data.py에서 고친다.
 TFRKPHN_dept_req_pm1:0 "국무총리실: 예산 편성을 총리 밑으로 옮긴다"
 TFRKPHN_dept_req_pm1_desc:0 "정진석 총리가 예산 편성을 총리 소속 기관으로 옮기자고 합니다. [TFRKPHN_mof]는 예산실을 내놓아야 합니다.\n\n§G좋아함§! §Y국방부§!: [TFRKPHN_mof_s] 힘이 빠지면 국방비 협상이 쉬워집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 예산실을 내놓아야 합니다.\n§R싫어함§! §Y외교부§!: 예산 설명을 두 곳에 해야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm1_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_pm2:0 "국무총리실: 규제 심사를 총리실이 쥔다"
 TFRKPHN_dept_req_pm2_desc:0 "부처마다 쥐고 있는 규제를 총리실 추진단이 모아서 심사하겠다고 합니다. [TFRKPHN_mof]도 경제 규제 심사를 따로 하고 있습니다.\n\n§G좋아함§! §Y외교부§!: 외국 기업의 불만이 줄어듭니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 경제 규제 심사를 빼앗깁니다.\n§R싫어함§! §Y국방부§!: 군사 규제도 심사 대상이 됩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm2_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!\n§g일자리 대타협 탭이 열려 있으면§! 경영계 §G+5§!"
 TFRKPHN_dept_req_pm3:0 "국무총리실: 주례 회동을 매주 연다"
 TFRKPHN_dept_req_pm3_desc:0 "총리가 대통령을 매주 만나 국정을 보고하겠다고 합니다. 대통령이 보고를 받는 시간은 정해져 있어서 다른 기관의 몫이 줄어듭니다.\n\n§G좋아함§! §Y행정안전부§!: 지방 현안이 대통령에게 빨리 닿습니다.\n§R싫어함§! §Y국가정보원§!: 독대 보고 시간이 줄어듭니다.\n§R싫어함§! §Y외교부§!: 외교 현안이 총리를 거쳐 올라갑니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm3_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y국가정보원§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm1:0 "외교부: 재외 공관 인력을 늘린다"
 TFRKPHN_dept_req_fm1_desc:0 "조현동 장관이 재외 공관 인력을 늘려 달라고 합니다. 공무원 정원은 행정안전부가 정합니다.\n\n§G좋아함§! §Y국방부§!: 무관부 지원 인력도 늘어납니다.\n§R싫어함§! §Y행정안전부§!: 다른 부처 정원을 줄여야 합니다.\n§R싫어함§! §Y국가정보원§!: 공관의 파견 자리가 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm1_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm2:0 "외교부: 해외 원조 창구를 하나로 모은다"
 TFRKPHN_dept_req_fm2_desc:0 "해외 원조는 둘로 나뉘어 있습니다. 거저 주는 원조는 외교부가, 빌려주는 원조는 [TFRKPHN_mof]가 맡습니다. 외교부가 이를 하나로 모으자고 합니다.\n\n§G좋아함§! §Y국방부§!: 방산 협력과 원조를 묶기 쉬워집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 유상 원조를 내놓아야 합니다.\n§R싫어함§! §Y국무총리실§!: 총리실 위원회의 조정 몫이 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm2_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm3:0 "외교부: 통상 교섭을 외교부로 되찾는다"
 TFRKPHN_dept_req_fm3_desc:0 "통상 교섭은 1998년부터 외교부가 맡다가 2013년에 산업통상자원부로 넘어갔습니다. 외교부가 이를 되찾겠다고 합니다. 산업통상자원부가 크게 반발합니다.\n\n§G좋아함§! §Y행정안전부§!: 지자체 수출 지원 창구가 단순해집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 경제 부처의 협상 주도권이 줄어듭니다.\n§R싫어함§! §Y국방부§!: 방산 수출 협상이 통상 협상에 묶입니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm3_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_em1:0 "[TFRKPHN_mof]: 재정 준칙을 법으로 못 박는다"
 TFRKPHN_dept_req_em1_desc:0 "방기선 장관이 재정 적자를 국내총생산의 3% 안으로 묶는 법을 만들자고 합니다. 돈을 많이 쓰는 부처부터 예산이 깎입니다.\n\n§G좋아함§! §Y국가정보원§!: 안보 예산은 예외로 인정받았습니다.\n§R싫어함§! §Y국방부§!: 국방비 증액이 막힙니다.\n§R싫어함§! §Y외교부§!: 원조 예산 약속을 못 지킵니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em1_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y국방부§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!\n§g일자리 대타협 탭이 열려 있으면§! 일자리 §R-2만§!"
 TFRKPHN_dept_req_em2:0 "[TFRKPHN_mof]: 예비 타당성 조사 면제를 줄인다"
 TFRKPHN_dept_req_em2_desc:0 "큰 사업은 예비 타당성 조사를 거쳐야 합니다. [TFRKPHN_mof]가 면제 요건을 좁히자고 합니다. 지방 사업이 가장 먼저 걸립니다.\n\n§G좋아함§! §Y외교부§!: 원조 예산에 여유가 생깁니다.\n§R싫어함§! §Y행정안전부§!: 지방 사업이 줄줄이 걸립니다.\n§R싫어함§! §Y국무총리실§!: 국무회의 의결로 면제해 주던 길이 좁아집니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em2_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_em3:0 "[TFRKPHN_mof]: 특수활동비를 깎는다"
 TFRKPHN_dept_req_em3_desc:0 "국정원과 군의 특수활동비는 쓴 곳을 밝히지 않습니다. [TFRKPHN_mof]가 이 돈을 줄이자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 총리실은 특수활동비가 거의 없습니다.\n§R싫어함§! §Y국가정보원§!: 요원 활동비가 줄어듭니다.\n§R싫어함§! §Y국방부§!: 군 정보 부대 활동비가 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em3_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y국가정보원§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_im1:0 "행정안전부: 지방 교부세율을 올린다"
 TFRKPHN_dept_req_im1_desc:0 "지방 교부세는 내국세의 19.24%입니다. 이명수 장관이 이 비율을 22%로 올리자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 지방의 불만이 줄어듭니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해마다 수조 원이 지방으로 나갑니다.\n§R싫어함§! §Y국방부§!: 국방비 재원이 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im1_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_im2:0 "행정안전부: 부처 정원을 해마다 1%씩 거둔다"
 TFRKPHN_dept_req_im2_desc:0 "행정안전부가 해마다 부처 정원의 1%를 거둬 필요한 곳에 다시 나눠 주겠다고 합니다. 사람이 모자란 부처일수록 싫어합니다.\n\n§G좋아함§! §Y국무총리실§!: 새 사업에 인력을 돌려쓸 수 있습니다.\n§R싫어함§! §Y외교부§!: 사람이 가장 모자란 부처입니다.\n§R싫어함§! §Y국방부§!: 군무원 정원도 대상입니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im2_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y외교부§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_im3:0 "행정안전부: 군사 시설 보호 구역을 푼다"
 TFRKPHN_dept_req_im3_desc:0 "접경 지역 지자체들이 군사 시설 보호 구역을 풀어 달라고 합니다. 행정안전부가 이 요구를 들고 왔습니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 개발로 세금이 더 걷힙니다.\n§R싫어함§! §Y국방부§!: 작전 구역이 줄어듭니다.\n§R싫어함§! §Y국무총리실§!: 총리실 조정 없이 접경 정책이 바뀝니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im3_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y국방부§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_nis1:0 "국가정보원: 대공 수사권을 돌려준다"
 TFRKPHN_dept_req_nis1_desc:0 "간첩 수사권은 법이 바뀌어 경찰로 넘어갔습니다. 김홍균 원장이 이를 국정원에 다시 달라고 합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 수사 조직을 새로 꾸릴 돈이 안 듭니다.\n§R싫어함§! §Y행정안전부§!: 경찰이 수사권을 내놓아야 합니다.\n§R싫어함§! §Y외교부§!: 인권 문제로 국제 평판이 걱정됩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis1_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_nis2:0 "국가정보원: 사이버 안보 지휘를 국정원에 맡긴다"
 TFRKPHN_dept_req_nis2_desc:0 "국정원이 사이버 안보 지휘를 맡는 법을 만들자고 합니다. 군은 사이버작전사령부를 따로 두고 있습니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 금융 전산망 보호가 강화됩니다.\n§R싫어함§! §Y국방부§!: 사이버작전사령부가 지휘를 받게 됩니다.\n§R싫어함§! §Y행정안전부§!: 전자 정부 보안 권한이 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis2_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y국방부§! 신임 §R-8§!\n§Y행정안전부§! 신임 §R-8§!"
 TFRKPHN_dept_req_nis3:0 "국가정보원: 독대 보고를 되살린다"
 TFRKPHN_dept_req_nis3_desc:0 "국정원장이 대통령에게 혼자 보고하는 자리를 다시 만들자고 합니다. 이 자리에는 총리도 들어가지 못합니다.\n\n§G좋아함§! §Y외교부§!: 해외 정보가 대통령에게 빨리 닿습니다.\n§R싫어함§! §Y국무총리실§!: 총리가 모르는 보고가 생깁니다.\n§R싫어함§! §Y국방부§!: 군 정보 보고가 뒤로 밀립니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis3_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y국무총리실§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_dm1:0 "국방부: 국방비를 올린다"
 TFRKPHN_dept_req_dm1_desc:0 "신범철 장관이 내년 국방비를 올려 달라고 합니다. 전쟁에서 쓴 탄약을 아직 다 채우지 못했습니다.\n\n§G좋아함§! §Y국가정보원§!: 정찰 자산 예산이 함께 늘어납니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 다른 예산을 깎아야 합니다.\n§R싫어함§! §Y행정안전부§!: 지방에 갈 돈이 밀립니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm1_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y행정안전부§! 신임 §R-8§!"
 TFRKPHN_dept_req_dm2:0 "국방부: 전환 복무와 대체 복무를 줄인다"
 TFRKPHN_dept_req_dm2_desc:0 "국방부가 전환 복무와 대체 복무를 줄이자고 합니다. 입대할 청년이 해마다 줄고 있습니다. 그 인력을 쓰던 경찰과 소방, 지자체가 반발합니다.\n\n§G좋아함§! §Y국무총리실§!: 병역 형평성 논란이 줄어듭니다.\n§R싫어함§! §Y행정안전부§!: 경찰과 소방, 지자체 인력이 빠집니다.\n§R싫어함§! §Y외교부§!: 국제 협력 요원 제도가 사라집니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm2_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!\n§g일자리 대타협 탭이 열려 있으면§! 경영계 §R-5§!"
 TFRKPHN_dept_req_dm3:0 "국방부: 군 정보 예산을 국방부가 짠다"
 TFRKPHN_dept_req_dm3_desc:0 "군 정보 부대의 특수활동비는 국정원이 짜고 감사합니다. 신범철 장관이 이를 국방부로 가져오겠다고 합니다.\n\n§G좋아함§! §Y행정안전부§!: 경찰도 같은 요구를 할 명분이 생깁니다.\n§R싫어함§! §Y국가정보원§!: 편성권과 감사권을 잃습니다.\n§R싫어함§! §Y국무총리실§!: 정보 예산 조정이 흩어집니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm3_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y국가정보원§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_pm4:0 "국무총리실: 장관 제청권을 실제로 쓴다"
 TFRKPHN_dept_req_pm4_desc:0 "헌법은 총리가 장관을 제청한다고 적고 있습니다. 지금까지는 이름뿐이었습니다. 정진석 총리가 이 권한을 실제로 쓰겠다고 합니다.\n\n§G좋아함§! §Y행정안전부§!: 장관 자리가 대통령실 입김에서 멀어집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 부총리 위에 총리가 서게 됩니다.\n§R싫어함§! §Y국가정보원§!: 원장 인사에도 총리 입김이 닿을까 걱정합니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm4_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_pm5:0 "국무총리실: 부처 평가를 예산에 잇는다"
 TFRKPHN_dept_req_pm5_desc:0 "국무조정실은 해마다 부처 업무를 평가합니다. 총리실이 이 점수를 다음 해 예산에 반영하자고 합니다. 예산은 [TFRKPHN_mof]의 일입니다.\n\n§G좋아함§! §Y외교부§!: 지난해 평가 점수가 높았습니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 예산 편성에 총리실이 끼어듭니다.\n§R싫어함§! §Y국방부§!: 군 사업은 점수로 재기 어렵습니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm5_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_pm6:0 "국무총리실: 국무회의를 세종에서 연다"
 TFRKPHN_dept_req_pm6_desc:0 "부처 대부분은 세종에 있습니다. 외교부와 국방부는 서울에 남았습니다. 총리실이 국무회의를 세종에서 열자고 합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 청사가 세종에 있습니다.\n§R싫어함§! §Y외교부§!: 서울 청사에서 세종까지 오가야 합니다.\n§R싫어함§! §Y국가정보원§!: 보안 통신 설비를 새로 깔아야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm6_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y외교부§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_pm7:0 "국무총리실: 공직 기강 감찰을 넓힌다"
 TFRKPHN_dept_req_pm7_desc:0 "총리실 감찰반이 모든 부처의 복무 기강을 살피겠다고 합니다. 감찰을 받는 부처는 달가워하지 않습니다.\n\n§G좋아함§! §Y국가정보원§!: 보안 사고가 줄어든다고 봅니다.\n§R싫어함§! §Y행정안전부§!: 공무원 복무 관리는 행안부 일입니다.\n§R싫어함§! §Y국방부§!: 군에는 군 감찰이 따로 있습니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm7_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_pm8:0 "국무총리실: 해외 원조를 총리실이 조정한다"
 TFRKPHN_dept_req_pm8_desc:0 "해외 원조 사업은 총리가 위원장인 위원회를 거칩니다. 총리실이 새 사업을 모두 이 위원회 의결에 부치자고 합니다.\n\n§G좋아함§! §Y국방부§!: 방산 협력과 원조를 묶기 쉬워집니다.\n§R싫어함§! §Y외교부§!: 무상 원조 사업을 마음대로 못 정합니다.\n§R싫어함§! §Y행정안전부§!: 새마을 원조 사업도 의결을 받아야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm8_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y외교부§! 신임 §R-8§!\n§Y행정안전부§! 신임 §R-8§!"
 TFRKPHN_dept_req_pm9:0 "국무총리실: 대테러센터를 키운다"
 TFRKPHN_dept_req_pm9_desc:0 "대테러센터는 총리실 소속입니다. 법을 만들 때 국정원에 두자는 주장도 있었습니다. 총리실이 센터 인력을 늘리겠다고 합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 국정원의 예산 증액 요구가 줄어듭니다.\n§R싫어함§! §Y국가정보원§!: 테러 정보 주도권을 잃습니다.\n§R싫어함§! §Y국방부§!: 군 대테러 부대가 지휘를 받게 됩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm9_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y국가정보원§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm4:0 "외교부: 특임 공관장을 줄인다"
 TFRKPHN_dept_req_fm4_desc:0 "외교관이 아닌 사람이 대사로 나가는 자리를 특임 공관장이라고 부릅니다. 외교부가 이 자리를 줄이자고 합니다. 대통령이 쓸 수 있는 인사 카드가 줄어듭니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 대사 교체 비용이 줄어듭니다.\n§R싫어함§! §Y국무총리실§!: 총리실 출신이 나갈 자리가 줄어듭니다.\n§R싫어함§! §Y국가정보원§!: 원장 출신이 나갈 대사 자리가 사라집니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm4_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y국무총리실§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm5:0 "외교부: 방위비 협상 대표는 외교관으로"
 TFRKPHN_dept_req_fm5_desc:0 "방위비 분담 협상 대표는 대대로 외교부 사람이었습니다. 2019년에 처음으로 경제 관료가 맡았습니다. 외교부가 이 자리를 되찾겠다고 합니다.\n\n§G좋아함§! §Y행정안전부§!: 미군 기지 주변 지자체의 요구를 전하기 쉽습니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 경제 관료가 맡던 자리를 잃습니다.\n§R싫어함§! §Y국가정보원§!: 협상 정보에서 멀어집니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm5_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm6:0 "외교부: 재외동포 전담 기관을 만든다"
 TFRKPHN_dept_req_fm6_desc:0 "재외동포 업무는 여러 부처에 흩어져 있습니다. 외교부가 이를 모아 산하에 청을 두자고 합니다. 새 조직을 만들려면 행정안전부가 정원을 내줘야 합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 동포 자본을 끌어올 창구가 생깁니다.\n§R싫어함§! §Y행정안전부§!: 정원을 내줘야 합니다.\n§R싫어함§! §Y국가정보원§!: 동포 사회 정보 창구가 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm6_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm7:0 "외교부: 원조 예산을 늘린다"
 TFRKPHN_dept_req_fm7_desc:0 "정부는 2030년까지 원조를 국민총소득의 0.3%로 늘리겠다고 약속했습니다. 외교부가 그 약속대로 예산을 올리자고 합니다.\n\n§G좋아함§! §Y국방부§!: 방산 수출 길이 넓어집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해마다 수천억 원이 더 듭니다.\n§R싫어함§! §Y국무총리실§!: 원조 규모는 총리실 위원회가 정해 왔습니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm7_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm8:0 "외교부: 경제 안보 외교를 외교부가 이끈다"
 TFRKPHN_dept_req_fm8_desc:0 "공급망과 기술 문제를 다루는 회의는 [TFRKPHN_mof]가 주재합니다. 외교부가 이 주도권을 달라고 합니다.\n\n§G좋아함§! §Y행정안전부§!: 지자체의 외국 기업 유치에 도움이 됩니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 경제 안보 회의 주도권을 잃습니다.\n§R싫어함§! §Y국무총리실§!: 총리실 조정을 거치지 않습니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm8_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_em4:0 "[TFRKPHN_mof]: 공공기관 인력과 자산을 줄인다"
 TFRKPHN_dept_req_em4_desc:0 "[TFRKPHN_mof]가 공공기관마다 정원을 줄이고 남는 자산을 팔게 하자고 합니다. 공공기관은 부처마다 딸려 있습니다.\n\n§G좋아함§! §Y국방부§!: 군 관련 기관은 빠졌습니다.\n§R싫어함§! §Y외교부§!: 산하 원조 기관 인력이 줄어듭니다.\n§R싫어함§! §Y행정안전부§!: 지방 공기업도 대상입니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em4_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y외교부§! 신임 §R-8§!\n§Y행정안전부§! 신임 §R-8§!\n§g일자리 대타협 탭이 열려 있으면§! 일자리 §R-3만§!, 노동계 §R-5§!"
 TFRKPHN_dept_req_em5:0 "[TFRKPHN_mof]: 국세와 지방세 비율을 지킨다"
 TFRKPHN_dept_req_em5_desc:0 "지방은 지방소비세율을 올려 달라고 합니다. 국세가 그만큼 줄어듭니다. [TFRKPHN_mof]가 지금 비율을 지키자고 합니다.\n\n§G좋아함§! §Y국방부§!: 국방비 재원이 지켜집니다.\n§R싫어함§! §Y행정안전부§!: 지방 재정 확충이 막힙니다.\n§R싫어함§! §Y국무총리실§!: 총리가 지방에 한 약속이 깨집니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em5_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_em6:0 "[TFRKPHN_mof]: 무기 사업 타당성을 다시 본다"
 TFRKPHN_dept_req_em6_desc:0 "큰 무기 도입 사업은 타당성 조사를 받습니다. [TFRKPHN_mof]가 진행 중인 사업도 다시 보자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 대형 사업 잡음이 줄어듭니다.\n§R싫어함§! §Y국방부§!: 진행 중인 사업이 멈춥니다.\n§R싫어함§! §Y외교부§!: 수출 상대국과 한 약속이 흔들립니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em6_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y국방부§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_em7:0 "[TFRKPHN_mof]: 고위 공무원 봉급을 묶는다"
 TFRKPHN_dept_req_em7_desc:0 "[TFRKPHN_mof]가 4급 이상 공무원의 봉급을 올리지 말자고 합니다. 군 간부와 외교관도 여기에 들어갑니다.\n\n§G좋아함§! §Y행정안전부§!: 하위직 처우를 고칠 돈이 생깁니다.\n§R싫어함§! §Y국방부§!: 군 간부 봉급이 묶입니다.\n§R싫어함§! §Y외교부§!: 외교관 봉급이 묶입니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em7_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y국방부§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!\n§g일자리 대타협 탭이 열려 있으면§! 노동계 §R-3§!"
 TFRKPHN_dept_req_em8:0 "[TFRKPHN_mof]: 덜 걷힌 세금만큼 교부세를 줄인다"
 TFRKPHN_dept_req_em8_desc:0 "올해 세금이 예상보다 덜 걷혔습니다. [TFRKPHN_mof]가 지방에 보낼 교부세를 그만큼 줄이자고 합니다.\n\n§G좋아함§! §Y국가정보원§!: 안보 예산은 깎이지 않습니다.\n§R싫어함§! §Y행정안전부§!: 지자체가 사업을 멈춰야 합니다.\n§R싫어함§! §Y국방부§!: 군 부대 주변 지원 사업이 멈춥니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em8_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_em9:0 "[TFRKPHN_mof]: 국유 재산을 판다"
 TFRKPHN_dept_req_em9_desc:0 "[TFRKPHN_mof]가 쓰지 않는 국유지를 팔아 빚을 갚자고 합니다. 군이 쓰지 않고 쥔 땅도 대상입니다.\n\n§G좋아함§! §Y행정안전부§!: 지자체가 그 땅을 개발할 수 있습니다.\n§R싫어함§! §Y국방부§!: 군 유휴지를 내놓아야 합니다.\n§R싫어함§! §Y국가정보원§!: 보안 시설 주변 땅이 팔립니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em9_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y국방부§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_im4:0 "행정안전부: 중앙 사무를 지방에 넘긴다"
 TFRKPHN_dept_req_im4_desc:0 "행정안전부가 중앙 부처의 사무 수백 건을 한꺼번에 지방으로 넘기자고 합니다. 일을 넘기면 돈도 따라가야 합니다.\n\n§G좋아함§! §Y외교부§!: 지자체의 국제 교류가 늘어납니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 돈도 함께 넘겨야 합니다.\n§R싫어함§! §Y국무총리실§!: 총리실이 조정할 일이 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im4_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_im5:0 "행정안전부: 재난 안전 예산을 먼저 심의한다"
 TFRKPHN_dept_req_im5_desc:0 "행정안전부는 각 부처의 재난 안전 예산을 먼저 살펴 [TFRKPHN_mof]에 의견을 냅니다. 이 의견을 반드시 따르게 하자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 재난 책임 소재가 분명해집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 예산 편성권을 침해받습니다.\n§R싫어함§! §Y국가정보원§!: 보안 시설 예산도 심의를 받습니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im5_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_im6:0 "행정안전부: 고향 사랑 기부 공제를 넓힌다"
 TFRKPHN_dept_req_im6_desc:0 "고향에 기부하면 10만 원까지 세금에서 전액 빼 줍니다. 행정안전부가 이 한도를 올리자고 합니다.\n\n§G좋아함§! §Y국방부§!: 군 부대가 있는 시군의 살림이 나아집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 세금이 덜 걷힙니다.\n§R싫어함§! §Y국무총리실§!: 총리실의 지방 지원 사업이 빛을 잃습니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im6_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_im7:0 "행정안전부: 지방 소멸 대응 기금을 늘린다"
 TFRKPHN_dept_req_im7_desc:0 "인구가 줄어드는 시군에 해마다 1조 원이 나갑니다. 이명수 장관이 이 기금을 늘리자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 지방 민심이 좋아집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해마다 나가는 돈이 늘어납니다.\n§R싫어함§! §Y외교부§!: 원조 재원이 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im7_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_im8:0 "행정안전부: 소방과 경찰 인력을 늘린다"
 TFRKPHN_dept_req_im8_desc:0 "행정안전부가 소방관과 경찰관을 더 뽑자고 합니다. 인건비는 해마다 나가는 돈입니다.\n\n§G좋아함§! §Y외교부§!: 해외에 파견할 경찰 주재관이 늘어납니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 인건비가 해마다 나갑니다.\n§R싫어함§! §Y국가정보원§!: 경찰 수사 인력이 커지는 것을 경계합니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im8_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!\n§g일자리 대타협 탭이 열려 있으면§! 일자리 §G+3만§!, 노동계 §G+3§!"
 TFRKPHN_dept_req_im9:0 "행정안전부: 경찰국을 둔다"
 TFRKPHN_dept_req_im9_desc:0 "행정안전부가 부처 안에 경찰 업무를 맡는 국을 두겠다고 합니다. 경찰 인사를 장관이 직접 보겠다는 뜻입니다. 일선 경찰이 반발합니다.\n\n§G좋아함§! §Y외교부§!: 해외 경찰 협력 창구가 분명해집니다.\n§R싫어함§! §Y국무총리실§!: 경찰위원회의 자리가 좁아집니다.\n§R싫어함§! §Y국가정보원§!: 경찰 정보가 장관에게 먼저 올라갑니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im9_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y국무총리실§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_nis4:0 "국가정보원: 간첩죄 대상을 넓힌다"
 TFRKPHN_dept_req_nis4_desc:0 "지금 간첩죄는 적국을 위해 일한 사람만 벌합니다. 국정원이 대상을 모든 외국으로 넓히자고 합니다. 법을 고쳐야 하는 일입니다.\n\n§G좋아함§! §Y행정안전부§!: 경찰 안보 수사 대상이 넓어집니다.\n§R싫어함§! §Y외교부§!: 우방국과 마찰이 생길 수 있습니다.\n§R싫어함§! §Y국무총리실§!: 법 개정 부담을 총리실이 집니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis4_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y외교부§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_nis5:0 "국가정보원: 기술 유출 수사를 맡는다"
 TFRKPHN_dept_req_nis5_desc:0 "국정원에는 산업 기밀을 지키는 부서가 있습니다. 김홍균 원장이 기술 유출 사건을 직접 수사하게 해 달라고 합니다. 지금은 경찰이 수사합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 수출 기업의 기술이 지켜집니다.\n§R싫어함§! §Y행정안전부§!: 경찰이 수사를 내놓아야 합니다.\n§R싫어함§! §Y국무총리실§!: 수사 기관 조정이 다시 꼬입니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis5_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!\n§g일자리 대타협 탭이 열려 있으면§! 경영계 §G+3§!"
 TFRKPHN_dept_req_nis6:0 "국가정보원: 신원 조사 대상을 넓힌다"
 TFRKPHN_dept_req_nis6_desc:0 "국정원은 고위 공직자 후보의 신원을 조사합니다. 이 대상을 더 넓히자고 합니다. 인사 검증을 맡은 쪽과 일이 겹칩니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 기관장 인선 잡음이 줄어듭니다.\n§R싫어함§! §Y국무총리실§!: 인사 검증과 일이 겹칩니다.\n§R싫어함§! §Y외교부§!: 외교관 인사가 늦어집니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis6_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y국무총리실§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_nis7:0 "국가정보원: 대테러 지휘를 국정원으로 옮긴다"
 TFRKPHN_dept_req_nis7_desc:0 "대테러센터는 총리실에 있습니다. 국정원이 테러 정보를 쥐고 있으니 지휘도 맡겠다고 합니다.\n\n§G좋아함§! §Y국방부§!: 군은 정보를 쥔 쪽이 지휘하기를 바랍니다.\n§R싫어함§! §Y국무총리실§!: 대테러센터를 내놓아야 합니다.\n§R싫어함§! §Y외교부§!: 해외 테러 대응 창구가 바뀝니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis7_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y국무총리실§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_nis8:0 "국가정보원: 국내 정보 부서를 되살린다"
 TFRKPHN_dept_req_nis8_desc:0 "국정원의 국내 정보 부서는 2017년에 없어졌습니다. 국정원이 이를 다시 두자고 합니다. 국내 정보는 지금 경찰이 모읍니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 경제 동향 보고가 빨라집니다.\n§R싫어함§! §Y행정안전부§!: 경찰 정보 부서와 겹칩니다.\n§R싫어함§! §Y국방부§!: 군 방첩 부대와 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis8_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_nis9:0 "국가정보원: 해외 공관에 요원을 더 보낸다"
 TFRKPHN_dept_req_nis9_desc:0 "국정원 요원은 대사관 직원 신분으로 해외에 나갑니다. 국정원이 그 자리를 늘려 달라고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 해외 위기 보고가 빨라집니다.\n§R싫어함§! §Y외교부§!: 대사관 자리를 내줘야 합니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해외 활동비가 듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis9_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y외교부§! 신임 §R-8§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!"
 TFRKPHN_dept_req_dm4:0 "국방부: 군 공항 이전에 나랏돈을 쓴다"
 TFRKPHN_dept_req_dm4_desc:0 "군 공항을 옮기는 돈은 옛 터를 팔아 마련하게 되어 있습니다. 모자라는 돈을 나라가 대자고 국방부가 요청합니다.\n\n§G좋아함§! §Y행정안전부§!: 지자체의 오랜 숙원입니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 수조 원이 듭니다.\n§R싫어함§! §Y국가정보원§!: 새 기지 보안 시설을 다시 지어야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm4_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_dm5:0 "국방부: 병사 봉급을 올린다"
 TFRKPHN_dept_req_dm5_desc:0 "국방부가 병장 월급을 200만 원까지 올리자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 청년 여론이 좋아집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해마다 수조 원이 듭니다.\n§R싫어함§! §Y행정안전부§!: 9급 공무원보다 병장 월급이 많아집니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm5_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y행정안전부§! 신임 §R-8§!"
 TFRKPHN_dept_req_dm6:0 "국방부: 정찰 위성은 군이 운용한다"
 TFRKPHN_dept_req_dm6_desc:0 "군 정찰 위성이 궤도에 올랐습니다. 영상을 누가 먼저 받느냐를 두고 군과 국정원이 맞섭니다. 국방부가 운용을 군에 맡겨 달라고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 운용 책임이 분명해집니다.\n§R싫어함§! §Y국가정보원§!: 영상을 먼저 받지 못합니다.\n§R싫어함§! §Y외교부§!: 영상 공유 협의 창구가 바뀝니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm6_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y국가정보원§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_dm7:0 "국방부: 의사 인력을 군의관으로 먼저 받는다"
 TFRKPHN_dept_req_dm7_desc:0 "의대생이 병사로 입대하는 일이 늘어 군의관이 모자랍니다. 국방부가 의사 인력을 군에 먼저 배정하자고 합니다. 보건소 의사가 그만큼 줄어듭니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 군 병원 민간 위탁비가 줄어듭니다.\n§R싫어함§! §Y행정안전부§!: 보건소 의사가 줄어듭니다.\n§R싫어함§! §Y외교부§!: 해외 의료 지원 인력이 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm7_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_dm8:0 "국방부: 예비군 훈련비를 올린다"
 TFRKPHN_dept_req_dm8_desc:0 "예비군 훈련에 나오면 받는 돈이 하루 일당에 못 미칩니다. 국방부가 이를 올리자고 합니다.\n\n§G좋아함§! §Y국가정보원§!: 예비 전력이 든든해집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해마다 수천억 원이 듭니다.\n§R싫어함§! §Y국무총리실§!: 다른 수당 인상 요구가 줄을 잇습니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm8_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_dm9:0 "국방부: 방위사업청을 국방부 밑으로 되돌린다"
 TFRKPHN_dept_req_dm9_desc:0 "방위사업청은 2006년에 국방부에서 떨어져 나왔습니다. 국방부가 무기 도입을 다시 직접 챙기겠다고 합니다.\n\n§G좋아함§! §Y외교부§!: 수출 협상 상대가 하나로 줄어듭니다.\n§R싫어함§! §Y행정안전부§!: 조직을 다시 짜야 합니다.\n§R싫어함§! §Y국가정보원§!: 방산 보안 감사 대상이 흐려집니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm9_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_pm10:0 "국무총리실: 인사 검증을 총리실이 맡는다"
 TFRKPHN_dept_req_pm10_desc:0 "장관 후보의 인사 검증은 대통령실 일이었습니다. 총리실이 이를 넘겨 달라고 합니다. 국정원의 신원 조사와 일이 겹칩니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 검증이 빨라져 인사 공백이 줄어듭니다.\n§R싫어함§! §Y국가정보원§!: 신원 조사와 일이 겹칩니다.\n§R싫어함§! §Y국방부§!: 장성 인사 검증도 넘어갑니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm10_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y국가정보원§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_pm11:0 "국무총리실: 보훈처를 부로 올린다"
 TFRKPHN_dept_req_pm11_desc:0 "국가보훈처는 총리 밑의 처입니다. 총리실이 이를 부로 올리자고 합니다. 부가 되면 정원과 조직이 늘어납니다.\n\n§G좋아함§! §Y국방부§!: 참전 용사 예우가 좋아집니다.\n§R싫어함§! §Y행정안전부§!: 정원과 조직을 내줘야 합니다.\n§R싫어함§! §Y외교부§!: 해외 참전 용사 사업이 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm11_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_pm12:0 "국무총리실: 공정거래위원회 조사권을 넓힌다"
 TFRKPHN_dept_req_pm12_desc:0 "공정거래위원회는 총리 소속입니다. 총리실이 이 위원회의 조사 권한을 넓히자고 합니다. [TFRKPHN_mof]는 기업 투자가 움츠러든다고 봅니다.\n\n§G좋아함§! §Y국가정보원§!: 기업 정보가 더 많이 쌓입니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 기업 투자가 움츠러든다고 봅니다.\n§R싫어함§! §Y국방부§!: 방산 업체가 조사 대상이 됩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm12_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!\n§g일자리 대타협 탭이 열려 있으면§! 노동계 §G+3§!, 경영계 §R-8§!"
 TFRKPHN_dept_req_pm13:0 "국무총리실: 큰 재난은 총리가 지휘한다"
 TFRKPHN_dept_req_pm13_desc:0 "재난 대책 본부장은 행정안전부 장관입니다. 2020년 감염병 때는 총리가 처음으로 본부장을 맡았습니다. 총리실이 이를 원칙으로 삼자고 합니다.\n\n§G좋아함§! §Y국가정보원§!: 위기 보고 체계가 단순해집니다.\n§R싫어함§! §Y행정안전부§!: 재난 지휘권을 내놓아야 합니다.\n§R싫어함§! §Y국방부§!: 군 병력 지원 요청이 늘어납니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm13_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm9:0 "외교부: 북한 인권 대사를 임명한다"
 TFRKPHN_dept_req_fm9_desc:0 "북한 인권 대사 자리는 법에 있지만 오래 비어 있었습니다. 외교부가 이 자리를 채우자고 합니다.\n\n§G좋아함§! §Y국방부§!: 대북 압박에 힘이 실립니다.\n§R싫어함§! §Y국가정보원§!: 대북 물밑 접촉이 어려워집니다.\n§R싫어함§! §Y국무총리실§!: 대북 메시지가 여러 갈래로 나갑니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm9_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y국가정보원§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm10:0 "외교부: 외교 정보 조직을 만든다"
 TFRKPHN_dept_req_fm10_desc:0 "외교부가 본부에 정보 분석 조직을 따로 두겠다고 합니다. 해외 정보는 국정원이 맡아 온 일입니다.\n\n§G좋아함§! §Y행정안전부§!: 해외 재난 정보를 빨리 받습니다.\n§R싫어함§! §Y국가정보원§!: 해외 정보를 혼자 쥐지 못합니다.\n§R싫어함§! §Y국방부§!: 군 정보와 분석이 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm10_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y국가정보원§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm11:0 "외교부: 무관도 대사의 지휘를 받는다"
 TFRKPHN_dept_req_fm11_desc:0 "대사관에는 국방부가 보낸 무관이 있습니다. 외교부가 무관의 보고도 대사를 거치게 하자고 합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 공관 예산 집행이 단순해집니다.\n§R싫어함§! §Y국방부§!: 무관의 보고 선이 대사를 거칩니다.\n§R싫어함§! §Y국가정보원§!: 파견 요원도 같은 요구를 받을까 걱정합니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm11_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y국방부§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm12:0 "외교부: 외교관을 더 뽑는다"
 TFRKPHN_dept_req_fm12_desc:0 "외교부가 외교관 선발 인원을 늘리자고 합니다. 공무원 정원은 행정안전부가 정합니다.\n\n§G좋아함§! §Y국방부§!: 국방 협력 담당 외교관이 늘어납니다.\n§R싫어함§! §Y행정안전부§!: 정원을 내줘야 합니다.\n§R싫어함§! §Y국가정보원§!: 신원 조사 일이 늘어납니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm12_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm13:0 "외교부: 재외 공관을 새로 연다"
 TFRKPHN_dept_req_fm13_desc:0 "외교부가 공관이 없는 나라 열두 곳에 대사관을 열자고 합니다. 건물과 사람 모두 새로 필요합니다.\n\n§G좋아함§! §Y국가정보원§!: 해외 거점이 늘어납니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 건물과 운영비가 듭니다.\n§R싫어함§! §Y국방부§!: 무관을 보낼 사람이 모자랍니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm13_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_fm14:0 "외교부: 무상 원조를 외교부로 모은다"
 TFRKPHN_dept_req_fm14_desc:0 "무상 원조는 수십 개 기관이 제각각 합니다. 외교부가 이를 한데 모으자고 합니다. 조정은 지금 총리실 위원회가 맡고 있습니다.\n\n§G좋아함§! §Y국가정보원§!: 원조 현장 정보가 한곳에 모입니다.\n§R싫어함§! §Y국무총리실§!: 조정권이 총리실에서 외교부로 넘어갑니다.\n§R싫어함§! §Y행정안전부§!: 새마을 원조 사업을 넘겨야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 외교부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_fm14_tt:0 "§Y외교부§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y국무총리실§! 신임 §R-8§!\n§Y행정안전부§! 신임 §R-8§!"
 TFRKPHN_dept_req_em10:0 "[TFRKPHN_mof]: 성과 낮은 사업은 예산을 깎는다"
 TFRKPHN_dept_req_em10_desc:0 "[TFRKPHN_mof]는 해마다 재정 사업을 평가합니다. 점수가 낮은 사업은 예산을 깎자고 합니다. 총리실의 부처 평가와 일이 겹칩니다.\n\n§G좋아함§! §Y외교부§!: 원조 사업 점수가 높았습니다.\n§R싫어함§! §Y국무총리실§!: 부처 평가와 일이 겹칩니다.\n§R싫어함§! §Y국가정보원§!: 비공개 사업은 성과를 보여 줄 수 없습니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em10_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y국무총리실§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_em11:0 "[TFRKPHN_mof]: 재량 지출을 10% 줄인다"
 TFRKPHN_dept_req_em11_desc:0 "[TFRKPHN_mof]가 모든 부처에 재량 지출을 10%씩 줄이라고 하자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 전쟁 빚 상환 실적이 생깁니다.\n§R싫어함§! §Y외교부§!: 공관 운영비가 줄어듭니다.\n§R싫어함§! §Y국방부§!: 훈련비가 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em11_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y외교부§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!\n§g일자리 대타협 탭이 열려 있으면§! 일자리 §R-2만§!"
 TFRKPHN_dept_req_em12:0 "[TFRKPHN_mof]: 군인 연금을 손본다"
 TFRKPHN_dept_req_em12_desc:0 "군인 연금은 해마다 나랏돈으로 적자를 메웁니다. [TFRKPHN_mof]가 이 제도를 고치자고 합니다.\n\n§G좋아함§! §Y외교부§!: 아낀 돈이 다른 부처로 돌아옵니다.\n§R싫어함§! §Y국방부§!: 간부들이 전역을 서두릅니다.\n§R싫어함§! §Y국가정보원§!: 요원 연금도 다음 차례로 봅니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em12_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y국방부§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_em13:0 "[TFRKPHN_mof]: 경제 회의는 부총리가 이끈다"
 TFRKPHN_dept_req_em13_desc:0 "경제 부처 장관 회의는 부총리가 주재합니다. [TFRKPHN_mof]가 경제 현안은 이 회의에서 끝내자고 합니다. 총리실의 조정 회의는 힘이 빠집니다.\n\n§G좋아함§! §Y국가정보원§!: 경제 안보 보고 창구가 하나로 정리됩니다.\n§R싫어함§! §Y국무총리실§!: 총리실 조정 회의가 힘을 잃습니다.\n§R싫어함§! §Y행정안전부§!: 지방 경제 현안이 뒤로 밀립니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em13_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y국무총리실§! 신임 §R-8§!\n§Y행정안전부§! 신임 §R-8§!"
 TFRKPHN_dept_req_im10:0 "행정안전부: 공공기관을 지방으로 더 옮긴다"
 TFRKPHN_dept_req_im10_desc:0 "수도권에 남은 공공기관을 지방으로 옮기자는 안입니다. 외교부 산하 기관도 대상에 들어갑니다.\n\n§G좋아함§! §Y국무총리실§!: 균형 발전 실적이 생깁니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 이전 비용이 듭니다.\n§R싫어함§! §Y외교부§!: 산하 기관이 서울을 떠나야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im10_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!\n§g일자리 대타협 탭이 열려 있으면§! 노동계 §R-3§!"
 TFRKPHN_dept_req_im11:0 "행정안전부: 정부 전산망을 한곳에 모은다"
 TFRKPHN_dept_req_im11_desc:0 "부처마다 따로 두던 서버를 행정안전부 전산 센터로 모으자고 합니다. 보안 점검은 국정원 일이라 권한이 겹칩니다.\n\n§G좋아함§! §Y국무총리실§!: 부처 간 자료 공유가 쉬워집니다.\n§R싫어함§! §Y국가정보원§!: 보안 점검 권한이 겹칩니다.\n§R싫어함§! §Y외교부§!: 외교 전문 서버는 못 옮긴다고 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im11_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y국가정보원§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_im12:0 "행정안전부: 특별자치도를 늘린다"
 TFRKPHN_dept_req_im12_desc:0 "강원과 전북이 특별자치도 지위를 요구합니다. 행정안전부가 이를 들어주자고 합니다. 중앙 부처의 권한이 그만큼 내려갑니다.\n\n§G좋아함§! §Y외교부§!: 지자체가 해외 투자 유치에 나섭니다.\n§R싫어함§! §Y국무총리실§!: 중앙의 조정 권한이 줄어듭니다.\n§R싫어함§! §Y국방부§!: 접경 지역 규제 권한이 흔들립니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im12_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y국무총리실§! 신임 §R-8§!\n§Y국방부§! 신임 §R-8§!"
 TFRKPHN_dept_req_im13:0 "행정안전부: 을지 연습을 행안부가 이끈다"
 TFRKPHN_dept_req_im13_desc:0 "전시 대비 정부 연습은 행정안전부가 주관합니다. 군은 같은 기간에 따로 연합 연습을 합니다. 행정안전부가 계획을 먼저 짜겠다고 합니다.\n\n§G좋아함§! §Y[TFRKPHN_mof]§!: 따로 하던 연습이 합쳐져 돈이 덜 듭니다.\n§R싫어함§! §Y국방부§!: 군 연습 일정을 맞춰야 합니다.\n§R싫어함§! §Y국가정보원§!: 전시 정보 계획을 미리 내놓아야 합니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im13_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y[TFRKPHN_mof]§! 신임 §G+6§!\n§Y국방부§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_nis10:0 "국가정보원: 방첩 업무를 국정원이 조정한다"
 TFRKPHN_dept_req_nis10_desc:0 "방첩은 국정원과 군 방첩 부대, 경찰이 나눠 맡습니다. 국정원이 이들의 계획을 조정하겠다고 합니다.\n\n§G좋아함§! §Y외교부§!: 외국 공관 관련 사건 창구가 하나가 됩니다.\n§R싫어함§! §Y국방부§!: 군 방첩 부대가 조정을 받습니다.\n§R싫어함§! §Y국무총리실§!: 총리실 조정을 거치지 않습니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis10_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y국방부§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_nis11:0 "국가정보원: 통신사에 감청 설비를 갖추게 한다"
 TFRKPHN_dept_req_nis11_desc:0 "휴대 전화는 법원 허가가 있어도 감청할 설비가 없습니다. 국정원이 통신사에 설비를 갖추게 하는 법을 요구합니다. 반대 여론이 큽니다.\n\n§G좋아함§! §Y행정안전부§!: 경찰 수사에도 쓸 수 있습니다.\n§R싫어함§! §Y국무총리실§!: 반대 여론을 총리실이 떠안습니다.\n§R싫어함§! §Y외교부§!: 인권 문제로 국제 평판이 걱정됩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis11_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y국무총리실§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_nis12:0 "국가정보원: 보안 감사를 늘린다"
 TFRKPHN_dept_req_nis12_desc:0 "국정원은 각 부처와 재외 공관의 보안을 점검합니다. 이 감사를 해마다 하겠다고 합니다.\n\n§G좋아함§! §Y국방부§!: 군 보안 기준이 다른 부처에도 퍼집니다.\n§R싫어함§! §Y외교부§!: 공관마다 해마다 감사를 받습니다.\n§R싫어함§! §Y행정안전부§!: 지자체까지 감사를 받습니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis12_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y외교부§! 신임 §R-8§!\n§Y행정안전부§! 신임 §R-8§!"
 TFRKPHN_dept_req_nis13:0 "국가정보원: 경제 안보 정보를 모은다"
 TFRKPHN_dept_req_nis13_desc:0 "국정원이 공급망과 원자재 정보를 모아 경보를 내겠다고 합니다. [TFRKPHN_mof]도 같은 일을 하는 회의를 두고 있습니다.\n\n§G좋아함§! §Y행정안전부§!: 지역 기업 피해를 미리 알 수 있습니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 경제 안보 회의와 일이 겹칩니다.\n§R싫어함§! §Y외교부§!: 경제 안보 외교와 일이 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis13_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_dm10:0 "국방부: 초급 간부 수당을 올린다"
 TFRKPHN_dept_req_dm10_desc:0 "소위와 하사가 군을 떠나고 있습니다. 국방부가 초급 간부 수당을 올리자고 합니다.\n\n§G좋아함§! §Y국가정보원§!: 군 출신 요원을 뽑기 쉬워집니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 해마다 나가는 돈이 늘어납니다.\n§R싫어함§! §Y외교부§!: 외교관 수당은 그대로입니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm10_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y외교부§! 신임 §R-8§!"
 TFRKPHN_dept_req_dm11:0 "국방부: 군무원을 늘린다"
 TFRKPHN_dept_req_dm11_desc:0 "병사가 줄어드는 만큼 군무원을 늘리자는 안입니다. 정원과 인건비가 함께 늘어납니다.\n\n§G좋아함§! §Y외교부§!: 해외 파견 부대 지원이 쉬워집니다.\n§R싫어함§! §Y행정안전부§!: 정원을 내줘야 합니다.\n§R싫어함§! §Y국가정보원§!: 신원 조사 일이 늘어납니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm11_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!\n§g일자리 대타협 탭이 열려 있으면§! 일자리 §G+2만§!"
 TFRKPHN_dept_req_dm12:0 "국방부: 방산 수출 허가를 서두른다"
 TFRKPHN_dept_req_dm12_desc:0 "국방부가 무기 수출 허가를 빨리 내주자고 합니다. 외교부는 분쟁 지역 수출에 신중합니다.\n\n§G좋아함§! §Y행정안전부§!: 방산 공장이 있는 지역 경제가 삽니다.\n§R싫어함§! §Y외교부§!: 분쟁 지역 수출은 외교 부담이 됩니다.\n§R싫어함§! §Y국가정보원§!: 기술 보안 심사 시간이 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm12_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y행정안전부§! 신임 §G+6§!\n§Y외교부§! 신임 §R-8§!\n§Y국가정보원§! 신임 §R-8§!"
 TFRKPHN_dept_req_dm13:0 "국방부: 군 공항 고도 제한을 지킨다"
 TFRKPHN_dept_req_dm13_desc:0 "군 공항 주변은 건물 높이가 묶여 있습니다. 지자체들이 이를 풀어 달라고 합니다. 국방부는 지금 기준을 지키자고 합니다.\n\n§G좋아함§! §Y국가정보원§!: 기지 주변 보안이 지켜집니다.\n§R싫어함§! §Y행정안전부§!: 지자체 개발이 막힙니다.\n§R싫어함§! §Y국무총리실§!: 지자체 민원이 총리실로 몰립니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm13_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y행정안전부§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_dm14:0 "국방부: 군사 법원을 지킨다"
 TFRKPHN_dept_req_dm14_desc:0 "평시 군사 법원을 없애자는 주장이 있습니다. 국방부가 지금 제도를 지키겠다고 합니다. 반대 여론이 큽니다.\n\n§G좋아함§! §Y국가정보원§!: 군 기밀이 민간 법정에 나가지 않습니다.\n§R싫어함§! §Y국무총리실§!: 반대 여론을 총리실이 떠안습니다.\n§R싫어함§! §Y행정안전부§!: 경찰이 군 사건을 넘겨받지 못합니다.\n\n§g다음 국무회의까지 들어주지 않으면 국방부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_dm14_tt:0 "§Y국방부§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y국무총리실§! 신임 §R-8§!\n§Y행정안전부§! 신임 §R-8§!"
 TFRKPHN_dept_req_pm14:0 "국무총리실: 청년 정책을 총리실이 조정한다"
 TFRKPHN_dept_req_pm14_desc:0 "청년 정책은 부처마다 따로 합니다. 총리가 위원장인 위원회가 이를 조정하게 되어 있습니다. 총리실이 이 위원회에 예산 조정권을 달라고 합니다.\n\n§G좋아함§! §Y외교부§!: 해외 청년 사업이 힘을 받습니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 예산 조정권을 나눠야 합니다.\n§R싫어함§! §Y행정안전부§!: 지자체 청년 사업과 겹칩니다.\n\n§g다음 국무회의까지 들어주지 않으면 국무총리실 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_pm14_tt:0 "§Y국무총리실§! 신임 §G+15§!\n§Y외교부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y행정안전부§! 신임 §R-8§!\n§g일자리 대타협 탭이 열려 있으면§! 일자리 §G+2만§!"
 TFRKPHN_dept_req_em14:0 "[TFRKPHN_mof]: 부담금을 정비한다"
 TFRKPHN_dept_req_em14_desc:0 "부처들은 세금 말고도 부담금을 따로 걷습니다. 여권을 만들 때 내는 돈도 그중 하나입니다. [TFRKPHN_mof]가 부담금을 줄이거나 없애자고 합니다.\n\n§G좋아함§! §Y국무총리실§!: 국민 부담이 줄어 여론이 좋아집니다.\n§R싫어함§! §Y외교부§!: 여권에 붙는 기여금 수입이 줄어듭니다.\n§R싫어함§! §Y행정안전부§!: 지자체가 걷는 부담금도 줄어듭니다.\n\n§g다음 국무회의까지 들어주지 않으면 [TFRKPHN_mof] 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_em14_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!\n§Y국무총리실§! 신임 §G+6§!\n§Y외교부§! 신임 §R-8§!\n§Y행정안전부§! 신임 §R-8§!\n§g일자리 대타협 탭이 열려 있으면§! 경영계 §G+5§!"
 TFRKPHN_dept_req_im14:0 "행정안전부: 민방위 훈련을 되살린다"
 TFRKPHN_dept_req_im14_desc:0 "전국 민방위 훈련은 여러 해 동안 열리지 않았습니다. 행정안전부가 온 국민이 참여하는 훈련을 다시 하자고 합니다.\n\n§G좋아함§! §Y국가정보원§!: 대피 체계 점검에 도움이 됩니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 훈련 날 경제 활동이 멈춥니다.\n§R싫어함§! §Y국무총리실§!: 총리실에 민원이 몰립니다.\n\n§g다음 국무회의까지 들어주지 않으면 행정안전부 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_im14_tt:0 "§Y행정안전부§! 신임 §G+15§!\n§Y국가정보원§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_dept_req_nis14:0 "국가정보원: 안보비를 늘린다"
 TFRKPHN_dept_req_nis14_desc:0 "국정원 특수활동비는 2018년에 안보비로 이름이 바뀌었습니다. 김홍균 원장이 이 예산을 늘려 달라고 합니다.\n\n§G좋아함§! §Y국방부§!: 군 정보 부대 지원비가 함께 늘어납니다.\n§R싫어함§! §Y[TFRKPHN_mof]§!: 내역을 모르는 돈이 늘어납니다.\n§R싫어함§! §Y국무총리실§!: 감사할 길이 없는 돈입니다.\n\n§g다음 국무회의까지 들어주지 않으면 국가정보원 신임이 6 내려갑니다.§!"
 TFRKPHN_dept_req_nis14_tt:0 "§Y국가정보원§! 신임 §G+15§!\n§Y국방부§! 신임 §G+6§!\n§Y[TFRKPHN_mof]§! 신임 §R-8§!\n§Y국무총리실§! 신임 §R-8§!"
 TFRKPHN_lee_trust_category:0 "임기를 함께하는 내각"
 TFRKPHN_lee_trust_category_desc:0 "장관은 임기 끝까지 바꾸지 않습니다. 그래서 장관마다 청이 있고, 한 부처의 청은 다른 부처의 일을 건드립니다.\n\n신임이 §Y70§! 이상인 부처는 나라에 보탬이 됩니다. §Y30§! 이하로 내려간 부처는 짐이 됩니다."
 TFRKPHN_dept_meeting_mission:0 "다음 국무회의"
 TFRKPHN_dept_meeting_mission_desc:0 "국무회의가 열리면 두 부처가 새 현안을 들고 옵니다."
 TFRKPHN_dept_meeting_tt:0 "두 부처가 새 현안을 가져옵니다.\n들어주지 않은 현안은 사라지고 그 부처 신임이 §R-6§! 됩니다."
 TFRKPHN_dept_start_tt:0 "결정 탭에 §Y임기를 함께하는 내각§!이 열립니다."
 TFRKPHN_dept_wait:0 "§R기타 장관 여섯 자리를 모두 임명해야 국무회의가 열립니다.§!\n§g임명을 마친 다음 날 첫 현안이 올라옵니다.§!"
 TFRKPHN_dept_hint:0 "§g신임 70 이상이면 효과가 붙고, 30 이하면 반대 효과가 붙습니다.\n국무회의는 30일마다 열립니다.§!"
 TFRKPHN_dept_st_hi:0 "§G보탬이 됨§!"
 TFRKPHN_dept_st_mid:0 "§g보통§!"
 TFRKPHN_dept_st_lo:0 "§R짐이 됨§!"
 TFRKPHN_dept_name_pm:0 "국무총리실"
 TFRKPHN_dept_min_pm:0 "정진석"
 TFRKPHN_dept_tv_pm:0 "신임 [?TFRKPHN_dept_t_pm|0]"
 TFRKPHN_dept_tt_pm:0 "§Y국무총리실§! 정진석\n신임 70 이상: 정치력 획득 §G+10%§!\n신임 30 이하: 정치력 획득 §R-5%§!\n\n§Y정부조직법 제18조(국무총리의 행정감독권)§!\n① 국무총리는 대통령의 명을 받아 각 중앙행정기관의 장을\n지휘/감독한다.\n② 국무총리는 중앙행정기관의 장의 명령이나 처분이 위법 또는\n부당하다고 인정될 경우에는 대통령의 승인을 받아 이를 중지 또는\n취소할 수 있다."
 TFRKPHN_dept_name_fm:0 "외교부"
 TFRKPHN_dept_min_fm:0 "조현동"
 TFRKPHN_dept_tv_fm:0 "신임 [?TFRKPHN_dept_t_fm|0]"
 TFRKPHN_dept_tt_fm:0 "§Y외교부§! 조현동\n신임 70 이상: 외교 관계 개선 속도 §G+20%§!\n신임 30 이하: 외교 관계 개선 속도 §R-10%§!\n\n§Y정부조직법 제33조(외교부)§!\n① 외교부장관은 외교, 경제외교 및 국제경제협력외교, 국제관계\n업무에 관한 조정, 조약 기타 국제협정, 재외국민의 보호/지원,\n국제정세의 조사/분석에 관한 사무를 관장한다.\n② 외교부에 차관보 1명을 둘 수 있다."
 TFRKPHN_dept_name_em:0 "기획재정부"
 TFRKPHN_dept_min_em:0 "방기선"
 TFRKPHN_dept_tv_em:0 "신임 [?TFRKPHN_dept_t_em|0]"
 TFRKPHN_dept_tt_em:0 "§Y기획재정부§! 방기선\n신임 70 이상: 소비재 공장 §G-5%§!\n신임 30 이하: 소비재 공장 §R+2%§!\n\n§Y정부조직법 제30조(기획재정부)§!\n① 기획재정부장관은 중장기 국가발전전략수립, 경제/재정정책의\n수립/총괄/조정, 예산/기금의 편성/집행/성과관리,\n화폐/외환/국고/정부회계/내국세제/관세/국제금융, 공공기관 관리,\n경제협력/국유재산/민간투자 및 국가채무에 관한 사무를 관장한다.\n② 기획재정부에 차관보 1명을 둘 수 있다."
 TFRKPHN_dept_name_em2:0 "재정경제부"
 TFRKPHN_dept_tt_em2:0 "§Y재정경제부§! 방기선\n신임 70 이상: 소비재 공장 §G-5%§!\n신임 30 이하: 소비재 공장 §R+2%§!\n\n§Y정부조직법 제30조(재정경제부)§!\n① 재정경제부장관은 경제정책의 수립/총괄/조정,\n화폐/외환/국고/정부회계/내국세제/관세/국제금융, 공공기관 관리,\n경제협력 및 국유재산에 관한 사무를 관장한다.\n② 재정경제부에 차관보 1명을 둘 수 있다."
 TFRKPHN_dept_name_im:0 "행정안전부"
 TFRKPHN_dept_min_im:0 "이명수"
 TFRKPHN_dept_tv_im:0 "신임 [?TFRKPHN_dept_t_im|0]"
 TFRKPHN_dept_tt_im:0 "§Y행정안전부§! 이명수\n신임 70 이상: 안정도 §G+5%§!\n신임 30 이하: 안정도 §R-3%§!\n\n§Y정부조직법 제37조(행정안전부)§!\n① 행정안전부장관은 국무회의의 서무, 법령 및 조약의 공포,\n정부조직과 정원, 상훈, 정부혁신, 행정능률, 전자정부,\n정부청사의 관리, 지방자치제도, 지방자치단체의\n사무지원/재정/세제, 낙후지역 등 지원, 지방자치단체간 분쟁조정,\n선거/국민투표의 지원, 안전 및 재난에 관한 정책의\n수립/총괄/조정, 비상대비, 민방위 및 방재에 관한 사무를\n관장한다.\n② 국가의 행정사무로서 다른 중앙행정기관의 소관에 속하지 아니하는\n사무는 행정안전부장관이 이를 처리한다."
 TFRKPHN_dept_name_nis:0 "국가정보원"
 TFRKPHN_dept_min_nis:0 "김홍균"
 TFRKPHN_dept_tv_nis:0 "신임 [?TFRKPHN_dept_t_nis|0]"
 TFRKPHN_dept_tt_nis:0 "§Y국가정보원§! 김홍균\n신임 70 이상: 적국 공작 효율 §G-20%§!\n신임 30 이하: 적국 공작 효율 §R+10%§!\n\n§Y정부조직법 제17조(국가정보원)§!\n① 국가안전보장에 관련되는 정보 및 보안에 관한 사무를 담당하기\n위하여 대통령 소속으로 국가정보원을 둔다.\n② 국가정보원의 조직/직무범위 그 밖에 필요한 사항은 따로 법률로\n정한다."
 TFRKPHN_dept_name_dm:0 "국방부"
 TFRKPHN_dept_min_dm:0 "신범철"
 TFRKPHN_dept_tv_dm:0 "신임 [?TFRKPHN_dept_t_dm|0]"
 TFRKPHN_dept_tt_dm:0 "§Y국방부§! 신범철\n신임 70 이상: 작전 계획 속도 §G+15%§!\n신임 30 이하: 작전 계획 속도 §R-10%§!\n\n§Y정부조직법 제36조(국방부)§!\n① 국방부장관은 국방에 관련된 군정 및 군령과 그 밖에 군사에\n관한 사무를 관장한다."
 TFRKPHN_dept_trust:0 "부처 신임"
 TFRKPHN_mof_old:0 "기획재정부"
 TFRKPHN_mof_new:0 "재정경제부"
 TFRKPHN_mof_s_old:0 "기재부"
 TFRKPHN_mof_s_new:0 "재경부"
 tfrkphn.285.t:0 "기획재정부를 둘로 나눌 것인가"
 tfrkphn.285.d:0 "정부조직법 개정안이 국무회의에 올라왔습니다.\n\n기획재정부를 둘로 나누는 안입니다. 예산 편성은 국무총리 소속 기획예산처로 넘어갑니다. 남은 부처는 재정경제부가 됩니다.\n\n재정경제부라는 이름은 2008년에 사라졌습니다. 그해 재정경제부와 기획예산처가 합쳐져 기획재정부가 되었습니다. 이번 안은 그 합병을 되돌리는 것입니다."
 tfrkphn.285.a:0 "둘로 나눈다"
 tfrkphn.285.b:0 "그대로 둔다"
 tfrkphn.285.a_tt:0 "§Y기획재정부§!가 §Y재정경제부§!로 바뀝니다.\n예산 편성은 총리 소속 §Y기획예산처§!로 넘어갑니다."
 tfrkphn.285.b_tt:0 "§Y기획재정부§!가 그대로 남습니다."
 tfrkphn.286.t:0 "국무총리, 사의를 밝히다"
 tfrkphn.286.d:0 "정진석 총리가 사의를 밝혔습니다.\n\n총리실이 올린 안건이 잇달아 밀렸습니다. 이름뿐인 책임총리는 할 수 없다는 뜻입니다.\n\n대통령은 장관들과 임기를 함께하겠다고 약속했습니다."
 tfrkphn.286.a_tt:0 "§Y국무총리실§! 신임 §G+15§!"
 tfrkphn.286.b_tt:0 "§Y국무총리실§! 신임 §G+25§!\n§Y[TFRKPHN_mof]§! 신임 §R-10§!"
 tfrkphn.287.t:0 "외교부 장관, 사의를 밝히다"
 tfrkphn.287.d:0 "조현동 외교부 장관이 사의를 밝혔습니다.\n\n외교부의 요청은 예산과 정원에서 번번이 깎였습니다. 대사들 사이에서도 불만이 나옵니다.\n\n대통령은 장관들과 임기를 함께하겠다고 약속했습니다."
 tfrkphn.287.a_tt:0 "§Y외교부§! 신임 §G+15§!"
 tfrkphn.287.b_tt:0 "§Y외교부§! 신임 §G+25§!\n§Y국가정보원§! 신임 §R-10§!"
 tfrkphn.288.t:0 "[TFRKPHN_mof] 장관, 사의를 밝히다"
 tfrkphn.288.d:0 "방기선 장관이 사의를 밝혔습니다.\n\n다른 부처의 지출 요구를 막을 길이 없다는 이유입니다. 예산을 다루는 직원들이 술렁입니다.\n\n대통령은 장관들과 임기를 함께하겠다고 약속했습니다."
 tfrkphn.288.a_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+15§!"
 tfrkphn.288.b_tt:0 "§Y[TFRKPHN_mof]§! 신임 §G+25§!\n§Y국방부§! 신임 §R-10§!"
 tfrkphn.289.t:0 "행정안전부 장관, 사의를 밝히다"
 tfrkphn.289.d:0 "이명수 행정안전부 장관이 사의를 밝혔습니다.\n\n지방에 약속한 돈이 내려가지 않았습니다. 시장과 군수들의 항의가 장관에게 몰렸습니다.\n\n대통령은 장관들과 임기를 함께하겠다고 약속했습니다."
 tfrkphn.289.a_tt:0 "§Y행정안전부§! 신임 §G+15§!"
 tfrkphn.289.b_tt:0 "§Y행정안전부§! 신임 §G+25§!\n§Y[TFRKPHN_mof]§! 신임 §R-10§!"
 tfrkphn.290.t:0 "국가정보원장, 사의를 밝히다"
 tfrkphn.290.d:0 "김홍균 국가정보원장이 사의를 밝혔습니다.\n\n국정원의 권한이 하나씩 다른 기관으로 넘어갔습니다. 조직을 지키지 못했다는 이유입니다.\n\n대통령은 장관들과 임기를 함께하겠다고 약속했습니다."
 tfrkphn.290.a_tt:0 "§Y국가정보원§! 신임 §G+15§!"
 tfrkphn.290.b_tt:0 "§Y국가정보원§! 신임 §G+25§!\n§Y행정안전부§! 신임 §R-10§!"
 tfrkphn.291.t:0 "국방부 장관, 사의를 밝히다"
 tfrkphn.291.d:0 "신범철 국방부 장관이 사의를 밝혔습니다.\n\n전쟁에서 쓴 탄약을 채울 예산이 또 밀렸습니다. 군 안에서 장관에게 힘이 없다는 말이 돕니다.\n\n대통령은 장관들과 임기를 함께하겠다고 약속했습니다."
 tfrkphn.291.a_tt:0 "§Y국방부§! 신임 §G+15§!"
 tfrkphn.291.b_tt:0 "§Y국방부§! 신임 §G+25§!\n§Y[TFRKPHN_mof]§! 신임 §R-10§!"
 tfrkphn.resign.a:0 "사표를 돌려보낸다"
 tfrkphn.resign.b:0 "요구를 들어주고 붙잡는다"
 tfrkphn.295.t:0 "국회가 장관 해임을 건의하다"
 tfrkphn.295.d:0 "야당이 [TFRKPHN_dept_who] 해임 건의안을 냈습니다. 부처가 제 일을 못 한다는 이유입니다.\n\n헌법은 국회가 장관의 해임을 대통령에게 건의할 수 있다고 적고 있습니다. 대통령이 반드시 따라야 하는 것은 아닙니다."
 tfrkphn.295.a:0 "건의를 물리친다"
 tfrkphn.295.b:0 "장관이 국회에 나가 사과한다"
 tfrkphn.295.tt:0 "그 부처의 신임이 §Y35§!로 돌아옵니다."
 tfrkphn.296.t:0 "국무회의에서 고성이 오갔다"
 tfrkphn.296.d:0 "국무회의가 한 시간 만에 멈췄습니다.\n\n두 장관이 서로 상대 부처 탓을 했습니다. 회의록이 그날 저녁 언론에 흘러나갔습니다."
 tfrkphn.296.a:0 "두 장관을 따로 부른다"
 tfrkphn.296.b:0 "그냥 둔다"
 tfrkphn.296.a_tt:0 "신임이 30 이하인 부처마다 신임 §G+10§!"
 TFRKPHN_dept_who_pm:0 "정진석 국무총리"
 TFRKPHN_dept_who_fm:0 "조현동 외교부 장관"
 TFRKPHN_dept_who_em:0 "방기선 장관"
 TFRKPHN_dept_who_im:0 "이명수 행정안전부 장관"
 TFRKPHN_dept_who_dm:0 "신범철 국방부 장관"
