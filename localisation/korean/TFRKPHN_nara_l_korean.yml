l_korean:
 TFRKPHN_nr_category:0 "나라 바로세우기"
 TFRKPHN_nr_category_desc:0 "홍준표 정부가 남긴 세 가지 숙제를 줄다리기로 당겨 옵니다. 세 줄을 모두 오른쪽 금색 눈금(25) 너머로 당기면 나라가 바로 섭니다. 비밀 지원을 밝힐수록 중국 줄은 조금 밀립니다."
 TFRKPHN_nr_head:0 "나라 바로세우기"
 TFRKPHN_nr_sub:0 "줄을 우리 쪽으로 당겨 오십시오"
 TFRKPHN_nr_n1:0 "정쟁"
 TFRKPHN_nr_n2:0 "비밀 지원"
 TFRKPHN_nr_n3:0 "중국"
 TFRKPHN_nr_v1:0 "[GetTFRKPHNNr1]"
 TFRKPHN_nr_v2:0 "[GetTFRKPHNNr2]"
 TFRKPHN_nr_v3:0 "[GetTFRKPHNNr3]"
 TFRKPHN_nr1_left:0 "§R대립 쪽 [?TFRKPHN_nr_a1|0]§!"
 TFRKPHN_nr1_right:0 "§G협치 쪽 [?TFRKPHN_nr_a1|0]§!"
 TFRKPHN_nr2_left:0 "§R은폐 쪽 [?TFRKPHN_nr_a2|0]§!"
 TFRKPHN_nr2_right:0 "§G공개 쪽 [?TFRKPHN_nr_a2|0]§!"
 TFRKPHN_nr3_left:0 "§R압박 쪽 [?TFRKPHN_nr_a3|0]§!"
 TFRKPHN_nr3_right:0 "§G버팀 쪽 [?TFRKPHN_nr_a3|0]§!"
 TFRKPHN_nr_mid:0 "§Y가운데§!"
 TFRKPHN_nr_d1:0 "§g여야 협치 테이블, 기자회견 정례화로 당긴다§!"
 TFRKPHN_nr_d2:0 "§g명단을 밝힐수록 당겨지지만, 중국 줄은 밀린다§!"
 TFRKPHN_nr_d3:0 "§g특사 파견, 공급망 다변화로 당긴다§!"
 TFRKPHN_nr_goal:0 "§Y세 줄을 모두 오른쪽 25 너머로 당기면 나라가 바로 섭니다§!"
 TFRKPHN_nr_table:0 "여야 협치 테이블"
 TFRKPHN_nr_table_desc:0 "야당 대표와 상설 협의 자리를 만듭니다. 중점 §Y야당과 마주 앉는다§!가 있어야 합니다."
 TFRKPHN_nr_table_tt:0 "정쟁 줄 §G협치 쪽으로 15§!"
 TFRKPHN_nr_press:0 "대통령실 기자회견 정례화"
 TFRKPHN_nr_press_desc:0 "달마다 대통령이 직접 기자들의 질문을 받습니다. 60일마다 다시 할 수 있습니다."
 TFRKPHN_nr_press_tt:0 "정쟁 줄 §G협치 쪽으로 5§!"
 TFRKPHN_nr_brief:0 "국회 비공개 보고"
 TFRKPHN_nr_brief_desc:0 "국방위원회에 비밀 지원의 전모를 비공개로 보고합니다."
 TFRKPHN_nr_brief_tt:0 "비밀 지원 줄 §G공개 쪽으로 20§!, 중국 줄 §R압박 쪽으로 5§!"
 TFRKPHN_nr_names:0 "희생자 명단 공개"
 TFRKPHN_nr_names_desc:0 "비밀 지원 중에 숨진 사람들의 이름을 공개합니다. 중점 §Y돌아오지 못한 이들의 이름§!이 있어야 합니다."
 TFRKPHN_nr_names_tt:0 "비밀 지원 줄 §G공개 쪽으로 30§!, 중국 줄 §R압박 쪽으로 10§!"
 TFRKPHN_nr_envoy:0 "대중 특사 파견"
 TFRKPHN_nr_envoy_desc:0 "베이징에 특사를 보내 통관 지연을 풀어 달라고 요구합니다. 120일마다 다시 할 수 있습니다."
 TFRKPHN_nr_envoy_tt:0 "중국 줄 §G버팀 쪽으로 15§!"
 TFRKPHN_nr_supply:0 "공급망 다변화"
 TFRKPHN_nr_supply_desc:0 "중국에 기대던 소재와 부품을 다른 나라에서 들여옵니다. 90일 동안 §Y민수공장 1개§!가 묶입니다. §YK-방산§!의 방산 수출 특별법이 있으면 더 당겨집니다."
 TFRKPHN_nr_supply_tt:0 "90일 뒤 중국 줄 §G버팀 쪽으로 10§! (방산 수출 특별법이 있으면 §G15§!)"
 TFRKPHN_nr_amend:0 "이중배상 금지 폐지 개헌"
 TFRKPHN_nr_amend_desc:0 "홍준표 정부가 개헌안에 넣기로 한 이중배상 금지 폐지를 마무리합니다."
 TFRKPHN_nr_amend_tt:0 "비밀 지원 줄 §G공개 쪽으로 10§!, 정쟁 줄 §G협치 쪽으로 10§!"
 TFRKPHN_nr_comp:0 "유족 보상 이행"
 TFRKPHN_nr_comp_desc:0 "홍준표 정부가 특별법으로 약속한 보상을 끝까지 지급합니다."
 TFRKPHN_nr_comp_tt:0 "비밀 지원 줄 §G공개 쪽으로 10§!"
 TFRKPHN_nr_again:0 "유족과 다시 마주 앉기"
 TFRKPHN_nr_again_desc:0 "홍준표 정부가 헌법은 그대로 두겠다고 한 뒤 유족들이 다시 문제를 꺼냈습니다. 대통령이 직접 유족을 만납니다."
 TFRKPHN_nr_again_tt:0 "비밀 지원 줄 §G공개 쪽으로 15§!, 정쟁 줄 §G협치 쪽으로 5§!"
 tfrkphn.6972.t:0 "나라가 바로 섰다"
 tfrkphn.6972.d:0 "정쟁의 줄과 비밀 지원의 줄, 중국의 줄이 모두 우리 쪽으로 넘어왔다. 오세훈 대통령은 국무회의를 마치고 안건 목록의 맨 위 세 줄에 차례로 줄을 그었다. 취임 뒤 처음 연 국무회의에서 올렸던 그 세 가지였다.\n\n대만지원법을 두고 다섯 해 동안 서로 눈도 마주치지 않던 여야 의원들은 이제 같은 위원회에서 예산을 깎고 붙인다. 비밀 지원의 진상은 국회와 국민 앞에 공개됐고, 사고로 숨졌다던 장병들의 이름은 제자리를 찾았다. 유족들은 여전히 다 용서하지는 않았지만, 더는 국방부 앞에서 팻말을 들지 않는다."
 tfrkphn.6973.d:0 "베이징은 한동안 통관 심사를 늦추며 버텼지만, 우리가 공급망을 넓히고 특사를 보내자 결국 심사 속도를 되돌렸다. 숨긴 것을 다 밝히고도 나라가 흔들리지 않았다는 것을 보여 주었다.\n\n그해 현충일, 국립묘지 한쪽에 새 묘역이 문을 열었다. 비석에는 비로소 진짜 숨진 곳이 새겨졌다. 대만해협이라는 네 글자를 처음 본 어머니들 가운데 몇은 비석을 오래 쓰다듬었고, 그 옆에는 여야 대표가 나란히 서서 고개를 숙였다.\n\n대통령은 기자회견에서 서류 위의 중립과 실제로 한 일 사이의 틈을 메우는 데 한 해가 넘게 걸렸다고 말했다. 다음 질문은 집값이었고, 그는 그 질문에 더 길게 답했다."
 tfrkphn.6972.next:0 "이어서 본다"
 tfrkphn.6972.a:0 "다음 숙제로 넘어간다."
 TFRKPHN_oh_a1_nr_tt:0 "결정 탭 §Y나라 바로세우기§!가 열립니다."
