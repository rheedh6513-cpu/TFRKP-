l_korean:
 TFRKPHN_ohend_unify_tt:0 "§Y이북자치정부§!를 정리하고 북쪽 땅이 모두 §Y우리 핵심 영토§!가 된다."
 tfrkphn.6787.t:0 "전쟁 뒤의 동행"
 tfrkphn.6787.a:0 "시간을 들여 하나가 된다."
 tfrkphn.6787.d:0 "대아대전이 태평양방위조약기구의 승리로 끝났다. 평양 외곽의 마지막 저항이 멎었다는 보고가 들어온 것은 새벽이었고, 오세훈 대통령은 아침 일찍 국무회의를 열었다. 장관들이 승전 기념식 일정부터 꺼내자 그는 그 이야기를 뒤로 미뤘다.\n\n그가 먼저 꺼낸 것은 북쪽 동포를 이긴 쪽의 눈으로 대하지 말라는 지시였다. 군정 기간은 짧게 끝내고, 북쪽 주민의 집과 재산에는 함부로 손대지 않으며, 굶는 사람이 없도록 쌀과 의약품부터 보내라는 내용이 뒤따랐다. 회의실 벽의 지도에는 아직 옛 휴전선이 붉은 줄로 남아 있었다."
 tfrkphn.6887.d:0 "그는 서울시장 시절부터 약자와의 동행을 시정의 첫머리에 두었다. 2022년 7월 1일 취임사에서는 그 일을 '제가 서울시장으로서 존재하는 이유이자, 제 평생의 과업'이라고 했고, 안심소득과 서울런이 그 말에서 나왔다. 전쟁이 끝난 지금 이 나라에서 가장 약한 사람들은 옛 휴전선 너머에 있다.\n\n여당 안에서는 북쪽을 곧바로 흡수해 남쪽 법을 그대로 적용하자는 목소리도 컸다. 통일 비용을 걱정하는 사람들은 하루라도 빨리 정리해야 돈이 덜 든다고 했다. 대통령은 그 말을 끝까지 들은 뒤, 서두르다 넘어지는 사람은 북쪽에서 먼저 나온다며 시간을 들여 하나가 되는 길을 고르겠다고 말했다.\n\n그날 오후 대통령은 국방부에 들러 전사자 명단을 받아 보았다. 명단에는 우리 장병과 함께 싸운 동맹군의 이름도 있었다. 그는 마지막 장까지 넘긴 뒤, 북쪽에서 죽은 사람들의 이름도 같은 방식으로 정리해 두라고 지시했다."
 tfrkphn.6787.next:0 "이어서 본다"
 tfrkphn.6783.t:0 "대동강의 크레인"
 tfrkphn.6783.a:0 "평양에도 크레인이 선다."
 tfrkphn.6783.d:0 "평양의 하늘에 타워크레인이 스무 대 넘게 섰다. 대동강을 끼고 평양과 남포를 하나로 묶는 북쪽의 첫 메가시티 공사다. 남쪽 다섯 권역에서 쓰던 방식을 그대로 가져와 철도와 항만, 공단을 한 계획 안에 묶었다.\n\n남포항에는 큰 배가 댈 수 있는 새 부두가 들어서고, 평양과 남포 사이 들판에는 공단과 아파트 단지가 함께 올라간다. 공단에는 남쪽 기업들이 먼저 들어왔고, 그 공장에서 일할 사람들의 집이 바로 옆에 지어졌다. 남쪽 건설사들이 지은 첫 아파트에는 북쪽 노동자 가족들이 먼저 입주했다."
 tfrkphn.6883.d:0 "현장의 모습은 남쪽과 조금 달랐다. 공사장마다 남쪽 기술자 한 명에 북쪽 일꾼 열 명이 붙어 일을 배웠고, 그렇게 기술을 익힌 사람들이 다음 현장의 반장이 되었다. 점심시간이면 남쪽 말과 북쪽 말이 섞인 농담이 오갔고, 같은 공구를 서로 다른 이름으로 부르다 웃음이 터지는 일도 잦았다.\n\n평양 시내의 오래된 아파트들은 하나씩 안전 점검을 받기 시작했다. 무너질 위험이 큰 건물에 사는 사람들은 새 단지로 먼저 옮겨 갔다. 서울에서 재개발 반발을 겪어 본 정부는 이번에는 옮겨 갈 집을 먼저 지은 다음에 헌 집을 헐었다.\n\n첫 겨울이 오자 정부는 공사장 옆에 임시 학교와 진료소를 세웠다. 북쪽 일꾼들의 아이들은 낮에는 그 학교에서 남쪽 교과서로 공부했고, 저녁이면 아버지를 기다리며 크레인에 켜지는 불빛을 세었다."
 tfrkphn.6783.next:0 "이어서 본다"
 tfrkphn.6782.t:0 "이북자치정부 출범"
 tfrkphn.6782.a:0 "북쪽에 시간을 준다."
 tfrkphn.6782.d:0 "평양에 이북자치정부가 문을 열었다. 옛 인민위원회 건물에 간판을 새로 달았고, 북쪽 출신 관료와 남쪽에서 파견된 공무원이 한 사무실에 책상을 나란히 놓았다. 북쪽의 행정은 몇 해 동안 자치정부가 맡고, 남쪽은 돈과 사람을 보낸다.\n\n정부가 이 길을 고른 데에는 까닭이 있었다. 일흔 해 넘게 다른 체제에서 산 사람들에게 남쪽의 법과 시장을 한꺼번에 들이밀면 버티지 못하는 사람이 먼저 쓰러진다는 판단이었다. 1990년 통일한 독일에서 동쪽의 공장들이 문을 닫고 실업자가 쏟아졌던 일도 회의 때마다 거론되었다."
 tfrkphn.6882.d:0 "오세훈 대통령은 출범식에서 서울시장 시절 내건 약자와의 동행을 북쪽에서 먼저 하겠다고 말했다. 소득이 적은 집에 모자란 만큼을 채워 주는 안심소득 시범 사업이 평양과 함흥에서 먼저 시작되고, 서울 학생들이 듣던 서울런 강의도 북쪽 학교에 열린다.\n\n모두가 반긴 것은 아니다. 남쪽에서는 북쪽에 돈을 너무 많이 쓴다는 불만이 나왔고, 북쪽에서는 남쪽 공무원들이 윗사람 행세를 한다는 말이 돌았다. 자치정부는 매달 첫째 주에 남북 공무원이 함께 주민 앞에서 업무를 설명하는 자리를 열었다.\n\n자치정부 청사 앞에는 아침마다 줄이 길게 늘어섰다. 배급표 대신 주민등록증을 받으려는 사람들이었다. 증을 받아 든 한 노인은 사진 속 자기 얼굴을 한참 들여다보다가, 이제 어디든 가도 되느냐고 창구 직원에게 물었다."
 tfrkphn.6782.next:0 "이어서 본다"
 tfrkphn.6788.t:0 "서울발 신의주행"
 tfrkphn.6788.a:0 "선로가 끝까지 닿았다."
 tfrkphn.6788.d:0 "서울역 전광판에 신의주라는 행선지가 처음 떴다. 아침 일곱 시 열차의 표는 예매를 연 지 몇 분 만에 다 팔렸고, 대합실에는 첫 열차를 보려는 사람들이 새벽부터 모여들었다.\n\n1906년에 용산과 신의주를 이었던 경의선은 1950년에 끊긴 뒤 일흔 해 넘게 한 줄로 이어지지 못했다. 2007년에 시험 열차가 군사분계선을 넘은 적이 있지만 정기 열차로 이어지지는 않았다. 평양에서 신의주까지 옛 평의선 구간에도 새 선로가 놓이면서, 서울에서 압록강까지 한 번에 가는 길이 열렸다."
 tfrkphn.6888.d:0 "첫 열차는 개성과 사리원, 평양을 지나 압록강 앞에서 멈췄다. 객실에는 고향을 찾아가는 실향민 가족과 북쪽 공사 현장으로 가는 기술자들이 함께 탔다. 창밖으로 사리원역 간판이 지나가자 한 실향민 할머니가 그 자리에서 울음을 터뜨렸고, 옆자리의 젊은 기술자가 말없이 손수건을 건넸다.\n\n신의주역 광장에는 남쪽에서 온 승객과 마중 나온 북쪽 사람들이 뒤섞였다. 역 앞 노점에서는 남쪽 돈과 북쪽 돈을 함께 받았고, 해가 지자 압록강 건너편 단둥의 불빛이 강물에 비쳤다.\n\n돌아오는 열차에는 북쪽 학생들이 많이 탔다. 서울의 대학에 붙은 신입생들과, 수학여행으로 처음 서울을 보러 가는 중학생들이었다. 서울역에 내린 아이들은 광장의 높은 건물들을 올려다보며 한참 동안 걸음을 떼지 못했다."
 tfrkphn.6788.next:0 "이어서 본다"
 tfrkphn.6784.t:0 "완전한 통일 선언"
 tfrkphn.6784.a:0 "하나의 나라다."
 tfrkphn.6784.d:0 "이북자치정부 의회가 마지막 회의에서 대한민국과 하나가 되는 안을 통과시켰다. 표결이 끝나자 의원들은 자리에서 일어나 한참 동안 박수를 쳤다. 며칠 뒤 국회도 같은 안을 가결했다.\n\n자치정부가 문을 연 지 몇 해 만이었다. 그동안 북쪽의 법은 하나씩 남쪽의 법으로 바뀌었고, 북쪽 주민들의 주민등록번호도 남쪽과 같은 체계로 옮겨졌다. 마지막까지 남은 문제는 땅이었다. 옛 국유지를 누구에게 돌려줄지를 두고 긴 다툼이 있었고, 정부는 지금 그 땅에 살고 있는 사람의 권리를 먼저 지키기로 했다."
 tfrkphn.6884.d:0 "선언은 광화문에서 했다. 오세훈 대통령은 광장을 가득 메운 사람들 앞에서 완전한 통일을 선언했고, 같은 시각 평양의 광장에서도 큰 화면으로 그 장면이 중계되었다. 연설은 짧았다. 그는 오늘부터 이 나라에 남쪽과 북쪽은 없고 동네와 동네만 있다고 말하고 단상을 내려왔다.\n\n자치정부 청사의 간판은 내려지고 평양에는 특별시청이 들어선다. 광화문에 모인 사람들 가운데에는 이산가족 명단을 손에 든 노인들이 많았다. 그들 가운데 몇은 끝내 이름을 찾지 못한 채 명단을 접어 주머니에 넣었다.\n\n그날 밤 대통령은 늦게까지 집무실에 남았다. 책상에는 자치정부 출범식 때 받은 첫 주민등록증 견본이 놓여 있었다. 그는 그것을 서랍에 넣고 다음 날 국무회의 안건을 다시 읽었는데, 맨 위에는 북쪽 공공 병원을 늘리는 예산이 올라 있었다."
 tfrkphn.6784.next:0 "이어서 본다"
 tfrkphn.6785.t:0 "다섯 해의 성적표"
 tfrkphn.6785.a:0 "지킨 것과 지키지 못한 것을 함께 받아 든다."
 tfrkphn.6785.d:0 "임기를 마치는 대통령을 두고 언론이 성적표를 냈다. 신문마다 기준은 달랐지만 맨 위 칸은 모두 같았다. 통일은 누구도 깎아내리지 못한 성과로 첫 줄에 올랐다.\n\n그 아래 칸부터는 평가가 갈렸다. 개발만이 살 길이라며 시작한 다섯 해였고, 신문들은 그 말이 얼마나 지켜졌는지를 분야마다 하나씩 따졌다."
 tfrkphn.6885.d:0 "[GetTFRKPHNRcHouse] [GetTFRKPHNRcMega]\n\n[GetTFRKPHNRcGe] [GetTFRKPHNRcLe]\n\n성적표를 두고 여당 안에서는 다음 대선을 걱정하는 소리가 나왔고, 야당은 개발의 그늘을 따지는 토론회를 열었다. 평양의 신문들도 처음으로 서울의 신문들과 같은 날 같은 성적표를 실었다.\n\n성적표를 받아 본 대통령은 신문을 그대로 대통령실 게시판에 붙이라고 했다. 지킨 것과 지키지 못한 것을 같은 크기의 글씨로 적겠다던 약속을 그는 마지막 날까지 지켰다."
 tfrkphn.6785.next:0 "이어서 본다"
 tfrkphn.6786.t:0 "끝까지"
 tfrkphn.6786.a:0 "다음 사람에게 넘긴다."
 tfrkphn.6786.d:0 "임기 마지막 날 저녁, 오세훈 전 대통령은 경호차를 돌려보내고 광화문역에서 지하철을 탔다. 퇴근길 객차는 붐볐다. 그를 알아본 승객 몇이 고개를 숙였고, 끝내 알아보지 못한 대학생은 휴대폰으로 평양 메가시티 준공 뉴스를 보고 있었다.\n\n객차 안 광고판에는 신의주행 열차 시간표와 평양 새 아파트 분양 광고가 나란히 붙어 있었다. 그는 손잡이를 잡은 채 그 광고를 오래 보았다. 다섯 해 전 첫 경제 장관 회의에서 개발만이 살 길이라고 말한 사람이 그였다.\n\n그는 여의나루역에서 내려 한강으로 걸어 나갔다. 2007년 7월 3일, 서울시장이던 그는 이 강을 시민에게 돌려주겠다며 한강 르네상스 계획을 내놓았다. 강변의 공원과 자전거 길, 밤마다 켜지는 다리 조명을 지나며 그는 걸음을 늦췄다."
 tfrkphn.6886.d:0 "그 강변에서 홍준표 전 대통령이 기다리고 있었다. 서울시장 자리를 두 번 내려놓은 사람이 이번에는 끝까지 왔다고 홍준표가 말했고, 오세훈은 웃기만 했다. 두 사람은 수행원을 멀찍이 물리고 한동안 말없이 강을 따라 걸었다.\n\n강 건너 철교 위로 신의주행 막차가 지나갔다. 서울에서 떠난 열차는 이제 평양을 지나 압록강까지 닿고, 대동강에도 밤마다 크레인 불빛이 켜진다.\n\n플레이어여, 당신은 서울시장 자리를 내려놓고 대선에 나섰던 사람과 함께 이 길을 걸었다. 개발과 동행 사이에서 고르고, 전쟁을 이기고, 둘이던 나라를 하나로 묶었다. 수고하셨다. 당신이 맡은 길은 여기까지다."
 tfrkphn.6886.d2:0 "강변은 조용했다. 신문들의 성적표는 박했고, 퇴임 인사를 하러 온 여당 의원도 많지 않았다. 그는 혼자서 한동안 강을 따라 걸었다. 2011년에는 임기를 채우지 못하고 떠났지만, 이번에는 마지막 날까지 자리를 지켰다.\n\n강 건너 철교 위로 신의주행 막차가 지나갔다. 서울에서 떠난 열차는 이제 평양을 지나 압록강까지 닿고, 대동강에도 밤마다 크레인 불빛이 켜진다.\n\n플레이어여, 당신은 서울시장 자리를 내려놓고 대선에 나섰던 사람과 함께 이 길을 걸었다. 성적표에는 아쉬운 칸이 많이 남았지만, 둘이던 나라는 하나가 되었다. 수고하셨다. 당신이 맡은 길은 여기까지다."
 tfrkphn.6786.next:0 "이어서 본다"
 TFRKPHN_rc_house_g:0 "주택 공급은 약속만큼 속도를 냈고, 재개발 반발도 큰 탈 없이 넘겼다는 평가를 받았다."
 TFRKPHN_rc_house_b:0 "주택 착공은 크게 늘었지만, 밀려난 세입자와 오른 집값이 끝까지 정부의 발목을 잡았다는 평가가 따라붙었다."
 TFRKPHN_rc_mega_g:0 "메가시티는 다섯 권역이 모두 제 모양을 갖추었다."
 TFRKPHN_rc_mega_m:0 "메가시티는 몇 권역만 제 모양을 갖추고 나머지는 다음 정부로 넘어갔다."
 TFRKPHN_rc_mega_b:0 "메가시티는 첫 삽을 뜬 곳이 많지 않아 공약만 남았다는 말을 들었다."
 TFRKPHN_rc_ge_g:0 "2028년 총선에서 여당이 과반을 얻으면서 임기 후반의 법안들이 국회를 넘었다."
 TFRKPHN_rc_ge_b:0 "2028년 총선에서 과반을 잃은 뒤로는 법안 하나 넘기는 데에도 야당과 긴 협상을 해야 했다."
 TFRKPHN_rc_le_g:0 "2030년 지방선거에서도 여당이 이겨 중앙과 지방이 끝까지 손발을 맞췄다."
 TFRKPHN_rc_le_m:0 "2030년 지방선거는 여야가 지도를 나눠 칠하는 데 그쳤다."
 TFRKPHN_rc_le_b:0 "2030년 지방선거에서 진 뒤로는 지방정부와 부딪히는 일이 잦았다."
 TFRKPHN_oh_se_hoon_w1:0 "전쟁 뒤의 동행"
 TFRKPHN_oh_se_hoon_w1_desc:0 "대아대전은 끝났고 북쪽의 총소리도 멎었다. 북쪽 동포와 함께 걷는 길을 정부의 첫 일로 삼는다."
 TFRKPHN_oh_se_hoon_w2a:0 "대동강의 크레인"
 TFRKPHN_oh_se_hoon_w2a_desc:0 "평양과 남포를 묶어 북쪽의 첫 메가시티를 세운다."
 TFRKPHN_oh_se_hoon_w2b:0 "이북자치정부"
 TFRKPHN_oh_se_hoon_w2b_desc:0 "북쪽의 행정을 몇 해 동안 자치정부에 맡긴다. 약자와의 동행은 북쪽에서 먼저 한다."
 TFRKPHN_oh_se_hoon_w2c:0 "서울발 신의주행"
 TFRKPHN_oh_se_hoon_w2c_desc:0 "서울역에서 신의주까지 한 줄로 달리는 열차를 띄운다."
 TFRKPHN_oh_se_hoon_w3a:0 "하나의 나라"
 TFRKPHN_oh_se_hoon_w3a_desc:0 "자치정부를 정리하고 완전한 통일을 선언한다."
 TFRKPHN_oh_se_hoon_w3b:0 "약속과 결과"
 TFRKPHN_oh_se_hoon_w3b_desc:0 "임기 끝에 약속과 결과를 나란히 놓고 성적표를 받는다."
 TFRKPHN_oh_se_hoon_w4:0 "끝까지"
 TFRKPHN_oh_se_hoon_w4_desc:0 "2011년에는 임기를 채우지 못하고 떠났다. 이번에는 끝까지 일하고 다음 사람에게 넘긴다."
