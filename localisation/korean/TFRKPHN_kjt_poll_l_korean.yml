l_korean:
 # [안내] 김진태 정부 결정 탭 지지율. cho_build.py(kjt_poll_part.py)가 만든다.
 TFRKPHN_kp_category:0 "지지율"
 TFRKPHN_kp_category_desc:0 "청와대 본관 벽에 숫자판이 걸려 있습니다. 월요일 아침마다 새 숫자가 올라갑니다. 아래 그림을 누르면 숫자가 오르고, 숫자가 높을수록 안정도와 정치력이 따라옵니다.\n숫자판이 보여 주지 않는 숫자가 하나 더 있습니다. 두 숫자가 멀어질수록 나라는 소리 없이 흔들립니다."
 TFRKPHN_kp_board_tt:0 "발표 지지율 §Y[?TFRKPHN_kp_show|0]§!퍼센트\n숫자가 50을 넘는 만큼 안정도와 정치력 획득이 오르고, 밑돌면 내려갑니다.\n숫자판은 §Y140§!까지 올라갑니다."
 TFRKPHN_kp_modifier:0 "발표 지지율"
 TFRKPHN_kp_peek_open:0 "봉투 안의 숫자는 §Y[?TFRKPHN_kp_real|0]§!퍼센트입니다. 한 달 뒤 봉투는 다시 봉해집니다."
 TFRKPHN_kp_peek_shut:0 "봉투는 닫혀 있습니다."
 TFRKPHN_kp_b1_tt:0 "§Y표본을 고른다§!\n조사원이 전화를 거는 번호부를 대통령실이 골라 줍니다.\n\n정치력 §R-15§!  발표 지지율 §G+4§!\n§R실제 민심은 숫자판과 반대로 움직입니다.§!\n다시 누르려면 §Y45일§!을 기다려야 합니다."
 TFRKPHN_kp_b2_tt:0 "§Y질문을 바꾼다§!\n지지하느냐고 묻는 대신 나라가 안정되기를 바라느냐고 묻습니다.\n\n정치력 §R-20§!  발표 지지율 §G+6§!\n§R실제 민심은 숫자판과 반대로 움직입니다.§!\n다시 누르려면 §Y60일§!을 기다려야 합니다."
 TFRKPHN_kp_b3_tt:0 "§Y기관을 조사한다§!\n다른 숫자를 낸 조사 기관에 세무 조사가 나갑니다.\n\n정치력 §R-30§!  발표 지지율 §G+9§!  안정도 §R-1%§!\n§R실제 민심은 숫자판과 반대로 움직입니다.§!\n다시 누르려면 §Y90일§!을 기다려야 합니다."
 TFRKPHN_kp_b4_tt:0 "§Y응답을 더한다§!\n지역별 숫자를 한 번 더 더합니다. 숫자는 백을 넘어갈 수 있습니다.\n\n정치력 §R-25§!  발표 지지율 §G+12§!\n§R실제 민심은 숫자판과 반대로 움직입니다.§!\n발표 지지율이 §Y88§! 이상일 때 누를 수 있습니다.\n다시 누르려면 §Y60일§!을 기다려야 합니다."
 TFRKPHN_kp_b5_tt:0 "§Y전기 요금 동결§!\n겨울 전기 요금을 올리지 않습니다. 숫자판은 거의 움직이지 않습니다.\n\n정치력 §R-10§!  발표 지지율 §G+2§!  유동성 §R-30§!\n§G실제 민심이 오릅니다.§!\n다시 누르려면 §Y90일§!을 기다려야 합니다."
 TFRKPHN_kp_b6_tt:0 "§Y밀봉된 봉투§!\n대통령만 보는 조사 결과가 봉투에 들어 있습니다.\n[Root.TFRKPHN_kp_peek_loc]\n\n누르면 봉투를 엽니다.\n정치력 §R-10§!\n봉투 안의 숫자는 숫자판에 올라가지 않습니다."
