l_korean:
 # 홍준표 트리 이벤트의 Korea Plus 말투 글. hongkp_build.py가 만든다. 원래 글(낙화 파일 등)은 그대로 있다.
 tfrkphn.20.kp:0 "2022년 5월 10일, 국회의사당 앞마당입니다. 봄바람에 태극기가 펄럭였지만 취임식장을 메운 사람들의 얼굴이 마냥 밝지는 않았습니다.\n\n얼마 전까지 세계의 경찰을 자처하던 미국은 내전의 수렁에 빠져 산산조각이 났습니다. 그 여파로 세계 경제는 바닥을 알 수 없는 곳으로 떨어지고 있고, 수출로 먹고사는 우리에게 그것은 목이 조여 오는 일과 다르지 않습니다. 코로나의 폭풍도 아직 다 지나가지 않았습니다. 텅 빈 상가와 셔터를 내린 식당, 지칠 대로 지친 사람들이 우리가 물려받은 나라의 모습입니다."
 tfrkphn.20.kp2:0 "단상에 오른 홍준표 대통령은 잠시 객석을 내려다보았습니다. 수십 년을 정치판에서 굴러 온 사람이지만 이번만큼은 어깨를 누르는 무게가 달랐을 것입니다.\n\n취임 선서가 끝나기가 무섭게 대통령은 새 내각의 명단을 발표했고, 맨 윗줄에 적힌 이름은 국무총리 이인제였습니다. 2017년 경선에서 대통령과 맞붙었던 사람이고, 노동부 장관과 경기도지사를 거쳐 국회의원을 여섯 번 지냈습니다. 일흔셋의 총리를 두고 여의도가 수군거렸지만 대통령은 따로 설명하지 않았습니다. 기다려 줄 시간이 없다는 말만 했습니다.\n\n이제 기댈 곳은 없습니다. 우리는 우리 힘으로 이 폭풍을 지나가야 합니다."
 tfrkphn.720.next:0 "이어서 본다"
 tfrkphn.78.kp:0 "2017년에 마지막 사법시험이 치러졌습니다. 그 뒤로 법조인이 되는 길은 로스쿨 하나만 남았고, 관악구 신림동 고시원 골목에서는 간판이 하나둘 내려갔습니다.\n\n대통령은 후보 시절부터 이 제도를 고치겠다고 말해 왔습니다. 2021년 여름에는 로스쿨과 의학전문대학원, 국립외교원을 음서제도라 부르면서 사법시험과 행정고시, 외무고시를 되살려 개천에서도 용이 나는 사회를 만들겠다고 적었습니다. 그보다 앞선 2017년에는 그가 대표로 있던 당의 혁신위원회가 사법시험 부활을 계층 이동의 사다리라는 이름으로 내놓은 적도 있습니다."
 tfrkphn.78.kp2:0 "우리가 내놓은 안은 그 말보다 한 걸음 물러서 있고, 로스쿨은 그대로 두고 사법시험을 함께 치릅니다. 법학을 전공하지 않은 수험생과 형편이 넉넉하지 못한 수험생에게도 길을 열어 주자는 취지인데, 이미 로스쿨에 들어간 학생들을 하루아침에 내칠 수는 없다는 계산도 들어 있습니다.\n\n발표가 난 날 저녁, 신림동의 한 편의점 테이블에 두 청년이 마주 앉았다고 합니다.\n\n\"드디어 돌아오는 건가... 몇 년만 더 일찍 나왔어도.\"\n\"저는 로스쿨 2학년인데요. 등록금이랑 생활비로 빚이 1억 가까이 되는데, 이제 와서 사시가 부활하면 우리는 뭐가 돼요?\"\n\n두 사람은 한동안 서로의 컵라면만 바라보았습니다. 같은 길 위에서 서로 다른 시간을 살아온 사람들입니다.\n\n우리는 둘 가운데 누구에게서도 이 제도가 불공정하다는 말을 듣고 싶지 않습니다. 그 숙제는 이제 법무부와 교육부의 책상으로 넘어갔습니다."
 tfrkphn.778.next:0 "이어서 본다"
 tfrkphn.82.kp:0 "대통령은 2021년 9월 경선 공약 발표회에서 대통령긴급명령권을 발동해서라도 강성귀족노조의 패악을 막아 노동 유연성을 높이겠다고 말했습니다. 그 말이 오늘 정부안이 되어 나왔습니다.\n\n미국 시장이 사라진 뒤로 수출 공장의 주문은 들쭉날쭉합니다. 일감이 몰릴 때 사람을 쓰고 빠질 때 줄일 수 없으면 공장이 통째로 문을 닫는다는 것이 경영계의 오랜 하소연이었습니다.\n\n정부안의 뼈대는 세 가지입니다. 정리해고 요건을 완화하고, 근로시간을 고를 수 있는 폭을 넓히고, 그 대신 실업급여와 재교육 지원을 늘립니다. 일자리를 쉽게 줄이려는 뜻은 없으며 쉽게 옮길 수 있게 하려는 것이라고 우리는 설명했습니다. 긴급명령은 꺼내지 않았습니다. 국회를 거치는 길로 가자고 한 사람은 노동부 장관을 지낸 이인제 총리였다고 합니다."
 tfrkphn.82.kp2:0 "발표가 나던 날 점심시간, 울산의 한 자동차 부품 공장 휴게실에서는 작업복 차림의 사람들이 텔레비전 앞에 둘러서 있었습니다.\n\n\"일하는 시간을 내가 정할 수 있으면 좋긴 하지.\"\n\"그게 되겠어? 결국 사장이 정하는 거지. 쉬운 해고가 쉬운 취업이 되는 걸 본 적 있어?\"\n\n한쪽 구석에서 납품 단가를 걱정하던 하청업체 사장은 조용히 커피를 내렸고, 노조 조끼를 입은 청년은 아무 말 없이 화면에서 눈을 떼지 않았습니다.\n\n그날 오후에도 라인은 평소처럼 돌아갔고, 휴게실의 공기가 평소와 달랐다는 보고만 우리에게 올라왔습니다."
 tfrkphn.782.next:0 "이어서 본다"
 tfrkphn.80.kp:0 "대통령은 2017년 대선 때부터 모병제를 말해 왔습니다. 2021년 9월에도 모병제 도입은 다섯 해 전 대선 공약이었고 지금도 변함이 없다고 했습니다.\n\n병무청 회의실 벽에는 연도별 입영 대상자 그래프가 떠 있고, 줄어드는 병역 자원의 곡선은 어느 해를 기점으로 가파르게 꺾입니다. 스무 살 남자의 수가 줄어드는 만큼 징병으로 채울 수 있는 자리도 줄어듭니다.\n\n우리는 징병제를 곧바로 없애지 않기로 했습니다. 직업군인의 처우를 먼저 높이고, 복무 기간과 인원은 몇 해에 걸쳐 조정하면서 단계적으로 모병제로 옮겨 갑니다. 장비가 복잡해질수록 오래 복무한 숙련병이 필요하다는 것이 군이 든 근거입니다. 북한과 마주한 나라가 병력을 줄여도 되느냐는 반론은 국회 안팎에서 거셉니다."
 tfrkphn.80.kp2:0 "여론도 갈립니다. 병무청 민원실에서 들은 두 사람의 말이 그대로 보고서에 실렸습니다.\n\n\"저는 환영입니다. 아들 군대 보내느라 우리 집 인생 계획이 다 틀어졌었거든요.\"\n\"저는 반댑니다. 결국 가난한 집 아이들만 군대 가는 나라가 되는 거 아닙니까.\"\n\n병무청 복도의 입영 안내 포스터는 아직 바뀌지 않았고, 새 포스터에 무슨 말을 적을지는 국방부가 정해야 합니다."
 tfrkphn.780.next:0 "이어서 본다"
 tfrkphn.79.kp:0 "대통령은 2021년 여름 입학사정관제와 수시를 없애고 정시로만 대학에 가게 하겠다고 적었습니다. 수능을 한 해에 두 번 치르게 하겠다는 말도 그때 했습니다.\n\n오늘 교육부가 발표한 대입제도 개편안은 그 말을 단계로 나눈 것입니다. 정시 모집 비율을 해마다 늘리고, 수능은 한 해에 두 번 응시할 기회를 줍니다. 학생부 중심 전형은 학교와 지역에 따라 기회가 갈린다는 지적을 받아 왔고, 수능은 한 번의 시험으로 인생이 갈린다는 지적을 받아 왔습니다. 우리는 그 사이에서 수능 쪽을 골랐고, 시험 횟수를 늘려 두 번째 지적에 답하려 합니다."
 tfrkphn.79.kp2:0 "그날 저녁 서울 대치동 학원가에는 설명회 문의 전화가 평소의 세 배로 늘었습니다. 지방 소도시의 한 고등학교 교무실에서는 부장 교사가 한숨을 쉬었다고 합니다.\n\n\"서울 애들만 유리해지는 거 아닌가요? 학원 없는 우리 애들은 어떻게 합니까.\"\n\"그래서 EBS랑 방과후 지원을 같이 늘린다고는 하는데...\"\n\n입시 제도가 모두를 만족시킨 적은 없습니다. 이번에도 그럴 것이라는 점을 우리는 알고 시작합니다."
 tfrkphn.779.next:0 "이어서 본다"
 tfrkphn.312.kp:0 "오늘 우리는 경찰 조직 개편안을 발표했습니다. 흩어져 있던 경찰 지휘 체계를 전통경찰국 하나로 묶고, 약해진 공권력과 치안 기능을 다시 세우는 것이 목표입니다.\n\n대통령은 검사 출신입니다. 후보 시절에는 흉악범에 한해 사형을 집행하겠다고 공약했을 만큼 법 집행에 관해서는 물러선 적이 없습니다. 세계 경제가 무너진 뒤로 생계형 범죄와 거리의 집회가 함께 늘어나자, 지휘 계통부터 정리하라는 지시가 내려왔습니다.\n\n야당은 곧바로 반발했습니다. 야당 지도부는 이번 개편안을 \"경찰 독재, 사법 독재의 서막\"이라고 불렀습니다. 공권력의 오판으로 시민이 목숨을 잃은 지난 사건들을 거론하면서, 권한이 한곳에 몰린 경찰은 또 다른 피해자를 만든다고 경고했습니다.\n\n우리가 내놓은 입장은 \"법 앞에 예외는 없다\"는 한 줄입니다. 물러서지 않겠다는 뜻이고, 개편안을 둘러싼 여야의 충돌은 한동안 이어질 것입니다."
 tfrkphn.83.kp:0 "대통령은 2021년 여름 공영방송을 민영화하겠다고 공약했습니다. 오늘 우리는 공영방송 지배구조 개편안과 함께 지분 매각 방침을 발표했습니다.\n\n공영방송은 국민의 수신료와 세금으로 운영됩니다. 그런데도 정권이 바뀔 때마다 사장이 바뀌어 왔고, 그때마다 누구 편이냐는 시비가 따라붙었습니다. 그 고리를 끊으려면 정부가 쥔 지분부터 내려놓아야 한다는 것이 우리의 설명입니다. 매각 대금이 빠듯한 나라 살림에 보탬이 된다는 계산도 숨기지 않았습니다.\n\n반론도 만만치 않습니다. 민영화되면 광고와 시청률에 더 얽매일 것이라는 우려가 나왔고, 정치권이 인사권을 쥐는 지금보다는 낫다는 주장이 거기에 맞섰습니다."
 tfrkphn.83.kp2:0 "발표가 난 날 여의도의 한 방송사 로비에서는 이런 말이 오갔다고 합니다.\n\n\"공영이라는 이름만 붙여 놓고 결국 누구 편이냐는 소리를 오랫동안 듣고 있잖아요.\"\n\"민영이 되면 뉴스가 돈 되는 쪽으로만 흘러갈 텐데, 재난방송 같은 건 누가 합니까.\"\n\n편집회의실 화이트보드에는 그날의 첫 꼭지 대신 '우리는 누구의 방송인가'라는 한 줄이 적혔고, 아무도 그것을 지우지 않았습니다.\n\n우리가 낸 공고문은 한 쪽짜리입니다. 논쟁은 그보다 훨씬 길어질 것 같습니다."
 tfrkphn.783.next:0 "이어서 본다"
 tfrkphn.81.kp:0 "미국이 무너지면서 핵우산도 함께 흔들렸습니다. 북한은 핵을 가졌고 우리는 갖지 못했습니다. 그 간격을 무엇으로 메울지가 이 정부가 받아 든 첫 안보 숙제입니다.\n\n거론되는 길은 둘입니다. 독자 핵무장은 제재와 비확산 체제의 벽 앞에 서 있습니다. 다른 하나는 핵을 가진 우방과 운용을 나누는 길이고, 대통령은 2021년 경선 때부터 나토식 핵공유라는 이름으로 이쪽을 주장해 왔습니다. 우리는 그나마 현실에 가까운 두 번째 길을 초안으로 만들었습니다.\n\n합동참모본부 지하, 보안 점검을 마친 회의실입니다. 탁자 위에는 표지에 아무 제목도 없는 서류철 하나가 놓였고, 그 안에 핵을 가진 우방과의 공동 운용 협의체 구상이 들어 있습니다.\n\n\"이걸 협의하는 것만으로도 중국은 한마디 할 겁니다.\"\n\"그렇다고 안 하면, 우리 손에 아무것도 없다는 걸 인정하는 꼴이 됩니다.\"\n\n참석자들은 휴대전화를 전부 문밖 보관함에 두고 들어왔습니다. 회의록에는 참석자의 이름을 적지 않기로 했습니다.\n\n서류철의 첫 장이 넘어갔습니다."
 tfrkphn.25.kp:0 "청와대 지하 벙커, 국가위기관리센터입니다.\n\n\"대통령님, 비상경제대책회의 준비 끝났습니다.\"\n\n두꺼운 철문이 닫히자 바깥의 소음이 거짓말처럼 사라졌고, 이 방에 비상경제상황실이 다시 차려진 것은 십수 년 만입니다.\n\n2008년 가을 리먼 브라더스가 파산하고 세계 경제가 무너져 내렸을 때, 이명박 정부는 바로 이곳에 상황실을 차리고 매주 대책회의를 열었습니다. 미국과 300억 달러 규모의 통화스와프를 맺어 외환시장을 진정시켰고 과감한 재정 투입으로 일자리를 지켰습니다. 서민의 내 집 마련을 위해 값싼 보금자리주택을 내놓았고 얼어붙은 부동산 시장도 되살렸습니다. 대한민국은 OECD 국가 가운데 가장 빨리 위기를 벗어난 나라로 꼽혔습니다. 그때 여당 원내대표로 그 과정을 함께한 사람이 지금의 대통령입니다."
 tfrkphn.25.kp2:0 "\"그때랑은 다릅니다. 통화스와프를 맺어 줄 미국이 없습니다.\"\n\n경제수석의 보고에 회의실이 무겁게 가라앉았습니다. 장바구니 물가는 치솟고 일자리는 줄고, 끼니를 걱정하는 가정은 늘고 있습니다.\n\n회의에서는 기업 규제 문제도 거론되었고, 대통령은 후보 시절부터 이 점을 지적해 왔습니다.\n\n\"국가는 기업이 활동하는 데 창의력을 발휘하도록 지원해주면 되는데, 문재인 정부는 걸핏하면 세무조사하고 공정거래위원회를 동원해 갑질을 한다\"\n\n우리 정부는 그 반대로 가겠다는 것이 대통령의 뜻입니다.\n\n대통령은 그때의 교훈을 살리되 이번에는 우리 힘으로 버텨야 한다고 말했습니다. 서민 생계 지원과 집값 안정, 일자리 지키기에 나라의 모든 힘을 모으라는 지시가 뒤따랐습니다. 보수는 가진 사람만을 위한 정치라는 말을 우리는 이번에야말로 끊어 내려 합니다."
 tfrkphn.725.next:0 "이어서 본다"
 tfrkphn.26.kp:0 "미국의 정보 지원이 끊긴 뒤로 우리의 대북 정보망은 눈에 띄게 약해졌습니다. 전방에서는 북한이 도발했을 때 어디까지 대응해도 되는지를 두고 혼선이 있다는 보고가 올라왔습니다. 대통령은 김관진 전 국방부 장관 때의 원칙으로 돌아가라고 지시했고, 국가안보실은 오늘 아래의 지침을 내려보냈습니다.\n\n수신: 대한민국 합동참모본부, 국가정보원\n발신: 대통령실 국가안보실\n제목: 대북 도발 대응 지침 및 정보 역량 재건 지시\n\n1. 배경\n2010년 연평도 포격 직후 국방부 장관에 오른 김관진은 일선 부대에 북한이 도발하면 위에 묻지 말고 먼저 대응한 뒤 보고하라는 '선조치 후보고' 원칙을 내렸음. 아울러 도발의 원점은 물론 이를 지원하고 지휘한 세력까지 응징하라는 지침을 함께 하달하였음.\n2015년 북한의 목함지뢰 도발로 우리 장병이 중상을 입었을 당시, 국가안보실장이던 김관진은 11년간 중단되었던 대북 확성기 방송을 재개하였고, 결국 북한으로부터 유감 표명을 받아 냄."
 tfrkphn.26.kp2:0 "2. 지시 사항\n가. 전방 부대에 '선조치 후보고' 권한을 즉시 복원할 것.\n나. 북한의 도발 발생 시 대북 확성기 방송을 즉각 재개할 것.\n다. 도발 원점, 지원 세력, 지휘 세력에 대한 응징 계획을 재정비할 것.\n라. 미국의 정보 지원 중단에 따라, 약화된 대북 정보망을 처음부터 재건할 것.\n\n3. 비고\n정보기관은 정치에 휘둘리지 않고 오직 국가 안보에만 전념할 것."
 tfrkphn.726.next:0 "이어서 본다"
 tfrkphn.27.kp:0 "새벽 3시, 청와대 관저의 전화벨이 울렸습니다.\n\n\"대통령님, 중국군이 대만 해협 일대에서 대규모 상륙 훈련을 시작했습니다. 규모가 지난번과는 비교도 안 됩니다.\"\n\n수화기 너머 국가안보실장의 목소리는 평소보다 한 톤 낮았고, 대통령은 아무 말 없이 침대에서 몸을 일으켰다고 합니다.\n\n집무실의 화면에는 쉴 새 없이 보고가 올라왔습니다. 대만 해협을 가득 메운 중국 함정들과 대만 언론의 긴급 특보, 평화헌법을 고치겠다는 일본 정부의 담화가 차례로 떴고, 그 틈을 노린 북한은 또다시 동해로 탄도미사일을 쏘아 올렸습니다. 미국이 무너진 자리에 생긴 커다란 공백 위로 동북아의 모든 나라가 저마다 불을 지피고 있습니다."
 tfrkphn.27.kp2:0 "\"이 불이 대만에서 멈출까요?\"\n\n누군가 혼잣말처럼 물었지만 대답하는 사람은 없었고, 바다 건너 대만과 이 땅 사이의 거리는 우리가 생각하던 것보다 가깝습니다.\n\n대통령은 오래도록 지도를 내려다보았습니다. 불길은 이미 타오르기 시작했습니다. 그 불길이 이 땅까지 번져 올 때 우리가 무엇을 들고 서 있을지, 남은 시간 안에 정해야 합니다."
 tfrkphn.727.next:0 "이어서 본다"
 tfrkphn.29.kp:0 "(속보) 중국군, 대만 본섬 상륙 개시\n타이베이를 비롯한 대만 전 지역이 불바다에 휩싸이고 있습니다. 새벽부터 이어진 미사일 공격으로 타이베이 도심 곳곳에서 거대한 불길이 치솟았고, 가오슝과 타이중 항구에는 중국군 상륙함들이 줄지어 접근하고 있습니다. 대만 정부는 전 국민에게 대피령을 내렸습니다.\n\n우리는 그날 아침 대만지원법을 국회에 냈습니다. 무기와 물자를 지원하고, 필요하다면 우리 군의 파견까지 열어 두는 법안입니다. 문제는 의석입니다. 지금의 국회는 2020년 총선으로 짜인 그대로라 과반을 야당이 쥐고 있습니다. 우리가 할 수 있는 일은 여당 의원 전원을 본회의장에 앉히는 데까지입니다."
 tfrkphn.29.kp2:0 "같은 시각 여의도 국회의사당, 본회의장의 공기는 팽팽하게 얼어붙어 있습니다.\n\n\"대만이 무너지면 다음은 우리입니다! 지금 손을 놓고 있으면 역사가 우리를 용서하지 않을 겁니다!\"\n\"이건 전쟁에 뛰어들겠다는 선언입니다! 국민을 사지로 몰아넣을 셈입니까!\"\n\n여당 의원들은 일제히 찬성 표결을 마쳤고 공은 야당으로 넘어갔습니다. 의원총회를 마친 야당 의원들이 하나둘 본회의장으로 들어서고 있지만 그 표정에서는 아무것도 읽을 수 없습니다.\n\n청와대 집무실의 대통령은 국회 중계 화면에서 눈을 떼지 못하고 있습니다. 전광판에 숫자가 하나씩 올라가기 시작했습니다."
 tfrkphn.729.next:0 "이어서 본다"
 tfrkphn.85.kp:0 "대만해협의 포성이 서울까지 들려오기 시작한 날, 우리는 중앙선거여론조사심의위원회에 공문을 보냈습니다.\n\n\"전시에 여론은 무기가 됩니다. 적은 우리의 숫자를 보고 우리의 흔들림을 읽습니다.\"\n\n전쟁이 끝날 때까지 정당 지지율과 국정 지지도 조사의 공표가 금지됩니다. 평시에는 선거를 엿새 앞둔 날부터만 막던 것을 전쟁 기간 전체로 넓힌 조치입니다. 방송사들은 매주 내보내던 지지율 그래프를 내렸고, 야당은 '숫자가 무서운 정부'라며 거세게 반발했습니다.\n\n거리의 시민들은 지지율보다 내일의 뉴스를 더 걱정하고 있습니다."
 tfrkphn.30.kp:0 "국방부 브리핑룸, 오전 10시입니다.\n\n\"대한민국은 이번 양안 간 무력 충돌에 대해 중립의 입장을 유지하고 있으며, 우리 군이 전투에 참여하는 일은 없을 것입니다. 이번 대만지원법에 따른 조치는 어디까지나 인도적 지원과 방어 물자 제공에 한정됩니다.\"\n\n국방부 대변인은 준비된 원고를 또박또박 읽어 내려갔고, 기자들의 질문이 쏟아졌지만 대답은 끝까지 같았습니다. 중립, 인도적 지원, 방어 물자.\n\n법은 통과되었어도 우리는 선전포고를 하지 않았습니다. 중국은 여전히 우리의 가장 큰 교역 상대이고 서해 건너에는 중국 해군의 함대가 있습니다. 공식적으로 참전국이 되는 순간 그 함대가 움직일 명분이 생깁니다. 그래서 우리는 서류와 현실을 따로 두는 길을 골랐습니다."
 tfrkphn.30.kp2:0 "그 시각 부산항에서는 '농기계'와 '의료 장비'라고 적힌 컨테이너들이 대만행 화물선에 실리고 있었습니다. 성남 서울공항에서는 국적 표시를 지운 수송기가 남쪽 하늘로 날아올랐고, 며칠 전 '개인 사유'로 전역 신청서를 낸 공군 조종사 수십 명은 오키나와행 민항기에 몸을 실었습니다. 대만 해협 너머 전장에서는 한국어로 된 무전이 심심치 않게 잡히기 시작했습니다.\n\n베이징은 곧바로 강한 항의 성명을 냈고 우리의 대답은 이번에도 같았습니다. 대한민국은 중립국이며 어떠한 전투에도 참여하지 않는다는 것입니다.\n\n서류 위의 대한민국은 여전히 중립국인데, 우리가 이 전쟁에 발을 들였다는 사실을 모르는 사람은 이제 아무도 없습니다."
 tfrkphn.730.next:0 "이어서 본다"
 tfrkphn.309.kp:0 "올해 대학교 4학년인 서준은 난생처음으로 집회에 나갔습니다. '대만 파병 반대 시민대행진'입니다.\n\n지나가는 어르신들 눈에는 '영락없는 빨갱이'로 보였겠지만, 서준은 불과 몇 달 전까지 열성적인 홍카... 아니, 홍준표 지지자였습니다.\n\n그가 찍은 대통령은 양안전쟁에 파병을 결정했고, 전문하사였던 형은 이역만리 낯선 땅에서 돌아오지 못했습니다. 서준은 이 모든 일을 자기 손으로 만들었다고 생각합니다.\n\n주위에는 그가 그렇게 싫어하던 민주노총과 각종 노조, 정의당과 진보당 같은 진보정당들, 그 뒤로는 처음 듣는 이름의 정당과 시민단체의 깃발이 나부끼고 있었습니다.\n\n주최 측으로 보이는 사람은 서준이 말을 걸기도 전에 구호가 적힌 코팅 종이와 작은 방석 하나를 내밀고는 쌩 지나가 버렸습니다.\n\n뭐 어떻게 하라고? 깔고 앉으라고?"
 tfrkphn.309.kp2:0 "얼떨결에 4차선 아스팔트 도로에 방석을 깔고 앉으니, 앞 전광판에서는 고막이 터질 듯한 음량으로 '운동권' 노래가 흘러나왔습니다. 평소라면 지나쳐 버렸을 노래들인데 오늘은 왠지 싫지 않았고, 그의 심장은 노랫소리에 맞춰 떨리고 있었습니다.\n\n유족들과 활동가들의 연설이 끝나고 사회자가 구호를 외치기 시작했습니다.\n\n\"함께 외칩시다! 대만 파병 중단하라!\"\n\"중단하라! 중단하라! 중단하라! 투쟁!\"\n\n둘러보면 사람들은 저마다의 신념을 품고 열의에 차 구호를 외치고 있었습니다. 서준의 목소리에만 다른 것이 섞여 있었는데, 형과 수많은 사람들을 죽음으로 몰아넣은 정부를 향한 분노였습니다.\n\n우리는 이 집회를 경찰 추산 인원이 적힌 한 줄짜리 보고로 받았고, 그 숫자 안에 서준 같은 사람이 몇이나 있는지는 보고서에 나오지 않습니다."
 tfrkphn.709.next:0 "이어서 본다"
 tfrkphn.36.kp:0 "\"재석 287인 중 찬성 112인, 반대 171인, 기권 4인으로 대만지원법안은 부결되었음을 선포합니다.\"\n\n국회의장의 의사봉이 세 번 울렸습니다. 야당 의원석에서는 박수가 터져 나왔고 여당 의원석에서는 탄식과 고성이 뒤섞였습니다. 몇몇 여당 의원은 자리를 박차고 본회의장을 빠져나갔습니다.\n\n청와대 집무실의 화면에도 같은 장면이 흘러나왔고, 대통령은 한동안 아무 말 없이 화면을 바라보다가 리모컨을 내려놓았습니다.\n\n국회가 길을 막았으니 우리는 이 전쟁에서 공식적으로 중립을 지킵니다. 대만으로 향할 탄약도 의용군도 법으로는 없습니다.\n\n그렇다고 손을 놓을 수는 없습니다. 바다 건너의 불길이 언제 이쪽으로 번져 올지 모르는 지금, 법이 허락하는 범위 안에서 우리가 해야 할 일은 오히려 늘었습니다."
 tfrkphn.31.kp:0 "경상북도 어느 산골짜기의 탄약고입니다. 70년 동안 언제 다시 터질지 모르는 전쟁을 기다리며 쌓아 두었던 포탄들이 줄지어 트럭에 실리고 있습니다. 녹슨 철문 위에는 '탄약 정비 및 재배치'라는 공문이 붙었습니다.\n\n\"중사님, 이거 진짜 다 빼는 겁니까? 북한이 쳐들어오면 어쩌려고요.\"\n\"위에서 다 계산하고 하는 거겠지. 빌려주는 거래, 빌려주는 거.\"\n\n우리 군은 휴전 뒤로 줄곧 포탄을 쌓아 온 군대입니다. 대만과 일본이 지금 가장 급하게 찾는 것이 바로 그 포탄이고, 새로 만들어서는 때를 맞출 수 없습니다. 그래서 창고에 있는 것을 먼저 내주고 빈자리는 공장을 돌려 채우기로 했습니다.\n\n트럭 행렬은 밤새 부산항으로 이어졌습니다. 서류상 행선지는 '우방국 정비 지원', 품목은 '대여 물자'이고, 반납 기한을 적는 칸은 비워 두었습니다.\n\n같은 주, 대만과 일본의 보급 창고에는 한국어 표기가 선명한 탄약 상자들이 차곡차곡 쌓이기 시작했습니다."
 tfrkphn.33.kp:0 "청와대 춘추관 브리핑룸, 오후 2시입니다. 플래시 세례 속에서 대통령이 단상에 올랐고 브리핑룸은 국내외 기자들로 발 디딜 틈이 없었습니다.\n\n바다 건너 대만에서 전쟁이 터진 지 열흘째입니다. 마트의 생필품 진열대는 텅 비었고 주식시장은 연일 곤두박질치고 있습니다. 우리는 대통령이 직접 나서야 한다고 건의했고, 대통령은 원고 없이 하겠다고 했습니다.\n\n짧은 모두발언이 끝나자마자 질문이 쏟아졌습니다."
 tfrkphn.33.kp2:0 "\"대통령님, 우리 장병들이 대만 전선에 투입될 가능성은 정말 없습니까?\"\n\"중국이 우리를 표적으로 삼으면 정부 대책은 무엇입니까?\"\n\"사재기가 벌어지고 있는데, 국민들은 지금 무엇을 준비해야 합니까?\"\n\n대통령은 질문 하나하나에 거침없이 답했습니다. 우리 장병이 대만 전선에 투입되는 일은 없고, 생필품과 에너지는 충분히 비축되어 있으며, 정부는 국민의 일상을 끝까지 지킨다는 답이었습니다.\n\n마지막 질문은 맨 앞줄의 젊은 기자에게서 나왔습니다.\n\n\"그래도 불안해하는 국민들에게, 딱 한마디만 해 주신다면요?\"\n\n대통령은 잠시 기자를 바라보더니 씩 웃으며 마이크를 다시 잡았습니다."
 tfrkphn.733.next:0 "이어서 본다"
 tfrkphn.37.kp:0 "거제 옥포 조선소, 영업팀 사무실입니다.\n\n\"부장님, 또 들어왔습니다. 이번엔 화물선 30척이요.\"\n\"발주처는?\"\n\"싱가포르에 있는 해운회사라는데... 작년에 설립된 회사입니다. 직원은 세 명이고요.\"\n\n부장은 말없이 계약서를 넘겼습니다. 지난달에는 파나마 국적의 신생 해운사가 25척을, 그 전달에는 홍콩의 무역회사가 40척을 주문했습니다. 하나같이 이름도 처음 듣는 회사였고 납기는 '최대한 빨리', 결제는 선금 전액이었습니다. 그렇게 인도된 배들은 얼마 지나지 않아 대만 해협과 일본 근해에서 목격되었습니다.\n\n\"이거... 괜찮은 겁니까? 중국이 알면...\"\n\"우리는 배를 팔았을 뿐이야. 산 사람이 그 배로 뭘 하든 그건 우리가 알 바 아니지.\"\n\n정부의 공식 입장도 다르지 않습니다. 대한민국은 중립국이며 민간 기업의 정상적인 수출 계약에 관여하지 않습니다. 그 신생 해운사들의 선금이 어느 나라 계좌에서 나왔는지 우리는 묻지 않기로 했습니다.\n\n그날 밤에도 조선소의 용접 불꽃은 꺼지지 않았습니다."
 tfrkphn.39.kp:0 "런던, 국제 안보 총회장입니다. 우리 외교부 장관이 단상에 올라 공동성명을 읽어 내려갔고, 그 뒤로 일본과 호주, 뉴질랜드, 동남아 몇몇 나라의 대표들이 나란히 섰습니다.\n\n\"우리 아시아의 민주주의 국가들은 중화인민공화국의 대만 침공을 강력히 규탄한다. 무력에 의한 현상 변경은 결코 용납될 수 없으며, 국제사회는 즉각적인 휴전과 침략군의 철수를 요구한다.\"\n\n성명이 끝나자 박수가 이어졌습니다. 회의장 한쪽 중국 대표단석의 외교관들은 박수 대신 귀엣말을 주고받으며 피식 웃었고, 성명이 끝나기도 전에 서류를 챙겨 일어났습니다. 종이 위의 규탄으로는 해협을 건너는 상륙함 한 척도 멈출 수 없다는 것을 그들은 누구보다 잘 압니다."
 tfrkphn.39.kp2:0 "미국 대표단석은 반쯤 비어 있었는데, 자리를 지킨 외교관 몇 명은 성명서를 받아 들고도 말이 없었습니다. 본국이 내전으로 갈라진 지금 그들은 자기가 누구를 대표하는지조차 확신하지 못합니다. 한때 이런 자리에서 가장 먼저, 가장 크게 목소리를 내던 나라였습니다.\n\n총회가 끝난 뒤 독일과 프랑스, 영국의 대표들이 우리 대표단을 찾아왔습니다. 적어도 유럽은 이 목소리를 듣고 있습니다."
 tfrkphn.739.next:0 "이어서 본다"
 tfrkphn.32.kp:0 "1920년 6월 만주 봉오동 골짜기에서 홍범도가 이끄는 독립군은 일본군을 골짜기로 끌어들인 뒤 사방에서 총탄을 퍼부었습니다. 나라를 잃은 지 10년, 조선의 젊은이들은 총 한 자루를 들고 제국의 군대에 맞섰습니다.\n\n그로부터 20년 뒤 충칭에서 창설된 한국광복군은 연합국의 일원으로 싸웠습니다. 인도와 버마의 정글에서는 영국군과 함께 일본군의 방송을 감청하고 포로를 심문했고, 국내 진공을 위해 미국 OSS와 손을 잡고 특수 훈련을 받았습니다. 정규군도 나라도 없었지만 그들은 전선의 뒤편에서 자유를 위해 싸웠습니다.\n\n다시 80여 년이 지났습니다.\n\n청와대 국가안보실의 회의 탁자 위에는 푸젠성의 군수 시설 위성사진과 서해의 중국 해군 이동 경로, 이어도 해양과학기지의 설계도가 펼쳐져 있습니다. 이번에도 우리는 전선에 서지 않습니다. 적어도 공식적으로는 그렇습니다.\n\n전쟁은 총성이 울리는 곳에서만 벌어지지 않습니다. 선배들이 그랬듯이 우리도 전선의 뒤편에서 할 일을 찾았습니다."
 tfrkphn.34.kp:0 "합동참모본부 지하 지휘통제실의 대형 화면에는 휴전선 이북의 북한군 배치도가 빼곡하게 떠 있습니다. 중국이 대만에 발이 묶인 지금 평양이 가만히 있을 리 없고, 지금이야말로 북한이 오판하기 가장 좋은 때입니다.\n\n\"북한이 이 틈을 노린다면, 망설임 없이 응징한다. 그게 대통령님 지시입니다.\"\n\n우리는 전방 부대의 경계 태세를 최고 단계로 끌어올렸습니다. 서해와 동해에서는 대규모 해상 훈련이 이어졌고 휴전선 일대에서는 대북 확성기가 밤낮없이 울렸습니다. 확성기는 대만 전선의 소식과 함께 중국이 북한을 지켜 줄 여유가 없다는 사실을 쉼 없이 내보냈습니다.\n\n평양의 반응은 어느 때보다 조용합니다. 그 조용함이 무엇을 뜻하는지는 북한 주민들이 누구보다 잘 알 것입니다."
 tfrkphn.38.kp:0 "대만지원법이 부결된 뒤로 우리가 대놓고 할 수 있는 일은 줄었습니다. 국가정보원이 요즘 무슨 일을 하는지에 대해 우리는 확인도 부인도 하지 않습니다. 다만 서울 신촌의 한 PC방에서 새벽 1시에 있었다는 일 하나가 우리 귀에까지 들어왔습니다.\n\n\"야, 너 이거 봤냐? 요즘 커뮤니티마다 '중국 위협론' 글이 미친 듯이 올라오잖아.\"\n\"그게 왜?\"\n\"이상하지 않냐? 글 쓴 계정들 가입일이 다 지난달이야. 말투도 다 똑같고. 이거 국정원 댓글부대라니까. 부결돼서 대놓고 못 도우니까 여론부터 만지는 거지.\"\n\"에이, 또 그 소리. 너는 맨날 음모론이야.\"\n\"진짜라니까? 아무튼 우리 삼촌이 국정원에서 일하는데, 삼촌한테 물어보면...\"\n\n그 순간 PC방 유리문 밖으로 빨간 마티즈 한 대가 천천히 멈춰 섰다고 합니다. 운전석 창문이 스르륵 내려가더니 선글라스를 낀 중년 남자가 두 사람을 향해 손을 흔들었습니다.\n\n\"어이, 조카. 늦었는데 삼촌이 집까지 태워 줄까?\"\n\n두 사람은 한동안 아무 말도 하지 못했습니다."
 tfrkphn.40.kp:0 "바르샤바, 폴란드 국방부 청사입니다. 긴 탁자 양쪽에 앉은 두 나라 대표가 마지막 서명을 마치자 플래시가 일제히 터졌습니다. K2 전차와 K9 자주포, FA-50 경공격기를 묶은, 우리 방위산업 역사에서 가장 큰 수출 계약입니다.\n\n\"솔직히 처음엔 반신반의했습니다. 아시아의 중립국이 우리에게 무기를 팔 수 있을지.\"\n폴란드 국방차관이 통역을 통해 웃으며 말했습니다.\n\"그런데 런던에서 한국이 하는 말을 들었습니다. 바다 건너 전쟁을 보면서도 할 말은 하는 나라라면, 믿고 거래할 수 있다고 생각했죠.\"\n\n미국이 무너진 뒤 유럽의 무기고는 텅 비었습니다. 대서양 건너에서 오던 탱크와 포탄이 끊겼고 동쪽 국경의 긴장은 날로 높아졌습니다. 유럽에는 빠르게, 많이 만들어 줄 수 있는 나라가 필요했고, 70년 동안 전쟁을 대비해 온 우리에게는 바로 그런 공장들이 있습니다.\n\n그 주부터 창원의 방산 공장들은 3교대로 돌아갑니다. 대만에 총을 보낼 수는 없어도 우리 공장은 쉬지 않고 있습니다."
 tfrkphn.35.kp:0 "새벽 4시, 진해 군항입니다. 부두에는 군복 대신 이름 모를 작업복을 입은 사내들이 줄지어 섰습니다. 계급장도 부대 마크도 태극기도 없습니다. 그들의 서류에는 모두 '전역' 도장이 찍혀 있고 행선지란에는 '해외 취업'이라고 적혀 있습니다.\n\n\"이름은 자유의용군이다. 우리는 국군이 아니다. 대한민국은 이 전쟁에 참전하지 않았다. 알겠나?\"\n\"예, 알겠습니다!\"\n\n대답하는 목소리는 우렁찼고, 그들 대부분은 며칠 전까지 같은 부대에서 같은 군복을 입던 사람들입니다.\n\n탄약을 빌려주고 정보를 넘기고 후방을 흔드는 것만으로는 이 전쟁을 막을 수 없다는 것이 우리가 내린 결론입니다. 대만의 해안선이 무너지면 그다음은 제주이고 부산이고 서울입니다. 결국 누군가는 직접 그 진흙탕에 발을 들여야 했습니다.\n\n수송선이 천천히 부두를 떠났고, 배웅 나온 사람은 없었습니다. 공식적으로 그들은 존재하지 않는 사람들입니다."
 tfrkphn.41.kp:0 "국방부 군수지원과의 연말 재고 조사 보고서가 올라왔습니다.\n\n\"제3탄약창 소화기탄 재고, 장부상 수량과 실재고 차이 약 40만 발. 사유: 노후 탄약 폐기 처분.\"\n\"제7탄약창 105mm 포탄, 차이 약 2만 발. 사유: 훈련 소모.\"\n\"제2보급창 지원 장비, 차이 약 500세트. 사유: 정비 중 분실.\"\n\n보고서를 넘기던 국방부 장관은 한숨도 쉬지 않고 결재란에 서명했습니다. 이 보고서가 국회 국방위원회에 올라가면 야당은 분명 난리를 칠 것입니다. 하지만 야당 의원들도 압니다. 사라진 탄약이 어디로 갔는지 캐묻는 순간 모두가 곤란해진다는 것을."
 tfrkphn.41.kp2:0 "보고서는 결국 대통령의 책상에도 올라갔고, 검사 시절의 대통령은 장부 속의 거짓을 가장 먼저 읽어 내던 사람입니다. 그는 훗날 이렇게 회고했습니다.\n\n\"1993년 4월 동화은행 비자금 사건 때 함승희 주임 검사의 요청으로 20분 만에 김종인 전 경제수석의 뇌물 사건을 자백받았다\"\n\n그런 사람이 이번만큼은 숫자가 맞지 않는 장부를 두고 아무것도 묻지 않았습니다.\n\n같은 시각 공해상의 어느 해역에서는 국적 표시가 없는 화물선 한 척이 대만 해군 함정 옆에 조용히 멈춰 섰고, 크레인이 움직이기 시작했습니다.\n\n국회는 대만지원법을 부결했고 대한민국은 중립국입니다. 그리고 군대에서 탄약이 조금 사라지는 일은 원래 흔합니다."
 tfrkphn.741.next:0 "이어서 본다"
 tfrkphn.50.kp:0 "도쿄와 타이베이, 시드니, 그리고 서울까지 사방에서 승전의 폭죽이 터지고 있습니다. 우리도 오늘만큼은 마음 놓고 기뻐하고 싶습니다.\n\n중국군은 끝내 대만을 삼키지 못했습니다. 그러나 중국이라는 나라는 바다 건너에 그대로 남아 있습니다. 승전 보고를 받는 자리에서 웃지 않은 사람은 대통령 하나였고, 그는 이렇게 말했습니다.\n\n\"중국은 절대 여기서 포기하지 않는다. 이건 잠깐 시간을 번 것일 뿐, 저들이 개혁을 하든 보복을 하든 좌익이 정권을 잡든 그들의 목표는 여전히 아시아다. 수나라, 당나라, 청나라, 그리고 시진핑은 실패했지만 그 다음은 다를 것이다. 더 이상 자주국방은 북한만을 상대로 해서는 안 된다. 적룡은 다시 돌아올 것이다.\""
 tfrkphn.51.kp:0 "국립서울현충원은 나라를 위해 목숨을 바친 이들이 잠든 곳인데, 대통령은 승전 기념행사를 비롯한 일정을 모두 미루고 이곳에 왔습니다. 그리고 이름이 하나씩 새겨진 벽을 올려다보았습니다.\n\n\"김대식 (1934~1952), 이환정 (1951~1972).\"\n\n그 옆에는 새로 새긴 이름들이 있습니다.\n\n\"황이준 (2002~2022), 이정준 (2000~2022), 박삼경 (1999~2022)...\"\n\n모두 머나먼 남의 땅에서 쓰러진 사람들인데, 그 가운데는 우리가 서류를 만들어 내보낸 이름도 있습니다.\n\n'과연 내 선택이 옳은 것일까? 이들을 죽인 건 내가 아닌가....' 대통령은 자기 자신에게 그렇게 물었을 것입니다. 답을 찾았는지는 우리도 알지 못합니다. 그는 한참 동안 아무 말 없이 서 있었습니다."
 tfrkphn.52.kp:0 "자정이 넘은 대통령 집무실에 불이 켜져 있습니다. 우리는 모두 물러 나왔고 안에는 대통령 혼자 남았습니다.\n\n그는 국민 앞에서 선진대국을 약속했습니다. 박수는 이미 지나갔고 책상 위에는 그 약속을 지켜야 할 의무만 남았습니다.\n\n문틈으로 본 사람의 말로는 대통령이 주머니를 뒤져 담배 한 개비를 꺼냈다고 합니다. 끊은 지 오래된 담배인데 오늘 밤만은 손이 먼저 움직였던 모양입니다. 불을 붙이고 고개를 들자 어두운 창유리에 얼굴이 비쳤고, 그 얼굴은 낮에 연단에 섰던 얼굴보다 한참 늙어 보였다고 합니다.\n\n책상 한쪽에는 오늘 자 여론조사가 엎어져 있었습니다. 찬성과 반대가 거의 반반입니다. 대통령은 연기를 길게 내뿜으며 중얼거렸습니다.\n\n\"국민의 결집.... 좌와 우를, 남과 여를 따질 때가 아니다. 모두가 한 길로 모여야 한다.\"\n\n그는 담배를 비벼 끄고 엎어 둔 여론조사를 바로 놓은 다음 첫 장부터 다시 읽었습니다. 내일 아침 첫 일정은 야당 대표와의 면담입니다."
 tfrkphn.53.kp:0 "나라를 하나로 묶으려면 먼저 썩은 곳을 도려내야 하고, 그 칼을 들기 전에 대통령은 자기가 칼끝에 섰던 날의 이야기를 우리에게 들려주었습니다.\n\n\"2011년 5월, 6월경 호텔에서 성완종 회장을 만난 일이 있습니까?\"\n\"없습니다.\"\n\n2015년 4월 10일, 공직 생활 처음으로 그의 이름에 비리 의혹이 붙었습니다. 성완종 회장이 세상을 떠나며 남긴 메모 한 장 때문이었고, 거기에는 1억 원이라는 숫자와 함께 친박 인사 여섯 명 사이에 그의 이름이 적혀 있었습니다.\n\n출근길마다 기자들이 몰려들었고 어느 방송은 그가 출국금지를 당했다고 잘못 보도했습니다. 5월 초 검찰에 출두한 그는 기자 500여 명 앞에서 \"간단히 소명하러 왔습니다\"라고 말했습니다."
 tfrkphn.53.kp2:0 "대통령의 기억으로는 조사가 이상하게 흘러갔습니다. 네 시간 동안 120쪽을 채웠는데 범죄 사실은 묻지 않았다는 것입니다. 호텔에서 성 회장을 만난 일이 있느냐는 그 한 줄만 빼고 말입니다. 이튿날 검찰은 그가 12시간 동안 강도 높은 조사를 받았다고 발표했습니다.\n\n1심은 징역 2년 구형에 징역 1년 6개월 선고였습니다. 재판부가 자기 쪽 주장을 듣지 않았고 검사가 변호인을 협박했다는 것이 그의 주장입니다. 그날 그는 노상강도를 당한 기분이라고 말했습니다.\n\n항소심에서 판이 뒤집혔습니다. 폐쇄된 문으로 들어왔다는 윤 모 씨의 말이 거짓으로 드러났고, 서로 잘 모르는 사이였던 두 사람을 잘 아는 사이처럼 꾸민 정황도 나왔습니다.\n\n대통령은 이렇게 말을 맺었습니다. 자기가 검사이던 시절에는 경찰이 고문으로 사건을 만들었는데 이제는 검사가 그 일을 한다고, 검찰이 이렇게 무너졌는데 나라의 기강이 설 리 없다고 했습니다. 칼을 쥘 사람부터 깨끗해야 한다는 것을 그는 그 일을 겪고 나서 알았다고 합니다."
 tfrkphn.753.next:0 "이어서 본다"
 tfrkphn.54.kp:0 "국무회의실의 긴 탁자 위에 두꺼운 보고서가 놓였습니다. 표지에는 건조한 글씨로 '정부 조직 진단 결과'라고 적혀 있습니다.\n\n장관들은 서로 눈치를 보며 첫 장을 넘겼고, 위원회만 수백 개인데 이름만 있고 회의를 한 번도 열지 않은 곳이 수두룩했습니다. 같은 일을 하는 부서가 서너 곳씩 겹쳤고, 서류 한 장이 결재를 받으려면 도장 일곱 개를 거쳐야 했습니다. 전쟁을 치르는 동안 우리가 급한 대로 늘려 놓은 것들입니다.\n\n\"전쟁은 끝났습니다. 그런데 정부는 아직도 전시 몸집 그대로입니다.\"\n\n대통령이 보고서를 덮었습니다.\n\n\"도지사 시절에 배운 게 하나 있습니다. 빚은 버릇입니다. 쓰던 대로 쓰고 늘리던 대로 늘리면, 그 청구서는 우리 아이들한테 날아갑니다.\""
 tfrkphn.54.kp2:0 "누군가 조심스럽게 손을 들었습니다. 공무원 노조의 반발과 지역구 의원들의 민원, 일자리를 줄인다는 비판이 뒤따를 것이라는 걱정이었고 대통령도 모르지 않았습니다.\n\n\"사람을 내보내자는 게 아닙니다. 새로 뽑을 자리를 묶고, 겹치는 일은 합치고, 안 쓰는 위원회부터 닫자는 겁니다. 국민 세금으로 돌아가는 조직이라면, 국민이 한눈에 알아볼 만큼 단순해야 합니다.\"\n\n그날 오후 우리는 공무원 정원 동결과 위원회 정비, 중복 부처 통폐합을 발표했습니다. 어떤 신문은 '칼바람'이라 썼고 어떤 신문은 '늦었지만 필요한 다이어트'라 썼습니다.\n\n집무실로 돌아온 대통령 앞에는 도장 칸이 일곱 개에서 세 개로 줄어든 새 결재판이 놓였습니다. 그는 짧게 웃고 첫 서명을 했습니다."
 tfrkphn.754.next:0 "이어서 본다"
 tfrkphn.55.kp:0 "대통령은 담화 원고 마지막 장에 직접 펜으로 한 줄을 덧붙였습니다. '말로 끝나면, 나도 끝이다.'\n\n그 담화가 나가던 시각, 변두리의 한 국밥집에서 있었던 일을 우리는 나중에 수사 기록으로 읽었습니다. 점심때가 조금 지난 시간이었습니다.\n\n\"야 이씨, 이번에 대통령이 특별담화 한다는 거 들었냐?\"\n\"형님요, 그런 거 들어 봐야 뭐 합니까. 뻔하지예. '나라가 어려우니 잘하겠습니다.' 아무 일도 안 일어납니다.\"\n\n몇십 분 뒤 식당 TV에 대통령의 대국민 담화가 나왔습니다.\n\n\"첫째, 저는 우리 공동체를 파괴하는 범죄와 폭력에 전쟁을 선포합니다. 헌법이 부여한 대통령의 모든 권한을 동원해 소탕하겠습니다. 둘째, 민주 사회의 기틀을 위협하는 불법과 무질서를 몰아내겠습니다. 셋째, 과소비와 투기, 퇴폐와 향락을 바로잡아 일하는 사회, 건강한 사회를 만들겠습니다.\""
 tfrkphn.55.kp2:0 "\"저 새끼 뭐라는 거냐? 우리 같은 놈들 잡아 처넣겠다는 거냐?\"\n\"걱정 마쇼, 형님. 우리가 짭새들한테 갖다 바친 게 얼맙니까? 절대 못 잡습니다. 잡는다 캐도 이래, 휙 하면 게임 끝입니다. 지 꼴에 검사 출신이라고 뭐 해 보는 갑지예.\"\n\"그래, 네 말이 맞다. 한두 번 겪은 일도 아니고.\"\n\n형님이라 불린 사내가 국밥에 숟가락을 얹었을 때 화면 아래로 붉은 자막이 흘렀습니다. '조직폭력 및 민생침해사범 전면 소탕.' 숟가락이 멈췄습니다.\n\n\"근데 이번엔 기류가 좀 이상하다. 검사 출신들이 직접 지휘 라인을 잡고 내려온다는 소문이 있어. 우리가 관리하던 경찰서 선에서 끝날 일이 아닐 수도 있다.\"\n\"에이, 형님도 참. 법 위에 돈 있고, 돈 위에 의리 있는 거 모릅니까. 식기 전에 드이소.\"\n\n동생은 헛웃음을 치며 소주잔을 비웠습니다. 구석의 다른 손님들은 TV에서 눈을 떼지 않았고 주인의 얼굴도 싸늘하게 굳어 있었습니다.\n\n시대의 공기가 바뀌고 있습니다. 그 식당에서 그것을 모르는 사람은 둘뿐이었습니다."
 tfrkphn.755.next:0 "이어서 본다"
 tfrkphn.322.kp:0 "범죄와의 전쟁을 지휘하는 사람이 어떤 길을 걸어왔는지 우리는 여러 번 들었습니다. 대통령은 경상남도 창녕의 작은 시골, 남의 땅을 부쳐 먹던 집에서 자랐습니다. 아버지는 하루 몇백 원을 받는 경비원이었고 어머니는 장터에 좌판을 펴고 가발을 팔았습니다.\n\n그 장터에서 소년은 평생 잊지 못할 장면을 보았습니다. 고리 사채 몇 푼 때문에 사채업자가 어머니의 머리채를 잡고 길바닥으로 끌고 간 것입니다. 사람들은 고개를 돌렸고 아무도 나서지 않았습니다. 소년은 주먹만 쥔 채 서 있었습니다.\n\n가난을 벗어날 길은 공부뿐이었습니다. 이를 악문 소년은 마침내 사관학교 합격 통지서를 받았고, 군복을 입으면 아무도 자기를 무시하지 못하리라 믿었습니다.\n\n그해 아버지가 누명을 썼습니다. 하지도 않은 일로 경찰에 불려 다니는 모습을 지켜보던 어느 날, 동네 어른들이 혀를 찼습니다.\n\n\"야, 군인보다 센 직업이 뭔지 아나?\"\n\"니 그것도 모르나. 군인도 검사 앞에선 꼼짝 못 한다.\"\n\n그 말이 소년의 길을 바꿨고, 그는 사관학교에 가는 대신 다시 책상 앞에 앉았습니다. 힘없는 사람이 억울하게 끌려가지 않는 세상을 만들 수 있는 사람이 되겠다는 생각이었고, 몇 해 뒤 그는 정말 검사가 되었습니다."
 tfrkphn.322.kp2:0 "남쪽 도시의 강력부에서 그는 조직폭력배를 하나씩 잡아들였고, 서울로 올라와서는 도박 업계 뒤에 숨은 권력과 마주했습니다. 수사가 깊어질수록 이름만 대면 알 만한 실세들과 같은 검찰 선배들의 얼굴이 드러났습니다.\n\n\"홍 검사, 당신 지금 실수하는 거요.\"\n\n수화기 너머의 목소리는 낮고 차가웠습니다. 그는 수화기를 내려놓고 다음 서류를 펼쳤고, 그해 실세들에게 수갑을 채웠습니다. 세상은 그를 '모래시계 검사'라 불렀습니다.\n\n조직은 길들지 않는 검사를 반기지 않았고, 그는 한직을 돌다가 결국 검사복을 벗었습니다. 그래도 평온은 오지 않았습니다. 그가 감옥에 보낸 깡패들이 하나둘 출소해 그와 가족 곁을 서성였고, 한밤중의 전화와 집 앞을 맴도는 낯선 그림자가 이어졌습니다.\n\n그때 집권당이 함께 정치를 해 보자고 손을 내밀었습니다. 그는 훗날 솔직하게 털어놓았습니다. 나라와 민족 같은 거창한 이유는 없었고 가족을 지키려고 정치에 들어왔다고 말입니다.\n\n장터에서 주먹을 쥐고 서 있던 소년은 그렇게 더 큰 싸움터로 걸어 들어갔습니다. 우리는 지금 그 싸움터의 한가운데에서 그와 함께 일합니다."
 tfrkphn.722.next:0 "이어서 본다"
 tfrkphn.56.kp:0 "정부의 군살을 빼고 나자 다음 차례가 어디인지 모두가 알았습니다. 노동계는 대통령이 도지사 시절에 무엇을 했는지 잊지 않았고 대통령도 잊지 않았습니다. 그가 회의에서 편 주장을 우리는 받아 적었습니다.\n\n이 나라 노동자 가운데 3퍼센트도 안 되는 사람들이 노동시장을 쥐고 흔든다는 것이 대통령의 진단입니다. 노조는 원래 부당한 이익에 맞서는 사람들인데 강성 노조는 스스로 부당한 이익을 챙기는 쪽이 되었다고 그는 말합니다.\n\n대통령은 진주의료원을 닫을 때 그 민낯을 보았다고 했습니다. 파업의 기본은 '무노동 무임금'인데 그들은 '무노동 유임금'으로 버텼다는 것입니다.\n\n환자를 옮기던 중 수혈이 필요했던 한 분이 끝내 돌아가신 일도 있었습니다. 가족이 수혈을 반대했기 때문인데, 민노총은 그를 살인자로 몰아 형사 고소까지 했습니다. 외과의사가 가족에게 받아 둔 수혈 거부 동의서가 있어서 그 공세는 사실과 다른 것으로 드러났다고 합니다.\n\n무상급식 감사도 그가 드는 사례입니다. 경남은 해마다 교육청에 무상급식비로 700억 원 넘게 보냈지만 감사는 한 번도 없었습니다. 백만 원을 지원해도 예산 감사는 받는 법이라며 그는 감사를 받지 않으면 지원을 끊겠다고 했고, 전교조는 그가 아이들 밥그릇을 빼앗는다고 선전했습니다."
 tfrkphn.56.kp2:0 "1년 넘는 싸움 끝에 감사가 이루어졌고 88개 학교에서 2,306건의 불법이 나왔습니다. 질 낮은 식재료와 입찰 담합, 위장 업체였습니다. 아낀 돈으로 경남은 전국 최초로 서민 자녀 교육 지원 사업을 시작했는데, 반대쪽은 그 이야기는 쏙 빼고 그가 그 돈으로 도의 빚을 갚았다고 퍼뜨렸다는 것이 대통령의 말입니다.\n\n그가 보기에 강성 귀족 노조는 그들만의 세상에 삽니다. 일자리를 자식에게 대물림하고 경영에 간섭하며 불법 파업을 연례행사로 치릅니다. 현대차의 임금은 도요타와 폭스바겐보다 높은데 노동생산성은 미국보다 낮다는 숫자도 그는 빼놓지 않았습니다.\n\n기업이 살아야 일자리가 생깁니다. 이것을 바로잡지 못하면 기업은 해외로 떠나고 청년들은 갈 곳을 잃습니다. 지난 정권은 그들과 손을 잡았지만 우리 정부는 그러지 않을 것입니다.\n\n대통령은 노조 자체를 부정하지는 않는다고 했습니다. 바로잡으려는 것은 노조의 부당한 행동이라는 것입니다. 지금 바로잡지 못하면 디트로이트의 몰락이 이 땅에서 되풀이된다는 말로 그는 회의를 끝냈습니다."
 tfrkphn.756.next:0 "이어서 본다"
 tfrkphn.57.kp:0 "칼을 휘두를수록 적은 늘었습니다. 신문은 매일 아침 '독선'이라 썼고 방송은 '불통'이라 했습니다. 우리가 해명 자료를 아무리 내도 달라지는 것은 없었습니다. 대통령은 마이크를 직접 잡기로 했고, 대통령이 되고 처음으로 그 오래된 채널의 녹화 버튼이 다시 켜졌습니다.\n\n\"홍카콜라 시청자 여러분, 오랜만입니다. 제가 대통령이 된 지 벌써 이만큼 지났습니다.\n\n대만 전쟁 때 저는 대만을 도와야 한다고 호소했습니다. 국회의 결정이 어떻게 났든, 대한민국은 끝까지 자유민주주의 편에 섰습니다. 미국이 내전으로 무너졌을 때, 솔직히 저는 다 끝났다고 생각했습니다. 그런데 민주주의는 제 생각보다 강했습니다. 그 승리는 대한민국 국민 여러분의 것입니다."
 tfrkphn.57.kp2:0 "TV홍카콜라는 2018년 12월에 문을 열었습니다. 정치판도 언론도 기울어진 운동장이었습니다. 저는 속 시원한 진실을 국민께 직접 전하고 싶었습니다.\n\n언론이 할 일은 사실을 전하는 것입니다. 그래야 국민이 바르게 판단합니다. 그런데 박근혜 탄핵 무렵부터 언론은 사실보다 자기들이 바라는 방향을 먼저 보도했습니다. 좌파 언론에서 시작된 버릇이 다른 언론으로 번졌습니다.\n\n한때 40퍼센트에 이르던 공영방송 시청률은 이제 10퍼센트 아래로 떨어졌습니다. 신문 구독 부수도 날로 줄고 있습니다.\n\n저는 홍카콜라를 공정한 언론으로 키우겠습니다. 가짜 뉴스는 이 홍준표가 척결하겠습니다.\""
 tfrkphn.757.next:0 "이어서 본다"
 tfrkphn.58.kp:0 "신용사면 발표를 하루 앞둔 밤입니다. 대통령의 책상 위에는 우리가 올린 보고서가 놓여 있습니다. 신용불량자 수십만 명, 문을 닫은 가게 수만 곳이라는 숫자가 빼곡하고, 전쟁이 끝난 뒤에도 이 숫자는 줄지 않았습니다.\n\n대통령은 보고서를 덮고 눈을 감았습니다. 장터 한구석에 좌판을 펴던 어머니, 사채 몇 푼에 머리채를 잡혀 끌려가던 어머니를 떠올렸을 것입니다. 그때 어머니에게 필요했던 것은 다시 좌판을 펼 수 있는 하루, 그것 하나였습니다.\n\n사람들은 그를 '서민대통령'이라 부릅니다. 그를 설명하는 데 그보다 짧은 말은 없습니다. 하지만 서민으로 태어났다고 저절로 서민을 위해 일하게 되지는 않는다는 것을 그는 압니다.\n\n눈을 뜬 대통령은 연설문 첫 장을 펼치고 맨 위에 직접 한 줄을 적었습니다. '빚 때문에 머리채를 잡히는 사람이 없는 나라.' 그리고 그 아래에 첫 문장을 썼습니다.\n\n\"오늘부터 다시 문을 여십시오. 정부가 함께 열겠습니다.\""
 tfrkphn.59.kp:0 "여당 지도부와의 당정협의가 세 시간째 이어지고 있습니다. 탁자 위에는 내년도 예산안이 펼쳐져 있고 당이 원하는 것은 분명합니다. 선거가 다가오고 있어서 지역구마다 다리와 도로, 체육관이 필요한데, 그 돈을 마련할 가장 손쉬운 곳이 국방 예산입니다.\n\n\"전쟁은 끝났습니다, 대통령님. 국민들은 이제 총보다 밥을 원합니다.\"\n\"전력증강 사업 몇 개만 몇 년 늦추면 됩니다. 아무도 모릅니다.\"\n\n대통령은 말없이 예산안을 넘겼고, 3축 체계 예산 옆에 연필로 그은 줄이 보였습니다. 누군가 미리 지워 둔 자리입니다. 그는 연필을 내려놓았습니다.\n\n\"여러분 말이 맞을 수도 있습니다. 선거는 이겨야 하지요. 당도 살아야 하고.\""
 tfrkphn.59.kp2:0 "몇몇 의원의 얼굴이 풀렸고, 대통령은 천천히 자리에서 일어섰습니다.\n\n\"지난 30년간 나는 당에 충성하는 정치를 해왔다\n이제부터 나는 국익에 충성하는 정치를 해오겠다\"\n\n회의실이 조용해졌고, 대통령은 지워진 줄 위에 다시 동그라미를 쳤습니다.\n\n\"국방은 정쟁의 대상이 아닙니다. 여당의 것도, 야당의 것도 아닙니다. 다음 전쟁은 우리가 준비한 만큼만 이길 수 있습니다.\"\n\n그날 밤 당 지도부에서는 대통령이 당을 버렸다는 말이 돌았습니다. 다음 날 아침 우리는 국방부 장관의 책상에 한 장짜리 지시를 올렸습니다. '전력증강 사업, 한 건도 미루지 말 것.'"
 tfrkphn.759.next:0 "이어서 본다"
 tfrkphn.60.kp:0 "새벽 두 시인데 청와대 관저의 불은 아직 꺼지지 않았고, 대통령은 오래된 습관대로 휴대폰을 들었습니다. 우리가 다듬어 올린 담화문은 옆에 밀어 두고, 직접 한 글자씩 눌러 쓰는 글입니다. 그 글은 이렇게 시작합니다.\n\n19세기 말부터 20세기 중반까지 60여 년 동안 한반도를 중심으로 국제전쟁이 다섯 번 일어났습니다. 청일전쟁, 러일전쟁, 중일전쟁, 태평양전쟁, 그리고 6.25전쟁입니다. 그중 넷은 일본이 일으켰고 하나는 북한이 일으켰습니다.\n\n전쟁은 힘의 균형이 무너질 때 일어나고, 균형이 유지되면 일어나지 않는다고 대통령은 썼습니다. 사람들은 발칸반도를 유럽의 화약고라 부르지만 역사를 보면 한반도야말로 세계의 화약고였던 시대가 있었다는 것입니다.\n\n그 화약고가 6.25 이후 70년 넘게 평화를 지킨 것은 휴전선을 사이에 두고 두 진영이 팽팽하게 맞섰기 때문입니다. 한쪽에는 북한과 중국, 러시아가 있었고 다른 쪽에는 한국과 미국, 일본이 있었습니다. 때로는 낭만적 민족주의와 거짓 평화를 내세워 그 동맹을 흔드는 이들도 있었다고 그는 적었습니다."
 tfrkphn.60.kp2:0 "그리고 이제 미국은 없습니다. 대통령은 거기서 손가락을 멈췄다가 한참 뒤에 다음 줄을 썼습니다.\n\n평화는 거저 주어지지 않는다. 힘에 의한 무장평화만이 진정한 자유와 평화를 가져다준다.\n\n한때 서로 죽고 죽이던 미국과 일본이 손을 잡았고, 한국과 베트남은 화해하고 함께 미래로 가고 있습니다. 어제의 적이 오늘의 동맹이 되는 것이 국제정치라는 말이 이어졌습니다.\n\n미국이 떠난 자리를 누가 대신 채워 주지는 않습니다. 북한이 핵을 가졌다면 우리도 그에 맞설 힘을 가져야 합니다. PDTO의 이웃들과 손을 잡되 마지막 한 걸음은 우리 힘으로 버텨야 합니다. 남북 핵균형, 그것이 앞으로 이 나라 국방의 원칙이라고 글은 끝납니다.\n\n게시 버튼을 누르고 나서야 그는 휴대폰을 내려놓았습니다. 아침이 되자 신문들은 일제히 대통령의 새벽 글을 1면에 올렸습니다. 어떤 신문은 '무장평화론'이라 이름 붙였고 어떤 신문은 '핵 도미노의 시작'이라 썼습니다."
 tfrkphn.760.next:0 "이어서 본다"
 tfrkphn.61.kp:0 "국방부 대강당입니다. 대통령은 단상에 서자마자 우리가 써 준 원고를 덮었습니다.\n\n\"군 개혁을 해야 합니다.\n\n현대전은 사병의 수가 아니라 사병의 질이 국방력을 좌우합니다. 아이는 줄어드는데, 우리는 아직도 머릿수로 군대를 채우려 합니다. 그 방식은 이제 끝났습니다.\n\n모병제를 대폭 확대하겠습니다. 첨단 장비를 다룰 줄 아는 남녀 전문병사를 크게 늘리겠습니다. 그만큼 징병제의 부담은 줄어듭니다.\n\n오늘부터 여성도 일반병으로 지원할 수 있습니다. 장교와 부사관만이 아닙니다. 소총을 들고 전방 철책을 지키는 병사의 자리도 이제 남녀 모두에게 열립니다.\n\n지금까지의 군 현대화는 사병 복지에 초점을 맞췄습니다. 이제는 장비를 현대화해야 합니다. 오래 복무할 기간병의 대우를 높여야 합니다. 실제로 싸워 이기는 전투력을 키우는 데 집중해야 합니다.\n\n결국 우리도 모병제를 근간으로 갈 수밖에 없습니다. 오늘이 그 첫걸음입니다.\""
 tfrkphn.61.kp2:0 "질문이 쏟아졌습니다. 예산은 어디서 나오느냐, 지원자가 모자라면 어떻게 하느냐는 것이었고 대통령은 짧게 답했습니다.\n\n\"좋은 대우를 해 주면 사람은 옵니다. 안 오면 대우가 모자란 겁니다.\"\n\n한 달 뒤 대전의 한 병무청 민원실에서 있었던 일이 우리에게 보고되었습니다. 스물한 살 김지원은 지원서를 앞에 두고 한참 펜을 쥐고 있었습니다. 지원 분야 칸에는 '일반병(육군 보병)'이라고 적혀 있었습니다.\n\n\"정말 괜찮겠어요? 훈련소부터 남자들이랑 똑같이 받는 건데.\"\n\n담당 주무관이 조심스럽게 묻자 그녀는 고개를 끄덕였습니다.\n\n\"똑같이 받으려고 온 거예요.\"\n\n도장이 찍혔습니다. 그날 하루 동안 전국 병무청에 들어온 여성 일반병 지원서는 천 장을 넘었습니다."
 tfrkphn.761.next:0 "이어서 본다"
 tfrkphn.62.kp:0 "충남 태안 안흥, 국방과학연구소 종합시험장에 바닷바람이 거세게 불고 있습니다. 관측소 유리창 너머로 이동식 발사대가 천천히 몸을 일으켰고, 대통령 옆에 선 합참 작전본부장이 낮은 목소리로 설명을 시작했습니다.\n\n\"지금부터 보실 것은 하나의 체계입니다. 따로따로가 아닙니다.\"\n\n첫째는 킬체인입니다. 북한의 핵미사일이 발사대에 올라가는 순간을 위성과 정찰기가 잡아내고, 그 정보는 몇 분 안에 타격 부대로 넘어갑니다. 미사일이 하늘로 오르기 전에 발사대를 먼저 부수는 것입니다.\n\n둘째는 한국형 미사일 방어입니다. 그래도 날아오는 미사일은 하늘에서 떨어뜨립니다. 전국의 레이더가 궤적을 그리고 요격미사일이 그 길목을 막습니다.\n\n셋째는 대량응징보복입니다. 그래도 한 발이 떨어진다면 그 대가는 평양의 지휘부가 치르고, 핵을 쓰는 순간 정권이 끝난다는 것을 저쪽이 알아야 합니다."
 tfrkphn.62.kp2:0 "\"하나라도 빠지면 나머지 둘이 의미가 없습니다.\"\n\n대통령은 고개를 끄덕였습니다. 몇 달 전 당정협의 탁자 위에서 누군가 연필로 지워 두었던 바로 그 예산입니다.\n\n카운트다운이 끝나자 굉음과 함께 현무 미사일이 흰 연기를 끌며 서해 위로 솟구쳤습니다. 관측소의 유리창이 낮게 떨렸습니다.\n\n\"양산은 언제부터 됩니까.\"\n\"예산만 그대로 가면 올해 안에 시작합니다.\"\n\"그대로 갑니다. 한 푼도 안 깎습니다.\"\n\n대통령은 멀어지는 연기를 끝까지 바라보았습니다.\n\n\"평화는 힘의 균형 위에서만 지켜집니다. 우리가 먼저 쏘려고 만드는 게 아닙니다. 저쪽이 절대 먼저 쏘지 못하게 만드는 겁니다.\"\n\n그해 겨울 전국의 산꼭대기에 새 레이더 기지가 들어섰고, 현무의 생산 라인은 밤에도 멈추지 않습니다."
 tfrkphn.762.next:0 "이어서 본다"
 tfrkphn.63.kp:0 "도쿄의 주일 대한민국 대사관에서 있었던 일인데, 책상 위 조간신문 1면에는 며칠 전 대통령이 새벽에 올린 글이 실려 있었습니다. 남북 핵균형. 2등서기관 김상주는 그 기사를 대충 넘겼습니다. 그때는 그것이 자기 일이 될 줄 몰랐습니다.\n\n퇴근을 한 시간 앞둔 오후 다섯 시에 우리가 보낸 3급 비밀 전문이 대사관에 닿았습니다. 암호를 풀어 출력한 종이를 든 김상주는 한참 동안 자리에서 일어나지 못했습니다. 세 번을 다시 읽어도 내용은 바뀌지 않았고, 그는 서류를 봉투에 넣고 대사실 문을 두드렸습니다.\n\n\"대사님, 긴급하게 보고드릴 서류가 있습니다.\"\n\n대사는 안경을 고쳐 쓰며 웃었습니다.\n\n\"뭔데, 뭐 핵이라도 만든다는 거냐?\"\n\"죄송하지만, 그게 맞습니다.\""
 tfrkphn.63.kp2:0 "대사의 얼굴이 공포와 경악으로 일그러지기 시작했습니다.\n\n겉으로 보면 평범한 문서입니다. 제목은 'PDTO 회원국 간 원자력 협력 강화 방안'이고, 한일 두 나라가 원자력 분야의 협력을 넓힌다는 외교 문서의 말투로 쓰여 있습니다.\n\n첨부 문서를 넘길수록 단어가 달라집니다. 고농축 우라늄의 보관 위치와 수량, 미국이 무너지며 주인을 잃은 옛 주한미군과 주일미군 전술핵의 행방, 두 나라 기술진이 함께 쓸 시설의 후보지가 차례로 나옵니다. 마지막 장에는 우리가 적어 넣은 지시 한 줄이 있습니다. \"일본 정부 최고위층에 대통령 친서를 비공개로 전달할 것.\"\n\n대사는 서류를 덮었고 한참 뒤에야 입을 열었습니다.\n\n\"우리 좆된 거 맞냐?\"\n\n김상주는 대답하지 못했습니다. 그날 대사관의 전깃불은 꺼지지 않았습니다."
 tfrkphn.763.next:0 "이어서 본다"
 tfrkphn.64.kp:0 "오후 3시 11분, 판문점 공동경비구역입니다. 북쪽 도로를 달려온 군용 지프 한 대가 배수로에 바퀴가 빠져 멈춰 섰습니다. 운전석에서 뛰어내린 북한군 병사가 남쪽을 향해 내달렸고, 몇 초 뒤 판문각에서 쏟아져 나온 추격조가 총을 쏘기 시작했습니다.\n\n마흔 발이 넘는 총탄이 군사분계선을 넘어 날아들었고, 추격병 하나는 귀순자를 쫓아 분계선 남쪽까지 몇 걸음을 내려왔다가 황급히 돌아섰습니다.\n\n이번에 우리는 침묵하지 않았습니다. JSA 경비대대의 확성기가 울렸습니다. \"북한군은 즉시 사격을 중지하라. 정전협정 위반이다.\" 경고 방송이 끝나기도 전에 우리 군의 경고사격이 분계선 너머 빈 땅에 꽂혔고, 그 사이 부사관 둘이 포복으로 다가가 쓰러진 귀순자를 끌어냈습니다.\n\n그날 저녁 국방부 브리핑룸에서 우리는 이렇게 발표했습니다.\n\n\"오늘 아침 판문점에서 귀순자가 왔습니다.\n\n북한군은 귀순자를 잡으려고 정전협정을 위반했습니다. 우리 측 영토에 총을 쏘았습니다. 우리 군은 귀순자의 안전을 가장 먼저 확보했습니다. 그리고 북측에 경고 방송과 경고사격을 했습니다.\n\n귀순자는 이국종 박사의 지휘 아래 수술을 받았습니다. 지금은 건강을 회복하며 보호 조치를 받고 있습니다.\""
 tfrkphn.64.kp2:0 "기자들의 질문은 두 갈래였고, 보복 사격을 해야 했던 것 아니냐는 쪽과 경고사격이 지나쳤던 것 아니냐는 쪽입니다.\n\n같은 시각 청와대 지하 벙커에서 대통령은 합참의 보고를 끝까지 듣고 짧게 정리했습니다.\n\n\"북한 체제에 간섭하지 않습니다. 저쪽이 어떻게 살든, 누구를 지도자로 모시든 그건 저쪽 일입니다. 그러나 우리 땅에 넘어온 사람은 우리가 지킵니다. 그리고 우리 땅으로 날아온 총알에는 반드시 답합니다. 거기까지입니다. 한 발도 더 나가지 않습니다. 안흥에서 현무를 쏘아 올린 것도 쏘지 않기 위해서였습니다.\"\n\"그 원칙을 북측에 그대로 전하십시오. 간섭하지도, 간섭받지도 않는다. 힘의 균형 위에서 각자 살자고.\"\n\n그날 밤 우리는 판문점 연락채널로 짧은 통지문을 넘겼고, 북쪽에서는 답이 오지 않았습니다. 다만 다음 날부터 분계선 북쪽의 추격조 초소가 뒤로 물러났습니다.\n\n수원의 한 대학병원 중환자실에서 두 차례의 대수술이 이어지는 동안 귀순자의 몸에는 남쪽 사람들의 피가 1만 2천cc 넘게 들어갔습니다. 일주일 뒤 스스로 숨을 쉬기 시작한 그가 처음 한 말은 짧았습니다.\n\n\"여기가... 남쪽입니까?\""
 tfrkphn.764.next:0 "이어서 본다"
 tfrkphn.65.kp:0 "외교부 청사 9층, 동북아국 중국과입니다. 박영환 국장은 책상 서랍을 정리하다가 오래된 사진 한 장을 꺼냈습니다. 1992년 8월 24일 베이징 댜오위타이, 한중 수교 서명식 뒤편에 앳된 얼굴의 신입 외교관이 서 있습니다. 서른 해 전의 자신입니다.\n\n그 시절에는 모두가 북방을 말했습니다. 노태우 정부는 모스크바와 수교했고 2년 뒤에는 베이징과 손을 잡았습니다. 공산권이든 아니든 문을 열면 길이 생긴다고 믿었고, 이념보다 국익이 먼저였습니다. 사람들은 그것을 북방정책이라고 불렀습니다.\n\n오늘 아침 우리가 장관실을 거쳐 내려보낸 지시는 한 장입니다.\n\n'EADI 회원국과의 고위급 교류 전면 재검토. 대중국 신규 협력사업 동결. 동남아 PDTO 우호국과의 안보협력 최우선 추진.'\n\n\"국장님, 이거 사실상... 단교 준비 아닙니까?\"\n\n젊은 사무관이 조심스럽게 물었고, 박 국장은 대답 대신 창밖을 봤습니다. 광화문 거리에는 오성홍기를 불태우는 시위대와 그것을 막아선 경찰이 뒤엉켜 있었습니다.\n\n\"단교는 아니야. 아직은.\""
 tfrkphn.65.kp2:0 "전쟁이 모든 것을 바꿔 놓았습니다. 도쿄 대사관에서는 밤새 불이 꺼지지 않는다는 소문이 돌았고 판문점에서는 경고사격이 울렸습니다. 중국은 대만을 쳤고 EADI라는 이름으로 이웃들을 줄 세웠습니다. 이제 서울에서 중국은 교역 상대로 불리지 않으며 신문은 위협이라고 씁니다.\n\n그날 오후 국무회의에서 대통령은 신남방정책을 다시 꺼내 들었습니다. 베트남과 필리핀, 인도네시아처럼 중국의 남쪽 바다를 둘러싼 나라들과 손을 잡겠다는 것이고 명분은 억지력입니다.\n\n신문들은 저마다 이름을 붙였습니다. 어떤 신문은 '가치 외교'라 했고 어떤 신문은 더 오래된 이름을 꺼냈습니다. '70년 만에 돌아온 이승만식 반공 외교.'\n\n공산 국가와는 어떤 거래도 하지 않던 시절, 친구와 적을 이념으로 가르던 시절이 있었습니다. 북방정책이 그 시절을 끝냈다고 박 국장은 믿었는데 서른 해 만에 시계가 거꾸로 돌고 있습니다.\n\n퇴근길에 박 국장은 수교 사진을 서랍 깊숙이 다시 넣었습니다. 버리지는 않았습니다.\n\n\"언젠가 다시 꺼낼 날이 오겠지.\"\n\n혼잣말처럼 중얼거렸지만 그 말을 믿는 사람은 청사 안에 그리 많지 않습니다. 우리도 장담하지 못합니다."
 tfrkphn.765.next:0 "이어서 본다"
 tfrkphn.66.kp:0 "대통령이 회의에서 꺼낸 옛이야기가 하나 있습니다. 춘추시대 진나라에 위무자라는 장수가 있었습니다. 그에게는 아끼는 첩이 하나 있었는데 둘 사이에는 자식이 없었습니다. 위무자는 병들어 눕자 아들 위과를 불렀습니다.\n\n\"내가 죽거든 저 사람을 좋은 곳에 개가시켜라.\"\n\n그러나 병이 깊어지자 말이 바뀌었습니다.\n\n\"내가 죽거든 저 사람을 나와 함께 묻어라.\"\n\n그 시절에는 주인이 죽으면 아끼던 사람을 함께 묻는 순장의 풍습이 있었습니다. 아버지가 세상을 떠나자 위과는 두 유언 사이에서 오래 고민하다가 첫 번째 말을 따랐습니다.\n\n\"사람은 병이 깊으면 정신이 흐려진다. 나는 아버지가 맑은 정신일 때 하신 말씀을 따르겠다.\"\n\n위과는 그 여인을 살려 좋은 집안에 시집보냈습니다. 몇 해 뒤 서쪽의 진나라가 쳐들어왔고 위과는 보씨 땅에서 적을 맞았습니다. 적장은 두회라는 이름난 장사였는데, 그가 휘두르는 창 앞에서 병사들이 줄줄이 쓰러졌습니다."
 tfrkphn.66.kp2:0 "그때 이상한 일이 일어났습니다. 말을 몰아 달려들던 두회의 발목을 들판의 풀이 휘감은 것입니다. 누군가 풀을 엮어 매듭을 지어 놓았고, 천하장사는 그 풀매듭에 걸려 넘어져 위과에게 사로잡혔습니다. 그날 밤 위과의 꿈에 한 노인이 나타났습니다.\n\n\"나는 그대가 시집보낸 여인의 아비요. 그대가 아버지의 맑은 말씀을 따라 내 딸을 살렸기에, 오늘 풀을 묶어 그 은혜를 갚았소.\"\n\n풀을 맺어 은혜를 갚는다는 결초보은이 여기서 나왔습니다. 죽은 사람도 은혜를 잊지 않는데 산 나라가 잊어서야 되겠느냐고 대통령은 물었습니다.\n\n나라 사이에도 은혜와 빚이 있습니다. 이번 전쟁에서 우리에게 배를 보내 준 나라가 있었고 항구를 닫은 나라가 있었습니다. 갚을 보에는 받은 은혜를 갚는다는 뜻과 저지른 잘못에 값을 치르게 한다는 뜻이 함께 들어 있고, 우리는 둘 다 하기로 했습니다.\n\n외교부는 전쟁 때 각국이 한 일을 정리한 명단부터 만들고 있습니다."
 tfrkphn.766.next:0 "이어서 본다"
 tfrkphn.67.kp:0 "우리가 PDTO 가입을 발표하던 날 아침, 바다 건너 중화민국 금문현의 한 해안 초소에서 있었던 일입니다. 새벽 다섯 시, 상등병 린웨이는 망원경을 눈에서 떼고 손등으로 눈을 비볐습니다. 바다 건너편이 밝아 오고 있었습니다.\n\n샤먼까지는 직선거리로 몇 킬로미터인데, 맑은 날이면 맨눈으로도 고층 빌딩의 창문 개수를 셀 수 있습니다. 빌딩 숲 아래로 해안도로를 달리는 차들의 불빛이 보였습니다. 저쪽 사람들도 지금쯤 출근 준비를 할 것입니다.\n\n그 사이 바다 한가운데에 작은 바위섬이 하나 떠 있습니다. 섬 전체가 콘크리트 벙커이고, 할아버지 세대가 포탄을 맞아 가며 지킨 곳입니다. 1958년에 44일 동안 47만 발의 포탄이 이 섬들 위로 떨어졌다고 린웨이는 학교에서 배웠습니다.\n\n얼마 전 다시 포성이 울렸고, 린웨이는 그날을 잊지 못합니다. 섬 전체가 흔들렸고 통신이 끊겼으며 모두가 이번에는 끝이라고 생각했습니다. 미국은 제 나라 안의 전쟁으로 바빠 오지 않았습니다."
 tfrkphn.67.kp2:0 "대신 다른 배들이 왔고, 일본의 호위함과 필리핀의 초계정, 그리고 태극기를 단 구축함이 해협으로 들어왔습니다. 초소의 무전기에서 처음 듣는 언어가 흘러나왔고, 린웨이는 그것이 한국어라는 것을 한참 뒤에야 알았습니다.\n\n초소 안 라디오에서 아침 뉴스가 흘러나왔습니다.\n\n\"대한민국 정부는 오늘 PDTO에 정식 가입한다고 발표했습니다. 이로써 대한민국은 일본, 중화민국 등 회원국과 집단방위 의무를 공유하게 됩니다....\"\n\n선임병 천 하사가 담배를 물고 초소 안으로 들어왔습니다.\n\n\"들었어? 한국이 들어왔대.\"\n\"들었습니다.\"\n\"우리 아버지 때는 한국이 우리를 버렸다고들 했지. 하룻밤 사이에 대사관 문을 닫았다고. 그런데 이번엔 와서 같이 싸웠어. 이제는 아예 한 편이 됐고.\"\n\n린웨이는 다시 망원경을 들었고, 바다 건너 빌딩들 위로 해가 떠오르고 오성홍기가 걸린 건물 옥상이 붉게 빛났습니다. 바다도 거리도 그대로입니다. 달라진 것은 초소 뒤 부두에 정박한 배들의 깃발입니다.\n\n\"하사님.\"\n\"응.\"\n\"이제 이 섬, 우리만 지키는 거 아니죠.\"\n\n천 하사는 대답 대신 담배 연기를 길게 내뿜고 고개를 끄덕였습니다."
 tfrkphn.767.next:0 "이어서 본다"
 tfrkphn.68.kp:0 "서울 종로구, 광화문 네거리의 한 오피스 빌딩입니다. 오전 열 시에 빌딩 입구 옆에 붙어 있던 현판이 내려졌습니다. '주한국 타이베이대표부'. 30년 넘게 대사관이라는 이름을 쓰지 못한 채 그 자리를 지킨 이름입니다.\n\n새 현판이 올라갔습니다. '주대한민국 중화민국 대사관'.\n\n현판을 덮은 천이 걷히는 순간 건물 앞에 모인 사람들 사이에서 박수가 터졌습니다. 태극기와 청천백일만지홍기가 나란히 게양대에 올랐고, 애국가에 이어 중화민국 국가가 연주되었습니다.\n\n맨 앞줄에는 서울에서 나고 자란 백발의 화교 노인이 서 있었습니다. 그는 손수건으로 눈가를 눌렀습니다.\n\n\"1992년 8월이었지요. 명동 대사관에서 청천백일기가 내려가는 걸 봤습니다. 교민들이 울면서 국가를 불렀어요. 하룻밤 사이에 우리는 친구 나라에서 없는 나라가 됐습니다. 대사관 건물도 그날로 남의 것이 됐고요.\"\n\"그런데 이번 전쟁 때 한국이 약속을 지켰어요. 끝까지 같이 가겠다고 했고, 정말로 끝까지 왔어요.\"\n\n신임 중화민국 대사가 단상에 올랐고, 그는 준비한 원고 대신 서툰 한국어로 짧게 말했습니다."
 tfrkphn.68.kp2:0 "\"30여 년 전 우리는 명동에서 문을 닫고 떠났습니다. 오늘 광화문에서 그 문을 다시 엽니다. 이번에는 닫지 않겠습니다.\"\n\n같은 시각, 걸어서 20분 거리의 명동에서는 중국대사관 앞 골목이 붉은 깃발로 가득했습니다. 수백 명의 중국인 유학생들이 대사관 정문을 향해 오성홍기를 흔들며 의용군행진곡을 불렀습니다. 항일전쟁 때 만들어진, 침략자에 맞서 일어서라는 노래가 이제는 우리를 향해 울려 퍼졌습니다.\n\n경찰 기동대가 골목 양쪽을 막아섰습니다. 지나가던 시민들이 걸음을 멈추고 휴대폰을 들었고 누군가 중얼거렸습니다.\n\n\"저 건물이 원래 대만 대사관이었다는 건 알까.\"\n\n노랫소리는 점점 커졌습니다. 앞줄의 학생 하나가 목이 터져라 소리쳤는데, 그 얼굴에는 분노와 함께 억울함 같은 것이 섞여 있었습니다. 그들에게 이것은 배신입니다. 한국은 하나의 중국을 약속했고 그 약속을 깼다는 것입니다. 우리는 그 말에 답하지 않기로 했습니다.\n\n광화문의 연주가 끝난 뒤에도 명동의 노래는 한 시간 넘게 이어졌고 경찰은 해가 질 때까지 골목을 지켰습니다."
 tfrkphn.768.next:0 "이어서 본다"
 tfrkphn.69.kp:0 "인과응보는 인할 인, 열매 과, 응할 응, 갚을 보를 씁니다. 원인이 있으면 결과가 있고, 행한 일에는 반드시 그에 맞는 갚음이 돌아온다는 말입니다.\n\n본래 불교의 가르침에서 나왔습니다. 콩을 심은 자리에서 콩이 나고 팥을 심은 자리에서 팥이 납니다. 착한 씨앗은 좋은 열매를 맺고 악한 씨앗은 나쁜 열매를 맺는다 하여 선인선과, 악인악과라고도 합니다. 열매가 언제 맺힐지는 알 수 없어도 맺히지 않는 씨앗은 없고, 서양에도 뿌린 대로 거둔다는 같은 말이 있습니다."
 tfrkphn.69.kp2:0 "앞서 갚을 보에는 두 가지 뜻이 있다고 했습니다. 은혜를 갚는 것이 결초보은이고, 잘못에 값을 치르게 하는 것이 인과응보입니다.\n\n전쟁은 저절로 일어나지 않고, 누군가 먼저 바다를 건넜고 누군가 먼저 포를 쏘았습니다. 그 포탄에 대만의 섬들이 불탔고 우리 젊은이들이 바다에 묻혔습니다. 전쟁이 끝났다고 그 씨앗이 사라지지는 않습니다.\n\n대가를 묻지 않으면 같은 씨앗은 다시 뿌려집니다. 다음 전쟁을 막으려면 이번 전쟁의 값을 받아야 한다는 것이 우리의 판단입니다.\n\n그래서 우리는 묻기로 했습니다. 전쟁을 일으킨 쪽이 그 열매를 거두게 할 것입니다. 정부는 배상 청구 목록을 만들기 시작했습니다."
 tfrkphn.769.next:0 "이어서 본다"
 tfrkphn.70.kp:0 "군대에는 오래된 격언이 있습니다. 아마추어는 전술을 말하고 전문가는 보급을 말한다는 것입니다. 총이 있어도 탄이 없으면 막대기이고, 탄이 있어도 밥이 없으면 병사는 쓰러집니다. 그리고 탄과 밥이 다 있어도 기름이 없으면 전차도 군함도 전투기도, 탄과 밥을 실어 나를 트럭조차도 움직이지 않습니다.\n\n1941년 미국이 석유 수출을 끊자 일본은 남쪽의 유전을 차지하려고 진주만을 쳤습니다. 기름 때문에 시작한 전쟁이었고 기름이 바닥나 진 전쟁이었습니다. 전쟁 말기 일본의 전함들은 연료가 없어 항구에 묶여 있었습니다.\n\n1944년 겨울 아르덴 숲에서 독일군 전차들은 연합군의 연료 창고를 노리고 진격했습니다. 그러나 창고에 닿기 전에 기름이 떨어졌고, 승무원들은 멀쩡한 전차를 버리고 걸어서 돌아갔습니다.\n\n이번 전쟁에서 우리도 같은 일을 겪었고, 대만해협에 들어간 우리 함대가 가장 먼저 부딪힌 적은 연료였습니다. 우리는 기름 한 방울 나지 않는 나라이고 쓰는 석유의 거의 전부를 바다 건너에서 들여옵니다. 그 바닷길을 지켜 주던 미국 해군은 사라졌습니다. 전쟁이 시작되자 중동에서 오던 유조선들이 말라카 해협 앞에서 멈칫거렸고 보험료는 하루가 다르게 치솟았습니다."
 tfrkphn.70.kp2:0 "구축함 함장들은 작전 해역보다 남은 연료 눈금을 더 자주 들여다봤습니다. 기름이 떨어지면 돌아가야 했고 돌아가면 그 자리는 비었습니다. 우리는 이제 그 교훈을 제도로 만듭니다. PDTO 회원국들은 태평양의 네 항구를 에너지 거점으로 묶기로 했습니다.\n\n§Y부산§! 한반도와 동해의 관문. 우리 해군과 산업의 심장에 기름을 댑니다.\n§Y요코하마§! 도쿄만의 입구. 일본 열도의 정유와 비축을 맡습니다.\n§Y가오슝§! 대만 남부의 군항. 해협 최전선에 기름을 댑니다.\n§Y시드니§! 남태평양의 후방 기지. 전선이 아무리 흔들려도 무너지지 않을 마지막 창고입니다.\n\n네 항구에는 공동 비축 기지가 들어서고, 한 곳의 탱크가 마르면 나머지 세 곳이 채웁니다. 어느 한 나라의 바닷길이 막혀도 연합 전체의 기름은 마르지 않습니다. 다음 전쟁에서 우리 함장들은 연료 눈금을 덜 들여다봐도 될 것입니다."
 tfrkphn.770.next:0 "이어서 본다"
 tfrkphn.71.kp:0 "1994년 11월 호주 시드니에서 아시아태평양경제협력체(APEC) 정상회의를 마친 김영삼 대통령이 기자들 앞에 섰습니다. 그는 그 자리에서 세계화라는 새 국정 목표를 내놓았습니다.\n\n좁은 한반도를 벗어나 세계로 나가자는 말이었습니다. 우물 안에서 남북끼리, 동서끼리 싸우지 말고 바깥 세계와 경쟁해서 이기자는 뜻이었습니다. 정부에는 세계화추진위원회가 생겼고 2년 뒤 대한민국은 선진국 클럽이라 불리던 OECD에 가입했습니다.\n\n그 무렵 모래시계 검사로 이름을 알린 한 사람이 정치에 뛰어들었습니다. 1996년 총선을 앞두고 그를 정치판으로 불러낸 사람이 김영삼이었고, 그 검사가 지금 우리의 대통령입니다.\n\n이듬해 IMF가 왔고 세계화는 실패한 말이 되었습니다. 문을 서둘러 열었고 준비 없이 바다로 나갔다고들 했습니다. 기업들은 쓰러졌고 거리에는 실업자가 넘쳤습니다. 사람들은 세계화라는 말을 들으면 금 모으기 운동과 눈물부터 떠올렸습니다."
 tfrkphn.71.kp2:0 "대통령은 그때를 두고 방향은 맞았는데 순서가 틀렸다고 말합니다. 바깥으로 나가기 전에 안을 다졌어야 했고, 남의 기준을 따라가기 전에 내 이익을 먼저 셈했어야 했다는 것입니다.\n\n30여 년이 지났습니다. 미국은 무너졌고 세계는 다시 쪼개졌습니다. 이념의 줄을 서면 안전하던 시대는 끝났고, 이제 누구와 손을 잡을지는 국익이 정합니다. 그래서 우리는 서쪽의 인도를 봅니다.\n\n인도는 14억의 시장과 세계에서 가장 젊은 노동력을 가졌습니다. 어느 진영에도 몸을 맡기지 않고 제 이익을 지켜 온 나라여서 이념보다 국익을 먼저 셈하는 법을 누구보다 잘 압니다.\n\n인도 동부 오디샤 주에는 이 나라 크롬의 거의 전부가 묻혀 있고, 크롬이 없으면 스테인리스강도 전차의 장갑도 제트엔진의 합금도 만들 수 없습니다. 우리는 그 크롬을 가져오고 인도에는 공장과 기술과 일자리를 가져갑니다.\n\n시드니에서 시작된 세계화는 실패로 끝났습니다. 이번에 우리는 안부터 다지고 나갑니다."
 tfrkphn.771.next:0 "이어서 본다"
 tfrkphn.72.kp:0 "11월 11일 오전 11시, 부산 남구 유엔기념공원에 사이렌이 울렸습니다. 묘역에 선 사람들이 일제히 고개를 숙였고, 같은 시각 마닐라와 방콕, 캔버라와 런던, 오타와에서도 사람들이 부산 쪽을 향해 서서 1분 동안 묵념했습니다. 6.25전쟁에 목숨을 바친 유엔군 용사들을 기리는 국제 추모식, 턴 투워드 부산입니다.\n\n이곳은 세계에서 하나뿐인 유엔군 묘지인데, 이름도 잘 모르던 나라를 지키러 와서 돌아가지 못한 2천여 명이 잠들어 있습니다.\n\n묵념이 끝나자 대통령이 헌화대 앞으로 걸어 나왔고 그 뒤로 참전국 대사들이 줄지어 섰습니다. 맨 앞줄에는 필리핀과 태국의 대사가 있었는데, 1950년에 아시아에서 가장 먼저 군대를 보낸 나라들입니다. 그때 필리핀은 우리보다 잘사는 나라였고 우리에게 원조를 주던 나라였습니다."
 tfrkphn.72.kp2:0 "헌화를 마친 대통령이 연단에 섰습니다.\n\n\"70여 년 전, 여러분의 할아버지들은 지도에서 찾기도 힘든 나라에 왔습니다. 그분들이 흘린 피 위에 오늘의 대한민국이 서 있습니다. 우리는 그 빚을 잊은 적이 없습니다. 이번 전쟁에서 우리는 대만 곁에 섰습니다. 오늘은 아시아의 친구들과 손을 잡습니다. 모두 그 빚을 갚는 일입니다.\"\n\"오늘부터 대한민국은 참전국 후손들에게 장학금을 줍니다. 참전국과의 교역과 방산 협력도 넓히겠습니다. 은혜를 아는 나라는 친구를 잃지 않습니다.\"\n\n객석의 한 노인이 지팡이를 짚고 일어나 경례했습니다. 필리핀에서 온 참전용사의 아들이었습니다."
 tfrkphn.772.next:0 "이어서 본다"
 tfrkphn.120.kp:0 "대통령이 말하는 선진대국이 무엇인지 우리는 한 번 정리해 둘 필요가 있습니다. 선진국은 통계표 위의 숫자만으로 완성되지 않습니다. 국내총생산이 아무리 커도 그 부가 소수의 손에만 머무는 나라는 큰 나라일 수는 있어도 앞선 나라는 못 됩니다. 경제의 힘과 사회의 신뢰, 시민의 의식, 도덕의 무게라는 네 기둥이 함께 자라야 지붕이 섭니다.\n\n§Y첫째, 강한 경제가 모두의 삶으로 이어지는 나라§!\n1인당 국민소득이 4만 달러를 바라본다 해도 중산층이 무너지고 서민의 하루가 버거운 나라는 선진대국이 못 됩니다. 성장의 열매가 고르게 나뉘고 출발선이 공정해야 합니다. 국민이 내일을 두려워하지 않을 때 경제는 비로소 국력이 됩니다.\n\n§Y둘째, 서로를 믿을 수 있는 나라§!\n법과 제도가 제자리를 지키고 부정과 부패가 설 자리를 잃어야 합니다. 국제 비교에서 우리 사회의 신뢰 수준은 여전히 선진국 평균에 크게 못 미칩니다. 국민이 정부를 믿고 기업을 믿고, 무엇보다 서로를 믿을 때 사회는 힘을 얻습니다."
 tfrkphn.120.kp2:0 "§Y셋째, 시민의 품격이 살아 있는 나라§!\n아무도 보지 않는 신호등 앞에서도 멈춰 서는 사회, 낯선 이를 배려하는 일이 습관으로 굳은 사회, 가진 사람이 나눔을 책임으로 여기는 사회입니다. 이런 작은 의식들이 쌓여 나라의 품격이 됩니다.\n\n§Y넷째, 윗물이 맑은 나라§!\n나라의 얼굴은 결국 그 나라 사람들이고 그 얼굴의 맨 앞에는 지도층이 섭니다. 지도자가 먼저 모범을 보이고 정치가 깨끗해야 합니다. 사람을 재는 기준이 학연과 지연과 혈연에서 실력과 공정함으로 바뀔 때 사회는 앞으로 나아갑니다.\n\n§Y맺으며§!\n국민이 잘사는 나라, 깨끗한 나라, 경제가 강한 나라 가운데 하나만 고를 수는 없습니다. 그리고 그 모든 것의 출발점은 가장 높은 자리에 앉은 사람의 청렴입니다. 지금 이 나라에서 성공으로 가는 길은 여전히 인맥이라는 좁은 문을 지나는 경우가 많습니다. 그 문은 몇 사람에게는 지름길이 되지만 나라 전체를 조금씩 갉아먹습니다.\n\n다만 우리의 첫걸음은 장부에서 시작해야 합니다. 전쟁이 끝난 나라의 곳간은 비어 있고 수출 통계는 매달 붉게 물들고 있습니다."
 tfrkphn.820.next:0 "이어서 본다"
 tfrkphn.121.kp:0 "새벽 여섯 시, 청와대 본관 집무실입니다. 책상 위에는 우리가 밤새 정리한 기획재정부와 산업통상자원부의 보고서가 나란히 놓였습니다. 대통령은 안경을 고쳐 쓰고 첫 장을 넘겼습니다. 대중국 수출, 전년 대비 큰 폭 감소.\n\n다음 장도 마찬가지입니다. 반도체와 석유화학, 화장품, 자동차 부품처럼 한때 이 나라를 먹여 살리던 품목들이 줄줄이 붉은 화살표를 달고 있습니다. 전쟁은 끝났지만 바다 건너 가장 큰 시장의 문은 다시 열리지 않았습니다. 중국은 EADI 회원국과 손을 잡았고 우리 상품에는 보이지 않는 벽이 둘러쳐졌습니다. 마지막 장은 성장률 전망이고 숫자는 한 줄입니다.\n\n대통령은 보고서를 덮고 의자에 등을 기댔습니다.\n\n\"전쟁에서 이기고, 장사에서 지는구나.\""
 tfrkphn.121.kp2:0 "창밖이 서서히 밝아 왔습니다. 대통령은 오래전 경남도청 집무실을 떠올렸을 것인데, 빚더미에 앉은 도 살림을 넘겨받던 날 도청 공무원들은 갚을 수 없다며 고개를 저었습니다. 그는 하나씩 줄이고 하나씩 갚았고 결국 빚은 0이 되었습니다. 나라는 도보다 크지만 그는 그때 하던 대로 새는 곳부터 막기로 했습니다.\n\n그날 오전 9시, 비서실장에게 짧은 지시가 내려왔습니다.\n\n\"오늘부터 비상경제위원회를 매주 엽니다. 위원장은 내가 맡습니다. 장관들은 보고서 말고 대안을 들고 오라고 하세요.\"\n\n첫 회의는 그날 오후에 열렸고 대통령은 자리에 앉자마자 말했습니다.\n\n\"중국 하나에 목을 매던 시절은 끝났습니다. 동남아로, 인도로, 중동으로, 유럽으로. 팔 곳을 새로 찾겠습니다. 그리고 안에서도 돈이 돌게 하겠습니다. 규제는 풀고, 기업은 붙잡고, 나랏빚은 줄이겠습니다.\"\n\n회의실 벽시계가 오후 두 시를 가리키고 있었습니다. 그날 회의는 밤 열한 시가 넘어서야 끝났습니다."
 tfrkphn.821.next:0 "이어서 본다"
 tfrkphn.122.kp:0 "비상경제위원회가 끝난 뒤의 브리핑을 경기도 시흥, 시화공단 끝자락의 한 금형 공장 사장도 보고 있었습니다. 오후 세 시, 사장 김씨는 사무실 소파에 앉아 휴대폰으로 뉴스를 틀었습니다.\n\n\"앞으로 법에서 하지 말라고 한 것만 빼고, 나머지는 다 해도 됩니다. 되는 걸 찾아오라고 하지 않겠습니다. 안 되는 걸 저희가 증명하겠습니다.\"\n\n규제 네거티브 전환이라는 자막이 지나갔습니다. 지금까지는 법에 해도 된다고 적힌 일만 할 수 있었는데, 앞으로는 하지 말라고 적힌 일만 빼고 다 할 수 있게 바꾸겠다는 뜻입니다.\n\n김씨는 책상 서랍에서 누렇게 바랜 서류 봉투를 꺼냈습니다. 3년 전 새 설비를 들이려다 접은 서류입니다. 인허가 담당자는 전례가 없다, 근거 조항이 없다는 말만 되풀이했고 그는 세 번 고쳐 네 번을 다시 냈습니다. 그 사이 거래처 둘이 베트남으로 공장을 옮겼습니다.\n\n\"정말이면 좋겠네.\""
 tfrkphn.122.kp2:0 "믿기에는 속은 적이 많았습니다. 정권이 바뀔 때마다 규제 혁파라는 말은 나왔지만 현장에 내려오는 것은 늘 서류 한 장이 더 붙은 양식이었습니다. 그래도 이번에는 말투가 다르다고 김씨는 생각했습니다.\n\n창밖으로 프레스 소리가 났습니다. 작업복을 입은 직원은 열한 명이고 그중 셋은 이십 년을 같이 버틴 사람들입니다. 코로나 때 월급을 두 달 미뤘을 때도 아무도 나가지 않았고, 그 뒤로 회식은 한 번도 못 했습니다. 김씨는 서류 봉투를 책상 위에 올려놓고 공장 문을 열었습니다.\n\n\"박 반장! 오늘 기계 여섯 시에 끄라고 해.\"\n\"무슨 일 있습니까, 사장님?\"\n\"일은 무슨. 회식하자고. 삼겹살로.\"\n\n박 반장이 장갑을 벗다 말고 김씨를 봤습니다. 오 년 만의 회식입니다.\n\n\"이제 좀 살맛 나려나 봐.\"\n\n이 이야기는 며칠 뒤 김씨가 청와대 홈페이지에 올린 글로 우리에게 전해졌습니다."
 tfrkphn.822.next:0 "이어서 본다"
 tfrkphn.123.kp:0 "우리가 법인세 최고세율 인하를 발표한 날, 여의도 증권가 뒷골목의 한 순댓국집입니다. 점심시간을 조금 넘긴 시각에 벽에 걸린 TV에서 속보 자막이 흘렀습니다. '정부, 법인세 최고세율 인하 발표.'\n\n화면이 바뀌자 광화문 앞에 붉은 머리띠를 두른 노동조합원들이 서 있었습니다. \"재벌 감세 철회하라!\" 확성기 소리가 순댓국집 안까지 울렸습니다. 다음 화면에서는 기자 하나가 마이크를 들고 열을 올렸습니다.\n\n\"결국 세금 부담은 노동자와 서민에게 돌아간다는 비판이 나오고 있습니다. 대기업만 배를 불리는 낙수효과는 이미 실패한 정책이라는...\"\n\n다시 화면이 바뀌고 대통령이 단상에서 말했습니다.\n\n\"기업이 떠나면 일자리도 떠납니다. 세금을 깎아 주는 게 아니라, 기업이 이 땅에 남을 이유를 만들어 주는 겁니다.\""
 tfrkphn.123.kp2:0 "구석 자리의 박 씨는 국밥에 깍두기를 얹으며 화면을 힐끗 보았습니다. 쉰둘이고 동네에서 철물점을 합니다. 오늘은 거래처 수금 때문에 여의도까지 나왔고, 옆 테이블의 넥타이 두 사람이 목소리를 높였습니다.\n\n\"이건 진짜 잘한 거야. 법인세 내리면 투자 들어오고, 주가 오르고.\"\n\"웃기지 마. 그 돈 다 사내유보로 쌓아 두고 끝이야. 우리 월급은 그대로고.\"\n\n박 씨는 아무 말도 하지 않았습니다. 대통령 말도 노조 말도 기자 말도 그럴듯해서, 다 맞는 말 같기도 하고 다 틀린 말 같기도 했습니다. 그는 휴대폰을 꺼내 증권 앱을 열었고, 아침에 산 건설주가 3퍼센트 올라 있었습니다.\n\n\"뭐, 누가 맞든.\"\n\"돈만 좀 돌면 되지.\"\n\n계산을 하고 나서며 그는 거래처 사장이 오늘은 웬일로 수금을 미루지 않았다는 것을 떠올렸습니다. 그것이 법인세 덕인지는 알 수 없어도 일단은 나쁘지 않은 하루였습니다. 우리가 바라는 것도 우선은 그런 하루가 늘어나는 것입니다."
 tfrkphn.823.next:0 "이어서 본다"
 tfrkphn.124.kp:0 "청와대 세종실의 국무회의 탁자 위에 두꺼운 보고서가 한 권씩 놓였습니다. 표지에는 '7대 미래산업 육성 전략'이라고 적혀 있습니다. 산업부 장관이 화면을 넘기자 AI, 바이오, 메모리 반도체, 모빌리티, 우주, 수소와 원전, 콘텐츠라는 일곱 단어가 차례로 떠올랐습니다.\n\n\"5년간 연구개발에만 최소 50조 원을 넣습니다. 소형모듈원전은 상용화를 3년 앞당기고, 2030년까지 달에 우리 착륙선을 내리겠습니다.\"\n\n기재부 쪽에서 누군가 펜을 내려놓았습니다. 숫자가 크다는 뜻입니다. 대통령은 보고서를 덮고 양복 안주머니에서 접힌 종이 한 장을 꺼냈습니다.\n\n\"어제 청와대 홈페이지에 글이 하나 올라왔어요. 시흥에서 금형공장 하는 사장님이. 3년 묵힌 설비 인허가가 한 달 만에 났대요. 그래서 직원들이랑 5년 만에 삼겹살 회식을 했답니다. 규제는 풀었어요. 풀었으면 이제 뭘 키울지 정해야지.\"\n\n\"대구 얘기 하나 할게요. 내가 학교 다닌 동네입니다. 대구는 30년을 섬유로 먹고살았어요. 섬유가 무너지고 나서도 30년을 섬유 생각만 했어요. 다시 살아날 거라고. 안 살아났지. 그 사이에 젊은 애들은 다 서울로 갔고.\""
 tfrkphn.124.kp2:0 "\"나라도 똑같아요. 반도체 하나로 30년 먹었어요. 그게 언제까지 갈 거라고 생각합니까. 중국이 따라오고, 공장은 인건비 싼 데 찾아서 다 빠져나가요. 우리 기업들이 베트남, 인도네시아 가서 공장 짓는 거, 그거 박수 칠 일 아닙니다. 여기서 짓게 만들어야지.\"\n\"정부가 다 하겠다는 거 아니에요. 정부는 길만 깔아요. 규제는 아까 다 걷었고. 돈은 민간이 대고, 위험한 기초연구는 국가가 받아요. 그게 민관 경제부흥 5개년 계획입니다.\"\n\n기재부 장관이 조심스럽게 입을 열었습니다.\n\n\"재원이 문제입니다, 대통령님.\"\n\"알아요. 그래서 다음 안건이 펀드잖아요.\"\n\n회의실에 짧은 웃음이 돌았지만 대통령은 웃지 않았고, 그는 일곱 단어가 떠 있는 화면을 한참 바라보았습니다.\n\n\"우리 아버지 세대는 가발 팔고, 합판 팔고, 신발 팔아서 이 나라 만들었어요. 그 사람들은 다음 산업이 뭔지 몰랐어. 그래도 했어요. 우리는 알잖아요. 알면서 안 하면, 그건 죄입니다.\""
 tfrkphn.824.next:0 "이어서 본다"
 tfrkphn.125.kp:0 "우리가 미래펀드를 발표하던 날, 서울 노원구의 한 시중은행 지점입니다. 예순두 살 최씨는 번호표를 쥐고 대기석에 앉아 있었습니다. 정기예금 만기가 오늘입니다. 공무원 퇴직금에 30년 동안 모은 돈을 더하면 2억이 조금 넘고, 그 돈은 지난 10년 동안 예금에서 예금으로만 옮겨 다녔습니다.\n\n주식은 무서웠습니다. 2000년에 친구 따라 샀다가 반 토막이 났기 때문입니다. 집을 한 채 더 사자니 세금이 무서웠고 코인은 아들이 말렸습니다. 예금 이자는 물가를 못 따라갔지만 적어도 줄어들지는 않았습니다.\n\n대기석 위 TV에서 대통령이 말하고 있었습니다.\n\n\"지금 우리나라에 갈 데 없이 떠도는 돈이 3,500조 원입니다. 역대 최대예요. 그 돈이 다 은행에 잠자거나 아파트값 올리는 데 들어가요. 그 돈을 일하게 만들겠습니다.\"\n\n화면 아래로 자막이 흘렀습니다. 선진대한민국 미래펀드, 100조 원 규모, 민관 공동 조성, 7대 미래산업 집중 투자.\n\n\"정부가 혼자 다 대겠다는 거 아닙니다. 정부가 먼저 넣고, 손실 나면 정부가 먼저 맞습니다. 그래야 국민들이 믿고 들어오지.\""
 tfrkphn.125.kp2:0 "옆자리 남자가 혀를 찼습니다. 동네에서 철물점을 하는 박씨입니다. 최씨가 못 하나 사러 가면 늘 덤으로 하나 더 얹어 주던 사람입니다.\n\n\"또 펀드야. 뉴딜펀드는 어디 갔대.\"\n\"뭐, 법인세 깎는다고 할 때도 다들 욕했는데, 그때 건설주 사 둔 건 재미 좀 봤지.\"\n\n최씨는 대꾸하지 않았습니다. 정권마다 펀드는 있었고 이름만 바뀌었다는 말도 맞았습니다. 번호가 불리자 창구 직원이 만기 서류를 내밀었습니다.\n\n\"재예치하시겠어요, 고객님? 금리는 지난번보다 조금 내려갔습니다.\"\n\n최씨는 펜을 든 채 잠시 멈췄고, 손녀가 다니는 대학의 반도체공학과가 떠올랐습니다. 졸업하면 일할 데가 있어야 할 텐데 하는 생각이었습니다.\n\n\"그 미래펀드인가 하는 거, 여기서도 들 수 있어요?\"\n\"아직 출시 전인데요, 안내 나오면 바로 연락드릴까요?\"\n\"그래요. 반만. 반은 그냥 예금으로 두고.\"\n\n은행을 나서며 최씨는 생각했습니다. 내 돈이 공장 하나 짓는 데 벽돌 한 장쯤은 되겠지, 손해 보면 그만이고, 적어도 이번에는 어디 쓰이는지는 알고 넣는 것이라고 말입니다. 우리가 갚아야 할 믿음이 그만큼 늘었습니다."
 tfrkphn.825.next:0 "이어서 본다"
 tfrkphn.200.kp:0 "대구와 광주의 시장이 나란히 선 연단인데, 대통령은 우리가 준비한 원고를 내려다보다가 그대로 접어 안주머니에 넣었습니다. 그가 원고 없이 한 말을 그대로 옮깁니다.\n\n\"서로를 미워해서 우리가 얻은 것이 무엇입니까.\n\n미움에 사로잡히면 상대의 옆모습만 보입니다. 누가 앞섰는지 곁눈질하느라, 그 사람이 어떤 길을 바라보며 걷는지는 끝내 보지 못합니다.\n\n미움이 지역과 지역 사이로 번지면 높은 벽만 남습니다.\n\n그 벽을 한 장씩 걷어 내면, 벽이 있던 자리에 그 땅에서만 피는 꽃들이 보일 겁니다.\n\n저 달빛은 이 고장과 저 고장을 가리지 않습니다. 같은 밤을 똑같이 비춥니다.\n\n하나가 되자고 모두 같아질 필요는 없습니다. 다른 채로 같은 달빛을 받으면 됩니다.\n\n이제 고개를 돌려, 서로의 얼굴을 정면으로 마주합시다.\n\n화해는 거기서부터입니다.\""
 tfrkphn.201.kp:0 "우리가 문을 연 청년 제안 창구 '청년의 꿈'이 첫 달을 넘겼습니다. 들어온 글을 뽑아 출력한 상자 하나를 대통령 앞에 올리면서 비서관이 조심스럽게 말했습니다.\n\n\"좋은 말은 별로 없습니다. 거의 다... 화가 나 있습니다.\"\n\n대통령은 맨 위의 한 장을 집어 들었습니다.\n\n'집은 평생 못 살 것 같고, 결혼은 사치고, 아이는 꿈도 안 꿉니다. 그런데 어른들은 왜 노력을 안 하냐고 묻습니다.'\n\n다음 장은 남자가 썼고, 군대에서 보낸 이 년이 아무것도 아닌 시간이 되었다고 했습니다. 그다음 장은 여자가 썼고, 같은 회사에 들어와도 출발선이 다르다고 했습니다. 두 사람은 서로를 탓하고 있었는데 나란히 놓고 보니 같은 말이었습니다. 우리는 손해 보고 있고 아무도 우리 편이 없다는 것입니다.\n\n대통령은 두 장을 한참 내려놓지 못했고, 더는 남과 여를 따질 때가 아니라고 창유리 앞에서 중얼거렸던 밤이 있었습니다. 말은 쉬웠지만 이 두 장 앞에서는 쉽지 않았습니다."
 tfrkphn.201.kp2:0 "그날 밤 대통령은 예고 없이 서울의 한 대학가 분식집에 들렀습니다. 경호원들이 당황했고 아르바이트생은 국자를 떨어뜨렸습니다. 구석 자리의 청년 몇이 휴대폰을 들어 올렸습니다.\n\n\"대통령님, 진짜 우리 얘기 읽긴 하세요?\"\n\"읽었습니다. 다는 못 읽었고, 오늘 오백 장쯤 읽었습니다.\"\n\n테이블 위로 웃음인지 한숨인지 모를 소리가 흘렀습니다.\n\n\"나는 여러분 나이 때 남의 땅 부쳐 먹던 집 아들이었습니다. 그때는 가난해도 열심히 하면 올라갈 사다리가 있었어요. 지금 여러분한테는 그 사다리가 없습니다. 그게 여러분 잘못이 아니라는 거, 압니다.\"\n\"그 사다리, 다시 놓겠습니다. 대신 하나만 부탁합시다. 서로 싸우지 말고 나한테 따지세요. 남자든 여자든, 서울이든 지방이든. 화는 나한테 내고, 답은 같이 찾읍시다.\"\n\n다음 날 아침 '청년의 꿈'에는 처음으로 제안보다 질문이 더 많이 올라왔습니다. 대통령이 정말 답을 하느냐는 질문이었습니다. 그날부터 우리는 매주 금요일마다 대통령이 직접 쓴 답장을 올리고 있습니다."
 tfrkphn.801.next:0 "이어서 본다"
 tfrkphn.202.kp:0 "종전 기념식이 열린 광장에 영남과 호남의 시장이 나란히 섰습니다. 그 사이에는 청년 대표 둘이 섰습니다. 한 사람은 예비역 병장이고 한 사람은 사회 초년생인데, 얼마 전까지 '청년의 꿈' 게시판에서 서로에게 날을 세우던 사이입니다.\n\n기념식이 끝나고 대통령은 짧게 말했습니다.\n\n\"이 나라는 이름 없이 제자리를 지킨 여러분이 지켰습니다.\"\n\n그날 밤 대통령은 다시 집무실 창가에 섰고, 주머니 속 담뱃갑을 만지작거리다가 그대로 서랍에 넣었다고 합니다. 창유리에는 오래 걸어온, 조금 지친 노인의 얼굴이 비쳤습니다.\n\n남은 힘을 다 쏟겠다고 다짐한 그 밤에서 많은 시간이 흘렀습니다. 나라는 아직 다 낫지 않았습니다. 그래도 오늘 이 나라 사람들은 같은 자리에 함께 서 있었고, 우리는 그것을 이 정부가 해낸 일로 적어 두려 합니다.\n\n창문 틈으로 멀리서 노랫소리가 실려 왔습니다. 광장에 남은 사람들이 누가 먼저랄 것 없이 부르기 시작한 노래였습니다."
 tfrkphn.203.kp:0 "대전 유성의 국방과학연구소 본관 1층에는 낡은 전시실이 하나 있고, 대통령은 연구원들의 안내를 받으며 그 안을 천천히 걸었습니다.\n\n벽에 걸린 첫 사진은 흑백입니다. 맨발의 아이들이 미군 트럭 뒤를 따라 달리고 있습니다. 지난 80년 동안 이 나라는 그렇게 시작했고, 총도 공장도 쌀도 남의 손을 빌려야 하는 찢어지게 가난한 나라였습니다.\n\n다음 사진은 울산의 텅 빈 모래사장입니다.\n\n\"조선소도 없이 배부터 팔러 다닌 사람이 있었지요.\"\n\n대통령이 혼잣말처럼 말했습니다. 정주영은 거북선이 그려진 오백 원짜리 지폐 한 장을 들고 영국 은행을 찾아가 우리는 400년 전에 이미 철갑선을 만든 민족이라고 했습니다. 그렇게 돈을 빌렸고, 모래사장 위에 조선소를 짓는 동시에 그 조선소에서 배를 만들었습니다."
 tfrkphn.203.kp2:0 "그 옆에는 포항 영일만의 사진이 있고, 박태준은 일본에서 받은 청구권 자금으로 제철소를 지으며 직원들에게 말했습니다. 조상의 피 값으로 짓는 것이니 실패하면 모두 우향우해서 영일만 바다에 빠져 죽자고 말입니다. 1973년 6월에 첫 쇳물이 흘러나왔습니다.\n\n그리고 1997년에 나라가 부도났습니다. 사람들은 장롱 깊숙이 넣어 둔 돌반지와 결혼반지를 들고 은행 앞에 줄을 섰습니다. 아무도 시키지 않은 일이었습니다. 그해 겨울 이 나라는 흔들렸지만 무너지지 않았습니다.\n\n전시실의 마지막 칸에는 1978년 충남 안흥 바닷가의 사진이 있습니다. 얼마 전 대통령이 현무 발사를 지켜본 바로 그 시험장입니다. 사진 속에서는 백곰 미사일이 하늘로 솟아오르고 있습니다. 1970년에 문을 연 이 연구소가 8년 만에 만들어 낸 이 나라 최초의 탄도미사일입니다."
 tfrkphn.203.kp3:0 "대통령은 그 사진 앞에 오래 서 있다가 연구원들을 돌아보았습니다.\n\n\"가난한 나라가 배를 만들고, 쇠를 녹이고, 미사일을 쏘아 올렸습니다. 누가 기술을 줘서 한 게 아닙니다. 해 보자고 덤빈 사람들이 있었기 때문입니다.\n\n이제는 여러분 차례입니다. 무기를 사 오는 나라에서 만들어 파는 나라로. 사람이 들어가지 않아도 싸우는 무인 체계, 적보다 먼저 보고 먼저 판단하는 인공지능. 지금 이 방에 있는 여러분이 다음 사진을 만들게 될 겁니다.\"\n\n한 젊은 연구원이 손을 들었습니다.\n\n\"예산은... 정말 그대로 나옵니까?\"\n\n대통령은 웃었습니다.\n\n\"정주영 회장은 지폐 한 장으로 조선소를 지었습니다. 여러분은 그보다는 많이 드리겠습니다.\"\n\n그날 이후 전시실 마지막 칸 옆에는 빈 액자 하나가 걸렸습니다. 아래에는 짧은 글귀가 붙어 있습니다. '다음 사진은 여기에.'"
 tfrkphn.803.next:0 "이어서 본다"
 tfrkphn.204.kp:0 "1999년 12월 헌법재판소는 제대군인 가산점 제도가 헌법에 어긋난다고 결정했습니다. 2년 넘게 군복을 입은 사람에게 공무원 시험에서 만점의 5퍼센트 안쪽을 더 얹어 주던 제도였습니다. 그날 이후 가산점은 사라졌습니다. 누군가는 차별이 끝났다고 했고 누군가는 국가가 약속을 저버렸다고 했습니다.\n\n오랜 세월이 흘렀습니다. 서울 노량진의 한 독서실에서 전역한 지 넉 달 된 이준호는 9급 공무원 기출문제집을 덮고 휴대폰을 켰습니다. 대통령의 담화가 생중계되고 있었습니다.\n\n\"현대전은 사병의 수가 아니라 사병의 질이 국방력을 좌우합니다. 좋은 사람이 군에 오게 하려면, 군에 다녀온 사람이 손해 보지 않게 해야 합니다.\n\n군 가산점제를 부활시키겠습니다.\n\n다만 1999년의 그 제도를 그대로 되살리지는 않겠습니다. 성별을 떠나 군 복무를 마친 사람이라면 누구나 혜택을 받습니다. 가산점의 규모도 합리적으로 조정하겠습니다. 다른 수험생의 기회를 빼앗지 않는 선에서 도입하겠습니다. 헌법재판소가 지적한 근거는 법률로 분명히 마련하겠습니다.\""
 tfrkphn.204.kp2:0 "독서실 옆자리에서 휴가 나온 일병 하나가 고개를 들었습니다. 군복 가슴의 명찰에는 '김지원'이라고 적혀 있었습니다. 그녀도 화면을 보고 있었습니다.\n\n\"성별 상관없다는데요.\"\n\"그러네요.\"\n\"저 지금 일반병으로 복무 중이거든요. 그럼 저도 받는 거네요.\"\n\n이준호는 잠깐 말을 잃었다가 웃었습니다.\n\n반응은 갈렸습니다. 여성단체들은 군 복무를 마칠 기회 자체가 고르지 않다며 반대 성명을 냈고, 장애인 단체도 군에 갈 수 없는 사람에게는 또 다른 벽이라고 했습니다. 제대군인 단체들은 늦었지만 환영한다고 했습니다. 국회 국방위원회의 한 의원은 이렇게 말했습니다.\n\n\"그동안 우리는 군대 간 사람과 안 간 사람을 서로 싸우게 만들었습니다. 이번에는 다를 수 있을지, 법안을 만드는 우리 손에 달렸습니다.\"\n\n그날 밤 노량진 독서실의 불은 평소보다 조금 늦게 꺼졌습니다."
 tfrkphn.804.next:0 "이어서 본다"
 tfrkphn.205.kp:0 "계룡대 연병장에 장병들이 줄지어 섰습니다. 육군과 해군, 공군, 해병특수작전군, 그리고 새로 창설된 우주사령부입니다. 우리가 여러 해 준비한 3축 5군 체제가 오늘 출범합니다.\n\n대형 화면에는 현무-5의 공개 영상이 흘렀고 연병장 한편에는 L-SAM 발사대가 위장막을 벗은 채 서 있었습니다. 대통령이 단상에 오르자 군악대의 연주가 멎었습니다.\n\n\"국기에 대하여 경례.\"\n\n수천 명의 손이 한꺼번에 올라갔고, 바람에 펄럭이는 태극기 아래로 사회자의 목소리가 연병장에 울렸습니다.\n\n§Y\"나는 자랑스러운 태극기 앞에 자유롭고 정의로운 대한민국의 무궁한 영광을 위하여 충성을 다할 것을 굳게 다짐합니다.\"§!\n\n\"바로.\""
 tfrkphn.205.kp2:0 "구령이 떨어진 뒤에도 대통령은 한동안 깃발에서 눈을 떼지 않았습니다. 행사가 끝나자 그는 사열대를 내려와 장병들 사이를 걸었습니다. 육군 대열 끝에 앳된 얼굴의 일병 하나가 서 있었고 명찰에는 '김지원'이라고 적혀 있었습니다.\n\n\"힘들지 않나?\"\n\"똑같이 받으려고 왔습니다.\"\n\n대통령은 웃으며 그녀의 어깨를 두드렸습니다.\n\n돌아오는 차 안에서 비서실장이 사진 한 장을 건넸습니다. 대전 국방과학연구소에서 막 올라온 사진인데, 전시실 마지막 칸 옆에 오래 비어 있던 액자에 오늘 아침 공개된 현무-5의 사진이 걸려 있었습니다.\n\n대통령은 창밖을 내다보았습니다. 당정협의 탁자 위에서 지워졌다가 다시 동그라미가 쳐졌던 예산, 도쿄로 건너간 친서, 판문점에 울린 경고사격이 오늘 연병장의 대열로 이어졌습니다. 당에 충성하던 서른 해가 끝나고 나라에 충성하겠다고 말한 그날 이후의 시간을 우리는 그의 곁에서 함께 지나왔습니다."
 tfrkphn.805.next:0 "이어서 본다"
 tfrkphn.206.kp:0 "폴란드 북부 그디니아 항구입니다. 잿빛 발트해 위로 거대한 화물선 한 척이 들어왔고 갑판 위에는 위장막을 씌운 전차들이 줄지어 실려 있었습니다. 우리가 보낸 K2 전차입니다. 크레인이 첫 번째 전차를 부두에 내려놓자 기다리던 폴란드 군인들 사이에서 박수가 터졌습니다.\n\n부두 끝에서 그 광경을 지켜보던 노인이 있었는데, 일흔을 훌쩍 넘긴 전직 조선소 용접공 얀 코발스키입니다. 그는 낡은 모자를 벗어 손에 쥐었습니다. 이 항구에서 차로 20분 거리에 그단스크 조선소가 있고, 1980년 8월에 얀은 그곳에 있었습니다.\n\n공산 정권이 고기값을 올리고 동료 노동자를 해고하자 조선소 노동자들이 일손을 놓았습니다. 그때 해고당했던 전기공 하나가 조선소 담장을 넘어 들어왔습니다. 콧수염을 기른 키 작은 사내 레흐 바웬사였고, 그는 상자 위에 올라서서 파업을 이끌었습니다."
 tfrkphn.206.kp2:0 "그렇게 자유노조 연대, 솔리다르노시치가 태어났습니다. 공산권에서 처음으로 정권의 허락 없이 생겨난 노동조합이었고 한때 조합원이 천만 명에 가까웠습니다. 정권은 계엄령을 선포하고 지도자들을 잡아들였지만 조합원들은 지하로 내려가 버텼습니다.\n\n1989년 6월 폴란드에서 반쯤 자유로운 선거가 열렸고 연대가 압승했습니다. 그해 가을 그 바람은 국경을 넘었습니다. 헝가리가 국경 철조망을 걷었고 베를린 장벽이 무너졌으며 프라하의 광장에는 열쇠 꾸러미 흔드는 소리가 가득했습니다. 1년도 안 되어 동유럽 전체가 자유를 되찾았습니다. 조선소 담장 하나를 넘은 사내에게서 시작된 일입니다.\n\n얀은 그 시절 신문에서 한국이라는 나라를 처음 읽었고, 1987년에 그 먼 나라에서도 학생과 노동자들이 거리로 나와 독재를 끝냈다는 기사였습니다. 세상 반대편에도 우리 같은 사람들이 있구나 하고 그는 생각했습니다.\n\n유럽은 그보다 더 오래전에 우리를 위해 피를 흘렸고, 1950년 영국은 5만 명이 넘는 군인을 한반도에 보냈습니다. 1951년 봄 임진강에서 글로스터 대대는 몇 배나 되는 중공군에 포위된 채 사흘을 버텼고, 그들이 시간을 버는 동안 서울은 다시 떨어지지 않았습니다."
 tfrkphn.206.kp3:0 "프랑스의 몽클라르 장군은 한국에 가겠다며 중장 계급장을 떼고 스스로 중령이 되었습니다. 그가 이끈 프랑스 대대는 지평리에서 미군과 함께 중공군의 파상공세를 막아 냈고 전쟁의 흐름이 거기서 바뀌었습니다. 네덜란드와 벨기에, 룩셈부르크, 그리스, 튀르키예가 군대를 보냈고 스웨덴과 덴마크, 노르웨이, 이탈리아가 병원과 의료진을 보냈습니다.\n\n70여 년이 흘러 미국이 무너지고 우리가 대만해협에서 싸울 때 유럽은 다시 우리 편에 섰습니다. 런던과 파리는 규탄 성명을 냈고 바르샤바는 탄약을 실어 보냈습니다. 그래서 우리는 전차와 자주포, 전투기를 파는 데서 그치지 않기로 했고, 기술을 넘기고 폴란드 땅에 공장을 함께 짓습니다.\n\n크레인이 두 번째 전차를 내려놓았고, 얀은 모자를 다시 쓰고 옆에 선 젊은 한국인 기술자에게 서툰 영어로 말했습니다.\n\n\"1987년에 신문에서 당신네 나라를 읽었소. 그때는 이런 걸 받게 될 줄 몰랐지.\""
 tfrkphn.806.next:0 "이어서 본다"
 tfrkphn.207.kp:0 "6월 25일 아침, 경기도 어느 소도시의 보훈회관입니다. 강당에 접이식 의자 서른 개가 놓였습니다. 해마다 채워지는 의자가 줄어 올해는 스물두 개가 찼습니다.\n\n맨 앞줄에 김복동 할아버지가 앉아 있고, 아흔다섯인 그는 열여덟 살에 학도병으로 낙동강 전선에 나갔습니다. 같이 나간 반 친구 열한 명 중에 돌아온 사람은 셋이었고, 이제 그 셋 중에 남은 사람은 그 혼자입니다.\n\n그 옆자리에는 여든둘의 박정수 할아버지가 앉았고, 1960년대 말 스물두 살에 맹호부대원으로 베트남 정글에 갔습니다. 우기에는 군화가 마를 날이 없었고 밤이면 어둠 속의 작은 소리에도 총을 움켜쥐었습니다. 돌아와서 몇 해 동안은 비 오는 밤에 잠을 이루지 못했습니다.\n\n두 사람은 이 회관에서 만난 지 20년이 넘었고, 박 할아버지는 김 할아버지를 늘 형님이라고 부릅니다.\n\n\"형님, 올해도 오셨네요.\"\n\"내가 안 오면 의자 하나 또 빠질 거 아이가.\"\n\n국민의례가 시작되어 애국가가 울리자 스물두 명이 의자를 짚고 하나둘 일어섰습니다. 김 할아버지는 지팡이를 짚고도 한참이 걸렸고 박 할아버지가 팔꿈치를 받쳤습니다. 모두가 오른손을 들어 경례했고, 손끝은 떨렸지만 손바닥의 각도는 젊은 날 훈련소에서 배운 그대로였습니다."
 tfrkphn.207.kp2:0 "행사가 끝나고 우리 보훈부 직원이 새 명패를 들고 갔습니다. '국가유공자의 집'이라고 적힌 명패입니다. 오늘부터 달라지는 것들을 적은 안내문도 함께 드렸습니다. 참전명예수당 인상, 보훈병원 진료비 전액 지원, 거동이 불편한 참전용사를 위한 방문 간호, 그리고 국립묘지 안장을 기다리는 유가족을 위한 전담 창구입니다.\n\n박 할아버지가 안내문을 천천히 읽었고, 김 할아버지는 돋보기를 놓고 와서 명패만 쓰다듬었습니다.\n\n\"이제야 알아주는 갑다.\"\n\"늦었어도 고맙지요, 형님.\"\n\n김 할아버지는 대답 대신 명패를 가슴에 안았고 한참 뒤에 말했습니다.\n\n\"우리 반 아이들 이름은 아무도 몰라. 낙동강에서 죽은 아이들. 그 아이들 몫까지 받는 기라, 이건.\"\n\n회관 밖으로 나오자 6월의 햇살이 따가웠습니다. 손자뻘 되는 젊은 군인 하나가 지나가다 두 노인을 보고 걸음을 멈추더니 군모를 고쳐 쓰고 경례했습니다. 두 노인도 천천히 손을 들어 경례를 받았습니다."
 tfrkphn.807.next:0 "이어서 본다"
 tfrkphn.208.kp:0 "결초보은은 풀을 맺어 은혜를 갚는다는 말인데, 2,600년 전 진나라의 위과는 아버지가 맑은 정신일 때 남긴 말을 따라 한 여인을 살렸습니다. 몇 해 뒤 전장에서 그 여인의 죽은 아비가 들판의 풀을 엮어 적장의 발을 걸었습니다. 산 사람이 베푼 은혜를 죽은 사람이 갚은 것입니다.\n\n이 이야기에서 풀을 묶은 사람은 노인입니다. 그러나 그 풀은 위과가 먼저 심었고, 위과가 먼저 베풀지 않았다면 풀을 묶을 사람도 없었습니다. 우리가 걸어온 길도 그러했습니다.\n\n1950년에 이름도 모르던 나라를 지키러 스물두 나라가 왔습니다. 임진강의 영국군이 사흘을 버텼고 몽클라르는 별을 떼고 중령이 되어 지평리를 지켰습니다. 필리핀과 태국의 젊은이들은 아시아에서 가장 먼저 배에 올랐고, 그들 중 2천여 명은 지금도 부산의 묘역에 잠들어 있습니다. 그들이 풀을 묶었습니다.\n\n그 풀 위에서 대한민국은 일어섰습니다. 낙동강의 학도병이 살아남아 아흔이 넘도록 의자 하나를 지켰고, 베트남의 정글에서 돌아온 청년이 그 옆자리를 지켰습니다. 그들도 풀을 묶었습니다."
 tfrkphn.208.kp2:0 "그리고 적룡이 바다를 건넜습니다. 금문의 바위섬에 다시 포탄이 떨어졌을 때 대만은 혼자일 줄 알았습니다. 우리는 30여 년 전 명동에서 하룻밤 사이에 문을 닫게 하고 돌아섰던 나라입니다. 그러나 이번에는 떠나지 않았습니다. 태극기를 단 구축함이 해협으로 들어갔고 광화문에는 청천백일기가 다시 올랐습니다. 70년 전에 받은 은혜를 우리는 다른 나라를 지키는 것으로 갚았습니다.\n\n그 뒤로 친구가 늘었습니다. 도쿄와 타이베이와 캔버라가 한 편이 되었고, 부산과 요코하마, 가오슝과 시드니의 탱크에 같은 기름이 채워졌습니다. 오디샤의 크롬이 서쪽에서 왔고 그디니아 부두에는 K2가 내렸습니다. 그단스크의 담장을 넘었던 사람들이 서울의 광장에 섰던 사람들에게 손을 내밀었습니다.\n\n갚을 보에는 뜻이 하나 더 있습니다. 적룡은 씨앗을 뿌렸습니다. 바다를 건너 포를 쏘았고 섬들을 불태웠고 젊은이들을 바다에 묻었습니다. 뿌린 것은 거두게 되니 그것이 인과응보입니다.\n\n위과의 이야기에서 눈여겨볼 대목은 풀매듭보다 그 앞입니다. 그는 아버지의 맑은 말을 따랐습니다. 순장의 풍습을 따랐다 해도 탓할 사람은 없었는데, 그 선택이 몇 해 뒤 그를 살렸습니다.\n\n나라도 다르지 않고, 받은 것을 기억하고 약속한 것을 지키면 위기에 빠졌을 때 풀을 묶어 줄 나라가 생깁니다. 이번 전쟁에서 우리는 그것을 직접 겪었습니다."
 tfrkphn.808.next:0 "이어서 본다"
 tfrkphn.209.kp:0 "청와대 춘추관에서 부동산 대책을 발표하는 자리인데, 대통령의 첫 문장부터 우리 원고에 없던 말이었고, 옆에 선 국토부 장관이 서류를 고쳐 잡았습니다.\n\n\"이 나라는 대한민국이 아니라 서울공화국입니다.\"\n\"국토의 12퍼센트에 인구 절반이 몰려 삽니다. 돈도, 회사도, 대학도, 병원도 다 서울로 갑니다. 지방 애들은 서울 가려고 공부하고, 서울 가서는 집 못 사서 결혼을 안 해요. 서울은 집값 때문에 숨이 막히고, 지방은 사람이 없어서 숨이 끊어집니다. 이게 정상입니까.\"\n\n\"그래서 토지임대부 주택을 하겠습니다. 땅은 국가가 갖고, 집은 국민이 갖습니다. 땅값을 빼면 집값은 반으로 떨어집니다. 이걸 서울에만 짓지 않겠습니다. 지방 거점도시마다, 일자리가 생기는 곳마다 짓겠습니다. 청년이 서울 안 가도 집 사고 결혼할 수 있게.\"\n\"빚 갚으면서 무슨 집을 짓느냐고들 하십니다. 경남에서도 빚 갚으면서 산단 세 개를 유치했습니다. 줄일 건 줄이고, 지을 건 짓습니다.\"\n\n기자들의 노트북 자판 소리가 빨라졌고, 반나절 뒤 서울시청 브리핑룸에서 오세훈 서울시장이 연단에 섰습니다. 표정은 차분했지만 첫마디는 날이 서 있었습니다."
 tfrkphn.209.kp2:0 "\"토지임대부 주택, 좋은 정책입니다. 잘 압니다. 서울이 먼저 했으니까요. 고덕강일 3단지, 사전청약 경쟁률이 40대 1이었습니다. 서울시민이 이미 검증한 정책을 이제 와서 새 정책처럼 발표하시는 건 좀 의아합니다.\"\n\n\"그런데 서울공화국이라는 말은 받아들이기 어렵습니다. 서울은 천만 시민이 사는 도시고, 대한민국이 세계와 경쟁하는 최전선입니다. 서울이 벌어서 지방교부세로 나라 전체를 먹여 살리고 있습니다. 서울을 깎아내린다고 지방이 살아나지 않습니다. 하향평준화일 뿐입니다.\"\n\"지방이 살려면 지방에 기업이 가야 합니다. 서울 집값을 탓하기 전에, 왜 청년들이 서울로 오는지부터 보셔야 합니다.\"\n\n그날 밤 관저에서 비서실장이 오 시장의 브리핑 영상을 틀었고, 대통령은 끝까지 보고 나서 리모컨을 내려놓았습니다.\n\n\"맞는 말이네. 지방에 기업이 가야지.\"\n\n비서실장이 의외라는 얼굴로 그를 봤습니다.\n\n\"그러니까 하는 거야. 기업 내려보내고, 집 지어주고. 서울시장은 서울 걱정하면 되고, 대통령은 나라 걱정하면 되고. 둘 다 자기 일 하는 거지.\"\n\"근데 서울이 먼저 했다는 건 맞아. 그건 인정해줘. 잘한 건 잘한 거니까.\"\n\n우리는 다음 날 보도자료에 서울시의 선례를 한 줄 넣었습니다."
 tfrkphn.809.next:0 "이어서 본다"
 tfrkphn.210.kp:0 "부산 기장군 장안읍, 고리원자력본부입니다. 바닷바람이 거센 방파제 위에서 대통령 일행은 회색 돔 네 개를 바라보고 있습니다. 맨 왼쪽의 가장 낡은 건물 앞에는 철거용 가설 울타리가 둘러쳐져 있습니다. 안내는 일흔이 넘은 퇴직 운전원이 맡았습니다. 한수원이 특별히 모셔 온 분입니다.\n\n\"저게 고리 1호기입니다. 이 나라 첫 원전이지요.\"\n\"1971년에 첫 삽을 떴습니다. 그때 우리나라 1인당 국민소득이 300달러도 안 됐어요. 원전 하나 짓는 돈이 그해 나라 예산의 4분의 1이었다고 합니다. 다들 미쳤다고 했지요. 설계도 외국 거, 기계도 외국 거, 운전도 외국 기술자들이 했습니다. 우리는 옆에서 받아 적었어요.\""
 tfrkphn.210.kp2:0 "\"1978년 4월에 상업운전을 시작했습니다. 그날 제가 제어실에 있었습니다. 스물셋이었어요. 계기판 바늘이 올라가는데 손이 떨려서 펜을 못 잡았습니다.\"\n\"그 뒤로 2호기, 3호기, 4호기가 들어섰습니다. 80년대엔 우리 손으로 반쯤 지었고, 90년대엔 다 우리 손으로 지었습니다. 받아 적던 나라가 수출하는 나라가 됐어요. 저 1호기가 학교였던 셈입니다.\"\n\n\"2017년 6월에 1호기가 멈췄습니다. 마흔 살이었지요. 그날 텔레비전에서는 탈원전을 선언했습니다. 저는 집에서 그걸 봤습니다. 이상하게 눈물이 나더군요. 늙어서 은퇴하는 건 괜찮은데, 다시는 안 짓겠다는 말이 서러웠습니다.\"\n\n대통령은 한동안 말이 없었습니다. 바람에 넥타이가 날렸습니다.\n\n\"2호기도 마흔 넘었지요?\"\n\"예. 겨우 계속운전 허가를 받았습니다. 2033년까지입니다. 그다음엔 저것도 1호기처럼 멈춥니다.\"\n\"멈추면 그 자리는요?\"\n\"지금까지는 그냥 비워두는 거였습니다.\""
 tfrkphn.210.kp3:0 "대통령이 산업부 장관을 돌아보자 장관이 먼저 입을 열었습니다.\n\n\"용인이랑 평택에 올라가는 반도체 공장들, AI 데이터센터들이 다 전기 먹는 하마입니다. 7대 미래산업 계획대로 가면 10년 안에 지금 전력으로는 모자랍니다.\"\n\n대통령이 고개를 끄덕였습니다.\n\n\"이제 그렇게 안 합니다. 하나가 은퇴하면, 그 자리에 새 거 하나 짓습니다. 송전탑도 있고, 바닷물도 있고, 주민들도 원전 옆에서 50년을 살았어요. 여기만큼 원전 지을 준비가 된 땅이 어디 있습니까. 1호기 해체 끝나면 그 자리에 소형모듈원전 들어갑니다. 2호기 멈추면 그 자리에도. 늙은 원전은 은퇴시키고, 젊은 원전으로 바꾸는 겁니다. 그게 원전 강국이에요.\"\n\n노인은 대통령을 오래 바라보다가 1호기 쪽으로 고개를 돌렸습니다.\n\n\"그럼 저 녀석도 자식을 보는 거네요.\""
 tfrkphn.810.next:0 "이어서 본다"
 tfrkphn.211.kp:0 "청와대 영빈관입니다. 대통령의 책상 위에 정상회의 초청장 한 장이 놓였습니다. 발신처는 주요 선진국 정상회의 의장국이고, 회원국 자격의 정식 초청입니다. 대통령은 초청장을 한참 들여다보았습니다.\n\n몇 해 전 그는 여의도의 작은 사무실에서 출마를 선언했습니다. 잘못된 길로 가는 이 나라를 바로잡아 정상 국가로 만들고 G7 선진국 시대를 열겠다고 했습니다. 그때 기자들은 대선 후보들이 늘 하는 말이라며 웃었습니다.\n\n그 뒤에 세상이 무너졌고, 세계의 경찰을 자처하던 미국이 내전에 빠져 제 몸 하나 가누지 못하고 산산조각 났습니다. 70년 동안 이 나라를 받쳐 주던 기둥이 하루아침에 사라졌습니다. 핵우산이 흔들렸고 통화스와프를 맺어 줄 상대가 없어졌고 수출길이 막혔습니다. 환율이 치솟던 밤 경제부총리는 대통령 앞에서 말을 잇지 못했습니다. 사람들은 IMF 때보다 나쁘다고 했고 그 말은 틀리지 않았습니다."
 tfrkphn.211.kp2:0 "그래도 우리는 버텼습니다. 규제를 걷어 냈고 세금을 낮췄고 잠자던 돈을 깨워 공장으로 보냈습니다. 늙은 원전 자리에 새 원전을 세웠고 반도체 다음에 먹고살 씨앗 일곱 개를 심었습니다. 땅은 국가가 갖고 집은 국민이 갖게 했습니다. 미국이 지켜 주지 않는 나라를 스스로 지킬 수 있게 군을 다시 세웠습니다.\n\n쉬운 길은 하나도 없었습니다. 노조는 거리로 나왔고 야당은 매일 퇴진을 외쳤고 서울시장과는 방송으로 말싸움을 했습니다. 중산층 비율이 65퍼센트를 넘었다는 통계청 보고서가 올라온 날, 대통령은 아무 말 없이 그 보고서를 두 번 읽었습니다.\n\n\"수락 회신 보내겠습니다.\"\n\"그래요.\"\n\n대통령은 초청장을 내려놓고 창밖을 봤습니다."
 tfrkphn.211.kp3:0 "\"미국이 있을 때 우리는 미국 덕에 컸다는 소리를 들었어요. 이제 미국이 없는데도 컸어요. 그러니까 이제는 아무도 그 소리 못 합니다.\"\n\"세상이 무너지는 동안 우리는 안 무너졌어요. 그래서 부른 겁니다. 여기서 멈추면 안 돼요. 미국이 비운 자리는 우리가 채웁니다.\"\n\n같은 날 오후 경기도 시흥의 금형공장에서는 김 사장이 새로 뽑은 직원 아홉 명의 이름표를 붙이고 있었습니다. 박 반장은 이제 공장장입니다. 서울 노원구의 은행 창구에서는 최씨가 미래펀드 수익률이 적힌 안내문을 받아 들었습니다. 손녀는 졸업 전에 반도체 회사에 붙었고 근무지는 대구 공장입니다.\n\n여의도 순댓국집 TV에서 정상회의 초청 속보가 흘러나왔고, 철물점 박씨는 깍두기를 얹으며 화면을 힐끗 보았습니다.\n\n\"뭐, 누가 잘해서든.\"\n\"나라가 잘되면 됐지.\""
 tfrkphn.811.next:0 "이어서 본다"
 tfrkphn.73.kp:0 "자정이 넘은 대통령 집무실에 다시 불이 켜져 있습니다. 3년 전에도 대통령은 이 자리에 이렇게 혼자 앉아 있었습니다. 승전의 폭죽 소리가 겨우 잦아들던 무렵이었고, 그날 밤 그는 끊었던 담배를 꺼내 물고 어두운 창유리에 비친 제 얼굴을 보았습니다.\n\n그때 책상 위에는 선진대국을 만들겠다는 약속만 있었습니다. 국민 앞에서 한 그 말이 얼마나 무거운지 그는 그 밤에야 알았을 것입니다. 오늘 밤 그는 담배 대신 만년필을 들고 백지 위에 네 글자를 천천히 적었습니다.\n\n진. 충. 보. 국.\n\n진충보국은 정성을 다해 충성하고 나라의 은혜에 보답한다는 말입니다. 대통령이 되겠다고 나서던 날 그가 마지막 도전이라며 국민 앞에 내건 말이기도 합니다. 그는 그 네 글자를 무엇을 먼저 하고 무엇을 나중에 할지 정하는 순서로 읽었고, 우리는 그 순서대로 일했습니다.\n\n§Y진, 다할 진.§!\n정치는 사람을 무디게 만듭니다. 30년을 하다 보면 칼은 녹슬고 날은 무뎌집니다. 대통령은 취임하자마자 모래시계 검사 시절의 그 칼을 다시 갈았습니다."
 tfrkphn.73.kp2:0 "범죄와의 전쟁을 선포하고 조직폭력배와 마약 조직, 아이들을 노리는 자들에게 국가의 칼끝을 겨눴습니다. 부처를 합치고 위원회를 없애 정부의 군살을 뺐고, 공무원들에게는 보고서 말고 결과를 가져오라고 했습니다.\n\n귀족이 된 노조와도 부딪쳤습니다. 그들은 거리로 나왔고 대통령은 물러서지 않았습니다. 일하는 사람을 지키는 것과 일하지 않는 특권을 지키는 것은 다르다고 했습니다. 욕을 많이 먹었지만 공장은 다시 돌았습니다.\n\n그는 기자회견장 대신 카메라 앞에 혼자 앉아 국민에게 직접 말했고, 사람들은 톡 쏘는 맛이 있다며 그 방송을 홍카콜라라고 불렀습니다. 서민의 대통령이 되겠다며 시장 바닥의 국밥집에서 밥을 먹었고, 동과 서가 서로를 미워하지 않도록 달빛동맹의 다리를 놓았습니다. 꿈을 잃은 청년들에게는 사다리를 놓으려 했고, 다 이루었다고는 못 해도 힘이 닿는 데까지는 했습니다.\n\n§Y충, 충성 충.§!\n지난 30년 동안 그는 당에 충성하는 정치를 했습니다. 공천을 받으려고, 당권을 잡으려고 계파와 계파 사이에서 줄을 섰습니다. 대통령이 된 날 그는 이제부터 국익에만 충성하겠다고 했습니다. 그 말은 때로 자기 편에게 등을 돌려야 한다는 뜻이었고, 우리가 생각한 것보다 훨씬 무거웠습니다."
 tfrkphn.73.kp3:0 "미국이 무너지고 핵우산이 흔들렸을 때 그는 힘이 있어야 평화도 지킨다고 했습니다. 모병제를 넓혀 직업군인의 나라를 만들었고 여성도 일반병으로 총을 들 수 있게 했습니다. 킬체인과 미사일방어와 대량응징보복의 3축 체계를 완성했고, 핵 앞에서 물러서지 않겠다며 PDTO의 동맹들과 마주 앉았습니다.\n\n북한에는 간섭하지도 간섭받지도 않겠다고 했습니다. 판문점을 넘어온 병사를 돌려보내지 않았고 평양의 협박에도 고개를 숙이지 않았습니다. 적룡의 동맹들이 동쪽으로 손을 뻗을 때는 이념을 앞세우지 않고 국익으로 맞섰습니다.\n\n국방과학연구소 전시실의 빈 액자를 채웠고, 군복을 입고 청춘을 바친 젊은이들의 시간을 나라가 갚게 했습니다. 그리고 육해공에 해병과 우주를 더한 3축 5군이 대한민국을 지키게 되었습니다. 당에 하던 충성을 나라에 했다는 말을 그는 이제 부끄럽지 않게 할 수 있습니다."
 tfrkphn.773.next:0 "이어서 본다"
 tfrkphn.74.kp:0 "2026년 가을, 대통령 선거를 다섯 달 앞둔 여의도입니다. 헌법이 정한 5년 단임 때문에 대통령은 다시 출마할 수 없습니다. 사람들의 눈은 이제 다음 사람에게로 향했고, 여당 안에서는 두 사람의 이름이 오르내립니다.\n\n§Y이인제§!\n충남 논산 출신입니다. 판사를 거쳐 정치에 들어왔고 김영삼 정부에서 노동부 장관을 지냈습니다. 경기도지사를 지냈고 대통령 선거에 나섰으며 여섯 번 국회의원이 되었습니다. 우리 정부에서는 처음부터 국무총리로 대통령의 책상에 서류를 올려 온 사람입니다.\n\n두 사람은 같은 시대를 걸었습니다. 같은 사람에게 발탁되었고 같은 당에서 부딪치고 화해하기를 되풀이했습니다. 이제 둘 다 백발입니다. 이인제는 기자들 앞에서 짧게 말했습니다.\n\n\"홍 대통령이 걸어온 길, 제가 이어서 걷겠습니다. 전쟁을 이긴 정부입니다. 그 정부가 시작한 일을 끝내는 것이 제 일입니다. 새 길을 찾는 건 그다음입니다.\"\n\n그의 곁에는 국방과 외교를 함께 꾸려 온 사람들이 섰고, 3축 5군과 PDTO, 대만과의 약속, 진충보국의 네 글자를 그는 그대로 잇겠다고 했습니다. 사람들은 그를 연속성의 후보라고 부릅니다."
 tfrkphn.74.kp2:0 "§Y오세훈§!\n서울 출신입니다. 변호사로 이름을 알렸고 마흔다섯에 서울시장이 되었습니다. 시장직을 걸었다가 내려놓았고 10년 만에 다시 돌아와 서울시청에 앉았습니다. 서울시장을 네 번 지낸 사람입니다.\n\n그는 대통령과 자주 부딪쳤습니다. 서울공화국이라는 말에 맞섰고 방송에서 날 선 말을 주고받았습니다. 그러면서도 토지임대부 주택은 서울이 먼저 했다며 웃었습니다. 오세훈은 시청 브리핑룸에서 말했습니다.\n\n\"홍 대통령은 전쟁을 이겼습니다. 그건 누구도 부정할 수 없습니다. 그러나 전쟁을 이긴 정부와 전쟁 뒤를 사는 정부는 달라야 합니다. 국민은 지쳤습니다. 이제는 총이 아니라 삶을 이야기할 때입니다. 저는 전임자와는 다른 길을 찾겠습니다.\"\n\n그의 곁에는 젊은 의원들과 수도권의 단체장들이 섰고, 재건과 민생, 실용을 내건 그를 사람들은 변화의 후보라고 부릅니다.\n\n청와대 집무실에서 대통령은 두 사람의 출마 회견을 차례로 보았습니다. 비서실장이 물었습니다.\n\n\"어느 쪽을 미십니까?\"\n\n대통령은 텔레비전을 껐습니다.\n\n\"그건 내가 정할 일이 아니야. 당원하고 국민이 정하는 거지. 대통령이 후계자를 고르는 나라는 선진국이 아니야.\""
 tfrkphn.774.next:0 "이어서 본다"
 tfrkphn.75.kp:0 "전쟁 승리 선언 이틀 뒤, 대통령 집무실 옆 소회의실입니다. 화이트보드에는 우리가 마커로 적은 다섯 줄이 있습니다. 헌법, 입시와 사법시험, 병역과 안보, 노동, 방송입니다. 줄마다 옆에는 물음표와 함께 '반대 예상'이라는 메모가 붙었습니다.\n\n전쟁 전에 손댔다가 전쟁으로 멈춘 일들입니다. 헌법을 고치려면 국회 재적 3분의 2의 찬성과 국민투표를 거쳐야 하므로 다섯 줄 가운데 가장 어렵습니다.\n\n\"전쟁 끝났다고 다들 한숨 돌리는 지금이 아니면 못 합니다. 지지율은 시간이 지날수록 빠집니다.\"\n\"반대로 지금 밀어붙이면 승리에 취해 오만해졌다는 소리를 들을 겁니다.\"\n\n두 비서관의 말다툼이 길어지자 누군가 마커 뚜껑을 닫으며 말했고, 어느 쪽이든 욕은 먹게 되어 있으니 순서라도 정하자는 것이었습니다.\n\n그날 저녁 다섯 줄 가운데 맨 윗줄에 동그라미가 쳐졌습니다."
 tfrkphn.260.kp:0 "임기 첫날 0시에 전화벨이 울렸습니다. 합동참모의장이 이 시각부로 국군 통수권이 넘어왔다고 보고했고, 이인제 대통령은 짧게 답한 뒤 수화기를 내려놓았습니다. 대통령으로서 받은 첫 보고입니다. 30년을 기다린 전화라 잠은 오지 않았을 것입니다.\n\n우리가 모시게 된 사람의 이력은 깁니다. 논산의 소작농 집에서 태어났고 월사금이 없어 초등학교를 한 해 늦게 들어갔습니다. 판사가 되었다가 3년 만에 법복을 벗고, 다치고 쫓겨난 노동자들의 변호사가 되었습니다.\n\n1987년에 김영삼의 당에 들어갔고 마흔넷에 내각에서 가장 젊은 장관이 되었습니다. 이태 뒤에는 첫 민선 경기도지사가 되었고, 그 무렵 신문은 그를 차세대 지도자라고 썼습니다.\n\n1997년 경선에서 지고 승복하지 않았습니다. 당을 나와 새 당을 만들었고 492만 표를 얻어 3위를 했습니다. 그날부터 그의 이름 앞에는 경선 불복이라는 네 글자가 붙어 다녔습니다. 2002년에는 노무현의 바람에 밀렸고, 2007년에는 일자리 만드는 대통령이 되겠다고 했다가 0.68퍼센트를 얻었습니다."
 tfrkphn.260.kp2:0 "당은 열 번이 넘게 바뀌었습니다. 통일민주당, 민주자유당, 국민신당, 새천년민주당, 자유민주연합, 무소속, 자유선진당, 새누리당. 사람들은 세다가 그만두었습니다. 그래도 유권자들은 안양에서 두 번, 논산에서 네 번 그를 국회로 보냈습니다. 2016년 일곱 번째 도전은 1,038표가 모자랐습니다.\n\n2017년 경선에서는 북한 체제를 바꾸겠다고 했다가 홍준표에게 졌고, 2018년에는 충남지사 선거에서 졌습니다. 사람들은 그를 피닉제라고 불렀습니다. 놀리는 말이었는데 오래 듣다 보니 싫지 않았다고 그는 말합니다.\n\n아침이 되자 청와대 본관 집무실 책상 위에 우리는 결재판 두 개를 올렸습니다. 왼쪽은 고용 창출 전략회의 설치안이고, 붉은 띠를 두른 오른쪽은 합동참모본부의 대북 정세 보고입니다. 비서실장이 물었습니다.\n\n\"어느 것부터 보시겠습니까?\"\n\n대통령은 만년필을 들고 왼쪽 결재판을 끌어당겨 이름 석 자를 적었습니다. 대통령으로서 한 첫 서명입니다.\n\n\"20년 전에 한 약속이네. 이것부터 지켜야지.\"\n\n그는 오른쪽 결재판 위에 손을 얹었지만 열지는 않았습니다.\n\n\"이건 천천히 보겠네. 끝까지.\"\n\n비서실장이 나간 뒤에도 대통령은 오른쪽 결재판을 서랍에 넣지 않고 눈에 보이는 자리에 그대로 두었습니다."
 tfrkphn.860.next:0 "이어서 본다"
 tfrkphn.261.kp:0 "취임 첫 주말, 대통령의 첫 지방 일정은 논산의 재래시장이었고, 일정표에는 논산과 광주, 대구 세 도시가 적혀 있었고 순서는 대통령이 직접 정했습니다.\n\n시장 입구부터 사람들이 길을 메웠습니다. 생선 가게 주인이 장갑을 벗고 손을 내밀었고 떡집 할머니는 대통령의 팔을 붙잡고 놓지 않았습니다.\n\n충청은 오래 대통령을 꿈꿨고, 김종필, 이회창, 반기문, 안희정이 차례로 기대를 모았지만 아무도 끝까지 가지 못했습니다. 이인제도 그 명단에 있었는데, 2001년 충청의 여론조사에서 1위였다가 이듬해 경선에서 졌습니다.\n\n영남과 호남이 맞서는 동안 충청은 승부를 가르는 표였고, 충청에서 이기면 본선에서 이긴다고들 했는데 정작 이긴 사람은 번번이 다른 지역 출신이었습니다. 국밥집 앞에서 한 노인이 대통령을 불러 세웠습니다."
 tfrkphn.261.kp2:0 "\"평생을 기다렸어. 이제 우리 차례여.\"\n\n둘러선 사람들이 웃으며 손뼉을 쳤고 대통령도 웃었습니다. 그는 노인의 손을 두 손으로 잡았습니다.\n\n\"어르신, 고맙습니다. 그런데 우리 차례라는 말은 오늘로 끝내야겠습니다.\"\n\n박수가 잦아들었습니다.\n\n\"영남 차례, 호남 차례 하다가 나라가 둘로 갈라졌습니다. 충청 차례까지 생기면 셋으로 갈라집니다. 저는 그 차례를 없애려고 대통령이 됐습니다.\"\n\n노인은 잠시 말이 없다가 대통령의 손등을 툭툭 두드렸습니다.\n\n\"그려. 그 말 하려고 여기부터 온 거구먼.\"\n\n차에 오르자 비서실장이 일정표를 내밀었고 대통령은 두 번째 줄을 손가락으로 짚었습니다.\n\n\"다음은 광주네. 같은 말을 하러 가세.\""
 tfrkphn.861.next:0 "이어서 본다"
 tfrkphn.263.kp:0 "§Y책임총리제란§!\n대통령과 국무총리가 일을 나누는 방식입니다. 대통령은 외교와 안보, 국방, 통일을 맡고 총리는 경제와 복지, 교육 같은 내치를 맡습니다.\n\n§Y왜 필요한가§!\n총리에게는 장관을 제청할 권한이 있습니다. 그러나 그 권한은 오래 종이 위에만 있었습니다. 장관은 대통령이 골랐고 총리는 서명만 했습니다. 사람들은 그런 총리를 대독 총리라고 불렀습니다.\n\n대통령은 1997년 대선에서 책임총리제를 공약했고 2017년 출마 선언에서도 같은 말을 했습니다. 대통령은 밖을 맡고 내치는 실질적인 제청권을 가진 총리에게 맡긴다는 구상이며, 20년 동안 바뀌지 않았습니다. 그는 총리 자리를 겪어 본 사람이기도 합니다. 홍준표 정부에서 다섯 해 가까이 국무총리였습니다."
 tfrkphn.263.kp2:0 "§Y어떻게 운영하는가§!\n첫째, 총리가 장관 후보를 고르고 대통령은 그 명단을 받아들입니다.\n둘째, 내치 안건은 총리가 조정하고 결정합니다.\n셋째, 내치의 결과는 총리가 국회에 나가 책임집니다.\n\n§Y무엇이 걱정인가§!\n전쟁이 끝난 지 오래되지 않았습니다. 지휘가 둘로 갈리면 결정이 늦어집니다. 대통령과 총리가 부딪칠 때 누가 물러서는지도 정해야 합니다.\n\n§Y우리의 답§!\n대통령은 북쪽의 일에 시간을 씁니다. 일자리와 물가는 총리가 매일 챙깁니다. 두 사람은 매주 한 번 마주 앉아 서로의 일을 맞춥니다."
 tfrkphn.863.next:0 "이어서 본다"
 tfrkphn.264.kp:0 "밤 열한 시, 청와대 집무실입니다. 책상 위에는 우리가 올린 원고 한 부가 놓여 있습니다. 제목은 책임총리제 시행에 관한 대국민 담화이고 발표는 내일 아침입니다. 대통령은 마지막 문단을 고치고 있었습니다.\n\n1997년부터 해 온 말입니다. 대통령은 밖을 맡고 총리는 안을 맡는다는 그 말을 30년 만에 지킬 차례였습니다. 그때 문이 열리고 국가안보실장이 서류 봉투를 들고 들어왔습니다.\n\n\"늦은 시간에 죄송합니다. 오늘 들어온 사진입니다.\"\n\n그는 사진 석 장을 원고 옆에 놓았습니다. 첫 장은 선대마다 선체가 올라가 있는 중국의 조선소였습니다. 둘째 장은 굴뚝마다 연기가 나는 군수 공장이었고, 셋째 장은 새 함정이 줄지어 선 항구였습니다."
 tfrkphn.264.kp2:0 "\"졌다고 멈춘 게 아닙니다. 잃은 함대를 다시 짓고 있습니다.\"\n\"언제쯤 다 짓나?\"\n\"이 속도면 몇 해 걸리지 않습니다.\"\n\n안보실장은 각국의 국방 예산을 적은 표 한 장을 더 꺼냈습니다. 줄어든 나라는 없었고, 미국이 사라진 뒤로 숫자는 해마다 늘었습니다.\n\n\"전쟁이 끝난 줄 알았더니, 다들 다음 전쟁을 준비하고 있구먼.\"\n\n안보실장은 대답하지 않았고 그의 눈이 책상 위의 원고로 갔습니다.\n\n\"내일 담화는 예정대로 하십니까?\"\n\n대통령은 원고를 집어 들고 한참 보다가 서랍을 열어 그 안에 넣었습니다.\n\n\"버리는 게 아니네. 넣어 두는 걸세.\"\n\"지금은 나눌 때가 아니야. 내일 아침 안보 회의와 경제 회의를 내가 다 주재하겠네. 장관들한테 직접 보고하라고 전하게.\"\n\n안보실장이 나간 뒤에도 사진 석 장은 책상 위에 남아 있었습니다."
 tfrkphn.864.next:0 "이어서 본다"
 tfrkphn.265.kp:0 "새벽 한 시, 청와대 집무실입니다. 책상 위에는 우리가 정리한 내각 명단이 놓여 있습니다. 칸마다 이름이 적혀 있고 노동부 장관 자리 한 칸만 비어 있습니다. 빈칸 옆에는 이력서 두 장이 있습니다.\n\n왼쪽은 20년을 함께한 사람입니다. 당을 옮길 때마다 따라왔고 선거에서 질 때마다 곁에 남았습니다. 이번 선거도 그가 맨 앞에서 뛰었습니다.\n\n오른쪽은 대통령이 처음 보는 사람인데, 노동 현장에서 30년을 일했고 노동계도 경영계도 그의 말은 듣습니다. 선거 때는 상대 후보 쪽에 있었습니다.\n\n다른 대통령이라면 고민할 일이 없습니다. 먼저 동지를 앉히고, 안 되면 1년 뒤에 바꿉니다. 장관은 그렇게 쓰는 자리였습니다. 그러나 이 대통령은 그럴 수 없습니다. 장관은 대통령과 임기를 함께한다는 것이 1997년에 한 약속이어서, 한번 적은 이름은 임기가 끝나는 날까지 지울 수 없습니다."
 tfrkphn.265.kp2:0 "대통령은 1993년을 떠올렸을 것인데, 그도 노동부 장관이었고 열 달 만에 자리에서 물러났습니다. 벌여 놓은 일은 책상 위에 그대로 남았고 그 책상에는 다음 장관이 앉았습니다. 열 달로는 아무것도 끝낼 수 없다는 것을 그는 겪어서 압니다.\n\n대통령은 왼쪽 이력서를 오래 보았습니다. 고맙고 미안한 얼굴입니다. 그러고는 만년필을 들어 빈칸에 오른쪽 이력서의 이름을 적었습니다. 임기 끝까지 같이 갈 사람이니 편한 사람보다 일할 사람을 골라야 했습니다.\n\n그는 왼쪽 이력서를 접어 안주머니에 넣었고, 날이 밝으면 직접 전화를 걸겠다고 했습니다."
 tfrkphn.865.next:0 "이어서 본다"
 tfrkphn.524.kp:0 "대전의 조달청 별관 3층에서 있었던 일인데, 시화공단에서 금형 공장을 하는 김씨는 설명회장 맨 뒷줄에 앉았습니다. 군이 전쟁 때 쓴 탄약 상자를 다시 채우는 사업이었고, 그 상자의 걸쇠를 찍는 금형이 잘하면 그의 몫이 될 수 있었습니다.\n\n설명회가 끝나자 복도에서 누가 명함을 내밀었습니다. 회사 이름 밑에 고문이라고 적혀 있었고 본인 말로는 예비역 대령이라고 했습니다.\n\n\"사장님, 이런 건 서류만 잘 낸다고 되는 게 아닙니다. 저희가 길을 좀 압니다. 낙찰가의 오 부만 자문료로 잡으시면 됩니다.\""
 tfrkphn.524.kp2:0 "김씨는 명함을 받아 주머니에 넣었지만 자문료는 견적서에 넣지 않았고, 열흘 뒤에 나온 낙찰 결과에서 김씨의 공장은 이등이었고 일등은 처음 듣는 회사였습니다. 박 반장이 주소를 찾아보니 오피스텔 7층인데 기계는 한 대도 없다고 했습니다.\n\n\"사장님, 여기는 뭘로 찍습니까?\"\n\"안 찍지. 받아서 넘기지.\"\n\n그 일감은 한 달 뒤에 정말로 김씨의 공장으로 왔고, 단가는 김씨가 써 낸 값보다 이 할이 낮았습니다.\n\n그날 저녁 공장 라디오에서 대통령의 목소리가 나왔고, 전쟁이 만든 돈이 정치로 흘러드는 길목을 막겠다는 말이었습니다. 박 반장은 소리를 키웠지만 김씨는 프레스를 세우지 않았습니다. 우리가 그 길목을 정말로 막기 전까지 김씨 같은 사람은 우리 말을 믿지 않을 것입니다."
 tfrkphn.924.next:0 "이어서 본다"
 tfrkphn.262.kp:0 "고용 창출 전략회의의 첫 회의 날 아침인데, 우리가 올린 자료 맨 위에는 숫자 하나가 적혀 있습니다. 전역하고도 일터를 찾지 못한 장병의 수인데, 대통령은 그 숫자를 오래 보았습니다. 34년 전에도 그는 숫자 앞에 앉아 있었습니다.\n\n1993년 2월 그는 김영삼 정부의 첫 노동부 장관이 되었습니다. 마흔넷으로 내각에서 가장 젊었고, 얼마 전까지 해고된 노동자들의 변호사였습니다.\n\n그해 여름 현대 계열사의 노사분규가 번졌고, 장관은 파업한 노동자에게도 식비와 가족수당 같은 생계비는 줘야 한다고 했습니다. 근거는 대법원 판례였고 사람들은 그것을 무노동 부분임금이라고 불렀습니다. 재계가 들고일어났고 경제기획원과 상공자원부가 철회를 요구했습니다. 여당은 무노동 무임금을 지키겠다고 했습니다."
 tfrkphn.262.kp2:0 "6월 21일에 세 부처가 함께 기자회견을 열었습니다. 기자들은 장관이 물러설 것이라고 예상했지만 그는 입장이 달라지지 않았다고 말했습니다. 노동법의 해석은 노동부의 일이라는 것이었습니다.\n\n같은 해 그는 고용보험 도입을 이끌었습니다. 일터를 잃은 사람이 다음 일터를 찾을 때까지 버티게 하는 제도입니다. 장관 자리에는 열 달을 있었고, 떠날 때 남은 생각은 단순했다고 합니다. 임금이든 보험이든 일자리가 있어야 따질 수 있다는 것입니다.\n\n비서실장이 문을 두드렸습니다.\n\n\"위원들이 다 모였습니다.\"\n\n대통령은 자료를 덮고 일어섰다가 회의실 문 앞에서 걸음을 멈췄습니다.\n\n\"오늘은 길게 말 안 하겠네.\"\n\"준비하신 원고는 어떻게 할까요?\"\n\"두게. 일자리부터 만들자는 말만 하면 되네. 34년 전에도 그 말을 하고 싶었네.\""
 tfrkphn.862.next:0 "이어서 본다"
 tfrkphn.477.kp:0 "대통령은 실업과 싸우는 법을 한 번 만들어 본 사람입니다. 1993년 12월 27일에 고용보험법이 만들어졌습니다. 그가 노동부 장관에서 물러난 바로 그달입니다.\n\n이 법은 세 가지 일을 합니다. 일자리를 잃은 사람에게 실업급여를 주고, 사람을 내보내지 않는 기업에 고용안정 지원금을 주고, 실업자와 재직자에게 직업훈련을 시킵니다. 처음 보험료는 임금의 0.6퍼센트였고 사업주와 노동자가 절반씩 냈습니다. 급여는 30일에서 210일까지 나왔습니다.\n\n대통령은 그때부터 이 법의 한계를 알고 있었다고 말합니다. 실업급여는 다음 일터를 찾을 때까지 버티게 하는 돈입니다. 다음 일터가 없으면 끝나는 날짜만 정해진 돈이 됩니다.\n\n지금 구직 창구 앞에는 군복을 벗은 수십만 명이 서 있고, 급여 창구를 늘려서는 저 줄이 줄지 않는다는 것을 우리도 압니다.\n\n늙은 노인이 전쟁을 하나 더 하겠다고 발표했습니다. 이번 상대는 실업입니다."
 tfrkphn.476.kp:0 "창원의 어느 기계 공장 노조 사무실에서 있었던 일입니다. 점심시간이 끝나 가는데 벽의 텔레비전에서는 대통령이 고용 창출 전략회의를 주재하고 있었습니다. 젊은 조합원 하나가 채널을 돌리려 하자 지회장 최씨가 그냥 두라고 했습니다.\n\n\"지회장님, 저 사람 찍으셨다면서요.\"\n\n사무실이 조용해졌습니다. 최씨는 민주노총 조끼를 삼십 년 입었고 선거 때마다 진보정당을 찍었다고 스스로 말해 온 사람입니다.\n\n\"찍었다.\"\n\"홍준표가 세운 사람인데요.\""
 tfrkphn.476.kp2:0 "최씨는 대답 대신 믹스커피를 저었습니다. 1998년 2월에 그는 스물아홉이었고, 딸이 백일을 갓 넘긴 때에 다니던 공장이 부도났습니다. 실업급여라는 말을 처음 들은 것은 노동사무소 창구에서였습니다. 넉 달 동안 나온 돈은 많지 않았어도 분유와 월세는 됐고, 그 넉 달 사이에 그는 지금 공장에 들어왔습니다.\n\n그 제도를 누가 들여왔는지는 나중에야 알았습니다. 파업한 사람한테도 생계비는 줘야 한다고 했다가 재계에 두들겨 맞은 1993년의 노동부 장관이었습니다.\n\n\"그 사람이 당을 몇 번 옮겼는지는 나도 안다. 나하고 생각이 다른 것도 안다.\"\n\"그런데요?\"\n\"빚이 있어서. 한 번은 갚아야지.\"\n\n최씨가 종이컵을 구기고 일어섰을 때 텔레비전 속 대통령은 일자리 숫자를 읽고 있었습니다.\n\n\"대신 저 숫자 못 채우면 내가 제일 먼저 머리띠 맨다.\""
 tfrkphn.876.next:0 "이어서 본다"
 tfrkphn.480.kp:0 "기업하기 좋은 나라란 지금 어디에도 없습니다. 미국이 붕괴했을 때 동쪽의 수출길이 막혔고 중국이 침공을 시작하자 서쪽의 수출길이 막혔습니다.\n\n그래도 기업은 있어야 합니다. 살기 힘들수록 돈을 벌어야 하고 돈을 버는 곳은 기업뿐입니다. 기업하기 좋은 나라가 없다면 우리가 직접 만들어야 한다는 것이 대통령의 생각입니다.\n\n규제는 교통신호등처럼 단순하고 분명하게 합니다. 전시 통제 경제를 걷어 냅니다. 정부보다 민간을, 대기업보다 중소기업을 앞에 둡니다.\n\n늙은 노인이 규제 목록을 가져오라고 했습니다."
 tfrkphn.478.kp:0 "좋은 일자리라는 것이 과연 가능한지를 대통령은 스스로 묻고, 역대 정부는 늘 일자리를 늘리겠다고 발표해 왔습니다.\n\n그는 그 대통령들을 다 기억합니다. 유신 반대를 하던 때의 박정희, 변호사 일을 하던 때의 전두환, 자기를 정계로 끌어들인 김영삼, 끝내 승리한 김대중, 자기와 싸운 노무현, 그리고 이명박과 박근혜와 문재인까지 모두가 좋은 일자리를 약속했습니다.\n\n그들 가운데 정말로 좋은 일자리를 만든 사람은 없었다고 대통령은 말합니다. 약속을 지키지 못했거나 수만 늘렸다는 것인데, 자기라고 다를 것 같지는 않다는 말도 그는 숨기지 않았습니다.\n\n그래도 이것은 그가 오래전부터 해 온 약속이고, 약속을 한 이상 해 보기는 해야 합니다. 우리는 군수 공장을 민수로 돌리고, 전역 장병에게 직업훈련을 시키고, 고용정보망을 넓힙니다. 목표는 5년 안에 100만 개입니다.\n\n늙은 노인이 갑자기 회의를 연다고 발표했습니다."
 tfrkphn.481.kp:0 "코스닥은 1996년 7월에 문을 열었습니다. 미국의 나스닥을 본뜬 시장으로, 공장도 담보도 없는 회사가 기술 하나로 돈을 구하는 곳이었습니다.\n\n2000년 3월 10일에 지수는 2,834까지 올랐고, 대통령은 그때 사람들이 회사 이름에 닷컴만 붙으면 돈을 넣는 것을 보았다고 합니다. 2001년 말에 지수는 722였고 2008년 10월에는 261까지 내려갔습니다. 돈을 잃은 사람들은 벤처라는 말만 들어도 고개를 돌렸습니다.\n\n거품은 꺼졌습니다. 하지만 그 거품 속에서 회사가 태어났습니다. 지금 우리가 쓰는 검색과 게임을 만든 회사들이 그 시장에서 돈을 구했습니다.\n\n전쟁은 무인기와 인공지능 기술을 앞당겼고 그 기술이 지금 군 창고에 쌓여 있습니다. 창고의 기술을 민간으로 풀려면 돈이 모이는 곳이 다시 있어야 하고, 관광과 의료와 문화도 같은 돈을 기다립니다.\n\n거품이 무섭다고 시장을 닫을 수는 없습니다. 이번에 우리는 장부부터 봅니다.\n\n늙은 노인이 내일 거래소에 가겠다고 발표했습니다."
 tfrkphn.479.kp:0 "일자리 하나면 가정 하나를 먹일 수 있고, 고용보험은 그 일자리를 잃은 가정이 무너지지 않게 하려고 만든 제도입니다.\n\n그런데 지금의 고용보험에는 실업급여만 되풀이해 타 가는 사람이 있는가 하면 혜택을 아예 누리지 못하는 사람도 있습니다. 임시직과 일용직, 프리랜서가 그렇습니다. 대통령은 자기가 설계한 것이 이런 모습은 아니었다고 했습니다. 굶는 사람을 구하려고 만든 법이 배부른 사람을 먹이고, 굶주린 사람은 계속 굶는다는 것입니다.\n\n노인은 오랜만에 책을 읽고 글을 씁니다.\n\n§Y고용보험법 개정법§!"
 tfrkphn.536.kp:0 "북쪽에서 넘어온 사람이 우리 조사관 앞에 처음 앉던 날의 기록입니다.\n\n\"아, 예. 여기다가 이름 적으시면 됩니다.\"\n\"함경도 출신 맞으신가요?\"\n\"예, 맞습네다.\"\n\"직업은 공장 노동자 맞으시고요.\"\n\"예, 맞습니다.\"\n\"몇 가지만 더 조사하고 여기서 나가시게 해 드리겠습니다.\"\n\n그는 신기했다고 합니다. 조사를 받는 동안 이렇게 친절한 사람은 처음 보았기 때문입니다. 남조선의 심리 공작이려니 했는데 저 사람들은 자기들끼리 말할 때도 똑같이 말했습니다. 몇 시간이 지나도록 한 대도 맞지 않았다는 것은 더 신기한 일이었습니다.\n\n지금 먹는 밥만 해도 이북에서는 먹을 수 없는 것이었습니다. 그래도 그의 마음은 고기에 가 있었는데, 이 고기를 마음껏 먹어 보는 것이 그의 소원이었습니다. 그는 오랜만에 용기를 냈습니다.\n\n\"저, 고기 좀 더 주실 수 있겠습네까.\"\n\n그는 맞을 각오를 했습니다. 우리 조사관은 식판을 들고 일어나 고기를 한 번 더 담아 왔습니다."
 tfrkphn.535.kp:0 "문재인 정부 시절은 북한 인권에 관한 한 대한민국 최악의 시기라고 불릴 만합니다. 대한민국은 2008년부터 11년 동안 해마다 유엔 북한인권결의안의 공동제안국에 이름을 올렸는데, 그 정부는 2019년부터 그 명단에서 빠졌습니다. 누구보다 인권을 앞세우던 사람들이 정작 같은 민족의 인권 앞에서는 입을 닫았으니 끔찍한 일입니다.\n\n이재명 같은 사람들이 이 나라를 다스렸다면 대북 정책이 어디까지 망가졌을지는 짐작하기도 어렵습니다.\n\n북한인권법은 2016년 3월에 국회를 통과했고, 그 법에 따라 북한인권재단을 세우게 되어 있었습니다. 그러나 문재인 정부 5년 동안 민주당은 재단 이사를 추천하지 않았고 100억 원이 넘던 재단 예산은 8억 원으로 깎였습니다. 그렇게 막혀 있던 재단을 우리는 오늘 정식으로 엽니다. 법이 생긴 지 십 년이 넘어서야 맞는 날입니다.\n\n좌파가 앞으로도 인권을 말하려거든 제 민족의 인권부터 챙기기를 바랍니다."
 tfrkphn.552.kp:0 "2017년 1월의 출마 선언에서 대통령은 통일을 경제 그 자체라고 불렀습니다. 통일에 드는 돈을 걱정하는 사람들에게 그는 골드만삭스의 전망을 꺼냈습니다. 통일하고 서른 해에서 마흔 해가 지나면 한국 경제가 독일과 일본을 넘어설 수 있다는 전망입니다.\n\n방식에 대해서도 그는 분명하게 말했습니다. 대한민국 헌법의 가치 위에서 국제사회와 협력해 자주적으로 이루어야 하며, 차별이나 보복 없이 민주적 절차를 거치는 통일이라면 두려워할 까닭이 없다고 했습니다.\n\n대통령이 된 그는 그 말을 정부 문서로 옮기라고 우리에게 지시했습니다. 기획재정부와 통일부가 함께 만든 보고서는 북쪽의 지하자원과 철도, 항만, 그리고 북쪽 주민들이 새로 만들 시장을 항목마다 숫자로 적었습니다. 보고서는 첫 장부터 통일에 드는 돈을 투자라고 부릅니다."
 tfrkphn.537.kp:0 "\"무분별한 세습 경영이 우리 기업들을 다 망치고 있습니다. 세습, 뭐 좋다 이거예요. 그런데 이 나라는 도가 넘었습니다. 유럽 보세요. 유럽에서 한국처럼 하면 회사가 망합니다. 심지어 그 중국도 그 정도로는 안 해요.\"\n\n집무실 텔레비전에서 토론에 나온 누군가가 말하고 있었습니다. 대통령은 맞는 말이라고 했습니다. 그는 대통령이 되기 전부터 기업의 횡포를 보아 왔습니다.\n\n기업은 이 나라에 꼭 필요합니다. 하지만 물은 이미 고일 대로 고였고 새로 들어오는 물은 번번이 바깥으로 떨어집니다. 내부거래와 기술 약탈은 모두 제 나라 기업을 상대로 하는 짓입니다.\n\n고여 있기는 일터도 마찬가지입니다. 한번 들어간 사람은 나오지 않고 밖에 선 사람은 들어가지 못하는 것이, 대통령이 노동부 장관이던 때와 달라진 데가 없습니다.\n\n누군가는 해야 하는 일이고 욕을 먹더라도 해야 하는 일입니다. 고인 물은 흘려보내야 썩지 않습니다. 그 일이 우리 차례로 왔습니다."
 tfrkphn.538.kp:0 "2002년 독일은 실업률이 11퍼센트에 가까웠고 노동시장은 굳을 대로 굳어 있었습니다. 슈뢰더 총리는 폭스바겐의 인사 담당 이사 페터 하르츠에게 이 일을 맡겼습니다. 노조와 협상해 본 경험을 높이 샀기 때문입니다. 하르츠는 노동계와 경영계, 정부와 학계 사람 열다섯 명으로 위원회를 꾸려 그해에 개선안 열세 가지를 내놓았습니다.\n\n법은 네 차례에 걸쳐 나왔습니다. 2003년의 첫 두 법은 실직 넉 달째부터 취업이나 직업훈련에 나설 의무를 지웠고, 월 400유로 이하의 미니잡을 넓히면서 생계형 1인 창업을 지원했습니다. 세 번째 법은 연방고용청을 뜯어고치고 실업급여를 받는 기간을 최장 32개월에서 18개월로 줄였습니다.\n\n2005년 1월에 시행된 네 번째 법은 기한 없이 주던 실업부조를 사회부조와 합쳐 월 345유로 안팎의 실업급여 2로 바꾸었으며, 알선받은 일자리를 거절하면 급여가 깎이게 했습니다."
 tfrkphn.538.kp2:0 "2005년에 486만 명, 실업률 11.2퍼센트까지 올랐던 실업은 그 뒤로 줄어들었습니다. 15세에서 64세 사이의 고용률도 2003년 64.6퍼센트에서 2011년에는 72.6퍼센트로 올랐습니다. 그 대신 저임금 일자리와 불안정한 일자리가 늘었다는 비판이 지금껏 따라다니고, 실업이 줄어든 것이 이 개혁 덕인지를 두고도 논란이 남아 있습니다. 슈뢰더의 연립정부는 네 번째 법이 시행된 그해 11월에 막을 내렸습니다.\n\n대통령은 이 개혁을 오래 지켜보았습니다. 2015년 새누리당 노동시장선진화특위 위원장이던 그는 한국이 추구할 모델이 하르츠 개혁과 비슷하다고 말했고, 그 개혁이 독일 경제를 젊고 강력하게 했다는 평가를 받는다고 덧붙였습니다.\n\n그가 독일에서 먼저 가져오려는 것은 열다섯 명이 한자리에 앉았던 그 방식입니다. 전쟁을 함께 버틴 노동계와 경영계가 노사정위원회에 다시 앉는 날, 우리는 독일이 얻은 것과 치른 값을 나란히 적은 자료부터 돌리기로 했습니다."
 tfrkphn.938.next:0 "이어서 본다"
 tfrkphn.539.kp:0 "2015년 9월 15일 노사정위원회 본회의는 노동시장 개혁에 관한 대타협을 의결했습니다. 대통령은 그때 여당의 노동시장선진화특위 위원장이었습니다.\n\n합의는 넉 달 만에 흔들렸습니다. 정부와 여당이 근로기준법과 고용보험법, 산재보험법, 기간제법, 파견법 개정안을 추진하면서 일반해고와 취업규칙에 관한 두 지침까지 내놓자, 한국노총은 이듬해 1월 합의 파기를 경고하고 노사정위원회 탈퇴를 선언했습니다. 합의문에 없던 비정규직 사용기간 연장과 파견 업종 확대가 법안에 들어갔다는 것이 노동계의 이유였습니다."
 tfrkphn.539.kp2:0 "법안이 국회에 묶여 있는 사이 선거가 왔습니다. 2016년 4월 13일 총선에서 새누리당은 122석에 그쳐 과반을 잃었고 16년 만에 여소야대 국회가 들어섰습니다. 다섯 법안을 한꺼번에 처리할 힘은 그날로 사라졌습니다.\n\n대통령은 그 봄을 잊지 않았습니다. 합의를 기다리는 동안에도 의석은 줄어들 수 있고, 지금의 다수가 다음 선거 뒤에도 남아 있으리라는 보장은 어디에도 없습니다. 우리는 언제 다시 소수당이 될지 모릅니다.\n\n그는 당 지도부를 불러 근로기준법과 기간제법, 파견법 개정안을 이번 회기 안에 모두 처리해 달라고 했습니다. 승전의 지지율이 남아 있는 지금 필요한 것은 전부 통과시켜 두겠다는 뜻입니다. 노동계가 등을 돌리리라는 것은 대통령도 우리도 알고 있습니다."
 tfrkphn.939.next:0 "이어서 본다"
 tfrkphn.540.kp:0 "통계청이 2022년 8월에 내놓은 숫자로 2021년에 태어난 아이는 26만 600명, 합계출산율은 0.81명이었습니다. 통계를 내기 시작한 1970년 이래 가장 낮은 숫자였는데 우리는 그 뒤로 전쟁까지 치렀습니다.\n\n전쟁은 사람을 데려갔고, 살아 돌아온 청년의 수는 공장과 건설 현장의 빈자리를 채우기에 모자랐습니다. 사람은 나날이 줄어드는데 일할 사람이 없습니다.\n\n예전 같으면 바깥에서 사람을 불러왔을 것입니다. 그러나 전쟁이 끝난 뒤로 바닷길과 하늘길은 예전 같지 않고, 사람을 보내던 나라들은 제 나라 일손을 붙잡아 두기 시작했습니다. 고용허가제로 들어오는 외국인 노동자는 전쟁 전보다 크게 줄었습니다."
 tfrkphn.540.kp2:0 "남은 길은 나라 안에 있습니다. 2013년 국회는 정년을 60세 이상으로 정하도록 법을 고쳤고, 이 법은 2016년에 300명 이상 사업장부터, 이듬해에는 나머지 사업장까지 적용되었습니다. 그때 정부와 여당은 임금피크제를 함께 묶어야 한다고 주장했지만 야당의 반대로 절충에 그쳤습니다.\n\n대통령은 이번에는 둘을 한 법안에 담기로 했습니다. 정년을 더 늘려 일하던 사람을 일터에 남기고, 해마다 저절로 오르는 임금체계를 고쳐 돌아온 청년을 뽑을 여력을 만든다는 것입니다. 일할 사람은 결국 국내에서 찾아야 합니다."
 tfrkphn.940.next:0 "이어서 본다"
 tfrkphn.541.kp:0 "일하지 않는 자는 먹지도 말라는 말은 신약성서 데살로니가후서 3장에서 나왔습니다. 바울이 일하기 싫어하는 사람을 꾸짖느라 쓴 말인데, 천구백 년쯤 뒤 소련은 같은 문장을 1936년 헌법 12조에 옮겨 적었습니다. 서로 원수였던 교회와 공산당이 이 문장만은 함께 쓴 셈입니다.\n\n전쟁 동안 임금은 일과 따로 움직였습니다. 공장이 멈춘 날에도 전시 특별수당은 나갔고, 물가를 따라잡느라 붙인 수당이 해마다 기본급 위에 쌓였습니다. 전쟁이 끝나고 생산은 아직 제자리를 찾지 못했는데 임금표는 전시 그대로 남아 있습니다.\n\n대통령은 경제장관회의에서 그 오래된 문장을 꺼냈습니다. 일한 만큼 받고 만든 만큼 올린다는 원칙을 다시 세우자는 것이었고, 임금 인상은 생산성이 오른 범위 안에서만 한다는 지침이 그날 정해졌습니다.\n\n전시 특별수당은 세 해에 걸쳐 없애기로 했습니다. 수당이 빠지는 만큼 월급봉투는 얇아질 것이고, 노동계는 전쟁을 버틴 값을 이제 와서 깎느냐고 우리에게 묻고 있습니다."
 tfrkphn.542.kp:0 "1993년 5월 18일, 노동부 장관 이인제는 파업 기간에도 가족수당과 식대, 교통비처럼 생활을 보장하는 성격의 임금은 주도록 행정지도를 하겠다고 발표했습니다. 무노동 무임금 원칙이 임금을 둘로 나누어 본 대법원 판례와 어긋난다는 것이 그의 논리였습니다.\n\n재계는 정면으로 반발했습니다. 지난해 분규를 겪은 회사의 97퍼센트가 무노동 무임금을 지켰고 미국과 서구도 그렇게 한다는 것, 파업 중에 임금을 주면 파업을 부추긴다는 것이 재계의 주장이었습니다. 경제기획원과 상공부도 반대했고 당정회의는 제도를 미루는 쪽으로 기울었습니다. 한 신문은 사설 제목에 장관의 노정관이 너무 튄다고 적었습니다."
 tfrkphn.542.kp2:0 "6월 9일 노동부는 방침을 거두었습니다. 그는 기자들에게 무노동 무임금 원칙의 현실성과 타당성을 논쟁으로 검증한 것만으로도 성과가 있었다고 말했습니다. 그러고도 열이틀 뒤 3부 장관 합동회견에서 이 문제가 노동관계법령을 대법원 판례와 맞추려는 과정에서 생긴 일이라고 다시 설명했습니다.\n\n서른 해가 넘게 지나 대통령은 그때 거둔 지침을 다시 꺼냈습니다. 전쟁 내내 파업을 참은 노동자들이 먼저 요구해 온 것이기도 합니다. 파업을 해도 밥값과 가족수당은 끊기지 않으며, 일하지 않은 시간의 기본급은 여전히 나가지 않습니다. 이번에 우리는 그것을 법에 적어 두기로 했습니다."
 tfrkphn.942.next:0 "이어서 본다"
 tfrkphn.553.kp:0 "2007년 대선에서 대통령은 지분소유형 임대주택 230만 호를 약속했습니다. 입주자가 가진 돈만큼만 지분을 사고 나머지는 임대로 살면서 지분을 늘려 간다는 구상이었는데, 시민단체는 택지와 자금을 어떻게 마련할지가 구체적이지 않다고 평가했습니다.\n\n비슷한 제도는 2020년 8월 정부의 주택 공급 대책에 지분적립형 분양주택이라는 이름으로 들어갔습니다. 분양가의 20에서 40퍼센트를 먼저 내고 스무 해에서 서른 해에 걸쳐 나머지 지분을 사들이는 방식이었고, 서울시는 2028년까지 1만 7천 가구를 공급하겠다고 했습니다.\n\n우리는 이 제도를 전역 장병과 신혼부부에게 먼저 엽니다. 전쟁에서 돌아온 청년들에게는 집을 살 목돈이 없고, 전시에 묶였던 택지는 이제 풀리고 있습니다. 국토교통부는 첫 지분을 분양가의 5분의 1로 낮추고 군 복무 기간만큼 지분을 사들이는 기간을 줄여 주는 안을 내놓았습니다."
 tfrkphn.554.kp:0 "1997년 대선에서 대통령은 공무원과 공기업의 여성 채용을 2002년까지 30퍼센트로 늘리고 여성 정책을 총괄할 여성처를 만들겠다고 공약했습니다. 그때 한 신문은 세 후보의 여성 공약이 서로 구분하기 어려울 만큼 비슷하고 예산과 실행 계획이 빠져 있다고 썼습니다.\n\n서른 해 뒤에 그 숫자는 다른 길로 채워졌고, 남자들이 전선에 있는 동안 공장과 항만, 관제실을 돌린 것은 여성이었습니다. 전쟁이 끝난 지금 그들 가운데 많은 수가 일터를 떠날지 말지를 고민하고 있습니다. 아이를 맡길 곳이 없기 때문입니다.\n\n우리는 국공립 보육시설을 절반 더 늘리고, 전시에 일하던 여성이 그 자리에 남을 수 있도록 공공 부문부터 여성 고용 비율 30퍼센트를 채우기로 했습니다. 보육 예산은 내년 예산안의 맨 앞 장에 실었습니다."
 tfrkphn.555.kp:0 "2018년 충남지사 선거에서 대통령의 핵심 공약 가운데 하나는 어르신 통합 복지카드였습니다. 바우처 카드에 해마다 일정한 금액을 채워 주고 의료비와 교통비, 이미용비, 목욕비로 쓰게 한다는 내용이었습니다. 공약을 평가한 시민단체는 대상과 금액이 분명해 현실성은 있지만 쓸 곳이 좁다고 보았습니다.\n\n그는 그 선거에서 졌고 카드는 한 장도 나가지 못했습니다.\n\n대통령이 된 그는 같은 카드를 전국으로 넓히면서 쓸 곳을 늘렸습니다. 약국과 안경점, 동네 식당이 더해졌고, 첫 카드는 자식을 전쟁터에 보냈던 세대에게 먼저 나갑니다. 보건복지부가 이 카드 한 장으로 합쳐지는 수당과 할인을 세어 보니 열한 가지였습니다."
 tfrkphn.547.kp:0 "2017년 1월 15일 여의도 당사에서 대통령은 네 번째 대선 출마를 선언했습니다. 대통령이 되면 여섯 달 안에 헌법을 고쳐 경제와 교육, 노동, 복지 같은 내정은 내각에 넘기고, 외교와 안보, 국방, 통일은 대통령이 맡겠다는 것이 그날의 약속이었습니다.\n\n그는 그해 경선에서 졌고 약속은 써 보지 못했습니다.\n\n열 해가 지나 대통령이 된 그는 일하는 방식부터 그렇게 바꾸었습니다. 내정의 서류는 총리실에서 먼저 걸러지고, 우리가 집무실 책상에 올리는 보고는 합참과 외교부, 통일부의 것이 맨 위에 놓입니다. 대만해협에서 이기고 돌아온 군대를 어디에 세울지도 그가 직접 정하기로 했습니다. 첫 지시는 군의 눈을 북쪽으로 돌리라는 것이었습니다."
 tfrkphn.548.kp:0 "2017년 3월 19일, 자유한국당 경선의 첫 텔레비전 토론에서 독자 핵무장에 찬성하느냐는 질문이 나왔습니다. 홍준표는 찬성 팻말을 들고 이제는 공포의 핵 균형으로 북핵을 막아야 할 때라고 했습니다. 이인제가 든 것은 반대 팻말이었습니다. 유럽의 최강자는 독일인데 핵이 없다는 것, 핵 없는 한반도로 나가야 한다는 것이 그의 말이었습니다.\n\n그 뒤로 세상이 바뀌었습니다. 미국의 핵우산은 사라졌고, 찬성 팻말을 들었던 사람이 대통령이 되어 일본과 함께 억지력을 쌓았습니다. 반대 팻말을 들었던 총리는 국무회의에서 혼자 반대표를 던졌고, 이제 대통령이 되어 그 억지력을 물려받았습니다.\n\n소신은 달라지지 않았다고 대통령은 우리에게 말했습니다. 다만 북핵이 그대로 있는 동안 전임 정부가 쌓은 것을 제 손으로 허물 수는 없다고 했고, 북핵이 사라지는 날 함께 내려놓겠다는 단서를 발표문 끝에 달았습니다."
 tfrkphn.549.kp:0 "2017년 1월의 출마 선언에서 대통령은 사드를 한국과 미국이 합의한 최소한의 대응이라고 불렀습니다. 그 최소한의 조치에 중국이 반발하고 나라 안의 여론까지 갈라지는 것을 그는 걱정했습니다.\n\n지금은 사정이 더 나쁩니다. 전쟁에서 진 중국은 다시 군비를 늘리고 있고 북쪽의 미사일은 그대로 남아 있습니다. 국방부가 방어망을 북쪽과 서쪽으로 넓히는 계획을 올리자, 대통령은 요격 포대의 수와 레이더가 놓일 자리를 하나씩 물은 뒤에 결재했습니다.\n\n그는 이번에도 같은 말을 골랐습니다. 방어망은 날아오는 것을 막을 뿐이고 이번 확장도 최소한의 대응조치라는 설명을 우리는 그날 주변국에 전달했습니다."
 tfrkphn.550.kp:0 "2018년 7월 27일 정부는 국방개혁 2.0을 발표했습니다. 61만 8천여 명이던 상비 병력을 2022년까지 50만 명으로 줄이고, 436명이던 장군은 360명으로, 육군 병사의 복무 기간은 21개월에서 18개월로 줄인다는 계획이었습니다.\n\n그 계획은 전쟁을 겪지 않은 군대를 두고 짠 것입니다. 대만해협의 전쟁은 바다와 하늘에서 치러졌고 우리 군은 거기서 이겼지만, 다음 임무는 북쪽의 산과 도시에 있습니다.\n\n국방부가 올린 2단계 계획은 승전의 교훈을 부대 편제에 옮기는 일입니다. 겹치는 사령부를 합치고, 해군과 공군에 쏠렸던 전시 예산을 산악과 시가지에서 싸울 부대로 돌립니다. 장군 자리가 다시 줄어든다는 소식에 군 안의 반응은 조용하지 않습니다."
 tfrkphn.551.kp:0 "1990년 독일은 통일을 얻으면서 값을 치렀습니다. 코카서스 회동에서 통일 독일은 병력을 37만 명으로 묶고 핵을 갖지 않겠다고 약속했고, 주변국의 동의는 그 약속 위에서 나왔습니다.\n\n대통령은 2017년 출마 선언에서 북한 체제가 본질적 변화를 피할 수 없고 통일의 결정적 기회가 가까이 오고 있다고 말했습니다. 그날이 왔을 때 군이 무엇을 해야 하는지는 그때도 정해져 있지 않았습니다.\n\n국방부의 새 계획은 그 빈칸을 채웁니다. 북한 지역의 안정화를 맡을 부대와 압록강, 두만강 국경을 지킬 부대를 미리 짜 두고, 주변국이 병력과 핵을 두고 무엇을 요구할지도 독일의 예를 놓고 따져 보았습니다. 계획서의 마지막 장에는 통일 뒤에 우리가 줄여야 할 것들의 목록이 붙었습니다."
 tfrkphn.301.kp:0 "2027년 3월 3일, 양안전쟁이 끝나고 처음 치르는 대통령 선거의 날이 밝았습니다.\n\n5년 단임제에 묶인 홍준표 대통령은 출마할 수 없습니다. 국민의힘은 승전 정부를 잇겠다는 뜻으로 그 정부의 국무총리 이인제를 후보로 세웠고, 전쟁에서 이긴 정부의 지지율은 선거 날까지 내려가지 않았습니다.\n\n후보는 아침 일찍 투표를 마치고 돌아와 오래된 글 하나를 다시 꺼내 읽었습니다. 5년 전 3월 9일, 그때도 대선 날 아침에 쓴 글입니다. 주권자인 국민이 결단할 시간이 왔고 국민에게는 두려울 것이 없다고 적은 글인데, 맨 끝에 그는 모두 함께 \"새로운 출발선에 서자\"고 써 두었습니다. 그날은 다른 사람의 당선을 바라며 쓴 글이었습니다."
 tfrkphn.301.kp2:0 "개표는 자정을 넘기기 전에 기울었고, 당선이 확실하다는 자막이 뜨자 선거 사무소에 모인 우리는 그의 이름을 불렀습니다. 여든을 바라보는 당선인은 한동안 자리에서 일어나지 않았습니다. 1997년에 처음 도전한 뒤로 30년이 걸린 일입니다.\n\n홍준표 정부가 시작한 개혁과 전후의 동맹 질서는 이제 우리 정부가 이어받습니다."
 tfrkphn.701.next:0 "이어서 본다"
