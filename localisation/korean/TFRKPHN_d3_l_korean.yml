l_korean:
 # 이인제 정부: 정년 연장과 임금체계 개편. d3_build.py가 만든다.
 tfrkphn.540.t:0 "일할 사람"
 tfrkphn.540.story:0 "통계청이 2022년 8월에 내놓은 숫자로 2021년에 태어난 아이는 26만 600명, 합계출산율은 0.81명이었다. 통계를 내기 시작한 1970년 이래 가장 낮은 숫자였는데, 그 뒤로 전쟁까지 치렀다.\n\n전쟁은 사람을 데려갔고, 살아 돌아온 청년의 수는 공장과 건설 현장의 빈자리를 채우기에 모자랐다. 사람은 나날이 줄어드는데 일할 사람이 없다.\n\n예전 같으면 바깥에서 사람을 불러왔을 것이다. 그러나 전쟁이 끝난 뒤로 바닷길과 하늘길은 예전 같지 않고, 사람을 보내던 나라들은 제 나라 일손을 붙잡아 두기 시작했다. 고용허가제로 들어오는 외국인 노동자는 전쟁 전보다 크게 줄었다.\n\n남은 길은 나라 안에 있다. 2013년 국회는 정년을 60세 이상으로 정하도록 법을 고쳤고, 이 법은 2016년에 300명 이상 사업장부터, 이듬해에는 나머지 사업장까지 적용되었다. 그때 정부와 여당은 임금피크제를 함께 묶어야 한다고 주장했지만 야당의 반대로 절충에 그쳤다.\n\n이인제는 이번에는 둘을 한 법안에 담기로 했다. 정년을 더 늘려 일하던 사람을 일터에 남기고, 해마다 저절로 오르는 임금체계를 고쳐 돌아온 청년을 뽑을 여력을 만든다는 것이다. 일할 사람은 결국 국내에서 찾아야 한다."
 tfrkphn.540.a:0 "일손은 나라 안에서 찾는다"
