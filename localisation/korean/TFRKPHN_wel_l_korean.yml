l_korean:
 # 이인제 정부: 통일과 복지 중점 이벤트. wel_build.py가 만든다.
 tfrkphn.552.t:0 "통일은 경제다"
 tfrkphn.552.story:0 "2017년 1월의 출마 선언에서 이인제는 통일을 경제 그 자체라고 불렀다. 통일에 드는 돈을 걱정하는 사람들에게 그는 골드만삭스의 전망을 꺼냈는데, 통일하고 서른 해에서 마흔 해가 지나면 한국 경제가 독일과 일본을 넘어설 수 있다는 것이었다.\n\n방식에 대해서도 그는 분명하게 말했다. 대한민국 헌법의 가치 위에서 국제사회와 협력해 자주적으로 이루어야 하며, 차별이나 보복 없이 민주적 절차를 거치는 통일이라면 두려워할 까닭이 없다고 했다.\n\n대통령이 된 그는 그 말을 정부 문서로 옮기게 했다. 기획재정부와 통일부가 함께 만든 보고서는 북쪽의 지하자원과 철도, 항만, 그리고 북쪽 주민들이 새로 만들 시장을 항목마다 숫자로 적었고, 첫 장부터 통일에 드는 돈을 투자라고 불렀다."
 tfrkphn.552.a:0 "통일은 성장이다"
 tfrkphn.553.t:0 "가진 만큼의 지분"
 tfrkphn.553.story:0 "2007년 대선에서 이인제는 지분소유형 임대주택 230만 호를 약속했다. 입주자가 가진 돈만큼만 지분을 사고 나머지는 임대로 살면서 지분을 늘려 간다는 구상이었는데, 시민단체는 택지와 자금을 어떻게 마련할지가 구체적이지 않다고 평가했다.\n\n비슷한 제도는 2020년 8월 정부의 주택 공급 대책에 지분적립형 분양주택이라는 이름으로 들어갔다. 분양가의 20에서 40퍼센트를 먼저 내고 스무 해에서 서른 해에 걸쳐 나머지 지분을 사들이는 방식이었고, 서울시는 2028년까지 1만 7천 가구를 공급하겠다고 했다.\n\n이인제 정부는 이 제도를 전역 장병과 신혼부부에게 먼저 연다. 전쟁에서 돌아온 청년들에게는 집을 살 목돈이 없고, 전시에 묶였던 택지는 이제 풀리고 있다. 국토교통부는 첫 지분을 분양가의 5분의 1로 낮추고 군 복무 기간만큼 지분을 사들이는 기간을 줄여 주는 안을 내놓았다."
 tfrkphn.553.a:0 "가진 만큼부터 시작한다"
 tfrkphn.554.t:0 "일하는 어머니"
 tfrkphn.554.story:0 "1997년 대선에서 이인제는 공무원과 공기업의 여성 채용을 2002년까지 30퍼센트로 늘리고 여성 정책을 총괄할 여성처를 만들겠다고 공약했다. 그때 한 신문은 세 후보의 여성 공약이 서로 구분하기 어려울 만큼 비슷하고 예산과 실행 계획이 빠져 있다고 썼다.\n\n서른 해 뒤에 그 숫자는 다른 길로 채워졌다. 남자들이 전선에 있는 동안 공장과 항만, 관제실을 돌린 것은 여성이었고, 전쟁이 끝난 지금 그들 가운데 많은 수가 일터를 떠날지 말지를 고민하고 있다. 아이를 맡길 곳이 없기 때문이다.\n\n이인제 정부는 국공립 보육시설을 절반 더 늘리고, 전시에 일하던 여성이 그 자리에 남을 수 있도록 공공 부문부터 여성 고용 비율 30퍼센트를 채우기로 했다. 보육 예산은 내년 예산안의 맨 앞 장에 실렸다."
 tfrkphn.554.a:0 "아이 맡길 곳부터 짓는다"
 tfrkphn.555.t:0 "카드 한 장"
 tfrkphn.555.story:0 "2018년 충남지사 선거에서 이인제의 핵심 공약 가운데 하나는 어르신 통합 복지카드였다. 바우처 카드에 해마다 일정한 금액을 채워 주고 의료비와 교통비, 이미용비, 목욕비로 쓰게 한다는 내용이었다. 공약을 평가한 시민단체는 대상과 금액이 분명해 현실성은 있지만 쓸 곳이 좁다고 보았다.\n\n그는 그 선거에서 졌고 카드는 한 장도 나가지 못했다.\n\n대통령이 된 그는 같은 카드를 전국으로 넓히면서 쓸 곳을 늘렸다. 약국과 안경점, 동네 식당이 더해졌고, 첫 카드는 자식을 전쟁터에 보냈던 세대에게 먼저 나간다. 보건복지부가 이 카드 한 장으로 합쳐지는 수당과 할인을 세어 보니 열한 가지였다."
 tfrkphn.555.a:0 "카드 한 장으로 합친다"
