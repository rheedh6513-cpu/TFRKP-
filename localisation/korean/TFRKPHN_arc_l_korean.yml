l_korean:
 # 홍준표와 이인제 두 사람의 줄기. arc_build.py가 만든다.
 tfrkphn.568.t:0 "변방에서 온 사람"
 tfrkphn.568.story:0 "대통령은 2011년 당 대표가 되던 날 치열했던 변방의 정신을 잊지 않겠다고 말했습니다. 자기에게는 계파가 없다는 말도 그날 했습니다. 십 년이 넘게 지나 그는 정말로 계파 하나 없이 이 자리에 왔고, 우리는 그 덕에 누구에게도 자리를 빚지지 않고 내각 명단을 짤 수 있었습니다.\n\n계파가 없다는 것은 기댈 사람도 없다는 뜻입니다. 여의도에서 대통령을 진심으로 좋아하는 사람을 우리는 한 손으로 꼽습니다. 대통령은 그 점을 조금도 아쉬워하지 않습니다.\n\n2017년 대선에서 진 뒤로 다섯 해 동안 그는 하고 싶은 말을 하고 싶은 때에 하면서 여기까지 왔습니다. 돌려 말하지 않는 사람이라 청년들이 좋아한다는 것이 선거 때 우리가 내린 분석이었습니다. 이제 우리가 할 일은 그 말들이 정책이 되기 전에 숫자를 붙이는 것입니다.\n\n책상 위에는 사법시험과 모병제, 노동 유연화, 핵공유가 차례를 기다리고 있습니다. 전부 그가 오래전부터 해 온 말입니다. 말한 대로 하는 일만 남았습니다."
 tfrkphn.568.a:0 "말한 대로 한다"
 tfrkphn.563.t:0 "쓸 만한 사람"
 tfrkphn.563.story:0 "내각이 출범한 지 두 달이 지났습니다. 여의도는 여전히 시끄럽지만 대통령의 책상 위는 조금씩 정리되어 가고 있습니다. 그 책상에 가장 자주 서류를 올리는 사람은 이인제 국무총리입니다.\n\n우리는 이 사람을 잘 압니다. 2017년 경선에서 대통령과 맞붙었고, 독자 핵무장을 묻는 토론에서 반대 팻말을 든 사람입니다. 그 이듬해 당이 가장 어려웠을 때 아무도 나서려 하지 않던 충남지사 선거에 나가 달라고 부탁한 쪽도 우리였습니다. 당 대표였던 대통령은 그를 김종필 이후 충청이 낳은 가장 큰 인물이라고 치켜세웠고, 그는 벽돌 한 장이 되겠다며 그 부름을 받았습니다."
 tfrkphn.563.next:0 "이어서 본다"
 tfrkphn.663.story:0 "총리 자리를 맡긴 까닭을 대통령은 한 번도 길게 말하지 않았습니다. 우리가 들은 것은 계파가 없어 빚질 데가 없고 노동부 장관을 해 봐서 공장을 안다는 두 마디가 전부입니다. 대통령의 셈으로는 그것으로 충분합니다. 필요해서 불렀고 부른 사람이 왔으니까요.\n\n지난주 주례 보고에서 총리는 노동 개혁만은 대통령이 직접 챙겨야 한다고 말했습니다. 대통령은 고개도 끄덕이지 않았습니다. 다만 그가 나간 뒤에 비서실장에게 일렀습니다. 일흔이 넘어서도 할 말이 남은 사람이니 보고 시간을 줄이지 말라고.\n\n두 사람이 한 책상에서 얼마나 오래 갈지 우리는 아직 모릅니다."
 tfrkphn.563.a:0 "보고 시간은 그대로 둔다"
 tfrkphn.564.t:0 "반대 한 표"
 tfrkphn.564.story:0 "대통령은 2021년 가을의 경선 토론에서 나토식 핵공유를 다섯 해 전부터 주장해 왔다고 말했습니다. 서독의 슈미트 총리가 미국에 전술핵을 들여놓으라고 요구했던 일이 그가 든 근거였습니다. 이제 우리는 그 주장을 협의체라는 이름으로 책상 위에 올렸습니다.\n\n국무회의에서 반대한 사람은 하나였습니다. 이인제 총리입니다. 그는 2017년에 들었던 반대 팻말을 내려놓은 적이 없고, 유럽에서 가장 강한 나라 독일에는 핵이 없다는 말을 그날도 되풀이했습니다.\n\n대통령은 독일이 핵 없이 버티는 것은 미국의 핵이 그 땅에 들어가 있어서라고 받았습니다. 회의는 십 분 만에 끝났고 안건은 원안대로 넘어갔습니다."
 tfrkphn.564.a:0 "반대 1을 남겨 둔다"
 tfrkphn.565.t:0 "울산에 갔던 사람"
 tfrkphn.565.story:0 "전쟁이 석 달째로 접어들었습니다. 조선소와 탄약 공장의 노조가 전시 수당을 걸고 파업을 예고했고, 군수 생산이 멈추면 전선도 멈추기 때문에 우리는 긴급조정권을 꺼낼 채비를 했습니다.\n\n그때 이인제 총리가 자기가 내려가겠다고 했습니다. 핵공유에 혼자 반대표를 던졌던 그 사람입니다. 그에게는 내세울 것이 하나 있었습니다. 1993년 6월 노동부 장관이던 그는 현대 노사분규가 한창이던 울산에 내려갔습니다. 장관이 분규 현장에 직접 들어가 중재한 것은 정부 수립 뒤 처음이었고, 그는 열여섯 시간 만에 현대자동차 노조 위원장에게서 당장 강경한 파업은 하지 않겠다는 말을 받아 냈습니다."
 tfrkphn.565.next:0 "이어서 본다"
 tfrkphn.665.story:0 "대통령은 삼십 년 전 이야기라고 잘랐습니다. 그러고는 사흘을 주겠다고 했습니다. 사흘 안에 풀지 못하면 긴급조정권을 쓸 것이고, 그때는 총리 자리도 같이 걸린다는 조건이었습니다.\n\n그는 이틀 만에 돌아왔습니다. 손에는 수당을 전쟁이 끝난 뒤에 정산하고 파업은 미룬다는 합의문이 들려 있었습니다. 수고했다는 말은 없었습니다. 대통령은 합의문을 끝까지 읽고 나서 다음은 거제라고 했습니다.\n\n전쟁이 끝난 뒤에 정산한다는 그 한 줄을 누가 갚게 될지, 우리는 아직 모릅니다."
 tfrkphn.565.a:0 "다음은 거제다"
 tfrkphn.566.t:0 "바통"
 tfrkphn.566.story:0 "전당대회가 끝났고 후보는 이인제로 정해졌습니다. 다섯 해 가까이 대통령의 책상에 서류를 올리던 총리가 이제 후보입니다. 2022년에 그를 부를 때 여기까지 내다본 사람은 우리 가운데 없습니다. 그날 밤 대통령은 그를 관저로 불렀고, 차는 내오지 않았습니다.\n\n전쟁에서 이긴 대통령에게는 한 번 더 하라는 말이 따라붙습니다. 헌법을 고쳐 다시 나서라는 권유가 여러 번 올라왔지만 대통령은 그때마다 서류를 돌려보냈습니다. 그는 2017년 5월 9일 밤 개표가 열에 하나도 끝나지 않았을 때 선거 결과를 수용하겠다고 말한 사람입니다. 그런 사람이 전쟁을 핑계로 선거를 건너뛸 수는 없다는 것이 그의 대답이었습니다.\n\n대통령에게는 계파가 없습니다. 물려줄 계파가 없으니 넘겨줄 것은 일밖에 없습니다. 그가 내민 종이에는 네 줄이 적혀 있었습니다. 핵억지, 채무, 군 가산점, 사형제. 손대지 말라는 것들의 목록입니다."
 tfrkphn.566.next:0 "이어서 본다"
 tfrkphn.666.story:0 "이인제는 목록을 끝까지 읽고 접어서 주머니에 넣었습니다. 지키겠다는 말도 못 지키겠다는 말도 하지 않았습니다. 그가 한 말은 자기는 1997년에 오백만 표 가까이 받고도 진 사람이라는 것, 그러니 이번에는 남의 약속을 들고 뛰지는 않겠다는 것이었습니다.\n\n대통령은 웃지 않았습니다. 여든을 앞둔 사람이 바통이나 떨어뜨리지 말라고 했고, 이인제는 문을 나서면서 떨어뜨릴 바통이었으면 받지도 않았다고 받아쳤습니다.\n\n이인제가 떠난 뒤 대통령은 현관까지 혼자 걸어 나와 차가 내려가는 것을 지켜보았습니다. 배웅하러 따라 나온 사람은 없었습니다. 계파 없이 들어온 관저는 나가는 날에도 조용했습니다.\n\n우리는 곧 짐을 쌉니다. 그리고 우리 가운데 몇은 저 노인 밑에서 다시 짐을 풀게 될 것입니다."
 tfrkphn.566.a:0 "바통은 넘어갔다"
 tfrkphn.567.t:0 "새벽 세 시"
 tfrkphn.567.story:0 "대아대전이 터진 날, 자정이 넘은 시각에 홍준표 전 대통령이 약속도 없이 집무실 정문에 나타났습니다. 경호처가 어떻게 할지를 물었고 대통령은 들이라고 했습니다. 우리 가운데 홍준표 정부에서 넘어온 사람들은 걸음걸이만 보고도 누구인지 알았습니다.\n\n전임 대통령은 인사도 없이 지도부터 찾았습니다. 그는 대만해협 전쟁 때 자기가 저지른 실수를 세 가지 꼽았습니다. 탄약을 아낀 것, 일본을 늦게 믿은 것, 그리고 국민에게 석 달이면 끝난다고 말한 것이었습니다.\n\n대통령은 받아 적지 않고 들었습니다. 다 듣고 나서 그때로 돌아가도 참전을 하겠느냐고 하나만 물었습니다. 전임 대통령은 한다고 답했고, 더 일찍 한다고 덧붙였습니다.\n\n그가 일어선 것은 새벽 세 시였습니다. 문 앞에서 돌아보지 않은 채 빚은 전쟁이 끝난 다음에 걱정하라고 했습니다. 채무 제로를 입에 달고 살던 사람의 말입니다.\n\n두 사람은 악수하지 않았습니다. 우리가 본 것은 대통령이 그가 나간 뒤에도 한참 동안 지도를 접지 않았다는 것뿐입니다."
 tfrkphn.567.a:0 "지도를 다시 편다"
 tfrkphn.564.next:0 "이어서 본다"
 tfrkphn.664.story:0 "회의록에는 반대 1이라는 숫자가 남았습니다. 총리의 반대를 그대로 적어 두어도 되겠느냐고 묻자 대통령은 그냥 두라고 했습니다. 반대가 한 표라도 적혀 있어야 핵을 가진 우방에 내밀 때 모양이 난다는 것입니다.\n\n대통령은 총리를 따로 부르지도 않았습니다. 국무회의는 헌법이 정한 심의 기구이고 반대가 나오라고 여는 자리라는 것이 그의 말이었습니다. 총리는 다음 주에도 같은 자리에 앉아 다른 안건에 찬성했습니다.\n\n그 한 표가 언젠가 다른 무게로 돌아올 수 있다는 생각을 우리는 그때 하지 못했습니다."
