 # 이인제 정부: 안보 갈래 중점 이벤트. sec_build.py가 만든다.
 tfrkphn.547.t:0 "외정은 대통령이"
 tfrkphn.547.story:0 "2017년 1월 15일 여의도 당사에서 이인제는 네 번째 대선 출마를 선언했다. 대통령이 되면 여섯 달 안에 헌법을 고쳐 경제와 교육, 노동, 복지 같은 내정은 내각에 넘기고, 외교와 안보, 국방, 통일은 대통령이 맡겠다는 것이 그날의 약속이었다.\n\n그는 그해 경선에서 졌고 약속은 써 보지 못했다.\n\n열 해가 지나 대통령이 된 그는 일하는 방식부터 그렇게 바꾸었다. 내정의 서류는 총리실에서 먼저 걸러지고, 집무실 책상에는 합참과 외교부, 통일부의 보고가 맨 위에 놓인다. 대만해협에서 이기고 돌아온 군대를 어디에 세울지도 그가 직접 정하기로 했는데, 첫 지시는 군의 눈을 북쪽으로 돌리라는 것이었다."
 tfrkphn.547.a:0 "북쪽을 본다"
 tfrkphn.548.t:0 "반대 팻말"
 tfrkphn.548.story:0 "2017년 3월 19일, 자유한국당 경선의 첫 텔레비전 토론에서 독자 핵무장에 찬성하느냐는 질문이 나왔다. 홍준표는 찬성 팻말을 들고 이제는 공포의 핵 균형으로 북핵을 막아야 할 때라고 했다. 이인제가 든 것은 반대 팻말이었다. 유럽의 최강자는 독일인데 핵이 없다는 것, 핵 없는 한반도로 나가야 한다는 것이 그의 말이었다.\n\n그 뒤로 세상이 바뀌었다. 미국의 핵우산은 사라졌고, 찬성 팻말을 들었던 사람이 대통령이 되어 일본과 함께 억지력을 쌓았다. 이인제는 그 억지력을 물려받았다.\n\n소신은 달라지지 않았다고 그는 참모들에게 말했다. 다만 북핵이 그대로 있는 동안 전임 정부가 쌓은 것을 제 손으로 허물 수는 없다고 했고, 북핵이 사라지는 날 함께 내려놓겠다는 단서를 발표문 끝에 달았다."
 tfrkphn.548.a:0 "북핵이 사라지는 날까지 둔다"
 tfrkphn.549.t:0 "최소한의 대응조치"
 tfrkphn.549.story:0 "2017년 1월의 출마 선언에서 이인제는 사드를 한국과 미국이 합의한 최소한의 대응이라고 불렀다. 그 최소한의 조치에 중국이 반발하고 나라 안의 여론까지 갈라지는 것을 그는 걱정했다.\n\n지금은 사정이 더 나쁘다. 전쟁에서 진 중국은 다시 군비를 늘리고 있고, 북쪽의 미사일은 그대로 남아 있다. 국방부가 방어망을 북쪽과 서쪽으로 넓히는 계획을 올리자, 이인제는 요격 포대의 수와 레이더가 놓일 자리를 하나씩 물은 뒤에 결재했다.\n\n그는 이번에도 같은 말을 골랐다. 방어망은 날아오는 것을 막을 뿐이고 이번 확장도 최소한의 대응조치라는 설명이 그날 주변국에 전달되었다."
 tfrkphn.549.a:0 "방어망을 넓힌다"
 tfrkphn.550.t:0 "국방개혁"
 tfrkphn.550.story:0 "2018년 7월 27일 정부는 국방개혁 2.0을 발표했다. 61만 8천여 명이던 상비 병력을 2022년까지 50만 명으로 줄이고, 436명이던 장군은 360명으로, 육군 병사의 복무 기간은 21개월에서 18개월로 줄인다는 계획이었다.\n\n그 계획은 전쟁을 겪지 않은 군대를 두고 짠 것이었다. 대만해협의 전쟁은 바다와 하늘에서 치러졌고 한국군은 거기서 이겼지만, 다음 임무는 북쪽의 산과 도시에 있다.\n\n국방부가 올린 2단계 계획은 승전의 교훈을 부대 편제에 옮기는 일이다. 겹치는 사령부를 합치고, 해군과 공군에 쏠렸던 전시 예산을 산악과 시가지에서 싸울 부대로 돌린다. 장군 자리가 다시 줄어든다는 소식에 군 안의 반응은 조용하지 않았다."
 tfrkphn.550.a:0 "이긴 군대부터 고친다"
 tfrkphn.551.t:0 "통일 뒤의 군대"
 tfrkphn.551.story:0 "1990년 독일은 통일을 얻으면서 값을 치렀다. 코카서스 회동에서 통일 독일은 병력을 37만 명으로 묶고 핵을 갖지 않겠다고 약속했고, 주변국의 동의는 그 약속 위에서 나왔다.\n\n이인제는 2017년 출마 선언에서 북한 체제가 본질적 변화를 피할 수 없고 통일의 결정적 기회가 가까이 오고 있다고 말했다. 그날이 왔을 때 군이 무엇을 해야 하는지는 그때도 정해져 있지 않았다.\n\n국방부의 새 계획은 그 빈칸을 채운다. 북한 지역의 안정화를 맡을 부대와 압록강, 두만강 국경을 지킬 부대를 미리 짜 두고, 주변국이 병력과 핵을 두고 무엇을 요구할지도 독일의 예를 놓고 따져 보았다. 계획서의 마지막 장에는 통일 뒤에 줄여야 할 것들의 목록이 붙었다."
 tfrkphn.551.a:0 "그날의 군대를 미리 짠다"
