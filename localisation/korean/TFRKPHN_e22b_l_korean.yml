l_korean:
 # [안내] 2022 경선 승리(korea.81, 홍준표 판) 합니다체 글. e22_81_style.py가 만든다.
 TFRKPHN_e22_81_d:0 "삼성생명에서 과장으로 일하는 김정훈은 개표 결과가 대형 화면에 뜨는 순간 자기도 모르게 주먹을 쥐었습니다. 당원 투표에서는 밀릴 것이라는 전망이 우세했지만, 홍준표는 그 전망을 뒤집고 국민의힘 대선 후보가 되었습니다.\n\n경선 내내 그는 당내 세력에 기대지 않겠다는 말을 되풀이했습니다.\n\n\"제가 당내 당대표 경선 3번, 도지사 경선, 대선 후보 경선 등 참 많이 해봤다. 그 때마다 당협위원장이나 국회의원들을 줄세우기 하지도 않았다\"\n\n상대 후보를 겨냥한 말도 있었습니다. 대통령은 경험이 있어야 한다는 것입니다.\n\n\"우리나라 대선 구도를 보면 초보자가 나와서 된 적도 없고 초보자가 나와서는 나라 경영하기가 어렵다\"\n\n김정훈은 휴대폰으로 가족 단체방에 짧게 적었습니다. 이번에는 정말 바뀔지도 모른다고."
