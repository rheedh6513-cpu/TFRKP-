 TFRKPHN_bo_category:0 "보루"
 TFRKPHN_bo_category_desc:0 "우원식 정부는 새로 짓지 않습니다. 남은 네 기둥이 무너지지 않게 붙들고 있다가 다음 정부에 넘깁니다.\n기둥은 달마다 깎이고, 넘겨받은 값보다 높이 올릴 수 없습니다. 평균이 50을 넘는 만큼 안정도가 오르고 밑돌면 내려갑니다. 기둥 하나가 §R20§! 아래로 떨어지면 달마다 안정도가 깎입니다.\n§Y정부가 끝나는 날 남은 값을 다음 정부가 그대로 넘겨받습니다.§!"
 TFRKPHN_rb_category:0 "재건"
 TFRKPHN_rb_category_desc:0 "앞 정부가 붙들고 있던 네 기둥을 넘겨받았습니다. 이제 다시 세울 차례입니다.\n기둥은 100까지 올릴 수 있습니다. 평균이 50을 넘는 만큼 안정도와 정치력 획득이 오르고 밑돌면 내려갑니다.\n네 기둥이 모두 §Y80§!에 닿으면 안정도 §G+5%§!와 정치력 §G+100§!을 얻습니다."
