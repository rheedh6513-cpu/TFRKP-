 tfrkphn.7216.t:0 "네 기둥"
 tfrkphn.7216.d:0 "임기 마지막 주에 대통령은 우원식의 집을 찾았다. 집은 작았고 대문은 열려 있었다. 경호원들은 골목 어귀에 남았다. 우원식은 물러난 뒤 한 번도 청사에 오지 않았다. 두 사람은 마당 평상에 앉아 보리차를 마셨다. 해가 기울고 있었다.\n\n우원식은 자기가 한 일을 길게 말하지 않았다. 무너지지 않게 붙들고 있었을 뿐이고 새로 지은 것은 하나도 없다고 했다. 그는 거절한 서류들을 하나씩 떠올렸지만 입 밖에 내지는 않았다. 국회와 법원, 언론과 군을 넘겨줄 때 모두 금이 가 있었다는 것도 그는 알고 있었다.\n\n대통령은 수첩을 꺼내 지난 몇 해 동안 고친 것들을 읽어 주었다. 국회가 다시 예산을 심의하게 된 일과 법원이 정부에 불리한 판결을 낸 일이 적혀 있었다. 대통령은 고치지 못한 것들도 빼지 않고 읽었다. 우원식은 끝까지 듣고 고개를 끄덕였다.\n\n[Root.TFRKPHN_rb_end_loc]"
 tfrkphn.7216.a:0 "수첩을 덮는다."
 TFRKPHN_rb_end_0:0 "네 기둥은 이제 넘겨받을 때보다 높이 서 있었다. 우원식은 대문 앞까지 따라 나와 대통령의 차가 골목을 빠져나갈 때까지 서 있었다. 다음 대통령은 금이 간 기둥을 넘겨받지 않는다."
 TFRKPHN_rb_end_1:0 "기둥 가운데 몇은 다시 섰고 몇은 아직 금이 간 채였다. 우원식은 남은 일을 다음 사람에게 적어 주라고 말했다. 대통령은 수첩의 빈 쪽에 고치지 못한 것들을 옮겨 적었다."
 TFRKPHN_rb_end_2:0 "수첩에 적힌 것은 많지 않았고, 기둥들은 넘겨받을 때와 비슷한 높이로 서 있었다. 우원식은 버티는 일도 누군가는 해야 한다고 말했다. 대통령은 대답하지 않고 남은 보리차를 마저 마셨다."
